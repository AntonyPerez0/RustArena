# A Cargo workspace: several packages built, tested and versioned together.
# They share one Cargo.lock and one target/ folder. This file has no [package]
# of its own (a "virtual manifest"); the packages live in the member folders.
[workspace]
resolver = "3"
members = ["semver-lite", "semver-cli"]

# Settings that members inherit with `edition.workspace = true` and so on,
# so they are written once instead of in every package.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-name/rustarena-pro"
rust-version = "1.85"

# Dependency versions chosen once for the whole workspace. Members use them
# with `thiserror.workspace = true`.
[workspace.dependencies]
# A path dependency on another member. The `version` is what the dependency
# becomes if the depending crate is ever published to crates.io.
semver-lite = { path = "semver-lite", version = "0.1.0" }
thiserror = "2"
