[package]
name = "semver-lite"
version = "0.1.0"
description = "Parse, compare and match semantic versions: a small crate built for the RustArena Pro Track"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["semver", "version", "parser"]
categories = ["parser-implementations", "development-tools"]

[features]
# Off by default: users who don't need serde don't compile it.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json = "1"

# docs.rs builds the documentation with every feature, so serde support shows up.
[package.metadata.docs.rs]
all-features = true
