# orderd configuration. Every key is optional: missing keys keep their defaults, and
# environment variables (ORDERD_SERVICE_NAME, ORDERD_PAYMENT_MAX_ATTEMPTS, ...) override
# what's written here. Point ORDERD_CONFIG at this file to use it:
#   ORDERD_CONFIG=config/orderd.toml cargo run

service_name = "orderd"
log_format = "text"        # "text" for people, "json" for log collectors
max_order_cents = 100000   # orders above 1000.00 are rejected

[payment]
max_attempts = 3           # 1 to 10
backoff_ms = 100           # wait backoff_ms * attempt between attempts; at most 10000
