[package]
name = "taskr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A to-do list for the terminal"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
