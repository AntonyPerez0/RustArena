[package]
name = "inventory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Runtime-checked queries (sqlx::query, query_as) plus embedded migrations (sqlx::migrate!).
# The "sqlite" feature compiles SQLite itself into the program, so nothing else needs installing.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
