[package]
name = "hotspots"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

# `cargo bench` looks for benches/hotspots.rs. criterion brings its own main(), so the
# standard test harness is switched off.
[[bench]]
name = "hotspots"
harness = false

# A release build that keeps debug symbols, so profilers can show function names and
# source lines:  cargo build --profile profiling --example workload
[profile.profiling]
inherits = "release"
debug = true
