topic: performance
drills:
  - type: predict
    after: performance-3
    body: |
      let v: Vec<i32> = Vec::with_capacity(10);
      println!("{} {}", v.len(), v.capacity());
    why: with_capacity reserves room for 10 elements but adds none, so the length is still 0.
  - type: predict
    after: performance-3
    body: |
      let mut s = String::with_capacity(32);
      s.push_str("hello");
      s.clear();
      println!("{} {}", s.len(), s.capacity());
    why: clear removes the contents but keeps the buffer, which is why reusing one String in a loop avoids new allocations.
  - type: predict
    after: performance-4
    body: |
      let mut checked = 0;
      let found = [3, 8, 12, 5, 20].iter().any(|&x| {
          checked += 1;
          x > 10
      });
      println!("{found} {checked}");
    why: any stops at the first item that matches. 12 is the third item, so 5 and 20 are never looked at.
  - type: predict
    after: performance-1
    body: |
      use std::collections::HashSet;
      let mut seen = HashSet::new();
      let repeats = [4, 7, 4, 9, 7, 4].iter().filter(|&&x| !seen.insert(x)).count();
      println!("{repeats}");
    why: insert returns false when the value is already in the set, so every repeated value is counted. 4 appears twice more and 7 once more, giving 3.
  - type: predict
    after: performance-5
    body: |
      use std::borrow::Cow;
      let good = String::from_utf8_lossy(b"crab");
      let bad = String::from_utf8_lossy(b"cr\xffb");
      println!("{} {}", matches!(good, Cow::Borrowed(_)), matches!(bad, Cow::Borrowed(_)));
    why: from_utf8_lossy borrows the bytes when they're already valid UTF-8 and only allocates (Owned) when it has to replace an invalid byte.
  - type: predict
    after: performance-4
    body: |
      let scores = [40, 95, 12, 95];
      let best = scores.iter().enumerate().max_by_key(|&(_, s)| s);
      println!("{:?}", best);
    why: max_by_key makes one pass and returns the last of equal maximums, so the 95 at index 3 wins over the one at index 1.
  - type: fill
    after: performance-3
    prompt: Allocate the buffer once, with room for 64 bytes.
    body: |
      let mut out = String::[[with_capacity]](64);
      out.push_str("ready");
      println!("{} {}", out, out.capacity() >= 64);
    why: String::with_capacity allocates the whole buffer up front, so pushes that fit don't reallocate.
  - type: fill
    after: performance-2
    prompt: Take a borrowed string slice so callers never have to clone.
    pre: |
      fn shout(s: &[[str]]) -> String {
          s.to_uppercase()
      }
    body: |
      let owned = String::from("crab");
      println!("{} {}", shout("hi"), shout(&owned));
      println!("{owned}");
    why: A &str parameter accepts string literals and borrowed Strings (through deref), so the caller keeps owned without cloning it.
  - type: fill
    after: performance-5
    prompt: Return the input without allocating when nothing changes.
    pre: |
      use std::borrow::Cow;

      fn no_tabs(s: &str) -> Cow<'_, str> {
          if s.contains('\t') {
              Cow::Owned(s.replace('\t', "    "))
          } else {
              Cow::[[Borrowed]](s)
          }
      }
    body: |
      println!("[{}] [{}]", no_tabs("a\tb"), no_tabs("plain"));
    why: Cow::Borrowed wraps the original &str, so the common no-tabs case costs nothing; only text with tabs gets a new String.
  - type: bug
    after: performance-3
    body: |
      let mut v: Vec<u32> = Vec::with_capacity(3);
      for i in 0..3 {
          v[i as usize] = i * i; // BUG
      }
      println!("{:?}", v);
    fix: 'v.push(i * i);'
    prompt: This should print `[0, 1, 4]`. Click the line with the bug.
    why: with_capacity reserves memory but the Vec is still empty, so indexing panics. push adds the elements.
  - type: bug
    after: performance-3
    body: |
      let names = ["ana", "bo"];
      let mut s = String::with_capacity(16);
      for n in names {
          s.push_str(n);
      }
      println!("{}", s.capacity()); // BUG
    fix: 'println!("{}", s.len());'
    prompt: This should print how many bytes were written, 5. Click the line with the bug.
    why: capacity is the reserved room (16 here); len is how many bytes are actually in the String.
  - type: bug
    after: performance-5
    pre: |
      use std::borrow::Cow;

      fn trim_dots(s: &str) -> Cow<'_, str> {
          if s.ends_with('.') {
              Cow::Owned(s.trim_end_matches('.').to_string())
          } else {
              Cow::Owned(s.to_string()) // BUG
          }
      }
    body: |
      let r = trim_dots("done");
      println!("{} {}", r, matches!(r, Cow::Borrowed(_)));
    fix: 'Cow::Borrowed(s)'
    prompt: Unchanged text should come back without allocating, so this should print `done true`. Click the line with the bug.
    why: The unchanged case copied the text into a new String, which is the allocation Cow exists to avoid. Cow::Borrowed(s) returns the input as is.
  - type: compiles
    after: performance-2
    answer: yes
    pre: |
      fn count_words(s: &str) -> usize {
          s.split_whitespace().count()
      }
    body: |
      let text = String::from("borrow do not clone");
      println!("{} {}", count_words(&text), count_words("literal works too"));
    why: A &String coerces to &str automatically, so one &str parameter serves both owned strings and literals.
  - type: compiles
    after: performance-2
    answer: no
    pre: |
      fn count_words(s: String) -> usize {
          s.split_whitespace().count()
      }
    body: |
      println!("{}", count_words("a literal"));
    why: A String parameter needs an owned String, and a literal is a &str (E0308). Callers would have to allocate with .to_string() just to call it, which is why read-only parameters should be &str.
  - type: compiles
    after: performance-5
    answer: no
    pre: |
      use std::borrow::Cow;

      fn label(n: u32) -> Cow<'static, str> {
          let s = format!("item {n}");
          Cow::Borrowed(&s)
      }
    body: |
      println!("{}", label(3));
    why: s is a local String dropped at the end of the function, so it can't be borrowed in the return value. Text built inside must be returned as Cow::Owned(s).
  - type: choice
    after: performance-1
    prompt: A report takes 40 seconds on real data. Which change is most likely to make the biggest difference?
    choices: ["Replacing a Vec::contains lookup inside a loop with a HashSet", "Adding #[inline] to small functions", "Switching from i64 to i32 for the counters"]
    answer: 1
    why: Turning an O(n * m) scan into O(1) lookups changes how the work grows with the input. Micro-tweaks like inlining or smaller integers rarely change more than a few percent, and the compiler often does them already.
  - type: choice
    after: performance-6
    prompt: Why do benchmarks wrap inputs in std::hint::black_box?
    choices: ["It stops the optimizer from precomputing or deleting the work being measured", "It runs the benchmark in a separate thread", "It turns off optimizations so timings are fair"]
    answer: 1
    why: Optimized builds can see that a result is unused or that an input is a constant and skip the work entirely. black_box hides the value from the optimizer while keeping the release-build speed you want to measure.
  - type: boss
    after: performance-1
    prompt: |
      Write `dedup_keep_order`, which removes repeated values but keeps the **first** occurrence of each, in the original order: `[3, 1, 3, 2, 1]` becomes `[3, 1, 2]`. It must handle 100,000 distinct values within the time limit, so don't check `out.contains(...)` for every item; track what you've seen in a `HashSet`.
    seed: |
      fn dedup_keep_order(items: &[u32]) -> Vec<u32> {
          let mut out = Vec::new();
          for &x in items {
              if !out.contains(&x) {
                  out.push(x);
              }
          }
          out
      }
    solution: |
      use std::collections::HashSet;

      fn dedup_keep_order(items: &[u32]) -> Vec<u32> {
          let mut seen = HashSet::with_capacity(items.len());
          let mut out = Vec::new();
          for &x in items {
              if seen.insert(x) {
                  out.push(x);
              }
          }
          out
      }
    harness: |
      #[test]
      fn keeps_first_occurrences_in_order() {
          assert_eq!(dedup_keep_order(&[3, 1, 3, 2, 1]), vec![3, 1, 2], "dedup_keep_order(&[3, 1, 3, 2, 1])");
      }

      #[test]
      fn no_repeats_stays_the_same() {
          assert_eq!(dedup_keep_order(&[5, 6, 7]), vec![5, 6, 7], "dedup_keep_order(&[5, 6, 7])");
      }

      #[test]
      fn empty_stays_empty() {
          assert_eq!(dedup_keep_order(&[]), Vec::<u32>::new(), "dedup_keep_order(&[])");
      }

      #[test]
      fn handles_100_000_distinct_values_quickly() {
          let items: Vec<u32> = (0..100_000).rev().collect();
          let out = dedup_keep_order(&items);
          assert_eq!(out.len(), 100_000, "all values are distinct");
          assert_eq!(out[0], 99_999, "order is kept");
      }
    hints:
      - "A `HashSet` answers \"have I seen this?\" in O(1)."
      - "`seen.insert(x)` returns `true` the first time, so `if seen.insert(x) { out.push(x); }`."
    why: The HashSet makes each check O(1), so the whole function is O(n) instead of O(n squared), while the Vec keeps the original order.
