  - type: compiles
    answer: no
    pre: |
      use std::sync::Mutex;
      use std::thread;
    body: |
      let state = Mutex::new(0);
      let a = thread::spawn(move || *state.lock().unwrap() += 1);
      let b = thread::spawn(move || *state.lock().unwrap() += 1);
      a.join().unwrap();
      b.join().unwrap();
    why: The first move closure takes ownership of state, so the second can't use it. Share it with Arc and give each thread an Arc::clone.

