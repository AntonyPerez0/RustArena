  - type: predict
    pre: |
      fn class(status: u16) -> &'static str {
          match status {
              200..=299 => "success",
              400..=499 => "client error",
              500..=599 => "server error",
              _ => "other",
          }
      }
    body: |
      println!("{} {} {}", class(204), class(422), class(503));
    why: The first digit tells the class. 2xx is success, 4xx the client's mistake (422 is a rule violation), 5xx the server's fault.

  - type: predict
    pre: |
      use std::sync::Mutex;
      use std::thread;
    body: |
      let hits = Mutex::new(0);
      thread::scope(|s| {
          for _ in 0..4 {
              s.spawn(|| {
                  for _ in 0..10 {
                      *hits.lock().unwrap() += 1;
                  }
              });
          }
      });
      println!("{}", hits.into_inner().unwrap());
    why: Each of the 4 threads adds 10 while holding the lock, so no update is lost, and the result is always 40.

