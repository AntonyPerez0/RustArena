  - type: compiles
    answer: yes
    pre: |
      struct Response {
          status: u16,
          body: String,
      }

      trait IntoResponse {
          fn into_response(self) -> Response;
      }

      impl IntoResponse for (u16, &'static str) {
          fn into_response(self) -> Response {
              Response { status: self.0, body: self.1.to_string() }
          }
      }
    body: |
      let r = (404, "not found").into_response();
      println!("{} {}", r.status, r.body);
    why: A trait can be implemented for a tuple type like (u16, &'static str). That's how axum lets handlers return (StatusCode, body).

  - type: choice
    prompt: A POST body is valid JSON with all fields, but the email has no @. Which status code fits best?
    choices: ["200 OK", "404 Not Found", "422 Unprocessable Content", "500 Internal Server Error"]
    answer: 3
    why: The request is well-formed but breaks a rule, which is 422 (some APIs use 400). It's not the server's fault, so not 500.

  - type: choice
    prompt: "GET /items exists, and a client sends DELETE /items. What should the server answer?"
    choices: ["404 Not Found", "405 Method Not Allowed", "400 Bad Request", "204 No Content"]
    answer: 2
    why: The path exists but not with that method, so the answer is 405. A 404 would wrongly suggest the path doesn't exist at all.

  - type: choice
    prompt: In an axum handler, why must the Json<T> extractor be the last parameter?
    choices: ["Rust requires generic parameters to come last", "It reads (consumes) the request body, which can only be read once", "axum sorts parameters alphabetically", "Json is slower than the other extractors"]
    answer: 2
    why: Extractors like State and Path only look at parts of the request; Json takes the body itself, so it must come after every other extractor.

