  - type: fill
    prompt: Match on the path segments with slice patterns.
    pre: |
      #[derive(Clone, Copy)]
      enum Method {
          Get,
          Post,
      }
    body: |
      let method = Method::Get;
      let segments = vec!["orders", "7"];
      let status = match (method, segments.[[as_slice()]]) {
          (Method::Get, ["orders", _]) => 200,
          (Method::Post, ["orders"]) => 201,
          _ => 404,
      };
      println!("{status}");
    why: Slice patterns like ["orders", _] match a slice, so the Vec is turned into one with as_slice().

  - type: fill
    prompt: Give each thread its own handle to the shared state.
    pre: |
      use std::sync::{Arc, Mutex};
      use std::thread;
    body: |
      let state = Arc::new(Mutex::new(Vec::new()));
      let handle = {
          let state = Arc::[[clone]](&state);
          thread::spawn(move || state.lock().unwrap().push("hello"))
      };
      handle.join().unwrap();
      println!("{:?}", state.lock().unwrap());
    why: Arc::clone makes another pointer to the same data (bumping a reference count), which the thread can own.

  - type: fill
    prompt: Parse the request body into the request type.
    pre: |
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct NewUser {
          name: String,
      }
    body: |
      let body = r#"{"name": "Ana"}"#;
      let status = match serde_json::[[from_str]]::<NewUser>(body) {
          Ok(u) => format!("201 created {}", u.name),
          Err(_) => String::from("400 bad request"),
      };
      println!("{status}");
    why: serde_json::from_str parses JSON text into any type that implements Deserialize; a failure becomes a 400.

  - type: bug
    pre: |
      use std::collections::BTreeMap;

      fn get_item(items: &BTreeMap<u32, &str>, id: u32) -> (u16, String) {
          match items.get(&id) {
              Some(name) => (200, name.to_string()),
              None => (200, String::from("not found")), // BUG
          }
      }
    body: |
      let items = BTreeMap::from([(1, "mug")]);
      let (status, body) = get_item(&items, 9);
      println!("{status} {body}");
    fix: 'None => (404, String::from("not found")),'
    prompt: "A missing item must answer `404 not found`. Click the line with the bug."
    why: Clients, proxies and monitoring read the status code first. An error answered with 200 looks like success to all of them.

