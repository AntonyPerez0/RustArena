    body: |
      let path = "/users/42/";
      let segments: Vec<&str> = path.split('/').filter(|s| !s.is_empty()).collect();
      match segments.as_slice() {
          ["users"] => println!("list"),
          ["users", id] => println!("user {id}"),
          _ => println!("not found"),
      }
    why: Filtering out empty pieces drops the leading and trailing slash, leaving ["users", "42"], which matches the two-segment pattern.

