    solution: |
      use serde::Deserialize;
      use serde_json::json;
      use std::collections::BTreeMap;
      use std::sync::Mutex;

      #[derive(Debug, PartialEq)]
      struct Response {
          status: u16,
          body: String,
      }

      struct Poll {
          counts: Mutex<BTreeMap<String, u32>>,
      }

      impl Poll {
          fn new(options: &[&str]) -> Self {
              Poll { counts: Mutex::new(options.iter().map(|o| (o.to_string(), 0)).collect()) }
          }
      }

      #[derive(Deserialize)]
      struct Vote {
          option: String,
      }

      fn vote(poll: &Poll, body: &str) -> Response {
          let Ok(v) = serde_json::from_str::<Vote>(body) else {
              return Response { status: 400, body: json!({ "error": "invalid JSON" }).to_string() };
          };
          let mut counts = poll.counts.lock().unwrap();
          match counts.get_mut(&v.option) {
              Some(n) => {
                  *n += 1;
                  Response { status: 200, body: json!(*counts).to_string() }
              }
              None => Response { status: 422, body: json!({ "error": format!("unknown option {:?}", v.option) }).to_string() },
          }
      }
    harness: |
      #[test]
      fn counts_a_vote() {
          let p = Poll::new(&["rust", "zig"]);
          assert_eq!(vote(&p, r#"{"option": "rust"}"#), Response { status: 200, body: String::from(r#"{"rust":1,"zig":0}"#) }, "vote rust");
      }

      #[test]
      fn unknown_options_are_422() {
          let p = Poll::new(&["rust"]);
          assert_eq!(vote(&p, r#"{"option": "go"}"#), Response { status: 422, body: String::from(r#"{"error":"unknown option \"go\""}"#) }, "vote go");
      }

      #[test]
      fn bad_json_is_400() {
          assert_eq!(vote(&Poll::new(&["rust"]), "rust").status, 400, "vote with a plain-text body");
      }

      #[test]
      fn concurrent_votes_are_all_counted() {
          let p = Poll::new(&["rust", "zig"]);
          std::thread::scope(|s| {
              for _ in 0..8 {
                  s.spawn(|| {
                      for _ in 0..25 {
                          vote(&p, r#"{"option": "rust"}"#);
                      }
                  });
              }
          });
          assert_eq!(vote(&p, r#"{"option": "zig"}"#).body, r#"{"rust":200,"zig":1}"#, "after 200 concurrent votes");
      }
    hints:
      - "Parse the body into a small `#[derive(Deserialize)] struct Vote { option: String }` before locking."
      - "Under one lock, `counts.get_mut(&v.option)` gives `Some(&mut u32)` for known options; increment it."
      - "`json!(*counts)` turns the whole BTreeMap into a JSON object."
    why: A handler parses first, then does its check-and-update under a single lock, so concurrent requests never lose a vote.
