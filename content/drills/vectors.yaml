topic: vectors
drills:
  - type: predict
    body: |
      let mut v = vec![1, 2, 3];
      v.push(4);
      v.pop();
      v.pop();
      println!("{:?}", v);
    why: push adds 4 at the end, then each pop removes the last element (4, then 3).
  - type: predict
    body: |
      let v = vec![10, 20, 30];
      println!("{:?} {:?}", v.get(1), v.get(3));
    why: get returns Some(&element) for a valid index and None past the end. Index 3 is past the end of a 3-element vector.
  - type: predict
    body: |
      let mut v = vec![3, 1, 3, 3, 2, 1];
      v.dedup();
      println!("{:?}", v);
    why: dedup only removes consecutive repeats. The three 3s in a row become one; the other repeats aren't next to each other.
  - type: predict
    body: |
      let mut v = vec!['a', 'b', 'c', 'd'];
      v.remove(1);
      v.insert(0, 'z');
      println!("{:?}", v);
    why: "remove(1) takes out 'b', giving ['a', 'c', 'd']; insert(0, 'z') puts 'z' at the front."
  - type: predict
    body: |
      let mut v = vec![5, 3, 8];
      for x in &mut v {
          *x *= 2;
      }
      println!("{:?}", v);
    why: "Looping over &mut v gives a mutable reference to each element, and *x *= 2 doubles it in place."
  - type: predict
    body: |
      let v = vec![1, 3, 5, 7];
      println!("{:?} {:?}", v.binary_search(&5), v.binary_search(&4));
    why: 5 is found at index 2. 4 isn't there; Err(2) says it would go at index 2 to keep the vector sorted.
  - type: fill
    prompt: Change every price in place.
    body: |
      let mut prices = vec![100, 250];
      for p in [[&mut]] prices {
          *p += 1;
      }
      println!("{:?}", prices);
    why: "Iterating over &mut prices gives &mut references, which you can write through with *p."
  - type: fill
    prompt: Make a vector of four zeros.
    body: |
      let row = vec![[[0; 4]]];
      println!("{:?}", row);
    why: "vec![value; n] builds a vector with n copies of value."
  - type: fill
    prompt: Remove all repeated values.
    body: |
      let mut ids = vec![4, 1, 4, 2, 1];
      ids.sort();
      ids.[[dedup]]();
      println!("{:?}", ids);
    why: After sorting, equal values are next to each other, so dedup removes every repeat.
  - type: bug
    body: |
      let v = vec![4, 8, 15];
      println!("last: {}", v[v.len()]); // BUG
    fix: 'println!("last: {}", v[v.len() - 1]);'
    prompt: "This should print `last: 15`. Click the line with the bug."
    why: Indexes start at 0, so the last valid index is len() - 1. v[v.len()] panics. (v.last() is the idiomatic way.)
  - type: bug
    body: |
      let mut ids = vec![3, 1, 3, 2, 1];
      ids.dedup(); // BUG
      println!("{:?}", ids);
    fix: ids.sort(); ids.dedup();
    prompt: "This should print the unique ids in order: `[1, 2, 3]`. Click the line with the bug."
    why: dedup only removes adjacent duplicates. Sort first so all equal values sit together.
  - type: bug
    body: |
      let mut scores = vec![70, 95, 82];
      scores.sort_by(|a, b| a.cmp(b)); // BUG
      println!("{:?}", scores);
    fix: 'scores.sort_by(|a, b| b.cmp(a));'
    prompt: "This should print the scores highest first: `[95, 82, 70]`. Click the line with the bug."
    why: a.cmp(b) sorts ascending. Swapping the arguments, b.cmp(a), sorts descending.
  - type: compiles
    answer: no
    body: |
      let v = Vec::new();
      v.push(1);
      println!("{:?}", v);
    why: push changes the vector, so v must be declared with let mut.
  - type: compiles
    answer: no
    body: |
      let mut v = vec![1, 2, 3];
      let first = &v[0];
      v.push(4);
      println!("{first}");
    why: first borrows v, and push needs a mutable borrow while first is still used. push might reallocate and leave first dangling.
  - type: compiles
    answer: yes
    body: |
      let mut v = vec![1, 2, 3];
      let first = v[0];
      v.push(4);
      println!("{first}");
    why: v[0] on a Vec<i32> copies the number, so first doesn't borrow v and push is fine.
  - type: compiles
    answer: no
    body: |
      let names = vec![String::from("Ana"), String::from("Bo")];
      let first = names[0];
      println!("{first}");
    why: A String can't be moved out of a vector by index. Borrow it with &names[0] or clone it.
  - type: choice
    prompt: Why can't you call `.sort()` on a `Vec<f64>`?
    choices: ["Floats are stored on the heap", "f64 has no total order because NaN isn't equal to anything, so it isn't Ord", "sort only works on integers and strings", "Vectors of floats can't be mutable"]
    answer: 2
    why: "sort needs Ord. NaN breaks the rules of a total order, so f64 only has PartialOrd. Use sort_by(|a, b| a.total_cmp(b))."
  - type: boss
    prompt: |
      Write `fn leaderboard(players: &[Player]) -> Vec<String>` that returns one line per player, `"name (score)"`, sorted by score from highest to lowest, with equal scores in alphabetical order by name. Don't change the input.
    seed: |
      struct Player {
          name: String,
          score: u32,
      }

      fn leaderboard(players: &[Player]) -> Vec<String> {
          todo!()
      }
    solution: |
      struct Player {
          name: String,
          score: u32,
      }

      fn leaderboard(players: &[Player]) -> Vec<String> {
          let mut sorted: Vec<&Player> = Vec::new();
          for p in players {
              sorted.push(p);
          }
          sorted.sort_by(|a, b| b.score.cmp(&a.score).then(a.name.cmp(&b.name)));
          let mut lines = Vec::new();
          for p in sorted {
              lines.push(format!("{} ({})", p.name, p.score));
          }
          lines
      }
    harness: |
      fn player(name: &str, score: u32) -> Player {
          Player { name: name.to_string(), score }
      }

      #[test]
      fn highest_score_first() {
          let ps = [player("bo", 40), player("ana", 95), player("cy", 70)];
          assert_eq!(leaderboard(&ps), vec!["ana (95)", "cy (70)", "bo (40)"], "leaderboard(bo 40, ana 95, cy 70)");
      }

      #[test]
      fn ties_sorted_by_name() {
          let ps = [player("zed", 50), player("amy", 50), player("kim", 80)];
          assert_eq!(leaderboard(&ps), vec!["kim (80)", "amy (50)", "zed (50)"], "leaderboard(zed 50, amy 50, kim 80)");
      }

      #[test]
      fn no_players() {
          assert_eq!(leaderboard(&[]), Vec::<String>::new(), "leaderboard(&[])");
      }
    hints:
      - "Collect references into a `Vec<&Player>` so you can sort without changing or cloning the input."
      - "`sorted.sort_by(|a, b| b.score.cmp(&a.score).then(a.name.cmp(&b.name)));`"
      - "Then build the lines with `format!(\"{} ({})\", p.name, p.score)`."
    why: Sorting a vector of references avoids copying the players, and .then() breaks ties so the order is fully predictable.
