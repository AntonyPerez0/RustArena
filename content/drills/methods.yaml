    why: A type can have several impl blocks. They're combined as if they were one.

  - type: compiles
    after: methods-3
    answer: no
    pre: |
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn new(width: u32, height: u32) -> Self {
              Self { width, height }
          }
      }
    body: |
      let r = Rect.new(2, 3);
      println!("{}", r.width * r.height);
    why: "Associated functions are called on the type with ::, as Rect::new(2, 3). Rect.new treats the type name as a value (E0423)."

  - type: choice
    after: methods-4
    prompt: A method needs to read a struct's fields but not change them. Which receiver should it take?
    choices: ["self", "&self", "&mut self", "mut self"]
    answer: 2
    why: "&self borrows the value for reading, so it can be called on any value, mutable or not, and the caller keeps ownership. &mut self would require a mutable variable, and self would consume the value."

  - type: choice
    after: methods-3
    prompt: What does Self mean inside impl Item { ... }?
    choices: ["The value the method was called on", "The type Item itself", "The parent module", "A copy of the current value"]
    answer: 2
    why: "Self (capital S) is the type the impl block is for, so fn new() -> Self returns an Item. self (lowercase) is the value a method was called on."

  - type: boss
    after: methods-3
    prompt: |
      Write a `ParkingLot` with:

      - `fn new(capacity: u32) -> Self`: an empty lot.
      - `fn park(&mut self) -> bool`: takes a spot if one is free; returns whether it did.
      - `fn leave(&mut self) -> bool`: frees a spot if any car is parked; returns whether it did.
      - `fn free_spots(&self) -> u32`
    seed: |
      struct ParkingLot {
          capacity: u32,
          used: u32,
      }

      impl ParkingLot {
      }
    solution: |
      struct ParkingLot {
          capacity: u32,
          used: u32,
      }

      impl ParkingLot {
          fn new(capacity: u32) -> Self {
              Self { capacity, used: 0 }
          }

          fn park(&mut self) -> bool {
              if self.used == self.capacity {
                  return false;
              }
              self.used += 1;
              true
          }

          fn leave(&mut self) -> bool {
              if self.used == 0 {
                  return false;
              }
              self.used -= 1;
              true
          }

          fn free_spots(&self) -> u32 {
              self.capacity - self.used
          }
      }
    harness: |
      #[test]
      fn a_new_lot_is_all_free() {
          assert_eq!(ParkingLot::new(3).free_spots(), 3, "ParkingLot::new(3).free_spots()");
      }

      #[test]
      fn parking_uses_a_spot() {
          let mut lot = ParkingLot::new(3);
          assert_eq!(lot.park(), true, "park() in an empty lot");
          assert_eq!(lot.free_spots(), 2, "free_spots() after one car parks");
      }

      #[test]
      fn a_full_lot_refuses_cars() {
          let mut lot = ParkingLot::new(1);
          lot.park();
          assert_eq!(lot.park(), false, "park() in a full lot");
          assert_eq!(lot.free_spots(), 0, "free_spots() of a full lot");
      }

      #[test]
      fn leaving_frees_a_spot() {
          let mut lot = ParkingLot::new(2);
          lot.park();
          assert_eq!(lot.leave(), true, "leave() with one car parked");
          assert_eq!(lot.free_spots(), 2, "free_spots() after the car leaves");
      }

      #[test]
      fn nobody_can_leave_an_empty_lot() {
          let mut lot = ParkingLot::new(2);
          assert_eq!(lot.leave(), false, "leave() on an empty lot");
          assert_eq!(lot.free_spots(), 2, "free_spots() after a refused leave");
      }
    hints:
      - "`new` takes no self and returns `Self { capacity, used: 0 }`."
      - "`park` and `leave` change the lot, so they take `&mut self`. Check the limit first and return false early."
      - "`free_spots` is `self.capacity - self.used`."
    why: Each method picks the weakest receiver it needs, and the checks in park and leave keep the invariant used <= capacity, so free_spots can never underflow.
