topic: methods
drills:
  - type: predict
    after: methods-2
    pre: |
      struct Counter {
          count: u32,
      }

      impl Counter {
          fn bump(&mut self) {
              self.count += 1;
          }
      }
    body: |
      let mut c = Counter { count: 0 };
      c.bump();
      c.bump();
      c.bump();
      println!("{}", c.count);
    why: Each call to bump borrows c mutably and adds 1 to the same count field.

  - type: predict
    after: methods-3
    pre: |
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn square(size: u32) -> Self {
              Self { width: size, height: size }
          }

          fn area(&self) -> u32 {
              self.width * self.height
          }
      }
    body: |
      println!("{}", Rect::square(3).area());
    why: Rect::square(3) builds a 3x3 Rect with the associated function, then .area() is called on that new value.

  - type: predict
    after: methods-2
    pre: |
      struct Account {
          balance: u32,
      }

      impl Account {
          fn withdraw(&mut self, amount: u32) -> bool {
              if amount > self.balance {
                  return false;
              }
              self.balance -= amount;
              true
          }
      }
    body: |
      let mut a = Account { balance: 100 };
      let ok = a.withdraw(150);
      println!("{} {}", ok, a.balance);
    why: 150 is more than the balance, so withdraw returns false before changing anything. The balance stays 100.

  - type: predict
    after: methods-4
    pre: |
      #[derive(Clone, Copy)]
      struct Point {
          x: i32,
          y: i32,
      }

      impl Point {
          fn moved(self, dx: i32) -> Point {
              Point { x: self.x + dx, y: self.y }
          }
      }
    body: |
      let p = Point { x: 1, y: 5 };
      let q = p.moved(10);
      println!("{} {}", p.x, q.x);
    why: "Point is Copy, so calling a self method copies it. p is unchanged (x = 1) and q is the moved copy (x = 11)."

  - type: predict
    after: methods-6
    pre: |
      struct Pizza {
          toppings: u32,
      }

      impl Pizza {
          fn new() -> Self {
              Self { toppings: 0 }
          }

          fn topping(mut self) -> Self {
              self.toppings += 1;
              self
          }
      }
    body: |
      let p = Pizza::new().topping().topping();
      println!("{}", p.toppings);
    why: Each topping() call takes the pizza, adds one topping and returns it, so the chain adds two.

  - type: fill
    after: methods-1
    prompt: This method only reads the rectangle. Give it the right receiver.
    pre: |
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn area([[&self‖self: &Self‖self: &Rect]]) -> u32 {
              self.width * self.height
          }
      }
    body: |
      let r = Rect { width: 4, height: 5 };
      println!("{}", r.area());
    why: A method that only reads takes &self, a shared borrow of the value it's called on.

  - type: fill
    after: methods-3
    prompt: Call the associated function that builds a Player.
    pre: |
      struct Player {
          name: String,
          level: u32,
      }

      impl Player {
          fn new(name: &str) -> Self {
              Self { name: name.to_string(), level: 1 }
          }
      }
    body: |
      let p = Player[[::]]new("Ayla");
      println!("{} {}", p.name, p.level);
    why: Associated functions have no self, so they're called on the type with ::, like String::from.

  - type: fill
    after: methods-2
    prompt: This method changes the balance. Give it the right receiver.
    pre: |
      struct Wallet {
          coins: u32,
      }

      impl Wallet {
          fn add(&mut self, n: u32) {
              self.coins += n;
          }

          fn spend_all([[&mut self‖self: &mut Self‖self: &mut Wallet]]) -> u32 {
              let spent = self.coins;
              self.coins = 0;
              spent
          }
      }
    body: |
      let mut w = Wallet { coins: 0 };
      w.add(30);
      let spent = w.spend_all();
      println!("{} {}", spent, w.coins);
    why: The method assigns to self.coins, so it needs a mutable borrow, &mut self. Plain self would consume the wallet, and w.coins couldn't be printed afterwards.

  - type: bug
    after: methods-2
    pre: |
      struct Tally {
          total: u32,
      }

      impl Tally {
          fn add(&self, n: u32) { self.total += n; } // BUG
      }
    body: |
      let mut t = Tally { total: 0 };
      t.add(4);
      t.add(6);
      println!("{}", t.total);
    fix: 'fn add(&mut self, n: u32) { self.total += n; }'
    prompt: "This should print `10`. Click the line with the bug."
    why: A method that changes a field needs &mut self. Through &self the field is behind a shared reference and can't be assigned (error E0594).

  - type: bug
    after: methods-6
    pre: |
      struct Request {
          retries: u32,
      }

      impl Request {
          fn new() -> Self {
              Self { retries: 0 }
          }

          fn retries(mut self, n: u32) -> Self {
              self.retries = n;
              Request::new() // BUG
          }
      }
    body: |
      let req = Request::new().retries(3);
      println!("{}", req.retries);
    fix: self
    prompt: "This should print `3`. Click the line with the bug."
    why: A builder method must return the value it changed. Returning Request::new() throws the update away and hands back a fresh default, so the chain loses the setting.

  - type: bug
    after: methods-3
    pre: |
      struct Account {
          balance: u32,
      }

      impl Account {
          fn new() -> Self {
              Self { balance: 0 }
          }

          fn deposit(&mut self, amount: u32) {
              self.balance += amount;
          }
      }
    body: |
      let acct = Account::new(); // BUG
      acct.deposit(25);
      println!("{}", acct.balance);
    fix: let mut acct = Account::new();
    prompt: "This should print `25`. Click the line with the bug."
    why: deposit takes &mut self, which needs a mutable variable. Without mut the call fails with E0596.

  - type: compiles
    after: methods-4
    answer: no
    pre: |
      struct Order {
          items: Vec<String>,
      }

      impl Order {
          fn into_count(self) -> usize {
              self.items.len()
          }
      }
    body: |
      let order = Order { items: vec![String::from("tea")] };
      let n = order.into_count();
      println!("{} {}", n, order.items.len());
    why: into_count takes self, so the call moves order into the method. Using order.items afterwards is a use of a moved value (E0382).

  - type: compiles
    after: methods-1
    answer: yes
    pre: |
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn area(&self) -> u32 {
              self.width * self.height
          }
      }
    body: |
      let r = Rect { width: 2, height: 3 };
      println!("{} {}", r.area(), Rect::area(&r));
    why: r.area() is shorthand for Rect::area(&r). Both forms call the same method.

  - type: compiles
    after: methods-5
    answer: yes
    pre: |
      struct Counter {
          n: u32,
      }

      impl Counter {
          fn new() -> Self {
              Self { n: 0 }
          }
      }

      impl Counter {
          fn get(&self) -> u32 {
