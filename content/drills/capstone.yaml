drills:
  - type: predict
    pre: |
      use std::str::FromStr;

      #[derive(Debug)]
      struct Celsius(f64);

      impl FromStr for Celsius {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              let number = s.strip_suffix('C').ok_or("missing unit")?;
              number.parse().map(Celsius).map_err(|_| format!("bad number {number}"))
          }
      }
    body: |
      for s in ["21.5C", "21.5", "hotC"] {
          match s.parse::<Celsius>() {
              Ok(c) => println!("{c:?}"),
              Err(e) => println!("error: {e}"),
          }
      }
    why: The first parses fine. "21.5" has no C suffix, so ok_or gives the "missing unit" error (? converts the &str into the String error type). "hot" isn't a number.
  - type: predict
    pre: |
      use std::collections::BTreeMap;
    body: |
      let log = [("/b", 30), ("/a", 10), ("/b", 50)];
      let mut slowest: BTreeMap<&str, u32> = BTreeMap::new();
      for (path, ms) in log {
          let worst = slowest.entry(path).or_insert(0);
          *worst = (*worst).max(ms);
      }
      println!("{:?}", slowest);
    why: The entry API keeps one running maximum per path, and a BTreeMap prints its keys in sorted order.
  - type: predict
    body: |
      let requests = [("a", 300), ("b", 120), ("c", 300)];
      let last = requests.iter().max_by_key(|r| r.1).unwrap().0;
      let first = requests.iter().rev().max_by_key(|r| r.1).unwrap().0;
      println!("{last} {first}");
    why: When several items share the maximum, max_by_key returns the last one. Reversing first makes it return the first one in the original order.
  - type: predict
    pre: |
      #[derive(Debug, Clone, Copy)]
      enum Light {
          Red,
          Green,
          Yellow,
      }

      fn next(light: Light, emergency: bool) -> Light {
          match (light, emergency) {
              (_, true) => Light::Red,
              (Light::Red, false) => Light::Green,
              (Light::Green, false) => Light::Yellow,
              (Light::Yellow, false) => Light::Red,
          }
      }
    body: |
      let mut light = Light::Red;
      for emergency in [false, false, true, false] {
          light = next(light, emergency);
          print!("{light:?} ");
      }
      println!();
    why: Matching on the (state, event) tuple decides each transition; the emergency arm comes first, so it wins whatever the current light is.
