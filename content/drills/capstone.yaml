  - type: compiles
    answer: yes
    pre: |
      trait Discount {
          fn off(&self, cents: u64) -> u64;
      }

      struct Flat(u64);
      struct Percent(u64);

      impl Discount for Flat {
          fn off(&self, _cents: u64) -> u64 { self.0 }
      }

      impl Discount for Percent {
          fn off(&self, cents: u64) -> u64 { cents * self.0 / 100 }
      }
    body: |
      let rules: Vec<Box<dyn Discount>> = vec![Box::new(Flat(200)), Box::new(Percent(10))];
      let total: u64 = rules.iter().map(|r| r.off(5000)).sum();
      println!("{total}");
    why: Different types implementing the same trait can live in one Vec as Box<dyn Discount>; each call is dispatched to the right impl at run time.
  - type: compiles
    answer: no
    pre: |
      enum State {
          Draft,
          Review,
          Live,
      }

      enum Event {
          Submit,
          Approve,
      }

      fn step(s: State, e: Event) -> State {
          match (s, e) {
              (State::Draft, Event::Submit) => State::Review,
              (State::Review, Event::Approve) => State::Live,
          }
      }
    body: |
      let _ = step(State::Draft, Event::Submit);
    why: The match isn't exhaustive (for example (Live, Submit) isn't covered). The compiler insists that every state and event combination is handled, which is what makes enum state machines safe.
  - type: choice
    prompt: You're writing a library crate that other teams call. Its functions can fail in four distinct ways that callers handle differently. Which error type fits best?
    choices: ["anyhow::Error", "An enum deriving thiserror::Error, one variant per failure", "String", "Panic with a clear message"]
    answer: 2
    why: Callers of a library need to match on what went wrong, so give them an enum. anyhow is for applications, where errors are mostly reported, not handled case by case.
  - type: choice
    prompt: A CI step validates a deploy config and finds several problems. What should it do?
    choices: ["Stop at the first problem and report it", "Report every problem it found, then fail the step", "Fix the problems automatically and continue", "Log a warning and continue the deploy"]
    answer: 2
    why: Reporting all problems at once saves a CI round-trip per mistake, and failing the step keeps a broken config out of production.
  - type: boss
    prompt: |
      Write `fn parse_settings(text: &str) -> Result<Settings, String>` for a small settings file with one `key = value` per line (spaces around `=` are optional). Skip blank lines and lines starting with `#`. Keys:

      - `name` (required, any text)
      - `threads` (default 4; must be a number from 1 to 64)
      - `verbose` (default false; `true` or `false`)

      Errors, with line numbers counted from 1: `line N: expected key = value`, `line N: unknown key KEY`, `line N: threads must be a number from 1 to 64`, `line N: verbose must be true or false`, and `missing name` when no name was given. Return the first error you meet.
    seed: |
      #[derive(Debug, PartialEq)]
      struct Settings {
          name: String,
          threads: u32,
          verbose: bool,
      }

      fn parse_settings(text: &str) -> Result<Settings, String> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct Settings {
          name: String,
          threads: u32,
          verbose: bool,
      }

      fn parse_settings(text: &str) -> Result<Settings, String> {
          let mut name = None;
          let mut threads = 4;
          let mut verbose = false;
          for (i, line) in text.lines().enumerate() {
              let n = i + 1;
              let line = line.trim();
              if line.is_empty() || line.starts_with('#') {
                  continue;
              }
              let (key, value) = line.split_once('=').ok_or_else(|| format!("line {n}: expected key = value"))?;
              let value = value.trim();
              match key.trim() {
                  "name" => name = Some(value.to_string()),
                  "threads" => {
                      threads = value
                          .parse()
                          .ok()
                          .filter(|t| (1..=64).contains(t))
                          .ok_or_else(|| format!("line {n}: threads must be a number from 1 to 64"))?;
                  }
                  "verbose" => {
                      verbose = value.parse().map_err(|_| format!("line {n}: verbose must be true or false"))?;
                  }
                  other => return Err(format!("line {n}: unknown key {other}")),
              }
          }
          let name = name.ok_or("missing name")?;
          Ok(Settings { name, threads, verbose })
      }
    harness: |
      #[test]
      fn reads_all_keys() {
          let s = parse_settings("name = crawler\nthreads=8\nverbose = true\n").unwrap();
          assert_eq!((s.name.as_str(), s.threads, s.verbose), ("crawler", 8, true), "parsed settings");
      }

      #[test]
      fn uses_defaults_and_skips_comments() {
          let s = parse_settings("# worker config\n\nname = indexer\n");
          assert_eq!(s, Ok(Settings { name: "indexer".to_string(), threads: 4, verbose: false }), "settings with defaults");
      }

      #[test]
      fn reports_bad_lines_with_numbers() {
          assert_eq!(parse_settings("name = a\nthreads: 3\n"), Err("line 2: expected key = value".to_string()), "a line without =");
          assert_eq!(parse_settings("name = a\n\ncolour = red\n"), Err("line 3: unknown key colour".to_string()), "an unknown key");
      }

      #[test]
      fn validates_values() {
          assert_eq!(parse_settings("threads = 0\nname = a\n"), Err("line 1: threads must be a number from 1 to 64".to_string()), "threads = 0");
          assert_eq!(parse_settings("name = a\nthreads = many\n"), Err("line 2: threads must be a number from 1 to 64".to_string()), "threads = many");
          assert_eq!(parse_settings("name = a\nverbose = yes\n"), Err("line 2: verbose must be true or false".to_string()), "verbose = yes");
      }

      #[test]
      fn requires_a_name() {
          assert_eq!(parse_settings("threads = 2\n"), Err("missing name".to_string()), "no name");
      }
    hints:
      - "Keep `name: Option<String>`, `threads` and `verbose` with their defaults, and loop over `text.lines().enumerate()` (line number `i + 1`), skipping blank and `#` lines."
      - "`line.split_once('=')` gives the key and value (trim both); `.ok_or_else(|| format!(...))?` turns a missing `=` into the error."
      - "`match key.trim()` with one arm per key and `other => return Err(format!(\"line {n}: unknown key {other}\"))`. At the end, `name.ok_or(\"missing name\")?`."
    why: Parsing settings combines everything in this phase on a small scale, line numbers, defaults, validation and precise error messages, so users can fix their file without guessing.
