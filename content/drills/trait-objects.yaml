  - type: compiles
    after: trait-objects-5
    answer: no
    pre: |
      trait Shape {
          fn area(&self) -> f64;
          fn doubled(&self) -> Self;
      }

      struct Sq(f64);

      impl Shape for Sq {
          fn area(&self) -> f64 {
              self.0 * self.0
          }
          fn doubled(&self) -> Self {
              Sq(self.0 * 2.0)
          }
      }
    body: |
      let v: Vec<Box<dyn Shape>> = vec![Box::new(Sq(1.0))];
      println!("{}", v[0].area());
    why: A method returning Self makes the trait not dyn compatible (E0038), because the size of Self is unknown behind dyn.

  - type: compiles
    after: trait-objects-5
    answer: yes
    pre: |
      trait Shape {
          fn area(&self) -> f64;
          fn doubled(&self) -> Self
          where
              Self: Sized;
      }

      struct Sq(f64);

      impl Shape for Sq {
          fn area(&self) -> f64 {
              self.0 * self.0
          }
          fn doubled(&self) -> Self {
              Sq(self.0 * 2.0)
          }
      }
    body: |
      let v: Vec<Box<dyn Shape>> = vec![Box::new(Sq(1.0).doubled())];
      println!("{}", v[0].area());
    why: "where Self: Sized takes doubled out of the vtable. The trait is dyn compatible, and doubled still works on the concrete Sq."

  - type: compiles
    after: trait-objects-1
    answer: no
    pre: |
      trait Shape {
          fn area(&self) -> f64;
      }

      struct Circle {
          r: f64,
      }

      impl Circle {
          fn radius(&self) -> f64 {
              self.r
          }
      }

      impl Shape for Circle {
          fn area(&self) -> f64 {
              3.0 * self.r * self.r
          }
      }
    body: |
      let s: Box<dyn Shape> = Box::new(Circle { r: 1.0 });
      println!("{}", s.radius());
    why: Through a dyn Shape you can only call the trait's methods. radius belongs to Circle, which the trait object has forgotten (E0599).

  - type: choice
    after: trait-objects-6
    prompt: "Your CLI has a fixed set of commands (add, list, remove) that only your team changes. How should you model them?"
    choices:
      - "An enum with one variant per command"
      - "A trait with one struct per command, stored as Box<dyn Command>"
      - "A HashMap<String, String> of command names"
    answer: 1
    why: "A closed set you own fits an enum: no boxes, and the compiler's exhaustiveness check finds every match to update when a command is added. Trait objects pay off when others must add cases without editing your code."

  - type: boss
    after: trait-objects-4
    prompt: |
      Build a tiny drawing canvas.

      - Trait `Shape` with `fn name(&self) -> String`, `fn area(&self) -> f64` and `fn scale(&mut self, k: f64)` (multiplies the sizes by `k`).
      - `Circle { r }` (name `circle`, area `3.0 * r * r`) and `Rect { w, h }` (name `rect`, area `w * h`).
      - `struct Canvas { shapes: Vec<Box<dyn Shape>> }` with `fn add(&mut self, s: impl Shape + 'static)`, `fn scale_all(&mut self, k: f64)` and `fn largest(&self) -> Option<String>` (the name of the shape with the largest area, the first one on a tie).
    seed: |
      struct Circle {
          r: f64,
      }

      struct Rect {
          w: f64,
          h: f64,
      }

      // trait Shape ...

      // struct Canvas ...
    solution: |
      struct Circle {
          r: f64,
      }

      struct Rect {
          w: f64,
          h: f64,
      }

      trait Shape {
          fn name(&self) -> String;
          fn area(&self) -> f64;
          fn scale(&mut self, k: f64);
      }

      impl Shape for Circle {
          fn name(&self) -> String {
              String::from("circle")
          }
          fn area(&self) -> f64 {
              3.0 * self.r * self.r
          }
          fn scale(&mut self, k: f64) {
              self.r *= k;
          }
      }

      impl Shape for Rect {
          fn name(&self) -> String {
              String::from("rect")
          }
          fn area(&self) -> f64 {
              self.w * self.h
          }
          fn scale(&mut self, k: f64) {
              self.w *= k;
              self.h *= k;
          }
      }

      struct Canvas {
          shapes: Vec<Box<dyn Shape>>,
      }

      impl Canvas {
          fn add(&mut self, s: impl Shape + 'static) {
              self.shapes.push(Box::new(s));
          }

          fn scale_all(&mut self, k: f64) {
              for s in &mut self.shapes {
                  s.scale(k);
              }
          }

          fn largest(&self) -> Option<String> {
              let mut best: Option<&dyn Shape> = None;
              for s in &self.shapes {
                  match best {
                      Some(b) if b.area() >= s.area() => {}
                      _ => best = Some(s.as_ref()),
                  }
              }
              best.map(|b| b.name())
          }
      }
    harness: |
      fn canvas() -> Canvas {
          let mut c = Canvas { shapes: Vec::new() };
          c.add(Rect { w: 2.0, h: 3.0 });
          c.add(Circle { r: 1.0 });
          c
      }

      #[test]
      fn finds_the_largest_shape() {
          assert_eq!(canvas().largest(), Some(String::from("rect")), "rect 2x3 (6) vs circle r=1 (3)");
      }

      #[test]
      fn scaling_changes_areas() {
          let mut c = canvas();
          c.scale_all(2.0);
          assert_eq!(c.shapes[0].area(), 24.0, "rect area after scaling by 2");
          assert_eq!(c.shapes[1].area(), 12.0, "circle area after scaling by 2");
      }

      #[test]
      fn a_tie_keeps_the_first() {
          let mut c = Canvas { shapes: Vec::new() };
          c.add(Circle { r: 2.0 });
          c.add(Rect { w: 3.0, h: 4.0 });
          assert_eq!(c.largest(), Some(String::from("circle")), "two shapes with area 12");
      }

      #[test]
      fn an_empty_canvas_has_no_largest() {
          let c = Canvas { shapes: Vec::new() };
          assert_eq!(c.largest(), None, "largest() of an empty canvas");
      }
    hints:
      - "`scale` takes `&mut self`: `self.r *= k;` for circles, both sides for rects."
      - "`scale_all` loops `for s in &mut self.shapes { s.scale(k); }`."
      - "`largest` keeps an `Option<&dyn Shape>` (use `s.as_ref()`), then returns `best.map(|b| b.name())`."
    why: A Vec<Box<dyn Trait>> in a struct, with both &self and &mut self methods called through the vtable, is the core of every plugin or scene system.
