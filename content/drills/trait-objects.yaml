topic: trait-objects
drills:
  - type: predict
    after: trait-objects-1
    pre: |
      trait Animal {
          fn sound(&self) -> String;
      }

      struct Crab;
      struct Cat;

      impl Animal for Crab {
          fn sound(&self) -> String {
              String::from("click")
          }
      }

      impl Animal for Cat {
          fn sound(&self) -> String {
              String::from("meow")
          }
      }
    body: |
      let zoo: Vec<Box<dyn Animal>> = vec![Box::new(Cat), Box::new(Crab), Box::new(Cat)];
      for a in &zoo {
          print!("{} ", a.sound());
      }
      println!();
    why: Each box holds a different type, and each call runs that type's sound method, chosen at run time.

  - type: predict
    after: trait-objects-3
    body: |
      use std::mem::size_of;
      println!("{} {}", size_of::<&u8>(), size_of::<&dyn std::fmt::Display>());
    why: "A &dyn Trait is a fat pointer: the address of the data plus the address of its vtable, so 16 bytes instead of 8 on a 64-bit machine."

  - type: predict
    after: trait-objects-4
    pre: |
      trait Plugin {
          fn handle(&mut self);
          fn report(&self) -> u32;
      }

      struct Counter {
          n: u32,
      }

      impl Plugin for Counter {
          fn handle(&mut self) {
              self.n += 1;
          }
          fn report(&self) -> u32 {
              self.n
          }
      }
    body: |
      let mut plugins: Vec<Box<dyn Plugin>> = vec![Box::new(Counter { n: 0 }), Box::new(Counter { n: 10 })];
      for _ in 0..3 {
          for p in &mut plugins {
              p.handle();
          }
      }
      println!("{} {}", plugins[0].report(), plugins[1].report());
    why: Trait objects can have &mut self methods. Each counter keeps its own state and is incremented three times.

  - type: predict
    after: trait-objects-7
    body: |
      use std::any::Any;
      let v: Box<dyn Any> = Box::new(3u8);
      println!("{:?} {:?}", v.downcast_ref::<u8>(), v.downcast_ref::<i32>());
    why: downcast_ref::<T>() returns Some only if the value really is a T. The value is a u8, so asking for an i32 gives None.

  - type: predict
    after: trait-objects-1
    pre: |
      trait Greeter {
          fn name(&self) -> String;
          fn greet(&self) -> String {
              format!("Hello, {}", self.name())
          }
      }

      struct En;
      struct Pt;

      impl Greeter for En {
          fn name(&self) -> String {
              String::from("Ana")
          }
      }

      impl Greeter for Pt {
          fn name(&self) -> String {
              String::from("Bo")
          }
          fn greet(&self) -> String {
              format!("Olá, {}", self.name())
          }
      }
    body: |
      let gs: Vec<Box<dyn Greeter>> = vec![Box::new(En), Box::new(Pt)];
      println!("{} / {}", gs[0].greet(), gs[1].greet());
    why: Default and overridden methods both go through the vtable, so each value uses its own type's version.

  - type: fill
