  - type: fill
    after: trait-objects-2
    prompt: Return a different shape type depending on the input.
    pre: |
      trait Shape {
          fn name(&self) -> String;
      }

      struct Circle;
      struct Square;

      impl Shape for Circle {
          fn name(&self) -> String {
              String::from("circle")
          }
      }

      impl Shape for Square {
          fn name(&self) -> String {
              String::from("square")
          }
      }

      fn make(round: bool) -> [[Box<dyn Shape>]] {
          if round { Box::new(Circle) } else { Box::new(Square) }
      }
    body: |
      println!("{} {}", make(true).name(), make(false).name());
    why: impl Shape can only stand for one concrete type. A Box<dyn Shape> can hold either, chosen at run time.

  - type: fill
    after: trait-objects-5
    prompt: Keep the trait dyn compatible while still offering a constructor.
    pre: |
      trait Store {
          fn new() -> Self
          where
              Self: [[Sized]];
          fn count(&self) -> usize;
      }

      struct Mem(Vec<u32>);

      impl Store for Mem {
          fn new() -> Self {
              Mem(vec![1, 2, 3])
          }
          fn count(&self) -> usize {
              self.0.len()
          }
      }
    body: |
      let s: Box<dyn Store> = Box::new(Mem::new());
      println!("{}", s.count());
    why: "where Self: Sized removes new from the vtable: it can still be called on concrete types like Mem, and the trait can be used as dyn Store."

  - type: bug
    after: trait-objects-2
    pre: |
      trait Shape {
          fn area(&self) -> f64;
      }

      struct Sq(f64);

      impl Shape for Sq {
          fn area(&self) -> f64 {
              self.0 * self.0
          }
      }

      fn report(s: &dyn Shape) -> String {
          format!("area {}", s.area())
      }
    body: |
      let b: Box<dyn Shape> = Box::new(Sq(3.0));
      println!("{}", report(&b)); // BUG
    fix: 'println!("{}", report(b.as_ref()));'
    prompt: "This should print `area 9`. Click the line with the bug."
    why: "&b is a &Box<dyn Shape>, and Rust tries to use the Box itself as the Shape. b.as_ref() (or &*b) passes the shape inside the box."

  - type: bug
    after: trait-objects-4
    pre: |
      trait Notifier {
          fn send(&self, msg: &str) -> String;
      }

      struct Email;

      impl Notifier for Email {
          fn send(&self, msg: &str) -> String {
              format!("email: {msg}")
          }
      }

      struct Hub {
          list: Vec<Box<dyn Notifier>>,
      }

      impl Hub {
          fn add(&mut self, n: impl Notifier) { // BUG
              self.list.push(Box::new(n));
          }
      }
    body: |
      let mut hub = Hub { list: Vec::new() };
      hub.add(Email);
      println!("{}", hub.list[0].send("hi"));
    fix: "fn add(&mut self, n: impl Notifier + 'static) {"
    prompt: "This should print `email: hi`. Click the line with the bug."
    why: "A Box<dyn Notifier> field means Box<dyn Notifier + 'static>, so the value put in it must not hold short-lived references (E0310)."

  - type: bug
    after: trait-objects-4
    pre: |
      trait Plugin {
          fn handle(&mut self, e: &str);
          fn seen(&self) -> usize;
      }

      struct Log(Vec<String>);

      impl Plugin for Log {
          fn handle(&mut self, e: &str) {
              self.0.push(e.to_string());
          }
          fn seen(&self) -> usize {
              self.0.len()
          }
      }
    body: |
      let mut plugins: Vec<Box<dyn Plugin>> = vec![Box::new(Log(Vec::new()))];
      for p in &plugins { // BUG
          p.handle("start");
      }
      println!("{}", plugins[0].seen());
    fix: "for p in &mut plugins {"
    prompt: "This should print `1`. Click the line with the bug."
    why: handle takes &mut self, so the loop must borrow the boxes mutably with &mut plugins.

