topic: threads
drills:
  - type: predict
    pre: |
      use std::thread;
    body: |
      let handle = thread::spawn(|| 6 * 7);
      let answer = handle.join().unwrap();
      println!("{answer}");
    why: The thread's closure returns 6 * 7, and join() waits for the thread and hands that value back inside Ok.

  - type: predict
    pre: |
      use std::thread;
    body: |
      let mut count = 10;
      let handle = thread::spawn(move || {
          count += 5;
          count
      });
      println!("{} {}", handle.join().unwrap(), count);
    why: An integer is Copy, so move gives the thread its own copy. The thread changes its copy to 15; main's count is still 10.

  - type: predict
    pre: |
      use std::thread;
      use std::time::Duration;
    body: |
      let mut handles = Vec::new();
      for (name, ms) in [("a", 20), ("b", 1), ("c", 10)] {
          handles.push(thread::spawn(move || {
              thread::sleep(Duration::from_millis(ms));
              name
          }));
      }
      let order: Vec<&str> = handles.into_iter().map(|h| h.join().unwrap()).collect();
      println!("{order:?}");
    why: "\"b\" finishes first, but the results are collected by joining the handles in spawn order, so they come out as a, b, c."

  - type: predict
    pre: |
      use std::thread;
    body: |
      let v = vec![1, 2, 3, 4, 5, 6];
      let sums: Vec<i32> = thread::scope(|s| {
          let handles: Vec<_> = v.chunks(4).map(|c| s.spawn(move || c.iter().sum::<i32>())).collect();
          handles.into_iter().map(|h| h.join().unwrap()).collect()
      });
      println!("{:?} {}", sums, v.len());
    why: chunks(4) makes [1, 2, 3, 4] and [5, 6], summed to 10 and 11. Scoped threads only borrowed v, so main can still use it.

  - type: predict
    pre: |
      use std::thread;
    body: |
      let handle = thread::spawn(|| {
          let empty: Vec<i32> = Vec::new();
          empty[0]
      });
      let failed = handle.join().is_err();
      println!("worker failed: {failed}");
    why: Indexing an empty Vec panics, but only the worker thread dies. join() returns Err, and main keeps running.

  - type: fill
    prompt: Make the thread take ownership of `city`.
    pre: |
      use std::thread;
    body: |
      let city = String::from("Lisbon");
      let handle = thread::spawn([[move]] || city.len());
      println!("{}", handle.join().unwrap());
    why: A spawned thread may outlive the function, so it can't borrow city. move moves the String into the closure.

  - type: fill
    prompt: Start scoped threads that may borrow `data`.
    pre: |
      use std::thread;
    body: |
      let data = vec![3, 4, 5];
      let total = thread::[[scope]](|s| {
          let h = s.spawn(|| data.iter().sum::<i32>());
          h.join().unwrap()
      });
      println!("{total} from {} items", data.len());
    why: thread::scope joins every thread before it returns, so its threads may borrow local data like data.

  - type: fill
    prompt: Wait for each worker and take its result.
    pre: |
      use std::thread;
    body: |
      let handles: Vec<_> = (1..=3).map(|n| thread::spawn(move || n * 100)).collect();
      let total: i32 = handles.into_iter().map(|h| h.[[join]]().unwrap()).sum();
      println!("{total}");
    why: join() blocks until the thread finishes and returns its value as Ok(value).

  - type: bug
    pre: |
      use std::thread;
    body: |
      let data = vec![4, 8, 15];
      let workers = 4;
      let size = data.len() / workers; // BUG
      let total: i32 = thread::scope(|s| {
          let handles: Vec<_> = data.chunks(size).map(|c| s.spawn(move || c.iter().sum::<i32>())).collect();
          handles.into_iter().map(|h| h.join().unwrap()).sum()
      });
      println!("{total}");
    fix: "let size = data.len().div_ceil(workers).max(1);"
    prompt: "This should print the sum, 27, using up to 4 threads. Click the line with the bug."
    why: 3 / 4 is 0 in integer division, and chunks(0) panics. Round up with div_ceil and keep the size at least 1.

  - type: bug
    pre: |
      use std::thread;
    body: |
      let words = vec!["crab", "arena", "rust"];
      let handle = thread::spawn(|| words.len()); // BUG
      println!("{}", handle.join().unwrap());
    fix: "let handle = thread::spawn(move || words.len());"
    why: thread::spawn needs a 'static closure, so borrowing words fails with E0373. move gives the thread ownership of the Vec.

  - type: bug
    pre: |
      use std::rc::Rc;
      use std::sync::Arc;
      use std::thread;
    body: |
      let names = Rc::new(vec!["ana", "bo"]); // BUG
      let for_thread = names.clone();
      let handle = thread::spawn(move || for_thread.len());
      println!("{} {}", handle.join().unwrap(), names.len());
    fix: "let names = Arc::new(vec![\"ana\", \"bo\"]);"
    why: Rc isn't Send because its reference count isn't updated atomically. Arc is the thread-safe version with the same API.

  - type: compiles
    answer: no
    pre: |
      use std::cell::RefCell;
      use std::thread;
    body: |
      let hits = RefCell::new(0);
      thread::scope(|s| {
          s.spawn(|| *hits.borrow_mut() += 1);
      });
      println!("{}", hits.borrow());
    why: RefCell isn't Sync, its borrow tracking isn't thread-safe, so a &RefCell can't be shared with another thread (E0277).

  - type: compiles
    answer: yes
    pre: |
      use std::thread;
    body: |
      let scores = vec![70, 85, 90];
      thread::scope(|s| {
          let a = s.spawn(|| scores.iter().max().copied());
          let b = s.spawn(|| scores.iter().min().copied());
          println!("{:?} {:?}", a.join().unwrap(), b.join().unwrap());
      });
    why: Any number of threads may share a & borrow of the Vec, and scoped threads are allowed to borrow local data.

  - type: compiles
    answer: no
    pre: |
      use std::thread;
    body: |
      let v = vec![1, 2, 3];
      let handle = thread::spawn(move || v.len());
      println!("{:?} {}", v, handle.join().unwrap());
    why: move moved the Vec into the thread's closure, so main can't use v afterwards (E0382). Clone it first if both need it.

  - type: compiles
    answer: no
    pre: |
      use std::thread;
    body: |
      let mut total = 0;
      thread::scope(|s| {
          s.spawn(|| total += 1);
          s.spawn(|| total += 2);
      });
      println!("{total}");
    why: Two threads would each hold a &mut to total at the same time, a data race. Rust rejects it with E0499.

  - type: choice
    prompt: What does `thread::scope` guarantee that makes borrowing local data safe?
    choices: ["Its threads run one after another", "Every thread spawned in the scope is joined before thread::scope returns", "Its threads copy the data they use", "Its threads can never panic"]
    answer: 2
    why: Because all scoped threads have finished when the scope returns, they can't outlive the data they borrow. They still run in parallel and can still panic.

  - type: choice
    prompt: You need to apply the same CPU-heavy function to 2 million items and use every core. What's the most idiomatic choice?
    choices: ["One thread::spawn per item", "rayon's par_iter()", "async with Tokio", "A single thread and a for loop"]
    answer: 2
    why: rayon splits the work over a pool of about one thread per core. A thread per item would drown in overhead, and async is built for waiting on I/O, not for CPU work.

  - type: boss
    prompt: |
      Write `fn parallel_max(data: &[i64], workers: usize) -> Option<i64>`: split `data` into chunks of `data.len().div_ceil(workers).max(1)` items, find each chunk's maximum in its own scoped thread, and return the overall maximum (`None` for an empty slice). Assume `workers` is at least 1.
    seed: |
      use std::thread;

      fn parallel_max(data: &[i64], workers: usize) -> Option<i64> {
          todo!()
      }
    solution: |
      use std::thread;

      fn parallel_max(data: &[i64], workers: usize) -> Option<i64> {
          let size = data.len().div_ceil(workers).max(1);
          thread::scope(|s| {
              let handles: Vec<_> = data.chunks(size).map(|chunk| s.spawn(|| chunk.iter().max().copied())).collect();
              handles.into_iter().filter_map(|h| h.join().unwrap()).max()
          })
      }
    require:
      - pattern: 'thread::scope'
        message: Use `thread::scope` so the threads can borrow the slice.
    harness: |
      #[test]
      fn finds_the_maximum_with_three_workers() {
          assert_eq!(parallel_max(&[3, 9, -2, 7, 11, 4, 0], 3), Some(11), "parallel_max([3, 9, -2, 7, 11, 4, 0], 3)");
      }

      #[test]
      fn all_negative_numbers() {
          assert_eq!(parallel_max(&[-8, -3, -12], 2), Some(-3), "parallel_max([-8, -3, -12], 2)");
      }

      #[test]
      fn empty_slice_has_no_maximum() {
          assert_eq!(parallel_max(&[], 4), None, "parallel_max([], 4)");
      }

      #[test]
      fn more_workers_than_items() {
          assert_eq!(parallel_max(&[5], 8), Some(5), "parallel_max([5], 8)");
      }

      #[test]
      fn large_input() {
          let data: Vec<i64> = (0..100_000).map(|n| (n * 7919) % 100_003).collect();
          assert_eq!(parallel_max(&data, 4), data.iter().max().copied(), "parallel_max on 100,000 numbers");
      }
    hints:
      - "Each thread returns `chunk.iter().max().copied()`, an `Option<i64>`."
      - "Collect the handles into a `Vec` first, then `handles.into_iter().filter_map(|h| h.join().unwrap()).max()`."
    why: Scoped threads borrow the chunks, each returns its chunk's Option<i64>, and filter_map plus max combine them.
