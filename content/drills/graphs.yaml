  - type: predict
    pre: |
      use std::collections::VecDeque;
    body: |
      let adj = vec![vec![1, 2], vec![3], vec![3], vec![4], vec![]];
      let mut dist = vec![None; 5];
      dist[0] = Some(0);
      let mut q = VecDeque::from([0]);
      while let Some(u) = q.pop_front() {
          for &v in &adj[u] {
              if dist[v].is_none() {
                  dist[v] = Some(dist[u].unwrap() + 1);
                  q.push_back(v);
              }
          }
      }
      println!("{:?}", dist);
    why: BFS reaches nodes layer by layer, so each distance is the fewest edges from node 0. Node 3 is two hops away whichever way you go.
  - type: predict
    body: |
      let adj = vec![vec![1, 2], vec![3], vec![], vec![]];
      let mut seen = vec![false; 4];
      let mut stack = vec![0];
      let mut order = Vec::new();
      while let Some(u) = stack.pop() {
          if seen[u] { continue; }
          seen[u] = true;
          order.push(u);
          for &v in &adj[u] {
              stack.push(v);
          }
      }
      println!("{:?}", order);
    why: The stack pops the most recently pushed neighbor first, so without reversing, 2 is visited before 1 (and 1's child 3 comes last).
  - type: predict
    pre: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;
    body: |
      let next = vec![vec![], vec![0], vec![0], vec![]];
      let mut indegree = vec![2, 0, 0, 0];
      let mut ready: BinaryHeap<Reverse<usize>> = (0..4).filter(|&t| indegree[t] == 0).map(Reverse).collect();
      let mut order = Vec::new();
      while let Some(Reverse(t)) = ready.pop() {
          order.push(t);
          for &u in &next[t] {
              indegree[u] -= 1;
              if indegree[u] == 0 {
                  ready.push(Reverse(u));
              }
          }
      }
      println!("{:?}", order);
    why: Tasks 1, 2 and 3 are ready at the start, and the min-heap always takes the smallest. Task 0 becomes ready only after both 1 and 2, but 0 is smaller than 3, so it goes next.
  - type: predict
    pre: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;
    body: |
      let adj: Vec<Vec<(usize, u64)>> = vec![vec![(1, 7), (2, 2)], vec![], vec![(1, 3)]];
      let mut dist = vec![u64::MAX; 3];
      let mut heap = BinaryHeap::from([Reverse((0u64, 0usize))]);
      dist[0] = 0;
      while let Some(Reverse((d, u))) = heap.pop() {
          if d > dist[u] { continue; }
          for &(v, w) in &adj[u] {
              if d + w < dist[v] {
                  dist[v] = d + w;
                  heap.push(Reverse((d + w, v)));
              }
          }
      }
      println!("{:?}", dist);
    why: Node 1 costs 7 directly but 2 + 3 = 5 through node 2, and Dijkstra keeps the cheaper total.
  - type: predict
    pre: |
      struct Node {
          value: i32,
          left: Option<Box<Node>>,
          right: Option<Box<Node>>,
      }

      fn insert(slot: &mut Option<Box<Node>>, value: i32) {
          match slot {
              None => *slot = Some(Box::new(Node { value, left: None, right: None })),
              Some(n) => if value < n.value { insert(&mut n.left, value) } else { insert(&mut n.right, value) },
          }
      }

      fn height(slot: &Option<Box<Node>>) -> usize {
          match slot {
              None => 0,
              Some(n) => 1 + height(&n.left).max(height(&n.right)),
          }
      }
    body: |
      let mut root = None;
      for v in [4, 2, 6, 1, 3, 7] {
          insert(&mut root, v);
      }
      println!("{}", height(&root));
    why: 4 is the root, 2 and 6 are its children, and 1, 3 and 7 hang one level lower, so the longest root-to-leaf path has 3 nodes.
  - type: fill
    prompt: Add the neighbor to the BFS queue with its distance.
    pre: |
      use std::collections::VecDeque;
    body: |
      let adj = vec![vec![1], vec![2], vec![]];
      let mut seen = vec![true, false, false];
      let mut queue = VecDeque::from([(0, 0)]);
      let mut last = 0;
      while let Some((u, d)) = queue.pop_front() {
          last = d;
          for &v in &adj[u] {
              if !seen[v] {
                  seen[v] = true;
                  queue.[[push_back]]((v, d + 1));
              }
          }
      }
      println!("{last}");
    why: BFS takes from the front and adds to the back of the VecDeque, which keeps the nodes in order of distance.
