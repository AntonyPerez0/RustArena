  - type: boss
    prompt: |
      A tournament organizer has `n` players (`0..n`) and a list of rivalries. Rivals must play on **different** teams, and there are exactly two teams. Write `fn can_split_rivals(n: usize, rivalries: &[(usize, usize)]) -> bool`.

      This asks whether the graph is **bipartite**. Color the players with BFS: give an uncolored player team 0, then every rival of a team-0 player must be team 1, and so on. If you ever find two rivals with the same team, it's impossible. Start a BFS from every player who isn't colored yet (the graph can have several separate parts).
    seed: |
      use std::collections::VecDeque;

      fn can_split_rivals(n: usize, rivalries: &[(usize, usize)]) -> bool {
          todo!()
      }
    solution: |
      use std::collections::VecDeque;

      fn can_split_rivals(n: usize, rivalries: &[(usize, usize)]) -> bool {
          let mut adj: Vec<Vec<usize>> = vec![Vec::new(); n];
          for &(a, b) in rivalries {
              adj[a].push(b);
              adj[b].push(a);
          }
          let mut team: Vec<Option<u8>> = vec![None; n];
          for start in 0..n {
              if team[start].is_some() {
                  continue;
              }
              team[start] = Some(0);
              let mut queue = VecDeque::from([start]);
              while let Some(u) = queue.pop_front() {
                  let mine = team[u].unwrap_or(0);
                  for &v in &adj[u] {
                      match team[v] {
                          None => {
                              team[v] = Some(1 - mine);
                              queue.push_back(v);
                          }
                          Some(t) if t == mine => return false,
                          Some(_) => {}
                      }
                  }
              }
          }
          true
      }
    harness: |
      #[test]
      fn splits_a_chain_of_rivals() {
          assert_eq!(can_split_rivals(4, &[(0, 1), (1, 2), (2, 3)]), true, "can_split_rivals(4, chain)");
      }

      #[test]
      fn a_triangle_cannot_be_split() {
          assert_eq!(can_split_rivals(3, &[(0, 1), (1, 2), (2, 0)]), false, "can_split_rivals(3, triangle)");
      }

      #[test]
      fn checks_every_separate_group() {
          assert_eq!(can_split_rivals(6, &[(0, 1), (2, 3), (3, 4), (4, 2)]), false, "can_split_rivals(6, pair and triangle)");
          assert_eq!(can_split_rivals(5, &[(0, 1), (3, 4)]), true, "can_split_rivals(5, two pairs)");
      }

      #[test]
      fn no_rivalries_is_easy() {
          assert_eq!(can_split_rivals(3, &[]), true, "can_split_rivals(3, [])");
      }
    hints:
      - "Build undirected adjacency lists and a `Vec<Option<u8>>` of teams, all `None`."
      - "For each uncolored player, set team 0 and BFS: every uncolored rival gets the other team (`1 - mine`) and joins the queue."
      - "If a rival already has the same team as the current player, return `false`. If every BFS finishes, return `true`."
    why: Two-coloring with BFS succeeds exactly when there's no cycle of odd length among the rivalries.
