  - type: fill
    prompt: Serve the queue in the order people joined.
    pre: |
      use std::collections::VecDeque;
    body: |
      let mut q = VecDeque::from(["ana", "ben", "cy"]);
      while let Some(name) = q.[[pop_front]]() {
