  - type: fill
    prompt: Make the heap give back the smallest deadline first.
    pre: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;
    body: |
      let mut heap = BinaryHeap::new();
      for d in [14, 3, 9] {
          heap.push([[Reverse(d)]]);
