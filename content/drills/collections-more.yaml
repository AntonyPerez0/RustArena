  - type: predict
    body: |
      let mut stack = vec![1, 2, 3];
      stack.push(4);
      stack.pop();
      stack.pop();
      println!("{:?} {:?}", stack.last(), stack.len());
    why: Two pops remove 4 and then 3, leaving [1, 2]. The top (last) is 2 and two items remain.
  - type: predict
    pre: |
      use std::collections::VecDeque;
    body: |
      let mut q = VecDeque::new();
      q.push_back("b");
      q.push_back("c");
      q.push_front("a");
      q.pop_back();
      println!("{:?}", q);
    why: push_front puts "a" before "b", and pop_back removes "c" from the other end, leaving ["a", "b"].
  - type: predict
    pre: |
      use std::collections::BinaryHeap;
    body: |
      let mut heap = BinaryHeap::from(vec![4, 9, 1, 7]);
      heap.pop();
      println!("{:?}", heap.pop());
    why: BinaryHeap is a max-heap. The first pop removes 9, the second returns the next largest, 7.
  - type: predict
    pre: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;
    body: |
      let mut heap = BinaryHeap::new();
      for x in [5, 2, 8] {
          heap.push(Reverse(x));
      }
      let Reverse(first) = heap.pop().unwrap();
      println!("{first}");
    why: Reverse flips the ordering, so the heap pops the smallest value first.
  - type: predict
    pre: |
      use std::collections::BTreeMap;
    body: |
      let m = BTreeMap::from([(10, "a"), (20, "b"), (30, "c")]);
      println!("{:?}", m.range(..=25).next_back());
      println!("{:?}", m.range(25..).next());
    why: range(..=25).next_back() is the largest key at or below 25 (20); range(25..).next() is the smallest key at or above 25 (30).
