    why: Wrapping each value in Reverse turns the max-heap into a min-heap; .0 unwraps the value again.
  - type: fill
    prompt: Find the price that was in effect at time 250 (the last change at or before it).
    pre: |
      use std::collections::BTreeMap;
    body: |
      let prices = BTreeMap::from([(100, 999), (200, 1099), (300, 899)]);
      let (_, p) = prices.range(..=250).[[next_back]]().unwrap();
      println!("{p}");
    why: next_back takes the last entry of the range, which is the largest key not above 250.
  - type: bug
    pre: |
      use std::collections::VecDeque;
    body: |
      let mut tickets = VecDeque::new();
      tickets.push_back(101);
      tickets.push_back(102);
      tickets.push_back(103);
      let next = tickets.pop_back(); // BUG
      println!("{:?}", next);
    fix: "let next = tickets.pop_front();"
    prompt: "The first ticket in line should be served: this should print `Some(101)`. Click the line with the bug."
    why: Pushing at the back and popping at the back makes a stack. A queue pops from the other end, the front.
  - type: bug
    pre: |
      use std::collections::BTreeMap;
    body: |
      let readings = BTreeMap::from([(900, 12), (1000, 15), (1100, 19)]);
      let latest = readings.range(..=1030).next(); // BUG
      println!("{:?}", latest);
    fix: "let latest = readings.range(..=1030).next_back();"
    prompt: "This should print the latest reading at or before 1030, `Some((1000, 15))`. Click the line with the bug."
    why: next() returns the first (smallest) key of the range. The latest reading before a time is the last one, next_back().
  - type: compiles
    answer: no
    pre: |
      use std::collections::BinaryHeap;
    body: |
      let mut heap = BinaryHeap::new();
      heap.push(19.5);
      heap.push(21.0);
      println!("{:?}", heap.pop());
    why: BinaryHeap needs its items to implement Ord, and floats only implement PartialOrd (NaN can't be compared).
  - type: compiles
    answer: yes
    pre: |
      use std::collections::VecDeque;
    body: |
      let q = VecDeque::from([10, 20, 30]);
      println!("{}", q[1]);
    why: VecDeque supports indexing in O(1), just like Vec.
  - type: compiles
    answer: no
    pre: |
      use std::collections::LinkedList;
    body: |
      let list = LinkedList::from([10, 20, 30]);
      println!("{}", list[1]);
    why: LinkedList has no indexing because reaching the i-th node means walking the list. Use list.iter().nth(1), or better, a VecDeque.
  - type: compiles
    answer: yes
    pre: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;
    body: |
      let mut jobs = BinaryHeap::new();
      jobs.push((3, Reverse(1), "backup"));
      jobs.push((3, Reverse(2), "report"));
      println!("{:?}", jobs.pop());
    why: Tuples of ordered types are ordered field by field, and Reverse of an ordered type is ordered too, so the tuple works as a heap item.
  - type: choice
    prompt: A support desk must always handle the most urgent open ticket next, while new tickets keep arriving. Which collection fits best?
    choices: ["VecDeque", "BinaryHeap", "BTreeSet of ticket ids", "LinkedList"]
    answer: 2
    why: A BinaryHeap gives the highest-priority item in O(log n) per push and pop. A VecDeque serves by arrival order, not urgency.
  - type: choice
    prompt: What does calling v.remove(0) on a Vec of n items cost, and why?
    choices: ["O(1), because it only touches the first item", "O(log n), because a Vec is a tree", "O(n), because every other item shifts one place left"]
    answer: 3
    why: A Vec keeps its items side by side, so removing the first one moves all the others. VecDeque::pop_front is O(1).
