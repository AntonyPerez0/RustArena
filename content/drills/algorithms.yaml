topic: algorithms
drills:
  - type: predict
    body: |
      let v = [10, 20, 30, 40];
      println!("{:?} {:?}", v.binary_search(&30), v.binary_search(&35));
    why: 30 is found at index 2, so Ok(2). 35 is missing; Err(3) says it would be inserted at index 3 to keep the slice sorted.
  - type: predict
    body: |
      let ages = [12, 15, 18, 18, 21, 30];
      let adults = ages.len() - ages.partition_point(|&a| a < 18);
      println!("{adults}");
    why: partition_point returns 2, the first index where a < 18 is false. The 4 items from there on are 18 or older.
  - type: predict
    body: |
      let mut v = vec![("b", 2), ("a", 1), ("c", 2), ("d", 1)];
      v.sort_by_key(|&(_, n)| n);
      let names: Vec<&str> = v.iter().map(|&(s, _)| s).collect();
      println!("{:?}", names);
    why: sort_by_key is stable, so items with equal keys keep their original order ("a" before "d", "b" before "c").
  - type: predict
    body: |
      let mut words = vec!["pear", "fig", "apple", "kiwi"];
      words.sort_by(|a, b| a.len().cmp(&b.len()).then(a.cmp(b)));
      println!("{:?}", words);
    why: Shorter words come first; then (only for equal lengths) alphabetical order decides, so "kiwi" comes before "pear".
  - type: predict
    body: |
      let temps = [3, 5, 4, 8, 6];
      let rises = temps.windows(2).filter(|w| w[1] > w[0]).count();
      println!("{rises}");
    why: windows(2) yields neighboring pairs [3,5], [5,4], [4,8], [8,6]; two of them go up.
  - type: predict
    body: |
      let v = [2, 4, 6, 8];
      let mut prefix = vec![0];
      for x in v {
          prefix.push(prefix[prefix.len() - 1] + x);
      }
      println!("{:?} {}", prefix, prefix[3] - prefix[1]);
    why: prefix[i] is the sum of the first i values. prefix[3] - prefix[1] is v[1] + v[2] = 4 + 6 = 10.
  - type: fill
    prompt: Finish the half-open binary search that finds the first value that is at least 7.
    body: |
      let v = [1, 3, 5, 7, 9, 11];
      let (mut lo, mut hi) = (0, v.len());
      while lo < hi {
          let mid = lo + (hi - lo) / 2;
          if v[mid] < 7 { lo = mid + 1; } else { [[hi = mid]]; }
      }
      println!("{lo}");
    why: In a half-open range lo..hi, a middle that might be the answer stays inside by setting hi = mid (not mid - 1).
  - type: fill
    prompt: Sort the scores from highest to lowest.
    pre: |
      use std::cmp::Reverse;
    body: |
      let mut scores = vec![40, 95, 12, 77];
      scores.sort_by_key(|&s| [[Reverse(s)]]);
      println!("{:?}", scores);
    why: Reverse flips the ordering of its key, so sorting ascending by Reverse(s) sorts descending by s.
  - type: fill
    prompt: Sort the floats (they don't implement Ord).
    body: |
      let mut v: Vec<f64> = vec![2.5, -1.0, 0.5];
      v.sort_by(|a, b| a.[[total_cmp]](b));
      println!("{:?}", v);
    why: f64::total_cmp gives a complete ordering for floats, which is what sort_by needs.
  - type: bug
    body: |
      let v = [2, 4, 6, 8, 10];
      let target = 4;
      let (mut lo, mut hi) = (0, v.len());
      let mut found = None;
      while lo < hi {
          let mid = lo + (hi - lo) / 2;
          if v[mid] == target { found = Some(mid); break; }
          if v[mid] < target { lo = mid + 1; } else { hi = mid - 1; } // BUG
      }
      println!("{:?}", found);
    fix: "if v[mid] < target { lo = mid + 1; } else { hi = mid; }"
    why: With a half-open range, hi is already excluded. hi = mid - 1 also throws away index mid - 1, which can be the answer (here it skips index 1).
  - type: bug
    body: |
      let costs = [4, 2, 1, 7, 1, 1, 3, 2];
      let budget = 7;
      let (mut left, mut sum, mut best) = (0, 0, 0);
      for right in 0..costs.len() {
          sum += costs[right];
          while sum > budget {
              sum -= costs[left];
              left += 1;
          }
          best = best.max(right - left); // BUG
      }
      println!("{best}");
    fix: "best = best.max(right + 1 - left);"
    prompt: "This should print 4, the length of the longest run within budget. Click the line with the bug."
    why: The window left..=right includes both ends, so it holds right + 1 - left items.
  - type: compiles
    answer: no
    body: |
      let mut prices = vec![4.99, 1.50, 2.25];
      prices.sort();
      println!("{:?}", prices);
    why: sort needs Ord, and floats only implement PartialOrd. Use sort_by(|a, b| a.total_cmp(b)).
  - type: compiles
    answer: no
    pre: |
      struct Item {
          name: String,
          stock: u32,
      }
    body: |
      let mut items = vec![Item { name: String::from("bolt"), stock: 3 }];
      items.sort_by_key(|i| i.name);
      println!("{}", items[0].stock);
    why: The key closure would move the String out of a borrowed item. Use sort_by(|a, b| a.name.cmp(&b.name)).
  - type: compiles
    answer: yes
    body: |
      let mut v = vec![10, 20, 30];
      let pos = v.binary_search(&25).unwrap_or_else(|insert_at| insert_at);
      v.insert(pos, 25);
      println!("{:?}", v);
    why: binary_search returns Result<usize, usize>; both variants hold a usize, so unwrap_or_else(|e| e) gives the insert position either way.
  - type: choice
    prompt: About how many comparisons does binary search need, at most, to search 1,000,000 sorted items?
    choices: ["1,000,000", "1,000", "20", "1"]
    answer: 3
    why: Each comparison halves the remaining range, and 2 to the power 20 is just over a million, so about 20 steps.
  - type: choice
    prompt: What's the difference between sort and sort_unstable?
    choices: ["sort keeps equal items in their original order; sort_unstable may reorder them but is usually faster", "sort_unstable can crash on some inputs", "sort is O(n²) and sort_unstable is O(n log n)"]
    answer: 1
    why: Both are O(n log n) and safe. Only stability differs, which matters when you sort by one key after another or care about ties.
  - type: boss
    prompt: |
      The calendar app shows busy blocks. Write `fn merge_meetings(slots: Vec<(u32, u32)>) -> Vec<(u32, u32)>` that merges overlapping or touching meetings (`(start, end)`, start < end) and returns the busy blocks sorted by start. For example `[(9, 10), (13, 15), (9, 12), (12, 13), (16, 17)]` becomes `[(9, 15), (16, 17)]`.

      Sort by start, then walk the meetings once, extending the last block when the next meeting starts at or before its end.
    seed: |
      fn merge_meetings(slots: Vec<(u32, u32)>) -> Vec<(u32, u32)> {
          todo!()
      }
    solution: |
      fn merge_meetings(mut slots: Vec<(u32, u32)>) -> Vec<(u32, u32)> {
          slots.sort_unstable();
          let mut busy: Vec<(u32, u32)> = Vec::new();
          for (start, end) in slots {
              match busy.last_mut() {
                  Some(last) if start <= last.1 => last.1 = last.1.max(end),
                  _ => busy.push((start, end)),
              }
          }
          busy
      }
    harness: |
      #[test]
      fn merges_overlapping_and_touching_meetings() {
          assert_eq!(merge_meetings(vec![(9, 10), (13, 15), (9, 12), (12, 13), (16, 17)]), vec![(9, 15), (16, 17)], "merge_meetings([(9, 10), (13, 15), (9, 12), (12, 13), (16, 17)])");
      }

      #[test]
      fn keeps_separate_meetings_apart() {
          assert_eq!(merge_meetings(vec![(14, 15), (8, 9)]), vec![(8, 9), (14, 15)], "merge_meetings([(14, 15), (8, 9)])");
      }

      #[test]
      fn a_long_meeting_swallows_short_ones() {
          assert_eq!(merge_meetings(vec![(8, 18), (9, 10), (12, 13)]), vec![(8, 18)], "merge_meetings([(8, 18), (9, 10), (12, 13)])");
      }

      #[test]
      fn no_meetings_means_no_busy_blocks() {
          assert_eq!(merge_meetings(vec![]), vec![], "merge_meetings([])");
      }
    hints:
      - Sort the meetings first; tuples sort by start, then by end.
      - "Keep a result Vec. For each meeting, if it starts at or before the last block's end, extend that block's end to the larger of the two ends; otherwise push a new block."
      - "`match busy.last_mut() { Some(last) if start <= last.1 => last.1 = last.1.max(end), _ => busy.push((start, end)) }`"
    why: After sorting by start, overlapping meetings sit next to each other, so one pass merges them in O(n log n) total.
