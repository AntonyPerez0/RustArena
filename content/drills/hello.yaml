topic: hello
drills:
  - type: predict
    body: |
      println!("Hello, Ferris!");
    why: println! prints the text between the quotes exactly, then ends the line.
  - type: predict
    body: |
      print!("one ");
      print!("two ");
      println!("three");
    why: print! doesn't end the line, so all three pieces land on one line.
  - type: predict
    body: |
      println!("{} + {} = {}", 4, 5, 4 + 5);
    why: Each {} is filled with the next value after the format string, in order.
  - type: predict
    body: |
      println!("a\nb");
    why: "\\n inside a string is a newline, so the text is printed on two lines."
  - type: predict
    body: |
      println!("{{}} {}", 7);
    why: "{{ and }} print literal braces; only the single {} is a placeholder."
  - type: predict
    body: |
      println!("{}", 7 / 2);
    why: Dividing two whole numbers gives a whole number; the .5 is dropped.
  - type: fill
    prompt: Print a line of text.
    body: |
      [[println!]]("ready");
    why: Printing a line is done with the println! macro, with its exclamation mark.
  - type: fill
    prompt: Add the placeholder for the value.
    body: |
      println!("score: [[{}]]", 42);
    why: A {} in the format string marks where the value goes.
  - type: fill
    prompt: Print the quote marks around the word.
    body: |
      println!("say [[\"]]hi\"");
    why: Inside a string, \" is a double quote character that doesn't end the string.
  - type: bug
    body: |
      println!("Name: {}", "Ferris");
      println!("Legs: {}"); // BUG
    fix: 'println!("Legs: {}", 10);'
    prompt: "This should print the name and then `Legs: 10`. Click the line with the bug."
    why: Every {} needs a value after the format string; Rust refuses to compile otherwise.
  - type: bug
    body: |
      print!("Loading");
      print!("...done"); // BUG
      println!("Next task");
    fix: 'println!("...done");'
    why: print! doesn't end the line, so "Next task" would be glued onto the same line.
  - type: compiles
    answer: no
    body: |
      println("hi");
    why: "println is a macro, so it must be called with an exclamation mark: println!."
  - type: compiles
    answer: no
    body: |
      println!("{} and {}", 1);
    why: The format string has two placeholders but only one value. Rust checks this at compile time.
  - type: compiles
    answer: yes
    body: |
      // println!("this line is switched off");
      println!("on");
    why: The first line is a comment, which the compiler ignores.
  - type: choice
    prompt: Which command checks that your code compiles without building a program (the fastest feedback)?
    choices: ["cargo run", "cargo check", "cargo build --release", "cargo fmt"]
    answer: 2
    why: cargo check only type-checks the code. cargo run builds and runs, --release builds an optimized program, and cargo fmt formats code.
  - type: choice
    prompt: Where does a new Cargo project keep its code?
    choices: ["main.rs in the project folder", "src/main.rs", "Cargo.toml", "target/debug/main.rs"]
    answer: 2
    why: cargo new puts the code in src/main.rs; Cargo.toml holds settings and target/ holds build output.
  - type: boss
    prompt: |
      Write a program that prints this exact banner (three lines):

      ```
      ==========
      RustArena
      ==========
      ```
    seed: |
      fn main() {
      }
    solution: |
      fn main() {
          println!("==========");
          println!("RustArena");
          println!("==========");
      }
    hints:
      - Three println! lines; the first and last are the same row of ten = signs.
    why: Each println! prints one line.
