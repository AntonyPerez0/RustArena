  - type: compiles
    answer: no
    pre: |
      fn largest<T>(items: &[T]) -> &T {
          let mut best = &items[0];
          for item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }
    body: |
      println!("{}", largest(&[1, 5, 2]));
    why: Without a PartialOrd bound, > can't be used on T, because not every type can be ordered.
  - type: compiles
    answer: no
    pre: |
      struct Point<T> {
          x: T,
          y: T,
      }
    body: |
      let p = Point { x: 1, y: 2.0 };
      println!("{} {}", p.x, p.y);
    why: Both fields have the same type T, so they can't be an integer and a float at once. Use two parameters if they may differ.
  - type: compiles
    answer: yes
    pre: |
      struct Pair<A, B> {
          left: A,
          right: B,
      }
    body: |
      let p = Pair { left: 1, right: "one" };
      println!("{} {}", p.left, p.right);
    why: With two type parameters, A and B can be different types (here i32 and &str).
  - type: compiles
    answer: no
    pre: |
      fn dot<const N: usize>(a: [i32; N], b: [i32; N]) -> i32 {
          let mut total = 0;
          for i in 0..N {
              total += a[i] * b[i];
          }
          total
      }
    body: |
      println!("{}", dot([1, 2, 3], [4, 5]));
    why: Both parameters use the same N, so the arrays must have the same length. The compiler rejects a length 3 and a length 2 array.
  - type: choice
    prompt: A program calls a generic function with an i32 and with an f64. What does the compiler do?
    choices: ["Checks the type at run time on every call", "Generates a separate copy of the function for each type", "Converts both arguments to f64", "Stores the arguments on the heap in a Box"]
    answer: 2
    why: This is monomorphization. Each copy is specialized for its type, so generic code is as fast as hand-written code.
  - type: choice
    prompt: A function adds up daily sales, and the number of days is only known when the program runs. Which parameter type fits best?
    choices: ["sales: &[u32]", "sales: [u32; 7]", "a const generic array: sales: [u32; N]", "sales: (u32, u32, u32)"]
    answer: 1
    why: A slice accepts any length decided at run time. Fixed arrays and const generics need the length at compile time.
  - type: boss
    prompt: |
      Write `fn min_max<T: PartialOrd + Copy>(items: &[T]) -> Option<(T, T)>` that returns the smallest and the largest element as a tuple, or `None` for an empty slice. Walk the slice once.
    seed: |
      fn min_max<T: PartialOrd + Copy>(items: &[T]) -> Option<(T, T)> {
          todo!()
      }
    solution: |
      fn min_max<T: PartialOrd + Copy>(items: &[T]) -> Option<(T, T)> {
          if items.is_empty() {
              return None;
          }
          let mut low = items[0];
          let mut high = items[0];
          for &item in items {
              if item < low {
                  low = item;
              }
              if item > high {
                  high = item;
              }
          }
          Some((low, high))
      }
    harness: |
      #[test]
      fn finds_min_and_max_of_numbers() {
          assert_eq!(min_max(&[3, 9, -2, 7]), Some((-2, 9)), "min_max(&[3, 9, -2, 7])");
      }

      #[test]
      fn works_with_floats_and_chars() {
          assert_eq!(min_max(&[1.5, 0.25, 8.0]), Some((0.25, 8.0)), "min_max(&[1.5, 0.25, 8.0])");
          assert_eq!(min_max(&['r', 'u', 's', 't']), Some(('r', 'u')), "min_max(&['r', 'u', 's', 't'])");
      }

      #[test]
      fn a_single_item_is_both() {
          assert_eq!(min_max(&[42]), Some((42, 42)), "min_max(&[42])");
      }

      #[test]
      fn empty_slice_gives_none() {
          let empty: [u8; 0] = [];
          assert_eq!(min_max(&empty), None, "min_max(&[])");
      }
    hints:
      - "Return `None` early for an empty slice."
      - "Start both `low` and `high` at `items[0]`, then update them in one loop."
    why: The bounds say exactly what the function needs, compare and copy, so it works for every type that has both.
