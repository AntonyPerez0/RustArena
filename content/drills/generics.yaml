topic: generics
drills:
  - type: predict
    pre: |
      fn largest<T: PartialOrd + Copy>(items: &[T]) -> T {
          let mut best = items[0];
          for &item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }
    body: |
      println!("{} {}", largest(&[3, 9, 2]), largest(&['c', 'a', 'z']));
    why: The same generic function runs once with T = i32 and once with T = char; both types can be compared and copied.
  - type: predict
    pre: |
      fn swap<A, B>(pair: (A, B)) -> (B, A) {
          (pair.1, pair.0)
      }
    body: |
      println!("{:?}", swap((1, "one")));
    why: With two type parameters the halves can have different types; here A is i32 and B is &str, and the result is a (&str, i32).
  - type: predict
    pre: |
      struct Point<T> {
          x: T,
          y: T,
      }

      impl Point<f64> {
          fn distance_from_origin(&self) -> f64 {
              (self.x * self.x + self.y * self.y).sqrt()
          }
      }
    body: |
      let p = Point { x: 3.0, y: 4.0 };
      println!("{}", p.distance_from_origin());
    why: "p is a Point<f64>, so the method from impl Point<f64> exists. The square root of 9 + 16 is 5, and an f64 of 5.0 prints as 5."
  - type: predict
    pre: |
      fn count<T, const N: usize>(_items: [T; N]) -> usize {
          N
      }
    body: |
      println!("{} {}", count([1, 2, 3]), count(['a'; 5]));
    why: N is inferred from each array's length (3, then 5), and the function can use it like a constant.
  - type: predict
    pre: |
      struct Stack<T> {
          items: Vec<T>,
      }

      impl<T> Stack<T> {
          fn push(&mut self, item: T) {
              self.items.push(item);
          }

          fn pop(&mut self) -> Option<T> {
              self.items.pop()
          }
      }
    body: |
      let mut s = Stack { items: Vec::new() };
      s.push("a");
      s.push("b");
      s.push("c");
      s.pop();
      println!("{:?}", s.pop());
    why: A stack is last in, first out. The first pop removes "c", the second returns Some("b").
  - type: predict
    pre: |
      fn name_of<T>(_value: T) -> String {
          std::any::type_name::<T>().to_string()
      }
    body: |
      println!("{} {}", name_of(1.5), name_of::<u8>(7));
    why: Each call uses a different copy of name_of. A float literal defaults to f64, and the turbofish makes the second call use u8.
  - type: fill
    prompt: Add the bound that allows comparing with >.
    pre: |
      fn largest<T: [[PartialOrd]] + Copy>(items: &[T]) -> T {
          let mut best = items[0];
          for &item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }
    body: |
      println!("{}", largest(&[2.5, 9.75, 1.0]));
    why: PartialOrd is the trait behind <, >, <= and >=. Without it, the compiler can't know that any T can be compared.
  - type: fill
    prompt: Declare the type parameter for the impl block.
    pre: |
      struct Wrapper<T> {
          value: T,
      }

      impl[[<T>]] Wrapper<T> {
          fn get(&self) -> &T {
              &self.value
          }
      }
    body: |
      let w = Wrapper { value: "boxed" };
      println!("{}", w.get());
    why: "impl<T> declares T so that Wrapper<T> can use it; without it, T would have to be an existing type."
  - type: fill
    prompt: Make the function work for arrays of any length.
    pre: |
      fn sum<[[const N: usize]]>(values: [i32; N]) -> i32 {
          let mut total = 0;
          for v in values {
              total += v;
          }
          total
      }
    body: |
      println!("{} {}", sum([1, 2, 3]), sum([10, 20]));
    why: "A const generic parameter (const N: usize) stands for the array length, which is inferred at each call."
