  - type: fill
    after: enums-4
    prompt: Bind the number inside the Option.
    body: |
      let stock: Option<u32> = Some(12);
      match stock {
          [[Some‖Option::Some]](n) => println!("{} left", n),
          None => println!("sold out"),
      }
    why: The Some(n) pattern matches a present value and binds what's inside to n.

  - type: fill
    after: enums-5
    prompt: Run the block only when there is a value.
    body: |
      let coupon: Option<u32> = Some(15);
      if [[let]] Some(percent) = coupon {
          println!("{}% off", percent);
      }
    why: if let checks one pattern and binds its data for the block. It's shorter than a match that ignores None.

  - type: fill
    after: enums-2
    prompt: Catch every other number with the wildcard pattern.
    pre: |
      fn name(n: u32) -> &'static str {
          match n {
              1 => "one",
              2 => "two",
              [[_]] => "many",
          }
      }
    body: |
      println!("{} {}", name(2), name(40));
    why: Numbers can't all be listed, so a match on them needs a catch-all arm. _ matches anything.

  - type: bug
    after: enums-2
    pre: |
      #[derive(Debug)]
      enum Light {
          Red,
          Green,
          Yellow,
      }

      fn next(light: Light) -> Light {
          match light {
              Light::Red => Light::Green,
              Light::Green => Light::Yellow,
              Light::Yellow => Light::Green, // BUG
          }
      }
    body: |
      println!("{:?}", next(next(next(Light::Red))));
    fix: Light::Yellow => Light::Red,
    prompt: "A traffic light goes Red, Green, Yellow, Red. Three steps from Red should print `Red`. Click the line with the bug."
    why: Yellow must turn back to Red. With the bug, the light skips Red and bounces between Green and Yellow.

  - type: bug
    after: enums-4
    pre: |
      fn first_negative(v: &[i32]) -> Option<usize> {
          for i in 0..v.len() {
              if v[i] < 0 {
                  return Some(i);
              }
          }
          Some(0) // BUG
      }
    body: |
      println!("{:?}", first_negative(&[3, 5, 8]));
    fix: None
    prompt: "There is no negative number, so this should print `None`. Click the line with the bug."
    why: When nothing is found, the function must say so with None. Some(0) claims the first element is negative.

  - type: bug
    after: enums-5
    body: |
      let input = "12";
      let Ok(n) = input.parse::<u32>() else { println!("bad input"); }; // BUG
      println!("{}", n * 2);
    fix: 'let Ok(n) = input.parse::<u32>() else { println!("bad input"); return; };'
    prompt: "This should print `24`. Click the line with the bug."
    why: The else block of let...else must leave (return, break, continue or panic). Otherwise there would be no n to continue with.

