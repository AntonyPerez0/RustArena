  - type: compiles
    after: enums-4
    answer: no
    body: |
      let price: Option<u32> = Some(250);
      let total = price + 50;
      println!("{}", total);
    why: An Option<u32> is not a u32. You must handle the None case before using the number.

  - type: compiles
    after: enums-2
    answer: yes
    pre: |
      enum Light {
          Red,
          Yellow,
          Green,
      }
    body: |
      let l = Light::Yellow;
      let go = match l {
          Light::Green => true,
          _ => false,
      };
      println!("{}", go);
    why: The _ arm covers Red and Yellow, so the match is exhaustive.

  - type: compiles
    after: enums-4
    answer: no
    body: |
      let name: String = None;
      println!("{}", name);
    why: Rust has no null. None is a value of Option<T>, not of String; a String is always a real string.

  - type: choice
    after: enums-4
    prompt: Why does Rust use Option<T> instead of null?
    choices: ["Option is faster than null", "The type shows that a value may be missing, and the compiler makes you handle None before using it", "Null can't be stored on the heap", "Option lets any variable be null"]
    answer: 2
    why: With null, any reference might be missing and nothing reminds you to check. Option makes "maybe missing" part of the type, so forgetting the check is a compile error, not a crash.

  - type: choice
    after: enums-2
    prompt: You add a new variant to your own enum. What's the downside of having used _ => ... arms in your matches on it?
    choices: ["The program gets slower", "The compiler no longer points out the matches that should handle the new variant", "_ arms stop compiling", "Nothing, _ is always the better choice"]
    answer: 2
    why: An exhaustive match without _ fails to compile until the new variant is handled, which finds every place to update. A _ arm silently swallows it.

  - type: boss
    after: enums-5
    prompt: |
      A vending machine takes coins by name. Write:

      - `fn coin_value(name: &str) -> Option<u32>`: `"nickel"` is 5, `"dime"` is 10, `"quarter"` is 25; anything else is `None`.
      - `fn total(coins: &[&str]) -> Option<u32>`: the sum of all coins, or `None` if any of them is unknown.
    seed: |
      fn coin_value(name: &str) -> Option<u32> {
          todo!()
      }

      fn total(coins: &[&str]) -> Option<u32> {
          todo!()
      }
    solution: |
      fn coin_value(name: &str) -> Option<u32> {
          match name {
              "nickel" => Some(5),
              "dime" => Some(10),
              "quarter" => Some(25),
              _ => None,
          }
      }

      fn total(coins: &[&str]) -> Option<u32> {
          let mut sum = 0;
          for coin in coins {
              let Some(value) = coin_value(coin) else {
                  return None;
              };
              sum += value;
          }
          Some(sum)
      }
    harness: |
      #[test]
      fn knows_the_three_coins() {
          assert_eq!((coin_value("nickel"), coin_value("dime"), coin_value("quarter")), (Some(5), Some(10), Some(25)), "values of nickel, dime, quarter");
      }

      #[test]
      fn unknown_coins_are_none() {
          assert_eq!(coin_value("penny"), None, "coin_value(\"penny\")");
          assert_eq!(coin_value("Dime"), None, "coin_value(\"Dime\")");
      }

      #[test]
      fn adds_up_coins() {
          assert_eq!(total(&["quarter", "dime", "dime", "nickel"]), Some(50), "total of quarter, dime, dime, nickel");
      }

      #[test]
      fn no_coins_is_zero() {
          assert_eq!(total(&[]), Some(0), "total(&[])");
      }

      #[test]
      fn one_bad_coin_spoils_the_total() {
          assert_eq!(total(&["quarter", "button", "dime"]), None, "total of quarter, button, dime");
      }
    hints:
      - "`coin_value` is a `match name` with three string arms returning `Some(...)` and `_ => None`."
      - "In `total`, keep a running sum and use `let Some(value) = coin_value(coin) else { return None; };` for each coin."
      - "Return `Some(sum)` after the loop."
    why: Returning Option from both functions makes the "unknown coin" case impossible to ignore, and let...else stops at the first bad coin.
