topic: enums
drills:
  - type: predict
    after: enums-2
    pre: |
      enum Light {
          Red,
          Yellow,
          Green,
      }

      fn action(light: Light) -> &'static str {
          match light {
              Light::Red => "stop",
              Light::Yellow => "slow down",
              Light::Green => "go",
          }
      }
    body: |
      println!("{} / {}", action(Light::Yellow), action(Light::Red));
    why: match runs the arm whose pattern fits the value, so Yellow gives "slow down" and Red gives "stop".

  - type: predict
    after: enums-4
    body: |
      let x: Option<i32> = Some(4);
      let doubled = match x {
          Some(n) => n * 2,
          None => 0,
      };
      println!("{}", doubled);
    why: x is Some(4), so the Some(n) arm runs with n = 4 and the match evaluates to 8.

  - type: predict
    after: enums-3
    pre: |
      enum Shape {
          Circle(u32),
          Rect { w: u32, h: u32 },
      }

      fn area(s: &Shape) -> u32 {
          match s {
              Shape::Circle(r) => 3 * r * r,
              Shape::Rect { w, h } => w * h,
          }
      }
    body: |
      let total = area(&Shape::Rect { w: 2, h: 3 }) + area(&Shape::Circle(1));
      println!("{}", total);
    why: The rectangle's pattern binds w = 2 and h = 3 (area 6); the circle binds r = 1 (area 3 with this rough pi). 6 + 3 = 9.

  - type: predict
    after: enums-5
    body: |
      let n: Option<u32> = 10u32.checked_sub(20);
      if let Some(v) = n {
          println!("got {}", v);
      } else {
          println!("nothing");
      }
    why: 10 - 20 doesn't fit in a u32, so checked_sub returns None and the else branch runs.

