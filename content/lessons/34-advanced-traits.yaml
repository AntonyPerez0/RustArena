      - task: |
          Write a trait with **two** supertraits. `Sellable` must require both `Priced` (given) and `fmt::Display`, and have a default method `fn receipt_line(&self) -> String` that returns the item's display text, a colon, and its price in dollars, like `Rust in Action: $39.99`.

          Then make `Book` sellable: implement `Display` (shows the title), `Priced` (returns `price_cents`), and an empty `impl Sellable for Book {}`. Finally write `fn total_cents<T: Sellable>(items: &[T]) -> u32`, which only needs the `Sellable` bound to add up the prices.
        seed: |
          use std::fmt;

          trait Priced {
              fn price_cents(&self) -> u32;
          }

          struct Book {
              title: String,
              price_cents: u32,
          }

          // TODO: trait Sellable: Priced + fmt::Display { fn receipt_line(&self) -> String { ... } }
          // TODO: impl fmt::Display for Book, impl Priced for Book, impl Sellable for Book {}

