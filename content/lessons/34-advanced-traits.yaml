          Define a type alias `ParseResult<T>` for a `Result` whose error type is `String`, so the two signatures below compile. Then write both functions:

          - `parse_port("8080")` is `Ok(8080)`. If the text isn't a valid `u16`, return `Err("not a number: <text>")`. Port `0` is `Err("port 0 is reserved")`.
          - `parse_addr("localhost:8080")` is `Ok(("localhost".to_string(), 8080))`. Without a `:`, return `Err("missing ':' in <text>")`. Use `parse_port` (and `?`) for the port part.
        seed: |
          // TODO: define the alias ParseResult<T>

          fn parse_port(s: &str) -> ParseResult<u16> {
