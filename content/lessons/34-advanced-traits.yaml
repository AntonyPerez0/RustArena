      - task: |
          Write `parse_settings`, which turns `"key=value"` lines into `(key, number)` pairs. Skip blank lines, lines starting with `#`, lines without `=`, and lines whose value isn't a `u32`. Trim the key and the value. Use `let ... else { continue; }` for the two parsing steps: it works because `continue` has type `!`.
        seed: |
          fn parse_settings(lines: &[&str]) -> Vec<(String, u32)> {
              todo!()
          }
        solution: |
          fn parse_settings(lines: &[&str]) -> Vec<(String, u32)> {
              let mut out = Vec::new();
              for line in lines {
                  let line = line.trim();
                  if line.is_empty() || line.starts_with('#') {
                      continue;
                  }
                  let Some((key, value)) = line.split_once('=') else {
                      continue;
                  };
                  let Ok(value) = value.trim().parse::<u32>() else {
                      continue;
                  };
                  out.push((key.trim().to_string(), value));
              }
              out
          }
        harness: |
          #[test]
          fn parses_simple_pairs() {
              assert_eq!(parse_settings(&["port=8080", "workers=4"]), vec![("port".to_string(), 8080), ("workers".to_string(), 4)], "two settings");
          }

          #[test]
          fn trims_keys_and_values() {
              assert_eq!(parse_settings(&["  retries = 3  "]), vec![("retries".to_string(), 3)], "\"  retries = 3  \"");
          }

          #[test]
          fn skips_comments_and_blank_lines() {
              assert_eq!(parse_settings(&["# port=1", "", "   ", "port=2"]), vec![("port".to_string(), 2)], "comments and blanks");
          }

          #[test]
          fn skips_lines_without_equals_or_with_bad_numbers() {
              assert_eq!(parse_settings(&["verbose", "level=high", "max=-1", "ok=1"]), vec![("ok".to_string(), 1)], "bad lines");
          }
        require:
          - pattern: 'else\s*\{\s*continue'
            message: "Use `let ... else { continue; }` to skip lines that don't parse."
