              assert_eq!(book("Rust in Action", 3999).receipt_line(), "Rust in Action: $39.99", "receipt_line()");
          }

          #[test]
          fn cents_are_always_two_digits() {
              assert_eq!(book("Zines", 505).receipt_line(), "Zines: $5.05", "receipt_line() for 505 cents");
          }

          #[test]
          fn a_book_still_displays_as_its_title() {
              assert_eq!(format!("{}", book("Dune", 999)), "Dune", "displaying a Book");
          }

          #[test]
          fn total_cents_adds_up_through_the_supertrait() {
              let books = vec![book("A", 1000), book("B", 250), book("C", 1)];
              assert_eq!(total_cents(&books), 1251, "total_cents(&books)");
          }
