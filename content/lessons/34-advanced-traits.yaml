  - title: PhantomData and typestate
    id: advanced-traits-6
    text: |
      **Type-level programming** means letting types carry information the compiler checks, so whole classes of bugs become compile errors. The most useful form at work is **typestate**: the state of an object is part of its type, and each state has only the methods that make sense in it.

      ```rust run
      use std::marker::PhantomData;

      struct Locked;
      struct Closed;
      struct Open;

      struct Door<State> {
          name: String,
          _state: PhantomData<State>,
      }

      impl Door<Locked> {
          fn new(name: &str) -> Door<Locked> {
              Door { name: name.to_string(), _state: PhantomData }
          }
          fn unlock(self) -> Door<Closed> {
              println!("{}: unlocked", self.name);
              Door { name: self.name, _state: PhantomData }
          }
      }

      impl Door<Closed> {
          fn open(self) -> Door<Open> {
              println!("{}: opened", self.name);
              Door { name: self.name, _state: PhantomData }
          }
          fn lock(self) -> Door<Locked> {
              println!("{}: locked", self.name);
              Door { name: self.name, _state: PhantomData }
          }
      }

      impl Door<Open> {
          fn close(self) -> Door<Closed> {
              println!("{}: closed", self.name);
              Door { name: self.name, _state: PhantomData }
          }
      }

      fn main() {
          let door = Door::new("vault");
          let door = door.unlock().open();
          let door = door.close();
          let _door = door.lock();
          println!("{}", std::mem::size_of::<Door<Open>>() == std::mem::size_of::<String>());
      }
      ```

      ```output
      vault: unlocked
      vault: opened
      vault: closed
      vault: locked
      true
      ```

      How it works:

      - `Locked`, `Closed` and `Open` are empty structs used only as **markers**. No value of them is ever created.
      - `Door<Locked>` and `Door<Open>` are different types, and each `impl` block adds methods to just one of them. A locked door simply has no `open` method.
      - Each transition takes `self` **by value** and returns the door in its new state. The old value is moved, so you can't keep using a stale `Door<Closed>` after opening it.
      - Methods every state needs go in a generic impl: `impl<S> Door<S> { fn name(&self) -> &str { &self.name } }`.

      Trying to open a locked door isn't a runtime error; it doesn't compile:

      ```rust compile_fail
      use std::marker::PhantomData;

      struct Locked;
      struct Closed;

      struct Door<S> {
          name: String,
          _state: PhantomData<S>,
      }

      impl Door<Locked> {
          fn new(name: &str) -> Self {
              Door { name: name.to_string(), _state: PhantomData }
          }
      }

      impl Door<Closed> {
          fn open(self) -> String {
              self.name
          }
      }

      fn main() {
          let door = Door::new("vault");
          println!("{}", door.open());
      }
      ```

      ```error
      error[E0599]: no method named `open` found for struct `Door<Locked>` in the current scope
      ```

      ### Why PhantomData?

      Rust rejects a type parameter that no field uses: `struct Door<State> { name: String }` fails with ``error[E0392]: type parameter `State` is never used``. **`PhantomData<State>`** (from `std::marker`) is a field of size zero that says "act as if this struct holds a `State`". It costs nothing at runtime, as the `size_of` line shows: the door is exactly as big as its `String`. You create it with the value `PhantomData`.

      ### Where you'll meet typestate

      Builders that can't be finished before the required fields are set, connections that can't send before they're authenticated, and hardware drivers (embedded Rust uses it so a pin configured as an input has no `set_high` method). It's worth it when misuse is costly; for simple cases an enum with a runtime check is easier to read. The patterns module comes back to this.

      **Your turn:** finish a typestate HTTP request builder that can't be sent until a URL is set. `RequestBuilder::new()` starts as `RequestBuilder<NoUrl>` with method `GET`. Add:

      - `url(self, url: &str) -> RequestBuilder<HasUrl>`, only on `RequestBuilder<NoUrl>`.
      - `method(self, m: &str) -> Self` and `header(self, name: &str, value: &str) -> Self`, available in **both** states (a generic impl).
      - `send(self) -> String`, only on `RequestBuilder<HasUrl>`. It returns the method, a space, the URL, then each header as ` [Name: value]` in the order they were added: `POST https://api.shop/orders [Accept: json]`.
    seed: |
      use std::marker::PhantomData;

      struct NoUrl;
      struct HasUrl;

      struct RequestBuilder<U> {
          method: String,
          url: String,
          headers: Vec<String>,
          _url: PhantomData<U>,
      }

      impl RequestBuilder<NoUrl> {
          fn new() -> Self {
              RequestBuilder { method: "GET".to_string(), url: String::new(), headers: Vec::new(), _url: PhantomData }
          }

          // TODO: fn url(self, url: &str) -> RequestBuilder<HasUrl>
      }

      // TODO: impl<U> RequestBuilder<U> with method() and header()

      // TODO: impl RequestBuilder<HasUrl> with send()
    solution: |
      use std::marker::PhantomData;

      struct NoUrl;
      struct HasUrl;

      struct RequestBuilder<U> {
          method: String,
          url: String,
          headers: Vec<String>,
          _url: PhantomData<U>,
      }

      impl RequestBuilder<NoUrl> {
          fn new() -> Self {
              RequestBuilder { method: "GET".to_string(), url: String::new(), headers: Vec::new(), _url: PhantomData }
          }

          fn url(self, url: &str) -> RequestBuilder<HasUrl> {
              RequestBuilder { method: self.method, url: url.to_string(), headers: self.headers, _url: PhantomData }
          }
      }

      impl<U> RequestBuilder<U> {
          fn method(mut self, method: &str) -> Self {
              self.method = method.to_string();
              self
          }

          fn header(mut self, name: &str, value: &str) -> Self {
              self.headers.push(format!("[{name}: {value}]"));
              self
          }
      }

      impl RequestBuilder<HasUrl> {
          fn send(self) -> String {
              let mut line = format!("{} {}", self.method, self.url);
              for h in &self.headers {
                  line.push(' ');
                  line.push_str(h);
              }
              line
          }
      }
    harness: |
      #[test]
      fn a_plain_request_is_a_get() {
          assert_eq!(RequestBuilder::new().url("https://crab.rs").send(), "GET https://crab.rs", "new().url(..).send()");
      }

      #[test]
      fn the_method_can_be_changed() {
          let r = RequestBuilder::new().method("POST").url("https://api.shop/orders").send();
          assert_eq!(r, "POST https://api.shop/orders", "new().method(\"POST\").url(..).send()");
      }

      #[test]
      fn headers_are_listed_in_order() {
          let r = RequestBuilder::new().url("https://x.io").header("Accept", "json").header("X-Id", "7").send();
          assert_eq!(r, "GET https://x.io [Accept: json] [X-Id: 7]", "two headers");
      }

      #[test]
      fn settings_work_before_and_after_the_url() {
          let r = RequestBuilder::new().header("A", "1").url("u").method("PUT").header("B", "2").send();
          assert_eq!(r, "PUT u [A: 1] [B: 2]", "header, url, method, header");
      }
    require:
      - pattern: 'impl\s*<\s*\w+\s*>\s*RequestBuilder\s*<'
        message: "Put `method` and `header` in a generic impl (`impl<U> RequestBuilder<U>`), so both states have them."
      - pattern: 'impl\s+RequestBuilder\s*<\s*HasUrl\s*>'
        message: "Put `send` in `impl RequestBuilder<HasUrl>`, so a builder without a URL can't send."
    hints:
      - "`url` moves the fields into a builder of the other type: `RequestBuilder { method: self.method, url: url.to_string(), headers: self.headers, _url: PhantomData }`."
      - "Builder methods take `mut self` and return it: `fn method(mut self, method: &str) -> Self { self.method = method.to_string(); self }`. Store each header already formatted as `[Name: value]`."
      - "`send` starts with `format!(\"{} {}\", self.method, self.url)` and appends a space plus each stored header."
    more:
      - task: |
          A blog post goes Draft, then Review, then Published. Finish the typestate `Post`:

          - On `Post<Draft>`: `write(&mut self, text: &str)` appends text, and `submit(self) -> Post<Review>`.
          - On `Post<Review>`: `approve(self) -> Post<Published>` and `reject(self) -> Post<Draft>` (the text is kept).
          - On `Post<Published>`: `content(&self) -> &str`. Only published posts can be read.
