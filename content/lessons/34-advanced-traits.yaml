            message: "Declare the supertraits after a colon: `trait Sellable: Priced + fmt::Display`."
        hints:
          - "`trait Sellable: Priced + fmt::Display { fn receipt_line(&self) -> String { ... } }`. Inside, both `self.price_cents()` and `{}` with `self` work."
          - "`format!(\"{}: ${}.{:02}\", self, cents / 100, cents % 100)`, where `cents` is `self.price_cents()`."
          - "`total_cents` can call `price_cents()` because every `Sellable` is also `Priced`: `items.iter().map(|item| item.price_cents()).sum()`."

  - title: Blanket impls and extension traits
    id: advanced-traits-4
    text: |
      A **blanket impl** implements a trait for every type that meets a bound, in one go: `impl<T: Display> Shout for T`. Read it as "for all types `T` that can be displayed, here's how they shout".

      ```rust run
      use std::fmt::{self, Display};

      trait Shout {
          fn shout(&self) -> String;
      }

      impl<T: Display> Shout for T {
          fn shout(&self) -> String {
              format!("{}!", self.to_string().to_uppercase())
          }
      }

      struct Crab;

      impl Display for Crab {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "ferris")
          }
      }

      fn main() {
          println!("{}", "hello".shout());
          println!("{}", 42.shout());
          println!("{}", Crab.shout());
      }
      ```

      ```output
      HELLO!
      42!
      FERRIS!
      ```

      `Crab` never mentions `Shout`, yet it can shout: implementing `Display` was enough.

      ### You've been using blanket impls all along

      - `impl<T: Display + ?Sized> ToString for T` in std is why every type with `Display` has `.to_string()`. (`?Sized` is explained at the end of this module.)
      - `impl<T, U: From<T>> Into<U> for T` is why implementing `From` gives you `Into` for free.
      - `impl<T: Iterator> Itertools for T` is how the `itertools` crate adds dozens of methods to every iterator in your program.

      That last one is an **extension trait**: a trait you write to add methods to types you don't own (`str`, `Vec`, every iterator). Bring the trait into scope with `use` and the methods appear. Teams use them for small helpers like `.is_blank()` on strings or `.sum_by()` on iterators.

      ### Coherence: no two impls may overlap

      Once the blanket impl exists, you can't add a specific impl that it already covers:

      ```rust compile_fail
      use std::fmt::Display;

      trait Shout {
          fn shout(&self) -> String;
      }

      impl<T: Display> Shout for T {
          fn shout(&self) -> String {
              format!("{self}!")
          }
      }

      impl Shout for i32 {
          fn shout(&self) -> String {
              format!("{self}!!!")
          }
      }

      fn main() {
          println!("{}", 5.shout());
      }
      ```

      ```error
      error[E0119]: conflicting implementations of trait `Shout` for type `i32`
      ```

      `i32` is `Display`, so it already has `Shout`. Rust insists there's always exactly one impl to pick, which keeps behavior predictable. (Picking the "more specific" impl, called specialization, isn't stable Rust.)

      ### Common mistakes

      - **A blanket impl in a published library is a commitment**: adding one later can break users who wrote their own impls, so library authors add them early or not at all.
      - **Blanket-implementing a trait you don't own**: `impl<T: Debug> Display for T` is rejected by the orphan rule (next step), because it would cover types from every other crate too.

      **Your turn:** write one blanket impl so that every type that implements `Debug` gets a `pretty()` method returning its Debug text inside angle brackets: `5.pretty()` is `"<5>"`, `vec![1, 2].pretty()` is `"<[1, 2]>"`.
    seed: |
      use std::fmt::Debug;

      trait Pretty {
          fn pretty(&self) -> String;
      }

      // TODO: one impl that covers every type implementing Debug
    solution: |
      use std::fmt::Debug;

      trait Pretty {
          fn pretty(&self) -> String;
      }

      impl<T: Debug> Pretty for T {
          fn pretty(&self) -> String {
              format!("<{:?}>", self)
          }
      }
    harness: |
      #[derive(Debug)]
      struct Ticket {
          id: u32,
      }

      #[test]
      fn numbers_get_angle_brackets() {
          assert_eq!(5.pretty(), "<5>", "5.pretty()");
      }

      #[test]
      fn strings_keep_their_quotes() {
          assert_eq!("hi".pretty(), "<\"hi\">", "\"hi\".pretty()");
      }

      #[test]
      fn vectors_and_options_work_too() {
          assert_eq!(vec![1, 2].pretty(), "<[1, 2]>", "vec![1, 2].pretty()");
          assert_eq!(Some('x').pretty(), "<Some('x')>", "Some('x').pretty()");
      }

      #[test]
      fn your_own_debug_types_work_without_extra_code() {
          assert_eq!(Ticket { id: 7 }.pretty(), "<Ticket { id: 7 }>", "Ticket with id 7, pretty()");
      }
    require:
      - pattern: 'impl\s*<[\s\S]*?>\s*Pretty\s+for\s+[A-Z]\w*'
        message: "Write one blanket impl for a type parameter: `impl<T: Debug> Pretty for T`."
    hints:
      - "The impl is generic: `impl<T: Debug> Pretty for T { ... }`."
      - "Inside, `format!(\"<{:?}>\", self)`."
    more:
      - task: |
          Write a blanket impl of `Between` for every type that implements `PartialOrd`. `x.between(&low, &high)` is `true` when `low <= x <= high` (both ends included). It should work for integers, floats, chars and strings without any extra impls.
        seed: |
          trait Between {
              fn between(&self, low: &Self, high: &Self) -> bool;
          }

          // TODO: impl<T: PartialOrd> Between for T
        solution: |
          trait Between {
              fn between(&self, low: &Self, high: &Self) -> bool;
          }

          impl<T: PartialOrd> Between for T {
              fn between(&self, low: &Self, high: &Self) -> bool {
                  low <= self && self <= high
              }
          }
        harness: |
          #[test]
          fn a_number_inside_the_range_is_between() {
              assert_eq!(5.between(&1, &10), true, "5.between(&1, &10)");
          }

          #[test]
          fn both_ends_are_included() {
              assert_eq!(1.between(&1, &10), true, "1.between(&1, &10)");
              assert_eq!(10.between(&1, &10), true, "10.between(&1, &10)");
          }

          #[test]
          fn numbers_outside_are_not_between() {
              assert_eq!(0.between(&1, &10), false, "0.between(&1, &10)");
              assert_eq!(11.between(&1, &10), false, "11.between(&1, &10)");
          }

          #[test]
          fn floats_chars_and_strings_work_too() {
              assert_eq!(2.5.between(&2.0, &3.0), true, "2.5.between(&2.0, &3.0)");
              assert_eq!('Z'.between(&'a', &'z'), false, "'Z'.between(&'a', &'z')");
              assert_eq!("m".between(&"a", &"z"), true, "\"m\".between(&\"a\", &\"z\")");
          }
        require:
          - pattern: 'impl\s*<[\s\S]*?>\s*Between\s+for\s+[A-Z]\w*'
            message: "Write one blanket impl: `impl<T: PartialOrd> Between for T`."
        hints:
          - "`impl<T: PartialOrd> Between for T { fn between(&self, low: &Self, high: &Self) -> bool { ... } }`"
          - "`self`, `low` and `high` are all references to `T`, and `PartialOrd` compares references too: `low <= self && self <= high`."
      - task: |
          Write an extension trait from scratch. `TotalLen` has one method, `fn total_len(self) -> usize`, that adds up the byte lengths of a collection of strings. Give it a blanket impl for every type `I` that implements `IntoIterator` and whose items implement `AsRef<str>`, so it works on `Vec<&str>`, `Vec<String>`, arrays, and iterators like `words.iter()`.
        seed: |
          // Write trait TotalLen and one blanket impl for it.
        solution: |
          // Write trait TotalLen and one blanket impl for it.
          trait TotalLen {
              fn total_len(self) -> usize;
          }

          impl<I, S> TotalLen for I
          where
              I: IntoIterator<Item = S>,
              S: AsRef<str>,
          {
              fn total_len(self) -> usize {
                  self.into_iter().map(|s| s.as_ref().len()).sum()
              }
          }
        harness: |
          #[test]
          fn works_on_a_vec_of_str() {
              assert_eq!(vec!["ab", "cde"].total_len(), 5, "vec![\"ab\", \"cde\"].total_len()");
          }

          #[test]
          fn works_on_a_vec_of_strings() {
              let names = vec![String::from("crab"), String::from("!")];
              assert_eq!(names.total_len(), 5, "names.total_len()");
          }

          #[test]
          fn works_on_an_iterator_of_borrowed_items() {
              let words = ["x", "yz"];
              assert_eq!(words.iter().total_len(), 3, "words.iter().total_len()");
          }

          #[test]
          fn counts_bytes_not_chars() {
              assert_eq!(vec!["é"].total_len(), 2, "vec![\"é\"].total_len()");
          }

          #[test]
          fn an_empty_collection_is_zero() {
              assert_eq!(Vec::<String>::new().total_len(), 0, "Vec::<String>::new().total_len()");
          }
        require:
          - pattern: 'impl\s*<[\s\S]*?>\s*TotalLen\s+for\s+[A-Z]\w*'
            message: "Use one blanket impl over a type parameter, like `impl<I, S> TotalLen for I where ...`."
        hints:
          - "Two type parameters: `I` for the collection and `S` for its items. `impl<I, S> TotalLen for I where I: IntoIterator<Item = S>, S: AsRef<str> { ... }`"
          - "The body: `self.into_iter().map(|s| s.as_ref().len()).sum()`."

  - title: Newtypes, the orphan rule and type aliases
    id: advanced-traits-5
    text: |
      ### The orphan rule

      You may implement a trait for a type only if **the trait or the type is defined in your crate**. This is the **orphan rule**. You can't implement std's `Display` for std's `Vec`:

      ```rust compile_fail
      use std::fmt;

      impl fmt::Display for Vec<String> {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "{}", self.join(", "))
          }
      }

      fn main() {}
      ```

      ```error
      error[E0117]: only traits defined in the current crate can be implemented for types defined outside of the crate
      ```

      Why so strict? Imagine two crates you depend on both wrote `impl Display for Vec<String>`, differently. Which one should your program use? The orphan rule (part of **coherence**) guarantees that can never happen, so adding a dependency can't break your build with clashing impls.

      ### The newtype pattern

      The fix is a **newtype**: a tuple struct with one field that wraps the foreign type. The wrapper is yours, so you may implement any trait for it.

      ```rust run
      use std::fmt;

      struct Scores(Vec<u32>);

      impl fmt::Display for Scores {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self.0.iter().max() {
                  Some(best) => write!(f, "{} scores, best {}", self.0.len(), best),
                  None => write!(f, "no scores yet"),
              }
          }
      }

      fn main() {
          let s = Scores(vec![72, 98, 85]);
          println!("{s}");
          println!("{}", Scores(Vec::new()));
          println!("{}", std::mem::size_of::<Scores>() == std::mem::size_of::<Vec<u32>>());
      }
      ```

      ```output
      3 scores, best 98
      no scores yet
      true
      ```

      The last line shows newtypes are free: `Scores` is exactly the size of the `Vec` inside, and the compiler removes the wrapper entirely. You reach the inner value with `.0`. (You could implement `Deref` to forward every `Vec` method, but that hides the wrapper; most teams prefer exposing just the methods they need.)

      ### Newtypes for safety

      The other big use: give plain numbers and strings distinct types so they can't be mixed up.

      ```rust compile_fail
      #[derive(Debug, Clone, Copy, PartialEq)]
      struct UserId(u32);

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct OrderId(u32);

      fn cancel(order: OrderId, by: UserId) -> String {
          format!("{:?} cancelled by {:?}", order, by)
      }

      fn main() {
          let user = UserId(7);
          let order = OrderId(1042);
          println!("{}", cancel(user, order));
      }
      ```

      ```error
      error[E0308]: arguments to this function are incorrect
      ```

      With two bare `u32` parameters, swapping them would compile and quietly cancel the wrong order.

      ### Type aliases: a new name, not a new type

      A **type alias** gives an existing type a shorter name. It's purely for readability: the alias and the original are interchangeable, so it gives **no** safety at all.

      ```rust run
      use std::collections::BTreeMap;

      type Inventory = BTreeMap<String, u32>;
      type Result<T> = std::result::Result<T, String>;

      fn take(stock: &mut Inventory, item: &str, qty: u32) -> Result<u32> {
          let have = stock.get_mut(item).ok_or(format!("no {item} in stock"))?;
          if *have < qty {
              return Err(format!("only {have} {item} left"));
          }
          *have -= qty;
          Ok(*have)
      }

      fn main() {
          let mut stock = Inventory::new();
          stock.insert("potion".to_string(), 5);
          println!("{:?}", take(&mut stock, "potion", 2));
          println!("{:?}", take(&mut stock, "potion", 9));
          println!("{:?}", take(&mut stock, "sword", 1));
      }
      ```

      ```output
      Ok(3)
      Err("only 3 potion left")
      Err("no sword in stock")
      ```

      The `type Result<T> = std::result::Result<T, MyError>;` pattern is everywhere: `std::io::Result<T>`, `std::fmt::Result`, `anyhow::Result<T>`. Each module that has one error type defines one, so signatures stay short.

      | | newtype `struct UserId(u32)` | alias `type UserId = u32` |
      |---|---|---|
      | new type? | yes, can't be mixed up | no, it's just `u32` |
      | implement foreign traits? | yes | no (it's still the foreign type) |
      | runtime cost | none | none |

      **Your turn:** `Tags` wraps a `Vec<String>`, and you can't implement `Display` for `Vec<String>` directly. Implement `fmt::Display` for `Tags`: each tag gets a `#` in front and they're separated by single spaces (`#rust #crab`). With no tags, display `(no tags)`.
    seed: |
      use std::fmt;

      struct Tags(Vec<String>);

      impl Tags {
