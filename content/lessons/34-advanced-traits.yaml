      - task: |
          Write a database connection with three states from scratch. Use marker structs `Disconnected`, `Connected` and `Authenticated` and a `Connection<S>` holding a `host: String` and a `PhantomData<S>`.

          - `Connection::new(host: &str)` creates a `Connection<Disconnected>`; `connect(self)` returns a `Connection<Connected>`.
          - `login(self, password: &str)` on `Connection<Connected>` returns `Result<Connection<Authenticated>, Connection<Connected>>`: `Ok` when the password is `"hunter2"`, otherwise `Err` with the connection given back so the caller can retry.
          - `query(&self, sql: &str) -> String` only on `Connection<Authenticated>`, returning `"<host> ran: <sql>"`.
          - `host(&self) -> &str` in every state.
        seed: |
          use std::marker::PhantomData;

          // Write the three state markers, Connection<S> and its impl blocks.
        solution: |
          use std::marker::PhantomData;

          // Write the three state markers, Connection<S> and its impl blocks.
          struct Disconnected;
          struct Connected;
          struct Authenticated;

          struct Connection<S> {
              host: String,
              _state: PhantomData<S>,
          }

          impl<S> Connection<S> {
              fn host(&self) -> &str {
                  &self.host
              }
          }

          impl Connection<Disconnected> {
              fn new(host: &str) -> Self {
                  Connection { host: host.to_string(), _state: PhantomData }
              }

              fn connect(self) -> Connection<Connected> {
                  Connection { host: self.host, _state: PhantomData }
              }
          }

          impl Connection<Connected> {
              fn login(self, password: &str) -> Result<Connection<Authenticated>, Connection<Connected>> {
                  if password == "hunter2" {
                      Ok(Connection { host: self.host, _state: PhantomData })
                  } else {
                      Err(self)
                  }
              }
          }

          impl Connection<Authenticated> {
              fn query(&self, sql: &str) -> String {
                  format!("{} ran: {}", self.host, sql)
              }
          }
        harness: |
          #[test]
          fn the_happy_path_reaches_query() {
              let conn = Connection::new("db.local").connect();
              match conn.login("hunter2") {
                  Ok(db) => assert_eq!(db.query("SELECT 1"), "db.local ran: SELECT 1", "query after login"),
                  Err(_) => panic!("login(\"hunter2\") should succeed"),
              }
          }

          #[test]
          fn a_wrong_password_gives_the_connection_back() {
              let conn = Connection::new("db.local").connect();
              match conn.login("nope") {
                  Ok(_) => panic!("login(\"nope\") should fail"),
                  Err(back) => assert_eq!(back.host(), "db.local", "host() of the returned connection"),
              }
          }

          #[test]
          fn you_can_retry_after_a_failed_login() {
              let conn = Connection::new("replica").connect();
              let conn = match conn.login("wrong") {
                  Ok(_) => panic!("login(\"wrong\") should fail"),
                  Err(back) => back,
              };
              match conn.login("hunter2") {
                  Ok(db) => assert_eq!(db.query("SELECT name FROM crabs"), "replica ran: SELECT name FROM crabs", "query after retry"),
                  Err(_) => panic!("the retry with hunter2 should succeed"),
              }
          }

          #[test]
          fn host_works_in_every_state() {
              let c = Connection::new("a");
              assert_eq!(c.host(), "a", "host() when disconnected");
              let c = c.connect();
              assert_eq!(c.host(), "a", "host() when connected");
          }
        require:
          - pattern: 'PhantomData\s*<'
            message: "Keep the state in a `PhantomData<S>` field."
        hints:
