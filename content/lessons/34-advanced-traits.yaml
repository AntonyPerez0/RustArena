id: advanced-traits
title: Advanced Traits
phase: "Advanced Rust"
summary: The trait features library authors use every day. Associated types, operator traits, supertraits, blanket impls, newtypes and the orphan rule, and typestate APIs that turn wrong calls into compile errors.
roadmap: ["Trait Bounds and Associated Types", "Advanced Generics & Type-level Programming"]
steps:
  - title: Associated types versus generic parameters
    id: advanced-traits-1
    text: |
      You've used an **associated type** since the iterators module: `Iterator` declares `type Item;`, and every iterator says what its `Item` is. An associated type is a placeholder type inside a trait that each implementation fills in exactly once.

      ```rust run
      trait Parser {
          type Output;
          fn parse(&self, input: &str) -> Option<Self::Output>;
      }

      struct IntParser;
      struct PairParser;

      impl Parser for IntParser {
          type Output = i64;
          fn parse(&self, input: &str) -> Option<i64> {
              input.trim().parse().ok()
          }
      }

      impl Parser for PairParser {
          type Output = (i32, i32);
          fn parse(&self, input: &str) -> Option<(i32, i32)> {
              let (a, b) = input.split_once(',')?;
              Some((a.trim().parse().ok()?, b.trim().parse().ok()?))
          }
      }

      fn parse_all<P: Parser>(parser: &P, lines: &[&str]) -> Vec<P::Output> {
          lines.iter().filter_map(|line| parser.parse(line)).collect()
      }

      fn main() {
          println!("{:?}", parse_all(&IntParser, &["10", "x", " 32 "]));
          println!("{:?}", parse_all(&PairParser, &["1,2", "3;4", "5, 6"]));
      }
      ```

      ```output
      [10, 32]
      [(1, 2), (5, 6)]
      ```

      Piece by piece:

      - `type Output;` declares the placeholder. Inside the trait you refer to it as `Self::Output`.
      - Each `impl` picks the concrete type: `type Output = i64;`. After that, the impl's methods can write `i64` directly.
      - Generic code names it through the type parameter: `P::Output` is "whatever output this parser produces". You can also pin it in a bound: `P: Parser<Output = i64>` accepts only parsers that produce `i64`, just like `I: Iterator<Item = u32>`.

      ### Why not a generic parameter?

      You could write the trait as `trait Parser<T>` instead. The difference is how many implementations a type may have. With a generic parameter, one type can implement the trait **many times**, once per `T`. That's sometimes exactly right, but it means the compiler can't guess which one you mean:

      ```rust compile_fail
      trait ParseAs<T> {
          fn parse_as(&self) -> Option<T>;
      }

      impl ParseAs<i32> for str {
          fn parse_as(&self) -> Option<i32> {
              self.parse().ok()
          }
      }

      impl ParseAs<bool> for str {
          fn parse_as(&self) -> Option<bool> {
              self.parse().ok()
          }
      }

      fn main() {
          let n = "42".parse_as();
          println!("{:?}", n);
      }
      ```

      ```error
      error[E0283]: type annotations needed for `Option<_>`
      ```

      Writing `let n: Option<i32> = "42".parse_as();` fixes it, but every caller now has to annotate. With an associated type there's one impl per type, so the type alone tells the compiler the answer.

      | Pick | When | Examples in std |
      |---|---|---|
      | associated type | each implementing type has **one** natural answer | `Iterator::Item`, `Deref::Target`, `FromStr::Err` |
      | generic parameter | a type should implement the trait **several times**, for different types | `From<T>`, `AsRef<T>`, `PartialEq<Rhs>` |

      An iterator over bytes yields one kind of item (`u8`), so `Item` is associated. A `String` can be built `From<&str>`, `From<char>` and `From<Box<str>>`, so `From<T>` is generic. Some traits use both, as you'll see in the next step.

      ### Common mistakes

      - **Writing `Output` instead of `Self::Output` in the trait**: the compiler says ``cannot find type `Output` in this scope``. Inside the trait it always belongs to `Self`.
      - **Forgetting `type Output = ...;` in an impl**: ``not all trait items implemented, missing: `Output` ``.
      - **Adding a generic parameter "for flexibility"**: if each type would only ever implement it once, you've just made every caller write annotations.

      **Your turn:** the `Sensor` trait has an associated type `Reading`. Implement it for `Thermometer` (`Reading` is `f64`; the raw value is in tenths of a degree, so `215` reads as `21.5`) and for `DoorSwitch` (`Reading` is `bool`; any raw value other than `0` means open, `true`). Then write the generic `read_all`, which reads every raw value with the given sensor and returns the readings in order.
    seed: |
      trait Sensor {
          type Reading;
          fn read(&self, raw: u16) -> Self::Reading;
      }

      struct Thermometer;
      struct DoorSwitch;

      // TODO: impl Sensor for Thermometer (Reading = f64, 215 reads as 21.5)
      // TODO: impl Sensor for DoorSwitch (Reading = bool, nonzero means true)

      fn read_all<S: Sensor>(sensor: &S, raws: &[u16]) -> Vec<S::Reading> {
          todo!()
      }
    solution: |
      trait Sensor {
          type Reading;
          fn read(&self, raw: u16) -> Self::Reading;
      }

      struct Thermometer;
      struct DoorSwitch;

      impl Sensor for Thermometer {
          type Reading = f64;
          fn read(&self, raw: u16) -> f64 {
              raw as f64 / 10.0
          }
      }

      impl Sensor for DoorSwitch {
          type Reading = bool;
          fn read(&self, raw: u16) -> bool {
              raw != 0
          }
      }

      fn read_all<S: Sensor>(sensor: &S, raws: &[u16]) -> Vec<S::Reading> {
          raws.iter().map(|&raw| sensor.read(raw)).collect()
      }
    harness: |
      #[test]
      fn thermometer_reads_tenths_of_a_degree() {
          assert_eq!(Thermometer.read(215), 21.5, "Thermometer.read(215)");
          assert_eq!(Thermometer.read(0), 0.0, "Thermometer.read(0)");
      }

      #[test]
      fn door_switch_is_open_for_any_nonzero_value() {
          assert_eq!(DoorSwitch.read(0), false, "DoorSwitch.read(0)");
          assert_eq!(DoorSwitch.read(1), true, "DoorSwitch.read(1)");
          assert_eq!(DoorSwitch.read(7), true, "DoorSwitch.read(7)");
      }

      #[test]
      fn read_all_works_with_the_thermometer() {
          assert_eq!(read_all(&Thermometer, &[0, 100, 255]), vec![0.0, 10.0, 25.5], "read_all(&Thermometer, &[0, 100, 255])");
      }

      #[test]
      fn read_all_works_with_the_door_switch() {
          assert_eq!(read_all(&DoorSwitch, &[3, 0, 0]), vec![true, false, false], "read_all(&DoorSwitch, &[3, 0, 0])");
      }

      #[test]
      fn read_all_of_nothing_is_empty() {
          assert!(read_all(&DoorSwitch, &[]).is_empty(), "read_all(&DoorSwitch, &[]) should be empty");
      }
    hints:
      - "Each impl starts with the associated type: `impl Sensor for Thermometer { type Reading = f64; fn read(&self, raw: u16) -> f64 { ... } }`."
      - "Convert before dividing: `raw as f64 / 10.0`. For the switch, `raw != 0` is already a bool."
      - "`read_all` is one iterator chain: `raws.iter().map(|&raw| sensor.read(raw)).collect()`."
    more:
      - task: |
          Fill in the blanks: declare the associated type in the trait, give `Doubler` its output type, and use the associated type in the generic function's return type. The program should print `(8, 42)` and then `("#007", "#042")`.
        fill: |
          trait Machine {
              [[type]] Output;
              fn run(&self, input: u32) -> Self::Output;
          }

          struct Doubler;
          struct Labeler;

          impl Machine for Doubler {
              type Output = [[u32]];
              fn run(&self, input: u32) -> u32 {
                  input * 2
              }
          }

          impl Machine for Labeler {
              type Output = String;
              fn run(&self, input: u32) -> String {
                  format!("#{input:03}")
              }
          }

          fn run_twice<M: Machine>(m: &M, a: u32, b: u32) -> (M::Output, [[M::Output]]) {
              (m.run(a), m.run(b))
          }

          fn main() {
              println!("{:?}", run_twice(&Doubler, 4, 21));
              println!("{:?}", run_twice(&Labeler, 7, 42));
          }
        hints:
          - "An associated type is declared with the `type` keyword inside the trait."
          - "`Doubler::run` returns `u32`, so its `Output` is `u32`. The function returns two outputs of the same machine: `M::Output` twice."
        tests:
          - expect: "(8, 42)\n(\"#007\", \"#042\")"
      - task: |
          This time a generic parameter is the right tool: a distance in meters can sensibly be converted into **several** other units. Write a generic trait `ConvertTo<T>` with one method `fn convert(&self) -> T;`, and implement it twice for `Meters`: `ConvertTo<Feet>` (1 m = 3.28084 ft) and `ConvertTo<Centimeters>` (1 m = 100 cm). Callers pick the impl by the type they ask for: `let f: Feet = Meters(2.0).convert();`.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Meters(f64);

          #[derive(Debug, PartialEq)]
          struct Feet(f64);

          #[derive(Debug, PartialEq)]
          struct Centimeters(f64);

          // Write the trait ConvertTo<T> and two impls of it for Meters.
        solution: |
          #[derive(Debug, PartialEq)]
          struct Meters(f64);

          #[derive(Debug, PartialEq)]
          struct Feet(f64);

          #[derive(Debug, PartialEq)]
          struct Centimeters(f64);

          // Write the trait ConvertTo<T> and two impls of it for Meters.
          trait ConvertTo<T> {
              fn convert(&self) -> T;
          }

          impl ConvertTo<Feet> for Meters {
              fn convert(&self) -> Feet {
                  Feet(self.0 * 3.28084)
              }
          }

          impl ConvertTo<Centimeters> for Meters {
              fn convert(&self) -> Centimeters {
                  Centimeters(self.0 * 100.0)
              }
          }
        harness: |
          #[test]
          fn converts_meters_to_feet() {
              let f: Feet = Meters(2.0).convert();
              assert_eq!(f, Feet(6.56168), "Meters(2.0) as Feet");
          }

          #[test]
          fn converts_meters_to_centimeters() {
              let c: Centimeters = Meters(1.5).convert();
              assert_eq!(c, Centimeters(150.0), "Meters(1.5) as Centimeters");
          }

          #[test]
          fn zero_meters_is_zero_in_both_units() {
              let f: Feet = Meters(0.0).convert();
              let c: Centimeters = Meters(0.0).convert();
              assert_eq!(f, Feet(0.0), "Meters(0.0) as Feet");
              assert_eq!(c, Centimeters(0.0), "Meters(0.0) as Centimeters");
          }

          #[test]
          fn one_value_converts_to_both_units() {
              let m = Meters(10.0);
              let f: Feet = m.convert();
              let c: Centimeters = m.convert();
              assert!((f.0 - 32.8084).abs() < 1e-9, "Meters(10.0) as Feet should be 32.8084, got {}", f.0);
              assert_eq!(c, Centimeters(1000.0), "Meters(10.0) as Centimeters");
          }
        require:
          - pattern: 'trait\s+ConvertTo\s*<\s*\w+\s*>'
            message: "Declare the trait with a generic parameter: `trait ConvertTo<T>`."
        hints:
          - "`trait ConvertTo<T> { fn convert(&self) -> T; }`"
          - "Two impls with different parameters: `impl ConvertTo<Feet> for Meters { fn convert(&self) -> Feet { Feet(self.0 * 3.28084) } }`, and the same shape for `Centimeters`."

  - title: Operator traits and default type parameters
    id: advanced-traits-2
    text: |
      In the std-traits module you overloaded `+` with `Add`. Here's how `std::ops::Add` is really declared:

      ```rust
      trait Add<Rhs = Self> {
          type Output;
          fn add(self, rhs: Rhs) -> Self::Output;
      }
      ```

      It uses both tools from the last step. `Rhs` (the right-hand side) is a generic parameter, because one type can sensibly be added to several others. `Output` is an associated type, because once you know both sides there's one answer. And `Rhs = Self` is a **default type parameter**: if you write `impl Add for Money` without saying what's on the right, Rust fills in `Rhs = Money`.

      ```rust run
      use std::ops::{Add, Mul};

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Money {
          cents: u64,
      }

      // Rhs defaults to Self: Money + Money
      impl Add for Money {
          type Output = Money;
          fn add(self, rhs: Money) -> Money {
              Money { cents: self.cents + rhs.cents }
          }
      }

      // Rhs is u32: Money * u32 (a price times a quantity)
      impl Mul<u32> for Money {
          type Output = Money;
          fn mul(self, qty: u32) -> Money {
              Money { cents: self.cents * qty as u64 }
          }
      }

      fn main() {
          let coffee = Money { cents: 350 };
          let bagel = Money { cents: 225 };
          let total = coffee * 2 + bagel;
          println!("{:?}", total);
          println!("${}.{:02}", total.cents / 100, total.cents % 100);
      }
      ```

      ```output
      Money { cents: 925 }
      $9.25
      ```

      `coffee * 2` calls `Mul<u32>`, then `+ bagel` calls `Add<Money>`. Multiplying money by money makes no sense, so there's simply no impl for it, and the compiler rejects it.

      ### Order matters

      `coffee * 2` uses `impl Mul<u32> for Money`. Writing `2 * coffee` would need a different impl, `impl Mul<Money> for u32`. Rust allows that one too (a local type appears in it), but it's a separate impl you'd have to write.

      ### Default type parameters in your own traits

      Defaults exist mainly for two reasons: to make the common case short (`impl Add for Money`), and to let a library add a type parameter to an existing trait without breaking every impl already written. You can use them in your own traits:

      ```rust
      trait Similar<Other = Self> {
          fn similarity(&self, other: &Other) -> f64;
      }
      ```

      `impl Similar for Song` compares songs with songs; `impl Similar<Playlist> for Song` compares a song with a playlist.

      ### Common mistakes

      - **Forgetting the output type**:

      ```rust compile_fail
      use std::ops::Add;

      struct Meters(f64);

      impl Add for Meters {
          fn add(self, other: Meters) -> Meters {
              Meters(self.0 + other.0)
          }
      }

      fn main() {}
      ```

      ```error
      error[E0046]: not all trait items implemented, missing: `Output`
      ```

      - **Using a combination you didn't implement**: with only `Mul<u32> for Money`, `coffee * coffee` fails with `mismatched types` (expected `u32`, found `Money`).
      - **Surprising operators**: overload an operator only when its meaning is obvious to a reader. `+` on money is fine; `+` that sends an email is not.

      **Your turn:** implement two operators for the game vector `Vec2`: `Vec2 + Vec2` adds the `x`s and the `y`s, and `Vec2 * i32` multiplies both coordinates by the number. Both return a `Vec2`.
    seed: |
      use std::ops::{Add, Mul};

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Vec2 {
          x: i32,
          y: i32,
      }

      // TODO: impl Add for Vec2 (Vec2 + Vec2)
      // TODO: impl Mul<i32> for Vec2 (Vec2 * i32)
    solution: |
      use std::ops::{Add, Mul};

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Vec2 {
          x: i32,
          y: i32,
      }

      impl Add for Vec2 {
          type Output = Vec2;
          fn add(self, rhs: Vec2) -> Vec2 {
              Vec2 { x: self.x + rhs.x, y: self.y + rhs.y }
          }
      }

      impl Mul<i32> for Vec2 {
          type Output = Vec2;
          fn mul(self, factor: i32) -> Vec2 {
              Vec2 { x: self.x * factor, y: self.y * factor }
          }
      }
    harness: |
      #[test]
      fn adds_two_vectors() {
          let a = Vec2 { x: 1, y: 2 };
          let b = Vec2 { x: 3, y: -1 };
          assert_eq!(a + b, Vec2 { x: 4, y: 1 }, "(1, 2) + (3, -1)");
      }

      #[test]
      fn multiplies_both_coordinates_by_a_number() {
          assert_eq!(Vec2 { x: 2, y: -3 } * 3, Vec2 { x: 6, y: -9 }, "(2, -3) * 3");
      }

      #[test]
      fn combines_both_operators() {
          let a = Vec2 { x: 1, y: 1 };
          let b = Vec2 { x: 2, y: 0 };
          assert_eq!((a + b) * 2, Vec2 { x: 6, y: 2 }, "(a + b) * 2");
      }

      #[test]
      fn multiplying_by_zero_gives_the_zero_vector() {
          assert_eq!(Vec2 { x: 5, y: 7 } * 0, Vec2 { x: 0, y: 0 }, "(5, 7) * 0");
      }
    hints:
      - "Each impl needs `type Output = Vec2;` and the method (`add` or `mul`), which takes `self` by value."
      - "`impl Mul<i32> for Vec2 { type Output = Vec2; fn mul(self, factor: i32) -> Vec2 { Vec2 { x: self.x * factor, y: self.y * factor } } }`"
    more:
      - task: |
          Times work like `std::time::Instant` and `Duration`: subtracting two points in time gives a length of time, and adding a length of time to a point gives a later point. Implement `Timestamp - Timestamp` (output `Seconds`, assume the left one is later) and `Timestamp + Seconds` (output `Timestamp`).
        seed: |
          use std::ops::{Add, Sub};

          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Timestamp(u64); // seconds since the start of the day

          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Seconds(u64);

          // TODO: impl Sub for Timestamp (Output = Seconds)
          // TODO: impl Add<Seconds> for Timestamp (Output = Timestamp)
        solution: |
          use std::ops::{Add, Sub};

          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Timestamp(u64); // seconds since the start of the day

          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Seconds(u64);

          impl Sub for Timestamp {
              type Output = Seconds;
              fn sub(self, earlier: Timestamp) -> Seconds {
                  Seconds(self.0 - earlier.0)
              }
          }

          impl Add<Seconds> for Timestamp {
              type Output = Timestamp;
              fn add(self, length: Seconds) -> Timestamp {
                  Timestamp(self.0 + length.0)
              }
          }
        harness: |
          #[test]
          fn subtracting_timestamps_gives_seconds() {
              assert_eq!(Timestamp(500) - Timestamp(200), Seconds(300), "Timestamp(500) - Timestamp(200)");
          }

          #[test]
          fn adding_seconds_gives_a_later_timestamp() {
              assert_eq!(Timestamp(100) + Seconds(60), Timestamp(160), "Timestamp(100) + Seconds(60)");
          }

          #[test]
          fn adding_then_subtracting_round_trips() {
              let start = Timestamp(3600);
              let end = start + Seconds(90);
              assert_eq!(end - start, Seconds(90), "(start + Seconds(90)) - start");
          }

          #[test]
          fn the_same_timestamp_is_zero_seconds_apart() {
              assert_eq!(Timestamp(42) - Timestamp(42), Seconds(0), "Timestamp(42) - Timestamp(42)");
          }
        hints:
          - "`impl Sub for Timestamp` uses the default `Rhs = Self`, but its `type Output` is `Seconds`, not `Timestamp`."
          - "`impl Add<Seconds> for Timestamp { type Output = Timestamp; fn add(self, length: Seconds) -> Timestamp { Timestamp(self.0 + length.0) } }`"
      - task: |
          Write your own trait with a default type parameter. Declare `trait Distance<Other = Self>` with one method `fn distance(&self, other: &Other) -> u32;`. Then implement it twice for the grid `Cell`:

          - `impl Distance for Cell` (using the default): the Manhattan distance, `|row1 - row2| + |col1 - col2|`.
          - `impl Distance<Row> for Cell`: how many rows the cell is away from that row.
        seed: |
          #[derive(Debug, Clone, Copy)]
          struct Cell {
              row: i32,
              col: i32,
          }

          #[derive(Debug, Clone, Copy)]
          struct Row(i32);

          // Write the trait Distance<Other = Self> and its two impls for Cell.
        solution: |
          #[derive(Debug, Clone, Copy)]
          struct Cell {
              row: i32,
              col: i32,
          }

          #[derive(Debug, Clone, Copy)]
          struct Row(i32);

          // Write the trait Distance<Other = Self> and its two impls for Cell.
          trait Distance<Other = Self> {
              fn distance(&self, other: &Other) -> u32;
          }

          impl Distance for Cell {
              fn distance(&self, other: &Cell) -> u32 {
                  self.row.abs_diff(other.row) + self.col.abs_diff(other.col)
              }
          }

          impl Distance<Row> for Cell {
              fn distance(&self, other: &Row) -> u32 {
                  self.row.abs_diff(other.0)
              }
          }
        harness: |
          #[test]
          fn cell_to_cell_is_the_manhattan_distance() {
              let a = Cell { row: 0, col: 0 };
              let b = Cell { row: 2, col: 3 };
              assert_eq!(a.distance(&b), 5, "(0,0) to (2,3)");
          }

          #[test]
          fn cell_distance_works_with_negative_coordinates() {
              let a = Cell { row: -2, col: 4 };
              let b = Cell { row: 1, col: -1 };
              assert_eq!(a.distance(&b), 8, "(-2,4) to (1,-1)");
              assert_eq!(b.distance(&a), 8, "(1,-1) to (-2,4)");
          }

          #[test]
          fn cell_to_row_counts_rows() {
              let c = Cell { row: 5, col: 9 };
              assert_eq!(c.distance(&Row(2)), 3, "(5,9) to Row(2)");
              assert_eq!(c.distance(&Row(8)), 3, "(5,9) to Row(8)");
          }

          #[test]
          fn a_cell_on_the_row_is_zero_rows_away() {
              assert_eq!(Cell { row: 4, col: 1 }.distance(&Row(4)), 0, "(4,1) to Row(4)");
          }
        require:
          - pattern: 'trait\s+Distance\s*<\s*\w+\s*=\s*Self\s*>'
            message: "Give the trait a type parameter that defaults to `Self`: `trait Distance<Other = Self>`."
          - pattern: 'impl\s+Distance\s+for\s+Cell'
            message: "Use the default for the cell-to-cell impl: `impl Distance for Cell`."
        hints:
          - "`trait Distance<Other = Self> { fn distance(&self, other: &Other) -> u32; }`"
          - "`i32::abs_diff` gives the distance between two numbers as a `u32`: `self.row.abs_diff(other.row)`."
          - "The second impl names the parameter: `impl Distance<Row> for Cell { fn distance(&self, other: &Row) -> u32 { self.row.abs_diff(other.0) } }`."

  - title: Supertraits and fully qualified syntax
    id: advanced-traits-3
    text: |
      ### Supertraits: "to implement this, you must also implement that"

      Sometimes a trait only makes sense for types that already have another ability. An alert must be printable, so `Alert` can require `Display`:

      ```rust run
      use std::fmt;

      trait Alert: fmt::Display {
          fn level(&self) -> u8;

          fn banner(&self) -> String {
              let tag = if self.level() >= 3 { "CRITICAL" } else { "notice" };
              format!("[{tag}] {self}")
          }
      }

      struct DiskFull {
          mount: String,
          percent: u8,
      }

      impl fmt::Display for DiskFull {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "{} is {}% full", self.mount, self.percent)
          }
      }

      impl Alert for DiskFull {
          fn level(&self) -> u8 {
              if self.percent >= 95 { 3 } else { 1 }
          }
      }

      fn main() {
          let var = DiskFull { mount: "/var".to_string(), percent: 97 };
          let home = DiskFull { mount: "/home".to_string(), percent: 80 };
          println!("{}", var.banner());
          println!("{}", home.banner());
      }
      ```

      ```output
      [CRITICAL] /var is 97% full
      [notice] /home is 80% full
      ```

      `trait Alert: fmt::Display` makes `Display` a **supertrait** of `Alert`. Two things follow: every type that implements `Alert` must also implement `Display`, and code inside `Alert` (like the default `banner`) may use `{self}` because it's guaranteed to work. A function taking `T: Alert` can print `T` too, without also writing `T: Display`.

      It looks like inheritance, but it isn't: no fields or method bodies are inherited. It's a requirement, checked by the compiler. std is full of them: `Copy: Clone`, `Eq: PartialEq`, `Ord: Eq + PartialOrd`, and `std::error::Error: Debug + Display` (that's why your error types in the custom-errors module needed both).

      ```rust compile_fail
      use std::fmt::Display;

      trait Loggable: Display {
          fn log_line(&self) -> String {
              format!("[LOG] {self}")
          }
      }

      struct Ticket {
          id: u32,
      }

      impl Loggable for Ticket {}

      fn main() {
          let t = Ticket { id: 1 };
          println!("{}", t.id);
      }
      ```

      ```error
      error[E0277]: `Ticket` doesn't implement `std::fmt::Display`
      ```

      ### Two traits, one method name

      Nothing stops two traits from having methods with the same name. When one type implements both, a plain method call is ambiguous, so you name the trait. This is **fully qualified syntax**.

      ```rust run
      trait Employee {
          fn id(&self) -> String;
          fn role() -> &'static str;
      }

      trait Customer {
          fn id(&self) -> String;
          fn role() -> &'static str;
      }

      struct Person {
          staff_no: u32,
          account: u32,
      }

      impl Employee for Person {
          fn id(&self) -> String {
              format!("E-{}", self.staff_no)
          }
          fn role() -> &'static str {
              "employee"
          }
      }

      impl Customer for Person {
          fn id(&self) -> String {
              format!("C-{}", self.account)
          }
          fn role() -> &'static str {
              "customer"
          }
      }

      fn main() {
          let ana = Person { staff_no: 7, account: 1042 };
          println!("{}", Employee::id(&ana));
          println!("{}", Customer::id(&ana));
          println!("{}", <Person as Employee>::role());
          println!("{}", <Person as Customer>::role());
      }
      ```

      ```output
      E-7
      C-1042
      employee
      customer
      ```

      - **Methods with `self`**: `Employee::id(&ana)` calls the trait's method as a plain function, passing the receiver yourself. Rust knows the type from `&ana`.
      - **Associated functions without `self`**: `role()` has no receiver, so `Employee::role()` can't know which type you mean. The full form `<Person as Employee>::role()` says "the `Employee` impl of `Person`". You'll also meet it in generic code, like `<T as Iterator>::Item`.
      - If `Person` had its own (inherent) `id` method, `ana.id()` would call that one; inherent methods win over trait methods.

      ### Common mistakes

      - **Calling `ana.id()` with two traits in scope**: `error[E0034]: multiple applicable items in scope`. The message lists both candidates and suggests the fully qualified forms.
      - **`Employee::role()` with no type**:

      ```rust compile_fail
      trait Named {
          fn name() -> String;
      }

      struct Crab;

      impl Named for Crab {
          fn name() -> String {
              "Ferris".to_string()
          }
      }

      fn main() {
          println!("{}", Named::name());
      }
      ```

      ```error
      error[E0790]: cannot call associated function on trait without specifying the corresponding `impl` type
      ```

      **Your turn:** `Distance` implements both `Metric` and `Imperial`, which have the same two names: `unit()` (no `self`) and `value(&self)`. Write `describe`, which returns both measurements with one decimal place, like `12.0 m = 39.4 ft`. Get the units from the traits with fully qualified syntax rather than typing `"m"` and `"ft"`.
    seed: |
      trait Metric {
          fn unit() -> &'static str;
          fn value(&self) -> f64;
      }

      trait Imperial {
          fn unit() -> &'static str;
          fn value(&self) -> f64;
      }

      struct Distance {
          meters: f64,
      }

      impl Metric for Distance {
          fn unit() -> &'static str {
              "m"
          }
          fn value(&self) -> f64 {
              self.meters
          }
      }

      impl Imperial for Distance {
          fn unit() -> &'static str {
              "ft"
          }
          fn value(&self) -> f64 {
              self.meters * 3.28084
          }
      }

      /// "12.0 m = 39.4 ft"
      fn describe(d: &Distance) -> String {
          todo!()
      }
    solution: |
      trait Metric {
          fn unit() -> &'static str;
          fn value(&self) -> f64;
      }

      trait Imperial {
          fn unit() -> &'static str;
          fn value(&self) -> f64;
      }

      struct Distance {
          meters: f64,
      }

      impl Metric for Distance {
          fn unit() -> &'static str {
              "m"
          }
          fn value(&self) -> f64 {
              self.meters
          }
      }

      impl Imperial for Distance {
          fn unit() -> &'static str {
              "ft"
          }
          fn value(&self) -> f64 {
              self.meters * 3.28084
          }
      }

      /// "12.0 m = 39.4 ft"
      fn describe(d: &Distance) -> String {
          format!(
              "{:.1} {} = {:.1} {}",
              Metric::value(d),
              <Distance as Metric>::unit(),
              Imperial::value(d),
              <Distance as Imperial>::unit()
          )
      }
    harness: |
      #[test]
      fn describes_twelve_meters() {
          assert_eq!(describe(&Distance { meters: 12.0 }), "12.0 m = 39.4 ft", "describe(12 m)");
      }

      #[test]
      fn describes_zero() {
          assert_eq!(describe(&Distance { meters: 0.0 }), "0.0 m = 0.0 ft", "describe(0 m)");
      }

      #[test]
      fn describes_a_kilometer() {
          assert_eq!(describe(&Distance { meters: 1000.0 }), "1000.0 m = 3280.8 ft", "describe(1000 m)");
      }

      #[test]
      fn describes_half_a_meter() {
          assert_eq!(describe(&Distance { meters: 0.5 }), "0.5 m = 1.6 ft", "describe(0.5 m)");
      }
    require:
      - pattern: '<\s*Distance\s+as\s+Metric\s*>\s*::\s*unit'
        message: "Get the metric unit with `<Distance as Metric>::unit()`."
      - pattern: '<\s*Distance\s+as\s+Imperial\s*>\s*::\s*unit'
        message: "Get the imperial unit with `<Distance as Imperial>::unit()`."
    hints:
      - "`d.value()` is ambiguous. Call each one through its trait: `Metric::value(d)` and `Imperial::value(d)`."
      - "`unit()` has no `self`, so it needs the full form: `<Distance as Metric>::unit()`."
      - "`format!(\"{:.1} {} = {:.1} {}\", Metric::value(d), <Distance as Metric>::unit(), Imperial::value(d), <Distance as Imperial>::unit())`"
    more:
      - task: |
