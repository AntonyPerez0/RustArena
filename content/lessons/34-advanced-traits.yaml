              assert_eq!(parse_addr("localhost:8080"), Ok(("localhost".to_string(), 8080)), "parse_addr(\"localhost:8080\")");
          }

          #[test]
          fn an_address_needs_a_colon() {
              assert_eq!(parse_addr("localhost"), Err("missing ':' in localhost".to_string()), "parse_addr(\"localhost\")");
          }

          #[test]
          fn a_bad_port_inside_an_address_is_reported() {
              assert_eq!(parse_addr("db:abc"), Err("not a number: abc".to_string()), "parse_addr(\"db:abc\")");
          }
