      - task: |
          Write `fn join_all<T: ?Sized + Display>(items: &[&T], sep: &str) -> String`, which displays every item and joins them with `sep`. Thanks to `?Sized`, it works on a list of `&str` (`T = str`), on numbers, and on a mixed list of `&dyn Display`.
        seed: |
          use std::fmt::Display;

          // Write join_all here.
        solution: |
          use std::fmt::Display;

          // Write join_all here.
          fn join_all<T: ?Sized + Display>(items: &[&T], sep: &str) -> String {
              items.iter().map(|item| item.to_string()).collect::<Vec<String>>().join(sep)
          }
        harness: |
          #[test]
          fn joins_string_slices() {
              assert_eq!(join_all(&["a", "b", "c"], ", "), "a, b, c", "join_all(&[\"a\", \"b\", \"c\"], \", \")");
          }

          #[test]
          fn joins_numbers() {
              assert_eq!(join_all(&[&1, &2, &3], "-"), "1-2-3", "join_all(&[&1, &2, &3], \"-\")");
          }

          #[test]
          fn joins_a_mixed_list_of_trait_objects() {
              let items: [&dyn Display; 3] = [&1, &"two", &3.5];
              assert_eq!(join_all(&items, " | "), "1 | two | 3.5", "mixed &dyn Display");
          }

          #[test]
          fn an_empty_list_gives_an_empty_string() {
              assert_eq!(join_all::<str>(&[], ","), "", "join_all::<str>(&[], \",\")");
          }
