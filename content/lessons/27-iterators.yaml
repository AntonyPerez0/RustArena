          name: String,
          qty: u32,
          price: f64,
      }

      fn total_units(items: &[Item]) -> u32 {
          todo!()
      }

      fn out_of_stock(items: &[Item]) -> bool {
          todo!()
      }

      fn priciest(items: &[Item]) -> Option<&str> {
          todo!()
      }
    solution: |
      #[derive(Debug)]
      struct Item {
          name: String,
          qty: u32,
          price: f64,
      }

      fn total_units(items: &[Item]) -> u32 {
          items.iter().map(|i| i.qty).sum()
      }

      fn out_of_stock(items: &[Item]) -> bool {
          items.iter().any(|i| i.qty == 0)
      }

      fn priciest(items: &[Item]) -> Option<&str> {
          items
              .iter()
              .max_by(|a, b| a.price.total_cmp(&b.price))
              .map(|i| i.name.as_str())
      }
    forbid:
      - pattern: '\bfor\b|\bwhile\b|\bloop\b'
