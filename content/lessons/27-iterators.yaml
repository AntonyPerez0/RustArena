      - task: |
          Read a whole number `n` from input. Print the even numbers from `n` down to `0` on one line, separated by spaces, then `liftoff!` on the next line. For `10`:

          ```
          10 8 6 4 2 0
          liftoff!
          ```

          Build the line with a range, `rev()`, an adapter that keeps the evens, `map(|x| x.to_string())` and `collect::<Vec<String>>()` (or `let parts: Vec<String> = ...`), then `parts.join(" ")`. No loops.
        seed: |
          fn main() {
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).unwrap();
              let n: u32 = line.trim().parse().unwrap();
          }
        solution: |
          fn main() {
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).unwrap();
              let n: u32 = line.trim().parse().unwrap();
              let parts: Vec<String> = (0..=n).rev().filter(|x| x % 2 == 0).map(|x| x.to_string()).collect();
              println!("{}", parts.join(" "));
              println!("liftoff!");
          }
        require:
