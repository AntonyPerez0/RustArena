          fn splits_into_pages() {
              let ids = [1, 2, 3, 4, 5];
              let pages: Vec<&[i32]> = Pages { items: &ids, size: 2 }.collect();
              assert_eq!(pages, vec![&[1, 2][..], &[3, 4][..], &[5][..]], "pages of [1, 2, 3, 4, 5] with size 2");
          }

          #[test]
          fn empty_list_has_no_pages() {
              let mut p = Pages { items: &[], size: 3 };
              assert_eq!(p.next(), None, "first page of an empty list");
          }

          #[test]
          fn big_page_size_gives_one_page() {
              let ids = [1, 2, 3];
              let pages: Vec<&[i32]> = Pages { items: &ids, size: 10 }.collect();
              assert_eq!(pages, vec![&[1, 2, 3][..]], "pages of [1, 2, 3] with size 10");
          }

          #[test]
          fn counts_pages() {
              let ids: Vec<i32> = (1..=95).collect();
              assert_eq!(Pages { items: &ids, size: 10 }.count(), 10, "number of pages for 95 ids, size 10");
          }
        hints:
          - "If `self.items` is empty, return `None`. Otherwise the page length is `self.size.min(self.items.len())`."
          - "`let (page, rest) = self.items.split_at(n); self.items = rest; Some(page)`"
