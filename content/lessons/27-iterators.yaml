          assert_eq!(first_multiples(7, 0), Vec::<u32>::new(), "first_multiples(7, 0)");
      }
    hints:
      - "`(1..).map(|i| i * k)` is the endless list of multiples."
      - "Then `.filter(|m| m % 10 != 0)`, `.take(n)` and `.collect()`. The `take` has to come after the `filter`."
