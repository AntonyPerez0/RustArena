      - task: |
          An iterator remembers where it stopped. Using **one** iterator `it` over `lines`, call `next()` once to take the header line and print it as `header: ...`. Then loop over the *same* iterator with `for line in it` to print the remaining lines as `row: ...`:

          ```
          header: name,score
          row: ann,90
          row: bo,75
          ```
        seed: |
          fn main() {
              let lines = vec!["name,score", "ann,90", "bo,75"];
          }
        solution: |
          fn main() {
              let lines = vec!["name,score", "ann,90", "bo,75"];
              let mut it = lines.iter();
              if let Some(header) = it.next() {
