              assert_eq!(longest_streak(&[true, true, false, true, true, true, false]), 3, "longest_streak(T T F T T T F)");
          }

          #[test]
          fn no_days_means_no_streak() {
              assert_eq!(longest_streak(&[]), 0, "longest_streak(&[])");
          }

          #[test]
          fn all_false_means_no_streak() {
              assert_eq!(longest_streak(&[false, false]), 0, "longest_streak(F F)");
          }

          #[test]
          fn all_true_is_one_long_streak() {
              assert_eq!(longest_streak(&[true, true, true, true]), 4, "longest_streak(T T T T)");
          }

          #[test]
          fn streak_at_the_end_counts() {
              assert_eq!(longest_streak(&[true, false, true, true]), 2, "longest_streak(T F T T)");
          }
