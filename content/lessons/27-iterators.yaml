      - task: |
          A habit tracker stores one `bool` per day: did you practice? Write `fn longest_streak(days: &[bool]) -> usize` that returns the longest run of `true` days in a row. Use `fold` with a tuple accumulator `(current_run, best_run)`, no loops. For `[true, true, false, true, true, true, false]` the answer is `3`.
        seed: |
          fn longest_streak(days: &[bool]) -> usize {
              todo!()
          }
        solution: |
          fn longest_streak(days: &[bool]) -> usize {
              days.iter()
                  .fold((0, 0), |(current, best), &practiced| {
                      let current = if practiced { current + 1 } else { 0 };
                      (current, best.max(current))
                  })
                  .1
          }
