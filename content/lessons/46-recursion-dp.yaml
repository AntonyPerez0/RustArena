id: recursion-dp
title: Recursion and Dynamic Programming
phase: "Algorithms and data structures"
summary: "Functions that call themselves, backtracking through choices, and dynamic programming (memoization with HashMap and bottom-up tables) for the classic problems: coin change, longest common subsequence, edit distance, grid paths and knapsack."
roadmap: [Recursion, Dynamic Programming, Backtracking]
steps:
  - title: "Recursion: a function that calls itself"
    id: recursion-dp-1
    text: |
      A **recursive** function solves a problem by calling itself on a **smaller** version of the same problem. Every recursive function has two parts:

      - a **base case**: an input small enough to answer directly, without recursing;
      - a **recursive case**: shrink the problem, call yourself, and build the answer from the result.

      ```rust run
      fn factorial(n: u64) -> u64 {
          if n <= 1 {
              1 // base case
          } else {
              n * factorial(n - 1) // recursive case: a smaller problem
          }
      }

      fn countdown(n: u32) {
          if n == 0 {
              println!("liftoff!");
              return;
          }
          println!("{n}...");
          countdown(n - 1);
      }

      fn main() {
          println!("5! = {}", factorial(5));
          println!("20! = {}", factorial(20));
          countdown(3);
      }
      ```

      ```output
      5! = 120
      20! = 2432902008176640000
      3...
      2...
      1...
      liftoff!
      ```

      ### The call stack

      Each call gets its own **stack frame** holding its parameters and local variables. `factorial(5)` can't finish until `factorial(4)` returns, which waits for `factorial(3)`, and so on: five frames stacked up, then unwinding as each returns its answer to the one below. The depth of recursion is how many frames pile up at once.

      The stack is small (8 MB for the main thread on Linux) and Rust doesn't promise **tail-call optimization** (reusing the frame when the recursive call is the last thing a function does). Recursing a few hundred thousand levels deep crashes the program with ``thread 'main' (4242) has overflowed its stack``. That's an abort, not a panic you can recover from. So:

      - Recursion is a great fit when the depth stays small: halving problems (depth log n), trees, nested folders, parsing nested expressions, trying choices.
      - For simple "do this for each of n items" work, use a loop or an iterator.

      ### Recursion on slices

      Slice patterns (from the patterns module) make recursive code on lists read like its definition: "the total of an empty list is 0; otherwise it's the first price plus the total of the rest":

      ```rust run
      fn total(prices: &[u32]) -> u32 {
          match prices {
              [] => 0,
              [first, rest @ ..] => first + total(rest),
          }
      }

      fn main() {
          println!("{}", total(&[250, 199, 1200]));
      }
      ```

      ```output
      1649
      ```

      (This one is just for illustration: `prices.iter().sum()` is the idiomatic way, and doesn't use one stack frame per item.)

      ### Common mistakes

      - **No base case, or one the recursion never reaches.** The calls never stop and the stack overflows. Rust even warns about some of these: `function cannot return without recursing`.
      - **Not shrinking the problem.** `f(n)` calling `f(n)` (or `f(n + 1)`) never reaches the base case.
      - **Unsigned underflow.** With `u32`/`u64`, a base case of `n == 1` lets `f(0)` compute `0 - 1`, which panics with `attempt to subtract with overflow`. Make the base case cover the smallest inputs.

      **Your turn:** write `fn sum_digits(n: u64) -> u64` recursively, without loops: the sum of the decimal digits of `n` (`sum_digits(1234)` is 10). The last digit is `n % 10` and the rest of the number is `n / 10`; the sum of the digits of 0 is 0.
    seed: |
      fn sum_digits(n: u64) -> u64 {
          todo!()
      }
    solution: |
      fn sum_digits(n: u64) -> u64 {
          if n == 0 {
              0
          } else {
              n % 10 + sum_digits(n / 10)
          }
      }
    require:
      - pattern: 'fn sum_digits[\s\S]*sum_digits\s*\('
        message: "`sum_digits` should call itself."
    forbid:
      - pattern: '\bwhile\b|\bfor\b|\bloop\b|chars|to_string'
        message: Use recursion and arithmetic (`% 10`, `/ 10`), not a loop or a string.
    hints:
      - "The base case is `n == 0`, whose digit sum is 0."
      - "Otherwise the answer is the last digit plus the digit sum of the rest: `n % 10 + sum_digits(n / 10)`."
    harness: |
      #[test]
      fn adds_the_digits() {
          assert_eq!(sum_digits(1234), 10, "sum_digits(1234)");
      }

      #[test]
      fn zero_has_digit_sum_zero() {
          assert_eq!(sum_digits(0), 0, "sum_digits(0)");
      }

      #[test]
      fn a_single_digit_is_itself() {
          assert_eq!(sum_digits(7), 7, "sum_digits(7)");
      }

      #[test]
      fn zeros_inside_the_number_count_as_zero() {
          assert_eq!(sum_digits(90_000_501), 15, "sum_digits(90000501)");
      }

      #[test]
      fn handles_the_largest_u64() {
          assert_eq!(sum_digits(u64::MAX), 87, "sum_digits(u64::MAX)");
      }
    more:
      - task: |
          Write `fn is_palindrome(chars: &[char]) -> bool` recursively with slice patterns, no loops: a slice with zero or one characters is a palindrome; a longer one is a palindrome if its first and last characters are equal **and** the middle part is a palindrome. The pattern `[first, middle @ .., last]` splits off both ends at once.
        seed: |
          fn is_palindrome(chars: &[char]) -> bool {
              todo!()
          }
        solution: |
          fn is_palindrome(chars: &[char]) -> bool {
              match chars {
                  [] | [_] => true,
                  [first, middle @ .., last] => first == last && is_palindrome(middle),
              }
          }
        require:
          - pattern: 'fn is_palindrome[\s\S]*is_palindrome\s*\('
            message: "`is_palindrome` should call itself on the middle part."
        forbid:
          - pattern: '\bwhile\b|\bfor\b|\bloop\b|\.rev\(|\.iter\('
            message: Solve it with recursion and slice patterns, no loops or iterators.
        harness: |
          fn check(word: &str) -> bool {
              let chars: Vec<char> = word.chars().collect();
              is_palindrome(&chars)
          }

          #[test]
          fn accepts_odd_length_palindromes() {
              assert_eq!(check("racecar"), true, "is_palindrome(\"racecar\")");
          }

          #[test]
          fn accepts_even_length_palindromes() {
              assert_eq!(check("abba"), true, "is_palindrome(\"abba\")");
          }

          #[test]
          fn rejects_non_palindromes() {
              assert_eq!(check("abca"), false, "is_palindrome(\"abca\")");
              assert_eq!(check("rust"), false, "is_palindrome(\"rust\")");
          }

          #[test]
          fn empty_and_single_are_palindromes() {
              assert_eq!(check(""), true, "is_palindrome(\"\")");
              assert_eq!(check("x"), true, "is_palindrome(\"x\")");
          }

          #[test]
          fn works_with_accented_letters() {
              assert_eq!(check("ñañ"), true, "is_palindrome(\"ñañ\")");
          }
        hints:
          - "`match chars { [] | [_] => true, ... }` covers the base cases."
          - "`[first, middle @ .., last] => first == last && is_palindrome(middle)`"
      - task: |
          **Fast exponentiation.** Hashing and cryptography need `base` to the power `exp`, modulo `m`, for exponents like 10^18. Multiplying `exp` times would take centuries. Recursion halves the exponent instead:

          - `exp == 0`: the answer is `1 % m`
          - otherwise compute `half = pow_mod(base, exp / 2, m)`; the answer is `half * half % m`, times one more `base % m` (then `% m`) if `exp` is odd

          That's O(log exp) work: about 60 halvings (at most two multiplications each) for 10^18. Write `fn pow_mod(base: u64, exp: u64, m: u64) -> u64`. The modulus is between 1 and 1,000,000,007, so the product of two numbers below `m` fits in a `u64`. Reduce `base` with `% m` before multiplying, since it can be bigger than `m`.
        seed: |
          fn pow_mod(base: u64, exp: u64, m: u64) -> u64 {
              todo!()
          }
        solution: |
          fn pow_mod(base: u64, exp: u64, m: u64) -> u64 {
              if exp == 0 {
                  return 1 % m;
              }
              let half = pow_mod(base, exp / 2, m);
              let square = half * half % m;
              if exp % 2 == 1 { square * (base % m) % m } else { square }
          }
        forbid:
          - pattern: '\.pow\(|\bfor\b|\bwhile\b|\bloop\b'
            message: "Halve the exponent recursively: no loops and no `.pow()`."
        harness: |
          #[test]
          fn computes_a_small_power() {
              assert_eq!(pow_mod(2, 10, 1000), 24, "pow_mod(2, 10, 1000)");
          }

          #[test]
          fn anything_to_the_zero_is_one() {
              assert_eq!(pow_mod(5, 0, 13), 1, "pow_mod(5, 0, 13)");
          }

          #[test]
          fn modulo_one_is_always_zero() {
              assert_eq!(pow_mod(5, 0, 1), 0, "pow_mod(5, 0, 1)");
              assert_eq!(pow_mod(5, 3, 1), 0, "pow_mod(5, 3, 1)");
          }

          #[test]
          fn handles_a_large_base() {
              assert_eq!(pow_mod(u64::MAX, 2, 1_000_000_007), 114_944_269, "pow_mod(u64::MAX, 2, 1000000007)");
          }

          #[test]
          fn handles_large_exponents_quickly() {
              assert_eq!(pow_mod(3, 200, 1_000_000_007), 136_318_165, "pow_mod(3, 200, 1000000007)");
              assert_eq!(pow_mod(7, 1_000_000_000_000_000_000, 1_000_000_007), 259_616_729, "pow_mod(7, 10^18, 1000000007)");
          }
        hints:
          - "Base case: `if exp == 0 { return 1 % m; }` (`1 % m` makes the `m == 1` case come out as 0)."
          - "`let half = pow_mod(base, exp / 2, m); let square = half * half % m;`"
          - "If `exp % 2 == 1`, return `square * (base % m) % m`; otherwise `square`."

  - title: Branching recursion and backtracking
    id: recursion-dp-2
    text: |
      When a function calls itself **more than once**, the calls branch out into a **recursion tree**. The classic example is Fibonacci: `fib(n) = fib(n - 1) + fib(n - 2)`. Written directly, it's a beautiful one-liner and a terrible program. Count the calls:

      ```rust run
      fn fib(n: u32, calls: &mut u64) -> u64 {
          *calls += 1;
          if n < 2 {
              return n as u64;
          }
          fib(n - 1, calls) + fib(n - 2, calls)
      }

      fn main() {
          for n in [10, 20, 30] {
              let mut calls = 0;
              let value = fib(n, &mut calls);
              println!("fib({n}) = {value} after {calls} calls");
          }
      }
      ```

      ```output
      fib(10) = 55 after 177 calls
      fib(20) = 6765 after 21891 calls
      fib(30) = 832040 after 2692537 calls
      ```

      Each extra n multiplies the work by about 1.6: that's **exponential**, O(1.6ⁿ). `fib(60)` this way would take longer than you want to wait. The cause is that the same values are computed over and over (`fib(28)` is computed twice for `fib(30)`, `fib(27)` three times...). The next step fixes that.

      ### Backtracking: exploring every choice

      Sometimes branching is the point: you really do want to try every combination of choices, like every set of toppings, every team, every move. **Backtracking** does it with one shared, growing "path":

      1. **choose**: add an option to the path,
      2. **explore**: recurse to make the remaining choices,
      3. **un-choose**: remove it again, so the next branch starts clean.

      ```rust run
      fn explore<'a>(toppings: &[&'a str], i: usize, chosen: &mut Vec<&'a str>) {
          if i == toppings.len() {
              println!("{{{}}}", chosen.join(", "));
              return;
          }
          chosen.push(toppings[i]); // choose: take toppings[i]
          explore(toppings, i + 1, chosen); // explore with it
          chosen.pop(); // un-choose
          explore(toppings, i + 1, chosen); // explore without it
      }

      fn main() {
          explore(&["cheese", "olives", "basil"], 0, &mut Vec::new());
      }
      ```

      ```output
      {cheese, olives, basil}
      {cheese, olives}
      {cheese, basil}
      {cheese}
      {olives, basil}
      {olives}
      {basil}
      {}
      ```

      Each item is either taken or not, so n items give 2ⁿ subsets: fine for 20 items (a million), hopeless for 60. The `'a` lifetime says the chosen names borrow from the same place as `toppings`, so the path can hold `&str` without copying any strings.

      **Pruning** makes backtracking practical: stop exploring a branch as soon as it can't lead to an answer (the budget is already exceeded, not enough items remain to fill a team). A pruned search can be thousands of times faster than the full tree.

      ### Common mistakes

      - **Forgetting to un-choose.** Without the `pop()`, later branches see leftovers from earlier ones.
      - **Copying the whole path at every step.** Clone the path only when you record a finished answer.
      - **Branching recursion on big inputs.** 2ⁿ or n! grows absurdly fast. If the same subproblems repeat, you need memoization (next step), not a faster computer.

      **Your turn:** a customer has gift cards with the given values and wants to spend exactly `target`. Write `fn count_subsets_with_sum(cards: &[u32], target: u32) -> usize`: the number of different sets of cards (each card used at most once; equal values on different cards count as different cards) whose values add up to exactly `target`. The empty set adds up to 0. Use recursion that, for each card, counts the ways **with** it and **without** it, and prune: never take a card bigger than what's left. The tests go up to 20 cards.
    seed: |
      fn count_subsets_with_sum(cards: &[u32], target: u32) -> usize {
          todo!()
      }
    solution: |
      fn count_subsets_with_sum(cards: &[u32], target: u32) -> usize {
          match cards {
              [] => usize::from(target == 0),
              [first, rest @ ..] => {
                  let without = count_subsets_with_sum(rest, target);
                  let with = if *first <= target { count_subsets_with_sum(rest, target - first) } else { 0 };
                  without + with
              }
          }
      }
    hints:
      - "With no cards left, there's exactly one way if `target == 0` (take nothing more) and none otherwise."
      - "Otherwise split off the first card (`[first, rest @ ..]` or an index): count the sets without it, `count_subsets_with_sum(rest, target)`, plus the sets with it."
      - "Only take the card when `*first <= target`, then recurse with `target - first`. Add the two counts."
    harness: |
      #[test]
      fn counts_three_ways_to_spend_30() {
          assert_eq!(count_subsets_with_sum(&[5, 10, 15, 20, 25], 30), 3, "count_subsets_with_sum(&[5, 10, 15, 20, 25], 30)");
      }

      #[test]
      fn equal_cards_are_different_cards() {
          assert_eq!(count_subsets_with_sum(&[1, 1, 1], 2), 3, "count_subsets_with_sum(&[1, 1, 1], 2)");
      }

      #[test]
      fn a_target_of_zero_has_one_way() {
          assert_eq!(count_subsets_with_sum(&[4, 9], 0), 1, "count_subsets_with_sum(&[4, 9], 0)");
          assert_eq!(count_subsets_with_sum(&[], 0), 1, "count_subsets_with_sum(&[], 0)");
      }

      #[test]
      fn unreachable_targets_have_no_ways() {
          assert_eq!(count_subsets_with_sum(&[], 5), 0, "count_subsets_with_sum(&[], 5)");
          assert_eq!(count_subsets_with_sum(&[2, 4], 5), 0, "count_subsets_with_sum(&[2, 4], 5)");
      }

      #[test]
      fn searches_twenty_cards() {
          let cards: Vec<u32> = (1..=20).collect();
          assert_eq!(count_subsets_with_sum(&cards, 105), 15_272, "count_subsets_with_sum(1..=20, 105)");
      }
    more:
      - task: |
          The coach picks teams of exactly `k` players. Write `fn team_options(players: &[&str], k: usize) -> Vec<String>` that lists every team, each written as the names joined with `+` in the players' order, with the teams in order too: for `["ana", "ben", "cy"]` and `k = 2` that's `["ana+ben", "ana+cy", "ben+cy"]`. `k` is at least 1; if it's bigger than the number of players, there are no teams.

          Use backtracking with a `Vec<&str>` path: for each player from a start position, choose them, explore the rest, un-choose. Prune when there aren't enough players left to fill the team.
        seed: |
          fn team_options(players: &[&str], k: usize) -> Vec<String> {
              todo!()
          }
        solution: |
          fn pick<'a>(players: &[&'a str], start: usize, k: usize, team: &mut Vec<&'a str>, out: &mut Vec<String>) {
              if team.len() == k {
                  out.push(team.join("+"));
                  return;
              }
              let still_needed = k - team.len();
              for i in start..players.len() {
                  if players.len() - i < still_needed {
                      break;
                  }
                  team.push(players[i]);
                  pick(players, i + 1, k, team, out);
                  team.pop();
              }
          }

          fn team_options(players: &[&str], k: usize) -> Vec<String> {
              let mut out = Vec::new();
              pick(players, 0, k, &mut Vec::new(), &mut out);
              out
          }
        harness: |
          #[test]
          fn lists_all_pairs_in_order() {
              assert_eq!(team_options(&["ana", "ben", "cy"], 2), vec!["ana+ben", "ana+cy", "ben+cy"], "team_options([ana, ben, cy], 2)");
          }

          #[test]
          fn lists_teams_of_three() {
              assert_eq!(team_options(&["a", "b", "c", "d"], 3), vec!["a+b+c", "a+b+d", "a+c+d", "b+c+d"], "team_options([a, b, c, d], 3)");
          }

          #[test]
          fn a_team_of_everyone_has_one_option() {
              assert_eq!(team_options(&["x", "y"], 2), vec!["x+y"], "team_options([x, y], 2)");
          }

          #[test]
          fn too_few_players_means_no_teams() {
              assert_eq!(team_options(&["solo"], 2), Vec::<String>::new(), "team_options([solo], 2)");
          }

          #[test]
          fn counts_teams_of_three_from_twenty() {
              let names: Vec<String> = (0..20).map(|i| format!("p{i}")).collect();
              let players: Vec<&str> = names.iter().map(|s| s.as_str()).collect();
              let teams = team_options(&players, 3);
              assert_eq!(teams.len(), 1140, "number of teams of 3 from 20 players");
              assert_eq!(teams[0], "p0+p1+p2", "first team");
              assert_eq!(teams[1139], "p17+p18+p19", "last team");
          }
        hints:
          - "Write a helper `fn pick<'a>(players: &[&'a str], start: usize, k: usize, team: &mut Vec<&'a str>, out: &mut Vec<String>)`."
          - "When `team.len() == k`, push `team.join(\"+\")` and return. Otherwise loop `i` from `start`: push `players[i]`, recurse with `i + 1`, pop."
          - "Prune with `if players.len() - i < k - team.len() { break; }`: not enough players remain."
      - task: |
          **The N-Queens puzzle**, a backtracking classic: place `n` queens on an `n` by `n` chessboard so that no two attack each other (no two share a row, a column or a diagonal). Write `fn n_queens(n: usize) -> usize` that counts the solutions. There are 92 for the standard 8 by 8 board.

          Place one queen per row, recursively. Keep three `Vec<bool>` of "taken" markers: columns (`n`), diagonals going one way (`row + col`, `2n` of them) and the other way (`row + n - 1 - col`). For each column of the current row that is free on all three, mark, recurse into the next row, unmark. Reaching row `n` means you found a solution.
        seed: |
          fn n_queens(n: usize) -> usize {
              todo!()
          }
        solution: |
          fn place(n: usize, row: usize, cols: &mut [bool], diag: &mut [bool], anti: &mut [bool]) -> usize {
              if row == n {
                  return 1;
              }
              let mut count = 0;
              for col in 0..n {
                  let (d, a) = (row + col, row + n - 1 - col);
                  if cols[col] || diag[d] || anti[a] {
                      continue;
                  }
                  cols[col] = true;
                  diag[d] = true;
                  anti[a] = true;
                  count += place(n, row + 1, cols, diag, anti);
                  cols[col] = false;
                  diag[d] = false;
                  anti[a] = false;
              }
              count
          }

          fn n_queens(n: usize) -> usize {
              place(n, 0, &mut vec![false; n], &mut vec![false; 2 * n], &mut vec![false; 2 * n])
          }
        harness: |
          #[test]
          fn the_standard_board_has_92() {
              assert_eq!(n_queens(8), 92, "n_queens(8)");
          }

          #[test]
          fn small_boards() {
              assert_eq!(n_queens(1), 1, "n_queens(1)");
              assert_eq!(n_queens(4), 2, "n_queens(4)");
              assert_eq!(n_queens(6), 4, "n_queens(6)");
          }

          #[test]
          fn two_and_three_have_no_solution() {
              assert_eq!(n_queens(2), 0, "n_queens(2)");
              assert_eq!(n_queens(3), 0, "n_queens(3)");
          }

          #[test]
          fn ten_by_ten_has_724() {
              assert_eq!(n_queens(10), 724, "n_queens(10)");
          }
        hints:
          - "Write a helper `place(n, row, cols, diag, anti) -> usize` that returns 1 when `row == n`."
          - "In row `row`, a queen in column `col` uses diagonal `row + col` and anti-diagonal `row + n - 1 - col`. Skip the column if any of the three is taken."
          - "Otherwise mark all three, add `place(n, row + 1, ...)` to the count, then unmark them (that's the un-choose)."

  - title: Memoization with a HashMap
    id: recursion-dp-3
    text: |
      The slow Fibonacci recomputes the same values again and again. **Memoization** fixes that: the first time you compute an answer for some input, store it in a HashMap (the **memo**); every later call with that input just looks it up. Now each different input is computed only once.

      ```rust run
      use std::collections::HashMap;

      fn fib(n: u64, memo: &mut HashMap<u64, u64>) -> u64 {
          if n < 2 {
              return n;
          }
          if let Some(&known) = memo.get(&n) {
              return known;
          }
          let value = fib(n - 1, memo) + fib(n - 2, memo);
          memo.insert(n, value);
          value
      }

      fn main() {
          let mut memo = HashMap::new();
          println!("fib(50) = {}", fib(50, &mut memo));
          println!("fib(90) = {}", fib(90, &mut memo));
          println!("memo holds {} answers", memo.len());
      }
      ```

      ```output
      fib(50) = 12586269025
      fib(90) = 2880067194370816120
      memo holds 89 answers
      ```

      `fib(90)` the slow way would take about 10¹⁹ calls. With the memo it's 89 entries and a couple of hundred calls: O(n).

      This is **dynamic programming** (DP), top-down style. It applies when a problem has:

      - **overlapping subproblems**: the same smaller questions come up many times, and
      - **optimal substructure**: the answer can be built from the answers to smaller questions.

      ### Passing the memo around

      Rust has no convenient global mutable variables, and that's fine: pass the memo down as `&mut HashMap`. A common shape is a public function that creates the memo and a helper that does the work:

      ```rust
      fn count(n: u64) -> u64 {
          count_with(n, &mut HashMap::new())
      }
      ```

      The key must describe the **whole** subproblem. If the answer depends on a position in a grid, the key is the position: `HashMap<(usize, usize), u64>`. Tuples of `Hash + Eq` types work as keys.

      ### Common mistakes

      - **Checking the memo after recursing.** Look up first, compute only on a miss, store before returning.
      - **A new HashMap inside the recursive function.** Each call gets an empty memo and nothing is ever reused.
      - **`entry().or_insert_with` with a recursive closure.** It looks neat but can't compile: the entry holds a mutable borrow of the map while the closure needs another one.

      ```rust compile_fail
      use std::collections::HashMap;

      fn fib(n: u64, memo: &mut HashMap<u64, u64>) -> u64 {
          if n < 2 {
              return n;
          }
          *memo.entry(n).or_insert_with(|| fib(n - 1, memo) + fib(n - 2, memo))
      }

      fn main() {
