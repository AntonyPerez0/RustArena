      **Your turn:** a crab climbs a staircase of `n` steps, taking 1, 2 or 3 steps at a time. In how many different ways can it reach the top? `count_ways(4)` is 7 (1+1+1+1, 1+1+2, 1+2+1, 2+1+1, 2+2, 1+3, 3+1). There's 1 way to climb 0 steps (do nothing). The number of ways for `n` is the sum of the ways for `n - 1`, `n - 2` and `n - 3` (whichever exist). Write the memoized helper `ways_from`. The tests ask for `n = 70`, which takes about 10¹⁸ calls without the memo.
    seed: |
      use std::collections::HashMap;

      fn ways_from(n: u64, memo: &mut HashMap<u64, u64>) -> u64 {
