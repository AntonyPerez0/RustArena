          }

          #[test]
          fn a_single_row_visits_every_cell() {
              assert_eq!(min_path_cost(&[vec![2, 4, 6]]), 12, "min_path_cost([[2, 4, 6]])");
          }

          #[test]
          fn a_single_column_visits_every_cell() {
              assert_eq!(min_path_cost(&[vec![3], vec![1], vec![2]]), 6, "min_path_cost([[3], [1], [2]])");
          }

          #[test]
          fn an_empty_grid_costs_nothing() {
              assert_eq!(min_path_cost(&[]), 0, "min_path_cost([])");
          }

          #[test]
          fn crosses_a_300_by_300_field_quickly() {
              let grid: Vec<Vec<u32>> = (0..300).map(|r| (0..300).map(|c| ((r * 31 + c * 17) % 10) as u32).collect()).collect();
              assert_eq!(min_path_cost(&grid), 1377, "min_path_cost(300 by 300 field)");
          }
        hints:
