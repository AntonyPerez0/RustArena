          let items: Vec<(usize, u32)> = (0..150).map(|i| (i * 37 % 1000 + 50, (i * 53 % 500 + 1) as u32)).collect();
          assert_eq!(best_value(&items, 20_000), 20_732, "best_value(150 items, 20000)");
      }
    more:
      - task: |
          Two delivery vans must carry exactly the same total weight. Given the parcel weights, can they be split into two groups of equal total? Write `fn can_split_evenly(weights: &[u32]) -> bool` (no parcels: yes, two empty vans).

          If the total is odd, it's impossible. Otherwise it's a knapsack question with booleans: can some subset reach exactly half the total? Keep `can[s]` for every sum `s` up to half, start with `can[0] = true`, and for each weight go through the sums **from high to low**: `can[s] = can[s] || can[s - w]`. The tests include over 100 parcels.
        seed: |
          fn can_split_evenly(weights: &[u32]) -> bool {
              todo!()
          }
        solution: |
          fn can_split_evenly(weights: &[u32]) -> bool {
              let total: u32 = weights.iter().sum();
              if total % 2 == 1 {
                  return false;
              }
              let half = (total / 2) as usize;
              // can[s] = some of the parcels seen so far add up to exactly s
              let mut can = vec![false; half + 1];
              can[0] = true;
              for &w in weights {
                  let w = w as usize;
                  for s in (w..=half).rev() {
                      if can[s - w] {
                          can[s] = true;
                      }
                  }
              }
              can[half]
          }
        harness: |
          #[test]
          fn splits_when_possible() {
              assert_eq!(can_split_evenly(&[1, 5, 11, 5]), true, "can_split_evenly(&[1, 5, 11, 5])");
              assert_eq!(can_split_evenly(&[3, 3, 3, 4, 5]), true, "can_split_evenly(&[3, 3, 3, 4, 5])");
          }

          #[test]
          fn an_odd_total_cannot_split() {
              assert_eq!(can_split_evenly(&[1, 2, 3, 5]), false, "can_split_evenly(&[1, 2, 3, 5])");
          }

          #[test]
          fn an_even_total_is_not_always_enough() {
              assert_eq!(can_split_evenly(&[2, 2, 3, 5]), false, "can_split_evenly(&[2, 2, 3, 5])");
          }

          #[test]
          fn no_parcels_split_evenly() {
              assert_eq!(can_split_evenly(&[]), true, "can_split_evenly(&[])");
          }

          #[test]
          fn handles_many_parcels_quickly() {
              let weights: Vec<u32> = (0..100u32).map(|i| i * 37 % 1000 + 1).collect();
              assert_eq!(can_split_evenly(&weights), true, "can_split_evenly(100 parcels)");
              let mut lopsided = vec![2u32; 100];
              lopsided.push(100_000);
              assert_eq!(can_split_evenly(&lopsided), false, "can_split_evenly(100 small parcels and one huge one)");
          }
        hints:
          - "Return `false` for an odd total. Otherwise `half = total / 2`, `let mut can = vec![false; half + 1]; can[0] = true;`"
          - "For each weight `w`, loop `s` over `(w..=half).rev()` and set `can[s] = true` when `can[s - w]` is true."
          - "The answer is `can[half]`."
      - task: |
          Now the hiker wants to know **which** items to pack. Standard input has the capacity on the first line, then one item per line: `name weight value`. Print the chosen items in input order, the total weight and the total value:

          ```
          take: stove, camera
          weight: 10/10
          value: 40
          ```

          If nothing fits, the first line is `take: nothing` (the `weight:` and `value:` lines still follow, with 0s). The tests always have exactly one best choice.

          Build the full 2D table from the lesson, then walk it backwards: starting at `i = n` and `w = capacity`, if `best[i][w]` differs from `best[i - 1][w]`, item `i - 1` was taken (subtract its weight from `w`). Reverse the list you collect to get input order.
        seed: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let mut lines = input.lines();
              let capacity: usize = lines.next().unwrap_or("0").trim().parse().expect("capacity");
          }
        solution: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let mut lines = input.lines();
              let capacity: usize = lines.next().unwrap_or("0").trim().parse().expect("capacity");
              let mut items: Vec<(&str, usize, u32)> = Vec::new();
              for line in lines {
                  let parts: Vec<&str> = line.split_whitespace().collect();
                  if let [name, weight, value] = parts[..] {
                      items.push((name, weight.parse().expect("weight"), value.parse().expect("value")));
                  }
              }
              let n = items.len();
              let mut best = vec![vec![0u32; capacity + 1]; n + 1];
              for i in 1..=n {
                  let (_, weight, value) = items[i - 1];
                  for w in 0..=capacity {
                      best[i][w] = best[i - 1][w];
                      if weight <= w {
                          best[i][w] = best[i][w].max(best[i - 1][w - weight] + value);
                      }
                  }
              }
              let mut chosen = Vec::new();
              let mut w = capacity;
              for i in (1..=n).rev() {
                  if best[i][w] != best[i - 1][w] {
                      chosen.push(i - 1);
                      w -= items[i - 1].1;
                  }
              }
              chosen.reverse();
              let names: Vec<&str> = chosen.iter().map(|&i| items[i].0).collect();
              let weight: usize = chosen.iter().map(|&i| items[i].1).sum();
              if names.is_empty() {
                  println!("take: nothing");
              } else {
                  println!("take: {}", names.join(", "));
              }
              println!("weight: {weight}/{capacity}");
              println!("value: {}", best[n][capacity]);
          }
        hints:
          - "Parse each item line into `(name, weight, value)` and build the 2D table exactly as in the lesson's example."
          - "Walk back with `for i in (1..=n).rev()`: when `best[i][w] != best[i - 1][w]`, item `i - 1` is in the backpack, so record it and do `w -= its weight`."
          - "Reverse the chosen indices, join their names with `\", \"`, and sum their weights for the `weight:` line."
        tests:
          - stdin: "10\ntent 6 30\nstove 5 20\ncamera 5 20\n"
            expect: "take: stove, camera\nweight: 10/10\nvalue: 40"
          - stdin: "15\nmap 1 15\nwater 8 40\nfood 6 35\nrope 4 10\nknife 1 12\n"
            hidden: true
