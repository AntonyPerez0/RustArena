          }

          #[test]
          fn suggests_a_typo_fix() {
              assert_eq!(edit_distance("stauts", "status"), 2, "edit_distance(\"stauts\", \"status\")");
              assert_eq!(edit_distance("flaw", "lawn"), 2, "edit_distance(\"flaw\", \"lawn\")");
          }

          #[test]
          fn empty_text_needs_one_edit_per_character() {
              assert_eq!(edit_distance("", "abc"), 3, "edit_distance(\"\", \"abc\")");
              assert_eq!(edit_distance("abc", ""), 3, "edit_distance(\"abc\", \"\")");
          }

          #[test]
          fn identical_texts_need_nothing() {
              assert_eq!(edit_distance("cargo", "cargo"), 0, "edit_distance(\"cargo\", \"cargo\")");
          }

          #[test]
          fn counts_characters_not_bytes() {
              assert_eq!(edit_distance("café", "cafe"), 1, "edit_distance(\"café\", \"cafe\")");
          }

          #[test]
          fn compares_two_1500_character_texts_quickly() {
              let a: String = (0..1500).map(|i| (b'a' + (i * 7 % 26) as u8) as char).collect();
              let b: String = (0..1500).map(|i| (b'a' + (i * 5 % 26) as u8) as char).collect();
              assert_eq!(edit_distance(&a, &b), 1384, "edit_distance(two 1,500-character texts)");
          }
