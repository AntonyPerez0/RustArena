  - title: Tuple structs, newtypes and unit structs
    id: structs-5
    text: |
      Sometimes naming every field is overkill. A **tuple struct** has a name but its fields are only numbered, like a tuple:

      ```rust run
      struct Rgb(u8, u8, u8);

      fn main() {
          let orange = Rgb(255, 140, 0);
          println!("red {}, green {}, blue {}", orange.0, orange.1, orange.2);
      }
      ```

      ```output
      red 255, green 140, blue 0
      ```

      Note the definition ends with `;` (there are no braces), and you create one like a function call: `Rgb(255, 140, 0)`.

      ### Newtypes: the same number, different meanings

      The most useful tuple struct has just one field. Wrapping a plain type to give it a meaning is called the **newtype** pattern:

      ```rust run
      struct Meters(f64);
      struct Feet(f64);

      fn to_meters(length: Feet) -> Meters {
          Meters(length.0 * 0.3048)
      }

      fn climb(height: Meters) {
          println!("climbing {:.1} m", height.0);
      }

      fn main() {
          let wall = Feet(100.0);
          climb(to_meters(wall));
          climb(Meters(8848.0));
      }
      ```

      ```output
      climbing 30.5 m
      climbing 8848.0 m
      ```

      `Meters` and `Feet` both hold an `f64`, but to the compiler they are **different types**. You can't pass feet where meters are expected:

      ```rust compile_fail
      struct Meters(f64);
      struct Feet(f64);

      fn climb(height: Meters) -> f64 {
          height.0
      }

      fn main() {
          let wall = Feet(30.0);
          println!("{}", climb(wall));
      }
      ```

      ```error
      error[E0308]: mismatched types
      ```

      This is not a small thing. In 1999 NASA lost the Mars Climate Orbiter because one program produced numbers in pound-force seconds and another read them as newton-seconds. Both were just floating point numbers, so nothing caught it. With newtypes, that mix-up is a compile error. The same idea at work: `UserId(u64)` and `OrderId(u64)` so you can never pass an order id to `delete_user`, or `Cents(u32)` so nobody adds dollars to cents. A newtype costs nothing at run time: in memory it's exactly the value inside.

      The price: a newtype doesn't do arithmetic or printing until you teach it (`Meters(3.0) * 2.0` is ``error[E0369]: cannot multiply `Meters` by `{float}` ``). For now, reach inside with `.0`; the standard library traits module shows how to add operators.

      ### Unit structs

      A struct can even have no fields at all: `struct Ping;`. This **unit struct** holds no data and takes no memory. It's useful as a marker, or as a type to hang behavior on with traits, later in the course. You create one by writing its name: `let p = Ping;`.

      **Your turn:** write `fn to_fahrenheit(c: Celsius) -> Fahrenheit` using the formula F = C × 9 / 5 + 32.
    seed: |
      #[derive(Debug, PartialEq)]
      struct Celsius(f64);

      #[derive(Debug, PartialEq)]
      struct Fahrenheit(f64);

      fn to_fahrenheit(c: Celsius) -> Fahrenheit {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct Celsius(f64);

      #[derive(Debug, PartialEq)]
      struct Fahrenheit(f64);

      fn to_fahrenheit(c: Celsius) -> Fahrenheit {
          Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)
      }
    harness: |
      #[test]
      fn boiling_water() {
          assert_eq!(to_fahrenheit(Celsius(100.0)), Fahrenheit(212.0), "to_fahrenheit(Celsius(100.0))");
      }

      #[test]
      fn freezing_water() {
          assert_eq!(to_fahrenheit(Celsius(0.0)), Fahrenheit(32.0), "to_fahrenheit(Celsius(0.0))");
      }

      #[test]
      fn minus_forty_is_the_same_in_both() {
          assert_eq!(to_fahrenheit(Celsius(-40.0)), Fahrenheit(-40.0), "to_fahrenheit(Celsius(-40.0))");
      }

      #[test]
      fn a_warm_day() {
          assert_eq!(to_fahrenheit(Celsius(25.0)), Fahrenheit(77.0), "to_fahrenheit(Celsius(25.0))");
      }
    hints:
      - "The number inside a `Celsius` is `c.0`."
      - "Wrap the result in the other newtype: `Fahrenheit(...)`."
      - "`Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)`"
    more:
      - task: |
          Time units, as newtypes. Write:

          - `fn to_seconds(m: Minutes) -> Seconds` (1 minute is 60 seconds)
          - `fn add(a: Seconds, b: Seconds) -> Seconds`
        seed: |
          #[derive(Debug, PartialEq)]
          struct Minutes(u32);

          #[derive(Debug, PartialEq)]
          struct Seconds(u32);

          fn to_seconds(m: Minutes) -> Seconds {
              todo!()
          }

          fn add(a: Seconds, b: Seconds) -> Seconds {
              todo!()
          }
        solution: |
          #[derive(Debug, PartialEq)]
          struct Minutes(u32);

          #[derive(Debug, PartialEq)]
          struct Seconds(u32);

          fn to_seconds(m: Minutes) -> Seconds {
              Seconds(m.0 * 60)
          }

          fn add(a: Seconds, b: Seconds) -> Seconds {
              Seconds(a.0 + b.0)
          }
        harness: |
          #[test]
          fn converts_minutes_to_seconds() {
              assert_eq!(to_seconds(Minutes(3)), Seconds(180), "to_seconds(Minutes(3))");
          }

          #[test]
          fn zero_minutes_is_zero_seconds() {
              assert_eq!(to_seconds(Minutes(0)), Seconds(0), "to_seconds(Minutes(0))");
          }

          #[test]
          fn adds_seconds() {
              assert_eq!(add(Seconds(45), Seconds(30)), Seconds(75), "add(Seconds(45), Seconds(30))");
          }

          #[test]
          fn converts_then_adds() {
              assert_eq!(add(to_seconds(Minutes(2)), Seconds(5)), Seconds(125), "add(to_seconds(Minutes(2)), Seconds(5))");
          }
        hints:
          - "Read the number with `.0` and wrap the answer: `Seconds(...)`."
          - "`Seconds(m.0 * 60)` and `Seconds(a.0 + b.0)`"
      - task: |
          Money is usually stored as a whole number of cents (floating point can't represent 0.10 exactly). Write a newtype and two functions from scratch:

          - a tuple struct `Cents` holding a `u32`, with `#[derive(Debug, PartialEq)]`
          - `fn add(a: Cents, b: Cents) -> Cents`
          - `fn display(c: &Cents) -> String`, which formats the amount as dollars with exactly two decimals: `Cents(1205)` gives `"$12.05"`, `Cents(7)` gives `"$0.07"`.

          Tip: convert to `f64` only for display, `c.0 as f64 / 100.0`, and format with `{:.2}`.
        seed: |
          // Define the Cents newtype here, then add and display.

        solution: |
          // Define the Cents newtype here, then add and display.
          #[derive(Debug, PartialEq)]
          struct Cents(u32);

          fn add(a: Cents, b: Cents) -> Cents {
              Cents(a.0 + b.0)
          }

          fn display(c: &Cents) -> String {
              format!("${:.2}", c.0 as f64 / 100.0)
          }
        harness: |
          #[test]
          fn adds_two_amounts() {
              assert_eq!(add(Cents(250), Cents(199)), Cents(449), "add(Cents(250), Cents(199))");
          }

          #[test]
          fn displays_dollars_and_cents() {
              assert_eq!(display(&Cents(1205)), "$12.05", "display(&Cents(1205))");
          }

          #[test]
          fn displays_less_than_a_dollar() {
              assert_eq!(display(&Cents(7)), "$0.07", "display(&Cents(7))");
          }

          #[test]
          fn displays_whole_dollars_with_two_zeros() {
              assert_eq!(display(&Cents(300)), "$3.00", "display(&Cents(300))");
          }

          #[test]
          fn displays_a_sum() {
              assert_eq!(display(&add(Cents(99), Cents(1))), "$1.00", "display(&add(Cents(99), Cents(1)))");
          }
        hints:
          - "`struct Cents(u32);` with the derive line above it."
          - "`format!` works like `println!` but returns the `String`. A `$` in a format string is just a normal character."
          - "`format!(\"${:.2}\", c.0 as f64 / 100.0)`"

  - title: "Putting it together: an inventory"
    id: structs-6
    text: |
      Real programs are built from structs that contain other structs, and from lists of structs. Nothing new is needed: a field can have a struct type, and an array, a `Vec` or a slice can hold structs.

      ```rust run
      struct Location {
          aisle: u32,
          shelf: u32,
      }

      struct Item {
          name: String,
          quantity: u32,
          location: Location,
      }

      fn print_low_stock(items: &[Item], threshold: u32) {
          for item in items {
              if item.quantity < threshold {
                  println!("restock {} (aisle {}, shelf {})", item.name, item.location.aisle, item.location.shelf);
              }
          }
      }

      fn total_units(items: &[Item]) -> u32 {
          let mut total = 0;
          for item in items {
              total += item.quantity;
          }
          total
      }

      fn main() {
          let items = [
              Item { name: String::from("bolts"), quantity: 120, location: Location { aisle: 1, shelf: 2 } },
              Item { name: String::from("nuts"), quantity: 8, location: Location { aisle: 1, shelf: 3 } },
              Item { name: String::from("hinges"), quantity: 3, location: Location { aisle: 4, shelf: 1 } },
          ];
          print_low_stock(&items, 10);
          println!("units in stock: {}", total_units(&items));
      }
      ```

      ```output
      restock nuts (aisle 1, shelf 3)
      restock hinges (aisle 4, shelf 1)
      units in stock: 131
      ```

      - `item.location.aisle` chains field access: the `location` field of `item`, then its `aisle`.
      - The functions take a slice, `&[Item]`, just like the `&[i32]` slices from the last module. `for item in items` gives a reference to each item (`&Item`), so nothing is moved or copied.
      - Because they take a slice, the same functions work with an array (`&items`) or a `Vec<Item>` (`&inventory`), which coerces to a slice automatically.

      You can also grow a list of structs at run time with a `Vec`:

      ```rust run
      struct Score {
          player: String,
          points: u32,
      }

      fn main() {
          let mut scores = Vec::new();
          scores.push(Score { player: String::from("Ferris"), points: 40 });
          scores.push(Score { player: String::from("Corro"), points: 55 });
          for s in &scores {
              println!("{}: {}", s.player, s.points);
          }
          println!("{} players", scores.len());
      }
      ```

      ```output
      Ferris: 40
      Corro: 55
      2 players
      ```

      ### Designing structs at work

      - **One struct per concept** in your domain: `Customer`, `Order`, `Item`, `Address`. If a group of fields always travels together (`aisle` and `shelf`), it probably wants its own struct.
      - **Pick field types that rule out nonsense**: `u32` for a quantity that can't be negative, `bool` for yes/no, integer cents for money (never `f64`: `0.1 + 0.2` isn't exactly `0.3`).
      - **Derive Debug** on nearly everything, so you can always `dbg!` or log a value.

      **Your turn:** write `fn total_value(items: &[Item]) -> u32` that returns the value of the whole stock: for each item, `price_cents * quantity`, all added up. An empty slice is worth 0.
    seed: |
      struct Item {
          name: String,
          price_cents: u32,
          quantity: u32,
      }

      fn total_value(items: &[Item]) -> u32 {
          todo!()
      }
    solution: |
      struct Item {
          name: String,
          price_cents: u32,
          quantity: u32,
      }

      fn total_value(items: &[Item]) -> u32 {
          let mut total = 0;
          for item in items {
              total += item.price_cents * item.quantity;
          }
          total
      }
    harness: |
      fn item(name: &str, price_cents: u32, quantity: u32) -> Item {
          Item { name: name.to_string(), price_cents, quantity }
      }

      #[test]
      fn empty_stock_is_worth_zero() {
          assert_eq!(total_value(&[]), 0, "total_value(&[])");
      }

      #[test]
      fn one_item() {
          let items = [item("tea", 450, 3)];
          assert_eq!(total_value(&items), 1350, "tea at 450 x 3");
      }

      #[test]
      fn several_items() {
          let items = [item("tea", 450, 3), item("mug", 1200, 1), item("pen", 150, 10)];
          assert_eq!(total_value(&items), 4050, "tea 450x3, mug 1200x1, pen 150x10");
      }

      #[test]
      fn items_out_of_stock_add_nothing() {
          let items = [item("tea", 450, 0), item("pen", 150, 2)];
          assert_eq!(total_value(&items), 300, "tea 450x0, pen 150x2");
      }

      #[test]
      fn works_with_a_vec() {
          let items = vec![item("lamp", 2500, 2)];
          assert_eq!(total_value(&items), 5000, "a Vec with lamp 2500x2");
          assert_eq!(items[0].name, "lamp", "the item is still there afterwards");
      }
    hints:
      - "Start with `let mut total = 0;` and loop with `for item in items`."
      - "Inside the loop: `total += item.price_cents * item.quantity;`, then return `total` after the loop."
    more:
      - task: |
          Write `fn count_low_stock(items: &[Item], threshold: u32) -> usize` that counts how many items have a `quantity` **below** `threshold`.
        seed: |
          struct Item {
              name: String,
              price_cents: u32,
              quantity: u32,
          }

          fn count_low_stock(items: &[Item], threshold: u32) -> usize {
              todo!()
          }
        solution: |
          struct Item {
              name: String,
              price_cents: u32,
              quantity: u32,
          }

          fn count_low_stock(items: &[Item], threshold: u32) -> usize {
              let mut count = 0;
              for item in items {
                  if item.quantity < threshold {
                      count += 1;
                  }
              }
              count
          }
        harness: |
          fn item(name: &str, price_cents: u32, quantity: u32) -> Item {
              Item { name: name.to_string(), price_cents, quantity }
          }

          #[test]
          fn counts_items_below_the_threshold() {
              let items = [item("tea", 450, 3), item("mug", 1200, 20), item("pen", 150, 1)];
              assert_eq!(count_low_stock(&items, 5), 2, "quantities 3, 20, 1 with threshold 5");
          }

          #[test]
          fn an_item_at_the_threshold_is_not_low() {
              let items = [item("tea", 450, 5)];
              assert_eq!(count_low_stock(&items, 5), 0, "quantity 5 with threshold 5");
          }

          #[test]
          fn empty_stock_has_nothing_low() {
              assert_eq!(count_low_stock(&[], 10), 0, "count_low_stock(&[], 10)");
          }

          #[test]
          fn everything_can_be_low() {
              let items = [item("tea", 450, 0), item("mug", 1200, 2)];
              assert_eq!(count_low_stock(&items, 3), 2, "quantities 0, 2 with threshold 3");
              assert_eq!((items[0].name.as_str(), items[1].price_cents), ("tea", 1200), "items unchanged");
          }
        hints:
          - "Keep a counter (`let mut count = 0;`) and add 1 for each item with `item.quantity < threshold`."
      - task: |
          Write a whole inventory program. Each line of input is an item: a name, a price in cents and a quantity, separated by spaces, like `tea 450 3`. The starter reads the lines and splits each one into words for you.

          For each line, build an `Item` and push it onto `items`. After reading everything, print one line per item with its stock value (`price_cents * quantity`), then the total:

          ```text
          tea: 1350
          mug: 1200
          pen: 1500
          total: 4050
          ```
        seed: |
          struct Item {
              name: String,
              price_cents: u32,
              quantity: u32,
