id: structs
title: Structs
phase: "Structuring data"
summary: "Build your own types by grouping related values under one name. Define structs, create and change them, pass them to functions, use tuple structs as newtypes, and print them with #[derive(Debug)]."
roadmap: [Structs]
steps:
  - title: Grouping data with a struct
    id: structs-1
    text: |
      So far, related values have lived in separate variables: `name`, `score`, `level`. With three players you'd juggle nine variables, and nothing stops you from mixing up whose score is whose. A tuple like `(String, u32, u8)` groups them, but `player.1` doesn't say what the number means.

      A **struct** (short for *structure*) is a type you define yourself that groups related values under one name. Each value is a **field**, with a name and a type.

      ```rust run
      struct Player {
          name: String,
          score: u32,
          level: u8,
      }

      fn main() {
          let p = Player {
              name: String::from("Ferris"),
              score: 1200,
              level: 7,
          };
          println!("{} is level {} with {} points", p.name, p.level, p.score);
      }
      ```

      ```output
      Ferris is level 7 with 1200 points
      ```

      Piece by piece:

      - `struct Player { ... }` **defines** a new type called `Player`. It goes outside `fn main`, at the top level of the file. A definition is a blueprint: it doesn't create any value by itself.
      - Inside the braces, each field is written `name: Type`, separated by commas. A comma after the last field is normal Rust style (`cargo fmt` adds it for you).
      - `Player { name: ..., score: ..., level: ... }` creates an **instance**: an actual value of type `Player`. You must give every field a value, but the order doesn't have to match the definition.
      - `p.name` reads a field with a dot, the same way you read `.0` of a tuple, but with a name that says what it is.

      Type names use **UpperCamelCase** (`Player`, `InventoryItem`); field names use snake_case, like variables. The compiler warns you if you mix them up.

      ### Why bother?

      A struct gives meaning to data. `p.score` says what the number is, the type `Player` can appear in function signatures (`fn print_player(p: &Player)`), and the compiler guarantees that every `Player` has all of its fields. Fields can be any type: numbers, `bool`, `String`, arrays, tuples, even other structs.

      For text fields, use `String`: the struct then **owns** its text, just like a `String` variable does. A `&str` field would borrow text owned by someone else, which needs *lifetimes*, a later module. Owned fields are the right default.

      ### Common mistakes

      - **Leaving out a field.** Every field needs a value; there are no automatic defaults:

      ```rust compile_fail
      struct Player {
          name: String,
          score: u32,
      }

      fn main() {
          let p = Player { name: String::from("Ferris") };
          println!("{}", p.name);
      }
      ```

      ```error
      error[E0063]: missing field `score` in initializer of `Player`
      ```

      - **`=` instead of `:`** when creating an instance: `Player { name = ... }` gives ``expected `:`, found `=` ``. Fields use colons both in the definition and in the instance.
      - **A semicolon after the definition**: `struct Player { ... };` gives ``expected item, found `;` ``. A struct definition with braces ends with `}` alone.

      **Your turn:** fill in the blanks: the type of `score` (a whole number that can't be negative: `u32`), the struct's name when creating the instance, and the field printed first. The program should print `Ferris has 120 points`.
    fill: |
      struct Player {
          name: String,
          score: [[u32]],
      }

      fn main() {
          let p = [[Player]] {
              name: String::from("Ferris"),
              score: 120,
          };
          println!("{} has {} points", p.[[name]], p.score);
      }
    hints:
      - "The field `score` holds a whole number that is never negative: `u32`."
      - "You create an instance by writing the struct's name, then the fields in braces: `Player { ... }`."
      - "The first `{}` should show the player's name, so read the field `p.name`."
    tests:
      - expect: "Ferris has 120 points"
    more:
      - task: |
          Fill in the blanks so the program prints `The Rust Book (560 pages)`: the type of the `title` field, the field name when creating the instance, and the field read last.
        fill: |
          struct Book {
              title: [[String]],
              pages: u32,
          }

          fn main() {
              let b = Book {
                  [[title]]: String::from("The Rust Book"),
                  pages: 560,
              };
              println!("{} ({} pages)", b.title, b.[[pages]]);
          }
        hints:
          - "A struct that owns its text uses `String` for that field."
          - "When creating the instance, each value is introduced by its field name and a colon: `title: ...`."
        tests:
          - expect: "The Rust Book (560 pages)"
      - task: |
          Write it all yourself. Define a struct `Ticket` with three fields: `id` (a `u32`), `title` (a `String`) and `open` (a `bool`). In `main`, create a ticket with id `42`, title `Login button broken` and open `true`, then print it with one `println!` that reads all three fields:

          ```text
          #42 Login button broken (open: true)
          ```
        seed: |
          // Define struct Ticket here (outside main).

          fn main() {
              // Create a Ticket and print its fields.
          }
        solution: |
          // Define struct Ticket here (outside main).
          struct Ticket {
              id: u32,
              title: String,
              open: bool,
          }

          fn main() {
              // Create a Ticket and print its fields.
              let t = Ticket {
                  id: 42,
                  title: String::from("Login button broken"),
                  open: true,
              };
              println!("#{} {} (open: {})", t.id, t.title, t.open);
          }
        require:
          - pattern: 'struct\s+Ticket\s*\{'
            message: Define a struct named `Ticket` with braces and named fields.
          - pattern: '\w+\.id\b[\s\S]*\w+\.title\b[\s\S]*\w+\.open\b'
            message: Print the values by reading the ticket's fields (`t.id`, `t.title`, `t.open`), not by typing them into the text.
        hints:
          - "Start with `struct Ticket { id: u32, title: String, open: bool }` above `main`."
          - "Create it with `let t = Ticket { id: 42, title: String::from(\"Login button broken\"), open: true };`"
          - "Print with `println!(\"#{} {} (open: {})\", t.id, t.title, t.open);`"
        tests:
          - expect: "#42 Login button broken (open: true)"

  - title: Changing structs and passing them around
    id: structs-2
    text: |
      Like every variable in Rust, an instance is immutable unless you say `mut`. With `let mut`, you can change any field with `=`, `+=` and friends. Mutability belongs to the whole instance: Rust has no way to mark just one field as `mut`.

      ### Structs and functions

      A struct follows the ownership rules you already know. Pass `&Player` to a function that only reads it, and `&mut Player` to a function that changes it. Through a reference you still write `account.balance`: Rust follows the reference for you, so there's no need for `(*account).balance`.

      ```rust run
      struct Account {
          owner: String,
          balance: i64,
      }

      fn deposit(account: &mut Account, amount: i64) {
          account.balance += amount;
      }

      fn report(account: &Account) {
          println!("{}: {}", account.owner, account.balance);
      }

      fn main() {
          let mut acct = Account {
              owner: String::from("Ada"),
              balance: 100,
          };
          report(&acct);
          deposit(&mut acct, 50);
          acct.balance -= 30;
          report(&acct);
      }
      ```

      ```output
      Ada: 100
      Ada: 120
      ```

      - `deposit` borrows the account mutably, changes one field, and gives the borrow back when it returns.
      - `report` only needs to look, so it takes `&Account`. Both can be called as often as you like, because `main` still owns `acct`.
      - `main` can change a field directly too (`acct.balance -= 30`), because `acct` is `mut`.

      Functions can also **return** a struct. That's how you'll usually build one: a function that takes a few values and fills in the rest.

      ```rust run
      struct Account {
          owner: String,
          balance: i64,
      }

      fn open_account(owner: &str) -> Account {
          Account {
              owner: owner.to_string(),
              balance: 0,
          }
      }

      fn main() {
          let acct = open_account("Grace");
          println!("{} starts with {}", acct.owner, acct.balance);
      }
      ```

      ```output
      Grace starts with 0
      ```

      ### Common mistakes

      - **Changing a field of an immutable instance**:

      ```rust compile_fail
      struct Player {
          name: String,
          score: u32,
      }

      fn main() {
          let p = Player { name: String::from("Ferris"), score: 10 };
          p.score += 5;
          println!("{} {}", p.name, p.score);
      }
      ```

      ```error
      error[E0594]: cannot assign to `p.score`, as `p` is not declared as mutable
      ```

      - **Passing the struct by value when you meant to lend it.** A struct with a `String` inside moves into the function, just like the `String` itself would. If `report` took `account: Account`, calling `report(acct)` twice gives ``error[E0382]: use of moved value: `acct` ``. Take `&Account` instead.

      **Your turn:** write `fn level_up(hero: &mut Hero)`. It adds 1 to `level`, adds 10 to `max_hp`, and then fully heals the hero: `hp` becomes the new `max_hp`. The name doesn't change.
    seed: |
      struct Hero {
          name: String,
          level: u32,
          hp: u32,
          max_hp: u32,
      }

      fn level_up(hero: &mut Hero) {
          todo!()
      }
    solution: |
      struct Hero {
          name: String,
          level: u32,
          hp: u32,
          max_hp: u32,
      }

      fn level_up(hero: &mut Hero) {
          hero.level += 1;
          hero.max_hp += 10;
          hero.hp = hero.max_hp;
      }
    harness: |
      fn ayla() -> Hero {
          Hero { name: String::from("Ayla"), level: 1, hp: 12, max_hp: 50 }
      }

      #[test]
      fn adds_one_level() {
          let mut h = ayla();
          level_up(&mut h);
          assert_eq!(h.level, 2, "level after level_up on a level 1 hero");
      }

      #[test]
      fn raises_max_hp_by_10() {
          let mut h = ayla();
          level_up(&mut h);
          assert_eq!(h.max_hp, 60, "max_hp after level_up when it was 50");
      }

      #[test]
      fn heals_to_the_new_max() {
          let mut h = ayla();
          level_up(&mut h);
          assert_eq!(h.hp, 60, "hp after level_up (hp was 12, max_hp was 50)");
      }

      #[test]
      fn keeps_the_name() {
          let mut h = ayla();
          level_up(&mut h);
          assert_eq!(h.name, "Ayla", "name after level_up");
      }

      #[test]
      fn works_twice_in_a_row() {
          let mut h = ayla();
          level_up(&mut h);
          level_up(&mut h);
          assert_eq!((h.level, h.hp, h.max_hp), (3, 70, 70), "(level, hp, max_hp) after two level_ups");
      }
    hints:
      - "Change the fields through the reference: `hero.level += 1;`"
      - "Order matters: raise `max_hp` first, then set `hp` to it."
      - "`hero.level += 1; hero.max_hp += 10; hero.hp = hero.max_hp;`"
    more:
      - task: |
          Write `fn take_damage(hero: &mut Hero, amount: u32)`. It lowers `hp` by `amount`, but `hp` never goes below 0 (remember: subtracting past zero on a `u32` panics in a debug build). No other field changes.
        seed: |
          struct Hero {
              name: String,
              level: u32,
              hp: u32,
              max_hp: u32,
          }

          fn take_damage(hero: &mut Hero, amount: u32) {
              todo!()
          }
        solution: |
          struct Hero {
              name: String,
              level: u32,
              hp: u32,
              max_hp: u32,
          }

          fn take_damage(hero: &mut Hero, amount: u32) {
              hero.hp = hero.hp.saturating_sub(amount);
          }
        harness: |
          fn ayla() -> Hero {
              Hero { name: String::from("Ayla"), level: 3, hp: 40, max_hp: 70 }
          }

          #[test]
          fn lowers_hp_by_the_damage() {
              let mut h = ayla();
              take_damage(&mut h, 15);
              assert_eq!(h.hp, 25, "hp after take_damage(15) from 40");
          }

          #[test]
          fn can_drop_exactly_to_zero() {
              let mut h = ayla();
              take_damage(&mut h, 40);
              assert_eq!(h.hp, 0, "hp after take_damage(40) from 40");
          }

          #[test]
          fn stops_at_zero_instead_of_panicking() {
              let mut h = ayla();
              take_damage(&mut h, 500);
              assert_eq!(h.hp, 0, "hp after take_damage(500) from 40");
          }

          #[test]
          fn leaves_the_other_fields_alone() {
              let mut h = ayla();
              take_damage(&mut h, 10);
              assert_eq!((h.name.as_str(), h.level, h.max_hp), ("Ayla", 3, 70), "(name, level, max_hp) after take_damage");
          }
        hints:
          - "`hero.hp - amount` panics when `amount` is bigger. Check first with `if`, or use the saturating subtraction you met with integer types."
          - "`hero.hp = hero.hp.saturating_sub(amount);`"
      - task: |
          Write `fn transfer(from: &mut Account, to: &mut Account, amount: i64)` from scratch. It moves `amount` from `from`'s balance to `to`'s balance. If `from` has less than `amount`, nothing changes at all. Owners never change.
        seed: |
          struct Account {
              owner: String,
              balance: i64,
          }

          // Write fn transfer here.
        solution: |
          struct Account {
              owner: String,
              balance: i64,
          }

          // Write fn transfer here.
          fn transfer(from: &mut Account, to: &mut Account, amount: i64) {
              if from.balance < amount {
                  return;
              }
              from.balance -= amount;
              to.balance += amount;
          }
        harness: |
          fn acct(owner: &str, balance: i64) -> Account {
              Account { owner: owner.to_string(), balance }
          }

          #[test]
          fn moves_money_between_accounts() {
              let mut a = acct("Ada", 100);
              let mut b = acct("Grace", 20);
              transfer(&mut a, &mut b, 30);
              assert_eq!((a.balance, b.balance), (70, 50), "balances after transfer of 30 from 100 to 20");
          }

          #[test]
          fn can_move_the_whole_balance() {
              let mut a = acct("Ada", 100);
              let mut b = acct("Grace", 0);
              transfer(&mut a, &mut b, 100);
              assert_eq!((a.balance, b.balance), (0, 100), "balances after transferring everything");
          }

          #[test]
          fn refuses_when_there_is_not_enough() {
              let mut a = acct("Ada", 10);
              let mut b = acct("Grace", 5);
              transfer(&mut a, &mut b, 11);
              assert_eq!((a.balance, b.balance), (10, 5), "balances after trying to send 11 from 10");
          }

          #[test]
          fn keeps_the_owners() {
              let mut a = acct("Ada", 100);
              let mut b = acct("Grace", 20);
              transfer(&mut a, &mut b, 30);
              assert_eq!((a.owner.as_str(), b.owner.as_str()), ("Ada", "Grace"), "owners after a transfer");
          }
        hints:
          - "Two `&mut` parameters are fine here: they borrow two different accounts."
          - "Check `from.balance < amount` first and `return` early if it's true."
          - "Then `from.balance -= amount;` and `to.balance += amount;`"

  - title: Building structs with shorthand and update syntax
    id: structs-3
    text: |
      Building structs in functions is so common that Rust has two shortcuts for it.

      ### Field init shorthand

      When a variable has the same name as the field, write the name once: `price_cents` instead of `price_cents: price_cents`. This is the **field init shorthand**. Clippy flags the long form (`redundant_field_names`), so in real code you'll see the short one everywhere.

      ### Struct update syntax

      `..other` at the end of an instance means "every field I didn't list comes from `other`". This is **struct update syntax**, handy for "the same, but with these changes":

      ```rust run
      struct Settings {
          player_name: String,
          volume: u8,
          music: bool,
          difficulty: u8,
      }

      fn default_settings(player_name: String) -> Settings {
          Settings {
              player_name,
              volume: 70,
              music: true,
              difficulty: 2,
          }
      }

      fn main() {
          let base = default_settings(String::from("Ferris"));
          let hard = Settings {
              difficulty: 5,
              music: false,
              ..base
          };
          println!("{} plays at difficulty {}", hard.player_name, hard.difficulty);
          println!("volume {}, music {}", hard.volume, hard.music);
      }
      ```

      ```output
      Ferris plays at difficulty 5
      volume 70, music false
      ```

      - In `default_settings`, the parameter is called `player_name`, so the field is filled with just `player_name,`.
      - `hard` lists two fields and takes the rest (`player_name`, `volume`) from `base`.
      - `..base` must come **last**, with no comma after it.

      ### The update syntax moves

      `..base` works like assignment: `Copy` fields (numbers, `bool`) are copied, but a `String` field is **moved** out of `base`. After that line, `base.player_name` is gone, while `base.volume` is still fine:

      ```rust compile_fail
      struct Player {
          name: String,
          score: u32,
      }

      fn main() {
          let a = Player { name: String::from("Ferris"), score: 10 };
          let b = Player { score: 99, ..a };
          println!("{} {}", b.name, b.score);
          println!("{}", a.name);
      }
      ```

      ```error
      error[E0382]: borrow of moved value: `a.name`
      ```

      If you still need `a`, give the moved fields explicitly (`name: a.name.clone()`), or just don't use `a` afterwards. Often the struct you update from is a temporary that's thrown away anyway.

      **Your turn:** write `fn new_item(name: &str, price_cents: u32) -> Item` that returns an `Item` with that name and price, and a `quantity` of 0. Use the field init shorthand for `price_cents`.
    seed: |
      struct Item {
          name: String,
          price_cents: u32,
          quantity: u32,
      }

      fn new_item(name: &str, price_cents: u32) -> Item {
          todo!()
      }
    solution: |
      struct Item {
          name: String,
          price_cents: u32,
          quantity: u32,
      }

      fn new_item(name: &str, price_cents: u32) -> Item {
          Item {
              name: name.to_string(),
              price_cents,
              quantity: 0,
          }
      }
    harness: |
      #[test]
      fn sets_the_name() {
          let item = new_item("Tea", 450);
          assert_eq!(item.name, "Tea", "new_item(\"Tea\", 450).name");
      }

      #[test]
      fn sets_the_price() {
          let item = new_item("Tea", 450);
          assert_eq!(item.price_cents, 450, "new_item(\"Tea\", 450).price_cents");
      }

      #[test]
      fn starts_with_zero_quantity() {
          let item = new_item("Mug", 1200);
          assert_eq!(item.quantity, 0, "new_item(\"Mug\", 1200).quantity");
      }

      #[test]
      fn handles_a_free_item() {
          let item = new_item("Sticker", 0);
          assert_eq!((item.name.as_str(), item.price_cents), ("Sticker", 0), "new_item(\"Sticker\", 0)");
      }
    require:
      - pattern: '\bprice_cents\s*[,}]'
        message: "Use the field init shorthand: write `price_cents,` instead of `price_cents: price_cents,`."
    hints:
      - "`name` is a `&str` but the field is a `String`: convert it with `name.to_string()`."
      - "Inside the `Item { ... }`, the parameter and the field share the name `price_cents`, so you can write just `price_cents,`."
      - "`Item { name: name.to_string(), price_cents, quantity: 0 }`"
    more:
      - task: |
          Write `fn with_price(item: Item, price_cents: u32) -> Item`. It returns the same item with a new price. Use struct update syntax (`..item`) for the fields that stay the same, and the shorthand for `price_cents`.
        seed: |
          struct Item {
              name: String,
              price_cents: u32,
              quantity: u32,
          }

          fn with_price(item: Item, price_cents: u32) -> Item {
              todo!()
          }
        solution: |
          struct Item {
              name: String,
              price_cents: u32,
              quantity: u32,
          }

          fn with_price(item: Item, price_cents: u32) -> Item {
              Item { price_cents, ..item }
          }
        harness: |
          fn tea() -> Item {
              Item { name: String::from("Tea"), price_cents: 450, quantity: 12 }
          }

          #[test]
          fn changes_the_price() {
              assert_eq!(with_price(tea(), 399).price_cents, 399, "with_price(tea, 399).price_cents");
          }

          #[test]
          fn keeps_the_name() {
              assert_eq!(with_price(tea(), 399).name, "Tea", "with_price(tea, 399).name");
          }

          #[test]
          fn keeps_the_quantity() {
              assert_eq!(with_price(tea(), 399).quantity, 12, "with_price(tea, 399).quantity");
          }
        require:
          - pattern: '\.\.\s*item\b'
            message: "Take the unchanged fields from the old item with `..item`."
        hints:
          - "The new value lists only the field that changes, then `..item` for the rest."
          - "`Item { price_cents, ..item }`"
      - task: |
          Write two functions for a game:

          - `fn new_character(name: String, class: String) -> Character`: level 1 and 100 hp. Use the shorthand for `name` and `class`.
          - `fn promoted(c: Character) -> Character`: one level higher and 20 more hp, with the same name and class. Use struct update syntax.
        seed: |
          struct Character {
              name: String,
              class: String,
              level: u32,
              hp: u32,
          }

        solution: |
          struct Character {
              name: String,
              class: String,
              level: u32,
              hp: u32,
          }

          fn new_character(name: String, class: String) -> Character {
              Character {
                  name,
                  class,
                  level: 1,
                  hp: 100,
              }
          }

          fn promoted(c: Character) -> Character {
              Character {
                  level: c.level + 1,
                  hp: c.hp + 20,
                  ..c
              }
          }
        harness: |
          fn mage() -> Character {
              new_character(String::from("Ayla"), String::from("mage"))
          }

          #[test]
          fn a_new_character_starts_at_level_1_with_100_hp() {
              let c = mage();
              assert_eq!((c.level, c.hp), (1, 100), "(level, hp) of a new character");
          }

          #[test]
          fn a_new_character_keeps_name_and_class() {
              let c = mage();
              assert_eq!((c.name.as_str(), c.class.as_str()), ("Ayla", "mage"), "(name, class) of a new character");
          }

          #[test]
          fn promotion_adds_a_level_and_20_hp() {
              let c = promoted(mage());
              assert_eq!((c.level, c.hp), (2, 120), "(level, hp) after one promotion");
          }

          #[test]
          fn promotion_keeps_name_and_class() {
              let c = promoted(mage());
              assert_eq!((c.name.as_str(), c.class.as_str()), ("Ayla", "mage"), "(name, class) after a promotion");
          }

          #[test]
          fn promotions_stack() {
              let c = promoted(promoted(promoted(mage())));
              assert_eq!((c.level, c.hp), (4, 160), "(level, hp) after three promotions");
          }
        require:
          - pattern: '\.\.\s*c\b'
            message: "In `promoted`, take the unchanged fields with `..c`."
        hints:
          - "`new_character` can list `name, class,` with no colons, then `level: 1, hp: 100`."
          - "In `promoted`, `level: c.level + 1` works: `level` and `hp` are `Copy` numbers, and `..c` only moves the fields you didn't list (`name` and `class`)."
          - "`Character { level: c.level + 1, hp: c.hp + 20, ..c }`"

  - title: Printing structs with Debug
    id: structs-4
    text: |
      Try to print a struct with `{}` and Rust refuses:

      ```rust compile_fail
      struct Point {
          x: i32,
          y: i32,
      }

      fn main() {
          let p = Point { x: 1, y: 2 };
          println!("{}", p);
      }
      ```

      ```error
      error[E0277]: `Point` doesn't implement `std::fmt::Display`
      ```

      `{}` uses **Display**, the "pretty, for end users" format. Rust doesn't guess how your type should look to users (`(1, 2)`? `x=1 y=2`?), so you'd have to write that yourself, which you'll learn in the traits module. `{:?}` uses **Debug**, the "for programmers" format, and for that Rust can write the code for you.

      ### #[derive(Debug)]

      ```rust run
      #[derive(Debug)]
      struct Item {
          name: String,
          price_cents: u32,
          in_stock: bool,
      }

      fn main() {
          let item = Item {
              name: String::from("Tea"),
              price_cents: 450,
              in_stock: true,
          };
          println!("{:?}", item);
          println!("{:#?}", item);
          if item.in_stock {
              println!("{} costs {} cents", item.name, item.price_cents);
          }
      }
      ```

      ```output
      Item { name: "Tea", price_cents: 450, in_stock: true }
      Item {
          name: "Tea",
          price_cents: 450,
          in_stock: true,
      }
      Tea costs 450 cents
      ```

      - `#[derive(Debug)]` is an **attribute**: a note to the compiler written above an item. **derive** asks the compiler to generate code for you, here the Debug formatting. (Debug is a **trait**, a named ability a type can have; the traits module covers them properly.)
      - `{:?}` prints everything on one line. `{:#?}` pretty-prints, one field per line, which is much easier to read for big or nested structs.
      - Nearly every struct in real code derives `Debug`. It costs nothing until you use it, and it makes logging and debugging painless.

      ### dbg!

      `dbg!(expression)` prints the file, the line, the expression and its value, then **returns** the value, so you can wrap it around something in the middle of your code:

      ```rust run
      #[derive(Debug)]
      struct Item {
          name: String,
          price_cents: u32,
      }

      fn main() {
          let price_cents = dbg!(150 * 3);
          let item = Item { name: String::from("Tea"), price_cents };
          dbg!(&item);
          println!("{} costs {}", item.name, item.price_cents);
      }
      ```

      ```output
      Tea costs 450
      ```

      The `dbg!` lines go to **standard error** (stderr), not standard output, so they don't mix with the program's real output (and the tests on this site ignore them). In a terminal you'd see:

      ```text
      [src/main.rs:8:23] 150 * 3 = 450
      [src/main.rs:10:5] &item = Item {
          name: "Tea",
          price_cents: 450,
      }
      ```

      Pass a reference (`dbg!(&item)`): `dbg!(item)` would move `item` into the macro. `dbg!` is for debugging sessions; remove it before you commit (many teams turn on clippy's `dbg_macro` lint to catch leftovers).

      ### Comparing with ==

      `==` doesn't work on your struct either until you derive **PartialEq**, which compares field by field. You can derive several things at once: `#[derive(Debug, PartialEq)]`. `assert_eq!` needs both: `PartialEq` to compare and `Debug` to show the two values when they differ.

      ```rust run
      #[derive(Debug, PartialEq)]
      struct Point {
          x: i32,
          y: i32,
      }

      fn main() {
          let a = Point { x: 1, y: 2 };
          let b = Point { x: 1, y: 2 };
          println!("{}", a == b);
          println!("{}", a == Point { x: 2, y: 1 });
      }
      ```

      ```output
      true
      false
      ```

      ### Common mistakes

      - **`{:?}` without the derive**: ``error[E0277]: `Point` doesn't implement `Debug` ``. The error's help line tells you to add `#[derive(Debug)]`.
      - **`==` without PartialEq**: ``error[E0369]: binary operation `==` cannot be applied to type `Point` ``.
      - **A field only used in `{:?}`**: the compiler warns ``field `name` is never read``, because derived Debug output doesn't count as using a field. Real code reads its fields; if it doesn't, the field may not be needed.

      **Your turn:** fill in the blanks: derive the trait that `{:?}` needs, and print `p` with it. The program should print:

      ```text
      sum: 1
      Point { x: 3, y: -2 }
      ```
    fill: |
      #[derive([[Debug]])]
      struct Point {
          x: i32,
          y: i32,
      }

      fn main() {
          let p = Point { x: 3, y: -2 };
          println!("sum: {}", p.x + p.y);
          println!("[[{:?}]]", p);
      }
    hints:
      - "The trait for `{:?}` formatting is `Debug`."
      - "The second format string is just the Debug placeholder: `{:?}`."
    tests:
      - expect: "sum: 1\nPoint { x: 3, y: -2 }"
    more:
      - task: |
          Add one derive line so that `Item` can be pretty-printed and compared with `==`. Then print `a` with the pretty Debug format and print whether `a == b`, so the output is exactly:

          ```text
          Item {
              name: "bolt",
              qty: 40,
          }
          same: true
          ```
        seed: |
          struct Item {
              name: String,
              qty: u32,
          }

          fn main() {
              let a = Item { name: String::from("bolt"), qty: 40 };
              let b = Item { name: String::from("bolt"), qty: 40 };
