        solution: |
          #[derive(Debug, PartialEq)]
          struct Point {
              x: i32,
              y: i32,
          }

          fn moved(p: Point, dx: i32, dy: i32) -> Point {
              Point {
                  x: p.x + dx,
                  y: p.y + dy,
              }
          }

          fn midpoint(a: &Point, b: &Point) -> Point {
