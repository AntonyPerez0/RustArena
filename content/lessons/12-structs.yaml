      - task: |
          Write two functions for 2D points:

          - `fn moved(p: Point, dx: i32, dy: i32) -> Point`: the point shifted by `dx` and `dy`.
          - `fn midpoint(a: &Point, b: &Point) -> Point`: the point halfway between, using integer division (`(1 + 4) / 2` is `2`).

