  - title: "Set operations: union, intersection, difference"
    id: hashmaps-5
    text: |
      Sets can be combined the way you did with Venn diagrams at school. Who came on both days? Who came at all? Which required skills is a candidate missing?

      ```rust run
      use std::collections::BTreeSet;

      fn main() {
          let monday = BTreeSet::from(["ana", "bo", "cy", "dee"]);
          let tuesday = BTreeSet::from(["bo", "dee", "eli"]);

          println!("both days: {:?}", &monday & &tuesday);
          println!("either day: {:?}", &monday | &tuesday);
          println!("only monday: {:?}", &monday - &tuesday);
          println!("exactly one day: {:?}", &monday ^ &tuesday);

          for name in monday.intersection(&tuesday) {
              println!("{name} came twice");
          }
          println!("{}", tuesday.is_subset(&monday));
      }
      ```

      ```output
      both days: {"bo", "dee"}
      either day: {"ana", "bo", "cy", "dee", "eli"}
      only monday: {"ana", "cy"}
      exactly one day: {"ana", "cy", "eli"}
      bo came twice
      dee came twice
      false
      ```

      - `BTreeSet::from([...])` builds a set from an array in one go (`HashSet::from`, `HashMap::from([(k, v), ...])` and `BTreeMap::from` work the same way).
      - The operators build a **new** set from two borrowed ones:

        | Operator | Method | Elements in the result |
        |---|---|---|
        | `&a & &b` | `a.intersection(&b)` | in both |
        | `&a \| &b` | `a.union(&b)` | in either |
        | `&a - &b` | `a.difference(&b)` | in `a` but not in `b` |
        | `&a ^ &b` | `a.symmetric_difference(&b)` | in exactly one of them |

      - The methods don't build a set; they give you the elements one by one, ready for a `for` loop. Each element comes as a reference (`&&str` here, `&String` for a set of Strings): clone it if you need an owned copy.
      - `is_subset`, `is_superset` and `is_disjoint` (no elements in common) answer yes/no questions.

      The same operators and methods work on HashSet. The results are HashSets too, so sort them before printing.

      ### Common mistakes

      - **Forgetting the `&`s.** The operators take the sets by reference:

        ```rust compile_fail
        use std::collections::BTreeSet;

        fn main() {
            let a = BTreeSet::from([1, 2]);
            let b = BTreeSet::from([2, 3]);
            let c = a & b;
            println!("{:?}", c);
        }
        ```

        ```error
        error[E0369]: no implementation for `BTreeSet<{integer}> & BTreeSet<{integer}>`
        ```

        Write `&a & &b`.
      - **Mixing up the direction of `-`.** `&a - &b` is "a without b"; `&b - &a` is a different set.

      **Your turn:** a job board matches candidates to roles. Write `fn missing_skills(required: &HashSet<String>, have: &HashSet<String>) -> Vec<String>` that returns the required skills the candidate doesn't have, sorted alphabetically.
    seed: |
      use std::collections::HashSet;

      fn missing_skills(required: &HashSet<String>, have: &HashSet<String>) -> Vec<String> {
          todo!()
      }
    solution: |
      use std::collections::HashSet;

      fn missing_skills(required: &HashSet<String>, have: &HashSet<String>) -> Vec<String> {
          let mut missing = Vec::new();
          for skill in required.difference(have) {
              missing.push(skill.clone());
          }
          missing.sort();
          missing
      }
    harness: |
      fn set(items: &[&str]) -> HashSet<String> {
          let mut s = HashSet::new();
          for i in items {
              s.insert(i.to_string());
          }
          s
      }

      #[test]
      fn lists_missing_skills_sorted() {
          let required = set(&["rust", "sql", "docker", "git"]);
          let have = set(&["git", "rust", "python"]);
          assert_eq!(missing_skills(&required, &have), vec!["docker", "sql"], "required rust/sql/docker/git, have git/rust/python");
      }

      #[test]
      fn nothing_missing() {
          let required = set(&["rust"]);
          let have = set(&["rust", "go"]);
          assert_eq!(missing_skills(&required, &have), Vec::<String>::new(), "required rust, have rust/go");
      }

      #[test]
      fn has_nothing() {
          let required = set(&["tokio", "axum"]);
          let have = set(&[]);
          assert_eq!(missing_skills(&required, &have), vec!["axum", "tokio"], "required tokio/axum, have nothing");
      }
    hints:
      - "`required.difference(have)` gives each required skill that isn't in `have`, as a `&String`."
      - "Push clones into a vector: `for skill in required.difference(have) { missing.push(skill.clone()); }`"
      - "A HashSet has no order, so `missing.sort();` before returning."
    more:
      - task: |
          Write `fn common_friends(a: &[&str], b: &[&str]) -> Vec<String>` that returns the names appearing in both friend lists, each once, in alphabetical order. The lists may contain repeats. Build a `BTreeSet` from each list and use `intersection` (its results come out sorted).
        seed: |
          use std::collections::BTreeSet;

          fn common_friends(a: &[&str], b: &[&str]) -> Vec<String> {
              todo!()
          }
        solution: |
          use std::collections::BTreeSet;

          fn common_friends(a: &[&str], b: &[&str]) -> Vec<String> {
              let mut left = BTreeSet::new();
              for name in a {
                  left.insert(*name);
              }
              let mut right = BTreeSet::new();
              for name in b {
                  right.insert(*name);
              }
              let mut common = Vec::new();
              for name in left.intersection(&right) {
                  common.push(name.to_string());
              }
              common
          }
        harness: |
          #[test]
          fn finds_shared_names_in_order() {
              let got = common_friends(&["zoe", "ana", "max"], &["max", "kim", "zoe"]);
              assert_eq!(got, vec!["max", "zoe"], "common_friends([zoe, ana, max], [max, kim, zoe])");
          }

          #[test]
          fn repeats_appear_once() {
              let got = common_friends(&["bo", "bo", "cy"], &["bo", "bo"]);
              assert_eq!(got, vec!["bo"], "common_friends([bo, bo, cy], [bo, bo])");
          }

          #[test]
          fn no_overlap() {
              let got = common_friends(&["a"], &["b"]);
              assert_eq!(got, Vec::<String>::new(), "common_friends([a], [b])");
          }
        require:
          - pattern: 'intersection|&\s*\w+\s*&\s*&'
            message: "Use the intersection of the two sets."
        hints:
          - "Build each set with a loop: `for name in a { left.insert(*name); }`"
