              let mut booked = HashSet::new();
              book(&mut booked, Seat { row: 1, number: 5 });
              assert_eq!(book(&mut booked, Seat { row: 2, number: 5 }), "booked row 2 seat 5", "book row 2 seat 5 after row 1 seat 5");
          }
