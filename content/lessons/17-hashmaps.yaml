          A cinema books seats in a `HashSet<Seat>`. Make `Seat` usable in a HashSet (derive what it needs), then write `fn book(booked: &mut HashSet<Seat>, seat: Seat) -> String` that returns `"booked row R seat N"` if the seat was free (and records it), or `"row R seat N is taken"` if it was already booked.
        seed: |
          use std::collections::HashSet;

          struct Seat {
              row: u32,
              number: u32,
          }

          fn book(booked: &mut HashSet<Seat>, seat: Seat) -> String {
              todo!()
          }
        solution: |
          use std::collections::HashSet;

          #[derive(PartialEq, Eq, Hash)]
          struct Seat {
              row: u32,
              number: u32,
          }

          fn book(booked: &mut HashSet<Seat>, seat: Seat) -> String {
              let label = format!("row {} seat {}", seat.row, seat.number);
              if booked.insert(seat) {
                  format!("booked {label}")
              } else {
                  format!("{label} is taken")
              }
          }
        harness: |
          #[test]
          fn books_a_free_seat() {
              let mut booked = HashSet::new();
              assert_eq!(book(&mut booked, Seat { row: 3, number: 12 }), "booked row 3 seat 12", "book row 3 seat 12");
              assert_eq!(booked.len(), 1, "number of booked seats");
          }

          #[test]
          fn refuses_a_taken_seat() {
              let mut booked = HashSet::new();
              book(&mut booked, Seat { row: 3, number: 12 });
              assert_eq!(book(&mut booked, Seat { row: 3, number: 12 }), "row 3 seat 12 is taken", "book row 3 seat 12 twice");
          }

          #[test]
