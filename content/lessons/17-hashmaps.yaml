      - task: |
          A robot starts at `(0, 0)` and reads one line of moves: `U` (y + 1), `D` (y - 1), `L` (x - 1), `R` (x + 1); ignore any other character. Using a `HashSet<(i32, i32)>`, print how many distinct cells it visited (including the start), and how many moves landed on a cell it had already visited:

          ```
          visited 4 cells
          revisited 1 times
          ```

          (That's the output for `URDL`, which walks a square back to the start.)
        seed: |
          use std::collections::HashSet;
          use std::io;

          fn main() {
              let mut moves = String::new();
              io::stdin().read_line(&mut moves).expect("could not read moves");
          }
        solution: |
          use std::collections::HashSet;
          use std::io;

          fn main() {
              let mut moves = String::new();
              io::stdin().read_line(&mut moves).expect("could not read moves");
              let mut pos = (0, 0);
              let mut visited: HashSet<(i32, i32)> = HashSet::new();
              visited.insert(pos);
              let mut revisits = 0;
              for c in moves.chars() {
                  match c {
                      'U' => pos.1 += 1,
                      'D' => pos.1 -= 1,
                      'L' => pos.0 -= 1,
                      'R' => pos.0 += 1,
                      _ => continue,
                  }
                  if !visited.insert(pos) {
                      revisits += 1;
                  }
              }
              println!("visited {} cells", visited.len());
              println!("revisited {revisits} times");
          }
        tests:
          - stdin: "URDL\n"
            expect: "visited 4 cells\nrevisited 1 times"
          - stdin: "RRRR\n"
          - stdin: "UDUDLRRL\n"
            hidden: true
          - stdin: "UURRDDLLUR x\n"
            hidden: true
        hints:
          - "Keep `let mut pos = (0, 0);` and insert the start into the set before moving."
          - "`match c { 'U' => pos.1 += 1, ..., _ => continue }` moves (or skips characters that aren't moves)."
          - "After each move, `if !visited.insert(pos) { revisits += 1; }`. At the end, `visited.len()` is the number of distinct cells."
