id: hashmaps
title: HashMaps and sets
phase: "Structuring data"
summary: "Look things up by key with HashMap, count with the entry API, keep unique values with HashSet, and combine sets. Plus why hash order changes from run to run, and when to reach for BTreeMap and BTreeSet instead."
roadmap: [HashMap, HashSet, BTreeMap, BTreeSet]
steps:
  - title: Looking things up with HashMap
    id: hashmaps-1
    text: |
      A **HashMap<K, V>** stores **key-value pairs**: you file a value under a key, then ask for the value by its key. A price list (item to price), a phone book (name to number), an inventory (product to quantity). To find `"kiwi"` in a vector you'd check every element; a HashMap computes a number from the key, its **hash**, and uses it to jump almost straight to the right slot. A lookup takes about the same time with ten entries or ten million.

      ```rust run
      use std::collections::HashMap;

      fn main() {
          let mut stock: HashMap<String, u32> = HashMap::new();
          stock.insert(String::from("apple"), 12);
          stock.insert(String::from("pear"), 0);
          stock.insert(String::from("kiwi"), 7);

          println!("{} kinds", stock.len());
          println!("apples: {:?}", stock.get("apple"));
          println!("mangos: {:?}", stock.get("mango"));
          println!("kiwi listed? {}", stock.contains_key("kiwi"));

          let old = stock.insert(String::from("apple"), 20);
          println!("apples were {:?}, now {:?}", old, stock.get("apple"));

          let removed = stock.remove("pear");
          println!("removed {:?}, {} kinds left", removed, stock.len());
      }
      ```

      ```output
      3 kinds
      apples: Some(12)
      mangos: None
      kiwi listed? true
      apples were Some(12), now Some(20)
      removed Some(0), 2 kinds left
      ```

      Piece by piece:

      - `use std::collections::HashMap;` HashMap isn't in the **prelude** (the short list of names every Rust file gets automatically), so you import it.
      - `HashMap<String, u32>`: every key is a `String`, every value a `u32`.
      - `insert(key, value)` adds a pair. Keys are unique: inserting an existing key **replaces** its value and returns the old one as `Some(old)` (or `None` for a new key).
      - `get(key)` returns `Option<&V>`, because the key might not be there. A map with `String` keys can be searched with a plain `&str` like `"apple"`: you don't have to build a `String` just to look something up.
      - `contains_key` answers yes or no, `len` counts the pairs, and `remove` takes a pair out and returns its value as an `Option`.

      ### Getting values out and changing them

      `get` hands you a reference inside an `Option`. To get a plain number, with a default for missing keys, match on it; `Some(&n)` copies the number out of the reference (a pattern from module 15):

      ```rust run
      use std::collections::HashMap;

      fn main() {
          let mut stock: HashMap<&str, u32> = HashMap::new();
          stock.insert("kiwi", 7);

          let mangos = match stock.get("mango") {
              Some(&n) => n,
              None => 0,
          };
          println!("mangos: {mangos}");

          if let Some(qty) = stock.get_mut("kiwi") {
              *qty -= 1;
          }
          println!("kiwis: {}", stock["kiwi"]);
      }
      ```

      ```output
      mangos: 0
      kiwis: 6
      ```

      - The one-liner `stock.get("mango").copied().unwrap_or(0)` does the same as that `match`; module 19 covers `unwrap_or` and friends.
      - `get_mut` returns `Option<&mut V>`, a mutable reference you can write through with `*`.
      - `stock["kiwi"]` reads a value directly, but **panics** if the key is missing. Use it only when you know the key is there.
      - This map uses `&str` keys. That's fine when the keys are string literals or text that outlives the map; for text you read at run time, use `String` keys.

      `insert` takes **ownership** of the key and the value: after `stock.insert(name, 3)` with a `String` `name`, the map owns it and `name` can't be used any more.

      ### Common mistakes

      - **Assigning through an index:**

        ```rust compile_fail
        use std::collections::HashMap;

        fn main() {
            let mut stock: HashMap<&str, i32> = HashMap::new();
            stock.insert("apple", 3);
            stock["apple"] = 5;
        }
        ```

        ```error
        error[E0594]: cannot assign to data in an index of `HashMap<&str, i32>`
        ```

        Use `insert("apple", 5)` to replace, or `get_mut` to change the value in place.
      - **Printing the whole map with `{:?}`.** It compiles, but the order of the pairs changes from run to run. The next step explains why and what to do instead.

      **Your turn:** write a price checker. Create a `HashMap<&str, u32>` with these prices in cents: `apple` 125, `bread` 349, `milk` 99, `eggs` 450. Then, for each input line (an item name), print `ITEM: PRICE cents`, or `ITEM: not sold here` if the item isn't in the map.
    seed: |
      use std::collections::HashMap;
      use std::io::{self, BufRead};

      fn main() {
          // 1. Create the price map and insert the four prices

          // 2. Look up each item
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let item = line.trim();
          }
      }
    solution: |
      use std::collections::HashMap;
      use std::io::{self, BufRead};

      fn main() {
          // 1. Create the price map and insert the four prices
          let mut prices: HashMap<&str, u32> = HashMap::new();
          prices.insert("apple", 125);
          prices.insert("bread", 349);
          prices.insert("milk", 99);
          prices.insert("eggs", 450);

          // 2. Look up each item
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let item = line.trim();
              match prices.get(item) {
                  Some(price) => println!("{item}: {price} cents"),
                  None => println!("{item}: not sold here"),
              }
          }
      }
    tests:
      - stdin: "apple\nmango\nmilk\n"
        expect: "apple: 125 cents\nmango: not sold here\nmilk: 99 cents"
      - stdin: "eggs\nbread\nApple\n"
      - stdin: "milk\nmilk\ncheese\n  eggs  \n"
        hidden: true
    require:
      - pattern: '\.insert\('
        message: "Fill the map with `insert`."
      - pattern: '\.get\('
        message: "Look items up with `get`, which handles missing items without panicking."
    hints:
      - "`let mut prices: HashMap<&str, u32> = HashMap::new();` then `prices.insert(\"apple\", 125);` and so on."
      - "`match prices.get(item) { Some(price) => ..., None => ... }`"
    more:
      - task: |
          Write `fn restock(stock: &mut HashMap<String, u32>, item: &str, amount: u32)`: if the item is already in the map, add `amount` to its quantity; if not, insert it with `amount`. Use `get_mut` and `insert` (the next steps show a shortcut).
        seed: |
          use std::collections::HashMap;

          fn restock(stock: &mut HashMap<String, u32>, item: &str, amount: u32) {
              todo!()
          }
        solution: |
          use std::collections::HashMap;

          fn restock(stock: &mut HashMap<String, u32>, item: &str, amount: u32) {
              match stock.get_mut(item) {
                  Some(qty) => *qty += amount,
                  None => {
                      stock.insert(item.to_string(), amount);
                  }
              }
          }
        harness: |
          #[test]
          fn adds_to_an_existing_item() {
              let mut stock = HashMap::new();
              stock.insert(String::from("tape"), 4);
              restock(&mut stock, "tape", 10);
              assert_eq!(stock.get("tape"), Some(&14), "tape after restocking 4 + 10");
          }

          #[test]
          fn inserts_a_new_item() {
              let mut stock = HashMap::new();
              restock(&mut stock, "glue", 3);
              assert_eq!(stock.get("glue"), Some(&3), "glue after restocking a new item");
              assert_eq!(stock.len(), 1, "number of items");
          }

          #[test]
          fn other_items_are_untouched() {
              let mut stock = HashMap::new();
              stock.insert(String::from("tape"), 4);
              stock.insert(String::from("nails"), 100);
              restock(&mut stock, "tape", 1);
              assert_eq!(stock.get("nails"), Some(&100), "nails after restocking tape");
          }
        hints:
          - "`match stock.get_mut(item) { Some(qty) => *qty += amount, None => ... }`"
          - "In the `None` arm the map needs an owned key: `stock.insert(item.to_string(), amount);` (wrap it in braces, since `insert` returns a value the arm doesn't need)."
      - task: |
          Write `fn sell(stock: &mut HashMap<String, u32>, item: &str, qty: u32) -> bool`. If the item is missing or there aren't at least `qty` of it, return `false` and change nothing. Otherwise subtract `qty` and return `true`; if that leaves 0, remove the item from the map entirely.
        seed: |
          use std::collections::HashMap;

          fn sell(stock: &mut HashMap<String, u32>, item: &str, qty: u32) -> bool {
              todo!()
          }
        solution: |
          use std::collections::HashMap;

          fn sell(stock: &mut HashMap<String, u32>, item: &str, qty: u32) -> bool {
              let Some(have) = stock.get_mut(item) else {
                  return false;
              };
              if *have < qty {
                  return false;
              }
              *have -= qty;
              if *have == 0 {
                  stock.remove(item);
              }
              true
          }
        harness: |
          fn shop() -> HashMap<String, u32> {
              let mut stock = HashMap::new();
              stock.insert(String::from("mug"), 5);
              stock.insert(String::from("plush"), 1);
              stock
          }

          #[test]
          fn sells_when_there_is_enough() {
              let mut stock = shop();
              assert_eq!(sell(&mut stock, "mug", 2), true, "sell 2 of 5 mugs");
              assert_eq!(stock.get("mug"), Some(&3), "mugs left");
          }

          #[test]
          fn refuses_when_there_is_not_enough() {
              let mut stock = shop();
              assert_eq!(sell(&mut stock, "mug", 6), false, "sell 6 of 5 mugs");
              assert_eq!(stock.get("mug"), Some(&5), "mugs left after a refused sale");
          }

          #[test]
          fn refuses_a_missing_item() {
              let mut stock = shop();
              assert_eq!(sell(&mut stock, "hat", 1), false, "sell a hat");
              assert_eq!(stock.len(), 2, "number of items");
          }

          #[test]
          fn selling_the_last_one_removes_the_item() {
              let mut stock = shop();
              assert_eq!(sell(&mut stock, "plush", 1), true, "sell the last plush");
              assert_eq!(stock.contains_key("plush"), false, "plush still listed?");
          }
        hints:
          - "`let Some(have) = stock.get_mut(item) else { return false; };`"
          - "Check `*have < qty` before subtracting, so a refused sale changes nothing."
          - "After `*have -= qty;`, `if *have == 0 { stock.remove(item); }`. The borrow from `get_mut` ends at its last use, so `remove` is allowed."

  - title: Iteration order and BTreeMap
    id: hashmaps-2
    text: |
      To visit every pair, loop over a reference to the map. Each item is a `(&key, &value)` pair; `.keys()` and `.values()` give just one side.

      ```rust
      for (city, temp) in &temps {
          println!("{city}: {temp}");
      }
      ```

      Run that twice and you can get two different orders:

      ```text
      $ cargo run              $ cargo run
      oslo: 3                  lima: 19
      lima: 19                 cairo: 31
      cairo: 31                oslo: 3
      ```

      A HashMap places each entry according to its hash, so the order is unrelated to the order you inserted things. On top of that, Rust's default hash function is **seeded with random numbers** each time the program starts. That's deliberate: if attackers could predict where keys land, they could send a web server thousands of keys that all collide in one slot and slow it to a crawl (a **HashDoS** attack). Random seeds make that impractical.

      So: **never rely on HashMap order.** Not in output, and especially not in tests, where it causes "flaky" tests that pass or fail at random. You have two fixes.

      ### Fix 1: copy the pairs into a Vec and sort it

      ```rust run
      use std::collections::HashMap;

      fn main() {
          let mut ages = HashMap::new();
          ages.insert("zoe", 31);
          ages.insert("ana", 27);
          ages.insert("max", 45);

          let mut pairs: Vec<(&str, u32)> = Vec::new();
          for (name, age) in &ages {
              pairs.push((*name, *age));
          }
          pairs.sort();
          for (name, age) in &pairs {
              println!("{name}: {age}");
          }
      }
      ```

      ```output
      ana: 27
      max: 45
      zoe: 31
      ```

      Tuples sort by their first part, then by the second. To order by value instead, use `pairs.sort_by(...)` from the vectors module.

      ### Fix 2: use a BTreeMap

      **BTreeMap** has almost the same methods as HashMap (`insert`, `get`, `get_mut`, `remove`, `contains_key`, `entry`), but it keeps its keys **sorted**, so iterating and printing always go in key order:

      ```rust run
      use std::collections::BTreeMap;

      fn main() {
          let mut ages = BTreeMap::new();
          ages.insert("zoe", 31);
          ages.insert("ana", 27);
          ages.insert("max", 45);

          for (name, age) in &ages {
              println!("{name}: {age}");
          }
          println!("{:?}", ages);
          println!("{:?}", ages.first_key_value());
      }
      ```

      ```output
      ana: 27
      max: 45
      zoe: 31
      {"ana": 27, "max": 45, "zoe": 31}
      Some(("ana", 27))
      ```

      | | HashMap | BTreeMap |
      |---|---|---|
      | Lookup and insert | very fast (about constant time) | fast (grows slowly with size, `O(log n)`) |
      | Iteration order | unspecified, changes between runs | sorted by key |
      | Keys need | `Hash + Eq` | `Ord` (a total order) |
      | Use it for | lookups and counting | sorted output, smallest/largest key, ranges |

      At work, HashMap is the default. Teams switch to BTreeMap (or sort before printing) wherever order is visible: reports, logs, JSON output, test expectations.

      ### Common mistakes

      - **Trying to sort `keys()`.** `ages.keys()` is an iterator, not a vector; there's nothing to sort yet. Push the keys (or pairs) into a `Vec` first.
      - **Comparing `format!("{:?}", map)` in a test.** With a HashMap, that test passes on some runs and fails on others.

      **Your turn:** weather stations report lines like `oslo 3`. Read them all into a `HashMap<String, i32>` (a later report for the same city replaces the earlier one), then print every city with its latest temperature, in alphabetical order, as `city: temp`. Use a HashMap here and sort the pairs yourself; the next exercise uses BTreeMap.
    seed: |
      use std::collections::HashMap;
      use std::io::{self, BufRead};

      fn main() {
          let mut latest: HashMap<String, i32> = HashMap::new();
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let parts: Vec<&str> = line.split_whitespace().collect();
              let city = parts[0];
              let temp: i32 = parts[1].parse().expect("temperature must be a number");
              // store the reading
          }
          // print the cities in alphabetical order
      }
    solution: |
      use std::collections::HashMap;
      use std::io::{self, BufRead};

      fn main() {
          let mut latest: HashMap<String, i32> = HashMap::new();
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let parts: Vec<&str> = line.split_whitespace().collect();
              let city = parts[0];
              let temp: i32 = parts[1].parse().expect("temperature must be a number");
              // store the reading
              latest.insert(city.to_string(), temp);
          }
          // print the cities in alphabetical order
          let mut pairs: Vec<(&String, &i32)> = Vec::new();
          for (city, temp) in &latest {
              pairs.push((city, temp));
          }
          pairs.sort();
          for (city, temp) in pairs {
              println!("{city}: {temp}");
          }
      }
    tests:
      - stdin: "oslo 3\nlima 19\ncairo 31\noslo -2\n"
        expect: "cairo: 31\nlima: 19\noslo: -2"
      - stdin: "rome 22\n"
      - stdin: "zurich 5\nathens 30\nzurich 7\nmadrid 25\nathens 29\nbern 4\n"
        hidden: true
    require:
      - pattern: 'HashMap'
        message: Keep the HashMap for this exercise.
      - pattern: '\.sort'
        message: Sort the pairs (or keys) before printing.
    forbid:
      - pattern: 'BTreeMap'
        message: "Use the HashMap and sort the pairs yourself here; BTreeMap is the next exercise."
    hints:
      - "`latest.insert(city.to_string(), temp);` replaces any earlier reading for that city."
      - "Copy the pairs into a vector: `let mut pairs: Vec<(&String, &i32)> = Vec::new(); for (city, temp) in &latest { pairs.push((city, temp)); }`"
      - "`pairs.sort();` then print each pair. Tuples sort by city first."
    more:
      - task: |
          A warehouse logs lines like `bolts 40`. Add up the quantity for each product with a **BTreeMap<String, u32>**, then print every product and its total as `product: total`. Because a BTreeMap is sorted, a plain `for` loop prints them alphabetically.
        seed: |
          use std::collections::BTreeMap;
          use std::io::{self, BufRead};

          fn main() {
          }
        solution: |
          use std::collections::BTreeMap;
          use std::io::{self, BufRead};

          fn main() {
              let mut totals: BTreeMap<String, u32> = BTreeMap::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let parts: Vec<&str> = line.split_whitespace().collect();
                  let qty: u32 = parts[1].parse().expect("quantity must be a number");
                  match totals.get_mut(parts[0]) {
                      Some(total) => *total += qty,
                      None => {
                          totals.insert(parts[0].to_string(), qty);
                      }
                  }
              }
              for (product, total) in &totals {
                  println!("{product}: {total}");
              }
          }
        tests:
          - stdin: "bolts 40\nnuts 15\nbolts 2\nanchors 7\n"
            expect: "anchors: 7\nbolts: 42\nnuts: 15"
          - stdin: "tape 1\ntape 1\ntape 1\n"
          - stdin: "x 5\nb 9\nx 1\na 0\nb 1\n"
            hidden: true
        require:
          - pattern: 'BTreeMap'
            message: Use a BTreeMap so the output comes out sorted.
        hints:
          - "Split each line, parse the quantity, then add it: `get_mut` to add to an existing total, `insert` for a new product."
          - "`for (product, total) in &totals { println!(\"{product}: {total}\"); }` is already in alphabetical order."
      - task: |
          Write `fn sorted_by_value(scores: &HashMap<String, u32>) -> Vec<(String, u32)>` that returns all pairs with the highest score first and equal scores in alphabetical order by name. The tests compare the exact vector, so the order must be fully predictable.
        seed: |
          use std::collections::HashMap;

          fn sorted_by_value(scores: &HashMap<String, u32>) -> Vec<(String, u32)> {
              todo!()
          }
        solution: |
          use std::collections::HashMap;

          fn sorted_by_value(scores: &HashMap<String, u32>) -> Vec<(String, u32)> {
              let mut pairs = Vec::new();
              for (name, score) in scores {
                  pairs.push((name.clone(), *score));
              }
              pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));
              pairs
          }
        harness: |
          fn map(pairs: &[(&str, u32)]) -> HashMap<String, u32> {
              let mut m = HashMap::new();
              for (k, v) in pairs {
                  m.insert(k.to_string(), *v);
              }
              m
          }

          #[test]
          fn highest_first() {
              let m = map(&[("bo", 10), ("ana", 30), ("cy", 20)]);
              let want = vec![(String::from("ana"), 30), (String::from("cy"), 20), (String::from("bo"), 10)];
              assert_eq!(sorted_by_value(&m), want, "sorted_by_value(bo 10, ana 30, cy 20)");
          }

          #[test]
          fn ties_by_name() {
              let m = map(&[("zed", 5), ("amy", 5), ("kim", 5), ("top", 9)]);
              let want = vec![(String::from("top"), 9), (String::from("amy"), 5), (String::from("kim"), 5), (String::from("zed"), 5)];
              assert_eq!(sorted_by_value(&m), want, "sorted_by_value with three ties");
          }

          #[test]
          fn empty_map() {
              assert_eq!(sorted_by_value(&HashMap::new()), Vec::new(), "sorted_by_value of an empty map");
          }
        hints:
          - "Copy the pairs out: `for (name, score) in scores { pairs.push((name.clone(), *score)); }`"
          - "Sort by score descending, then name: `pairs.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(&b.0)));`"

  - title: Counting with entry
    id: hashmaps-3
    text: |
      The most common thing to do with a map is count: words in a text, hits per page, errors per server. Each time you see a key you want "add one, or start at one if it's new". With what you know so far, that's a `get_mut` and an `insert`: two lookups and a `match`. The **entry API** does it in one:

      ```rust run
      use std::collections::HashMap;

      fn main() {
          let text = "the crab and the gull and the crab";
          let mut counts: HashMap<&str, u32> = HashMap::new();
          for word in text.split_whitespace() {
              *counts.entry(word).or_insert(0) += 1;
          }

          let mut pairs: Vec<(&str, u32)> = Vec::new();
          for (word, n) in &counts {
              pairs.push((*word, *n));
          }
          pairs.sort();
          for (word, n) in pairs {
              println!("{word}: {n}");
          }
      }
      ```

      ```output
      and: 2
      crab: 2
      gull: 1
      the: 3
      ```

      Read `*counts.entry(word).or_insert(0) += 1;` from the inside out:

      1. `counts.entry(word)` finds the slot for `word`. That slot, an **Entry**, is either occupied (the word was seen before) or vacant.
      2. `.or_insert(0)` puts `0` in the slot if it was vacant. Either way it returns a `&mut u32` pointing at the count inside the map.
      3. `*... += 1` adds one through that reference.

      One lookup, no `match`, and it reads like the sentence "add one to this word's count, starting from zero".

      ### Other ways to fill an entry

      ```rust run
      use std::collections::BTreeMap;

      fn main() {
          let visits = ["home", "about", "home", "shop", "home"];

          let mut counts: BTreeMap<&str, u32> = BTreeMap::new();
          for page in visits {
              counts.entry(page).and_modify(|n| *n += 1).or_insert(1);
          }
          println!("{:?}", counts);

          let mut totals: BTreeMap<&str, u32> = BTreeMap::new();
          for page in visits {
              *totals.entry(page).or_default() += 1;
          }
          println!("{:?}", totals);
      }
      ```

      ```output
      {"about": 1, "home": 3, "shop": 1}
      {"about": 1, "home": 3, "shop": 1}
      ```

      - `.and_modify(|n| *n += 1)` runs the closure on the value only if the key already exists; `.or_insert(1)` handles the new key.
      - `.or_default()` inserts the type's default value: `0` for numbers, an empty `String` or `Vec`. It's handy for building lists per key, which you'll do in the last step.
      - The entry API works the same on `BTreeMap`; here it's used so the map can be printed directly.

      ### Common mistakes

      - **Holding two entries at once.** `or_insert` returns a mutable reference into the map, so the map stays mutably borrowed while you use it:

        ```rust compile_fail
        use std::collections::HashMap;

        fn main() {
            let mut counts: HashMap<&str, u32> = HashMap::new();
            let a = counts.entry("a").or_insert(0);
            let b = counts.entry("b").or_insert(0);
            *a += 1;
            *b += 1;
        }
        ```

        ```error
        error[E0499]: cannot borrow `counts` as mutable more than once at a time
        ```

        Inserting `"b"` could make the map grow and move its entries, which would leave `a` pointing at freed memory. Finish with one entry before starting the next: `*counts.entry("a").or_insert(0) += 1;` on one line, then the same for `"b"`.
      - **Keys need to be owned values of the key type.** With `String` keys, `entry` needs a `String`: `counts.entry(word.to_string())`. That allocates even when the word is already in the map, which is fine for most programs.

      **Your turn:** write `fn word_counts(text: &str) -> HashMap<String, u32>` that counts each word (split on whitespace), ignoring case: `"Rust"` and `"rust"` are the same word, stored in lowercase.
    seed: |
      use std::collections::HashMap;

      fn word_counts(text: &str) -> HashMap<String, u32> {
          todo!()
      }
    solution: |
      use std::collections::HashMap;

      fn word_counts(text: &str) -> HashMap<String, u32> {
          let mut counts = HashMap::new();
          for word in text.split_whitespace() {
              *counts.entry(word.to_lowercase()).or_insert(0) += 1;
          }
          counts
      }
    harness: |
      #[test]
      fn counts_repeated_words() {
          let c = word_counts("the crab and the gull");
          assert_eq!(c.get("the"), Some(&2), "count of \"the\"");
          assert_eq!(c.get("crab"), Some(&1), "count of \"crab\"");
          assert_eq!(c.len(), 4, "number of different words");
      }

      #[test]
      fn ignores_case() {
          let c = word_counts("Rust rust RUST");
          assert_eq!(c.get("rust"), Some(&3), "count of \"rust\"");
          assert_eq!(c.len(), 1, "number of different words");
      }

      #[test]
      fn extra_spaces_and_newlines() {
          let c = word_counts("  a\nb   a \n");
          assert_eq!(c.get("a"), Some(&2), "count of \"a\"");
          assert_eq!(c.get("b"), Some(&1), "count of \"b\"");
      }

      #[test]
      fn empty_text_and_missing_words() {
          let c = word_counts("");
          assert_eq!(c.len(), 0, "number of words in \"\"");
          assert_eq!(c.get("zebra"), None, "count of a word that never appears");
      }
