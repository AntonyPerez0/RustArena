      - task: |
          Compare the tags of two articles. The input is two lines of space-separated tags. Print the shared tags, the tags only in the first article, the tags only in the second (each list sorted and space-separated, or `(none)` if empty), and the **similarity**: shared tags as a percentage of all distinct tags, rounded down (print `0%` if there are no tags at all).

          For `rust web async` and `web rust cli tui`:

          ```
          shared: rust web
          only first: async
          only second: cli tui
          similarity: 40%
          ```
        seed: |
          use std::collections::BTreeSet;
          use std::io::{self, BufRead};

          fn main() {
              let mut lines: Vec<String> = Vec::new();
              for line in io::stdin().lock().lines() {
                  lines.push(line.expect("could not read a line"));
              }
              // lines[0] and lines[1] hold the two tag lists
          }
        solution: |
          use std::collections::BTreeSet;
          use std::io::{self, BufRead};

          fn show(set: &BTreeSet<&str>) -> String {
              if set.is_empty() {
                  return String::from("(none)");
              }
              let mut out = String::new();
              for tag in set {
                  if !out.is_empty() {
                      out.push(' ');
                  }
                  out.push_str(tag);
              }
              out
          }

          fn main() {
              let mut lines: Vec<String> = Vec::new();
              for line in io::stdin().lock().lines() {
                  lines.push(line.expect("could not read a line"));
              }
              // lines[0] and lines[1] hold the two tag lists
              let mut first = BTreeSet::new();
              for tag in lines[0].split_whitespace() {
                  first.insert(tag);
              }
              let mut second = BTreeSet::new();
              for tag in lines[1].split_whitespace() {
                  second.insert(tag);
              }
              let shared = &first & &second;
              let all = &first | &second;
              println!("shared: {}", show(&shared));
              println!("only first: {}", show(&(&first - &second)));
              println!("only second: {}", show(&(&second - &first)));
              let percent = if all.is_empty() { 0 } else { shared.len() * 100 / all.len() };
              println!("similarity: {percent}%");
          }
        tests:
          - stdin: "rust web async\nweb rust cli tui\n"
            expect: "shared: rust web\nonly first: async\nonly second: cli tui\nsimilarity: 40%"
          - stdin: "a b\na b\n"
          - stdin: "games\nmusic art\n"
            hidden: true
          - stdin: "x y z y\nz q x\n"
            hidden: true
        hints:
          - "Build a `BTreeSet<&str>` from each line with `split_whitespace` and `insert`."
          - "`&first & &second` is the shared set, `&first | &second` all tags, `&first - &second` only in the first."
          - "A small helper `fn show(set: &BTreeSet<&str>) -> String` that joins the tags with spaces (or returns `(none)`) keeps `main` short."

  - title: Your own keys, and grouping
    id: hashmaps-6
    text: |
      Any type can be a **value** in a map. A **key** has to support what the map does with it:

      - HashMap and HashSet hash keys and compare them for equality, so keys need the traits **`Hash`** and **`Eq`**.
      - BTreeMap and BTreeSet sort keys, so keys need **`Ord`**.

      A **trait** is a named set of abilities a type can have (module 22 covers them). Strings, integers, chars, bools, and tuples and arrays of them already have these. Your own structs and enums don't, until you ask:

      ```rust compile_fail
      use std::collections::HashMap;

      struct Point {
          x: i32,
          y: i32,
      }

      fn main() {
          let mut seen: HashMap<Point, u32> = HashMap::new();
          seen.insert(Point { x: 1, y: 2 }, 1);
      }
      ```

      ```error
      error[E0599]: the method `insert` exists for struct `HashMap<Point, u32>`, but its trait bounds were not satisfied
      ```

      The fix is one line above the type: `#[derive(PartialEq, Eq, Hash)]`. You've used `#[derive(Debug)]` already; derive writes these abilities for you too. `PartialEq` and `Eq` give `==` (field by field), and `Hash` computes a hash from all the fields. Deriving them together guarantees the rule maps rely on: **equal keys always have equal hashes**.

      ```rust run
      use std::collections::HashMap;

      #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
      enum Priority {
          Low,
          High,
          Urgent,
      }

      fn main() {
          let tickets = [(101, Priority::High), (102, Priority::Low), (103, Priority::Urgent), (104, Priority::High)];

          let mut by_priority: HashMap<Priority, Vec<u32>> = HashMap::new();
          for (id, p) in tickets {
              by_priority.entry(p).or_default().push(id);
          }

          for p in [Priority::Urgent, Priority::High, Priority::Low] {
              println!("{:?}: {:?}", p, by_priority[&p]);
          }
      }
      ```

      ```output
      Urgent: [103]
      High: [101, 104]
      Low: [102]
      ```

      - The enum derives `Hash` and `Eq`, so it can be a key. (`Clone, Copy` let us use `p` again after inserting it.)
      - `HashMap<Priority, Vec<u32>>` maps each key to a **list**: this is **grouping**, one of the most common map patterns.
      - `entry(p).or_default()` gives the existing list, or a new empty `Vec` the first time, and `.push(id)` adds to it.
      - Printing loops over a fixed array of priorities rather than over the map, so the order is ours, not the hash's.

      ### Tuples as keys

      Tuples of hashable types are hashable, which makes sparse grids easy: store only the cells that hold something.

      ```rust run
      use std::collections::HashMap;

      fn main() {
          let mut board: HashMap<(usize, usize), char> = HashMap::new();
          board.insert((0, 0), 'X');
          board.insert((1, 1), 'O');
          board.insert((0, 2), 'X');

          for row in 0..3 {
              let mut line = String::new();
              for col in 0..3 {
                  match board.get(&(row, col)) {
                      Some(&mark) => line.push(mark),
                      None => line.push('.'),
                  }
              }
              println!("{line}");
          }
      }
      ```

      ```output
      X.X
      .O.
      ...
      ```

      ### Common mistakes

      - **Floats as keys.** `f64` isn't `Eq` or `Hash` (NaN isn't equal to itself), so `HashMap<f64, _>` can't insert. Use integers (cents instead of dollars, millimeters instead of meters) or a string form.
      - **Deriving `Hash` without `Eq`** (or the other way round): derive both, plus `PartialEq`.
      - **Expecting derives on a struct with an un-hashable field.** If a field is an `f64`, the derive fails for the same reason.

      **Your turn:** write `fn group_by_department(staff: &[(&str, &str)]) -> HashMap<String, Vec<String>>`. Each pair is `(name, department)`. Return a map from each department to the names in it, in the order they appear in `staff`.
    seed: |
      use std::collections::HashMap;

      fn group_by_department(staff: &[(&str, &str)]) -> HashMap<String, Vec<String>> {
          todo!()
      }
    solution: |
      use std::collections::HashMap;

      fn group_by_department(staff: &[(&str, &str)]) -> HashMap<String, Vec<String>> {
          let mut groups: HashMap<String, Vec<String>> = HashMap::new();
          for (name, dept) in staff {
              groups.entry(dept.to_string()).or_default().push(name.to_string());
          }
          groups
      }
    harness: |
      fn names(list: &[&str]) -> Vec<String> {
          let mut v = Vec::new();
          for n in list {
              v.push(n.to_string());
          }
          v
      }

      #[test]
      fn groups_names_in_input_order() {
          let staff = [("ana", "eng"), ("bo", "sales"), ("cy", "eng"), ("dee", "eng")];
          let g = group_by_department(&staff);
          assert_eq!(g.get("eng"), Some(&names(&["ana", "cy", "dee"])), "the eng group");
          assert_eq!(g.get("sales"), Some(&names(&["bo"])), "the sales group");
      }

      #[test]
      fn one_entry_per_department() {
          let staff = [("ana", "eng"), ("bo", "sales"), ("cy", "eng")];
          assert_eq!(group_by_department(&staff).len(), 2, "number of departments");
      }

      #[test]
      fn unknown_department_is_missing() {
          let staff = [("ana", "eng")];
          assert_eq!(group_by_department(&staff).get("hr"), None, "the hr group");
      }

      #[test]
      fn no_staff() {
          assert_eq!(group_by_department(&[]).len(), 0, "number of departments with no staff");
      }
