  - title: A Vec of structs
    id: vectors-7
    text: |
      Most real vectors hold structs: students in a grade book, items in an inventory, orders in a queue. Everything from this module works the same way.

      ```rust run
      struct Student {
          name: String,
          score: u32,
      }

      fn main() {
          let mut class = Vec::with_capacity(3);
          class.push(Student { name: String::from("Ana"), score: 91 });
          class.push(Student { name: String::from("Bo"), score: 78 });
          class.push(Student { name: String::from("Cy"), score: 85 });

          for s in &mut class {
              s.score = (s.score + 5).min(100);
          }

          class.sort_by(|a, b| b.score.cmp(&a.score));
          for (i, s) in class.iter().enumerate() {
              println!("{}. {} {}", i + 1, s.name, s.score);
          }

          let best = &class[0];
          println!("best: {}", best.name);
      }
      ```

      ```output
      1. Ana 96
      2. Cy 90
      3. Bo 83
      best: Ana
      ```

      - `for s in &mut class` gives a `&mut Student` each time, and `s.score = ...` changes the student inside the vector. (Field access through a reference doesn't need `*`: Rust follows the reference for you.) `.min(100)` caps the curved score at 100.
      - `sort_by` compares the `score` fields. Structs have no built-in order, so you say which field to sort by.
      - `&class[0]` borrows the best student instead of moving it out.

      ### with_capacity

      `Vec::with_capacity(n)` allocates room for `n` elements up front. The vector is still empty (`len() == 0`), but the first `n` pushes won't need to grow it. When you know roughly how many elements are coming (the number of lines in a file, the size of another collection), it saves allocations. It's a performance hint, never required for correctness.

      ### Common mistakes

      - **Moving a struct out by index:** `let top = class[0];` is `cannot move out of index of Vec<Student>`. Use `&class[0]`.
      - **`sort()` on structs:**

        ```rust compile_fail
        struct Student {
            name: String,
            score: u32,
        }

        fn main() {
            let mut class = vec![Student { name: String::from("Ana"), score: 91 }];
            class.sort();
            println!("{} {}", class[0].name, class[0].score);
        }
        ```

        ```error
        error[E0277]: the trait bound `Student: Ord` is not satisfied
        ```

        Rust doesn't guess whether to sort students by name or by score. Say it: `class.sort_by_key(|s| s.score)` or `sort_by` with a comparison.
      - **Holding a reference while pushing.** `let best = &class[0]; class.push(...);` and then using `best` fails with E0502, for the same reason as pushing inside a loop.

      **Your turn:** write `fn restock_list(items: &[Item], min_qty: u32) -> Vec<String>` that returns the names of the items whose quantity is below `min_qty`, in alphabetical order. You'll need owned `String`s for the result, so push `item.name.clone()`.
    seed: |
      struct Item {
          name: String,
          qty: u32,
      }

      fn restock_list(items: &[Item], min_qty: u32) -> Vec<String> {
          todo!()
      }
    solution: |
      struct Item {
          name: String,
          qty: u32,
      }

      fn restock_list(items: &[Item], min_qty: u32) -> Vec<String> {
          let mut names = Vec::new();
          for item in items {
              if item.qty < min_qty {
                  names.push(item.name.clone());
              }
          }
          names.sort();
          names
      }
    harness: |
      fn item(name: &str, qty: u32) -> Item {
          Item { name: name.to_string(), qty }
      }

      #[test]
      fn lists_low_items_alphabetically() {
          let stock = [item("tape", 2), item("glue", 40), item("bolts", 0), item("nails", 9)];
          assert_eq!(restock_list(&stock, 10), vec!["bolts", "nails", "tape"], "restock_list(stock, 10)");
      }

      #[test]
      fn exactly_the_minimum_is_enough() {
          let stock = [item("tape", 10)];
          assert_eq!(restock_list(&stock, 10), Vec::<String>::new(), "restock_list([tape 10], 10)");
      }

      #[test]
      fn empty_inventory() {
          assert_eq!(restock_list(&[], 5), Vec::<String>::new(), "restock_list([], 5)");
      }
    hints:
      - "Loop with `for item in items`; each `item` is a `&Item`."
      - "`if item.qty < min_qty { names.push(item.name.clone()); }`"
      - "Sort the names before returning them: `names.sort(); names`"
    more:
      - task: |
          Write `fn most_valuable(items: &[Product]) -> Option<String>` that returns the name of the product with the largest stock value (`qty * price_cents`), or `None` for an empty slice. On a tie, keep the first one.

          Tip: `let [first, rest @ ..] = items else { return None; };` handles the empty case and gives you a starting "best" in one line.
        seed: |
          struct Product {
              name: String,
              qty: u32,
              price_cents: u32,
          }

          fn most_valuable(items: &[Product]) -> Option<String> {
              todo!()
          }
        solution: |
          struct Product {
              name: String,
              qty: u32,
              price_cents: u32,
          }

          fn most_valuable(items: &[Product]) -> Option<String> {
              let [first, rest @ ..] = items else {
                  return None;
              };
              let mut best = first;
              for p in rest {
                  if p.qty * p.price_cents > best.qty * best.price_cents {
                      best = p;
                  }
              }
              Some(best.name.clone())
          }
        harness: |
          fn product(name: &str, qty: u32, price_cents: u32) -> Product {
              Product { name: name.to_string(), qty, price_cents }
          }

          #[test]
          fn finds_the_largest_stock_value() {
              let items = [product("mug", 10, 900), product("plush", 3, 2500), product("sticker", 400, 50)];
              assert_eq!(most_valuable(&items), Some(String::from("sticker")), "most_valuable(mug 9000, plush 7500, sticker 20000)");
          }

          #[test]
          fn first_one_wins_a_tie() {
              let items = [product("a", 2, 50), product("b", 1, 100)];
              assert_eq!(most_valuable(&items), Some(String::from("a")), "most_valuable(a 100, b 100)");
          }

          #[test]
          fn empty_gives_none() {
              assert_eq!(most_valuable(&[]), None, "most_valuable(&[])");
          }
        hints:
          - "Start from the first product: `let [first, rest @ ..] = items else { return None; }; let mut best = first;`"
          - "Loop over `rest` and replace `best` when `p.qty * p.price_cents > best.qty * best.price_cents` (strictly greater keeps the first on ties)."
          - "Return `Some(best.name.clone())`."
      - task: |
          Write a grade book program. Each input line is `name score`. Store the students in a `Vec` of a `Student` struct you define, sort them by score (highest first, equal scores in name order), print them numbered, then print the class average with one decimal:

          ```
          1. ana 91
          2. cy 85
          3. bo 78
          average: 84.7
          ```
        seed: |
          use std::io::{self, BufRead};

          // define struct Student here

          fn main() {
          }
        solution: |
          use std::io::{self, BufRead};

          // define struct Student here
          struct Student {
              name: String,
              score: u32,
          }

          fn main() {
              let mut class: Vec<Student> = Vec::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let words: Vec<&str> = line.split_whitespace().collect();
                  if let [name, score] = words.as_slice() {
                      class.push(Student {
                          name: name.to_string(),
                          score: score.parse().expect("score must be a number"),
                      });
                  }
              }
              class.sort_by(|a, b| b.score.cmp(&a.score).then(a.name.cmp(&b.name)));
              let mut total = 0;
              for (i, s) in class.iter().enumerate() {
                  println!("{}. {} {}", i + 1, s.name, s.score);
                  total += s.score;
              }
              println!("average: {:.1}", total as f64 / class.len() as f64);
          }
        tests:
          - stdin: "bo 78\nana 91\ncy 85\n"
            expect: "1. ana 91\n2. cy 85\n3. bo 78\naverage: 84.7"
          - stdin: "zed 70\namy 70\nkim 100\n"
          - stdin: "solo 64\n"
            hidden: true
          - stdin: "d 50\nc 50\nb 99\na 1\n"
            hidden: true
        require:
          - pattern: 'struct\s+Student'
            message: "Define a `struct Student` with a name and a score."
        hints:
