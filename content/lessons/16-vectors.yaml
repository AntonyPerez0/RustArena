          A sorted list of user ids must stay sorted and unique. Write `fn insert_unique(sorted: &mut Vec<u32>, id: u32) -> bool` with `binary_search`: if the id is already there return `false` and change nothing; otherwise insert it at the position `binary_search` reports and return `true`.
        seed: |
