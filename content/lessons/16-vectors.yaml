          use std::io::{self, BufRead};

          fn main() {
              let mut guests: Vec<String> = Vec::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let name = line.trim();
                  if !name.is_empty() {
                      guests.push(name.to_lowercase());
