        solution: |
          fn insert_unique(sorted: &mut Vec<u32>, id: u32) -> bool {
              match sorted.binary_search(&id) {
                  Ok(_) => false,
                  Err(pos) => {
                      sorted.insert(pos, id);
                      true
                  }
              }
          }
