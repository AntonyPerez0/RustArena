              let mut ids = vec![3, 8, 20];
              assert_eq!(insert_unique(&mut ids, 8), false, "insert_unique([3, 8, 20], 8)");
              assert_eq!(ids, vec![3, 8, 20], "ids after trying to insert 8 again");
