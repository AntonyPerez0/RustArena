              assert_eq!(insert_unique(&mut ids, 1), true, "insert_unique([5], 1)");
              assert_eq!(insert_unique(&mut ids, 9), true, "insert_unique([1, 5], 9)");
              assert_eq!(ids, vec![1, 5, 9], "ids after three inserts");
          }
