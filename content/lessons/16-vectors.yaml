id: vectors
title: Vectors
phase: "Structuring data"
summary: "Vec<T>, the growable list you'll use more than any other collection: adding and removing, safe access with get, the three ways to loop, sorting, deduplicating, searching, and vectors of your own structs."
roadmap: [Vectors, "Collections: Vec"]
steps:
  - title: Creating and growing a Vec
    id: vectors-1
    text: |
      A **vector**, written `Vec<T>`, is a list of values of one type `T`, stored next to each other on the heap. An array (`[i32; 5]`) has a length fixed when you compile; a vector grows and shrinks while the program runs. That's what you need whenever the data comes from input, a file or the network, so `Vec` is the collection you'll use most in Rust.

      ```rust run
      fn main() {
          let mut scores: Vec<u32> = Vec::new();
          scores.push(72);
          scores.push(95);
          scores.push(88);
          println!("{:?} (len {})", scores, scores.len());

          let primes = vec![2, 3, 5, 7];
          let zeros = vec![0; 5];
          println!("{:?} {:?}", primes, zeros);

          let last = scores.pop();
          println!("popped {:?}, left {:?}", last, scores);
          println!("empty? {}", scores.is_empty());
      }
      ```

      ```output
      [72, 95, 88] (len 3)
      [2, 3, 5, 7] [0, 0, 0, 0, 0]
      popped Some(88), left [72, 95]
      empty? false
      ```

      Piece by piece:

      - `Vec::new()` makes an empty vector. It has no elements yet to infer the type from, so we write it: `Vec<u32>`.
      - `push` adds an element at the end. It changes the vector, so the variable must be `mut`.
      - `vec![2, 3, 5, 7]` is a macro that builds a vector from a list; `vec![0; 5]` makes five copies of `0`.
      - `pop` removes the **last** element and returns it inside an `Option`: `Some(88)`, or `None` if the vector was empty. Rust makes you deal with the empty case instead of handing you garbage.
      - `len()` counts the elements; `is_empty()` is the idiomatic way to check for zero (clippy suggests it over `len() == 0`).

      ### How a Vec is stored

      The vector variable itself is three numbers on the stack: a pointer to a buffer on the heap, the **length** (how many elements are in use) and the **capacity** (how many fit before the buffer is full). When a `push` finds the buffer full, the Vec allocates a bigger one (about twice the size), moves the elements over and frees the old one. Doubling means most pushes are cheap; growing is rare.

      ### Common mistakes

      - **Forgetting `mut`:**

        ```rust compile_fail
        fn main() {
            let v = Vec::new();
            v.push(1);
        }
        ```

        ```error
        error[E0596]: cannot borrow `v` as mutable, as it is not declared as mutable
        ```

      - **An empty vector the compiler can't figure out.** If nothing ever goes into it, Rust can't guess the element type:

        ```rust compile_fail
        fn main() {
            let v = Vec::new();
            println!("{}", v.len());
        }
        ```

        ```error
        error[E0282]: type annotations needed for `Vec<_>`
        ```

        Write `let v: Vec<i32> = Vec::new();`.
      - **Mixing types.** `vec![1, "two"]` is a `mismatched types` error: every element has the same type.

      **Your turn:** a coffee bar keeps orders in a stack (the newest order is made first). Fill in the blanks: the vector's type, the method that adds an order, and the method that takes the newest one off.
    fill: |
      fn main() {
          let mut orders: [[Vec<String>]] = Vec::new();
          orders.[[push]](String::from("latte"));
          orders.push(String::from("mocha"));
          orders.push(String::from("tea"));
          let made = orders.[[pop]]();
          println!("made {:?}, waiting {:?}", made, orders);
      }
    hints:
      - "The orders are `String`s, so the vector is a `Vec<String>`."
      - "`push` adds to the end; `pop` removes from the end and returns an `Option`."
    tests:
      - expect: "made Some(\"tea\"), waiting [\"latte\", \"mocha\"]"
    more:
      - task: |
          Write a program that reads whole numbers separated by spaces or newlines, stores them in a `Vec<i64>`, prints `read N numbers`, and then prints them in **reverse** order, one per line, by popping them off with `while let Some(n) = numbers.pop()`.
        seed: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("could not read input");
              // push each number into a Vec, then pop them all off
          }
        solution: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("could not read input");
              // push each number into a Vec, then pop them all off
              let mut numbers: Vec<i64> = Vec::new();
              for word in input.split_whitespace() {
                  numbers.push(word.parse().expect("not a number"));
              }
              println!("read {} numbers", numbers.len());
              while let Some(n) = numbers.pop() {
                  println!("{n}");
              }
          }
        tests:
          - stdin: "3 1 4\n1 5\n"
            expect: "read 5 numbers\n5\n1\n4\n1\n3"
          - stdin: "-7\n"
          - stdin: "10 20 30 40 50 60\n"
            hidden: true
        require:
          - pattern: '\.push\('
            message: "Store each number with `push`."
          - pattern: 'while\s+let\s+Some'
            message: "Print them with `while let Some(n) = numbers.pop()`."
        hints:
          - "`let mut numbers: Vec<i64> = Vec::new();` then `for word in input.split_whitespace() { numbers.push(word.parse().expect(\"not a number\")); }`"
          - "After the loop: `println!(\"read {} numbers\", numbers.len());`"
          - "`while let Some(n) = numbers.pop() { println!(\"{n}\"); }` prints the last number first."
      - task: |
          A shop wants running totals of its daily sales. Write `fn running_totals(sales: &[u32]) -> Vec<u32>`: element `i` of the result is the sum of `sales[0]` to `sales[i]`. For `[5, 10, 3]` return `[5, 15, 18]`; for an empty slice return an empty vector.
        seed: |
          fn running_totals(sales: &[u32]) -> Vec<u32> {
              todo!()
          }
        solution: |
          fn running_totals(sales: &[u32]) -> Vec<u32> {
              let mut totals = Vec::new();
              let mut sum = 0;
              for s in sales {
                  sum += *s;
                  totals.push(sum);
              }
              totals
          }
        harness: |
          #[test]
          fn adds_up_as_it_goes() {
              assert_eq!(running_totals(&[5, 10, 3]), vec![5, 15, 18], "running_totals(&[5, 10, 3])");
          }

          #[test]
          fn empty_input_gives_empty_vec() {
              assert_eq!(running_totals(&[]), Vec::<u32>::new(), "running_totals(&[])");
          }

          #[test]
          fn single_day() {
              assert_eq!(running_totals(&[42]), vec![42], "running_totals(&[42])");
          }

          #[test]
          fn zero_sales_keep_the_total() {
              assert_eq!(running_totals(&[0, 7, 0, 1]), vec![0, 7, 7, 8], "running_totals(&[0, 7, 0, 1])");
          }
        hints:
          - "Start with `let mut totals = Vec::new();` and `let mut sum = 0;`"
          - "Loop with `for s in sales`: add `*s` to `sum`, then `totals.push(sum)`."
          - "Return `totals` as the last expression."

  - title: Reading elements with [] and get
    id: vectors-2
    text: |
      There are two ways to read an element. Indexing, `v[i]`, gives you the element directly and **panics** if `i` is past the end. `v.get(i)` returns an `Option`: `Some(&element)` or `None`.

      ```rust run
      fn main() {
          let podium = vec!["Ferris", "Corro", "Bunny"];
          println!("winner: {}", podium[0]);
          println!("third: {}", podium[2]);

          match podium.get(5) {
              Some(name) => println!("sixth: {name}"),
              None => println!("no sixth place"),
          }
          println!("{:?} {:?}", podium.first(), podium.last());
      }
      ```

      ```output
      winner: Ferris
      third: Bunny
      no sixth place
      Some("Ferris") Some("Bunny")
      ```

      Indexes start at 0, so the last valid index is `len() - 1`. `first()` and `last()` are `get(0)` and `get(len - 1)` with names, and return `None` on an empty vector.

      Here's what happens when indexing goes past the end:

      ```rust panics
      fn main() {
          let podium = vec!["Ferris", "Corro", "Bunny"];
          println!("checking place 4");
          println!("{}", podium[3]);
      }
      ```

      ```output
      checking place 4
      ```

      The program stops with this message, plus the file and line of the bad index:

      ```text
      index out of bounds: the len is 3 but the index is 3
      ```

      A **panic** stops the program with a message. Unlike C or C++, Rust never reads whatever memory happens to be past the end: it always checks.

      ### Which one to use

      - Use `v[i]` when an index past the end would be a **bug** in your own code (a loop bound you control). The panic points straight at the bug.
      - Use `v.get(i)` when the index comes from **outside**: user input, a file, a request. A missing element is then a normal situation you handle with `match`, `if let` or `let ... else`.

      ### Indexes are usize

      Indexes and lengths have the type `usize`. An `i32` index doesn't compile:

      ```rust compile_fail
      fn main() {
          let v = vec![10, 20, 30];
          let i: i32 = 1;
          println!("{}", v[i]);
      }
      ```

      ```error
      error[E0277]: the type `[{integer}]` cannot be indexed by `i32`
      ```

      Make the variable a `usize`, or convert with `i as usize` when you know it isn't negative.

      ### Common mistake: moving out by index

      `v[0]` on a `Vec<i32>` copies the number. On a `Vec<String>` it would have to move the String out and leave a hole, which Rust doesn't allow:

      ```rust compile_fail
      fn main() {
          let names = vec![String::from("Ana"), String::from("Bo")];
          let first = names[0];
          println!("{first}");
      }
      ```

      ```error
      error[E0507]: cannot move out of index of `Vec<String>`
      ```

      Borrow it (`let first = &names[0];`) or copy it explicitly (`names[0].clone()`). In the same way, `get` gives you a reference (`Option<&String>`), never the value itself.

      **Your turn:** a game inventory has numbered slots. Write `fn inventory_line(items: &[&str], slot: usize) -> String` that returns `"slot 2: shield"` for an existing slot and `"slot 9: empty"` for a slot past the end. Use `get`, so a big slot number can't crash the game.
    seed: |
      fn inventory_line(items: &[&str], slot: usize) -> String {
          todo!()
      }
    solution: |
      fn inventory_line(items: &[&str], slot: usize) -> String {
          match items.get(slot) {
              Some(item) => format!("slot {slot}: {item}"),
              None => format!("slot {slot}: empty"),
          }
      }
    harness: |
      #[test]
      fn existing_slot() {
          let items = ["sword", "potion", "shield"];
          assert_eq!(inventory_line(&items, 2), "slot 2: shield", "inventory_line(&[sword, potion, shield], 2)");
          assert_eq!(inventory_line(&items, 0), "slot 0: sword", "inventory_line(&[sword, potion, shield], 0)");
      }

      #[test]
      fn slot_just_past_the_end() {
          let items = ["sword", "potion", "shield"];
          assert_eq!(inventory_line(&items, 3), "slot 3: empty", "inventory_line(&[sword, potion, shield], 3)");
      }

      #[test]
      fn huge_slot_number() {
          let items = ["sword"];
          assert_eq!(inventory_line(&items, 9999), "slot 9999: empty", "inventory_line(&[sword], 9999)");
      }

      #[test]
      fn empty_inventory() {
          assert_eq!(inventory_line(&[], 0), "slot 0: empty", "inventory_line(&[], 0)");
      }
    forbid:
      - pattern: 'items\s*\['
        message: "Use `items.get(slot)` instead of indexing, so a slot past the end can't panic."
    hints:
      - "`items.get(slot)` returns `Some(&item)` or `None`."
      - "`match items.get(slot) { Some(item) => format!(\"slot {slot}: {item}\"), None => ... }`"
    more:
      - task: |
          The first input line lists player names separated by spaces. Every line after that holds an index. For each index print the player's name, or `no player at index N` if there's no such player. The reading code is done; write the lookup with `get`.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              let mut first = String::new();
              io::stdin().read_line(&mut first).expect("could not read names");
              let players: Vec<&str> = first.split_whitespace().collect();

              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let index: usize = line.trim().parse().expect("not an index");
                  // print the player at `index`, or "no player at index N"
              }
          }
        solution: |
          use std::io::{self, BufRead};

          fn main() {
              let mut first = String::new();
              io::stdin().read_line(&mut first).expect("could not read names");
              let players: Vec<&str> = first.split_whitespace().collect();

              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let index: usize = line.trim().parse().expect("not an index");
                  // print the player at `index`, or "no player at index N"
                  match players.get(index) {
                      Some(name) => println!("{name}"),
                      None => println!("no player at index {index}"),
                  }
              }
          }
        tests:
          - stdin: "ana bo cy\n1\n5\n0\n"
            expect: "bo\nno player at index 5\nana"
          - stdin: "solo\n0\n1\n"
          - stdin: "w x y z\n3\n4\n2\n100\n"
            hidden: true
        forbid:
          - pattern: 'players\s*\['
            message: "Use `players.get(index)` so a bad index doesn't panic."
        hints:
          - "`match players.get(index) { Some(name) => ..., None => ... }`"
      - task: |
          Write `fn median(sorted: &[f64]) -> Option<f64>` for a slice that is already sorted. Return `None` for an empty slice. With an odd number of values the median is the middle one; with an even number it's the average of the two middle values (`[1.0, 2.0, 3.0, 10.0]` gives `2.5`).
        seed: |
          fn median(sorted: &[f64]) -> Option<f64> {
              todo!()
          }
        solution: |
          fn median(sorted: &[f64]) -> Option<f64> {
              let n = sorted.len();
              if n == 0 {
                  return None;
              }
              let mid = n / 2;
              if n % 2 == 1 {
                  Some(sorted[mid])
              } else {
                  Some((sorted[mid - 1] + sorted[mid]) / 2.0)
              }
          }
        harness: |
          #[test]
          fn empty_has_no_median() {
              assert_eq!(median(&[]), None, "median(&[])");
          }

          #[test]
          fn one_value() {
              assert_eq!(median(&[3.0]), Some(3.0), "median(&[3.0])");
          }

          #[test]
          fn odd_count_takes_the_middle() {
              assert_eq!(median(&[1.0, 2.0, 10.0]), Some(2.0), "median(&[1.0, 2.0, 10.0])");
          }

          #[test]
          fn even_count_averages_the_two_middle_values() {
              assert_eq!(median(&[1.0, 2.0, 3.0, 10.0]), Some(2.5), "median(&[1.0, 2.0, 3.0, 10.0])");
              assert_eq!(median(&[4.0, 8.0]), Some(6.0), "median(&[4.0, 8.0])");
          }
        hints:
          - "Handle the empty case first: `if sorted.is_empty() { return None; }`"
          - "With `let mid = sorted.len() / 2;` the middle of an odd-length slice is `sorted[mid]`."
          - "For an even length the two middle values are `sorted[mid - 1]` and `sorted[mid]`. Indexing is fine here: you checked the length, so a panic would mean a bug."

  - title: "Looping: &v, &mut v and v"
    id: vectors-3
    text: |
      There are three ways to loop over a vector, and they match the three ways to use any value in Rust: borrow it, borrow it mutably, or take ownership.

      ```rust run
      fn main() {
          let mut prices = vec![1200, 450, 999];

          let mut total = 0;
          for p in &prices {
              total += *p;
          }
          println!("total {total}");

          for p in &mut prices {
              *p = *p * 9 / 10;
          }
          println!("{:?}", prices);

          for p in prices {
              println!("{p}");
          }
      }
      ```

      ```output
      total 2649
      [1080, 405, 899]
      1080
      405
      899
      ```

      | Loop | Each `p` is | The vector afterwards |
      |---|---|---|
      | `for p in &prices` | `&u32`, a shared reference | unchanged, still usable |
      | `for p in &mut prices` | `&mut u32`, a mutable reference | changed in place, still usable |
      | `for p in prices` | `u32`, the value itself | **moved**: gone after the loop |

      - In the first loop `p` is a reference, so `*p` reads the number it points to.
      - In the second loop `*p = ...` writes through the mutable reference into the vector itself (the borrowing module's `*`).
      - The third loop consumes the vector. Use it when you're done with the vector and want to move its elements somewhere else.

      You'll also see the method forms `prices.iter()`, `prices.iter_mut()` and `prices.into_iter()`; they mean exactly the same three things.

      ### When you need the position too

      `.iter().enumerate()` gives you `(index, element)` pairs, which a `for` pattern takes apart:

      ```rust run
      fn main() {
          let runners = vec!["Ana", "Bo", "Cy"];
          for (i, name) in runners.iter().enumerate() {
              println!("{}. {name}", i + 1);
          }
      }
      ```

      ```output
      1. Ana
      2. Bo
      3. Cy
      ```

      That's tidier than `for i in 0..runners.len()` with `runners[i]`, and clippy suggests it (`needless_range_loop`). Module 27 covers `enumerate` and friends properly.

      ### Common mistakes

      - **Using the vector after a consuming loop:**

        ```rust compile_fail
        fn main() {
            let v = vec![1, 2, 3];
            for x in v {
                println!("{x}");
            }
            println!("{}", v.len());
        }
        ```

        ```error
        error[E0382]: borrow of moved value: `v`
        ```

        Loop over `&v` if you still need `v` afterwards.
      - **Changing the vector while looping over it.** The loop holds a borrow of `v`; `push` needs a mutable borrow at the same time:

        ```rust compile_fail
        fn main() {
            let mut v = vec![1, 2, 3];
            for x in &v {
                if *x == 2 {
                    v.push(20);
                }
            }
        }
        ```

        ```error
        error[E0502]: cannot borrow `v` as mutable because it is also borrowed as immutable
        ```

        This isn't fussiness: `push` might move the whole buffer to a bigger allocation, and the loop's reference would point at freed memory. In C++ this is a classic crash (iterator invalidation); in Rust it doesn't compile. Collect what you want to add in a second vector and add it after the loop.
      - **Forgetting the `*`:** `x += 1` where `x: &mut i32` fails with ``binary assignment operation `+=` cannot be applied to type `&mut i32` ``. Write `*x += 1`.

      **Your turn:** write `fn apply_raise(salaries: &mut [u32], percent: u32)` that raises every salary in place by `percent` percent (integer math: `s * (100 + percent) / 100`). Loop over the slice mutably; don't index.
    seed: |
      fn apply_raise(salaries: &mut [u32], percent: u32) {
          todo!()
      }
    solution: |
      fn apply_raise(salaries: &mut [u32], percent: u32) {
          for s in salaries {
              *s = *s * (100 + percent) / 100;
          }
      }
    harness: |
      #[test]
      fn ten_percent_raise() {
          let mut s = vec![1000, 2500];
          apply_raise(&mut s, 10);
          assert_eq!(s, vec![1100, 2750], "salaries [1000, 2500] after a 10% raise");
      }

      #[test]
      fn zero_percent_changes_nothing() {
          let mut s = vec![1234, 5];
          apply_raise(&mut s, 0);
          assert_eq!(s, vec![1234, 5], "salaries [1234, 5] after a 0% raise");
      }

      #[test]
      fn rounds_down() {
          let mut s = vec![999];
          apply_raise(&mut s, 5);
          assert_eq!(s, vec![1048], "salary [999] after a 5% raise");
      }

      #[test]
      fn empty_list_is_fine() {
          let mut s: Vec<u32> = Vec::new();
          apply_raise(&mut s, 50);
          assert_eq!(s, Vec::<u32>::new(), "an empty list after a raise");
      }
    forbid:
      - pattern: 'salaries\s*\['
        message: "Loop with `for s in salaries` (each `s` is a `&mut u32`) instead of indexing."
    hints:
      - "`salaries` is already a mutable slice, so `for s in salaries` gives you a `&mut u32` for each element."
      - "Write through the reference: `*s = *s * (100 + percent) / 100;`"
    more:
      - task: |
          Write `fn clamp_all(values: &mut [i32], low: i32, high: i32)` that changes every value below `low` to `low` and every value above `high` to `high`, in place. (Sensors sometimes report wild numbers; this keeps them in a sane range.)
        seed: |
          fn clamp_all(values: &mut [i32], low: i32, high: i32) {
              todo!()
          }
        solution: |
          fn clamp_all(values: &mut [i32], low: i32, high: i32) {
              for v in values {
                  if *v < low {
                      *v = low;
                  } else if *v > high {
                      *v = high;
                  }
              }
          }
        harness: |
          #[test]
          fn clamps_both_ends() {
              let mut v = vec![-50, 3, 200, 7];
              clamp_all(&mut v, 0, 100);
              assert_eq!(v, vec![0, 3, 100, 7], "clamp_all([-50, 3, 200, 7], 0, 100)");
          }

          #[test]
          fn values_in_range_are_unchanged() {
              let mut v = vec![1, 2, 3];
              clamp_all(&mut v, 1, 3);
              assert_eq!(v, vec![1, 2, 3], "clamp_all([1, 2, 3], 1, 3)");
          }

          #[test]
          fn negative_range() {
              let mut v = vec![-100, -5, 0];
              clamp_all(&mut v, -10, -1);
              assert_eq!(v, vec![-10, -5, -1], "clamp_all([-100, -5, 0], -10, -1)");
          }
        forbid:
          - pattern: 'values\s*\['
            message: "Loop with `for v in values` and write through `*v`."
        hints:
          - "`for v in values { ... }` gives a `&mut i32` each time."
          - "`if *v < low { *v = low; } else if *v > high { *v = high; }`"
      - task: |
          Write a program that reads one temperature per line (like `21.5`), stores them in a `Vec<f64>`, then prints the average with one decimal, followed by each reading (one decimal) and whether it's `above`, `below` or `equal` to the average. You need the average before you can label the readings, which is why they have to be stored first.

          For the input `21.5`, `19.0`, `23.5` print:

          ```
          average: 21.3
          21.5 above
          19.0 below
          23.5 above
          ```
        seed: |
          use std::io::{self, BufRead};

          fn main() {
          }
        solution: |
          use std::io::{self, BufRead};

          fn main() {
              let mut temps: Vec<f64> = Vec::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  temps.push(line.trim().parse().expect("not a number"));
              }
              let mut sum = 0.0;
              for t in &temps {
                  sum += *t;
              }
              let average = sum / temps.len() as f64;
              println!("average: {average:.1}");
              for t in &temps {
                  let label = if *t > average {
                      "above"
                  } else if *t < average {
                      "below"
                  } else {
                      "equal"
                  };
                  println!("{t:.1} {label}");
              }
          }
        tests:
          - stdin: "21.5\n19.0\n23.5\n"
            expect: "average: 21.3\n21.5 above\n19.0 below\n23.5 above"
          - stdin: "10\n20\n30\n"
          - stdin: "-4.5\n0.25\n3\n7.75\n"
            hidden: true
