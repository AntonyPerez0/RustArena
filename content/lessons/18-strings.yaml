      - task: |
          Write `fn progress_bar(done: u32, total: u32, width: usize) -> String` for a command-line tool. The percentage is `done * 100 / total` (rounded down; treat `total == 0` as 100%). The bar has `width` characters: `width * percent / 100` of them `#`, the rest `-`. After the bar comes a space and the percentage right-aligned in 3 columns, then `%`:

          ```
