        tests:
          - stdin: "[INFO] started\n[ERROR] disk full\n  [ERROR]   timeout talking to db  \n[WARN] slow\n"
            expect: "disk full\ntimeout talking to db\n2 errors"
          - stdin: "[INFO] all good\n"
          - stdin: "[error] lowercase is not an error\n[ERROR]payment declined\n[ERROR] x\nERROR no brackets\n"
