  - title: "Splitting: lines, split, splitn, split_once"
    id: strings-3
    text: |
      Most text a program receives is structured: lines, fields separated by commas or tabs, `key=value` pairs. Splitting is how you take it apart.

      ```rust run
      fn main() {
          let order = "A12,Crab plush,4\nB07,Rust mug,12\nC33,Sticker pack,1";
          let mut total = 0;
          for line in order.lines() {
              let fields: Vec<&str> = line.split(',').collect();
              let qty: u32 = fields[2].parse().expect("qty must be a number");
              total += qty;
              println!("{} x {}", qty, fields[1]);
          }
          println!("{total} items");
      }
      ```

      ```output
      4 x Crab plush
      12 x Rust mug
      1 x Sticker pack
      17 items
      ```

      - `lines()` splits text into lines. It handles both `\n` and Windows `\r\n` endings and doesn't produce an empty last line for a trailing newline.
      - `split(',')` gives the pieces between commas. `.collect()` gathers them into a `Vec<&str>`. The pieces are slices **pointing into the original text**: nothing is copied.
      - `fields[2].parse()` turns the text `"4"` into a number. `parse` works for any type that knows how to read itself from text (integers, floats, `bool`, `char`), and returns a `Result` because the text might not be a valid number.

      ### The splitting family

      ```rust run
      fn main() {
          println!("{:?}", "a,,b".split(',').collect::<Vec<&str>>());
          println!("{:?}", "  a   b ".split_whitespace().collect::<Vec<&str>>());
          println!("{:?}", "ERROR: disk full: /var".splitn(2, ": ").collect::<Vec<&str>>());
          println!("{:?}", "port=8080".split_once('='));
          println!("{:?}", "report.final.pdf".rsplit_once('.'));
          println!("{:?}", "a;b,c".split([',', ';']).collect::<Vec<&str>>());
      }
      ```

      ```output
      ["a", "", "b"]
      ["a", "b"]
      ["ERROR", "disk full: /var"]
      Some(("port", "8080"))
      Some(("report.final", "pdf"))
      ["a", "b", "c"]
      ```

      | Method | Splits | Notes |
      |---|---|---|
      | `split(sep)` | at every separator | keeps empty pieces (`"a,,b"` has an empty middle field) |
      | `split_whitespace()` | at any run of spaces, tabs, newlines | never gives empty pieces |
      | `lines()` | at line endings | |
      | `splitn(n, sep)` | at most `n` pieces | the last piece keeps any further separators |
      | `split_once(sep)` | at the first separator | `Option<(&str, &str)>`: `None` if there's none |
      | `rsplit_once(sep)` | at the last separator | file extensions, `host:port` |

      The separator can be a `char`, a `&str`, an array of chars (`[',', ';']`, any of them) or a closure (`|c: char| !c.is_alphanumeric()`). `collect::<Vec<&str>>()` names the type in place (the "turbofish" `::<>`) when there's no variable to annotate.

      ### Common mistakes

      - **`split(' ')` for words.** `"a  b".split(' ')` gives `["a", "", "b"]` because of the double space. Use `split_whitespace()`.
      - **Indexing fields blindly.** `fields[2]` panics on a short line. For input you don't control, check the length or match on `fields.as_slice()` with a slice pattern (module 15).
      - **`split('\n')` on text ending in a newline** gives an extra empty string at the end. Use `lines()`.

      **Your turn:** write `fn parse_product(line: &str) -> Option<Product>` for lines like `A12, Crab plush, 4` (SKU, name, quantity). Trim spaces around each field. Return `None` unless there are exactly three fields and the quantity is a valid `u32`. Tip: `let [sku, name, qty] = fields.as_slice() else { return None; };`
    seed: |
      #[derive(Debug)]
      struct Product {
          sku: String,
          name: String,
          qty: u32,
      }

      fn parse_product(line: &str) -> Option<Product> {
          todo!()
      }
    solution: |
      #[derive(Debug)]
      struct Product {
          sku: String,
          name: String,
          qty: u32,
      }

      fn parse_product(line: &str) -> Option<Product> {
          let fields: Vec<&str> = line.split(',').collect();
          let [sku, name, qty] = fields.as_slice() else {
              return None;
          };
          let Ok(qty) = qty.trim().parse::<u32>() else {
              return None;
          };
          Some(Product {
              sku: sku.trim().to_string(),
              name: name.trim().to_string(),
              qty,
          })
      }
    harness: |
      #[test]
      fn parses_a_good_line() {
          let p = parse_product("A12,Crab plush,4").expect("A12,Crab plush,4 should parse");
          assert_eq!(p.sku, "A12", "sku");
          assert_eq!(p.name, "Crab plush", "name");
          assert_eq!(p.qty, 4, "qty");
      }

      #[test]
      fn trims_spaces_around_fields() {
          let p = parse_product("  B07 , Rust mug ,12 ").expect("\"  B07 , Rust mug ,12 \" should parse");
          assert_eq!(p.sku, "B07", "sku");
          assert_eq!(p.name, "Rust mug", "name");
          assert_eq!(p.qty, 12, "qty");
      }

      #[test]
      fn wrong_number_of_fields() {
          assert_eq!(parse_product("A12,Crab plush").is_none(), true, "parse_product(\"A12,Crab plush\") is None");
          assert_eq!(parse_product("A12,Crab,plush,4").is_none(), true, "parse_product(\"A12,Crab,plush,4\") is None");
      }

      #[test]
      fn bad_quantity() {
          assert_eq!(parse_product("A12,Crab plush,four").is_none(), true, "parse_product(\"A12,Crab plush,four\") is None");
          assert_eq!(parse_product("A12,Crab plush,-1").is_none(), true, "parse_product(\"A12,Crab plush,-1\") is None");
      }
    hints:
      - "`let fields: Vec<&str> = line.split(',').collect();`"
      - "`let [sku, name, qty] = fields.as_slice() else { return None; };` checks there are exactly three."
      - "`let Ok(qty) = qty.trim().parse::<u32>() else { return None; };` then build the Product with trimmed `to_string()` copies."
    more:
      - task: |
          Write `fn extension(filename: &str) -> Option<&str>` that returns the text after the **last** dot: `"photo.JPG"` gives `Some("JPG")` and `"archive.tar.gz"` gives `Some("gz")`. Return `None` when there's no dot, when the name *starts* with its only dot (hidden files like `.bashrc` have no extension), or when the dot is the last character.
        seed: |
          fn extension(filename: &str) -> Option<&str> {
              todo!()
          }
        solution: |
          fn extension(filename: &str) -> Option<&str> {
              match filename.rsplit_once('.') {
                  Some((stem, ext)) if !stem.is_empty() && !ext.is_empty() => Some(ext),
                  _ => None,
              }
          }
        harness: |
          #[test]
          fn simple_extension() {
              assert_eq!(extension("photo.JPG"), Some("JPG"), "extension(\"photo.JPG\")");
          }

          #[test]
          fn uses_the_last_dot() {
              assert_eq!(extension("archive.tar.gz"), Some("gz"), "extension(\"archive.tar.gz\")");
          }

          #[test]
          fn no_dot() {
              assert_eq!(extension("README"), None, "extension(\"README\")");
          }

          #[test]
          fn hidden_file_and_trailing_dot() {
              assert_eq!(extension(".bashrc"), None, "extension(\".bashrc\")");
              assert_eq!(extension("notes."), None, "extension(\"notes.\")");
          }
        require:
          - pattern: 'rsplit_once|rfind'
            message: "Split at the last dot with `rsplit_once('.')`."
        hints:
          - "`filename.rsplit_once('.')` gives `Some((stem, ext))` split at the last dot."
          - "A match guard rejects the edge cases: `Some((stem, ext)) if !stem.is_empty() && !ext.is_empty() => Some(ext),`"
      - task: |
          Read a CSV grade sheet from input. The first line is the header `name,score`; every other line should be `name,score`. Trim spaces around each field. Skip rows that don't have exactly two fields (an empty line counts as one such row) or whose score isn't a whole number. There's always at least one valid row. Print:

          ```
          students: 3
          average: 84.7
          best: ana (91)
          skipped: 1
          ```

          The average has one decimal. If two students share the best score, report the first one.
        seed: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("could not read input");
          }
        solution: |
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("could not read input");
              let mut count = 0;
              let mut total = 0;
              let mut skipped = 0;
              let mut best_name = "";
              let mut best_score = 0;
              let mut header = true;
              for line in input.lines() {
                  if header {
                      header = false;
                      continue;
                  }
                  let fields: Vec<&str> = line.split(',').collect();
                  let [name, score] = fields.as_slice() else {
                      skipped += 1;
                      continue;
                  };
                  let Ok(score) = score.trim().parse::<u32>() else {
                      skipped += 1;
                      continue;
                  };
                  if count == 0 || score > best_score {
                      best_name = name.trim();
                      best_score = score;
                  }
                  count += 1;
                  total += score;
              }
              println!("students: {count}");
              println!("average: {:.1}", total as f64 / count as f64);
              println!("best: {best_name} ({best_score})");
              println!("skipped: {skipped}");
          }
        tests:
          - stdin: "name,score\nana,91\nbo,78\ncy,eighty\ndee,85\n"
            expect: "students: 3\naverage: 84.7\nbest: ana (91)\nskipped: 1"
          - stdin: "name,score\nsolo,60\n"
          - stdin: "name,score\nx,1,2\nzed, 70\namy,70\n\nkim,100\nlee,\n"
            hidden: true
        hints:
          - "Skip the first line (a `bool` flag works), then split each row with `line.split(',')` into a `Vec<&str>`."
          - "Use `let [name, score] = fields.as_slice() else { skipped += 1; continue; };` and the same idea for parsing the score."
          - "Track the count, the total, and the best name/score as you go; print the average as `total as f64 / count as f64` with `{:.1}`."

  - title: Trimming and searching
    id: strings-4
    text: |
      Input is full of stray spaces, prefixes, brackets and markers. These methods clean it up and find things in it. None of them change the string: they return a new `&str` (a view of part of the original) or an answer.

      ```rust run
      fn main() {
          println!("{:?}", "  padded\t\n".trim());
          println!("{:?}", "  padded  ".trim_start());
          println!("{:?}", "007".trim_start_matches('0'));
          println!("{:?}", "--name--".trim_matches('-'));
          println!("{:?}", "$12.50".strip_prefix('$'));
          println!("{:?}", "12.50".strip_prefix('$'));
          println!("{:?}", "report.pdf".strip_suffix(".pdf"));
          println!("{:?} {:?}", "banana".find("an"), "banana".rfind("an"));
          println!("{:?}", "banana".find('z'));
          println!("{}", "Error: disk".to_lowercase().starts_with("error"));
      }
      ```

      ```output
      "padded"
      "padded  "
      "7"
      "name"
      Some("12.50")
      None
      Some("report")
      Some(1) Some(3)
      None
      true
      ```

      | Method | Returns |
      |---|---|
      | `trim()`, `trim_start()`, `trim_end()` | the text without whitespace at both ends / the start / the end |
      | `trim_matches(p)`, `trim_start_matches(p)`, `trim_end_matches(p)` | the text with **every** repeat of `p` removed from those ends |
      | `strip_prefix(p)`, `strip_suffix(p)` | `Some(rest)` with **one** `p` removed, or `None` if it isn't there |
      | `starts_with(p)`, `ends_with(p)`, `contains(p)` | `bool` |
      | `find(p)`, `rfind(p)` | `Option<usize>`: the **byte** position of the first / last match |

      The pattern `p` can be a char, a `&str`, an array of chars, or a closure: `"abc123".trim_end_matches(|c: char| c.is_ascii_digit())` gives `"abc"`.

      `strip_prefix` is the one to reach for when you *require* a prefix: its `None` tells you the input was malformed, and it fits `let ... else` perfectly.

      ### Putting them together: parsing log lines

      ```rust run
      fn main() {
          let lines = [
              "  [WARN] disk 91% full  ",
              "[INFO] user ana logged in",
              "# a comment",
              "[ERROR] payment failed: card declined",
              "garbage",
          ];
          for raw in lines {
              let line = raw.trim();
              if line.starts_with('#') {
                  continue;
              }
              let Some(rest) = line.strip_prefix('[') else {
                  continue;
              };
              let Some(end) = rest.find(']') else {
                  continue;
              };
              let level = &rest[..end];
              let message = rest[end + 1..].trim_start();
              println!("{level} | {message}");
          }
      }
      ```

      ```output
      WARN | disk 91% full
      INFO | user ana logged in
      ERROR | payment failed: card declined
      ```

      Slicing with positions from `find` is safe: `find` returns the byte where the match *starts*, always a char boundary, and `]` is one byte long, so `end + 1` is a boundary too.

      ### Common mistakes

      - **Ignoring the result.** `input.trim();` on its own line does nothing: it returns the trimmed text and you threw it away. The compiler warns `unused return value of ... that must be used`. Write `let input = input.trim();`.
      - **Treating `find`'s result as a character count.** It's a byte position, which is exactly what slicing needs, but not "the 3rd letter".
      - **Case.** `line.contains("error")` misses `ERROR`. Lowercase first when case doesn't matter.
      - **`trim_start_matches` where you meant `strip_prefix`.** `"$$5".trim_start_matches('$')` removes both dollars; `strip_prefix` removes exactly one and tells you whether it was there.

      **Your turn:** write `fn parse_price(text: &str) -> Option<u32>` that turns a price like `"$12.50"` into cents (`1250`). Rules: surrounding spaces are allowed; the price must start with `$` (check it with `strip_prefix`); the dollars must be a whole number; the cents part is optional but, if there's a `.`, it must be exactly two digits. `"$3"` is `300`, `"12.50"` (no `$`) and `"$1.5"` are `None`.
    seed: |
      fn parse_price(text: &str) -> Option<u32> {
          todo!()
      }
    solution: |
      fn parse_price(text: &str) -> Option<u32> {
          let Some(amount) = text.trim().strip_prefix('$') else {
              return None;
          };
          let (dollars, cents) = match amount.split_once('.') {
              Some((d, c)) => (d, c),
              None => (amount, "00"),
          };
          if cents.len() != 2 {
              return None;
          }
          let Ok(dollars) = dollars.parse::<u32>() else {
              return None;
          };
          let Ok(cents) = cents.parse::<u32>() else {
              return None;
          };
          Some(dollars * 100 + cents)
      }
    harness: |
      #[test]
      fn dollars_and_cents() {
          assert_eq!(parse_price("$12.50"), Some(1250), "parse_price(\"$12.50\")");
          assert_eq!(parse_price("$0.99"), Some(99), "parse_price(\"$0.99\")");
      }

      #[test]
      fn whole_dollars_and_spaces() {
          assert_eq!(parse_price("  $3 "), Some(300), "parse_price(\"  $3 \")");
      }

      #[test]
      fn missing_dollar_sign() {
          assert_eq!(parse_price("12.50"), None, "parse_price(\"12.50\")");
      }

      #[test]
      fn cents_must_be_two_digits() {
          assert_eq!(parse_price("$1.5"), None, "parse_price(\"$1.5\")");
          assert_eq!(parse_price("$1.505"), None, "parse_price(\"$1.505\")");
      }

      #[test]
      fn not_a_number() {
          assert_eq!(parse_price("$abc"), None, "parse_price(\"$abc\")");
          assert_eq!(parse_price("$1.xy"), None, "parse_price(\"$1.xy\")");
      }
    require:
      - pattern: 'strip_prefix'
        message: "Require the dollar sign with `strip_prefix('$')`."
    hints:
      - "`let Some(amount) = text.trim().strip_prefix('$') else { return None; };`"
      - "`amount.split_once('.')` splits dollars from cents; with no dot, use `(amount, \"00\")`."
      - "Check `cents.len() != 2`, then parse both parts with `let Ok(...) = ... else` and return `Some(dollars * 100 + cents)`."
    more:
      - task: |
          Hashtags arrive in every shape. Write `fn clean_tag(raw: &str) -> String` that trims whitespace, removes all leading `#` characters and lowercases the rest: `"  #RustLang "` gives `"rustlang"`, `"##Crab"` gives `"crab"`.
        seed: |
          fn clean_tag(raw: &str) -> String {
              todo!()
          }
        solution: |
