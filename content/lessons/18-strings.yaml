          fn progress_bar(done: u32, total: u32, width: usize) -> String {
              todo!()
          }
        solution: |
          fn progress_bar(done: u32, total: u32, width: usize) -> String {
              let percent = if total == 0 { 100 } else { done * 100 / total };
              let filled = width * percent as usize / 100;
              format!("[{}{}] {:>3}%", "#".repeat(filled), "-".repeat(width - filled), percent)
          }
        harness: |
