          - "`s.split_at(i)` returns the two halves as a tuple."
      - task: |
          A support tool shows masked usernames. For each input line (one username), print it with the first two characters kept and every following character replaced by `*`: `ferris` becomes `fe****` and `zoë` becomes `zo*`. Names with two characters or fewer are printed unchanged.
        seed: |
