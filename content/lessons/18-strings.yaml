  - title: Display versus Debug
    id: strings-7
    text: |
      `{}` and `{:?}` call two different formatting abilities (**traits**):

      - **Display** (`{}`) is the text for **users**: clean, no quotes, decided by the type's author.
      - **Debug** (`{:?}`) is the text for **programmers**: unambiguous, showing quotes, escapes and structure. `{:#?}` is the pretty, multi-line version.

      ```rust run
      fn main() {
          let name = "Ferris \"the crab\"";
          println!("{}", name);
          println!("{:?}", name);
          println!("{:?}", "a\tb");
          println!("{} vs {:?}", 'x', 'x');
          println!("{:?} {:?}", Some("ok"), vec!["a", "b"]);
      }
      ```

      ```output
      Ferris "the crab"
      "Ferris \"the crab\""
      "a\tb"
      x vs 'x'
      Some("ok") ["a", "b"]
      ```

      Debug output is what you want in logs and test failures: with `{:?}` you can *see* a stray tab or trailing space that `{}` would hide.

      Collections and `Option` only have Debug. There's no single "right" way to show a list to a user, so Rust leaves it to you:

      ```rust compile_fail
      fn main() {
          println!("{}", vec![1, 2]);
      }
      ```

      ```error
      error[E0277]: `Vec<{integer}>` doesn't implement `std::fmt::Display`
      ```

      ### Display for your own types

      `#[derive(Debug)]` writes Debug for you (module 12). Display you write yourself, because only you know how your type should look to users. The shape is always the same:

      ```rust run
      use std::fmt;

      struct Money {
          cents: i64,
      }

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              let sign = if self.cents < 0 { "-" } else { "" };
              let abs = self.cents.abs();
              write!(f, "{}${}.{:02}", sign, abs / 100, abs % 100)
          }
      }

      fn main() {
          let price = Money { cents: 1999 };
          let refund = Money { cents: -250 };
          println!("{price} and {refund}");
          let text = price.to_string();
          println!("{} chars: {text}", text.len());
      }
      ```

      ```output
      $19.99 and -$2.50
      6 chars: $19.99
      ```

      - `impl fmt::Display for Money` says "here's how Money does Display". It has one method, `fmt`, which you copy in this exact shape. (`Formatter<'_>` contains a lifetime placeholder; module 24 explains it, and you can copy it as is.)
      - `write!(f, ...)` works like `format!`, but writes into the formatter `f`. Its result, a `fmt::Result`, is what `fmt` returns.
      - Once a type has Display, `{}` works for it everywhere (`println!`, `format!`, `panic!`), and you get `.to_string()` for free.
      - Need several `write!` calls? Each returns a `fmt::Result`, and real code ends them with `?` to stop on an error (module 19). Until then, build the text in a `String` and `write!` it once.

      ### Common mistake: width on your own type

      A width like `{:>10}` is handled by each type's `fmt`, and a `fmt` that just calls `write!` ignores it:

      ```rust run
      use std::fmt;

      struct Money {
          cents: i64,
      }

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              write!(f, "${}.{:02}", self.cents / 100, self.cents % 100)
          }
      }

      fn main() {
          let m = Money { cents: 1999 };
          println!("[{:>10}]", m);
          println!("[{:>10}]", m.to_string());
      }
      ```

      ```output
      [$19.99]
      [    $19.99]
      ```

      Format it into a String first (as above), or make your `fmt` end with `f.pad(&text)`, which applies the caller's width and alignment.

      **Your turn:** implement `Display` for `Elapsed` (a number of seconds) the way a CLI shows durations: `45` seconds is `45s`, `125` is `2m 05s`, `3725` is `1h 02m 05s`. Minutes and seconds after the first unit are padded to two digits; hours appear only if there's at least one, minutes only if there are hours or minutes.
    seed: |
      use std::fmt;

      struct Elapsed {
          seconds: u32,
      }

      impl fmt::Display for Elapsed {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              todo!()
          }
      }
    solution: |
      use std::fmt;

      struct Elapsed {
          seconds: u32,
      }

      impl fmt::Display for Elapsed {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              let h = self.seconds / 3600;
              let m = self.seconds % 3600 / 60;
              let s = self.seconds % 60;
              if h > 0 {
                  write!(f, "{h}h {m:02}m {s:02}s")
              } else if m > 0 {
                  write!(f, "{m}m {s:02}s")
              } else {
                  write!(f, "{s}s")
              }
          }
      }
    harness: |
      #[test]
      fn seconds_only() {
          assert_eq!(Elapsed { seconds: 45 }.to_string(), "45s", "Elapsed 45");
          assert_eq!(Elapsed { seconds: 0 }.to_string(), "0s", "Elapsed 0");
      }

      #[test]
      fn minutes_and_padded_seconds() {
          assert_eq!(Elapsed { seconds: 125 }.to_string(), "2m 05s", "Elapsed 125");
          assert_eq!(Elapsed { seconds: 600 }.to_string(), "10m 00s", "Elapsed 600");
      }

      #[test]
      fn hours() {
          assert_eq!(Elapsed { seconds: 3725 }.to_string(), "1h 02m 05s", "Elapsed 3725");
          assert_eq!(Elapsed { seconds: 3600 }.to_string(), "1h 00m 00s", "Elapsed 3600");
      }

      #[test]
      fn works_with_format() {
          let e = Elapsed { seconds: 61 };
          assert_eq!(format!("took {e}"), "took 1m 01s", "format!(\"took {e}\") for 61 seconds");
      }
    hints:
      - "Split the seconds: `let h = self.seconds / 3600; let m = self.seconds % 3600 / 60; let s = self.seconds % 60;`"
      - "Pick one of three `write!` calls with `if h > 0 { ... } else if m > 0 { ... } else { ... }`."
      - "`write!(f, \"{h}h {m:02}m {s:02}s\")`: `{m:02}` pads to two digits with a zero."
    more:
      - task: |
          Implement `Display` for `Level` (`INFO`, `WARN`, `ERROR`) and for `LogLine`, which displays as `[LEVEL] message`, for example `[WARN] disk 91% full`. Inside `LogLine`'s `fmt` you can use `{}` on `self.level` once `Level` has Display.
        seed: |
          use std::fmt;

          enum Level {
              Info,
              Warn,
              Error,
          }

          struct LogLine {
              level: Level,
              message: String,
          }

          // impl fmt::Display for Level { ... }

          // impl fmt::Display for LogLine { ... }
        solution: |
          use std::fmt;

          enum Level {
              Info,
              Warn,
              Error,
          }

          struct LogLine {
              level: Level,
              message: String,
          }

          // impl fmt::Display for Level { ... }
          impl fmt::Display for Level {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let name = match self {
                      Level::Info => "INFO",
                      Level::Warn => "WARN",
                      Level::Error => "ERROR",
                  };
                  write!(f, "{name}")
              }
          }

          // impl fmt::Display for LogLine { ... }
          impl fmt::Display for LogLine {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  write!(f, "[{}] {}", self.level, self.message)
              }
          }
        harness: |
          #[test]
          fn levels_display_in_capitals() {
              assert_eq!(Level::Info.to_string(), "INFO", "Level::Info");
              assert_eq!(Level::Warn.to_string(), "WARN", "Level::Warn");
              assert_eq!(Level::Error.to_string(), "ERROR", "Level::Error");
          }

          #[test]
          fn log_line_shows_level_and_message() {
              let line = LogLine { level: Level::Warn, message: String::from("disk 91% full") };
              assert_eq!(line.to_string(), "[WARN] disk 91% full", "a WARN log line");
          }

          #[test]
          fn works_inside_format() {
              let line = LogLine { level: Level::Error, message: String::from("payment failed") };
              assert_eq!(format!(">> {line}"), ">> [ERROR] payment failed", "format!(\">> {line}\")");
          }
        hints:
          - "Copy the `impl fmt::Display for ... { fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { ... } }` shape twice."
          - "For Level, `match self` to pick the text, then `write!(f, \"{name}\")`."
          - "For LogLine: `write!(f, \"[{}] {}\", self.level, self.message)`."
      - task: |
          Implement `Display` for `Grid` so it prints as a table: every number right-aligned in a field 4 characters wide, rows separated by newlines (no newline after the last row). For `[[1, 20], [300, -4]]`:

          ```
             1  20
           300  -4
          ```

          Build the whole text in a `String` with `format!("{:>4}", n)` pieces, then `write!` it once.
        seed: |
          use std::fmt;

          struct Grid {
              rows: Vec<Vec<i32>>,
          }

          impl fmt::Display for Grid {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  todo!()
              }
          }
        solution: |
          use std::fmt;

          struct Grid {
              rows: Vec<Vec<i32>>,
          }

          impl fmt::Display for Grid {
              fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                  let mut out = String::new();
                  for (i, row) in self.rows.iter().enumerate() {
                      if i > 0 {
                          out.push('\n');
                      }
                      for n in row {
                          out.push_str(&format!("{:>4}", n));
                      }
                  }
                  write!(f, "{out}")
              }
          }
        harness: |
          #[test]
          fn two_by_two() {
              let g = Grid { rows: vec![vec![1, 20], vec![300, -4]] };
              assert_eq!(g.to_string(), "   1  20\n 300  -4", "Grid [[1, 20], [300, -4]]");
          }

          #[test]
          fn one_row() {
              let g = Grid { rows: vec![vec![7, 8, 9]] };
              assert_eq!(g.to_string(), "   7   8   9", "Grid [[7, 8, 9]]");
          }

          #[test]
          fn wide_numbers_are_not_cut() {
              let g = Grid { rows: vec![vec![12345]] };
              assert_eq!(g.to_string(), "12345", "Grid [[12345]]");
          }

          #[test]
          fn empty_grid() {
              let g = Grid { rows: vec![] };
              assert_eq!(g.to_string(), "", "Grid []");
          }
        hints:
          - "Loop over `self.rows.iter().enumerate()` and push `'\\n'` before every row except the first."
          - "For each number, `out.push_str(&format!(\"{:>4}\", n));`"
          - "Finish with `write!(f, \"{out}\")`."
