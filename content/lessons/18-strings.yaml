              raw.trim().trim_start_matches('#').to_lowercase()
          }
        harness: |
          #[test]
          fn trims_and_lowercases() {
              assert_eq!(clean_tag("  #RustLang "), "rustlang", "clean_tag(\"  #RustLang \")");
          }

          #[test]
          fn removes_several_hashes() {
              assert_eq!(clean_tag("##Crab"), "crab", "clean_tag(\"##Crab\")");
          }

          #[test]
          fn no_hash_at_all() {
              assert_eq!(clean_tag("WebDev"), "webdev", "clean_tag(\"WebDev\")");
          }

          #[test]
          fn hash_in_the_middle_is_kept() {
              assert_eq!(clean_tag("#c#"), "c#", "clean_tag(\"#c#\")");
          }
        hints:
          - "Chain the steps: `raw.trim()`, then `.trim_start_matches('#')`, then `.to_lowercase()`."
      - task: |
          Read log lines and report the errors. A line is an error if, after trimming, it starts with `[ERROR]`. For each error print its message (the text after `[ERROR]`, trimmed), then a final line `N errors`. Other lines are ignored.
        seed: |
