          - "Print `message.trim()` and count it; print the count after the loop."

  - title: Building strings
    id: strings-5
    text: |
      There are several ways to put text together. They differ in convenience and in how many allocations they cost.

      ```rust run
      fn main() {
          let items = ["apple", "bread", "milk"];

          let mut list = String::with_capacity(32);
          for item in items {
              if !list.is_empty() {
                  list.push_str(", ");
              }
              list.push_str(item);
          }
          println!("{list}");

          println!("{}", items.join(", "));

          let backwards: String = "stressed".chars().rev().collect();
          println!("{backwards}");

          let line = format!("{} items, first is {}", items.len(), items[0]);
          println!("{line}");
          println!("{}", "=-".repeat(5));
      }
      ```

      ```output
      apple, bread, milk
      apple, bread, milk
      desserts
      3 items, first is apple
      =-=-=-=-=-
      ```

      - `push_str` appends a `&str` and `push` appends one `char`. Both grow one String in place. `String::with_capacity(32)` reserves room up front, like `Vec::with_capacity`.
      - `join(sep)` glues a slice or Vec of strings together with a separator. It's the idiomatic version of the loop above.
      - `.collect()` can build a `String` from chars (or from `&str` pieces). Here the chars come out reversed. Name the type (`let backwards: String`) so `collect` knows what to build.
      - `format!` builds a new String from a format string, like `println!` without printing. Use it whenever you mix text and values.
      - `repeat(n)` repeats a string `n` times: great for separators and bars.

      ### `+` and ownership

      `s1 + &s2` works, but it has an ownership twist: `+` **takes `s1` by value** (reusing its buffer) and **borrows** the right side, which must be a `&str`.

      ```rust compile_fail
      fn main() {
          let s1 = String::from("tic");
          let s2 = String::from("tac");
          let s3 = s1 + s2;
          println!("{s3}");
      }
      ```

      ```error
      error[E0308]: mismatched types
      ```

      The right side must be a reference: `s1 + &s2`. And afterwards `s1` is gone:

      ```rust compile_fail
      fn main() {
          let s1 = String::from("tic");
          let s2 = String::from("tac");
          let s3 = s1 + &s2;
          println!("{s1} {s3}");
      }
      ```

      ```error
      error[E0382]: borrow of moved value: `s1`
      ```

      For more than two pieces, `format!("{s1}-{s2}-{s3}")` is clearer and borrows everything. `s += "text";` appends in place.

      ### A workplace note on performance

      Building a big string with `s = s + &piece` or a new `format!` per piece in a loop allocates over and over. Push into one String instead (with `with_capacity` if you know the size), or collect the pieces into a Vec and `join` them once. To format directly into an existing String, `use std::fmt::Write;` and call `write!(s, ...)`.

      **Your turn:** write `fn csv_line(fields: &[&str]) -> String` that joins fields with commas, following the real CSV rule: a field that contains a comma or a double quote must be wrapped in double quotes, and each double quote inside it doubled. `["Crab, plush", "4"]` gives `"Crab, plush",4`, and `say "hi"` becomes `"say ""hi"""`.
    seed: |
      fn csv_line(fields: &[&str]) -> String {
          todo!()
      }
    solution: |
      fn csv_line(fields: &[&str]) -> String {
          let mut out = String::new();
          for (i, field) in fields.iter().enumerate() {
              if i > 0 {
                  out.push(',');
              }
              if field.contains(',') || field.contains('"') {
                  out.push('"');
                  out.push_str(&field.replace('"', "\"\""));
                  out.push('"');
              } else {
                  out.push_str(field);
              }
          }
          out
      }
    harness: |
      #[test]
      fn plain_fields() {
          assert_eq!(csv_line(&["A12", "Rust mug", "12"]), "A12,Rust mug,12", "csv_line([A12, Rust mug, 12])");
      }

      #[test]
      fn field_with_a_comma_is_quoted() {
          assert_eq!(csv_line(&["Crab, plush", "4"]), "\"Crab, plush\",4", "csv_line([Crab, plush | 4])");
      }

      #[test]
      fn quotes_are_doubled() {
          assert_eq!(csv_line(&["say \"hi\""]), "\"say \"\"hi\"\"\"", "csv_line([say \"hi\"])");
      }

      #[test]
      fn empty_fields_and_no_fields() {
          assert_eq!(csv_line(&["a", "", "b"]), "a,,b", "csv_line([a, , b])");
          assert_eq!(csv_line(&[]), "", "csv_line([])");
      }
    hints:
      - "Build one `String` and push a `,` before every field except the first (`enumerate` tells you which is first)."
      - "Check `field.contains(',') || field.contains('\"')` to decide whether to quote."
      - "`field.replace('\"', \"\\\"\\\"\")` doubles the quotes; push `'\"'` before and after it."
    more:
      - task: |
          Blogs turn titles into URL **slugs**. Write `fn slugify(title: &str) -> String`: lowercase the title, keep letters and digits (`is_alphanumeric()`), and turn every run of other characters into a single `-`, with no `-` at the start or end. `"Hello, World!"` gives `"hello-world"`.
        seed: |
          fn slugify(title: &str) -> String {
              todo!()
          }
        solution: |
          fn slugify(title: &str) -> String {
              let mut slug = String::new();
              for c in title.to_lowercase().chars() {
                  if c.is_alphanumeric() {
                      slug.push(c);
                  } else if !slug.is_empty() && !slug.ends_with('-') {
                      slug.push('-');
                  }
              }
              if slug.ends_with('-') {
                  slug.pop();
              }
              slug
          }
        harness: |
          #[test]
          fn punctuation_becomes_one_dash() {
              assert_eq!(slugify("Hello, World!"), "hello-world", "slugify(\"Hello, World!\")");
          }

          #[test]
          fn spaces_at_the_ends_and_digits() {
              assert_eq!(slugify("  Rust 2024 Edition "), "rust-2024-edition", "slugify(\"  Rust 2024 Edition \")");
          }

          #[test]
          fn apostrophes_and_accents() {
              assert_eq!(slugify("C'est la vie"), "c-est-la-vie", "slugify(\"C'est la vie\")");
              assert_eq!(slugify("Crème Brûlée"), "crème-brûlée", "slugify(\"Crème Brûlée\")");
          }

          #[test]
          fn nothing_left() {
              assert_eq!(slugify(""), "", "slugify(\"\")");
              assert_eq!(slugify("--!!--"), "", "slugify(\"--!!--\")");
          }
        hints:
          - "Loop over `title.to_lowercase().chars()` and push alphanumeric chars."
          - "For other chars, push `'-'` only if the slug isn't empty and doesn't already end with `'-'`."
          - "At the end, `if slug.ends_with('-') { slug.pop(); }` removes a trailing dash."
      - task: |
          Each input line is `item qty`. Print one summary line joining the entries with ` + `, then the total quantity:

          ```
          3 x apple + 1 x bread + 12 x egg
          total items: 16
