id: strings
title: Strings in depth
phase: "Structuring data"
summary: "How Rust text really works: UTF-8 bytes versus chars, why s[0] doesn't compile, slicing safely, splitting and parsing lines, trimming and searching, building strings efficiently, and formatting aligned tables with Display and Debug."
roadmap: [Strings, String Manipulation, Formatting]
steps:
  - title: "UTF-8: bytes, chars and why s[0] fails"
    id: strings-1
    text: |
      In module 7 you met `String` (owned, growable text) and `&str` (a borrowed view of text). Both store text as **UTF-8**, the encoding used by the web, by files and by almost every system today. In UTF-8 one character takes **1 to 4 bytes**: plain English letters and digits take 1, accented Latin letters (and Greek, Cyrillic, Arabic, Hebrew) 2, Chinese, Japanese, Korean and symbols like `€` 3, and emoji 4.

      ```rust run
      fn main() {
          for word in ["crab", "café", "€5", "🦀"] {
              println!("{word}: bytes={} chars={}", word.len(), word.chars().count());
          }

          let s = "née";
          for b in s.bytes() {
              print!("{b} ");
          }
          println!();
          for c in s.chars() {
              print!("{c:?} ");
          }
          println!();
          println!("{:?} {:?}", s.chars().next(), s.chars().nth(1));
      }
      ```

      ```output
      crab: bytes=4 chars=4
      café: bytes=5 chars=4
      €5: bytes=4 chars=2
      🦀: bytes=4 chars=1
      110 195 169 101
      'n' 'é' 'e'
      Some('n') Some('é')
      ```

      - `.len()` counts **bytes**, not characters. That's what it costs in memory, and it's instant because the String stores it.
      - `.chars()` decodes the bytes into `char`s, one at a time. `.chars().count()` is the number of characters; it has to walk the whole string.
      - `.bytes()` gives the raw bytes: `é` is the two bytes 195 169.
      - `.chars().next()` is the first character and `.chars().nth(i)` the character at position `i`. Both return an `Option<char>`, since the string might be too short.

      ### Why `s[0]` doesn't compile

      ```rust compile_fail
      fn main() {
          let s = String::from("hello");
          let c = s[0];
          println!("{c}");
      }
      ```

      ```error
      error[E0277]: the type `str` cannot be indexed by `{integer}`
      ```

      Two reasons. First, a position in bytes isn't a character: in `"née"`, byte 1 is the first half of `é`, and returning it as if it were a letter would be wrong. Second, `[]` is expected to be instant, but finding the *n*th character means decoding everything before it. Rather than hide that cost or return half-characters, Rust makes you say what you mean:

      | You want | Write |
      |---|---|
      | the first character | `s.chars().next()` |
      | the character at position `n` | `s.chars().nth(n)` (walks from the start) |
      | the last character | `s.chars().last()` |
      | the first byte (for ASCII protocols) | `s.as_bytes()[0]` |
      | the number of characters | `s.chars().count()` |

      `char` has handy methods for classifying: `is_alphabetic()`, `is_numeric()`, `is_ascii_digit()`, `is_whitespace()`, `is_uppercase()`, `is_alphanumeric()`.

      ### A workplace note on "characters"

      A Rust `char` is a Unicode **scalar value**, which isn't always one symbol on screen. `é` can also be written as `e` followed by a combining accent (two chars), and an emoji like 👩‍💻 is three chars glued together. When you must count what a person *sees* (for example, limiting a display name), teams use the `unicode-segmentation` crate. For parsing logs, CSV, numbers and commands, `chars` and bytes are what you want.

      **Your turn:** write `fn initials(full_name: &str) -> String` that returns the first character of each word, in uppercase: `"ada lovelace"` gives `"AL"`. Words are separated by any amount of whitespace, and names can contain accents (`"émile zola"` gives `"ÉZ"`).
    seed: |
      fn initials(full_name: &str) -> String {
          todo!()
      }
    solution: |
      fn initials(full_name: &str) -> String {
          let mut out = String::new();
          for word in full_name.split_whitespace() {
              if let Some(c) = word.chars().next() {
                  out.push(c);
              }
          }
          out.to_uppercase()
      }
    harness: |
      #[test]
      fn two_words() {
          assert_eq!(initials("ada lovelace"), "AL", "initials(\"ada lovelace\")");
      }

      #[test]
      fn accented_letters() {
          assert_eq!(initials("émile zola"), "ÉZ", "initials(\"émile zola\")");
      }

      #[test]
      fn extra_spaces_and_three_names() {
          assert_eq!(initials("  grace   brewster  hopper "), "GBH", "initials(\"  grace   brewster  hopper \")");
      }

      #[test]
      fn empty_name() {
          assert_eq!(initials(""), "", "initials(\"\")");
      }
    hints:
      - "Loop over `full_name.split_whitespace()`."
      - "`word.chars().next()` is an `Option<char>`: `if let Some(c) = word.chars().next() { out.push(c); }`"
      - "Uppercase the whole result at the end: `out.to_uppercase()`."
    more:
      - task: |
          Fill in the blanks: the method that counts bytes, the method that iterates characters, and the method that takes the first character.
        fill: |
          fn main() {
              let tag = "jalapeño";
              println!("{} bytes", tag.[[len]]());
              println!("{} chars", tag.[[chars]]().count());
              println!("first: {:?}", tag.chars().[[next]]());
          }
        hints:
          - "`len` counts bytes; `chars` gives the characters one by one."
          - "The first item of `chars()` comes from `next()`."
        tests:
          - expect: "9 bytes\n8 chars\nfirst: Some('j')"
      - task: |
          Write `fn is_palindrome(s: &str) -> bool` that ignores case and everything that isn't a letter or digit: `"A man, a plan, a canal: Panama"` is a palindrome. Lowercase the text first, keep only the `is_alphanumeric()` chars in a `Vec<char>`, then compare it from both ends.
        seed: |
          fn is_palindrome(s: &str) -> bool {
              todo!()
          }
        solution: |
          fn is_palindrome(s: &str) -> bool {
              let mut letters: Vec<char> = Vec::new();
              for c in s.to_lowercase().chars() {
                  if c.is_alphanumeric() {
                      letters.push(c);
                  }
              }
              let n = letters.len();
              for i in 0..n / 2 {
                  if letters[i] != letters[n - 1 - i] {
                      return false;
                  }
              }
              true
          }
        harness: |
          #[test]
          fn simple_palindrome() {
              assert_eq!(is_palindrome("racecar"), true, "is_palindrome(\"racecar\")");
          }

          #[test]
          fn ignores_case_spaces_and_punctuation() {
              assert_eq!(is_palindrome("A man, a plan, a canal: Panama"), true, "is_palindrome(\"A man, a plan, a canal: Panama\")");
          }

          #[test]
          fn not_a_palindrome() {
              assert_eq!(is_palindrome("crab"), false, "is_palindrome(\"crab\")");
          }

          #[test]
          fn accented_letters_count_as_one_char() {
              assert_eq!(is_palindrome("ésé"), true, "is_palindrome(\"ésé\")");
              assert_eq!(is_palindrome("éso"), false, "is_palindrome(\"éso\")");
          }

          #[test]
          fn empty_is_a_palindrome() {
              assert_eq!(is_palindrome(""), true, "is_palindrome(\"\")");
          }
        hints:
          - "Build `letters` with `for c in s.to_lowercase().chars() { if c.is_alphanumeric() { letters.push(c); } }`"
          - "Compare `letters[i]` with `letters[n - 1 - i]` for `i` in `0..n / 2`."

  - title: Slicing safely at char boundaries
    id: strings-2
    text: |
      You've sliced strings with `&s[a..b]`. The numbers are **byte** positions. That's fine as long as both ends fall on a **char boundary** (the start of a character); if one lands inside a multi-byte character, the program panics.

      ```rust panics
      fn main() {
          let s = String::from("café");
          println!("slicing...");
          println!("{}", &s[0..4]);
      }
      ```

      ```output
      slicing...
      ```

      The panic message is `end byte index 4 is not a char boundary; it is inside 'é' (bytes 3..5 of string)`. This is a real bug class at work: code that cuts names to "the first 10 characters" with `&name[..10]` passes every test written in English, then crashes on the first user named Zoë or 李.

      ### Finding where characters start

      `char_indices()` gives `(byte position, char)` pairs, so you can find safe places to cut:

      ```rust run
      fn main() {
          let s = "naïve café";
          for (i, c) in s.char_indices() {
              print!("{i}:{c} ");
          }
          println!();
          println!("{:?} {:?}", s.get(0..3), s.get(0..4));
          println!("{}", s.is_char_boundary(3));
      }
      ```

      ```output
      0:n 1:a 2:ï 4:v 5:e 6:  7:c 8:a 9:f 10:é
      None Some("naï")
      false
      ```

      - `ï` starts at byte 2 and takes two bytes, so the next character starts at byte 4.
      - `s.get(a..b)` is the non-panicking slice: `None` if either end isn't a char boundary (or is past the end).
      - `is_char_boundary(i)` checks one position.

      ### Cutting after n characters

      The *n*th entry of `char_indices()` tells you the byte where character number *n* starts, which is exactly where to cut to keep *n* characters:

      ```rust run
      fn preview(s: &str, max_chars: usize) -> &str {
          match s.char_indices().nth(max_chars) {
              Some((byte_pos, _)) => &s[..byte_pos],
              None => s,
          }
      }

      fn main() {
          println!("{}", preview("crème brûlée", 5));
          println!("{}", preview("🦀🦀🦀", 2));
          println!("{}", preview("ok", 10));
      }
      ```

      ```output
      crème
      🦀🦀
      ok
      ```

      `&s[..byte_pos]` means "from the start up to `byte_pos`" (and `&s[i..]` means "from `i` to the end"). If there's no character number `max_chars`, the string is short enough and is returned whole.

      ### Common mistakes

      - **Mixing up counts.** Positions from `chars()` (character numbers) and positions for slicing (bytes) only agree for plain ASCII text. Never slice with a number that came from counting chars.
      - **Using `.len()` as a character count** for limits like "at most 20 characters": `"ñandú".len()` is 7.

      **Your turn:** write `fn preview(text: &str, max_chars: usize) -> String` for a chat app's notification preview. If `text` has more than `max_chars` characters, return the first `max_chars` characters followed by `...`; otherwise return the whole text.
    seed: |
      fn preview(text: &str, max_chars: usize) -> String {
          todo!()
      }
    solution: |
      fn preview(text: &str, max_chars: usize) -> String {
          match text.char_indices().nth(max_chars) {
              Some((cut, _)) => format!("{}...", &text[..cut]),
              None => text.to_string(),
          }
      }
    harness: |
      #[test]
      fn cuts_long_text_after_whole_characters() {
          assert_eq!(preview("héllo wörld", 5), "héllo...", "preview(\"héllo wörld\", 5)");
      }

      #[test]
      fn emoji_are_one_char_each() {
          assert_eq!(preview("🦀🦀🦀", 1), "🦀...", "preview(\"🦀🦀🦀\", 1)");
      }

      #[test]
      fn short_text_is_unchanged() {
          assert_eq!(preview("short", 10), "short", "preview(\"short\", 10)");
          assert_eq!(preview("exact", 5), "exact", "preview(\"exact\", 5)");
      }

      #[test]
      fn zero_and_empty() {
          assert_eq!(preview("abc", 0), "...", "preview(\"abc\", 0)");
          assert_eq!(preview("", 3), "", "preview(\"\", 3)");
      }
    hints:
      - "`text.char_indices().nth(max_chars)` is `Some((byte, char))` if the text has more than `max_chars` characters."
      - "Cut at that byte: `format!(\"{}...\", &text[..cut])`; otherwise return `text.to_string()`."
    more:
      - task: |
          Write `fn split_at_char(s: &str, n: usize) -> (&str, &str)` that splits after the first `n` characters (not bytes). If the string has `n` characters or fewer, return `(s, "")`. Use `char_indices` to find the byte position, then the slice method `split_at(byte)` from module 11.
        seed: |
          fn split_at_char(s: &str, n: usize) -> (&str, &str) {
              todo!()
          }
        solution: |
          fn split_at_char(s: &str, n: usize) -> (&str, &str) {
              match s.char_indices().nth(n) {
                  Some((i, _)) => s.split_at(i),
                  None => (s, ""),
              }
          }
        harness: |
          #[test]
