      impl Cell {
          fn is_walkable(&self) -> bool {
              !matches!(self, Self::Wall)
          }

          fn symbol(&self) -> char {
              match self {
                  Self::Empty => '.',
                  Self::Wall => '#',
                  Self::Coin(_) => '$',
              }
          }

          fn value(&self) -> u32 {
              match self {
                  Self::Coin(v) => *v,
                  Self::Empty => 0,
                  Self::Wall => 0,
              }
          }
      }
