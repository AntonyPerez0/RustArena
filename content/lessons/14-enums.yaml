id: enums
title: Enums and Option
phase: "Structuring data"
summary: Model values that are one of several kinds. Define enums with and without data, take them apart with exhaustive match, handle missing values with Option instead of null, use if let, let...else and matches!, and make invalid states unrepresentable.
roadmap: [Enums, "Pattern Matching & Destructuring", "Option and Result Enumerations"]
steps:
  - title: "Enums: one of a fixed set of variants"
    id: enums-1
    text: |
      A struct says "a value has this **and** this **and** this". Lots of data is "this **or** that" instead: a traffic light is red, yellow or green; a direction is north, east, south or west; an order is pending, paid, shipped or delivered. For that, Rust has the **enum** (short for *enumeration*): a type that lists its possible **variants**. A value of the enum is always exactly one of them.

      ```rust run
      #[derive(Debug, PartialEq)]
      enum Direction {
          North,
          East,
          South,
          West,
      }

      fn main() {
          let heading = Direction::East;
          println!("heading: {:?}", heading);
          println!("going north? {}", heading == Direction::North);
          let all = [Direction::North, Direction::East, Direction::South, Direction::West];
          println!("{:?}", all);
      }
      ```

      ```output
      heading: East
      going north? false
      [North, East, South, West]
      ```

      - `enum Direction { ... }` defines a new type with four variants. Variants use UpperCamelCase, like type names.
      - `Direction::East` creates a value. The variants live inside the enum's name, so you write `Direction::` in front.
      - `heading` has the type `Direction`. A function can take a `Direction` parameter, a struct can have a `Direction` field.
      - `#[derive(Debug, PartialEq)]` works just like on structs: `{:?}` prints the variant's name, and `==` compares variants.

      ### Why not a string or a number?

      You could store a direction as `"east"` or as the number `1`. But then nothing stops `"Esat"`, `"up"`, `""` or `7`: they all compile, and the bug shows up at run time (or never, silently doing the wrong thing). With an enum, a typo is a compile error:

      ```rust compile_fail
      #[derive(Debug, PartialEq)]
      enum Direction {
          North,
          East,
      }

      fn main() {
          let d = Direction::Esat;
          println!("{}", d == Direction::North);
      }
      ```

      ```error
      error[E0599]: no variant, associated function, or constant named `Esat` found for enum `Direction` in the current scope
      ```

      This is your first taste of a big idea in Rust design: **make invalid states unrepresentable**. Choose types so that wrong values can't even be written down, and whole classes of bugs disappear before the program runs.

      ### A first look at match

      To do something different for each variant, use **`match`**. It compares a value with each **pattern** in turn and runs the code after `=>` for the first one that fits:

      ```rust run
      enum Direction {
          North,
          East,
          South,
          West,
      }

      fn arrow(d: Direction) -> char {
          match d {
              Direction::North => '^',
              Direction::East => '>',
              Direction::South => 'v',
              Direction::West => '<',
          }
      }

      fn main() {
          println!("{}{}{}{}", arrow(Direction::North), arrow(Direction::East), arrow(Direction::South), arrow(Direction::West));
      }
      ```

      ```output
      ^>v<
      ```

      The `match` is the function's last expression, so its value (the arrow) is what `arrow` returns. The next step looks at `match` in depth.

      ### Common mistakes

      - **Leaving out the enum's name**: `let d = North;` gives ``error[E0425]: cannot find value `North` in this scope``. Write `Direction::North`.
      - **A dot instead of `::`**: `Direction.North` gives ``error[E0423]: cannot find value `Direction` in this scope``.

      **Your turn:** fill in the blanks so the program prints `total: 1050`: the variant in the second arm, the arrow that separates a pattern from its value, and the enum's name when creating `order`.
    fill: |
      enum Size {
          Small,
          Medium,
          Large,
      }

      fn price_cents(size: Size) -> u32 {
          match size {
              Size::Small => 300,
              [[Size::Medium]] => 350,
              Size::Large [[=>]] 400,
          }
      }

      fn main() {
          let order = [[Size]]::Large;
          let total = price_cents(Size::Small) + price_cents(Size::Medium) + price_cents(order);
          println!("total: {}", total);
      }
    hints:
      - "Each arm starts with a full variant path like `Size::Small`."
      - "A pattern and its value are separated by `=>`."
      - "Variants are created with the enum name, two colons and the variant: `Size::Large`."
    tests:
      - expect: "total: 1050"
    more:
      - task: |
          Write `fn is_red(suit: Suit) -> bool` using `match`: hearts and diamonds are red, clubs and spades are not.
        seed: |
          enum Suit {
              Hearts,
              Diamonds,
              Clubs,
              Spades,
          }

          fn is_red(suit: Suit) -> bool {
              todo!()
          }
        solution: |
          enum Suit {
              Hearts,
              Diamonds,
              Clubs,
              Spades,
          }

          fn is_red(suit: Suit) -> bool {
              match suit {
                  Suit::Hearts => true,
                  Suit::Diamonds => true,
                  Suit::Clubs => false,
                  Suit::Spades => false,
              }
          }
        harness: |
          #[test]
          fn hearts_are_red() {
              assert_eq!(is_red(Suit::Hearts), true, "is_red(Suit::Hearts)");
          }

          #[test]
          fn diamonds_are_red() {
              assert_eq!(is_red(Suit::Diamonds), true, "is_red(Suit::Diamonds)");
          }

          #[test]
          fn clubs_are_black() {
              assert_eq!(is_red(Suit::Clubs), false, "is_red(Suit::Clubs)");
          }

          #[test]
          fn spades_are_black() {
              assert_eq!(is_red(Suit::Spades), false, "is_red(Suit::Spades)");
          }
        require:
          - pattern: '\bmatch\b'
            message: "Use a `match` on the suit."
        hints:
          - "One arm per variant: `Suit::Hearts => true,` and so on."
      - task: |
          A SaaS product has three plans. Define an enum `Plan` with the variants `Free`, `Pro` and `Team`, and write `fn monthly_cents(plan: Plan, seats: u32) -> u32`:

          - `Free` costs 0,
          - `Pro` costs a flat 900, however many seats,
          - `Team` costs 700 **per seat**.
        seed: |
          // Define enum Plan here, then fn monthly_cents.

        solution: |
          // Define enum Plan here, then fn monthly_cents.
          enum Plan {
              Free,
              Pro,
              Team,
          }

          fn monthly_cents(plan: Plan, seats: u32) -> u32 {
              match plan {
                  Plan::Free => 0,
                  Plan::Pro => 900,
                  Plan::Team => 700 * seats,
              }
          }
        harness: |
          #[test]
          fn free_costs_nothing() {
              assert_eq!(monthly_cents(Plan::Free, 5), 0, "monthly_cents(Plan::Free, 5)");
          }

          #[test]
          fn pro_is_a_flat_price() {
              assert_eq!(monthly_cents(Plan::Pro, 1), 900, "monthly_cents(Plan::Pro, 1)");
              assert_eq!(monthly_cents(Plan::Pro, 12), 900, "monthly_cents(Plan::Pro, 12)");
          }

          #[test]
          fn team_is_charged_per_seat() {
              assert_eq!(monthly_cents(Plan::Team, 4), 2800, "monthly_cents(Plan::Team, 4)");
          }

          #[test]
          fn team_with_no_seats_is_free() {
              assert_eq!(monthly_cents(Plan::Team, 0), 0, "monthly_cents(Plan::Team, 0)");
          }
        hints:
          - "`enum Plan { Free, Pro, Team }`"
          - "In the `Team` arm, the value can use the other parameter: `Plan::Team => 700 * seats,`"

  - title: "match: exhaustive by design"
    id: enums-2
    text: |
      A **match** expression has the shape `match value { pattern => expression, ... }`. Each `pattern => expression` line is an **arm**. Rust tries the arms from top to bottom and evaluates the first one whose pattern fits. Since `match` is an expression, it has a value, so every arm must produce the same type.

      ```rust run
      #[derive(Debug)]
      enum OrderStatus {
          Pending,
          Paid,
          Shipped,
          Delivered,
      }

      fn advance(status: OrderStatus) -> OrderStatus {
          match status {
              OrderStatus::Pending => OrderStatus::Paid,
              OrderStatus::Paid => OrderStatus::Shipped,
              OrderStatus::Shipped => OrderStatus::Delivered,
              OrderStatus::Delivered => OrderStatus::Delivered,
          }
      }

      fn main() {
          let mut status = OrderStatus::Pending;
          for _ in 0..4 {
              print!("{:?} -> ", status);
              status = advance(status);
          }
          println!("{:?}", status);
      }
      ```

      ```output
      Pending -> Paid -> Shipped -> Delivered -> Delivered
      ```

      This is a tiny **state machine**: a value that is always in exactly one state, plus rules for moving between states. Enums and `match` are the natural way to write one in Rust.

      ### Exhaustiveness

      A `match` must handle **every possible value**. Forget a variant and the program doesn't compile:

      ```rust compile_fail
      enum Light {
          Red,
          Yellow,
          Green,
      }

      fn seconds(light: Light) -> u32 {
          match light {
              Light::Red => 30,
              Light::Green => 25,
          }
      }

      fn main() {
          println!("{}", seconds(Light::Yellow));
      }
      ```

      ```error
      error[E0004]: non-exhaustive patterns: `Light::Yellow` not covered
      ```

      This is one of Rust's best features at work. Six months from now someone adds `Light::FlashingRed`, and the compiler lists **every** `match` in the codebase that doesn't handle it yet. In many languages, that change would compile fine and misbehave in production.

      ### The catch-all `_`

      The pattern **`_`** matches anything. Put it last to mean "every other value". You need it when the possible values can't all be listed, like numbers, characters or strings. A plain name instead of `_` also matches anything, and gives you the value:

      ```rust run
      fn respond(command: &str) -> String {
          match command {
              "start" => String::from("starting engine"),
              "stop" => String::from("stopping"),
              other => format!("unknown command: {}", other),
          }
      }

      fn dice_word(n: u32) -> &'static str {
          match n {
              1 => "one",
              6 => "six!",
              _ => "something in between",
          }
      }

      fn main() {
          println!("{}", respond("start"));
          println!("{}", respond("jump"));
          println!("{} / {}", dice_word(6), dice_word(3));
      }
      ```

      ```output
      starting engine
      unknown command: jump
      six! / something in between
      ```

      (`&'static str` means "a string literal baked into the program". The lifetimes module explains the `'static` part; for now, read it as "returns a literal".)

      For **your own enums**, prefer listing every variant over `_`. A `_` arm silently swallows variants added later, which switches off exactly the help described above.

      ### Common mistakes

      - **Arms with different types**: `1 => "one", 2 => 2` gives ``error[E0308]: `match` arms have incompatible types``.
      - **`_` too early**: arms are tried in order, so arms after a `_` can never run. The compiler warns: `unreachable pattern`.
      - **Using `match` for a yes/no question about one value**: `if x == 3` is clearer. `match` shines when there are several cases.

      **Your turn:** write `fn next(light: Light) -> Light` for a traffic light: red turns green, green turns yellow, yellow turns red. List every variant: no `_`.
    seed: |
      #[derive(Debug, PartialEq)]
      enum Light {
          Red,
          Yellow,
          Green,
      }

      fn next(light: Light) -> Light {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      enum Light {
          Red,
          Yellow,
          Green,
      }

      fn next(light: Light) -> Light {
          match light {
              Light::Red => Light::Green,
              Light::Green => Light::Yellow,
              Light::Yellow => Light::Red,
          }
      }
    harness: |
      #[test]
      fn red_turns_green() {
          assert_eq!(next(Light::Red), Light::Green, "next(Light::Red)");
      }

      #[test]
      fn green_turns_yellow() {
          assert_eq!(next(Light::Green), Light::Yellow, "next(Light::Green)");
      }

      #[test]
      fn yellow_turns_red() {
          assert_eq!(next(Light::Yellow), Light::Red, "next(Light::Yellow)");
      }

      #[test]
      fn three_steps_is_a_full_cycle() {
          assert_eq!(next(next(next(Light::Red))), Light::Red, "next(next(next(Light::Red)))");
      }
    require:
      - pattern: '\bmatch\b'
        message: "Use a `match` on the light."
    forbid:
      - pattern: '\b_\s*=>'
        message: "List all three colors instead of `_`, so the compiler can warn you if a new one is added."
    hints:
      - "`match light { ... }` with one arm per color."
      - "Each arm returns the next color: `Light::Red => Light::Green,`"
    more:
      - task: |
