      - task: |
          Write the state machine of a vending machine: `fn on_event(state: Vend, event: &str) -> Vend`.

          - `Idle` + `"coin"` becomes `HasCoin`
          - `HasCoin` + `"push"` becomes `Dispensing`
          - `HasCoin` + `"refund"` becomes `Idle`
          - `Dispensing` + `"done"` becomes `Idle`
          - any other event leaves the state as it is.

          Match on the state, and decide on the event inside each arm (with `if` or a second `match`).
        seed: |
          #[derive(Debug, PartialEq)]
          enum Vend {
              Idle,
              HasCoin,
              Dispensing,
          }

        solution: |
          #[derive(Debug, PartialEq)]
          enum Vend {
              Idle,
              HasCoin,
              Dispensing,
          }

          fn on_event(state: Vend, event: &str) -> Vend {
              match state {
                  Vend::Idle => {
                      if event == "coin" { Vend::HasCoin } else { Vend::Idle }
                  }
                  Vend::HasCoin => match event {
                      "push" => Vend::Dispensing,
                      "refund" => Vend::Idle,
                      _ => Vend::HasCoin,
                  },
                  Vend::Dispensing => {
                      if event == "done" { Vend::Idle } else { Vend::Dispensing }
                  }
              }
          }
        harness: |
          #[test]
          fn a_coin_wakes_the_machine() {
              assert_eq!(on_event(Vend::Idle, "coin"), Vend::HasCoin, "on_event(Idle, \"coin\")");
          }

          #[test]
          fn pushing_dispenses() {
              assert_eq!(on_event(Vend::HasCoin, "push"), Vend::Dispensing, "on_event(HasCoin, \"push\")");
          }

          #[test]
          fn refund_goes_back_to_idle() {
              assert_eq!(on_event(Vend::HasCoin, "refund"), Vend::Idle, "on_event(HasCoin, \"refund\")");
          }

          #[test]
          fn done_goes_back_to_idle() {
              assert_eq!(on_event(Vend::Dispensing, "done"), Vend::Idle, "on_event(Dispensing, \"done\")");
          }

          #[test]
          fn other_events_change_nothing() {
              assert_eq!(on_event(Vend::Idle, "push"), Vend::Idle, "on_event(Idle, \"push\")");
              assert_eq!(on_event(Vend::HasCoin, "coin"), Vend::HasCoin, "on_event(HasCoin, \"coin\")");
              assert_eq!(on_event(Vend::Dispensing, "refund"), Vend::Dispensing, "on_event(Dispensing, \"refund\")");
          }

          #[test]
          fn a_full_purchase() {
              let mut s = Vend::Idle;
              for e in ["coin", "push", "done"] {
                  s = on_event(s, e);
              }
              assert_eq!(s, Vend::Idle, "state after coin, push, done");
          }
        hints:
          - "The outer `match state { ... }` has three arms, one per state."
          - "Inside an arm, an `if` expression picks the new state: `Vend::Idle => if event == \"coin\" { Vend::HasCoin } else { Vend::Idle },`"
          - "`HasCoin` has two interesting events, so a `match event { \"push\" => ..., \"refund\" => ..., _ => Vend::HasCoin }` reads well there."

  - title: Variants that carry data
    id: enums-3
    text: |
      Variants can hold data, and **each variant can hold different data**. This is where enums go far beyond what most languages call an "enum".

      ```rust run
      enum Shape {
          Circle(f64),
          Rectangle { width: f64, height: f64 },
          Square(f64),
      }

      fn area(shape: &Shape) -> f64 {
          match shape {
              Shape::Circle(radius) => std::f64::consts::PI * radius * radius,
              Shape::Rectangle { width, height } => width * height,
              Shape::Square(side) => side * side,
          }
      }

      fn main() {
          let shapes = [
              Shape::Circle(1.0),
              Shape::Rectangle { width: 3.0, height: 4.0 },
              Shape::Square(2.5),
          ];
          for s in &shapes {
              println!("{:.2}", area(s));
          }
      }
      ```

      ```output
      3.14
      12.00
      6.25
      ```

      - `Circle(f64)` is a **tuple-like** variant: its data is unnamed, like a tuple struct. Create one with `Shape::Circle(1.0)`.
      - `Rectangle { width: f64, height: f64 }` is a **struct-like** variant, with named fields. Create one with `Shape::Rectangle { width: 3.0, height: 4.0 }`.
      - In a pattern, `Shape::Circle(radius)` matches circles **and** puts the data into a new variable `radius`. `Shape::Rectangle { width, height }` binds both fields to variables of the same name.
      - All three are the same type, `Shape`, so they fit in one array and one function handles them all.

      Because `area` takes `&Shape`, the bindings are references too (`radius` is a `&f64`). Arithmetic works through them as written, but a comparison needs a `*` to read the number: `*radius > 10.0`. Without it, the compiler says ``expected `&f64`, found floating-point number`` and suggests the `*`.

      ### Make invalid states unrepresentable

      Here's how shapes often look in languages without data-carrying enums:

      ```rust
      struct Shape {
          kind: String,   // "circle", "rectangle" or "square"
          radius: f64,    // only meaningful for circles
          width: f64,     // only meaningful for rectangles
          height: f64,    // only meaningful for rectangles
          side: f64,      // only meaningful for squares
      }
      ```

      Every shape carries four fields it doesn't need. Nothing stops `kind: "cirlce"`, or a circle with a width but a radius of 0, and every function has to remember which fields to trust. With the enum, a circle **has** a radius and nothing else; a wrong combination can't be built. When you design types at work, look for "a kind field plus fields that only apply to some kinds": that's an enum waiting to happen.

      ### Common mistakes

      - **A pattern that forgets a field**: `Shape::Rectangle { width }` gives ``error[E0027]: pattern does not mention field `height` ``. Name every field, or write `Shape::Rectangle { width, .. }` to ignore the rest (`..` gets its full story in the patterns module).
      - **Using a data variant without data**: `let s: Shape = Shape::Circle;` is an error (``expected `Shape`, found enum constructor``). `Shape::Circle` alone is a function that *builds* a circle; call it: `Shape::Circle(1.0)`.

      **Your turn:** write `fn area(shape: &Shape) -> f64` for circles, rectangles and triangles (a triangle's area is base × height / 2). Use `std::f64::consts::PI` for π.
    seed: |
      enum Shape {
          Circle(f64),
          Rectangle { width: f64, height: f64 },
          Triangle { base: f64, height: f64 },
      }

      fn area(shape: &Shape) -> f64 {
          todo!()
      }
    solution: |
      enum Shape {
          Circle(f64),
          Rectangle { width: f64, height: f64 },
          Triangle { base: f64, height: f64 },
      }

      fn area(shape: &Shape) -> f64 {
          match shape {
              Shape::Circle(r) => std::f64::consts::PI * r * r,
              Shape::Rectangle { width, height } => width * height,
              Shape::Triangle { base, height } => base * height / 2.0,
          }
      }
    harness: |
      #[test]
      fn unit_circle_has_area_pi() {
          assert_eq!(area(&Shape::Circle(1.0)), std::f64::consts::PI, "area(&Shape::Circle(1.0))");
      }

      #[test]
      fn circle_of_radius_2() {
          assert_eq!(area(&Shape::Circle(2.0)), 4.0 * std::f64::consts::PI, "area(&Shape::Circle(2.0))");
      }

      #[test]
      fn rectangle_is_width_times_height() {
          assert_eq!(area(&Shape::Rectangle { width: 3.0, height: 4.0 }), 12.0, "area of a 3 x 4 rectangle");
      }

      #[test]
      fn triangle_is_half_base_times_height() {
          assert_eq!(area(&Shape::Triangle { base: 4.0, height: 5.0 }), 10.0, "area of a triangle with base 4, height 5");
      }

      #[test]
      fn flat_shapes_have_no_area() {
          assert_eq!(area(&Shape::Rectangle { width: 0.0, height: 9.0 }), 0.0, "area of a 0 x 9 rectangle");
      }
    hints:
      - "`match shape { ... }` with one arm per variant, binding the data: `Shape::Circle(r) => ...`"
      - "For struct-like variants, name the fields in the pattern: `Shape::Triangle { base, height } => base * height / 2.0,`"
    more:
      - task: |
          Write `fn perimeter(shape: &Shape) -> f64`: a circle's perimeter is 2 × π × r, a rectangle's is 2 × (width + height), a square's is 4 × side.
        seed: |
          enum Shape {
              Circle(f64),
              Rectangle { width: f64, height: f64 },
              Square(f64),
          }

          fn perimeter(shape: &Shape) -> f64 {
              todo!()
          }
        solution: |
          enum Shape {
              Circle(f64),
              Rectangle { width: f64, height: f64 },
              Square(f64),
          }

          fn perimeter(shape: &Shape) -> f64 {
              match shape {
                  Shape::Circle(r) => 2.0 * std::f64::consts::PI * r,
                  Shape::Rectangle { width, height } => 2.0 * (width + height),
                  Shape::Square(side) => 4.0 * side,
              }
          }
        harness: |
          #[test]
          fn circle_perimeter() {
              assert_eq!(perimeter(&Shape::Circle(1.0)), 2.0 * std::f64::consts::PI, "perimeter(&Shape::Circle(1.0))");
          }

          #[test]
          fn rectangle_perimeter() {
              assert_eq!(perimeter(&Shape::Rectangle { width: 3.0, height: 4.5 }), 15.0, "perimeter of a 3 x 4.5 rectangle");
          }

          #[test]
          fn square_perimeter() {
              assert_eq!(perimeter(&Shape::Square(2.5)), 10.0, "perimeter(&Shape::Square(2.5))");
          }
        hints:
          - "Same shape as `area`: one arm per variant, binding the data."
          - "`Shape::Rectangle { width, height } => 2.0 * (width + height),`"
      - task: |
          Model the ways a customer can pay. Define an enum `Payment` with three variants:

          - `Cash` (no data),
          - `Card { last4: String }` (the last four digits of the card),
          - `Voucher(u32)` (the voucher's value in cents).

          Then write `fn describe(p: &Payment) -> String` that returns `"cash"`, `"card ending in 4242"` or `"voucher worth 500 cents"`.
        seed: |
          // Define enum Payment, then fn describe.

        solution: |
          // Define enum Payment, then fn describe.
          enum Payment {
              Cash,
              Card { last4: String },
              Voucher(u32),
          }

          fn describe(p: &Payment) -> String {
              match p {
                  Payment::Cash => String::from("cash"),
                  Payment::Card { last4 } => format!("card ending in {}", last4),
                  Payment::Voucher(cents) => format!("voucher worth {} cents", cents),
              }
          }
        harness: |
          #[test]
          fn describes_cash() {
              assert_eq!(describe(&Payment::Cash), "cash", "describe(&Payment::Cash)");
          }

          #[test]
          fn describes_a_card() {
              let p = Payment::Card { last4: String::from("4242") };
              assert_eq!(describe(&p), "card ending in 4242", "describe a card with last4 4242");
          }

          #[test]
          fn describes_a_voucher() {
              assert_eq!(describe(&Payment::Voucher(500)), "voucher worth 500 cents", "describe(&Payment::Voucher(500))");
          }

          #[test]
          fn describes_another_card() {
              let p = Payment::Card { last4: String::from("0007") };
              assert_eq!(describe(&p), "card ending in 0007", "describe a card with last4 0007");
          }
        hints:
          - "`enum Payment { Cash, Card { last4: String }, Voucher(u32) }`"
          - "In the match, bind the data: `Payment::Card { last4 } => format!(\"card ending in {}\", last4),`"

  - title: "Option: a value that might be missing"
    id: enums-4
    text: |
      Many languages have **null**: a special "nothing here" value that almost any variable can hold. Forget to check for it, and the program crashes (Java's `NullPointerException`, C's segmentation fault) or quietly misbehaves. Tony Hoare, who invented null references in 1965, later called them his "billion-dollar mistake".

      **Rust has no null.** A `String` is always a real string; a `u32` is always a number. When a value might be missing, the **type** says so: `Option<T>`, an ordinary enum from the standard library:

      ```rust
      enum Option<T> {
          None,
          Some(T),
      }
      ```

      - `T` is a **type parameter**, a placeholder for any type: `Option<u32>` is "maybe a u32", `Option<String>` is "maybe a String". (The generics module shows how to write your own types like this.)
      - `Option` and its variants are in the **prelude**, the set of names every Rust file can use without importing, so you write `Some(5)` and `None`, not `Option::Some(5)`.
      - You've met it already: `checked_add` from the types module returns `Some(sum)`, or `None` when the sum would overflow.

      ### Returning an Option

      The classic use is a lookup that may find nothing:

      ```rust run
      struct Item {
          name: String,
          price_cents: u32,
      }

      fn find_price(items: &[Item], name: &str) -> Option<u32> {
          for item in items {
              if item.name == name {
                  return Some(item.price_cents);
              }
          }
          None
      }

      fn main() {
          let menu = [
              Item { name: String::from("tea"), price_cents: 300 },
              Item { name: String::from("cake"), price_cents: 450 },
          ];
          for wanted in ["cake", "pizza"] {
              match find_price(&menu, wanted) {
                  Some(price) => println!("{}: {} cents", wanted, price),
                  None => println!("{}: not on the menu", wanted),
              }
          }
          println!("{:?} {:?}", find_price(&menu, "tea"), find_price(&menu, "soup"));
      }
      ```

      ```output
      cake: 450 cents
      pizza: not on the menu
      Some(300) None
      ```

      ### The compiler makes you handle None

      An `Option<u32>` is **not** a `u32`, so you can't use it like one:

      ```rust compile_fail
      fn main() {
          let price: Option<u32> = Some(250);
          let total = price + 50;
          println!("{}", total);
      }
      ```

      ```error
      error[E0369]: cannot add `{integer}` to `Option<u32>`
      ```

      That's the whole point. To get at the number you must first say what happens when it's missing, and you can't forget, because the code doesn't compile until you do. With null, the "missing" case is invisible in the type and the check is up to your memory.

      ### Getting the value out

      - **`match`**, as above. It always works and handles both cases explicitly.
      - **`.unwrap()`** gives the value inside `Some`, and **panics** on `None`. **`.expect("message")`** does the same with your message (you've used it on `parse`). Fine in tests, quick scripts, and when `None` would be a bug in your own code; in normal program logic, handle the `None`.
      - **`.unwrap_or(default)`** gives the value, or `default` for `None`: `find_price(&menu, "soup").unwrap_or(0)`.
      - **`.is_some()`** and **`.is_none()`** answer the yes/no question without taking the value out.

      The errors module adds many more helpers (`map`, `and_then`, `?`). Here's what an unlucky `unwrap` does:

      ```rust panics
      fn main() {
          let empty: Option<u32> = None;
          println!("before");
          let n = empty.unwrap();
          println!("{}", n);
      }
      ```

      ```output
      before
      ```

      The program stops with ``called `Option::unwrap()` on a `None` value``. An `unwrap` you didn't think through is the Rust version of a null pointer crash, so reach for `match` (and the next step's `if let` and `let...else`) first.

      A workplace note: Option costs nothing extra in the common cases. `Option<&T>` is the same size as `&T`: the compiler uses the null address internally to mean `None`, and your code can never see or misuse it.

      ### Common mistakes

      - **Printing an Option with `{}`**: ``error[E0277]: `Option<u32>` doesn't implement `std::fmt::Display` ``. Use `{:?}` (which prints `Some(300)` or `None`), or take the value out first.
      - **Returning the value instead of wrapping it**: in a function returning `Option<u32>`, write `return Some(price);`, not `return price;` (``mismatched types``).

      **Your turn:** write `fn find_user(users: &[User], id: u32) -> Option<&User>` that returns a reference to the user with that `id`, or `None` if there isn't one. Returning `&User` lends the caller the user from the slice, with no copying.
    seed: |
      #[derive(Debug, PartialEq)]
      struct User {
          id: u32,
          name: String,
      }

      fn find_user(users: &[User], id: u32) -> Option<&User> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct User {
          id: u32,
          name: String,
      }

      fn find_user(users: &[User], id: u32) -> Option<&User> {
          for user in users {
              if user.id == id {
                  return Some(user);
              }
          }
          None
      }
    harness: |
      fn team() -> Vec<User> {
          vec![
              User { id: 1, name: String::from("Ada") },
              User { id: 7, name: String::from("Grace") },
              User { id: 9, name: String::from("Linus") },
          ]
      }

      #[test]
