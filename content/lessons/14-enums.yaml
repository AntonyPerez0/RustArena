              assert_eq!(cheapest(&items), Some(&items[1]), "cheapest of mug 1200, pen 150, tea 450");
          }

          #[test]
          fn first_one_wins_a_tie() {
              let items = [item("tea", 300), item("cake", 300)];
              assert_eq!(cheapest(&items), Some(&items[0]), "cheapest of tea 300, cake 300");
          }

          #[test]
          fn a_single_item_is_the_cheapest() {
              let items = [item("lamp", 2500)];
              assert_eq!(cheapest(&items), Some(&items[0]), "cheapest of just a lamp");
          }

          #[test]
