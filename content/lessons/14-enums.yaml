          let users = team();
          assert_eq!(find_user(&users, 1), Some(&users[0]), "find_user(&users, 1)");
      }

      #[test]
      fn finds_a_user_in_the_middle() {
          let users = team();
          assert_eq!(find_user(&users, 7), Some(&users[1]), "find_user(&users, 7)");
      }

      #[test]
      fn finds_the_last_user() {
          let users = team();
          assert_eq!(find_user(&users, 9), Some(&users[2]), "find_user(&users, 9)");
      }

      #[test]
      fn returns_none_for_an_unknown_id() {
          let users = team();
          assert_eq!(find_user(&users, 4), None, "find_user(&users, 4)");
      }

      #[test]
      fn returns_none_for_no_users() {
          assert_eq!(find_user(&[], 1), None, "find_user(&[], 1)");
      }
    hints:
      - "Loop with `for user in users`: each `user` is already a `&User`."
      - "When the ids match, `return Some(user);`. After the loop, nothing matched: return `None`."
    more:
      - task: |
