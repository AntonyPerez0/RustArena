              assert_eq!(parse_transaction("withdraw ten"), None, "parse_transaction(\"withdraw ten\")");
              assert_eq!(parse_transaction("deposit -5"), None, "parse_transaction(\"deposit -5\")");
          }

          #[test]
          fn rejects_a_transfer_without_a_name() {
