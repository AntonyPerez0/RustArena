              assert_eq!((r.x, r.y), (3, -1), "position after NESW from (3, -1)");
          }

          #[test]
          fn stops_at_a_bad_character() {
              let mut r = Robot { x: 0, y: 0 };
              assert_eq!(r.follow("NX N"), false, "follow(\"NX N\")");
              assert_eq!((r.x, r.y), (0, 1), "position after stopping at X");
          }

          #[test]
          fn an_empty_path_is_fine() {
              let mut r = Robot { x: 0, y: 0 };
              assert_eq!(r.follow(""), true, "follow(\"\")");
          }
