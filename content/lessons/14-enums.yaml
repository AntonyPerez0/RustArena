        solution: |
          #[derive(Debug, Clone, Copy)]
          enum Direction {
              North,
              East,
              South,
              West,
          }

          impl Direction {
              fn turn_right(self) -> Self {
                  match self {
                      Self::North => Self::East,
                      Self::East => Self::South,
                      Self::South => Self::West,
                      Self::West => Self::North,
                  }
              }

              fn turn_left(self) -> Self {
                  self.turn_right().turn_right().turn_right()
              }
          }

          enum Command {
              Forward(u32),
              Left,
              Right,
              Report,
          }

          fn parse_command(line: &str) -> Option<Command> {
              let mut words = line.split_whitespace();
              let Some(name) = words.next() else {
                  return None;
              };
              let command = match name {
                  "forward" => {
                      let Some(arg) = words.next() else {
                          return None;
                      };
                      let Ok(steps) = arg.parse::<u32>() else {
                          return None;
                      };
                      Command::Forward(steps)
                  }
                  "left" => Command::Left,
                  "right" => Command::Right,
                  "report" => Command::Report,
                  _ => return None,
              };
              if words.next().is_some() {
                  return None;
              }
              Some(command)
          }

          // Write struct Robot and its impl block here.
          struct Robot {
              x: i32,
              y: i32,
              facing: Direction,
          }

          impl Robot {
              fn new() -> Self {
                  Self { x: 0, y: 0, facing: Direction::North }
              }

              fn run(&mut self, command: Command) {
                  match command {
                      Command::Forward(steps) => {
                          let n = steps as i32;
                          match self.facing {
                              Direction::North => self.y += n,
                              Direction::East => self.x += n,
                              Direction::South => self.y -= n,
                              Direction::West => self.x -= n,
                          }
                      }
                      Command::Left => self.facing = self.facing.turn_left(),
                      Command::Right => self.facing = self.facing.turn_right(),
                      Command::Report => println!("{},{} {:?}", self.x, self.y, self.facing),
                  }
              }
          }

          fn main() {
              let mut robot = Robot::new();
              for line in std::io::stdin().lines() {
                  let line = line.expect("could not read input");
                  // TODO: parse the line and run it on the robot
                  let Some(command) = parse_command(&line) else {
                      println!("invalid: {}", line);
                      continue;
                  };
                  robot.run(command);
              }
          }
