      - task: |
          Write `fn cheapest(items: &[Item]) -> Option<&Item>` from scratch: the item with the lowest `price_cents`. If several share the lowest price, return the first of them. An empty slice has no cheapest item.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Item {
              name: String,
              price_cents: u32,
          }

        solution: |
          #[derive(Debug, PartialEq)]
          struct Item {
              name: String,
              price_cents: u32,
          }

          fn cheapest(items: &[Item]) -> Option<&Item> {
              if items.is_empty() {
                  return None;
              }
              let mut best = &items[0];
              for item in items {
                  if item.price_cents < best.price_cents {
                      best = item;
                  }
              }
              Some(best)
          }
        harness: |
