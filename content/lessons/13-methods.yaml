          Write a pizza order builder from scratch:

          - `fn new(size_cm: u32) -> Self`: no toppings, no extra cheese.
          - `fn topping(mut self, name: &str) -> Self`: adds a topping (you can add several).
          - `fn extra_cheese(mut self) -> Self`
          - `fn price_cents(&self) -> u32`: 800 for a pizza up to 30 cm, 1100 above that, plus 150 per topping, plus 100 for extra cheese.
