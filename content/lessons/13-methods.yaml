              balance_cents: u64,
              transactions: u32,
          }

          impl Account {
              fn deposit(&mut self, amount: u64) {
                  self.balance_cents += amount;
                  self.transactions += 1;
              }

              fn withdraw(&mut self, amount: u64) -> bool {
                  if amount > self.balance_cents {
                      return false;
                  }
                  self.balance_cents -= amount;
                  self.transactions += 1;
                  true
              }

              fn transfer(&mut self, to: &mut Account, amount: u64) -> bool {
                  todo!()
              }
          }
        solution: |
          struct Account {
              balance_cents: u64,
              transactions: u32,
          }

          impl Account {
              fn deposit(&mut self, amount: u64) {
                  self.balance_cents += amount;
                  self.transactions += 1;
              }

              fn withdraw(&mut self, amount: u64) -> bool {
                  if amount > self.balance_cents {
                      return false;
                  }
                  self.balance_cents -= amount;
                  self.transactions += 1;
                  true
              }

              fn transfer(&mut self, to: &mut Account, amount: u64) -> bool {
                  if !self.withdraw(amount) {
                      return false;
                  }
                  to.deposit(amount);
                  true
              }
          }
        harness: |
          fn with(balance_cents: u64) -> Account {
              Account { balance_cents, transactions: 0 }
          }

          #[test]
          fn moves_the_money() {
              let mut a = with(1000);
              let mut b = with(50);
              assert_eq!(a.transfer(&mut b, 400), true, "a.transfer(&mut b, 400) with 1000");
              assert_eq!((a.balance_cents, b.balance_cents), (600, 450), "balances after the transfer");
          }

          #[test]
          fn refuses_when_short() {
              let mut a = with(100);
              let mut b = with(0);
              assert_eq!(a.transfer(&mut b, 101), false, "a.transfer(&mut b, 101) with 100");
              assert_eq!((a.balance_cents, b.balance_cents), (100, 0), "balances after a refused transfer");
          }

          #[test]
          fn counts_a_transaction_on_each_side() {
              let mut a = with(100);
              let mut b = with(0);
              a.transfer(&mut b, 10);
              assert_eq!((a.transactions, b.transactions), (1, 1), "(a.transactions, b.transactions)");
          }

          #[test]
          fn a_refused_transfer_counts_nothing() {
              let mut a = with(5);
              let mut b = with(0);
              a.transfer(&mut b, 10);
              assert_eq!((a.transactions, b.transactions), (0, 0), "(a.transactions, b.transactions) after a refusal");
          }
        require:
          - pattern: 'self\.withdraw\('
            message: "Reuse the existing method: call `self.withdraw(amount)`."
        hints:
          - "`self.withdraw(amount)` already checks the balance and tells you whether it worked."
          - "Only if it returned `true`, call `to.deposit(amount)`."
          - "`if !self.withdraw(amount) { return false; } to.deposit(amount); true`"
      - task: |
          Write an impl block for a `Thermostat` from scratch:

          - `fn set_target(&mut self, target: i32)`: sets the target, but keeps it between 10 and 30 degrees (a target below 10 becomes 10, above 30 becomes 30).
          - `fn tick(&mut self)`: moves `current` one degree toward `target` (up if it's below, down if it's above, unchanged if equal).
          - `fn is_stable(&self) -> bool`: true when `current` equals `target`.
        seed: |
          struct Thermostat {
              current: i32,
              target: i32,
          }

        solution: |
          struct Thermostat {
              current: i32,
              target: i32,
          }

          impl Thermostat {
              fn set_target(&mut self, target: i32) {
                  self.target = if target < 10 {
                      10
                  } else if target > 30 {
                      30
                  } else {
                      target
                  };
              }

              fn tick(&mut self) {
                  if self.current < self.target {
                      self.current += 1;
                  } else if self.current > self.target {
                      self.current -= 1;
                  }
              }

              fn is_stable(&self) -> bool {
                  self.current == self.target
              }
          }
        harness: |
          fn at(current: i32) -> Thermostat {
              Thermostat { current, target: current }
          }

          #[test]
          fn sets_a_normal_target() {
              let mut t = at(18);
              t.set_target(22);
              assert_eq!(t.target, 22, "target after set_target(22)");
          }

          #[test]
          fn clamps_low_and_high_targets() {
              let mut t = at(18);
              t.set_target(-5);
              assert_eq!(t.target, 10, "target after set_target(-5)");
              t.set_target(99);
              assert_eq!(t.target, 30, "target after set_target(99)");
          }

          #[test]
          fn ticks_up_one_degree() {
              let mut t = at(18);
              t.set_target(20);
              t.tick();
              assert_eq!(t.current, 19, "current after one tick from 18 toward 20");
          }

          #[test]
          fn ticks_down_one_degree() {
              let mut t = at(25);
              t.set_target(20);
              t.tick();
              assert_eq!(t.current, 24, "current after one tick from 25 toward 20");
          }

          #[test]
          fn becomes_stable_and_stays_there() {
              let mut t = at(18);
              t.set_target(20);
              assert_eq!(t.is_stable(), false, "is_stable at 18 with target 20");
              t.tick();
              t.tick();
              t.tick();
              assert_eq!((t.current, t.is_stable()), (20, true), "(current, is_stable) after three ticks from 18 toward 20");
          }
        hints:
          - "`set_target` and `tick` change the thermostat, so they take `&mut self`; `is_stable` takes `&self`."
          - "For the clamp, an `if / else if / else` expression works: `self.target = if target < 10 { 10 } else if ... ;`"
          - "In `tick`, compare `self.current` with `self.target` and add or subtract 1."

  - title: "Associated functions and Self: constructors"
    id: methods-3
    text: |
      A function inside an impl block that does **not** take `self` is an **associated function**: it belongs to the type, but isn't called on a value. (Strictly, every function in an impl block is an associated function and methods are the ones that take `self`, but in everyday speech "associated function" means one without `self`.) You call it with the type's name and `::`. You've used them since the first modules: `String::from("hi")`, `String::new()`, `Vec::new()`.

      Their most common job is building values. By convention, the main one is called **`new`**:

      ```rust run
      struct Item {
          name: String,
          price_cents: u32,
          quantity: u32,
      }

      impl Item {
          fn new(name: &str, price_cents: u32) -> Self {
              Self {
                  name: name.to_string(),
                  price_cents,
                  quantity: 0,
              }
          }

          fn free_sample(name: &str) -> Self {
              Self::new(name, 0)
          }

          fn summary(&self) -> String {
              format!("{} x{} at {} cents", self.name, self.quantity, self.price_cents)
          }
      }

      fn main() {
          let mut tea = Item::new("Tea", 450);
          tea.quantity = 12;
          let sticker = Item::free_sample("Sticker");
          println!("{}", tea.summary());
          println!("{}", sticker.summary());
      }
      ```

      ```output
      Tea x12 at 450 cents
      Sticker x0 at 0 cents
      ```

      - `fn new(...) -> Self` returns a new `Item`. Inside an impl, **`Self`** is the type (`Item`), so `Self { ... }` builds one. Writing `Item` works too, but `Self` keeps working if you rename the type.
      - `Item::new("Tea", 450)` calls it with `::`, because there's no value yet to put before a dot.
      - A type can have several constructors with descriptive names. `free_sample` calls `Self::new` so the defaults live in one place.

      ### Why constructors?

      `new` is not special syntax: Rust has no built-in constructors, just this convention. It's still worth it. Callers don't need to know every field (`quantity` starts at 0 without them thinking about it), the defaults live in one place, and later, with private fields (the modules module), a constructor becomes the only way to create a value, so it can enforce rules like "a name is never empty". Clippy even checks the convention: a `new` that doesn't return `Self` gets a `new_ret_no_self` warning.

      ### `::` or `.`?

      | You write | Meaning |
      |---|---|
      | `Item::new("Tea", 450)` | associated function, called on the **type** |
      | `tea.summary()` | method, called on a **value** |
      | `Item::summary(&tea)` | the same method, called the long way |

      ### Common mistakes

      - **A dot after the type name**:

      ```rust compile_fail
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn new(width: u32, height: u32) -> Self {
              Self { width, height }
          }

          fn area(&self) -> u32 {
              self.width * self.height
          }
      }

      fn main() {
          let r = Rect.new(2, 3);
          println!("{}", r.area());
      }
      ```

      ```error
      error[E0423]: cannot find value `Rect` in this scope
      ```

      - **Calling a method like an associated function**: `Rect::area()` has no rectangle to measure: ``error[E0061]: this function takes 1 argument but 0 arguments were supplied``. Call it on a value: `r.area()`.

      **Your turn:** write `Player::new(name: &str) -> Self`. A new player has the given name, level 1, 100 hp and a score of 0. Build the value with `Self { ... }`.
    seed: |
      #[derive(Debug, PartialEq)]
      struct Player {
          name: String,
          level: u32,
          hp: u32,
          score: u32,
      }

      impl Player {
          fn new(name: &str) -> Self {
              todo!()
          }
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct Player {
          name: String,
          level: u32,
          hp: u32,
          score: u32,
      }

      impl Player {
          fn new(name: &str) -> Self {
              Self {
                  name: name.to_string(),
                  level: 1,
                  hp: 100,
                  score: 0,
              }
          }
      }
    harness: |
      #[test]
      fn builds_a_fresh_player() {
          assert_eq!(
              Player::new("Ayla"),
              Player { name: String::from("Ayla"), level: 1, hp: 100, score: 0 },
              "Player::new(\"Ayla\")"
          );
      }

      #[test]
      fn uses_the_given_name() {
          assert_eq!(Player::new("Ferris").name, "Ferris", "Player::new(\"Ferris\").name");
      }

