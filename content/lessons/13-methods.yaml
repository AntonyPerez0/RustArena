        solution: |
          struct Pizza {
              size_cm: u32,
              toppings: Vec<String>,
              extra_cheese: bool,
          }

          impl Pizza {
              fn new(size_cm: u32) -> Self {
                  Self { size_cm, toppings: Vec::new(), extra_cheese: false }
              }

              fn topping(mut self, name: &str) -> Self {
                  self.toppings.push(name.to_string());
                  self
              }

              fn extra_cheese(mut self) -> Self {
                  self.extra_cheese = true;
                  self
              }

              fn price_cents(&self) -> u32 {
                  let base = if self.size_cm <= 30 { 800 } else { 1100 };
                  let cheese = if self.extra_cheese { 100 } else { 0 };
                  base + 150 * self.toppings.len() as u32 + cheese
              }
          }
