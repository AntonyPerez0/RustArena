          }
        solution: |
          // Define Task and TodoList, with an impl block for TodoList.
          struct Task {
              text: String,
              done: bool,
          }

          struct TodoList {
              tasks: Vec<Task>,
          }

          impl TodoList {
              fn new() -> Self {
                  Self { tasks: Vec::new() }
              }

              fn add(&mut self, text: &str) -> usize {
                  self.tasks.push(Task { text: text.to_string(), done: false });
                  self.tasks.len()
              }

              fn complete(&mut self, number: usize) -> bool {
                  if number == 0 || number > self.tasks.len() {
                      return false;
                  }
                  self.tasks[number - 1].done = true;
                  true
              }

              fn print(&self) {
                  if self.tasks.is_empty() {
                      println!("nothing to do");
                  }
                  for i in 0..self.tasks.len() {
                      let task = &self.tasks[i];
                      let mark = if task.done { "x" } else { " " };
                      println!("{}. [{}] {}", i + 1, mark, task.text);
                  }
              }
          }

          fn main() {
              let mut todo = TodoList::new();
              for line in std::io::stdin().lines() {
                  let line = line.expect("could not read input");
                  let parts: Vec<&str> = line.split_whitespace().collect();
                  // TODO: handle "add", "done" and "list"
                  if parts[0] == "add" {
                      let number = todo.add(&line[4..]);
                      println!("added #{}", number);
                  } else if parts[0] == "done" {
                      let number: usize = parts[1].parse().expect("task number should be a number");
                      if todo.complete(number) {
                          println!("completed #{}", number);
                      } else {
                          println!("no task {}", number);
                      }
                  } else if parts[0] == "list" {
                      todo.print();
                  }
              }
          }
        require:
          - pattern: 'struct\s+Task\b'
            message: "Model each task with its own `struct Task`."
          - pattern: 'impl\s+TodoList'
            message: "Give `TodoList` an impl block with a method per command."
        hints:
          - "`struct Task { text: String, done: bool }` and `struct TodoList { tasks: Vec<Task> }`."
          - "`add` can push the task and return `self.tasks.len()`, which is the new task's number."
          - "Task N lives at index N - 1. Check `number == 0 || number > self.tasks.len()` before touching it."
        tests:
          - stdin: "list\nadd buy milk\nadd call the bank\ndone 2\ndone 5\nlist\n"
            expect: "nothing to do\nadded #1\nadded #2\ncompleted #2\nno task 5\n1. [ ] buy milk\n2. [x] call the bank"
          - stdin: "add write tests\ndone 0\ndone 1\nadd ship it\nlist\n"
            hidden: true
          - stdin: "add a\nadd b\nadd c\ndone 1\ndone 3\nlist\n"
            hidden: true
