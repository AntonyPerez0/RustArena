      - task: |
          A shopping cart with a size limit. Write two impl blocks for `Cart`: one with the constructor and getters, one with the rest.

          - `fn new(max_items: usize) -> Self`: an empty cart.
          - `fn count(&self) -> usize`: how many prices are in the cart.
          - `fn total(&self) -> u32`: the sum of all prices.
          - `fn add(&mut self, price_cents: u32) -> bool`: adds the price unless the cart already holds `max_items`; returns whether it was added.
        seed: |
          struct Cart {
              prices: Vec<u32>,
              max_items: usize,
          }

        solution: |
          struct Cart {
              prices: Vec<u32>,
              max_items: usize,
          }

          impl Cart {
              fn new(max_items: usize) -> Self {
                  Self { prices: Vec::new(), max_items }
              }

              fn count(&self) -> usize {
                  self.prices.len()
              }

              fn total(&self) -> u32 {
                  let mut sum = 0;
                  for price in &self.prices {
                      sum += price;
                  }
                  sum
              }
          }

          impl Cart {
              fn add(&mut self, price_cents: u32) -> bool {
                  if self.prices.len() >= self.max_items {
                      return false;
                  }
                  self.prices.push(price_cents);
                  true
              }
          }
        harness: |
          #[test]
          fn a_new_cart_is_empty() {
              let c = Cart::new(3);
              assert_eq!((c.count(), c.total()), (0, 0), "(count(), total()) of Cart::new(3)");
          }

          #[test]
          fn adds_prices_and_totals_them() {
              let mut c = Cart::new(3);
              c.add(450);
              c.add(1200);
              assert_eq!((c.count(), c.total()), (2, 1650), "(count(), total()) after adding 450 and 1200");
          }

          #[test]
          fn refuses_when_full() {
              let mut c = Cart::new(2);
              assert_eq!(c.add(100), true, "first add to a cart of 2");
              assert_eq!(c.add(200), true, "second add to a cart of 2");
              assert_eq!(c.add(300), false, "third add to a cart of 2");
              assert_eq!((c.count(), c.total()), (2, 300), "(count(), total()) after a refused add");
          }

          #[test]
          fn a_cart_with_no_room_accepts_nothing() {
              let mut c = Cart::new(0);
              assert_eq!(c.add(5), false, "add to Cart::new(0)");
          }
        require:
          - pattern: 'impl\s+Cart[\s\S]*impl\s+Cart'
            message: "Split the methods over two `impl Cart { ... }` blocks."
        hints:
          - "`count` is `self.prices.len()`."
          - "`total` loops `for price in &self.prices` and adds each one to a running sum."
          - "In `add`, compare `self.prices.len()` with `self.max_items` before pushing."

  - title: Method chaining
    id: methods-6
    text: |
      You've chained calls before: `line.trim().to_uppercase()` calls `to_uppercase` on whatever `trim` returned. Your own methods can be designed for chaining too, by returning the value itself.

      ### Builders: take self, return Self

      A method that takes `mut self` and returns `Self` changes the value and hands it back, ready for the next call:

      ```rust run
      struct Request {
          url: String,
          method: String,
          timeout_secs: u32,
          retries: u32,
      }

      impl Request {
          fn get(url: &str) -> Self {
              Self {
                  url: url.to_string(),
                  method: String::from("GET"),
                  timeout_secs: 30,
                  retries: 0,
              }
          }

          fn timeout(mut self, secs: u32) -> Self {
              self.timeout_secs = secs;
              self
          }

          fn retries(mut self, n: u32) -> Self {
              self.retries = n;
              self
          }

          fn describe(&self) -> String {
              format!("{} {} (timeout {}s, {} retries)", self.method, self.url, self.timeout_secs, self.retries)
          }
      }

      fn main() {
          let req = Request::get("https://example.com/api")
              .timeout(5)
              .retries(3);
          println!("{}", req.describe());
          let quick = Request::get("https://example.com/health");
          println!("{}", quick.describe());
      }
      ```

      ```output
      GET https://example.com/api (timeout 5s, 3 retries)
      GET https://example.com/health (timeout 30s, 0 retries)
      ```

      - `mut self` means "I own this value, and I'll change it". It's the same `mut` you'd put on any parameter: the caller doesn't need a `mut` variable, because ownership moves into the method.
      - The last line, `self`, returns the value so the next method can take it.
      - Settings you don't call keep their defaults (`quick` has 30 seconds and 0 retries). That's why this style is popular for configuration with many optional settings: it's the **builder pattern**, used by HTTP clients, CLI parsers and database drivers. You'll study it more in the design patterns module.
      - `cargo fmt` puts each call of a long chain on its own line, starting with the dot, as above.

      ### Changing in place: take &mut self, return &mut Self

      When you want to keep a variable and change it several times, return `&mut Self` instead:

      ```rust run
      struct Tally {
          total: u32,
          count: u32,
      }

      impl Tally {
          fn add(&mut self, value: u32) -> &mut Self {
              self.total += value;
              self.count += 1;
              self
          }
      }

      fn main() {
          let mut t = Tally { total: 0, count: 0 };
          t.add(5).add(10).add(20);
          println!("{} values, total {}", t.count, t.total);
      }
      ```

      ```output
      3 values, total 35
      ```

      Here `self` is already a `&mut Tally`, so returning `self` hands the same mutable borrow to the next call.

      ### Common mistakes

      - **Forgetting to return `self`**: the method then returns `()`, and the compiler says ``error[E0308]: mismatched types`` with ``expected `Request`, found `()` ``. End the method with `self`.
      - **Forgetting `mut` on `self`**: ``error[E0594]: cannot assign to `self.timeout_secs`, as `self` is not declared as mutable``. Write `mut self`.

      **Your turn:** write a builder for alert messages. `Message::new(to)` starts with an empty subject and `urgent` false. `subject(text)` sets the subject and `urgent()` marks the message as urgent; both take `mut self` and return `Self`. `preview` builds a one-line summary:

      - `subject -> to`, for example `Disk full -> ops@example.com`
      - with `[URGENT] ` in front when urgent: `[URGENT] Disk full -> ops@example.com`
      - `(no subject)` instead of the subject when it's empty (`self.subject.is_empty()` is true for an empty String).
    seed: |
      struct Message {
          to: String,
          subject: String,
          urgent: bool,
      }

      impl Message {
          fn new(to: &str) -> Self {
              todo!()
          }

          fn subject(mut self, subject: &str) -> Self {
              todo!()
          }

          fn urgent(mut self) -> Self {
              todo!()
          }

          fn preview(&self) -> String {
              todo!()
          }
      }
    solution: |
      struct Message {
          to: String,
          subject: String,
          urgent: bool,
      }

      impl Message {
          fn new(to: &str) -> Self {
              Self {
                  to: to.to_string(),
                  subject: String::new(),
                  urgent: false,
              }
          }

          fn subject(mut self, subject: &str) -> Self {
              self.subject = subject.to_string();
              self
          }

          fn urgent(mut self) -> Self {
              self.urgent = true;
              self
          }

          fn preview(&self) -> String {
              let subject = if self.subject.is_empty() { "(no subject)" } else { &self.subject };
              let prefix = if self.urgent { "[URGENT] " } else { "" };
              format!("{}{} -> {}", prefix, subject, self.to)
          }
      }
    harness: |
      #[test]
      fn a_plain_message() {
          let m = Message::new("ops@example.com").subject("Disk full");
          assert_eq!(m.preview(), "Disk full -> ops@example.com", "new(\"ops@example.com\").subject(\"Disk full\").preview()");
      }

      #[test]
      fn an_urgent_message() {
          let m = Message::new("ops@example.com").subject("Disk full").urgent();
          assert_eq!(m.preview(), "[URGENT] Disk full -> ops@example.com", "...subject(\"Disk full\").urgent().preview()");
      }

      #[test]
      fn order_of_the_calls_does_not_matter() {
          let m = Message::new("dev@example.com").urgent().subject("Build failed");
          assert_eq!(m.preview(), "[URGENT] Build failed -> dev@example.com", "...urgent().subject(\"Build failed\").preview()");
      }

      #[test]
      fn no_subject_set() {
          let m = Message::new("me@example.com");
          assert_eq!(m.preview(), "(no subject) -> me@example.com", "Message::new(\"me@example.com\").preview()");
      }

      #[test]
      fn the_last_subject_wins() {
          let m = Message::new("a@b.c").subject("first").subject("second");
          assert_eq!(m.preview(), "second -> a@b.c", "...subject(\"first\").subject(\"second\").preview()");
      }
    hints:
      - "`subject` stores the text (`self.subject = subject.to_string();`) and ends with `self`."
      - "In `preview`, `if` is an expression: `let prefix = if self.urgent { \"[URGENT] \" } else { \"\" };`"
      - "Pick the subject text the same way, then `format!(\"{}{} -> {}\", prefix, subject, self.to)`."
