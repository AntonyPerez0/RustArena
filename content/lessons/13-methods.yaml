id: methods
title: Methods
phase: "Structuring data"
summary: Attach behavior to your own types with impl blocks. Write methods that read (&self), change (&mut self) or consume (self) a value, constructors like new, getters that protect your rules, and chains of method calls.
roadmap: [Impl Blocks, Functions and Method Syntax]
steps:
  - title: impl blocks and your first method
    id: methods-1
    text: |
      In the structs module you wrote functions like `fn total_value(items: &[Item])`. They work, but they float free: nothing ties them to the type, and you have to know their names to find them. A **method** is a function that belongs to a type. You define it inside an **impl block** (short for *implementation*), and its first parameter is `self`: the value the method was called on.

      ```rust run
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn area(&self) -> u32 {
              self.width * self.height
          }

          fn is_square(&self) -> bool {
              self.width == self.height
          }
      }

      fn main() {
          let r = Rect { width: 8, height: 5 };
          println!("area: {}", r.area());
          println!("square? {}", r.is_square());
      }
      ```

      ```output
      area: 40
      square? false
      ```

      Piece by piece:

      - `impl Rect { ... }` holds the functions that belong to `Rect`. You can put as many methods in it as you like.
      - `&self` is short for `self: &Self`, and inside an impl block **`Self`** means "the type this impl is for", here `Rect`. So `area` borrows the rectangle, reads it, and gives it back. It's the same `&Rect` parameter you'd write for a free function, with a special name.
      - `self.width` reads a field of the value the method was called on.
      - You call a method with a dot: `r.area()`. Rust passes `&r` as `self` for you (**automatic referencing**), so you never write `(&r).area()`.

      In fact `r.area()` is just a nicer way to write `Rect::area(&r)`, and both compile to exactly the same code. Methods are about organization, not speed:

      - **Discoverability**: type `r.` in an editor with rust-analyzer and you get a list of everything a `Rect` can do.
      - **Behavior lives next to its data**: one place to look when you change the struct.
      - **Shorter names**: `r.area()` instead of `rect_area(&r)`. Different types can each have their own `area` method.

      ### Common mistakes

      - **Forgetting `self`**: a function in an impl without a `self` parameter has no value to read from:

      ```rust compile_fail
      struct Rect {
          width: u32,
          height: u32,
      }

      impl Rect {
          fn area() -> u32 {
              self.width * self.height
          }
      }

      fn main() {
          let r = Rect { width: 2, height: 3 };
          println!("{}", r.area());
      }
      ```

      ```error
      error[E0424]: cannot find value `self` in this scope
      ```

      - **Forgetting the parentheses**: `r.area` (without `()`) gives ``error[E0615]: attempted to take value of method `area` on type `Rect` ``. Fields are read without parentheses, methods are called with them.

      **Your turn:** fill in the blanks so the program prints `perimeter: 28`: the keyword that starts the block, the parameter that borrows the square, the value whose `side` you read, and the method call.
    fill: |
      struct Square {
          side: u32,
      }

      [[impl]] Square {
          fn perimeter([[&self‖self: &Self‖self: &Square]]) -> u32 {
              [[self]].side * 4
          }
      }

      fn main() {
          let sq = Square { side: 7 };
          println!("perimeter: {}", sq.[[perimeter()]]);
      }
    hints:
      - "Methods live in an `impl Square { ... }` block."
      - "A method that only reads the value takes `&self`, and reads fields with `self.side`."
      - "Call it with a dot and parentheses: `sq.perimeter()`."
    tests:
      - expect: "perimeter: 28"
    more:
      - task: |
          Add two methods to `Rect`:

          - `fn perimeter(&self) -> u32`: twice the width plus twice the height.
          - `fn can_hold(&self, other: &Rect) -> bool`: true if `self` is strictly wider **and** strictly taller than `other`.

          A method can take more parameters after `self`, like any function.
        seed: |
          struct Rect {
              width: u32,
              height: u32,
          }

          impl Rect {
              // Your methods here
          }
        solution: |
          struct Rect {
              width: u32,
              height: u32,
          }

          impl Rect {
              // Your methods here
              fn perimeter(&self) -> u32 {
                  2 * self.width + 2 * self.height
              }

              fn can_hold(&self, other: &Rect) -> bool {
                  self.width > other.width && self.height > other.height
              }
          }
        harness: |
          #[test]
          fn perimeter_of_a_rectangle() {
              let r = Rect { width: 8, height: 5 };
              assert_eq!(r.perimeter(), 26, "perimeter of 8x5");
          }

          #[test]
          fn perimeter_of_a_flat_rectangle() {
              let r = Rect { width: 10, height: 0 };
              assert_eq!(r.perimeter(), 20, "perimeter of 10x0");
          }

          #[test]
          fn a_bigger_rect_can_hold_a_smaller_one() {
              let big = Rect { width: 10, height: 8 };
              let small = Rect { width: 3, height: 2 };
              assert_eq!(big.can_hold(&small), true, "10x8 can_hold 3x2");
              assert_eq!(small.can_hold(&big), false, "3x2 can_hold 10x8");
          }

          #[test]
          fn too_tall_does_not_fit() {
              let wide = Rect { width: 10, height: 2 };
              let tall = Rect { width: 3, height: 5 };
              assert_eq!(wide.can_hold(&tall), false, "10x2 can_hold 3x5");
          }

          #[test]
          fn the_same_size_does_not_fit() {
              let a = Rect { width: 4, height: 4 };
              let b = Rect { width: 4, height: 4 };
              assert_eq!(a.can_hold(&b), false, "4x4 can_hold 4x4");
          }
        hints:
          - "Both methods take `&self`; `can_hold` also takes `other: &Rect`."
          - "`can_hold` compares both dimensions: `self.width > other.width && self.height > other.height`."
      - task: |
          Write an impl block for `Time` (hours and minutes on a 24-hour clock) with two methods:

          - `fn total_minutes(&self) -> u32`: minutes since midnight (`9:30` is 570).
          - `fn is_before(&self, other: &Time) -> bool`: true if `self` is earlier in the day than `other`. Call `total_minutes` from inside it with `self.total_minutes()`.
        seed: |
          struct Time {
              hours: u32,
              minutes: u32,
          }

        solution: |
          struct Time {
              hours: u32,
              minutes: u32,
          }

          impl Time {
              fn total_minutes(&self) -> u32 {
                  self.hours * 60 + self.minutes
              }

              fn is_before(&self, other: &Time) -> bool {
                  self.total_minutes() < other.total_minutes()
              }
          }
        harness: |
          #[test]
          fn counts_minutes_since_midnight() {
              assert_eq!(Time { hours: 9, minutes: 30 }.total_minutes(), 570, "9:30 total_minutes");
          }

          #[test]
          fn midnight_is_zero() {
              assert_eq!(Time { hours: 0, minutes: 0 }.total_minutes(), 0, "0:00 total_minutes");
          }

          #[test]
          fn earlier_time_is_before() {
              let a = Time { hours: 9, minutes: 30 };
              let b = Time { hours: 10, minutes: 0 };
              assert_eq!(a.is_before(&b), true, "9:30 is_before 10:00");
              assert_eq!(b.is_before(&a), false, "10:00 is_before 9:30");
          }

          #[test]
          fn minutes_matter_within_the_same_hour() {
              let a = Time { hours: 14, minutes: 5 };
              let b = Time { hours: 14, minutes: 50 };
              assert_eq!(a.is_before(&b), true, "14:05 is_before 14:50");
          }

          #[test]
          fn a_time_is_not_before_itself() {
              let a = Time { hours: 7, minutes: 15 };
              let b = Time { hours: 7, minutes: 15 };
              assert_eq!(a.is_before(&b), false, "7:15 is_before 7:15");
          }
        require:
          - pattern: 'impl\s+Time'
            message: "Put the methods in an `impl Time { ... }` block."
        hints:
          - "Start with `impl Time { }` and write both methods inside, each taking `&self`."
          - "`self.hours * 60 + self.minutes`"
          - "`self.total_minutes() < other.total_minutes()`"

  - title: "&mut self: methods that change the value"
    id: methods-2
    text: |
      A method that changes the value takes **`&mut self`**: a mutable borrow of the value it's called on. Everything you know about `&mut` applies: you can change fields through it, and while the method runs nothing else can use the value.

      ```rust run
      struct Fighter {
          name: String,
          hp: u32,
      }

      impl Fighter {
          fn take_hit(&mut self, damage: u32) {
              self.hp = self.hp.saturating_sub(damage);
          }

          fn is_down(&self) -> bool {
              self.hp == 0
          }
      }

      fn main() {
          let mut crab = Fighter { name: String::from("Ferris"), hp: 30 };
          crab.take_hit(12);
          println!("{} has {} hp", crab.name, crab.hp);
          crab.take_hit(25);
          println!("{} has {} hp, down: {}", crab.name, crab.hp, crab.is_down());
      }
      ```

      ```output
      Ferris has 18 hp
      Ferris has 0 hp, down: true
      ```

      - `crab.take_hit(12)` borrows `crab` mutably for the call. Rust adds the `&mut` for you, just like it adds `&` for `&self` methods.
      - Because the method needs a mutable borrow, the variable must be declared `let mut crab`.
      - `is_down` only reads, so it takes `&self`. Pick the weakest receiver that does the job: readers take `&self`, so they can be called on any value, mutable or not.

      ### Returning whether it worked

      Some changes are not always allowed: you can't sell more than you have, or withdraw more than your balance. A simple way to say so is to return a `bool` and leave the value untouched when the answer is no:

      ```rust run
      struct Stock {
          quantity: u32,
      }

      impl Stock {
          fn sell(&mut self, amount: u32) -> bool {
              if amount > self.quantity {
                  return false;
              }
              self.quantity -= amount;
              true
          }
      }

      fn main() {
          let mut tea = Stock { quantity: 5 };
          println!("sell 3: {}", tea.sell(3));
          println!("sell 3: {}", tea.sell(3));
          println!("left: {}", tea.quantity);
      }
      ```

      ```output
      sell 3: true
      sell 3: false
      left: 2
      ```

      The caller decides what to do with a `false`: print a message, try a smaller amount, and so on. Later you'll return richer answers with enums (the next module) and `Result` (the errors module).

      ### Common mistakes

      - **Calling a `&mut self` method on a variable that isn't `mut`**:

      ```rust compile_fail
      struct Account {
          balance: u32,
      }

      impl Account {
          fn deposit(&mut self, amount: u32) {
              self.balance += amount;
          }
      }

      fn main() {
          let acct = Account { balance: 0 };
          acct.deposit(50);
          println!("{}", acct.balance);
      }
      ```

      ```error
      error[E0596]: cannot borrow `acct` as mutable, as it is not declared as mutable
      ```

      - **Changing a field in a `&self` method**: ``error[E0594]: cannot assign to `self.count`, which is behind a `&` reference``. The compiler's help suggests `&mut self`, which is right if the method really should change the value.

      **Your turn:** finish the bank account. `deposit` adds `amount` to the balance. `withdraw` takes `amount` out only if the balance is big enough and returns `true`; otherwise it changes nothing and returns `false`. Every **successful** deposit or withdrawal adds 1 to `transactions`.
    seed: |
      struct Account {
          balance_cents: u64,
          transactions: u32,
      }

      impl Account {
          fn deposit(&mut self, amount: u64) {
              todo!()
          }

          fn withdraw(&mut self, amount: u64) -> bool {
              todo!()
          }
      }
    solution: |
      struct Account {
          balance_cents: u64,
          transactions: u32,
      }

      impl Account {
          fn deposit(&mut self, amount: u64) {
              self.balance_cents += amount;
              self.transactions += 1;
          }

          fn withdraw(&mut self, amount: u64) -> bool {
              if amount > self.balance_cents {
                  return false;
              }
              self.balance_cents -= amount;
              self.transactions += 1;
              true
          }
      }
    harness: |
      fn empty() -> Account {
          Account { balance_cents: 0, transactions: 0 }
      }

      #[test]
      fn deposit_adds_to_the_balance() {
          let mut a = empty();
          a.deposit(5000);
          a.deposit(250);
          assert_eq!(a.balance_cents, 5250, "balance after deposit(5000) and deposit(250)");
      }

      #[test]
      fn withdraw_takes_money_out() {
          let mut a = empty();
          a.deposit(5000);
          assert_eq!(a.withdraw(1200), true, "withdraw(1200) from 5000");
          assert_eq!(a.balance_cents, 3800, "balance after withdraw(1200) from 5000");
      }

      #[test]
      fn withdraw_refuses_too_much() {
          let mut a = empty();
          a.deposit(5000);
          assert_eq!(a.withdraw(7500), false, "withdraw(7500) from 5000");
          assert_eq!(a.balance_cents, 5000, "balance after a refused withdraw");
      }

      #[test]
      fn can_withdraw_everything() {
          let mut a = empty();
          a.deposit(300);
          assert_eq!(a.withdraw(300), true, "withdraw(300) from 300");
          assert_eq!(a.balance_cents, 0, "balance after withdrawing everything");
      }

      #[test]
      fn counts_only_successful_transactions() {
          let mut a = empty();
          a.deposit(100);
          a.withdraw(30);
          a.withdraw(500);
          a.deposit(1);
          assert_eq!(a.transactions, 3, "transactions after deposit, withdraw, refused withdraw, deposit");
      }
    hints:
      - "Both methods change the account, so they work through `self`: `self.balance_cents += amount;`"
      - "In `withdraw`, check `amount > self.balance_cents` first and `return false` before changing anything."
      - "Don't forget `self.transactions += 1;` in both methods, only on the successful path."
    more:
      - task: |
          Add `fn transfer(&mut self, to: &mut Account, amount: u64) -> bool`. It moves `amount` from `self` into `to` if `self` has enough, and returns whether it did. Reuse `withdraw` and `deposit`: call them on `self` and on `to`.
        seed: |
