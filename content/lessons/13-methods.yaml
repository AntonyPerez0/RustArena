              level: u8,
          }

          impl Volume {
          }
        solution: |
          struct Volume {
              level: u8,
          }

          impl Volume {
              fn new(level: u8) -> Self {
                  Self { level: level.min(100) }
              }

              fn level(&self) -> u8 {
