      - task: |
          Write `Stats`, which records numbers in place with chainable calls:

          - `fn new() -> Self`: no values yet: count 0, total 0, `highest` set to `i32::MIN`.
          - `fn record(&mut self, value: i32) -> &mut Self`: counts the value, adds it to `total`, updates `highest`, and returns `self` for chaining.
          - `fn average(&self) -> i32`: `total / count` (integer division), or 0 when nothing has been recorded.
        seed: |
          struct Stats {
              count: i32,
              total: i32,
              highest: i32,
          }

          impl Stats {
          }
        solution: |
          struct Stats {
              count: i32,
              total: i32,
              highest: i32,
          }

          impl Stats {
              fn new() -> Self {
                  Self { count: 0, total: 0, highest: i32::MIN }
              }

              fn record(&mut self, value: i32) -> &mut Self {
                  self.count += 1;
                  self.total += value;
                  if value > self.highest {
                      self.highest = value;
                  }
                  self
              }

              fn average(&self) -> i32 {
                  if self.count == 0 {
                      return 0;
                  }
                  self.total / self.count
              }
          }
        harness: |
          #[test]
          fn records_a_chain_of_values() {
              let mut s = Stats::new();
              s.record(3).record(-2).record(10);
              assert_eq!((s.count, s.total, s.highest), (3, 11, 10), "(count, total, highest) after recording 3, -2, 10");
          }

          #[test]
          fn average_uses_integer_division() {
              let mut s = Stats::new();
              s.record(3).record(-2).record(10);
              assert_eq!(s.average(), 3, "average of 3, -2, 10");
          }

          #[test]
          fn average_of_nothing_is_zero() {
              assert_eq!(Stats::new().average(), 0, "Stats::new().average()");
          }

          #[test]
          fn highest_works_with_negative_values() {
              let mut s = Stats::new();
              s.record(-7).record(-3);
              assert_eq!(s.highest, -3, "highest after recording -7, -3");
          }
        hints:
          - "`record` takes `&mut self`, updates the three fields, and ends with `self`."
          - "Starting `highest` at `i32::MIN` means the first recorded value is always bigger."
          - "In `average`, return 0 early when `self.count == 0`, to avoid dividing by zero (which panics)."
