              let mut score = 0;
              let player_one = &mut score;
              let player_two = &mut score;
              *player_one += 10;
              *player_two += 5;
              println!("team score: {}", score);
          }
        solution: |
          fn main() {
              let mut score = 0;
              let team = &mut score;
              *team += 10;
              *team += 5;
              println!("team score: {}", score);
          }
        hints:
          - "The error points at the second `&mut score` and at the line where the first one is used later."
          - "Use one reference for both additions: `let team = &mut score; *team += 10; *team += 5;`"
        tests:
          - expect: "team score: 15"
      - task: |
          Write `append_doubles`. It borrows a vector mutably and appends, at the end, the double of every **original** element: `[1, 2, 3]` becomes `[1, 2, 3, 2, 4, 6]`. You can't push while looping over the vector by reference, so loop over the **indexes** of the original length instead. No `.clone()`.
        seed: |
