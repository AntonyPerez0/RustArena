id: borrowing
title: Borrowing
phase: "Ownership"
summary: Use a value without taking ownership of it. References (&T and &mut T), the "many readers or one writer" rule, and how the borrow checker makes dangling pointers and data races impossible.
roadmap: [Borrowing, References and Slices, Ownership Rules & Memory Safety]
steps:
  - title: "References: borrowing a value"
    id: borrowing-1
    text: |
      The ownership module ended with an awkward pattern: to let a function look at a `String`, you had to move it in and get it back in a tuple. Real Rust code almost never does that. Instead, it lends the function a **reference**.

      A **reference** is a pointer to a value that someone else owns. You make one with `&`: `&msg` means "a reference to `msg`". The type of a reference to a `String` is `&String`. Making a reference is called **borrowing**: you get to use the value, but you don't own it, so you never drop it, and the owner still has it afterwards.

      ```rust run
      fn char_count(text: &String) -> usize {   // borrows a String
          text.chars().count()
      }                                          // text goes away, but it owned nothing: nothing is dropped

      fn main() {
          let msg = String::from("good game");
          let n = char_count(&msg);              // lend msg to the function
          println!("'{}' has {} characters", msg, n);   // msg is still ours
      }
      ```

      ```output
      'good game' has 9 characters
      ```

      Compare it with the tuple version from the ownership module: no giving back, no shadowing. In memory, the reference is just one more pointer, pointing at the owner:

      ```text
         char_count's frame          main's frame
         text                        msg
        ┌────────────┐              ┌────────────┐          HEAP
        │ ptr ───────┼────────────► │ ptr ───────┼─────► ┌───┬───┬───┬─ ─ ─┬───┐
        └────────────┘              │ len 9      │       │ g │ o │ o │ ... │ e │
                                    │ cap 9      │       └───┴───┴───┴─ ─ ─┴───┘
                                    └────────────┘
      ```

      When `char_count` returns, `text` disappears. It was only a borrow, so the `String` isn't dropped: `msg` is still its owner.

      ### Reading through a reference

      Method calls and `println!` work through references automatically: `text.chars()`, `text.len()` and `println!("{}", text)` all reach the `String` behind the reference. You don't need any extra syntax to *read* through a `&`.

      You can borrow in a `let` and in a `for` loop too. `for x in &v` loops over a vector **without moving it**: each `x` is a reference to one element.

      ```rust run
      fn main() {
          let names = vec![String::from("Ana"), String::from("Ben")];
          for name in &names {              // borrow the vector: name is a &String
              println!("hello, {}", name);
          }
          println!("{} names, still ours", names.len());
          let first = &names[0];            // borrow one element: no clone needed
          println!("first: {}", first);
      }
      ```

      ```output
      hello, Ana
      hello, Ben
      2 names, still ours
      first: Ana
      ```

      Those are exactly the fixes the compiler suggested for the loop and index errors in the ownership module. With a `Vec<i32>` or `Vec<f64>`, each `x` in `for x in &v` is a `&i32` or `&f64`, and arithmetic accepts those directly: `sum += x` works.

      You've been using one kind of reference since your first program: string literals. Their type, `&str`, is a reference to text stored in the program itself. The slices module covers `&str` properly; for now, it's the type to write for a parameter that receives a string literal.

      ### Common mistakes

      - **Passing the value instead of a reference.** If the function takes `&String` and you pass `msg`, the types don't match:

      ```rust compile_fail
      fn char_count(text: &String) -> usize {
          text.chars().count()
      }

      fn main() {
          let msg = String::from("gg");
          println!("{}", char_count(msg));
      }
      ```

      ```error
      error[E0308]: mismatched types
       --> src/main.rs:7:31
        |
      7 |     println!("{}", char_count(msg));
        |                    ---------- ^^^ expected `&String`, found `String`
        |
      help: consider borrowing here
        |
      7 |     println!("{}", char_count(&msg));
        |                               +
      ```

      - **Trying to change a value through a `&` reference.** Plain references are read-only. The next step shows how to lend something for changing.
      - **Taking ownership when you only need to read.** If a function only looks at a value, its parameter should be a reference.

      **Your turn:** fill in the blanks so `average` **borrows** the vector of temperatures instead of taking ownership of it (the parameter type, then the argument), so `main` can still print the readings afterwards. The program should print:

      ```
      average of [18.5, 21.0, 19.5, 22.0]: 20.25
      ```
    fill: |
      fn average(temps: [[&Vec<f64>‖&[f64]]]) -> f64 {
          let mut sum = 0.0;
          for t in temps {
              sum += t; // t is a &f64: arithmetic works through the reference
          }
          sum / temps.len() as f64
      }

      fn main() {
          let readings = vec![18.5, 21.0, 19.5, 22.0];
          let avg = average([[&readings]]);
          println!("average of {:?}: {:.2}", readings, avg);
      }
    hints:
      - The parameter type is a reference to a vector of f64, and the argument is a reference to `readings`.
      - "`&Vec<f64>` for the type, `&readings` for the argument."
    tests:
      - expect: "average of [18.5, 21.0, 19.5, 22.0]: 20.25"
    more:
      - task: |
          `print_receipt` takes ownership of the order, so the second call and the last line don't compile. Change the function to **borrow** the order instead, and update the calls. Don't use `.clone()`. The program should print:

          ```
          Receipt for #204 noodles
          Receipt for #204 noodles
          Archived #204 noodles
          ```
        seed: |
          fn print_receipt(order: String) {
              println!("Receipt for {}", order);
          }

          fn main() {
              let order = String::from("#204 noodles");
              print_receipt(order);
              print_receipt(order);
              println!("Archived {}", order);
          }
        solution: |
          fn print_receipt(order: &String) {
              println!("Receipt for {}", order);
          }

          fn main() {
              let order = String::from("#204 noodles");
              print_receipt(&order);
              print_receipt(&order);
              println!("Archived {}", order);
          }
        require:
          - pattern: 'order:\s*&'
            message: "Make the parameter a reference: `order: &String`."
        forbid:
          - pattern: '\.clone\(\)'
            message: "Borrow the order instead of cloning it."
        hints:
          - "The function only prints the order, so it only needs to read it."
          - "Change the parameter to `order: &String` and call it as `print_receipt(&order);`."
        tests:
          - expect: "Receipt for #204 noodles\nReceipt for #204 noodles\nArchived #204 noodles"
      - task: |
          Write `count_long`. It borrows a vector of words and returns how many of them have **at least** `min` characters. Count characters with `.chars().count()`, not bytes, so `"café"` counts as 4. Don't use `.clone()`.
        seed: |
          fn count_long(words: &Vec<String>, min: usize) -> usize {
              todo!()
          }
        solution: |
          fn count_long(words: &Vec<String>, min: usize) -> usize {
              let mut count = 0;
              for word in words {
                  if word.chars().count() >= min {
                      count += 1;
                  }
              }
              count
          }
        harness: |
          #[test]
          fn counts_words_with_at_least_min_characters() {
              let words = vec![String::from("crab"), String::from("ox"), String::from("lobster")];
              assert_eq!(count_long(&words, 4), 2, "count_long([crab, ox, lobster], 4)");
          }

          #[test]
          fn returns_zero_for_an_empty_vector() {
              assert_eq!(count_long(&Vec::new(), 1), 0, "count_long([], 1)");
          }

          #[test]
          fn counts_characters_not_bytes() {
              let words = vec![String::from("café"), String::from("naïve")];
              assert_eq!(count_long(&words, 5), 1, "count_long([café, naïve], 5)");
          }

          #[test]
          fn leaves_the_vector_usable() {
              let words = vec![String::from("arena")];
              assert_eq!(count_long(&words, 3), 1, "count_long([arena], 3)");
              assert_eq!(count_long(&words, 6), 0, "count_long([arena], 6)");
              assert_eq!(words.len(), 1, "words.len() after the calls");
          }
        forbid:
          - pattern: '\.clone\(\)'
            message: "Read the words through the reference; no clone needed."
        hints:
          - "`for word in words` loops over the borrowed vector; each `word` is a `&String`."
          - "Inside: `if word.chars().count() >= min { count += 1; }`, then return `count`."

  - title: Mutable references
    id: borrowing-2
    text: |
      A `&` reference is read-only. Try to change something through one and the compiler stops you:

      ```rust compile_fail
      fn shout(text: &String) {
          text.push_str("!");
      }

      fn main() {
          let mut s = String::from("hi");
          shout(&s);
          println!("{}", s);
      }
      ```

      ```error
      error[E0596]: cannot borrow `*text` as mutable, as it is behind a `&` reference
       --> src/main.rs:2:5
        |
      2 |     text.push_str("!");
        |     ^^^^ `text` is a `&` reference, so it cannot be borrowed as mutable
        |
      help: consider changing this to be a mutable reference
        |
      1 | fn shout(text: &mut String) {
        |                 +++
      ```

      To lend a value **for changing**, use a **mutable reference**, `&mut`. Its type is `&mut String`, and you create one with `&mut s`. Three places have to agree:

      1. the owner is declared `mut` (you can't lend out write access to something you can't write yourself),
      2. the parameter's type is `&mut T`,
      3. the call passes `&mut value`.

      ```rust run
      fn add_signature(letter: &mut String) {
          letter.push_str("\n-- Ferris");
      }

      fn restock(shelf: &mut Vec<String>) {
          shelf.push(String::from("milk"));
          shelf.push(String::from("eggs"));
      }

      fn main() {
          let mut letter = String::from("See you in the arena!");
          add_signature(&mut letter);
          println!("{}", letter);

          let mut shelf = vec![String::from("bread")];
          restock(&mut shelf);
          println!("{:?}", shelf);
      }
      ```

      ```output
      See you in the arena!
      -- Ferris
      ["bread", "milk", "eggs"]
      ```

      As with `&`, method calls work through a `&mut` automatically: `letter.push_str(...)` changes the `String` that `main` owns. When the function returns, the borrow is over and `main` can use its value again, now changed.

      You've used a mutable reference since the input module: `std::io::stdin().read_line(&mut line)`. `read_line` borrows your `String` mutably so it can append the typed line to it, then gives the borrow back. Now you know why the `&mut` is there.

      The picture is the same as for `&`. The difference is a promise the compiler enforces: while a `&mut` exists, it is the **only** way to reach the value (step 4 explains why).

      ```text
         add_signature's frame       main's frame
         letter: &mut String         letter: String
        ┌────────────┐              ┌────────────┐          HEAP
        │ ptr ───────┼────────────► │ ptr ───────┼─────► "See you in the arena!" + more text
        └────────────┘              │ len ...    │
          exclusive access:         │ cap ...    │
          can read and write        └────────────┘
      ```

      ### Common mistakes

      - **Forgetting `mut` on the variable.** You can't borrow mutably from an immutable variable:

      ```rust compile_fail
      fn main() {
          let s = String::from("hi");
          let r = &mut s;
          r.push('!');
      }
      ```

      ```error
      error[E0596]: cannot borrow `s` as mutable, as it is not declared as mutable
      ```

      - **Writing `&` at the call when the function wants `&mut`**: ``error[E0308]: mismatched types`` with the note `types differ in mutability`.
      - **Asking for `&mut` when you only read.** Callers then need a `mut` variable, and (step 4) nobody else can look at the value while your borrow is active. Ask for the least access you need.

      **Your turn:** write `add_entry`. It appends `entry` to the `log` it borrows mutably. If the log already has text in it, put `"; "` before the new entry, so entries come out as `start; hit; miss`. (`entry: &str` lets you pass string literals like `"hit"`. `log.is_empty()` tells you whether a `String` has no text.)
    seed: |
      fn add_entry(log: &mut String, entry: &str) {
          todo!()
      }
    solution: |
      fn add_entry(log: &mut String, entry: &str) {
          if !log.is_empty() {
              log.push_str("; ");
          }
          log.push_str(entry);
      }
    harness: |
      #[test]
      fn adds_the_first_entry_without_a_separator() {
          let mut log = String::new();
          add_entry(&mut log, "start");
          assert_eq!(log, "start", "log after add_entry(\"start\")");
      }

      #[test]
      fn separates_entries_with_a_semicolon() {
          let mut log = String::from("start");
          add_entry(&mut log, "hit");
          assert_eq!(log, "start; hit", "\"start\" after add_entry(\"hit\")");
      }

      #[test]
      fn builds_up_over_several_calls() {
          let mut log = String::new();
          add_entry(&mut log, "start");
          add_entry(&mut log, "hit");
          add_entry(&mut log, "miss");
          assert_eq!(log, "start; hit; miss", "log after start, hit, miss");
      }
    hints:
      - "`log` is a `&mut String`, so `log.push_str(...)` changes the caller's String directly."
      - "`if !log.is_empty() { log.push_str(\"; \"); }` then `log.push_str(entry);`"
    more:
      - task: |
          `level_up` should add a skill to the player's skill list, but the program has three mistakes: the function takes `&` instead of `&mut`, the variable isn't `mut`, and the call passes `&` instead of `&mut`. Fix all three (read the compiler's messages one at a time) so it prints:

          ```
          ["run", "jump", "double jump"]
          ```
        seed: |
          fn level_up(skills: &Vec<String>) {
              skills.push(String::from("double jump"));
          }

          fn main() {
              let skills = vec![String::from("run"), String::from("jump")];
              level_up(&skills);
              println!("{:?}", skills);
          }
        solution: |
          fn level_up(skills: &mut Vec<String>) {
              skills.push(String::from("double jump"));
          }

          fn main() {
              let mut skills = vec![String::from("run"), String::from("jump")];
              level_up(&mut skills);
              println!("{:?}", skills);
          }
        require:
          - pattern: 'skills:\s*&mut\s+Vec'
            message: "The function changes the vector, so its parameter must be `&mut Vec<String>`."
          - pattern: 'level_up\(\s*&mut\s+skills\s*\)'
            message: "Pass a mutable reference at the call: `level_up(&mut skills)`."
        hints:
          - "Start with the function: changing the vector needs `skills: &mut Vec<String>`."
          - "Then `let mut skills = ...` and `level_up(&mut skills);`."
        tests:
          - expect: "[\"run\", \"jump\", \"double jump\"]"
      - task: |
          Write `pad_right`. It borrows `text` mutably and pushes `.` characters onto the end until the text is `width` characters long. If it's already that long or longer, leave it unchanged. Count characters with `.chars().count()`, so `"café"` padded to 6 becomes `"café.."`.
        seed: |
          fn pad_right(text: &mut String, width: usize) {
              todo!()
          }
        solution: |
          fn pad_right(text: &mut String, width: usize) {
              while text.chars().count() < width {
                  text.push('.');
              }
          }
        harness: |
          #[test]
          fn pads_short_text_with_dots() {
              let mut s = String::from("crab");
              pad_right(&mut s, 8);
              assert_eq!(s, "crab....", "pad_right(\"crab\", 8)");
          }

          #[test]
          fn leaves_long_text_unchanged() {
              let mut s = String::from("lobster");
              pad_right(&mut s, 3);
              assert_eq!(s, "lobster", "pad_right(\"lobster\", 3)");
          }

          #[test]
          fn leaves_text_of_exactly_the_width_unchanged() {
              let mut s = String::from("ok");
              pad_right(&mut s, 2);
              assert_eq!(s, "ok", "pad_right(\"ok\", 2)");
          }

          #[test]
          fn pads_an_empty_string() {
              let mut s = String::new();
              pad_right(&mut s, 3);
              assert_eq!(s, "...", "pad_right(\"\", 3)");
          }

          #[test]
          fn counts_characters_not_bytes() {
              let mut s = String::from("café");
              pad_right(&mut s, 6);
              assert_eq!(s, "café..", "pad_right(\"café\", 6)");
          }
        hints:
          - "A `while` loop fits: keep pushing while the text is too short."
          - "`while text.chars().count() < width { text.push('.'); }`"

  - title: Changing values through &mut with *
    id: borrowing-3
    text: |
      Method calls work through a `&mut` automatically. But operators and assignment that act on the value itself need the **dereference operator** `*`: `*r` means "the value `r` points to". Without it, you'd be doing arithmetic on the reference:

      ```rust compile_fail
      fn add_one(count: &mut i32) {
          count += 1;
      }

      fn main() {
          let mut c = 0;
          add_one(&mut c);
          println!("{}", c);
      }
      ```

      ```error
      error[E0368]: binary assignment operation `+=` cannot be applied to type `&mut i32`
       --> src/main.rs:2:5
        |
      2 |     count += 1;
        |     -----^^^^^
        |     |
        |     cannot use `+=` on type `&mut i32`
        |
      help: `+=` can be used on `i32` if you dereference the left-hand side
        |
      2 |     *count += 1;
        |     +
      ```

      With `*` it works:

      ```rust run
      fn add_points(score: &mut u32, points: u32) {
          *score += points;
      }

      fn reset(name: &mut String) {
          *name = String::from("(empty slot)");   // the old String is dropped here
      }

      fn main() {
          let mut score = 100;
          add_points(&mut score, 25);
          add_points(&mut score, 5);
          println!("score: {}", score);

          let mut slot = String::from("Ferris");
          reset(&mut slot);
          println!("slot: {}", slot);
      }
      ```

      ```output
      score: 130
      slot: (empty slot)
      ```

      `*name = String::from(...)` replaces the whole value behind the reference. Ownership still works: the old `String` ("Ferris") is dropped right there, and the caller's variable now owns the new one.

      When do you need `*`?

      | You write | Need `*`? |
      |---|---|
      | `r.push_str("x")`, `r.len()` (method calls) | No: automatic |
      | `println!("{}", r)` | No |
      | `*r += 1`, `*r = 0`, `*r * 2` (operators and assignment on the value) | Yes |
      | `if *r > 10` (comparing with a plain number) | Yes |

      You can also read a `Copy` value out through a reference: `let copy = *r;`.

      ### Changing every element: for x in &mut v

      `for x in &mut v` borrows the vector mutably and gives you a `&mut` to each element in turn, so you change elements with `*x`:

      ```rust run
      fn main() {
          let mut prices = vec![100, 250, 40];
          for price in &mut prices {
              *price = *price * 9 / 10;     // 10% off
          }
          println!("{:?}", prices);
      }
      ```

      ```output
      [90, 225, 36]
      ```

      If `prices` arrives in a function as a `&mut Vec<u32>` parameter, it's already a mutable reference: loop with `for price in prices`.

      The three ways to loop over a vector:

      | Loop | Each `x` is | The vector afterwards |
      |---|---|---|
      | `for x in v` | the element itself (moved out) | gone |
      | `for x in &v` | `&T`, read-only | unchanged, still usable |
      | `for x in &mut v` | `&mut T`, change it with `*x` | changed, still usable |

      ### Common mistakes

      - **Forgetting the `*`.** `count += 1` gives E0368; `r = 5` gives ``error[E0308]: mismatched types`` (`expected &mut i32, found integer`), and the help suggests the `*`.
      - **Adding `*` to method calls.** `(*name).push_str("x")` works but nobody writes it: `name.push_str("x")` does the same.
      - **Assigning through a `&`**: ``error[E0594]: cannot assign to `*score`, which is behind a `&` reference``. The parameter must be `&mut`.

      **Your turn:** a small bank account. Write `deposit`, which adds `amount` to the balance it borrows, and `withdraw`, which takes `amount` out **only if** the balance is at least `amount`. `withdraw` returns `true` if it took the money and `false` (leaving the balance unchanged) if there wasn't enough.
    seed: |
      fn deposit(balance: &mut u64, amount: u64) {
          todo!()
      }

      fn withdraw(balance: &mut u64, amount: u64) -> bool {
          todo!()
      }
    solution: |
      fn deposit(balance: &mut u64, amount: u64) {
          *balance += amount;
      }

      fn withdraw(balance: &mut u64, amount: u64) -> bool {
          if *balance < amount {
              return false;
          }
          *balance -= amount;
          true
      }
    harness: |
      #[test]
      fn deposit_adds_to_the_balance() {
          let mut balance = 100;
          deposit(&mut balance, 50);
          assert_eq!(balance, 150, "balance 100 after deposit(50)");
      }

      #[test]
      fn withdraw_takes_money_when_there_is_enough() {
          let mut balance = 100;
          let ok = withdraw(&mut balance, 30);
          assert_eq!(ok, true, "withdraw(30) from 100 returns");
          assert_eq!(balance, 70, "balance 100 after withdraw(30)");
      }

      #[test]
      fn withdraw_refuses_when_there_is_not_enough() {
          let mut balance = 20;
          let ok = withdraw(&mut balance, 50);
          assert_eq!(ok, false, "withdraw(50) from 20 returns");
          assert_eq!(balance, 20, "balance 20 after a refused withdraw(50)");
      }

      #[test]
      fn withdraw_can_empty_the_account() {
          let mut balance = 40;
          assert_eq!(withdraw(&mut balance, 40), true, "withdraw(40) from 40 returns");
          assert_eq!(balance, 0, "balance after withdrawing everything");
      }

      #[test]
      fn several_operations_add_up() {
          let mut balance = 0;
          deposit(&mut balance, 10);
          deposit(&mut balance, 5);
          withdraw(&mut balance, 7);
          assert_eq!(balance, 8, "balance after +10, +5, -7");
      }
    hints:
      - "`deposit` is one line: `*balance += amount;`"
      - "In `withdraw`, compare first: `if *balance < amount { return false; }`. Otherwise subtract with `*balance -= amount;` and end with `true`."
    more:
      - task: |
          `heal` should add `amount` to the hit points but never go above `max`. It's missing every `*`: fix the function (read the compiler's help lines) so the program prints:

          ```
          hp: 60
          hp: 100
          ```
        seed: |
          fn heal(hp: &mut u32, amount: u32, max: u32) {
              hp += amount;
              if hp > max {
                  hp = max;
              }
          }

          fn main() {
              let mut hp = 40;
              heal(&mut hp, 20, 100);
              println!("hp: {}", hp);
              heal(&mut hp, 75, 100);
              println!("hp: {}", hp);
          }
        solution: |
          fn heal(hp: &mut u32, amount: u32, max: u32) {
              *hp += amount;
              if *hp > max {
                  *hp = max;
              }
          }

          fn main() {
              let mut hp = 40;
              heal(&mut hp, 20, 100);
              println!("hp: {}", hp);
              heal(&mut hp, 75, 100);
              println!("hp: {}", hp);
          }
        hints:
          - "Every place that uses the number behind `hp` (adding, comparing, assigning) needs `*hp`."
          - "`*hp += amount;`, `if *hp > max {` and `*hp = max;`"
        tests:
          - expect: "hp: 60\nhp: 100"
      - task: |
          Write `clamp_all`. It borrows a vector of sensor readings mutably and changes every reading below `low` to `low` and every reading above `high` to `high`. Readings in between stay as they are.

          For example, readings `[-5, 12, 40]` with `low` 0 and `high` 30 become `[0, 12, 30]`.
        seed: |
          fn clamp_all(readings: &mut Vec<i32>, low: i32, high: i32) {
              todo!()
          }
        solution: |
          fn clamp_all(readings: &mut Vec<i32>, low: i32, high: i32) {
              for r in readings {
                  if *r < low {
                      *r = low;
                  } else if *r > high {
                      *r = high;
                  }
              }
          }
        harness: |
