          let mut title = String::from("Rust for Beginners");
          let original = &title;
          title.push_str(", 2nd edition");
          println!("was: {}", original);
          println!("now: {}", title);
      }
    solution: |
      fn main() {
          let mut title = String::from("Rust for Beginners");
          let original = &title;
          println!("was: {}", original);
          title.push_str(", 2nd edition");
          println!("now: {}", title);
      }
    forbid:
      - pattern: '\.clone\(\)|to_string|to_owned|format!'
        message: "No copies needed: print `original` before the String changes."
      - pattern: 'String::from[\s\S]*String::from'
        message: "Don't create a second String: reorder the lines instead."
    hints:
      - "The borrow `original` is alive from its `let` to the `println!` that uses it, and `push_str` sits in between."
      - "Move `println!(\"was: {}\", original);` above the `push_str` line."
