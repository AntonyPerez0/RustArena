              best
          }
        harness: |
          #[test]
          fn returns_the_longest_word() {
              let words = vec![String::from("crab"), String::from("lobster"), String::from("shrimp")];
              assert_eq!(longest(&words), "lobster", "longest([crab, lobster, shrimp])");
          }

          #[test]
          fn returns_the_first_on_a_tie() {
              let words = vec![String::from("ab"), String::from("cd")];
              assert_eq!(longest(&words), "ab", "longest([ab, cd])");
          }

          #[test]
          fn works_with_a_single_word() {
              let words = vec![String::from("solo")];
              assert_eq!(longest(&words), "solo", "longest([solo])");
          }

          #[test]
          fn returns_a_reference_into_the_vector() {
              let words = vec![String::from("a"), String::from("abc"), String::from("ab")];
              assert!(std::ptr::eq(longest(&words), &words[1]), "longest(&words) should point at words[1], not at a copy");
          }
        forbid:
          - pattern: '\.clone\(\)'
            message: "Return a reference into the vector, not a copy."
        hints:
          - "Keep a reference to the best word so far: `let mut best = &words[0];`"
          - "`for word in words { if word.len() > best.len() { best = word; } }` then return `best`."

  - title: Choosing how to pass a value
    id: borrowing-7
    text: |
      You now have four ways to hand a value to a function. Choosing well is most of what "idiomatic Rust" means for function signatures:

      | The function... | Parameter | Example |
      |---|---|---|
      | only reads the value | `&T` | `fn total(items: &Vec<u32>) -> u32` |
      | changes the value in place | `&mut T` | `fn restock(items: &mut Vec<u32>, n: u32)` |
      | keeps the value, or uses it up | `T` (move) | `fn archive(report: String)` |
      | gets a small `Copy` value | `T` (copy) | `fn is_adult(age: u32) -> bool` |
      | creates new data | returns an owned `T` | `fn make_label(...) -> String` |

      Here's a bank account that uses all of them:

      ```rust run
      fn print_statement(owner: &String, history: &Vec<i64>) {
          let mut balance = 0;
          for amount in history {
              balance += amount;
          }
          println!("{}: {} transactions, balance {}", owner, history.len(), balance);
      }

      fn deposit(history: &mut Vec<i64>, amount: i64) {
          history.push(amount);
      }

      fn close_account(owner: String, history: Vec<i64>) -> String {
          format!("closed {}'s account after {} transactions", owner, history.len())
      }

      fn main() {
          let owner = String::from("Ferris");
          let mut history = vec![100];
          deposit(&mut history, 50);
          deposit(&mut history, -30);
          print_statement(&owner, &history);
          let receipt = close_account(owner, history);
          println!("{}", receipt);
      }
      ```

      ```output
      Ferris: 3 transactions, balance 120
      closed Ferris's account after 3 transactions
      ```

      - `print_statement` only reads, so it borrows: `main` keeps both values.
      - `deposit` changes the history, so it borrows mutably.
      - `close_account` takes ownership on purpose: after closing, the account must not be used again, and now the compiler guarantees it. Any later use of `owner` or `history` is a compile error. Moves aren't only about memory; they also let a type say "this is finished".

      ### Workplace notes

      - In a typical Rust codebase, most parameters are `&T`. `&mut T` appears where a function's job is to change something, and owned parameters where the function stores or consumes the value.
      - Don't pass small `Copy` values by reference: `fn is_adult(age: &u32)` just makes callers write `&`. (Clippy's pedantic lints flag it as `trivially_copy_pass_by_ref`.)
      - Clippy warns about `&String` and `&Vec<T>` parameters (the `ptr_arg` lint). The next module, slices, shows why `&str` and `&[T]` are better parameter types. Everything you've learned here carries over unchanged.
      - The borrowing rules cost nothing at run time: references are plain pointers, and all checking happens at compile time.

      ### Common mistakes

      - **Taking ownership "to be safe"**, then cloning at every call site. If you only read, borrow.
      - **Taking `&mut` when `&` would do.** It blocks other readers for no reason.
      - **Returning references to new data** (step 6). Return owned values.

      **Your turn:** every function below takes ownership of its arguments, which forces `main` to `.clone()` everything. Refactor: give each function the **least access it needs** (`&` to read, `&mut` to change, plain `u32`s stay as they are), update the calls, and remove every `.clone()`. `restock` should change the vector in place and return nothing. The output must stay:

      ```
      total: 215
      bolts x120
      nuts x80
      gears x50
      total: 250
      ```
    seed: |
      fn total_stock(stock: Vec<u32>) -> u32 {
          let mut total = 0;
          for n in stock {
              total += n;
          }
          total
      }

      fn restock(mut stock: Vec<u32>, index: usize, amount: u32) -> Vec<u32> {
          stock[index] += amount;
          stock
      }

      fn label(name: String, count: u32) -> String {
          format!("{} x{}", name, count)
      }

      fn main() {
          let names = vec![String::from("bolts"), String::from("nuts"), String::from("gears")];
          let mut stock = vec![120, 80, 15];

          println!("total: {}", total_stock(stock.clone()));
          stock = restock(stock.clone(), 2, 35);
          for i in 0..names.len() {
              println!("{}", label(names[i].clone(), stock[i]));
          }
          println!("total: {}", total_stock(stock.clone()));
      }
    solution: |
      fn total_stock(stock: &Vec<u32>) -> u32 {
          let mut total = 0;
          for n in stock {
              total += n;
          }
          total
      }

      fn restock(stock: &mut Vec<u32>, index: usize, amount: u32) {
          stock[index] += amount;
      }

      fn label(name: &String, count: u32) -> String {
          format!("{} x{}", name, count)
      }

      fn main() {
          let names = vec![String::from("bolts"), String::from("nuts"), String::from("gears")];
          let mut stock = vec![120, 80, 15];

          println!("total: {}", total_stock(&stock));
          restock(&mut stock, 2, 35);
          for i in 0..names.len() {
              println!("{}", label(&names[i], stock[i]));
          }
          println!("total: {}", total_stock(&stock));
      }
    require:
      - pattern: 'fn\s+restock\s*\(\s*stock\s*:\s*&mut\b'
        message: "`restock` changes the vector in place: its parameter should be `&mut Vec<u32>`."
    forbid:
      - pattern: '\.clone\(\)'
        message: "Remove every `.clone()`: borrow instead."
    hints:
      - "`total_stock` and `label` only read their argument: make them take `&Vec<u32>` and `&String`."
      - "`restock(stock: &mut Vec<u32>, index: usize, amount: u32)` with no return value; call it as `restock(&mut stock, 2, 35);`."
      - "The calls become `total_stock(&stock)` and `label(&names[i], stock[i])`."
    tests:
      - expect: "total: 215\nbolts x120\nnuts x80\ngears x50\ntotal: 250"
    more:
      - task: |
          Fill in each function's parameter type: `count_urgent` only reads the task list, `add` changes it, and `archive` uses it up for good. The program should print:

          ```
          1 urgent tasks
          archived 3 tasks
          ```
        fill: |
          // Only reads the list.
          fn count_urgent(tasks: [[&Vec<String>‖&[String]]]) -> usize {
              let mut n = 0;
              for task in tasks {
                  if task.contains("urgent") {
                      n += 1;
                  }
              }
              n
          }

          // Changes the list.
          fn add(tasks: [[&mut Vec<String>]], title: &str) {
              tasks.push(title.to_string());
          }

          // Takes the list for good: nobody can use it afterwards.
          fn archive(tasks: [[Vec<String>]]) -> String {
              format!("archived {} tasks", tasks.len())
          }

          fn main() {
              let mut todo = vec![String::from("write tests")];
              add(&mut todo, "urgent: fix the login bug");
              add(&mut todo, "deploy");
              println!("{} urgent tasks", count_urgent(&todo));
              println!("{}", archive(todo));
          }
        hints:
          - "Look at how `main` calls each function: `&todo`, `&mut todo` and plain `todo`."
          - "`&Vec<String>`, `&mut Vec<String>` and `Vec<String>`."
        tests:
          - expect: "1 urgent tasks\narchived 3 tasks"
      - task: |
          Write `transfer`, which moves `amount` from one balance to another. If `from` holds less than `amount`, change nothing and return `false`; otherwise move the money and return `true`.

          The borrowing rules make one mistake impossible: nobody can call `transfer(&mut a, &mut a, 10)`, because that would be two `&mut` to the same balance (E0499).
        seed: |
          fn transfer(from: &mut u64, to: &mut u64, amount: u64) -> bool {
              todo!()
          }
        solution: |
          fn transfer(from: &mut u64, to: &mut u64, amount: u64) -> bool {
              if *from < amount {
                  return false;
              }
              *from -= amount;
              *to += amount;
              true
          }
        harness: |
          #[test]
          fn moves_money_when_there_is_enough() {
              let mut checking = 100;
              let mut savings = 50;
              let ok = transfer(&mut checking, &mut savings, 30);
              assert_eq!(ok, true, "transfer 30 from 100 returns");
              assert_eq!(checking, 70, "checking after sending 30");
              assert_eq!(savings, 80, "savings after receiving 30");
          }

          #[test]
          fn refuses_when_there_is_not_enough() {
              let mut checking = 20;
              let mut savings = 0;
              let ok = transfer(&mut checking, &mut savings, 25);
              assert_eq!(ok, false, "transfer 25 from 20 returns");
              assert_eq!(checking, 20, "checking after a refused transfer");
              assert_eq!(savings, 0, "savings after a refused transfer");
          }

          #[test]
          fn can_send_everything() {
              let mut a = 40;
              let mut b = 2;
              assert_eq!(transfer(&mut a, &mut b, 40), true, "transfer 40 from 40 returns");
              assert_eq!((a, b), (0, 42), "(a, b) after the transfer");
          }

          #[test]
          fn transferring_zero_changes_nothing() {
              let mut a = 5;
              let mut b = 5;
              assert_eq!(transfer(&mut a, &mut b, 0), true, "transfer 0 returns");
              assert_eq!((a, b), (5, 5), "(a, b) after transferring 0");
          }
        hints:
          - "Check first: `if *from < amount { return false; }`"
          - "Then `*from -= amount;`, `*to += amount;` and end with `true`."
