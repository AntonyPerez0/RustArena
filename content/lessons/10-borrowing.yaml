          let badge = format!("[{}] {}", level, name);
          &badge
      }

      fn main() {
          let player = String::from("Ferris");
          let badge = make_badge(&player, 7);
          println!("{}", badge);
          println!("{} is still ours", player);
      }
    solution: |
      fn make_badge(name: &String, level: u32) -> String {
          let badge = format!("[{}] {}", level, name);
          badge
      }

      fn main() {
          let player = String::from("Ferris");
          let badge = make_badge(&player, 7);
          println!("{}", badge);
          println!("{} is still ours", player);
      }
    require:
      - pattern: '->\s*String'
        message: "Return the owned `String`, not a reference to it."
    hints:
      - "`badge` is created inside the function, so it's dropped at the end of it unless it's moved out."
      - "Change the return type to `String` and return `badge` itself (no `&`)."
