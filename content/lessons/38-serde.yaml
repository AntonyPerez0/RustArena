              todo!()
          }
        solution: |
          use serde_json::{json, Value};

          fn stats(scores: &[i64]) -> Value {
              json!({
                  "count": scores.len(),
                  "max": scores.iter().max(),
                  "min": scores.iter().min(),
              })
          }
        harness: |
          #[test]
          fn reports_count_max_and_min() {
              assert_eq!(stats(&[3, 9, -2]), json!({"count": 3, "max": 9, "min": -2}), "stats(&[3, 9, -2])");
          }

          #[test]
          fn empty_scores_give_nulls() {
              assert_eq!(stats(&[]), json!({"count": 0, "max": null, "min": null}), "stats(&[])");
          }

          #[test]
