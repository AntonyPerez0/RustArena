          let w: Webhook = serde_json::from_str(r#"{"eventId": "ev_3", "type": "charge", "amountCents": 1, "currency": "JPY"}"#).unwrap();
          assert_eq!(serde_json::to_string(&w).unwrap(), r#"{"eventId":"ev_3","type":"charge","amountCents":1,"currency":"JPY"}"#, "to_string(webhook without email)");
      }

      #[test]
