      - task: |
          A **round trip**: write `fn rename_sensor(json: &str, new_name: &str) -> Result<String, serde_json::Error>` that parses a sensor reading, changes its `sensor` field to `new_name`, and returns it serialized again as compact JSON. The struct needs both derives. Errors go back to the caller with `?`.
        seed: |
          struct Reading {
              sensor: String,
              celsius: f64,
          }

          fn rename_sensor(json: &str, new_name: &str) -> Result<String, serde_json::Error> {
              todo!()
          }
        solution: |
          use serde::{Deserialize, Serialize};

          #[derive(Serialize, Deserialize)]
          struct Reading {
              sensor: String,
              celsius: f64,
          }

          fn rename_sensor(json: &str, new_name: &str) -> Result<String, serde_json::Error> {
              let mut r: Reading = serde_json::from_str(json)?;
              r.sensor = new_name.to_string();
              serde_json::to_string(&r)
          }
