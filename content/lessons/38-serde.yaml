      - task: |
          Write a program that reads one JSON object from standard input and prints each top-level key with the kind of its value (`null`, `bool`, `number`, `string`, `array` or `object`), one per line as `key: kind`, in sorted key order. If the input isn't a JSON object, print `not an object`.
        seed: |
          use std::io::Read;

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
          }
        solution: |
          use serde_json::Value;
          use std::io::Read;

          fn kind(v: &Value) -> &'static str {
              match v {
                  Value::Null => "null",
                  Value::Bool(_) => "bool",
                  Value::Number(_) => "number",
                  Value::String(_) => "string",
                  Value::Array(_) => "array",
                  Value::Object(_) => "object",
              }
          }

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              match serde_json::from_str::<Value>(&input) {
                  Ok(Value::Object(map)) => {
                      for (key, value) in &map {
                          println!("{key}: {}", kind(value));
                      }
                  }
                  _ => println!("not an object"),
              }
          }
        tests:
          - stdin: '{"name": "arena", "port": 8080, "debug": false, "tags": ["a"], "owner": null, "db": {"url": "x"}}'
          - stdin: '[1, 2, 3]'
          - stdin: '{"zeta": "last", "alpha": 1.5}'
            hidden: true
          - stdin: '{"broken": '
            hidden: true
        hints:
          - "Match on the parse result directly: `Ok(Value::Object(map)) => ...`, `_ => println!(\"not an object\")`."
          - "Iterating `&map` gives `(key, value)` pairs in sorted key order."
          - "A helper `fn kind(v: &Value) -> &'static str` with one `match` arm per `Value` variant keeps `main` short."

  - title: Bad input, validation and other formats
    id: serde-6
    text: |
      At work, the JSON you parse comes from users, other teams and the internet. Three habits make that safe.

      ### 1. Report errors helpfully

      A `serde_json::Error` knows where it happened and what kind of problem it was:

      - `e.line()` and `e.column()`: the position in the input.
      - `e.is_syntax()`: not valid JSON at all (a stray character, a missing comma).
      - `e.is_eof()`: the input ended too early (truncated file, empty input).
      - `e.is_data()`: valid JSON, wrong shape for your type (missing field, wrong type, unknown variant).

      ```rust run
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct Job {
          name: String,
          retries: u8,
      }

      fn check(text: &str) {
          match serde_json::from_str::<Job>(text) {
              Ok(job) => println!("ok: {} x{}", job.name, job.retries),
              Err(e) if e.is_syntax() || e.is_eof() => {
                  println!("not JSON (line {}, column {})", e.line(), e.column())
              }
              Err(e) => println!("wrong shape: {e}"),
          }
      }

      fn main() {
          check(r#"{"name": "backup", "retries": 3}"#);
          check(r#"{"name": "backup" "retries": 3}"#);
          check(r#"{"name": "backup", "retries": 999}"#);
          check("");
      }
      ```

      ```output
      ok: backup x3
      not JSON (line 1, column 19)
      wrong shape: invalid value: integer `999`, expected u8 at line 1 column 33
      not JSON (line 1, column 0)
      ```

      ### 2. Validate after parsing

      serde checks the **shape**; your **business rules** (a port isn't 0, an email has an `@`, a date range doesn't run backwards) are your job. Two common patterns:

      - Parse into a struct, then check it in a function that returns `Result` (simple and explicit; the next exercise does this).
      - Make the type validate itself: `#[serde(try_from = "String")]` on a newtype tells serde to deserialize a `String` first and then call your `TryFrom<String>` impl. Invalid values never exist as your type at all.

      ```rust run
      use serde::Deserialize;

      #[derive(Deserialize)]
      #[serde(try_from = "String")]
      struct Email(String);

      impl TryFrom<String> for Email {
          type Error = String;
          fn try_from(s: String) -> Result<Self, Self::Error> {
              if s.contains('@') { Ok(Email(s)) } else { Err(format!("invalid email: {s}")) }
          }
      }

      #[derive(Deserialize)]
      struct Signup {
          email: Email,
      }

      fn main() {
          for text in [r#"{"email": "ana@arena.dev"}"#, r#"{"email": "ana"}"#] {
              match serde_json::from_str::<Signup>(text) {
                  Ok(s) => println!("welcome {}", s.email.0),
                  Err(e) => println!("rejected: {e}"),
              }
          }
      }
      ```

      ```output
      welcome ana@arena.dev
      rejected: invalid email: ana at line 1 column 16
      ```

      ### 3. Don't `unwrap` outside input

      Inside a function, propagate with `?` (next module: with context attached). In `main`, print a clear message and exit with a failure code (the CLI module). Never let a malformed request crash a server.

      ### Other formats: same derives

      Because the derives are format-independent, switching formats is a one-line change. With the `toml` crate (not available on this site, so shown only):

      ```rust
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct Config {
          name: String,
          port: u16,
      }

      fn load(text: &str) -> Result<Config, toml::de::Error> {
          toml::from_str(text) // text is: name = "arena"\nport = 8080
      }
      ```

      The same `Config` reads JSON with `serde_json::from_str`. Other format crates you'll meet: YAML (several crates exist; the original `serde_yaml` is no longer maintained, so check what your team uses), `csv` for spreadsheets, and binary formats like MessagePack (`rmp-serde`), `bincode` and `postcard` for compact messages between services and devices.

      **Your turn:** write a config loader. Read all of standard input and parse it into `Config { name: String, port: u16, workers: u32 }`. Print exactly one line:
      - not valid JSON (syntax error or input ending early): `syntax error at line L, column C`
      - valid JSON, wrong shape: `bad config: ` followed by serde's message
      - port `0`: `invalid: port must not be 0`
      - workers outside `1..=64`: `invalid: workers must be 1 to 64`
      - otherwise: `starting <name> on port <port> with <workers> workers`
    seed: |
      use serde::Deserialize;
      use std::io::Read;

      #[derive(Deserialize)]
      struct Config {
          name: String,
          port: u16,
          workers: u32,
      }

      fn main() {
          let mut input = String::new();
          std::io::stdin().read_to_string(&mut input).unwrap();
          let cfg: Config = serde_json::from_str(&input).unwrap();
          println!("starting {} on port {} with {} workers", cfg.name, cfg.port, cfg.workers);
      }
    solution: |
      use serde::Deserialize;
      use std::io::Read;

      #[derive(Deserialize)]
      struct Config {
          name: String,
          port: u16,
          workers: u32,
      }

      fn validate(cfg: &Config) -> Result<(), &'static str> {
          if cfg.port == 0 {
              return Err("port must not be 0");
          }
          if !(1..=64).contains(&cfg.workers) {
              return Err("workers must be 1 to 64");
          }
          Ok(())
      }

      fn main() {
          let mut input = String::new();
          std::io::stdin().read_to_string(&mut input).unwrap();
          let cfg: Config = match serde_json::from_str(&input) {
              Ok(cfg) => cfg,
              Err(e) if e.is_syntax() || e.is_eof() => {
                  println!("syntax error at line {}, column {}", e.line(), e.column());
                  return;
              }
              Err(e) => {
                  println!("bad config: {e}");
                  return;
              }
          };
          match validate(&cfg) {
              Ok(()) => println!("starting {} on port {} with {} workers", cfg.name, cfg.port, cfg.workers),
              Err(msg) => println!("invalid: {msg}"),
          }
      }
    forbid:
      - pattern: 'from_str[^;]*\)\s*\.\s*unwrap\(\)'
        message: "Don't unwrap the parse result: input from outside must not crash the program."
    tests:
      - stdin: '{"name": "api", "port": 8080, "workers": 4}'
      - stdin: '{"name": "api", "port": 8080 "workers": 4}'
      - stdin: '{"name": "api", "port": 70000, "workers": 4}'
      - stdin: '{"name": "api", "port": 0, "workers": 4}'
      - stdin: '{"name": "api", "port": 80, "workers": 0}'
        hidden: true
      - stdin: '{"name": "api", "port": 80, "workers": 65}'
        hidden: true
      - stdin: |
          {
            "name": "worker",
            "port": 9000,
        hidden: true
      - stdin: '{"name": "api", "workers": 2}'
        hidden: true
      - stdin: '{"name": "edge", "port": 443, "workers": 64}'
        hidden: true
    hints:
      - "`match serde_json::from_str::<Config>(&input)` with three arms: `Ok(cfg)`, `Err(e) if e.is_syntax() || e.is_eof()`, and `Err(e)`."
      - "Check the rules after parsing: `cfg.port == 0`, then `!(1..=64).contains(&cfg.workers)`."
      - "In the error arms, print and `return;` so the rest of `main` only runs with a valid config."
    more:
      - task: |
          Make the type validate itself. Complete `Username` so that serde reads a `String` and then calls `TryFrom<String>`: a username must be 3 to 16 characters long (count `chars()`) and contain only ASCII letters, digits and `_`. The error messages are `username too short`, `username too long` and `username has invalid characters`. `Account` must then reject bad usernames while parsing.
        seed: |
          use serde::Deserialize;

          #[derive(Debug, Deserialize)]
          struct Username(String);

          #[derive(Debug, Deserialize)]
          struct Account {
              username: Username,
              level: u8,
          }
        solution: |
          use serde::Deserialize;

          #[derive(Debug, Deserialize)]
          #[serde(try_from = "String")]
          struct Username(String);

          impl TryFrom<String> for Username {
              type Error = String;
              fn try_from(s: String) -> Result<Self, Self::Error> {
                  let n = s.chars().count();
                  if n < 3 {
                      return Err(String::from("username too short"));
                  }
                  if n > 16 {
                      return Err(String::from("username too long"));
                  }
                  if !s.chars().all(|c| c.is_ascii_alphanumeric() || c == '_') {
                      return Err(String::from("username has invalid characters"));
                  }
                  Ok(Username(s))
              }
          }

          #[derive(Debug, Deserialize)]
          struct Account {
              username: Username,
              level: u8,
          }
        harness: |
          fn parse(json: &str) -> Result<Account, String> {
              serde_json::from_str::<Account>(json).map_err(|e| e.to_string())
          }

          #[test]
          fn accepts_a_good_username() {
              let a = parse(r#"{"username": "ferris_99", "level": 3}"#).unwrap();
              assert_eq!((a.username.0.as_str(), a.level), ("ferris_99", 3), "parse(ferris_99)");
          }

          #[test]
          fn rejects_short_names() {
              let e = parse(r#"{"username": "fe", "level": 1}"#).unwrap_err();
              assert!(e.starts_with("username too short"), "error was: {e}");
          }

          #[test]
          fn rejects_long_names() {
              let e = parse(r#"{"username": "abcdefghijklmnopq", "level": 1}"#).unwrap_err();
              assert!(e.starts_with("username too long"), "error was: {e}");
          }

          #[test]
          fn rejects_spaces_and_symbols() {
              let e = parse(r#"{"username": "bad name!", "level": 1}"#).unwrap_err();
              assert!(e.starts_with("username has invalid characters"), "error was: {e}");
          }

          #[test]
          fn try_from_works_on_its_own() {
              assert!(Username::try_from(String::from("crab")).is_ok(), "Username::try_from(\"crab\")");
              assert!(Username::try_from(String::from("cräb")).is_err(), "Username::try_from(\"cräb\") (not ASCII)");
          }
        hints:
          - "Add `#[serde(try_from = \"String\")]` under the derive on `Username`."
          - "`impl TryFrom<String> for Username { type Error = String; fn try_from(s: String) -> Result<Self, Self::Error> { ... } }`"
          - "`s.chars().all(|c| c.is_ascii_alphanumeric() || c == '_')` checks the characters."
      - task: |
          Orders arrive as JSON Lines on standard input, one `{"id": 7, "cents": 1250}` per line. Parse each non-empty line into the starter's `Order` (only `cents` is required; a missing `id` is fine). For every line that fails, print `line N: <serde message>` (N counts from 1, including empty lines). At the end print `total: X.YZ` (the sum of the valid orders' cents, in dollars with two decimals) and `valid: V of T` (T counts non-empty lines).
        seed: |
          use serde::Deserialize;
          use std::io::Read;

          #[derive(Deserialize)]
          struct Order {
              cents: u64,
          }

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
          }
        solution: |
          use serde::Deserialize;
          use std::io::Read;

          #[derive(Deserialize)]
          struct Order {
              cents: u64,
          }

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let mut total = 0;
              let mut valid = 0;
              let mut seen = 0;
              for (i, line) in input.lines().enumerate() {
                  if line.trim().is_empty() {
                      continue;
                  }
                  seen += 1;
                  match serde_json::from_str::<Order>(line) {
                      Ok(order) => {
                          total += order.cents;
                          valid += 1;
                      }
                      Err(e) => println!("line {}: {e}", i + 1),
                  }
              }
              println!("total: {:.2}", total as f64 / 100.0);
              println!("valid: {valid} of {seen}");
          }
        tests:
          - stdin: |
              {"id": 1, "cents": 1250}
              {"id": 2, "cents": "free"}

              {"id": 3, "cents": 99}
              {"id": 4,
          - stdin: |
              {"id": 10, "cents": 5}
              {"id": 11, "cents": -5}
              {"cents": 100000}
            hidden: true
          - stdin: ""
            hidden: true
        hints:
          - "`input.lines().enumerate()` gives `(index, line)`; the line number is `index + 1`."
          - "Skip lines where `line.trim().is_empty()`; count the others."
          - "Print serde's error with `{e}`: it already says what and where."
