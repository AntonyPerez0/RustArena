          }

          #[test]
          fn output_is_compact_and_in_field_order() {
              assert_eq!(rename_sensor(r#"{ "celsius": -4.0, "sensor": "x" }"#, "porch").unwrap(), r#"{"sensor":"porch","celsius":-4.0}"#, "rename_sensor(fields in other order)");
          }

          #[test]
          fn invalid_input_is_an_error() {
              assert!(rename_sensor("not json", "x").is_err(), "rename_sensor(\"not json\") should be Err");
          }
