          let w: Webhook = serde_json::from_str(r#"{"eventId": "e", "type": "t", "amountCents": 2, "customerEmail": "x@y.z"}"#).unwrap();
          assert_eq!(serde_json::to_string(&w).unwrap(), r#"{"eventId":"e","type":"t","amountCents":2,"currency":"USD","customerEmail":"x@y.z"}"#, "to_string(webhook with email)");
      }
