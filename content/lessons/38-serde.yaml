      - task: |
          Logs are often written as **JSON Lines**: one compact JSON object per line, so tools can process them line by line. Derive what `Event` needs and write `fn to_json_lines(events: &[Event]) -> String` that serializes each event with `serde_json::to_string` and joins them with `\n` (no newline after the last one; an empty slice gives an empty string).
        seed: |
          use serde::Serialize;

          struct Event {
              level: String,
              message: String,
              code: u16,
          }

          fn to_json_lines(events: &[Event]) -> String {
              todo!()
          }
        solution: |
          use serde::Serialize;

          #[derive(Serialize)]
          struct Event {
              level: String,
              message: String,
              code: u16,
          }

          fn to_json_lines(events: &[Event]) -> String {
              events
                  .iter()
                  .map(|e| serde_json::to_string(e).expect("events always serialize"))
                  .collect::<Vec<_>>()
                  .join("\n")
          }
        harness: |
          fn ev(level: &str, message: &str, code: u16) -> Event {
              Event { level: level.to_string(), message: message.to_string(), code }
          }

          #[test]
          fn one_event_is_one_compact_line() {
              assert_eq!(to_json_lines(&[ev("info", "started", 0)]), r#"{"level":"info","message":"started","code":0}"#, "to_json_lines(one event)");
          }

          #[test]
          fn events_are_joined_with_newlines() {
              let out = to_json_lines(&[ev("info", "up", 0), ev("error", "disk full", 507)]);
              assert_eq!(out, "{\"level\":\"info\",\"message\":\"up\",\"code\":0}\n{\"level\":\"error\",\"message\":\"disk full\",\"code\":507}", "to_json_lines(two events)");
          }

          #[test]
          fn quotes_in_messages_are_escaped() {
              assert_eq!(to_json_lines(&[ev("warn", "say \"hi\"", 1)]), r#"{"level":"warn","message":"say \"hi\"","code":1}"#, "to_json_lines(message with quotes)");
          }

          #[test]
          fn no_events_gives_an_empty_string() {
              assert_eq!(to_json_lines(&[]), "", "to_json_lines(&[])");
          }
        hints:
          - "Add `#[derive(Serialize)]` to `Event`."
          - "`events.iter().map(|e| serde_json::to_string(e).unwrap())` gives one String per event."
          - "Collect into a `Vec<String>` and call `.join(\"\\n\")`."

  - title: From JSON back into structs
    id: serde-2
    text: |
      The other direction is **deserialization**: you derive `Deserialize` and ask `serde_json::from_str` for a value of your type.

      ```rust run
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct Reading {
          sensor: String,
          celsius: f64,
      }

      fn main() {
          let text = r#"{"sensor": "greenhouse", "celsius": 21.5, "battery": 87}"#;
          let r: Reading = serde_json::from_str(text).unwrap();
          println!("{} reads {:.1} C", r.sensor, r.celsius);
      }
      ```

      ```output
      greenhouse reads 21.5 C
      ```

      Piece by piece:

      - `r#"..."#` is a **raw string literal**: backslashes and double quotes inside it are taken literally, so JSON can be pasted in without escaping every `"`. (The number of `#` can grow if the text itself contains `"#`.)
      - `from_str` is generic: it can produce any type that implements `Deserialize`, so you must say which one. Here the annotation `let r: Reading` does it; the turbofish `serde_json::from_str::<Reading>(text)` works too.
      - It returns `Result<Reading, serde_json::Error>`, because input from outside can be anything.
      - The JSON has a `battery` field that `Reading` doesn't. **Unknown fields are ignored** by default, which makes your program robust when an API adds fields later.
      - Use owned types like `String` in structs you deserialize. (Borrowing `&str` fields from the input is possible but needs lifetimes and fails on strings with escapes; reach for it only when profiling says so.)

      ### What can go wrong

      serde checks the shape of the data against your type: every field present, every value the right type and in range. Anything else is an `Err` whose message says what and where:

      ```rust run
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct Reading {
          sensor: String,
          celsius: f64,
      }

      fn main() {
          let inputs = [
              r#"{"sensor": "attic", "celsius": 30}"#,
              r#"{"sensor": "attic"}"#,
              r#"{"sensor": "attic", "celsius": "hot"}"#,
              r#"{"sensor": "attic", "celsius": 30"#,
          ];
          for text in inputs {
              match serde_json::from_str::<Reading>(text) {
                  Ok(r) => println!("ok: {} = {}", r.sensor, r.celsius),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
      ```

      ```output
      ok: attic = 30
      error: missing field `celsius` at line 1 column 19
      error: invalid type: string "hot", expected f64 at line 1 column 36
      error: EOF while parsing an object at line 1 column 33
      ```

      A JSON integer like `30` is fine for an `f64` field. The reverse isn't: `2.5` for a `u32` is an error, and so is `-3` for a `u32` or `300` for a `u8`. Your Rust types are the validation: pick them carefully.

      ### Common mistakes

      - **No type for `from_str`.** `let r = serde_json::from_str(text).unwrap();` with nothing telling Rust the target type fails with `error[E0282]: type annotations needed`.
      - **Unwrapping input you don't control.** `from_str(...).unwrap()` on data from a user, a file or the network turns a typo into a crash. Return the error with `?` or handle it with `match`.
      - **Deriving `Deserialize` but not `Serialize`** and then calling `to_string`: they're separate traits. Derive both when you need both directions: `#[derive(Serialize, Deserialize)]`.

      **Your turn:** a shop sends carts as JSON like `{"items": [{"name": "mug", "price": 2.5, "qty": 2}]}`. Derive what's needed and write `fn cart_total(json: &str) -> Result<f64, serde_json::Error>` that parses the cart and returns the sum of `price * qty` over all items. Invalid JSON must give an `Err` (use `?`).
    seed: |
      use serde::Deserialize;

      struct Line {
          price: f64,
          qty: u32,
      }

      struct Cart {
          items: Vec<Line>,
      }

      fn cart_total(json: &str) -> Result<f64, serde_json::Error> {
          todo!()
      }
    solution: |
      use serde::Deserialize;

      #[derive(Deserialize)]
      struct Line {
          price: f64,
          qty: u32,
      }

      #[derive(Deserialize)]
      struct Cart {
          items: Vec<Line>,
      }

      fn cart_total(json: &str) -> Result<f64, serde_json::Error> {
          let cart: Cart = serde_json::from_str(json)?;
          Ok(cart.items.iter().map(|l| l.price * l.qty as f64).sum())
      }
    harness: |
      #[test]
      fn adds_price_times_quantity() {
          let json = r#"{"items": [{"name": "mug", "price": 2.5, "qty": 2}, {"name": "tea", "price": 1.25, "qty": 4}]}"#;
          assert_eq!(cart_total(json).unwrap(), 10.0, "cart_total(mug x2 + tea x4)");
      }

      #[test]
      fn an_empty_cart_costs_nothing() {
          assert_eq!(cart_total(r#"{"items": []}"#).unwrap(), 0.0, "cart_total(no items)");
      }

      #[test]
      fn extra_fields_are_ignored() {
          let json = r#"{"items": [{"price": 3.0, "qty": 3, "color": "red"}], "coupon": null}"#;
          assert_eq!(cart_total(json).unwrap(), 9.0, "cart_total(with extra fields)");
      }

      #[test]
      fn broken_json_is_an_error() {
          assert!(cart_total(r#"{"items": [}"#).is_err(), "cart_total(broken JSON) should be Err");
      }

      #[test]
      fn a_missing_price_is_an_error() {
          assert!(cart_total(r#"{"items": [{"qty": 1}]}"#).is_err(), "cart_total(item without price) should be Err");
      }
    hints:
      - "Both `Line` and `Cart` need `#[derive(Deserialize)]`."
      - "`let cart: Cart = serde_json::from_str(json)?;` parses or returns the error."
      - "`Ok(cart.items.iter().map(|l| l.price * l.qty as f64).sum())`"
