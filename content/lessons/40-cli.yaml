        stdin: "INFO boot\nERROR disk full\nINFO ok\nERROR timeout\n"
      - args: ["-n", "crab", "notes.txt"]
        files: { "notes.txt": "the crab\nthe fish\ncrabs everywhere\n" }
      - args: ["-i", "warn", "-"]
        stdin: "WARN low disk\nwarning: hot\ninfo\n"
      - args: ["lobster"]
        stdin: "crab\nfish\n"
        exit: 1
        allowEmpty: true
      - args: ["x", "missing.txt"]
        exit: 2
        allowEmpty: true
        hidden: true
      - args: []
        exit: 2
        allowEmpty: true
        hidden: true
      - args: ["-n", "-i", "ÉTÉ", "fr.txt"]
        files: { "fr.txt": "printemps\nl'été dernier\nautomne\n" }
        hidden: true
      - args: ["-z", "x"]
        exit: 2
        allowEmpty: true
        hidden: true
    hints:
      - "Collect flags into booleans and everything else into a `positional` Vec; then `match positional.as_slice()` on `[pattern]` and `[pattern, path]`."
      - "Reuse the `open(path: Option<&str>) -> io::Result<Box<dyn BufRead>>` function from the example to get one reader for both cases."
      - "For `-i`, lowercase both the pattern and each line before `contains`. Track whether anything matched to choose the exit code."
