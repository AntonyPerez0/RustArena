          fn mark_done(contents: &str, n: usize) -> Result<String, String> {
              let mut lines: Vec<String> = contents.lines().map(String::from).collect();
              let line = n
                  .checked_sub(1)
                  .and_then(|i| lines.get_mut(i))
                  .ok_or(format!("no task {n}"))?;
              if let Some(rest) = line.strip_prefix("[ ] ") {
