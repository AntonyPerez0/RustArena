          use std::io::Read;
          use std::process::ExitCode;

          fn main() -> ExitCode {
              ExitCode::SUCCESS
          }
        solution: |
          use std::io::Read;
          use std::process::ExitCode;

          fn main() -> ExitCode {
              let args: Vec<String> = std::env::args().skip(1).collect();
              let count = args.iter().any(|a| a == "-c");
              let file = args.iter().find(|a| *a != "-c");
              let read = match file {
                  Some(path) => std::fs::read_to_string(path),
                  None => {
                      let mut s = String::new();
                      std::io::stdin().read_to_string(&mut s).map(|_| s)
                  }
              };
              let text = match read {
                  Ok(t) => t,
                  Err(e) => {
                      eprintln!("uniq: {}: {e}", file.map_or("-", |f| f.as_str()));
                      return ExitCode::FAILURE;
                  }
              };
              let mut groups: Vec<(&str, usize)> = Vec::new();
              for line in text.lines() {
                  match groups.last_mut() {
                      Some((last, n)) if *last == line => *n += 1,
                      _ => groups.push((line, 1)),
                  }
              }
              for (line, n) in groups {
                  if count {
                      println!("{n} {line}");
                  } else {
                      println!("{line}");
                  }
              }
              ExitCode::SUCCESS
          }
        tests:
          - stdin: "a\na\nb\na\na\na\n"
          - args: ["-c"]
            stdin: "ERROR\nERROR\nINFO\nERROR\n"
          - args: ["-c", "log.txt"]
            files: { "log.txt": "x\nx\nx\ny\n" }
            hidden: true
          - args: ["log.txt"]
            files: { "log.txt": "same\nsame\n" }
            hidden: true
          - args: ["-c", "nope.txt"]
            exit: 1
            allowEmpty: true
            hidden: true
        hints:
          - "Read all the text first (file or stdin), then walk the lines keeping a list of `(line, count)` groups."
          - "`groups.last_mut()` lets you bump the count when the line equals the previous one."
      - task: |
          Keep logic away from I/O: write `fn search<'a>(text: &'a str, pattern: &str, ignore_case: bool) -> Vec<(usize, &'a str)>` that returns the matching lines with their 1-based line numbers. With `ignore_case`, compare `to_lowercase()` versions (which also handles non-ASCII letters like `É`).
        seed: |
          fn search<'a>(text: &'a str, pattern: &str, ignore_case: bool) -> Vec<(usize, &'a str)> {
              todo!()
          }
        solution: |
          fn search<'a>(text: &'a str, pattern: &str, ignore_case: bool) -> Vec<(usize, &'a str)> {
              let needle = if ignore_case { pattern.to_lowercase() } else { pattern.to_string() };
              text.lines()
                  .enumerate()
                  .filter(|(_, line)| {
                      if ignore_case {
                          line.to_lowercase().contains(&needle)
                      } else {
                          line.contains(&needle)
                      }
                  })
                  .map(|(i, line)| (i + 1, line))
                  .collect()
          }
        harness: |
          #[test]
          fn finds_matching_lines_with_numbers() {
              assert_eq!(search("a crab\nno\nmore crabs", "crab", false), vec![(1, "a crab"), (3, "more crabs")], "search(.., \"crab\", false)");
          }

          #[test]
          fn is_case_sensitive_by_default() {
              assert_eq!(search("Crab\ncrab", "crab", false), vec![(2, "crab")], "search(\"Crab\\ncrab\", \"crab\", false)");
          }

          #[test]
          fn ignore_case_matches_any_case() {
              assert_eq!(search("Crab\ncrab\nCRAB!", "cRaB", true), vec![(1, "Crab"), (2, "crab"), (3, "CRAB!")], "search(.., \"cRaB\", true)");
          }

          #[test]
          fn ignore_case_handles_unicode() {
              assert_eq!(search("ÉTÉ\nhiver", "été", true), vec![(1, "ÉTÉ")], "search(\"ÉTÉ\\nhiver\", \"été\", true)");
          }

          #[test]
          fn no_match_gives_an_empty_list() {
              assert_eq!(search("", "x", false), vec![], "search(\"\", \"x\", false)");
          }
        hints:
          - "`text.lines().enumerate()` gives `(index, line)`; the line number is `index + 1`."
          - "Lowercase the pattern once before the loop, and each line inside the filter when `ignore_case` is true."

  - title: "Putting it together: Config, run() and clap"
    id: cli-6
    text: |
      Every well-built Rust CLI ends up with the same shape:

      ```rust
      fn main() -> ExitCode {
          let args: Vec<String> = std::env::args().skip(1).collect();
          let command = match parse_args(&args) {      // 1. arguments -> a typed Config/Command
              Ok(c) => c,
              Err(msg) => {
                  eprintln!("{msg}\n{USAGE}");
                  return ExitCode::from(2);            //    usage errors: exit 2
              }
          };
          match run(command) {                         // 2. do the work, returning Result
              Ok(()) => ExitCode::SUCCESS,
              Err(e) => {
                  eprintln!("error: {e}");             // 3. report on stderr
                  ExitCode::FAILURE                    //    failures: exit 1
              }
          }
      }
      ```

      - **Parsing** turns strings into a typed value (a `Config` struct, or an enum with one variant per subcommand). After this point, nothing looks at raw arguments.
      - **`run`** does the work and returns `Result`, so it can use `?` everywhere (with anyhow and context from the last module, in a real project).
      - **`main`** is the only place that knows about exit codes and the usage text.
      - The decisions inside `run` live in small functions over `&str` and plain values, which unit tests can call directly.

      ### clap: what teams use for real

      Hand-written parsing is fine for small tools. For anything bigger, teams use the **clap** crate. You describe the arguments as a struct, and `#[derive(Parser)]` generates the parser, `--help`, `--version`, clear error messages (including suggestions for misspelled flags), and exit code 2 for usage errors. clap isn't available on this site, so here's what it looks like (not compiled):

      ```toml
      [dependencies]
      clap = { version = "4", features = ["derive"] }
      ```

      ```rust
      use clap::{Parser, Subcommand};

      /// A tiny todo list
      #[derive(Parser)]
      #[command(version)]
      struct Cli {
          /// File that stores the tasks
          #[arg(short, long, default_value = "todo.txt")]
          file: String,

          #[command(subcommand)]
          command: Command,
      }

      #[derive(Subcommand)]
      enum Command {
          /// Show all tasks
          List,
          /// Add a task
          Add { text: Vec<String> },
          /// Mark task N as done
          Done { n: usize },
      }

      fn main() {
          let cli = Cli::parse(); // on bad arguments: prints the error and exits with 2
          match cli.command {
              Command::List => { /* ... */ }
              Command::Add { text } => { /* ... */ }
              Command::Done { n } => { /* ... */ }
          }
      }
      ```

      The `///` doc comments become the help text:

      ```text
      $ todo --help
      A tiny todo list

      Usage: todo [OPTIONS] <COMMAND>

      Commands:
        list  Show all tasks
        add   Add a task
        done  Mark task N as done
        help  Print this message or the help of the given subcommand(s)

      Options:
        -f, --file <FILE>  File that stores the tasks [default: todo.txt]
        -h, --help         Print help
        -V, --version      Print version
      ```

      Notice it's the same design as this module's: a typed struct, an enum of subcommands, `match` in `main`. The **Pro Track** builds a complete CLI with clap, anyhow and integration tests; everything you practiced here carries over directly.

      ### Common mistakes

      - **Business logic in `main`.** It can't be unit-tested and mixes concerns. Move it to functions.
      - **`process::exit` deep in helper functions**: the code becomes impossible to test and skips cleanup. Return errors; let `main` decide.
      - **A usage message that doesn't say what's wrong.** Print the specific problem first (`unknown command "lst"`), then the usage.

      **Your turn:** build `todo`, a todo list stored in `todo.txt`, one task per line written as `[ ] text` or `[x] text` (done). Commands:
      - `list`: print each task as `1. [ ] buy milk`; if there are none (or the file doesn't exist yet), print `no tasks`.
      - `add <words>...`: append `[ ] <words joined by spaces>` to the file and print `added 3: buy milk` (3 is the new task's number).
      - `done <n>`: mark task n as done, write the file back, and print `done 2: feed the crab`. If there's no task n (that includes `0`), print `error: no task 7` to stderr and exit 1.
      - No command, an unknown command, `add` without words or `done` without a valid number: print `usage: todo list | add <text> | done <n>` to stderr and exit 2.
