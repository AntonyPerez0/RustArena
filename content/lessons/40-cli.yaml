id: cli
title: Building Command-Line Tools
phase: "Rust at work"
summary: Write real command-line programs. Arguments and flags, exit codes and stderr, reading files and standard input, and the Config/run structure every Rust CLI uses, plus how clap does the parsing for you.
roadmap: [CLI Utilities, clap, std::env]
steps:
  - title: Command-line arguments
    id: cli-1
    text: |
      Rust is a favorite for command-line tools (`ripgrep`, `fd`, `bat`, `uv` and Cargo itself are written in it): they start instantly, ship as one file, and don't crash on odd input. A command-line tool gets its instructions as **arguments**: the words typed after its name.

      ```text
      $ grep -n error app.log
             ^^^^^^^^^^^^^^^^^  three arguments: "-n", "error", "app.log"
      ```

      The shell splits the line into words (quotes keep spaces together: `"big world"` is one argument) and the program receives them as a list of strings. In Rust that list comes from `std::env::args()`:

      ```rust run
      use std::env;

      fn main() {
          let args: Vec<String> = env::args().skip(1).collect();
          println!("got {} arguments", args.len());
          for (i, arg) in args.iter().enumerate() {
              println!("{i}: {arg}");
          }
      }
      ```

      ```output
      got 0 arguments
      ```

      The example above ran without arguments. With Cargo, everything after `--` goes to your program (before it, the arguments are for Cargo itself):

      ```text
      $ cargo run -- hello "big world" 42
      got 3 arguments
      0: hello
      1: big world
      2: 42
      ```

      Piece by piece:

      - `env::args()` returns an **iterator** of `String`s. The **first item is the program's own path** (like `target/debug/greet`), which is why we `skip(1)`.
      - `collect()` gathers the rest into a `Vec<String>` you can index, count and pass around.
      - Arguments are always text. `"42"` is a `String`; to use it as a number you `parse` it, and handle the error when it isn't one.
      - `env::args()` panics if an argument isn't valid Unicode (rare; possible with odd file names on Linux). Tools that must accept any file name use `env::args_os()`, which yields `OsString`s.

      ### Common mistakes

      **Indexing without checking.** `args[1]` panics when the user gave no arguments, the most common way a CLI crashes:

      ```rust panics
      fn main() {
          let args: Vec<String> = std::env::args().collect();
          let name = &args[1];
          println!("Hello, {name}!");
      }
      ```

      ```text
      thread 'main' (4242) panicked at src/main.rs:3:21:
      index out of bounds: the len is 1 but the index is 1
      ```

      Ask for an `Option` instead and handle the `None`, usually by printing a **usage** line that shows how to call the tool:

      ```rust run
      fn main() {
          match std::env::args().nth(1) {
              Some(name) => println!("Hello, {name}!"),
              None => println!("usage: greet <name>"),
          }
      }
      ```

      ```output
      usage: greet <name>
      ```

      - **Forgetting `skip(1)`**: the program's path shows up as the first "real" argument.
      - **Printing `args[0]`** in messages: it's a full path that differs between machines. Write the tool's name yourself (`usage: greet ...`).

      **Your turn:** write `greet`: print `Hello, <name>!` for every argument, one per line. With no arguments, print `usage: greet <name>...`. (On this site the tests run your program with different arguments.)
    seed: |
      use std::env;

      fn main() {
          let args: Vec<String> = env::args().collect();
      }
    solution: |
      use std::env;

      fn main() {
          let args: Vec<String> = env::args().skip(1).collect();
          if args.is_empty() {
              println!("usage: greet <name>...");
          }
          for name in &args {
              println!("Hello, {name}!");
          }
      }
    tests:
      - args: ["Ferris"]
      - args: ["Ana", "Bo"]
      - args: []
      - args: ["Mary Jane", "Li"]
        hidden: true
    hints:
      - "`env::args().skip(1).collect()` leaves out the program's own path."
      - "Check `args.is_empty()` for the usage line, then loop over `&args`."
    more:
      - task: |
          Write `args`: print every argument with its position, starting at 1, as `1: first`. Then print a final line `total: N`. With no arguments it just prints `total: 0`.
        seed: |
          fn main() {
          }
        solution: |
          fn main() {
              let args: Vec<String> = std::env::args().skip(1).collect();
              for (i, arg) in args.iter().enumerate() {
                  println!("{}: {arg}", i + 1);
              }
              println!("total: {}", args.len());
          }
        tests:
          - args: ["build", "--release"]
          - args: []
          - args: ["a b", "", "c"]
            hidden: true
        hints:
          - "`enumerate()` counts from 0, so print `i + 1`."
      - task: |
          Write `stats`: every argument is a number (`f64`). Print `count: N`, then `min: X` and `max: Y` (min and max with two decimals). Arguments that aren't numbers are skipped, with a line `skipping "x"` printed for each (in order, before the results). If no numbers are left, print `no numbers` instead of the three result lines.
        seed: |
          fn main() {
          }
        solution: |
          fn main() {
              let mut numbers = Vec::new();
              for arg in std::env::args().skip(1) {
                  match arg.parse::<f64>() {
                      Ok(n) => numbers.push(n),
                      Err(_) => println!("skipping {arg:?}"),
                  }
              }
              if numbers.is_empty() {
                  println!("no numbers");
                  return;
              }
              let min = numbers.iter().copied().fold(f64::INFINITY, f64::min);
              let max = numbers.iter().copied().fold(f64::NEG_INFINITY, f64::max);
              println!("count: {}", numbers.len());
              println!("min: {min:.2}");
              println!("max: {max:.2}");
          }
        tests:
          - args: ["3", "-1.5", "10"]
          - args: ["4", "four", "2"]
          - args: ["x"]
          - args: []
            hidden: true
          - args: ["7"]
            hidden: true
        hints:
          - "Loop over `std::env::args().skip(1)` and `match arg.parse::<f64>()`."
          - "Floats aren't `Ord`, so `max()` doesn't work on them. `fold(f64::NEG_INFINITY, f64::max)` does."

  - title: Flags and options
    id: cli-2
    text: |
      Real tools take three kinds of arguments:

      - **Positional arguments**: meaning comes from position, like the pattern and file in `grep error app.log`.
      - **Flags**: on/off switches, a short form `-i` and a long form `--ignore-case`.
      - **Options**: a name followed by a value, like `--max 5` or `-m 5`.

      The standard way to parse them by hand is a loop over an iterator, with `match` on each argument. Taking a **slice of strings** instead of reading `env::args()` inside the function makes the parser easy to test, so `main` just does `let args: Vec<String> = env::args().skip(1).collect();` and passes `&args`:

      ```rust run
      struct Config {
          pattern: String,
          files: Vec<String>,
          ignore_case: bool,
          max: Option<usize>,
      }

      fn parse_args(args: &[String]) -> Result<Config, String> {
          let mut pattern = None;
          let mut files = Vec::new();
          let mut ignore_case = false;
          let mut max = None;
          let mut iter = args.iter();
          while let Some(arg) = iter.next() {
              match arg.as_str() {
                  "-i" | "--ignore-case" => ignore_case = true,
                  "-m" | "--max" => {
                      let value = iter.next().ok_or("missing value for --max")?;
                      let n = value.parse().map_err(|_| format!("invalid number for --max: {value}"))?;
                      max = Some(n);
                  }
                  flag if flag.starts_with('-') => return Err(format!("unknown flag: {flag}")),
                  _ if pattern.is_none() => pattern = Some(arg.clone()),
                  _ => files.push(arg.clone()),
              }
          }
          let pattern = pattern.ok_or("missing pattern")?;
          Ok(Config { pattern, files, ignore_case, max })
      }

      fn main() {
          let tries = [
              vec!["-i", "error", "app.log"],
              vec!["--max", "2", "warn", "a.log", "b.log"],
              vec!["error", "-x"],
              vec!["-m"],
          ];
          for t in tries {
              let args: Vec<String> = t.iter().map(|s| s.to_string()).collect();
              match parse_args(&args) {
                  Ok(c) => println!("pattern={} files={:?} ignore_case={} max={:?}", c.pattern, c.files, c.ignore_case, c.max),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
      ```

      ```output
      pattern=error files=["app.log"] ignore_case=true max=None
      pattern=warn files=["a.log", "b.log"] ignore_case=false max=Some(2)
      error: unknown flag: -x
      error: missing value for --max
      ```

      Piece by piece:

      - `while let Some(arg) = iter.next()` instead of `for`: an option needs to **take the next argument** as its value, which `iter.next()` inside the loop does.
      - `match arg.as_str()` matches a `String` against string literals; `|` gives the short and long forms the same arm.
      - `ok_or("...")` turns the `None` of a missing value into an error, and `?` returns it. A `&str` error converts into the `String` error type automatically.
      - The guard `flag if flag.starts_with('-')` catches unknown flags, so a typo like `--ignore-cse` is reported instead of being treated as a file name.
      - All the results land in a **Config struct**. The rest of the program reads the config, never the raw arguments.

      ### Conventions users expect

      - `-h`/`--help` prints help; `-V`/`--version` prints the version.
      - `--` means "end of options": everything after it is positional, so you can search for a pattern that starts with `-`.
      - `-` as a file name means standard input (step 5).
      - Order usually doesn't matter: `grep -i error` and `grep error -i` both work (ours does too).

      In real projects the **clap** crate handles all of this and generates `--help` for you (last step). Writing a parser once by hand shows you what clap does and helps when you write small tools without dependencies.

      ### Common mistakes

      - **Using a `for` loop** and then calling `iter.next()` inside it: `for arg in iter` moves the iterator into the loop (`borrow of moved value: iter`), and `for arg in &mut iter` borrows it mutably for the whole loop, so a second `iter.next()` is refused. Use `while let`.
      - **Not rejecting unknown flags**: they silently become positional arguments, and the user's typo becomes "file not found: --verbos".
      - **Parsing in `main` with `env::args()` directly**: then you can only test it by running the program. A function taking `&[String]` can be tested with plain vectors.

      **Your turn:** write `parse_args` for a log-search tool. Flags: `-i`/`--ignore-case`, `-n`/`--line-numbers`, and the option `-m N`/`--max N`. The first positional argument is the pattern, the optional second one is the file; a third positional is an error. Errors (exact text): `missing pattern`, `unexpected argument: <arg>`, `unknown flag: <flag>`, `missing value for --max`, `invalid number for --max: <value>`.
    seed: |
      #[derive(Debug, PartialEq)]
      struct Config {
          pattern: String,
          file: Option<String>,
          ignore_case: bool,
          line_numbers: bool,
          max: Option<usize>,
      }

      fn parse_args(args: &[String]) -> Result<Config, String> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct Config {
          pattern: String,
          file: Option<String>,
          ignore_case: bool,
          line_numbers: bool,
          max: Option<usize>,
      }

      fn parse_args(args: &[String]) -> Result<Config, String> {
          let mut pattern = None;
          let mut file = None;
          let mut ignore_case = false;
          let mut line_numbers = false;
          let mut max = None;
          let mut iter = args.iter();
          while let Some(arg) = iter.next() {
              match arg.as_str() {
                  "-i" | "--ignore-case" => ignore_case = true,
                  "-n" | "--line-numbers" => line_numbers = true,
                  "-m" | "--max" => {
                      let value = iter.next().ok_or("missing value for --max")?;
                      let n = value.parse().map_err(|_| format!("invalid number for --max: {value}"))?;
                      max = Some(n);
                  }
                  flag if flag.starts_with('-') => return Err(format!("unknown flag: {flag}")),
                  _ if pattern.is_none() => pattern = Some(arg.clone()),
                  _ if file.is_none() => file = Some(arg.clone()),
                  _ => return Err(format!("unexpected argument: {arg}")),
              }
          }
          let pattern = pattern.ok_or("missing pattern")?;
          Ok(Config { pattern, file, ignore_case, line_numbers, max })
      }
    harness: |
      fn args(list: &[&str]) -> Vec<String> {
          list.iter().map(|s| s.to_string()).collect()
      }

      #[test]
      fn pattern_alone_uses_defaults() {
          let c = parse_args(&args(&["error"])).unwrap();
          assert_eq!(c, Config { pattern: "error".into(), file: None, ignore_case: false, line_numbers: false, max: None }, "parse_args([error])");
      }

      #[test]
      fn short_and_long_flags_work_in_any_order() {
          let c = parse_args(&args(&["warn", "--line-numbers", "app.log", "-i"])).unwrap();
          assert_eq!(c, Config { pattern: "warn".into(), file: Some("app.log".into()), ignore_case: true, line_numbers: true, max: None }, "parse_args([warn, --line-numbers, app.log, -i])");
      }

      #[test]
      fn max_takes_the_next_argument() {
          assert_eq!(parse_args(&args(&["-m", "3", "x"])).unwrap().max, Some(3), "parse_args([-m, 3, x]).max");
          assert_eq!(parse_args(&args(&["x", "--max", "10"])).unwrap().max, Some(10), "parse_args([x, --max, 10]).max");
      }

      #[test]
      fn bad_max_values_are_errors() {
          assert_eq!(parse_args(&args(&["x", "--max"])), Err("missing value for --max".to_string()), "parse_args([x, --max])");
          assert_eq!(parse_args(&args(&["x", "-m", "lots"])), Err("invalid number for --max: lots".to_string()), "parse_args([x, -m, lots])");
      }

      #[test]
      fn unknown_flags_and_extra_arguments_are_errors() {
          assert_eq!(parse_args(&args(&["x", "-z"])), Err("unknown flag: -z".to_string()), "parse_args([x, -z])");
          assert_eq!(parse_args(&args(&["x", "a.log", "b.log"])), Err("unexpected argument: b.log".to_string()), "parse_args([x, a.log, b.log])");
      }

      #[test]
      fn no_pattern_is_an_error() {
          assert_eq!(parse_args(&args(&["-i"])), Err("missing pattern".to_string()), "parse_args([-i])");
          assert_eq!(parse_args(&args(&[])), Err("missing pattern".to_string()), "parse_args([])");
      }
    hints:
      - "Keep one `let mut` variable per setting, loop with `while let Some(arg) = iter.next()`, and build the Config at the end."
      - "`\"-m\" | \"--max\" => { let value = iter.next().ok_or(\"missing value for --max\")?; ... }`"
      - "Positional arms in order: `_ if pattern.is_none() => ...`, `_ if file.is_none() => ...`, `_ => return Err(format!(\"unexpected argument: {arg}\"))`."
    more:
      - task: |
          Users also type `--max=5` and group short flags as `-in`. Write `fn expand(args: &[String]) -> Vec<String>` that normalizes the arguments before parsing: a long option with `=` (`--max=5`) becomes two arguments (`--max`, `5`); a single dash followed by **two or more letters** (`-in`) becomes one flag per letter (`-i`, `-n`). Everything else is kept as is, and after a `--` argument nothing more is changed (the `--` itself is kept).
        seed: |
          fn expand(args: &[String]) -> Vec<String> {
              todo!()
          }
        solution: |
          fn expand(args: &[String]) -> Vec<String> {
              let mut out = Vec::new();
              let mut done = false;
              for arg in args {
                  if done {
                      out.push(arg.clone());
                      continue;
                  }
                  if arg == "--" {
                      done = true;
                      out.push(arg.clone());
                  } else if let Some(long) = arg.strip_prefix("--") {
                      match long.split_once('=') {
                          Some((name, value)) => {
                              out.push(format!("--{name}"));
                              out.push(value.to_string());
                          }
                          None => out.push(arg.clone()),
                      }
                  } else if arg.len() > 2 && arg.starts_with('-') && arg[1..].chars().all(|c| c.is_ascii_alphabetic()) {
                      for c in arg[1..].chars() {
                          out.push(format!("-{c}"));
                      }
                  } else {
                      out.push(arg.clone());
                  }
              }
              out
          }
        harness: |
          fn args(list: &[&str]) -> Vec<String> {
              list.iter().map(|s| s.to_string()).collect()
          }

          #[test]
          fn splits_long_options_with_equals() {
              assert_eq!(expand(&args(&["--max=5", "error"])), args(&["--max", "5", "error"]), "expand([--max=5, error])");
          }

          #[test]
          fn splits_grouped_short_flags() {
              assert_eq!(expand(&args(&["-in", "error"])), args(&["-i", "-n", "error"]), "expand([-in, error])");
          }

          #[test]
          fn leaves_other_arguments_alone() {
              assert_eq!(expand(&args(&["-i", "--verbose", "-5", "a=b", "-"])), args(&["-i", "--verbose", "-5", "a=b", "-"]), "expand(mixed)");
          }

          #[test]
          fn stops_after_double_dash() {
              assert_eq!(expand(&args(&["-in", "--", "-xy", "--max=1"])), args(&["-i", "-n", "--", "-xy", "--max=1"]), "expand([-in, --, -xy, --max=1])");
          }

          #[test]
          fn empty_input_gives_empty_output() {
              assert_eq!(expand(&[]), Vec::<String>::new(), "expand([])");
          }
        hints:
          - "`arg.strip_prefix(\"--\")` gives the part after `--` as an `Option<&str>`; `split_once('=')` splits name and value."
          - "For short groups: the argument starts with `-`, is longer than 2 characters, and everything after the dash is an ASCII letter (so `-5` stays a number): `arg[1..].chars().all(|c| c.is_ascii_alphabetic())`."
          - "Keep a `done` flag that you set when you see `--`; after that, push every argument unchanged."
      - task: |
          Write `seq`: `seq [-s SEP] [-w] FIRST LAST` prints the whole numbers from FIRST to LAST (inclusive, counting down if LAST is smaller), separated by SEP (default: a newline). With `-w`, pad every number with zeros to the width of the widest one (`08`, `09`, `10`). The options may come before or after the numbers, and you can assume the arguments are valid.
        seed: |
          fn main() {
          }
        solution: |
          fn main() {
              let args: Vec<String> = std::env::args().skip(1).collect();
              let mut sep = String::from("\n");
              let mut pad = false;
              let mut numbers = Vec::new();
              let mut iter = args.iter();
              while let Some(arg) = iter.next() {
                  match arg.as_str() {
                      "-s" => sep = iter.next().cloned().unwrap_or_default(),
                      "-w" => pad = true,
                      n => numbers.push(n.parse::<i64>().unwrap_or(0)),
                  }
              }
              let (first, last) = (numbers[0], numbers[1]);
              let values: Vec<i64> = if first <= last { (first..=last).collect() } else { (last..=first).rev().collect() };
              let width = if pad { values.iter().map(|v| v.to_string().len()).max().unwrap_or(0) } else { 0 };
              let text: Vec<String> = values.iter().map(|v| format!("{v:0width$}")).collect();
              println!("{}", text.join(&sep));
          }
        tests:
          - args: ["1", "4"]
          - args: ["-s", ", ", "3", "1"]
          - args: ["-w", "8", "11"]
          - args: ["5", "5", "-s", "-"]
            hidden: true
          - args: ["-w", "-s", " ", "98", "101"]
            hidden: true
        hints:
          - "Parse with `while let Some(arg) = iter.next()`; `-s` takes the next argument as the separator."
          - "Build the list with `(first..=last)` or `(last..=first).rev()`, then `join` the formatted numbers with the separator."
          - "`format!(\"{v:0width$}\")` pads with zeros to `width` characters."

  - title: Exit codes and stderr
    id: cli-3
    text: |
      Every program ends with an **exit code**, a small number it hands back to whoever started it. `0` means success, anything else means failure. Humans rarely see it, but everything else does: shell scripts (`mytool && deploy`), CI pipelines (a non-zero code fails the build), and other programs. A tool that prints "error" but exits with 0 tells the script everything went fine.

      ```text
      $ grep crab notes.txt; echo "exit code: $?"
      the crab sleeps
      exit code: 0
      $ grep lobster notes.txt; echo "exit code: $?"
      exit code: 1
      $ grep lobster missing.txt; echo "exit code: $?"
      grep: missing.txt: No such file or directory
      exit code: 2
      ```

      Common conventions: `0` success, `1` a general failure (or "nothing found", for search tools), `2` the tool was called wrong (bad arguments). Codes go from 0 to 255.

      ### Returning an exit code from main

      ```rust run
      use std::process::ExitCode;

      fn main() -> ExitCode {
          let words = ["alpha", "beta", "gamma"];
          for w in words {
              println!("{w}");
          }
          eprintln!("debug: printed {} words", words.len());
          ExitCode::SUCCESS
      }
      ```

      ```output
      alpha
      beta
      gamma
      ```

      - `fn main() -> ExitCode` lets `main` choose the code: `ExitCode::SUCCESS` (0), `ExitCode::FAILURE` (1), or any `u8` with `ExitCode::from(2)`.
      - The `debug:` line isn't in the output above because `eprintln!` writes to **standard error** (stderr), a second output stream. Messages for humans (errors, warnings, progress) go to stderr; the tool's real **results** go to stdout. That way `mytool > results.txt` puts only results in the file while errors still appear on screen, and a pipe like `mytool | sort` doesn't sort your error messages.

      Here is a typical `main` for a tool that can be called wrong:

      ```rust
      use std::process::ExitCode;

      fn main() -> ExitCode {
          let args: Vec<String> = std::env::args().skip(1).collect();
          if args.is_empty() {
              eprintln!("usage: shout <word>...");
              return ExitCode::from(2);
          }
          println!("{}", args.join(" ").to_uppercase());
          ExitCode::SUCCESS
      }
      ```

      ```text
      $ shout hello crab
      HELLO CRAB
      $ shout; echo $?
      usage: shout <word>...
      2
      ```

      ### `std::process::exit`

      `std::process::exit(2)` ends the program immediately from anywhere. It's handy in small tools, but it doesn't return: values in scope are never dropped (their `Drop` code doesn't run), and a function that might call it is hard to test. Prefer returning `ExitCode` (or a `Result`) up to `main`, and keep `exit` for the top level.

      (Recall from the last module: a `main` that returns `Err` exits with 1, and a panic exits with 101.)

      ### Common mistakes

      - **Errors on stdout** with `println!`: they end up in the output file or the next program in the pipe.
      - **Exiting with 0 after an error.** Check: does `mytool bad-input && echo ok` print `ok`? It shouldn't.
      - **`exit(256)`**: codes are taken modulo 256 on Unix, so 256 becomes 0, which means success. `ExitCode::from` takes a `u8`, which avoids that.

      **Your turn:** write `average`: print the average of the numeric arguments with two decimals. With no arguments, print `usage: average <number>...` to **stderr** and exit with code 2. If an argument isn't a number, print `error: "x" is not a number` to stderr and exit with code 1 (print nothing to stdout in both cases).
    seed: |
      use std::process::ExitCode;

      fn main() -> ExitCode {
          let args: Vec<String> = std::env::args().skip(1).collect();
          ExitCode::SUCCESS
      }
    solution: |
      use std::process::ExitCode;

      fn main() -> ExitCode {
          let args: Vec<String> = std::env::args().skip(1).collect();
          if args.is_empty() {
              eprintln!("usage: average <number>...");
              return ExitCode::from(2);
          }
          let mut sum = 0.0;
          for arg in &args {
              match arg.parse::<f64>() {
                  Ok(n) => sum += n,
                  Err(_) => {
                      eprintln!("error: {arg:?} is not a number");
                      return ExitCode::FAILURE;
                  }
              }
          }
          println!("{:.2}", sum / args.len() as f64);
          ExitCode::SUCCESS
      }
    require:
      - pattern: 'eprintln!'
        message: Print error messages to stderr with `eprintln!`.
    tests:
      - args: ["3", "4", "5"]
      - args: []
        exit: 2
        allowEmpty: true
      - args: ["1", "x"]
        exit: 1
        allowEmpty: true
      - args: ["-2.5", "2.5", "10"]
        hidden: true
      - args: ["7", "eight", "9"]
        exit: 1
        allowEmpty: true
        hidden: true
    hints:
