          Model the arguments the way clap does: write `fn parse_command(args: &[String]) -> Result<Command, String>` for a key-value store CLI with subcommands `get <key>`, `set <key> <value>`, `del <key>...` (one or more keys) and `list [--limit N]`. Errors: no subcommand gives `missing command`; an unknown one gives `unknown command "x"`; anything else wrong with a subcommand's arguments gives `usage: <subcommand> ...` with that subcommand's usage from the list below.
