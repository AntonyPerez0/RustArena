        solution: |
          #[derive(Debug, PartialEq)]
          enum Command {
              Get { key: String },
              Set { key: String, value: String },
              Del { keys: Vec<String> },
              List { limit: Option<usize> },
          }

          fn parse_command(args: &[String]) -> Result<Command, String> {
              let Some((cmd, rest)) = args.split_first() else {
                  return Err(String::from("missing command"));
              };
              match cmd.as_str() {
                  "get" => match rest {
                      [key] => Ok(Command::Get { key: key.clone() }),
                      _ => Err(String::from("usage: get <key>")),
                  },
                  "set" => match rest {
                      [key, value] => Ok(Command::Set { key: key.clone(), value: value.clone() }),
                      _ => Err(String::from("usage: set <key> <value>")),
                  },
                  "del" if !rest.is_empty() => Ok(Command::Del { keys: rest.to_vec() }),
                  "del" => Err(String::from("usage: del <key>...")),
                  "list" => match rest {
                      [] => Ok(Command::List { limit: None }),
                      [flag, n] if flag == "--limit" => n
                          .parse()
                          .map(|n| Command::List { limit: Some(n) })
                          .map_err(|_| String::from("usage: list [--limit N]")),
                      _ => Err(String::from("usage: list [--limit N]")),
                  },
                  other => Err(format!("unknown command {other:?}")),
              }
          }
        harness: |
          fn args(list: &[&str]) -> Vec<String> {
              list.iter().map(|s| s.to_string()).collect()
          }

          #[test]
          fn parses_each_subcommand() {
              assert_eq!(parse_command(&args(&["get", "color"])), Ok(Command::Get { key: "color".into() }), "get color");
              assert_eq!(parse_command(&args(&["set", "color", "red"])), Ok(Command::Set { key: "color".into(), value: "red".into() }), "set color red");
              assert_eq!(parse_command(&args(&["del", "a", "b"])), Ok(Command::Del { keys: vec!["a".into(), "b".into()] }), "del a b");
              assert_eq!(parse_command(&args(&["list"])), Ok(Command::List { limit: None }), "list");
              assert_eq!(parse_command(&args(&["list", "--limit", "5"])), Ok(Command::List { limit: Some(5) }), "list --limit 5");
          }

          #[test]
          fn missing_and_unknown_commands() {
              assert_eq!(parse_command(&args(&[])), Err("missing command".to_string()), "no arguments");
              assert_eq!(parse_command(&args(&["put", "x"])), Err("unknown command \"put\"".to_string()), "put x");
          }

          #[test]
          fn wrong_arguments_show_the_subcommand_usage() {
              assert_eq!(parse_command(&args(&["get"])), Err("usage: get <key>".to_string()), "get");
              assert_eq!(parse_command(&args(&["set", "k"])), Err("usage: set <key> <value>".to_string()), "set k");
              assert_eq!(parse_command(&args(&["del"])), Err("usage: del <key>...".to_string()), "del");
              assert_eq!(parse_command(&args(&["list", "--limit", "many"])), Err("usage: list [--limit N]".to_string()), "list --limit many");
              assert_eq!(parse_command(&args(&["list", "extra"])), Err("usage: list [--limit N]".to_string()), "list extra");
          }
        hints:
          - "`args.split_first()` gives `Some((first, rest))` or `None` for an empty slice."
          - "Match on `cmd.as_str()`, then on the `rest` slice with patterns like `[key]` and `[key, value]`."
          - "For `list`, `[flag, n] if flag == \"--limit\"` and parse `n`, mapping a parse error to the usage text."
