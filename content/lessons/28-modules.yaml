id: modules
title: Modules, Crates and Cargo
phase: "Idiomatic Rust"
summary: Organizing code that grows. mod blocks, privacy with pub, paths and use, re-exports, struct field privacy, splitting a crate into files, and Cargo packages with dependencies, semver, features, workspaces and publishing.
roadmap: [Modules & Crates, Code Organization & Namespacing, "Dependency Management (Cargo.toml)", Publishing on crates.io]
steps:
  - title: Modules and privacy
    id: modules-1
    text: |
      As a program grows, you need a way to group related code and to hide the details. A **module** is a named container for functions, structs, enums, constants and other modules. You create one with `mod`:

      ```rust run
      mod arena {
          pub fn welcome(name: &str) {
              println!("Welcome to the arena, {name}!");
              open_gates();
          }

          fn open_gates() {
              println!("(the gates creak open)");
          }
      }

      fn main() {
          arena::welcome("Ferris");
      }
      ```

      ```output
      Welcome to the arena, Ferris!
      (the gates creak open)
      ```

      Piece by piece:

      - `mod arena { ... }` defines a module named `arena`. Everything inside lives in the `arena` **namespace**, so its names can't clash with names elsewhere.
      - `arena::welcome` is a **path**: the module, `::`, then the item. It's the same `::` you've used in `String::from` and `std::io::stdin`.
      - Items in a module are **private by default**: usable inside the module, invisible outside it. `pub` makes an item public.
      - `welcome` is public, so `main` can call it. `open_gates` is private, but `welcome` can call it because they're in the same module.

      Why private by default? A module's public items are its **interface**: what others may rely on. Private items are details you can change or delete later without breaking anyone. At work this matters a lot: if a helper isn't `pub`, you know nobody outside depends on it.

      ### Calling a private function

      ```rust compile_fail
      mod arena {
          pub fn welcome() {
              println!("Welcome!");
          }

          fn secret_door() {
              println!("You found the secret door");
          }
      }

      fn main() {
          arena::welcome();
          arena::secret_door();
      }
      ```

      ```error
      error[E0603]: function `secret_door` is private
      ```

      The full message points at the definition (`note: the function secret_door is defined here`), so you can decide whether it should be `pub` or whether you're reaching for something you shouldn't.

      ### Modules inside modules

      Modules nest, and every module on a path must be reachable:

      ```rust run
      mod garden {
          pub mod vegetables {
              pub fn harvest() -> u32 {
                  12
              }
          }

          pub fn report() {
              println!("harvested {} carrots", vegetables::harvest());
          }
      }

      fn main() {
          garden::report();
          println!("{}", garden::vegetables::harvest());
      }
      ```

      ```output
      harvested 12 carrots
      12
      ```

      The privacy rule in one sentence: **a private item is visible in its own module and in all the modules inside it; `pub` also makes it visible wherever its parent module is visible.** So a child can use its parent's private items, but a parent can't use its child's private items.

      ### Common mistakes

      - **`pub` on the function but not on the module.** If `vegetables` weren't `pub`, `main` would get ``error[E0603]: module `vegetables` is private``, even though `harvest` is `pub`. Every step of the path has to be visible.
      - **Expecting a module to see its parent's names automatically.** Modules aren't nested blocks; the next step shows how to reach outward with paths.

      **Your turn:** fill in the blanks: declare the module `scoreboard`, and make `record` public so `main` can call it. The program prints `Ferris: 120 pts`.
    fill: |
      [[mod]] scoreboard {
          [[pub]] fn record(player: &str, points: u32) -> String {
              format!("{player}: {points} pts")
          }
      }

      fn main() {
          println!("{}", scoreboard::record("Ferris", 120));
      }
    hints:
      - A module is declared with the keyword `mod`.
      - Items are private by default. Put `pub` in front of `fn` so `main` can call it.
    tests:
      - expect: "Ferris: 120 pts"
    more:
      - task: |
          Move the two conversion functions into a module named `temperature`, and make them public, so that `temperature::c_to_f` and `temperature::f_to_c` work. The hidden tests call them through the module path.
        seed: |
          fn c_to_f(c: f64) -> f64 {
              c * 9.0 / 5.0 + 32.0
          }

          fn f_to_c(f: f64) -> f64 {
              (f - 32.0) * 5.0 / 9.0
          }
        solution: |
          mod temperature {
              pub fn c_to_f(c: f64) -> f64 {
                  c * 9.0 / 5.0 + 32.0
              }

              pub fn f_to_c(f: f64) -> f64 {
                  (f - 32.0) * 5.0 / 9.0
              }
          }
        harness: |
          #[test]
          fn boiling_point_in_fahrenheit() {
              assert_eq!(temperature::c_to_f(100.0), 212.0, "temperature::c_to_f(100.0)");
          }

          #[test]
          fn freezing_point_in_celsius() {
              assert_eq!(temperature::f_to_c(32.0), 0.0, "temperature::f_to_c(32.0)");
          }

          #[test]
          fn minus_forty_is_the_same_in_both() {
              assert_eq!(temperature::c_to_f(-40.0), -40.0, "temperature::c_to_f(-40.0)");
              assert_eq!(temperature::f_to_c(-40.0), -40.0, "temperature::f_to_c(-40.0)");
          }
        hints:
          - "Wrap both functions in `mod temperature { ... }`."
          - "Inside the module, write `pub fn c_to_f` and `pub fn f_to_c`."
      - task: |
          Build this module structure from scratch:

          - a module `shop` containing a **public** module `pricing`;
          - in `pricing`: a public function `with_tax(cents: u32) -> u32` that adds 20% (`cents * 120 / 100`) and then rounds **down** to a multiple of 10 using a **private** helper `round_to_ten(cents: u32) -> u32` (`cents / 10 * 10`);
          - in `shop`: a public function `receipt(cents: u32) -> String` that returns `"total: 1200 cents"` for `1000`, using `pricing::with_tax`.

          The tests call `shop::pricing::with_tax` and `shop::receipt`.
        seed: |
          // build the modules here
        solution: |
          // build the modules here
          mod shop {
              pub mod pricing {
                  pub fn with_tax(cents: u32) -> u32 {
                      round_to_ten(cents * 120 / 100)
                  }

                  fn round_to_ten(cents: u32) -> u32 {
                      cents / 10 * 10
                  }
              }

              pub fn receipt(cents: u32) -> String {
                  format!("total: {} cents", pricing::with_tax(cents))
              }
          }
        require:
          - pattern: '(?<!pub\s)fn\s+round_to_ten'
            message: Keep `round_to_ten` private (no `pub`).
        harness: |
          #[test]
          fn adds_twenty_percent() {
              assert_eq!(shop::pricing::with_tax(1000), 1200, "shop::pricing::with_tax(1000)");
          }

          #[test]
          fn rounds_down_to_ten() {
              assert_eq!(shop::pricing::with_tax(999), 1190, "shop::pricing::with_tax(999)");
          }

          #[test]
          fn receipt_shows_the_total() {
              assert_eq!(shop::receipt(1000), "total: 1200 cents", "shop::receipt(1000)");
          }

          #[test]
          fn zero_costs_nothing() {
              assert_eq!(shop::receipt(0), "total: 0 cents", "shop::receipt(0)");
          }
        hints:
          - "The shape is `mod shop { pub mod pricing { pub fn with_tax ... fn round_to_ten ... } pub fn receipt ... }`."
          - "Inside `shop`, `receipt` can call `pricing::with_tax(cents)`; inside `pricing`, `with_tax` can call `round_to_ten` by its plain name."

  - title: "Paths: crate, super and self"
    id: modules-2
    text: |
      A **path** names an item. There are two kinds:

      - **Absolute** paths start at the crate root with `crate::`, like a full address: `crate::restaurant::kitchen::cook`.
      - **Relative** paths start from the current module: a child's name (`kitchen::cook`), `super::` (the parent module) or `self::` (this module; rarely needed).

      The **crate root** is the top of the module tree: the file `main.rs` (or `lib.rs`) itself. Everything you write at the top level, like `fn main`, lives there. The module tree of the next example:

      ```text
      crate                 (main.rs, the crate root)
      ├── fn log
      ├── fn main
      └── mod restaurant
          ├── fn open
          ├── fn ring_bell
          └── mod kitchen
              ├── fn cook
              └── fn prep
      ```

      ```rust run
      fn log(msg: &str) {
          println!("[log] {msg}");
      }

      mod restaurant {
          pub fn open() {
              crate::log("opening");   // absolute: from the crate root
              kitchen::cook("soup");   // relative: kitchen is a child of restaurant
          }

          fn ring_bell() {
              println!("ding!");
          }

          pub mod kitchen {
              pub fn cook(dish: &str) {
                  prep(dish);          // same module: just the name
                  println!("{dish} is ready");
                  super::ring_bell();  // the parent module, restaurant
              }

              fn prep(dish: &str) {
                  println!("chopping for {dish}");
              }
          }
      }

      fn main() {
          restaurant::open();
          restaurant::kitchen::cook("salad");
      }
      ```

      ```output
      [log] opening
      chopping for soup
      soup is ready
      ding!
      chopping for salad
      salad is ready
      ding!
      ```

      - `super::ring_bell()`: `kitchen` lives inside `restaurant`, so `super` is `restaurant`. A child may use its parent's private items, so `ring_bell` doesn't need `pub`.
      - `crate::log(...)`: from anywhere, `crate::` starts at the root. The root's private items are visible everywhere in the crate, because every module is inside the root.
      - `main` is in the root, so `restaurant::...` from `main` is relative and absolute at the same time.

      **Which kind should you write?** Absolute `crate::` paths keep working when you move the code that *uses* them; relative `super::` paths keep working when you move a module *together with* its parent. Many teams prefer `crate::` in general for clarity, and `super::` for close relatives, most famously `use super::*;` in test modules (the testing module).

      ### Common mistake: names from outside the module

      A module does **not** see the names of the scope around it, unlike a block inside a function:

      ```rust compile_fail
      fn log(msg: &str) {
          println!("[log] {msg}");
      }

      mod restaurant {
          pub fn open() {
              log("opening");
          }
      }

      fn main() {
          restaurant::open();
      }
      ```

      ```error
      error[E0425]: cannot find function `log` in this scope
      ```

      The compiler suggests `consider importing this function: use crate::log;`. Either write the path (`crate::log("opening")` or `super::log(...)`) or bring the name in with `use`, the next step.

      **Your turn:** the starter doesn't compile: inside `teller::withdraw`, the calls to `fee` and `audit` can't find those functions. Give each call the right path: `fee` lives in the parent module `bank` (use `super::`), and `audit` lives in the crate root (use `crate::`). The program should print:

      ```
      audit: withdrawal
      balance: 68
      ```
    seed: |
      fn audit(event: &str) {
          println!("audit: {event}");
      }

      mod bank {
          fn fee() -> u32 {
              2
          }

          pub mod teller {
              pub fn withdraw(balance: u32, amount: u32) -> u32 {
                  let total = amount + fee();
                  audit("withdrawal");
                  balance - total
              }
          }
      }

      fn main() {
          let left = bank::teller::withdraw(100, 30);
          println!("balance: {left}");
      }
    solution: |
      fn audit(event: &str) {
          println!("audit: {event}");
      }

      mod bank {
          fn fee() -> u32 {
              2
          }

          pub mod teller {
              pub fn withdraw(balance: u32, amount: u32) -> u32 {
                  let total = amount + super::fee();
                  crate::audit("withdrawal");
                  balance - total
              }
          }
      }

      fn main() {
          let left = bank::teller::withdraw(100, 30);
          println!("balance: {left}");
      }
    require:
      - pattern: 'super::fee'
        message: "Reach the parent module's `fee` with `super::fee()`."
      - pattern: 'crate::audit'
        message: "Reach the root's `audit` with `crate::audit(...)`."
    hints:
      - "`teller` is inside `bank`, so `bank`'s `fee` is `super::fee()`."
      - "`audit` is at the top of the file, the crate root: `crate::audit(\"withdrawal\")`."
    more:
      - task: |
          Fill in the two path prefixes: `heal` (in `game::player`) needs `max_hp` from its parent module `game`, and `price_with_bonus` (in `shop`) needs `bonus` from the crate root. The program prints:

          ```
          80
          100
          15
          ```
        fill: |
          mod game {
              fn max_hp() -> u32 {
                  100
              }

              pub mod player {
                  pub fn heal(hp: u32) -> u32 {
                      (hp + 30).min([[super‖crate::game]]::max_hp())
                  }
              }
          }

          fn bonus() -> u32 {
              5
          }

          mod shop {
              pub fn price_with_bonus(price: u32) -> u32 {
                  price - [[crate‖super]]::bonus()
              }
          }

          fn main() {
              println!("{}", game::player::heal(50));
              println!("{}", game::player::heal(90));
              println!("{}", shop::price_with_bonus(20));
          }
        hints:
          - "`player` is inside `game`, so `game` is its `super`."
          - "`bonus` is in the crate root, which `crate::` names from anywhere."
      - task: |
          Build this module tree. `shout` is given at the root.

          ```text
          crate
          ├── fn shout(s: &str) -> String       (given: uppercases and adds "!")
          └── mod notify
              ├── pub fn alert(msg: &str) -> String
              │       "[ALERT] " followed by shout(msg)
              └── pub mod email
                  └── pub fn subject(msg: &str) -> String
                          "Subject: " followed by alert(msg)
          ```

          So `notify::alert("disk full")` is `"[ALERT] DISK FULL!"` and `notify::email::subject("disk full")` is `"Subject: [ALERT] DISK FULL!"`. Reach `shout` and `alert` with paths (`crate::` or `super::`); don't copy their code.
        seed: |
          fn shout(s: &str) -> String {
              format!("{}!", s.to_uppercase())
          }

          // mod notify { ... }
        solution: |
          fn shout(s: &str) -> String {
              format!("{}!", s.to_uppercase())
          }

          mod notify {
              pub fn alert(msg: &str) -> String {
                  format!("[ALERT] {}", crate::shout(msg))
              }

              pub mod email {
                  pub fn subject(msg: &str) -> String {
                      format!("Subject: {}", super::alert(msg))
                  }
              }
          }
        require:
          - pattern: '(crate|super)::shout'
            message: "Call the root's `shout` with a path: `crate::shout(msg)`."
          - pattern: '(super|crate::notify)::alert'
            message: "In `email`, call `alert` with a path: `super::alert(msg)`."
        harness: |
          #[test]
          fn alert_shouts_the_message() {
              assert_eq!(notify::alert("disk full"), "[ALERT] DISK FULL!", "notify::alert(\"disk full\")");
          }

          #[test]
          fn email_subject_wraps_the_alert() {
              assert_eq!(notify::email::subject("disk full"), "Subject: [ALERT] DISK FULL!", "notify::email::subject(\"disk full\")");
          }

          #[test]
          fn works_with_short_messages() {
              assert_eq!(notify::email::subject("hi"), "Subject: [ALERT] HI!", "notify::email::subject(\"hi\")");
          }
        hints:
          - "`alert` returns `format!(\"[ALERT] {}\", crate::shout(msg))`."
          - "Inside `pub mod email`, `subject` returns `format!(\"Subject: {}\", super::alert(msg))`."

  - title: "use: shortcuts for long paths"
    id: modules-3
    text: |
      Writing `crate::restaurant::kitchen::cook` over and over gets old. `use` creates a **shortcut**: a local name for a path, valid in the module where you write it.

      ```rust run
      mod shapes {
          pub mod circle {
              pub fn area(r: f64) -> f64 {
                  std::f64::consts::PI * r * r
              }
          }

          pub mod square {
              pub fn area(side: f64) -> f64 {
                  side * side
              }
          }
      }

      use shapes::circle;
      use shapes::square::area as square_area;
      use std::collections::{BTreeMap, HashSet};

      fn main() {
          println!("{:.2}", circle::area(1.0));
          println!("{:.2}", square_area(3.0));

          let mut stock = BTreeMap::new();
          stock.insert("bolts", 40);
          let mut seen = HashSet::new();
          seen.insert("bolts");
          println!("{} {}", stock.len(), seen.len());
      }
      ```

      ```output
      3.14
      9.00
      1 1
      ```

      | Form | Brings into scope |
      |---|---|
      | `use a::b::c;` | `c` |
      | `use a::b::{c, d};` | `c` and `d` (braces can nest: `use std::{fmt, io::{self, Read}};`) |
      | `use a::b::{self, c};` | `b` itself, and `c` |
      | `use a::b::c as other;` | `c`, under the name `other` |
      | `use a::b::*;` | everything public in `b` (a **glob** import) |

      ### What reviewers expect

      These are the conventions from the Rust book, and what `cargo fmt` plus a code review will push you toward:

      - **Functions**: import the parent module and call `module::function()`: `use std::io;` then `io::stdin()`. The call shows the function isn't local.
      - **Types** (structs, enums, traits): import the type itself: `use std::collections::HashMap;` then `HashMap::new()`.
      - **Two things with the same name**: keep their modules (`fmt::Result` vs `io::Result`), or rename one with `as`.
      - **Globs**: avoid them in normal code, since readers can't tell where names come from. They're fine for preludes (`use rayon::prelude::*;`) and for `use super::*;` in test modules.
      - Group `use` lines at the top of the module; `cargo fmt` sorts them, and rust-analyzer can add them for you.

      ### use is per module

      A `use` only applies to the module it's written in. Modules inside it don't inherit it:

      ```rust compile_fail
      use std::collections::HashMap;

      mod stats {
          pub fn count(words: &[&str]) -> HashMap<String, usize> {
              let mut counts = HashMap::new();
              for w in words {
                  *counts.entry(w.to_string()).or_insert(0) += 1;
              }
              counts
          }
      }

      fn main() {
          println!("{}", stats::count(&["a", "b", "a"]).len());
      }
      ```

      ```error
      error[E0425]: cannot find type `HashMap` in this scope
      ```

      Move the `use std::collections::HashMap;` line *inside* `mod stats`, where the code that needs it is. (The compiler also warns that the root's `use` is now unused.)

      **Your turn:** the `main` function uses `Item`, `stock::restock`, `report::line` and `BTreeMap`, but nothing brings them into scope. Add `use` lines (and don't change `main` or the modules) so the program compiles and prints:

      ```
      bolts     55
      ```
    seed: |
      mod warehouse {
          pub mod stock {
              pub struct Item {
                  pub name: String,
                  pub qty: u32,
              }

              pub fn restock(item: &mut Item, amount: u32) {
                  item.qty += amount;
              }
          }

          pub mod report {
              pub fn line(name: &str, qty: u32) -> String {
                  format!("{name:<8}{qty:>4}")
              }
          }
      }

      // add your use lines here

      fn main() {
          let mut bolts = Item { name: String::from("bolts"), qty: 40 };
          stock::restock(&mut bolts, 15);
          let mut totals = BTreeMap::new();
          totals.insert(bolts.name.clone(), bolts.qty);
          for (name, qty) in &totals {
              println!("{}", report::line(name, *qty));
          }
      }
    solution: |
      mod warehouse {
          pub mod stock {
              pub struct Item {
                  pub name: String,
                  pub qty: u32,
              }

              pub fn restock(item: &mut Item, amount: u32) {
                  item.qty += amount;
              }
          }

          pub mod report {
              pub fn line(name: &str, qty: u32) -> String {
                  format!("{name:<8}{qty:>4}")
              }
          }
      }

      // add your use lines here
      use std::collections::BTreeMap;
      use warehouse::report;
      use warehouse::stock::{self, Item};

      fn main() {
          let mut bolts = Item { name: String::from("bolts"), qty: 40 };
          stock::restock(&mut bolts, 15);
          let mut totals = BTreeMap::new();
          totals.insert(bolts.name.clone(), bolts.qty);
          for (name, qty) in &totals {
              println!("{}", report::line(name, *qty));
          }
      }
    require:
      - pattern: 'use\s+std::collections::(BTreeMap|\{[^}]*BTreeMap)'
        message: "Bring `BTreeMap` in with `use std::collections::BTreeMap;`."
      - pattern: 'use\s+(crate::)?warehouse::'
        message: "Import from the `warehouse` module with `use warehouse::...;` lines."
      - pattern: 'let\s+mut\s+bolts\s*=\s*Item\s*\{'
        message: "Keep `main` as it is: it creates the item with `Item { ... }`."
    hints:
      - "`main` needs four names: `BTreeMap` (from `std::collections`), `Item` and `stock` (from `warehouse::stock`), and `report` (from `warehouse`)."
      - "`use warehouse::stock::{self, Item};` brings in both the module `stock` and the type `Item`."
    tests:
      - expect: "bolts     55"
    more:
      - task: |
          Two modules each have a function called `distance`. Add two `use` lines with `as` so `main` can call the metric one as `km` and the imperial one as `miles`. The program prints:

          ```
          5.0 km
          3.1 mi
          ```
        seed: |
          mod metric {
              pub fn distance(km: f64) -> String {
                  format!("{km:.1} km")
              }
          }

          mod imperial {
              pub fn distance(km: f64) -> String {
                  format!("{:.1} mi", km * 0.621371)
              }
          }

          // add two use lines with `as`

          fn main() {
              println!("{}", km(5.0));
              println!("{}", miles(5.0));
          }
        solution: |
          mod metric {
              pub fn distance(km: f64) -> String {
                  format!("{km:.1} km")
              }
          }

          mod imperial {
              pub fn distance(km: f64) -> String {
                  format!("{:.1} mi", km * 0.621371)
              }
          }

          // add two use lines with `as`
          use imperial::distance as miles;
          use metric::distance as km;

          fn main() {
              println!("{}", km(5.0));
              println!("{}", miles(5.0));
          }
        require:
          - pattern: 'use\s+(crate::)?metric::distance\s+as\s+km\s*;'
            message: "Write `use metric::distance as km;`."
          - pattern: 'use\s+(crate::)?imperial::distance\s+as\s+miles\s*;'
            message: "Write `use imperial::distance as miles;`."
        hints:
          - "`use metric::distance as km;` makes `km(...)` call `metric::distance`."
          - "Do the same for `imperial::distance` with the name `miles`."
      - task: |
          Finish the module `stats`: `stats::word_counts(text: &str) -> BTreeMap<String, usize>` counts how many times each word appears (split on whitespace, lowercase the words). The starter has a `use` line, but in the wrong place: fix it so `stats` can name `BTreeMap`, then write the function.
        seed: |
          use std::collections::BTreeMap;

          mod stats {
              pub fn word_counts(text: &str) -> BTreeMap<String, usize> {
                  todo!()
              }
          }
        solution: |
          mod stats {
              use std::collections::BTreeMap;

              pub fn word_counts(text: &str) -> BTreeMap<String, usize> {
                  let mut counts = BTreeMap::new();
                  for word in text.split_whitespace() {
                      *counts.entry(word.to_lowercase()).or_insert(0) += 1;
                  }
                  counts
              }
          }
        require:
          - pattern: 'mod\s+stats\s*\{\s*use\s+std::collections::'
            message: "Put the `use std::collections::BTreeMap;` line inside `mod stats`, at its top."
        harness: |
          #[test]
          fn counts_each_word() {
              let counts = stats::word_counts("the crab and the sea");
              assert_eq!(counts.get("the"), Some(&2), "count of \"the\"");
              assert_eq!(counts.get("crab"), Some(&1), "count of \"crab\"");
              assert_eq!(counts.len(), 4, "number of different words");
          }

          #[test]
          fn ignores_case() {
              let counts = stats::word_counts("Rust rust RUST");
              assert_eq!(counts.get("rust"), Some(&3), "count of \"rust\"");
          }

          #[test]
          fn empty_text_has_no_words() {
              assert_eq!(stats::word_counts("   ").len(), 0, "stats::word_counts(\"   \").len()");
          }
        hints:
          - "A `use` at the crate root doesn't reach into `mod stats`. Move the line inside the module's braces."
          - "Count with `*counts.entry(word.to_lowercase()).or_insert(0) += 1;` for each word of `text.split_whitespace()`."

  - title: Struct fields, privacy and pub(crate)
    id: modules-4
    text: |
      Privacy also applies to the fields of a struct. `pub struct` makes the *type* usable outside its module, but each field stays private unless it's marked `pub` too. That's how Rust protects **invariants**: rules that must always hold, like "a balance never goes below zero". If only the module's own methods can touch the field, the rule is checked in exactly one place.

      ```rust run
      mod bank {
          pub struct Account {
              pub owner: String,
              balance: u64,
          }

          impl Account {
              pub fn new(owner: &str) -> Account {
                  Account { owner: owner.to_string(), balance: 0 }
              }

              pub fn deposit(&mut self, amount: u64) {
                  self.balance += amount;
              }

              pub fn withdraw(&mut self, amount: u64) -> Result<(), String> {
                  if amount > self.balance {
                      return Err(format!("insufficient funds: have {}, need {amount}", self.balance));
                  }
                  self.balance -= amount;
                  Ok(())
              }

              pub fn balance(&self) -> u64 {
                  self.balance
              }
          }
      }

      fn main() {
          let mut acct = bank::Account::new("Ann");
          acct.deposit(100);
          println!("{:?}", acct.withdraw(30));
          println!("{:?}", acct.withdraw(500));
          println!("{} has {}", acct.owner, acct.balance());
      }
      ```

      ```output
      Ok(())
      Err("insufficient funds: have 70, need 500")
      Ann has 70
      ```

      - Outside `bank`, code can read and change `owner` (it's `pub`) but can't touch `balance`. The only ways to change the balance are `deposit` and `withdraw`, which keep it valid.
      - The **getter** `balance()` gives read-only access. Naming it like the field (`balance`, not `get_balance`) is the Rust convention.
      - Because a field is private, code outside the module can't build an `Account` with a struct literal. It has to go through `new`: the **constructor** pattern.

      ### The errors you'll see

      Reading a private field:

      ```rust compile_fail
      mod bank {
          pub struct Account {
              pub owner: String,
              balance: u64,
          }

          impl Account {
              pub fn new(owner: &str) -> Account {
                  Account { owner: owner.to_string(), balance: 0 }
              }
          }
      }

      fn main() {
          let acct = bank::Account::new("Ann");
          println!("{} has {}", acct.owner, acct.balance);
      }
      ```

      ```error
      error[E0616]: field `balance` of struct `Account` is private
      ```

      Building the struct directly, skipping the constructor:

      ```rust compile_fail
      mod bank {
          pub struct Account {
              pub owner: String,
              balance: u64,
          }
      }

      fn main() {
          let acct = bank::Account { owner: String::from("Ann"), balance: 1_000_000 };
          println!("{}", acct.owner);
      }
      ```

      ```error
      error[E0451]: field `balance` of struct `Account` is private
      ```

      Nice try, Ann.

      ### Enums are different

      When an enum is `pub`, all its variants (and their data) are public too. An enum with hidden variants would be useless: you couldn't `match` on it.

      ### Finer control: pub(crate) and pub(super)

      | Written | Visible to |
      |---|---|
      | `pub` | everyone who can see the parent module; in a library, other crates too |
      | `pub(crate)` | the whole crate, but never other crates |
      | `pub(super)` | the parent module (and the parent's other children) |
      | nothing | this module and the modules inside it |

      ```rust run
      mod app {
          pub(crate) fn version() -> &'static str {
              "1.4.0"
          }

          pub mod ui {
              pub(super) fn theme() -> &'static str {
                  "dark"
              }
          }

          pub fn banner() -> String {
              format!("v{} ({})", version(), ui::theme())
          }
      }

      fn main() {
          println!("{}", app::banner());
          println!("{}", app::version());
      }
      ```

      ```output
      v1.4.0 (dark)
      1.4.0
      ```

      `main` may call `app::version()` (it's `pub(crate)`), but `app::ui::theme()` would fail with ``error[E0603]: function `theme` is private``: only `app` can see it. In a program (a binary crate), `pub` and `pub(crate)` behave the same. The difference matters in **libraries**, where every `pub` item is part of your public API, a promise other crates rely on. `pub(crate)` lets modules share helpers without making that promise.

      **Your turn:** finish the `inventory` module. `Item` has a public `name` and a private `qty`, so the quantity can never go negative. Implement:

      - `Item::new(name: &str, qty: u32) -> Item`
      - `qty(&self) -> u32`, the getter
      - `add(&mut self, amount: u32)`
      - `remove(&mut self, amount: u32) -> Result<(), String>`: if there aren't enough, return `Err(format!("only {} left", qty))` and change nothing.

      The tests use the item through `inventory::Item`.
    seed: |
      mod inventory {
          pub struct Item {
              pub name: String,
              qty: u32,
          }

          impl Item {
              pub fn new(name: &str, qty: u32) -> Item {
                  todo!()
              }

              pub fn qty(&self) -> u32 {
                  todo!()
              }

              pub fn add(&mut self, amount: u32) {
                  todo!()
              }

              pub fn remove(&mut self, amount: u32) -> Result<(), String> {
                  todo!()
              }
          }
      }
    solution: |
      mod inventory {
          pub struct Item {
              pub name: String,
              qty: u32,
          }

          impl Item {
              pub fn new(name: &str, qty: u32) -> Item {
                  Item { name: name.to_string(), qty }
              }

              pub fn qty(&self) -> u32 {
                  self.qty
              }

              pub fn add(&mut self, amount: u32) {
                  self.qty += amount;
              }

              pub fn remove(&mut self, amount: u32) -> Result<(), String> {
                  if amount > self.qty {
                      return Err(format!("only {} left", self.qty));
                  }
                  self.qty -= amount;
                  Ok(())
              }
          }
      }
    forbid:
      - pattern: 'pub\s+qty\s*:'
        message: Keep `qty` private; that's the point of the getter and the methods.
    harness: |
      #[test]
      fn new_item_has_its_quantity() {
          let item = inventory::Item::new("bolt", 5);
          assert_eq!(item.qty(), 5, "Item::new(\"bolt\", 5).qty()");
      }

      #[test]
      fn name_is_public() {
          let item = inventory::Item::new("bolt", 5);
          assert_eq!(item.name, "bolt", "item.name");
      }

      #[test]
      fn adding_increases_the_quantity() {
          let mut item = inventory::Item::new("nut", 2);
          item.add(8);
          assert_eq!(item.qty(), 10, "qty after add(8) to 2");
      }

      #[test]
      fn removing_decreases_the_quantity() {
          let mut item = inventory::Item::new("nut", 10);
          assert_eq!(item.remove(4), Ok(()), "remove(4) from 10");
          assert_eq!(item.qty(), 6, "qty after remove(4)");
      }

      #[test]
      fn removing_too_many_is_an_error_and_changes_nothing() {
          let mut item = inventory::Item::new("saw", 3);
          assert_eq!(item.remove(5), Err(String::from("only 3 left")), "remove(5) from 3");
          assert_eq!(item.qty(), 3, "qty after the failed remove");
      }
    hints:
      - "`new` returns `Item { name: name.to_string(), qty }`; the getter returns `self.qty`."
      - "In `remove`, check `if amount > self.qty { return Err(format!(\"only {} left\", self.qty)); }` before subtracting."
    more:
