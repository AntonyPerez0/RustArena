            message: "Bring the trait into scope with `use itertools::Itertools;`."
          - pattern: '\.join\('
            message: "Join the entries with Itertools' `.join(\", \")`."
        forbid:
          - pattern: '\bfor\b|\bwhile\b|\bloop\b'
            message: Use iterator methods (`sorted_by`, `map`, `join`), no loops.
