          A thermostat must always target a temperature between `10.0` and `30.0`. Finish the module so that invariant can't be broken: `new` and `set` **clamp** the value into that range (`t.clamp(10.0, 30.0)` does exactly that), and `target()` is the getter. The field stays private.
