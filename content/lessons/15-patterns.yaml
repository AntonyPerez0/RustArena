    solution: |
      fn parse_point(text: &str) -> Option<(i32, i32)> {
          let Some((left, right)) = text.split_once(',') else {
              return None;
          };
          let Ok(x) = left.trim().parse::<i32>() else {
              return None;
          };
          let Ok(y) = right.trim().parse::<i32>() else {
              return None;
          };
          Some((x, y))
      }
