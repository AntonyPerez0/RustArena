              assert_eq!(quadrant((0, -4)), "y axis", "quadrant((0, -4))");
              assert_eq!(quadrant((9, 0)), "x axis", "quadrant((9, 0))");
          }

          #[test]
          fn first_and_second_quadrant() {
              assert_eq!(quadrant((3, 4)), "I", "quadrant((3, 4))");
              assert_eq!(quadrant((-3, 4)), "II", "quadrant((-3, 4))");
          }

          #[test]
          fn third_and_fourth_quadrant() {
              assert_eq!(quadrant((-1, -1)), "III", "quadrant((-1, -1))");
              assert_eq!(quadrant((5, -2)), "IV", "quadrant((5, -2))");
          }
