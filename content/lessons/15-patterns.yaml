        solution: |
          // write fn quadrant here
          fn quadrant(point: (i32, i32)) -> &'static str {
              match point {
                  (0, 0) => "origin",
                  (0, _) => "y axis",
                  (_, 0) => "x axis",
                  (x, y) if x > 0 && y > 0 => "I",
                  (x, y) if x < 0 && y > 0 => "II",
                  (x, y) if x < 0 && y < 0 => "III",
                  _ => "IV",
              }
          }
