  - title: while let and slice patterns
    id: patterns-5
    text: |
      ### while let: loop while a pattern matches

      `if let` runs a block once if a pattern matches. `while let` keeps running the block **as long as** the pattern matches, and stops the first time it doesn't. Its classic partner is `pop()`, which removes the last element of a vector and returns `Some(element)`, or `None` when the vector is empty:

      ```rust run
      fn main() {
          let mut undo = vec!["type 'a'", "type 'b'", "make bold"];
          while let Some(action) = undo.pop() {
              println!("undo: {action}");
          }
          println!("nothing left to undo");
      }
      ```

      ```output
      undo: make bold
      undo: type 'b'
      undo: type 'a'
      nothing left to undo
      ```

      That's a **stack**: last in, first out.

      ### Slice patterns

      Arrays and slices have their own patterns, written with square brackets. They match on the *length* and the *elements* at the same time:

      ```rust run
      fn describe(scores: &[u32]) -> String {
          match scores {
              [] => String::from("no games yet"),
              [only] => format!("one game: {only}"),
              [first, second] => format!("two games: {first} and {second}"),
              [first, .., last] => format!("{} games, first {first}, last {last}", scores.len()),
          }
      }

      fn main() {
          println!("{}", describe(&[]));
          println!("{}", describe(&[12]));
          println!("{}", describe(&[12, 30]));
          println!("{}", describe(&[12, 30, 7, 41]));
      }
      ```

      ```output
      no games yet
      one game: 12
      two games: 12 and 30
      4 games, first 12, last 41
      ```

      - `[]` matches an empty slice, `[only]` exactly one element, `[first, second]` exactly two.
      - `..` inside brackets matches **any number** of elements (including zero), so `[first, .., last]` means "at least two".
      - `rest @ ..` keeps those elements as a slice: `[head, rest @ ..]` gives the first element and a `&[u32]` of everything after it.
      - The compiler checks slice patterns for exhaustiveness too. Here every length is covered.

      ### Parsing commands with slice patterns

      Slice patterns are perfect for little command languages. Split a line into words, then match on the words:

      ```rust run
      fn run(line: &str) -> String {
          let words: Vec<&str> = line.split_whitespace().collect();
          match words.as_slice() {
              [] => String::from("(empty line)"),
              ["look"] => String::from("You see a crab."),
              ["go", direction] => format!("You walk {direction}."),
              ["say", rest @ ..] => format!("You say: {}", rest.join(" ")),
              [command, ..] => format!("Unknown command: {command}"),
          }
      }

      fn main() {
          for line in ["look", "go north", "say hello there", "", "dance"] {
              println!("{}", run(line));
          }
      }
      ```

      ```output
      You see a crab.
      You walk north.
      You say: hello there
      (empty line)
      Unknown command: dance
      ```

      `.collect()` gathers the words into a `Vec<&str>` (module 27 covers it), `.as_slice()` views the vector as a slice so slice patterns apply, and `rest.join(" ")` glues the remaining words back together with spaces.

      ### Common mistake: matching a Vec directly

      Slice patterns need a slice or an array, not a `Vec`:

      ```rust compile_fail
      fn main() {
          let v = vec![1, 2, 3];
          match v {
              [] => println!("empty"),
              _ => println!("some"),
          }
      }
      ```

      ```error
      error[E0529]: expected an array or slice, found `Vec<{integer}>`
      ```

      Write `match v.as_slice()` (or `match &v[..]`).

      **Your turn:** write `fn trend(temps: &[i32]) -> String` with a slice pattern:

      - empty: `"no data"`
      - one reading: `"only T"`
      - otherwise compare the first and last reading: `"rising from A to B"`, `"falling from A to B"`, or `"steady at A"` if they're equal.
    seed: |
      fn trend(temps: &[i32]) -> String {
          todo!()
      }
    solution: |
      fn trend(temps: &[i32]) -> String {
          match temps {
              [] => String::from("no data"),
              [only] => format!("only {only}"),
              [first, .., last] if last > first => format!("rising from {first} to {last}"),
              [first, .., last] if last < first => format!("falling from {first} to {last}"),
              [first, ..] => format!("steady at {first}"),
          }
      }
    harness: |
      #[test]
      fn empty_slice_has_no_data() {
          assert_eq!(trend(&[]), "no data", "trend(&[])");
      }

      #[test]
      fn one_reading() {
          assert_eq!(trend(&[21]), "only 21", "trend(&[21])");
      }

      #[test]
      fn rising_with_two_readings() {
          assert_eq!(trend(&[18, 22]), "rising from 18 to 22", "trend(&[18, 22])");
      }

      #[test]
      fn falling_ignores_the_middle() {
          assert_eq!(trend(&[30, 50, 10, 25]), "falling from 30 to 25", "trend(&[30, 50, 10, 25])");
      }

      #[test]
      fn steady_when_first_equals_last() {
          assert_eq!(trend(&[-2, 5, -2]), "steady at -2", "trend(&[-2, 5, -2])");
      }
    require:
      - pattern: '\[\s*\w+\s*,\s*\.\.'
        message: "Use a slice pattern like `[first, .., last]`."
    hints:
      - "Start with `[] => ...` and `[only] => ...`."
      - "`[first, .., last]` matches two or more readings. Add a guard to compare: `[first, .., last] if last > first => ...`"
      - "Finish with an unguarded arm such as `[first, ..] => format!(\"steady at {first}\")` so the match is exhaustive."
    more:
      - task: |
          Write a program for a tiny bank terminal. Each input line is a command:

          - `deposit N`: add N to the balance and print `balance: B`
          - `withdraw N`: if N is more than the balance print `insufficient funds`, otherwise subtract and print `balance: B`
          - `balance`: print `balance: B`
          - anything else (including a non-number amount): print `unknown command`

          The balance starts at 0. Match on `words.as_slice()` with patterns like `["deposit", amount]`, and parse the amount with `amount.parse::<u32>()`, matching on `Ok(n)` / `Err(_)`.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              let mut balance: u32 = 0;
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let words: Vec<&str> = line.split_whitespace().collect();
                  // match words.as_slice() { ... }
              }
          }
        solution: |
          use std::io::{self, BufRead};

          fn main() {
              let mut balance: u32 = 0;
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let words: Vec<&str> = line.split_whitespace().collect();
                  // match words.as_slice() { ... }
                  match words.as_slice() {
                      ["deposit", amount] => match amount.parse::<u32>() {
                          Ok(n) => {
                              balance += n;
                              println!("balance: {balance}");
                          }
                          Err(_) => println!("unknown command"),
                      },
                      ["withdraw", amount] => match amount.parse::<u32>() {
                          Ok(n) if n > balance => println!("insufficient funds"),
                          Ok(n) => {
                              balance -= n;
                              println!("balance: {balance}");
                          }
                          Err(_) => println!("unknown command"),
                      },
                      ["balance"] => println!("balance: {balance}"),
                      _ => println!("unknown command"),
                  }
              }
          }
        tests:
          - stdin: "deposit 100\nwithdraw 30\nwithdraw 500\nbalance\n"
            expect: "balance: 100\nbalance: 70\ninsufficient funds\nbalance: 70"
          - stdin: "balance\ndeposit ten\nfly away\ndeposit 5\nwithdraw 5\n"
          - stdin: "deposit 40\ndeposit 2\nwithdraw 42\nwithdraw 1\nbalance please\n"
            hidden: true
        require:
          - pattern: 'as_slice\(\)|\[\.\.\]'
            message: "Match on `words.as_slice()` so you can use slice patterns."
        hints:
          - "Arms look like `[\"deposit\", amount] => ...` where `amount` binds the second word."
          - "Inside, `match amount.parse::<u32>() { Ok(n) => ..., Err(_) => ... }`."
          - "For withdraw, a guard handles the not-enough-money case: `Ok(n) if n > balance => println!(\"insufficient funds\"),`"
      - task: |
          Two sensors take turns writing into one list, so readings come in pairs. Write `fn pair_sums(values: &[i32]) -> Vec<i32>` that adds each pair: `[1, 2, 3, 4, 5]` gives `[3, 7, 5]` (a leftover last value is kept as it is).

          Use `while let` with a slice pattern: keep a variable `rest` (starting as `values`), and while it matches `[a, b, tail @ ..]`, push `a + b` and set `rest = tail`.
        seed: |
          fn pair_sums(values: &[i32]) -> Vec<i32> {
              todo!()
          }
        solution: |
          fn pair_sums(values: &[i32]) -> Vec<i32> {
              let mut sums = Vec::new();
              let mut rest = values;
              while let [a, b, tail @ ..] = rest {
                  sums.push(a + b);
                  rest = tail;
              }
              if let [last] = rest {
                  sums.push(*last);
              }
              sums
          }
        harness: |
          #[test]
          fn even_number_of_values() {
              assert_eq!(pair_sums(&[1, 2, 3, 4]), vec![3, 7], "pair_sums(&[1, 2, 3, 4])");
          }

          #[test]
          fn odd_number_keeps_the_last_value() {
              assert_eq!(pair_sums(&[1, 2, 3, 4, 5]), vec![3, 7, 5], "pair_sums(&[1, 2, 3, 4, 5])");
          }

          #[test]
          fn empty_gives_empty() {
              assert_eq!(pair_sums(&[]), Vec::<i32>::new(), "pair_sums(&[])");
          }

          #[test]
          fn single_value() {
              assert_eq!(pair_sums(&[-8]), vec![-8], "pair_sums(&[-8])");
          }

          #[test]
          fn negative_values() {
              assert_eq!(pair_sums(&[-1, 1, 10, -20]), vec![0, -10], "pair_sums(&[-1, 1, 10, -20])");
          }
        require:
          - pattern: 'while\s+let\s*\['
            message: "Use `while let [a, b, tail @ ..] = rest`."
        hints:
          - "`let mut rest = values;` then `while let [a, b, tail @ ..] = rest { ... }`"
          - "Inside the loop: `sums.push(a + b); rest = tail;`"
          - "After the loop, `if let [last] = rest { sums.push(*last); }` keeps a leftover value."

  - title: Refutable and irrefutable patterns
    id: patterns-6
    text: |
      Some patterns can fail to match: `Some(x)` fails on `None`, `0..=9` fails on 42, `[first, ..]` fails on an empty slice. They're called **refutable**. Others match every possible value: `x`, `_`, `(a, b)` for a pair, `Point { x, y }` for a Point. They're **irrefutable**.

      Where a pattern appears decides which kind is allowed:

      | Place | Allowed patterns | Why |
      |---|---|---|
      | `let`, function parameters, `for` loops | irrefutable only | there's nowhere to go if the match fails |
      | `if let`, `while let`, `let ... else`, `match` arms | refutable | they say what happens on a failed match (skip, stop, `else`, the next arm) |

      Try a refutable pattern in a plain `let`:

      ```rust compile_fail
      fn main() {
          let opt: Option<i32> = Some(3);
          let Some(x) = opt;
          println!("{x}");
      }
      ```

      ```error
      error[E0005]: refutable pattern in local binding
      ```

      The compiler even suggests the fix: `let ... else`, which you met in the enums module. The `else` block runs when the pattern fails and must leave the current block (`return`, `break`, `continue` or a panic), so code after it can rely on `x` existing.

      ### let ... else for parsing

      `let ... else` keeps the "happy path" flat when several steps can fail. This parses settings like `port = 8080`:

      ```rust run
      fn parse_setting(line: &str) -> Option<(String, u32)> {
          let Some((key, value)) = line.split_once('=') else {
              return None;
          };
          let Ok(number) = value.trim().parse::<u32>() else {
              return None;
          };
          Some((key.trim().to_string(), number))
      }

      fn main() {
          for line in ["port = 8080", "workers=4", "debug", "timeout = soon"] {
              match parse_setting(line) {
                  Some((key, value)) => println!("{key} -> {value}"),
                  None => println!("skipped: {line}"),
              }
          }
      }
      ```

      ```output
      port -> 8080
      workers -> 4
      skipped: debug
      skipped: timeout = soon
      ```

      - `line.split_once('=')` splits at the first `=` and returns `Some((before, after))`, or `None` if there's no `=` (more string tools in module 18).
      - `let Some((key, value)) = ... else { return None; };` destructures two levels at once: the `Option` and the tuple inside it.
      - `parse` returns a `Result`, so the second step uses `let Ok(number) = ... else`.

      ### Irrefutable patterns you use all the time

      ```rust run
      fn print_score((name, points): (&str, u32)) {
          println!("{name} has {points} points");
      }

      fn main() {
          let scores = [("ana", 91), ("bo", 78)];
          for (name, points) in scores {
              print_score((name, points + 1));
          }
          let (best, _) = scores[0];
          println!("first listed: {best}");
      }
      ```

      ```output
      ana has 92 points
      bo has 79 points
      first listed: ana
      ```

      A function parameter can be a pattern (`(name, points): (&str, u32)`), and so can the variable of a `for` loop. Both are irrefutable: a pair always has two parts.

      The opposite mistake, using `if let` with a pattern that can't fail (`if let x = 5`), compiles but warns `irrefutable if let pattern`: the `if` is pointless.

