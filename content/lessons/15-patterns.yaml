        solution: |
          use std::io::{self, BufRead};

          fn main() {
              let mut skipped = 0;
              for line in io::stdin().lock().lines() {
                  let line = line.expect("could not read a line");
                  let Some((name, score)) = line.split_once(':') else {
                      skipped += 1;
                      continue;
                  };
                  let Ok(score) = score.trim().parse::<u32>() else {
                      skipped += 1;
                      continue;
                  };
                  println!("{} scored {}", name.trim(), score);
              }
              println!("skipped {skipped} lines");
          }
        tests:
          - stdin: "ana: 91\nbo 78\ncy: 85\ndee: abc\n"
            expect: "ana scored 91\ncy scored 85\nskipped 2 lines"
          - stdin: "  eli :100\n"
          - stdin: "x\ny: 3\nz:\n w : 12 \n"
            hidden: true
        require:
          - pattern: '\belse\s*\{'
            message: "Use `let ... else { ...; continue; };` to skip bad lines."
