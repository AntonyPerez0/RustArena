  - title: Nested enums and ignoring parts
    id: patterns-4
    text: |
      Patterns nest exactly as deep as your data does. An enum variant can hold a struct-like set of fields, and those fields can hold other enums; one pattern can look at all of it.

      ```rust run
      enum Button {
          Left,
          Right,
      }

      enum Event {
          Key(char),
          Click { x: i32, y: i32, button: Button },
          Scroll(i32),
          Quit,
      }

      fn handle(event: &Event) -> String {
          match event {
              Event::Key('q') | Event::Quit => String::from("quit"),
              Event::Key(c @ '0'..='9') => format!("digit {c}"),
              Event::Key(c) => format!("key {c}"),
              Event::Click { button: Button::Right, .. } => String::from("open menu"),
              Event::Click { x, y, button: Button::Left } => format!("left click at ({x}, {y})"),
              Event::Scroll(0) => String::from("no scroll"),
              Event::Scroll(n) if *n > 0 => format!("scroll down {n}"),
              Event::Scroll(n) => format!("scroll up {}", -n),
          }
      }

      fn main() {
          let events = [
              Event::Key('7'),
              Event::Key('w'),
              Event::Click { x: 10, y: 20, button: Button::Left },
              Event::Click { x: 5, y: 5, button: Button::Right },
              Event::Scroll(-3),
              Event::Scroll(4),
              Event::Key('q'),
              Event::Quit,
          ];
          for e in &events {
              println!("{}", handle(e));
          }
      }
      ```

      ```output
      digit 7
      key w
      left click at (10, 20)
      open menu
      scroll up 3
      scroll down 4
      quit
      quit
      ```

      Piece by piece:

      - `Event::Key('q') | Event::Quit` combines a variant with a literal inside it and another variant, with `|`.
      - `Event::Click { button: Button::Right, .. }` looks *inside* the click at its `button` field and checks it's `Button::Right`. The `..` ignores `x` and `y`.
      - `Event::Click { x, y, button: Button::Left }` binds `x` and `y` and requires a left button.
      - `Event::Scroll(n) if *n > 0`: since `handle` takes `&Event`, `n` is a `&i32`. Comparing needs the number itself, so the guard says `*n`. Printing works on the reference directly.
      - The compiler checks the whole nested structure for exhaustiveness: remove the `Button::Left` arm and it tells you that `Event::Click { button: Button::Left, .. }` isn't covered.

      ### `_`, `_name` and `..`

      | Pattern | Meaning |
      |---|---|
      | `_` | match one value, don't bind it (nothing is moved or borrowed) |
      | `_name` | bind the value (it **is** moved or borrowed) but don't warn if it's unused |
      | `..` | skip all remaining fields or elements |

      ### Common mistake: moving out while matching

      Matching on an owned value with a binding moves the data out of it:

      ```rust compile_fail
      fn main() {
          let name: Option<String> = Some(String::from("Ferris"));
          match name {
              Some(n) => println!("hi {n}"),
              None => println!("nobody"),
          }
          println!("{:?}", name);
      }
      ```

      ```error
      error[E0382]: borrow of partially moved value: `name`
      ```

      `Some(n)` moved the String into `n`, so `name` is no longer whole. Match on a reference instead (`match &name`), and `n` becomes a `&String`. If you don't need the value at all, `Some(_)` doesn't move anything.

      **Your turn:** a checkout supports three payment methods. Write `fn total_charge(p: &Payment) -> u32`, the amount charged in cents including the card fee:

      - `Cash(cents)`: just `cents`
      - an `Amex` card: `cents + cents * 3 / 100` (3% fee)
      - any other card: `cents + cents / 100` (1% fee)
      - `Voucher`: 0
    seed: |
      enum Brand {
          Visa,
          Mastercard,
          Amex,
      }

      enum Payment {
          Cash(u32),
          Card { brand: Brand, cents: u32 },
          Voucher,
      }

      fn total_charge(p: &Payment) -> u32 {
          todo!()
      }
    solution: |
      enum Brand {
          Visa,
          Mastercard,
          Amex,
      }

      enum Payment {
          Cash(u32),
          Card { brand: Brand, cents: u32 },
          Voucher,
      }

      fn total_charge(p: &Payment) -> u32 {
          match p {
              Payment::Cash(cents) => *cents,
              Payment::Card { brand: Brand::Amex, cents } => cents + cents * 3 / 100,
              Payment::Card { brand: Brand::Visa | Brand::Mastercard, cents } => cents + cents / 100,
              Payment::Voucher => 0,
          }
      }
    harness: |
      #[test]
      fn cash_has_no_fee() {
          assert_eq!(total_charge(&Payment::Cash(1000)), 1000, "Cash(1000)");
      }

      #[test]
      fn visa_and_mastercard_add_1_percent() {
          let visa = Payment::Card { brand: Brand::Visa, cents: 10_000 };
          let mc = Payment::Card { brand: Brand::Mastercard, cents: 250 };
          assert_eq!(total_charge(&visa), 10_100, "Visa card, 10000 cents");
          assert_eq!(total_charge(&mc), 252, "Mastercard, 250 cents");
      }

      #[test]
      fn amex_adds_3_percent() {
          let amex = Payment::Card { brand: Brand::Amex, cents: 10_000 };
          assert_eq!(total_charge(&amex), 10_300, "Amex card, 10000 cents");
      }

      #[test]
      fn voucher_is_free() {
          assert_eq!(total_charge(&Payment::Voucher), 0, "Voucher");
      }
    hints:
      - "Because you match on `&Payment`, `cents` is a `&u32`. Return `*cents` in the cash arm; arithmetic like `cents + cents / 100` works on references directly."
      - "Look inside the card variant: `Payment::Card { brand: Brand::Amex, cents } => ...`"
      - "The other brands can share an arm: `Payment::Card { brand: Brand::Visa | Brand::Mastercard, cents } => cents + cents / 100,` (or `brand: _`, after the Amex arm)."
    more:
