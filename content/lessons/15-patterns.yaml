id: patterns
title: Patterns and matching
phase: "Structuring data"
summary: "Patterns check the shape of a value and take it apart in one move: literals, ranges, alternatives, guards, @ bindings, destructuring structs, tuples, nested enums and slices, while let, and where each kind of pattern is allowed."
roadmap: [Pattern Matching, Destructuring]
steps:
  - title: Literals, ranges and |
    id: patterns-1
    text: |
      In the enums module you used `match` to pick a branch for each variant. The left side of every arm (`Some(x)`, `None`, `_`) is a **pattern**: a description of a shape a value might have. Rust compares the value with each pattern from top to bottom and runs the first arm that **matches**. Patterns can do much more than name variants, and this module covers every kind you'll meet at work.

      ### Literals, alternatives and ranges

      ```rust run
      fn main() {
          for code in [200, 201, 301, 404, 418, 503] {
              let meaning = match code {
                  200 | 201 => "success",
                  300..=399 => "redirect",
                  404 => "not found",
                  400..=499 => "client error",
                  500..=599 => "server error",
                  _ => "unknown",
              };
              println!("{code}: {meaning}");
          }
      }
      ```

      ```output
      200: success
      201: success
      301: redirect
      404: not found
      418: client error
      503: server error
      ```

      Piece by piece:

      - `404` is a **literal pattern**: it matches exactly that value.
      - `200 | 201` uses `|` (read it as "or") to let several patterns share one arm.
      - `300..=399` is a **range pattern**: any value from 300 to 399, both ends included. `500..600` (no `=`) leaves out the end, just like ranges in `for` loops, and `600..` means "600 or more".
      - **Order matters.** 404 is also inside `400..=499`, but the `404` arm comes first, so it wins. Put specific patterns before general ones.
      - `_` is the **wildcard**: it matches anything and keeps nothing. Here it catches every code the other arms don't.

      Ranges work on `char` too, which makes character classification short and readable:

      ```rust run
      fn kind(c: char) -> &'static str {
          match c {
              'a' | 'e' | 'i' | 'o' | 'u' => "vowel",
              'a'..='z' => "consonant",
              '0'..='9' => "digit",
              ' ' | '\t' | '\n' => "whitespace",
              _ => "other",
          }
      }

      fn main() {
          for c in ['e', 'k', '7', ' ', '!'] {
              println!("{:?}: {}", c, kind(c));
          }
      }
      ```

      ```output
      'e': vowel
      'k': consonant
      '7': digit
      ' ': whitespace
      '!': other
      ```

      The return type `&'static str` is the type of a string literal: text stored inside the program itself, which lives as long as the program does (that's what `'static` says; module 24 explains it fully). It's the usual return type for a function that picks one of several fixed labels.

      ### The compiler checks every number

      A `match` must be **exhaustive**: some arm has to match every possible value. For a number, that means every value of its type, and the compiler tells you exactly which ones you forgot:

      ```rust compile_fail
      fn main() {
          let n: u8 = 7;
          let size = match n {
              0 => "none",
              1..=9 => "a few",
          };
          println!("{size}");
      }
      ```

      ```error
      error[E0004]: non-exhaustive patterns: `10_u8..=u8::MAX` not covered
      ```

      Add `_ => "lots"` (or `10..=u8::MAX`) to cover the rest. This check is why `match` is safer than a chain of `if`s: when a new case appears, the compiler finds every place that must handle it.

      ### Common mistakes

      - **General arms before specific ones.** If `400..=499` came before `404`, the `404` arm could never run. The compiler warns `unreachable pattern`; that warning always means a bug.
      - **`..` instead of `..=`.** `1..9` stops at 8. Grades, ages and percentages usually want both ends: `90..=100`.
      - **Expecting a variable name to compare.** `match code { limit => ... }` does *not* compare with a variable called `limit`: a plain name in a pattern is a new variable that matches everything. The next step shows how to compare with a variable.

      **Your turn:** fill in the blanks so `level` turns a battery percentage into a label: `0` is `"empty"`, `1` to `20` is `"low"`, `21` to `99` is `"ok"`, `100` is `"full"`, and anything above 100 is `"invalid"`.
    fill: |
      fn level(percent: u32) -> &'static str {
          match percent {
              [[0]] => "empty",
              [[1..=20‖1..21]] => "low",
              21..=99 => "ok",
              100 => "full",
              [[_‖101..]] => "invalid",
          }
      }

      fn main() {
          for p in [0, 7, 20, 21, 100, 150] {
              println!("{p}% -> {}", level(p));
          }
      }
    hints:
      - The first blank is a literal pattern for exactly zero.
      - "A range that includes both ends is written `start..=end`."
      - "The last arm catches everything else: `_`."
    tests:
      - expect: "0% -> empty\n7% -> low\n20% -> low\n21% -> ok\n100% -> full\n150% -> invalid"
    more:
      - task: |
          A cinema charges by age. Write `fn ticket_price(age: u32) -> u32` with a `match` and range patterns:

          | Age | Price |
          |---|---|
          | 0 to 12 | 5 |
          | 13 to 17 | 8 |
          | 18 to 64 | 12 |
          | 65 and up | 6 |
        seed: |
          fn ticket_price(age: u32) -> u32 {
              todo!()
          }
        solution: |
          fn ticket_price(age: u32) -> u32 {
              match age {
                  0..=12 => 5,
                  13..=17 => 8,
                  18..=64 => 12,
                  _ => 6,
              }
          }
        harness: |
          #[test]
          fn children_pay_5() {
              assert_eq!(ticket_price(0), 5, "ticket_price(0)");
              assert_eq!(ticket_price(12), 5, "ticket_price(12)");
          }

          #[test]
          fn teens_pay_8() {
              assert_eq!(ticket_price(13), 8, "ticket_price(13)");
              assert_eq!(ticket_price(17), 8, "ticket_price(17)");
          }

          #[test]
          fn adults_pay_12() {
              assert_eq!(ticket_price(18), 12, "ticket_price(18)");
              assert_eq!(ticket_price(64), 12, "ticket_price(64)");
          }

          #[test]
          fn seniors_pay_6() {
              assert_eq!(ticket_price(65), 6, "ticket_price(65)");
              assert_eq!(ticket_price(101), 6, "ticket_price(101)");
          }
        require:
          - pattern: '\bmatch\b'
            message: Use a `match` on the age.
          - pattern: '\.\.='
            message: "Use range patterns such as `13..=17`."
        hints:
          - "Each arm is a range: `0..=12 => 5,`"
          - "The last arm can be `_ => 6` (or `65.. => 6`), since every smaller age is already covered."
      - task: |
          Write a whole program that reads **one line** of text and counts its characters by kind, after turning the line into lowercase:

          - vowels: `a e i o u`
          - consonants: the other letters `a` to `z`
          - digits: `0` to `9`
          - spaces: `' '`
          - other: everything else (punctuation and so on)

          For the input `Hello World 42!` print:

          ```
          vowels: 3
          consonants: 7
          digits: 2
          spaces: 2
          other: 1
          ```

          Ignore the newline at the end of the line (use `trim_end()`, which removes whitespace at the end only).
        seed: |
          use std::io;

          fn main() {
              let mut line = String::new();
              io::stdin().read_line(&mut line).expect("could not read input");
              let text = line.trim_end().to_lowercase();

              // count each kind of character with a match on c
          }
        solution: |
          use std::io;

          fn main() {
              let mut line = String::new();
              io::stdin().read_line(&mut line).expect("could not read input");
              let text = line.trim_end().to_lowercase();

              // count each kind of character with a match on c
              let mut vowels = 0;
              let mut consonants = 0;
              let mut digits = 0;
              let mut spaces = 0;
              let mut other = 0;
              for c in text.chars() {
                  match c {
                      'a' | 'e' | 'i' | 'o' | 'u' => vowels += 1,
                      'a'..='z' => consonants += 1,
                      '0'..='9' => digits += 1,
                      ' ' => spaces += 1,
                      _ => other += 1,
                  }
              }
              println!("vowels: {vowels}");
              println!("consonants: {consonants}");
              println!("digits: {digits}");
              println!("spaces: {spaces}");
              println!("other: {other}");
          }
        tests:
          - stdin: "Hello World 42!\n"
            expect: "vowels: 3\nconsonants: 7\ndigits: 2\nspaces: 2\nother: 1"
          - stdin: "RUST 2024, crab-style\n"
          - stdin: "Ferris says: GG wp 99?\n"
            hidden: true
        require:
          - pattern: '\|'
            message: "Use `|` to list the vowels in one pattern."
          - pattern: "'a'\\s*\\.\\.=\\s*'z'"
            strings: true
            message: "Use a char range pattern like `'a'..='z'` for the consonants."
        hints:
          - "Keep five counters (`let mut vowels = 0;` and so on) and loop with `for c in text.chars()`."
          - "Arms can be expressions: `'0'..='9' => digits += 1,`"
          - "Put the vowel arm (`'a' | 'e' | 'i' | 'o' | 'u'`) before the `'a'..='z'` arm so vowels aren't counted as consonants."

  - title: Match guards and @ bindings
    id: patterns-2
    text: |
      A plain name in a pattern is a **binding**: it matches any value and gives it that name inside the arm. On its own that's not very selective, so you can add a **match guard**: `if condition` after the pattern. The arm only runs when the pattern matches *and* the condition is true.

      ```rust run
      fn describe(balance: i64, overdraft_limit: i64) -> String {
          match balance {
              0 => String::from("empty"),
              b if b < -overdraft_limit => format!("{b}: over the limit!"),
              b if b < 0 => format!("{b}: overdrawn"),
              b => format!("{b}: in credit"),
          }
      }

      fn main() {
          println!("{}", describe(0, 100));
          println!("{}", describe(-250, 100));
          println!("{}", describe(-40, 100));
          println!("{}", describe(900, 100));
      }
      ```

      ```output
      empty
      -250: over the limit!
      -40: overdrawn
      900: in credit
      ```

      - `b if b < -overdraft_limit` binds the value to `b`, then checks the guard. A guard can use any expression, including other variables like `overdraft_limit`. Patterns alone can only contain fixed values, so guards are how you compare with a variable.
      - The arms are tried in order, so the second guard only sees balances that aren't over the limit.
      - The last arm `b` has no guard: it matches everything left, like `_`, but keeps the value.

      ### @ bindings: test a pattern and keep the value

      `name @ pattern` checks the value against the pattern **and** binds it to `name`. It shines when the value is buried inside something, like a number inside `Some`:

      ```rust run
      fn main() {
          let readings = [Some(3), Some(42), Some(-1), Some(250), None];
          for r in readings {
              let text = match r {
                  Some(n @ 0..=9) => format!("one digit: {n}"),
                  Some(n @ 10..=99) => format!("two digits: {n}"),
                  Some(n) if n < 0 => format!("sensor error {n}"),
                  Some(n) => format!("large: {n}"),
                  None => String::from("no reading"),
              };
              println!("{text}");
          }
      }
      ```

      ```output
      one digit: 3
      two digits: 42
      sensor error -1
      large: 250
      no reading
      ```

      Without `@` you'd have to write `Some(n) if n >= 0 && n <= 9`, which is longer and easier to get wrong.

      With `|`, a guard applies to **all** the alternatives: `1 | 2 if urgent =>` means "(1 or 2) and urgent".

      ### Guards don't count for exhaustiveness

      The compiler checks patterns, but it doesn't try to prove things about your guard conditions. To it, these two arms might both be false:

      ```rust compile_fail
      fn main() {
          let n: i32 = 7;
          let sign = match n {
              x if x < 0 => "negative",
              x if x >= 0 => "zero or positive",
          };
          println!("{sign}");
      }
      ```

      ```error
      error[E0004]: non-exhaustive patterns: `i32::MIN..=i32::MAX` not covered
      ```

      The fix is to make the last arm unguarded: `_ => "zero or positive"`.

      ### Common mistakes

      - **A name where you meant a comparison.** This doesn't check `guess == target`; `target` is a brand-new variable that matches anything, so the first arm always runs (the compiler warns about it):

        ```rust
        match guess {
            target => println!("correct!"),
            _ => println!("try again"),
        }
        ```

        Write `g if g == target => ...` instead.
      - **Guarding every arm.** End with an unguarded arm so the match is exhaustive.

      **Your turn:** write `fn speed_check(speed: u32, limit: u32) -> String` using a `match` on `speed` with guards:

      - at or under the limit: `"ok"`
      - up to 10 km/h over: `"warning: N over"` (for example `"warning: 7 over"`)
      - more than 10 over: `"fine: N over"`
    seed: |
      fn speed_check(speed: u32, limit: u32) -> String {
          todo!()
      }
    solution: |
      fn speed_check(speed: u32, limit: u32) -> String {
          match speed {
              s if s <= limit => String::from("ok"),
              s if s <= limit + 10 => format!("warning: {} over", s - limit),
              s => format!("fine: {} over", s - limit),
          }
      }
    harness: |
      #[test]
      fn under_the_limit_is_ok() {
          assert_eq!(speed_check(42, 50), "ok", "speed_check(42, 50)");
      }

      #[test]
      fn exactly_the_limit_is_ok() {
          assert_eq!(speed_check(50, 50), "ok", "speed_check(50, 50)");
      }

      #[test]
      fn a_little_over_is_a_warning() {
          assert_eq!(speed_check(57, 50), "warning: 7 over", "speed_check(57, 50)");
          assert_eq!(speed_check(60, 50), "warning: 10 over", "speed_check(60, 50)");
      }

      #[test]
      fn more_than_10_over_is_a_fine() {
          assert_eq!(speed_check(61, 50), "fine: 11 over", "speed_check(61, 50)");
          assert_eq!(speed_check(130, 100), "fine: 30 over", "speed_check(130, 100)");
      }
    require:
      - pattern: '\bmatch\b'
        message: Use a `match` on the speed.
      - pattern: '\w+\s+if\s+.*=>'
        message: "Use match guards: `s if s <= limit => ...`"
    hints:
      - "The first arm is `s if s <= limit => String::from(\"ok\"),`"
      - "The second guard is `s if s <= limit + 10`. Compute how far over with `s - limit`."
      - "The last arm needs no guard: `s => format!(\"fine: {} over\", s - limit),`"
    more:
      - task: |
          Fill in the blank with an `@` binding so the first arm catches 1 to 5 tickets left and names the number `n`.
        fill: |
          fn stock_label(left: Option<u32>) -> String {
              match left {
                  Some([[n @]] 1..=5) => format!("only {n} left!"),
                  Some(0) => String::from("sold out"),
                  Some(n) => format!("{n} left"),
                  None => String::from("not on sale yet"),
              }
          }

          fn main() {
              for left in [Some(3), Some(0), Some(40), None] {
                  println!("{}", stock_label(left));
              }
          }
        hints:
          - "The syntax is `name @ pattern`, so the blank is the name followed by `@`."
        tests:
          - expect: "only 3 left!\nsold out\n40 left\nnot on sale yet"
      - task: |
          A smart thermostat reports `Option<i32>` (degrees Celsius, `None` when the sensor is offline). Write `fn room_status(temp: Option<i32>) -> String`:

          - `None`: `"sensor offline"`
          - 18 to 24 inclusive: `"comfortable at T"` (use an `@` binding)
          - below 18: `"too cold at T"` (use a guard)
          - anything else: `"too hot at T"`
        seed: |
          fn room_status(temp: Option<i32>) -> String {
              todo!()
          }
        solution: |
          fn room_status(temp: Option<i32>) -> String {
              match temp {
                  None => String::from("sensor offline"),
                  Some(t @ 18..=24) => format!("comfortable at {t}"),
                  Some(t) if t < 18 => format!("too cold at {t}"),
                  Some(t) => format!("too hot at {t}"),
              }
          }
        harness: |
          #[test]
          fn offline_sensor() {
              assert_eq!(room_status(None), "sensor offline", "room_status(None)");
          }

          #[test]
          fn comfortable_range_includes_both_ends() {
              assert_eq!(room_status(Some(18)), "comfortable at 18", "room_status(Some(18))");
              assert_eq!(room_status(Some(24)), "comfortable at 24", "room_status(Some(24))");
          }

          #[test]
          fn cold_including_below_zero() {
              assert_eq!(room_status(Some(17)), "too cold at 17", "room_status(Some(17))");
              assert_eq!(room_status(Some(-3)), "too cold at -3", "room_status(Some(-3))");
          }

          #[test]
          fn hot() {
              assert_eq!(room_status(Some(25)), "too hot at 25", "room_status(Some(25))");
          }
        require:
          - pattern: '@'
            message: "Use an `@` binding for the comfortable range: `Some(t @ 18..=24)`."
          - pattern: '\)\s*if\b'
            message: "Use a match guard for the cold case: `Some(t) if t < 18`."
        hints:
          - "`Some(t @ 18..=24) => format!(\"comfortable at {t}\"),`"
          - "`Some(t) if t < 18 => ...` then a final unguarded `Some(t) => ...`"

  - title: Destructuring structs and tuples
    id: patterns-3
    text: |
      **Destructuring** means taking a compound value apart into its pieces with a pattern. You've done it with tuples (`let (a, b) = pair;`). The same idea works for structs, and in every place a pattern can go: `let`, `match` arms, `for` loops and function parameters.

      ```rust run
      struct Point {
          x: i32,
          y: i32,
      }

      fn locate(p: &Point) -> String {
          match p {
              Point { x: 0, y: 0 } => String::from("at the origin"),
              Point { x: 0, y } => format!("on the y axis at {y}"),
              Point { x, y: 0 } => format!("on the x axis at {x}"),
              Point { x, y } => format!("at ({x}, {y})"),
          }
      }

      fn main() {
          let p = Point { x: 3, y: -7 };
          let Point { x, y } = p;
          println!("x = {x}, y = {y}");

          let Point { x: col, y: row } = p;
          println!("col {col}, row {row}");

          for q in [Point { x: 0, y: 0 }, Point { x: 0, y: 5 }, Point { x: 2, y: 0 }, p] {
              println!("{}", locate(&q));
          }
      }
      ```

      ```output
      x = 3, y = -7
      col 3, row -7
      at the origin
      on the y axis at 5
      on the x axis at 2
      at (3, -7)
      ```

      Piece by piece:

      - `let Point { x, y } = p;` is shorthand for `let Point { x: x, y: y } = p;`: it makes two variables named after the fields.
      - `Point { x: col, y: row }` binds the fields to new names. Read `x: col` as "field `x` goes into `col`".
      - In a `match`, a field can hold any pattern: `x: 0` only matches when `x` is zero, while plain `y` binds whatever is there.
      - `locate` matches on a **reference** (`&Point`). Rust then makes the bindings references too (`y` is a `&i32`), so nothing is moved out of the borrowed struct. Printing works the same; for arithmetic or comparisons you may need `*y`.

      ### Matching on several values at once

      Put values in a tuple and match on the tuple. This replaces nested `if`s when a decision depends on two things:

      ```rust run
      fn main() {
          for n in 9..=15 {
              let text = match (n % 3, n % 5) {
                  (0, 0) => String::from("FizzBuzz"),
                  (0, _) => String::from("Fizz"),
                  (_, 0) => String::from("Buzz"),
                  _ => n.to_string(),
              };
              print!("{text} ");
          }
          println!();
      }
      ```

      ```output
      Fizz Buzz 11 Fizz 13 14 FizzBuzz
      ```

      `(0, _)` means "first part is 0, second part is anything".

      ### Ignoring fields with `..`

      `..` means "and the rest, which I don't care about". It keeps patterns short when a struct has many fields:

      ```rust
      let Order { id, total, .. } = order;      // ignore every other field
      let (first, ..) = (1, 2, 3, 4);           // just the first element
      ```

      ### Common mistakes

      - **Leaving out a field.** A struct pattern must mention every field, or end with `..`:

        ```rust compile_fail
        struct Point {
            x: i32,
            y: i32,
        }

        fn main() {
            let p = Point { x: 1, y: 2 };
            let Point { x } = p;
            println!("{x}");
        }
        ```

        ```error
        error[E0027]: pattern does not mention field `y`
        ```

        Write `let Point { x, .. } = p;`.
      - **Wrong tuple size.** `let (a, b) = (1, 2, 3);` fails with `mismatched types`; the pattern must have the same number of parts (or use `..`).

      **Your turn:** finish this rock-paper-scissors referee. Each input line holds two moves (`rock`, `paper` or `scissors`). Match on the tuple `(moves[0], moves[1])` and print `player 1`, `player 2` or `draw` for each line. String literals work as patterns: `("rock", "scissors") => ...`. Rock beats scissors, scissors beat paper, paper beats rock.
    seed: |
      use std::io::{self, BufRead};

      fn main() {
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let moves: Vec<&str> = line.split_whitespace().collect();
              // match on (moves[0], moves[1]) and print the winner
          }
      }
    solution: |
      use std::io::{self, BufRead};

      fn main() {
          for line in io::stdin().lock().lines() {
              let line = line.expect("could not read a line");
              let moves: Vec<&str> = line.split_whitespace().collect();
              // match on (moves[0], moves[1]) and print the winner
              let result = match (moves[0], moves[1]) {
                  (a, b) if a == b => "draw",
                  ("rock", "scissors") | ("scissors", "paper") | ("paper", "rock") => "player 1",
                  _ => "player 2",
              };
              println!("{result}");
          }
      }
    tests:
      - stdin: "rock scissors\npaper scissors\nrock rock\n"
        expect: "player 1\nplayer 2\ndraw"
      - stdin: "scissors paper\npaper rock\nscissors rock\npaper paper\n"
        hidden: true
    require:
      - pattern: 'match\s*\(\s*moves\[0\]\s*,\s*moves\[1\]\s*\)'
        message: "Match on the tuple `(moves[0], moves[1])`."
    hints:
      - "Start with `(a, b) if a == b => \"draw\",` to handle equal moves."
      - "List the three winning pairs for player 1 in one arm with `|`: `(\"rock\", \"scissors\") | (\"scissors\", \"paper\") | (\"paper\", \"rock\")`."
      - "Everything else means player 2 won: `_ => \"player 2\"`."
    more:
      - task: |
          Write `fn summary(order: &Order) -> String` using struct patterns:

          - quantity 0: `"order ID: empty"`
          - express orders: `"order ID: TOTAL cents (express)"`, where TOTAL is `quantity * unit_cents + 500`
          - other orders: `"order ID: TOTAL cents"`, where TOTAL is `quantity * unit_cents`

          Because you match on `&Order`, the bound fields are references; `quantity * unit_cents` still works on them.
        seed: |
          struct Order {
              id: u32,
              quantity: u32,
              unit_cents: u32,
              express: bool,
          }

          fn summary(order: &Order) -> String {
              todo!()
          }
        solution: |
          struct Order {
              id: u32,
              quantity: u32,
              unit_cents: u32,
              express: bool,
          }

          fn summary(order: &Order) -> String {
              match order {
                  Order { id, quantity: 0, .. } => format!("order {id}: empty"),
                  Order { id, quantity, unit_cents, express: true } => {
                      format!("order {id}: {} cents (express)", quantity * unit_cents + 500)
                  }
                  Order { id, quantity, unit_cents, express: false } => {
                      format!("order {id}: {} cents", quantity * unit_cents)
                  }
              }
          }
        harness: |
          #[test]
          fn empty_order() {
              let o = Order { id: 7, quantity: 0, unit_cents: 250, express: true };
              assert_eq!(summary(&o), "order 7: empty", "summary of an order with quantity 0");
          }

          #[test]
          fn express_order_adds_500() {
              let o = Order { id: 12, quantity: 3, unit_cents: 250, express: true };
              assert_eq!(summary(&o), "order 12: 1250 cents (express)", "summary of 3 x 250, express");
          }

          #[test]
          fn normal_order() {
              let o = Order { id: 13, quantity: 4, unit_cents: 99, express: false };
              assert_eq!(summary(&o), "order 13: 396 cents", "summary of 4 x 99");
          }
        require:
          - pattern: 'Order\s*\{[^}]*\.\.'
            message: "Use `..` in a struct pattern to skip the fields you don't need."
        hints:
          - "The first arm: `Order { id, quantity: 0, .. } => format!(\"order {id}: empty\"),`"
          - "The express arm lists the fields it needs and `express: true`: `Order { id, quantity, unit_cents, express: true } => ...`"
      - task: |
          Write `fn quadrant(point: (i32, i32)) -> &'static str` from scratch. Match on the tuple:

          - `(0, 0)`: `"origin"`
          - x is 0: `"y axis"`; y is 0: `"x axis"`
          - otherwise `"I"`, `"II"`, `"III"` or `"IV"`: I is x and y positive, II is x negative and y positive, III both negative, IV x positive and y negative.
        seed: |
