          - stdin: "Hello, World\n"
            hidden: true
      - task: |
          Write the whole program: read a username, then print it (trimmed) and its length in **characters**:

          ```
          user: ferris
          length: 6
          ```

          Some tests use names with accents, where bytes and characters differ.
        seed: |
          use std::io;

          fn main() {
              // read a line, then print "user: ..." and "length: ..."
          }
        solution: |
