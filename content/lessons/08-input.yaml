  - title: "From text to numbers: parse"
    id: input-2
    text: |
      Input always arrives as **text**. When a user types `41`, your program receives the characters `'4'` and `'1'` (and a newline), not the number 41. To do math, convert the text with **`parse`**:

      ```rust run
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          let age: u32 = line.trim().parse().expect("please type a whole number");
          println!("Next year you'll be {}", age + 1);
      }
      ```

      ```input
      41
      ```

      ```output
      Next year you'll be 42
      ```

      - `.parse()` turns text into a value. It can produce many types (`i32`, `u8`, `f64`, even `bool`), so it needs to know which one you want. Here the annotation on `let age: u32` tells it.
      - You can also name the type on the method itself with the **turbofish** `::<>`: `line.trim().parse::<u32>()`. It's handy when there's no variable annotation to go by.
      - Parsing can fail (`abc`, `4 2`, or `-5` for a `u32`), so `parse` returns a `Result` too, and `.expect(...)` stops the program with your message if the text isn't a valid number.
      - **`trim()` is essential**: `"41\n"` is not a number, `"41"` is.

      Here's what happens without `trim`:

      ```rust panics
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          println!("read {:?}", line);
          let n: i32 = line.parse().expect("not a number");
          println!("{n}");
      }
      ```

      ```input
      41
      ```

      ```output
      read "41\n"
      ```

      The program panics, and the message starts with your text, followed by the reason:

      ```text
      not a number: ParseIntError { kind: InvalidDigit }
      ```

      The newline counts as an invalid digit. That's why `expect` messages should say what was expected: it's the first thing you (or a teammate reading a crash report) will see.

      ### The shadowing idiom

      Reading into a `String` and then parsing into a variable with the same name is very common Rust. It's how the official Rust book's guessing game does it:

      ```rust run
      use std::io;

      fn main() {
          let mut guess = String::new();
          io::stdin().read_line(&mut guess).expect("failed to read a line");
          let guess: u32 = guess.trim().parse().expect("please type a number");
          println!("You guessed {guess}, doubled that's {}", guess * 2);
      }
      ```

      ```input
      21
      ```

      ```output
      You guessed 21, doubled that's 42
      ```

      The text version isn't needed after parsing, so the number takes over its name.

      ### Decimals

      Parse into `f64` for numbers with a fractional part: `"3.5"` works, and so does `"7"`. The decimal separator must be a point: `"3,5"` fails. Parsing `"3.5"` into an integer type fails too.

      ### Common mistakes

      - **Not saying which type to produce:**

      ```rust compile_fail
      fn main() {
          let n = "42".trim().parse().expect("not a number");
          println!("{n}");
      }
      ```

      ```error
      error[E0284]: type annotations needed
      ```

      Fix: `let n: i32 = ...` or `.parse::<i32>()`.
      - **Forgetting `.expect`**: `let n: i32 = line.trim().parse();` gives ``expected `i32`, found `Result<_, _>` ``. The `Result` must be unwrapped first, and the help line suggests `.expect(...)`.
      - **A type that doesn't fit the data.** `"-3"` doesn't parse as `u32` (no minus sign allowed), and `"300"` doesn't fit in a `u8` (`number too large to fit in target type`). Use `i32` or `i64` when values can be negative, `f64` for decimals.

      **Your turn:** the program reads a temperature in Celsius (it may have decimals and may be negative). Parse it as an `f64`, convert it to Fahrenheit with F = C × 9 / 5 + 32, and print both: the Celsius value with a plain `{}` (so `0` prints as `0`) and the Fahrenheit value with one decimal (`{:.1}`):

      ```
      21.5 C = 70.7 F
      ```
    seed: |
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          // parse the line into an f64, convert, and print: 21.5 C = 70.7 F
      }
    solution: |
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          // parse the line into an f64, convert, and print: 21.5 C = 70.7 F
          let celsius: f64 = line.trim().parse().expect("not a number");
          let fahrenheit = celsius * 9.0 / 5.0 + 32.0;
          println!("{celsius} C = {fahrenheit:.1} F");
      }
    require:
      - pattern: '\.parse'
        message: "Convert the text with `.parse()`."
    hints:
      - "`let celsius: f64 = line.trim().parse().expect(\"not a number\");`"
      - "Use float literals in the formula: `celsius * 9.0 / 5.0 + 32.0`."
      - "Print with `println!(\"{celsius} C = {fahrenheit:.1} F\");`"
    tests:
      - stdin: "21.5\n"
        expect: "21.5 C = 70.7 F"
      - stdin: "0\n"
      - stdin: "-40\n"
        hidden: true
      - stdin: "36.6\n"
        hidden: true
    more:
      - task: |
          Read a number of minutes (a whole number) and print it as hours and minutes:

          ```
          135 minutes = 2 h 15 min
          ```
        seed: |
          use std::io;

          fn main() {
          }
        solution: |
          use std::io;

          fn main() {
              let mut line = String::new();
              io::stdin().read_line(&mut line).expect("failed to read a line");
              let minutes: u32 = line.trim().parse().expect("not a whole number");
              println!("{minutes} minutes = {} h {} min", minutes / 60, minutes % 60);
          }
        hints:
          - "Read the line, then `let minutes: u32 = line.trim().parse().expect(\"not a whole number\");`"
          - "Hours are `minutes / 60`, the rest is `minutes % 60`."
        tests:
          - stdin: "135\n"
            expect: "135 minutes = 2 h 15 min"
          - stdin: "59\n"
          - stdin: "60\n"
            hidden: true
          - stdin: "0\n"
            hidden: true
      - task: |
          Read a year and say whether it's a leap year. A year is a leap year if it's divisible by 4, except years divisible by 100, which are leap years only if they're also divisible by 400. Print a line like `2024 is a leap year` or `1900 is not a leap year`, with the year that was read.
        seed: |
          use std::io;

          fn main() {
          }
        solution: |
          use std::io;

          fn main() {
              let mut line = String::new();
              io::stdin().read_line(&mut line).expect("failed to read a line");
              let year: u32 = line.trim().parse().expect("not a year");
              let leap = (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;
              if leap {
                  println!("{year} is a leap year");
              } else {
                  println!("{year} is not a leap year");
              }
          }
        hints:
          - "Read and parse the year as a whole number first."
          - "The rule as one bool: `(year % 4 == 0 && year % 100 != 0) || year % 400 == 0`."
        tests:
          - stdin: "2024\n"
            expect: "2024 is a leap year"
          - stdin: "1900\n"
            expect: "1900 is not a leap year"
          - stdin: "2000\n"
            hidden: true
          - stdin: "2023\n"
            hidden: true

  - title: Reading several lines
    id: input-3
    text: |
      Each call to `read_line` reads the **next** line. To read two values, call it twice:

      ```rust run
      use std::io;

      fn main() {
          let mut name = String::new();
          io::stdin().read_line(&mut name).expect("failed to read a line");

          let mut age = String::new();
          io::stdin().read_line(&mut age).expect("failed to read a line");
          let age: u32 = age.trim().parse().expect("age must be a whole number");

          println!("{} is {} years old", name.trim(), age);
      }
      ```

      ```input
      Ana
      29
      ```

      ```output
      Ana is 29 years old
      ```

      ### read_line appends

      You might try to reuse one `String` for every line. Remember that `read_line` **adds** to what's already in the `String`:

      ```rust run
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          io::stdin().read_line(&mut line).expect("failed to read a line");
          println!("{:?}", line);

          line.clear();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          println!("{:?}", line);
      }
      ```

      ```input
      3
      4
      5
      ```

      ```output
      "3\n4\n"
      "5\n"
      ```

      After two reads the `String` holds both lines, and parsing `"3\n4"` fails. **`line.clear()`** empties the `String` (keeping its memory for reuse) so the next read starts fresh.

      ### A helper function

      Reading one number takes three lines. When you need it several times, put them in a function:

      ```rust run
      use std::io;

      fn read_number() -> i64 {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          line.trim().parse().expect("not a whole number")
      }

      fn main() {
          let a = read_number();
          let b = read_number();
          println!("{a} + {b} = {}", a + b);
      }
      ```

      ```input
      7
      35
      ```

      ```output
      7 + 35 = 42
      ```

      - There's no type annotation on `parse` here: the function's return type `i64` tells it what to produce.
      - Each call creates a fresh `String`, so there's nothing to clear.
      - Small helpers like this keep `main` readable. That's what teams expect in code review: name the repeated thing once.

      ### A count, then that many lines

      A very common input format puts the number of items on the first line:

      ```rust run
      use std::io;

      fn read_number() -> i64 {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          line.trim().parse().expect("not a whole number")
      }

      fn main() {
          let n = read_number();
          let mut total = 0;
          for _ in 0..n {
              total += read_number();
          }
          println!("total of {n} numbers: {total}");
      }
      ```

      ```input
      3
      10
      20
      12
      ```

      ```output
      total of 3 numbers: 42
      ```

      ### Common mistakes

      - **Reusing a `String` without `clear()`**: the second value is glued to the first.
      - **Reading past the end of the input.** When there are no more lines, `read_line` reads nothing and leaves the `String` empty, so parsing fails and the panic message ends with `ParseIntError { kind: Empty }`.
      - **Reading in the wrong order.** Lines come in the order they were typed; read them in the same order the input format describes.

      **Your turn:** read two whole numbers, one per line (they may be negative), and print their sum, difference (first minus second) and product:

      ```
      sum: 12
      difference: 4
      product: 32
      ```
    seed: |
      use std::io;

      fn main() {
          // read two whole numbers, one per line
      }
    solution: |
      use std::io;

      fn read_number() -> i64 {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          line.trim().parse().expect("not a whole number")
      }

      fn main() {
          // read two whole numbers, one per line
          let a = read_number();
          let b = read_number();
          println!("sum: {}", a + b);
          println!("difference: {}", a - b);
          println!("product: {}", a * b);
      }
    hints:
      - "Read two lines into two separate Strings (or clear one between reads), and parse each with `.trim().parse()`."
      - "Use `i64` so negative numbers work. A `read_number()` helper function saves repeating yourself."
    tests:
      - stdin: "8\n4\n"
        expect: "sum: 12\ndifference: 4\nproduct: 32"
      - stdin: "-3\n10\n"
        hidden: true
      - stdin: "0\n0\n"
        hidden: true
    more:
