      fn main() {
      }
    solution: |
      use std::io;

      fn main() {
          let input = io::read_to_string(io::stdin()).expect("failed to read input");
          let mut total = 0;
          let mut count = 0;
          for word in input.split_whitespace() {
              let n: i64 = word.parse().expect("not a number");
              total += n;
              count += 1;
          }
          if count == 0 {
              println!("no numbers");
          } else {
              println!("average: {:.2}", total as f64 / count as f64);
          }
      }
    require:
