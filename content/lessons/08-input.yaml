      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
      }
    solution: |
      use std::io;

      fn main() {
          let mut line = String::new();
          io::stdin().read_line(&mut line).expect("failed to read a line");
          let mut nums = Vec::new();
          for part in line.split_whitespace() {
              let n: u32 = part.parse().expect("not a number");
              nums.push(n);
          }
          let width = nums[0];
          let height = nums[1];
          println!("area: {}", width * height);
          println!("perimeter: {}", 2 * (width + height));
      }
