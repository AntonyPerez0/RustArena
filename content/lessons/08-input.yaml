          fn main() {
              let mut line = String::new();
              io::stdin().read_line(&mut line).expect("failed to read a line");
              let text = line.trim();
              match text.parse::<u32>() {
                  Ok(age) => println!("next year: {}", age + 1),
                  Err(_) => println!("invalid age: {text}"),
              }
          }
        require:
          - pattern: '\bmatch\b'
            message: "Use `match` on the result of `parse`."
        hints:
          - "Trim the line first and keep it in a variable, so you can print it in the error case."
          - "Parse as `u32` (a negative age is then invalid automatically): `match text.parse::<u32>() { Ok(age) => ..., Err(_) => ... }`"
        tests:
          - stdin: "30\n"
            expect: "next year: 31"
          - stdin: "abc\n"
            expect: "invalid age: abc"
          - stdin: "-3\n"
            hidden: true
          - stdin: " 7 \n"
            hidden: true
      - task: |
          A guessing game with a fixed secret number, 7. Read guesses one per line until the end of the input. For each line:

          - not a whole number → `not a number: <the trimmed text>` (it doesn't count as a guess)
          - too small → `too low`, too big → `too high`
          - correct → `correct! guesses: <number of valid guesses>`, then stop reading

          If the input ends without a correct guess, print `out of guesses`.
        seed: |
          use std::io;

          fn main() {
              let secret = 7;
          }
        solution: |
          use std::io;

          fn main() {
              let secret = 7;
              let mut guesses = 0;
              let mut won = false;
              for line in io::stdin().lines() {
                  let line = line.expect("failed to read a line");
                  let text = line.trim();
                  let guess: i32 = match text.parse() {
                      Ok(n) => n,
                      Err(_) => {
                          println!("not a number: {text}");
                          continue;
                      }
                  };
                  guesses += 1;
                  if guess < secret {
                      println!("too low");
                  } else if guess > secret {
                      println!("too high");
                  } else {
                      println!("correct! guesses: {guesses}");
                      won = true;
                      break;
                  }
              }
              if !won {
                  println!("out of guesses");
              }
          }
        require:
          - pattern: '\bmatch\b'
            message: "Use `match` on the result of `parse` so that bad lines don't crash the game."
        hints:
          - "Loop over `io::stdin().lines()`. Use `let guess: i32 = match text.parse() { Ok(n) => n, Err(_) => { ...; continue; } };`"
          - "Count only valid guesses. On a correct guess, print and `break`."
          - "Remember whether the player won (`let mut won = false;`) so you know whether to print `out of guesses` after the loop."
        tests:
          - stdin: "3\nabc\n9\n7\n"
            expect: "too low\nnot a number: abc\ntoo high\ncorrect! guesses: 3"
          - stdin: "7\n5\n"
            hidden: true
          - stdin: "1\n2\n"
            hidden: true
          - stdin: "\n7\n"
            hidden: true
