          // struct Labeled<T> ...
          struct Labeled<T> {
              label: String,
              value: T,
          }

          // fn label_all ...
          fn label_all<T>(label: &str, values: Vec<T>) -> Vec<Labeled<T>> {
              let mut out = Vec::new();
