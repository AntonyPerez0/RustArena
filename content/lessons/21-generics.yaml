id: generics
title: Generics
phase: "Errors and abstraction"
summary: "Write a function or a type once and use it with many types. Generic functions, trait bounds like T: PartialOrd + Copy, generic structs, enums and impl blocks, why generics cost nothing at run time, and const generics for arrays of any length."
roadmap: ["Traits & Generics", Trait Bounds and Associated Types]
steps:
  - title: Generic functions
    id: generics-1
    text: |
      Say you need the last element of a list of scores, then of a list of names, then of a list of prices. Without generics you'd write three functions with identical bodies:

      ```rust
      fn last_i32(items: &[i32]) -> Option<&i32> { ... }
      fn last_str(items: &[&str]) -> Option<&&str> { ... }
      fn last_f64(items: &[f64]) -> Option<&f64> { ... }
      ```

      **Generics** let you write it once, with a placeholder for the type:

      ```rust run
      fn last<T>(items: &[T]) -> Option<&T> {
          if items.is_empty() {
              None
          } else {
              Some(&items[items.len() - 1])
          }
      }

      fn swap<A, B>(pair: (A, B)) -> (B, A) {
          (pair.1, pair.0)
      }

      fn main() {
          let scores = [88, 92, 75];
          let names = vec!["ana", "bo"];
          let empty: [f64; 0] = [];
          println!("{:?}", last(&scores));
          println!("{:?}", last(&names));
          println!("{:?}", last(&empty));
          println!("{:?}", swap(("crab", 8)));
      }
      ```

      ```output
      Some(75)
      Some("bo")
      None
      (8, "crab")
      ```

      Piece by piece:

      - `<T>` right after the function name declares a **type parameter** called `T`. Inside the function, `T` is used like any type: `&[T]` is "a slice of T", `Option<&T>` "maybe a reference to a T".
      - At each call, the compiler works out what `T` is from the arguments: `i32` for `scores`, `&str` for `names`, `f64` for `empty`. You don't write it.
      - A function can have several type parameters, separated by commas. In `swap<A, B>`, the two halves of the pair can be different types.
      - `last` works for *any* `T` because it never does anything with the values except hand out references. It doesn't compare them, add them or print them. The next step shows what happens when you need to.

      You've been using generic code all along: `Vec<T>`, `Option<T>`, `Result<T, E>` and `HashMap<K, V>` are generic types, and slice methods like `.last()` and `.first()` are generic functions.

      **Naming:** type parameters are usually single capital letters: `T` for "type", `U` for a second one, `K`/`V` for keys and values, `E` for errors. A descriptive name like `Item` is fine when it reads better.

      ### Common mistakes

      - **Forgetting to declare the parameter.** Using `T` without `<T>` after the function name:

      ```rust compile_fail
      fn last(items: &[T]) -> Option<&T> {
          items.last()
      }

      fn main() {
          println!("{:?}", last(&[1, 2]));
      }
      ```

      ```error
      error[E0425]: cannot find type `T` in this scope
        | fn last(items: &[T]) -> Option<&T> {
        |                  ^ not found in this scope
        help: you might be missing a type parameter
      ```

      - **One parameter for two different types.** In `fn pair<T>(a: T, b: T)`, both arguments are the *same* `T`, so `pair(1, "two")` is `mismatched types: expected integer, found &str`. If they may differ, use two parameters: `fn pair<A, B>(a: A, b: B)`.
      - **Writing a generic function too early.** Generic code is a little harder to read. If you only ever call a function with `i32`, write it for `i32`. Make it generic when a second real use shows up.

      **Your turn:** fill in the blanks so `middle` works for slices of any type. It returns the element in the middle (at index `len / 2`), or `None` for an empty slice. The program prints:

      ```
      Some(3)
      Some("green")
      Some('y')
      None
      ```
    fill: |
      fn middle<[[T]]>(items: &[T]) -> Option<&[[T]]> {
          if items.is_empty() {
              None
          } else {
              Some(&items[items.len() / 2])
          }
      }

      fn main() {
          println!("{:?}", middle(&[1, 2, 3, 4, 5]));
          println!("{:?}", middle(&["red", "green", "blue"]));
          println!("{:?}", middle(&['x', 'y']));
          let none: [u8; 0] = [];
          println!("{:?}", middle(&none));
      }
    hints:
      - The type parameter is declared between `<` and `>` after the function name.
      - The return type is a reference to one element, and the elements have type `T`.
    tests:
      - expect: "Some(3)\nSome(\"green\")\nSome('y')\nNone"
    more:
      - task: |
          Write `fn last_two<T>(items: &[T]) -> Option<(&T, &T)>` that returns references to the last two elements, in order, or `None` if there are fewer than two. For `[1, 2, 3]` it returns `Some((&2, &3))`.
        seed: |
          fn last_two<T>(items: &[T]) -> Option<(&T, &T)> {
              todo!()
          }
        solution: |
          fn last_two<T>(items: &[T]) -> Option<(&T, &T)> {
              let n = items.len();
              if n < 2 {
                  return None;
              }
              Some((&items[n - 2], &items[n - 1]))
          }
        hints:
          - "Check `items.len() < 2` first and return `None`."
          - "Otherwise `Some((&items[n - 2], &items[n - 1]))` with `let n = items.len();`."
        harness: |
          #[test]
          fn returns_the_last_two_numbers() {
              assert_eq!(last_two(&[1, 2, 3]), Some((&2, &3)), "last_two(&[1, 2, 3])");
          }

          #[test]
          fn works_with_strings() {
              let words = vec![String::from("ready"), String::from("set"), String::from("go")];
              assert_eq!(last_two(&words), Some((&words[1], &words[2])), "last_two(&[\"ready\", \"set\", \"go\"])");
          }

          #[test]
          fn works_with_exactly_two() {
              assert_eq!(last_two(&['a', 'b']), Some((&'a', &'b')), "last_two(&['a', 'b'])");
          }

          #[test]
          fn needs_at_least_two() {
              assert_eq!(last_two(&[7]), None, "last_two(&[7])");
              let empty: [f64; 0] = [];
              assert_eq!(last_two(&empty), None, "last_two(&[])");
          }
      - task: |
          Write a generic function from scratch: `reverse_in_place`, which takes a mutable slice of any type and reverses it in place. Use `items.swap(i, j)`, which swaps two elements of a slice, and don't call `.reverse()`. It must work for numbers and for `String`s, and do nothing for an empty slice.
        seed: |
          // fn reverse_in_place ...
        solution: |
          // fn reverse_in_place ...
          fn reverse_in_place<T>(items: &mut [T]) {
              let n = items.len();
              for i in 0..n / 2 {
                  items.swap(i, n - 1 - i);
              }
          }
        forbid:
          - pattern: '\.reverse\(\)'
            message: Do it yourself with `swap` instead of `.reverse()`.
        hints:
          - "The signature is `fn reverse_in_place<T>(items: &mut [T])`."
          - "Swap the first and last, the second and second-to-last, and so on: `for i in 0..n / 2 { items.swap(i, n - 1 - i); }`."
        harness: |
          #[test]
          fn reverses_numbers() {
              let mut v = [1, 2, 3, 4, 5];
              reverse_in_place(&mut v);
              assert_eq!(v, [5, 4, 3, 2, 1], "after reverse_in_place(&mut [1, 2, 3, 4, 5])");
          }

          #[test]
          fn reverses_an_even_number_of_items() {
              let mut v = vec!['a', 'b', 'c', 'd'];
              reverse_in_place(&mut v);
              assert_eq!(v, vec!['d', 'c', 'b', 'a'], "after reverse_in_place(&mut ['a', 'b', 'c', 'd'])");
          }

          #[test]
          fn reverses_strings() {
              let mut v = vec![String::from("first"), String::from("second")];
              reverse_in_place(&mut v);
              assert_eq!(v, vec![String::from("second"), String::from("first")], "after reverse_in_place on two Strings");
          }

          #[test]
          fn leaves_empty_and_single_slices_alone() {
              let mut empty: Vec<i32> = Vec::new();
              reverse_in_place(&mut empty);
              assert_eq!(empty, Vec::<i32>::new(), "after reverse_in_place on an empty Vec");
              let mut one = [42];
              reverse_in_place(&mut one);
              assert_eq!(one, [42], "after reverse_in_place(&mut [42])");
          }

  - title: "Trait bounds: what T is allowed to do"
    id: generics-2
    text: |
      Now a function that finds the largest element:

      ```rust compile_fail
      fn largest<T>(items: &[T]) -> T {
          let mut best = items[0];
          for &item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }

      fn main() {
          println!("{}", largest(&[1, 5, 2]));
      }
      ```

      ```error
      error[E0369]: binary operation `>` cannot be applied to type `T`
        help: consider restricting type parameter `T` with trait `PartialOrd`
      ```

      Inside a generic function, the compiler only allows what works for **every** possible `T`, and not every type can be compared with `>`. (How would you order two bank accounts, or two colors?) So you must say what `T` needs to be able to do.

      Each capability is a **trait**: a named set of operations a type can support. Module 22 shows how to write your own; for now you only need to *use* a few from the standard library. A **trait bound** like `T: PartialOrd` restricts `T` to types that have that capability:

      | Bound | Lets you |
      |---|---|
      | `PartialEq` | compare with `==` and `!=` |
      | `PartialOrd` | compare with `<`, `>`, `<=`, `>=` |
      | `Copy` | copy values (`let x = items[0];`) instead of moving them: numbers, `char`, `bool` |
      | `Clone` | call `.clone()` |
      | `Display` | print with `{}` (it's `std::fmt::Display`) |
      | `Debug` | print with `{:?}` (it's `std::fmt::Debug`) |

      Several bounds are joined with `+`:

      ```rust run
      fn largest<T: PartialOrd + Copy>(items: &[T]) -> T {
          let mut best = items[0];
          for &item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }

      fn largest_ref<T: PartialOrd>(items: &[T]) -> &T {
          let mut best = &items[0];
          for item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }

      fn main() {
          println!("{}", largest(&[34, 50, 25, 100, 65]));
          println!("{}", largest(&[1.5, -2.0, 0.25]));
          println!("{}", largest(&['r', 'u', 's', 't']));
          let names = vec![String::from("ana"), String::from("zoe"), String::from("bo")];
          println!("{}", largest_ref(&names));
      }
      ```

      ```output
      100
      1.5
      u
      zoe
      ```

      - `T: PartialOrd` makes `item > best` legal.
      - `T: Copy` makes `let mut best = items[0];` and `for &item in items` legal: both *copy* an element out of the slice. A `String` can't be copied, only moved, and you can't move out of a borrowed slice.
      - `largest_ref` avoids needing `Copy` by returning a *reference* to the largest element. That's why it works for `String`s too. Fewer bounds means more types can use your function.
      - Every type in the calls satisfies the bounds: integers, floats and `char`s can all be compared and copied.

      (Both versions panic on an empty slice, at `items[0]`. A more careful version returns an `Option`: that's one of the exercises.)

      ### Display and Debug bounds

      To print a `T`, require the matching trait:

      ```rust run
      use std::fmt::{Debug, Display};

      fn announce<T: Display>(label: &str, value: T) {
          println!("{label}: {value}");
      }

      fn log_all<T: Debug>(items: &[T]) {
          for item in items {
              println!("[log] {item:?}");
          }
      }

      fn main() {
          announce("winner", "Ferris");
          announce("score", 9001);
          announce("ratio", 0.75);
          log_all(&[Some(1), None]);
      }
      ```

      ```output
      winner: Ferris
      score: 9001
      ratio: 0.75
      [log] Some(1)
      [log] None
      ```

      When bounds get long, Rust also lets you list them after the signature in a `where` clause (`fn largest<T>(items: &[T]) -> T where T: PartialOrd + Copy`). Module 22 covers `where`, writing your own traits, and more.

      ### Common mistakes

      - **A missing `Copy` bound.** With only `T: PartialOrd`, the first version fails at `items[0]`:

      ```rust compile_fail
      fn largest<T: PartialOrd>(items: &[T]) -> T {
          let mut best = items[0];
          for &item in items {
              if item > best {
                  best = item;
              }
          }
          best
      }

      fn main() {
          println!("{}", largest(&[1, 5, 2]));
      }
      ```

      ```error
      error[E0508]: cannot move out of type `[T]`, a non-copy slice
      ```

      - **Calling with a type that doesn't meet the bound.** `largest(&names)` with `String`s gives ``the trait bound `String: Copy` is not satisfied``. The function's bounds are a promise the caller has to keep. Use `largest_ref` instead.
      - **Printing a `T` without a bound.** `println!("{x}")` with an unbounded `T` gives `` `T` doesn't implement `std::fmt::Display` ``. Add `T: Display` (and `use std::fmt::Display;`).

      **Your turn:** write `clamp`, which keeps a value between a lower and an upper limit: below `low` it returns `low`, above `high` it returns `high`, otherwise the value itself. Add the trait bound `T` needs. It should work for numbers, `char`s and `&str`s.
    seed: |
      // Add the trait bound that makes < and > work.
      fn clamp<T>(value: T, low: T, high: T) -> T {
          todo!()
      }
    solution: |
      // Add the trait bound that makes < and > work.
      fn clamp<T: PartialOrd>(value: T, low: T, high: T) -> T {
          if value < low {
              low
          } else if value > high {
              high
          } else {
              value
          }
      }
    require:
      - pattern: 'PartialOrd'
        message: "`T` needs the `PartialOrd` bound to be compared with `<` and `>`."
    hints:
      - "The bound goes in the angle brackets: `fn clamp<T: PartialOrd>(...)`."
      - "`if value < low { low } else if value > high { high } else { value }`"
      - "No `Copy` is needed: the function owns its three arguments and returns one of them."
    harness: |
      #[test]
      fn keeps_a_value_in_range() {
          assert_eq!(clamp(5, 0, 10), 5, "clamp(5, 0, 10)");
      }

      #[test]
      fn raises_a_low_value() {
          assert_eq!(clamp(-3, 0, 10), 0, "clamp(-3, 0, 10)");
      }

      #[test]
      fn lowers_a_high_value() {
          assert_eq!(clamp(42, 0, 10), 10, "clamp(42, 0, 10)");
      }

      #[test]
      fn works_with_floats() {
          assert_eq!(clamp(1.7, 0.0, 1.0), 1.0, "clamp(1.7, 0.0, 1.0)");
      }

      #[test]
      fn works_with_chars_and_strs() {
          assert_eq!(clamp('z', 'a', 'm'), 'm', "clamp('z', 'a', 'm')");
          assert_eq!(clamp("pear", "apple", "mango"), "mango", "clamp(\"pear\", \"apple\", \"mango\")");
      }
    more:
      - task: |
          Write `fn smallest<T: PartialOrd + Copy>(items: &[T]) -> Option<T>`: the smallest element, or `None` for an empty slice (no panic).
        seed: |
          fn smallest<T: PartialOrd + Copy>(items: &[T]) -> Option<T> {
              todo!()
          }
        solution: |
          fn smallest<T: PartialOrd + Copy>(items: &[T]) -> Option<T> {
              if items.is_empty() {
                  return None;
              }
              let mut best = items[0];
              for &item in items {
                  if item < best {
                      best = item;
                  }
              }
              Some(best)
          }
        hints:
          - "Return `None` early if `items.is_empty()`."
          - "Then it's `largest` with `<` instead of `>`, wrapped in `Some(...)` at the end."
        harness: |
          #[test]
          fn finds_the_smallest_number() {
              assert_eq!(smallest(&[34, 50, 25, 100, 65]), Some(25), "smallest(&[34, 50, 25, 100, 65])");
          }

          #[test]
          fn works_with_negative_floats() {
              assert_eq!(smallest(&[1.5, -2.0, 0.25]), Some(-2.0), "smallest(&[1.5, -2.0, 0.25])");
          }

          #[test]
          fn works_with_chars() {
              assert_eq!(smallest(&['r', 'u', 's', 't']), Some('r'), "smallest(&['r', 'u', 's', 't'])");
          }

          #[test]
          fn empty_slice_gives_none() {
              let empty: [i32; 0] = [];
              assert_eq!(smallest(&empty), None, "smallest(&[])");
          }
      - task: |
          Write `join_all`, which turns a slice of anything printable into one `String`, with `separator` between the items: `join_all(&[1, 2, 3], ", ")` is `"1, 2, 3"`. Add the bound it needs (and the `use` line for it). An empty slice gives `""`.
        seed: |
          fn join_all<T>(items: &[T], separator: &str) -> String {
              todo!()
          }
        solution: |
          use std::fmt::Display;

          fn join_all<T: Display>(items: &[T], separator: &str) -> String {
              let mut out = String::new();
              let mut first = true;
              for item in items {
                  if !first {
                      out.push_str(separator);
                  }
                  out.push_str(&item.to_string());
                  first = false;
              }
              out
          }
        require:
          - pattern: 'Display'
            message: "`T` needs the `Display` bound so its items can be turned into text."
        hints:
          - "`use std::fmt::Display;` and then `fn join_all<T: Display>(...)`."
          - "With `Display`, `item.to_string()` works (or `format!(\"{item}\")`)."
          - "Put the separator before every item except the first; a `bool` flag `first` keeps track."
        harness: |
          #[test]
          fn joins_numbers() {
              assert_eq!(join_all(&[1, 2, 3], ", "), "1, 2, 3", "join_all(&[1, 2, 3], \", \")");
          }

          #[test]
          fn joins_floats_with_another_separator() {
              assert_eq!(join_all(&[1.5, 2.0], " | "), "1.5 | 2", "join_all(&[1.5, 2.0], \" | \")");
          }

          #[test]
          fn one_item_has_no_separator() {
              assert_eq!(join_all(&["crab"], ", "), "crab", "join_all(&[\"crab\"], \", \")");
          }

          #[test]
          fn empty_slice_gives_an_empty_string() {
              let empty: [char; 0] = [];
              assert_eq!(join_all(&empty, "-"), "", "join_all(&[], \"-\")");
          }

  - title: Generic structs and enums
    id: generics-3
    text: |
      Types can have type parameters too. A point on a game grid uses whole numbers; a GPS position uses decimals. One definition covers both:

      ```rust run
      struct Point<T> {
          x: T,
          y: T,
      }

      struct Labeled<T> {
          label: String,
          value: T,
      }

      #[derive(Debug)]
      enum Reading<T> {
          Value(T),
          OutOfRange,
          Missing,
      }

      fn main() {
          let tile = Point { x: 3, y: 7 };
          let gps = Point { x: 52.52, y: 13.40 };
          println!("tile at ({}, {}), gps at ({}, {})", tile.x, tile.y, gps.x, gps.y);

          let temp = Labeled { label: String::from("kitchen"), value: 21.5 };
          let door = Labeled { label: String::from("front door open"), value: false };
          println!("{}: {}", temp.label, temp.value);
          println!("{}: {}", door.label, door.value);

          let readings: [Reading<u32>; 3] = [Reading::Value(19), Reading::OutOfRange, Reading::Missing];
          for r in &readings {
              match r {
                  Reading::Value(v) => println!("{v} degrees"),
                  other => println!("no value: {other:?}"),
              }
          }
      }
      ```

      ```output
      tile at (3, 7), gps at (52.52, 13.4)
      kitchen: 21.5
      front door open: false
      19 degrees
      no value: OutOfRange
      no value: Missing
      ```

      - `struct Point<T>` declares the parameter; the fields use it. `tile` is a `Point<i32>` and `gps` is a `Point<f64>`. They're two different types, built from one definition.
      - `Labeled<T>` mixes a fixed type (`label` is always a `String`) with a generic one: `temp` is a `Labeled<f64>`, `door` a `Labeled<bool>`.
      - To write the full type, put the parameter in angle brackets: `let origin: Point<f64> = Point { x: 0.0, y: 0.0 };`, or `[Reading<u32>; 3]` above.
      - If two fields may have *different* types, use two parameters: `struct Pair<K, V> { key: K, value: V }`.

      ### Option and Result are generic enums

      `Reading<T>` is your own generic enum, and it follows the same pattern as the two most important enums in Rust:

      ```rust
      enum Option<T> {
          Some(T),
          None,
      }

      enum Result<T, E> {
          Ok(T),
          Err(E),
      }
      ```

      Nothing magic: `Option<String>` and `Result<u32, ParseIntError>` are these definitions with the parameters filled in.

      ### Common mistakes

      - **Mixing types in fields that share one parameter.** In `Point<T>`, `x` and `y` are both `T`:

      ```rust compile_fail
      struct Point<T> {
          x: T,
          y: T,
      }

      fn main() {
          let p = Point { x: 5, y: 4.0 };
          println!("{} {}", p.x, p.y);
      }
      ```

      ```error
      error[E0308]: mismatched types
        |     let p = Point { x: 5, y: 4.0 };
        |                              ^^^ expected integer, found floating-point number
      ```

      - **A variant with no data, and no other hint.** `let r = Reading::Missing;` alone gives ``type annotations needed for `Reading<_>` ``: a missing reading of *what*? Write the type, `let r: Reading<u32> = Reading::Missing;`. The same happens with `None` and `Vec::new()`.
      - **Leaving out the parameter in a signature.** `fn show(p: &Point)` gives ``missing generics for struct `Point` ``. Write `&Point<i32>` for one specific type, or make the function generic: `fn show<T: Display>(p: &Point<T>)`.

      **Your turn:** fill in the blanks: declare the type parameter of `Pair`, use it for `second`, and make `total` accept only pairs of `i32`. The program prints:

      ```
      90 vs 75
      ana vs bo
      total 165
      ```
    fill: |
      struct Pair<[[T]]> {
          first: T,
          second: [[T]],
      }

      fn total(p: &Pair<[[i32]]>) -> i32 {
          p.first + p.second
      }

      fn main() {
          let scores = Pair { first: 90, second: 75 };
          let names = Pair { first: "ana", second: "bo" };
          println!("{} vs {}", scores.first, scores.second);
          println!("{} vs {}", names.first, names.second);
          println!("total {}", total(&scores));
      }
    hints:
      - "`struct Pair<T>` declares the parameter, and both fields have type `T`."
      - "`total` takes a pair of a specific type: `&Pair<i32>`."
    tests:
      - expect: "90 vs 75\nana vs bo\ntotal 165"
    more:
      - task: |
          A sensor log is a slice of `Reading<T>` (in the starter). Write `fn first_value<T: Copy>(readings: &[Reading<T>]) -> Option<T>` that returns the first `Value` in the slice, skipping `Missing` entries, or `None` if there's no value at all.
        seed: |
          enum Reading<T> {
              Value(T),
              Missing,
          }

          fn first_value<T: Copy>(readings: &[Reading<T>]) -> Option<T> {
              todo!()
          }
        solution: |
          enum Reading<T> {
              Value(T),
              Missing,
          }

          fn first_value<T: Copy>(readings: &[Reading<T>]) -> Option<T> {
              for r in readings {
                  if let Reading::Value(v) = r {
                      return Some(*v);
                  }
              }
              None
          }
        hints:
          - "Loop over the readings: `for r in readings`."
          - "`if let Reading::Value(v) = r { return Some(*v); }`: `v` is a `&T`, and `Copy` lets you copy it out with `*v`."
        harness: |
          #[test]
          fn finds_the_first_value() {
              let log = [Reading::Missing, Reading::Value(19), Reading::Value(21)];
