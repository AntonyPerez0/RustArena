      - task: |
          Write `fn count_matching<T: PartialEq>(items: &[T], target: &T) -> usize` that counts how many items are equal to `target`. The tests call it with four different types, so the compiler builds four copies.
        seed: |
          fn count_matching<T: PartialEq>(items: &[T], target: &T) -> usize {
              todo!()
          }
        solution: |
          fn count_matching<T: PartialEq>(items: &[T], target: &T) -> usize {
              let mut count = 0;
              for item in items {
                  if item == target {
                      count += 1;
                  }
              }
              count
