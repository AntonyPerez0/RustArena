              assert_eq!(shelf.add(20), Ok(()), "second add");
              assert_eq!(shelf.len(), 2, "len after two adds");
          }

          #[test]
          fn gives_the_item_back_when_full() {
              let mut shelf = Shelf::new(1);
              assert_eq!(shelf.add(String::from("lamp")), Ok(()), "add lamp");
              assert_eq!(shelf.add(String::from("vase")), Err(String::from("vase")), "add vase to a full shelf");
              assert_eq!(shelf.len(), 1, "len stays at 1");
          }

          #[test]
          fn a_zero_capacity_shelf_is_always_full() {
              let mut shelf = Shelf::new(0);
              assert_eq!(shelf.add('x'), Err('x'), "add to Shelf::new(0)");
          }

