  - title: "Const generics: arrays of any length"
    id: generics-6
    text: |
      An array's length is part of its type: `[f64; 7]` and `[f64; 2]` are different types. So how do you write one function for arrays of every length? With a **const generic parameter**: a parameter that stands for a *value* known at compile time, instead of a type.

      ```rust run
      fn average<const N: usize>(readings: [f64; N]) -> f64 {
          let mut total = 0.0;
          for r in readings {
              total += r;
          }
          total / N as f64
      }

      fn main() {
          let week = [12.0, 14.5, 13.0, 15.5, 16.0, 11.0, 12.5];
          let weekend = [20.0, 22.0];
          println!("week: {:.2}", average(week));
          println!("weekend: {:.2}", average(weekend));
      }
      ```

      ```output
      week: 13.50
      weekend: 21.00
      ```

      - `const N: usize` declares the parameter: `N` is a `usize` value, fixed at compile time.
      - `[f64; N]` uses it as the array length, and the body can use `N` like a constant (`N as f64`).
      - Like type parameters, `N` is inferred from the argument: 7 for `week`, 2 for `weekend`. And like type parameters, each `N` gets its own compiled copy.

      Const parameters work on structs too, mixed freely with type parameters. Here's a game board whose size is part of its type:

      ```rust run
      struct Grid<const W: usize, const H: usize> {
          cells: [[char; W]; H],
      }

      impl<const W: usize, const H: usize> Grid<W, H> {
          fn new() -> Self {
              Grid { cells: [['.'; W]; H] }
          }

          fn set(&mut self, x: usize, y: usize, c: char) {
              self.cells[y][x] = c;
          }

          fn print(&self) {
              for row in &self.cells {
                  let mut line = String::new();
                  for c in row {
                      line.push(*c);
                  }
                  println!("{line}");
              }
          }
      }

      fn main() {
          let mut board: Grid<5, 3> = Grid::new();
          board.set(0, 0, '@');
          board.set(4, 2, '$');
          board.print();
      }
      ```

      ```output
      @....
      .....
      ....$
      ```

      `[['.'; W]; H]` builds an array of `H` rows, each an array of `W` dots. `impl<const W: usize, const H: usize>` declares the parameters for the impl block, exactly like `impl<T>`.

      ### Const generics or slices?

      For "a list of things", a slice `&[T]` is usually the right parameter: it accepts arrays, `Vec`s and parts of them, of any length decided at run time. Reach for const generics when the length is part of the *meaning* and the compiler should enforce it:

      - an RGB color is exactly `[u8; 3]`, a 3D position `[f64; 3]`
      - a key for a cipher is exactly 32 bytes: `[u8; 32]`
      - two vectors in a dot product must have the same length (this step's exercise)
      - a matrix's shape: a 2x3 matrix transposed is a 3x2 matrix

      The standard library itself uses const generics: they're why `{:?}`, `==` and many other features work on arrays of any length.

      ### Common mistakes

      - **An array of the wrong length.** The length is checked at compile time:

      ```rust compile_fail
      fn brightness(color: [u8; 3]) -> u32 {
          color[0] as u32 + color[1] as u32 + color[2] as u32
      }

      fn main() {
          println!("{}", brightness([255, 128, 0, 255]));
      }
      ```

      ```error
      error[E0308]: mismatched types
        |     println!("{}", brightness([255, 128, 0, 255]));
        |                    ---------- ^^^^^^^^^^^^^^^^^^ expected an array with a size of 3, found one with a size of 4
      ```

      - **Using `N` without declaring it.** `fn sum(values: [i32; N])` gives ``cannot find value `N` in this scope``. Declare it: `fn sum<const N: usize>(values: [i32; N])`.
      - **Const parameters of other types.** Only integers, `bool` and `char` are allowed: ``f64` is forbidden as the type of a const generic parameter``.

      **Your turn:** the **dot product** of two vectors multiplies matching elements and adds the results: `[1, 2, 3]` and `[4, 5, 6]` give `1*4 + 2*5 + 3*6 = 32`. The starter only works for length 3. Make `dot` generic over the length, so the compiler guarantees both arrays have the same length, whatever it is.
    seed: |
      // Only works for length 3. Make it work for any length N.
      fn dot(a: [i32; 3], b: [i32; 3]) -> i32 {
          todo!()
      }
    solution: |
      // Only works for length 3. Make it work for any length N.
      fn dot<const N: usize>(a: [i32; N], b: [i32; N]) -> i32 {
          let mut total = 0;
          for i in 0..N {
              total += a[i] * b[i];
          }
          total
      }
    require:
      - pattern: 'const\s+N\s*:\s*usize'
        message: "Declare a const generic parameter: `fn dot<const N: usize>(...)`."
    hints:
      - "The signature is `fn dot<const N: usize>(a: [i32; N], b: [i32; N]) -> i32`."
      - "Loop `for i in 0..N` and add `a[i] * b[i]` to a running total."
    harness: |
      #[test]
      fn length_3() {
          assert_eq!(dot([1, 2, 3], [4, 5, 6]), 32, "dot([1, 2, 3], [4, 5, 6])");
      }

      #[test]
      fn length_2_with_negatives() {
          assert_eq!(dot([3, -1], [2, 5]), 1, "dot([3, -1], [2, 5])");
      }

      #[test]
      fn length_5() {
          assert_eq!(dot([1, 1, 1, 1, 1], [1, 2, 3, 4, 5]), 15, "dot([1, 1, 1, 1, 1], [1, 2, 3, 4, 5])");
      }

      #[test]
      fn empty_arrays_give_zero() {
          assert_eq!(dot([], []), 0, "dot([], [])");
      }
    more:
      - task: |
          Write `fn reversed<T: Copy, const N: usize>(arr: [T; N]) -> [T; N]` that returns a reversed copy of the array. Don't use `.reverse()`: make a mutable copy (`let mut out = arr;`, allowed because `T: Copy` makes the array `Copy` too) and swap elements with `out.swap(i, j)`.
        seed: |
          fn reversed<T: Copy, const N: usize>(arr: [T; N]) -> [T; N] {
              todo!()
          }
        solution: |
          fn reversed<T: Copy, const N: usize>(arr: [T; N]) -> [T; N] {
              let mut out = arr;
              for i in 0..N / 2 {
                  out.swap(i, N - 1 - i);
              }
              out
          }
        forbid:
          - pattern: '\.reverse\(\)'
            message: Do it yourself with `swap` instead of `.reverse()`.
        hints:
          - "`let mut out = arr;` copies the array."
          - "`for i in 0..N / 2 { out.swap(i, N - 1 - i); }` then return `out`."
        harness: |
          #[test]
          fn reverses_numbers() {
              assert_eq!(reversed([1, 2, 3]), [3, 2, 1], "reversed([1, 2, 3])");
          }

          #[test]
          fn reverses_chars() {
              assert_eq!(reversed(['r', 'u', 's', 't']), ['t', 's', 'u', 'r'], "reversed(['r', 'u', 's', 't'])");
          }

          #[test]
          fn leaves_the_original_alone() {
              let original = [1.5, 2.5];
              let flipped = reversed(original);
              assert_eq!(original, [1.5, 2.5], "the original after reversed(original)");
              assert_eq!(flipped, [2.5, 1.5], "reversed([1.5, 2.5])");
          }

          #[test]
          fn handles_an_empty_array() {
              let empty: [i32; 0] = [];
              assert_eq!(reversed(empty), empty, "reversed([])");
          }
      - task: |
          A `Matrix<R, C>` has `R` rows and `C` columns, both const parameters. Write the `transpose` method, which turns rows into columns: the result is a `Matrix<C, R>`, and the element at row `r`, column `c` moves to row `c`, column `r`. The type system guarantees the new shape.

          You'll need to start from a filled array of the new shape: `[[0; R]; C]`.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Matrix<const R: usize, const C: usize> {
              data: [[i32; C]; R],
          }

          impl<const R: usize, const C: usize> Matrix<R, C> {
              // fn transpose(&self) -> Matrix<C, R>
          }
        solution: |
          #[derive(Debug, PartialEq)]
          struct Matrix<const R: usize, const C: usize> {
              data: [[i32; C]; R],
          }

          impl<const R: usize, const C: usize> Matrix<R, C> {
              // fn transpose(&self) -> Matrix<C, R>
              fn transpose(&self) -> Matrix<C, R> {
                  let mut data = [[0; R]; C];
                  for r in 0..R {
                      for c in 0..C {
                          data[c][r] = self.data[r][c];
                      }
                  }
                  Matrix { data }
              }
          }
        hints:
          - "Start with `let mut data = [[0; R]; C];`: `C` rows of `R` zeros."
          - "Two nested loops over `0..R` and `0..C`: `data[c][r] = self.data[r][c];`"
          - "Return `Matrix { data }`; its type is `Matrix<C, R>` because of the array's shape."
        harness: |
          #[test]
          fn transposes_a_2_by_3_matrix() {
              let m = Matrix { data: [[1, 2, 3], [4, 5, 6]] };
              let t = m.transpose();
              assert_eq!(t.data, [[1, 4], [2, 5], [3, 6]], "transpose of [[1, 2, 3], [4, 5, 6]]");
          }

          #[test]
          fn transposes_a_single_row_into_a_column() {
              let m = Matrix { data: [[7, 8, 9]] };
              assert_eq!(m.transpose().data, [[7], [8], [9]], "transpose of [[7, 8, 9]]");
          }

          #[test]
          fn transposing_twice_gives_the_original() {
              let m = Matrix { data: [[1, 2], [3, 4], [5, 6]] };
              assert_eq!(m.transpose().transpose(), m, "m.transpose().transpose()");
          }
