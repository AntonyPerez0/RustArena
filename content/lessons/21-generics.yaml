      - task: |
          Write a generic `Shelf<T>` from scratch: a container with a fixed capacity.

          - `struct Shelf<T>` with `items: Vec<T>` and `capacity: usize`
          - in `impl<T> Shelf<T>`: `new(capacity: usize) -> Self`, `len(&self) -> usize`, and `add(&mut self, item: T) -> Result<(), T>`, which stores the item, or, when the shelf is full, gives the item back in `Err` so it isn't lost
          - in `impl Shelf<f64>` (a shelf of prices): `total(&self) -> f64`, the sum of all items
        seed: |
          // struct Shelf<T> ...
        solution: |
          // struct Shelf<T> ...
          struct Shelf<T> {
              items: Vec<T>,
              capacity: usize,
          }

          impl<T> Shelf<T> {
              fn new(capacity: usize) -> Self {
                  Shelf { items: Vec::new(), capacity }
              }

              fn len(&self) -> usize {
                  self.items.len()
              }

              fn add(&mut self, item: T) -> Result<(), T> {
                  if self.items.len() >= self.capacity {
                      return Err(item);
                  }
                  self.items.push(item);
                  Ok(())
              }
          }

          impl Shelf<f64> {
              fn total(&self) -> f64 {
                  let mut sum = 0.0;
                  for price in &self.items {
                      sum += price;
                  }
                  sum
              }
          }
        hints:
          - "`add` checks `self.items.len() >= self.capacity` first and returns `Err(item)`, handing the item back."
          - "`total` lives in its own block, `impl Shelf<f64> { ... }`, and adds up the items in a loop."
