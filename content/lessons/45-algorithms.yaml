          score: u32,
          games: u32,
      }

      fn rank_players(players: &mut [Player]) {
          players.sort_by(|a, b| {
              b.score
                  .cmp(&a.score)
                  .then(a.games.cmp(&b.games))
                  .then_with(|| a.name.cmp(&b.name))
          });
      }
