              let v: Vec<i32> = (0..3000i64).map(|i| ((i * 2_654_435_761) % 1_000_003) as i32 - 500_000).collect();
              assert_eq!(count_inversions(&v), 2_261_164, "count_inversions(3,000 scrambled numbers)");
          }

