        seed: |
          use std::collections::HashMap;

          fn count_subarrays_with_sum(values: &[i64], k: i64) -> u64 {
              todo!()
          }
        solution: |
          use std::collections::HashMap;

          fn count_subarrays_with_sum(values: &[i64], k: i64) -> u64 {
              let mut seen: HashMap<i64, u64> = HashMap::new();
              seen.insert(0, 1);
              let mut total = 0;
              let mut count = 0;
              for &v in values {
                  total += v;
                  if let Some(&n) = seen.get(&(total - k)) {
                      count += n;
                  }
                  *seen.entry(total).or_insert(0) += 1;
              }
              count
          }
        harness: |
          #[test]
          fn counts_ranges_with_the_sum() {
              assert_eq!(count_subarrays_with_sum(&[1, 1, 1], 2), 2, "count_subarrays_with_sum(&[1, 1, 1], 2)");
              assert_eq!(count_subarrays_with_sum(&[1, 2, 3], 3), 2, "count_subarrays_with_sum(&[1, 2, 3], 3)");
          }

          #[test]
          fn handles_negative_values() {
              assert_eq!(count_subarrays_with_sum(&[3, -3, 3, -3], 0), 4, "count_subarrays_with_sum(&[3, -3, 3, -3], 0)");
          }

          #[test]
          fn counts_nothing_when_no_range_matches() {
              assert_eq!(count_subarrays_with_sum(&[5, 5], 3), 0, "count_subarrays_with_sum(&[5, 5], 3)");
              assert_eq!(count_subarrays_with_sum(&[], 0), 0, "count_subarrays_with_sum(&[], 0)");
          }

          #[test]
          fn counts_100000_zeros_quickly() {
              let v = vec![0i64; 100_000];
              assert_eq!(count_subarrays_with_sum(&v, 0), 5_000_050_000, "count_subarrays_with_sum(100,000 zeros, 0)");
          }
