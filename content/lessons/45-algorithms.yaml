          assert_eq!(max_window_sum(&[1, 2], 3), None, "max_window_sum(&[1, 2], 3)");
          assert_eq!(max_window_sum(&[1, 2], 0), None, "max_window_sum(&[1, 2], 0)");
          assert_eq!(max_window_sum(&[], 1), None, "max_window_sum(&[], 1)");
      }

      #[test]
