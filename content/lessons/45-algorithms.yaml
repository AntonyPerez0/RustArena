  - title: Two pointers
    id: algorithms-5
    text: |
      Many problems that look like "check every pair" (O(n²)) can be solved with **two indices** that move through the data in a smart way, touching each item once: O(n) time and O(1) extra memory. Three common patterns:

      1. **From both ends** (on sorted data or symmetric questions): `i` starts at the front, `j` at the back, and each step moves one of them inward.
      2. **Read and write** (same direction): `read` visits every item, `write` marks where the next kept item goes. That's how you filter in place.
      3. **Two sequences**: one index per sequence, like the merge in merge sort.

      Checking a palindrome from both ends, ignoring case and punctuation:

      ```rust run
      fn is_palindrome(text: &str) -> bool {
          let letters: Vec<char> = text
              .chars()
              .filter(|c| c.is_alphanumeric())
              .map(|c| c.to_ascii_lowercase())
              .collect();
          if letters.is_empty() {
              return true;
          }
          let (mut i, mut j) = (0, letters.len() - 1);
          while i < j {
              if letters[i] != letters[j] {
                  return false;
              }
              i += 1;
              j -= 1;
          }
          true
      }

      fn main() {
          for s in ["Never odd or even", "Rust", "A man, a plan, a canal: Panama"] {
              println!("{s:?}: {}", is_palindrome(s));
          }
      }
      ```

      ```output
      "Never odd or even": true
      "Rust": false
      "A man, a plan, a canal: Panama": true
      ```

      The chars are collected into a `Vec<char>` first because a `&str` can't be indexed by position (UTF-8, remember).

      Read and write pointers, removing the zero readings from a Vec in place:

      ```rust run
      fn remove_zeros(v: &mut Vec<i32>) {
          let mut write = 0;
          for read in 0..v.len() {
              if v[read] != 0 {
                  v[write] = v[read];
                  write += 1;
              }
          }
          v.truncate(write);
      }

      fn main() {
          let mut readings = vec![0, 4, 0, 0, 7, 2, 0];
          remove_zeros(&mut readings);
          println!("{readings:?}");
      }
      ```

      ```output
      [4, 7, 2]
      ```

      That's what `v.retain(|&x| x != 0)` does inside; in real code, call `retain`. Calling `v.remove(i)` for each zero instead would shift the rest of the Vec every time: O(n²).

      ### Why "from both ends" works on sorted data

      Looking for two numbers in a sorted slice that add up to a target: start with the smallest (`i`) and the largest (`j`). If their sum is too small, the smallest can't be part of any answer (even the largest partner isn't enough), so move `i` right. If the sum is too big, the largest can't be part of any answer, so move `j` left. Each step rules out one item for good.

      ### Common mistakes

      - **`j -= 1` below zero.** With `usize`, `0 - 1` panics with `attempt to subtract with overflow`. Loop `while i < j` so `j` is at least 1 when you decrement it, and handle the empty case before computing `len() - 1`.
      - **Two pointers on unsorted data** for a sum question: the "rule out one item" argument needs the order.
      - **Moving the wrong pointer.** Write down what each move rules out; if you can't say, the loop is probably wrong.

      **Your turn:** write `fn pair_with_sum(sorted: &[i32], target: i32) -> Option<(usize, usize)>` that returns the indices `(i, j)`, `i < j`, of two items of the sorted slice that add up to `target`, or `None`. Use two pointers from both ends, with no HashMap (O(1) extra memory). In every test at most one pair works. The tests include a slice of 200,000 numbers.
    seed: |
      fn pair_with_sum(sorted: &[i32], target: i32) -> Option<(usize, usize)> {
          todo!()
      }
    solution: |
      use std::cmp::Ordering;

      fn pair_with_sum(sorted: &[i32], target: i32) -> Option<(usize, usize)> {
          if sorted.len() < 2 {
              return None;
          }
          let (mut i, mut j) = (0, sorted.len() - 1);
          while i < j {
              match (sorted[i] + sorted[j]).cmp(&target) {
                  Ordering::Equal => return Some((i, j)),
                  Ordering::Less => i += 1,
                  Ordering::Greater => j -= 1,
              }
          }
          None
      }
    forbid:
      - pattern: 'HashMap|HashSet|BTree|binary_search'
        message: Use two pointers only, without extra collections or binary search.
    hints:
      - "Return `None` for fewer than two items, then start with `i = 0` and `j = sorted.len() - 1`."
      - "While `i < j`, compare `sorted[i] + sorted[j]` with `target`: too small means `i += 1`, too big means `j -= 1`."
      - "Equal: `return Some((i, j))`. If the pointers meet, there's no pair."
    harness: |
      #[test]
      fn finds_the_pair() {
          assert_eq!(pair_with_sum(&[1, 3, 4, 6, 9, 11], 13), Some((2, 4)), "pair_with_sum(&[1, 3, 4, 6, 9, 11], 13)");
      }

      #[test]
      fn finds_pairs_at_the_ends() {
          assert_eq!(pair_with_sum(&[2, 5, 8, 12], 14), Some((0, 3)), "pair_with_sum(&[2, 5, 8, 12], 14)");
      }

      #[test]
      fn handles_negative_numbers() {
          assert_eq!(pair_with_sum(&[-8, -3, 0, 5, 7], -1), Some((0, 4)), "pair_with_sum(&[-8, -3, 0, 5, 7], -1)");
      }

      #[test]
      fn returns_none_when_nothing_adds_up() {
          assert_eq!(pair_with_sum(&[1, 2, 4], 10), None, "pair_with_sum(&[1, 2, 4], 10)");
          assert_eq!(pair_with_sum(&[5], 10), None, "pair_with_sum(&[5], 10)");
          assert_eq!(pair_with_sum(&[], 0), None, "pair_with_sum(&[], 0)");
      }

      #[test]
      fn searches_200000_numbers_quickly() {
          let mut v: Vec<i32> = (0..199_999).map(|i| i * 2).collect();
          v.push(1_000_001);
          assert_eq!(pair_with_sum(&v, 1_200_001), Some((100_000, 199_999)), "pair_with_sum(200,000 numbers, 1200001)");
      }
    more:
      - task: |
          Write `fn dedup_sorted(v: &mut Vec<i32>)` that removes repeated values from a **sorted** Vec in place, keeping one of each, with read and write pointers. No `dedup`, `retain`, `remove` or sets. The tests include 200,000 copies of the same value, where calling `remove` for each repeat would be O(n²).
        seed: |
          fn dedup_sorted(v: &mut Vec<i32>) {
              todo!()
          }
        solution: |
          fn dedup_sorted(v: &mut Vec<i32>) {
              if v.is_empty() {
                  return;
              }
              let mut write = 1;
              for read in 1..v.len() {
                  if v[read] != v[write - 1] {
                      v[write] = v[read];
                      write += 1;
                  }
              }
              v.truncate(write);
          }
        forbid:
          - pattern: 'dedup\(|retain|\.remove\(|HashSet|BTreeSet'
            message: Use read and write indices, without `dedup`, `retain`, `remove` or a set.
        harness: |
