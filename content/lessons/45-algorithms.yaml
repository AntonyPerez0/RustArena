          fn finds_the_best_pair() {
              assert_eq!(max_water(&[1, 8, 6, 2, 5, 4, 8, 3, 7]), 49, "max_water(&[1, 8, 6, 2, 5, 4, 8, 3, 7])");
          }

          #[test]
          fn two_walls_hold_the_lower_height() {
              assert_eq!(max_water(&[3, 9]), 3, "max_water(&[3, 9])");
          }

          #[test]
          fn wide_low_walls_can_beat_narrow_tall_ones() {
              assert_eq!(max_water(&[4, 1, 1, 1, 1, 20, 20, 4]), 28, "max_water(&[4, 1, 1, 1, 1, 20, 20, 4])");
          }

          #[test]
          fn fewer_than_two_walls_hold_nothing() {
              assert_eq!(max_water(&[7]), 0, "max_water(&[7])");
              assert_eq!(max_water(&[]), 0, "max_water(&[])");
          }

          #[test]
          fn checks_100000_walls_quickly() {
              let walls: Vec<u32> = (0..100_000u32).map(|i| i * 7919 % 10_000).collect();
              assert_eq!(max_water(&walls), 992_441_032, "max_water(100,000 walls)");
          }
        hints:
