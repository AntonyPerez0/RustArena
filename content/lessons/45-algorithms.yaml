              dedup_sorted(&mut v);
              assert_eq!(v, vec![-2, 0, 5], "dedup_sorted([-2, 0, 5])");
          }

          #[test]
          fn handles_empty_and_single_vecs() {
              let mut v: Vec<i32> = vec![];
              dedup_sorted(&mut v);
              assert_eq!(v, Vec::<i32>::new(), "dedup_sorted([])");
              let mut w = vec![4];
              dedup_sorted(&mut w);
              assert_eq!(w, vec![4], "dedup_sorted([4])");
          }

          #[test]
          fn handles_200000_copies_quickly() {
              let mut v = vec![9; 200_000];
              v.push(10);
