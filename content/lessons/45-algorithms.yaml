          let v: Vec<i64> = (0..200_000i64).map(|i| (i * 7919) % 2001 - 1000).collect();
          assert_eq!(max_window_sum(&v, 100_000), Some(3605), "max_window_sum(200,000 values, 100000)");
          assert_eq!(max_window_sum(&v, 1), Some(1000), "max_window_sum(200,000 values, 1)");
      }
    more:
      - task: |
          A fundraiser wants the **shortest** run of consecutive days whose donations reach a target. Write `fn shortest_at_least(values: &[u32], target: u64) -> Option<usize>`: the length of the shortest window with a sum of at least `target`, or `None` if no window gets there. All values are non-negative, so a variable-size window works: grow it to the right, and while the sum is at least the target, record the length and shrink from the left. The tests have 200,000 values.
        seed: |
          fn shortest_at_least(values: &[u32], target: u64) -> Option<usize> {
              todo!()
          }
        solution: |
          fn shortest_at_least(values: &[u32], target: u64) -> Option<usize> {
              let mut best: Option<usize> = None;
              let mut left = 0;
              let mut sum: u64 = 0;
              for right in 0..values.len() {
                  sum += values[right] as u64;
                  while sum >= target && left <= right {
                      let len = right + 1 - left;
                      best = Some(best.map_or(len, |b| b.min(len)));
                      sum -= values[left] as u64;
                      left += 1;
                  }
              }
              best
          }
