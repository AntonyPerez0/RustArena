          A music app compares your ranking of songs with a friend's by counting **inversions**: pairs `i < j` where `v[i] > v[j]`. A sorted list has 0; a reversed list of n items has n(n-1)/2.

          Write `fn count_inversions(v: &[i32]) -> u64`. Checking every pair is O(n²), and the tests use 100,000 numbers. Modify merge sort: while merging, every time you take an item from the **right** half, it's smaller than everything still waiting in the left half, so it forms one inversion with each of them (`left.len() - i` inversions at once). Have a recursive helper return both the sorted Vec and the count.
        seed: |
          fn count_inversions(v: &[i32]) -> u64 {
