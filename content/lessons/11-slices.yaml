      - task: |
          A scoreboard arrives as lines of `name score`. Write `parse_line`, which splits one line into the name (a slice of the line) and the score (a `u32`), then finish `main`: print the player with the highest score (the first one on a tie) and the total. The starter reads the whole input into one `String`, so every name can stay a slice of it: no copies. For the input:

