          }

          #[test]
          fn works_on_an_array() {
              assert_eq!(count_above(&[100, 200, 300], 150), 2, "count_above(&[100, 200, 300], 150)");
          }

          #[test]
          fn works_on_part_of_a_vector() {
              let v = vec![50, 60, 70, 80];
              assert_eq!(count_above(&v[..2], 55), 1, "count_above(&[50, 60, 70, 80][..2], 55)");
          }

          #[test]
