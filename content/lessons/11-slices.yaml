  - title: "Mutable slices: &mut [T]"
    id: slices-5
    text: |
      `&mut v[a..b]` lends part of a vector or array **for changing**. Its type is `&mut [T]`. A function that changes elements in place, without adding or removing any, should take `&mut [T]`: it then works on arrays, vectors, and parts of either.

      ```rust run
      fn reset(values: &mut [i32]) {
          for v in values {
              *v = 0;
          }
      }

      fn main() {
          let mut board = [5, 3, 8, 1, 9, 2];
          reset(&mut board[2..4]);
          println!("{:?}", board);
      }
      ```

      ```output
      [5, 3, 0, 0, 9, 2]
      ```

      Looping over a `&mut [i32]` gives a `&mut i32` for each element, so you change it with `*v`, as in the borrowing module. A slice has a **fixed length**: you can change its elements, but you can't push or remove. A function that needs to grow a vector takes `&mut Vec<T>`.

      ### Built-in methods that change a slice in place

      `.sort()`, `.reverse()`, `.swap(i, j)` and `.fill(x)` are slice methods. They work on a whole vector or on part of one:

      ```rust run
      fn main() {
          let mut leaderboard = vec![40, 95, 70, 10, 85];
          leaderboard[..3].sort();          // sort only the first three
          println!("{:?}", leaderboard);
          leaderboard.reverse();
          println!("{:?}", leaderboard);
          leaderboard.swap(0, 4);
          println!("{:?}", leaderboard);
      }
      ```

      ```output
      [40, 70, 95, 10, 85]
      [85, 10, 95, 70, 40]
      [40, 10, 95, 70, 85]
      ```

      ### Two mutable parts at once: split_at_mut

      Two `&mut` slices of the same vector, even of parts that don't overlap, don't compile:

      ```rust compile_fail
      fn main() {
          let mut v = vec![1, 2, 3, 4];
          let left = &mut v[..2];
          let right = &mut v[2..];
          left[0] = 9;
          right[0] = 8;
          println!("{:?}", v);
      }
      ```

      ```error
      error[E0499]: cannot borrow `v` as mutable more than once at a time
       --> src/main.rs:4:22
        |
      3 |     let left = &mut v[..2];
        |                     - first mutable borrow occurs here
      4 |     let right = &mut v[2..];
        |                      ^ second mutable borrow occurs here
      5 |     left[0] = 9;
        |     ------- first borrow later used here
        |
        = help: use `.split_at_mut(position)` to obtain two mutable non-overlapping sub-slices
      ```

      The ranges are just numbers worked out at run time, so the compiler can't prove the two parts don't overlap; it treats each one as borrowing all of `v`. The help line names the fix. `split_at_mut` checks the position once and returns two `&mut` slices that are guaranteed not to overlap:

      ```rust run
      fn main() {
          let mut teams = [10, 20, 30, 40];
          let (red, blue) = teams.split_at_mut(2);
          red[0] += 1;
          blue[0] += 100;
          println!("{:?}", teams);
      }
      ```

      ```output
      [11, 20, 130, 40]
      ```

      (Inside, `split_at_mut` uses a few lines of `unsafe` code that the standard library guarantees are correct. The unsafe module shows how such safe wrappers are built.)

      ### Common mistakes

      - **Pushing to a `&mut [T]`**: ``error[E0599]: no method named `push` found for mutable reference `&mut [i32]` ``. Take `&mut Vec<T>` if the function must grow the vector.
      - **Forgetting `*`** when assigning to elements in a loop.
      - **Two `&mut` slices of one vector at once** (E0499): use `split_at_mut`.

      **Your turn:** write `shift_left`, which moves every element one place to the left and puts the first element at the end: `[1, 2, 3, 4]` becomes `[2, 3, 4, 1]`. Empty and one-element slices stay as they are. Use `.swap` in a loop (and not the built-in `rotate_left`, which would do it for you).
    seed: |
      fn shift_left(values: &mut [i32]) {
          todo!()
      }
    solution: |
      fn shift_left(values: &mut [i32]) {
          for i in 1..values.len() {
              values.swap(i - 1, i);
          }
      }
    harness: |
      #[test]
      fn moves_the_first_element_to_the_end() {
          let mut v = vec![1, 2, 3, 4];
          shift_left(&mut v);
          assert_eq!(v, vec![2, 3, 4, 1], "shift_left([1, 2, 3, 4])");
      }

      #[test]
      fn works_on_an_array() {
          let mut a = [7, 8, 9];
          shift_left(&mut a);
          assert_eq!(a, [8, 9, 7], "shift_left([7, 8, 9])");
      }

      #[test]
      fn works_on_part_of_a_vector() {
          let mut v = vec![1, 2, 3, 4, 5];
          shift_left(&mut v[1..4]);
          assert_eq!(v, vec![1, 3, 4, 2, 5], "shift_left(&mut v[1..4]) of [1, 2, 3, 4, 5]");
      }

      #[test]
      fn leaves_short_slices_alone() {
          let mut empty: [i32; 0] = [];
          shift_left(&mut empty);
          assert_eq!(empty, [], "shift_left([])");
          let mut one = [42];
          shift_left(&mut one);
          assert_eq!(one, [42], "shift_left([42])");
      }
    forbid:
      - pattern: '\.rotate_(left|right)\s*\('
        message: "Do it yourself with `.swap` in a loop."
    hints:
      - "Swapping neighbours from left to right carries the first element along to the end: swap 0 and 1, then 1 and 2, and so on."
      - "`for i in 1..values.len() { values.swap(i - 1, i); }` (starting at 1 means an empty slice never computes `0 - 1`)."
    more:
      - task: |
          Write `zero_negatives`, which replaces every negative number in the slice with `0` and returns how many it replaced.
        seed: |
          fn zero_negatives(values: &mut [i32]) -> usize {
              todo!()
          }
        solution: |
          fn zero_negatives(values: &mut [i32]) -> usize {
              let mut changed = 0;
              for v in values {
                  if *v < 0 {
                      *v = 0;
                      changed += 1;
                  }
              }
              changed
          }
        harness: |
          #[test]
          fn replaces_negatives_with_zero() {
              let mut v = vec![3, -1, 4, -5];
              let n = zero_negatives(&mut v);
              assert_eq!(v, vec![3, 0, 4, 0], "values after zero_negatives([3, -1, 4, -5])");
              assert_eq!(n, 2, "zero_negatives([3, -1, 4, -5]) returns");
          }

          #[test]
          fn returns_zero_when_nothing_is_negative() {
              let mut a = [0, 1, 2];
              assert_eq!(zero_negatives(&mut a), 0, "zero_negatives([0, 1, 2])");
              assert_eq!(a, [0, 1, 2], "values after zero_negatives([0, 1, 2])");
          }

          #[test]
          fn only_changes_the_part_it_was_given() {
              let mut v = vec![-1, -2, -3, -4];
              assert_eq!(zero_negatives(&mut v[1..3]), 2, "zero_negatives(&mut v[1..3])");
              assert_eq!(v, vec![-1, 0, 0, -4], "v after zero_negatives(&mut v[1..3])");
          }
        hints:
          - "`for v in values` gives you a `&mut i32` for each element."
          - "`if *v < 0 { *v = 0; changed += 1; }` and return `changed` at the end."
      - task: |
          Write `swap_halves`, which swaps the first half of a slice with the second half: `[1, 2, 3, 4]` becomes `[3, 4, 1, 2]`. With an odd length, the middle element stays where it is: `[1, 2, 3, 4, 5]` becomes `[4, 5, 3, 1, 2]`. Use `.swap(i, j)`, or `split_at_mut` to get the two halves as separate `&mut` slices.
        seed: |
          fn swap_halves(values: &mut [i32]) {
              todo!()
          }
        solution: |
          fn swap_halves(values: &mut [i32]) {
              let n = values.len();
              let half = n / 2;
              for i in 0..half {
                  values.swap(i, n - half + i);
              }
          }
        harness: |
          #[test]
          fn swaps_the_halves_of_an_even_slice() {
              let mut v = vec![1, 2, 3, 4];
              swap_halves(&mut v);
              assert_eq!(v, vec![3, 4, 1, 2], "swap_halves([1, 2, 3, 4])");
          }

          #[test]
          fn keeps_the_middle_of_an_odd_slice() {
              let mut v = vec![1, 2, 3, 4, 5];
              swap_halves(&mut v);
              assert_eq!(v, vec![4, 5, 3, 1, 2], "swap_halves([1, 2, 3, 4, 5])");
          }

          #[test]
          fn leaves_short_slices_alone() {
              let mut one = [9];
              swap_halves(&mut one);
              assert_eq!(one, [9], "swap_halves([9])");
              let mut empty: [i32; 0] = [];
              swap_halves(&mut empty);
              assert_eq!(empty, [], "swap_halves([])");
          }

          #[test]
          fn works_on_part_of_a_vector() {
              let mut v = vec![0, 1, 2, 3, 4, 0];
              swap_halves(&mut v[1..5]);
              assert_eq!(v, vec![0, 3, 4, 1, 2, 0], "swap_halves(&mut v[1..5])");
          }
        hints:
          - "With length `n` and `half = n / 2`, element `i` of the first half pairs with element `n - half + i` of the second half."
          - "`for i in 0..half { values.swap(i, n - half + i); }`"

  - title: Slices in real code
    id: slices-6
    text: |
      Slices are everywhere in real Rust code, because they let one function work on any data without caring who owns it, and without copying it. This step puts the pieces together.

      ### Iterating slices

      All of these loops work on a slice `s` (and on a vector or array, through a slice):

      | Loop | You get |
      |---|---|
      | `for x in s` or `for x in s.iter()` | a `&T` for each element (the same thing, two spellings) |
      | `for x in s.iter_mut()`, when `s` is a `&mut [T]` | a `&mut T` for each element |
      | `for i in 0..s.len()` | each index, for when you need positions |
      | `for word in text.split_whitespace()` | each word, as a `&str` slice of `text` |
      | `for line in text.lines()` | each line, as a `&str` slice of `text` |

      ### A zero-copy log reader

      This program reads a log held in one `String` and never copies any of its text: every line and every level is a slice pointing into `log`.

      ```rust run
      // "[LEVEL] message": the level is between the brackets.
      fn level_of(line: &str) -> &str {
          let bytes = line.as_bytes();
          for i in 0..bytes.len() {
              if bytes[i] == b']' {
                  return &line[1..i];
              }
          }
          ""
      }

      fn count_level(lines: &[&str], level: &str) -> usize {
          let mut n = 0;
          for line in lines {
              if level_of(line) == level {
                  n += 1;
              }
          }
          n
      }

      fn main() {
          let log = String::from("[INFO] started\n[ERROR] disk full\n[WARN] slow\n[ERROR] timeout");
          let mut lines = Vec::new();
          for line in log.lines() {
              lines.push(line);          // a &str slice of log: nothing copied
          }
          println!("{} lines, {} errors", lines.len(), count_level(&lines, "ERROR"));
          println!("first level: {}", level_of(lines[0]));
      }
      ```

      ```output
      4 lines, 2 errors
      first level: INFO
      ```

      Look at the types: `lines` is a `Vec<&str>`, a vector of slices that all borrow from `log`. `count_level` takes `&[&str]`, a slice of string slices. Each `line` in its loop is a `&&str` (a reference to an element); Rust lets you pass it where a `&str` is expected. And because every slice borrows from `log`, the borrow checker won't let `log` be changed or dropped while `lines` is in use.

      ### Idiomatic signatures

      | Your function needs to... | Take | Rather than |
      |---|---|---|
      | read text | `&str` | `&String` or `String` |
      | read a list | `&[T]` | `&Vec<T>` or `Vec<T>` |
      | change elements in place | `&mut [T]` | `&mut Vec<T>` |
      | add or remove elements | `&mut Vec<T>` | |
      | add to text | `&mut String` | |
      | keep the value (store it) | `String`, `Vec<T>` | |

      And for return values:

      | It returns... | Return |
      |---|---|
      | part of its input | `&str` or `&[T]`, a slice of the input |
      | new data | `String` or `Vec<T>`, owned |

      **Workplace note:** these signatures are what reviewers look for. A function taking `&str` or `&[T]` works with every caller and makes no copies, and returning slices of the input is how fast parsers stay fast. When a slice has to outlive the data it points into (say, you're reading lines one at a time and each line is dropped after its loop round), call `.to_string()` or `.to_vec()` to get an owned copy: the compiler will tell you when (E0597).

      ### Common mistakes

      - **Keeping a slice of a value that's about to be dropped**, like a line `String` that only lives for one loop round (E0597). Read everything into one `String` first, or keep an owned copy.
      - **Mixing up `&[&str]` and `&[String]`.** Both are fine parameter types; use whichever matches the data you have.
      - **Returning `String` when a slice would do.** If the result is part of the input, return a slice and let the caller decide whether to copy it.

      **Your turn:** write `longest_word`, which returns the longest word in `text` (words are separated by whitespace), as a slice of `text`. Compare lengths in **characters** (`.chars().count()`); on a tie, the first word wins. If there are no words, return `""`.
    seed: |
      fn longest_word(text: &str) -> &str {
          todo!()
      }
    solution: |
      fn longest_word(text: &str) -> &str {
          let mut best = "";
          for word in text.split_whitespace() {
              if word.chars().count() > best.chars().count() {
                  best = word;
              }
          }
          best
      }
