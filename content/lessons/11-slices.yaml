      #[test]
      fn keeps_the_first_on_a_tie() {
          assert_eq!(longest_word("the quick brown fox"), "quick", "longest_word(\"the quick brown fox\")");
      }

      #[test]
      fn returns_empty_for_no_words() {
          assert_eq!(longest_word(""), "", "longest_word(\"\")");
          assert_eq!(longest_word("   "), "", "longest_word(\"   \")");
      }

      #[test]
      fn counts_characters_not_bytes() {
          assert_eq!(longest_word("élan ville"), "ville", "longest_word(\"élan ville\")");
      }

      #[test]
