      - task: |
          Write `evens_up_to(n)`, which returns a vector of the even numbers from 2 up to and including `n`. For example `evens_up_to(10)` returns `[2, 4, 6, 8, 10]`, and `evens_up_to(1)` returns an empty vector.
        seed: |
          fn evens_up_to(n: u32) -> Vec<u32> {
              todo!()
          }
        solution: |
          fn evens_up_to(n: u32) -> Vec<u32> {
              let mut evens = Vec::new();
              for x in 1..=n {
                  if x % 2 == 0 {
                      evens.push(x);
                  }
              }
              evens
          }
        harness: |
          #[test]
          fn evens_up_to_10() {
              assert_eq!(evens_up_to(10), vec![2, 4, 6, 8, 10], "evens_up_to(10)");
          }

          #[test]
          fn an_odd_limit_is_not_included() {
              assert_eq!(evens_up_to(7), vec![2, 4, 6], "evens_up_to(7)");
          }

          #[test]
          fn exactly_two() {
              assert_eq!(evens_up_to(2), vec![2], "evens_up_to(2)");
          }

          #[test]
          fn nothing_below_two() {
              assert_eq!(evens_up_to(1), Vec::<u32>::new(), "evens_up_to(1)");
              assert_eq!(evens_up_to(0), Vec::<u32>::new(), "evens_up_to(0)");
          }
