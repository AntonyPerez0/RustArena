              let temps = [
                  [12, 18, 24, 17],
                  [14, 22, 31, 20],
                  [11, 19, 27, 16],
              ];
          }
        solution: |
          fn main() {
              let temps = [
                  [12, 18, 24, 17],
                  [14, 22, 31, 20],
                  [11, 19, 27, 16],
              ];
              let mut best = (0, 0); // (day, reading) of the highest so far
              for day in 0..temps.len() {
                  for reading in 0..temps[day].len() {
                      if temps[day][reading] > temps[best.0][best.1] {
                          best = (day, reading);
                      }
                  }
