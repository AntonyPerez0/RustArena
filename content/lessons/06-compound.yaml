          - "Loop over the values and replace the maximum whenever you see a bigger one."
      - task: |
          A sale takes 20% off every price. Prices are whole cents, so compute the new price with integer math: `price * 80 / 100`. Change the array **itself** with an index loop, then print the array and the new total:

          ```
          [96, 60, 240, 36]
          total: 432
          ```
        seed: |
