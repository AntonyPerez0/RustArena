    solution: |
      #[derive(Debug, PartialEq)]
      enum Method {
          Get,
          Post,
          Put,
          Delete,
      }

      #[derive(Debug, PartialEq)]
      struct Request {
          method: Method,
          path: String,
          body: String,
      }

      fn parse_request(raw: &str) -> Option<Request> {
          let (head, body) = raw.split_once("\r\n\r\n")?;
          let request_line = head.split("\r\n").next()?;
          let parts: Vec<&str> = request_line.split(' ').collect();
          let [method, path, version] = parts[..] else {
              return None;
          };
          let method = match method {
              "GET" => Method::Get,
              "POST" => Method::Post,
              "PUT" => Method::Put,
              "DELETE" => Method::Delete,
              _ => return None,
          };
          if !path.starts_with('/') || version != "HTTP/1.1" {
              return None;
          }
          Some(Request { method, path: path.to_string(), body: body.to_string() })
      }
    harness: |
      fn req(method: Method, path: &str, body: &str) -> Option<Request> {
          Some(Request { method, path: path.to_string(), body: body.to_string() })
      }

      #[test]
      fn parses_a_get_with_headers() {
          let raw = "GET /items/7 HTTP/1.1\r\nHost: shop.dev\r\nAccept: */*\r\n\r\n";
          assert_eq!(parse_request(raw), req(Method::Get, "/items/7", ""), "parse_request(GET /items/7)");
      }

      #[test]
      fn keeps_the_body() {
          let raw = "POST /items HTTP/1.1\r\nContent-Type: application/json\r\n\r\n{\"name\":\"mug\"}";
          assert_eq!(parse_request(raw), req(Method::Post, "/items", "{\"name\":\"mug\"}"), "parse_request(POST with body)");
      }

      #[test]
      fn handles_put_and_delete() {
          assert_eq!(parse_request("PUT /a HTTP/1.1\r\n\r\nx"), req(Method::Put, "/a", "x"), "PUT");
          assert_eq!(parse_request("DELETE /a/1 HTTP/1.1\r\n\r\n"), req(Method::Delete, "/a/1", ""), "DELETE");
      }

      #[test]
      fn rejects_unknown_or_lowercase_methods() {
          assert_eq!(parse_request("BREW /pot HTTP/1.1\r\n\r\n"), None, "BREW");
          assert_eq!(parse_request("get / HTTP/1.1\r\n\r\n"), None, "lowercase get");
      }

      #[test]
      fn rejects_malformed_request_lines() {
          assert_eq!(parse_request("GET /a HTTP/1.1\r\nHost: x\r\n"), None, "no blank line");
          assert_eq!(parse_request("GET /a\r\n\r\n"), None, "no version");
          assert_eq!(parse_request("GET a HTTP/1.1\r\n\r\n"), None, "path without /");
          assert_eq!(parse_request("GET /a HTTP/2\r\n\r\n"), None, "wrong version");
          assert_eq!(parse_request("GET /a b HTTP/1.1\r\n\r\n"), None, "four parts");
      }
    hints:
      - "`raw.split_once(\"\\r\\n\\r\\n\")?` gives `(head, body)`; the request line is `head.split(\"\\r\\n\").next()?`."
      - "Collect the request line's parts into a `Vec<&str>` and use `let [method, path, version] = parts[..] else { return None; };`."
      - "Map the method with `match`, then check `path.starts_with('/')` and `version == \"HTTP/1.1\"`."
    more:
      - task: |
          Write `fn parse_headers(head: &str) -> BTreeMap<String, String>`. `head` is the request line followed by header lines, separated by `\r\n`. Skip the request line; for each `Name: value` line, store the name **lowercased** (header names are case-insensitive) and the value trimmed. Split at the **first** colon only (`Host: localhost:8080` has a colon in the value). Ignore lines without a colon.
        seed: |
          use std::collections::BTreeMap;

          fn parse_headers(head: &str) -> BTreeMap<String, String> {
              todo!()
          }
        solution: |
          use std::collections::BTreeMap;

          fn parse_headers(head: &str) -> BTreeMap<String, String> {
              head.split("\r\n")
                  .skip(1)
                  .filter_map(|line| line.split_once(':'))
                  .map(|(name, value)| (name.trim().to_ascii_lowercase(), value.trim().to_string()))
                  .collect()
          }
        harness: |
          #[test]
          fn lowercases_names_and_trims_values() {
              let h = parse_headers("GET / HTTP/1.1\r\nContent-Type:  application/json \r\nX-Request-ID: abc");
              assert_eq!(h.get("content-type").map(String::as_str), Some("application/json"), "content-type");
              assert_eq!(h.get("x-request-id").map(String::as_str), Some("abc"), "x-request-id");
          }

          #[test]
          fn splits_at_the_first_colon_only() {
              let h = parse_headers("GET / HTTP/1.1\r\nHost: localhost:8080");
              assert_eq!(h.get("host").map(String::as_str), Some("localhost:8080"), "host");
          }

          #[test]
          fn skips_the_request_line_and_lines_without_colons() {
              let h = parse_headers("GET http://x/ HTTP/1.1\r\ngarbage\r\nAccept: */*");
              assert_eq!(h.len(), 1, "number of headers");
          }

          #[test]
          fn no_headers_gives_an_empty_map() {
              assert!(parse_headers("GET / HTTP/1.1").is_empty(), "parse_headers(request line only)");
          }
        hints:
          - "`head.split(\"\\r\\n\").skip(1)` walks the header lines."
          - "`line.split_once(':')` splits at the first colon; `filter_map` drops lines without one."
          - "Collect `(name.trim().to_ascii_lowercase(), value.trim().to_string())` pairs into the BTreeMap."
      - task: |
          Write the other direction: `fn to_http(status: u16, body: &str) -> String` builds a full HTTP response: the status line `HTTP/1.1 <code> <reason>`, a `Content-Type: application/json` header, a `Content-Length` header with the body's length **in bytes**, a blank line, then the body. Lines end with `\r\n`. Reasons: 200 `OK`, 201 `Created`, 204 `No Content`, 400 `Bad Request`, 404 `Not Found`, 405 `Method Not Allowed`, 409 `Conflict`, 500 `Internal Server Error`, anything else `Unknown`.
        seed: |
          fn to_http(status: u16, body: &str) -> String {
              todo!()
          }
        solution: |
          fn reason(status: u16) -> &'static str {
              match status {
                  200 => "OK",
                  201 => "Created",
                  204 => "No Content",
                  400 => "Bad Request",
                  404 => "Not Found",
                  405 => "Method Not Allowed",
                  409 => "Conflict",
                  500 => "Internal Server Error",
                  _ => "Unknown",
              }
          }

          fn to_http(status: u16, body: &str) -> String {
              format!(
                  "HTTP/1.1 {status} {}\r\nContent-Type: application/json\r\nContent-Length: {}\r\n\r\n{body}",
                  reason(status),
                  body.len()
              )
          }
        harness: |
          #[test]
          fn builds_a_created_response() {
              assert_eq!(to_http(201, "{\"id\":1}"), "HTTP/1.1 201 Created\r\nContent-Type: application/json\r\nContent-Length: 8\r\n\r\n{\"id\":1}", "to_http(201, {{\"id\":1}})");
          }

          #[test]
          fn empty_body_has_length_zero() {
              assert_eq!(to_http(204, ""), "HTTP/1.1 204 No Content\r\nContent-Type: application/json\r\nContent-Length: 0\r\n\r\n", "to_http(204, \"\")");
          }

          #[test]
          fn content_length_counts_bytes() {
              assert!(to_http(200, "\"café\"").contains("Content-Length: 7\r\n"), "\"café\" is 7 bytes");
          }

          #[test]
          fn knows_the_common_reasons() {
              assert!(to_http(404, "").starts_with("HTTP/1.1 404 Not Found\r\n"), "404");
              assert!(to_http(405, "").starts_with("HTTP/1.1 405 Method Not Allowed\r\n"), "405");
              assert!(to_http(500, "").starts_with("HTTP/1.1 500 Internal Server Error\r\n"), "500");
              assert!(to_http(418, "").starts_with("HTTP/1.1 418 Unknown\r\n"), "418");
          }
        hints:
          - "A helper `fn reason(status: u16) -> &'static str` with a `match` keeps `to_http` short."
          - "`body.len()` is the length in bytes, exactly what Content-Length needs."
          - "One `format!` with `\\r\\n` between the lines and `\\r\\n\\r\\n` before the body."

  - title: Routing by method and path
    id: web-2
    text: |
      A server receives every request in one place and must decide which code handles it. That's **routing**: look at the method and the path, and pick a **handler**. In Rust, a `match` on a tuple of the method and the **path segments** does it beautifully, thanks to slice patterns:

      ```rust run
      #[derive(Debug, Clone, Copy, PartialEq)]
      enum Method {
          Get,
          Post,
          Delete,
      }

      fn route(method: Method, path: &str) -> (u16, String) {
          let path = path.split('?').next().unwrap_or("");
          let segments: Vec<&str> = path.split('/').filter(|s| !s.is_empty()).collect();
          match (method, segments.as_slice()) {
              (Method::Get, ["health"]) => (200, String::from("ok")),
              (Method::Get, ["players"]) => (200, String::from("list players")),
              (Method::Post, ["players"]) => (201, String::from("create a player")),
              (Method::Get, ["players", id]) => match id.parse::<u32>() {
                  Ok(id) => (200, format!("show player {id}")),
                  Err(_) => (400, format!("bad id {id:?}")),
              },
              (Method::Delete, ["players", id]) => (204, format!("delete player {id}")),
              (_, ["health"] | ["players"] | ["players", _]) => (405, String::from("method not allowed")),
              _ => (404, String::from("not found")),
          }
      }

      fn main() {
          let tries = [
              (Method::Get, "/players"),
              (Method::Get, "/players/42?fields=name"),
              (Method::Get, "/players/ferris"),
              (Method::Post, "/players/"),
              (Method::Delete, "/players/7"),
              (Method::Delete, "/health"),
              (Method::Get, "/teams"),
          ];
          for (method, path) in tries {
              let (status, body) = route(method, path);
              println!("{method:?} {path} -> {status} {body}");
          }
      }
      ```

      ```output
      Get /players -> 200 list players
      Get /players/42?fields=name -> 200 show player 42
      Get /players/ferris -> 400 bad id "ferris"
      Post /players/ -> 201 create a player
      Delete /players/7 -> 204 delete player 7
      Delete /health -> 405 method not allowed
      Get /teams -> 404 not found
      ```

      Piece by piece:

      - Everything after `?` is the **query string** (`?fields=name`), which isn't part of the route, so we cut it off first.
      - `split('/')` on `/players/42` gives `""`, `"players"`, `"42"`; filtering out empty pieces also makes a trailing slash (`/players/`) harmless.
      - `segments.as_slice()` lets us match with **slice patterns**: `["players", id]` matches exactly two segments, the first being `"players"`, and binds the second to `id`.
      - A **path parameter** like `id` is still text. Parse it, and answer `400` when it isn't a valid id: a bad id is the client's mistake, not a missing resource.
      - The second-to-last arm catches known paths with the wrong method (`405`); the last catches everything else (`404`). Arm order matters: `match` takes the first that fits.

      ### Common mistakes

      - **Putting the catch-all `_` arm first**: every request hits it. The compiler warns `unreachable pattern` for the arms after it.
      - **Answering 404 for a wrong method.** Clients and API tools rely on 405 to tell "this path doesn't exist" from "use another method".
      - **Comparing whole path strings** (`path == "/players"`): then `/players/` and `/players?x=1` fail, and ids need manual slicing. Segments and slice patterns handle both.

      **Your turn:** write the router for a books API. `route(method, path)` returns a `Route`: `GET /books` is `ListBooks`, `POST /books` is `CreateBook`, `GET /books/{id}` is `GetBook(id)`, `DELETE /books/{id}` is `DeleteBook(id)`, `GET /books/{id}/reviews` is `ListReviews(id)`. An id that isn't a `u32` gives `BadRequest`; one of those paths with another method gives `MethodNotAllowed` (whatever the id); everything else is `NotFound`. Ignore query strings and trailing slashes.
    seed: |
