      }
    solution: |
      #[derive(Debug, Clone, Copy, PartialEq)]
      enum Method {
          Get,
          Post,
          Put,
          Delete,
      }

      #[derive(Debug, PartialEq)]
      enum Route {
          ListBooks,
          CreateBook,
          GetBook(u32),
          DeleteBook(u32),
          ListReviews(u32),
          BadRequest,
          NotFound,
          MethodNotAllowed,
      }

      fn route(method: Method, path: &str) -> Route {
          let path = path.split('?').next().unwrap_or("");
          let segments: Vec<&str> = path.split('/').filter(|s| !s.is_empty()).collect();
          match (method, segments.as_slice()) {
              (Method::Get, ["books"]) => Route::ListBooks,
              (Method::Post, ["books"]) => Route::CreateBook,
              (Method::Get, ["books", id]) => id.parse().map_or(Route::BadRequest, Route::GetBook),
              (Method::Delete, ["books", id]) => id.parse().map_or(Route::BadRequest, Route::DeleteBook),
              (Method::Get, ["books", id, "reviews"]) => id.parse().map_or(Route::BadRequest, Route::ListReviews),
              (_, ["books"] | ["books", _] | ["books", _, "reviews"]) => Route::MethodNotAllowed,
              _ => Route::NotFound,
          }
      }
    harness: |
      #[test]
      fn routes_the_collection() {
          assert_eq!(route(Method::Get, "/books"), Route::ListBooks, "GET /books");
          assert_eq!(route(Method::Post, "/books"), Route::CreateBook, "POST /books");
      }

      #[test]
      fn routes_single_books_with_ids() {
          assert_eq!(route(Method::Get, "/books/12"), Route::GetBook(12), "GET /books/12");
          assert_eq!(route(Method::Delete, "/books/3"), Route::DeleteBook(3), "DELETE /books/3");
          assert_eq!(route(Method::Get, "/books/5/reviews"), Route::ListReviews(5), "GET /books/5/reviews");
      }

      #[test]
      fn ignores_query_strings_and_trailing_slashes() {
          assert_eq!(route(Method::Get, "/books/?sort=title"), Route::ListBooks, "GET /books/?sort=title");
          assert_eq!(route(Method::Get, "/books/9/reviews/"), Route::ListReviews(9), "GET /books/9/reviews/");
      }

      #[test]
      fn bad_ids_are_bad_requests() {
          assert_eq!(route(Method::Get, "/books/abc"), Route::BadRequest, "GET /books/abc");
          assert_eq!(route(Method::Delete, "/books/-1"), Route::BadRequest, "DELETE /books/-1");
      }

      #[test]
      fn wrong_methods_are_not_allowed() {
          assert_eq!(route(Method::Put, "/books"), Route::MethodNotAllowed, "PUT /books");
          assert_eq!(route(Method::Post, "/books/abc"), Route::MethodNotAllowed, "POST /books/abc");
          assert_eq!(route(Method::Delete, "/books/1/reviews"), Route::MethodNotAllowed, "DELETE /books/1/reviews");
      }

      #[test]
      fn unknown_paths_are_not_found() {
          assert_eq!(route(Method::Get, "/"), Route::NotFound, "GET /");
          assert_eq!(route(Method::Get, "/authors"), Route::NotFound, "GET /authors");
          assert_eq!(route(Method::Get, "/books/1/likes"), Route::NotFound, "GET /books/1/likes");
      }
    hints:
      - "Cut the query string with `path.split('?').next()`, then collect the non-empty `split('/')` pieces into a `Vec<&str>`."
      - "`match (method, segments.as_slice())` with arms like `(Method::Get, [\"books\", id]) => ...`."
      - "`id.parse().map_or(Route::BadRequest, Route::GetBook)` gives the route or BadRequest. Put the 405 arm `(_, [\"books\"] | [\"books\", _] | [\"books\", _, \"reviews\"])` after the specific ones."
    more:
      - task: |
          Query strings carry options like filters and pages: `/search?q=crab&page=2`. Write `fn parse_query(target: &str) -> (&str, BTreeMap<String, String>)` returning the path and the parameters. Parameters are separated by `&`; each is `key=value` (split at the first `=`), and a `+` in a value means a space. A key without `=` maps to an empty string; empty pieces (`a=1&&b=2`) are skipped.
        seed: |
          use std::collections::BTreeMap;

          fn parse_query(target: &str) -> (&str, BTreeMap<String, String>) {
              todo!()
          }
        solution: |
          use std::collections::BTreeMap;

          fn parse_query(target: &str) -> (&str, BTreeMap<String, String>) {
              let (path, query) = target.split_once('?').unwrap_or((target, ""));
              let params = query
                  .split('&')
                  .filter(|piece| !piece.is_empty())
                  .map(|piece| match piece.split_once('=') {
                      Some((key, value)) => (key.to_string(), value.replace('+', " ")),
                      None => (piece.to_string(), String::new()),
                  })
                  .collect();
              (path, params)
          }
        harness: |
          fn map(pairs: &[(&str, &str)]) -> BTreeMap<String, String> {
              pairs.iter().map(|(k, v)| (k.to_string(), v.to_string())).collect()
          }

          #[test]
          fn splits_path_and_parameters() {
              assert_eq!(parse_query("/search?q=crab&page=2"), ("/search", map(&[("q", "crab"), ("page", "2")])), "parse_query(/search?q=crab&page=2)");
          }

          #[test]
          fn no_query_gives_no_parameters() {
              assert_eq!(parse_query("/books"), ("/books", map(&[])), "parse_query(/books)");
          }

          #[test]
          fn plus_means_space() {
              assert_eq!(parse_query("/s?q=hermit+crab"), ("/s", map(&[("q", "hermit crab")])), "parse_query(q=hermit+crab)");
          }

          #[test]
          fn keys_without_values_and_empty_pieces() {
              assert_eq!(parse_query("/s?debug&&x=1=2"), ("/s", map(&[("debug", ""), ("x", "1=2")])), "parse_query(debug&&x=1=2)");
          }
        hints:
          - "`target.split_once('?').unwrap_or((target, \"\"))` gives the path and the query."
