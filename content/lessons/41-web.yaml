              pairs.iter().map(|(k, v)| (k.to_string(), v.to_string())).collect()
          }

          #[test]
          fn defaults_to_the_first_page_of_20() {
              assert_eq!(page_params(&q(&[])), Ok((0, 20)), "page_params({{}})");
          }

          #[test]
          fn computes_the_offset() {
              assert_eq!(page_params(&q(&[("page", "3"), ("per_page", "50")])), Ok((100, 50)), "page=3, per_page=50");
              assert_eq!(page_params(&q(&[("page", "2")])), Ok((20, 20)), "page=2");
          }

          #[test]
          fn rejects_bad_pages() {
              assert_eq!(page_params(&q(&[("page", "0")])), Err(String::from("invalid page \"0\"")), "page=0");
              assert_eq!(page_params(&q(&[("page", "two")])), Err(String::from("invalid page \"two\"")), "page=two");
          }

          #[test]
          fn rejects_per_page_out_of_range() {
              assert_eq!(page_params(&q(&[("per_page", "500")])), Err(String::from("per_page must be 1 to 100")), "per_page=500");
              assert_eq!(page_params(&q(&[("per_page", "0")])), Err(String::from("per_page must be 1 to 100")), "per_page=0");
          }
