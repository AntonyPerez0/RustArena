        solution: |
          #[derive(Debug, Clone, Copy, PartialEq)]
          enum Method {
              Get,
              Post,
          }

          struct Request {
              method: Method,
              path: String,
              body: String,
          }

          #[derive(Debug, PartialEq)]
          struct Response {
              status: u16,
              body: String,
          }

          type Handler = Box<dyn Fn(&Request) -> Response>;

          struct Router {
              routes: Vec<(Method, String, Handler)>,
          }

          impl Router {
              fn new() -> Self {
                  Router { routes: Vec::new() }
              }

              fn route(mut self, method: Method, path: &str, handler: impl Fn(&Request) -> Response + 'static) -> Self {
                  self.routes.push((method, path.to_string(), Box::new(handler)));
                  self
              }

              fn handle(&self, req: &Request) -> Response {
                  if let Some((_, _, handler)) = self.routes.iter().find(|(m, p, _)| *m == req.method && *p == req.path) {
                      return handler(req);
                  }
                  if self.routes.iter().any(|(_, p, _)| *p == req.path) {
                      Response { status: 405, body: String::from("method not allowed") }
                  } else {
                      Response { status: 404, body: String::from("not found") }
                  }
              }
          }
        harness: |
          use std::sync::{Arc, Mutex};

          fn req(method: Method, path: &str, body: &str) -> Request {
              Request { method, path: path.to_string(), body: body.to_string() }
          }

          fn app() -> (Router, Arc<Mutex<Vec<String>>>) {
              let names = Arc::new(Mutex::new(Vec::new()));
              let for_list = Arc::clone(&names);
              let for_add = Arc::clone(&names);
              let router = Router::new()
                  .route(Method::Get, "/health", |_| Response { status: 200, body: String::from("ok") })
                  .route(Method::Get, "/names", move |_| Response { status: 200, body: for_list.lock().unwrap().join(",") })
                  .route(Method::Post, "/names", move |r| {
                      for_add.lock().unwrap().push(r.body.clone());
                      Response { status: 201, body: r.body.clone() }
                  });
              (router, names)
          }

          #[test]
          fn calls_the_matching_handler() {
              let (router, _) = app();
              assert_eq!(router.handle(&req(Method::Get, "/health", "")), Response { status: 200, body: String::from("ok") }, "GET /health");
          }

          #[test]
          fn handlers_can_share_state() {
              let (router, names) = app();
              router.handle(&req(Method::Post, "/names", "ana"));
              router.handle(&req(Method::Post, "/names", "bo"));
              assert_eq!(router.handle(&req(Method::Get, "/names", "")).body, "ana,bo", "GET /names");
              assert_eq!(names.lock().unwrap().len(), 2, "names stored");
          }

          #[test]
          fn known_path_wrong_method_is_405() {
              let (router, _) = app();
              assert_eq!(router.handle(&req(Method::Post, "/health", "")), Response { status: 405, body: String::from("method not allowed") }, "POST /health");
          }

          #[test]
          fn unknown_path_is_404() {
              let (router, _) = app();
              assert_eq!(router.handle(&req(Method::Get, "/nope", "")), Response { status: 404, body: String::from("not found") }, "GET /nope");
              assert_eq!(Router::new().handle(&req(Method::Get, "/", "")).status, 404, "empty router");
          }
