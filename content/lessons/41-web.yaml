          use serde_json::json;
          use std::collections::BTreeMap;

          #[derive(Debug, PartialEq)]
          struct Response {
              status: u16,
              body: String,
          }

          #[derive(Debug)]
          enum ApiError {
              Validation(BTreeMap<String, String>),
          }

          impl ApiError {
              fn into_response(self) -> Response {
                  match self {
                      ApiError::Validation(fields) => Response {
                          status: 422,
                          body: json!({ "error": "validation failed", "fields": fields }).to_string(),
                      },
                  }
              }
          }

          struct Signup {
              name: String,
              email: String,
              age: u32,
          }

          fn validate_signup(s: &Signup) -> Result<(), ApiError> {
              let mut fields = BTreeMap::new();
              if s.name.trim().is_empty() {
                  fields.insert(String::from("name"), String::from("required"));
              }
              if !s.email.contains('@') {
                  fields.insert(String::from("email"), String::from("must contain @"));
              }
              if s.age < 13 {
                  fields.insert(String::from("age"), String::from("must be at least 13"));
              }
              if fields.is_empty() { Ok(()) } else { Err(ApiError::Validation(fields)) }
          }
        harness: |
          fn signup(name: &str, email: &str, age: u32) -> Signup {
              Signup { name: name.to_string(), email: email.to_string(), age }
          }

          fn check(s: &Signup) -> Option<Response> {
              validate_signup(s).err().map(ApiError::into_response)
          }

          #[test]
          fn a_valid_signup_passes() {
              assert!(validate_signup(&signup("Ana", "ana@arena.dev", 30)).is_ok(), "valid signup");
          }

          #[test]
          fn one_bad_field_is_reported() {
              assert_eq!(check(&signup("Ana", "ana", 30)), Some(Response { status: 422, body: String::from(r#"{"error":"validation failed","fields":{"email":"must contain @"}}"#) }), "bad email");
          }

          #[test]
          fn all_bad_fields_are_reported_together() {
              assert_eq!(check(&signup("  ", "x", 9)), Some(Response { status: 422, body: String::from(r#"{"error":"validation failed","fields":{"age":"must be at least 13","email":"must contain @","name":"required"}}"#) }), "everything wrong");
          }

          #[test]
          fn thirteen_is_old_enough() {
              assert!(validate_signup(&signup("Bo", "bo@x.io", 13)).is_ok(), "age 13");
          }
