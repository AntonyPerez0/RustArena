              let mut items = state.items.lock().unwrap();
              match items.get_mut(&id) {
                  Some(item) => {
                      item.name = new.name;
                      item.qty = new.qty;
                      json_response(200, item)
                  }
                  None => error_response(404, &format!("item {id} not found")),
