        solution: |
          use serde::de::DeserializeOwned;
          use serde::Deserialize;

          struct Request {
              body: String,
          }

          #[derive(Debug, PartialEq)]
          struct Response {
              status: u16,
              body: String,
          }

          struct Json<T>(T);

          trait FromRequest: Sized {
              fn from_request(req: &Request) -> Result<Self, Response>;
          }

          impl<T: DeserializeOwned> FromRequest for Json<T> {
              fn from_request(req: &Request) -> Result<Self, Response> {
                  serde_json::from_str(&req.body)
                      .map(Json)
                      .map_err(|_| Response { status: 400, body: String::from("invalid JSON") })
              }
          }

          impl FromRequest for String {
              fn from_request(req: &Request) -> Result<Self, Response> {
                  Ok(req.body.clone())
              }
          }

          fn call<A: FromRequest>(req: &Request, handler: impl Fn(A) -> Response) -> Response {
              match A::from_request(req) {
                  Ok(arg) => handler(arg),
                  Err(response) => response,
              }
          }
        harness: |
          #[derive(Deserialize)]
          struct Greeting {
              name: String,
          }

          fn greet(Json(g): Json<Greeting>) -> Response {
              Response { status: 200, body: format!("hello {}", g.name) }
          }

          fn echo(body: String) -> Response {
              Response { status: 200, body: body.to_uppercase() }
          }

          fn req(body: &str) -> Request {
              Request { body: body.to_string() }
          }

          #[test]
          fn json_extractor_parses_the_body() {
              assert_eq!(call(&req(r#"{"name": "Ferris"}"#), greet), Response { status: 200, body: String::from("hello Ferris") }, "greet(valid JSON)");
          }

          #[test]
          fn bad_json_never_reaches_the_handler() {
              assert_eq!(call(&req("{name"), greet), Response { status: 400, body: String::from("invalid JSON") }, "greet(broken JSON)");
              assert_eq!(call(&req(r#"{"nom": "x"}"#), greet), Response { status: 400, body: String::from("invalid JSON") }, "greet(missing name)");
          }

          #[test]
          fn string_extractor_gets_the_raw_body() {
              assert_eq!(call(&req("crab"), echo), Response { status: 200, body: String::from("CRAB") }, "echo(\"crab\")");
          }
        hints:
          - "`DeserializeOwned` means \"can be deserialized without borrowing from the input\", which is what `from_str` on a temporary body needs."
          - "`serde_json::from_str(&req.body).map(Json).map_err(|_| Response { status: 400, ... })`"
          - "`call` is a `match A::from_request(req)`: `Ok(arg) => handler(arg)`, `Err(response) => response`."
