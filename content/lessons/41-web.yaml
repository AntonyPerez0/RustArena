      use serde::{Deserialize, Serialize};
      use serde_json::json;
      use std::collections::BTreeMap;
      use std::sync::Mutex;

      #[derive(Debug, Clone, Copy, PartialEq)]
      enum Method {
          Get,
          Post,
          Delete,
      }

      struct Request {
          method: Method,
          path: String,
          body: String,
      }

      #[derive(Debug, PartialEq)]
      struct Response {
          status: u16,
          body: String,
      }

      #[derive(Clone, Serialize)]
      struct Item {
          id: u32,
          name: String,
          qty: u32,
      }

      #[derive(Deserialize)]
      struct NewItem {
          name: String,
          qty: u32,
      }

      #[derive(Default)]
      struct Store {
          items: BTreeMap<u32, Item>,
          next_id: u32,
      }

      #[derive(Default)]
      struct AppState {
          store: Mutex<Store>,
      }

      fn json_response<T: Serialize>(status: u16, value: &T) -> Response {
          Response { status, body: serde_json::to_string(value).expect("response types always serialize") }
      }

      fn error_response(status: u16, message: &str) -> Response {
          json_response(status, &json!({ "error": message }))
      }

      fn list_items(state: &AppState) -> Response {
          let store = state.store.lock().unwrap();
          let items: Vec<&Item> = store.items.values().collect();
          json_response(200, &items)
      }

      fn create_item(state: &AppState, body: &str) -> Response {
          let Ok(new) = serde_json::from_str::<NewItem>(body) else {
              return error_response(400, "invalid JSON");
          };
          let mut store = state.store.lock().unwrap();
          store.next_id += 1;
          let item = Item { id: store.next_id, name: new.name, qty: new.qty };
          store.items.insert(item.id, item.clone());
          json_response(201, &item)
      }

      fn get_item(state: &AppState, id: u32) -> Response {
          match state.store.lock().unwrap().items.get(&id) {
              Some(item) => json_response(200, item),
              None => error_response(404, &format!("item {id} not found")),
          }
      }

      fn delete_item(state: &AppState, id: u32) -> Response {
          match state.store.lock().unwrap().items.remove(&id) {
              Some(_) => Response { status: 204, body: String::new() },
              None => error_response(404, &format!("item {id} not found")),
          }
      }

      fn handle(state: &AppState, req: &Request) -> Response {
          let segments: Vec<&str> = req.path.split('/').filter(|s| !s.is_empty()).collect();
          match (req.method, segments.as_slice()) {
              (Method::Get, ["items"]) => list_items(state),
              (Method::Post, ["items"]) => create_item(state, &req.body),
              (Method::Get | Method::Delete, ["items", id]) => {
                  let Ok(id) = id.parse::<u32>() else {
                      return error_response(400, "bad id");
                  };
                  if req.method == Method::Get { get_item(state, id) } else { delete_item(state, id) }
              }
              (_, ["items"] | ["items", _]) => error_response(405, "method not allowed"),
              _ => error_response(404, "not found"),
          }
      }
    harness: |
      fn req(method: Method, path: &str, body: &str) -> Request {
          Request { method, path: path.to_string(), body: body.to_string() }
      }

      fn r(status: u16, body: &str) -> Response {
          Response { status, body: body.to_string() }
      }

      #[test]
      fn creates_and_lists_items() {
          let state = AppState::default();
          assert_eq!(handle(&state, &req(Method::Post, "/items", r#"{"name": "mug", "qty": 3}"#)), r(201, r#"{"id":1,"name":"mug","qty":3}"#), "POST mug");
          assert_eq!(handle(&state, &req(Method::Post, "/items", r#"{"name": "tea", "qty": 10}"#)), r(201, r#"{"id":2,"name":"tea","qty":10}"#), "POST tea");
          assert_eq!(handle(&state, &req(Method::Get, "/items", "")), r(200, r#"[{"id":1,"name":"mug","qty":3},{"id":2,"name":"tea","qty":10}]"#), "GET /items");
      }

      #[test]
      fn gets_and_deletes_one_item() {
          let state = AppState::default();
          handle(&state, &req(Method::Post, "/items", r#"{"name": "lamp", "qty": 1}"#));
          assert_eq!(handle(&state, &req(Method::Get, "/items/1", "")), r(200, r#"{"id":1,"name":"lamp","qty":1}"#), "GET /items/1");
          assert_eq!(handle(&state, &req(Method::Delete, "/items/1", "")), r(204, ""), "DELETE /items/1");
          assert_eq!(handle(&state, &req(Method::Get, "/items/1", "")), r(404, r#"{"error":"item 1 not found"}"#), "GET /items/1 after delete");
          assert_eq!(handle(&state, &req(Method::Delete, "/items/1", "")), r(404, r#"{"error":"item 1 not found"}"#), "DELETE /items/1 again");
      }

      #[test]
      fn empty_store_lists_nothing() {
          assert_eq!(handle(&AppState::default(), &req(Method::Get, "/items", "")), r(200, "[]"), "GET /items on an empty store");
      }

      #[test]
      fn bad_input_is_400() {
          let state = AppState::default();
          assert_eq!(handle(&state, &req(Method::Post, "/items", r#"{"name": "mug"}"#)), r(400, r#"{"error":"invalid JSON"}"#), "POST without qty");
          assert_eq!(handle(&state, &req(Method::Get, "/items/abc", "")), r(400, r#"{"error":"bad id"}"#), "GET /items/abc");
      }

      #[test]
      fn wrong_methods_and_paths() {
          let state = AppState::default();
          assert_eq!(handle(&state, &req(Method::Delete, "/items", "")), r(405, r#"{"error":"method not allowed"}"#), "DELETE /items");
          assert_eq!(handle(&state, &req(Method::Post, "/items/3", "{}")), r(405, r#"{"error":"method not allowed"}"#), "POST /items/3");
          assert_eq!(handle(&state, &req(Method::Get, "/orders", "")), r(404, r#"{"error":"not found"}"#), "GET /orders");
      }

      #[test]
      fn concurrent_requests_get_unique_ids() {
          let state = AppState::default();
          std::thread::scope(|s| {
              for t in 0..4 {
                  let state = &state;
                  s.spawn(move || {
                      for i in 0..25 {
                          let body = format!(r#"{{"name": "t{t}-{i}", "qty": 1}}"#);
                          assert_eq!(handle(state, &req(Method::Post, "/items", &body)).status, 201);
                      }
                  });
              }
          });
          let list: serde_json::Value = serde_json::from_str(&handle(&state, &req(Method::Get, "/items", "")).body).unwrap();
          let ids: Vec<u64> = list.as_array().unwrap().iter().map(|i| i["id"].as_u64().unwrap()).collect();
          assert_eq!(ids, (1..=100).collect::<Vec<u64>>(), "ids after 100 concurrent creates");
      }
