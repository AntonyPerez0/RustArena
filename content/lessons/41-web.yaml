        solution: |
          use serde_json::json;
          use std::collections::HashMap;
          use std::sync::Mutex;

          #[derive(Debug, PartialEq)]
          struct Response {
              status: u16,
              body: String,
          }

          struct Limiter {
              limit: u32,
              hits: Mutex<HashMap<String, u32>>,
          }

          impl Limiter {
              fn new(limit: u32) -> Self {
                  Limiter { limit, hits: Mutex::new(HashMap::new()) }
              }

              fn check(&self, client: &str) -> Response {
                  let mut hits = self.hits.lock().unwrap();
                  let count = hits.entry(client.to_string()).or_insert(0);
                  *count += 1;
                  if *count <= self.limit {
                      Response { status: 200, body: json!({ "remaining": self.limit - *count }).to_string() }
                  } else {
                      Response { status: 429, body: json!({ "error": "too many requests" }).to_string() }
                  }
              }
          }
        harness: |
          #[test]
          fn counts_down_then_refuses() {
              let l = Limiter::new(2);
              assert_eq!(l.check("ana"), Response { status: 200, body: String::from(r#"{"remaining":1}"#) }, "1st request");
              assert_eq!(l.check("ana"), Response { status: 200, body: String::from(r#"{"remaining":0}"#) }, "2nd request");
              assert_eq!(l.check("ana"), Response { status: 429, body: String::from(r#"{"error":"too many requests"}"#) }, "3rd request");
          }

          #[test]
          fn clients_are_counted_separately() {
              let l = Limiter::new(1);
              assert_eq!(l.check("ana").status, 200, "ana");
              assert_eq!(l.check("bo").status, 200, "bo");
              assert_eq!(l.check("ana").status, 429, "ana again");
          }

          #[test]
          fn exactly_limit_requests_succeed_under_concurrency() {
              let l = Limiter::new(50);
              let ok = std::sync::atomic::AtomicU32::new(0);
              std::thread::scope(|s| {
                  for _ in 0..8 {
                      s.spawn(|| {
                          for _ in 0..20 {
                              if l.check("bot").status == 200 {
                                  ok.fetch_add(1, std::sync::atomic::Ordering::SeqCst);
                              }
                          }
                      });
                  }
              });
              assert_eq!(ok.into_inner(), 50, "successful requests out of 160");
          }
        hints:
          - "Lock once, then `hits.entry(client.to_string()).or_insert(0)` gives a `&mut u32` to bump."
          - "Compare the new count with `self.limit` while still holding the lock, so two threads can't both take the last slot."

  - title: Testing handlers
    id: web-6
    text: |
      Here's the payoff of handlers being plain functions: **testing them is just calling them**. No server, no network, no ports. Build a request, call the handler, check the status and the body. Teams write dozens of these per endpoint, and they run in milliseconds.

      ```rust
      #[cfg(test)]
      mod tests {
          use super::*;
          use serde_json::{json, Value};

          fn post(path: &str, body: &str) -> Response {
              handle(&Request { method: Method::Post, path: path.to_string(), body: body.to_string() })
          }

          fn body_json(r: &Response) -> Value {
              serde_json::from_str(&r.body).expect("response body is JSON")
          }

          #[test]
          fn creating_a_user_returns_201_and_the_user() {
              let r = post("/users", r#"{"name": "Ana", "email": "ana@arena.dev"}"#);
              assert_eq!(r.status, 201);
              assert_eq!(body_json(&r), json!({ "id": 1, "name": "Ana", "email": "ana@arena.dev" }));
          }

          #[test]
          fn invalid_email_is_422() {
              let r = post("/users", r#"{"name": "Bo", "email": "bo"}"#);
              assert_eq!(r.status, 422);
              assert_eq!(body_json(&r)["error"], "email must contain @");
          }
      }
      ```

      What good handler tests do:

      - **Compare JSON as values, not strings.** Parsing the body into a `serde_json::Value` and comparing with `json!` ignores key order and spacing, so a harmless serializer change doesn't break every test. `value["error"] == "..."` checks one field.
      - **Use small helpers** (`post`, `get`, `body_json`) so each test reads like a sentence about one behavior.
      - **Test the unhappy paths at least as much as the happy one**: bad JSON, missing fields, wrong method, unknown ids, and **boundaries** (exactly at a limit, one below it). Most production bugs live at the edges.
      - **Name tests after behavior**: `half_needs_2000_cents`, not `test3`. When it fails in CI, the name is the first clue.
      - **Table-driven tests** cover many routes compactly:

      ```rust
      #[test]
      fn routes_answer_with_the_right_status() {
          let cases = [
              (Method::Get, "/items", 200),
              (Method::Delete, "/items", 405),
              (Method::Get, "/nope", 404),
          ];
          for (method, path, want) in cases {
              let r = handle(&Request { method, path: path.to_string(), body: String::new() });
              assert_eq!(r.status, want, "{method:?} {path}");
          }
      }
      ```

      The message argument (`"{method:?} {path}"`) tells you **which** case failed.

      With axum (next step), the same tests send a request through the whole router with `tower::ServiceExt::oneshot`, still without opening a port.

      **Your turn:** this time you write the tests. The handler below quotes a price for a shopping cart. Its rules: only `POST /quote` exists (another method on `/quote` is `405`, other paths `404`); the body is `{"cents": <cart total>, "code": <optional discount code>}`, and one that doesn't parse is `400`; no code means the full price; `CRAB10` takes 10% off; `HALF` halves the price but only for carts of **at least** 2000 cents (below that: `422`); any other code is `422`. Success is `200` with `{"total": <cents>}`. Write at least 4 tests that pin down these rules. Hidden broken versions of the handler (a wrong discount, an off-by-one boundary, wrong status codes) must each make at least one of your tests fail.
    mode: test
    minTests: 4
    seed: |
      use serde::Deserialize;
      use serde_json::json;

      #[derive(Debug, Clone, Copy, PartialEq)]
      enum Method {
          Get,
          Post,
      }

      struct Request {
          method: Method,
          path: &'static str,
          body: &'static str,
      }

      #[derive(Debug)]
      struct Response {
          status: u16,
          body: String,
      }

      #[derive(Deserialize)]
      struct Quote {
          cents: u64,
          code: Option<String>,
      }

      fn error(status: u16, message: &str) -> Response {
          Response { status, body: json!({ "error": message }).to_string() }
      }

      fn handle(req: &Request) -> Response {
          if req.path != "/quote" {
              return error(404, "not found");
          }
          if req.method != Method::Post {
              return error(405, "method not allowed");
          }
          let Ok(q) = serde_json::from_str::<Quote>(req.body) else {
              return error(400, "invalid JSON");
          };
          let total = match q.code.as_deref() {
              None => q.cents,
              Some("CRAB10") => q.cents * 90 / 100,
              Some("HALF") if q.cents >= 2000 => q.cents / 2,
              Some("HALF") => return error(422, "HALF needs a cart of at least 2000 cents"),
              Some(_) => return error(422, "unknown code"),
          };
          Response { status: 200, body: json!({ "total": total }).to_string() }
      }

      #[cfg(test)]
      mod tests {
          use super::*;
          use serde_json::Value;

          fn post(body: &'static str) -> Response {
              handle(&Request { method: Method::Post, path: "/quote", body })
          }

          fn body_json(r: &Response) -> Value {
              serde_json::from_str(&r.body).unwrap()
          }

          // Write your #[test] functions here.
      }
    solution: |
      use serde::Deserialize;
