    solution: |
      use serde::Serialize;

      #[derive(Debug, PartialEq)]
      struct Response {
          status: u16,
          content_type: &'static str,
          body: String,
      }

      trait IntoResponse {
          fn into_response(self) -> Response;
      }

      struct Json<T>(T);

      impl IntoResponse for &'static str {
          fn into_response(self) -> Response {
              Response { status: 200, content_type: "text/plain", body: self.to_string() }
          }
      }

      impl IntoResponse for (u16, &'static str) {
          fn into_response(self) -> Response {
              let mut r = self.1.into_response();
              r.status = self.0;
              r
          }
      }

      impl<T: Serialize> IntoResponse for Json<T> {
          fn into_response(self) -> Response {
              let body = serde_json::to_string(&self.0).expect("response types always serialize");
              Response { status: 200, content_type: "application/json", body }
          }
      }

      impl<T: Serialize> IntoResponse for (u16, Json<T>) {
          fn into_response(self) -> Response {
              let mut r = self.1.into_response();
              r.status = self.0;
              r
          }
      }

      impl<T: IntoResponse, E: IntoResponse> IntoResponse for Result<T, E> {
          fn into_response(self) -> Response {
              match self {
                  Ok(t) => t.into_response(),
                  Err(e) => e.into_response(),
              }
          }
      }
    harness: |
      use serde_json::json;

      #[derive(Serialize)]
      struct Score {
          player: &'static str,
          points: u32,
      }

      fn score(player: &str) -> Result<Json<Score>, (u16, &'static str)> {
          match player {
              "ana" => Ok(Json(Score { player: "ana", points: 40 })),
              _ => Err((404, "no such player")),
          }
      }

      #[test]
      fn plain_text_is_200() {
          assert_eq!("pong".into_response(), Response { status: 200, content_type: "text/plain", body: String::from("pong") }, "\"pong\".into_response()");
      }

      #[test]
      fn a_status_and_text() {
          assert_eq!((404, "not found").into_response(), Response { status: 404, content_type: "text/plain", body: String::from("not found") }, "(404, \"not found\")");
      }

      #[test]
      fn json_values_are_serialized() {
          assert_eq!(Json(vec![1, 2, 3]).into_response(), Response { status: 200, content_type: "application/json", body: String::from("[1,2,3]") }, "Json(vec![1, 2, 3])");
          assert_eq!((201, Json(json!({ "id": 9 }))).into_response(), Response { status: 201, content_type: "application/json", body: String::from(r#"{"id":9}"#) }, "(201, Json(..))");
      }

      #[test]
      fn results_use_whichever_side_they_hold() {
          assert_eq!(score("ana").into_response(), Response { status: 200, content_type: "application/json", body: String::from(r#"{"player":"ana","points":40}"#) }, "score(\"ana\")");
          assert_eq!(score("bo").into_response(), Response { status: 404, content_type: "text/plain", body: String::from("no such player") }, "score(\"bo\")");
      }
    hints:
      - "Each case is its own impl block: `impl IntoResponse for &'static str { fn into_response(self) -> Response { ... } }`."
      - "Generic impls carry their bounds: `impl<T: Serialize> IntoResponse for Json<T>` and `impl<T: IntoResponse, E: IntoResponse> IntoResponse for Result<T, E>`."
      - "The tuple impls can reuse the others: `let mut r = self.1.into_response(); r.status = self.0; r`."
