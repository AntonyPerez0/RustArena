          code: Option<String>,
      }

      fn error(status: u16, message: &str) -> Response {
          Response { status, body: json!({ "error": message }).to_string() }
      }

      fn handle(req: &Request) -> Response {
          if req.path != "/quote" {
              return error(404, "not found");
          }
          if req.method != Method::Post {
              return error(405, "method not allowed");
          }
          let Ok(q) = serde_json::from_str::<Quote>(req.body) else {
              return error(400, "invalid JSON");
          };
          let total = match q.code.as_deref() {
              None => q.cents,
              Some("CRAB10") => q.cents * 90 / 100,
              Some("HALF") if q.cents >= 2000 => q.cents / 2,
              Some("HALF") => return error(422, "HALF needs a cart of at least 2000 cents"),
              Some(_) => return error(422, "unknown code"),
          };
          Response { status: 200, body: json!({ "total": total }).to_string() }
      }

      #[cfg(test)]
      mod tests {
          use super::*;
          use serde_json::Value;

          fn post(body: &'static str) -> Response {
              handle(&Request { method: Method::Post, path: "/quote", body })
          }

          fn body_json(r: &Response) -> Value {
              serde_json::from_str(&r.body).unwrap()
          }

          #[test]
          fn no_code_charges_the_full_price() {
              let r = post(r#"{"cents": 1500}"#);
              assert_eq!(r.status, 200);
              assert_eq!(body_json(&r), json!({ "total": 1500 }));
          }

          #[test]
          fn crab10_takes_ten_percent_off() {
              let r = post(r#"{"cents": 1000, "code": "CRAB10"}"#);
              assert_eq!(r.status, 200);
              assert_eq!(body_json(&r)["total"], 900);
          }

          #[test]
          fn half_applies_from_exactly_2000_cents() {
              assert_eq!(body_json(&post(r#"{"cents": 2000, "code": "HALF"}"#))["total"], 1000);
              assert_eq!(post(r#"{"cents": 1999, "code": "HALF"}"#).status, 422);
          }

          #[test]
          fn unknown_codes_are_rejected() {
              assert_eq!(post(r#"{"cents": 500, "code": "FREE"}"#).status, 422);
          }

          #[test]
          fn bad_bodies_are_400() {
              assert_eq!(post("{cents: 5}").status, 400);
              assert_eq!(post(r#"{"code": "HALF"}"#).status, 400);
          }

          #[test]
          fn wrong_methods_and_paths() {
              assert_eq!(handle(&Request { method: Method::Get, path: "/quote", body: "" }).status, 405);
              assert_eq!(handle(&Request { method: Method::Post, path: "/quotes", body: "{}" }).status, 404);
          }
