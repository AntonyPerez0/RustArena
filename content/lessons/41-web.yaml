        solution: |
          use serde_json::{json, Value};
          use std::sync::Mutex;

          #[derive(Debug, Clone, Copy, PartialEq)]
          enum Method {
              Get,
              Post,
          }

          struct Request {
              method: Method,
              path: String,
              body: String,
          }

          struct Response {
              status: u16,
              body: String,
          }

          #[derive(Default)]
          struct AppState {
              counter: Mutex<i64>,
          }

          fn handle(state: &AppState, req: &Request) -> Response {
              let mut counter = state.counter.lock().unwrap();
              match (req.method, req.path.as_str()) {
                  (Method::Get, "/counter") => Response { status: 200, body: json!({ "value": *counter }).to_string() },
                  (Method::Post, "/counter/add") => match serde_json::from_str::<Value>(&req.body).ok().and_then(|v| v["by"].as_i64()) {
                      Some(by) => {
                          *counter += by;
                          Response { status: 200, body: json!({ "value": *counter }).to_string() }
                      }
                      None => Response { status: 400, body: json!({ "error": "expected {\"by\": <number>}" }).to_string() },
                  },
                  (Method::Post, "/counter/reset") => {
                      *counter = 0;
                      Response { status: 204, body: String::new() }
                  }
                  _ => Response { status: 404, body: json!({ "error": "not found" }).to_string() },
              }
          }

          struct TestClient {
              state: AppState,
          }

          impl TestClient {
              fn new() -> Self {
                  TestClient { state: AppState::default() }
              }

              fn send(&self, method: Method, path: &str, body: String) -> (u16, Value) {
                  let r = handle(&self.state, &Request { method, path: path.to_string(), body });
                  let value = if r.body.is_empty() { Value::Null } else { serde_json::from_str(&r.body).expect("response body is JSON") };
                  (r.status, value)
              }

              fn get(&self, path: &str) -> (u16, Value) {
                  self.send(Method::Get, path, String::new())
              }

              fn post(&self, path: &str, body: Value) -> (u16, Value) {
                  self.send(Method::Post, path, body.to_string())
              }
          }
        harness: |
          #[test]
          fn get_returns_status_and_json() {
              let c = TestClient::new();
              assert_eq!(c.get("/counter"), (200, json!({ "value": 0 })), "GET /counter");
          }

          #[test]
          fn post_sends_a_json_body() {
              let c = TestClient::new();
              assert_eq!(c.post("/counter/add", json!({ "by": 5 })), (200, json!({ "value": 5 })), "POST add 5");
              assert_eq!(c.post("/counter/add", json!({ "by": -2 })), (200, json!({ "value": 3 })), "POST add -2");
              assert_eq!(c.get("/counter"), (200, json!({ "value": 3 })), "GET after adds");
          }

          #[test]
          fn empty_bodies_become_null() {
              let c = TestClient::new();
              assert_eq!(c.post("/counter/reset", Value::Null), (204, Value::Null), "POST reset");
          }

          #[test]
          fn errors_come_back_as_json_too() {
              let c = TestClient::new();
              assert_eq!(c.post("/counter/add", json!({ "by": "lots" })).0, 400, "POST add lots");
              assert_eq!(c.get("/nope"), (404, json!({ "error": "not found" })), "GET /nope");
          }
