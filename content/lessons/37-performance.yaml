          }
        solution: |
          use std::borrow::Cow;

          fn ensure_trailing_slash(path: &str) -> Cow<'_, str> {
              if path.ends_with('/') {
                  Cow::Borrowed(path)
              } else {
                  let mut owned = String::with_capacity(path.len() + 1);
                  owned.push_str(path);
                  owned.push('/');
                  Cow::Owned(owned)
              }
          }
        harness: |
