          - "The else branch builds a new String: `Cow::Owned(format!(\"{path}/\"))` works, or push into a `String::with_capacity(path.len() + 1)`."
      - task: |
          `Cow` works for slices too: `Cow<'_, [i32]>` is either a borrowed `&[i32]` or an owned `Vec<i32>`. Write `clamp_negatives`, which replaces negative numbers with `0`. Start with `Cow::Borrowed(values)` and call `.to_mut()` only when you find a negative number: the first call copies the slice into a `Vec`, later calls reuse it. A slice with no negatives comes back borrowed.
        seed: |
          use std::borrow::Cow;

          fn clamp_negatives(values: &[i32]) -> Cow<'_, [i32]> {
              todo!()
          }
        solution: |
          use std::borrow::Cow;

          fn clamp_negatives(values: &[i32]) -> Cow<'_, [i32]> {
              let mut result = Cow::Borrowed(values);
              for (i, &v) in values.iter().enumerate() {
                  if v < 0 {
                      result.to_mut()[i] = 0;
                  }
              }
              result
          }
        harness: |
          use std::borrow::Cow;

          #[test]
          fn clamps_negative_values() {
              let r = clamp_negatives(&[3, -1, 4, -5]);
              assert_eq!(&*r, &[3, 0, 4, 0], "clamp_negatives(&[3, -1, 4, -5])");
              assert!(matches!(r, Cow::Owned(_)), "a changed slice should be Cow::Owned");
          }

          #[test]
          fn leaves_non_negative_slices_borrowed() {
              let r = clamp_negatives(&[0, 7, 9]);
              assert_eq!(&*r, &[0, 7, 9], "clamp_negatives(&[0, 7, 9])");
              assert!(matches!(r, Cow::Borrowed(_)), "an unchanged slice should be Cow::Borrowed");
          }

          #[test]
          fn handles_empty_and_all_negative() {
              assert!(matches!(clamp_negatives(&[]), Cow::Borrowed(_)), "an empty slice should be borrowed");
              assert_eq!(&*clamp_negatives(&[-1, -2]), &[0, 0], "clamp_negatives(&[-1, -2])");
          }
        require:
          - pattern: '\.to_mut\(\)'
            message: Copy only when needed, with `.to_mut()`.
        hints:
          - "`let mut result = Cow::Borrowed(values);`"
          - "For each negative value at index `i`: `result.to_mut()[i] = 0;`. `to_mut` gives a `&mut Vec<i32>`, copying the slice the first time."
          - "`for (i, &v) in values.iter().enumerate() { if v < 0 { result.to_mut()[i] = 0; } }` then return `result`."

  - title: Benchmarks and profilers
    id: performance-6
    text: |
      Guessing where a program spends its time is famously unreliable, even for experts. Two tools replace guessing: **profilers** tell you *where* the time goes, and **benchmarks** tell you *how much* a change helped.

      ### Benchmarks with criterion

      **criterion** is the standard benchmarking crate. It runs your code many times, warms up first, and uses statistics to tell real changes from noise:

      ```toml
      # Cargo.toml
      [dev-dependencies]
      criterion = "0.5"   # check crates.io for the current version

      [[bench]]
      name = "word_count"
      harness = false
      ```

      ```rust
      // benches/word_count.rs
      use criterion::{criterion_group, criterion_main, Criterion};
      use std::hint::black_box;
      use my_app::count_words;

      fn bench_count_words(c: &mut Criterion) {
          let text = std::fs::read_to_string("benches/sample.txt").unwrap();
          c.bench_function("count_words 1 MB", |b| {
              b.iter(|| count_words(black_box(&text)))
          });
      }

      criterion_group!(benches, bench_count_words);
      criterion_main!(benches);
      ```

      ```text
      $ cargo bench
      count_words 1 MB        time:   [2.8131 ms 2.8297 ms 2.8476 ms]
                              change: [-41.205% -40.731% -40.249%] (p = 0.00 < 0.05)
                              Performance has improved.
      ```

      - `cargo bench` always builds with optimizations.
      - **`std::hint::black_box`** hides a value from the optimizer. Without it, the compiler may notice the result is unused and delete the work you meant to measure.
      - The three times are a confidence interval; the `change` line compares with the previous run.
      - Benchmark with **realistic input**. A function that's fastest on 10 items may be slowest on 10 million.

      A hand-rolled `Instant::now()` timing loop is fine for a rough idea, in a release build, but it won't tell you whether a 3% difference is real.

      ### Profilers: where does the time go?

      A **sampling profiler** interrupts the program thousands of times per second and records which function was running. On Linux:

      ```text
      $ cargo build --release            # with debug = true in [profile.release]
      $ perf record -g ./target/release/report big_input.txt
      $ perf report                      # functions sorted by share of samples
      ```

      **Flamegraphs** draw the same data as a picture. `cargo install flamegraph`, then `cargo flamegraph --bin report -- big_input.txt` writes `flamegraph.svg` (it builds in release mode by default). How to read one:

      - Each box is a function; the boxes on top of it are the functions it called.
      - **Width** is the share of samples, so wide boxes are where the time goes. The x-axis is **not** time order.
      - Look for wide plateaus near the top: a function that is wide itself, not just because of what it calls.

      `samply` is a cross-platform alternative that opens results in the Firefox profiler; macOS has Instruments. For memory, `heaptrack` and the `dhat` crate show who allocates.

      ### The workflow

      1. Reproduce the slowness with realistic input, in a **release** build.
      2. Profile. Find the widest box.
      3. Fix that one thing (usually an algorithm, a collection, or an allocation in a loop).
      4. Benchmark before and after, and keep the benchmark so a later change can't quietly undo it.

      ### A real hot spot

      Suppose a flamegraph of a text tool looks like this (one line per stack level, with its share of samples):

      ```text
      main                                 100%
      └─ count_vowels                       98%
         └─ core::iter::Iterator::nth       96%   <- almost all the time
      ```

      and `count_vowels` is:

      ```rust
      fn count_vowels(text: &str) -> usize {
          let mut count = 0;
          for i in 0..text.chars().count() {
              let c = text.chars().nth(i).unwrap(); // walks from the start every time
              if "aeiouAEIOU".contains(c) {
                  count += 1;
              }
          }
          count
      }
      ```

      Strings are UTF-8, so finding the `i`-th character means walking from the start: `nth(i)` is O(i), and the loop makes the whole function O(n²). The profile points straight at it; no amount of compiler tuning would.

      **Your turn:** fix `count_vowels` so it walks the characters once (O(n)), without `nth`. The tests include a 100,000-character string.
    seed: |
      fn count_vowels(text: &str) -> usize {
          let mut count = 0;
          for i in 0..text.chars().count() {
              let c = text.chars().nth(i).unwrap();
              if "aeiouAEIOU".contains(c) {
                  count += 1;
              }
          }
          count
      }
    solution: |
      fn count_vowels(text: &str) -> usize {
          text.chars().filter(|&c| "aeiouAEIOU".contains(c)).count()
      }
    harness: |
      #[test]
      fn counts_vowels_in_a_word() {
          assert_eq!(count_vowels("arena"), 3, "count_vowels(\"arena\")");
      }

      #[test]
      fn counts_both_cases() {
          assert_eq!(count_vowels("AEIOU aeiou"), 10, "count_vowels(\"AEIOU aeiou\")");
      }

      #[test]
      fn handles_empty_and_unicode_text() {
          assert_eq!(count_vowels(""), 0, "count_vowels(\"\")");
          assert_eq!(count_vowels("crab 🦀 é"), 1, "accented letters aren't in the list");
      }

      #[test]
      fn handles_100_000_characters_quickly() {
          let text = "rust!".repeat(20_000);
          assert_eq!(count_vowels(&text), 20_000, "one vowel in every rust!");
      }
    forbid:
      - pattern: '\.nth\s*\('
        message: Walk the characters once instead of calling `nth` for each position.
    hints:
      - "`text.chars()` already gives every character in order; you don't need the index at all."
      - "`text.chars().filter(|&c| \"aeiouAEIOU\".contains(c)).count()`"
    more:
      - task: |
          A profile of a job scheduler shows 99% of the time in `Vec::remove`, called from `finish_times`. Removing the first element of a `Vec` shifts every other element down, so the loop is O(n²). Rewrite it to walk the jobs in order without removing anything: each job's finish time is the running total of the costs so far.
        seed: |
          /// Runs jobs in order; returns the time at which each one finishes.
          fn finish_times(mut jobs: Vec<u32>) -> Vec<u64> {
              let mut clock = 0u64;
              let mut out = Vec::new();
              while !jobs.is_empty() {
                  let job = jobs.remove(0);
                  clock += job as u64;
                  out.push(clock);
              }
              out
          }
        solution: |
          /// Runs jobs in order; returns the time at which each one finishes.
          fn finish_times(jobs: Vec<u32>) -> Vec<u64> {
              let mut clock = 0u64;
              let mut out = Vec::with_capacity(jobs.len());
              for job in jobs {
                  clock += job as u64;
                  out.push(clock);
              }
              out
          }
        harness: |
          #[test]
          fn adds_up_running_totals() {
              assert_eq!(finish_times(vec![3, 1, 4]), vec![3, 4, 8], "finish_times(vec![3, 1, 4])");
          }

          #[test]
          fn no_jobs_gives_no_times() {
              assert_eq!(finish_times(vec![]), Vec::<u64>::new(), "finish_times(vec![])");
          }

          #[test]
          fn uses_u64_for_big_totals() {
              assert_eq!(finish_times(vec![u32::MAX, u32::MAX]), vec![4_294_967_295, 8_589_934_590], "two huge jobs");
          }

          #[test]
          fn handles_200_000_jobs_quickly() {
              let times = finish_times(vec![2; 200_000]);
              assert_eq!(times.len(), 200_000, "one finish time per job");
              assert_eq!(times[199_999], 400_000, "the last job finishes at 400000");
          }
        forbid:
          - pattern: '\.remove\s*\(\s*0\s*\)'
            message: Don't remove from the front of the Vec; iterate over it.
        hints:
          - "`for job in jobs { ... }` visits the jobs in order without moving the others."
          - "Keep `clock += job as u64; out.push(clock);` inside the loop."
      - task: |
          A profile of a word counter shows most of its time in `to_string` allocations and hashing, because every word is converted to a `String` up to three times and looked up up to three times. Rewrite `word_counts` to return `HashMap<&str, usize>` that **borrows** the words from `text` (no allocation per word), and use the `entry` API so each word is hashed once.
        seed: |
          use std::collections::HashMap;

          fn word_counts(text: &str) -> HashMap<String, usize> {
              let mut counts = HashMap::new();
              for word in text.split_whitespace() {
                  if counts.contains_key(&word.to_string()) {
                      let n = counts.get(&word.to_string()).unwrap() + 1;
                      counts.insert(word.to_string(), n);
                  } else {
                      counts.insert(word.to_string(), 1);
                  }
              }
              counts
          }
        solution: |
          use std::collections::HashMap;

          fn word_counts(text: &str) -> HashMap<&str, usize> {
              let mut counts = HashMap::new();
              for word in text.split_whitespace() {
                  *counts.entry(word).or_insert(0) += 1;
              }
              counts
          }
        harness: |
          #[test]
          fn counts_each_word() {
              let counts = word_counts("the crab and the sea and the sand");
              assert_eq!(counts.get("the"), Some(&3), "count of the");
              assert_eq!(counts.get("and"), Some(&2), "count of and");
              assert_eq!(counts.get("crab"), Some(&1), "count of crab");
              assert_eq!(counts.len(), 5, "number of distinct words");
          }

          #[test]
          fn missing_words_are_absent() {
              assert_eq!(word_counts("a b").get("c"), None, "count of c");
          }

          #[test]
          fn empty_text_gives_an_empty_map() {
              assert!(word_counts("   ").is_empty(), "word_counts(\"   \") should be empty");
          }

          #[test]
          fn keys_borrow_from_the_text() {
              let text = String::from("solo");
              let counts = word_counts(&text);
              let key = counts.keys().next().unwrap();
              assert!(std::ptr::eq(key.as_ptr(), text.as_ptr()), "the key should be a slice of the text, not a copy");
          }
        require:
          - pattern: '\.entry\s*\('
            message: Use the `entry` API so each word is looked up once.
        forbid:
          - pattern: 'to_string|to_owned|String::from|contains_key'
            message: Borrow the words from `text` and drop the extra lookups.
        hints:
          - "Change the return type to `HashMap<&str, usize>`; the `&str`s from `split_whitespace` borrow from `text`."
          - "`*counts.entry(word).or_insert(0) += 1;` inserts 0 the first time, then adds 1, with one hash per word."
