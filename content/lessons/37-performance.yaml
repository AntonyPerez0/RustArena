id: performance
title: Performance
phase: "Advanced Rust"
summary: Honest, measured performance work. Pick the right algorithm and collection first, then cut needless clones and allocations, lean on zero-cost iterators and Cow, and learn the release builds, benchmarks and profilers that tell you where the time really goes.
roadmap: ["Performance and Profiling", "Criterion.rs", "Benchmarking"]
steps:
  - title: Measure first, and fix the algorithm first
    id: performance-1
    text: |
      Rust is fast by default, and most code is fast enough as written. When something **is** slow, the time almost always goes to a few hot spots, and the biggest wins come from doing **less work**, not from clever tricks. The order teams follow: make it work, make it right, then measure, and only then make it fast.

      ### Debug versus release

      `cargo run` and `cargo build` make a **debug build**: no optimizations, plus extra checks like integer overflow. It compiles quickly and is great for development, but it's often 10 to 100 times slower than a **release build**:

      ```text
      $ cargo build --release
      $ ./target/release/report big_input.txt
      ```

      Never judge speed from a debug build, and never benchmark one. Release builds can be tuned in `Cargo.toml`:

      ```toml
      [profile.release]
      lto = true            # optimize across crates: slower to build, often a bit faster to run
      codegen-units = 1     # fewer parallel compile units: better optimization, slower builds
      debug = true          # keep symbols so profilers can show function names
      ```

      This site runs debug builds, so its tests can't measure fine-grained speed. Instead, the exercises in this module check what matters most: the **amount of work**. Tests use inputs big enough that a quadratic solution runs past the 2-second time limit, while a linear one finishes in milliseconds, even unoptimized. Other exercises check for allocations and clones with rules.

      ### Big-O beats micro-optimization

      **Big-O** describes how the work grows with the input size `n`. For `n = 100_000`:

      | Complexity | Example | Steps for 100,000 items |
      |---|---|---|
      | O(1) | `HashSet::contains`, `Vec` index | 1 |
      | O(log n) | `binary_search` on a sorted Vec | about 17 |
      | O(n) | one pass over the data | 100,000 |
      | O(n log n) | sorting | about 1.7 million |
      | O(n²) | a loop inside a loop | 10,000,000,000 |

      No compiler flag turns ten billion steps into a hundred thousand. The most common O(n²) at work hides in one innocent line: **`Vec::contains` inside a loop**.

      ```rust run
      use std::collections::HashSet;

      // O(n * m): for every wanted id, scan the whole stock list.
      fn missing_slow(wanted: &[u32], in_stock: &[u32]) -> Vec<u32> {
          wanted.iter().filter(|id| !in_stock.contains(id)).copied().collect()
      }

      // O(n + m): build a set once, then each lookup is O(1).
      fn missing_fast(wanted: &[u32], in_stock: &[u32]) -> Vec<u32> {
          let stock: HashSet<u32> = in_stock.iter().copied().collect();
          wanted.iter().filter(|id| !stock.contains(id)).copied().collect()
      }

      fn main() {
          let wanted = [3, 8, 15, 42];
          let in_stock = [42, 8, 7];
          println!("{:?}", missing_slow(&wanted, &in_stock));
          println!("{:?}", missing_fast(&wanted, &in_stock));
      }
      ```

      ```output
      [3, 15]
      [3, 15]
      ```

      Same answer. With 100,000 orders and 100,000 stock items, the slow version does ten billion comparisons; the fast one does about 200,000 hash operations. For a dozen items, though, the `Vec` is fine (hashing has a cost too). Big-O matters when `n` can grow.

      ### Choosing a collection

      | You need | Use | Cost per operation |
      |---|---|---|
      | "is X in here?" many times | `HashSet` / `HashMap` | O(1) on average |
      | keys in sorted order, or ranges | `BTreeMap` / `BTreeSet` | O(log n) |
      | many searches in data that rarely changes | sort once, then `binary_search` | O(log n) per search |
      | a queue (push at the back, pop at the front) | `VecDeque` | O(1); `Vec::remove(0)` is O(n) |
      | counting things | `HashMap` with `entry` | O(1) per item |

      ### Common mistakes

      - **Optimizing without measuring**: you'll speed up code that wasn't slow and make it harder to read.
      - **Sorting inside a loop**, or calling `.contains` on a `Vec` inside a loop: each turns a linear job into a quadratic one.
      - **Reaching for a `HashMap` for five items**: a small `Vec` or array is simpler and often faster.

      **Your turn:** `has_duplicates` compares every pair of ids, which is O(n²); with 100,000 ids it blows the time limit. Make it O(n) with a `HashSet`: remember that `insert` returns `false` when the value was already there. (Sorting a copy and comparing neighbours, O(n log n), would also pass.)
    seed: |
      fn has_duplicates(ids: &[u64]) -> bool {
          for i in 0..ids.len() {
              for j in (i + 1)..ids.len() {
                  if ids[i] == ids[j] {
                      return true;
                  }
              }
          }
          false
      }
    solution: |
      use std::collections::HashSet;

      fn has_duplicates(ids: &[u64]) -> bool {
          let mut seen = HashSet::with_capacity(ids.len());
          for &id in ids {
              if !seen.insert(id) {
                  return true;
              }
          }
          false
      }
    harness: |
      #[test]
      fn finds_a_duplicate() {
          assert_eq!(has_duplicates(&[4, 8, 15, 8]), true, "has_duplicates(&[4, 8, 15, 8])");
      }

      #[test]
      fn all_different_is_false() {
          assert_eq!(has_duplicates(&[1, 2, 3]), false, "has_duplicates(&[1, 2, 3])");
      }

      #[test]
      fn empty_and_single_are_false() {
          assert_eq!(has_duplicates(&[]), false, "has_duplicates(&[])");
          assert_eq!(has_duplicates(&[7]), false, "has_duplicates(&[7])");
      }

      #[test]
      fn handles_100_000_unique_ids_quickly() {
          let ids: Vec<u64> = (0..100_000u64).map(|i| i * 7 + 3).collect();
          assert_eq!(has_duplicates(&ids), false, "100,000 unique ids");
      }

      #[test]
      fn finds_a_duplicate_at_the_very_end_of_a_big_list() {
          let mut ids: Vec<u64> = (0..100_000u64).collect();
          ids.push(0);
          assert_eq!(has_duplicates(&ids), true, "100,001 ids where the last repeats the first");
      }
    hints:
      - "Keep a `HashSet` of the ids you've seen so far."
      - "`seen.insert(id)` returns `false` if `id` was already in the set: that's your duplicate."
      - "`let mut seen = HashSet::new(); for &id in ids { if !seen.insert(id) { return true; } } false`"
    more:
      - task: |
          `count_known` counts how many words appear in a dictionary, but it calls `dictionary.contains` for every word: O(words × dictionary). Put the dictionary into a `HashSet<&str>` first (no need to copy the strings: the set can hold the borrowed `&str`s).
        seed: |
          fn count_known(words: &[&str], dictionary: &[&str]) -> usize {
              words.iter().filter(|w| dictionary.contains(w)).count()
          }
        solution: |
          use std::collections::HashSet;

          fn count_known(words: &[&str], dictionary: &[&str]) -> usize {
              let known: HashSet<&str> = dictionary.iter().copied().collect();
              words.iter().filter(|w| known.contains(*w)).count()
          }
        harness: |
          #[test]
          fn counts_words_in_the_dictionary() {
              assert_eq!(count_known(&["crab", "sea", "zzz", "crab"], &["sea", "crab", "sand"]), 3, "two crabs and a sea");
          }

          #[test]
          fn no_dictionary_means_nothing_is_known() {
              assert_eq!(count_known(&["a", "b"], &[]), 0, "empty dictionary");
          }

          #[test]
          fn no_words_counts_zero() {
              assert_eq!(count_known(&[], &["a"]), 0, "no words");
          }

          #[test]
          fn handles_100_000_words_and_a_100_000_word_dictionary() {
              let dict_owned: Vec<String> = (0..100_000).map(|i| format!("w{}", i * 2)).collect();
              let words_owned: Vec<String> = (0..100_000).map(|i| format!("w{i}")).collect();
              let dictionary: Vec<&str> = dict_owned.iter().map(|s| s.as_str()).collect();
              let words: Vec<&str> = words_owned.iter().map(|s| s.as_str()).collect();
              assert_eq!(count_known(&words, &dictionary), 50_000, "every even word is known");
          }
        require:
          - pattern: 'HashSet'
            message: Look the words up in a `HashSet`.
        hints:
          - "`let known: HashSet<&str> = dictionary.iter().copied().collect();`"
          - "Then `words.iter().filter(|w| known.contains(*w)).count()`."
      - task: |
          A classic interview problem, done in O(n). Write `has_pair_with_sum(values, target)`: is there a pair of values at **two different positions** that adds up to `target`? Walk the list once, keeping a `HashSet` of the values seen so far; for each value `v`, check whether `target - v` is already in the set. (Nested loops would time out on the 100,000-value test.)
        seed: |
          fn has_pair_with_sum(values: &[i64], target: i64) -> bool {
              todo!()
          }
        solution: |
          use std::collections::HashSet;

          fn has_pair_with_sum(values: &[i64], target: i64) -> bool {
              let mut seen = HashSet::with_capacity(values.len());
              for &v in values {
                  if seen.contains(&(target - v)) {
                      return true;
                  }
                  seen.insert(v);
              }
              false
          }
        harness: |
          #[test]
          fn finds_a_pair() {
              assert_eq!(has_pair_with_sum(&[3, 9, 14, 5], 8), true, "3 + 5 = 8");
          }

          #[test]
          fn reports_when_there_is_no_pair() {
              assert_eq!(has_pair_with_sum(&[1, 2, 4], 8), false, "no pair makes 8");
          }

          #[test]
          fn one_value_cannot_be_used_twice() {
              assert_eq!(has_pair_with_sum(&[4, 1], 8), false, "4 alone can't make 8");
              assert_eq!(has_pair_with_sum(&[4, 1, 4], 8), true, "two 4s make 8");
          }

          #[test]
          fn works_with_negatives_and_empty_input() {
              assert_eq!(has_pair_with_sum(&[-3, 10, 7], 4), true, "-3 + 7 = 4");
              assert_eq!(has_pair_with_sum(&[], 0), false, "empty input");
          }

          #[test]
          fn handles_100_000_values_quickly() {
              let values: Vec<i64> = (0..100_000).map(|i| i * 2).collect();
              assert_eq!(has_pair_with_sum(&values, -1), false, "an odd target from even values");
              assert_eq!(has_pair_with_sum(&values, 399_994), true, "the two largest values");
          }
        hints:
          - "For each `v`, the partner it needs is `target - v`."
          - "Check the set **before** inserting `v`, so a value can't pair with itself."
          - "`for &v in values { if seen.contains(&(target - v)) { return true; } seen.insert(v); } false`"

  - title: Borrow, don't clone
    id: performance-2
    text: |
      Every `.clone()` of a `String` or `Vec` allocates new heap memory and copies every byte. One clone costs nanoseconds, but a clone inside a loop that runs a million times is a million allocations. Needless clones and `.to_string()` calls are the first thing reviewers look for in Rust performance work, and usually the easiest to remove.

      ### Take `&str` and `&[T]` when you only read

      A parameter of type `String` or `Vec<T>` takes ownership, so a caller who wants to keep their value has to clone it first. If the function only reads, borrow: `&str` accepts string literals, `&String` and slices of either; `&[T]` accepts arrays, `&Vec<T>` and slices.

      ```rust run
      #[derive(Debug)]
      struct User {
          name: String,
          country: String,
      }

      // Borrows everything: no allocation at all.
      fn find_user<'a>(users: &'a [User], name: &str) -> Option<&'a User> {
          users.iter().find(|u| u.name == name)
      }

      // Only the results are cloned, not every user.
      fn names_in(users: &[User], country: &str) -> Vec<String> {
          users.iter().filter(|u| u.country == country).map(|u| u.name.clone()).collect()
      }

      fn main() {
          let users = vec![
              User { name: "ana".to_string(), country: "PT".to_string() },
              User { name: "bo".to_string(), country: "SE".to_string() },
              User { name: "cy".to_string(), country: "PT".to_string() },
          ];
          println!("{:?}", find_user(&users, "bo").map(|u| &u.country));
          println!("{:?}", names_in(&users, "PT"));
      }
      ```

      ```output
      Some("SE")
      ["ana", "cy"]
      ```

      - `find_user` returns `Option<&'a User>`: a reference **into** the caller's slice. Nothing is copied. The lifetime `'a` says the result borrows from `users`, not from `name`.
      - `names_in` has to return owned names (the caller keeps them), but it clones only the matches, after filtering.
      - `u.name == name` compares a `String` with a `&str` directly; no conversion needed.

      ### When owning is right

      If the function **stores** the value (in a struct field, a map, a channel), take it by value: `fn add_tag(&mut self, tag: String)`. Then the caller decides: move a `String` they no longer need (free), or clone one they still need. Cloning inside the function would force a copy even when the caller didn't need one.

      ### Common mistakes

      - **`for x in list.clone()`** just to loop: write `for x in &list`.
      - **Converting to compare**: `if word.to_lowercase() == "error"` allocates a new `String` for every word. `word.eq_ignore_ascii_case("error")` allocates nothing.
      - **`.iter().cloned().filter(...)`**: clones everything, then throws most of it away. Filter first, clone the survivors.
      - **Over-correcting**: a clone of a short string at startup costs nothing that matters. Keep clones out of hot loops; elsewhere, readability wins. Cloning an `Rc` or `Arc` is cheap (it just bumps a counter).

      clippy helps: `unnecessary_to_owned` (on by default), `needless_pass_by_value` (in the opt-in `clippy::pedantic` group) and `redundant_clone` (in the opt-in `clippy::nursery` group) flag many of these.

      **Your turn:** `orders_for` takes ownership of everything and clones on every step. Change it to `fn orders_for<'a>(orders: &'a [Order], customer: &str) -> Vec<&'a Order>`: borrow the orders, borrow the name, and return references to the matching orders, with no clones or string conversions at all.
    seed: |
      #[derive(Debug, Clone)]
      struct Order {
          id: u32,
          customer: String,
          total_cents: u64,
      }

      fn orders_for(orders: Vec<Order>, customer: String) -> Vec<Order> {
          let mut result = Vec::new();
          for order in orders.clone() {
              if order.customer.clone() == customer.clone() {
                  result.push(order.clone());
              }
          }
          result
      }
    solution: |
      #[derive(Debug, Clone)]
      struct Order {
          id: u32,
          customer: String,
          total_cents: u64,
      }

      fn orders_for<'a>(orders: &'a [Order], customer: &str) -> Vec<&'a Order> {
          orders.iter().filter(|o| o.customer == customer).collect()
      }
    harness: |
      fn sample() -> Vec<Order> {
          vec![
              Order { id: 1, customer: "ana".to_string(), total_cents: 1200 },
              Order { id: 2, customer: "bo".to_string(), total_cents: 300 },
              Order { id: 3, customer: "ana".to_string(), total_cents: 45 },
          ]
      }

      #[test]
      fn finds_the_customers_orders() {
          let orders = sample();
          let ids: Vec<u32> = orders_for(&orders, "ana").iter().map(|o| o.id).collect();
          assert_eq!(ids, vec![1, 3], "ids of ana's orders");
      }

      #[test]
      fn returns_references_into_the_original_list() {
          let orders = sample();
          let found = orders_for(&orders, "bo");
          assert!(std::ptr::eq(found[0], &orders[1]), "the result should point at the original order, not a copy");
      }

      #[test]
      fn totals_can_be_read_through_the_references() {
          let orders = sample();
          let total: u64 = orders_for(&orders, "ana").iter().map(|o| o.total_cents).sum();
          assert_eq!(total, 1245, "ana's total");
      }

      #[test]
      fn an_unknown_customer_gets_nothing() {
          let orders = sample();
          assert!(orders_for(&orders, "cy").is_empty(), "orders_for(.., \"cy\") should be empty");
      }
    forbid:
      - pattern: '\.clone\(\)|\.to_string\(\)|\.to_owned\(\)|String::from'
