          assert_eq!(join_path(&["usr", "local", "bin"]), "usr/local/bin", "join_path(&[\"usr\", \"local\", \"bin\"])");
      }

      #[test]
      fn allocates_exactly_the_right_size() {
          let p = join_path(&["home", "ferris", "projects", "arena"]);
          assert_eq!(p.capacity(), p.len(), "capacity should equal the final length");
      }

      #[test]
      fn a_single_part_has_no_slash() {
          let p = join_path(&["etc"]);
          assert_eq!(p, "etc", "join_path(&[\"etc\"])");
          assert_eq!(p.capacity(), 3, "capacity for one part");
      }

      #[test]
      fn no_parts_is_an_empty_string() {
          let p = join_path(&[]);
          assert_eq!(p, "", "join_path(&[])");
          assert_eq!(p.capacity(), 0, "capacity for no parts");
      }

      #[test]
      fn lengths_are_in_bytes() {
          let p = join_path(&["café", "menü"]);
          assert_eq!(p, "café/menü", "join_path with accents");
          assert_eq!(p.capacity(), p.len(), "capacity with multi-byte characters");
      }
    require:
