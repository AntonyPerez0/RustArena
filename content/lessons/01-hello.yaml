id: hello
title: Hello, Rust
phase: "Foundations"
summary: Your first programs. What fn main is, how println! prints text, and how to read the compiler's (very helpful) error messages.
roadmap: [Introduction, Environment setup]
steps:
  - title: Your first program
    id: hello-1
    text: |
      A **program** is a list of instructions the computer follows from top to bottom. Rust is a *compiled* language: you write the instructions as text (the **source code**), the Rust compiler (`rustc`) checks them very carefully and translates them into machine code, and then the program runs. Every time you press **Check**, a real Rust compiler builds and runs your code.

      ### The shape of every Rust program

      ```rust run
      fn main() {
          println!("Hi!");
      }
      ```

      ```output
      Hi!
      ```

      Piece by piece:

      - `fn main()` starts a **function** called `main`. `fn` is short for *function*. Every Rust program begins running at `main`, no matter how big it is. The empty `()` say it takes no inputs.
      - The curly braces `{ }` hold the function's **body**: the instructions that run, in order.
      - `println!("Hi!");` prints the text `Hi!` and then ends the line ("print line"). The text goes inside double quotes.
      - The `!` means `println!` is a **macro**, not a normal function. Macros are Rust code that writes more code for you; you'll meet several (`println!`, `format!`, `vec!`). For now: printing needs the `!`.
      - The `;` ends the statement, like a period ends a sentence.

      ### Common mistakes

      - **Forgetting the `!`**: `println("Hi")` makes the compiler say `` cannot find function `println` in this scope ``. It's a macro, so it's `println!`.
      - **Spelling and capitals matter**: `Println!` or `printline!` don't exist.
      - **Single quotes**: `'Hi'` is wrong. Text always goes in double quotes; single quotes are for one character, like `'a'`.

      **Your turn:** fill in the blank so the program prints `Hello, World!`.
    fill: |
      fn main() {
          [[println!]]("Hello, World!");
      }
    hints:
      - The macro that prints a line is spelled `println!`, with the exclamation mark.
    tests:
      - expect: "Hello, World!"
    more:
      - task: |
          Fill in both blanks: the keyword that starts a function, and the name of the function every program starts in. The program should print `GG, well played!`.
        fill: |
          [[fn]] [[main]]() {
              println!("GG, well played!");
          }
        hints:
          - Functions start with the two-letter keyword `fn`.
          - Every program starts running in the function called `main`.
        tests:
          - expect: "GG, well played!"
      - task: |
          This time there's no starter program. Write the whole thing yourself: `fn main`, its braces, and a `println!`. It should print `Welcome to the arena`.
        seed: |
          // Write a complete Rust program below that prints: Welcome to the arena

        solution: |
          // Write a complete Rust program below that prints: Welcome to the arena
          fn main() {
              println!("Welcome to the arena");
          }
        hints:
          - "Start with `fn main() {` and end with `}`."
          - "Inside, one line: `println!(\"Welcome to the arena\");`"
        tests:
          - expect: "Welcome to the arena"

  - title: Printing your own text
    id: hello-2
    text: |
      A piece of text in double quotes, like `"I like pizza"`, is a **string literal**. `println!` prints it **exactly** as written: every letter, space and capital. The quotes themselves aren't printed; they only mark where the text starts and ends.

      ```rust run
      fn main() {
          println!("Rust 1.0 came out in 2015");
          println!("   spaces   are   kept");
      }
      ```

      ```output
      Rust 1.0 came out in 2015
         spaces   are   kept
      ```

      ### Why exact output matters

      The tests on this site compare your program's output with the expected output character by character (ignoring only spaces at the ends of lines and blank lines at the very end). Real programs work the same way: another program reading your output, or a test at work, won't guess what you meant. `I am learning rust` is not the same as `I am learning Rust`.

      **Your turn:** make the program print exactly:

      ```
      I am learning Rust
      ```
    fill: |
      fn main() {
          println!("[[I am learning Rust]]");
      }
    hints:
      - Type the sentence between the quotes. Capital letters and spaces matter.
    tests:
      - expect: "I am learning Rust"
    more:
      - task: |
          Make the program print exactly `Round 1 starts NOW`. Watch the capital letters.
        fill: |
          fn main() {
              println!("[[Round 1 starts NOW]]");
          }
        hints:
          - Copy the text character by character. `NOW` is all capitals and `starts` is not.
        tests:
          - expect: "Round 1 starts NOW"
      - task: |
          The starter code prints the right words but not the exact text. Fix the string so the program prints exactly `I like Rust programming.` with a capital `I` and `R`, one space between words and a period at the end.
        seed: |
          fn main() {
              println!("i like  rust programming");
          }
        solution: |
          fn main() {
              println!("I like Rust programming.");
          }
        hints:
          - There are four differences. Check the capital letters, the double space, and the end of the sentence.
        tests:
          - expect: "I like Rust programming."

  - title: Several lines, and print! versus println!
    id: hello-3
    text: |
      Each `println!` prints its text and then a **newline**, so the next output starts on a fresh line. Its sibling `print!` prints the text *without* ending the line:

      ```rust run
      fn main() {
          print!("Ready, ");
          print!("set, ");
          println!("go!");
          println!("Next line");
      }
      ```

      ```output
      Ready, set, go!
      Next line
      ```

      ### Escape sequences

      Some characters can't be typed directly inside a string, so they're written with a backslash `\`. These are **escape sequences**:

      | You write | You get |
      |---|---|
      | `\n` | a newline |
      | `\t` | a tab |
      | `\"` | a double quote (without ending the string) |
      | `\\` | one backslash |

      ```rust run
      fn main() {
          println!("Line one\nLine two");
          println!("She said \"hi\"");
      }
      ```

      ```output
      Line one
      Line two
      She said "hi"
      ```

      **Your turn:** print these three lines, using **one** `println!` with `\n` escapes in it:

      ```
      Rust
      is
      fast
      ```
    seed: |
      fn main() {
          // One println! with \n inside the string
      }
    solution: |
      fn main() {
          // One println! with \n inside the string
          println!("Rust\nis\nfast");
      }
    require:
      - pattern: '\\n'
        strings: true
        message: Use the `\n` escape inside your string to break the lines.
    forbid:
      - pattern: 'println!.*\n[\s\S]*println!'
        message: Do it with a single `println!` (use `\n` for the line breaks).
    hints:
      - "`\\n` inside a string starts a new line. Put one between each word."
      - "`println!(\"Rust\\nis\\nfast\");`"
    tests:
      - expect: "Rust\nis\nfast"
    more:
      - task: |
          Print exactly this line, including the double quotes:

          ```
          The crab said "hello"
          ```
        seed: |
          fn main() {
              println!("The crab said hello");
          }
        solution: |
          fn main() {
              println!("The crab said \"hello\"");
          }
        hints:
          - A `"` inside a string would end it. Write `\"` instead.
        tests:
          - expect: "The crab said \"hello\""
      - task: |
          Use `print!` three times and `println!` once (in that order) to print `1, 2, 3, go!` on one line.
        seed: |
          fn main() {
          }
        solution: |
          fn main() {
              print!("1, ");
              print!("2, ");
              print!("3, ");
              println!("go!");
          }
        require:
          - pattern: 'print!\([\s\S]*print!\([\s\S]*print!\([\s\S]*println!'
            message: Use three `print!` calls followed by one `println!`.
        hints:
          - "`print!` doesn't end the line, so the next output continues on the same line."
          - "`print!(\"1, \");` then the same for 2 and 3, then `println!(\"go!\");`"
        tests:
          - expect: "1, 2, 3, go!"

  - title: Printing values with {}
    id: hello-4
    text: |
      `println!` can do more than print fixed text. Inside the string, a pair of curly braces `{}` is a **placeholder**: a hole that gets filled with a value you put after the string, separated by commas. The string with the holes is called the **format string**.

      ```rust run
      fn main() {
          println!("2 + 3 = {}", 2 + 3);
          println!("{} likes {}", "Ferris", "Rust");
      }
      ```

      ```output
      2 + 3 = 5
      Ferris likes Rust
      ```

      The values fill the placeholders in order: the first `{}` gets the first value, and so on. Rust checks this when it compiles: if the number of `{}` and values don't match, it's a compile error, not a surprise at run time.

      ### Arithmetic

      Rust does the math before printing: `+` adds, `-` subtracts, `*` multiplies, `/` divides and `%` gives the remainder. With whole numbers, `/` drops the fraction: `7 / 2` is `3`. You'll see why in the next module.

      ### Printing braces

      To print an actual `{` or `}`, double it: `{{` and `}}`.

      ```rust run
      fn main() {
          println!("{{}} is a placeholder, and 10 / 3 = {}", 10 / 3);
      }
      ```

      ```output
      {} is a placeholder, and 10 / 3 = 3
      ```

      **Your turn:** fill the blanks so the program prints `6 * 7 = 42`, with Rust working out the 42 (don't type the answer yourself).
    fill: |
      fn main() {
          println!("6 * 7 = [[{}]]", [[6 * 7‖6*7]]);
      }
    hints:
      - The format string needs a `{}` where the answer goes.
      - After the string and a comma, write the calculation `6 * 7`.
    tests:
      - expect: "6 * 7 = 42"
    more:
      - task: |
          Print `The crab has 10 legs` where the 10 comes from a value after the format string (put `10` as an argument, not inside the text).
        fill: |
          fn main() {
              println!("The crab has {} legs", [[10]]);
          }
        hints:
          - The `{}` gets the first value after the comma. Write the number there.
        tests:
          - expect: "The crab has 10 legs"
      - task: |
          Write a `println!` with **three** placeholders that prints `1 + 2 = 3`. The three values after the format string should be `1`, `2` and `1 + 2`.
        seed: |
          fn main() {
          }
        solution: |
          fn main() {
              println!("{} + {} = {}", 1, 2, 1 + 2);
          }
        require:
          - pattern: '"\{\} \+ \{\} = \{\}"'
            strings: true
            message: Use three `{}` placeholders in the format string.
          - pattern: '1 \+ 2\s*\)'
            message: Let Rust work out the sum by passing `1 + 2` as the last value.
        hints:
          - "The format string is `\"{} + {} = {}\"`."
          - "Then the values in order: `, 1, 2, 1 + 2`."
        tests:
          - expect: "1 + 2 = 3"

  - title: Comments and reading compiler errors
    id: hello-5
    text: |
      ### Comments

      A **comment** is a note for humans. The compiler ignores it.

      ```rust run
      fn main() {
          // A line comment runs to the end of the line.
          println!("visible"); // it can follow code, too
          /* A block comment can
             span several lines. */
      }
      ```

      ```output
      visible
      ```

      Programmers also "comment out" a line to switch it off for a moment without deleting it.

      ### The compiler is on your side

      Rust's compiler is famous for its error messages. They tell you **what** went wrong, **where** (file, line and column), and often **how to fix it**. Learning to read them is one of the most useful skills in this course. For example, this program forgets the `!`:

      ```rust compile_fail
      fn main() {
          println("Hi!");
      }
      ```

      ```error
      error[E0423]: cannot find function `println` in this scope
      ```

      There's no *function* called `println`, only a macro. The full message points at the exact spot with `^^^^`, notes that ``a macro named `println` exists``, and adds ``help: use `!` to invoke the macro``. When **Check** finds a compile error, this site shows rustc's message, a short explanation in plain English, and the line it's on in the editor.

      Each error has a code like `E0423`. You can look up any code in the official [Rust error index](https://doc.rust-lang.org/error_codes/error-index.html), or by running `rustc --explain E0423`.

      **Your turn:** this program has two mistakes that stop it from compiling. Read the error messages after pressing **Check**, fix both, and make it print `Errors are friends`.
    seed: |
      fn main() {
          // The program should print: Errors are friends
          println("Errors are friends")
          printn!("Errors are friends");
      }
    solution: |
      fn main() {
          // The program should print: Errors are friends
          println!("Errors are friends");
      }
    hints:
      - "The first `println` is missing its `!`, and its line is missing the `;` at the end."
      - "The second line spells the macro wrong (`printn!`). You only need one line that prints, so you can delete it."
    tests:
      - expect: "Errors are friends"
    more:
      - task: |
          Comment out the line that prints `DEBUG` (put `//` in front of it) so the program only prints `Clean output`. Don't delete the line.
        seed: |
          fn main() {
              println!("DEBUG: starting");
              println!("Clean output");
          }
        solution: |
          fn main() {
              // println!("DEBUG: starting");
              println!("Clean output");
          }
        hints:
          - "Put `//` at the start of the first `println!` line."
        tests:
          - expect: "Clean output"

  - title: "Cargo: how real Rust projects are built"
    id: hello-6
    text: |
      On this site you press **Check** and your code is compiled for you. On your own computer (and at work) you'll use **Cargo**, Rust's build tool and package manager. Install everything with **rustup** from [rustup.rs](https://rustup.rs): it installs `rustc` (the compiler), `cargo`, and the standard library, and keeps them up to date with `rustup update`.

      ### A new project

      ```text
      $ cargo new hello
          Creating binary (application) `hello` package
      $ cd hello
      $ cargo run
         Compiling hello v0.1.0 (/home/you/hello)
          Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.41s
           Running `target/debug/hello`
      Hello, world!
      ```

      `cargo new` creates this:

      ```text
      hello/
      ├── Cargo.toml      the project's settings: name, version, edition, dependencies
      └── src/
          └── main.rs     your code, starting with fn main
      ```

      ### The commands you'll use every day

      | Command | What it does |
      |---|---|
      | `cargo run` | build, then run the program |
      | `cargo build` | build only (the program lands in `target/debug/`) |
      | `cargo build --release` | build with optimizations, for speed (`target/release/`) |
      | `cargo check` | check that the code compiles, without building a program: the fastest feedback |
      | `cargo test` | run the project's tests |
      | `cargo fmt` | format the code in the standard Rust style |
      | `cargo clippy` | a linter that suggests more idiomatic, correct code |
      | `cargo doc --open` | build documentation for your code and its dependencies |

      Every Rust team uses `cargo fmt` and `cargo clippy`; many make them part of every pull request. The **edition** in `Cargo.toml` (this site uses `2024`, the newest) picks which version of the language's rules a project uses; crates of different editions work together.

      **Your turn:** print a small report about the `cargo new` project above. The program should print exactly these three lines (the third uses `{}` with the value `2024`):

      ```
      project: hello
      main file: src/main.rs
      edition: 2024
      ```
    seed: |
      fn main() {
          println!("project: hello");
      }
    solution: |
      fn main() {
          println!("project: hello");
          println!("main file: src/main.rs");
          println!("edition: {}", 2024);
      }
    require:
      - pattern: 'println!\("edition: \{\}",\s*2024\)'
        strings: true
        message: 'Print the edition with a placeholder: `println!("edition: {}", 2024);`'
    hints:
      - Add two more `println!` lines after the first one.
      - "The last one is `println!(\"edition: {}\", 2024);`"
    tests:
      - expect: "project: hello\nmain file: src/main.rs\nedition: 2024"
