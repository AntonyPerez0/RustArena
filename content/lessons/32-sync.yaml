      - task: |
          Write `fn tally_votes(stations: &[Vec<&str>]) -> BTreeMap<String, u32>`. Each inner `Vec` holds the ballots from one polling station. Count each station in its own **scoped** thread, all of them updating one shared `Mutex<BTreeMap<String, u32>>`, and return the final map.
        seed: |
          use std::collections::BTreeMap;
          use std::sync::Mutex;
          use std::thread;

          fn tally_votes(stations: &[Vec<&str>]) -> BTreeMap<String, u32> {
              todo!()
          }
        solution: |
          use std::collections::BTreeMap;
          use std::sync::Mutex;
          use std::thread;

          fn tally_votes(stations: &[Vec<&str>]) -> BTreeMap<String, u32> {
              let totals = Mutex::new(BTreeMap::new());
              thread::scope(|s| {
                  for ballots in stations {
                      s.spawn(|| {
                          for name in ballots.iter() {
                              let mut map = totals.lock().unwrap();
                              *map.entry(name.to_string()).or_insert(0) += 1;
                          }
                      });
                  }
              });
              totals.into_inner().unwrap()
          }
        require:
          - pattern: 'Mutex::new'
            message: Share one `Mutex<BTreeMap<...>>` between the threads.
          - pattern: 'thread::scope'
            message: Use scoped threads, one per station.
        hints:
          - "Create `let totals = Mutex::new(BTreeMap::new());`, then `thread::scope(|s| { for ballots in stations { s.spawn(|| { ... }); } });`."
          - "In each thread: `for name in ballots.iter() { *totals.lock().unwrap().entry(name.to_string()).or_insert(0) += 1; }`. After the scope, `totals.into_inner().unwrap()`."
        harness: |
          #[test]
          fn counts_votes_from_three_stations() {
              let stations = vec![vec!["ana", "bo"], vec!["bo", "bo"], vec!["cy", "ana"]];
              let result = tally_votes(&stations);
              let expected = BTreeMap::from([("ana".to_string(), 2), ("bo".to_string(), 3), ("cy".to_string(), 1)]);
              assert_eq!(result, expected, "tally_votes([[ana, bo], [bo, bo], [cy, ana]])");
          }

          #[test]
          fn no_stations_gives_empty_map() {
              assert_eq!(tally_votes(&[]), BTreeMap::new(), "tally_votes([])");
          }

          #[test]
          fn empty_station_adds_nothing() {
              let result = tally_votes(&[vec![], vec!["dee"]]);
              assert_eq!(result, BTreeMap::from([("dee".to_string(), 1)]), "tally_votes([[], [dee]])");
          }

          #[test]
          fn many_ballots_are_all_counted() {
              let stations: Vec<Vec<&str>> = (0..8).map(|_| vec!["yes"; 500]).collect();
              assert_eq!(tally_votes(&stations).get("yes"), Some(&4000), "8 stations x 500 yes votes");
          }

  - title: "RwLock, and how deadlocks happen"
    id: sync-5
    text: |
      A `Mutex` lets one thread in at a time, even if all of them only want to read. **`RwLock<T>`** (reader-writer lock) has two kinds of lock:

      - `read()` returns a read guard (`&T` access). **Many** threads can hold read guards at the same time.
      - `write()` returns a write guard (`&mut T` access). It's **exclusive**: it waits until all readers and writers are gone.

      It's the runtime version of the borrowing rule you know: many readers or one writer. It fits data that's read constantly and changed rarely, like a config or a routing table.

      ```rust run
      use std::sync::RwLock;
      use std::thread;

      struct Config {
          max_players: u32,
          motd: String,
      }

      fn main() {
          let config = RwLock::new(Config { max_players: 8, motd: String::from("Welcome!") });

          let (players, motd) = thread::scope(|s| {
              let a = s.spawn(|| config.read().unwrap().max_players);
              let b = s.spawn(|| config.read().unwrap().motd.clone());
              (a.join().unwrap(), b.join().unwrap())
          });
          println!("readers saw: {players} players, {motd:?}");

          {
              let mut cfg = config.write().unwrap();
              cfg.max_players = 16;
              cfg.motd = String::from("Season 2 is live");
          }

          let cfg = config.read().unwrap();
          println!("after update: {} players, {:?}", cfg.max_players, cfg.motd);
      }
      ```

      ```output
      readers saw: 8 players, "Welcome!"
      after update: 16 players, "Season 2 is live"
      ```

      The block around the write guard drops it before the final `read()`. An `RwLock` does more bookkeeping than a `Mutex`, so for data that's written often, or locked only very briefly, a `Mutex` is usually just as fast. Measure before switching.

      ### Deadlocks

      A **deadlock** is when threads wait for each other forever. The program doesn't crash and doesn't print an error: it just freezes. Rust prevents data races at compile time, but **not deadlocks**: they're a logic bug, like an infinite loop. The two classic causes:

      **1. Locking the same mutex twice in one thread.** `std`'s `Mutex` isn't **reentrant**: a second `lock()` in the same thread waits for the first guard to be dropped, which never happens. It usually hides behind a helper function:

      ```rust
      fn total(stock: &Mutex<Vec<u32>>) -> u32 {
          stock.lock().unwrap().iter().sum()
      }

      let mut items = stock.lock().unwrap();
      items.push(5);
      println!("{}", total(&stock)); // freezes: `items` still holds the lock
      ```

      The same goes for an `RwLock`: holding a read guard and asking for `write()` in the same thread never returns.

      **2. Two locks taken in opposite orders.** Thread A locks `alice`, then wants `bob`. Thread B locks `bob`, then wants `alice`. Each holds what the other is waiting for. The fix is **lock ordering**: whenever code needs several locks, it takes them in one agreed order (for example, by account id), everywhere.

      ### Habits that prevent deadlocks

      - Keep guards short-lived; drop them (end the block, or `drop(guard)`) before calling other functions.
      - Don't call code you don't control (callbacks, trait methods) while holding a lock.
      - Need several locks? Always take them in the same order. Better still, use one lock, or channels.

      **Your turn:** this program freezes (on this site, the time limit runs out) because `report` locks the inventory while `main` still holds a guard on it. Make `main` release its guard before calling `report`, so the program prints `items: 4, total units: 26`.
    seed: |
      use std::sync::Mutex;

      fn report(inventory: &Mutex<Vec<u32>>) -> String {
          let items = inventory.lock().unwrap();
          format!("items: {}, total units: {}", items.len(), items.iter().sum::<u32>())
      }

      fn main() {
          let inventory = Mutex::new(vec![5, 12, 3]);
          let mut stock = inventory.lock().unwrap();
          stock.push(6);
          println!("{}", report(&inventory));
      }
    solution: |
      use std::sync::Mutex;

      fn report(inventory: &Mutex<Vec<u32>>) -> String {
          let items = inventory.lock().unwrap();
          format!("items: {}, total units: {}", items.len(), items.iter().sum::<u32>())
      }

      fn main() {
          let inventory = Mutex::new(vec![5, 12, 3]);
          {
              let mut stock = inventory.lock().unwrap();
              stock.push(6);
          }
          println!("{}", report(&inventory));
      }
    hints:
      - "The guard `stock` lives until the end of `main`, so the lock is still held when `report` runs."
      - "Wrap the two lines that use `stock` in their own `{ }` block, or call `drop(stock);` before the `println!`."
    tests:
      - expect: "items: 4, total units: 26"
    more:
      - task: |
          Write `fn transfer(from: &Account, to: &Account, amount: i64)` that moves `amount` from one balance to the other while holding **both** locks. To avoid deadlocks, always lock the account with the **smaller id first**, whichever direction the money goes. A transfer from an account to itself must do nothing (locking the same mutex twice would freeze). One hidden test runs thousands of transfers in opposite directions at the same time.
        seed: |
          use std::sync::Mutex;

          #[derive(Debug)]
          struct Account {
              id: u32,
              balance: Mutex<i64>,
          }

          fn transfer(from: &Account, to: &Account, amount: i64) {
              todo!()
          }
        solution: |
          use std::sync::Mutex;

          #[derive(Debug)]
          struct Account {
              id: u32,
              balance: Mutex<i64>,
          }

          fn transfer(from: &Account, to: &Account, amount: i64) {
              if from.id == to.id {
                  return;
              }
              let (mut from_balance, mut to_balance) = if from.id < to.id {
                  let f = from.balance.lock().unwrap();
                  let t = to.balance.lock().unwrap();
                  (f, t)
              } else {
                  let t = to.balance.lock().unwrap();
                  let f = from.balance.lock().unwrap();
                  (f, t)
              };
              *from_balance -= amount;
              *to_balance += amount;
          }
        hints:
          - "Return early when `from.id == to.id`."
          - "In an `if from.id < to.id` / `else`, lock the two balances in id order, and return both guards as a tuple: `let (mut from_balance, mut to_balance) = if ... { ... } else { ... };`."
          - "Then `*from_balance -= amount; *to_balance += amount;`. Both guards unlock when the function ends."
        harness: |
          fn account(id: u32, balance: i64) -> Account {
              Account { id, balance: Mutex::new(balance) }
          }

          fn balance(a: &Account) -> i64 {
              *a.balance.lock().unwrap()
          }

          #[test]
          fn moves_money_from_lower_to_higher_id() {
              let (a, b) = (account(1, 100), account(2, 50));
              transfer(&a, &b, 30);
              assert_eq!((balance(&a), balance(&b)), (70, 80), "transfer(a=100, b=50, 30)");
          }

          #[test]
          fn moves_money_from_higher_to_lower_id() {
              let (a, b) = (account(1, 100), account(2, 50));
              transfer(&b, &a, 50);
              assert_eq!((balance(&a), balance(&b)), (150, 0), "transfer(b=50, a=100, 50)");
          }

          #[test]
          fn transfer_to_itself_changes_nothing() {
              let a = account(7, 40);
              transfer(&a, &a, 10);
              assert_eq!(balance(&a), 40, "transfer(a, a, 10)");
          }

          #[test]
          fn opposite_transfers_at_the_same_time_finish() {
              let (a, b) = (account(1, 1000), account(2, 1000));
              std::thread::scope(|s| {
                  s.spawn(|| {
                      for _ in 0..20_000 {
                          transfer(&a, &b, 1);
                      }
                  });
                  s.spawn(|| {
                      for _ in 0..20_000 {
                          transfer(&b, &a, 1);
                      }
                  });
              });
              assert_eq!((balance(&a), balance(&b)), (1000, 1000), "20,000 transfers each way");
          }
