          use std::thread;

          fn main() {
              let stock = Mutex::new(20);
              thread::scope(|s| {
                  for _ in 0..5 {
                      s.spawn(|| {
                          let mut left = stock.[[lock]]().unwrap();
                          *left -= 1;
                      });
                  }
              });
              println!("left in stock: {}", stock.into_inner().unwrap());
          }
        hints:
          - "The method that waits for the mutex and returns a guard is `lock`."
        tests:
