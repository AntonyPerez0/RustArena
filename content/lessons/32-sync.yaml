  - title: "Global state: OnceLock and LazyLock"
    id: sync-7
    text: |
      Some data really is global: a lookup table used everywhere, a counter for ids, a config loaded at startup. A **`static`** item lives for the whole program and every thread can see it, so its type must be `Sync`. A static's starting value must be computable at compile time, and statics are immutable: `COUNTER += 1` on a `static COUNTER: u32` fails with ``error[E0594]: cannot assign to immutable static item `COUNTER` ``.

      Three tools cover nearly every need:

      - **Atomics** can be created at compile time, so `static NEXT_ID: AtomicU64 = AtomicU64::new(1);` is a global counter, no `unsafe` needed. (`Mutex::new` works in a static too.)
      - **`LazyLock<T>`** (`std::sync`) holds a value that's built at run time, by a closure that runs on **first use**, exactly once, even if several threads get there at the same moment. After that it derefs to `T`. Use it for tables and other values that can't be built at compile time: `static PRICES: HashMap<..> = HashMap::new();` fails with `error[E0015]: cannot call non-const associated function`.
      - **`OnceLock<T>`** is a slot you fill once at run time: `get_or_init(|| ...)` returns the value, initializing it on the first call; `set(value)` fills it (and returns `Err` if it was already full); `get()` returns `Option<&T>`. Use it when the value depends on something only known while running, like a command-line argument.

      ```rust run
      use std::collections::HashMap;
      use std::sync::LazyLock;
      use std::sync::atomic::{AtomicU64, Ordering};
      use std::thread;

      static NEXT_TICKET: AtomicU64 = AtomicU64::new(1);

      static PRICES: LazyLock<HashMap<&'static str, u32>> =
          LazyLock::new(|| HashMap::from([("standard", 40), ("vip", 120), ("child", 15)]));

      fn next_ticket() -> u64 {
          NEXT_TICKET.fetch_add(1, Ordering::Relaxed)
      }

      fn main() {
          let mut tickets: Vec<u64> = thread::scope(|s| {
              let handles: Vec<_> = (0..3).map(|_| s.spawn(next_ticket)).collect();
              handles.into_iter().map(|h| h.join().unwrap()).collect()
          });
          tickets.sort();
          println!("tickets issued: {tickets:?}");
          println!("vip costs {}", PRICES["vip"]);
          println!("student price: {:?}", PRICES.get("student"));
      }
      ```

      ```output
      tickets issued: [1, 2, 3]
      vip costs 120
      student price: None
      ```

      `s.spawn(next_ticket)` passes the function itself as the thread's closure. Which thread got which ticket varies, so the tickets are sorted before printing; `fetch_add` guarantees no two threads get the same number.

      `OnceLock` with `get_or_init` is the classic "load once" helper:

      ```rust run
      use std::sync::OnceLock;

      struct Config {
          region: String,
          retries: u32,
      }

      static CONFIG: OnceLock<Config> = OnceLock::new();

      fn config() -> &'static Config {
          CONFIG.get_or_init(|| {
              println!("loading config (only once)");
              Config { region: String::from("eu-west"), retries: 3 }
          })
      }

      fn main() {
          println!("{} with {} retries", config().region, config().retries);
          println!("still {}", config().region);
      }
      ```

      ```output
      loading config (only once)
      eu-west with 3 retries
      still eu-west
      ```

      ### At work

      - Globals make code harder to test, since every test shares them. Prefer passing state explicitly (an `Arc<AppState>` given to each request handler is the norm in web services, module 41). Keep globals for true constants: lookup tables, compiled regexes (`static RE: LazyLock<Regex>`).
      - Older code uses the `lazy_static!` macro or the `once_cell` crate. `LazyLock` and `OnceLock` replaced both in the standard library.
      - `static mut` exists, but every access is `unsafe` (module 36). Use an atomic, a `Mutex` or a `OnceLock` instead.

      ### Which tool when

      | You need | Use |
      |---|---|
      | Hand values from one thread to another | a channel (`mpsc`) |
      | Many threads read the same data | `Arc<T>` (or borrow it with `thread::scope`) |
      | Many threads change the same data | `Arc<Mutex<T>>` (`RwLock` if reads dominate) |
      | A shared counter or flag | an atomic |
      | A global built once | `LazyLock` / `OnceLock` |

      **Your turn:** shipping fees (in cents) are a global table: `"local"` 300, `"national"` 700, `"eu"` 1500, `"world"` 3500. Declare `static SHIPPING: LazyLock<HashMap<&'static str, u64>>` built on first use, and write `fn total_with_shipping(zone: &str, subtotal: u64) -> Option<u64>` that adds the zone's fee to `subtotal`, or returns `None` for an unknown zone.
    seed: |
      use std::collections::HashMap;
      use std::sync::LazyLock;

      // static SHIPPING: LazyLock<HashMap<&'static str, u64>> = ...

      fn total_with_shipping(zone: &str, subtotal: u64) -> Option<u64> {
          todo!()
      }
    solution: |
      use std::collections::HashMap;
      use std::sync::LazyLock;

      static SHIPPING: LazyLock<HashMap<&'static str, u64>> =
          LazyLock::new(|| HashMap::from([("local", 300), ("national", 700), ("eu", 1500), ("world", 3500)]));

      fn total_with_shipping(zone: &str, subtotal: u64) -> Option<u64> {
          SHIPPING.get(zone).map(|fee| subtotal + fee)
      }
    require:
      - pattern: 'static\s+SHIPPING\s*:\s*(std::sync::)?LazyLock'
        message: "Declare the table as `static SHIPPING: LazyLock<...>`."
    hints:
      - "`static SHIPPING: LazyLock<HashMap<&'static str, u64>> = LazyLock::new(|| HashMap::from([(\"local\", 300), ...]));`"
      - "`SHIPPING.get(zone)` gives an `Option<&u64>`; `.map(|fee| subtotal + fee)` adds the fee."
    harness: |
      #[test]
      fn local_shipping_is_added() {
          assert_eq!(total_with_shipping("local", 2000), Some(2300), "total_with_shipping(\"local\", 2000)");
      }

      #[test]
      fn world_shipping_is_added() {
          assert_eq!(total_with_shipping("world", 10_000), Some(13_500), "total_with_shipping(\"world\", 10000)");
      }

      #[test]
      fn unknown_zone_is_none() {
          assert_eq!(total_with_shipping("moon", 500), None, "total_with_shipping(\"moon\", 500)");
      }

      #[test]
      fn zones_are_case_sensitive() {
          assert_eq!(total_with_shipping("EU", 100), None, "total_with_shipping(\"EU\", 100)");
      }

      #[test]
      fn works_from_several_threads() {
          let totals: Vec<Option<u64>> = std::thread::scope(|s| {
              let a = s.spawn(|| total_with_shipping("eu", 0));
              let b = s.spawn(|| total_with_shipping("national", 1));
              vec![a.join().unwrap(), b.join().unwrap()]
          });
          assert_eq!(totals, vec![Some(1500), Some(701)], "eu and national from two threads");
      }
    more:
      - task: |
          A greeting is set once at startup from the server's name, then read everywhere. With `static GREETING: OnceLock<String>`, write:

          - `fn init_greeting(name: &str) -> bool`: stores `"Welcome to {name}"` and returns `true`, or returns `false` (changing nothing) if a greeting was already set.
          - `fn greeting() -> &'static str`: the stored greeting, or `"Welcome"` if none was set yet.
        seed: |
          use std::sync::OnceLock;

          static GREETING: OnceLock<String> = OnceLock::new();

          fn init_greeting(name: &str) -> bool {
              todo!()
          }

          fn greeting() -> &'static str {
              todo!()
          }
        solution: |
          use std::sync::OnceLock;

          static GREETING: OnceLock<String> = OnceLock::new();

          fn init_greeting(name: &str) -> bool {
              GREETING.set(format!("Welcome to {name}")).is_ok()
          }

          fn greeting() -> &'static str {
              GREETING.get().map(|s| s.as_str()).unwrap_or("Welcome")
          }
        hints:
          - "`GREETING.set(value)` returns `Ok(())` the first time and `Err(value)` after that; `.is_ok()` turns it into the `bool`."
          - "`GREETING.get()` is an `Option<&String>`: `.map(|s| s.as_str()).unwrap_or(\"Welcome\")`."
        harness: |
          #[test]
          fn default_greeting_before_init() {
              assert_eq!(greeting(), "Welcome", "greeting() before init_greeting");
          }

          #[test]
          fn init_sets_the_greeting() {
              assert_eq!(init_greeting("Crab Arena"), true, "init_greeting(\"Crab Arena\")");
              assert_eq!(greeting(), "Welcome to Crab Arena", "greeting() after init");
          }

          #[test]
          fn second_init_is_ignored() {
              init_greeting("First");
              assert_eq!(init_greeting("Second"), false, "init_greeting(\"Second\") after \"First\"");
              assert_eq!(greeting(), "Welcome to First", "greeting() after two inits");
          }

          #[test]
          fn all_threads_see_the_same_greeting() {
              init_greeting("Shell Cove");
              let seen: Vec<&str> = std::thread::scope(|s| {
                  let handles: Vec<_> = (0..4).map(|_| s.spawn(greeting)).collect();
                  handles.into_iter().map(|h| h.join().unwrap()).collect()
              });
              assert_eq!(seen, vec!["Welcome to Shell Cove"; 4], "greeting() from 4 threads");
          }
