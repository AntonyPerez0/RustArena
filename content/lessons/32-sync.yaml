            message: Pass the numbers through a channel made with `mpsc::channel()`.
          - pattern: '\.send\('
            message: The worker should `send` each valid number.
        hints:
          - "Create `let (tx, rx) = mpsc::channel();`, then spawn a `move` closure that loops over `lines`."
          - "In the worker: `if let Ok(n) = line.parse::<u32>() { tx.send(n).unwrap(); }`."
          - "In main: `let valid: Vec<u32> = rx.iter().collect();` waits until the worker is done and its `tx` is dropped."
        tests:
          - expect: "valid: [12, 7, 30]\nsum: 49"

  - title: "Multiple producers: cloning the Sender"
    id: sync-2
    text: |
      The *mp* in `mpsc`: any number of threads can send into one channel. Each thread gets its own `Sender` by **cloning** it:

      ```rust run
      use std::sync::mpsc;
      use std::thread;

      fn main() {
          let (tx, rx) = mpsc::channel();
          for worker in 1..=3 {
              let tx = tx.clone();
              thread::spawn(move || {
                  let checked = worker * 100;
                  tx.send((worker, checked)).unwrap();
              });
          }
          drop(tx);

          let mut results: Vec<(u32, u32)> = rx.iter().collect();
          results.sort();
          for (worker, checked) in results {
              println!("worker {worker} checked {checked} files");
          }
      }
      ```

      ```output
      worker 1 checked 100 files
      worker 2 checked 200 files
      worker 3 checked 300 files
      ```

      - `let tx = tx.clone();` makes a new `Sender` for the same channel and shadows the name inside the loop, so the *clone* is what moves into each closure.
      - Messages from different threads arrive in whatever order the threads happen to run. So each message carries who sent it, and `main` **sorts** before printing. Never rely on arrival order between producers.
      - `drop(tx)` throws away `main`'s own `Sender`. That line matters more than it looks.

      ### The forgotten sender

      The receiving loop ends only when **every** `Sender` is gone. The workers' clones are dropped when the workers finish, but the original `tx` belongs to `main`. Without `drop(tx)`, `main` waits for a message from itself that never comes, and the program hangs forever:

      ```rust
      let (tx, rx) = mpsc::channel();
      for worker in 1..=3 {
          let tx = tx.clone();
          thread::spawn(move || tx.send(worker).unwrap());
      }
      // no drop(tx) here...
      for n in rx {
          println!("{n}"); // prints 3 numbers, then waits forever
      }
      ```

      This is the most common channel bug. On this site it shows up as the time limit running out.

      ### Bounded channels and backpressure

      `mpsc::channel()` is **unbounded**: `send` never waits, so a fast producer can pile up millions of unread messages in memory. `mpsc::sync_channel(n)` holds at most `n` messages; when it's full, `send` waits until the receiver catches up. That's **backpressure**: the slow side automatically slows the fast side down. Production pipelines usually use bounded channels.

      At work you'll also meet the `crossbeam-channel` crate (channels with several receivers, and waiting on several channels at once) and Tokio's async channels (module 33).

      ### Common mistakes

      - **Forgetting `drop(tx)`**: the program hangs.
      - **Moving `tx` instead of cloning it** in a loop: ``error[E0382]: use of moved value: `tx` `` with the note "value moved into closure here, in previous iteration of loop".
      - **Printing in arrival order** from several producers: the output changes between runs. Collect, then sort (or use a `BTreeMap`).

      **Your turn:** three store threads report their sales over one channel. Spawn one thread per store; each sends every sale as a `(store, amount)` message. Don't forget the original sender. The main thread adds the sales up per store in the `BTreeMap` and prints the totals (a `BTreeMap` iterates in key order):

      ```
      east: 190
      north: 245
      south: 320
      ```
    seed: |
      use std::collections::BTreeMap;
      use std::sync::mpsc;
      use std::thread;

      fn main() {
          let stores = vec![
              ("north", vec![120, 80, 45]),
              ("south", vec![300, 20]),
              ("east", vec![60, 60, 60, 10]),
          ];
          let (tx, rx) = mpsc::channel::<(&str, u32)>();
          // one thread per store: send each sale as (store, amount)

          let mut totals: BTreeMap<&str, u32> = BTreeMap::new();
          // receive every sale, add it to its store's total, then print the totals
      }
    solution: |
      use std::collections::BTreeMap;
      use std::sync::mpsc;
      use std::thread;

      fn main() {
          let stores = vec![
              ("north", vec![120, 80, 45]),
              ("south", vec![300, 20]),
              ("east", vec![60, 60, 60, 10]),
          ];
          let (tx, rx) = mpsc::channel::<(&str, u32)>();
          // one thread per store: send each sale as (store, amount)
          for (store, sales) in stores {
              let tx = tx.clone();
              thread::spawn(move || {
                  for amount in sales {
                      tx.send((store, amount)).unwrap();
                  }
              });
          }
          drop(tx);

          let mut totals: BTreeMap<&str, u32> = BTreeMap::new();
          // receive every sale, add it to its store's total, then print the totals
          for (store, amount) in rx {
              *totals.entry(store).or_insert(0) += amount;
          }
          for (store, total) in &totals {
              println!("{store}: {total}");
          }
      }
    require:
      - pattern: 'tx\.clone\(\)|Sender::clone'
        message: Give each store thread its own clone of the `Sender`.
    hints:
      - "In a loop over `stores`, write `let tx = tx.clone();` and spawn a `move` closure that sends `(store, amount)` for each sale."
      - "After the loop, `drop(tx);`, or the receiving loop never ends."
      - "`for (store, amount) in rx { *totals.entry(store).or_insert(0) += amount; }`, then print with `for (store, total) in &totals`."
    tests:
      - expect: "east: 190\nnorth: 245\nsouth: 320"
    more:
      - task: |
          This program prints nothing and then hits the time limit: it waits forever. Find out why and fix it by adding **one line**, so it prints `sum of squares: 55`.
        seed: |
          use std::sync::mpsc;
          use std::thread;

          fn main() {
              let (tx, rx) = mpsc::channel();
              for n in 1..=5 {
                  let tx = tx.clone();
                  thread::spawn(move || {
                      tx.send(n * n).unwrap();
                  });
              }
              let total: u32 = rx.iter().sum();
              println!("sum of squares: {total}");
          }
        solution: |
          use std::sync::mpsc;
          use std::thread;

          fn main() {
              let (tx, rx) = mpsc::channel();
              for n in 1..=5 {
                  let tx = tx.clone();
                  thread::spawn(move || {
                      tx.send(n * n).unwrap();
                  });
              }
              drop(tx);
              let total: u32 = rx.iter().sum();
              println!("sum of squares: {total}");
          }
        hints:
          - "`rx.iter()` only ends when every `Sender` is dropped. Which `Sender` is never dropped?"
          - "`main` still owns the original `tx`. Add `drop(tx);` before receiving."
        tests:
          - expect: "sum of squares: 55"
      - task: |
          Write `fn search_parallel(docs: Vec<String>, needle: &str) -> Vec<usize>`. Spawn one thread per document (with `thread::spawn`); each thread sends its document's **index** over a channel if the document contains `needle`. Return the indices sorted ascending. A spawned thread can't borrow `needle`, so give each thread its own `String` copy of it.
        seed: |
          use std::sync::mpsc;
          use std::thread;

          fn search_parallel(docs: Vec<String>, needle: &str) -> Vec<usize> {
              todo!()
          }
        solution: |
          use std::sync::mpsc;
          use std::thread;

          fn search_parallel(docs: Vec<String>, needle: &str) -> Vec<usize> {
              let (tx, rx) = mpsc::channel();
              for (i, doc) in docs.into_iter().enumerate() {
                  let tx = tx.clone();
                  let needle = needle.to_string();
                  thread::spawn(move || {
                      if doc.contains(&needle) {
                          tx.send(i).unwrap();
                      }
                  });
              }
              drop(tx);
              let mut found: Vec<usize> = rx.iter().collect();
              found.sort();
              found
          }
        require:
          - pattern: 'thread::spawn'
            message: Spawn one thread per document with `thread::spawn`.
          - pattern: '\.send\('
            message: Send the matching indices over the channel.
        hints:
          - "In the loop over `docs.into_iter().enumerate()`: clone `tx`, make `let needle = needle.to_string();`, then spawn a `move` closure."
          - "Drop the original `tx` after the loop, collect `rx.iter()` into a `Vec`, sort it and return it."
        harness: |
          fn docs(list: &[&str]) -> Vec<String> {
              list.iter().map(|s| s.to_string()).collect()
          }

          #[test]
          fn finds_the_matching_documents() {
              let d = docs(&["error: disk full", "all good", "error: timeout", "ok"]);
              assert_eq!(search_parallel(d, "error"), vec![0, 2], "search_parallel(4 logs, \"error\")");
          }

          #[test]
          fn no_match_gives_empty() {
              assert_eq!(search_parallel(docs(&["a", "b"]), "z"), Vec::<usize>::new(), "search_parallel([\"a\", \"b\"], \"z\")");
          }

          #[test]
          fn no_documents_gives_empty() {
              assert_eq!(search_parallel(vec![], "x"), Vec::<usize>::new(), "search_parallel([], \"x\")");
          }

          #[test]
          fn results_are_sorted_even_with_many_documents() {
              let d: Vec<String> = (0..50).map(|n| if n % 5 == 0 { format!("crab {n}") } else { format!("fish {n}") }).collect();
              assert_eq!(search_parallel(d, "crab"), vec![0, 5, 10, 15, 20, 25, 30, 35, 40, 45], "search_parallel(50 docs, \"crab\")");
          }

  - title: "Arc: shared ownership across threads"
    id: sync-3
    text: |
      A channel moves data from one thread to another. Sometimes many threads need to **read the same data**: a price list, a config, a dictionary. Cloning it for every thread wastes memory, and scoped threads only work when all threads finish inside one function. For threads started with `thread::spawn`, you share data with **`Arc<T>`**.

      You met `Arc` briefly in the last module. It's the thread-safe version of `Rc` (module 29): `Arc::new(value)` puts the value on the heap next to a **reference count**. `Arc::clone(&a)` makes another pointer to the *same* value and adds one to the count; no data is copied. When the last `Arc` is dropped, the value is dropped. The count is updated with atomic CPU instructions, so `Arc<T>` can be sent to and shared between threads (as long as `T` itself is `Send` and `Sync`).

      ```rust run
      use std::collections::HashMap;
      use std::sync::Arc;
      use std::thread;

      fn main() {
          let prices: HashMap<&str, u32> = HashMap::from([("kelp", 3), ("shell", 12), ("pearl", 250)]);
          let prices = Arc::new(prices);
          let orders = vec![vec!["kelp", "kelp", "shell"], vec!["pearl"], vec!["shell", "kelp"]];

          let mut handles = Vec::new();
          for order in orders {
              let prices = Arc::clone(&prices);
              handles.push(thread::spawn(move || order.iter().map(|item| prices[item]).sum::<u32>()));
          }
          for (i, handle) in handles.into_iter().enumerate() {
              println!("order {i}: {}", handle.join().unwrap());
          }
          println!("owners of the price table now: {}", Arc::strong_count(&prices));
      }
      ```

      ```output
      order 0: 18
      order 1: 250
      order 2: 15
      owners of the price table now: 1
      ```

      - Each thread gets its own `Arc` (a pointer), moved into its closure. All of them point at one `HashMap`.
      - `Arc::strong_count` shows how many `Arc`s point at the value. After the joins, the threads' clones have been dropped, so only `main`'s is left.
      - `Arc::clone(&prices)` and `prices.clone()` do the same thing. Many teams prefer `Arc::clone(&x)` because it makes clear that only a pointer is copied, not the whole table.

      ### Arc is read-only

      `Arc<T>` hands out shared references (`&T`) only. Several threads hold it at once, so letting one of them change the value would be a data race:

      ```rust compile_fail
      use std::sync::Arc;
      use std::thread;

      fn main() {
          let stock = Arc::new(vec![1, 2, 3]);
          let for_worker = Arc::clone(&stock);
          let handle = thread::spawn(move || {
              for_worker.push(4);
          });
          handle.join().unwrap();
          println!("{:?}", stock);
      }
      ```

      ```error
      error[E0596]: cannot borrow data in an `Arc` as mutable
      ```

      To change shared data, put a lock inside the `Arc`: `Arc<Mutex<T>>`, the next step.

      ### Common mistakes

      - **Cloning the data instead of the pointer**: `Arc::new(prices.clone())` in the loop gives every thread its own copy. Clone the `Arc`.
      - **Cloning outside the loop**: one clone moved into the first thread leaves nothing for the second: `E0382`. Clone once per thread, inside the loop.
      - **Using `Arc` when borrowing would do**: if all threads end inside one function, `thread::scope` lets them borrow, no `Arc` needed.

      **Your turn:** three warehouse requests are checked against one shared stock table, each in its own spawned thread. Wrap `stock` in an `Arc`, give each thread its own clone, and have each thread return its line. Join in order and print:

      ```
      2 x helmet: ok
      5 x shield: short by 2
      1 x sword: unknown item
      ```

      A request is `ok` when the stock has at least the asked quantity, `short by N` when it has less, and `unknown item` when the item isn't in the table at all.
    seed: |
      use std::collections::BTreeMap;
      use std::sync::Arc;
      use std::thread;

      fn main() {
          let stock: BTreeMap<&str, u32> = BTreeMap::from([("helmet", 7), ("shield", 3), ("boots", 12)]);
          let requests = vec![("helmet", 2), ("shield", 5), ("sword", 1)];
          // share `stock` with an Arc, one thread per request, then join in order and print
      }
    solution: |
      use std::collections::BTreeMap;
      use std::sync::Arc;
      use std::thread;

      fn main() {
          let stock: BTreeMap<&str, u32> = BTreeMap::from([("helmet", 7), ("shield", 3), ("boots", 12)]);
          let requests = vec![("helmet", 2), ("shield", 5), ("sword", 1)];
          // share `stock` with an Arc, one thread per request, then join in order and print
          let stock = Arc::new(stock);
          let mut handles = Vec::new();
          for (item, wanted) in requests {
              let stock = Arc::clone(&stock);
              handles.push(thread::spawn(move || match stock.get(item) {
                  Some(&have) if have >= wanted => format!("{wanted} x {item}: ok"),
                  Some(&have) => format!("{wanted} x {item}: short by {}", wanted - have),
                  None => format!("{wanted} x {item}: unknown item"),
              }));
          }
          for handle in handles {
              println!("{}", handle.join().unwrap());
          }
      }
    require:
      - pattern: 'Arc::new'
        message: Wrap the stock table in an `Arc` with `Arc::new`.
      - pattern: 'thread::spawn'
        message: Check each request in a thread started with `thread::spawn`.
    hints:
      - "`let stock = Arc::new(stock);`, then in the loop over `requests`: `let stock = Arc::clone(&stock);` before spawning."
      - "In the thread, `match stock.get(item)`: `Some(&have) if have >= wanted`, `Some(&have)`, and `None`. Each arm returns a `format!`."
    tests:
      - expect: "2 x helmet: ok\n5 x shield: short by 2\n1 x sword: unknown item"
    more:
      - task: |
          Fill in the two blanks: put the menu behind an `Arc`, and give the worker its own pointer to it. The program should print `the worker counted 3 dishes` and then `main still has 3 dishes`.
        fill: |
