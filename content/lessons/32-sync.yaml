          - `fn lookup(table: &RwLock<BTreeMap<String, u32>>, item: &str) -> Option<u32>` takes a **read** lock and returns the item's price.
          - `fn set_price(table: &RwLock<BTreeMap<String, u32>>, item: &str, price: u32)` takes a **write** lock and inserts or replaces the price.
        seed: |
          use std::collections::BTreeMap;
          use std::sync::RwLock;

          fn lookup(table: &RwLock<BTreeMap<String, u32>>, item: &str) -> Option<u32> {
              todo!()
          }

          fn set_price(table: &RwLock<BTreeMap<String, u32>>, item: &str, price: u32) {
              todo!()
          }
        solution: |
          use std::collections::BTreeMap;
          use std::sync::RwLock;

          fn lookup(table: &RwLock<BTreeMap<String, u32>>, item: &str) -> Option<u32> {
              table.read().unwrap().get(item).copied()
          }

