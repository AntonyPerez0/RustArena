        hints:
          - "`Arc::new(value)` creates the shared value; `Arc::clone(&menu)` makes another pointer to it."
        tests:
          - expect: "the worker counted 3 dishes\nmain still has 3 dishes"
      - task: |
          Write `fn count_matches(lines: Arc<Vec<String>>, patterns: Vec<String>) -> Vec<usize>`. Spawn **one thread per pattern** with `thread::spawn` (not a scope); each counts how many lines contain its pattern. Share the lines through the `Arc` (no copying of the lines) and return the counts in the same order as `patterns`.
        seed: |
          use std::sync::Arc;
          use std::thread;

          fn count_matches(lines: Arc<Vec<String>>, patterns: Vec<String>) -> Vec<usize> {
              todo!()
          }
        solution: |
          use std::sync::Arc;
          use std::thread;

          fn count_matches(lines: Arc<Vec<String>>, patterns: Vec<String>) -> Vec<usize> {
              let mut handles = Vec::new();
              for pattern in patterns {
                  let lines = Arc::clone(&lines);
                  handles.push(thread::spawn(move || lines.iter().filter(|line| line.contains(&pattern)).count()));
              }
              handles.into_iter().map(|h| h.join().unwrap()).collect()
          }
        require:
          - pattern: 'thread::spawn'
            message: Use `thread::spawn`, one thread per pattern.
        forbid:
          - pattern: 'thread::scope'
            message: Practice sharing with `Arc` here, so use `thread::spawn` rather than a scope.
          - pattern: 'lines\.to_vec\(\)|\(\*lines\)\.clone\(\)|lines\.as_ref\(\)\.clone\(\)'
            message: Share the lines through the `Arc` instead of copying them.
        hints:
          - "For each pattern: `let lines = Arc::clone(&lines);`, then spawn a `move` closure that uses `lines` and `pattern`."
          - "Counting: `lines.iter().filter(|line| line.contains(&pattern)).count()`."
        harness: |
          fn shared(list: &[&str]) -> Arc<Vec<String>> {
              Arc::new(list.iter().map(|s| s.to_string()).collect())
          }

          fn pats(list: &[&str]) -> Vec<String> {
              list.iter().map(|s| s.to_string()).collect()
          }

          #[test]
          fn counts_each_pattern_in_order() {
              let lines = shared(&["GET /shop", "POST /login", "GET /", "GET /shop/cart"]);
              assert_eq!(count_matches(lines, pats(&["GET", "shop", "DELETE"])), vec![3, 2, 0], "count_matches(4 log lines, [GET, shop, DELETE])");
          }

          #[test]
          fn no_patterns_gives_empty() {
              assert_eq!(count_matches(shared(&["a"]), vec![]), Vec::<usize>::new(), "count_matches([\"a\"], [])");
          }

          #[test]
          fn no_lines_counts_zero() {
              assert_eq!(count_matches(shared(&[]), pats(&["x", "y"])), vec![0, 0], "count_matches([], [x, y])");
          }

          #[test]
          fn the_caller_keeps_the_lines() {
              let lines = shared(&["crab", "crab cake"]);
              let counts = count_matches(Arc::clone(&lines), pats(&["crab", "cake"]));
              assert_eq!((counts, lines.len()), (vec![2, 1], 2), "counts, then the caller's lines.len()");
          }

  - title: "Mutex: one writer at a time"
    id: sync-4
    text: |
      `Arc` shares data read-only. To **change** shared data, threads must take turns. A **`Mutex<T>`** (short for *mutual exclusion*) wraps a value so only one thread at a time can get at it:

      - `mutex.lock()` waits until no other thread holds the mutex, then returns a **`MutexGuard`**: a smart pointer that derefs to the value, so `*guard += 1` works.
      - When the guard is dropped (normally at the end of its scope), the mutex **unlocks** automatically. That's RAII, the same idea as `Drop` in module 23: you can't forget to unlock.

      With scoped threads, a plain `Mutex` is enough:

      ```rust run
      use std::sync::Mutex;
      use std::thread;

      fn main() {
          let visits = Mutex::new(0);
          thread::scope(|s| {
              for _ in 0..8 {
                  s.spawn(|| {
                      for _ in 0..1000 {
                          let mut count = visits.lock().unwrap();
                          *count += 1;
                      }
                  });
              }
          });
          println!("visits: {}", visits.into_inner().unwrap());
      }
      ```

      ```output
      visits: 8000
      ```

      8 threads × 1000 increments, and the answer is 8000 on every run, because each `+= 1` happens while holding the lock. `into_inner()` consumes the `Mutex` once no thread needs it anymore and gives back the value.

      ### Why lock() returns a Result: poisoning

      If a thread panics while holding a guard, the value might be half-updated. The mutex is then marked **poisoned**, and later `lock()` calls return `Err` to warn you. `.lock().unwrap()` (turn that into a panic too) is what almost all code does.

      ### Arc<Mutex<T>>: shared and changeable

      Threads from `thread::spawn` can't borrow, so they share the `Mutex` through an `Arc`. Each layer has one job: `Arc` gives **shared ownership**, `Mutex` gives **one-at-a-time access** for changes. It's the threaded version of `Rc<RefCell<T>>` from module 29.

      ```rust run
      use std::sync::{Arc, Mutex};
      use std::thread;

      fn main() {
          let log = Arc::new(Mutex::new(Vec::new()));
          let mut handles = Vec::new();
          for id in 1..=3 {
              let log = Arc::clone(&log);
              handles.push(thread::spawn(move || {
                  let mut entries = log.lock().unwrap();
                  entries.push(format!("worker {id} finished"));
              }));
          }
          for handle in handles {
              handle.join().unwrap();
          }
          let mut entries = log.lock().unwrap();
          entries.sort();
          for entry in entries.iter() {
              println!("{entry}");
          }
      }
      ```

      ```output
      worker 1 finished
      worker 2 finished
      worker 3 finished
      ```

      The workers push in whatever order they run, so `main` sorts before printing.

      ### Keep the lock short

      Other threads wait for as long as you hold the guard. Do the slow work (parsing, computing, I/O) *before* locking, then lock, update, and let the guard go. To unlock early, put the guard in a `{ }` block or call `drop(guard)`.

      ### Common mistakes

      - **Read and write in two separate locks**: `let n = *c.lock().unwrap();` then `*c.lock().unwrap() = n + 1;`. Between the two, another thread can update the value, and one update is lost. Do the whole read-change-write under **one** guard.
      - **Forgetting the `Arc`** with spawned threads: the `Mutex` moves into the first thread, then ``error[E0382]: use of moved value: `counter` ``.
      - **Holding a guard while doing slow work**: every other thread stalls.
      - **Locking the same mutex twice in one thread**: the program freezes. Next step.

      **Your turn:** four threads each make 25 deposits of 10 coins into one shared `Account`. Share the account with `Arc<Mutex<Account>>` and spawned threads; each deposit adds 10 to `balance` and 1 to `transactions` **under one lock**. After joining, print:

      ```
      balance: 1000
      transactions: 100
      ```
    seed: |
      use std::sync::{Arc, Mutex};
      use std::thread;

      struct Account {
          balance: u64,
          transactions: u32,
      }

      fn main() {
          let account = Arc::new(Mutex::new(Account { balance: 0, transactions: 0 }));
          // spawn 4 threads; each makes 25 deposits of 10 coins
          // join them, then print the balance and the number of transactions
      }
    solution: |
      use std::sync::{Arc, Mutex};
      use std::thread;

      struct Account {
          balance: u64,
          transactions: u32,
      }

      fn main() {
          let account = Arc::new(Mutex::new(Account { balance: 0, transactions: 0 }));
          // spawn 4 threads; each makes 25 deposits of 10 coins
          let mut handles = Vec::new();
          for _ in 0..4 {
              let account = Arc::clone(&account);
              handles.push(thread::spawn(move || {
                  for _ in 0..25 {
                      let mut acc = account.lock().unwrap();
                      acc.balance += 10;
                      acc.transactions += 1;
                  }
              }));
          }
          // join them, then print the balance and the number of transactions
          for handle in handles {
              handle.join().unwrap();
          }
          let acc = account.lock().unwrap();
          println!("balance: {}", acc.balance);
          println!("transactions: {}", acc.transactions);
      }
    require:
      - pattern: 'thread::spawn'
        message: Use spawned threads (`thread::spawn`) sharing the account through the `Arc`.
      - pattern: '\.lock\(\)'
        message: Lock the mutex to change the account.
    hints:
      - "In a loop of 4: `let account = Arc::clone(&account);`, then `thread::spawn(move || { ... })` and keep the handle."
      - "Each deposit: `let mut acc = account.lock().unwrap(); acc.balance += 10; acc.transactions += 1;`"
      - "Join all handles, then lock once more in `main` to read the final values."
    tests:
      - expect: "balance: 1000\ntransactions: 100"
    more:
      - task: |
          Five checkout threads each sell one item from the shared stock. Fill in the blank that takes the lock. The program should print `left in stock: 15`.
        fill: |
