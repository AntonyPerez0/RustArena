          use std::thread;

          fn main() {
              let menu = Arc::[[new]](vec!["kelp soup", "crab cakes", "sea salad"]);
              let for_worker = Arc::[[clone]](&menu);
              let handle = thread::spawn(move || for_worker.len());
              println!("the worker counted {} dishes", handle.join().unwrap());
              println!("main still has {} dishes", menu.len());
