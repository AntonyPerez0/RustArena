        solution: |
          use std::sync::atomic::{AtomicU32, AtomicUsize, Ordering};
          use std::thread;

          fn main() {
              let servers = vec![vec![40, 97, 12], vec![55, 81], vec![3, 60, 77, 90]];
              let best = AtomicU32::new(0);
              let games = AtomicUsize::new(0);
              thread::scope(|s| {
                  for scores in &servers {
                      s.spawn(|| {
                          for &score in scores.iter() {
