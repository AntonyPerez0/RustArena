          let data: Vec<u64> = (1..=10).collect();
          assert_eq!(parallel_sum(&data, 3), 55, "parallel_sum(1..=10, 3)");
      }

      #[test]
      fn one_worker_sums_everything() {
          assert_eq!(parallel_sum(&[4, 8, 15, 16, 23, 42], 1), 108, "parallel_sum([4, 8, 15, 16, 23, 42], 1)");
      }

      #[test]
      fn more_workers_than_items() {
          assert_eq!(parallel_sum(&[5, 6], 8), 11, "parallel_sum([5, 6], 8)");
      }

      #[test]
      fn empty_slice_sums_to_zero() {
          assert_eq!(parallel_sum(&[], 4), 0, "parallel_sum([], 4)");
      }

      #[test]
      fn large_input_with_four_workers() {
          let data: Vec<u64> = (1..=100_000).collect();
          assert_eq!(parallel_sum(&data, 4), 5_000_050_000, "parallel_sum(1..=100_000, 4)");
      }
