      - task: |
          Count the primes below 50,000 in parallel. Write `fn is_prime(n: u32) -> bool` yourself (trial division up to the square root is fine), then use `(2..50_000u32).into_par_iter()` to count them and to find the largest one. Print:

          ```
          primes below 50000: 5133
          largest: 49999
          ```
        seed: |
          use rayon::prelude::*;

          fn main() {
          }
        solution: |
          use rayon::prelude::*;

          fn is_prime(n: u32) -> bool {
              if n < 2 {
                  return false;
              }
              let mut d = 2;
              while d * d <= n {
                  if n % d == 0 {
                      return false;
                  }
                  d += 1;
              }
              true
          }

          fn main() {
              let count = (2..50_000u32).into_par_iter().filter(|&n| is_prime(n)).count();
              let largest = (2..50_000u32).into_par_iter().filter(|&n| is_prime(n)).max().unwrap();
              println!("primes below 50000: {count}");
              println!("largest: {largest}");
          }
        require:
          - pattern: 'into_par_iter'
            message: Use `into_par_iter()` on the range.
        hints:
          - "`is_prime`: return `false` below 2, then try every divisor `d` while `d * d <= n`."
          - "`(2..50_000u32).into_par_iter().filter(|&n| is_prime(n)).count()`, and the same with `.max()` (an `Option`) for the largest."
        tests:
          - expect: "primes below 50000: 5133\nlargest: 49999"
