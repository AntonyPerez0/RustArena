        solution: |
          use std::thread;

          // From another team's crate. It panics on bad input, and you can't change it.
          fn risky_parse(s: &str) -> u8 {
              s.trim().parse().expect("not a valid u8")
          }

          fn parse_all(inputs: Vec<String>) -> Vec<Option<u8>> {
              let handles: Vec<_> = inputs.into_iter().map(|s| thread::spawn(move || risky_parse(&s))).collect();
              handles.into_iter().map(|h| h.join().ok()).collect()
          }
        harness: |
          #[test]
          fn all_good_inputs() {
              let inputs = vec![String::from("1"), String::from(" 20 "), String::from("255")];
              assert_eq!(parse_all(inputs), vec![Some(1), Some(20), Some(255)], "parse_all([\"1\", \" 20 \", \"255\"])");
          }

          #[test]
          fn bad_inputs_become_none() {
              let inputs = vec![String::from("7"), String::from("seven"), String::from("8")];
              assert_eq!(parse_all(inputs), vec![Some(7), None, Some(8)], "parse_all([\"7\", \"seven\", \"8\"])");
          }

          #[test]
          fn too_big_for_u8_is_none() {
              assert_eq!(parse_all(vec![String::from("300")]), vec![None], "parse_all([\"300\"])");
          }

          #[test]
          fn no_inputs_gives_empty() {
              assert_eq!(parse_all(vec![]), Vec::<Option<u8>>::new(), "parse_all([])");
          }
        require:
