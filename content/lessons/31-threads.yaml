        solution: |
          use std::thread;

          fn main() {
              let lines = vec!["21", "19", "oops", "23", "-4x"];
              let mut handles: Vec<thread::JoinHandle<Result<i32, String>>> = Vec::new();
              for line in lines {
                  // spawn a thread that parses `line` and returns Result<i32, String>
                  handles.push(thread::spawn(move || line.parse::<i32>().map_err(|e| e.to_string())));
              }
              // join in order and print `line N: VALUE` or `line N: error: MESSAGE`
              for (i, handle) in handles.into_iter().enumerate() {
                  match handle.join().unwrap() {
                      Ok(value) => println!("line {}: {value}", i + 1),
                      Err(e) => println!("line {}: error: {e}", i + 1),
                  }
              }
          }
