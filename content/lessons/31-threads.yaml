id: threads
title: Threads
phase: "Concurrency and async"
summary: Do several things at once with std::thread. Spawn and join threads, move data into them, borrow local data with scoped threads, see how Send and Sync rule out data races at compile time, handle panicking workers, and let rayon spread work over every core.
roadmap: ["Concurrency & Parallelism", "Threads, Channels, and Message Passing"]
steps:
  - title: Spawning a thread and joining it
    id: threads-1
    text: |
      Every program so far has done one thing at a time, top to bottom. A **thread** is an independent line of execution inside your program: it has its own place in the code and its own local variables, and it runs alongside the others. Every program starts with one, the **main thread**. `std::thread::spawn` starts another.

      Two words you'll hear a lot:

      - **Concurrency**: several tasks are in progress at the same time (they take turns, or overlap).
      - **Parallelism**: several tasks literally run at the same instant, on different CPU cores.

      Threads give you both: the operating system runs them on as many cores as it has. Teams use threads to put every core to work on heavy jobs (resizing images, crunching log files, compressing backups), or to keep one part of a program responsive while another part waits.

      ```rust run
      use std::thread;

      fn main() {
          let handle = thread::spawn(|| {
              let mut total: u64 = 0;
              for n in 1..=1_000 {
                  total += n;
              }
              total
          });

          println!("main thread keeps going");
          let total = handle.join().unwrap();
          println!("the worker computed {total}");
      }
      ```

      ```output
      main thread keeps going
      the worker computed 500500
      ```

      Piece by piece:

      - `use std::thread;` brings the `thread` module into scope so you can write `thread::spawn`.
      - `thread::spawn` takes a **closure** (module 26): the code the new thread runs. `|| { ... }` is a closure with no parameters. Its last expression, `total`, is what the thread returns.
      - `spawn` returns **immediately**, without waiting, and gives you a **`JoinHandle<T>`**, where `T` is the closure's return type (`u64` here). The worker starts running on its own, while `main` carries on and prints its line.
      - `handle.join()` **waits** until that thread has finished, then gives back its return value wrapped in a `Result`: `Ok(value)` normally, `Err(...)` if the thread panicked (step 6). `.unwrap()` is the usual choice: if a worker crashed, `main` should crash too.

      ### Threads run in an unpredictable order

      If two threads both print, you can't know which line comes first. The operating system's **scheduler** decides which thread runs on which core, and when, and the answer changes from run to run:

      ```rust
      let handle = thread::spawn(|| println!("hello from the worker"));
      println!("hello from main");
      handle.join().unwrap();
      // Sometimes "main" prints first, sometimes "worker". Both are correct.
      ```

      That's why the examples and exercises in this module never print from inside a worker. Workers **return** their results, and the main thread prints them after `join`, in a fixed order. Tests at work are written the same way: output that changes between runs makes a flaky test.

      ### When main ends, the program ends

      When `main` returns, the whole process exits, and every thread still running is stopped mid-work. A worker you forgot to join may never finish (or never even start). `join` is how you wait for it.

      ### Common mistakes

      - **Forgetting to join.** The program ends before the worker's work is done, and its result is silently lost.
      - **Joining right after spawning.** `thread::spawn(a).join(); thread::spawn(b).join();` runs `a`, waits, then runs `b`: no parallelism at all. Spawn every thread first, then join them.
      - **Treating `join()` as the value.** It returns a `Result`, so `let total: u64 = handle.join();` fails with `error[E0308]: mismatched types`. Add `.unwrap()`.

      **Your turn:** fill in the blanks: start a thread with `thread::spawn`, then wait for it and take its result with `join`. The program should print `word count: 10`.
    fill: |
      use std::thread;

      fn main() {
          let handle = thread::[[spawn]](|| {
              let review = "the crab arena is the best place to learn rust";
              review.split_whitespace().count()
          });
          let count = handle.[[join]]().unwrap();
          println!("word count: {count}");
      }
    hints:
      - "The function that starts a new thread is `thread::spawn`."
      - "The method that waits for a thread and gives back its result is `.join()`."
    tests:
      - expect: "word count: 10"
    more:
      - task: |
          A `JoinHandle` remembers the type its thread returns. Fill in that type in the annotation so the program compiles and prints `max temperature: 31`.
        fill: |
          use std::thread;

          fn main() {
              let handle: thread::JoinHandle<[[u32]]> = thread::spawn(|| {
                  let temps: [u32; 5] = [22, 27, 31, 19, 25];
                  let mut max = 0;
                  for t in temps {
                      if t > max {
                          max = t;
                      }
                  }
                  max
              });
              println!("max temperature: {}", handle.join().unwrap());
          }
        hints:
          - "The closure returns `max`, which holds values from a `[u32; 5]` array."
        tests:
          - expect: "max temperature: 31"
      - task: |
          Spawn **two** threads before joining either of them, so they can run at the same time:

          - the first adds up the even numbers from 1 to 100,
          - the second counts how many numbers from 1 to 100 are multiples of 7.

          Then join both and print:

          ```
          even sum: 2550
          multiples of 7: 14
          ```
        seed: |
          use std::thread;

          fn main() {
          }
        solution: |
          use std::thread;

          fn main() {
              let evens = thread::spawn(|| (1..=100).filter(|n| n % 2 == 0).sum::<u32>());
              let sevens = thread::spawn(|| (1..=100).filter(|n| n % 7 == 0).count());
              println!("even sum: {}", evens.join().unwrap());
              println!("multiples of 7: {}", sevens.join().unwrap());
          }
        require:
          - pattern: 'spawn[\s\S]*spawn[\s\S]*join[\s\S]*join'
            message: Spawn both threads first, and only then join them.
        hints:
          - "Keep both handles in variables: `let evens = thread::spawn(|| ...);` and `let sevens = thread::spawn(|| ...);`."
          - "An iterator does the counting: `(1..=100).filter(|n| n % 2 == 0).sum::<u32>()`, and `.count()` for the multiples of 7."
        tests:
          - expect: "even sum: 2550\nmultiples of 7: 14"

  - title: "move closures: giving data to a thread"
    id: threads-2
    text: |
      The closures in step 1 only used data they created themselves. Usually a thread needs data from outside. Here's the obvious attempt:

      ```rust compile_fail
      use std::thread;

      fn main() {
          let scores = vec![10, 20, 30];
          let handle = thread::spawn(|| scores.iter().sum::<i32>());
          println!("{}", handle.join().unwrap());
      }
      ```

      ```error
      error[E0373]: closure may outlive the current function, but it borrows `scores`, which is owned by the current function
      help: to force the closure to take ownership of `scores` (and any other referenced variables), use the `move` keyword
      ```

      Why does Rust refuse? A closure that only reads `scores` **borrows** it. But the compiler has no idea how long the new thread will run: you might never join it, and the function that owns `scores` could return and drop the vector while the thread is still reading it. That would be a dangling reference, exactly what the borrow checker exists to prevent. So `thread::spawn` demands a closure that borrows nothing from the function that spawned it. In Rust's terms the closure must be **`'static`**: everything it holds is owned, or lives for the whole program (like string literals).

      The fix is in the help line. Writing `move` before the closure **moves** every variable the closure uses into it, so the thread owns its data:

      ```rust run
      use std::thread;

      fn main() {
          let scores = vec![10, 20, 30];
          let handle = thread::spawn(move || scores.iter().sum::<i32>());
          println!("total: {}", handle.join().unwrap());
      }
      ```

      ```output
      total: 60
      ```

      The vector now lives inside the closure. When the thread finishes, the closure is dropped, and the vector with it.

      ### After a move, main can't use it

      `move` is a real move, just like passing a `String` to a function (module 9):

      ```rust compile_fail
      use std::thread;

      fn main() {
          let scores = vec![10, 20, 30];
          let handle = thread::spawn(move || scores.len());
          println!("{} scores: {:?}", handle.join().unwrap(), scores);
      }
      ```

      ```error
      error[E0382]: borrow of moved value: `scores`
      ```

      Three ways out, depending on what you need:

      1. **Clone before spawning** and move the clone: `let for_worker = scores.clone();` then `move || for_worker.len()`. Both threads have their own copy. Fine for small data.
      2. **Get it back**: the thread returns the data as (part of) its result, and `join` hands it back to you.
      3. **Borrow with scoped threads**, which step 4 shows. No copy at all.

      Option 2 looks like this:

      ```rust run
      use std::thread;

      fn main() {
          let orders = vec![120, 45, 300];
          let handle = thread::spawn(move || {
              let mut sorted = orders;
              sorted.sort();
              sorted
          });
          let sorted = handle.join().unwrap();
          println!("{sorted:?}");
      }
      ```

      ```output
      [45, 120, 300]
      ```

      ### Copy types are copied

      For `Copy` types (integers, `f64`, `bool`, `char`), `move` copies the value into the closure. The original stays usable, and changes made inside the thread don't affect it: the thread changed its own copy.

      ### Common mistakes

      - **Cloning inside the closure**: `thread::spawn(move || scores.clone().len())` still moves `scores` into the closure first. Clone *before* `spawn`, into a new variable.
      - **Expecting `move` to share**: after `move`, the data belongs to the thread. To share one piece of data between threads you need `Arc` (step 5) or scoped threads (step 4).
      - **Ignoring the help line**: rustc's `help:` lines often contain the exact fix. Read them.

      **Your turn:** this program doesn't compile (`E0373`). Make the closure take ownership of `stock`, so the thread can add it up. It should print `total stock: 57`.
    seed: |
      use std::thread;

      fn main() {
          let stock = vec![12, 30, 15];
          let handle = thread::spawn(|| {
              let mut total = 0;
              for n in &stock {
                  total += n;
              }
              total
          });
          println!("total stock: {}", handle.join().unwrap());
      }
    solution: |
      use std::thread;

      fn main() {
          let stock = vec![12, 30, 15];
          let handle = thread::spawn(move || {
              let mut total = 0;
              for n in &stock {
                  total += n;
              }
              total
          });
          println!("total stock: {}", handle.join().unwrap());
      }
    require:
      - pattern: 'move\s*\|\|'
        message: Fix it with the `move` keyword in front of the closure.
    hints:
      - The compiler's `help:` line names the keyword that makes the closure take ownership.
      - "Write `move` right before the `||`: `thread::spawn(move || { ... })`."
    tests:
      - expect: "total stock: 57"
    more:
      - task: |
          The main thread still needs `names` after spawning the worker (to print how many players there are), so moving it into the thread breaks the last line (`E0382`). Give the thread its own copy: clone the vector into a new variable **before** spawning, and move the copy. The program should print:

          ```
          longest name: Hermione
          players: 3
          ```
        seed: |
          use std::thread;

          fn main() {
              let names = vec![String::from("Ana"), String::from("Hermione"), String::from("Bo")];
              let handle = thread::spawn(move || {
                  let mut longest = String::new();
                  for name in names {
                      if name.len() > longest.len() {
                          longest = name;
                      }
                  }
                  longest
              });
              println!("longest name: {}", handle.join().unwrap());
              println!("players: {}", names.len());
          }
        solution: |
          use std::thread;

          fn main() {
              let names = vec![String::from("Ana"), String::from("Hermione"), String::from("Bo")];
              let for_thread = names.clone();
              let handle = thread::spawn(move || {
                  let mut longest = String::new();
                  for name in for_thread {
                      if name.len() > longest.len() {
                          longest = name;
                      }
                  }
                  longest
              });
              println!("longest name: {}", handle.join().unwrap());
              println!("players: {}", names.len());
          }
        require:
          - pattern: '\.clone\(\)'
            message: Clone the vector before spawning the thread.
        hints:
          - "Before `thread::spawn`, write `let for_thread = names.clone();`."
          - "Inside the closure, loop over `for_thread` instead of `names`. Then `names` is never moved."
        tests:
          - expect: "longest name: Hermione\nplayers: 3"
      - task: |
          A function can start a thread and hand the `JoinHandle` back to its caller, who decides when to wait. Write `fn spawn_word_count(text: String) -> thread::JoinHandle<usize>`: it starts a thread that counts the words in `text` (split on whitespace) and returns the handle **without joining it**.
        seed: |
          use std::thread;

          fn spawn_word_count(text: String) -> thread::JoinHandle<usize> {
              todo!()
          }
        solution: |
          use std::thread;

          fn spawn_word_count(text: String) -> thread::JoinHandle<usize> {
              thread::spawn(move || text.split_whitespace().count())
          }
        harness: |
          #[test]
          fn counts_the_words_of_a_sentence() {
              let handle = spawn_word_count(String::from("ferris likes rust"));
              assert_eq!(handle.join().unwrap(), 3, "spawn_word_count(\"ferris likes rust\")");
          }

          #[test]
          fn empty_text_has_zero_words() {
              assert_eq!(spawn_word_count(String::new()).join().unwrap(), 0, "spawn_word_count(\"\")");
          }

          #[test]
          fn extra_spaces_and_newlines_are_ignored() {
              let handle = spawn_word_count(String::from("  one\n two    three  "));
              assert_eq!(handle.join().unwrap(), 3, "spawn_word_count(\"  one\\n two    three  \")");
          }

          #[test]
          fn two_counters_can_run_at_the_same_time() {
              let a = spawn_word_count(String::from("a b"));
              let b = spawn_word_count(String::from("c d e"));
              assert_eq!(a.join().unwrap() + b.join().unwrap(), 5, "two counters joined after both started");
          }
        hints:
          - "The body is one `thread::spawn(...)` expression; its value is the `JoinHandle` you return."
          - "The closure must own `text`: `thread::spawn(move || text.split_whitespace().count())`."

  - title: Many threads, results in order
    id: threads-3
    text: |
      Real work gets split over several threads. The pattern every team uses:

      1. Spawn the threads in a loop and keep every `JoinHandle` in a `Vec`.
      2. When all of them are running, join them **in the order you spawned them**.

      Each thread finishes whenever it finishes, but because you collect results in spawn order, the output is the same on every run. This example makes it visible with **`thread::sleep`**, which pauses the current thread for a `Duration` (from `std::time`). The workers that sleep longer finish later:

      ```rust run
      use std::thread;
      use std::time::Duration;

      fn main() {
          let jobs = vec![("resize", 30), ("compress", 10), ("upload", 20)];
          let mut handles = Vec::new();
          for (name, ms) in jobs {
              handles.push(thread::spawn(move || {
                  thread::sleep(Duration::from_millis(ms));
                  format!("{name} done after {ms} ms")
              }));
          }
          for handle in handles {
              println!("{}", handle.join().unwrap());
          }
      }
      ```

      ```output
      resize done after 30 ms
      compress done after 10 ms
      upload done after 20 ms
      ```

      `compress` finished first, but `main` waited for `resize` first, so the results come out in spawn order. Joining a thread that already finished returns at once. The whole program takes about 30 ms, not 60, because the three sleeps overlap.

      `move` is needed here: each closure uses `name` and `ms`, which are local to one turn of the loop.

      ### Splitting data into chunks

      To process a big list, give each thread one piece. `chunks(n)` (module 27) cuts a slice into pieces of `n` items (the last one may be shorter). A spawned thread must own its data, so each borrowed chunk is copied into its own `Vec` with `to_vec()`:

      ```rust run
      use std::thread;

      fn main() {
          let readings: Vec<u32> = (1..=12).collect();
          let mut handles = Vec::new();
          for chunk in readings.chunks(4) {
              let part = chunk.to_vec();
              handles.push(thread::spawn(move || part.iter().sum::<u32>()));
          }
          let sums: Vec<u32> = handles.into_iter().map(|h| h.join().unwrap()).collect();
          println!("partial sums: {sums:?}");
          println!("total: {}", sums.iter().sum::<u32>());
      }
      ```

      ```output
      partial sums: [10, 26, 42]
      total: 78
      ```

      Copying every chunk costs time and memory. The next step removes the copy.

      ### How many threads?

      Threads aren't free: each one gets its own stack (2 MiB by default for spawned threads) and takes some microseconds to start. For CPU-heavy work, about one thread per core is right; `thread::available_parallelism()` tells you how many cores the machine offers. Spawning a thread per item for a million items would spend more time managing threads than working.

      ### Common mistakes

      - **Joining inside the spawn loop**: `handles.push(thread::spawn(f).join().unwrap())` waits for each thread before starting the next, so they run one at a time.
      - **Looping over `&handles`**: `join` takes the handle by value (it consumes it), so `for h in &handles { h.join(); }` fails with ``error[E0507]: cannot move out of `*h` which is behind a shared reference``. Loop over `handles` itself.
      - **Expecting the fastest worker's result first**: results come in the order you join, which is the point.

      **Your turn:** spawn 4 threads. Thread `i` (for `i` from 0 to 3) adds up the **squares** of the numbers from `i * 25 + 1` to `(i + 1) * 25`, inclusive. After all 4 are running, join them in order, print each result, then the total:

      ```
      worker 0: 5525
      worker 1: 37400
      worker 2: 100525
      worker 3: 194900
      total: 338350
      ```
    seed: |
      use std::thread;

      fn main() {
          let mut handles: Vec<thread::JoinHandle<u64>> = Vec::new();
          for i in 0..4u64 {
              // spawn a thread that sums the squares from i * 25 + 1 to (i + 1) * 25
          }
          // join the handles in order, print each result, then the total
      }
    solution: |
      use std::thread;

      fn main() {
          let mut handles: Vec<thread::JoinHandle<u64>> = Vec::new();
          for i in 0..4u64 {
              // spawn a thread that sums the squares from i * 25 + 1 to (i + 1) * 25
              handles.push(thread::spawn(move || {
                  let mut sum = 0;
                  for n in i * 25 + 1..=(i + 1) * 25 {
                      sum += n * n;
                  }
                  sum
              }));
          }
          // join the handles in order, print each result, then the total
          let mut total = 0;
          for (i, handle) in handles.into_iter().enumerate() {
              let part = handle.join().unwrap();
              println!("worker {i}: {part}");
              total += part;
          }
          println!("total: {total}");
      }
    require:
      - pattern: 'thread::spawn'
        message: Start the workers with `thread::spawn`.
    forbid:
      - pattern: '\)\s*\.join\('
        message: Spawn all four threads first and join them afterwards; joining right after spawning runs them one at a time.
    hints:
      - "Inside the loop: `handles.push(thread::spawn(move || { ... }));`. The closure needs `move` to take its own copy of `i`."
      - "In the closure, loop `for n in i * 25 + 1..=(i + 1) * 25` and add `n * n` to a sum, then return the sum."
      - "After the loop: `for (i, handle) in handles.into_iter().enumerate()`, then `handle.join().unwrap()` gives each part."
    tests:
      - expect: "worker 0: 5525\nworker 1: 37400\nworker 2: 100525\nworker 3: 194900\ntotal: 338350"
    more:
      - task: |
          Count the prime numbers below 1000 with 4 threads. Thread `i` (0 to 3) checks the numbers from `i * 250` up to, but not including, `(i + 1) * 250`, using the `is_prime` function you're given. Join in order and print:

          ```
          worker 0: 53 primes
          worker 1: 42 primes
          worker 2: 37 primes
          worker 3: 36 primes
          total: 168 primes
          ```
        seed: |
          use std::thread;

          fn is_prime(n: u32) -> bool {
              if n < 2 {
                  return false;
              }
              let mut d = 2;
              while d * d <= n {
                  if n % d == 0 {
                      return false;
                  }
                  d += 1;
              }
              true
          }

          fn main() {
              // spawn 4 workers, then join them in order
          }
        solution: |
          use std::thread;

          fn is_prime(n: u32) -> bool {
              if n < 2 {
                  return false;
              }
              let mut d = 2;
              while d * d <= n {
                  if n % d == 0 {
                      return false;
                  }
                  d += 1;
              }
              true
          }

          fn main() {
              // spawn 4 workers, then join them in order
              let mut handles = Vec::new();
              for i in 0..4u32 {
                  handles.push(thread::spawn(move || (i * 250..(i + 1) * 250).filter(|&n| is_prime(n)).count()));
              }
              let mut total = 0;
              for (i, handle) in handles.into_iter().enumerate() {
                  let count = handle.join().unwrap();
                  println!("worker {i}: {count} primes");
                  total += count;
              }
              println!("total: {total} primes");
          }
        require:
          - pattern: 'thread::spawn'
            message: Start the workers with `thread::spawn`.
        forbid:
          - pattern: '\)\s*\.join\('
            message: Spawn all four threads first and join them afterwards.
        hints:
          - "A thread can call a normal function: `thread::spawn(move || (i * 250..(i + 1) * 250).filter(|&n| is_prime(n)).count())`."
          - "Keep the handles in a `Vec`, then join them with `for (i, handle) in handles.into_iter().enumerate()`."
        tests:
          - expect: "worker 0: 53 primes\nworker 1: 42 primes\nworker 2: 37 primes\nworker 3: 36 primes\ntotal: 168 primes"
      - task: |
          Write `fn totals_in_threads(orders: Vec<Vec<u32>>) -> Vec<u32>`. Each inner `Vec` holds the line prices of one order. Spawn **one thread per order** to add up its prices, and return the totals in the same order as the input.
        seed: |
          use std::thread;

          fn totals_in_threads(orders: Vec<Vec<u32>>) -> Vec<u32> {
              todo!()
          }
        solution: |
          use std::thread;

          fn totals_in_threads(orders: Vec<Vec<u32>>) -> Vec<u32> {
              let mut handles = Vec::new();
              for order in orders {
                  handles.push(thread::spawn(move || order.iter().sum::<u32>()));
              }
              handles.into_iter().map(|h| h.join().unwrap()).collect()
          }
        harness: |
          #[test]
          fn sums_each_order_in_input_order() {
              let orders = vec![vec![10, 20], vec![5], vec![1, 2, 3, 4]];
              assert_eq!(totals_in_threads(orders), vec![30, 5, 10], "totals_in_threads([[10, 20], [5], [1, 2, 3, 4]])");
          }

          #[test]
          fn no_orders_gives_no_totals() {
              assert_eq!(totals_in_threads(vec![]), Vec::<u32>::new(), "totals_in_threads([])");
          }

          #[test]
          fn an_empty_order_totals_zero() {
              assert_eq!(totals_in_threads(vec![vec![], vec![7]]), vec![0, 7], "totals_in_threads([[], [7]])");
          }

          #[test]
          fn many_orders_keep_their_order() {
              let orders: Vec<Vec<u32>> = (1..=20).map(|n| vec![n; n as usize]).collect();
              let expected: Vec<u32> = (1..=20).map(|n| n * n).collect();
              assert_eq!(totals_in_threads(orders), expected, "20 orders where order n has n lines of price n");
          }
        require:
          - pattern: 'thread::spawn'
            message: Spawn one thread per order with `thread::spawn`.
        hints:
          - "`for order in orders` gives you each owned `Vec<u32>`, ready to move into a thread."
          - "Collect the handles first, then `handles.into_iter().map(|h| h.join().unwrap()).collect()`."

  - title: "Scoped threads: borrowing local data"
    id: threads-4
    text: |
      Copying chunks with `to_vec()` just to satisfy `'static` is wasteful. Borrowing would be safe if you could **promise** that every thread ends before the borrowed data is dropped. `thread::scope` turns that promise into something the compiler can check:

      ```rust run
      use std::thread;

      fn main() {
          let readings: Vec<u32> = (1..=12).collect();
          let total = thread::scope(|s| {
              let mut handles = Vec::new();
              for chunk in readings.chunks(4) {
                  handles.push(s.spawn(|| chunk.iter().sum::<u32>()));
              }
              handles.into_iter().map(|h| h.join().unwrap()).sum::<u32>()
          });
          println!("total: {total}");
          println!("main still owns all {} readings", readings.len());
      }
      ```

      ```output
      total: 78
      main still owns all 12 readings
      ```

      How it works:

      - `thread::scope(|s| { ... })` calls your closure with a **scope** `s`. Threads started with `s.spawn(...)` are **scoped threads**.
      - Before `thread::scope` returns, it joins every thread spawned in the scope that you didn't join yourself. So no scoped thread can outlive the scope, and the compiler lets them borrow anything that lives longer than the scope, like `readings`.
      - `s.spawn` returns a `ScopedJoinHandle`, which you `join` exactly like a normal handle.
      - Whatever the closure returns, `thread::scope` returns: here the total.

      No `to_vec()`, no `move`, no copies: each thread reads its chunk straight out of `readings`.

      ### Mutable borrows work too

      The borrowing rules still apply across threads: one `&mut` at a time per piece of data. `chunks_mut` cuts a slice into pieces that don't overlap, so each thread can get its own `&mut` piece:

      ```rust run
      use std::thread;

      fn main() {
          let mut prices = vec![100, 250, 80, 40, 60, 500];
          thread::scope(|s| {
              for chunk in prices.chunks_mut(2) {
                  s.spawn(|| {
                      for p in chunk {
                          *p = *p * 90 / 100;
                      }
                  });
              }
          });
          println!("{prices:?}");
      }
      ```

      ```output
      [90, 225, 72, 36, 54, 450]
      ```

      This time we don't keep the handles: the scope joins all the threads for us before `println!` runs.

      ### Lazy iterators and joining

      A tempting one-liner is `data.chunks(n).map(|c| s.spawn(...)).map(|h| h.join().unwrap()).sum()`. Iterators are lazy (module 27): each item goes through *both* `map`s before the next chunk is touched, so every thread is joined right after it starts, and they run one at a time. **Collect the handles into a `Vec` first**, then join.

      ### scope or spawn?

      - **`thread::scope`**: the threads do a piece of work inside one function and are done before it returns. Most "split this job over the cores" code looks like this.
      - **`thread::spawn` with `move`**: the thread must outlive the function that started it, like a background worker that runs for the whole program.

      ### Common mistakes

      - **`chunks(0)` panics.** A chunk size from `data.len() / workers` is 0 when there are fewer items than workers. `div_ceil` divides and rounds **up** (`10_usize.div_ceil(4)` is `3`), and `.max(1)` keeps the size at least 1.
      - **Loop variables still need `move`.** `for i in 0..4 { s.spawn(|| i * 2); }` borrows `i`, which dies at the end of each turn of the loop: `E0373`. Write `s.spawn(move || i * 2)`. If the closure also uses a `Vec`, `move` would move the whole `Vec` into the first thread; make a reference first (`let data = &data;`) and move that: copying a reference is free.
      - **Two threads writing the same variable**: `E0499`, explained in the next step.

      **Your turn:** write `fn parallel_sum(data: &[u64], workers: usize) -> u64`. Split `data` into chunks of `data.len().div_ceil(workers).max(1)` items, sum each chunk in its own **scoped** thread, and return the total. Borrow the data; don't copy it. You can assume `workers` is at least 1.
    seed: |
      use std::thread;

      fn parallel_sum(data: &[u64], workers: usize) -> u64 {
          todo!()
      }
    solution: |
      use std::thread;

      fn parallel_sum(data: &[u64], workers: usize) -> u64 {
          let size = data.len().div_ceil(workers).max(1);
          thread::scope(|s| {
              let handles: Vec<_> = data.chunks(size).map(|chunk| s.spawn(|| chunk.iter().sum::<u64>())).collect();
              handles.into_iter().map(|h| h.join().unwrap()).sum()
          })
      }
    require:
      - pattern: 'thread::scope'
        message: Use `thread::scope` so the threads can borrow `data`.
    forbid:
      - pattern: '\.to_vec\(\)|\.clone\(\)|to_owned'
        message: Scoped threads can borrow the chunks; no need to copy them.
    hints:
      - "Start with `let size = data.len().div_ceil(workers).max(1);`, then `thread::scope(|s| { ... })` as the function's last expression."
      - "Inside the scope, spawn one thread per chunk and collect the handles: `let handles: Vec<_> = data.chunks(size).map(|chunk| s.spawn(|| chunk.iter().sum::<u64>())).collect();`"
      - "Then join them all and add up: `handles.into_iter().map(|h| h.join().unwrap()).sum()`."
    harness: |
