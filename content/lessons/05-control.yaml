      - task: |
          Write `fn count_pairs(limit: u32, target: u32) -> u32` that counts the pairs of numbers `a` and `b` with `1 <= a < b <= limit` and `a + b == target`. For example, `count_pairs(5, 6)` is 2: the pairs (1, 5) and (2, 4). Use nested `for` loops.
