id: control
title: Control Flow
phase: "Foundations"
summary: Make decisions with if and else, and repeat work with loop, while and for. Includes if as an expression, ranges, break and continue, nested loops and loop labels.
roadmap: [Control Flow and Constructs]
steps:
  - title: if, else if and else
    id: control-1
    text: |
      Programs make decisions. `if` runs a block of code only when a condition is true, and `else` gives the alternative:

      ```rust run
      fn main() {
          let temperature = 31;
          if temperature > 30 {
              println!("Hot: stay in the shade");
          } else if temperature > 15 {
              println!("Pleasant");
          } else {
              println!("Bring a jacket");
          }
          println!("Forecast done");
      }
      ```

      ```output
      Hot: stay in the shade
      Forecast done
      ```

      - The **condition** (`temperature > 30`) comes right after `if`, without parentheses. The braces are required, even around a single line.
      - Rust checks the conditions **from top to bottom** and runs only the first block whose condition is true. Here 31 > 30, so "Hot" runs and the `else if` is never checked, even though 31 > 15 is also true.
      - `else if` adds another condition; you can have as many as you need.
      - `else` (optional) runs when none of the conditions were true.

      ### Comparison operators

      You met these in the Types module; now they drive decisions:

      | Operator | Meaning |
      |---|---|
      | `==` | equal |
      | `!=` | not equal |
      | `<` and `>` | less than, greater than |
      | `<=` and `>=` | less or equal, greater or equal |

      Combine conditions with `&&` (and), `||` (or) and `!` (not): `if age >= 18 && has_ticket { ... }`.

      ### Conditions must be bools

      ```rust compile_fail
      fn main() {
          let lives = 3;
          if lives {
              println!("still alive");
          }
      }
      ```

      ```error
      error[E0308]: mismatched types
       --> src/main.rs:3:8
        |
      3 |     if lives {
        |        ^^^^^ expected `bool`, found integer
      ```

      Unlike C, JavaScript or Python, Rust doesn't treat numbers as true or false. Write the comparison you mean: `if lives > 0`.

      ### Order matters

      Because the first true condition wins, put the most specific check first. This version is wrong: a score of 95 prints "pass", because `score >= 50` is checked first and the second branch is never reached:

      ```rust
      if score >= 50 {
          println!("pass");
      } else if score >= 90 {
          println!("excellent");
      }
      ```

      Swap the two conditions and it works.

      ### Common mistakes

      - **`=` instead of `==`**: `if score = 100` is an assignment, not a comparison, so it's `error[E0308]: mismatched types` (expected `bool`, found `()`).
      - **Parentheses out of habit**: `if (x > 5)` works, but rustc warns `` unnecessary parentheses around `if` condition ``. Leave them out.
      - **Comparing different types**: `if count > 2.5` with an integer `count` doesn't compile; Rust never converts number types for you.

      **Your turn:** fill in the keywords so the program prints the right message for an `hp` of 12: above 50 is `Healthy`, above 10 is `Low health!`, anything else is `Critical!`. The program should print `Low health!`.
    fill: |
      fn main() {
          let hp = 12;
          [[if]] hp > 50 {
              println!("Healthy");
          } [[else if]] hp > 10 {
              println!("Low health!");
          } [[else]] {
              println!("Critical!");
          }
      }
    hints:
      - The chain is `if`, then `else if`, then `else`.
    tests:
      - expect: "Low health!"
    more:
      - task: |
          Write the body of `describe_temperature` so it prints `<celsius> is hot` above 30, `is warm` above 20, `is cool` above 0, and `is freezing` otherwise. `main` already calls it four times; the program should print:

          ```
          35 is hot
          25 is warm
          15 is cool
          0 is freezing
          ```
        seed: |
          fn main() {
              describe_temperature(35);
              describe_temperature(25);
              describe_temperature(15);
              describe_temperature(0);
          }

          fn describe_temperature(celsius: i32) {
              // if / else if / else here
          }
        solution: |
          fn main() {
              describe_temperature(35);
              describe_temperature(25);
              describe_temperature(15);
              describe_temperature(0);
          }

          fn describe_temperature(celsius: i32) {
              // if / else if / else here
              if celsius > 30 {
                  println!("{celsius} is hot");
              } else if celsius > 20 {
                  println!("{celsius} is warm");
              } else if celsius > 0 {
                  println!("{celsius} is cool");
              } else {
                  println!("{celsius} is freezing");
              }
          }
        require:
          - pattern: '\belse\s+if\b'
            message: Use an `if` / `else if` / `else` chain.
        hints:
          - "Start with the hottest case: `if celsius > 30 { ... }`."
          - "Then `else if celsius > 20`, `else if celsius > 0`, and a final `else`."
        tests:
          - expect: "35 is hot\n25 is warm\n15 is cool\n0 is freezing"
      - task: |
          FizzBuzz, one number at a time. Write `fizzbuzz(n)` so it prints `FizzBuzz` if `n` is divisible by both 3 and 5, `Fizz` if it's divisible by 3, `Buzz` if it's divisible by 5, and the number itself otherwise. Watch the order of your checks. Expected output for the calls in `main`:

          ```
          Fizz
          Buzz
          FizzBuzz
          7
          ```
        seed: |
          fn main() {
              fizzbuzz(3);
              fizzbuzz(5);
              fizzbuzz(15);
              fizzbuzz(7);
          }

          fn fizzbuzz(n: u32) {
              todo!()
          }
        solution: |
          fn main() {
              fizzbuzz(3);
              fizzbuzz(5);
              fizzbuzz(15);
              fizzbuzz(7);
          }

          fn fizzbuzz(n: u32) {
              if n % 15 == 0 {
                  println!("FizzBuzz");
              } else if n % 3 == 0 {
                  println!("Fizz");
              } else if n % 5 == 0 {
                  println!("Buzz");
              } else {
                  println!("{n}");
              }
          }
        hints:
          - "\"Divisible by 3\" is `n % 3 == 0`."
          - "Check the FizzBuzz case first (`n % 15 == 0`, or `n % 3 == 0 && n % 5 == 0`); otherwise 15 would stop at Fizz."
        tests:
          - expect: "Fizz\nBuzz\nFizzBuzz\n7"

  - title: if is an expression
    id: control-2
    text: |
      In Rust, `if` is an expression: it produces a value, the value of whichever block runs. So it can sit on the right side of `let`:

      ```rust run
      fn main() {
          let hp = 0;
          let status = if hp > 0 { "alive" } else { "defeated" };
          println!("status: {status}");

          let coins = 7;
          let bonus = if coins >= 10 { 50 } else if coins >= 5 { 20 } else { 0 };
          println!("bonus: {bonus}");
      }
      ```

      ```output
      status: defeated
      bonus: 20
      ```

      This is Rust's version of the **ternary operator** (`cond ? a : b`) from C, Java and JavaScript. Rust doesn't have one, because `if` already does the job.

      There are no semicolons inside the blocks (`{ "alive" }`): each block's final expression is its value, exactly like a function body. The `;` goes at the end of the whole `let` statement.

      ### As a function's result

      A function returns its final expression, so a final `if`/`else` *is* the function's result. No `return` needed:

      ```rust run
      fn shipping_fee(order_total: u32) -> u32 {
          if order_total >= 5000 {
              0
          } else {
              499
          }
      }

      fn main() {
          println!("{}", shipping_fee(7500));
          println!("{}", shipping_fee(1200));
      }
      ```

      ```output
      0
      499
      ```

      Compare this with the guard clauses from the Functions module. Both are idiomatic: use an `if`/`else` expression when there are a few equal alternatives, and early `return` for special cases that should get out of the way of the main logic.

      ### All branches must have the same type

      The result goes into one variable with one type, so every branch must produce that type:

      ```rust compile_fail
      fn main() {
          let lives = 3;
          let label = if lives > 0 { lives } else { "game over" };
          println!("{label}");
      }
      ```

      ```error
      error[E0308]: `if` and `else` have incompatible types
       --> src/main.rs:3:47
        |
      3 |     let label = if lives > 0 { lives } else { "game over" };
        |                                -----          ^^^^^^^^^^^ expected integer, found `&str`
        |                                |
        |                                expected because of this
      ```

      And when `if` is used as a value, the `else` is required. Without it, what would the value be when the condition is false?

      ```rust compile_fail
      fn main() {
          let score = 40;
          let medal = if score > 90 { "gold" };
          println!("{medal}");
      }
      ```

      ```error
      error[E0317]: `if` may be missing an `else` clause
       --> src/main.rs:3:17
        |
      3 |     let medal = if score > 90 { "gold" };
        |                 ^^^^^^^^^^^^^^^^------^^
        |                 |               |
        |                 |               found here
        |                 expected `&str`, found `()`
        |
        = note: `if` expressions without `else` evaluate to `()`
      ```

      ### Common mistakes

      - **Semicolons inside the blocks**: `if hp > 0 { "alive"; } else { "defeated"; }` makes both blocks produce `()`, and you get a confusing error wherever the value is used.
      - **A missing `;` after the whole `let x = if ... { ... } else { ... };`**.
      - **Very long `if`/`else if` chains that compare one value against many options**: the Enums module introduces a cleaner tool for that, the match expression.

      **Your turn:** write `fn clamp_volume(volume: i32) -> i32` that returns `0` for anything below 0, `100` for anything above 100, and the volume itself otherwise. Make one `if` / `else if` / `else` expression the function's result (no `return`).

      (In real code you'd write `volume.clamp(0, 100)`, and clippy suggests exactly that (`manual_clamp`). Here you write it by hand to practice `if` expressions.)
    seed: |
      fn clamp_volume(volume: i32) -> i32 {
          todo!()
      }
    solution: |
      fn clamp_volume(volume: i32) -> i32 {
          if volume < 0 {
              0
          } else if volume > 100 {
              100
          } else {
              volume
          }
      }
    harness: |
      #[test]
      fn negative_becomes_zero() {
          assert_eq!(clamp_volume(-5), 0, "clamp_volume(-5)");
      }

      #[test]
      fn too_loud_becomes_100() {
          assert_eq!(clamp_volume(150), 100, "clamp_volume(150)");
      }

      #[test]
      fn values_in_range_are_kept() {
          assert_eq!(clamp_volume(42), 42, "clamp_volume(42)");
      }

      #[test]
      fn the_limits_themselves_are_kept() {
          assert_eq!(clamp_volume(0), 0, "clamp_volume(0)");
          assert_eq!(clamp_volume(100), 100, "clamp_volume(100)");
      }
    forbid:
      - pattern: '\breturn\b'
        message: Make the `if` expression the function's final expression instead of using `return`.
      - pattern: '\.(clamp|min|max)\('
        message: Write the comparisons yourself instead of using `.clamp()`, `.min()` or `.max()`.
    hints:
      - "Three branches: `if volume < 0 { 0 } else if volume > 100 { 100 } else { volume }`."
      - No semicolons inside the branches, and none after the final `}`.
    more:
      - task: |
          Fill in the blanks so an `if` expression chooses the label, and the program prints `even`.
        fill: |
          fn main() {
              let n = 42;
              let kind = [[if]] n % 2 == 0 { "even" } [[else]] { "odd" };
              println!("{kind}");
          }
        hints:
          - "`let x = if condition { a } else { b };`"
        tests:
          - expect: "even"
      - task: |
          Write `fn grade(score: u32) -> char` that turns a test score (0 to 100) into a letter: 90 and above is `'A'`, 80 and above `'B'`, 70 and above `'C'`, 60 and above `'D'`, and below 60 `'F'`. Use a single `if` / `else if` / `else` expression, without `return`.
        seed: |
          fn grade(score: u32) -> char {
              todo!()
          }
        solution: |
          fn grade(score: u32) -> char {
              if score >= 90 {
                  'A'
              } else if score >= 80 {
                  'B'
              } else if score >= 70 {
                  'C'
              } else if score >= 60 {
                  'D'
              } else {
                  'F'
              }
          }
        harness: |
          #[test]
          fn ninety_and_above_is_a() {
              assert_eq!(grade(95), 'A', "grade(95)");
              assert_eq!(grade(90), 'A', "grade(90)");
              assert_eq!(grade(100), 'A', "grade(100)");
          }

          #[test]
          fn just_below_ninety_is_b() {
              assert_eq!(grade(89), 'B', "grade(89)");
          }

          #[test]
          fn middle_grades() {
              assert_eq!(grade(75), 'C', "grade(75)");
              assert_eq!(grade(60), 'D', "grade(60)");
          }

          #[test]
          fn below_sixty_fails() {
              assert_eq!(grade(59), 'F', "grade(59)");
              assert_eq!(grade(0), 'F', "grade(0)");
          }
        forbid:
          - pattern: '\breturn\b'
            message: Use the `if` chain as the final expression instead of `return`.
        hints:
          - "Check from the top grade down: `if score >= 90 { 'A' } else if score >= 80 { 'B' } ...`"
          - "Letters are `char`s, so use single quotes, and end with `else { 'F' }`."

  - title: loop and break
    id: control-3
    text: |
      Programs often repeat work. The simplest way is `loop`, which repeats its block forever, until you stop it with `break`:

      ```rust run
      fn main() {
          let mut countdown = 3;
          loop {
              println!("{countdown}");
              countdown -= 1;
              if countdown == 0 {
                  break;
              }
          }
          println!("Go!");
      }
      ```

      ```output
      3
      2
      1
      Go!
      ```

      Each run through the block is an **iteration**. `break` exits the loop immediately, and the program continues after the loop's closing brace.

      ### Getting a value out of a loop

      `loop` is an expression too: `break value` ends the loop *and* makes `value` the result of the whole loop. That's perfect for "keep trying until something happens, then tell me the answer":

      ```rust run
      fn main() {
          let mut n = 1;
          let first_big_square = loop {
              if n * n > 500 {
                  break n * n;
              }
              n += 1;
          };
          println!("first square above 500: {first_big_square} ({n} x {n})");
      }
      ```

      ```output
      first square above 500: 529 (23 x 23)
      ```

      When a `loop` is the final expression of a function, `break value` gives the function its return value. Inside a function, `return` also leaves a loop (and the whole function) immediately.

      ### Infinite loops

      If no `break` is ever reached, the loop runs forever and the program hangs. On this site, a run is stopped after 2 seconds ("time limit exceeded"); on your computer, press Ctrl+C. Some programs loop forever on purpose: a game's main loop or a server waiting for requests runs until it's told to quit.

      ### Common mistakes

      - **Never changing what the exit condition depends on**: if `countdown -= 1` is missing, `countdown == 0` never becomes true and the loop never ends.
      - **`break value` in other loops**: only `loop` can return a value. The `while` and `for` loops coming next might run zero times, so they'd have no value to give (`` error[E0571]: `break` with value from a `while` loop ``).
      - **Forgetting the `;` after `let x = loop { ... };`**.

      **Your turn:** write `fn smallest_power_of_two(n: u32) -> u32` that returns the smallest power of two (1, 2, 4, 8, 16, ...) that is greater than or equal to `n`. Start at 1 and keep doubling inside a `loop`; `break` with the answer.
    seed: |
      fn smallest_power_of_two(n: u32) -> u32 {
          todo!()
      }
    solution: |
      fn smallest_power_of_two(n: u32) -> u32 {
          let mut power = 1;
          loop {
              if power >= n {
                  break power;
              }
              power *= 2;
          }
      }
    harness: |
      #[test]
      fn rounds_up_to_the_next_power() {
          assert_eq!(smallest_power_of_two(5), 8, "smallest_power_of_two(5)");
          assert_eq!(smallest_power_of_two(1000), 1024, "smallest_power_of_two(1000)");
      }

      #[test]
      fn a_power_of_two_is_its_own_answer() {
          assert_eq!(smallest_power_of_two(8), 8, "smallest_power_of_two(8)");
          assert_eq!(smallest_power_of_two(1), 1, "smallest_power_of_two(1)");
      }

      #[test]
      fn zero_gives_one() {
          assert_eq!(smallest_power_of_two(0), 1, "smallest_power_of_two(0)");
      }
    require:
      - pattern: '\bloop\b'
        message: Use a `loop`.
      - pattern: '\bbreak\s+\w'
        message: "Leave the loop with the answer: `break power;`"
    forbid:
      - pattern: 'next_power_of_two'
        message: Write the loop yourself instead of using the built-in method.
    hints:
      - "Keep a `let mut power = 1;` and double it with `power *= 2;` each iteration."
      - "Inside the loop: `if power >= n { break power; }`. Make the `loop` the last expression of the function."
    more:
      - task: |
          Fill in the blanks so the countdown loops until it reaches zero and then stops. It should print `3`, `2`, `1` and `liftoff` on separate lines.
        fill: |
          fn main() {
              let mut n = 3;
              [[loop]] {
                  println!("{n}");
                  n -= 1;
                  if n == 0 {
                      [[break]];
                  }
              }
              println!("liftoff");
          }
        hints:
          - The keyword for an endless loop is `loop`, and the keyword that leaves it is `break`.
        tests:
          - expect: "3\n2\n1\nliftoff"
      - task: |
          Write `fn years_to_double(start: u32, rate_percent: u32) -> u32`. A savings balance begins at `start`, and each year it grows by `balance * rate_percent / 100` (integer division). Return how many years it takes until the balance is at least twice `start`. Use `loop` and `break` with the number of years. (You can assume `start` is at least 100 and the rate at least 1.)
        seed: |
          fn years_to_double(start: u32, rate_percent: u32) -> u32 {
              todo!()
          }
        solution: |
          fn years_to_double(start: u32, rate_percent: u32) -> u32 {
              let mut balance = start;
              let mut years = 0;
              loop {
                  if balance >= start * 2 {
                      break years;
                  }
                  balance += balance * rate_percent / 100;
                  years += 1;
              }
          }
        harness: |
          #[test]
          fn seven_percent_takes_eleven_years() {
              assert_eq!(years_to_double(1000, 7), 11, "years_to_double(1000, 7)");
          }

          #[test]
          fn one_hundred_percent_takes_one_year() {
              assert_eq!(years_to_double(1000, 100), 1, "years_to_double(1000, 100)");
          }

          #[test]
          fn fifty_percent_takes_two_years() {
              assert_eq!(years_to_double(1000, 50), 2, "years_to_double(1000, 50)");
          }

          #[test]
          fn ten_percent_on_a_smaller_balance() {
              assert_eq!(years_to_double(500, 10), 8, "years_to_double(500, 10)");
          }
        require:
          - pattern: '\bloop\b'
            message: Use a `loop`.
        hints:
          - "You need two mutable variables: the `balance` and the number of `years`."
          - "In the loop: if `balance >= start * 2`, `break years;`. Otherwise add `balance * rate_percent / 100` to the balance and add 1 to `years`."

  - title: while loops
    id: control-4
    text: |
      A `while` loop checks its condition **before** each iteration and stops as soon as the condition is false. It's the tidy way to write "keep going while this is true", instead of `loop` with an `if` and `break` inside:

      ```rust run
      fn main() {
          let mut n = 1234;
          let mut digits = 0;
          while n > 0 {
              n /= 10;
              digits += 1;
          }
          println!("{digits} digits");
      }
      ```

      ```output
      4 digits
      ```

      Trace it: `n` goes 1234, 123, 12, 1, 0 while `digits` counts 1, 2, 3, 4. Then `n > 0` is false and the loop ends. If the condition is false from the start, the body never runs at all: for `n = 0` this program would print `0 digits` (keep that in mind for the exercise).

      ### Mutable parameters

      Loops often change their inputs. A parameter is a variable like any other, so it's immutable unless you mark it `mut`:

      ```rust run
      fn digit_sum(mut n: u32) -> u32 {
          let mut sum = 0;
          while n > 0 {
              sum += n % 10;
              n /= 10;
          }
          sum
      }

      fn main() {
          let number = 1234;
          println!("{}", digit_sum(number));
          println!("{number}");
      }
      ```

      ```output
      10
      1234
      ```

      `mut n: u32` only affects the function's own copy: `number` in `main` is unchanged. Shadowing does the same job: keep the parameter immutable and write `let mut n = n;` as the first line of the body.

      ### while or loop?

      - `while condition { ... }` when you can say up front what keeps the loop going.
      - `loop { ... }` with `break` when the exit is decided in the middle of the body, or when you need `break value`.

      ### Common mistakes

      - **Off-by-one**: `while i < 10` and `while i <= 10` differ by one iteration. Check the last iteration by hand.
      - **Forgetting the update**: `while n > 0 { sum += n % 10; }` never changes `n`, so it never ends.
      - **A non-bool condition**: `while n { ... }` is `error[E0308]: mismatched types`, just like `if`.

      **Your turn:** write `fn count_digits(n: u32) -> u32` that returns how many digits `n` has, using a `while` loop. Careful: `0` has one digit.
    seed: |
      fn count_digits(n: u32) -> u32 {
          todo!()
      }
    solution: |
      fn count_digits(mut n: u32) -> u32 {
          if n == 0 {
              return 1;
          }
          let mut digits = 0;
          while n > 0 {
              n /= 10;
              digits += 1;
          }
          digits
      }
    harness: |
      #[test]
      fn counts_four_digits() {
          assert_eq!(count_digits(1234), 4, "count_digits(1234)");
      }

      #[test]
      fn single_digit() {
          assert_eq!(count_digits(7), 1, "count_digits(7)");
      }

      #[test]
      fn round_numbers() {
          assert_eq!(count_digits(10), 2, "count_digits(10)");
          assert_eq!(count_digits(1000), 4, "count_digits(1000)");
      }

      #[test]
      fn zero_has_one_digit() {
          assert_eq!(count_digits(0), 1, "count_digits(0)");
      }

      #[test]
      fn the_largest_u32() {
          assert_eq!(count_digits(u32::MAX), 10, "count_digits(u32::MAX)");
      }
    require:
      - pattern: '\bwhile\b'
        message: Use a `while` loop.
    hints:
      - "Make the parameter mutable (`mut n: u32`) and divide it by 10 until it reaches 0, counting the steps."
      - "Handle 0 first with a guard clause: `if n == 0 { return 1; }`."
    more:
      - task: |
          Write `fn reverse_digits(n: u32) -> u32` that returns the number with its digits in reverse order: `1234` becomes `4321`, and `120` becomes `21` (leading zeros disappear). Use a `while` loop: take the last digit with `% 10`, and append it to the result with `result * 10 + digit`.
        seed: |
          fn reverse_digits(n: u32) -> u32 {
              todo!()
          }
        solution: |
          fn reverse_digits(mut n: u32) -> u32 {
              let mut result = 0;
              while n > 0 {
                  result = result * 10 + n % 10;
                  n /= 10;
              }
              result
          }
        harness: |
          #[test]
          fn reverses_four_digits() {
              assert_eq!(reverse_digits(1234), 4321, "reverse_digits(1234)");
          }

          #[test]
          fn trailing_zeros_disappear() {
              assert_eq!(reverse_digits(120), 21, "reverse_digits(120)");
          }

          #[test]
          fn single_digits_and_zero() {
              assert_eq!(reverse_digits(7), 7, "reverse_digits(7)");
              assert_eq!(reverse_digits(0), 0, "reverse_digits(0)");
          }

          #[test]
          fn palindromes_stay_the_same() {
              assert_eq!(reverse_digits(12321), 12321, "reverse_digits(12321)");
          }
        require:
          - pattern: '\bwhile\b'
            message: Use a `while` loop.
        hints:
