      - task: |
          The **Collatz** rule: if `n` is even, halve it; if it's odd, triple it and add 1. Starting from any positive number, you always seem to end up at 1 (nobody has proved it). Write `fn collatz_steps(n: u64) -> u32` that returns how many steps it takes to reach 1 (for `1` itself, that's 0). Use a `while` loop.
        seed: |
          // Write fn collatz_steps here
        solution: |
          // Write fn collatz_steps here
          fn collatz_steps(mut n: u64) -> u32 {
              let mut steps = 0;
              while n != 1 {
                  if n % 2 == 0 {
                      n /= 2;
                  } else {
                      n = 3 * n + 1;
                  }
                  steps += 1;
              }
              steps
          }
        harness: |
          #[test]
          fn one_needs_no_steps() {
              assert_eq!(collatz_steps(1), 0, "collatz_steps(1)");
          }

          #[test]
          fn two_needs_one_step() {
              assert_eq!(collatz_steps(2), 1, "collatz_steps(2)");
          }

          #[test]
          fn small_numbers() {
              assert_eq!(collatz_steps(6), 8, "collatz_steps(6)");
              assert_eq!(collatz_steps(7), 16, "collatz_steps(7)");
          }

          #[test]
          fn twenty_seven_takes_a_long_trip() {
              assert_eq!(collatz_steps(27), 111, "collatz_steps(27)");
          }
        require:
