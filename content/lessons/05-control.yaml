          Find the pair of whole numbers `a` and `b` (with `1 <= a <= b <= 20`) whose sum is 23 and whose product is 120. Search with nested loops (`a` from 1 to 20, `b` from `a` to 20), and count every pair you check in a variable `checked`. When you find the pair, print it and stop **both** loops with a labeled `break`. After the loops, print the count:

          ```
