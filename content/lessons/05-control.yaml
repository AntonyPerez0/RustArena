  - title: break and continue
    id: control-6
    text: |
      Inside any loop (`loop`, `while` or `for`):

      - `break` ends the loop right away.
      - `continue` skips the rest of the current iteration and moves on to the next one.

      ```rust run
      fn main() {
          for n in 1..=10 {
              if n % 3 == 0 {
                  continue;
              }
              if n > 7 {
                  break;
              }
              print!("{n} ");
          }
          println!();
      }
      ```

      ```output
      1 2 4 5 7
      ```

      Trace it: 3 and 6 are skipped by `continue`. At 8, `break` ends the loop, so 8, 9 and 10 never print.

      `continue` is handy for skipping values you don't care about without wrapping the rest of the body in an `if`. Many teams prefer this "skip early" shape for the same reason they like guard clauses.

      ### Stopping a search

      `break` is the natural way to stop a search as soon as you've found the answer, instead of checking every remaining value:

      ```rust run
      fn main() {
          let target = 91;
          let mut smallest_divisor = target;
          for d in 2..target {
              if target % d == 0 {
                  smallest_divisor = d;
                  break;
              }
          }
          println!("smallest divisor of {target}: {smallest_divisor}");
      }
      ```

      ```output
      smallest divisor of 91: 7
      ```

      Inside a function, `return` also ends the loop (and the function) immediately. A search often reads best as its own function: return the answer as soon as you find it, and put the "not found" result after the loop.

      ### Common mistakes

      - **`continue` before the update in a `while` loop**:

      ```rust
      let mut i = 0;
      while i < 10 {
          if i % 2 == 0 {
              continue; // i never changes again: an infinite loop
          }
          i += 1;
      }
      ```

      In a `for` loop this can't happen, because the range moves on by itself.

      - **Expecting `break` to leave every loop**: it only leaves the innermost one. The next step shows how to break out of an outer loop.

      **Your turn:** write `fn is_prime(n: u32) -> bool`. A prime number has exactly two divisors, 1 and itself, so 0 and 1 are not prime. Check the possible divisors from 2 upward, and stop as soon as you find one.
    seed: |
      fn is_prime(n: u32) -> bool {
          todo!()
      }
    solution: |
      fn is_prime(n: u32) -> bool {
          if n < 2 {
              return false;
          }
          for d in 2..n {
              if d * d > n {
                  break;
              }
              if n % d == 0 {
                  return false;
              }
          }
          true
      }
    harness: |
      #[test]
      fn zero_and_one_are_not_prime() {
          assert_eq!(is_prime(0), false, "is_prime(0)");
          assert_eq!(is_prime(1), false, "is_prime(1)");
      }

      #[test]
      fn two_and_three_are_prime() {
          assert_eq!(is_prime(2), true, "is_prime(2)");
          assert_eq!(is_prime(3), true, "is_prime(3)");
      }

      #[test]
      fn even_numbers_above_two_are_not_prime() {
          assert_eq!(is_prime(4), false, "is_prime(4)");
          assert_eq!(is_prime(1_000_000), false, "is_prime(1_000_000)");
      }

      #[test]
      fn products_of_two_primes_are_not_prime() {
          assert_eq!(is_prime(91), false, "is_prime(91)");
          assert_eq!(is_prime(49), false, "is_prime(49)");
      }

      #[test]
      fn larger_primes() {
          assert_eq!(is_prime(97), true, "is_prime(97)");
          assert_eq!(is_prime(7919), true, "is_prime(7919)");
      }
    hints:
