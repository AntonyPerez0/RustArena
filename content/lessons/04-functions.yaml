              assert_eq!(max_of_two(9, 3), 9, "max_of_two(9, 3)");
          }

          #[test]
          fn max_of_two_with_equal_numbers() {
              assert_eq!(max_of_two(4, 4), 4, "max_of_two(4, 4)");
          }

          #[test]
          fn max_of_three_finds_the_largest_anywhere() {
              assert_eq!(max_of_three(7, 2, 5), 7, "max_of_three(7, 2, 5)");
              assert_eq!(max_of_three(2, 7, 5), 7, "max_of_three(2, 7, 5)");
              assert_eq!(max_of_three(2, 5, 7), 7, "max_of_three(2, 5, 7)");
          }

          #[test]
          fn max_of_three_with_negatives() {
              assert_eq!(max_of_three(-8, -3, -5), -3, "max_of_three(-8, -3, -5)");
          }
        require:
          - pattern: 'fn\s+max_of_three[^{]*\{[^}]*max_of_two\([^}]*max_of_two\('
            message: "`max_of_three` should call `max_of_two` twice."
        forbid:
