      - task: |
          Write `fn max_of_two(a: i32, b: i32) -> i32` that returns the larger number (use an early `return`), and then `fn max_of_three(a: i32, b: i32, c: i32) -> i32` that finds the largest of three by calling `max_of_two` twice.
        seed: |
          // Write max_of_two and max_of_three here
        solution: |
          // Write max_of_two and max_of_three here
          fn max_of_two(a: i32, b: i32) -> i32 {
              if a > b {
                  return a;
              }
              b
          }

          fn max_of_three(a: i32, b: i32, c: i32) -> i32 {
              max_of_two(max_of_two(a, b), c)
          }
        harness: |
