      use std::collections::BTreeMap;
      use std::rc::Rc;

      type Board = Rc<RefCell<BTreeMap<String, u32>>>;

      struct Player {
          name: String,
          board: Board,
      }

      impl Player {
          fn join(name: &str, board: &Board) -> Player {
              todo!()
          }

          fn score(&self, points: u32) {
              todo!()
          }
      }

      fn points_of(board: &Board, name: &str) -> u32 {
          todo!()
      }
    solution: |
      use std::cell::RefCell;
      use std::collections::BTreeMap;
      use std::rc::Rc;

      type Board = Rc<RefCell<BTreeMap<String, u32>>>;

      struct Player {
          name: String,
          board: Board,
      }

      impl Player {
          fn join(name: &str, board: &Board) -> Player {
              board.borrow_mut().insert(name.to_string(), 0);
              Player { name: name.to_string(), board: Rc::clone(board) }
          }

          fn score(&self, points: u32) {
              *self.board.borrow_mut().entry(self.name.clone()).or_insert(0) += points;
          }
      }

      fn points_of(board: &Board, name: &str) -> u32 {
          board.borrow().get(name).copied().unwrap_or(0)
      }
    harness: |
      fn new_board() -> Board {
          Rc::new(RefCell::new(BTreeMap::new()))
      }

      #[test]
      fn joining_adds_the_player_with_zero_points() {
          let board = new_board();
          let _ana = Player::join("ana", &board);
          assert_eq!(board.borrow().get("ana"), Some(&0), "ana's entry after join");
      }

      #[test]
      fn scores_add_up() {
          let board = new_board();
          let ana = Player::join("ana", &board);
          ana.score(10);
          ana.score(5);
          assert_eq!(points_of(&board, "ana"), 15, "points_of(ana)");
      }

      #[test]
      fn players_share_one_board() {
          let board = new_board();
          let ana = Player::join("ana", &board);
          let bo = Player::join("bo", &board);
          ana.score(3);
          bo.score(7);
          assert_eq!(points_of(&board, "ana"), 3, "points_of(ana)");
          assert_eq!(points_of(&board, "bo"), 7, "points_of(bo)");
          assert_eq!(Rc::strong_count(&board), 3, "the board plus one Rc per player");
      }

      #[test]
      fn unknown_players_have_zero_points() {
          let board = new_board();
          assert_eq!(points_of(&board, "ghost"), 0, "points_of(ghost)");
      }
    hints:
      - "`join`: `board.borrow_mut().insert(name.to_string(), 0);` then return `Player { name: name.to_string(), board: Rc::clone(board) }`."
      - "`score`: `*self.board.borrow_mut().entry(self.name.clone()).or_insert(0) += points;`"
      - "`points_of`: `board.borrow().get(name).copied().unwrap_or(0)`."
