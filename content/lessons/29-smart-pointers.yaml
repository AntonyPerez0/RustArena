        solution: |
          use std::cell::RefCell;
          use std::rc::Rc;

          struct User {
              name: String,
              following: Vec<UserRef>,
              followers: u32,
          }

          type UserRef = Rc<RefCell<User>>;

          fn user(name: &str) -> UserRef {
              Rc::new(RefCell::new(User { name: name.to_string(), following: Vec::new(), followers: 0 }))
          }

          fn follow(who: &UserRef, target: &UserRef) {
              if Rc::ptr_eq(who, target) {
                  return;
              }
              if who.borrow().following.iter().any(|u| Rc::ptr_eq(u, target)) {
                  return;
              }
              who.borrow_mut().following.push(Rc::clone(target));
              target.borrow_mut().followers += 1;
          }

          fn most_followed(users: &[UserRef]) -> Option<String> {
              let mut best: Option<&UserRef> = None;
              for u in users {
                  match best {
                      Some(b) if b.borrow().followers >= u.borrow().followers => {}
                      _ => best = Some(u),
                  }
              }
              best.map(|u| u.borrow().name.clone())
          }
        harness: |
          #[test]
          fn follow_updates_both_sides() {
              let a = user("ana");
              let b = user("bo");
              follow(&a, &b);
              assert_eq!(a.borrow().following.len(), 1, "ana follows one user");
              assert_eq!(a.borrow().following[0].borrow().name, "bo", "ana follows bo");
              assert_eq!(b.borrow().followers, 1, "bo's followers");
          }

          #[test]
          fn following_twice_counts_once() {
              let a = user("ana");
              let b = user("bo");
              follow(&a, &b);
              follow(&a, &b);
              assert_eq!(b.borrow().followers, 1, "bo's followers");
              assert_eq!(a.borrow().following.len(), 1, "ana's following list");
          }

          #[test]
          fn following_yourself_does_nothing() {
              let a = user("ana");
              follow(&a, &a);
              assert_eq!(a.borrow().followers, 0, "followers");
              assert_eq!(a.borrow().following.len(), 0, "following");
          }

          #[test]
          fn finds_the_most_followed() {
              let a = user("ana");
              let b = user("bo");
              let c = user("cy");
              follow(&a, &c);
              follow(&b, &c);
              follow(&c, &b);
              assert_eq!(most_followed(&[Rc::clone(&a), Rc::clone(&b), Rc::clone(&c)]), Some("cy".to_string()), "most_followed");
          }

          #[test]
          fn ties_go_to_the_first_user_and_empty_is_none() {
              let a = user("ana");
              let b = user("bo");
              assert_eq!(most_followed(&[Rc::clone(&a), Rc::clone(&b)]), Some("ana".to_string()), "tie at zero");
              assert_eq!(most_followed(&[]), None, "no users");
          }
