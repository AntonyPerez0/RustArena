          retries: u32,
      }

      fn main() {
          let config = Rc::new(Config { retries: 5 });
          let a = [[Rc::clone(&config)‖config.clone()‖Rc::clone(& config)]];
          let b = Rc::clone(&config);
          println!("owners: {}", Rc::[[strong_count]](&config));
          println!("a sees retries = {}", a.retries);
          drop(a);
          println!("owners after a is gone: {}", Rc::strong_count(&b));
      }
    hints:
      - "A second owner of the same value is made with `Rc::clone(&config)`."
      - "The counter is read with `Rc::strong_count(&config)`."
    tests:
      - expect: "owners: 3\na sees retries = 5\nowners after a is gone: 2"
    more:
