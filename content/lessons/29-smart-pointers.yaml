          1. `shared` is the list `10 -> 20`.
          2. `a` is `1 -> shared` and `b` is `2 -> shared` (both point at the *same* `shared`, using `Rc::clone`).
          3. Write `fn sum(list: &List) -> i32`.

          The program must print exactly:

          ```
          sum a = 31
          sum b = 32
          shared owners = 3
          ```
