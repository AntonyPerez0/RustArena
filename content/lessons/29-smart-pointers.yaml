    solution: |
      use std::cell::RefCell;
      use std::rc::{Rc, Weak};

      struct Employee {
          name: String,
          manager: RefCell<Weak<Employee>>,
          reports: RefCell<Vec<Rc<Employee>>>,
      }

      fn employee(name: &str) -> Rc<Employee> {
          Rc::new(Employee {
              name: name.to_string(),
              manager: RefCell::new(Weak::new()),
              reports: RefCell::new(Vec::new()),
          })
      }

      fn hire(manager: &Rc<Employee>, report: &Rc<Employee>) {
          *report.manager.borrow_mut() = Rc::downgrade(manager);
          manager.reports.borrow_mut().push(Rc::clone(report));
      }

      fn manager_name(e: &Employee) -> Option<String> {
          e.manager.borrow().upgrade().map(|m| m.name.clone())
      }

      fn chain_of_command(e: &Rc<Employee>) -> Vec<String> {
          let mut names = Vec::new();
          let mut current = e.manager.borrow().upgrade();
          while let Some(m) = current {
              names.push(m.name.clone());
              current = m.manager.borrow().upgrade();
          }
          names
      }
    harness: |
      #[test]
      fn hire_links_both_directions() {
          let ana = employee("Ana");
          let bo = employee("Bo");
          hire(&ana, &bo);
          assert_eq!(ana.reports.borrow().len(), 1, "Ana's reports");
          assert_eq!(ana.reports.borrow()[0].name, "Bo", "Ana's first report");
          assert_eq!(manager_name(&bo), Some("Ana".to_string()), "manager_name(Bo)");
      }

      #[test]
      fn the_top_has_no_manager() {
          let ana = employee("Ana");
          assert_eq!(manager_name(&ana), None, "manager_name(Ana)");
          assert_eq!(chain_of_command(&ana), Vec::<String>::new(), "chain_of_command(Ana)");
      }

      #[test]
      fn the_manager_link_does_not_own() {
          let ana = employee("Ana");
          let bo = employee("Bo");
          hire(&ana, &bo);
          assert_eq!(Rc::strong_count(&ana), 1, "Ana's strong count (the up-link must be Weak)");
          assert_eq!(Rc::weak_count(&ana), 1, "Ana's weak count");
          assert_eq!(Rc::strong_count(&bo), 2, "Bo's strong count (owned by Ana's reports)");
      }

      #[test]
      fn walks_up_the_chain() {
          let ana = employee("Ana");
          let bo = employee("Bo");
          let cy = employee("Cy");
          hire(&ana, &bo);
          hire(&bo, &cy);
          assert_eq!(chain_of_command(&cy), vec!["Bo".to_string(), "Ana".to_string()], "chain_of_command(Cy)");
      }

      #[test]
      fn a_departed_manager_is_gone() {
          let bo = employee("Bo");
          {
              let ana = employee("Ana");
              hire(&ana, &bo);
          }
          assert_eq!(manager_name(&bo), None, "manager_name(Bo) after Ana was dropped");
      }
