          Write `fn transfer(from: &AccountRef, to: &AccountRef, amount: u64) -> Result<(), String>` for shared accounts:

          - If `from` and `to` are the same account (`Rc::ptr_eq`), return `Err("same account".to_string())`. Without this check, borrowing it mutably twice would panic.
          - If `from` has less than `amount`, return `Err("insufficient funds".to_string())` and change nothing.
          - Otherwise move the money and return `Ok(())`.
        seed: |
          use std::cell::RefCell;
          use std::rc::Rc;

          #[derive(Debug)]
          struct Account {
              balance: u64,
          }

          type AccountRef = Rc<RefCell<Account>>;

          fn transfer(from: &AccountRef, to: &AccountRef, amount: u64) -> Result<(), String> {
              todo!()
          }
        solution: |
          use std::cell::RefCell;
          use std::rc::Rc;

          #[derive(Debug)]
          struct Account {
              balance: u64,
          }

          type AccountRef = Rc<RefCell<Account>>;

          fn transfer(from: &AccountRef, to: &AccountRef, amount: u64) -> Result<(), String> {
              if Rc::ptr_eq(from, to) {
                  return Err("same account".to_string());
              }
              let mut source = from.borrow_mut();
              if source.balance < amount {
                  return Err("insufficient funds".to_string());
              }
              source.balance -= amount;
              to.borrow_mut().balance += amount;
              Ok(())
          }
        harness: |
          fn account(balance: u64) -> AccountRef {
              Rc::new(RefCell::new(Account { balance }))
          }

          #[test]
          fn moves_money_between_accounts() {
              let a = account(100);
              let b = account(5);
              assert_eq!(transfer(&a, &b, 30), Ok(()), "transfer(a, b, 30)");
              assert_eq!(a.borrow().balance, 70, "a after");
              assert_eq!(b.borrow().balance, 35, "b after");
          }

          #[test]
          fn rejects_overdrafts_without_changing_anything() {
              let a = account(10);
              let b = account(0);
              assert_eq!(transfer(&a, &b, 11), Err("insufficient funds".to_string()), "transfer(a, b, 11)");
              assert_eq!(a.borrow().balance, 10, "a unchanged");
              assert_eq!(b.borrow().balance, 0, "b unchanged");
          }

          #[test]
          fn allows_moving_the_whole_balance() {
              let a = account(10);
              let b = account(0);
              assert_eq!(transfer(&a, &b, 10), Ok(()), "transfer(a, b, 10)");
              assert_eq!(a.borrow().balance, 0, "a after");
          }

          #[test]
          fn refuses_to_transfer_to_the_same_account() {
              let a = account(50);
              let same = Rc::clone(&a);
              assert_eq!(transfer(&a, &same, 10), Err("same account".to_string()), "transfer(a, a, 10)");
              assert_eq!(a.borrow().balance, 50, "balance unchanged");
          }
        hints:
