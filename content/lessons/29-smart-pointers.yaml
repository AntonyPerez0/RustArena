          enum List {
              Cons(i32, Box<List>),
              Nil,
          }

          use List::{Cons, Nil};

          fn from_slice(values: &[i32]) -> List {
              match values {
                  [] => Nil,
                  [first, rest @ ..] => Cons(*first, Box::new(from_slice(rest))),
              }
          }

          fn len(list: &List) -> usize {
              todo!()
          }

          fn largest(list: &List) -> Option<i32> {
              todo!()
          }
        solution: |
          #[derive(Debug)]
          enum List {
              Cons(i32, Box<List>),
              Nil,
          }

          use List::{Cons, Nil};

          fn from_slice(values: &[i32]) -> List {
              match values {
                  [] => Nil,
                  [first, rest @ ..] => Cons(*first, Box::new(from_slice(rest))),
              }
          }

          fn len(list: &List) -> usize {
              match list {
                  Cons(_, rest) => 1 + len(rest),
                  Nil => 0,
              }
          }

          fn largest(list: &List) -> Option<i32> {
              match list {
                  Nil => None,
                  Cons(value, rest) => match largest(rest) {
                      Some(best) if best > *value => Some(best),
                      _ => Some(*value),
                  },
              }
          }
        harness: |
          #[test]
          fn counts_three_numbers() {
              assert_eq!(len(&from_slice(&[4, 8, 15])), 3, "len of [4, 8, 15]");
          }

          #[test]
          fn empty_list_has_length_zero() {
              assert_eq!(len(&from_slice(&[])), 0, "len of []");
          }

          #[test]
          fn finds_the_largest_anywhere() {
              assert_eq!(largest(&from_slice(&[3, 42, 7])), Some(42), "largest of [3, 42, 7]");
              assert_eq!(largest(&from_slice(&[99, 1])), Some(99), "largest of [99, 1]");
          }

          #[test]
          fn handles_negative_numbers() {
              assert_eq!(largest(&from_slice(&[-5, -2, -9])), Some(-2), "largest of [-5, -2, -9]");
          }

          #[test]
          fn empty_list_has_no_largest() {
              assert_eq!(largest(&from_slice(&[])), None, "largest of []");
          }
        hints:
          - "Both functions `match list` with two arms: `Cons(value, rest)` and `Nil`. The `Cons` arm calls the function again on `rest`."
          - "`len`: `Cons(_, rest) => 1 + len(rest)` and `Nil => 0`."
          - "`largest`: in the `Cons` arm, compute `largest(rest)`. If it's `Some(best)` with `best > *value`, return it; otherwise return `Some(*value)`."
      - task: |
          A delivery route is a chain of stops. Using the `Route` enum below, write:

          - `build(stops: &[&str]) -> Route`: the route visiting the stops in order (an empty slice gives `Route::End`).
          - `describe(route: &Route) -> String`: the stops joined with ` -> `, for example `Docks -> Market -> Arena`. An empty route describes as `(no stops)`.

          Use recursion for both (no Vec inside the route).
        seed: |
          enum Route {
              Stop(String, Box<Route>),
              End,
          }

          fn build(stops: &[&str]) -> Route {
              todo!()
          }

          fn describe(route: &Route) -> String {
              todo!()
          }
        solution: |
          enum Route {
              Stop(String, Box<Route>),
              End,
          }

          fn build(stops: &[&str]) -> Route {
              match stops {
                  [] => Route::End,
                  [first, rest @ ..] => Route::Stop(first.to_string(), Box::new(build(rest))),
              }
          }

          fn describe(route: &Route) -> String {
              match route {
                  Route::End => String::from("(no stops)"),
                  Route::Stop(name, next) => match **next {
                      Route::End => name.clone(),
                      _ => format!("{name} -> {}", describe(next)),
                  },
              }
          }
        harness: |
          #[test]
          fn describes_three_stops_in_order() {
              assert_eq!(describe(&build(&["Docks", "Market", "Arena"])), "Docks -> Market -> Arena", "describe(build([Docks, Market, Arena]))");
          }

          #[test]
          fn a_single_stop_has_no_arrow() {
              assert_eq!(describe(&build(&["Depot"])), "Depot", "describe(build([Depot]))");
          }

          #[test]
          fn empty_route_says_no_stops() {
              assert_eq!(describe(&build(&[])), "(no stops)", "describe(build([]))");
          }

          #[test]
          fn build_puts_the_first_stop_at_the_front() {
              match build(&["A", "B"]) {
                  Route::Stop(name, rest) => {
                      assert_eq!(name, "A", "first stop");
                      assert!(matches!(*rest, Route::Stop(_, _)), "the second node should be a Stop");
                  }
                  Route::End => panic!("build([A, B]) returned End"),
              }
          }
        hints:
          - "`build` matches the slice: `[] => Route::End` and `[first, rest @ ..] => Route::Stop(first.to_string(), Box::new(build(rest)))`."
          - "`describe` needs to know whether the next node is `End` to avoid a trailing arrow. `**next` gets from `&Box<Route>` to the `Route` itself so you can match on it."
          - "In the `Stop(name, next)` arm: `match **next { Route::End => name.clone(), _ => format!(\"{name} -> {}\", describe(next)) }`."

  - title: Trees with Box
    id: smart-pointers-2
    text: |
      Lists have one "next" pointer per node. **Trees** have several: a node points at its children, and each child is a smaller tree. Box handles that the same way.

      ### Expression trees

      A calculator, a spreadsheet or a compiler stores a formula like `(2 + 3) * 4` as a tree: the `*` node has two children, the `+` node and the number `4`. Evaluating it is a short recursive function:

      ```rust run
      enum Expr {
          Num(i64),
          Add(Box<Expr>, Box<Expr>),
          Mul(Box<Expr>, Box<Expr>),
      }

      use Expr::{Add, Mul, Num};

      fn eval(e: &Expr) -> i64 {
          match e {
              Num(n) => *n,
              Add(a, b) => eval(a) + eval(b),
              Mul(a, b) => eval(a) * eval(b),
          }
      }

      fn main() {
          // (2 + 3) * 4
          let formula = Mul(
              Box::new(Add(Box::new(Num(2)), Box::new(Num(3)))),
              Box::new(Num(4)),
          );
          println!("{}", eval(&formula));
      }
      ```

      ```output
      20
      ```

      - Each variant that holds sub-expressions holds them in Boxes. `Num` is a **leaf**: it has no children, so the recursion stops there.
      - `Num(n) => *n`: matching through a reference gives `n: &i64`, so `*n` copies the number out.
      - `eval(a)`: `a` is a `&Box<Expr>` and deref coercion turns it into the `&Expr` that `eval` wants.

      Building trees with `Box::new` everywhere gets noisy. Small helper functions like `fn num(n: i64) -> Box<Expr> { Box::new(Num(n)) }` make the code read like the formula.

      ### Binary search trees with Option<Box<Node>>

      When a child may be missing, use `Option<Box<Node>>`: `None` means "no child here". A **binary search tree** keeps smaller keys on the left and larger ones on the right, so walking it left-to-right visits the keys in sorted order:

      ```rust run
      struct Node {
          key: i32,
          left: Option<Box<Node>>,
          right: Option<Box<Node>>,
      }

      fn insert(tree: &mut Option<Box<Node>>, key: i32) {
          match tree {
              None => *tree = Some(Box::new(Node { key, left: None, right: None })),
              Some(node) => {
                  if key < node.key {
                      insert(&mut node.left, key);
                  } else {
                      insert(&mut node.right, key);
                  }
              }
          }
      }

      fn in_order(tree: &Option<Box<Node>>, out: &mut Vec<i32>) {
          if let Some(node) = tree {
              in_order(&node.left, out);
              out.push(node.key);
              in_order(&node.right, out);
          }
      }

      fn main() {
          let mut root = None;
          for key in [50, 30, 70, 20, 40] {
              insert(&mut root, key);
          }
          let mut keys = Vec::new();
          in_order(&root, &mut keys);
          println!("{keys:?}");
      }
      ```

      ```output
      [20, 30, 40, 50, 70]
      ```

      - `insert` takes `&mut Option<Box<Node>>`: a mutable reference to "the spot where a child goes". If the spot is empty (`None`), it puts a new node there with `*tree = Some(...)`. Otherwise it recurses into the correct side.
      - `Some(node)` gives `node: &mut Box<Node>`; `node.key` and `&mut node.left` reach through the Box automatically.

      ### Common mistakes

      - **`Option<Node>` without the Box**: the struct contains itself again, so you get `error[E0072]: recursive type `Node` has infinite size`. `Option` doesn't add a pointer; `Box` does.
      - **Returning `n` instead of `*n`** in `Num(n) => ...`: `n` is a `&i64`, so it's `error[E0308]: mismatched types`.
      - **Getting the order wrong for subtraction**: in `Sub(a, b)`, it's `eval(a) - eval(b)`, left minus right.

      **Your turn:** the calculator gained two operations: `Sub(a, b)` (a minus b) and `Neg(e)` (minus e). Write `fn eval(e: &Expr) -> i64` for all five variants.
    seed: |
      #[derive(Debug)]
      enum Expr {
          Num(i64),
          Add(Box<Expr>, Box<Expr>),
          Sub(Box<Expr>, Box<Expr>),
          Mul(Box<Expr>, Box<Expr>),
          Neg(Box<Expr>),
      }

      use Expr::{Add, Mul, Neg, Num, Sub};

      fn eval(e: &Expr) -> i64 {
          todo!()
      }
    solution: |
      #[derive(Debug)]
      enum Expr {
          Num(i64),
          Add(Box<Expr>, Box<Expr>),
          Sub(Box<Expr>, Box<Expr>),
          Mul(Box<Expr>, Box<Expr>),
          Neg(Box<Expr>),
      }

      use Expr::{Add, Mul, Neg, Num, Sub};

      fn eval(e: &Expr) -> i64 {
          match e {
              Num(n) => *n,
              Add(a, b) => eval(a) + eval(b),
              Sub(a, b) => eval(a) - eval(b),
              Mul(a, b) => eval(a) * eval(b),
              Neg(inner) => -eval(inner),
          }
      }
    harness: |
      fn num(n: i64) -> Box<Expr> {
          Box::new(Num(n))
      }

      #[test]
      fn a_number_evaluates_to_itself() {
          assert_eq!(eval(&Num(7)), 7, "eval(7)");
      }

      #[test]
      fn adds_and_multiplies() {
          let e = Mul(Box::new(Add(num(2), num(3))), num(4));
          assert_eq!(eval(&e), 20, "eval((2 + 3) * 4)");
      }

      #[test]
      fn subtracts_right_from_left() {
          assert_eq!(eval(&Sub(num(10), num(4))), 6, "eval(10 - 4)");
      }

      #[test]
      fn negates() {
          assert_eq!(eval(&Neg(num(5))), -5, "eval(-5)");
          assert_eq!(eval(&Neg(Box::new(Neg(num(5))))), 5, "eval(-(-5))");
      }

      #[test]
      fn evaluates_a_deep_tree() {
          // (1 - 8) * -(2 + 1) = (-7) * (-3) = 21
          let e = Mul(Box::new(Sub(num(1), num(8))), Box::new(Neg(Box::new(Add(num(2), num(1))))));
          assert_eq!(eval(&e), 21, "eval((1 - 8) * -(2 + 1))");
      }
    hints:
      - "`match e` with one arm per variant. The two-child arms look like `Add(a, b) => eval(a) + eval(b)`."
      - "`Sub(a, b) => eval(a) - eval(b)` and `Neg(inner) => -eval(inner)`. Don't forget `Num(n) => *n`."
