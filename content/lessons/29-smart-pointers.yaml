      - task: |
          Build a binary search tree of order ids. Using the `Node` struct below (smaller keys go left, equal or larger go right), write:

          - `insert(tree: &mut Option<Box<Node>>, key: u32)`
          - `contains(tree: &Option<Box<Node>>, key: u32) -> bool`: walk down one side at each node, don't visit the whole tree.
          - `height(tree: &Option<Box<Node>>) -> usize`: the number of nodes on the longest path from the root down (empty tree: 0, one node: 1).
        seed: |
          struct Node {
              key: u32,
              left: Option<Box<Node>>,
              right: Option<Box<Node>>,
          }

          fn insert(tree: &mut Option<Box<Node>>, key: u32) {
              todo!()
          }

          fn contains(tree: &Option<Box<Node>>, key: u32) -> bool {
              todo!()
          }

          fn height(tree: &Option<Box<Node>>) -> usize {
              todo!()
          }
        solution: |
          struct Node {
              key: u32,
              left: Option<Box<Node>>,
              right: Option<Box<Node>>,
          }

          fn insert(tree: &mut Option<Box<Node>>, key: u32) {
              match tree {
                  None => *tree = Some(Box::new(Node { key, left: None, right: None })),
                  Some(node) => {
                      if key < node.key {
                          insert(&mut node.left, key);
                      } else {
                          insert(&mut node.right, key);
                      }
                  }
              }
          }

          fn contains(tree: &Option<Box<Node>>, key: u32) -> bool {
              match tree {
                  None => false,
                  Some(node) if key == node.key => true,
                  Some(node) if key < node.key => contains(&node.left, key),
                  Some(node) => contains(&node.right, key),
              }
          }

          fn height(tree: &Option<Box<Node>>) -> usize {
              match tree {
                  None => 0,
                  Some(node) => 1 + height(&node.left).max(height(&node.right)),
              }
          }
        harness: |
          fn tree_of(keys: &[u32]) -> Option<Box<Node>> {
              let mut root = None;
              for &k in keys {
                  insert(&mut root, k);
              }
              root
          }

          #[test]
          fn finds_inserted_keys() {
              let t = tree_of(&[50, 30, 70, 20, 40]);
              for k in [50, 30, 70, 20, 40] {
                  assert!(contains(&t, k), "contains({k}) should be true");
              }
          }

          #[test]
          fn does_not_find_missing_keys() {
              let t = tree_of(&[50, 30, 70]);
              assert!(!contains(&t, 60), "contains(60)");
              assert!(!contains(&None, 1), "contains on an empty tree");
          }

          #[test]
          fn puts_smaller_keys_on_the_left() {
              let t = tree_of(&[50, 30, 70]);
              let root = t.as_ref().expect("root should exist");
              assert_eq!(root.key, 50, "root key");
              assert_eq!(root.left.as_ref().map(|n| n.key), Some(30), "left child");
              assert_eq!(root.right.as_ref().map(|n| n.key), Some(70), "right child");
          }

          #[test]
          fn measures_height() {
              assert_eq!(height(&None), 0, "height of empty tree");
              assert_eq!(height(&tree_of(&[5])), 1, "height of one node");
              assert_eq!(height(&tree_of(&[50, 30, 70, 20, 40])), 3, "height of [50, 30, 70, 20, 40]");
              assert_eq!(height(&tree_of(&[1, 2, 3, 4])), 4, "height of sorted inserts [1, 2, 3, 4]");
          }
        hints:
          - "`insert` is the one from the lesson text, with `u32` keys."
          - "`contains`: match with guards: `None => false`, `Some(node) if key == node.key => true`, then go left or right."
          - "`height`: `None => 0`, `Some(node) => 1 + height(&node.left).max(height(&node.right))`."

  - title: "Deref and Drop: what makes a pointer smart"
    id: smart-pointers-3
    text: |
      Two traits give smart pointers their behavior. **`Deref`** makes a type usable like a reference to what it holds. **`Drop`** runs cleanup code when a value goes away. You met both briefly in the std traits module; here's how they work together.

      ### Deref and deref coercion

      `impl Deref for MyType { type Target = T; fn deref(&self) -> &T }` says "a `&MyType` can be used as a `&T`". Then two things happen automatically:

      - `*value` works, and **method calls** look through the pointer: `boxed_string.len()` finds `String::len`.
      - **Deref coercion**: when you pass `&MyType` where a `&T` is expected, Rust inserts the `deref` calls for you, as many steps as needed.

      ```rust run
      use std::ops::Deref;

      struct Username(String);

      impl Deref for Username {
          type Target = String;

          fn deref(&self) -> &String {
              &self.0
          }
      }

      fn greet(name: &str) {
          println!("Welcome, {name}!");
      }

      fn main() {
          let user = Username(String::from("ferris"));
          println!("{} letters", user.len()); // String::len, through Deref
          greet(&user); // &Username -> &String -> &str

          let boxed = Box::new(String::from("corro"));
          greet(&boxed); // &Box<String> -> &String -> &str
      }
      ```

      ```output
      6 letters
      Welcome, ferris!
      Welcome, corro!
      ```

      `Box<T>` implements `Deref<Target = T>`, `String` implements `Deref<Target = str>`, and `Vec<T>` implements `Deref<Target = [T]>`. That's why a `&String` works where a `&str` is wanted and a `&Vec<T>` where a `&[T]` is. Implement `Deref` for wrapper types that *are* a kind of pointer or container; the Rust API guidelines warn against using it to fake inheritance between unrelated structs.

      ### Drop: cleanup at the end of a scope

      When a value goes out of scope, Rust calls its `drop` method (if it has one), then drops its fields. That's how a Box frees its heap memory, a `File` closes, and a lock is released. This pattern of "cleanup tied to a value's lifetime" is called **RAII**. The order is fixed, so you can rely on it:

      ```rust run
      struct Noisy(&'static str);

      impl Drop for Noisy {
          fn drop(&mut self) {
              println!("drop {}", self.0);
          }
      }

      fn main() {
          let _a = Noisy("a");
          let b = Noisy("b");
          {
              let _inner = Noisy("inner");
              println!("leaving inner scope");
          }
          drop(b); // drop right now
          let _c = Noisy("c");
          println!("end of main");
      }
      ```

      ```output
      leaving inner scope
      drop inner
      drop b
      end of main
      drop c
      drop a
      ```

      - Values are dropped at the end of their scope, in **reverse order of declaration**: `_c` (declared last) goes before `_a`. Later values may depend on earlier ones, so they go first.
      - `drop(b)` drops a value early. It's an ordinary function from the prelude (`std::mem::drop`) that takes ownership and does nothing, so the value is dropped when the function ends.
      - The fields of a struct are dropped after the struct's own `drop`, in the order they're declared. Elements of a `Vec` are dropped first to last.

      ### Common mistakes

      - **Calling `.drop()` yourself**: `b.drop()` is `error[E0040]: explicit use of destructor method`. Use `drop(b)`; Rust must be sure it never runs twice.
      - **`let _ = value;` drops immediately.** The pattern `_` doesn't bind anything, so a guard written `let _ = Noisy("x");` is gone on the same line. Write `let _guard = ...` to keep it alive until the end of the scope.
      - **Using a value after `drop(x)`**: `drop` took ownership, so it's `error[E0382]: borrow of moved value`.

      **Your turn:** implement `Drop` for `Connection` so dropping one prints `closing <name>`. Then finish `main`: it opens `db`, then `cache`, closes `db` early with `drop`, prints `working`, and lets `cache` close at the end. The output must be exactly:

      ```
      opened db
      opened cache
      closing db
      working
      closing cache
      ```
