          - `fn on_both(player: &Rc<Player>, a: &Team, b: &Team) -> bool`: true if this exact player (the same `Rc`, not just the same name) is a member of both teams. `Rc::ptr_eq(&x, &y)` tells you whether two `Rc`s point at the same value.
