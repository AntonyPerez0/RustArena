          Map errors to exit codes (the BSD `sysexits` convention many tools follow). Write `fn exit_code(e: &anyhow::Error) -> u8` that downcasts, checking in this order: a `ConfigError` gives `78`, a `std::io::Error` gives `74`, a `std::num::ParseIntError` gives `65`, anything else `1`. The errors may have context layers around them.
        seed: |
          use thiserror::Error;

          #[derive(Debug, Error)]
          enum ConfigError {
              #[error("missing setting {0}")]
              Missing(String),
          }

          fn exit_code(e: &anyhow::Error) -> u8 {
