      mod inventory {
          use std::collections::BTreeMap;
          use thiserror::Error;

          #[derive(Debug, Error)]
          pub enum InventoryError {
              #[error("unknown item {0:?}")]
              UnknownItem(String),
              #[error("only {available} {item} left, asked for {wanted}")]
              OutOfStock { item: String, available: u32, wanted: u32 },
          }

          #[derive(Default)]
          pub struct Inventory {
              stock: BTreeMap<String, u32>,
          }

          impl Inventory {
              pub fn add(&mut self, item: &str, qty: u32) {
                  *self.stock.entry(item.to_string()).or_insert(0) += qty;
              }

              pub fn take(&mut self, item: &str, wanted: u32) -> Result<u32, InventoryError> {
                  let available = self
                      .stock
                      .get_mut(item)
                      .ok_or_else(|| InventoryError::UnknownItem(item.to_string()))?;
                  if *available < wanted {
                      return Err(InventoryError::OutOfStock { item: item.to_string(), available: *available, wanted });
                  }
                  *available -= wanted;
                  Ok(*available)
              }
          }
      }

      use anyhow::{bail, Context, Result};
      use inventory::{Inventory, InventoryError};
      use std::io::BufRead;

      fn apply(inv: &mut Inventory, line: &str) -> Result<String> {
          let parts: Vec<&str> = line.split_whitespace().collect();
          let [cmd, item, qty] = parts[..] else {
              bail!("expected: <command> <item> <qty>");
          };
          let qty: u32 = qty.parse().with_context(|| format!("bad quantity {qty:?}"))?;
          match cmd {
              "add" => {
                  inv.add(item, qty);
                  Ok(format!("added {qty} {item}"))
              }
              "take" => {
                  let left = inv.take(item, qty)?;
                  Ok(format!("took {qty} {item}, {left} left"))
              }
              _ => bail!("unknown command {cmd:?}"),
          }
      }

      fn main() {
          let mut inv = Inventory::default();
          for line in std::io::stdin().lock().lines() {
              let line = line.unwrap();
              if line.trim().is_empty() {
                  continue;
              }
              match apply(&mut inv, &line) {
                  Ok(msg) => println!("{msg}"),
                  Err(e) => match e.downcast_ref::<InventoryError>() {
                      Some(InventoryError::OutOfStock { .. }) => println!("backorder: {e:#}"),
                      _ => println!("error: {e:#}"),
                  },
              }
          }
      }
