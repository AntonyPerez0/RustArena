              todo!()
          }
        solution: |
          use std::error::Error;
          use thiserror::Error;

          #[derive(Debug, Error)]
          #[error("could not start the server")]
          struct StartError(#[source] ConfigError);

          #[derive(Debug, Error)]
          enum ConfigError {
              #[error("invalid port")]
              Port(#[from] std::num::ParseIntError),
              #[error("no port given")]
              Missing,
          }

          fn error_chain(e: &dyn Error) -> Vec<String> {
              let mut out = vec![e.to_string()];
              let mut cause = e.source();
              while let Some(c) = cause {
                  out.push(c.to_string());
                  cause = c.source();
              }
              out
          }
        harness: |
          #[test]
          fn walks_three_levels() {
              let inner: ConfigError = "80a".parse::<u16>().unwrap_err().into();
              let e = StartError(inner);
              assert_eq!(error_chain(&e), vec!["could not start the server", "invalid port", "invalid digit found in string"], "error_chain(StartError(Port(..)))");
          }

          #[test]
          fn stops_when_there_is_no_source() {
              let e = StartError(ConfigError::Missing);
              assert_eq!(error_chain(&e), vec!["could not start the server", "no port given"], "error_chain(StartError(Missing))");
          }

          #[test]
          fn a_single_error_is_one_line() {
              assert_eq!(error_chain(&ConfigError::Missing), vec!["no port given"], "error_chain(Missing)");
          }
        hints:
