          }
        solution: |
          use thiserror::Error;

          #[derive(Debug, Error)]
          enum ConfigError {
              #[error("missing setting {0}")]
              Missing(String),
          }

          fn exit_code(e: &anyhow::Error) -> u8 {
              if e.downcast_ref::<ConfigError>().is_some() {
                  78
              } else if e.downcast_ref::<std::io::Error>().is_some() {
                  74
              } else if e.downcast_ref::<std::num::ParseIntError>().is_some() {
                  65
              } else {
                  1
              }
          }
        harness: |
          use anyhow::{anyhow, Context};

          #[test]
          fn config_errors_are_78() {
              let e = anyhow::Error::from(ConfigError::Missing(String::from("port")));
              assert_eq!(exit_code(&e), 78, "exit_code(ConfigError)");
          }

          #[test]
          fn io_errors_are_74_even_with_context() {
              let e = std::fs::read_to_string("nope.txt").context("reading nope.txt").unwrap_err();
              assert_eq!(exit_code(&e), 74, "exit_code(io error with context)");
          }

          #[test]
          fn parse_errors_are_65() {
              let e = "x".parse::<u32>().context("reading the count").context("loading").unwrap_err();
              assert_eq!(exit_code(&e), 65, "exit_code(ParseIntError with two contexts)");
          }

          #[test]
          fn anything_else_is_1() {
              assert_eq!(exit_code(&anyhow!("something odd")), 1, "exit_code(anyhow!(...))");
          }
        hints:
          - "`e.downcast_ref::<ConfigError>()` returns `Some(&ConfigError)` if that's the error inside, even under context layers."
          - "Chain `if e.downcast_ref::<T>().is_some() { code } else if ...` in the order given."
      - task: |
          Code review: this library function **panics** on bad input, which a library must never do. Make it return `Result<Rgb, ColorError>` instead. Define `ColorError` with thiserror: `MissingHash` (`color must start with #`), `WrongLength(usize)` (`expected 6 hex digits, got 4`), and `BadDigit` wrapping a `std::num::ParseIntError` with `#[from]` (`invalid hex digit`). No `unwrap`, `expect` or `panic!` left.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Rgb(u8, u8, u8);

          fn parse_hex(s: &str) -> Rgb {
              let hex = s.strip_prefix('#').unwrap();
              if hex.len() != 6 {
                  panic!("bad length");
              }
              let r = u8::from_str_radix(&hex[0..2], 16).unwrap();
              let g = u8::from_str_radix(&hex[2..4], 16).unwrap();
              let b = u8::from_str_radix(&hex[4..6], 16).unwrap();
              Rgb(r, g, b)
          }
        solution: |
          use thiserror::Error;

          #[derive(Debug, PartialEq)]
          struct Rgb(u8, u8, u8);

          #[derive(Debug, Error)]
          enum ColorError {
              #[error("color must start with #")]
              MissingHash,
              #[error("expected 6 hex digits, got {0}")]
              WrongLength(usize),
              #[error("invalid hex digit")]
              BadDigit(#[from] std::num::ParseIntError),
          }

          fn parse_hex(s: &str) -> Result<Rgb, ColorError> {
              let hex = s.strip_prefix('#').ok_or(ColorError::MissingHash)?;
              if hex.len() != 6 {
                  return Err(ColorError::WrongLength(hex.len()));
              }
              let r = u8::from_str_radix(&hex[0..2], 16)?;
              let g = u8::from_str_radix(&hex[2..4], 16)?;
              let b = u8::from_str_radix(&hex[4..6], 16)?;
              Ok(Rgb(r, g, b))
          }
        forbid:
          - pattern: '\.unwrap\(\)|\.expect\(|panic!'
            message: A library function must return errors, not panic.
        harness: |
          #[test]
          fn parses_a_valid_color() {
              assert_eq!(parse_hex("#ff8000").unwrap(), Rgb(255, 128, 0), "parse_hex(\"#ff8000\")");
          }

          #[test]
          fn requires_the_hash() {
              assert_eq!(parse_hex("ff8000").unwrap_err().to_string(), "color must start with #", "parse_hex(\"ff8000\")");
          }

          #[test]
          fn reports_the_wrong_length() {
              assert_eq!(parse_hex("#fff0").unwrap_err().to_string(), "expected 6 hex digits, got 4", "parse_hex(\"#fff0\")");
          }

          #[test]
          fn bad_digits_wrap_the_parse_error() {
              let e = parse_hex("#gg0000").unwrap_err();
              assert!(matches!(e, ColorError::BadDigit(_)), "variant was {e:?}");
              assert_eq!(e.to_string(), "invalid hex digit", "message");
          }
        hints:
          - "`s.strip_prefix('#').ok_or(ColorError::MissingHash)?` replaces the first unwrap."
          - "With `BadDigit(#[from] std::num::ParseIntError)`, `u8::from_str_radix(&hex[0..2], 16)?` converts automatically."
