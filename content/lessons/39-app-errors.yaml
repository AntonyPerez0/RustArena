id: app-errors
title: Error Handling at Work with thiserror and anyhow
phase: "Rust at work"
summary: The two crates nearly every Rust team uses for errors. thiserror for precise library errors, anyhow for applications, context that explains what went wrong, and a main that reports failures properly.
roadmap: [Error Handling, Custom Error Types and Traits, "Propagating Errors and `?` Operator"]
steps:
  - title: Library errors with thiserror
    id: app-errors-1
    text: |
      In the custom errors module you built error enums by hand: the enum, an `impl Display` with a `match` giving each variant a message, and an empty `impl std::error::Error`. That design is exactly right. It's also a lot of typing, and the boilerplate grows with every variant. **thiserror** is a derive macro that writes those impls for you:

      ```rust run
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum WithdrawError {
          #[error("amount must be positive")]
          ZeroAmount,
          #[error("insufficient funds: need {needed}, have {available}")]
          InsufficientFunds { needed: u64, available: u64 },
          #[error("account {0} is frozen")]
          Frozen(String),
      }

      fn withdraw(balance: u64, amount: u64) -> Result<u64, WithdrawError> {
          if amount == 0 {
              return Err(WithdrawError::ZeroAmount);
          }
          if amount > balance {
              return Err(WithdrawError::InsufficientFunds { needed: amount, available: balance });
          }
          Ok(balance - amount)
      }

      fn main() {
          println!("{:?}", withdraw(100, 30));
          for amount in [0, 500] {
              match withdraw(100, amount) {
                  Ok(left) => println!("left: {left}"),
                  Err(e) => println!("error: {e}"),
              }
          }
          println!("{}", WithdrawError::Frozen(String::from("ACC-7")));
      }
      ```

      ```output
      Ok(70)
      error: amount must be positive
      error: insufficient funds: need 500, have 100
      account ACC-7 is frozen
      ```

      Piece by piece:

      - `#[derive(Debug, Error)]`: `Error` (from `thiserror`) generates `impl std::error::Error` and `impl Display`. The `Error` trait requires `Debug` too, so derive both.
      - Each `#[error("...")]` is that variant's `Display` message. Inside it, `{0}` is the first tuple field and `{needed}` a named field. Format specs work as in `format!`: `{0:?}` uses Debug (quotes around strings), `{amount:.2}` rounds.
      - The result is the same code you'd write by hand: no runtime cost, and thiserror doesn't appear in your public API (callers just see an enum implementing `Error`), so you could remove it later without breaking anyone.
      - Callers can `match` on the variants and react differently to each one. That's the point of a **typed error**, and why libraries use them.

      A struct works too, for an operation that can fail in only one way:

      ```rust run
      use thiserror::Error;

      #[derive(Debug, Error)]
      #[error("invalid color {input:?}: expected #rrggbb")]
      struct ParseColorError {
          input: String,
      }

      fn main() {
          let e = ParseColorError { input: String::from("teal") };
          println!("{e}");
      }
      ```

      ```output
      invalid color "teal": expected #rrggbb
      ```

      ### Writing good messages

      The Rust API guidelines say error messages are **lowercase, without a trailing period**, and short. The reason: messages get chained into sentences like `loading config: line 3: invalid number`, and capitals and periods in the middle look wrong. Say what went wrong and include the values that help (the amount, the account, the input).

      ### Common mistakes

      Every variant needs a message. Forget one and thiserror tells you at compile time:

      ```rust compile_fail
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum LoadError {
          #[error("file is empty")]
          Empty,
          TooBig(usize),
      }

      fn main() {
          println!("{}", LoadError::Empty);
      }
      ```

      ```error
      error: missing #[error("...")] display attribute
      ```

      - **Forgetting `Debug`** in the derive gives ``error[E0277]: `LoadError` doesn't implement `Debug` ``: `std::error::Error` requires it.
      - **Naming a field that doesn't exist** in the message, like `{amount}` when the field is `needed`, is a compile error too. Typos can't sneak into production messages.

      **Your turn:** complete `TransferError` (derive `Error`, add a message to each variant) and write `check_transfer`, which returns the balance left after the transfer. Check in this order, with these exact messages:
      - `from == to`: `SameAccount`, message `cannot transfer to the same account`
      - `amount > 1000`: `OverLimit { limit: 1000 }`, message `amount exceeds the daily limit of 1000` (use `{limit}`)
      - `amount > balance`: `InsufficientFunds { needed, available }`, message `insufficient funds: need 250, have 100`
    seed: |
      use thiserror::Error;

      #[derive(Debug, PartialEq)]
      enum TransferError {
          SameAccount,
          OverLimit { limit: u64 },
          InsufficientFunds { needed: u64, available: u64 },
      }

      fn check_transfer(from: &str, to: &str, balance: u64, amount: u64) -> Result<u64, TransferError> {
          todo!()
      }
    solution: |
      use thiserror::Error;

      #[derive(Debug, PartialEq, Error)]
      enum TransferError {
          #[error("cannot transfer to the same account")]
          SameAccount,
          #[error("amount exceeds the daily limit of {limit}")]
          OverLimit { limit: u64 },
          #[error("insufficient funds: need {needed}, have {available}")]
          InsufficientFunds { needed: u64, available: u64 },
      }

      fn check_transfer(from: &str, to: &str, balance: u64, amount: u64) -> Result<u64, TransferError> {
          if from == to {
              return Err(TransferError::SameAccount);
          }
          if amount > 1000 {
              return Err(TransferError::OverLimit { limit: 1000 });
          }
          if amount > balance {
              return Err(TransferError::InsufficientFunds { needed: amount, available: balance });
          }
          Ok(balance - amount)
      }
    harness: |
      #[test]
      fn a_valid_transfer_returns_the_new_balance() {
          assert_eq!(check_transfer("A", "B", 500, 120), Ok(380), "check_transfer(A, B, 500, 120)");
      }

      #[test]
      fn same_account_is_rejected_with_its_message() {
          let e = check_transfer("A", "A", 500, 10).unwrap_err();
          assert_eq!(e, TransferError::SameAccount, "check_transfer(A, A, ..)");
          assert_eq!(e.to_string(), "cannot transfer to the same account", "message");
      }

      #[test]
      fn over_the_limit_is_rejected() {
          let e = check_transfer("A", "B", 5000, 1001).unwrap_err();
          assert_eq!(e, TransferError::OverLimit { limit: 1000 }, "check_transfer(.., 1001)");
          assert_eq!(e.to_string(), "amount exceeds the daily limit of 1000", "message");
      }

      #[test]
      fn insufficient_funds_reports_both_amounts() {
          let e = check_transfer("A", "B", 100, 250).unwrap_err();
          assert_eq!(e.to_string(), "insufficient funds: need 250, have 100", "message");
      }

      #[test]
      fn checks_happen_in_order() {
          assert_eq!(check_transfer("A", "A", 0, 5000), Err(TransferError::SameAccount), "same account is checked first");
          assert_eq!(check_transfer("A", "B", 0, 5000), Err(TransferError::OverLimit { limit: 1000 }), "the limit is checked before the balance");
      }

      #[test]
      fn it_is_a_real_std_error() {
          let e: Box<dyn std::error::Error> = Box::new(TransferError::SameAccount);
          assert_eq!(e.to_string(), "cannot transfer to the same account", "as Box<dyn Error>");
      }
    hints:
      - "Add `Error` to the derive list, then put `#[error(\"...\")]` above each variant."
      - "Named fields go straight into the message: `#[error(\"insufficient funds: need {needed}, have {available}\")]`."
      - "In `check_transfer`, three `if` checks with `return Err(...)`, then `Ok(balance - amount)`."
    more:
      - task: |
          Fill in the blanks: derive thiserror's trait on the struct, and write the message so the program prints `invalid size "XXL": expected S, M or L` (use Debug formatting of the `input` field to get the quotes).
        fill: |
          use thiserror::Error;

          #[derive(Debug, [[Error]])]
          #[error("invalid size [[{input:?}]]: expected S, M or L")]
          struct SizeError {
              input: String,
          }

          fn parse_size(s: &str) -> Result<char, SizeError> {
              match s {
                  "S" | "M" | "L" => Ok(s.chars().next().unwrap()),
                  _ => Err(SizeError { input: s.to_string() }),
              }
          }

          fn main() {
              match parse_size("XXL") {
                  Ok(c) => println!("size {c}"),
                  Err(e) => println!("{e}"),
              }
          }
        hints:
          - "The derive is named after the trait: `Error`."
          - "A named field in Debug format is written `{input:?}` inside the message."
        tests:
          - expect: 'invalid size "XXL": expected S, M or L'
      - task: |
          Write an error enum from scratch. `TemperatureError` has two variants: `NotANumber(String)` with message `"abc" is not a number` (Debug-format the text) and `BelowAbsoluteZero(f64)` with message `-300.0 C is below absolute zero` (one decimal). Then write `fn parse_celsius(s: &str) -> Result<f64, TemperatureError>`: trim `s`, parse it as `f64`, and reject anything below `-273.15`.
        seed: |
          use thiserror::Error;

          // define TemperatureError here

          fn parse_celsius(s: &str) -> Result<f64, TemperatureError> {
              todo!()
          }
        solution: |
          use thiserror::Error;

          #[derive(Debug, Error, PartialEq)]
          enum TemperatureError {
              #[error("{0:?} is not a number")]
              NotANumber(String),
              #[error("{0:.1} C is below absolute zero")]
              BelowAbsoluteZero(f64),
          }

          fn parse_celsius(s: &str) -> Result<f64, TemperatureError> {
              let t = s.trim();
              let c: f64 = t.parse().map_err(|_| TemperatureError::NotANumber(t.to_string()))?;
              if c < -273.15 {
                  return Err(TemperatureError::BelowAbsoluteZero(c));
              }
              Ok(c)
          }
        harness: |
          #[test]
          fn parses_a_normal_temperature() {
              assert_eq!(parse_celsius(" 21.5 ").unwrap(), 21.5, "parse_celsius(\" 21.5 \")");
          }

          #[test]
          fn text_is_not_a_number() {
              assert_eq!(parse_celsius("abc").unwrap_err().to_string(), "\"abc\" is not a number", "message for \"abc\"");
          }

          #[test]
          fn below_absolute_zero_is_rejected() {
              assert_eq!(parse_celsius("-300").unwrap_err().to_string(), "-300.0 C is below absolute zero", "message for -300");
          }

          #[test]
          fn absolute_zero_itself_is_fine() {
              assert_eq!(parse_celsius("-273.15").unwrap(), -273.15, "parse_celsius(\"-273.15\")");
          }
        hints:
          - "`#[error(\"{0:?} is not a number\")]` and `#[error(\"{0:.1} C is below absolute zero\")]`."
          - "`t.parse::<f64>().map_err(|_| TemperatureError::NotANumber(t.to_string()))?` turns the parse error into your variant."

  - title: "Wrapping causes: #[from], #[source], transparent"
    id: app-errors-2
    text: |
      Real errors have causes. Your config loader fails *because* a number didn't parse; your importer fails *because* the file wasn't there. Throwing the cause away makes debugging miserable, so `std::error::Error` has a method for it: `source()` returns the error that caused this one (or `None`). Following `source()` again and again walks the **error chain**.

      thiserror sets up `source()` from attributes on fields:

      - `#[source]` marks a field as the cause.
      - A field **named** `source` is the cause automatically.
      - `#[from]` marks the cause **and** generates `impl From<ThatError> for YourError`, so `?` converts it for you.

      ### `#[source]`, with extra information

      ```rust run
      use std::error::Error;
      use std::num::ParseIntError;
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum ConfigError {
          #[error("line {line}: expected key=value")]
          Syntax { line: usize },
          #[error("line {line}: invalid number for {key}")]
          BadNumber {
              line: usize,
              key: String,
              #[source]
              source: ParseIntError,
          },
      }

      fn parse_config(text: &str) -> Result<Vec<(String, u32)>, ConfigError> {
          let mut out = Vec::new();
          for (i, raw) in text.lines().enumerate() {
              let line = i + 1;
              let Some((key, value)) = raw.split_once('=') else {
                  return Err(ConfigError::Syntax { line });
              };
              let key = key.trim().to_string();
              let n = value
                  .trim()
                  .parse()
                  .map_err(|source| ConfigError::BadNumber { line, key: key.clone(), source })?;
              out.push((key, n));
          }
          Ok(out)
      }

      fn print_chain(e: &dyn Error) {
          println!("error: {e}");
          let mut cause = e.source();
          while let Some(c) = cause {
              println!("  caused by: {c}");
              cause = c.source();
          }
      }

      fn main() {
          println!("{:?}", parse_config("workers = 4\nport = 8080"));
          if let Err(e) = parse_config("workers = 4\nport = eighty") {
              print_chain(&e);
          }
          if let Err(e) = parse_config("workers") {
              print_chain(&e);
          }
      }
      ```

      ```output
      Ok([("workers", 4), ("port", 8080)])
      error: line 2: invalid number for port
        caused by: invalid digit found in string
      error: line 1: expected key=value
      ```

      The variant carries extra facts (the line and key), so there's no automatic conversion: `map_err` builds the variant and `?` returns it. `print_chain` takes `&dyn Error`, so it works for any error type.

      ### `#[from]`: automatic conversion with `?`

      When a variant only wraps another error, `#[from]` saves the `map_err`:

      ```rust run
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum ImportError {
          #[error("could not read the export file")]
          Io(#[from] std::io::Error),
          #[error("export file is not valid JSON")]
          Json(#[from] serde_json::Error),
      }

      fn import(path: &str) -> Result<Vec<u32>, ImportError> {
          let text = std::fs::read_to_string(path)?; // io::Error becomes ImportError::Io
          let ids = serde_json::from_str(&text)?; // serde_json::Error becomes ImportError::Json
          Ok(ids)
      }

      fn main() {
          match import("export.json") {
              Ok(ids) => println!("{} ids", ids.len()),
              Err(e) => {
                  println!("{e}");
                  if let Some(cause) = std::error::Error::source(&e) {
                      println!("because: {cause}");
                  }
              }
          }
      }
      ```

      ```output
      could not read the export file
      because: No such file or directory (os error 2)
      ```

      ### Don't say it twice

      Notice the messages above describe only **their own layer** ("could not read the export file"), not the cause. If you write `#[error("bad number: {0}")]` *and* mark the field as the source, every tool that prints the chain shows the cause twice: `bad number: invalid digit found in string: invalid digit found in string`. Pick one: either the message includes the cause and the field isn't a source, or (the common choice) the cause is the source and the message leaves it out.

      ### `#[error(transparent)]`

      Sometimes a variant adds nothing: it just passes another error through. `#[error(transparent)]` forwards both `Display` and `source()` to the inner error:

      ```rust
      #[derive(Debug, Error)]
      enum StoreError {
          #[error("item {0} not found")]
          NotFound(u32),
          #[error(transparent)]
          Io(#[from] std::io::Error),
      }
      ```

      ### Common mistakes

      Two variants can't both have `#[from]` for the same type: `?` wouldn't know which one to build.

      ```rust compile_fail
      use std::num::ParseIntError;
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum ScoreError {
          #[error("bad score")]
          BadScore(#[from] ParseIntError),
          #[error("bad round")]
          BadRound(#[from] ParseIntError),
      }

      fn main() {}
      ```

      ```error
      error[E0119]: conflicting implementations of trait `From<ParseIntError>` for type `ScoreError`
      ```

      Use `#[source]` plus `map_err` for at least one of them. Also, `#[from]` only works on a variant whose other fields are empty; adding `line: usize` next to it gives `deriving From requires no fields other than source and backtrace`. Again, switch to `#[source]`.

      **Your turn:** `parse_quantity` is already written and uses `?` on a `ParseIntError`. Define `QuantityError` so it compiles and passes: a variant `NotANumber` that wraps the `ParseIntError` with `#[from]` (message `not a whole number`), and `TooLarge(u32)` with message `quantity 250 is over the maximum of 100`.
    seed: |
      use std::num::ParseIntError;
      use thiserror::Error;

      // define QuantityError here

      fn parse_quantity(s: &str) -> Result<u32, QuantityError> {
          let n: u32 = s.trim().parse()?;
          if n > 100 {
              return Err(QuantityError::TooLarge(n));
          }
          Ok(n)
      }
    solution: |
      use std::num::ParseIntError;
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum QuantityError {
          #[error("not a whole number")]
          NotANumber(#[from] ParseIntError),
          #[error("quantity {0} is over the maximum of 100")]
          TooLarge(u32),
      }

      fn parse_quantity(s: &str) -> Result<u32, QuantityError> {
          let n: u32 = s.trim().parse()?;
          if n > 100 {
              return Err(QuantityError::TooLarge(n));
          }
          Ok(n)
      }
    harness: |
      use std::error::Error;

      #[test]
      fn parses_a_valid_quantity() {
          assert_eq!(parse_quantity(" 42 ").unwrap(), 42, "parse_quantity(\" 42 \")");
      }

      #[test]
      fn text_becomes_not_a_number() {
          let e = parse_quantity("lots").unwrap_err();
          assert!(matches!(e, QuantityError::NotANumber(_)), "variant was {e:?}");
          assert_eq!(e.to_string(), "not a whole number", "message");
      }

      #[test]
      fn the_parse_error_is_kept_as_the_source() {
          let e = parse_quantity("1.5").unwrap_err();
          assert_eq!(e.source().map(|s| s.to_string()), Some(String::from("invalid digit found in string")), "source()");
      }

      #[test]
      fn too_large_has_no_source() {
          let e = parse_quantity("250").unwrap_err();
          assert_eq!(e.to_string(), "quantity 250 is over the maximum of 100", "message");
          assert!(e.source().is_none(), "TooLarge should have no source");
      }
    hints:
      - "`#[derive(Debug, Error)] enum QuantityError { ... }` with two variants."
      - "`#[error(\"not a whole number\")] NotANumber(#[from] ParseIntError),`"
      - "`#[error(\"quantity {0} is over the maximum of 100\")] TooLarge(u32),`"
