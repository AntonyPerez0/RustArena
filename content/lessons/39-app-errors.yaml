        solution: |
          use anyhow::ensure;

          fn average(values: &[&str]) -> anyhow::Result<f64> {
              ensure!(!values.is_empty(), "no values to average");
              let mut sum = 0.0;
              for v in values {
                  sum += v.trim().parse::<f64>()?;
              }
