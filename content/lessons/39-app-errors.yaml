              assert_eq!(average(&["1", " 2 ", "4.5"]).unwrap(), 2.5, "average([1, 2, 4.5])");
          }

          #[test]
          fn no_values_is_an_error() {
              assert_eq!(average(&[]).unwrap_err().to_string(), "no values to average", "average([])");
          }

          #[test]
          fn a_bad_value_is_an_error() {
              assert_eq!(average(&["1", "two"]).unwrap_err().to_string(), "invalid float literal", "average([1, two])");
          }
        hints:
          - "`ensure!(!values.is_empty(), \"no values to average\");` first."
          - "Inside a loop: `sum += v.trim().parse::<f64>()?;` then `Ok(sum / values.len() as f64)`."
      - task: |
          Write a tiny calculator. Each line of standard input is `<a> <op> <b>` with whole numbers (`i64`) and `op` one of `+ - * /`. Put the logic in `fn eval(line: &str) -> anyhow::Result<i64>` and print `= <result>` or `error: <message>` for each line. Errors: wrong number of parts gives `expected: <a> <op> <b>`; an unknown operator gives `unknown operator "%"`; dividing by zero gives `division by zero`; numbers that don't parse use `?`; results that overflow give `overflow` (use the `checked_` methods).
        seed: |
          use anyhow::{anyhow, bail, Result};
          use std::io::BufRead;

          fn eval(line: &str) -> Result<i64> {
              todo!()
          }

          fn main() {
              for line in std::io::stdin().lock().lines() {
                  let line = line.unwrap();
                  match eval(&line) {
                      Ok(n) => println!("= {n}"),
                      Err(e) => println!("error: {e}"),
                  }
              }
          }
        solution: |
          use anyhow::{anyhow, bail, Result};
          use std::io::BufRead;

          fn eval(line: &str) -> Result<i64> {
              let parts: Vec<&str> = line.split_whitespace().collect();
              let [a, op, b] = parts[..] else {
                  bail!("expected: <a> <op> <b>");
              };
              let a: i64 = a.parse()?;
              let b: i64 = b.parse()?;
              let result = match op {
                  "+" => a.checked_add(b),
                  "-" => a.checked_sub(b),
                  "*" => a.checked_mul(b),
                  "/" => {
                      if b == 0 {
                          bail!("division by zero");
                      }
                      a.checked_div(b)
                  }
                  _ => bail!("unknown operator {op:?}"),
              };
              result.ok_or_else(|| anyhow!("overflow"))
          }

          fn main() {
              for line in std::io::stdin().lock().lines() {
                  let line = line.unwrap();
                  match eval(&line) {
                      Ok(n) => println!("= {n}"),
                      Err(e) => println!("error: {e}"),
                  }
              }
          }
