        solution: |
          use anyhow::{bail, Context, Result};

          fn main() -> Result<()> {
              let text = std::fs::read_to_string("orders.csv").context("could not read orders.csv")?;
              let mut count = 0;
              let mut cents: u64 = 0;
              for (i, line) in text.lines().enumerate().skip(1) {
                  let n = i + 1;
                  let fields: Vec<&str> = line.split(',').collect();
                  let [_, qty, price] = fields[..] else {
                      bail!("line {n}: expected 3 fields, got {}", fields.len());
                  };
                  let qty: u64 = qty.trim().parse().with_context(|| format!("line {n}: bad qty"))?;
                  let price: u64 = price.trim().parse().with_context(|| format!("line {n}: bad price"))?;
                  count += 1;
                  cents += qty * price;
              }
              println!("orders: {count}");
              println!("revenue: {:.2}", cents as f64 / 100.0);
              Ok(())
          }
