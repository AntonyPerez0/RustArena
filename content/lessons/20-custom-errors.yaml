id: custom-errors
title: Custom Error Types
phase: "Errors and abstraction"
summary: Design error types callers can act on. Error enums, Display messages, the Error trait, Box<dyn Error>, From conversions that let ? do the work, error chains, when to panic, and a first look at the thiserror and anyhow crates.
roadmap: [Custom Error Types and Traits, Error Handling]
steps:
  - title: An enum for everything that can go wrong
    id: custom-errors-1
    text: |
      In the last module, errors were `String` messages. That's quick, but the caller can only *read* a string, not *react* to it. Suppose a banking app wants to offer a smaller amount when the balance is too low, but show "contact support" when the account is frozen. With string errors it would have to compare message text, and the day someone fixes a typo in a message, that code silently breaks.

      The Rust way is an **error enum**: one variant per way the operation can fail, each carrying the data that describes it.

      ```rust run
      #[derive(Debug, PartialEq)]
      enum WithdrawError {
          InvalidAmount,
          InsufficientFunds { balance: u64, requested: u64 },
          AccountFrozen,
      }

      struct Account {
          balance: u64,
          frozen: bool,
      }

      fn withdraw(account: &mut Account, amount: u64) -> Result<u64, WithdrawError> {
          if account.frozen {
              return Err(WithdrawError::AccountFrozen);
          }
          if amount == 0 {
              return Err(WithdrawError::InvalidAmount);
          }
          if amount > account.balance {
              return Err(WithdrawError::InsufficientFunds { balance: account.balance, requested: amount });
          }
          account.balance -= amount;
          Ok(account.balance)
      }

      fn main() {
          let mut acct = Account { balance: 100, frozen: false };
          for amount in [30, 0, 500] {
              match withdraw(&mut acct, amount) {
                  Ok(left) => println!("withdrew {amount}, {left} left"),
                  Err(WithdrawError::InsufficientFunds { balance, requested }) => {
                      println!("short by {}, you can take up to {balance}", requested - balance);
                  }
                  Err(e) => println!("declined: {e:?}"),
              }
          }
          acct.frozen = true;
          println!("{:?}", withdraw(&mut acct, 10));
      }
      ```

      ```output
      withdrew 30, 70 left
      declined: InvalidAmount
      short by 430, you can take up to 70
      Err(AccountFrozen)
      ```

      What the enum buys you:

      - **Callers can match on the variant.** `main` handles `InsufficientFunds` specially and everything else generically, with no string comparisons.
      - **Structured data.** `InsufficientFunds` carries the numbers, so the caller can compute "short by 430" instead of digging numbers out of a message.
      - **The compiler keeps track.** Add a variant later, and every `match` without a catch-all arm becomes a compile error pointing at code that needs updating.
      - **`#[derive(Debug, PartialEq)]`**: `Debug` lets you print the error with `{:?}` (and `main` returning `Result` needs it). `PartialEq` lets tests write `assert_eq!(result, Err(WithdrawError::AccountFrozen))`.

      **Naming:** call the type after the operation (`WithdrawError`, `ParseConfigError`) and don't repeat "Error" in every variant: `WithdrawError::AccountFrozen`, not `WithdrawError::AccountFrozenError`. Clippy's `enum_variant_names` lint warns when all variants end with the same word.

      ### Common mistakes

      - **Forgetting the enum name.** Variants live inside their enum, so they need the `WithdrawError::` prefix:

      ```rust compile_fail
      #[derive(Debug)]
      enum WithdrawError {
          AccountFrozen,
          InvalidAmount,
      }

      fn withdraw(frozen: bool) -> Result<u32, WithdrawError> {
          if frozen {
              return Err(AccountFrozen);
          }
          Err(WithdrawError::InvalidAmount)
      }

      fn main() {
          println!("{:?}", withdraw(true));
      }
      ```

      ```error
      error[E0425]: cannot find value `AccountFrozen` in this scope
      ```

      - **One `Other(String)` variant for everything.** It's the string error again in disguise. A catch-all can be useful for rare cases, but anything callers might handle differently deserves its own variant.
      - **Too many variants.** Variants are for failures the caller can tell apart and act on. Five kinds of "the number was invalid" that every caller treats the same way can be one variant with data.

      **Your turn:** a username must be 1 to 16 characters long and contain only ASCII letters, digits and `_`. Write `validate_username` using the `UsernameError` enum in the starter. Check in this order:

      1. empty: `Err(UsernameError::Empty)`
      2. more than 16 characters (count with `.chars().count()`): `Err(UsernameError::TooLong(length))`
      3. the first character that's not allowed (`c.is_ascii_alphanumeric() || c == '_'` tells you if it is): `Err(UsernameError::InvalidChar(c))`

      A valid name returns `Ok(())`.
    seed: |
      #[derive(Debug, PartialEq)]
      enum UsernameError {
          Empty,
          TooLong(usize),
          InvalidChar(char),
      }

      fn validate_username(name: &str) -> Result<(), UsernameError> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      enum UsernameError {
          Empty,
          TooLong(usize),
          InvalidChar(char),
      }

      fn validate_username(name: &str) -> Result<(), UsernameError> {
          if name.is_empty() {
              return Err(UsernameError::Empty);
          }
          let length = name.chars().count();
          if length > 16 {
              return Err(UsernameError::TooLong(length));
          }
          for c in name.chars() {
              if !(c.is_ascii_alphanumeric() || c == '_') {
                  return Err(UsernameError::InvalidChar(c));
              }
          }
          Ok(())
      }
    hints:
      - "Each check is an `if` that does `return Err(UsernameError::...)`."
      - "For the characters, loop with `for c in name.chars()` and return the first one that fails the test."
      - "If every check passes, the last line is `Ok(())`."
    harness: |
      #[test]
      fn accepts_a_valid_name() {
          assert_eq!(validate_username("ferris_42"), Ok(()), "validate_username(\"ferris_42\")");
      }

      #[test]
      fn rejects_an_empty_name() {
          assert_eq!(validate_username(""), Err(UsernameError::Empty), "validate_username(\"\")");
      }

      #[test]
      fn rejects_a_long_name_with_its_length() {
          let name = "a".repeat(20);
          assert_eq!(validate_username(&name), Err(UsernameError::TooLong(20)), "validate_username(<20 letters>)");
          assert_eq!(validate_username(&"b".repeat(16)), Ok(()), "validate_username(<16 letters>)");
      }

      #[test]
      fn reports_the_first_bad_character() {
          assert_eq!(validate_username("bad name"), Err(UsernameError::InvalidChar(' ')), "validate_username(\"bad name\")");
          assert_eq!(validate_username("crab!?"), Err(UsernameError::InvalidChar('!')), "validate_username(\"crab!?\")");
      }

      #[test]
      fn rejects_non_ascii_letters() {
          assert_eq!(validate_username("zoë"), Err(UsernameError::InvalidChar('ë')), "validate_username(\"zoë\")");
      }
    more:
      - task: |
          A concert sells at most 6 tickets per order. Write the enum `BookingError` with these variants (derive `Debug` and `PartialEq`):

          - `ZeroTickets`
          - `OverLimit { requested: u32, limit: u32 }`
          - `SoldOut { available: u32 }`

          Then write `fn book(available: u32, requested: u32) -> Result<u32, BookingError>` that returns the number of tickets left after the order. Check in this order: 0 requested gives `ZeroTickets`, more than 6 gives `OverLimit` (with `limit: 6`), more than `available` gives `SoldOut`.
        seed: |
          // Write the BookingError enum here.

          fn book(available: u32, requested: u32) -> Result<u32, BookingError> {
              todo!()
          }
        solution: |
          // Write the BookingError enum here.
          #[derive(Debug, PartialEq)]
          enum BookingError {
              ZeroTickets,
              OverLimit { requested: u32, limit: u32 },
              SoldOut { available: u32 },
          }

          fn book(available: u32, requested: u32) -> Result<u32, BookingError> {
              if requested == 0 {
                  return Err(BookingError::ZeroTickets);
              }
              if requested > 6 {
                  return Err(BookingError::OverLimit { requested, limit: 6 });
              }
              if requested > available {
                  return Err(BookingError::SoldOut { available });
              }
              Ok(available - requested)
          }
        hints:
          - "A variant with named fields looks like a struct: `OverLimit { requested: u32, limit: u32 },`."
          - "Field init shorthand works: `BookingError::SoldOut { available }`."
        harness: |
          #[test]
          fn books_tickets() {
              assert_eq!(book(100, 4), Ok(96), "book(100, 4)");
              assert_eq!(book(6, 6), Ok(0), "book(6, 6)");
          }

          #[test]
          fn rejects_zero_tickets() {
              assert_eq!(book(100, 0), Err(BookingError::ZeroTickets), "book(100, 0)");
          }

          #[test]
          fn enforces_the_limit_of_6() {
              assert_eq!(book(100, 9), Err(BookingError::OverLimit { requested: 9, limit: 6 }), "book(100, 9)");
          }

          #[test]
          fn reports_how_many_are_left_when_sold_out() {
              assert_eq!(book(3, 5), Err(BookingError::SoldOut { available: 3 }), "book(3, 5)");
              assert_eq!(book(0, 1), Err(BookingError::SoldOut { available: 0 }), "book(0, 1)");
          }
      - task: |
          Write a password checker from scratch. Define `PasswordError` (derive `Debug` and `PartialEq`) with the variants `TooShort(usize)`, `NoDigit`, `NoUppercase` and `ContainsUsername`, and write `fn check_password(password: &str, username: &str) -> Result<(), PasswordError>`. Check in this order:

          1. fewer than 8 characters: `TooShort(<number of characters>)`
          2. no ASCII digit (`c.is_ascii_digit()`): `NoDigit`
          3. no uppercase letter (`c.is_uppercase()`): `NoUppercase`
          4. the password contains the username, ignoring case: `ContainsUsername`
        seed: |
          fn check_password(password: &str, username: &str) -> Result<(), PasswordError> {
              todo!()
          }
        solution: |
          #[derive(Debug, PartialEq)]
          enum PasswordError {
              TooShort(usize),
              NoDigit,
              NoUppercase,
              ContainsUsername,
          }

          fn check_password(password: &str, username: &str) -> Result<(), PasswordError> {
              let length = password.chars().count();
              if length < 8 {
                  return Err(PasswordError::TooShort(length));
              }
              let mut has_digit = false;
              let mut has_upper = false;
              for c in password.chars() {
                  if c.is_ascii_digit() {
                      has_digit = true;
                  }
                  if c.is_uppercase() {
                      has_upper = true;
                  }
              }
              if !has_digit {
                  return Err(PasswordError::NoDigit);
              }
              if !has_upper {
                  return Err(PasswordError::NoUppercase);
              }
              if password.to_lowercase().contains(&username.to_lowercase()) {
                  return Err(PasswordError::ContainsUsername);
              }
              Ok(())
          }
        hints:
          - "Loop over `password.chars()` once and set two `bool` flags: `has_digit` and `has_upper`."
          - "For the username check, lowercase both: `password.to_lowercase().contains(&username.to_lowercase())`."
        harness: |
          #[test]
          fn accepts_a_strong_password() {
              assert_eq!(check_password("Crab2024!", "ferris"), Ok(()), "check_password(\"Crab2024!\", \"ferris\")");
          }

          #[test]
          fn rejects_a_short_password_with_its_length() {
              assert_eq!(check_password("Ab1", "ferris"), Err(PasswordError::TooShort(3)), "check_password(\"Ab1\", \"ferris\")");
          }

          #[test]
          fn needs_a_digit() {
              assert_eq!(check_password("NoDigitsHere", "ferris"), Err(PasswordError::NoDigit), "check_password(\"NoDigitsHere\", \"ferris\")");
          }

          #[test]
          fn needs_an_uppercase_letter() {
              assert_eq!(check_password("lowercase99", "ferris"), Err(PasswordError::NoUppercase), "check_password(\"lowercase99\", \"ferris\")");
          }

          #[test]
          fn rejects_the_username_in_any_case() {
              assert_eq!(check_password("FERRIS2000x", "ferris"), Err(PasswordError::ContainsUsername), "check_password(\"FERRIS2000x\", \"ferris\")");
          }

  - title: "Display: messages for people"
    id: custom-errors-2
    text: |
      `{:?}` prints `InsufficientFunds { balance: 70, requested: 500 }`. That's useful in a log for developers, but a customer should see `insufficient funds: balance 70, requested 500`. The `{}` placeholder uses a different format, called **Display**, and for your own types you write it yourself (you did it for `Money` in module 18). Error types work the same way.

      Display is a **trait**: a named set of methods that a type promises to have (module 22 covers traits properly). You make `{}` work for your type by **implementing** the Display trait for it. The recipe always has the same shape:

      ```rust run
      use std::fmt;

      #[derive(Debug)]
      enum WithdrawError {
          InvalidAmount,
          InsufficientFunds { balance: u64, requested: u64 },
          AccountFrozen,
      }

      impl fmt::Display for WithdrawError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  WithdrawError::InvalidAmount => write!(f, "amount must be greater than zero"),
                  WithdrawError::InsufficientFunds { balance, requested } => {
                      write!(f, "insufficient funds: balance {balance}, requested {requested}")
                  }
                  WithdrawError::AccountFrozen => write!(f, "account is frozen"),
              }
          }
      }

      fn main() {
          let errors = [
              WithdrawError::InvalidAmount,
              WithdrawError::InsufficientFunds { balance: 70, requested: 500 },
              WithdrawError::AccountFrozen,
          ];
          for e in &errors {
              println!("declined: {e}");
          }
          let message = errors[2].to_string();
          println!("{message:?} has {} characters", message.len());
          println!("{:?}", errors[0]);
      }
      ```

      ```output
      declined: amount must be greater than zero
      declined: insufficient funds: balance 70, requested 500
      declined: account is frozen
      "account is frozen" has 17 characters
      InvalidAmount
      ```

      Piece by piece:

      - `use std::fmt;` brings the formatting module into scope, so you can write `fmt::Display` instead of `std::fmt::Display`.
      - `impl fmt::Display for WithdrawError { ... }` reads "here's how a `WithdrawError` is displayed".
      - `fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result` is the one method Display requires. The signature is fixed by the trait: copy it exactly. (Module 18 and the standard docs write `fmt::Formatter<'_>`; the `'_` is a lifetime placeholder, which module 24 explains. Both forms compile and mean the same thing.)
      - `write!(f, ...)` works like `format!`, but writes the text into the formatter `f`. It returns a `fmt::Result`, so it's the value of each `match` arm, and of the whole method.
      - Once Display exists, `{}`, `format!` and `.to_string()` all work. `{:?}` still uses the derived Debug.

      **Workplace note:** the standard library's documentation for errors recommends short, lowercase messages without a trailing period, like its own `invalid digit found in string`. Messages often get embedded in longer ones (`error: could not load config: invalid digit found in string`), and that reads well only if each piece is a lowercase fragment.

      ### Common mistakes

      - **Printing with `{}` before implementing Display:**

      ```rust compile_fail
      #[derive(Debug)]
      enum WithdrawError {
          AccountFrozen,
      }

      fn main() {
          let e = WithdrawError::AccountFrozen;
          println!("declined: {e}");
      }
      ```

      ```error
      error[E0277]: `WithdrawError` doesn't implement `std::fmt::Display`
      ```

      - **A `;` after `write!` in a match arm.** The arm must *return* the `fmt::Result`. In an arm without braces the `;` is a syntax error (`` `match` arm body without braces ``); inside braces, `{ write!(...); }` returns `()` and you get `mismatched types`.
      - **Using `println!` inside `fmt`.** That prints to the screen right away instead of producing the text. Always `write!(f, ...)`.
      - **Forgetting `use std::fmt;`** gives ``cannot find module or crate `fmt` ``. Either add the `use` or write the full path `std::fmt::Display`.

      **Your turn:** implement Display for `TicketError` so that:

      - `SoldOut` displays as `the event is sold out`
      - `TooMany { requested: 9, max: 6 }` displays as `cannot buy 9 tickets, the limit is 6`
      - `UnknownEvent("Rust Fest")` displays as `no event called 'Rust Fest'`
    seed: |
      use std::fmt;

      #[derive(Debug, PartialEq)]
      enum TicketError {
          SoldOut,
          TooMany { requested: u32, max: u32 },
          UnknownEvent(String),
      }

      impl fmt::Display for TicketError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              todo!()
          }
      }
    solution: |
      use std::fmt;

      #[derive(Debug, PartialEq)]
      enum TicketError {
          SoldOut,
          TooMany { requested: u32, max: u32 },
          UnknownEvent(String),
      }

      impl fmt::Display for TicketError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  TicketError::SoldOut => write!(f, "the event is sold out"),
                  TicketError::TooMany { requested, max } => {
                      write!(f, "cannot buy {requested} tickets, the limit is {max}")
                  }
                  TicketError::UnknownEvent(name) => write!(f, "no event called '{name}'"),
              }
          }
      }
    require:
      - pattern: 'write!\('
        message: Write the text into the formatter with `write!(f, ...)`.
    hints:
      - "`match self { ... }` with one arm per variant."
      - "Each arm is a `write!(f, \"...\")` without a semicolon, for example `TicketError::SoldOut => write!(f, \"the event is sold out\"),`."
      - "Bind the fields in the pattern: `TicketError::TooMany { requested, max } => write!(f, \"cannot buy {requested} tickets, the limit is {max}\")`."
    harness: |
      #[test]
      fn displays_sold_out() {
          assert_eq!(TicketError::SoldOut.to_string(), "the event is sold out", "TicketError::SoldOut.to_string()");
      }

      #[test]
      fn displays_too_many_with_the_numbers() {
          let e = TicketError::TooMany { requested: 9, max: 6 };
          assert_eq!(e.to_string(), "cannot buy 9 tickets, the limit is 6", "TooMany {{ requested: 9, max: 6 }}.to_string()");
      }

      #[test]
      fn displays_the_unknown_event_name() {
          let e = TicketError::UnknownEvent(String::from("Rust Fest"));
          assert_eq!(e.to_string(), "no event called 'Rust Fest'", "UnknownEvent(\"Rust Fest\").to_string()");
      }

      #[test]
      fn works_inside_format() {
          let msg = format!("error: {}", TicketError::SoldOut);
          assert_eq!(msg, "error: the event is sold out", "format!(\"error: {{}}\", TicketError::SoldOut)");
      }
