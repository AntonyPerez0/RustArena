          use std::num::ParseIntError;

          #[derive(Debug, PartialEq)]
          enum PaymentError {
              Declined { balance: u32, amount: u32 },
          }

          fn pay(balance: u32, amount: u32) -> Result<u32, PaymentError> {
              if amount > balance {
                  return Err(PaymentError::Declined { balance, amount });
              }
              Ok(balance - amount)
          }

