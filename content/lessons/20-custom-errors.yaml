      fn applies_known_codes() {
          assert_eq!(apply_discount(1000, "SAVE10"), Ok(900), "apply_discount(1000, \"SAVE10\")");
          assert_eq!(apply_discount(2000, "SAVE25"), Ok(1500), "apply_discount(2000, \"SAVE25\")");
          assert_eq!(apply_discount(999, "HALF"), Ok(500), "apply_discount(999, \"HALF\")");
      }

      #[test]
      fn rejects_an_unknown_code() {
          assert_eq!(apply_discount(1000, "FREE"), Err(DiscountError::UnknownCode(String::from("FREE"))), "apply_discount(1000, \"FREE\")");
      }

      #[test]
      fn codes_are_case_sensitive() {
          assert_eq!(apply_discount(1000, "save10"), Err(DiscountError::UnknownCode(String::from("save10"))), "apply_discount(1000, \"save10\")");
      }

      #[test]
      fn rejects_an_empty_code() {
          assert_eq!(apply_discount(500, ""), Err(DiscountError::UnknownCode(String::new())), "apply_discount(500, \"\")");
      }
