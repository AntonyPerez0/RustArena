      - task: |
          Write a grading function with its own error type, from scratch.

          - `GradeError` (derive `Debug` and `PartialEq`) has the variants `Negative(i32)` and `AboveMax(i32)`. Its Display messages are `score cannot be negative: -5` and `score 105 is above the maximum of 100`.
          - `fn letter_grade(score: i32) -> Result<char, GradeError>`: a score below 0 or above 100 is an error; otherwise 90 and up is `'A'`, 80 and up `'B'`, 70 and up `'C'`, 60 and up `'D'`, anything lower `'F'`.
        seed: |
          use std::fmt;

          fn letter_grade(score: i32) -> Result<char, GradeError> {
              todo!()
          }
        solution: |
          use std::fmt;

          #[derive(Debug, PartialEq)]
          enum GradeError {
              Negative(i32),
              AboveMax(i32),
          }

          impl fmt::Display for GradeError {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      GradeError::Negative(s) => write!(f, "score cannot be negative: {s}"),
                      GradeError::AboveMax(s) => write!(f, "score {s} is above the maximum of 100"),
                  }
              }
          }

          fn letter_grade(score: i32) -> Result<char, GradeError> {
              if score < 0 {
                  return Err(GradeError::Negative(score));
              }
              if score > 100 {
                  return Err(GradeError::AboveMax(score));
              }
              let grade = match score {
                  90.. => 'A',
                  80.. => 'B',
                  70.. => 'C',
                  60.. => 'D',
                  _ => 'F',
              };
              Ok(grade)
          }
        hints:
          - "Define the enum and its Display impl first, like `TicketError` above."
          - "After the two error checks, a `match` with range patterns (`90.. => 'A'`) or an `if`/`else if` chain picks the letter."
        harness: |
          #[test]
          fn gives_letter_grades() {
              assert_eq!(letter_grade(95), Ok('A'), "letter_grade(95)");
              assert_eq!(letter_grade(80), Ok('B'), "letter_grade(80)");
              assert_eq!(letter_grade(79), Ok('C'), "letter_grade(79)");
              assert_eq!(letter_grade(60), Ok('D'), "letter_grade(60)");
              assert_eq!(letter_grade(0), Ok('F'), "letter_grade(0)");
              assert_eq!(letter_grade(100), Ok('A'), "letter_grade(100)");
          }

          #[test]
          fn rejects_negative_scores() {
              assert_eq!(letter_grade(-5), Err(GradeError::Negative(-5)), "letter_grade(-5)");
          }

          #[test]
          fn rejects_scores_above_100() {
              assert_eq!(letter_grade(105), Err(GradeError::AboveMax(105)), "letter_grade(105)");
          }

          #[test]
          fn errors_have_readable_messages() {
              assert_eq!(GradeError::Negative(-5).to_string(), "score cannot be negative: -5", "GradeError::Negative(-5).to_string()");
              assert_eq!(GradeError::AboveMax(105).to_string(), "score 105 is above the maximum of 100", "GradeError::AboveMax(105).to_string()");
          }

  - title: The Error trait and Box<dyn Error>
    id: custom-errors-3
    text: |
      The standard library has a trait that marks a type as "an error": `std::error::Error`. Implementing it is one line, because all of its methods have default versions:

      ```rust
      impl std::error::Error for WithdrawError {}
      ```

      There's one requirement: the type must already implement `Debug` and `Display`. That's the contract of an error in Rust: it can be shown to developers (`{:?}`) and to users (`{}`).

      Why bother? Because code that works with *any* error, from the standard library, from crates like `anyhow`, and from your own programs, works through this trait. `ParseIntError`, `ParseFloatError` and `std::io::Error` all implement it.

      ### Box<dyn Error>: "some error"

      A function that can fail in several different ways, with different error types, needs one return type that fits them all. The standard answer is `Box<dyn Error>`:

      - `dyn Error` means "a value of some type that implements `Error`; which one is decided at run time". Module 25 covers these **trait objects**.
      - `Box<...>` puts that value on the heap, because different error types have different sizes. Module 29 covers `Box`.

      Together: `Result<T, Box<dyn Error>>` means "a `T`, or any kind of error". And `?` converts any error type that implements `Error` into a `Box<dyn Error>` for you. Even a plain `&str` or `String` message converts.

      ```rust run
      use std::error::Error;
      use std::fmt;

      #[derive(Debug)]
      struct EmptyLine;

      impl fmt::Display for EmptyLine {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "line is empty")
          }
      }

      impl Error for EmptyLine {}

      fn parse_order(line: &str) -> Result<(String, u32), Box<dyn Error>> {
          let line = line.trim();
          if line.is_empty() {
              return Err(Box::new(EmptyLine));
          }
          let (item, qty) = line.split_once(',').ok_or("expected ITEM,QTY")?;
          let qty: u32 = qty.trim().parse()?;
          Ok((item.to_string(), qty))
      }

      fn main() {
          for line in ["apples, 3", "pears,many", "", "plums"] {
              match parse_order(line) {
                  Ok((item, qty)) => println!("{qty} x {item}"),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
