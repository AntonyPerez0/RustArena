        solution: |
          use std::num::ParseIntError;

          // PortError, Port, and impl Port { parse, number }
          #[derive(Debug, PartialEq)]
          enum PortError {
              NotANumber(ParseIntError),
              Zero,
              Reserved(u16),
          }

          struct Port(u16);

          impl Port {
              fn parse(text: &str) -> Result<Port, PortError> {
                  let n: u16 = text.trim().parse().map_err(PortError::NotANumber)?;
                  if n == 0 {
                      return Err(PortError::Zero);
                  }
                  if n < 1024 {
                      return Err(PortError::Reserved(n));
                  }
                  Ok(Port(n))
              }

              fn number(&self) -> u16 {
                  self.0
              }
          }
        hints:
          - "`text.trim().parse::<u16>().map_err(PortError::NotANumber)?` wraps the parse error in the variant."
          - "Check `n == 0` before `n < 1024`, so 0 gets its own error."
          - "`number` is just `self.0`."
        harness: |
          #[test]
          fn accepts_a_normal_port() {
              assert_eq!(Port::parse("8080").map(|p| p.number()), Ok(8080), "Port::parse(\"8080\")");
              assert_eq!(Port::parse(" 1024\n").map(|p| p.number()), Ok(1024), "Port::parse(\" 1024\\n\")");
          }

          #[test]
          fn rejects_zero() {
              assert_eq!(Port::parse("0").map(|p| p.number()), Err(PortError::Zero), "Port::parse(\"0\")");
          }

          #[test]
          fn rejects_reserved_ports() {
              assert_eq!(Port::parse("80").map(|p| p.number()), Err(PortError::Reserved(80)), "Port::parse(\"80\")");
          }

          #[test]
          fn rejects_text() {
              let result = Port::parse("http").map(|p| p.number());
              assert!(matches!(result, Err(PortError::NotANumber(_))), "Port::parse(\"http\") should be Err(NotANumber(..)), got {result:?}");
          }

  - title: A first look at thiserror and anyhow
    id: custom-errors-7
    text: |
      Writing Display, Error, `source` and `From` by hand is a lot of repetitive code. Two crates (Rust libraries) remove almost all of it, and you'll find them in most Rust codebases at work. Add them to a project's `Cargo.toml`:

      ```toml
      [dependencies]
      thiserror = "2"
      anyhow = "1"
      ```

      ### thiserror: error enums without the boilerplate

      `thiserror` provides a **derive macro**, like `#[derive(Debug)]`, that writes the Display, Error and From implementations for you:

      ```rust run
      use std::num::ParseIntError;
      use thiserror::Error;

      #[derive(Debug, Error)]
      enum ConfigError {
          #[error("missing '=' in line {0:?}")]
          MissingEquals(String),
          #[error("invalid number")]
          BadNumber(#[from] ParseIntError),
      }

      fn parse_line(line: &str) -> Result<(String, u32), ConfigError> {
          let (key, value) = line
              .split_once('=')
              .ok_or_else(|| ConfigError::MissingEquals(line.to_string()))?;
          let value: u32 = value.trim().parse()?;
          Ok((key.trim().to_string(), value))
      }

      fn main() {
          for line in ["timeout = 30", "retries = lots", "verbose"] {
              match parse_line(line) {
                  Ok((key, value)) => println!("{key} = {value}"),
                  Err(ConfigError::BadNumber(cause)) => println!("invalid number ({cause})"),
                  Err(e) => println!("error: {e}"),
              }
          }
      }
      ```

      ```output
      timeout = 30
      invalid number (invalid digit found in string)
      error: missing '=' in line "verbose"
      ```

      - `#[derive(Debug, Error)]`: `Error` here is thiserror's derive (brought in by `use thiserror::Error;`). It implements `std::error::Error` for the enum.
      - `#[error("...")]` on each variant is its Display message. `{0}` refers to the first field of a tuple variant; named fields are used by name, like `#[error("cannot buy {requested} tickets")]`. Format specs like `{0:?}` work too.
      - `#[from]` on a field writes `impl From<ParseIntError> for ConfigError`, so `?` converts, *and* makes `source()` return that field.

      It's still an ordinary enum: callers match on it exactly as before. That's why thiserror is the usual choice for **libraries** and for any module whose callers need to tell errors apart.

      ### anyhow: one error type for applications

      In application code you often don't match on errors at all: you add context and report them. `anyhow` gives you one type, `anyhow::Error`, that holds any error (like `Box<dyn Error>`, but with more features), and the alias `anyhow::Result<T>` for `Result<T, anyhow::Error>`.

      ```rust run
      use anyhow::{bail, Context, Result};

      fn parse_port(text: &str) -> Result<u16> {
          let port: u16 = text
              .trim()
              .parse()
              .with_context(|| format!("invalid port {text:?}"))?;
          if port < 1024 {
              bail!("port {port} is reserved");
          }
          Ok(port)
      }

      fn main() {
          for text in ["8080", "80", "http"] {
              match parse_port(text) {
                  Ok(port) => println!("listening on {port}"),
                  Err(e) => println!("error: {e:#}"),
              }
          }
      }
      ```

      ```output
      listening on 8080
      error: port 80 is reserved
      error: invalid port "http": invalid digit found in string
      ```

      - `use anyhow::Result;` replaces the standard `Result` in this file with anyhow's one-parameter version. `Result<u16>` means `Result<u16, anyhow::Error>`.
      - `.with_context(|| ...)` (from the `Context` trait) wraps the error with a message saying what you were doing. The original error becomes its source. `.context("fixed text")` does the same with a fixed message.
      - `bail!("...")` returns an error with that message right away: short for `return Err(anyhow!("..."))`.
      - `{:#}` prints the whole chain joined by `: `. Plain `{}` prints only the outermost message (`invalid port "http"`).
      - `fn main() -> anyhow::Result<()>` is a very common signature: an error at the end prints its full chain.

      ### Which one?

      - **Library, or callers need to match on errors:** thiserror. Your error enum is part of your API.
      - **Application code, where errors are reported rather than handled:** anyhow, with plenty of `context`.
      - Many projects use both: thiserror inside their library modules, anyhow in `main` and the command handlers.

      Module 39 goes deep into both crates (`ensure!`, error chains in `main`, mixing them, designing error types for a real service).

      ### Common mistakes

      - **A thiserror variant without `#[error(...)]`.** Then no Display gets written and the enum doesn't compile as an error. Every variant needs a message.
      - **anyhow in a library's public API.** Callers can't match on an `anyhow::Error`, so they can't react to specific failures. Use it in applications.
      - **Context that repeats the cause.** `.context("parse error")` adds nothing to `invalid digit found in string`. Say what you were doing: `.context("reading the port from config.toml")`.

      **Your turn:** rewrite `TicketError` with thiserror. Add an `#[error(...)]` attribute to each variant so that:

      - `SoldOut` displays as `the event is sold out`
      - `TooMany { requested: 9, max: 6 }` displays as `cannot buy 9 tickets, the limit is 6`
      - `UnknownEvent("Rust Fest")` displays as `no event called 'Rust Fest'`
    seed: |
      use thiserror::Error;

      #[derive(Debug, Error, PartialEq)]
      enum TicketError {
          // Add #[error("...")] above each variant.
          SoldOut,
          TooMany { requested: u32, max: u32 },
          UnknownEvent(String),
      }
    solution: |
      use thiserror::Error;

      #[derive(Debug, Error, PartialEq)]
      enum TicketError {
          // Add #[error("...")] above each variant.
          #[error("the event is sold out")]
          SoldOut,
          #[error("cannot buy {requested} tickets, the limit is {max}")]
          TooMany { requested: u32, max: u32 },
          #[error("no event called '{0}'")]
          UnknownEvent(String),
      }
    forbid:
      - pattern: 'impl\s+(std::)?(fmt::)?Display'
        message: Let thiserror write Display from the `#[error(...)]` attributes.
    hints:
      - "Put the attribute on the line above the variant: `#[error(\"the event is sold out\")]`."
      - "Named fields go in braces by name: `#[error(\"cannot buy {requested} tickets, the limit is {max}\")]`."
      - "A tuple variant's first field is `{0}`: `#[error(\"no event called '{0}'\")]`."
    harness: |
      #[test]
      fn displays_sold_out() {
          assert_eq!(TicketError::SoldOut.to_string(), "the event is sold out", "TicketError::SoldOut.to_string()");
      }

      #[test]
      fn displays_too_many_with_the_numbers() {
          let e = TicketError::TooMany { requested: 9, max: 6 };
          assert_eq!(e.to_string(), "cannot buy 9 tickets, the limit is 6", "TooMany {{ requested: 9, max: 6 }}.to_string()");
      }

      #[test]
      fn displays_the_unknown_event_name() {
          let e = TicketError::UnknownEvent(String::from("Rust Fest"));
          assert_eq!(e.to_string(), "no event called 'Rust Fest'", "UnknownEvent(\"Rust Fest\").to_string()");
      }

      #[test]
      fn is_a_standard_error() {
          let boxed: Box<dyn std::error::Error> = Box::new(TicketError::SoldOut);
          assert_eq!(boxed.to_string(), "the event is sold out", "Box<dyn Error> holding SoldOut");
      }
    more:
      - task: |
          Write `ScoreError` with thiserror (derive `Debug` and `Error`):

          - `MissingColon`, displayed as `expected NAME:POINTS`
          - `BadPoints`, wrapping a `ParseIntError` with `#[from]`, displayed as `points are not a number`

          Then write `fn parse_score(line: &str) -> Result<(String, u32), ScoreError>` for lines like `ferris:120` (trim both parts), using `?` for the parse.
        seed: |
          use std::num::ParseIntError;
          use thiserror::Error;

          fn parse_score(line: &str) -> Result<(String, u32), ScoreError> {
              todo!()
          }
        solution: |
          use std::num::ParseIntError;
          use thiserror::Error;

          #[derive(Debug, Error)]
          enum ScoreError {
              #[error("expected NAME:POINTS")]
              MissingColon,
              #[error("points are not a number")]
              BadPoints(#[from] ParseIntError),
          }

          fn parse_score(line: &str) -> Result<(String, u32), ScoreError> {
              let (name, points) = line.split_once(':').ok_or(ScoreError::MissingColon)?;
              let points: u32 = points.trim().parse()?;
              Ok((name.trim().to_string(), points))
          }
        forbid:
          - pattern: 'impl\s+From'
            message: Let `#[from]` write the `From` implementation.
        hints:
          - "`BadPoints(#[from] ParseIntError),` with `#[error(\"points are not a number\")]` above it."
          - "`line.split_once(':').ok_or(ScoreError::MissingColon)?`, then `points.trim().parse()?`."
        harness: |
          use std::error::Error as _;

          #[test]
          fn parses_a_score() {
              let (name, points) = parse_score(" ferris : 120 ").expect("a valid line");
              assert_eq!((name.as_str(), points), ("ferris", 120), "parse_score(\" ferris : 120 \")");
          }

          #[test]
          fn reports_a_missing_colon() {
              let err = parse_score("ferris 120").unwrap_err();
              assert_eq!(err.to_string(), "expected NAME:POINTS", "parse_score(\"ferris 120\") error message");
          }

          #[test]
          fn wraps_the_parse_error() {
              let err = parse_score("ferris:lots").unwrap_err();
              assert_eq!(err.to_string(), "points are not a number", "parse_score(\"ferris:lots\") error message");
              let cause = err.source().map(|c| c.to_string());
              assert_eq!(cause, Some(String::from("invalid digit found in string")), "its source");
          }
      - task: |
          Use anyhow. Write `fn load_limit(text: &str) -> anyhow::Result<u32>` that reads a rate limit:

          - parse the trimmed text as a `u32`; on failure add context with `with_context` so that the full chain (`{:#}`) is `limit "abc" is not a number: invalid digit found in string` (the original text, in quotes, via `{text:?}`)
          - a limit of `0` fails with `bail!` and the message `limit must be at least 1`
        seed: |
          use anyhow::{bail, Context};

          fn load_limit(text: &str) -> anyhow::Result<u32> {
              todo!()
          }
        solution: |
          use anyhow::{bail, Context};

          fn load_limit(text: &str) -> anyhow::Result<u32> {
              let limit: u32 = text
                  .trim()
                  .parse()
                  .with_context(|| format!("limit {text:?} is not a number"))?;
              if limit == 0 {
                  bail!("limit must be at least 1");
              }
              Ok(limit)
          }
        require:
          - pattern: '\.(with_)?context\('
            message: Add context to the parse error with `with_context` (or `context`).
          - pattern: 'bail!'
            message: Use `bail!` for the zero limit.
        hints:
          - "`.with_context(|| format!(\"limit {text:?} is not a number\"))?` wraps the parse error."
          - "`if limit == 0 { bail!(\"limit must be at least 1\"); }`"
        harness: |
          #[test]
          fn reads_a_limit() {
              assert_eq!(load_limit(" 25 ").unwrap(), 25, "load_limit(\" 25 \")");
          }

          #[test]
          fn explains_a_bad_number() {
              let err = load_limit("abc").unwrap_err();
              assert_eq!(format!("{err:#}"), "limit \"abc\" is not a number: invalid digit found in string", "format!(\"{{:#}}\", load_limit(\"abc\").unwrap_err())");
          }

          #[test]
          fn rejects_zero() {
              let err = load_limit("0").unwrap_err();
              assert_eq!(format!("{err:#}"), "limit must be at least 1", "format!(\"{{:#}}\", load_limit(\"0\").unwrap_err())");
          }

          #[test]
          fn keeps_the_original_text_in_the_message() {
              let err = load_limit("").unwrap_err();
              assert_eq!(err.to_string(), "limit \"\" is not a number", "load_limit(\"\").unwrap_err().to_string()");
          }
