        solution: |
          use std::io::Read;

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let mut items: Vec<(String, f64)> = Vec::new();
              for line in input.lines() {
                  let parts: Vec<&str> = line.split_whitespace().collect();
                  if parts.len() == 2 {
                      items.push((parts[0].to_string(), parts[1].parse().unwrap()));
                  }
              }
              // keep, sort and print
              items.retain(|(_, price)| *price <= 20.0);
              items.sort_by(|a, b| a.1.total_cmp(&b.1));
              if items.is_empty() {
                  println!("nothing affordable");
              }
              for (name, price) in &items {
                  println!("{name}: {price:.2}");
              }
          }
        require:
          - pattern: '\.retain\('
            message: Drop the expensive items with `items.retain(|...| ...)`.
          - pattern: '\.sort_by\('
            message: Sort with `items.sort_by(|a, b| a.1.total_cmp(&b.1))`.
        hints:
          - "Each item is a tuple `(name, price)`. `items.retain(|(_, price)| *price <= 20.0);` keeps the cheap ones."
          - "`items.sort_by(|a, b| a.1.total_cmp(&b.1));` sorts by the price field."
        tests:
          - stdin: "apple 1.5\nbook 25\npen 2.25\nlamp 19.99\n"
            expect: "apple: 1.50\npen: 2.25\nlamp: 19.99"
          - stdin: "tv 300\nsofa 999.5\n"
            hidden: true
          - stdin: "mug 20\ncard 20.01\nsticker 0.5\n"
            hidden: true
