id: ownership
title: Ownership
phase: "Ownership"
summary: Where your data lives (stack and heap), who is responsible for freeing it, and why assigning a String moves it. The rules that make Rust memory-safe without a garbage collector.
roadmap: [Ownership Rules & Memory Safety, "Deep Dive: Stack vs Heap"]
steps:
  - title: "Stack and heap: where values live"
    id: ownership-1
    text: |
      Every value your program works with is stored somewhere in the computer's memory. To understand Rust's most famous feature, **ownership**, you first need a picture of the two places a running program keeps its data: the **stack** and the **heap**.

      ### The stack

      The **stack** holds the local variables of the functions that are running right now. Each function call gets its own block of space, a **stack frame**, big enough for all of its variables. When the function returns, its whole frame is thrown away in one go. Making and removing frames is just moving a pointer up and down, so the stack is extremely fast.

      The catch: everything on the stack must have a **size known at compile time**. An `i32` is always 4 bytes, an `f64` 8 bytes, an array `[i32; 3]` 12 bytes. The compiler lays out each frame before the program ever runs.

      ### The heap

      What about text the user types in, or a list that grows while the program runs? Their size isn't known until run time, and it can change. That data goes on the **heap**: a big pool of memory where the program can ask for a block of any size while it runs. Asking for a block is called **allocating**. The **allocator** finds free space and hands back its address, a **pointer**. When the program is done with the block, it must give it back (**free** it) so the space can be reused.

      A `String` uses both. The text lives on the heap. The `String` value itself is a small, fixed-size **handle** on the stack holding three numbers: a pointer to the text, its **length** (bytes in use) and its **capacity** (bytes reserved).

      ```text
      fn main() {
          let lives = 3;
          let name = String::from("Ferris");
      }

            STACK (main's frame)                     HEAP
           ┌───────┬──────────────────┐
           │ lives │ 3                │
           ├───────┼──────────────────┤          ┌───┬───┬───┬───┬───┬───┐
           │ name  │ ptr  ────────────┼────────► │ F │ e │ r │ r │ i │ s │
           │       │ len       6      │          └───┴───┴───┴───┴───┴───┘
           │       │ capacity  6      │
           └───────┴──────────────────┘
      ```

      A `Vec` is built the same way: pointer, length and capacity on the stack, the elements on the heap. That's why both can grow: when they run out of capacity, they allocate a bigger block on the heap and move their contents there, while the handle on the stack keeps the same size.

      You can check sizes with `std::mem::size_of::<T>()`, which tells you how many bytes a value of type `T` takes on the stack. The `::<T>` part names the type you're asking about, and `use std::mem::size_of;` at the top lets you write `size_of` instead of the full path.

      ```rust run
      use std::mem::size_of;

      fn main() {
          let short = String::from("hi");
          let long = String::from("a much longer piece of text");
          println!("i32: {} bytes", size_of::<i32>());
          println!("[i32; 3]: {} bytes", size_of::<[i32; 3]>());
          println!("String handle: {} bytes", size_of::<String>());
          println!("text on the heap: {} and {} bytes", short.len(), long.len());
      }
      ```

      ```output
      i32: 4 bytes
      [i32; 3]: 12 bytes
      String handle: 24 bytes
      text on the heap: 2 and 27 bytes
      ```

      The handle is 24 bytes (three 8-byte numbers on a 64-bit machine) whether the text is 2 bytes or 2 gigabytes. The text itself is somewhere else.

      ### Who cleans up the heap?

      Stack memory cleans itself up when a function returns. Heap memory doesn't: something has to free each block, **exactly once**, **after** the last time it's used. Programming languages answer this in three ways:

      | Approach | Languages | The catch |
      |---|---|---|
      | You free memory by hand | C, C++ (`malloc`/`free`, `new`/`delete`) | Forget it: a **memory leak**. Free twice: a **double free**. Use the memory after freeing it: a **use-after-free**. These bugs crash programs and are the classic source of security holes. |
      | A **garbage collector** finds unused memory while the program runs | Java, Python, Go, JavaScript, C# | Safe, but it costs CPU time and memory, and can pause the program at moments you don't control. |
      | **Ownership**: the compiler works out where to free, using rules it checks at compile time | Rust | You have to follow the rules. That's what this module teaches. |

      Microsoft and Google's Chrome team have both reported that around 70% of their serious security bugs are memory-safety bugs like these. Rust's ownership rules make use-after-free and double free impossible in normal (safe) Rust, with no garbage collector and no run-time cost: the compiler inserts the code that frees memory exactly where it belongs.

      ### Common mistakes

      - **Thinking a `String` holds its text inline.** It holds a *pointer* to the text. Copying the handle doesn't copy the text, which is exactly why the next steps matter.
      - **Thinking string literals live on the heap.** `"hi"` is stored in the program's binary, read-only. `String::from("hi")` copies those bytes into a new heap block that the `String` is responsible for.
      - **Mixing up length and capacity.** `.len()` is how many bytes are in use. The capacity is how many are reserved, so that pushing more text doesn't have to allocate every time.

      **Your turn:** fill in the blanks so the program prints the size of the `String` handle (the type name goes inside `::<>`) and the number of bytes the city's text takes on the heap. It should print:

      ```
      handle: 24 bytes
      city text: 4 bytes
      motto text: 17 bytes
      ```
    fill: |
      fn main() {
          let city = String::from("Oslo");
          let motto = String::from("Rust never sleeps");
          // The handle on the stack: always the same size.
          println!("handle: {} bytes", std::mem::size_of::<[[String]]>());
          // The text on the heap: .len() counts its bytes.
          println!("city text: {} bytes", city.[[len()]]);
          println!("motto text: {} bytes", motto.len());
      }
    hints:
      - The first blank is a type name, the type of `city` and `motto`.
      - "The second blank is the method that counts bytes in use, with its parentheses: the same one used on the next line."
    tests:
      - expect: "handle: 24 bytes\ncity text: 4 bytes\nmotto text: 17 bytes"
    more:
      - task: |
          A `Vec` is a handle too. Fill in the type on the second line (a vector of `i32`) and the method that counts the vector's elements, so the program prints:

          ```
          array: 16 bytes
          Vec handle: 24 bytes
          8 readings, still a 24-byte handle
          ```

          Notice the difference: the array's numbers are all on the stack (4 × 4 bytes), while the Vec's numbers are on the heap.
        fill: |
          fn main() {
              // An array lives entirely on the stack: 4 numbers of 4 bytes each.
              println!("array: {} bytes", std::mem::size_of::<[i32; 4]>());
              // A Vec is a handle (pointer, length, capacity); its elements are on the heap.
              println!("Vec handle: {} bytes", std::mem::size_of::<[[Vec<i32>]]>());
              let readings = vec![12, 15, 11, 14, 13, 16, 12, 10];
              println!("{} readings, still a {}-byte handle", readings.[[len()]], std::mem::size_of::<Vec<i32>>());
          }
        hints:
          - "A vector of `i32` is written `Vec<i32>`: it's the same type as on the last line."
          - "Vectors count their elements with `.len()`, like strings."
        tests:
          - expect: "array: 16 bytes\nVec handle: 24 bytes\n8 readings, still a 24-byte handle"
      - task: |
          A `String` can grow because its text is on the heap. Starting from the empty `String` in the starter code, write a `for` loop that runs 4 times. Each time, push `"=="` onto `bar` with `push_str` and print `bar`. After the loop, print its length. The output should be:

          ```
          ==
          ====
          ======
          ========
          bar: 8 bytes
          ```
        seed: |
          fn main() {
              let mut bar = String::new();
              // Your loop here, then print the length.
          }
        solution: |
          fn main() {
              let mut bar = String::new();
              // Your loop here, then print the length.
              for _ in 0..4 {
                  bar.push_str("==");
                  println!("{}", bar);
              }
              println!("bar: {} bytes", bar.len());
          }
        require:
          - pattern: '\.push_str\('
            message: Grow the String with `push_str`.
          - pattern: '\bfor\b'
            message: Use a `for` loop to push four times.
        hints:
          - "`for _ in 0..4 { ... }` runs the body 4 times; `_` means you don't need the loop counter."
          - "Inside the loop: `bar.push_str(\"==\");` then `println!(\"{}\", bar);`. After it: `println!(\"bar: {} bytes\", bar.len());`"
        tests:
          - expect: "==\n====\n======\n========\nbar: 8 bytes"

  - title: Owners and scope
    id: ownership-2
    text: |
      Rust's answer to "who frees the heap memory, and when?" is a short set of rules. Learn them by heart: everything in this module and the next two follows from them.

      > **The ownership rules**
      >
      > 1. Each value in Rust has an **owner**: the variable that holds it.
      > 2. There can only be **one owner at a time**.
      > 3. When the owner goes **out of scope**, the value is **dropped**: Rust frees its memory.

      A variable's **scope** is the stretch of code where it can be used: from its `let` to the `}` that closes the block it was declared in. A **block** is any `{ ... }`: a function body, an `if` branch, a loop body, or a bare pair of braces.

      ```rust run
      fn main() {
          let arena = String::from("Crab Arena");     // arena is valid from here...
          {
              let fighter = String::from("Ferris");   // fighter is valid from here...
              println!("{} enters {}", fighter, arena);
          }                                           // ...to here: fighter is dropped
          println!("{} is empty again", arena);
      }                                               // ...to here: arena is dropped
      ```

      ```output
      Ferris enters Crab Arena
      Crab Arena is empty again
      ```

      At each closing brace, Rust **drops** the variables declared in that block, newest first. Dropping a `String` frees its heap text. You never write that code: the compiler adds it at exactly the place where the owner's scope ends. So memory is freed **deterministically** (you can point at the line where it happens), not "at some point later" as with a garbage collector.

      This idea of tying a resource to a scope works for more than memory: files close themselves, network connections hang up and locks unlock when their owner goes out of scope. C++ programmers call it **RAII** ("resource acquisition is initialization"). In Rust it's simply how every value works.

      ### Using a variable outside its scope

      ```rust compile_fail
      fn main() {
          {
              let ticket = String::from("T-100");
              println!("{}", ticket);
          }
          println!("{}", ticket);
      }
      ```

      ```error
      error[E0425]: cannot find value `ticket` in this scope
       --> src/main.rs:6:20
        |
      6 |     println!("{}", ticket);
        |                    ^^^^^^
        |
      help: the binding `ticket` is available in a different scope in the same function
      ```

      After the inner block ends, `ticket` and its text are gone. If you need a value after a block, declare it **before** the block, in the outer scope. Or let the block hand the value out as its result, like an `if` expression does:

      ```rust run
      fn main() {
          let points = 72;
          let rank = if points >= 50 {
              String::from("silver")
          } else {
              String::from("bronze")
          };
          println!("{} points: {}", points, rank);
      }
      ```

      ```output
      72 points: silver
      ```

      The `String` is created inside a branch, but the branch hands it to `rank`, which lives in the outer scope, so it isn't dropped at the branch's `}`. Handing a value from one owner to another is called a **move**: the next step.

      ### Common mistakes

      - **Declaring inside a loop or `if`, using it after.** A `let` inside a loop body creates a fresh variable every round and drops it at the end of that round.
      - **Looking for a way to free memory yourself.** There's no `free` to call. (There is a way to drop a value early, `drop(value)`, which you'll meet in step 5.)
      - **Thinking scope means "until the function returns".** It ends at the closing brace of the innermost block that contains the `let`.

      **Your turn:** this program doesn't compile because `weapon` is used after its scope has ended. Move its declaration so it lives long enough, and make the program print:

      ```
      Ferris picks up the claw
      Ferris still holds the claw
      ```
    seed: |
      fn main() {
          let player = String::from("Ferris");
          {
              let weapon = String::from("claw");
              println!("{} picks up the {}", player, weapon);
          }
          println!("{} still holds the {}", player, weapon);
      }
    solution: |
      fn main() {
          let player = String::from("Ferris");
          let weapon = String::from("claw");
          {
              println!("{} picks up the {}", player, weapon);
          }
          println!("{} still holds the {}", player, weapon);
      }
    hints:
      - "Read the error: `weapon` only exists inside the inner `{ }` block."
      - "Move the line `let weapon = String::from(\"claw\");` up, next to `let player`, so it's in `main`'s scope."
    tests:
      - expect: "Ferris picks up the claw\nFerris still holds the claw"
    more:
      - task: |
          This program should build a shopping list in one `String` and print it after the loop, but `list` is created inside the loop body: it's a new, empty `String` every round, dropped at the end of each round, and it doesn't exist after the loop at all. Fix it so the program prints:

          ```
          list: apples;bread;milk;
          ```
        seed: |
          fn main() {
              for item in ["apples", "bread", "milk"] {
                  let mut list = String::new();
                  list.push_str(item);
                  list.push_str(";");
              }
              println!("list: {}", list);
          }
        solution: |
          fn main() {
              let mut list = String::new();
              for item in ["apples", "bread", "milk"] {
                  list.push_str(item);
                  list.push_str(";");
              }
              println!("list: {}", list);
          }
        hints:
          - The list has to exist before the loop starts and still exist after it ends.
          - "Move `let mut list = String::new();` above the `for` line."
        tests:
          - expect: "list: apples;bread;milk;"
      - task: |
          The program reads a number of points and should print a rank: `gold` for 100 or more, `silver` for 50 or more, `bronze` otherwise. It doesn't compile: each `rank` only lives inside its own branch. Rewrite it so the `if` expression **hands the String out** to one `rank` variable in `main`'s scope. For the input `120` it prints:

          ```
          rank: gold
          ```
        seed: |
          fn main() {
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).expect("could not read input");
              let points: u32 = line.trim().parse().expect("not a number");
              if points >= 100 {
                  let rank = String::from("gold");
              } else if points >= 50 {
                  let rank = String::from("silver");
              } else {
                  let rank = String::from("bronze");
              }
              println!("rank: {}", rank);
          }
        solution: |
          fn main() {
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).expect("could not read input");
              let points: u32 = line.trim().parse().expect("not a number");
              let rank = if points >= 100 {
                  String::from("gold")
              } else if points >= 50 {
                  String::from("silver")
              } else {
                  String::from("bronze")
              };
              println!("rank: {}", rank);
          }
        require:
          - pattern: 'let\s+rank\s*=\s*if\b'
            message: "Write it as one `let rank = if ... { ... } else { ... };` expression."
        hints:
          - "An `if` is an expression: `let rank = if cond { a } else { b };` gives `rank` the value of the branch that ran."
          - "Inside each branch, write just `String::from(\"gold\")` (no `let`, no semicolon), and put a `;` after the final `}`."
        tests:
          - stdin: "120\n"
          - stdin: "75\n"
            hidden: true
          - stdin: "50\n"
            hidden: true
          - stdin: "10\n"
            hidden: true

  - title: "Moves: one owner at a time"
    id: ownership-3
    text: |
      Copying an integer is easy:

      ```rust run
      fn main() {
          let a = 5;
          let b = a;
          println!("a = {}, b = {}", a, b);
      }
      ```

      ```output
      a = 5, b = 5
      ```

      `b` gets its own copy of the 4 bytes, and both variables can be used. Now try the same with a `String`:

      ```rust compile_fail
      fn main() {
          let s1 = String::from("hello");
          let s2 = s1;
          println!("{} {}", s1, s2);
      }
      ```

      ```error
      error[E0382]: borrow of moved value: `s1`
       --> src/main.rs:4:23
        |
      2 |     let s1 = String::from("hello");
        |         -- move occurs because `s1` has type `String`, which does not implement the `Copy` trait
      3 |     let s2 = s1;
        |              -- value moved here
      4 |     println!("{} {}", s1, s2);
        |                       ^^ value borrowed here after move
      ```

      What happened? `let s2 = s1;` copies the **handle** (pointer, length, capacity), not the heap text. If Rust stopped there, two variables would point at the same text:

      ```text
           s1                     s2
          ┌────────────┐         ┌────────────┐
          │ ptr ───────┼──┐   ┌──┼──── ptr    │
          │ len 5      │  │   │  │ len 5      │
          │ cap 5      │  │   │  │ cap 5      │
          └────────────┘  ▼   ▼  └────────────┘
                        ┌───┬───┬───┬───┬───┐
                  HEAP  │ h │ e │ l │ l │ o │
                        └───┴───┴───┴───┴───┘
      ```

      At the end of `main` both would be dropped, and the same heap block would be freed **twice**: a double free, one of the bugs that corrupt memory in C programs. Rule 2 forbids it: a value has one owner at a time. So `let s2 = s1;` **moves** ownership from `s1` to `s2`, and `s1` can't be used any more. Only `s2` will free the text.

      ```text
           s1  (moved out: unusable)        s2
          ┌────────────┐                   ┌────────────┐
          │ ░░░░░░░░░░ │                   │ ptr ───────┼──┐
          │ ░░░░░░░░░░ │                   │ len 5      │  │
          │ ░░░░░░░░░░ │                   │ cap 5      │  │
          └────────────┘                   └────────────┘  ▼
                                         ┌───┬───┬───┬───┬───┐
                                   HEAP  │ h │ e │ l │ l │ o │
                                         └───┴───┴───┴───┴───┘
      ```

      Read the error message again with that picture in mind. It names the type (`String`, which "does not implement the `Copy` trait": next step), the line where the value moved, and the line where you used it afterwards. It says "borrow" because `println!` *borrows* its arguments to print them; borrowing is the next module. The full message also suggests `.clone()`, which is one fix; step 4 covers when it's the right one.

      A move is cheap: only the 24-byte handle is copied, however long the text is. Nothing on the heap is touched.

      ### Use the new owner

      Usually the fix is to keep using the value through its new owner, or to finish with the old name before the move:

      ```rust run
      fn main() {
          let draft = String::from("Patch notes v1.2");
          println!("draft: {}", draft);       // use it before the move...
          let published = draft;              // ...ownership moves here
          println!("published: {}", published);
      }
      ```

      ```output
      draft: Patch notes v1.2
      published: Patch notes v1.2
      ```

      ### Where moves happen

      Any time a value that isn't `Copy` (like `String` and `Vec`, and most types you'll write) is handed to something else:

      - assigning it: `let b = a;`
      - passing it to a function (step 5)
      - pushing it into a vector: `names.push(name);`
      - looping over a vector with `for x in v`: the loop takes ownership of `v` and hands out its elements one by one. After the loop, `v` is gone.

      ```rust compile_fail
      fn main() {
          let names = vec![String::from("Ana"), String::from("Ben")];
          for name in names {
              println!("{}", name);
          }
          println!("{} names", names.len());
      }
      ```

      ```error
      error[E0382]: borrow of moved value: `names`
       --> src/main.rs:6:26
        |
      3 |     for name in names {
        |                 ----- `names` moved due to this implicit call to `.into_iter()`
      ...
      6 |     println!("{} names", names.len());
        |                          ^^^^^ value borrowed here after move
      ```

      Fix it by finishing with `names` before the loop (`let count = names.len();`), or by looping over a reference with `for name in &names`, which the compiler suggests and which you'll learn in the next module.

      ### Reusing a moved-from variable

      Moving out of a variable leaves it empty, not destroyed. If it's `mut`, you can give it a new value and use it again:

      ```rust run
      fn main() {
          let mut current = String::from("level 1");
          let finished = current;
          current = String::from("level 2");
          println!("finished {}, now playing {}", finished, current);
      }
      ```

      ```output
      finished level 1, now playing level 2
      ```

      ### Common mistakes

      - **Using a value after moving it** (E0382). Find the "value moved here" line in the error, then use the new owner, or reorder so the old name is used first.
      - **Moving inside a loop.** `let bag = item;` inside a loop moves `item` in the first round, so the next round fails with ``use of moved value: `item` `` and the note `value moved here, in previous iteration of loop`.
      - **Thinking a move is expensive.** It copies three numbers. The text stays where it is.

      **Your turn:** the program uses `item` after it moved into `backpack`. Fix it **without** `.clone()` and without creating a second `String`: reorder the lines or use the new owner, so it prints:

      ```
      Picked up: health potion
      Backpack holds: health potion
      ```
    seed: |
      fn main() {
          let item = String::from("health potion");
          let backpack = item;
          println!("Picked up: {}", item);
          println!("Backpack holds: {}", backpack);
      }
    solution: |
      fn main() {
          let item = String::from("health potion");
          println!("Picked up: {}", item);
          let backpack = item;
          println!("Backpack holds: {}", backpack);
      }
    forbid:
      - pattern: '\.clone\(\)'
        message: "No `.clone()` needed: use the value before it moves, or use the new owner."
      - pattern: 'String::from[\s\S]*String::from|to_string|to_owned'
        message: "Don't create a second String: there's one value with one owner at a time."
    hints:
      - "After `let backpack = item;` the text belongs to `backpack`, and `item` can't be used."
      - "Move the `println!(\"Picked up: ...\")` line above `let backpack = item;`, or print `backpack` instead of `item`."
    tests:
      - expect: "Picked up: health potion\nBackpack holds: health potion"
    more:
      - task: |
          The `for` loop takes ownership of `orders`, so `orders.len()` after the loop doesn't compile. Without `.clone()`, fix it by counting the orders **before** the loop, so the program prints:

          ```
          Cooking #101 pizza
          Cooking #102 soup
          Cooking #103 salad
          3 orders done
          ```
        seed: |
          fn main() {
              let orders = vec![
                  String::from("#101 pizza"),
                  String::from("#102 soup"),
                  String::from("#103 salad"),
              ];
              for order in orders {
                  println!("Cooking {}", order);
              }
              println!("{} orders done", orders.len());
          }
        solution: |
          fn main() {
              let orders = vec![
                  String::from("#101 pizza"),
                  String::from("#102 soup"),
                  String::from("#103 salad"),
              ];
              let count = orders.len();
              for order in orders {
                  println!("Cooking {}", order);
              }
              println!("{} orders done", count);
          }
        forbid:
          - pattern: '\.clone\(\)'
            message: "Don't clone the whole vector: just save its length before the loop."
        hints:
          - "`orders.len()` returns a `usize`, a plain number that you can keep in a variable."
          - "Add `let count = orders.len();` before the `for`, and print `count` at the end."
        tests:
          - expect: "Cooking #101 pizza\nCooking #102 soup\nCooking #103 salad\n3 orders done"
      - task: |
          Swap what the two hands hold, using **moves only**: no `.clone()`, no new strings. You'll need a third variable to hold one of the values for a moment (moving out of `left` leaves it empty, and since it's `mut`, you can move a new value into it). The program should print:

          ```
          left hand: shield, right hand: sword
          ```
        seed: |
          fn main() {
              let mut left = String::from("sword");
              let mut right = String::from("shield");
              // Swap them here, using moves only.

              println!("left hand: {}, right hand: {}", left, right);
          }
        solution: |
          fn main() {
              let mut left = String::from("sword");
              let mut right = String::from("shield");
              // Swap them here, using moves only.
              let held = left;
              left = right;
              right = held;
              println!("left hand: {}, right hand: {}", left, right);
          }
        forbid:
          - pattern: '\.clone\(\)|to_string|to_owned|swap'
            message: "Do it with three moves (`let held = left;` and two assignments), no clones or swap helpers."
          - pattern: 'String::from[\s\S]*String::from[\s\S]*String::from'
            message: "Don't create new strings: move the two you have."
        hints:
          - "Step one: move `left` into a new variable, `let held = left;`. Now `left` is empty."
          - "Then `left = right;` (now `right` is empty) and `right = held;`."
