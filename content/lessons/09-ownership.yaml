        solution: |
          fn main() {
              let products = vec![String::from("keyboard"), String::from("monitor"), String::from("mouse")];
              let prices = vec![49, 189, 25];

              let mut best = 0;
              for i in 0..prices.len() {
                  if prices[i] > prices[best] {
                      best = i;
                  }
              }
              let top_price = prices[best];
              let top_product = products[best].clone();
              println!("most expensive: {} at ${}", top_product, top_price);
              for product in products {
                  println!("in stock: {}", product);
              }
          }
        forbid:
          - pattern: 'prices\[best\]\.clone\(\)'
            message: "Prices are u32, which is Copy: `prices[best]` already copies the number."
        hints:
          - "The error is E0507, cannot move out of index of `Vec<String>`."
          - "`let top_product = products[best].clone();`"
        tests:
          - expect: "most expensive: monitor at $189\nin stock: keyboard\nin stock: monitor\nin stock: mouse"
      - task: |
          Write `build_roster`. It takes ownership of the captain and of a vector of other players, and returns a **new** vector with the captain first, followed by the others in order. Everything can be moved, so don't use `.clone()`.

          For example, `build_roster(String::from("Ana"), vec![String::from("Ben"), String::from("Cy")])` returns `["Ana", "Ben", "Cy"]`.
        seed: |
          fn build_roster(captain: String, others: Vec<String>) -> Vec<String> {
              todo!()
          }
        solution: |
          fn build_roster(captain: String, others: Vec<String>) -> Vec<String> {
              let mut roster = Vec::new();
              roster.push(captain);
              for name in others {
                  roster.push(name);
              }
              roster
          }
        harness: |
          #[test]
          fn puts_the_captain_first() {
              let roster = build_roster(String::from("Ana"), vec![String::from("Ben"), String::from("Cy")]);
              assert_eq!(roster, vec!["Ana", "Ben", "Cy"], "build_roster(\"Ana\", [\"Ben\", \"Cy\"])");
          }

          #[test]
          fn works_with_no_other_players() {
              let roster = build_roster(String::from("Solo"), Vec::new());
              assert_eq!(roster, vec!["Solo"], "build_roster(\"Solo\", [])");
          }

          #[test]
          fn keeps_the_others_in_order() {
              let others = vec![String::from("Zed"), String::from("Amy"), String::from("Max")];
              let roster = build_roster(String::from("Kim"), others);
              assert_eq!(roster, vec!["Kim", "Zed", "Amy", "Max"], "build_roster(\"Kim\", [\"Zed\", \"Amy\", \"Max\"])");
          }
        forbid:
          - pattern: '\.clone\(\)'
            message: "No clones needed: the function owns everything it was given, so it can move it all."
        hints:
          - "Start with `let mut roster = Vec::new();` and push the captain."
          - "`for name in others { roster.push(name); }` moves each player out of `others`. Return `roster` at the end."
