          The program saves the old high score, champion and lineup, then changes the current ones. It doesn't compile: two of the three "saves" are moves. Add `.clone()` **only where it's needed**: `high_score` is an `i32`, which is `Copy`, so it must not be cloned. The program should print:

          ```
