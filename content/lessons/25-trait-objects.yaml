          A key-value `Storage` trait should work as `&mut dyn Storage`, but it also has a constructor `fn new() -> Self`, which makes it not dyn compatible. Fix the trait (keep `new`, but exclude it from the vtable), implement it for `MemoryStorage` (backed by a `HashMap<String, String>`) and `NullStorage` (stores nothing; `get` always returns `None`), and write `fn save_all(store: &mut dyn Storage, pairs: &[(&str, &str)])`.
        seed: |
          use std::collections::HashMap;

          trait Storage {
              fn new() -> Self;
              fn get(&self, key: &str) -> Option<String>;
              fn set(&mut self, key: &str, value: &str);
          }

          struct MemoryStorage {
              data: HashMap<String, String>,
          }

          struct NullStorage;

          fn save_all(store: &mut dyn Storage, pairs: &[(&str, &str)]) {
              todo!()
          }
        solution: |
          use std::collections::HashMap;

          trait Storage {
              fn new() -> Self
              where
                  Self: Sized;
              fn get(&self, key: &str) -> Option<String>;
              fn set(&mut self, key: &str, value: &str);
          }

          struct MemoryStorage {
              data: HashMap<String, String>,
          }

          struct NullStorage;

          impl Storage for MemoryStorage {
              fn new() -> Self {
                  MemoryStorage { data: HashMap::new() }
              }
              fn get(&self, key: &str) -> Option<String> {
                  self.data.get(key).cloned()
              }
              fn set(&mut self, key: &str, value: &str) {
                  self.data.insert(key.to_string(), value.to_string());
              }
          }

          impl Storage for NullStorage {
              fn new() -> Self {
                  NullStorage
              }
              fn get(&self, _key: &str) -> Option<String> {
                  None
              }
              fn set(&mut self, _key: &str, _value: &str) {}
          }

          fn save_all(store: &mut dyn Storage, pairs: &[(&str, &str)]) {
              for (k, v) in pairs {
                  store.set(k, v);
              }
          }
        harness: |
          #[test]
          fn memory_storage_keeps_values() {
              let mut m = MemoryStorage::new();
              save_all(&mut m, &[("theme", "dark"), ("lang", "pt")]);
              assert_eq!(m.get("theme"), Some(String::from("dark")), "get(\"theme\")");
              assert_eq!(m.get("lang"), Some(String::from("pt")), "get(\"lang\")");
          }

          #[test]
          fn later_values_replace_earlier_ones() {
              let mut m = MemoryStorage::new();
              save_all(&mut m, &[("n", "1"), ("n", "2")]);
              assert_eq!(m.get("n"), Some(String::from("2")), "get(\"n\")");
          }

          #[test]
          fn missing_keys_are_none() {
              let m = MemoryStorage::new();
              assert_eq!(m.get("nope"), None, "get on an empty store");
          }

          #[test]
          fn null_storage_forgets_everything() {
              let mut n = NullStorage::new();
              save_all(&mut n, &[("a", "1")]);
              assert_eq!(n.get("a"), None, "NullStorage get(\"a\")");
          }

          #[test]
          fn works_through_a_trait_object() {
              let mut stores: Vec<Box<dyn Storage>> = vec![Box::new(MemoryStorage::new()), Box::new(NullStorage::new())];
              for s in &mut stores {
                  s.set("k", "v");
              }
              assert_eq!(stores[0].get("k"), Some(String::from("v")), "memory store via dyn");
              assert_eq!(stores[1].get("k"), None, "null store via dyn");
          }
        hints:
          - "`fn new() -> Self where Self: Sized;` keeps the constructor for concrete types only."
          - "`MemoryStorage::get` is `self.data.get(key).cloned()`; `set` inserts `key.to_string()` and `value.to_string()`."
          - "`save_all` loops over the pairs and calls `store.set(k, v)`."

  - title: Enums or trait objects?
    id: trait-objects-6
    text: |
      You've now seen two ways to handle "one of several kinds of thing": an **enum** with a `match` (enums module), and a **trait** with `dyn`. Here are the same shapes as an enum:

      ```rust run
      enum Shape {
          Circle { radius: f64 },
          Rect { w: f64, h: f64 },
      }

      impl Shape {
          fn area(&self) -> f64 {
              match self {
                  Shape::Circle { radius } => 3.0 * radius * radius,
                  Shape::Rect { w, h } => w * h,
              }
          }

          fn name(&self) -> &'static str {
              match self {
                  Shape::Circle { .. } => "circle",
                  Shape::Rect { .. } => "rect",
              }
          }
      }

      fn main() {
          let shapes = vec![Shape::Circle { radius: 1.0 }, Shape::Rect { w: 2.0, h: 3.0 }];
          for s in &shapes {
              println!("{} {}", s.name(), s.area());
          }
      }
      ```

      ```output
      circle 3
      rect 6
      ```

      No `Box`, no trait, and `Vec<Shape>` holds both kinds. So which should you use? It depends on **what will change**:

      | | Enum | Trait objects |
      |---|---|---|
      | The set of kinds | **closed**: all variants are listed in one place | **open**: anyone can add a type, even in another crate |
      | Add a new kind | add a variant, then fix every `match` (the compiler lists them) | write one new `impl`; nothing else changes |
      | Add a new operation | write one new method with a `match` | add a method to the trait, then implement it for every type |
      | Memory | stored inline, no allocation | one `Box` per value (heap) |
      | Extras | `derive(Debug, Clone, PartialEq)`, pattern matching on the data | needs a dyn-compatible trait; can't easily inspect the concrete type |

      (Computer scientists call this trade-off the **expression problem**: one design makes new kinds easy, the other makes new operations easy.)

      ### Rules of thumb

      - **You know all the cases and you own the code**: use an enum. Commands in a CLI, messages in a protocol, tokens in a parser, states of an order, events in your app. This covers most application code, and the compiler's exhaustiveness check is a huge help when the cases change.
      - **Other people (or other crates) need to add cases without editing your code**: use a trait. Plugins, middleware, storage backends, notification channels, a library's extension points.
      - Not sure? Start with the enum. It's simpler, and switching later is straightforward.

      ### Common mistakes

      - **A catch-all `_ =>` arm in a `match` on your own enum.** It switches off the exhaustiveness check: add a variant later and that `match` silently takes the default branch. List the variants instead.
      - **Trait objects for a fixed set, out of habit from other languages.** One struct and one impl per case, a `Box` per value, and no pattern matching, for no gain.
      - **An enum as a library's extension point.** Users of your crate can't add variants, and adding one yourself breaks every `match` they wrote. That's what traits are for.

      **Your turn:** a checkout used to model payment methods as three structs behind a `Payment` trait. The set of methods is fixed and owned by the team, so it's being rewritten as an **enum**. Implement `label` and `fee_cents` with one `match` each:

      - `Card { last4 }`: label `card ending <last4>`, fee 2% of the amount (`amount * 2 / 100`)
      - `Cash`: label `cash`, no fee
      - `Voucher { code }`: label `voucher <code>`, a flat fee of 50 cents
    seed: |
