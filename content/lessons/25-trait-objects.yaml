    solution: |
      trait Shape {
          fn name(&self) -> String;
          fn area(&self) -> f64;
      }

      struct Circle {
          radius: f64,
      }

      struct Rect {
          w: f64,
          h: f64,
      }

      impl Shape for Circle {
          fn name(&self) -> String {
              String::from("circle")
          }
          fn area(&self) -> f64 {
              3.0 * self.radius * self.radius
          }
      }

      impl Shape for Rect {
          fn name(&self) -> String {
              String::from("rect")
          }
          fn area(&self) -> f64 {
              self.w * self.h
          }
      }

      fn parse_shape(line: &str) -> Option<Box<dyn Shape>> {
          let words: Vec<&str> = line.split_whitespace().collect();
          match words.as_slice() {
              ["circle", r] => Some(Box::new(Circle { radius: r.parse().ok()? })),
              ["rect", w, h] => Some(Box::new(Rect { w: w.parse().ok()?, h: h.parse().ok()? })),
              ["square", s] => {
                  let side: f64 = s.parse().ok()?;
                  Some(Box::new(Rect { w: side, h: side }))
              }
              _ => None,
          }
      }
    harness: |
      fn check(line: &str) -> Option<(String, f64)> {
          parse_shape(line).map(|s| (s.name(), s.area()))
      }

      #[test]
      fn parses_a_circle() {
          assert_eq!(check("circle 2"), Some((String::from("circle"), 12.0)), "parse_shape(\"circle 2\")");
      }

      #[test]
      fn parses_a_rect() {
          assert_eq!(check("rect 3 4"), Some((String::from("rect"), 12.0)), "parse_shape(\"rect 3 4\")");
      }

      #[test]
      fn a_square_is_a_rect_with_equal_sides() {
          assert_eq!(check("square 5"), Some((String::from("rect"), 25.0)), "parse_shape(\"square 5\")");
      }

      #[test]
      fn unknown_shapes_are_none() {
          assert_eq!(check("hexagon 2"), None, "parse_shape(\"hexagon 2\")");
          assert_eq!(check(""), None, "parse_shape(\"\")");
      }

      #[test]
      fn bad_numbers_are_none() {
          assert_eq!(check("circle big"), None, "parse_shape(\"circle big\")");
          assert_eq!(check("rect 3"), None, "parse_shape(\"rect 3\")");
      }
    hints:
      - "Split into words with `let words: Vec<&str> = line.split_whitespace().collect();` and `match words.as_slice()` with patterns like `[\"rect\", w, h]`."
      - "`w.parse::<f64>().ok()?` turns a bad number into an early `None`."
      - "Each arm returns `Some(Box::new(Rect { ... }))`; the `Box<Rect>` becomes a `Box<dyn Shape>` because of the return type."
