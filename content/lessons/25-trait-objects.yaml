      - task: |
          An audit log stores events as `Box<dyn Event>`. Write `fn logins(events: &[Box<dyn Event>]) -> Vec<String>` that returns the user of every `Login` event, in order, by downcasting (upcast each event to `&dyn Any` first, as in the example). Also implement `Event` for `Purchase` (name `purchase`).
        seed: |
          use std::any::Any;

          trait Event: Any {
              fn name(&self) -> String;
          }

          struct Login {
              user: String,
          }

          struct Purchase {
              amount_cents: u32,
          }

          impl Event for Login {
