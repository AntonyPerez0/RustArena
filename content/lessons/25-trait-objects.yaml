    solution: |
      use std::f64::consts::PI;

      trait Shape {
          fn name(&self) -> String;
          fn area(&self) -> f64;
      }

      struct Circle {
          radius: f64,
      }

      struct Rect {
          w: f64,
          h: f64,
      }

      struct Square {
          side: f64,
      }

      impl Shape for Circle {
          fn name(&self) -> String {
              String::from("circle")
          }
          fn area(&self) -> f64 {
              PI * self.radius * self.radius
          }
      }

      impl Shape for Rect {
          fn name(&self) -> String {
              String::from("rect")
          }
          fn area(&self) -> f64 {
              self.w * self.h
          }
      }

      impl Shape for Square {
          fn name(&self) -> String {
              String::from("square")
          }
          fn area(&self) -> f64 {
              self.side * self.side
          }
      }

      fn total_area(shapes: &[Box<dyn Shape>]) -> f64 {
          let mut total = 0.0;
          for s in shapes {
              total += s.area();
          }
          total
      }
    harness: |
      #[test]
      fn a_square_knows_its_name_and_area() {
          let s = Square { side: 3.0 };
          assert_eq!(s.name(), "square", "Square name()");
          assert_eq!(s.area(), 9.0, "Square with side 3, area()");
      }

      #[test]
      fn totals_a_mixed_list() {
          let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Square { side: 2.0 }), Box::new(Rect { w: 1.5, h: 4.0 })];
          assert_eq!(total_area(&shapes), 10.0, "square 2x2 + rect 1.5x4");
      }

      #[test]
      fn includes_circles() {
          let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Circle { radius: 1.0 }), Box::new(Square { side: 1.0 })];
          let got = total_area(&shapes);
          assert!((got - (PI + 1.0)).abs() < 1e-9, "circle r=1 + square 1x1 should be about 4.1416, got {}", got);
      }

      #[test]
      fn an_empty_list_has_no_area() {
          let shapes: Vec<Box<dyn Shape>> = Vec::new();
          assert_eq!(total_area(&shapes), 0.0, "total_area(&[])");
      }
    hints:
      - "`impl Shape for Square` needs both methods: `name` returns `String::from(\"square\")`, `area` returns `self.side * self.side`."
      - "`total_area` loops `for s in shapes` and adds `s.area()`: each `s` is a `&Box<dyn Shape>`, and method calls see through the box."
