        solution: |
          use std::collections::HashMap;
          use std::io::BufRead;

          trait Command {
              fn run(&self, args: &[i64]) -> Result<i64, String>;
          }

          struct Add;
          struct Mul;
          struct Div;

          impl Command for Add {
              fn run(&self, args: &[i64]) -> Result<i64, String> {
                  let mut sum = 0;
                  for a in args {
                      sum += a;
                  }
                  Ok(sum)
              }
          }

          impl Command for Mul {
              fn run(&self, args: &[i64]) -> Result<i64, String> {
                  let mut product = 1;
                  for a in args {
                      product *= a;
                  }
                  Ok(product)
              }
          }

          impl Command for Div {
              fn run(&self, args: &[i64]) -> Result<i64, String> {
                  match args {
                      [_, 0] => Err(String::from("division by zero")),
                      [a, b] => Ok(a / b),
                      _ => Err(String::from("div needs 2 numbers")),
                  }
              }
          }

          fn execute(commands: &HashMap<String, Box<dyn Command>>, line: &str) -> Result<i64, String> {
              let mut words = line.split_whitespace();
              let name = words.next().unwrap_or("");
              let command = commands.get(name).ok_or(format!("unknown command {name}"))?;
              let mut args = Vec::new();
              for w in words {
                  args.push(w.parse::<i64>().map_err(|_| format!("bad number {w}"))?);
              }
              command.run(&args)
          }

          fn main() {
              let mut commands: HashMap<String, Box<dyn Command>> = HashMap::new();
              commands.insert(String::from("add"), Box::new(Add));
              commands.insert(String::from("mul"), Box::new(Mul));
              commands.insert(String::from("div"), Box::new(Div));

              let stdin = std::io::stdin();
              for line in stdin.lock().lines() {
                  let line = line.unwrap();
                  match execute(&commands, &line) {
                      Ok(n) => println!("{n}"),
                      Err(e) => println!("error: {e}"),
                  }
              }
          }
        hints:
          - "Three unit structs (`struct Add;` ...) with `impl Command`. For `Div`, `match args { [_, 0] => ..., [a, b] => ..., _ => ... }`."
          - "Build the map with `let mut commands: HashMap<String, Box<dyn Command>> = HashMap::new();` and `commands.insert(String::from(\"add\"), Box::new(Add));`."
          - "A helper `fn execute(commands: &HashMap<String, Box<dyn Command>>, line: &str) -> Result<i64, String>` can use `?` for the unknown name and bad numbers."
        tests:
          - stdin: "add 2 3 4\nmul 2 5\ndiv 9 2\n"
            expect: "9\n10\n4"
          - stdin: "div 8 0\ndiv 1\npow 2 3\nadd 2 x\n"
            expect: "error: division by zero\nerror: div needs 2 numbers\nerror: unknown command pow\nerror: bad number x"
          - stdin: "mul\nadd -5 5\ndiv -9 3\n"
            hidden: true

  - title: Dyn compatibility (object safety)
    id: trait-objects-5
    text: |
      Not every trait can be used as `dyn Trait`. To call methods through a vtable, the compiler must be able to build that table without knowing the concrete type. A trait that allows it is **dyn compatible** (older docs and blog posts call it **object safe**).

      ```rust compile_fail
      trait Shape {
          fn area(&self) -> f64;
          fn scaled(&self, k: f64) -> Self;
      }

      struct Circle {
          radius: f64,
      }

      impl Shape for Circle {
          fn area(&self) -> f64 {
              3.0 * self.radius * self.radius
          }
          fn scaled(&self, k: f64) -> Self {
              Circle { radius: self.radius * k }
          }
      }

      fn main() {
          let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Circle { radius: 1.0 })];
          println!("{}", shapes.len());
      }
      ```

      ```error
      error[E0038]: the trait `Shape` is not dyn compatible
        |
        |     fn scaled(&self, k: f64) -> Self;
        |                                 ^^^^ ...because method `scaled` references the `Self` type in its return type
      ```

      Through a `dyn Shape`, what would `scaled` return? A `Circle`? A `Square`? Its size isn't known at compile time, so there's no way to call it. The main rules, each with the same reason behind it:

      - **No `Self` in the return type** (or in arguments other than the receiver): the concrete type is unknown. `Clone` is the famous example: `fn clone(&self) -> Self`.
      - **No generic methods** like `fn log<T: Display>(&self, value: T)`: there would be one version per `T`, infinitely many, and a vtable can't hold them all.
      - **No functions without `self`** like `fn new() -> Self`: there's no value to find a vtable through.
      - **The trait can't require `Sized`**, so `trait Shape: Clone` is not dyn compatible either (`Clone` requires `Sized`).

      ### The fixes

      1. **Exclude a method from the vtable** with `where Self: Sized`. It can still be called on concrete types, just not through `dyn`:

      ```rust run
      trait Shape {
          fn area(&self) -> f64;
          fn scaled(&self, k: f64) -> Self
          where
              Self: Sized;
      }

      struct Circle {
          radius: f64,
      }

      impl Shape for Circle {
          fn area(&self) -> f64 {
              3.0 * self.radius * self.radius
          }
          fn scaled(&self, k: f64) -> Self {
              Circle { radius: self.radius * k }
          }
      }

      fn main() {
          let big = Circle { radius: 1.0 }.scaled(2.0);
          let shapes: Vec<Box<dyn Shape>> = vec![Box::new(Circle { radius: 1.0 }), Box::new(big)];
          for s in &shapes {
              println!("{}", s.area());
          }
      }
      ```

      ```output
      3
      12
      ```

      Calling `s.scaled(2.0)` on a `Box<dyn Shape>` would now give `error: the scaled method cannot be invoked on a trait object`.

      2. **Replace a generic parameter with a trait object**: `fn log(&self, value: &dyn Display)` instead of `fn log<T: Display>(&self, value: T)`.
      3. **Return a box instead of `Self`**: to clone trait objects, add `fn clone_box(&self) -> Box<dyn Shape>` and implement it as `Box::new(self.clone())`.
      4. **Split the trait**: keep the dyn-friendly methods in one trait and put constructors or generic helpers in another.

      **Your turn:** `Widget` can't be used as `dyn Widget`, so `render_all` doesn't compile. Make it dyn compatible **without removing any method**: change `with_label` to take `label: &dyn Display` instead of a generic, and keep `duplicate` callable on concrete widgets with `where Self: Sized`. Update both impls to match.
    seed: |
      use std::fmt::Display;

      trait Widget {
          fn name(&self) -> String;
          fn with_label<T: Display>(&self, label: T) -> String;
          fn duplicate(&self) -> Self;
      }

      #[derive(Debug, PartialEq)]
      struct Button {
          text: String,
      }

      #[derive(Debug, PartialEq)]
      struct Slider {
          value: u8,
      }

      impl Widget for Button {
          fn name(&self) -> String {
              format!("button({})", self.text)
          }
          fn with_label<T: Display>(&self, label: T) -> String {
              format!("{}: {}", label, self.name())
          }
          fn duplicate(&self) -> Self {
              Button { text: self.text.clone() }
          }
      }

      impl Widget for Slider {
          fn name(&self) -> String {
              format!("slider({})", self.value)
          }
          fn with_label<T: Display>(&self, label: T) -> String {
              format!("{}: {}", label, self.name())
          }
          fn duplicate(&self) -> Self {
              Slider { value: self.value }
          }
      }

      fn render_all(widgets: &[Box<dyn Widget>]) -> Vec<String> {
          let mut out = Vec::new();
          for w in widgets {
              out.push(w.with_label(&"ui"));
          }
          out
      }
    solution: |
      use std::fmt::Display;

      trait Widget {
          fn name(&self) -> String;
          fn with_label(&self, label: &dyn Display) -> String;
          fn duplicate(&self) -> Self
          where
              Self: Sized;
      }

      #[derive(Debug, PartialEq)]
      struct Button {
          text: String,
      }

      #[derive(Debug, PartialEq)]
      struct Slider {
