          }
      }

      fn backpack_weight(items: &[Box<dyn Item>]) -> u32 {
          let mut total = 0;
          for item in items {
              total += item.weight();
          }
          total
      }

      fn stack_weight<T: Item>(items: &[T]) -> u32 {
