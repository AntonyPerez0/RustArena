        solution: |
          trait Shape {
              fn name(&self) -> String;
              fn area(&self) -> f64;
          }

          struct Rect {
              w: f64,
              h: f64,
          }

          impl Shape for Rect {
              fn name(&self) -> String {
                  format!("rect {}x{}", self.w, self.h)
              }
              fn area(&self) -> f64 {
                  self.w * self.h
              }
          }

          fn biggest(shapes: &[Box<dyn Shape>]) -> Option<&dyn Shape> {
              let mut best: Option<&dyn Shape> = None;
              for s in shapes {
                  match best {
                      Some(b) if b.area() >= s.area() => {}
                      _ => best = Some(s.as_ref()),
                  }
              }
              best
          }
        harness: |
          fn r(w: f64, h: f64) -> Box<dyn Shape> {
              Box::new(Rect { w, h })
          }

          #[test]
          fn finds_the_largest_area() {
              let shapes = vec![r(1.0, 2.0), r(3.0, 3.0), r(2.0, 4.0)];
              assert_eq!(biggest(&shapes).map(|s| s.name()), Some(String::from("rect 3x3")), "biggest of 2, 9 and 8");
          }

          #[test]
          fn a_tie_keeps_the_first() {
              let shapes = vec![r(2.0, 3.0), r(3.0, 2.0)];
              assert_eq!(biggest(&shapes).map(|s| s.name()), Some(String::from("rect 2x3")), "two shapes with area 6");
          }

          #[test]
          fn an_empty_list_is_none() {
              let shapes: Vec<Box<dyn Shape>> = Vec::new();
              assert!(biggest(&shapes).is_none(), "biggest(&[]) should be None");
          }
        hints:
          - "Keep `let mut best: Option<&dyn Shape> = None;` and replace it when a shape has a strictly larger area."
          - "Inside the loop, `s` is a `&Box<dyn Shape>`; `s.as_ref()` is the `&dyn Shape` inside it."
