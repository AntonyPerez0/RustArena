          fn logins(events: &[Box<dyn Event>]) -> Vec<String> {
              todo!()
          }
        solution: |
          use std::any::Any;

          trait Event: Any {
              fn name(&self) -> String;
          }

          struct Login {
              user: String,
          }

          struct Purchase {
              amount_cents: u32,
          }

          impl Event for Login {
              fn name(&self) -> String {
                  String::from("login")
              }
          }

          impl Event for Purchase {
              fn name(&self) -> String {
                  String::from("purchase")
              }
          }

          fn logins(events: &[Box<dyn Event>]) -> Vec<String> {
              let mut users = Vec::new();
              for e in events {
                  let any: &dyn Any = e.as_ref();
                  if let Some(login) = any.downcast_ref::<Login>() {
                      users.push(login.user.clone());
                  }
              }
              users
          }
        harness: |
          fn log() -> Vec<Box<dyn Event>> {
              vec![
                  Box::new(Login { user: String::from("ana") }),
                  Box::new(Purchase { amount_cents: 999 }),
                  Box::new(Login { user: String::from("bo") }),
              ]
          }

          #[test]
          fn finds_every_login_in_order() {
              assert_eq!(logins(&log()), vec!["ana", "bo"], "logins(log)");
          }

          #[test]
          fn purchases_have_a_name() {
              let p = Purchase { amount_cents: 500 };
              assert_eq!(p.name(), "purchase", "Purchase name()");
              assert_eq!(p.amount_cents, 500, "amount");
          }

          #[test]
          fn no_logins_gives_an_empty_list() {
              let only: Vec<Box<dyn Event>> = vec![Box::new(Purchase { amount_cents: 1 })];
              assert_eq!(logins(&only), Vec::<String>::new(), "logins with only a purchase");
          }

          #[test]
          fn names_still_work_through_dyn() {
              let names: Vec<String> = log().iter().map(|e| e.name()).collect();
              assert_eq!(names, vec!["login", "purchase", "login"], "event names");
          }
        hints:
          - "`impl Event for Purchase { fn name(&self) -> String { String::from(\"purchase\") } }`"
          - "In the loop, `let any: &dyn Any = e.as_ref();` then `if let Some(login) = any.downcast_ref::<Login>() { users.push(login.user.clone()); }`."
