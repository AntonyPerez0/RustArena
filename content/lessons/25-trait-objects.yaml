      - task: |
          An alerting system can send a message through several channels. Write a trait `Notifier` with one method `fn send(&self, msg: &str) -> String` that returns what would be sent, and implement it:

          - `Email`: `email to <address>: <msg>`
          - `Sms`: `sms to <number>: <msg>`, but SMS messages are cut to their first 20 characters
          - `Slack`: `#<channel>: <msg>`

          Then write `fn notify_all(notifiers: &[Box<dyn Notifier>], msg: &str) -> Vec<String>`.
        seed: |
          struct Email {
              address: String,
          }

          struct Sms {
              number: String,
          }

          struct Slack {
              channel: String,
          }

          // trait Notifier ...

          // fn notify_all(...)
        solution: |
          struct Email {
              address: String,
          }

          struct Sms {
              number: String,
          }

          struct Slack {
              channel: String,
          }

          trait Notifier {
              fn send(&self, msg: &str) -> String;
          }

          impl Notifier for Email {
              fn send(&self, msg: &str) -> String {
                  format!("email to {}: {}", self.address, msg)
              }
          }

          impl Notifier for Sms {
              fn send(&self, msg: &str) -> String {
                  let short: String = msg.chars().take(20).collect();
                  format!("sms to {}: {}", self.number, short)
              }
          }

          impl Notifier for Slack {
              fn send(&self, msg: &str) -> String {
                  format!("#{}: {}", self.channel, msg)
              }
          }

          fn notify_all(notifiers: &[Box<dyn Notifier>], msg: &str) -> Vec<String> {
              let mut out = Vec::new();
              for n in notifiers {
                  out.push(n.send(msg));
              }
              out
          }
        harness: |
          fn all() -> Vec<Box<dyn Notifier>> {
              vec![
                  Box::new(Email { address: String::from("ops@example.com") }),
                  Box::new(Sms { number: String::from("+351 912") }),
                  Box::new(Slack { channel: String::from("alerts") }),
              ]
          }

          #[test]
          fn sends_through_every_channel() {
              let got = notify_all(&all(), "disk full");
              assert_eq!(got, vec!["email to ops@example.com: disk full", "sms to +351 912: disk full", "#alerts: disk full"], "notify_all");
          }

          #[test]
          fn sms_cuts_long_messages() {
              let s = Sms { number: String::from("555") };
              assert_eq!(s.send("server cpu at 99 percent for 5 minutes"), "sms to 555: server cpu at 99 per", "long SMS");
          }

          #[test]
          fn sms_counts_characters_not_bytes() {
              let s = Sms { number: String::from("555") };
              assert_eq!(s.send("ñññññññññññññññññññññ"), "sms to 555: ññññññññññññññññññññ", "SMS with accented letters");
          }

          #[test]
          fn no_notifiers_sends_nothing() {
              let none: Vec<Box<dyn Notifier>> = Vec::new();
              assert_eq!(notify_all(&none, "hi"), Vec::<String>::new(), "notify_all with no notifiers");
          }
        hints:
          - "`trait Notifier { fn send(&self, msg: &str) -> String; }`, then one `impl Notifier for ...` per struct."
          - "For SMS, `let short: String = msg.chars().take(20).collect();` keeps the first 20 characters."
          - "`notify_all` loops over the boxes and pushes `n.send(msg)`."

  - title: "&dyn Trait and Box<dyn Trait>"
    id: trait-objects-2
    text: |
      A trait object can sit behind any kind of pointer. The two you'll use most:

      | Form | Meaning | Use it for |
      |---|---|---|
      | `&dyn Trait` | borrows some value that implements the trait | parameters that only use the value |
      | `&mut dyn Trait` | borrows it mutably | parameters that change it (`&mut dyn std::fmt::Write`) |
      | `Box<dyn Trait>` | owns it, on the heap | storing in a `Vec` or a struct field, returning from a function |

      You've already met one: `Box<dyn Error>` from the custom errors module is a boxed trait object.

      ```rust run
      trait Shape {
          fn name(&self) -> String;
          fn area(&self) -> f64;
      }

      struct Circle {
          radius: f64,
      }

      struct Square {
          side: f64,
      }

      impl Shape for Circle {
          fn name(&self) -> String {
              String::from("circle")
          }
          fn area(&self) -> f64 {
              3.14 * self.radius * self.radius
          }
      }

      impl Shape for Square {
          fn name(&self) -> String {
              String::from("square")
          }
          fn area(&self) -> f64 {
              self.side * self.side
          }
      }

      fn report(s: &dyn Shape) -> String {
          format!("{} with area {:.1}", s.name(), s.area())
      }

      fn make_shape(kind: &str, size: f64) -> Box<dyn Shape> {
          if kind == "circle" {
              Box::new(Circle { radius: size })
          } else {
              Box::new(Square { side: size })
          }
      }

      fn main() {
          let c = Circle { radius: 1.0 };
          println!("{}", report(&c));

          let shapes = vec![make_shape("square", 3.0), make_shape("circle", 2.0)];
          for s in &shapes {
              println!("{}", report(s.as_ref()));
          }
      }
      ```

      ```output
      circle with area 3.1
      square with area 9.0
      circle with area 12.6
      ```

      - `report(&c)`: a `&Circle` turns into a `&dyn Shape` automatically. No `Box`, no heap: the circle stays where it is.
      - `make_shape` returns a `Circle` **or** a `Square`, decided at run time. `-> impl Shape` can't do that (it stands for one type; you saw the E0308 in the traits module). `Box<dyn Shape>` can.
      - The `Vec` here gets its type from `make_shape`, so no annotation is needed.

      ### From a Box to a `&dyn`

      To pass a boxed shape to `report`, borrow **the shape inside the box**: `s.as_ref()` or `&**s` (one `*` for the `&`, one for the `Box`). Writing `report(s)` or `report(&boxed)` doesn't work, and the error is confusing:

      ```rust compile_fail
      trait Shape {
          fn area(&self) -> f64;
      }

      struct Square {
          side: f64,
      }

      impl Shape for Square {
          fn area(&self) -> f64 {
              self.side * self.side
          }
      }

      fn report(s: &dyn Shape) -> f64 {
          s.area()
      }

      fn main() {
          let b: Box<dyn Shape> = Box::new(Square { side: 2.0 });
          println!("{}", report(&b));
      }
      ```

      ```error
      error[E0277]: the trait bound `Box<dyn Shape>: Shape` is not satisfied
      ```

      Rust tries to treat the `Box` itself as the shape, and a `Box` doesn't implement `Shape`. `report(b.as_ref())` hands over the square inside.

      ### Common mistakes

      - **Returning `dyn Shape` without a pointer.** `fn make() -> dyn Shape` gives ``error[E0746]: return type cannot be a trait object without pointer indirection``. Return `Box<dyn Shape>`.
      - **Returning `&dyn Shape` to something created in the function.** The value would be dropped at the end of the function (E0515 from the lifetimes module). A new value is returned in a `Box`; `&dyn` is for borrowing what already exists.
      - **Boxing when a reference would do.** `fn report(s: Box<dyn Shape>)` takes ownership and forces callers to allocate. If the function only reads the value, take `&dyn Shape` (or a generic, step 3).

      **Your turn:** write `fn parse_shape(line: &str) -> Option<Box<dyn Shape>>` that turns a line of a drawing file into a shape: `circle <radius>`, `rect <w> <h>` or `square <side>` (use the `Rect` type for squares too). Return `None` for anything else, including bad numbers.
