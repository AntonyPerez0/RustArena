          // ---- framework code: don't change ----
          trait Filter {
              fn allow(&self, path: &str) -> bool;
          }

          fn check(filters: &[Box<dyn Filter>], path: &str) -> bool {
              for f in filters {
                  if !f.allow(path) {
                      return false;
                  }
              }
              true
          }
          // ---- your code ----
          struct BlockPrefix(String);

          struct MaxLength(usize);

