      }
    solution: |
      #[derive(Debug, PartialEq)]
      enum Payment {
          Card { last4: String },
          Cash,
          Voucher { code: String },
      }

      impl Payment {
          fn label(&self) -> String {
              match self {
                  Payment::Card { last4 } => format!("card ending {last4}"),
                  Payment::Cash => String::from("cash"),
                  Payment::Voucher { code } => format!("voucher {code}"),
              }
          }

          fn fee_cents(&self, amount: u32) -> u32 {
              match self {
                  Payment::Card { .. } => amount * 2 / 100,
                  Payment::Cash => 0,
                  Payment::Voucher { .. } => 50,
              }
          }
      }
    harness: |
