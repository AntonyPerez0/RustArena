id: testing
title: Testing
phase: "Idiomatic Rust"
summary: "Write tests that actually catch bugs. #[test] and the assert macros, edge cases and planted bugs (mutants), #[should_panic] and tests returning Result, fixing bugs test-first, and how unit, integration and doc tests are organized."
roadmap: [Testing, "Unit & Integration Testing"]
steps:
  - title: Your first test
    id: testing-1
    text: |
      So far you've checked your programs by running them and reading the output. That works once. A **test** is a small function that checks some code *automatically*, so you can rerun every check in a second, every time anything changes. Professional Rust code is full of them, and `cargo test` runs them all.

      ### Checks you already know: assert!

      The **assert macros** panic when a check fails, and do nothing when it passes:

      - `assert!(condition)` panics if the condition is `false`.
      - `assert_eq!(left, right)` panics if the two values are not equal, and shows both.
      - `assert_ne!(left, right)` panics if they *are* equal.

      ```rust run
      fn ticket_price(age: u32) -> u32 {
          if age < 12 { 500 } else { 1200 }
      }

      fn main() {
          assert_eq!(ticket_price(8), 500);
          assert_eq!(ticket_price(40), 1200);
          assert!(ticket_price(11) < ticket_price(12));
          assert_ne!(ticket_price(0), 0);
          println!("all checks passed");
      }
      ```

      ```output
      all checks passed
      ```

      ### Turning checks into tests

      Checks in `main` are clumsy: the first failure stops everything, and they run every time the program runs. Real tests live in their own functions, marked with the `#[test]` **attribute**:

      ```rust
      fn ticket_price(age: u32) -> u32 {
          if age < 12 { 500 } else { 1200 }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn children_pay_500() {
              assert_eq!(ticket_price(8), 500);
          }

          #[test]
          fn adults_pay_1200() {
              assert_eq!(ticket_price(40), 1200);
          }
      }
      ```

      ```text
      $ cargo test
         Compiling tickets v0.1.0 (/home/you/tickets)
          Finished `test` profile [unoptimized + debuginfo] target(s) in 0.42s
           Running unittests src/main.rs (target/debug/deps/tickets-1f2e3d4c5b6a7980)

      running 2 tests
      test tests::adults_pay_1200 ... ok
      test tests::children_pay_500 ... ok

      test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s
      ```

      Piece by piece:

      - `#[test]` marks a function as a test. A test **passes** if it returns normally and **fails** if it panics, which is exactly what a failing `assert!` does.
      - `#[cfg(test)]` means "compile this module only when testing". `cargo build` and `cargo run` leave it out, so test code never ends up in your program.
      - `mod tests` is a child module, so it starts with `use super::*;` to bring the parent's functions (including private ones) into scope.
      - `cargo test` compiles your code in test mode. Instead of running your `main`, Rust builds a **test runner**: a program with its own `main` that calls every `#[test]` function, each one separately, and reports which passed. One failing test doesn't stop the others.
      - Name tests like sentences about behavior (`children_pay_500`): when one fails, the name tells you what broke.

      ### Test exercises on this site

      In test exercises you write `#[test]` functions, and **Check** runs `cargo test`. Your code doesn't need a `fn main`, because the test runner brings its own. Then the site does something extra: it plants bugs, called **mutants**, in the code you're testing (one at a time) and runs your tests again. Each mutant must make at least one of your tests fail. A test suite that passes no matter what the code does isn't protecting anything.

      ### Common mistakes

      - **Forgetting `#[test]`**: the function is just a helper and never runs. `cargo test` reports `running 0 tests`.
      - **Forgetting `use super::*;`**: `error[E0425]: cannot find function `ticket_price` in this scope`.
      - **Tests that never fail**: a test with no assertion, or one that checks the code against itself (`assert_eq!(ticket_price(8), ticket_price(8))`), passes even when the code is wrong.

      **Your turn:** `ticket_price` has three prices: children under 12 pay 500, seniors aged 65 and over pay 700, everyone else pays 1200. Write **three tests** in the `tests` module, one for each kind of visitor. Don't change `ticket_price`.
    mode: test
    minTests: 3
    seed: |
      fn ticket_price(age: u32) -> u32 {
          if age < 12 {
              500
          } else if age >= 65 {
              700
          } else {
              1200
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
      }
    solution: |
      fn ticket_price(age: u32) -> u32 {
          if age < 12 {
              500
          } else if age >= 65 {
              700
          } else {
              1200
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
          #[test]
          fn children_pay_500() {
              assert_eq!(ticket_price(8), 500);
          }

          #[test]
          fn adults_pay_1200() {
              assert_eq!(ticket_price(30), 1200);
          }

          #[test]
          fn seniors_pay_700() {
              assert_eq!(ticket_price(70), 700);
          }
      }
    mutants:
      - name: children are charged the adult price
        find: "500"
        replace: "1200"
      - name: seniors are charged the adult price
        find: "700"
        replace: "1200"
      - name: adults are charged the senior price
        find: "1200"
        replace: "700"
    hints:
      - "Each test is `#[test] fn some_name() { assert_eq!(ticket_price(AGE), PRICE); }` inside `mod tests`."
      - "Pick one age from each group: a child (say 8), an adult (30) and a senior (70)."
      - "`#[test] fn seniors_pay_700() { assert_eq!(ticket_price(70), 700); }`, and the same shape for the other two."
    more:
      - task: |
          `is_valid_username` accepts names of 3 to 12 characters (counting characters, not bytes) made only of lowercase letters, digits and `_`. Write at least **3 tests** that check valid and invalid names. Use `assert!` for names that should pass and `assert!(!...)` for names that should fail.
        mode: test
        minTests: 3
        seed: |
          fn is_valid_username(name: &str) -> bool {
              let len_ok = (3..=12).contains(&name.chars().count());
              let chars_ok = name.chars().all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == '_');
              len_ok && chars_ok
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here.
          }
        solution: |
          fn is_valid_username(name: &str) -> bool {
              let len_ok = (3..=12).contains(&name.chars().count());
              let chars_ok = name.chars().all(|c| c.is_ascii_lowercase() || c.is_ascii_digit() || c == '_');
              len_ok && chars_ok
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here.
              #[test]
              fn accepts_a_normal_name() {
                  assert!(is_valid_username("ferris_42"));
              }

              #[test]
              fn rejects_names_that_are_too_short_or_too_long() {
                  assert!(!is_valid_username("ab"));
                  assert!(!is_valid_username("abcdefghijklm"));
              }

              #[test]
              fn rejects_capitals_and_spaces() {
                  assert!(!is_valid_username("Ferris"));
                  assert!(!is_valid_username("big crab"));
              }
          }
        mutants:
          - name: length is not checked
            find: "len_ok && chars_ok"
            replace: "chars_ok"
          - name: characters are not checked
            find: "len_ok && chars_ok"
            replace: "len_ok"
          - name: capital letters are allowed
            find: "c.is_ascii_lowercase()"
            replace: "c.is_ascii_alphabetic()"
        hints:
          - "Write one test for a good name (`assert!(is_valid_username(\"ferris_42\"))`) and several for bad ones."
          - "Make sure some bad name is bad only because of its length, and another only because of its characters (like a capital letter)."
      - task: |
          `cart_total` adds up the prices in a cart (in cents) and adds a 499 cent shipping fee, but shipping is free when the items cost 5000 or more. An empty cart costs 0 (no shipping). Write at least **3 tests**, including one for the empty cart. Use `assert_eq!`.
        mode: test
        minTests: 3
        seed: |
          fn cart_total(prices: &[u32]) -> u32 {
              let items: u32 = prices.iter().sum();
              if items == 0 || items >= 5000 {
                  items
              } else {
                  items + 499
              }
          }
        solution: |
          fn cart_total(prices: &[u32]) -> u32 {
              let items: u32 = prices.iter().sum();
              if items == 0 || items >= 5000 {
                  items
              } else {
                  items + 499
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn small_orders_pay_shipping() {
                  assert_eq!(cart_total(&[1000, 250]), 1749);
              }

              #[test]
              fn big_orders_ship_free() {
                  assert_eq!(cart_total(&[3000, 2500]), 5500);
              }

              #[test]
              fn empty_cart_costs_nothing() {
                  assert_eq!(cart_total(&[]), 0);
              }
          }
        mutants:
          - name: shipping is always charged
            find: "items == 0 || items >= 5000"
            replace: "items == 0"
          - name: empty carts pay shipping
            find: "items == 0 || items >= 5000"
            replace: "items >= 5000"
          - name: only the first item is counted
            find: "prices.iter().sum()"
            replace: "prices.iter().take(1).sum()"
        hints:
          - "There's no `tests` module this time: write `#[cfg(test)] mod tests { use super::*; ... }` yourself."
          - "Use carts with two or more items, one under 5000 and one over, plus `cart_total(&[])`."

  - title: "assert_eq!, messages, and comparing your own types"
    id: testing-2
    text: |
      When a test fails, the first thing you read is its message. Good messages save real time.

      ### What a failure looks like

      `assert_eq!` and `assert_ne!` print both values when they fail. By convention the first argument is the value your code produced and the second is the one you expected, though Rust only calls them `left` and `right`. Any extra arguments after the two values are a **custom message**, written like a `format!` string:

      ```rust panics
      fn add_vat(cents: u32) -> u32 {
          cents + cents / 5
      }

      fn main() {
          assert_eq!(add_vat(100), 120);
          println!("100 is fine");
          let price = 7;
          assert_eq!(add_vat(price), 9, "add_vat({price}) should round up");
          println!("7 is fine");
      }
      ```

      ```output
      100 is fine
      ```

      The second assert fails (`7 / 5` is 1, so the result is 8) and the program stops with:

      ```text
      thread 'main' (4242) panicked at src/main.rs:9:5:
      assertion `left == right` failed: add_vat(7) should round up
        left: 8
       right: 9
      ```

      The message names the input, so you know which case failed without opening the test. That matters most in tests that check many inputs.

      ### Comparing your own types

      `assert_eq!` needs two things from the values: `PartialEq` (to compare them with `==`) and `Debug` (to print them when they differ). For your own structs and enums, derive both:

      ```rust run
      #[derive(Debug, PartialEq)]
      struct Order {
          qty: u32,
          item: String,
      }

      fn parse_order(line: &str) -> Option<Order> {
          let (qty, item) = line.split_once(" x ")?;
          let qty: u32 = qty.trim().parse().ok()?;
          Some(Order { qty, item: item.trim().to_string() })
      }

      fn main() {
          assert_eq!(parse_order("3 x apple"), Some(Order { qty: 3, item: String::from("apple") }));
          assert_eq!(parse_order("lots of apples"), None);
          println!("{:?}", parse_order("2 x pear"));
      }
      ```

      ```output
      Some(Order { qty: 2, item: "pear" })
      ```

      Comparing the whole `Option<Order>` in one assert checks every field at once, and if it fails you see both complete values.

      ### Floating point

      `0.1 + 0.2 == 0.3` is `false` with floats (try it), so don't `assert_eq!` computed `f64`s. Check they're close instead: `assert!((actual - expected).abs() < 1e-9, "got {actual}")`.

      ### Common mistakes

      - **Missing `Debug`**: `assert_eq!` on a struct without it is `error[E0277]: `Order` doesn't implement `Debug``. Missing `PartialEq` gives `error[E0369]: binary operation `==` cannot be applied`.
      - **Only checking the happy path.** A test with a typical input catches typos; bugs live in the unusual inputs.
      - **`assert!(a == b)` instead of `assert_eq!(a, b)`**: it works, but a failure only says the condition was false, without showing the two values.

      **Your turn:** `apply_discount` takes an order total in cents and a discount code: `SAVE10` takes 10% off, `HALF` halves the total (rounding down, so an odd number of cents loses the half cent), and any other code changes nothing. Write at least **3 tests**, and give at least one `assert_eq!` a custom message. Your tests must catch every planted bug.
    mode: test
    minTests: 3
    seed: |
      fn apply_discount(total_cents: u32, code: &str) -> u32 {
          match code {
              "SAVE10" => total_cents - total_cents / 10,
              "HALF" => total_cents / 2,
              _ => total_cents,
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
      }
    solution: |
      fn apply_discount(total_cents: u32, code: &str) -> u32 {
          match code {
              "SAVE10" => total_cents - total_cents / 10,
              "HALF" => total_cents / 2,
              _ => total_cents,
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
          #[test]
          fn save10_takes_ten_percent_off() {
              assert_eq!(apply_discount(2000, "SAVE10"), 1800, "SAVE10 on 2000");
          }

          #[test]
          fn half_rounds_down() {
              assert_eq!(apply_discount(1001, "HALF"), 500, "HALF on 1001");
          }

          #[test]
          fn unknown_codes_change_nothing() {
              assert_eq!(apply_discount(1500, "FREESTUFF"), 1500, "unknown code");
          }
      }
    require:
      - pattern: 'assert_(eq|ne)!\([^;]+,[^;]+,\s*""'
        message: "Give at least one `assert_eq!` a custom message as its third argument."
    mutants:
      - name: SAVE10 takes off 20%
        find: "total_cents - total_cents / 10"
        replace: "total_cents - total_cents / 5"
      - name: HALF rounds up
        find: "total_cents / 2"
        replace: "(total_cents + 1) / 2"
      - name: unknown codes get 10% off
        find: "_ => total_cents,"
        replace: "_ => total_cents - total_cents / 10,"
    hints:
      - "One test per code: `SAVE10`, `HALF`, and some made-up code."
      - "To catch the rounding bug, test `HALF` with an odd total, like 1001 (which should give 500)."
      - "A message goes after the two values: `assert_eq!(apply_discount(2000, \"SAVE10\"), 1800, \"SAVE10 on 2000\");`"
    more:
      - task: |
          `parse_order` turns a line like `3 x apple` into an `Order`. Quantities must be whole numbers of at least 1, and spaces around the item name are ignored. Anything else gives `None`. Write at least **3 tests** that compare whole `Option<Order>` values with `assert_eq!`.
        mode: test
        minTests: 3
        seed: |
          #[derive(Debug, PartialEq)]
          struct Order {
              qty: u32,
              item: String,
          }

          fn parse_order(line: &str) -> Option<Order> {
              let (qty, item) = line.split_once(" x ")?;
              let qty: u32 = qty.trim().parse().ok()?;
              if qty == 0 {
                  return None;
              }
              Some(Order { qty, item: item.trim().to_string() })
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here.
          }
        solution: |
          #[derive(Debug, PartialEq)]
          struct Order {
              qty: u32,
              item: String,
          }

          fn parse_order(line: &str) -> Option<Order> {
              let (qty, item) = line.split_once(" x ")?;
              let qty: u32 = qty.trim().parse().ok()?;
              if qty == 0 {
                  return None;
              }
              Some(Order { qty, item: item.trim().to_string() })
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here.
              #[test]
              fn parses_quantity_and_trimmed_item() {
                  let expected = Order { qty: 3, item: String::from("green apple") };
                  assert_eq!(parse_order("3 x  green apple "), Some(expected));
              }

              #[test]
              fn rejects_zero_quantity() {
                  assert_eq!(parse_order("0 x pear"), None);
              }

              #[test]
              fn rejects_a_quantity_that_is_not_a_number() {
                  assert_eq!(parse_order("many x pear"), None);
              }
          }
        mutants:
          - name: item name is not trimmed
            find: "item.trim().to_string()"
            replace: "item.to_string()"
          - name: zero quantity is accepted
            find: "qty == 0"
            replace: "qty > 1_000_000"
          - name: quantity is off by one
            find: "Some(Order { qty, item"
            replace: "Some(Order { qty: qty + 1, item"
          - name: bad numbers become 1
            find: "qty.trim().parse().ok()?"
            replace: "qty.trim().parse().unwrap_or(1)"
        hints:
          - "Build the expected value and compare: `assert_eq!(parse_order(\"3 x apple\"), Some(Order { qty: 3, item: String::from(\"apple\") }));`"
          - "Add extra spaces around the item name in one test, and test a `0` quantity and a quantity that isn't a number."
      - task: |
          `to_fahrenheit` converts Celsius to Fahrenheit (`F = C * 9 / 5 + 32`). Float results shouldn't be compared with `==`, so write a helper `fn close(a: f64, b: f64) -> bool` (true when they differ by less than `1e-9`) and use it in at least **2 tests** with `assert!`, including a custom message that shows the actual value.
        mode: test
        minTests: 2
        seed: |
          fn to_fahrenheit(celsius: f64) -> f64 {
              celsius * 9.0 / 5.0 + 32.0
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn close(a: f64, b: f64) -> bool {
                  todo!()
              }

              // Write your #[test] functions here.
          }
        solution: |
          fn to_fahrenheit(celsius: f64) -> f64 {
              celsius * 9.0 / 5.0 + 32.0
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn close(a: f64, b: f64) -> bool {
                  (a - b).abs() < 1e-9
              }

              // Write your #[test] functions here.
              #[test]
              fn freezing_point() {
                  let f = to_fahrenheit(0.0);
                  assert!(close(f, 32.0), "0 C gave {f}");
              }

              #[test]
              fn boiling_point() {
                  let f = to_fahrenheit(100.0);
                  assert!(close(f, 212.0), "100 C gave {f}");
              }

              #[test]
              fn body_temperature() {
                  let f = to_fahrenheit(37.0);
                  assert!(close(f, 98.6), "37 C gave {f}");
              }
          }
        require:
          - pattern: '\.abs\(\)'
            message: "Write `close` with `(a - b).abs() < 1e-9`."
        forbid:
          - pattern: 'assert_eq!\(\s*to_fahrenheit'
            message: "Don't compare floats with `assert_eq!`; use `assert!(close(...))`."
        mutants:
          - name: adds 23 instead of 32
            find: "+ 32.0"
            replace: "+ 23.0"
          - name: multiplies by 5/9 instead of 9/5
            find: "celsius * 9.0 / 5.0"
            replace: "celsius * 5.0 / 9.0"
        hints:
          - "`fn close(a: f64, b: f64) -> bool { (a - b).abs() < 1e-9 }`"
          - "Two well-known points: 0 C is 32 F and 100 C is 212 F. `assert!(close(to_fahrenheit(100.0), 212.0), \"got {}\", to_fahrenheit(100.0));`"

  - title: Tests that catch bugs
    id: testing-3
    text: |
      A test suite is only as good as the bugs it would catch. Here's a classic: in the Gregorian calendar, a year is a **leap year** if it's divisible by 4, *except* years divisible by 100, *except again* years divisible by 400. So 2024 is a leap year, 1900 isn't, and 2000 is.

      Suppose someone forgot the century rules:

      ```rust run
      fn is_leap_year(year: u32) -> bool {
          year % 4 == 0 // bug: ignores the 100 and 400 rules
      }

      fn main() {
          // "typical" checks, the kind people write first
          for (year, expected) in [(2024, true), (2023, false), (2020, true)] {
              println!("{year}: expected {expected}, got {}", is_leap_year(year));
          }
          println!("1900: got {} (should be false)", is_leap_year(1900));
      }
      ```

      ```output
      2024: expected true, got true
      2023: expected false, got false
      2020: expected true, got true
      1900: got true (should be false)
      ```

      Every "typical" check passes, and the bug sails through. Tests that only use ordinary inputs prove very little.

      ### Think in rules and boundaries

      Good tests come from reading the specification and asking "what would a wrong implementation get wrong?":

      - **One test per rule.** The leap year rules need at least: a normal leap year (2024), a normal non-leap year (2023), a century that isn't a leap year (1900) and a century that is (2000).
      - **Boundaries.** Off-by-one errors live at the edges: if adults are 18 and over, test 17 *and* 18. For `<` versus `<=`, the boundary value itself is the one that tells them apart.
      - **Special inputs.** Empty strings and slices, zero, negative numbers, the maximum value, non-ASCII text.

      ### Mutation testing

      How do you know your tests are good enough? Break the code on purpose and see if a test notices. Each broken copy is a **mutant**; a mutant your tests don't notice has **survived**, and it points at a missing test. That's what this site does with the planted bugs in each exercise, and at work the tool `cargo-mutants` does it automatically for a whole project (it flips `<` to `<=`, replaces function bodies with default values, and so on).

      ### Common mistakes

      - **Testing the implementation instead of the rules**: copying the formula into the test (`assert_eq!(is_leap_year(y), y % 4 == 0)`) repeats the bug instead of catching it. Write expected values you worked out by hand.
      - **One giant test.** Small tests with clear names tell you which rule broke.
      - **Chasing 100% coverage.** Running every line isn't the same as checking every rule: a test can execute code without asserting anything useful about it.

      **Your turn:** `is_leap_year` is correct. Write at least **3 tests** that catch all the planted bugs: a missing 400-year rule, a missing 100-year rule, "every second year is a leap year", and "only multiples of 400 are leap years".
    mode: test
    minTests: 3
    seed: |
      fn is_leap_year(year: u32) -> bool {
          (year % 4 == 0 && year % 100 != 0) || year % 400 == 0
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
      }
    solution: |
      fn is_leap_year(year: u32) -> bool {
          (year % 4 == 0 && year % 100 != 0) || year % 400 == 0
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write your #[test] functions here.
          #[test]
          fn ordinary_years() {
              assert!(is_leap_year(2024), "2024");
              assert!(!is_leap_year(2023), "2023");
              assert!(!is_leap_year(2022), "2022");
          }

          #[test]
          fn centuries_are_not_leap_years() {
              assert!(!is_leap_year(1900), "1900");
              assert!(!is_leap_year(2100), "2100");
          }

          #[test]
          fn every_fourth_century_is_a_leap_year() {
              assert!(is_leap_year(2000), "2000");
              assert!(is_leap_year(1600), "1600");
          }
      }
    mutants:
      - name: the 400-year rule is missing
        find: " || year % 400 == 0"
        replace: ""
      - name: the 100-year rule is missing
        find: "year % 4 == 0 && year % 100 != 0"
        replace: "year % 4 == 0"
      - name: every second year is a leap year
        find: "year % 4 == 0"
        replace: "year % 2 == 0"
      - name: only multiples of 400 are leap years
        find: "(year % 4 == 0 && year % 100 != 0) || "
        replace: ""
    hints:
      - "Each rule needs its own example year: a normal leap year, a normal non-leap year, a century that isn't leap, and one that is."
      - "\"Every second year\" is only caught by an even year that isn't a multiple of 4, like 2022."
      - "Good years to use: 2024 (leap), 2022 (not), 1900 (not), 2000 (leap)."
    more:
      - task: |
