          `initials` should turn a name into its capitalized initials: `ada lovelace` gives `AL`. The starter's tests show two bugs: extra spaces crash it, and so does a name starting with an accented letter. Fix `initials` so all three tests pass (keep them).
        mode: test
        minTests: 3
        seed: |
          fn initials(name: &str) -> String {
              name.split(' ').map(|w| w[0..1].to_uppercase()).collect()
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn two_words() {
                  assert_eq!(initials("ada lovelace"), "AL");
              }

              #[test]
              fn extra_spaces_are_ignored() {
                  assert_eq!(initials("  grace   hopper "), "GH");
              }

              #[test]
              fn accented_letters_work() {
                  assert_eq!(initials("émile zola"), "ÉZ");
              }
          }
        solution: |
          fn initials(name: &str) -> String {
              name.split_whitespace()
                  .filter_map(|w| w.chars().next())
                  .flat_map(|c| c.to_uppercase())
                  .collect()
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn two_words() {
                  assert_eq!(initials("ada lovelace"), "AL");
              }

              #[test]
              fn extra_spaces_are_ignored() {
                  assert_eq!(initials("  grace   hopper "), "GH");
              }

              #[test]
              fn accented_letters_work() {
                  assert_eq!(initials("émile zola"), "ÉZ");
              }
          }
        harness: |
          #[test]
          fn an_empty_name_has_no_initials() {
              assert_eq!(initials(""), "", "initials(\"\")");
          }

          #[test]
          fn three_names() {
              assert_eq!(initials("mary ann evans"), "MAE", "initials(\"mary ann evans\")");
          }

          #[test]
          fn tabs_count_as_spaces() {
              assert_eq!(initials("linus\ttorvalds"), "LT", "initials with a tab");
          }

          #[test]
          fn non_latin_letters() {
              assert_eq!(initials("ðórr ögn"), "ÐÖ", "initials(\"ðórr ögn\")");
          }
        hints:
          - "`split(' ')` makes empty words between spaces, and `w[0..1]` panics on an empty word and on letters that take more than one byte."
          - "Use `split_whitespace()`, and take each word's first character with `w.chars().next()` (an `Option<char>`)."
          - "`name.split_whitespace().filter_map(|w| w.chars().next()).flat_map(|c| c.to_uppercase()).collect()`"
      - task: |
          Practice the TDD loop from scratch. Write `parse_time(s: &str) -> Option<u32>`, which turns `"HH:MM"` into minutes after midnight (`"01:30"` gives `90`). Hours go from 0 to 23 and minutes from 0 to 59; anything else (a missing colon, letters, `"24:00"`, `"12:60"`) gives `None`.

          Write at least **3 tests first**, watch them fail against `todo!()`, then write the function until they pass.
        mode: test
        minTests: 3
        seed: |
          fn parse_time(s: &str) -> Option<u32> {
              todo!()
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here first.
          }
        solution: |
          fn parse_time(s: &str) -> Option<u32> {
              let (h, m) = s.split_once(':')?;
              let h: u32 = h.parse().ok()?;
              let m: u32 = m.parse().ok()?;
              if h > 23 || m > 59 {
                  return None;
              }
              Some(h * 60 + m)
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here first.
              #[test]
              fn parses_a_valid_time() {
                  assert_eq!(parse_time("01:30"), Some(90));
                  assert_eq!(parse_time("00:00"), Some(0));
                  assert_eq!(parse_time("23:59"), Some(1439));
              }

              #[test]
              fn rejects_out_of_range_values() {
                  assert_eq!(parse_time("24:00"), None);
                  assert_eq!(parse_time("12:60"), None);
              }

              #[test]
              fn rejects_malformed_text() {
                  assert_eq!(parse_time("1230"), None);
                  assert_eq!(parse_time("ab:cd"), None);
              }
          }
        harness: |
          #[test]
          fn converts_hours_and_minutes() {
              assert_eq!(parse_time("01:30"), Some(90), "parse_time(\"01:30\")");
              assert_eq!(parse_time("12:05"), Some(725), "parse_time(\"12:05\")");
          }

          #[test]
          fn accepts_the_extremes() {
              assert_eq!(parse_time("00:00"), Some(0), "parse_time(\"00:00\")");
              assert_eq!(parse_time("23:59"), Some(1439), "parse_time(\"23:59\")");
          }

          #[test]
          fn rejects_hour_24_and_minute_60() {
              assert_eq!(parse_time("24:00"), None, "parse_time(\"24:00\")");
              assert_eq!(parse_time("10:60"), None, "parse_time(\"10:60\")");
          }

          #[test]
          fn rejects_text_without_a_colon_or_with_letters() {
              assert_eq!(parse_time("1030"), None, "parse_time(\"1030\")");
              assert_eq!(parse_time("ten:30"), None, "parse_time(\"ten:30\")");
              assert_eq!(parse_time(""), None, "parse_time(\"\")");
          }
        hints:
          - "Start with tests like `assert_eq!(parse_time(\"01:30\"), Some(90));` and `assert_eq!(parse_time(\"24:00\"), None);`."
          - "Split with `s.split_once(':')?`, then parse each half with `.parse().ok()?`."
          - "Reject `h > 23 || m > 59`, otherwise return `Some(h * 60 + m)`."

  - title: Organizing tests
    id: testing-6
    text: |
      As a project grows, so does its test suite. Rust has three kinds of tests, and `cargo test` runs all of them.

      ### Unit tests: next to the code

      Everything you've written so far: a `#[cfg(test)] mod tests` at the bottom of each file, testing that file's functions, including private ones. They're fast and precise. Put shared setup in ordinary helper functions inside the module (no `#[test]` on them):

      ```rust
      #[cfg(test)]
      mod tests {
          use super::*;

          fn stocked() -> Inventory {      // a helper, not a test
              let mut inv = Inventory::new();
              inv.add("apple", 5);
              inv
          }

          #[test]
          fn removing_some_leaves_the_rest() {
              let mut inv = stocked();
              assert_eq!(inv.remove("apple", 2), Ok(3));
          }
      }
      ```

      ### Integration tests: the tests/ folder

      Files in a `tests/` folder next to `src/` are **integration tests**. Each file is compiled as a separate crate that uses your library like any other user would, so it can only reach your `pub` items:

      ```text
      calendar/
      ├── Cargo.toml
      ├── src/
      │   └── lib.rs          pub fn is_leap_year(...), with unit tests inside
      └── tests/
          ├── leap_years.rs   integration tests
          └── common/
              └── mod.rs      helpers shared by several test files
      ```

      ```rust
      // tests/leap_years.rs
      use calendar::is_leap_year;

      #[test]
      fn year_2000_is_a_leap_year() {
          assert!(is_leap_year(2000));
      }
      ```

      No `#[cfg(test)]` needed there: the whole folder only exists for tests. Integration tests need a library crate (`src/lib.rs`); a binary-only project usually moves its logic into `lib.rs` and keeps `main.rs` small, partly so it can be tested this way.

      ### Doc tests: examples that can't go stale

      Code blocks in documentation comments (`///`, covered in the tooling module) are compiled and run by `cargo test` too. An example in the docs that no longer works fails the build:

      ```rust
      /// Returns true for leap years.
      ///
      /// ```
      /// assert!(calendar::is_leap_year(2024));
      /// assert!(!calendar::is_leap_year(1900));
      /// ```
      pub fn is_leap_year(year: u32) -> bool {
          (year % 4 == 0 && year % 100 != 0) || year % 400 == 0
      }
      ```

      ```text
      $ cargo test
           Running unittests src/lib.rs (target/debug/deps/calendar-02d0b668d0f176bb)
      running 2 tests
      test tests::century_is_not_leap ... ok
      test tests::divisible_by_four_is_leap ... ok
      test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

           Running tests/leap_years.rs (target/debug/deps/leap_years-6feefd48868830b4)
      running 1 test
      test year_2000_is_a_leap_year ... ok
      test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out

         Doc-tests calendar
      running 1 test
      test src/lib.rs - is_leap_year (line 3) ... ok
      test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
      ```

      (On this site everything lives in one file, so exercises use unit tests; integration and doc tests need a real Cargo project.)

      ### Running some of the tests

      | Command | Runs |
      |---|---|
      | `cargo test leap` | only tests whose name contains `leap` |
      | `cargo test --test leap_years` | one integration test file |
      | `cargo test --doc` | only doc tests |
      | `cargo test -- --nocapture` | shows `println!` output from passing tests (hidden by default) |
      | `cargo test -- --ignored` | the `#[ignore]` tests |

      ### Table-driven tests

      When many inputs follow the same rule, list them as data and loop. Adding a case is one line, and the message says which case failed:

      ```rust run
      fn wind_label(kmh: u32) -> &'static str {
          match kmh {
              0..=19 => "calm",
              20..=49 => "breezy",
              50..=88 => "gale",
              _ => "storm",
          }
      }

      fn main() {
          let cases = [(0, "calm"), (19, "calm"), (20, "breezy"), (49, "breezy"), (50, "gale"), (89, "storm")];
          for (kmh, expected) in cases {
              assert_eq!(wind_label(kmh), expected, "wind_label({kmh})");
          }
          println!("{} cases passed", cases.len());
      }
      ```

      ```output
      6 cases passed
      ```

      ### Common mistakes

      - **Integration tests reaching for private items**: `error[E0603]: function `helper` is private`. Test through the public API, or write a unit test instead.
      - **Tests that depend on each other**: tests run in parallel and in any order. Each test should set up its own data (that's what helpers are for).
      - **Debug `println!` in tests that "doesn't show up"**: passing tests' output is captured. Use `-- --nocapture`.

      **Your turn:** write **one table-driven test** for `classify_temp`: an array of `(celsius, expected)` pairs and a `for (celsius, expected) in ...` loop with an `assert_eq!` that has a message. Choose the cases so every planted boundary bug is caught: 0 and below is `freezing`, 1 to 14 `cold`, 15 to 24 `mild`, 25 and up `hot`.
    mode: test
    minTests: 1
    seed: |
      fn classify_temp(celsius: i32) -> &'static str {
          if celsius <= 0 {
              "freezing"
          } else if celsius < 15 {
              "cold"
          } else if celsius < 25 {
              "mild"
          } else {
              "hot"
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write a table-driven #[test] here.
      }
    solution: |
      fn classify_temp(celsius: i32) -> &'static str {
          if celsius <= 0 {
              "freezing"
          } else if celsius < 15 {
              "cold"
          } else if celsius < 25 {
              "mild"
          } else {
              "hot"
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          // Write a table-driven #[test] here.
          #[test]
          fn classifies_every_band_and_boundary() {
              let cases = [
                  (-10, "freezing"),
                  (0, "freezing"),
                  (1, "cold"),
                  (14, "cold"),
                  (15, "mild"),
                  (24, "mild"),
                  (25, "hot"),
                  (40, "hot"),
              ];
              for (celsius, expected) in cases {
                  assert_eq!(classify_temp(celsius), expected, "classify_temp({celsius})");
              }
          }
      }
    require:
      - pattern: 'for\s*\(\s*\w+\s*,\s*\w+\s*\)\s+in'
        message: "Loop over the cases with `for (celsius, expected) in cases`."
      - pattern: 'assert_eq!\([^;]+,[^;]+,\s*""'
        message: "Give the `assert_eq!` in the loop a message that names the input, like `\"classify_temp({celsius})\"`."
    mutants:
      - name: "0 counts as cold"
        find: "celsius <= 0"
        replace: "celsius < 0"
      - name: "15 counts as cold"
        find: "celsius < 15"
        replace: "celsius <= 15"
      - name: "25 counts as mild"
        find: "celsius < 25"
        replace: "celsius <= 25"
      - name: "hot weather is called mild"
        find: "\"hot\""
        replace: "\"mild\""
      - name: "1 counts as freezing"
        find: "celsius <= 0"
        replace: "celsius <= 1"
    hints:
      - "`let cases = [(0, \"freezing\"), (1, \"cold\"), ...];` then `for (celsius, expected) in cases { assert_eq!(classify_temp(celsius), expected, \"classify_temp({celsius})\"); }`"
      - "Include both sides of every boundary: 0 and 1, 14 and 15, 24 and 25."
    more:
      - task: |
          Write tests for `Inventory`. First write a helper `fn stocked() -> Inventory` (not a test) in the tests module that returns an inventory with 5 apples and 2 pears. Then write at least **3 tests** that start from `stocked()`.

          The rules: `add` increases the count, `remove` fails with `Err` if the item is unknown or there aren't enough, and otherwise returns `Ok` with the amount left; `count` is 0 for unknown items.
        mode: test
        minTests: 3
        seed: |
          use std::collections::HashMap;

          struct Inventory {
              stock: HashMap<String, u32>,
          }

          impl Inventory {
              fn new() -> Inventory {
                  Inventory { stock: HashMap::new() }
              }

              fn add(&mut self, item: &str, qty: u32) {
                  *self.stock.entry(item.to_string()).or_insert(0) += qty;
              }

              fn remove(&mut self, item: &str, qty: u32) -> Result<u32, String> {
                  let have = self.stock.get_mut(item).ok_or_else(|| format!("unknown item: {item}"))?;
                  if *have < qty {
                      return Err(format!("only {} {item} left", *have));
                  }
                  *have -= qty;
                  Ok(*have)
              }

              fn count(&self, item: &str) -> u32 {
                  self.stock.get(item).copied().unwrap_or(0)
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn stocked() -> Inventory {
                  todo!()
              }

              // Write your #[test] functions here.
          }
        solution: |
          use std::collections::HashMap;

          struct Inventory {
              stock: HashMap<String, u32>,
          }

          impl Inventory {
              fn new() -> Inventory {
                  Inventory { stock: HashMap::new() }
              }

              fn add(&mut self, item: &str, qty: u32) {
                  *self.stock.entry(item.to_string()).or_insert(0) += qty;
              }

              fn remove(&mut self, item: &str, qty: u32) -> Result<u32, String> {
                  let have = self.stock.get_mut(item).ok_or_else(|| format!("unknown item: {item}"))?;
                  if *have < qty {
                      return Err(format!("only {} {item} left", *have));
                  }
                  *have -= qty;
                  Ok(*have)
              }

              fn count(&self, item: &str) -> u32 {
                  self.stock.get(item).copied().unwrap_or(0)
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn stocked() -> Inventory {
                  let mut inv = Inventory::new();
                  inv.add("apple", 5);
                  inv.add("pear", 2);
                  inv
              }

              // Write your #[test] functions here.
              #[test]
              fn adding_more_increases_the_count() {
                  let mut inv = stocked();
                  inv.add("apple", 3);
                  assert_eq!(inv.count("apple"), 8);
              }

              #[test]
              fn removing_returns_what_is_left() {
                  let mut inv = stocked();
                  assert_eq!(inv.remove("apple", 2), Ok(3));
                  assert_eq!(inv.count("apple"), 3);
                  assert_eq!(inv.remove("pear", 2), Ok(0));
              }

              #[test]
              fn removing_too_much_or_unknown_items_fails() {
                  let mut inv = stocked();
                  assert!(inv.remove("pear", 3).is_err());
                  assert!(inv.remove("kiwi", 1).is_err());
                  assert_eq!(inv.count("pear"), 2);
                  assert_eq!(inv.count("kiwi"), 0);
              }
          }
        require:
          - pattern: 'fn\s+stocked\s*\(\s*\)\s*->\s*Inventory'
            message: "Write the helper `fn stocked() -> Inventory`."
          - pattern: 'stocked\(\)[\s\S]*stocked\(\)[\s\S]*stocked\(\)[\s\S]*stocked\(\)'
            message: "Start your tests from the `stocked()` helper."
        mutants:
          - name: add replaces instead of adding
            find: "or_insert(0) += qty"
            replace: "or_insert(0) = qty"
          - name: removing everything is refused
            find: "*have < qty"
            replace: "*have <= qty"
          - name: remove doesn't subtract
            find: "*have -= qty;"
            replace: "*have -= 0;"
          - name: unknown items count as 1
            find: "copied().unwrap_or(0)"
            replace: "copied().unwrap_or(1)"
        hints:
          - "`fn stocked() -> Inventory { let mut inv = Inventory::new(); inv.add(\"apple\", 5); inv.add(\"pear\", 2); inv }`"
          - "Each test starts with `let mut inv = stocked();`. Test adding to an existing item, removing some and all of an item, removing too much, and an unknown item."
      - task: |
          A sensor keeps its last few readings in a `RingBuffer`: it holds at most `capacity` items, and pushing into a full buffer throws away the **oldest** reading. Write at least **3 tests** for `push`, `latest`, `oldest` and `len`. Write the `tests` module yourself.
        mode: test
        minTests: 3
        seed: |
          struct RingBuffer {
              items: Vec<i32>,
              capacity: usize,
          }

          impl RingBuffer {
              fn new(capacity: usize) -> RingBuffer {
                  RingBuffer { items: Vec::new(), capacity }
              }

              fn push(&mut self, value: i32) {
                  if self.items.len() == self.capacity {
                      self.items.remove(0);
                  }
                  self.items.push(value);
              }

              fn latest(&self) -> Option<i32> {
                  self.items.last().copied()
              }

              fn oldest(&self) -> Option<i32> {
                  self.items.first().copied()
              }

              fn len(&self) -> usize {
                  self.items.len()
              }
          }
        solution: |
          struct RingBuffer {
              items: Vec<i32>,
              capacity: usize,
          }

          impl RingBuffer {
              fn new(capacity: usize) -> RingBuffer {
                  RingBuffer { items: Vec::new(), capacity }
              }

              fn push(&mut self, value: i32) {
                  if self.items.len() == self.capacity {
                      self.items.remove(0);
                  }
                  self.items.push(value);
              }

              fn latest(&self) -> Option<i32> {
                  self.items.last().copied()
              }

              fn oldest(&self) -> Option<i32> {
                  self.items.first().copied()
              }

              fn len(&self) -> usize {
                  self.items.len()
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn an_empty_buffer_has_nothing() {
                  let b = RingBuffer::new(3);
                  assert_eq!(b.len(), 0);
                  assert_eq!(b.latest(), None);
                  assert_eq!(b.oldest(), None);
              }

              #[test]
              fn keeps_readings_in_order() {
                  let mut b = RingBuffer::new(3);
                  b.push(10);
                  b.push(20);
                  assert_eq!(b.oldest(), Some(10));
                  assert_eq!(b.latest(), Some(20));
              }

              #[test]
              fn a_full_buffer_drops_the_oldest() {
                  let mut b = RingBuffer::new(2);
                  b.push(1);
                  b.push(2);
                  b.push(3);
                  assert_eq!(b.len(), 2);
                  assert_eq!(b.oldest(), Some(2));
                  assert_eq!(b.latest(), Some(3));
              }
          }
        mutants:
          - name: keeps one item too many
            find: "self.items.len() == self.capacity"
            replace: "self.items.len() == self.capacity + 1"
          - name: drops the newest instead of the oldest
            find: "self.items.remove(0);"
            replace: "self.items.pop();"
          - name: latest returns the oldest
            find: "self.items.last().copied()"
            replace: "self.items.first().copied()"
        hints:
          - "Start with `#[cfg(test)] mod tests { use super::*; ... }`."
          - "The interesting case is overflow: push 3 values into a buffer of capacity 2, then check `len()`, `oldest()` and `latest()`."
