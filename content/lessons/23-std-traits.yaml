              assert_eq!(leaderboard(&[("solo", 12.0)]), vec!["1. solo 12"], "leaderboard with one runner");
          }

          #[test]
          fn no_runners() {
              assert_eq!(leaderboard(&[]), Vec::<String>::new(), "leaderboard(&[])");
          }
