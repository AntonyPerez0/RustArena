      - task: |
          Write `fn leaderboard(entries: &[(&str, f64)]) -> Vec<String>` for a race: each entry is a name and a time in seconds. Return lines like `1. ana 9.58`, fastest time first, with equal times ordered by name. Use `sort_by` on a copy of the entries (`entries.to_vec()`), with `total_cmp` for the times and `.then(...)` for the names. Print times with `{}`, so `12.0` shows as `12`.
