          let (a, b) = (v(3.0, 1.0), v(0.5, 0.25));
          assert_eq!(a - b, a + -b, "a - b compared with a + -b");
      }
    hints:
      - "`Sub` looks just like `Add`: `type Output = Vector2;` and `fn sub(self, other: Vector2) -> Vector2`."
      - "`Neg` has only one operand: `fn neg(self) -> Vector2 { Vector2 { x: -self.x, y: -self.y } }`, plus `type Output = Vector2;`."
