          volume: u8,
          difficulty: String,
          fullscreen: bool,
      }

      impl Default for GameSettings {
          fn default() -> Self {
              GameSettings { volume: 80, difficulty: String::from("normal"), fullscreen: true }
          }
      }

      fn quiet_settings() -> GameSettings {
          GameSettings { volume: 10, ..Default::default() }
      }
    require:
