              println!("open {id}");
              Connection { id }
          }
      }

      // impl Drop for Connection { ... }

      fn main() {
          let a = Connection::open(1);
          {
              let b = Connection::open(2);
              println!("using {}", b.id);
          }
          let _c = Connection::open(3);
          drop(a);
          println!("end of main");
      }
    solution: |
