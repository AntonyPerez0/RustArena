          Implement `FromStr` for `Color` so that web colors like `"#ff8800"` parse into `Color { r: 255, g: 136, b: 0 }`. The text must be exactly 7 characters: a `#` followed by 6 hex digits (upper or lower case). Anything else is an `Err`.

          `u8::from_str_radix(text, 16)` parses a hex number such as `"ff"` into 255 (it returns a `Result`, like `parse`). Slice out the pairs with `&s[1..3]`, `&s[3..5]` and `&s[5..7]`.
        seed: |
