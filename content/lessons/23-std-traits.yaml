          }

          #[test]
          fn accepts_a_headline() {
              let h = Headline(String::from("Rust tops survey again"));
              assert_eq!(word_count(&h), 4, "word_count(&headline)");
          }

          #[test]
          fn empty_text_has_no_words() {
              assert_eq!(word_count(""), 0, "word_count(\"\")");
          }
