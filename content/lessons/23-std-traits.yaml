          assert_eq!(saved.unwrap_or_default().volume, 80, "None.unwrap_or_default().volume");
      }
    hints:
      - "`impl Default for GameSettings { fn default() -> Self { GameSettings { ... } } }` with all three fields."
      - "`GameSettings { volume: 10, ..Default::default() }`"
