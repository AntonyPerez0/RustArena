id: std-traits
title: Standard Library Traits
phase: "Errors and abstraction"
summary: The traits that make your types feel built in. Convert with From, TryFrom and FromStr, use operators like + and [] on your own types, sort them with Ord, give them defaults, and run cleanup code with Drop.
roadmap: [Traits & Generics, Trait Definitions & Implementations, Trait Bounds & Associated Types]
steps:
  - title: From and Into
    id: std-traits-1
    text: |
      Converting one type into another is so common that the standard library has traits for it. `impl From<A> for B` says "a `B` can always be made from an `A`". The conversion can't fail, so it returns a plain `B`, not a `Result`.

      You've used `From` many times already: `String::from("hi")` is `From<&str> for String`, and in the custom errors module you wrote `From` impls so `?` could convert errors. Here it is for your own units:

      ```rust run
      #[derive(Debug, Clone, Copy)]
      struct Celsius(f64);

      #[derive(Debug, Clone, Copy)]
      struct Fahrenheit(f64);

      impl From<Celsius> for Fahrenheit {
          fn from(c: Celsius) -> Self {
              Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)
          }
      }

      fn main() {
          let body = Celsius(37.0);
          let f = Fahrenheit::from(body);
          println!("{:.1}°C is {:.1}°F", body.0, f.0);

          let boiling: Fahrenheit = Celsius(100.0).into();
          println!("water boils at {:.1}°F", boiling.0);
      }
      ```

      ```output
      37.0°C is 98.6°F
      water boils at 212.0°F
      ```

      - `impl From<Celsius> for Fahrenheit` has one method, `fn from(c: Celsius) -> Self`. Inside a trait impl, `Self` is the type being implemented (here `Fahrenheit`).
      - `Fahrenheit::from(body)` calls it directly.
      - `.into()` is the same conversion seen from the other side. You never implement `Into` yourself: the standard library gives every type `Into<B>` for free as soon as `B: From<A>`. Always implement `From` (clippy warns with `from_over_into` if you implement `Into` directly).
      - `.into()` has to know the **target type**, so it usually needs an annotation like `let boiling: Fahrenheit`, or a function parameter type to aim at.

      ### Into in parameters: friendly APIs

      A very common pattern at work: accept `impl Into<String>` so callers can pass either a `&str` or a `String`:

      ```rust run
      struct User {
          name: String,
      }

      impl User {
          fn new(name: impl Into<String>) -> Self {
              User { name: name.into() }
          }
      }

      fn main() {
          let a = User::new("ana");
          let b = User::new(String::from("bo"));
          println!("{} {}", a.name, b.name);
      }
      ```

      ```output
      ana bo
      ```

      With a `&str` the function allocates a new `String`; with a `String` it just moves it in, no copy. Callers don't have to write `.to_string()` everywhere.

      ### When From is the right trait

      `From` promises a conversion that **always works** and is **obvious**: there is only one sensible answer. Celsius to Fahrenheit, `u8` to `u32`, `&str` to `String`. If a conversion can fail (a number that might be out of range), use `TryFrom` (next step). If it loses information or there are several reasonable answers (seconds to minutes: round down? up?), write a normal method with a clear name instead.

      ### Common mistakes

      - **`.into()` without a target type:**

      ```rust compile_fail
      struct Celsius(f64);
      struct Fahrenheit(f64);

      impl From<Celsius> for Fahrenheit {
          fn from(c: Celsius) -> Self {
              Fahrenheit(c.0 * 1.8 + 32.0)
          }
      }

      fn main() {
          let f = Celsius(100.0).into();
          println!("{}", f.0);
      }
      ```

      ```error
      error[E0282]: type annotations needed
      ```

      Many types could be made from a `Celsius`, so Rust can't guess. Write `let f: Fahrenheit = ...`.

      - **Implementing `From` in the wrong direction.** `impl From<Celsius> for Fahrenheit` lets you turn Celsius into Fahrenheit, not the other way. Each direction is its own impl.

      **Your turn:** one foot is exactly 0.3048 meters. Implement `From<Feet> for Meters` and `From<Meters> for Feet`, so both `Meters::from(Feet(10.0))` and `let f: Feet = Meters(3.048).into();` work.
    seed: |
      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Meters(f64);

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Feet(f64);

      // impl From<Feet> for Meters { ... }
      // impl From<Meters> for Feet { ... }
    solution: |
      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Meters(f64);

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Feet(f64);

      impl From<Feet> for Meters {
          fn from(f: Feet) -> Self {
              Meters(f.0 * 0.3048)
          }
      }

      impl From<Meters> for Feet {
          fn from(m: Meters) -> Self {
              Feet(m.0 / 0.3048)
          }
      }
    harness: |
      fn close(a: f64, b: f64) -> bool {
          (a - b).abs() < 1e-9
      }

      #[test]
      fn ten_feet_is_3_048_meters() {
          let m = Meters::from(Feet(10.0));
          assert!(close(m.0, 3.048), "Meters::from(Feet(10.0)) gave {:?}, expected about 3.048", m);
      }

      #[test]
      fn meters_convert_back_with_into() {
          let f: Feet = Meters(3.048).into();
          assert!(close(f.0, 10.0), "Meters(3.048).into() gave {:?}, expected about 10.0", f);
      }

      #[test]
      fn zero_stays_zero() {
          let m: Meters = Feet(0.0).into();
          assert!(close(m.0, 0.0), "Feet(0.0) into Meters gave {:?}", m);
      }

      #[test]
      fn a_round_trip_gives_the_same_length() {
          let back = Feet::from(Meters::from(Feet(123.0)));
          assert!(close(back.0, 123.0), "Feet(123.0) there and back gave {:?}", back);
      }
    hints:
      - "Each direction is its own block: `impl From<Feet> for Meters { fn from(f: Feet) -> Self { ... } }`."
      - "Feet to meters multiplies by 0.3048; meters to feet divides by 0.3048. Read the inner number with `.0`."
    more:
      - task: |
          Colors are often stored as one number like `0xff8800` (red `ff`, green `88`, blue `00`). Implement `From<u32> for Color` and `From<Color> for u32`.

          To take the number apart, `n >> 16` shifts it right by 16 bits (2 hex digits = 8 bits each), and `& 0xff` keeps only the lowest 8 bits: red is `(n >> 16) & 0xff`, green `(n >> 8) & 0xff`, blue `n & 0xff`. Going back, `(r as u32) << 16` shifts left, and `|` combines the parts. Ignore anything above the lowest 24 bits.
        seed: |
          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Color {
              r: u8,
              g: u8,
              b: u8,
          }

          // impl From<u32> for Color { ... }
          // impl From<Color> for u32 { ... }
        solution: |
          #[derive(Debug, Clone, Copy, PartialEq)]
          struct Color {
              r: u8,
              g: u8,
              b: u8,
          }

          impl From<u32> for Color {
              fn from(n: u32) -> Self {
                  Color {
                      r: ((n >> 16) & 0xff) as u8,
                      g: ((n >> 8) & 0xff) as u8,
                      b: (n & 0xff) as u8,
                  }
              }
          }

          impl From<Color> for u32 {
              fn from(c: Color) -> Self {
                  ((c.r as u32) << 16) | ((c.g as u32) << 8) | c.b as u32
              }
          }
        harness: |
          #[test]
          fn splits_orange_into_parts() {
              assert_eq!(Color::from(0xff8800), Color { r: 255, g: 136, b: 0 }, "Color::from(0xff8800)");
          }

          #[test]
          fn black_and_white() {
              assert_eq!(Color::from(0x000000), Color { r: 0, g: 0, b: 0 }, "Color::from(0x000000)");
              assert_eq!(Color::from(0xffffff), Color { r: 255, g: 255, b: 255 }, "Color::from(0xffffff)");
          }

          #[test]
          fn joins_parts_back_into_a_number() {
              let n: u32 = Color { r: 0x12, g: 0x34, b: 0x56 }.into();
              assert_eq!(n, 0x123456, "Color(0x12, 0x34, 0x56) into u32");
          }

          #[test]
          fn ignores_bits_above_24() {
              assert_eq!(Color::from(0xab00ff00), Color { r: 0, g: 255, b: 0 }, "Color::from(0xab00ff00)");
          }
        hints:
          - "`r: ((n >> 16) & 0xff) as u8`, and the same with 8 and 0 for green and blue."
          - "Back to a number: `((c.r as u32) << 16) | ((c.g as u32) << 8) | c.b as u32`."
      - task: |
          Usernames are stored trimmed and in lowercase. Write a newtype `struct Username(String)` (with `#[derive(Debug, PartialEq)]`) and implement **both** `From<&str>` and `From<String>` for it, each trimming spaces and lowercasing. Then write `fn welcome(user: impl Into<Username>) -> String` that returns `welcome, <name>`, so `welcome("  Ana ")` and `welcome(String::from("BO"))` both work.
        seed: |
          // struct Username ...

          // fn welcome(user: impl Into<Username>) -> String
        solution: |
          #[derive(Debug, PartialEq)]
          struct Username(String);

          impl From<&str> for Username {
              fn from(s: &str) -> Self {
                  Username(s.trim().to_lowercase())
              }
          }

          impl From<String> for Username {
              fn from(s: String) -> Self {
                  Username::from(s.as_str())
              }
          }

          fn welcome(user: impl Into<Username>) -> String {
              let name: Username = user.into();
              format!("welcome, {}", name.0)
          }
        harness: |
          #[test]
          fn trims_and_lowercases_a_str() {
              assert_eq!(Username::from("  Ana "), Username(String::from("ana")), "Username::from(\"  Ana \")");
          }

          #[test]
          fn converts_a_string_too() {
              assert_eq!(Username::from(String::from("FERRIS")), Username(String::from("ferris")), "Username::from(String::from(\"FERRIS\"))");
          }

          #[test]
          fn welcome_accepts_a_str() {
              assert_eq!(welcome("  Ana "), "welcome, ana", "welcome(\"  Ana \")");
          }

          #[test]
          fn welcome_accepts_a_string() {
              assert_eq!(welcome(String::from("BO")), "welcome, bo", "welcome(String::from(\"BO\"))");
          }
        hints:
          - "`impl From<&str> for Username { fn from(s: &str) -> Self { Username(s.trim().to_lowercase()) } }`, and the same idea for `String`."
          - "In `welcome`, convert first: `let name: Username = user.into();` then `format!` with `name.0`."

  - title: TryFrom and TryInto
    id: std-traits-2
    text: |
      Some conversions can fail. An `i32` might be a valid percentage (0 to 100) or not. For those, implement `TryFrom`: it returns a `Result`, so the caller has to deal with the failure.

      ```rust run
      #[derive(Debug)]
      struct Percent(u8);

      impl TryFrom<i32> for Percent {
          type Error = String;

          fn try_from(value: i32) -> Result<Self, Self::Error> {
              if (0..=100).contains(&value) {
                  Ok(Percent(value as u8))
              } else {
                  Err(format!("{value} is not a percentage"))
              }
          }
      }

      fn main() {
          println!("{:?}", Percent::try_from(42));
          println!("{:?}", Percent::try_from(150));

          let p: Result<Percent, _> = 7.try_into();
          if let Ok(percent) = p {
              println!("{}%", percent.0);
          }
      }
      ```

      ```output
      Ok(Percent(42))
      Err("150 is not a percentage")
      7%
      ```

      Piece by piece:

      - `type Error = String;` is an **associated type**: a type the impl chooses and the trait refers to as `Self::Error`. Each `TryFrom` impl picks its own error type: a `String`, your own error enum, anything. (The advanced traits module covers associated types in depth.)
      - `fn try_from(value: i32) -> Result<Self, Self::Error>` does the check and returns `Ok` or `Err`.
      - Just like `From` gives you `Into`, `TryFrom` gives you `TryInto` for free: `7.try_into()`, again with the target type written somewhere.
      - Inside, `value as u8` is safe because we just checked the range.

      ### Safer than `as`

      The standard library implements `TryFrom` between all the integer types. That makes it the safe replacement for `as`, which silently chops numbers that don't fit:

      ```rust run
      fn main() {
          let big: i32 = 300;
          println!("{}", big as u8);
          println!("{:?}", u8::try_from(big));
          println!("{:?}", u8::try_from(200_i32));
      }
      ```

      ```output
      44
      Err(TryFromIntError(PosOverflow))
      Ok(200)
      ```

      `300 as u8` keeps only the lowest 8 bits and gives 44: a bug waiting to happen. Code reviewers will often ask you to replace an `as` with `try_from` when the value could be out of range. Combined with `?` from the errors module, it's one short line:

      ```rust
      let quantity: u8 = u8::try_from(input).map_err(|_| "quantity too large")?;
      ```

      ### Common mistakes

      - **Forgetting `type Error`.** `TryFrom` has two parts to fill in: the type and the method. Leaving out the type gives ``error[E0046]: not all trait items implemented, missing: `Error` ``.
      - **Returning `Self` instead of `Result<Self, Self::Error>`.** The signature must match the trait exactly.
      - **Using `TryFrom` for conversions that can't fail.** If every input is valid, implement `From`: callers then don't have to handle an error that can never happen.

      **Your turn:** implement `TryFrom<u8> for Weekday`, where 1 is Monday and 7 is Sunday. Any other number is an error with the message `invalid day: <n>` (use `type Error = String;`).
    seed: |
      #[derive(Debug, PartialEq)]
      enum Weekday {
          Monday,
          Tuesday,
          Wednesday,
          Thursday,
          Friday,
          Saturday,
          Sunday,
      }

      // impl TryFrom<u8> for Weekday { ... }
    solution: |
      #[derive(Debug, PartialEq)]
      enum Weekday {
          Monday,
          Tuesday,
          Wednesday,
          Thursday,
          Friday,
          Saturday,
          Sunday,
      }

      impl TryFrom<u8> for Weekday {
          type Error = String;

          fn try_from(n: u8) -> Result<Self, Self::Error> {
              match n {
                  1 => Ok(Weekday::Monday),
                  2 => Ok(Weekday::Tuesday),
                  3 => Ok(Weekday::Wednesday),
                  4 => Ok(Weekday::Thursday),
                  5 => Ok(Weekday::Friday),
                  6 => Ok(Weekday::Saturday),
                  7 => Ok(Weekday::Sunday),
                  _ => Err(format!("invalid day: {n}")),
              }
          }
      }
    harness: |
      #[test]
      fn one_is_monday() {
          assert_eq!(Weekday::try_from(1), Ok(Weekday::Monday), "Weekday::try_from(1)");
      }

      #[test]
      fn seven_is_sunday() {
          assert_eq!(Weekday::try_from(7), Ok(Weekday::Sunday), "Weekday::try_from(7)");
      }

      #[test]
      fn the_middle_of_the_week() {
          assert_eq!(Weekday::try_from(3), Ok(Weekday::Wednesday), "Weekday::try_from(3)");
          assert_eq!(Weekday::try_from(5), Ok(Weekday::Friday), "Weekday::try_from(5)");
      }

      #[test]
      fn zero_is_an_error() {
          assert_eq!(Weekday::try_from(0), Err(String::from("invalid day: 0")), "Weekday::try_from(0)");
      }

      #[test]
      fn eight_is_an_error() {
          assert_eq!(Weekday::try_from(8), Err(String::from("invalid day: 8")), "Weekday::try_from(8)");
      }

      #[test]
      fn try_into_works_too() {
          let d: Result<Weekday, String> = 6u8.try_into();
          assert_eq!(d, Ok(Weekday::Saturday), "6u8.try_into()");
      }
    hints:
      - "The impl needs `type Error = String;` and `fn try_from(n: u8) -> Result<Self, Self::Error>`."
      - "A `match n` with arms `1 => Ok(Weekday::Monday)` up to 7, and `_ => Err(format!(\"invalid day: {n}\"))`."
    more:
      - task: |
          Product reviews are 1 to 5 stars. Implement `TryFrom<i32> for Stars` that returns `Err(StarsError::TooLow)` below 1, `Err(StarsError::TooHigh)` above 5, and `Ok(Stars(n))` otherwise. This time the error type is your own enum.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Stars(u8);

          #[derive(Debug, PartialEq)]
          enum StarsError {
              TooLow,
              TooHigh,
          }

          impl TryFrom<i32> for Stars {
              type Error = StarsError;

              fn try_from(n: i32) -> Result<Self, Self::Error> {
                  todo!()
              }
          }
        solution: |
          #[derive(Debug, PartialEq)]
          struct Stars(u8);

          #[derive(Debug, PartialEq)]
          enum StarsError {
              TooLow,
              TooHigh,
          }

          impl TryFrom<i32> for Stars {
              type Error = StarsError;

              fn try_from(n: i32) -> Result<Self, Self::Error> {
                  if n < 1 {
                      Err(StarsError::TooLow)
                  } else if n > 5 {
                      Err(StarsError::TooHigh)
                  } else {
                      Ok(Stars(n as u8))
                  }
              }
          }
        harness: |
          #[test]
          fn accepts_one_to_five() {
              assert_eq!(Stars::try_from(1), Ok(Stars(1)), "Stars::try_from(1)");
              assert_eq!(Stars::try_from(5), Ok(Stars(5)), "Stars::try_from(5)");
          }

          #[test]
          fn zero_is_too_low() {
              assert_eq!(Stars::try_from(0), Err(StarsError::TooLow), "Stars::try_from(0)");
          }

          #[test]
          fn negative_is_too_low() {
              assert_eq!(Stars::try_from(-3), Err(StarsError::TooLow), "Stars::try_from(-3)");
          }

          #[test]
          fn six_is_too_high() {
              assert_eq!(Stars::try_from(6), Err(StarsError::TooHigh), "Stars::try_from(6)");
          }

          #[test]
          fn a_huge_number_is_too_high_not_wrapped() {
              assert_eq!(Stars::try_from(260), Err(StarsError::TooHigh), "Stars::try_from(260)");
          }
        hints:
          - Check the two error cases first with `if n < 1` and `else if n > 5`.
          - "Only after both checks is `n as u8` safe: `Ok(Stars(n as u8))`."
      - task: |
          A warehouse API receives quantities as `i64`, but the storage system keeps them as `u8`. Write `fn to_quantities(values: &[i64]) -> Result<Vec<u8>, String>` that converts every value with `u8::try_from`. On the first value that doesn't fit, return `Err` with the message `value <v> doesn't fit in a u8`. Use `?` so the error stops the loop.
        seed: |
          fn to_quantities(values: &[i64]) -> Result<Vec<u8>, String> {
              todo!()
          }
        solution: |
          fn to_quantities(values: &[i64]) -> Result<Vec<u8>, String> {
              let mut out = Vec::new();
              for &v in values {
                  let q = u8::try_from(v).map_err(|_| format!("value {v} doesn't fit in a u8"))?;
                  out.push(q);
              }
              Ok(out)
          }
        forbid:
          - pattern: '\bas\s+u8\b'
            message: "Don't use `as u8`: it silently chops values. Use `u8::try_from`."
        harness: |
          #[test]
          fn converts_values_that_fit() {
              assert_eq!(to_quantities(&[0, 12, 255]), Ok(vec![0, 12, 255]), "to_quantities(&[0, 12, 255])");
          }

          #[test]
          fn rejects_a_value_too_big() {
              assert_eq!(to_quantities(&[3, 300, 4]), Err(String::from("value 300 doesn't fit in a u8")), "to_quantities(&[3, 300, 4])");
          }

          #[test]
          fn rejects_a_negative_value() {
              assert_eq!(to_quantities(&[-1]), Err(String::from("value -1 doesn't fit in a u8")), "to_quantities(&[-1])");
          }

          #[test]
          fn reports_the_first_bad_value() {
              assert_eq!(to_quantities(&[999, -5]), Err(String::from("value 999 doesn't fit in a u8")), "to_quantities(&[999, -5])");
          }

          #[test]
          fn an_empty_list_is_fine() {
              assert_eq!(to_quantities(&[]), Ok(vec![]), "to_quantities(&[])");
          }
        hints:
          - "`u8::try_from(v)` returns `Result<u8, TryFromIntError>`. Turn its error into your message with `.map_err(|_| format!(...))`."
          - "Put `?` after it inside the loop and push the value: `let q = u8::try_from(v).map_err(|_| format!(\"value {v} doesn't fit in a u8\"))?;`"

  - title: "FromStr: parse into your own type"
    id: std-traits-3
    text: |
      `"42".parse::<i32>()` works because `i32` implements the trait `std::str::FromStr`. Implement it for your own type and `.parse()` works for it too. This is the idiomatic way to turn text (config files, command-line arguments, user input) into a value.

      ```rust run
      use std::str::FromStr;

      #[derive(Debug)]
      struct Setting {
          key: String,
          value: i64,
      }

      impl FromStr for Setting {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              let (key, value) = s.split_once('=').ok_or(format!("missing '=' in {s:?}"))?;
              let key = key.trim();
              if key.is_empty() {
                  return Err(String::from("empty key"));
              }
              let value = value.trim().parse::<i64>().map_err(|_| format!("bad number {value:?}"))?;
              Ok(Setting { key: key.to_string(), value })
          }
      }

      fn main() {
          let s: Setting = "volume = 7".parse().unwrap();
          println!("{} -> {}", s.key, s.value);
          println!("{:?}", "volume".parse::<Setting>());
          println!("{:?}", "=3".parse::<Setting>());
          println!("{:?}", "lives=lots".parse::<Setting>());
      }
      ```

      ```output
      volume -> 7
      Err("missing '=' in \"volume\"")
      Err("empty key")
      Err("bad number \"lots\"")
      ```

      Piece by piece:

      - `type Err = String;` is the error type. It's spelled `Err` here (`TryFrom` uses `Error`): an old naming accident you just have to remember.
      - `fn from_str(s: &str) -> Result<Self, Self::Err>` does the parsing.
      - `s.split_once('=')` splits at the first `=` and returns `Some((before, after))`, or `None` if there's no `=`. `.ok_or(...)` turns that `Option` into a `Result`, and `?` returns the error early.
      - `.map_err(|_| ...)` replaces the `ParseIntError` with a friendlier message. The `|_| ...` is a small inline function (a **closure**, a later module) that ignores the original error.
      - You don't call `from_str` yourself: write `.parse::<Setting>()`, or `.parse()` with the type annotated on the variable.

      ### Why not a `fn parse_setting(s: &str)`?

      It would work, but `FromStr` plugs into the rest of the ecosystem. Code that reads "any value that can be parsed" (`T: FromStr`) works with your type automatically: command-line parsers like clap, config loaders, and your own generic helpers.

      ### Common mistakes

      - **`type Error` instead of `type Err`** gives ``error[E0437]: type `Error` is not a member of trait `FromStr` ``.
      - **Forgetting `use std::str::FromStr;`.** `FromStr` isn't in the prelude, so the `impl` line can't find it (or write `impl std::str::FromStr for ...`).
      - **`unwrap()` on user input.** It's fine in a quick example; in real code, handle the `Err` (with `match` or `?`), because users *will* type `lots`.

      **Your turn:** implement `FromStr` for `Dimensions` so that `"3x4".parse::<Dimensions>()` gives `Ok(Dimensions { width: 3, height: 4 })`. Allow spaces around the numbers (`" 10 x 20 "`). Return an `Err` (any `String` message) if there's no `x` or if either side isn't a whole number.
    seed: |
      use std::str::FromStr;

      #[derive(Debug, PartialEq)]
      struct Dimensions {
          width: u32,
          height: u32,
      }

      impl FromStr for Dimensions {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              todo!()
          }
      }
    solution: |
      use std::str::FromStr;

      #[derive(Debug, PartialEq)]
      struct Dimensions {
          width: u32,
          height: u32,
      }

      impl FromStr for Dimensions {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              let (w, h) = s.split_once('x').ok_or(format!("no 'x' in {s:?}"))?;
              let width = w.trim().parse::<u32>().map_err(|_| format!("bad width {w:?}"))?;
              let height = h.trim().parse::<u32>().map_err(|_| format!("bad height {h:?}"))?;
              Ok(Dimensions { width, height })
          }
      }
    harness: |
      #[test]
      fn parses_3x4() {
          assert_eq!("3x4".parse::<Dimensions>(), Ok(Dimensions { width: 3, height: 4 }), "\"3x4\".parse()");
      }

      #[test]
      fn allows_spaces_around_the_numbers() {
          assert_eq!(" 10 x 20 ".parse::<Dimensions>(), Ok(Dimensions { width: 10, height: 20 }), "\" 10 x 20 \".parse()");
      }

      #[test]
      fn rejects_a_missing_x() {
          assert!("34".parse::<Dimensions>().is_err(), "\"34\".parse() should be an Err");
      }

      #[test]
      fn rejects_a_bad_number() {
          assert!("3xfour".parse::<Dimensions>().is_err(), "\"3xfour\".parse() should be an Err");
          assert!("-3x4".parse::<Dimensions>().is_err(), "\"-3x4\".parse() should be an Err");
      }

      #[test]
      fn rejects_an_empty_string() {
          assert!("".parse::<Dimensions>().is_err(), "\"\".parse() should be an Err");
      }
    hints:
      - "Start with `let (w, h) = s.split_once('x').ok_or(String::from(\"no x\"))?;`"
      - "Then parse each side: `let width = w.trim().parse::<u32>().map_err(|_| String::from(\"bad width\"))?;` and the same for the height."
    more:
