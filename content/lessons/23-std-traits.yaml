    solution: |
      use std::cmp::Ordering;

      #[derive(Debug, PartialEq, Eq)]
      struct Task {
          priority: u8,
          due_day: u32,
          title: String,
      }

      impl Ord for Task {
          fn cmp(&self, other: &Self) -> Ordering {
              other
                  .priority
                  .cmp(&self.priority)
                  .then(self.due_day.cmp(&other.due_day))
                  .then(self.title.cmp(&other.title))
          }
      }

      impl PartialOrd for Task {
          fn partial_cmp(&self, other: &Self) -> Option<Ordering> {
              Some(self.cmp(other))
          }
      }
    harness: |
      fn t(priority: u8, due_day: u32, title: &str) -> Task {
          Task { priority, due_day, title: title.to_string() }
      }

      fn titles(tasks: &[Task]) -> Vec<String> {
          let mut out = Vec::new();
          for task in tasks {
              out.push(task.title.clone());
          }
          out
      }

      #[test]
      fn highest_priority_comes_first() {
          let mut v = vec![t(1, 5, "low"), t(3, 9, "high"), t(2, 1, "mid")];
          v.sort();
          assert_eq!(titles(&v), vec!["high", "mid", "low"], "sorted titles");
      }

      #[test]
      fn same_priority_sorts_by_due_day() {
          let mut v = vec![t(2, 10, "later"), t(2, 3, "sooner")];
          v.sort();
          assert_eq!(titles(&v), vec!["sooner", "later"], "sorted titles");
      }

      #[test]
      fn then_by_title() {
          let mut v = vec![t(2, 3, "write docs"), t(2, 3, "fix bug"), t(5, 30, "deploy")];
          v.sort();
          assert_eq!(titles(&v), vec!["deploy", "fix bug", "write docs"], "sorted titles");
      }

      #[test]
      fn comparison_operators_agree() {
          assert!(t(5, 1, "a") < t(4, 1, "a"), "a priority-5 task should sort before a priority-4 task");
          assert_eq!(t(1, 1, "a").cmp(&t(1, 1, "a")), Ordering::Equal, "identical tasks");
      }
    hints:
