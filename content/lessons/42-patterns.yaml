        solution: |
          #[derive(Debug, PartialEq)]
          enum Connection {
              Disconnected,
              Connecting { attempt: u32 },
              Connected { session: String },
          }

          enum NetEvent {
              Dial,
              Timeout,
              Accepted(String),
              Hangup,
          }

          impl Connection {
              fn on(self, event: NetEvent) -> Connection {
                  match (self, event) {
                      (Connection::Disconnected, NetEvent::Dial) => Connection::Connecting { attempt: 1 },
                      (Connection::Connecting { attempt }, NetEvent::Timeout) if attempt >= 3 => Connection::Disconnected,
                      (Connection::Connecting { attempt }, NetEvent::Timeout) => Connection::Connecting { attempt: attempt + 1 },
                      (Connection::Connecting { .. }, NetEvent::Accepted(session)) => Connection::Connected { session },
                      (Connection::Connected { .. }, NetEvent::Hangup) => Connection::Disconnected,
                      (state, _) => state,
                  }
              }

              fn status(&self) -> String {
                  match self {
                      Connection::Disconnected => String::from("offline"),
                      Connection::Connecting { attempt } => format!("dialing (attempt {attempt})"),
                      Connection::Connected { session } => format!("online as {session}"),
                  }
              }
          }
        harness: |
          #[test]
          fn dials_and_connects() {
              let c = Connection::Disconnected.on(NetEvent::Dial);
              assert_eq!(c.status(), "dialing (attempt 1)", "after Dial");
              let c = c.on(NetEvent::Accepted(String::from("s-42")));
              assert_eq!(c.status(), "online as s-42", "after Accepted");
              assert_eq!(c.on(NetEvent::Hangup), Connection::Disconnected, "after Hangup");
          }

          #[test]
          fn retries_three_times_then_gives_up() {
              let c = Connection::Disconnected.on(NetEvent::Dial).on(NetEvent::Timeout).on(NetEvent::Timeout);
              assert_eq!(c, Connection::Connecting { attempt: 3 }, "after two timeouts");
              assert_eq!(c.on(NetEvent::Timeout), Connection::Disconnected, "after the third timeout");
          }

          #[test]
          fn other_events_change_nothing() {
              assert_eq!(Connection::Disconnected.on(NetEvent::Hangup), Connection::Disconnected, "Hangup while offline");
              let online = Connection::Connected { session: String::from("s") };
              assert_eq!(online.on(NetEvent::Dial), Connection::Connected { session: String::from("s") }, "Dial while online");
          }
        hints:
          - "`match (self, event)` with one arm per transition; put the guarded `attempt >= 3` arm before the plain retry arm."
          - "The last arm `(state, _) => state` returns the state unchanged."
      - task: |
          Typestate: a request can only be sent once it has a URL. `RequestBuilder::new()` has no URL; `.url(..)` returns a `ReadyRequest` (a different type) holding it, and only `ReadyRequest` has `.header(..)` (chainable) and `.send()`, which returns a description like `GET https://arena.dev [accept: json]` (headers as `name: value` joined by `, `, and no brackets when there are no headers). Calling `send` on a `RequestBuilder` simply doesn't compile.
        seed: |
          struct RequestBuilder;

          struct ReadyRequest {
              url: String,
              headers: Vec<(String, String)>,
          }

          impl RequestBuilder {
              fn new() -> Self {
                  RequestBuilder
              }
          }
        solution: |
          struct RequestBuilder;

          struct ReadyRequest {
              url: String,
              headers: Vec<(String, String)>,
          }

          impl RequestBuilder {
              fn new() -> Self {
                  RequestBuilder
              }

              fn url(self, url: &str) -> ReadyRequest {
                  ReadyRequest { url: url.to_string(), headers: Vec::new() }
              }
          }

          impl ReadyRequest {
              fn header(mut self, name: &str, value: &str) -> Self {
                  self.headers.push((name.to_string(), value.to_string()));
                  self
              }

              fn send(self) -> String {
                  if self.headers.is_empty() {
                      return format!("GET {}", self.url);
                  }
                  let headers: Vec<String> = self.headers.iter().map(|(n, v)| format!("{n}: {v}")).collect();
                  format!("GET {} [{}]", self.url, headers.join(", "))
              }
          }
        harness: |
          #[test]
          fn sends_once_a_url_is_set() {
              assert_eq!(RequestBuilder::new().url("https://arena.dev").send(), "GET https://arena.dev", "no headers");
          }

          #[test]
          fn headers_are_listed_in_order() {
              let r = RequestBuilder::new().url("https://arena.dev/api").header("accept", "json").header("x-id", "7").send();
              assert_eq!(r, "GET https://arena.dev/api [accept: json, x-id: 7]", "two headers");
          }
        hints:
          - "`fn url(self, url: &str) -> ReadyRequest` on `RequestBuilder` is the transition to the next state."
          - "Put `header` and `send` only in `impl ReadyRequest`."

  - title: "Conversions and flexible parameters: From, Into, AsRef"
    id: patterns-idioms-4
    text: |
      Good Rust APIs are pleasant to call: they accept what callers naturally have and convert it without fuss. Three traits do most of the work.

      ### From and Into

      Implement `From<A> for B` and you get **both** `B::from(a)` and `a.into()` (the standard library has a blanket `impl Into<B> for A` whenever `B: From<A>`). So you always implement `From`, never `Into` (clippy's `from_over_into` says so). Use it for conversions that can't fail and are unsurprising; for fallible ones, implement `TryFrom` (and get `try_into()`).

      ### `impl Into<String>` for values you store

      A constructor that stores a `String` should let callers pass a `&str` **or** a `String` they already own (without a forced extra copy):

      ```rust run
      struct Player {
          name: String,
          tags: Vec<String>,
      }

      impl Player {
          fn new(name: impl Into<String>) -> Self {
              Player { name: name.into(), tags: Vec::new() }
          }

          fn tag(mut self, t: impl Into<String>) -> Self {
              self.tags.push(t.into());
              self
          }
      }

      fn longest<S: AsRef<str>>(words: &[S]) -> Option<&str> {
          words.iter().map(|w| w.as_ref()).max_by_key(|w| w.len())
      }

      struct Celsius(f64);
      struct Fahrenheit(f64);

      impl From<Celsius> for Fahrenheit {
          fn from(c: Celsius) -> Self {
              Fahrenheit(c.0 * 9.0 / 5.0 + 32.0)
          }
      }

      fn main() {
          let owned = String::from("Ferris");
          let a = Player::new("Corro").tag("mod");
          let b = Player::new(owned).tag(String::from("crab"));
          println!("{} {:?} / {} {:?}", a.name, a.tags, b.name, b.tags);

          println!("{:?}", longest(&["a", "abc", "ab"]));
          println!("{:?}", longest(&[String::from("crab"), String::from("lobster")]));

          let f: Fahrenheit = Celsius(100.0).into();
          println!("{}", f.0);
      }
      ```

      ```output
      Corro ["mod"] / Ferris ["crab"]
      Some("abc")
      Some("lobster")
      212
      ```

      Piece by piece:

      - `name: impl Into<String>` accepts anything convertible into a `String`. With a `&str`, `.into()` allocates the copy it must; with an owned `String`, it's just moved in, no copy at all.
      - `S: AsRef<str>` accepts anything that can be **viewed** as a `&str` without converting: `&[&str]` and `&[String]` both work, as you see. `AsRef` borrows; `Into` converts (and may consume).
      - `Celsius(100.0).into()` works because of `From<Celsius> for Fahrenheit`; the type annotation `let f: Fahrenheit` tells `into` which target to use.
      - You've met `AsRef<Path>` already without noticing: `std::fs::read_to_string(path)` takes `P: AsRef<Path>`, which is why a `&str`, a `String` or a `PathBuf` all work.

      ### Which parameter type?

      | You need to | Take |
      |---|---|
      | read text | `&str` (a `&String` coerces to it automatically) |
      | read a list | `&[T]`, not `&Vec<T>` |
      | store a string | `impl Into<String>` (or just `String`) |
      | read several strings of either kind | `&[S]` with `S: AsRef<str>` |
      | open a file path | `impl AsRef<Path>` |
      | consume any sequence | `impl IntoIterator<Item = T>` (next step) |

      Don't over-generalize: `&str` is the right answer most of the time, and every generic parameter makes signatures harder to read and compile times longer. Reach for these when callers really have different types.

      ### Common mistakes

      `&String` parameters are a classic review comment (clippy: `ptr_arg`): they force callers to have a `String`, while `&str` accepts both.

      ```rust compile_fail
      fn greet(name: &String) -> String {
          format!("Hello, {name}!")
      }

      fn main() {
          println!("{}", greet("Ana"));
      }
      ```

      ```error
      error[E0308]: mismatched types
      ```

      - **`impl Into<String>` on a parameter you only read**: it allocates for nothing. Take `&str`.
      - **`let x = value.into();`** with no type to aim at: ``error[E0283]: type annotations needed``. Annotate the variable or call `Target::from(value)`.

      **Your turn:** tags on articles. Implement `From<&str> for Tag` (trim and lowercase the text) and `From<Tag> for String`. Write `fn normalize_all<S: AsRef<str>>(items: &[S]) -> Vec<Tag>` (works for `&[&str]` and `&[String]`), and give `Article` a constructor `new(title: impl Into<String>)` and a chainable `with_tag(mut self, tag: impl Into<Tag>) -> Self`.
    seed: |
      #[derive(Debug, PartialEq)]
      struct Tag(String);

      struct Article {
          title: String,
          tags: Vec<Tag>,
      }

      fn normalize_all<S: AsRef<str>>(items: &[S]) -> Vec<Tag> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct Tag(String);

      impl From<&str> for Tag {
          fn from(s: &str) -> Self {
              Tag(s.trim().to_lowercase())
          }
      }

      impl From<Tag> for String {
          fn from(tag: Tag) -> Self {
              tag.0
          }
      }

      struct Article {
          title: String,
          tags: Vec<Tag>,
      }

      impl Article {
          fn new(title: impl Into<String>) -> Self {
              Article { title: title.into(), tags: Vec::new() }
          }

          fn with_tag(mut self, tag: impl Into<Tag>) -> Self {
              self.tags.push(tag.into());
              self
          }
      }

      fn normalize_all<S: AsRef<str>>(items: &[S]) -> Vec<Tag> {
          items.iter().map(|s| Tag::from(s.as_ref())).collect()
      }
    harness: |
      #[test]
      fn tags_are_trimmed_and_lowercased() {
          assert_eq!(Tag::from("  Rust "), Tag(String::from("rust")), "Tag::from(\"  Rust \")");
          let t: Tag = "WebDev".into();
          assert_eq!(t, Tag(String::from("webdev")), "\"WebDev\".into()");
      }

      #[test]
      fn tags_convert_back_into_strings() {
          let s: String = Tag::from("Async").into();
          assert_eq!(s, "async", "String::from(tag)");
      }

      #[test]
      fn normalize_all_accepts_str_and_string_slices() {
          assert_eq!(normalize_all(&["A", " b "]), vec![Tag(String::from("a")), Tag(String::from("b"))], "normalize_all(&[&str])");
          let owned = vec![String::from("CLI"), String::from("Serde")];
          assert_eq!(normalize_all(&owned), vec![Tag(String::from("cli")), Tag(String::from("serde"))], "normalize_all(&Vec<String>)");
      }

      #[test]
      fn articles_take_str_or_string() {
          let a = Article::new("Ownership explained").with_tag("Rust").with_tag(Tag::from("memory"));
          assert_eq!(a.title, "Ownership explained", "title from &str");
          assert_eq!(a.tags, vec![Tag(String::from("rust")), Tag(String::from("memory"))], "tags");
          let b = Article::new(String::from("Traits"));
          assert_eq!(b.title, "Traits", "title from String");
      }
    hints:
