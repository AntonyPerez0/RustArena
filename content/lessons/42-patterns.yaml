          - "For `Category(name)`, the closure must own `name`: `filter(move |i| i.category == name)`."

  - title: "Code review: from working to idiomatic"
    id: patterns-idioms-7
    text: |
      At work, most of the Rust you write gets **reviewed** before it's merged, and much of what reviewers flag is the same short list. Many of those comments are automated by **clippy** (`cargo clippy`), and the rest you now know from this course. Here are the classics, with the clippy lint name where there is one:

      | You wrote | Reviewers ask for | clippy lint |
      |---|---|---|
      | `for i in 0..v.len() { v[i] ... }` | `for x in &v`, or an iterator chain | `needless_range_loop` |
      | `fn f(v: &Vec<T>)`, `fn g(s: &String)` | `&[T]`, `&str` | `ptr_arg` |
      | `.clone()` to calm the borrow checker | borrow, or restructure | `redundant_clone` (opt-in) |
      | `v.len() == 0` | `v.is_empty()` | `len_zero` |
      | `if x == true` | `if x` | `bool_comparison` |
      | `return x;` as the last line | just `x` | `needless_return` |
      | `match o { Some(x) => Some(f(x)), None => None }` | `o.map(f)` | `manual_map` |
      | `match o { Some(x) => x, None => d }` | `o.unwrap_or(d)` | `manual_unwrap_or` |
      | `if a { if b { .. } }` | `if a && b { .. }` | `collapsible_if` |
      | a loop that sets `found = true` | `.any(..)` / `.find(..)` / `.position(..)` | (`manual_find` and friends) |
      | `.unwrap()` on input | `?`, `match`, a typed error | `unwrap_used` (opt-in) |
      | `status: String` with `"shipped"` | `enum Status` | (design; no lint) |

      Teams switch on stricter lints per project, in `Cargo.toml`:

      ```toml
      [lints.clippy]
      unwrap_used = "warn"
      pedantic = { level = "warn", priority = -1 }
      ```

      and CI runs `cargo clippy -- -D warnings` so warnings fail the build.

      ### A small refactor

      Both versions below print the same thing. The first is what a newcomer from another language writes; the second is what a reviewer hopes to see.

      ```rust run
      fn average_score(scores: &Vec<u32>) -> f64 {
          if scores.len() == 0 {
              return 0.0;
          }
          let mut sum = 0;
          for i in 0..scores.len() {
              sum = sum + scores[i];
          }
          return sum as f64 / scores.len() as f64;
      }

      fn main() {
          println!("{:.2}", average_score(&vec![70, 85, 90]));
          println!("{:.2}", average_score(&vec![]));
      }
      ```

      ```output
      81.67
      0.00
      ```

      ```rust run
      fn average_score(scores: &[u32]) -> f64 {
          if scores.is_empty() {
              return 0.0;
          }
          let sum: u32 = scores.iter().sum();
          sum as f64 / scores.len() as f64
      }

      fn main() {
          println!("{:.2}", average_score(&[70, 85, 90]));
          println!("{:.2}", average_score(&[]));
      }
      ```

      ```output
      81.67
      0.00
      ```

      (The early `return` for the empty case is fine: `needless_return` only flags a `return` on the **last** line.)

      ### How to refactor safely

      1. **Pin the behavior first**: make sure tests cover what the code does today, including edge cases (empty input, ties, bad input). On this site, the hidden tests play that role.
      2. **One change at a time**, re-running the tests after each: types first (`&Vec` to `&[T]`, strings to enums), then loops to iterators, then error handling.
      3. **Watch for behavior changes hiding in "cleanups"**: `max_by_key` returns the **last** maximum on ties while a hand-written `>` loop keeps the **first**; replacing `unwrap` with `unwrap_or_default` turns a crash into silently wrong data. A refactor that changes behavior isn't a refactor.
      4. **Turning panics into errors** does change the signature (`-> Result<..>`). That's an improvement, but it's an API change your callers must know about.

      **Your turn:** this order-processing code works on valid input, but it failed review. Refactor it:
      - `parse_orders` takes `&str` and returns `Result<Vec<Order>, String>` instead of panicking. Errors name the line: `line 2: bad id`, `line 1: missing customer` (also for an empty customer field), `line 3: unknown status "lost"`, `line 1: bad price "abc"`.
      - The status becomes `enum Status { Pending, Shipped, Cancelled }` (derive `Debug, Clone, Copy, PartialEq`); the text values stay `pending`, `shipped`, `cancelled`.
      - Slices instead of `&Vec`, iterators instead of index loops, no `.clone()`, no `.unwrap()`, no `== true`/`== false`.

      `total`, `shipped_revenue` and `customers_with_pending` must behave exactly as before (the names come out sorted, without duplicates).
    seed: |
      struct Order {
          id: u32,
          customer: String,
          status: String,
          items: Vec<u32>,
      }

      fn parse_orders(text: &String) -> Vec<Order> {
          let mut orders = Vec::new();
          for line in text.lines() {
              let parts: Vec<&str> = line.split(',').collect();
              let id = parts[0].trim().parse::<u32>().unwrap();
              let customer = parts[1].trim().to_string();
              let status = parts[2].trim().to_string();
              let mut items = Vec::new();
              for i in 3..parts.len() {
                  items.push(parts[i].trim().parse::<u32>().unwrap());
              }
              orders.push(Order { id: id, customer: customer.clone(), status: status.clone(), items: items.clone() });
          }
          orders
      }

      fn total(order: &Order) -> u32 {
          let mut sum = 0;
          for i in 0..order.items.len() {
              sum = sum + order.items[i];
          }
          return sum;
      }

      fn shipped_revenue(orders: &Vec<Order>) -> u32 {
          let mut revenue = 0;
          for i in 0..orders.len() {
              if orders[i].status == "shipped" {
                  revenue += total(&orders[i]);
              }
          }
          revenue
      }

      fn customers_with_pending(orders: &Vec<Order>) -> Vec<String> {
          let mut names = Vec::new();
          for o in orders.clone() {
              if o.status == "pending" {
                  if names.contains(&o.customer) == false {
                      names.push(o.customer.clone());
                  }
              }
          }
          names.sort();
          names
      }
    solution: |
      use std::collections::BTreeSet;
      use std::str::FromStr;

      #[derive(Debug, Clone, Copy, PartialEq)]
      enum Status {
          Pending,
          Shipped,
          Cancelled,
      }

      impl FromStr for Status {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              match s {
                  "pending" => Ok(Status::Pending),
                  "shipped" => Ok(Status::Shipped),
                  "cancelled" => Ok(Status::Cancelled),
                  other => Err(format!("unknown status {other:?}")),
              }
          }
      }

      struct Order {
          id: u32,
          customer: String,
          status: Status,
          items: Vec<u32>,
      }

      fn parse_line(line: &str) -> Result<Order, String> {
          let mut parts = line.split(',').map(str::trim);
          let id = parts.next().and_then(|p| p.parse().ok()).ok_or("bad id")?;
          let customer = parts.next().filter(|c| !c.is_empty()).ok_or("missing customer")?.to_string();
          let status = parts.next().ok_or("missing status")?.parse()?;
          let items = parts
              .map(|p| p.parse().map_err(|_| format!("bad price {p:?}")))
              .collect::<Result<Vec<u32>, String>>()?;
          Ok(Order { id, customer, status, items })
      }

      fn parse_orders(text: &str) -> Result<Vec<Order>, String> {
          text.lines()
              .enumerate()
              .map(|(i, line)| parse_line(line).map_err(|e| format!("line {}: {e}", i + 1)))
              .collect()
      }

      fn total(order: &Order) -> u32 {
          order.items.iter().sum()
      }

      fn shipped_revenue(orders: &[Order]) -> u32 {
          orders.iter().filter(|o| o.status == Status::Shipped).map(total).sum()
      }

      fn customers_with_pending(orders: &[Order]) -> Vec<String> {
          let names: BTreeSet<&str> = orders
              .iter()
              .filter(|o| o.status == Status::Pending)
              .map(|o| o.customer.as_str())
              .collect();
          names.into_iter().map(String::from).collect()
      }
    require:
      - pattern: 'enum\s+Status'
        message: Replace the status String with `enum Status { Pending, Shipped, Cancelled }`.
    forbid:
      - pattern: '\.unwrap\(\)'
        message: "No `.unwrap()`: return errors from `parse_orders` instead."
      - pattern: '\.clone\(\)'
        message: "No `.clone()`: move or borrow the values instead."
      - pattern: 'for\s+\w+\s+in\s+\d+\s*\.\.'
        message: "No index loops (`for i in 0..len`): iterate over the items directly."
      - pattern: '&\s*Vec<|&\s*String\b'
        message: "Take slices (`&[Order]`) and `&str` instead of `&Vec` and `&String`."
      - pattern: '==\s*(true|false)\b'
        message: "Don't compare with `true`/`false`: use the boolean (or `!`) directly."
      - pattern: '\.status\s*==\s*""'
        message: "Compare the status with enum variants, not strings."
    harness: |
      const TEXT: &str = "1, ana, shipped, 1200, 300\n2, bo, pending, 450\n3, cy, cancelled, 999\n4, ana, pending, 100, 100\n5, bo, shipped, 50\n6, ana, pending";

      #[test]
      fn parses_valid_orders() {
          let orders = parse_orders(TEXT).expect("valid text");
          assert_eq!(orders.len(), 6, "number of orders");
          assert_eq!((orders[0].id, orders[0].customer.as_str(), orders[0].status, orders[0].items.as_slice()), (1, "ana", Status::Shipped, &[1200, 300][..]), "first order");
          assert_eq!(orders[2].status, Status::Cancelled, "third order's status");
          assert!(orders[5].items.is_empty(), "an order may have no items");
      }

      #[test]
      fn totals_and_revenue_are_unchanged() {
          let orders = parse_orders(TEXT).expect("valid text");
          assert_eq!(total(&orders[0]), 1500, "total(order 1)");
          assert_eq!(shipped_revenue(&orders), 1550, "shipped_revenue");
          assert_eq!(shipped_revenue(&[]), 0, "shipped_revenue(&[])");
      }

      #[test]
      fn pending_customers_are_sorted_and_unique() {
          let orders = parse_orders(TEXT).expect("valid text");
          assert_eq!(customers_with_pending(&orders), ["ana", "bo"], "customers_with_pending");
      }

      #[test]
      fn bad_input_is_an_error_not_a_panic() {
          assert_eq!(parse_orders("1, ana, shipped, 5\nx, bo, pending").err(), Some(String::from("line 2: bad id")), "bad id");
          assert_eq!(parse_orders("1, , shipped").err(), Some(String::from("line 1: missing customer")), "missing customer");
          assert_eq!(parse_orders("1,a,shipped\n2,b,pending\n3,c,lost").err(), Some(String::from("line 3: unknown status \"lost\"")), "unknown status");
          assert_eq!(parse_orders("1, ana, pending, abc").err(), Some(String::from("line 1: bad price \"abc\"")), "bad price");
          assert_eq!(parse_orders("7").err(), Some(String::from("line 1: missing customer")), "only an id");
      }

      #[test]
      fn empty_text_has_no_orders() {
          assert_eq!(parse_orders("").map(|o| o.len()), Ok(0), "parse_orders(\"\")");
      }
    hints:
      - "Start with the types: `enum Status` with `impl FromStr for Status` (so `\"shipped\".parse::<Status>()` works), slices in the signatures, `&str` for the text."
      - "Parse one line in a helper `fn parse_line(line: &str) -> Result<Order, String>` using `split(',').map(str::trim)` and `next()`, then in `parse_orders` map each line through it and add `line N: ` with `map_err`. Collecting an iterator of `Result`s into `Result<Vec<_>, _>` stops at the first error."
      - "`total` is `order.items.iter().sum()`; `shipped_revenue` is a `filter` + `map(total)` + `sum`; for unique sorted names, collect `&str`s into a `BTreeSet`."
    more:
      - task: |
          A smaller review. Refactor these two functions: take `&[String]`, return `Option<&str>` from `longest_name` (`None` for an empty list, instead of an empty String), and use iterators. Keep the behavior: on a tie, `longest_name` returns the **first** of the longest names. No `.clone()`, no index loops, no `return`, no `len() == 0`, no `== true`.
        seed: |
          fn longest_name(names: &Vec<String>) -> String {
              if names.len() == 0 {
                  return String::from("");
              }
              let mut best = names[0].clone();
              for i in 1..names.len() {
                  if names[i].len() > best.len() {
                      best = names[i].clone();
                  }
              }
              return best;
          }

          fn count_long(names: &Vec<String>, min: usize) -> usize {
              let mut count = 0;
              for i in 0..names.len() {
                  if (names[i].len() >= min) == true {
                      count += 1;
                  }
              }
              return count;
          }
        solution: |
          fn longest_name(names: &[String]) -> Option<&str> {
              names
                  .iter()
                  .rev()
                  .max_by_key(|n| n.len())
                  .map(|n| n.as_str())
          }

          fn count_long(names: &[String], min: usize) -> usize {
              names.iter().filter(|n| n.len() >= min).count()
          }
        forbid:
          - pattern: '\.clone\(\)'
            message: No `.clone()`.
          - pattern: 'for\s+\w+\s+in\s+\d+\s*\.\.'
            message: No index loops.
          - pattern: '\breturn\b'
            message: No `return`; let the last expression be the result.
          - pattern: 'len\(\)\s*==\s*0'
            message: Use `is_empty()` (or let the iterator handle the empty case).
          - pattern: '==\s*(true|false)\b'
            message: "Don't compare with `true`/`false`."
          - pattern: '&\s*Vec<'
            message: "Take `&[String]`, not `&Vec<String>`."
        harness: |
          fn v(names: &[&str]) -> Vec<String> {
              names.iter().map(|s| s.to_string()).collect()
          }

          #[test]
          fn finds_the_longest_name() {
              assert_eq!(longest_name(&v(&["bo", "anastasia", "cy"])), Some("anastasia"), "longest_name");
          }

          #[test]
          fn ties_keep_the_first() {
              assert_eq!(longest_name(&v(&["ana", "bob", "cy"])), Some("ana"), "longest_name(ana, bob, cy)");
          }

          #[test]
          fn empty_list_gives_none() {
              assert_eq!(longest_name(&[]), None, "longest_name(&[])");
          }

          #[test]
          fn counts_names_at_least_min_long() {
              assert_eq!(count_long(&v(&["ana", "bo", "cyrus"]), 3), 2, "count_long(.., 3)");
              assert_eq!(count_long(&[], 1), 0, "count_long(&[], 1)");
          }
        hints:
          - "`count_long` is `names.iter().filter(|n| n.len() >= min).count()`."
          - "`max_by_key` returns the **last** maximum on ties. Iterating in reverse first (`.iter().rev().max_by_key(..)`) makes it find the original first one."
          - "Finish with `.map(|n| n.as_str())` to turn `Option<&String>` into `Option<&str>`; an empty slice gives `None` by itself."
      - task: |
          Clippy flagged every function here. Rewrite each one with the idiom its comment names, keeping the behavior: no `match`, no `for` loops, no `return`, and no nested `if`s left.
        seed: |
          fn double(o: Option<u32>) -> Option<u32> {
              // clippy::manual_map
              match o {
                  Some(n) => Some(n * 2),
                  None => None,
              }
          }

          fn port_or_default(o: Option<u16>) -> u16 {
              // clippy::manual_unwrap_or
              match o {
                  Some(p) => p,
                  None => 8080,
              }
          }

          fn is_admin(roles: &[String]) -> bool {
              // use .any(..)
              let mut found = false;
              for r in roles {
                  if r == "admin" {
                      found = true;
                  }
              }
              found
          }

          fn first_negative(v: &[i32]) -> Option<i32> {
              // use .find(..) (plus .copied())
              for x in v {
                  if *x < 0 {
                      return Some(*x);
                  }
              }
              None
          }

          fn big_and_even(n: u32, log: &mut Vec<String>) {
              // clippy::collapsible_if
              if n > 100 {
                  if n % 2 == 0 {
                      log.push(format!("{n} is big and even"));
                  }
              }
          }
        solution: |
          fn double(o: Option<u32>) -> Option<u32> {
              // clippy::manual_map
              o.map(|n| n * 2)
          }

          fn port_or_default(o: Option<u16>) -> u16 {
              // clippy::manual_unwrap_or
              o.unwrap_or(8080)
          }

          fn is_admin(roles: &[String]) -> bool {
              // use .any(..)
              roles.iter().any(|r| r == "admin")
          }

          fn first_negative(v: &[i32]) -> Option<i32> {
              // use .find(..) (plus .copied())
              v.iter().find(|x| **x < 0).copied()
          }

          fn big_and_even(n: u32, log: &mut Vec<String>) {
              // clippy::collapsible_if
              if n > 100 && n % 2 == 0 {
                  log.push(format!("{n} is big and even"));
              }
          }
        forbid:
          - pattern: '\bmatch\b'
            message: "Use `map` / `unwrap_or` instead of `match`."
          - pattern: '\bfor\b'
            message: "Use iterator methods (`any`, `find`) instead of `for` loops."
          - pattern: '\breturn\b'
            message: No `return`.
          - pattern: '\bif\b[^{]*\{\s*if\b'
            message: "Collapse the nested `if`s into one condition with `&&`."
        harness: |
          #[test]
          fn double_maps_the_option() {
              assert_eq!((double(Some(21)), double(None)), (Some(42), None), "double");
          }

          #[test]
          fn port_falls_back_to_8080() {
              assert_eq!((port_or_default(Some(443)), port_or_default(None)), (443, 8080), "port_or_default");
          }

          #[test]
          fn is_admin_checks_every_role() {
              let roles = vec![String::from("dev"), String::from("admin")];
              assert!(is_admin(&roles), "is_admin(dev, admin)");
              assert!(!is_admin(&roles[..1]), "is_admin(dev)");
              assert!(!is_admin(&[]), "is_admin([])");
          }

          #[test]
          fn first_negative_finds_the_first() {
              assert_eq!(first_negative(&[3, -1, -7]), Some(-1), "first_negative(3, -1, -7)");
              assert_eq!(first_negative(&[1, 2]), None, "first_negative(1, 2)");
          }

          #[test]
          fn big_and_even_logs_only_big_even_numbers() {
              let mut log = Vec::new();
              for n in [50, 101, 102, 200] {
                  big_and_even(n, &mut log);
              }
              assert_eq!(log, ["102 is big and even", "200 is big and even"], "log");
          }
