      - task: |
          Write a consuming builder that produces SQL text. `QueryBuilder::new("users")` starts a query; `.filter(cond)` can be called several times (conditions are joined with ` AND `), `.order_by(column)` and `.limit(n)` are optional. `.build()` returns the query string, for example `SELECT * FROM users WHERE age > 18 AND active ORDER BY name LIMIT 10`. Leave out the parts that weren't set.
        seed: |
          struct QueryBuilder {
          }

          impl QueryBuilder {
          }
        solution: |
          struct QueryBuilder {
              table: String,
              filters: Vec<String>,
              order: Option<String>,
              limit: Option<usize>,
          }

          impl QueryBuilder {
              fn new(table: &str) -> Self {
                  QueryBuilder { table: table.to_string(), filters: Vec::new(), order: None, limit: None }
              }

              fn filter(mut self, condition: &str) -> Self {
                  self.filters.push(condition.to_string());
                  self
              }

              fn order_by(mut self, column: &str) -> Self {
                  self.order = Some(column.to_string());
                  self
              }

              fn limit(mut self, n: usize) -> Self {
                  self.limit = Some(n);
                  self
              }

              fn build(self) -> String {
                  let mut sql = format!("SELECT * FROM {}", self.table);
                  if !self.filters.is_empty() {
                      sql.push_str(&format!(" WHERE {}", self.filters.join(" AND ")));
                  }
                  if let Some(column) = self.order {
                      sql.push_str(&format!(" ORDER BY {column}"));
                  }
                  if let Some(n) = self.limit {
                      sql.push_str(&format!(" LIMIT {n}"));
                  }
                  sql
              }
          }
        harness: |
          #[test]
          fn a_bare_query_selects_everything() {
              assert_eq!(QueryBuilder::new("users").build(), "SELECT * FROM users", "new(users).build()");
          }

          #[test]
          fn every_part_in_order() {
              let q = QueryBuilder::new("users").filter("age > 18").filter("active").order_by("name").limit(10).build();
              assert_eq!(q, "SELECT * FROM users WHERE age > 18 AND active ORDER BY name LIMIT 10", "full query");
          }

          #[test]
          fn the_call_order_does_not_matter() {
              let q = QueryBuilder::new("orders").limit(5).filter("total > 100").build();
              assert_eq!(q, "SELECT * FROM orders WHERE total > 100 LIMIT 5", "limit before filter");
          }

          #[test]
          fn a_builder_can_be_configured_conditionally() {
              let only_open = true;
              let mut b = QueryBuilder::new("tickets");
              if only_open {
                  b = b.filter("status = 'open'");
              }
              assert_eq!(b.order_by("created").build(), "SELECT * FROM tickets WHERE status = 'open' ORDER BY created", "conditional filter");
          }
        hints:
          - "Store `table: String`, `filters: Vec<String>`, `order: Option<String>` and `limit: Option<usize>`."
          - "Setters take `mut self` and return `self`; `filter` pushes onto the Vec."
          - "In `build`, start with `format!(\"SELECT * FROM {}\", self.table)` and append each part that is set."

  - title: "Newtypes: give plain values a meaning"
    id: patterns-idioms-2
    text: |
      In 1999 the Mars Climate Orbiter was lost because one team's software produced pound-force seconds and another's expected newton seconds. Both were just numbers. In your code it's `fn transfer(from: u64, to: u64, amount: u64)`: nothing stops a caller from swapping `from` and `to`.

      A **newtype** is a tuple struct with one field that gives a plain value its own type:

      ```rust compile_fail
      struct UserId(u64);
      struct OrderId(u64);

      fn cancel_order(user: UserId, order: OrderId) {
          println!("user {} cancels order {}", user.0, order.0);
      }

      fn main() {
          let user = UserId(7);
          let order = OrderId(1001);
          cancel_order(order, user);
      }
      ```

      ```error
      error[E0308]: arguments to this function are incorrect
      ```

      The mix-up is now a compile error, and rustc even notices the two arguments are swapped and suggests the fix. Newtypes cost **nothing** at run time: a `UserId` is laid out exactly like a `u64`.

      ### Parse, don't validate

      A newtype with a **private field** goes further: if the only way to create one is a function that checks the input, then every value of that type is valid, everywhere, forever. Functions that take an `Email` never need to check it again.

      ```rust run
      mod email {
          pub struct Email(String);

          impl Email {
              pub fn parse(s: &str) -> Result<Email, String> {
                  let s = s.trim();
                  match s.split_once('@') {
                      Some((user, domain)) if !user.is_empty() && domain.contains('.') => Ok(Email(s.to_lowercase())),
                      _ => Err(format!("invalid email: {s:?}")),
                  }
              }

              pub fn as_str(&self) -> &str {
                  &self.0
              }
          }
      }

      use email::Email;

      fn send_welcome(to: &Email) -> String {
          format!("welcome mail sent to {}", to.as_str())
      }

      fn main() {
          for input in [" Ana@Arena.dev ", "not-an-email", "@arena.dev"] {
              match Email::parse(input) {
                  Ok(e) => println!("{}", send_welcome(&e)),
                  Err(e) => println!("{e}"),
              }
          }
      }
      ```

      ```output
      welcome mail sent to ana@arena.dev
      invalid email: "not-an-email"
      invalid email: "@arena.dev"
      ```

      `send_welcome` can't receive an unchecked string: outside the `email` module, `Email(String::from("oops"))` doesn't compile (``error[E0603]: tuple struct constructor `Email` is private``). The validation happens once, at the edge of the program, which is the idea behind the slogan **parse, don't validate**.

      ### What newtypes are good for

      - **Ids and units**: `UserId`, `OrderId`, `Meters`, `Cents`. Implement only the operations that make sense (`Cents + Cents` yes, `Cents * Cents` no).
      - **Validated values**: `Email`, `Username`, `NonEmptyString`, `Port`.
      - **The orphan rule**: you can't implement a foreign trait for a foreign type (`impl Display for Vec<String>` is refused), but you can for your newtype around it.

      Derive what the type needs (`Debug, Clone, Copy, PartialEq, Eq, Hash, PartialOrd, Ord`) and add accessors like `as_str` or `value`. Avoid implementing `Deref` just to "inherit" all the inner type's methods: it brings back the operations the newtype was meant to hide.

      ### Common mistakes

      - **Money as `f64`.** `0.1 + 0.2 != 0.3` in floating point. Store whole cents in an integer newtype.
      - **A public field** (`pub struct Email(pub String)`) lets anyone build an unchecked value, defeating the point.
      - **`.0` everywhere**: if callers constantly unwrap the newtype, give it the methods they need instead.

      **Your turn:** write `Cents`, a money type. `Cents::parse(s)` accepts dollar amounts like `"12.34"`, `"12.3"`, `"5"` or `"$5"` (an optional leading `$`) and returns the amount in cents. Anything else (empty, a minus sign, no digit before the `.`, more than two decimals, letters) is `Err(format!("invalid amount {s:?}"))`. Implement `Add` so two `Cents` can be added, and `Display` so `Cents(1234)` prints `$12.34`.
    seed: |
      use std::fmt;
      use std::ops::Add;

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Cents(u64);

      impl Cents {
          fn parse(s: &str) -> Result<Cents, String> {
              todo!()
          }
      }
    solution: |
      use std::fmt;
      use std::ops::Add;

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Cents(u64);

      impl Cents {
          fn parse(s: &str) -> Result<Cents, String> {
              let invalid = || format!("invalid amount {s:?}");
              let digits = s.strip_prefix('$').unwrap_or(s);
              let (whole, frac) = digits.split_once('.').unwrap_or((digits, ""));
              let all_digits = |part: &str| part.chars().all(|c| c.is_ascii_digit());
              if whole.is_empty() || !all_digits(whole) || !all_digits(frac) || frac.len() > 2 {
                  return Err(invalid());
              }
              let dollars: u64 = whole.parse().map_err(|_| invalid())?;
              let cents: u64 = format!("{frac:0<2}").parse().map_err(|_| invalid())?;
              Ok(Cents(dollars * 100 + cents))
          }
      }

      impl Add for Cents {
          type Output = Cents;

          fn add(self, other: Cents) -> Cents {
              Cents(self.0 + other.0)
          }
      }

      impl fmt::Display for Cents {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "${}.{:02}", self.0 / 100, self.0 % 100)
          }
      }
    harness: |
      #[test]
      fn parses_dollars_and_cents() {
          assert_eq!(Cents::parse("12.34"), Ok(Cents(1234)), "parse(\"12.34\")");
          assert_eq!(Cents::parse("12.3"), Ok(Cents(1230)), "parse(\"12.3\")");
          assert_eq!(Cents::parse("0.05"), Ok(Cents(5)), "parse(\"0.05\")");
      }

      #[test]
      fn whole_dollars_and_dollar_signs() {
          assert_eq!(Cents::parse("5"), Ok(Cents(500)), "parse(\"5\")");
          assert_eq!(Cents::parse("$7.50"), Ok(Cents(750)), "parse(\"$7.50\")");
      }

      #[test]
      fn rejects_bad_amounts() {
          for bad in ["", "abc", "-1", "1.234", "1.2.3", ".5", "12,50", "$"] {
              assert_eq!(Cents::parse(bad), Err(format!("invalid amount {bad:?}")), "parse({bad:?})");
          }
      }

      #[test]
      fn adds_amounts() {
          assert_eq!(Cents(199) + Cents(1), Cents(200), "Cents(199) + Cents(1)");
      }

      #[test]
      fn displays_as_dollars() {
          assert_eq!(Cents(1234).to_string(), "$12.34", "Cents(1234)");
          assert_eq!(Cents(5).to_string(), "$0.05", "Cents(5)");
          assert_eq!(Cents(300).to_string(), "$3.00", "Cents(300)");
      }
    hints:
      - "Strip an optional `$` with `strip_prefix('$').unwrap_or(s)`, then `split_once('.')` into whole and fraction (no dot means an empty fraction)."
      - "Check that the whole part is non-empty, both parts are only ASCII digits, and the fraction has at most 2 digits. Pad the fraction to 2 digits (`format!(\"{frac:0<2}\")`) before parsing it."
      - "`Display`: `write!(f, \"${}.{:02}\", self.0 / 100, self.0 % 100)`; `Add`: `type Output = Cents;` and `Cents(self.0 + other.0)`."
    more:
      - task: |
          Stop ids from being mixed up. Create newtypes `UserId(u64)` and `OrderId(u64)` (derive `Debug, Clone, Copy, PartialEq, Eq, Hash`) and change `cancel` to take them, so `cancel(order, user)` no longer compiles. It returns `user 7 cancelled order 1001` and records the cancellation in the set.
        seed: |
          use std::collections::HashSet;

          fn cancel(user: u64, order: u64, cancelled: &mut HashSet<u64>) -> String {
              cancelled.insert(order);
              format!("user {user} cancelled order {order}")
          }
        solution: |
          use std::collections::HashSet;

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
          struct UserId(u64);

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
          struct OrderId(u64);

          fn cancel(user: UserId, order: OrderId, cancelled: &mut HashSet<OrderId>) -> String {
              cancelled.insert(order);
              format!("user {} cancelled order {}", user.0, order.0)
          }
        harness: |
          #[test]
          fn cancels_with_typed_ids() {
              let mut set = HashSet::new();
              assert_eq!(cancel(UserId(7), OrderId(1001), &mut set), "user 7 cancelled order 1001", "cancel(UserId(7), OrderId(1001))");
              assert!(set.contains(&OrderId(1001)), "the order id is recorded");
          }

          #[test]
          fn ids_are_copy_and_comparable() {
              let id = UserId(3);
              let copy = id;
              assert_eq!(id, copy, "UserId is Copy and PartialEq");
          }
        hints:
          - "`#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)] struct UserId(u64);` and the same for `OrderId`."
          - "The set becomes a `HashSet<OrderId>`; format the inner numbers with `user.0` and `order.0`."
      - task: |
          Use a newtype to get around the orphan rule. `Table` wraps rows of cells. Implement `Display` so each row prints its cells joined by ` | `, rows separated by newlines (no newline at the end), and `FromStr` that parses the same format back (split rows on `\n`, cells on `|`, trimming each cell). Parsing never fails, so use `type Err = std::convert::Infallible;`.
        seed: |
          use std::fmt;
          use std::str::FromStr;

          #[derive(Debug, PartialEq)]
          struct Table(Vec<Vec<String>>);
        solution: |
          use std::fmt;
          use std::str::FromStr;

          #[derive(Debug, PartialEq)]
          struct Table(Vec<Vec<String>>);

          impl fmt::Display for Table {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  let rows: Vec<String> = self.0.iter().map(|row| row.join(" | ")).collect();
                  write!(f, "{}", rows.join("\n"))
              }
          }

          impl FromStr for Table {
              type Err = std::convert::Infallible;

              fn from_str(s: &str) -> Result<Self, Self::Err> {
                  Ok(Table(s.lines().map(|line| line.split('|').map(|cell| cell.trim().to_string()).collect()).collect()))
              }
          }
        harness: |
          fn table(rows: &[&[&str]]) -> Table {
              Table(rows.iter().map(|r| r.iter().map(|c| c.to_string()).collect()).collect())
          }

          #[test]
          fn displays_rows_and_cells() {
              assert_eq!(table(&[&["name", "score"], &["ana", "40"]]).to_string(), "name | score\nana | 40", "Display");
          }

          #[test]
          fn parses_its_own_output() {
              let t = table(&[&["a", "b"], &["c", "d"]]);
              assert_eq!(t.to_string().parse::<Table>().unwrap(), t, "round trip");
          }

          #[test]
          fn trims_cells_when_parsing() {
              assert_eq!("x|  y \n z|w".parse::<Table>().unwrap(), table(&[&["x", "y"], &["z", "w"]]), "parse with spaces");
          }
        hints:
          - "`Display`: map each row to `row.join(\" | \")`, then join the rows with `\"\\n\"`."
          - "`FromStr`: `s.lines().map(|line| line.split('|').map(|c| c.trim().to_string()).collect()).collect()` wrapped in `Ok(Table(...))`."

  - title: Make invalid states unrepresentable
    id: patterns-idioms-3
    text: |
      Look at this struct, the kind found in many codebases:

      ```rust
      struct Connection {
          connected: bool,
          connecting: bool,
          session_id: Option<String>,
          retries: u32,
          error: Option<String>,
      }
      ```

      What does `connected: true, connecting: true` mean? Or `connected: false` with a `session_id`? Those combinations are **possible**, so every function has to check for them, and someone eventually forgets. The idiomatic Rust fix: an **enum where each state carries exactly its data**, so nonsense combinations can't even be written:

      ```rust
      enum Connection {
          Disconnected,
          Connecting { attempt: u32 },
          Connected { session_id: String },
          Failed { reason: String },
      }
      ```

      There's no session id unless you're connected, and `match` makes every function handle every state.

      ### Enum state machines

      Add **transitions** and you have a state machine. Matching on `(state, event)` pairs lists every allowed move in one place, and taking `self` **by value** means the old state is consumed: nobody can keep using a stale one.

      ```rust run
      #[derive(Debug)]
      enum Order {
          Cart { items: u32 },
          Paid { items: u32, payment_id: String },
          Shipped { tracking: String },
          Cancelled,
      }

      #[derive(Debug)]
      enum Event {
          AddItem,
          Pay(String),
          Ship(String),
          Cancel,
      }

      impl Order {
          fn apply(self, event: Event) -> Result<Order, (Order, String)> {
              match (self, event) {
                  (Order::Cart { items }, Event::AddItem) => Ok(Order::Cart { items: items + 1 }),
                  (Order::Cart { items }, Event::Pay(id)) if items > 0 => Ok(Order::Paid { items, payment_id: id }),
                  (Order::Paid { .. }, Event::Ship(tracking)) => Ok(Order::Shipped { tracking }),
                  (Order::Cart { .. } | Order::Paid { .. }, Event::Cancel) => Ok(Order::Cancelled),
                  (state, event) => {
                      let msg = format!("cannot apply {event:?} to {state:?}");
                      Err((state, msg))
                  }
              }
          }

          fn describe(&self) -> String {
              match self {
                  Order::Cart { items } => format!("cart with {items} items"),
                  Order::Paid { items, payment_id } => format!("{items} items paid ({payment_id})"),
                  Order::Shipped { tracking } => format!("shipped, tracking {tracking}"),
                  Order::Cancelled => String::from("cancelled"),
              }
          }
      }

      fn main() {
          let mut order = Order::Cart { items: 0 };
          let events = [
              Event::Pay(String::from("pay_1")),
              Event::AddItem,
              Event::AddItem,
              Event::Pay(String::from("pay_2")),
              Event::Ship(String::from("TRK9")),
              Event::Cancel,
          ];
          for event in events {
              order = match order.apply(event) {
                  Ok(next) => next,
                  Err((same, msg)) => {
                      println!("rejected: {msg}");
                      same
                  }
              };
              println!("now: {}", order.describe());
          }
      }
      ```

      ```output
      rejected: cannot apply Pay("pay_1") to Cart { items: 0 }
      now: cart with 0 items
      now: cart with 1 items
      now: cart with 2 items
      now: 2 items paid (pay_2)
      now: shipped, tracking TRK9
      rejected: cannot apply Cancel to Shipped { tracking: "TRK9" }
      now: shipped, tracking TRK9
      ```

      Piece by piece:

      - `apply(self, ...)` **consumes** the old state and returns the new one: you can't accidentally keep using a stale state.
      - The guard `if items > 0` encodes a rule (no paying for an empty cart) right in the transition table.
      - The final arm `(state, event)` catches every move not listed, with the state handed back inside the `Err`.
      - Adding a state means the compiler points at every `match` that must handle it.

      Why does the error carry the state back, as `Err((state, msg))`? Because `apply` took ownership of it. If the error held only a message, a rejected event would leave the caller with nothing, and the borrow checker says so:

      ```rust compile_fail
      enum Light {
          Off,
          On,
      }

      impl Light {
          fn press(self, allowed: bool) -> Result<Light, String> {
              if !allowed {
                  return Err(String::from("locked"));
              }
              Ok(match self {
                  Light::Off => Light::On,
                  Light::On => Light::Off,
              })
          }
      }

      fn main() {
          let mut light = Light::Off;
          for allowed in [true, false, true] {
              match light.press(allowed) {
                  Ok(next) => light = next,
                  Err(e) => println!("{e}"),
              }
          }
          if let Light::On = light {
              println!("on");
          }
      }
      ```

      ```error
      error[E0382]: use of moved value: `light`
      ```

      In the `Err` arm, `light` has been moved into `press` and nothing was put back. Returning the unchanged state inside the error (or taking `&mut self` and changing it in place) solves it.

      ### Typestate: wrong order is a compile error

      When the sequence of steps is fixed in your code (not decided by runtime data), you can go further and give **each state its own type** (the typestate pattern from the advanced traits module). Methods exist only on the states where they make sense:

      ```rust compile_fail
      struct Draft {
          text: String,
      }

      struct Published {
          text: String,
      }

      impl Draft {
          fn publish(self) -> Published {
              Published { text: self.text }
          }
      }

      impl Published {
          fn text(&self) -> &str {
              &self.text
          }
      }

      fn main() {
          let post = Draft { text: String::from("Hello, crabs") }.publish();
          println!("{}", post.text());
          let again = post.publish();
      }
      ```

      ```error
      error[E0599]: no method named `publish` found for struct `Published` in the current scope
      ```

      **Which one?** Use an **enum** when the state comes from data at run time (an order loaded from the database can be in any state). Use **typestate** for protocols and builders written in code (a connection must be opened before sending, a request needs a URL before `send`).

      **Your turn:** write a payment state machine. `Payment::next(self, event)` returns the new state or an error string. Allowed transitions:
      - `Pending` + `Authorize(code)` becomes `Authorized { amount, auth_code: code }`
      - `Pending` or `Authorized` + `Decline(reason)` becomes `Failed { reason }`
      - `Authorized` + `Capture` becomes `Captured { amount }`
      - `Captured` + `Refund` becomes `Refunded { amount }`

      Anything else is `Err(format!("cannot {event:?} a {} payment", state.name()))`, where `name()` returns `pending`, `authorized`, `captured`, `refunded` or `failed`.
    seed: |
