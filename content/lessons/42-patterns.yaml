      enum Payment {
          Pending { amount: u64 },
          Authorized { amount: u64, auth_code: String },
          Captured { amount: u64 },
          Refunded { amount: u64 },
          Failed { reason: String },
      }

      #[derive(Debug)]
      enum Event {
          Authorize(String),
          Decline(String),
          Capture,
          Refund,
      }

      impl Payment {
          fn name(&self) -> &'static str {
              todo!()
          }

          fn next(self, event: Event) -> Result<Payment, String> {
              todo!()
          }
      }
    solution: |
      #[derive(Debug, PartialEq)]
      enum Payment {
          Pending { amount: u64 },
          Authorized { amount: u64, auth_code: String },
          Captured { amount: u64 },
          Refunded { amount: u64 },
          Failed { reason: String },
      }

      #[derive(Debug)]
      enum Event {
          Authorize(String),
          Decline(String),
          Capture,
          Refund,
      }

      impl Payment {
          fn name(&self) -> &'static str {
              match self {
                  Payment::Pending { .. } => "pending",
                  Payment::Authorized { .. } => "authorized",
                  Payment::Captured { .. } => "captured",
                  Payment::Refunded { .. } => "refunded",
                  Payment::Failed { .. } => "failed",
              }
          }

          fn next(self, event: Event) -> Result<Payment, String> {
              match (self, event) {
                  (Payment::Pending { amount }, Event::Authorize(code)) => Ok(Payment::Authorized { amount, auth_code: code }),
                  (Payment::Pending { .. } | Payment::Authorized { .. }, Event::Decline(reason)) => Ok(Payment::Failed { reason }),
                  (Payment::Authorized { amount, .. }, Event::Capture) => Ok(Payment::Captured { amount }),
                  (Payment::Captured { amount }, Event::Refund) => Ok(Payment::Refunded { amount }),
                  (state, event) => Err(format!("cannot {event:?} a {} payment", state.name())),
              }
          }
      }
    harness: |
      #[test]
      fn the_happy_path() {
          let p = Payment::Pending { amount: 500 };
          let p = p.next(Event::Authorize(String::from("A1"))).unwrap();
          assert_eq!(p, Payment::Authorized { amount: 500, auth_code: String::from("A1") }, "after Authorize");
          let p = p.next(Event::Capture).unwrap();
          assert_eq!(p, Payment::Captured { amount: 500 }, "after Capture");
          assert_eq!(p.next(Event::Refund), Ok(Payment::Refunded { amount: 500 }), "after Refund");
      }

      #[test]
      fn declines_from_pending_or_authorized() {
          assert_eq!(Payment::Pending { amount: 1 }.next(Event::Decline(String::from("card expired"))), Ok(Payment::Failed { reason: String::from("card expired") }), "decline pending");
          let auth = Payment::Authorized { amount: 1, auth_code: String::from("X") };
          assert_eq!(auth.next(Event::Decline(String::from("fraud"))), Ok(Payment::Failed { reason: String::from("fraud") }), "decline authorized");
      }

      #[test]
      fn invalid_moves_are_errors() {
          assert_eq!(Payment::Pending { amount: 9 }.next(Event::Capture), Err(String::from("cannot Capture a pending payment")), "capture pending");
          assert_eq!(Payment::Captured { amount: 9 }.next(Event::Decline(String::from("x"))), Err(String::from("cannot Decline(\"x\") a captured payment")), "decline captured");
          assert_eq!(Payment::Refunded { amount: 9 }.next(Event::Refund), Err(String::from("cannot Refund a refunded payment")), "refund twice");
          assert_eq!(Payment::Failed { reason: String::new() }.next(Event::Authorize(String::from("B"))), Err(String::from("cannot Authorize(\"B\") a failed payment")), "authorize failed");
      }

      #[test]
      fn names_every_state() {
          let names: Vec<&str> = [
              Payment::Pending { amount: 0 },
              Payment::Authorized { amount: 0, auth_code: String::new() },
              Payment::Captured { amount: 0 },
              Payment::Refunded { amount: 0 },
              Payment::Failed { reason: String::new() },
          ]
          .iter()
          .map(Payment::name)
          .collect();
          assert_eq!(names, ["pending", "authorized", "captured", "refunded", "failed"], "names");
      }
    hints:
      - "`name` is a `match self` with `{ .. }` patterns, one arm per variant."
      - "In `next`, `match (self, event)`: `(Payment::Pending { amount }, Event::Authorize(code)) => Ok(Payment::Authorized { amount, auth_code: code })` and so on."
      - "Combine states with `|`: `(Payment::Pending { .. } | Payment::Authorized { .. }, Event::Decline(reason))`. The last arm `(state, event) => Err(...)` catches the rest."
