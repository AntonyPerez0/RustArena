        require:
          - pattern: '\.\.\s*(Default::default\(\)|LogConfig::default\(\))'
            message: "Fill the remaining fields with struct update syntax: `..Default::default()`."
        harness: |
          #[test]
          fn default_matches_the_spec() {
              assert_eq!(LogConfig::default(), LogConfig { level: String::from("info"), color: true, max_files: 5, path: String::from("app.log") }, "LogConfig::default()");
          }

          #[test]
          fn debug_config_changes_two_fields() {
              assert_eq!(debug_config(), LogConfig { level: String::from("debug"), color: true, max_files: 20, path: String::from("app.log") }, "debug_config()");
          }
