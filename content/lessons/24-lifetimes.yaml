          assert_eq!(non_empty_or("", "guest"), "guest", "non_empty_or(\"\", \"guest\")");
          assert_eq!(non_empty_or("ana", "guest"), "ana", "non_empty_or(\"ana\", \"guest\")");
      }
    hints:
