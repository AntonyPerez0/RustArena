  - title: Structs that hold references
    id: lifetimes-4
    text: |
      A struct can hold a reference instead of owning its data. That's how fast parsers work: instead of copying every piece of the input into new `String`s, they hand out slices of the original text. But a struct holding a reference must not outlive the data it points at, so the struct gets a **lifetime parameter**:

      ```rust compile_fail
      struct Tokenizer {
          rest: &str,
      }

      fn main() {}
      ```

      ```error
      error[E0106]: missing lifetime specifier
      ```

      With the lifetime declared, here's a small tokenizer that splits a command into words, without copying a single byte:

      ```rust run
      struct Tokenizer<'a> {
          rest: &'a str,
      }

      impl<'a> Tokenizer<'a> {
          fn new(input: &'a str) -> Self {
              Tokenizer { rest: input }
          }

          fn next_token(&mut self) -> Option<&'a str> {
              let trimmed = self.rest.trim_start();
              if trimmed.is_empty() {
                  return None;
              }
              let end = trimmed.find(' ').unwrap_or(trimmed.len());
              let (token, rest) = trimmed.split_at(end);
              self.rest = rest;
              Some(token)
          }
      }

      fn main() {
          let command = String::from("move  north 3");
          let mut t = Tokenizer::new(&command);
          let mut tokens = Vec::new();
          while let Some(tok) = t.next_token() {
              tokens.push(tok);
          }
          println!("{:?}", tokens);
      }
      ```

      ```output
      ["move", "north", "3"]
      ```

      Piece by piece:

      - `struct Tokenizer<'a> { rest: &'a str }`: "a Tokenizer borrows a string for some lifetime `'a`, and can't outlive it".
      - `impl<'a> Tokenizer<'a>`: the impl block declares `'a` before using it, exactly like `impl<T> Wrapper<T>` for generics.
      - `fn new(input: &'a str) -> Self` ties the tokenizer to its input.
      - `fn next_token(&mut self) -> Option<&'a str>` is the important one. The tokens borrow from **the input** (`'a`), not from the tokenizer.

      ### Why `&'a str` and not just `&str`?

      With `-> Option<&str>`, elision rule 3 would tie each token to `&mut self`: the tokenizer would stay mutably borrowed for as long as the token is used. Collecting tokens in a loop would then fail, because the next call needs `&mut t` again while the earlier tokens (in `tokens`) still hold the borrow:

      ```error
      error[E0499]: cannot borrow `t` as mutable more than once at a time
         |
         |     while let Some(tok) = t.next_token() {
         |                           ^ `t` was mutably borrowed here in the previous iteration of the loop
         |         tokens.push(tok);
         |         ------ first borrow used here, in later iteration of loop
      ```

      Writing `'a` says the truth: a token is a slice of the original command, and stays valid as long as the command does, no matter what happens to the tokenizer.

      ### The struct can't outlive its data

      ```rust compile_fail
      struct Tokenizer<'a> {
          rest: &'a str,
      }

      fn main() {
          let t;
          {
              let cmd = String::from("go north");
              t = Tokenizer { rest: &cmd };
          }
          println!("{}", t.rest);
      }
      ```

      ```error
      error[E0597]: `cmd` does not live long enough
      ```

      Same error as in step 1, same fixes.

      ### Returning a struct with a lifetime

      A function that returns a borrowing struct can use elision, but write `'_` so the reader sees that something is borrowed. Since Rust 1.89 the compiler warns if you hide it (`fn parse(line: &str) -> Entry` gives `warning: hiding a lifetime that's elided elsewhere is confusing`):

      ```rust
      fn parse(line: &str) -> Entry<'_> { ... }          // elided, but visible
      fn parse<'a>(line: &'a str) -> Entry<'a> { ... }   // the same thing, spelled out
      ```

      ### Common mistakes

      - **Forgetting `<'a>` after `impl`.** `impl Tokenizer<'a>` gives ``error[E0261]: use of undeclared lifetime name `'a` ``: a lifetime must be declared before it's used, so write `impl<'a> Tokenizer<'a>`.
      - **Returning slices tied to `&self` or `&mut self`** when they really come from the input. The signature compiles, but callers hit E0499 or "does not live long enough" later. Return `&'a str`.
      - **Using a borrowing struct for long-lived data.** See the note below.

      ### Workplace note

      Borrowing structs are fast, but their lifetime spreads: anything that holds an `Entry<'a>` needs a `'a` too. Teams typically use them for short-lived **views** (parsers, iterators, a function that analyzes a buffer) and use owned `String` fields for data that's stored, returned through many layers, or sent to other threads. The last steps of this module come back to that choice.

      **Your turn:** log lines look like `[WARN] disk almost full`. Give `LogLine` a lifetime so its fields can borrow from the line, and write `parse_log`: it returns `Some(LogLine)` with the text between the brackets as `level` and the rest (trimmed) as `message`, or `None` if the line doesn't start with `[` or has no `]`.

      `line.strip_prefix('[')` returns the rest of the line after the `[`, or `None` if it doesn't start with one. Inside a function returning `Option`, `?` on an `Option` returns `None` early.
    seed: |
      #[derive(Debug, PartialEq)]
      struct LogLine {
          level: &str,
          message: &str,
      }

      fn parse_log(line: &str) -> Option<LogLine> {
          todo!()
      }
    solution: |
      #[derive(Debug, PartialEq)]
      struct LogLine<'a> {
          level: &'a str,
          message: &'a str,
      }

      fn parse_log(line: &str) -> Option<LogLine<'_>> {
          let rest = line.strip_prefix('[')?;
          let (level, message) = rest.split_once(']')?;
          Some(LogLine { level, message: message.trim() })
      }
    harness: |
      #[test]
      fn parses_level_and_message() {
          assert_eq!(parse_log("[WARN] disk almost full"), Some(LogLine { level: "WARN", message: "disk almost full" }), "parse_log(\"[WARN] disk almost full\")");
      }

      #[test]
      fn trims_the_message() {
          assert_eq!(parse_log("[INFO]   started  "), Some(LogLine { level: "INFO", message: "started" }), "parse_log(\"[INFO]   started  \")");
      }

      #[test]
      fn rejects_a_line_without_brackets() {
          assert_eq!(parse_log("no level here"), None, "parse_log(\"no level here\")");
      }

      #[test]
      fn rejects_a_missing_closing_bracket() {
          assert_eq!(parse_log("[ERROR disk"), None, "parse_log(\"[ERROR disk\")");
      }

      #[test]
      fn borrows_from_an_owned_line() {
          let line = String::from("[DEBUG] x=1");
          let parsed = parse_log(&line).unwrap();
          assert_eq!(parsed.level, "DEBUG", "level of \"[DEBUG] x=1\"");
          assert_eq!(parsed.message, "x=1", "message of \"[DEBUG] x=1\"");
      }
    hints:
      - "The struct becomes `struct LogLine<'a> { level: &'a str, message: &'a str }`, and the return type `Option<LogLine<'_>>`."
      - "`let rest = line.strip_prefix('[')?;` then `let (level, message) = rest.split_once(']')?;`"
      - "Finish with `Some(LogLine { level, message: message.trim() })`."
    more:
      - task: |
          Settings come as one string like `"host=example.com; port=8080"`. Write the method `get` on `KeyValues`: it splits the input on `;`, splits each pair at `=`, and returns the trimmed value for `key` (comparing the trimmed key), or `None`.

          The value must borrow from **the input** (`'a`), not from the `KeyValues`: a hidden test drops the `KeyValues` and keeps using the value. Change the return type accordingly.
        seed: |
          struct KeyValues<'a> {
              input: &'a str,
          }

          impl<'a> KeyValues<'a> {
              fn get(&self, key: &str) -> Option<&str> {
                  todo!()
              }
          }
        solution: |
          struct KeyValues<'a> {
              input: &'a str,
          }

          impl<'a> KeyValues<'a> {
              fn get(&self, key: &str) -> Option<&'a str> {
                  for pair in self.input.split(';') {
                      if let Some((k, v)) = pair.split_once('=') {
                          if k.trim() == key {
                              return Some(v.trim());
                          }
                      }
                  }
                  None
              }
          }
        harness: |
          #[test]
          fn finds_a_value() {
              let kv = KeyValues { input: "host=example.com; port=8080" };
              assert_eq!(kv.get("port"), Some("8080"), "get(\"port\")");
              assert_eq!(kv.get("host"), Some("example.com"), "get(\"host\")");
          }

          #[test]
          fn a_missing_key_is_none() {
              let kv = KeyValues { input: "a=1;b=2" };
              assert_eq!(kv.get("c"), None, "get(\"c\")");
          }

          #[test]
          fn ignores_pairs_without_an_equals_sign() {
              let kv = KeyValues { input: "junk; mode = dark" };
              assert_eq!(kv.get("mode"), Some("dark"), "get(\"mode\")");
          }

          #[test]
          fn the_value_outlives_the_key_values() {
              let input = String::from("user=ana;lang=rust");
              let lang;
              {
                  let kv = KeyValues { input: &input };
                  lang = kv.get("lang");
              }
              assert_eq!(lang, Some("rust"), "value used after KeyValues was dropped");
          }
        hints:
          - "Change the return type to `Option<&'a str>`: the value is a slice of `self.input`, which has lifetime `'a`."
          - "`for pair in self.input.split(';')`, then `if let Some((k, v)) = pair.split_once('=')` and compare `k.trim() == key`."
      - task: |
          Write a whole program. The first line of stdin is a city; every following line is `name,city`. Read all of stdin into one `String`, parse the lines into a `Vec<Person>` where `struct Person<'a> { name: &'a str, city: &'a str }` borrows (trimmed) slices of the input, and print the name of everyone in that city, one per line, followed by `<n> found`. Don't copy any names or cities into new `String`s.
        seed: |
          use std::io::Read;

          // struct Person<'a> { ... }

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
          }
        solution: |
          use std::io::Read;

          struct Person<'a> {
              name: &'a str,
              city: &'a str,
          }

          fn parse_people(text: &str) -> Vec<Person<'_>> {
              let mut people = Vec::new();
              for line in text.lines() {
                  if let Some((name, city)) = line.split_once(',') {
                      people.push(Person { name: name.trim(), city: city.trim() });
                  }
              }
              people
          }

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let (wanted, rest) = input.split_once('\n').unwrap_or((input.as_str(), ""));
              let people = parse_people(rest);
              let mut found = 0;
              for p in &people {
                  if p.city == wanted.trim() {
                      println!("{}", p.name);
                      found += 1;
                  }
              }
              println!("{found} found");
          }
        forbid:
          - pattern: '\.clone\(\)|\.to_string\(\)|\.to_owned\(\)|String::from'
            message: "Borrow slices of the input instead of making new `String`s."
        hints:
          - "`let (wanted, rest) = input.split_once('\\n').unwrap_or((input.as_str(), \"\"));` separates the first line."
          - "For each line of `rest`, `line.split_once(',')` gives the name and city; push `Person { name: name.trim(), city: city.trim() }`."
          - "A helper `fn parse_people(text: &str) -> Vec<Person<'_>>` keeps `main` short."
        tests:
          - stdin: "Lisbon\nana,Lisbon\nbo,Porto\ncy, Lisbon\n"
            expect: "ana\ncy\n2 found"
          - stdin: "Oslo\nana,Lisbon\n"
            expect: "0 found"
          - stdin: "Porto\nzed,Porto\namy,Porto\nmax,Faro\n"
            hidden: true

  - title: "'static: references that live forever"
    id: lifetimes-5
    text: |
      One lifetime name is built in: `'static`, meaning "valid for the entire run of the program". Every string literal is a `&'static str`. Its bytes are stored inside the compiled program itself, so they're never freed.

      ```rust run
      fn level_name(code: u8) -> &'static str {
          match code {
              0 => "debug",
              1 => "info",
              2 => "warn",
              _ => "error",
          }
      }

      const APP: &str = "RustArena";

      fn main() {
          let name;
          {
              let code = 2;
              name = level_name(code);
          }
          println!("{APP}: {name}");
      }
      ```

      ```output
      RustArena: warn
      ```

      - `level_name` takes no references, so elision has nothing to borrow from: `-> &str` alone would be E0106. The result is always a literal, so `&'static str` is the honest answer, and the caller can keep it as long as it likes.
      - Constants and statics are always `'static`, so `const APP: &str` doesn't need the annotation.
      - A struct field can also be `&'static str` with no lifetime parameter on the struct: `struct HttpError { code: u16, reason: &'static str }`. That's common for fixed messages and lookup tables.

      ### Common mistakes

      - **Adding `'static` to make an error go away.** When the compiler complains about lifetimes, it's tempting. It never works for data created while the program runs, because that data really is dropped:

      ```rust compile_fail
      fn make_label(id: u32) -> &'static str {
          let s = format!("ticket-{id}");
          &s
      }

      fn main() {
          println!("{}", make_label(7));
      }
      ```

      ```error
      error[E0515]: cannot return reference to local variable `s`
      ```

      `s` is a `String` built at run time and dropped at the end of `make_label`. The real fix, returning a `String`, is the next step. Read the help on E0106 carefully too: it suggests `'static`, but adds "this is uncommon unless you're returning a borrowed value from a `const` or a `static`".

      - **Reading `T: 'static` as "lives forever".** You'll meet `'static` as a **bound** on a type, for example in `std::thread::spawn`. `T: 'static` means "contains no borrowed references that could expire". Every owned type qualifies: `String`, `Vec<u32>`, `i32`, your structs without references. The threads module explains why spawn needs it.

      **Your turn:** write `status_text`, which turns an HTTP status code into its reason phrase: `200` is `OK`, `404` is `Not Found`, `500` is `Internal Server Error`, anything else `Unknown`. Fix the return type so it compiles.
    seed: |
      fn status_text(code: u16) -> &str {
          todo!()
      }
    solution: |
      fn status_text(code: u16) -> &'static str {
          match code {
              200 => "OK",
              404 => "Not Found",
              500 => "Internal Server Error",
              _ => "Unknown",
          }
      }
    harness: |
      #[test]
      fn ok_for_200() {
          assert_eq!(status_text(200), "OK", "status_text(200)");
      }

      #[test]
      fn not_found_for_404() {
          assert_eq!(status_text(404), "Not Found", "status_text(404)");
      }

      #[test]
      fn server_error_for_500() {
          assert_eq!(status_text(500), "Internal Server Error", "status_text(500)");
      }

      #[test]
      fn unknown_otherwise() {
          assert_eq!(status_text(418), "Unknown", "status_text(418)");
      }

      #[test]
      fn the_text_can_be_kept_anywhere() {
          let kept: &'static str = status_text(404);
          assert_eq!(kept, "Not Found", "a 'static result");
      }
    hints:
      - "Every result is a string literal, so the return type is `&'static str`."
      - "Use `match code { 200 => \"OK\", ... , _ => \"Unknown\" }`."
    more:
      - task: |
          Fill in the blank so `HttpError` can hold a fixed message without a lifetime parameter. The program prints `404 Not Found`.
        fill: |
