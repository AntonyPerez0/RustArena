              code: u16,
              reason: &[['static]] str,
          }

          fn main() {
              let e = HttpError { code: 404, reason: "Not Found" };
              println!("{} {}", e.code, e.reason);
          }
        hints:
          - The reason is always a string literal, which lives for the whole program.
        tests:
          - expect: "404 Not Found"
      - task: |
          Leaderboards print places as `1st`, `2nd`, `3rd`, `4th`... Write `fn suffix(n: u32) -> &'static str` and `fn ordinal(n: u32) -> String`.

          The rule: numbers ending in 11, 12 or 13 always use `th` (`11th`, `112th`). Otherwise a last digit of 1 is `st`, 2 is `nd`, 3 is `rd`, and everything else is `th`.
        seed: |
          fn suffix(n: u32) -> &'static str {
              todo!()
          }

          fn ordinal(n: u32) -> String {
              todo!()
          }
        solution: |
          fn suffix(n: u32) -> &'static str {
              if (11..=13).contains(&(n % 100)) {
                  return "th";
              }
              match n % 10 {
                  1 => "st",
                  2 => "nd",
                  3 => "rd",
                  _ => "th",
              }
          }

          fn ordinal(n: u32) -> String {
              format!("{}{}", n, suffix(n))
          }
        harness: |
          #[test]
          fn the_first_three_places() {
              assert_eq!(ordinal(1), "1st", "ordinal(1)");
              assert_eq!(ordinal(2), "2nd", "ordinal(2)");
              assert_eq!(ordinal(3), "3rd", "ordinal(3)");
          }

          #[test]
          fn most_numbers_use_th() {
              assert_eq!(ordinal(4), "4th", "ordinal(4)");
              assert_eq!(ordinal(10), "10th", "ordinal(10)");
          }

          #[test]
          fn the_teens_always_use_th() {
              assert_eq!(ordinal(11), "11th", "ordinal(11)");
              assert_eq!(ordinal(12), "12th", "ordinal(12)");
              assert_eq!(ordinal(113), "113th", "ordinal(113)");
          }

          #[test]
          fn larger_numbers() {
              assert_eq!(ordinal(21), "21st", "ordinal(21)");
              assert_eq!(ordinal(102), "102nd", "ordinal(102)");
          }

          #[test]
          fn suffix_alone() {
              assert_eq!(suffix(23), "rd", "suffix(23)");
          }
        hints:
          - "Check the teens first: `if (11..=13).contains(&(n % 100)) { return \"th\"; }`."
          - "Then `match n % 10` for st, nd, rd and th. `ordinal` is `format!(\"{}{}\", n, suffix(n))`."

  - title: When to return owned data instead
    id: lifetimes-6
    text: |
      Some lifetime errors have no lifetime fix at all. The most common one:

      ```rust compile_fail
      fn make_greeting(name: &str) -> &str {
          let greeting = format!("Hello, {name}!");
          &greeting
      }

      fn main() {
          println!("{}", make_greeting("Ferris"));
      }
      ```

      ```error
      error[E0515]: cannot return reference to local variable `greeting`
       --> src/main.rs:3:5
        |
      3 |     &greeting
        |     ^^^^^^^^^ returns a reference to data owned by the current function
      ```

      The signature is fine as far as elision goes (one input, so rule 2 says the result borrows from `name`). The body breaks that promise: `greeting` is a new `String` owned by `make_greeting`, and it's dropped when the function returns. Any reference to it would dangle. Writing `<'a>` everywhere changes nothing, and neither does `'static`: the data simply doesn't exist after the function ends. (Returning `greeting.as_str()` gives the same error in another wording: "returns a value referencing data owned by the current function".)

      **The fix is to return the owned value**: give ownership of the `String` to the caller.

      ```rust run
      fn make_greeting(name: &str) -> String {
          format!("Hello, {name}!")
      }

      fn first_name(full: &str) -> &str {
          full.split(' ').next().unwrap_or(full)
      }

      fn main() {
          let full = String::from("Ana Lovelace");
          println!("{}", make_greeting(first_name(&full)));
      }
      ```

      ```output
      Hello, Ana!
      ```

      Moving a `String` out of a function is cheap: only the pointer, length and capacity are copied, never the text.

      ### Borrow or own? A rule of thumb

      - The function **builds new data** (`format!`, `to_uppercase`, `replace`, `join`, collecting into a `Vec`): return the owned type, `String` or `Vec<T>`.
      - The function **selects part of its input** (`trim`, slicing, `split_once`, finding an item): return a reference into the input, like `first_name`.
      - A struct that's **stored** (in a collection, a cache, app state), returned through several layers or sent to another thread: give it owned fields. Use borrowing structs (`Tokenizer<'a>`) for short-lived views.
      - If lifetimes start spreading through half your code to save copying a few small strings, owning is fine. A `clone()` of a short `String` costs nanoseconds; a week fighting `'a`s costs a week. Profile first, optimize where it matters (the performance module shows `Cow<str>` for "borrowed when possible, owned when needed").

      Experienced Rust developers return owned data far more often than beginners expect. It's not giving up; it's choosing the simplest correct design.

      ### Common mistakes

      - **Returning a reference to a local variable or a temporary.** `&format!(...)`, `&s` where `s` was made in the function, `vec.iter().collect::<Vec<_>>().as_slice()`: all E0515. Return the owned value.
      - **Reaching for `'static`.** As the previous step showed, it doesn't apply to data created at run time.
      - **Over-cloning the other way.** Taking `name: String` when you only read it forces callers to give up or copy their string. Take `&str` in, return `String` out when you create something new.

      **Your turn:** fix the three functions. `make_greeting` and `initials` build new strings, so they must return owned data. `last_name` only selects part of its input: keep it returning a `&str`. Results: `make_greeting("Ana")` is `Hello, Ana!`, `initials("Ada Lovelace")` is `A.L.`, `last_name("Ada Lovelace")` is `Lovelace`.
    seed: |
      fn make_greeting(name: &str) -> &str {
          let greeting = format!("Hello, {name}!");
          &greeting
      }

      fn initials(full_name: &str) -> &str {
          let mut out = String::new();
          for word in full_name.split_whitespace() {
              if let Some(c) = word.chars().next() {
                  out.push(c);
                  out.push('.');
              }
          }
          &out
      }

      fn last_name(full_name: &str) -> &str {
          full_name.split_whitespace().last().unwrap_or("")
      }
    solution: |
      fn make_greeting(name: &str) -> String {
          format!("Hello, {name}!")
      }

      fn initials(full_name: &str) -> String {
          let mut out = String::new();
          for word in full_name.split_whitespace() {
              if let Some(c) = word.chars().next() {
                  out.push(c);
                  out.push('.');
              }
          }
          out
      }

      fn last_name(full_name: &str) -> &str {
          full_name.split_whitespace().last().unwrap_or("")
      }
    forbid:
      - pattern: "'static|Box::leak"
        message: "Don't fake a long lifetime: return the owned `String` instead."
      - pattern: 'fn\s+last_name[^{]*->\s*String'
        message: "`last_name` only selects part of its input; keep returning a `&str`."
    harness: |
      #[test]
      fn greets_by_name() {
          assert_eq!(make_greeting("Ana"), "Hello, Ana!", "make_greeting(\"Ana\")");
      }

      #[test]
      fn builds_initials() {
          assert_eq!(initials("Ada Lovelace"), "A.L.", "initials(\"Ada Lovelace\")");
          assert_eq!(initials("Grace Brewster Hopper"), "G.B.H.", "initials(\"Grace Brewster Hopper\")");
      }

      #[test]
      fn initials_of_nothing_is_empty() {
          assert_eq!(initials(""), "", "initials(\"\")");
      }

      #[test]
      fn last_name_is_the_last_word() {
          assert_eq!(last_name("Ada Lovelace"), "Lovelace", "last_name(\"Ada Lovelace\")");
          assert_eq!(last_name("Cher"), "Cher", "last_name(\"Cher\")");
      }

      #[test]
      fn last_name_borrows_from_the_input() {
          let full = String::from("Linus Torvalds");
          let last: &str = last_name(&full);
          assert_eq!(last, "Torvalds", "last_name(&String)");
      }
    hints:
      - "Change the return types of `make_greeting` and `initials` to `String`."
      - "Then return the `String` itself: `format!(\"Hello, {name}!\")` with no `&`, and `out` instead of `&out`."
    more:
      - task: |
          `Report` borrows its title, but `build_report` creates the title with `format!`, so there's nothing long-lived to borrow from. Change `Report` to **own** its title (and drop the lifetime parameter), so `build_report("sales", &[3, 4])` returns a report with title `Report: sales` and total `7`.
        seed: |
          struct Report<'a> {
              title: &'a str,
              total: u32,
          }

          fn build_report(name: &str, values: &[u32]) -> Report<'_> {
              let title = format!("Report: {name}");
              let mut total = 0;
              for v in values {
                  total += v;
              }
              Report { title: &title, total }
          }
        solution: |
          struct Report {
              title: String,
              total: u32,
          }

          fn build_report(name: &str, values: &[u32]) -> Report {
              let title = format!("Report: {name}");
              let mut total = 0;
              for v in values {
                  total += v;
              }
              Report { title, total }
          }
        harness: |
          #[test]
          fn builds_the_title() {
              assert_eq!(build_report("sales", &[3, 4]).title, "Report: sales", "title of build_report(\"sales\", ..)");
          }

          #[test]
          fn adds_the_values() {
              assert_eq!(build_report("sales", &[3, 4]).total, 7, "total of [3, 4]");
          }

          #[test]
          fn an_empty_report() {
              let r = build_report("q4", &[]);
              assert_eq!(r.title, "Report: q4", "title");
              assert_eq!(r.total, 0, "total of []");
          }

          #[test]
          fn the_report_outlives_the_name() {
              let r;
              {
                  let name = String::from("temp");
                  r = build_report(&name, &[1]);
              }
              assert_eq!(r.title, "Report: temp", "report used after its name was dropped");
          }
        hints:
          - "Make the field `title: String` and remove `<'a>` from the struct (and `<'_>` from the return type)."
          - "Move the `String` into the struct: `Report { title, total }`."
      - task: |
          Write two functions over a list of words:

          - `fn shout_all(words: &[&str]) -> Vec<String>` returns every word in upper case with `!` added (`"hi"` becomes `"HI!"`). These are new strings: return owned data.
          - `fn longest_word<'a>(words: &[&'a str]) -> Option<&'a str>` returns the longest word (the first one on a tie), or `None` for an empty list. It returns one of the words themselves, borrowed from the original text.

          Notice the signature of `longest_word`: the result is tied to the **words** (`&'a str`), not to the slice holding them. A hidden test throws the slice away and keeps the word.
        seed: |
          fn shout_all(words: &[&str]) -> Vec<String> {
              todo!()
          }

          fn longest_word<'a>(words: &[&'a str]) -> Option<&'a str> {
              todo!()
          }
        solution: |
          fn shout_all(words: &[&str]) -> Vec<String> {
              let mut out = Vec::new();
              for w in words {
                  out.push(format!("{}!", w.to_uppercase()));
              }
              out
          }

          fn longest_word<'a>(words: &[&'a str]) -> Option<&'a str> {
              let mut best: Option<&'a str> = None;
              for &w in words {
                  match best {
                      Some(b) if b.len() >= w.len() => {}
                      _ => best = Some(w),
                  }
              }
              best
          }
        harness: |
          #[test]
          fn shouts_every_word() {
              assert_eq!(shout_all(&["hi", "crab"]), vec!["HI!", "CRAB!"], "shout_all([\"hi\", \"crab\"])");
          }

          #[test]
          fn shouting_nothing_gives_nothing() {
              assert_eq!(shout_all(&[]), Vec::<String>::new(), "shout_all([])");
          }

          #[test]
          fn finds_the_longest_word() {
              assert_eq!(longest_word(&["tiny", "enormous", "mid"]), Some("enormous"), "longest_word(tiny, enormous, mid)");
          }

          #[test]
          fn a_tie_keeps_the_first() {
              assert_eq!(longest_word(&["abc", "xyz"]), Some("abc"), "longest_word(abc, xyz)");
          }

          #[test]
          fn no_words_is_none() {
              assert_eq!(longest_word(&[]), None, "longest_word([])");
          }

          #[test]
          fn the_word_outlives_the_list() {
              let text = String::from("small gigantic medium");
              let best;
              {
                  let words: Vec<&str> = text.split(' ').collect();
                  best = longest_word(&words);
              }
              assert_eq!(best, Some("gigantic"), "result used after the Vec of words was dropped");
          }
        hints:
          - "`shout_all`: loop over the words and push `format!(\"{}!\", w.to_uppercase())` into a new `Vec`."
          - "`longest_word`: keep `let mut best: Option<&'a str> = None;` and replace it when a word is strictly longer (or `best` is still `None`)."

  - title: Reading lifetime errors
    id: lifetimes-7
    text: |
      Lifetime errors look scary but come in a handful of shapes, and each shape has a short list of fixes. Here's the field guide.

      | Error | What it means | Usual fixes |
      |---|---|---|
      | `E0106` missing lifetime specifier | A signature or struct returns/holds a reference, and elision can't tell where from. | Add `'a` to tie the output to the right inputs; or return owned data; or `'static` for literals. |
      | `E0597` `x` does not live long enough | A value is dropped while a reference to it is still used later. | Move the value to an outer scope; use the reference earlier; own the data. |
      | `E0515` cannot return reference to local variable | A function returns a reference to something it created. | Return the owned value (`String`, `Vec`). |
      | `E0716` temporary value dropped while borrowed | You borrowed from a value that was never stored in a variable. | Store it in a `let` first. |
      | lifetime may not live long enough | A function's body returns a reference with a different lifetime than its signature promised. | Fix the signature (often rule 3 guessed `self`), or return what it promises. |
      | `E0499` / `E0502` borrow conflicts | Two borrows overlap (borrowing module). With methods: often a result tied to `&mut self` that should be tied to `'a`. | Shorter borrows; return `&'a T` from the data, not from `self`. |

      The temporary one deserves an example, because it surprises everyone once:

      ```rust compile_fail
      fn main() {
          let label = format!("v{}", 2).as_str();
          println!("{label}");
      }
      ```

      ```error
      error[E0716]: temporary value dropped while borrowed
       --> src/main.rs:2:17
        |
      2 |     let label = format!("v{}", 2).as_str();
        |                 ^^^^^^^^^^^^^^^^^         - temporary value is freed at the end of this statement
        |                 |
        |                 creates a temporary value which is freed while still in use
      3 |     println!("{label}");
        |                ----- borrow later used here
        |
        = note: consider using a `let` binding to create a longer lived value
      ```

      The `String` from `format!` has no owner variable, so it's dropped at the `;`. The fix is in the note: give it an owner first (or just use the `String`).

      ```rust run
      fn main() {
          let owned = format!("v{}", 2);
          let label = owned.as_str();
          println!("{label}");
      }
      ```

      ```output
      v2
      ```

      ### A method for any lifetime error

      1. **Find the value** the error is about (the name in backticks).
      2. **Find where it's dropped**: the label `dropped here while still borrowed`, or the end of a function for E0515.
      3. **Find the late use**: `borrow later used here`.
      4. **Pick a fix**: make the owner live longer, end the use sooner, own the data, or (for signatures) describe the real relationship with `'a`.

      Resist adding annotations at random until it compiles. Each error describes a real dangling reference that would have crashed or corrupted data in C. Once you see *which* value would dangle, the fix is usually one line.

      **Your turn:** this program has three different lifetime errors (compile it to see them all). Fix each one in the way you think is best. The program must print:

      ```
      winner: lifetimes
      tag: #rust
      version: v1.85
      ```
    seed: |
      fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn hashtag(word: &str) -> &str {
          let tag = format!("#{}", word.to_lowercase());
          &tag
      }

      fn main() {
          let first = String::from("borrowck");
          let winner;
          {
              let second = String::from("lifetimes");
              winner = longest(&first, &second);
          }
          println!("winner: {winner}");

          let tag = hashtag("Rust");
          println!("tag: {tag}");

          let version = format!("v{}.{}", 1, 85).as_str();
          println!("version: {version}");
      }
    solution: |
      fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn hashtag(word: &str) -> String {
          format!("#{}", word.to_lowercase())
      }

      fn main() {
          let first = String::from("borrowck");
          let second = String::from("lifetimes");
          let winner = longest(&first, &second);
          println!("winner: {winner}");

          let tag = hashtag("Rust");
          println!("tag: {tag}");

          let owned = format!("v{}.{}", 1, 85);
          let version = owned.as_str();
          println!("version: {version}");
      }
    hints:
      - "E0597: `second` is dropped at the end of the inner block, but `winner` (which may point at it) is used after. Move `second` out of the block."
      - "E0515: `hashtag` builds a new string, so it should return `String` (and `format!(...)` without `&`)."
      - "E0716: store the `format!` result in its own `let` before calling `.as_str()`, or just print the `String`."
    tests:
      - expect: "winner: lifetimes\ntag: #rust\nversion: v1.85"
    more:
      - task: |
          `Highlight` marks a word inside a longer text without copying the text. The code is almost right, but the struct is missing its lifetime. Add the lifetime parameter to the struct and the `impl` block (and wherever else the compiler asks) so it prints:

          ```
          the borrow [checker] is your friend
          checker
          ```
        seed: |
          struct Highlight {
              text: &str,
              start: usize,
              end: usize,
          }

          impl Highlight {
              fn new(text: &str, word: &str) -> Option<Highlight> {
                  let start = text.find(word)?;
                  Some(Highlight { text, start, end: start + word.len() })
              }

              fn marked(&self) -> String {
                  format!("{}[{}]{}", &self.text[..self.start], &self.text[self.start..self.end], &self.text[self.end..])
              }

              fn word(&self) -> &str {
                  &self.text[self.start..self.end]
              }
          }

          fn main() {
              let review = String::from("the borrow checker is your friend");
              let h = Highlight::new(&review, "checker").unwrap();
              println!("{}", h.marked());
              println!("{}", h.word());
          }
        solution: |
          struct Highlight<'a> {
              text: &'a str,
              start: usize,
              end: usize,
          }

          impl<'a> Highlight<'a> {
              fn new(text: &'a str, word: &str) -> Option<Highlight<'a>> {
                  let start = text.find(word)?;
                  Some(Highlight { text, start, end: start + word.len() })
              }

              fn marked(&self) -> String {
                  format!("{}[{}]{}", &self.text[..self.start], &self.text[self.start..self.end], &self.text[self.end..])
              }

              fn word(&self) -> &'a str {
                  &self.text[self.start..self.end]
              }
          }

          fn main() {
              let review = String::from("the borrow checker is your friend");
              let h = Highlight::new(&review, "checker").unwrap();
              println!("{}", h.marked());
              println!("{}", h.word());
          }
        hints:
          - "`struct Highlight<'a> { text: &'a str, ... }` and `impl<'a> Highlight<'a>`."
          - "`new` must tie the result to `text` only: `fn new(text: &'a str, word: &str) -> Option<Highlight<'a>>`."
        tests:
          - expect: "the borrow [checker] is your friend\nchecker"
      - task: |
          Starting from nothing, write a `Sentences` splitter in the style of the tokenizer from step 4:

          - `struct Sentences<'a>` that keeps the rest of the text still to be read,
          - `fn new(text: &'a str) -> Self`,
          - `fn next_sentence(&mut self) -> Option<&'a str>` that returns the next piece of text up to a `.` (without the `.`), trimmed, skipping empty pieces, and `None` at the end.

          For `"Hi. How are you.  Fine."` the sentences are `Hi`, `How are you` and `Fine`. Text after the last `.` counts as a sentence too. The hidden tests collect every sentence into a `Vec` while calling `next_sentence` again, which only compiles if the sentences borrow from the text (`'a`), not from the splitter.
        seed: |
          // struct Sentences<'a> { ... }

          // impl<'a> Sentences<'a> {
          //     fn new(text: &'a str) -> Self
          //     fn next_sentence(&mut self) -> Option<&'a str>
          // }
        solution: |
          struct Sentences<'a> {
              rest: &'a str,
          }

          impl<'a> Sentences<'a> {
              fn new(text: &'a str) -> Self {
                  Sentences { rest: text }
              }

              fn next_sentence(&mut self) -> Option<&'a str> {
                  while !self.rest.is_empty() {
                      let (piece, rest) = match self.rest.find('.') {
                          Some(i) => (&self.rest[..i], &self.rest[i + 1..]),
                          None => (self.rest, ""),
                      };
                      self.rest = rest;
                      let piece = piece.trim();
                      if !piece.is_empty() {
                          return Some(piece);
                      }
                  }
                  None
              }
          }
        harness: |
          fn all(text: &str) -> Vec<&str> {
              let mut s = Sentences::new(text);
              let mut out = Vec::new();
              while let Some(x) = s.next_sentence() {
                  out.push(x);
              }
              out
          }

          #[test]
          fn splits_three_sentences() {
              assert_eq!(all("Hi. How are you.  Fine."), vec!["Hi", "How are you", "Fine"], "all(\"Hi. How are you.  Fine.\")");
          }

          #[test]
          fn text_after_the_last_dot_counts() {
              assert_eq!(all("One. Two"), vec!["One", "Two"], "all(\"One. Two\")");
          }

          #[test]
          fn skips_empty_pieces() {
              assert_eq!(all("...Wait... what."), vec!["Wait", "what"], "all(\"...Wait... what.\")");
          }

          #[test]
          fn empty_text_has_no_sentences() {
              let mut s = Sentences::new("");
              assert_eq!(s.next_sentence(), None, "next_sentence() on \"\"");
          }
        hints:
          - "Keep one field, `rest: &'a str`. Each call finds the next `.` with `self.rest.find('.')` and moves `rest` past it."
          - "Loop until you find a non-empty trimmed piece or `rest` is empty: `while !self.rest.is_empty() { ... }` then `None`."
          - "Split with `(&self.rest[..i], &self.rest[i + 1..])` when there's a dot, or `(self.rest, \"\")` when there isn't."
