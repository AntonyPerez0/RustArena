id: lifetimes
title: Lifetimes
phase: "Errors and abstraction"
summary: How Rust proves every reference points at something still alive. Read lifetime errors calmly, annotate functions and structs that hand out references, know the elision rules, and know when returning owned data is the better answer.
roadmap: [Lifetimes & Borrow Checker, Explicit Lifetime Annotations, Lifetime Elision Rules]
steps:
  - title: "Why lifetimes exist: scopes and dangling references"
    id: lifetimes-1
    text: |
      A reference points at a value that someone else owns. If the owner is dropped while the reference is still in use, the reference points at freed memory: a **dangling reference**. In C and C++ that's one of the most common causes of crashes and security holes. Rust rules it out completely, at compile time, with the **borrow checker**.

      The borrow checker compares two stretches of code:

      1. **How long the value lives**: from where it's created to where it's dropped (the end of its scope, or where it's moved away).
      2. **How long the reference is used**: from where it's created to its **last use**.

      The second must fit inside the first. That stretch where a reference must stay valid is its **lifetime**. Here's the classic failure:

      ```rust compile_fail
      fn main() {
          let r;
          {
              let s = String::from("crab");
              r = &s;
          }
          println!("{r}");
      }
      ```

      ```error
      error[E0597]: `s` does not live long enough
       --> src/main.rs:5:13
        |
      4 |         let s = String::from("crab");
        |             - binding `s` declared here
      5 |         r = &s;
        |             ^^ borrowed value does not live long enough
      6 |     }
        |     - `s` dropped here while still borrowed
      7 |     println!("{r}");
        |                - borrow later used here
      ```

      Draw the two stretches next to the code and the problem is plain:

      ```text
      let r;                              r's use ----------------+
      {                                                           |
          let s = String::from("crab");   s lives --+             |
          r = &s;                                   |             |
      }                                   s dropped +             |
      println!("{r}");                    last use of r ----------+
      ```

      `s` is gone at the `}`, but `r` is still used after it. The error's four labels tell exactly this story: where `s` was declared, where it was borrowed, where it was dropped, and where the borrow was used too late. **Read every label**, not just the first line: they point at the three places you might change.

      ### Three ways to fix it

      1. **Make the value live longer**: move `let s` out to the outer scope.
      2. **Use the reference sooner**: move the `println!` inside the block, before `s` is dropped.
      3. **Don't borrow; own**: make `r` a `String` (`r = s;` moves it out, or `r = s.clone();`).

      ```rust run
      fn main() {
          let s = String::from("crab");
          let r;
          {
              r = &s;
              println!("inside: {r}");
          }
          println!("outside: {r}");
      }
      ```

      ```output
      inside: crab
      outside: crab
      ```

      ### Lifetimes are checked, not chosen

      A lifetime is not something you set, and nothing you write changes when a value is dropped. Values are dropped where the ownership rules say. Lifetimes are the compiler's way of **checking** that references respect that. Most of the time it works them out on its own, just like it infers most types. In the next steps you'll see the few places where it needs you to *describe* how references relate.

      Remember from the borrowing module that a reference's lifetime ends at its **last use**, not at the end of its scope. That's why this is fine: `first` isn't used after the `push`.

      ```rust run
      fn main() {
          let mut scores = vec![10, 20];
          let first = &scores[0];
          println!("first: {first}");
          scores.push(30);
          println!("{:?}", scores);
      }
      ```

      ```output
      first: 10
      [10, 20, 30]
      ```

      ### Common mistakes

      - **Reading only the first line of the error.** The labels below it say which value, where it's dropped, and where it's used too late: that's the whole diagnosis.
      - **Expecting a reference to keep its value alive.** In garbage-collected languages it would. In Rust the **owner** decides when a value is dropped, and every reference has to fit inside that.
      - **Cloning by reflex.** `.clone()` makes the error go away, but often the real fix is putting the owner in the right scope. Clone when you actually want an independent copy.

      **Your turn:** this program doesn't compile: `longest_name` borrows from `names`, which is dropped at the end of the inner block. Fix it by making `names` live long enough (don't copy the string). It should print `Longest: Corro the Unsafe`.
    seed: |
      fn main() {
          let longest_name: &str;
          {
              let names = vec![
                  String::from("Ferris"),
                  String::from("Corro the Unsafe"),
                  String::from("Ana"),
              ];
              let mut best: &str = &names[0];
              for n in &names {
                  if n.len() > best.len() {
                      best = n;
                  }
              }
              longest_name = best;
          }
          println!("Longest: {longest_name}");
      }
    solution: |
      fn main() {
          let names = vec![
              String::from("Ferris"),
              String::from("Corro the Unsafe"),
              String::from("Ana"),
          ];
          let longest_name: &str;
          {
              let mut best: &str = &names[0];
              for n in &names {
                  if n.len() > best.len() {
                      best = n;
                  }
              }
              longest_name = best;
          }
          println!("Longest: {longest_name}");
      }
    forbid:
      - pattern: '\.clone\(\)|\.to_string\(\)|\.to_owned\(\)|String::from\(\s*(best|longest_name)'
        message: "Fix it by making `names` live long enough, not by copying the string."
    hints:
      - "Read the error's labels: `names` is dropped at the `}` of the inner block, but `longest_name` is used after it."
      - "Move the whole `let names = vec![...];` statement above the inner block, into `main`'s own scope."
    tests:
      - expect: "Longest: Corro the Unsafe"
    more:
      - task: |
          This program tries to keep references to labels that are created inside the loop, so each `label` is dropped at the end of its round. Fix it the third way, by **owning** the data: make `picks` a `Vec<String>` and push the labels themselves. It should print `["round 1", "round 2", "round 3"]`.
        seed: |
          fn main() {
              let mut picks: Vec<&str> = Vec::new();
              for round in 1..=3 {
                  let label = format!("round {round}");
                  picks.push(&label);
              }
              println!("{:?}", picks);
          }
        solution: |
          fn main() {
              let mut picks: Vec<String> = Vec::new();
              for round in 1..=3 {
                  let label = format!("round {round}");
                  picks.push(label);
              }
              println!("{:?}", picks);
          }
        require:
          - pattern: 'Vec<String>'
            message: "Make `picks` a `Vec<String>` so it owns the labels."
        hints:
          - "Each `label` lives for one round of the loop only, so a `&label` can't be kept."
          - "Change the type to `Vec<String>` and push `label` itself (moving it into the vector)."
        tests:
          - expect: "[\"round 1\", \"round 2\", \"round 3\"]"
      - task: |
          Borrowing works great when the data lives long enough. Read **all** of stdin into one `String`, then find the longest line as a `&str` that borrows from that `String` (no copying). Count length in characters (`.chars().count()`); on a tie, keep the first. Print:

          ```
          longest: <line> (<n> chars)
          ```

          For empty input, print `longest:  (0 chars)` (an empty line between the two spaces).
        seed: |
          use std::io::Read;

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              // Find the longest line as a &str borrowed from input
          }
        solution: |
          use std::io::Read;

          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let mut longest: &str = "";
              for line in input.lines() {
                  if line.chars().count() > longest.chars().count() {
                      longest = line;
                  }
              }
              println!("longest: {} ({} chars)", longest, longest.chars().count());
          }
        forbid:
          - pattern: '\.clone\(\)|\.to_string\(\)|\.to_owned\(\)|String::from'
            message: "Keep the longest line as a `&str` that borrows from `input`; no copies needed."
        hints:
          - "Start with `let mut longest: &str = \"\";` and loop over `input.lines()`: each line is a `&str` borrowed from `input`."
          - "`input` lives until the end of `main`, so `longest` can borrow from it for as long as you need."
        tests:
          - stdin: "short\na much longer line\nmid\n"
            expect: "longest: a much longer line (18 chars)"
          - stdin: "héllo\nabcd\n"
          - stdin: "tie1\ntie2\nab\n"
            hidden: true
          - stdin: ""
            hidden: true

  - title: Lifetime annotations on functions
    id: lifetimes-2
    text: |
      Inside one function, the borrow checker sees everything and needs no help. Between functions it's different: when it checks a call, it looks only at the called function's **signature**, never its body. So when a function returns a reference, the signature has to say **which input the result borrows from**.

      ```rust compile_fail
      fn longest(a: &str, b: &str) -> &str {
          if a.len() >= b.len() { a } else { b }
      }

      fn main() {
          println!("{}", longest("ferris", "crab"));
      }
      ```

      ```error
      error[E0106]: missing lifetime specifier
       --> src/main.rs:1:33
        |
      1 | fn longest(a: &str, b: &str) -> &str {
        |               ----     ----     ^ expected named lifetime parameter
        |
        = help: this function's return type contains a borrowed value, but the signature does not say whether it is borrowed from `a` or `b`
      help: consider introducing a named lifetime parameter
        |
      1 | fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
      ```

      The help line already has the answer. A **lifetime annotation** is a name that starts with an apostrophe, usually `'a`. You declare it in `<>` after the function name, like a generic type parameter, and write it after the `&`:

      ```rust run
      fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn main() {
          let title = String::from("Rustacean Station");
          {
              let other = String::from("Crab Talk");
              let result = longest(&title, &other);
              println!("{result}");
          }
      }
      ```

      ```output
      Rustacean Station
      ```

      Read `fn longest<'a>(a: &'a str, b: &'a str) -> &'a str` as: "there's some stretch of code `'a` during which both `a` and `b` are valid; the result is valid during that stretch too". At a call, the compiler picks `'a` as the **overlap** of the two arguments' lifetimes. So the result may be used only while **both** inputs are alive.

      That's why this doesn't compile, even though the result would actually be `title`:

      ```rust compile_fail
      fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn main() {
          let title = String::from("Rustacean Station");
          let result;
          {
              let other = String::from("Crab Talk");
              result = longest(&title, &other);
          }
          println!("{result}");
      }
      ```

      ```error
      error[E0597]: `other` does not live long enough
      ```

      The compiler goes by the signature, not by which branch runs: the result **might** be `other`, and `other` is dropped at the `}`.

      ### Tie the result only to what it really borrows from

      If the result comes from just one parameter, put `'a` only on that one. The other parameter gets its own, separate lifetime (you can leave it unwritten):

      ```rust run
      fn after_prefix<'a>(line: &'a str, prefix: &str) -> &'a str {
          if line.starts_with(prefix) {
              &line[prefix.len()..]
          } else {
              line
          }
      }

      fn main() {
          let log = String::from("ERROR: disk full");
          let msg;
          {
              let prefix = String::from("ERROR: ");
              msg = after_prefix(&log, &prefix);
          }
          println!("{msg}");
      }
      ```

      ```output
      disk full
      ```

      Here `prefix` may be dropped early, because the signature promises the result borrows from `line` only. If the body then tried to return `prefix`, the compiler would refuse with ``error[E0621]: explicit lifetime required in the type of `prefix` ``: the body must keep the signature's promise.

      ### Common mistakes

      - **Thinking `'a` makes something live longer.** Annotations only *describe* relationships so the compiler can check them. If the data really is dropped too early, no annotation fixes it; move the data or own it.
      - **Tying every parameter to `'a` out of habit.** It works inside the function but makes callers' lives harder (like `longest` above). Tie the output only to the inputs it can come from.
      - **Annotating a function that doesn't return a reference.** `fn count(a: &str, b: &str) -> usize` needs no lifetimes at all; there's nothing to describe.

      **Your turn:** two players finish a game. Make `winner` compile by adding lifetime annotations, and write its body: it returns the name with the higher score (on a tie, `name_a`). The result can come from either name.
    seed: |
      fn winner(name_a: &str, score_a: u32, name_b: &str, score_b: u32) -> &str {
          todo!()
      }
    solution: |
      fn winner<'a>(name_a: &'a str, score_a: u32, name_b: &'a str, score_b: u32) -> &'a str {
          if score_b > score_a { name_b } else { name_a }
      }
    harness: |
      #[test]
      fn the_higher_score_wins() {
          assert_eq!(winner("ana", 10, "bo", 25), "bo", "winner(\"ana\", 10, \"bo\", 25)");
          assert_eq!(winner("ana", 30, "bo", 25), "ana", "winner(\"ana\", 30, \"bo\", 25)");
      }

      #[test]
      fn a_tie_goes_to_the_first_player() {
          assert_eq!(winner("ana", 7, "bo", 7), "ana", "winner(\"ana\", 7, \"bo\", 7)");
      }

      #[test]
      fn works_with_borrowed_strings() {
          let a = String::from("Ferris");
          let b = String::from("Corro");
          let w = winner(&a, 1, &b, 2);
          assert_eq!(w, "Corro", "winner(Ferris 1, Corro 2)");
      }
    hints:
      - "Declare the lifetime after the name: `fn winner<'a>(...)`."
      - "Both names can be returned, so both get `'a`, and so does the result: `name_a: &'a str`, `name_b: &'a str`, `-> &'a str`."
    more:
      - task: |
          Write `pick` with lifetime annotations: it returns the item at `index` as a `&str`, or `fallback` if the index is out of range. Both `items` and `fallback` can end up as the result.
        seed: |
          fn pick(items: &[String], index: usize, fallback: &str) -> &str {
              todo!()
          }
        solution: |
          fn pick<'a>(items: &'a [String], index: usize, fallback: &'a str) -> &'a str {
              match items.get(index) {
                  Some(item) => item,
                  None => fallback,
              }
          }
        harness: |
          fn menu() -> Vec<String> {
              vec![String::from("soup"), String::from("salad"), String::from("pie")]
          }

          #[test]
          fn picks_an_item_in_range() {
              let m = menu();
              assert_eq!(pick(&m, 1, "nothing"), "salad", "pick(menu, 1)");
          }

          #[test]
          fn uses_the_fallback_out_of_range() {
              let m = menu();
              assert_eq!(pick(&m, 3, "nothing"), "nothing", "pick(menu, 3)");
          }

          #[test]
          fn an_empty_list_gives_the_fallback() {
              assert_eq!(pick(&[], 0, "empty"), "empty", "pick(&[], 0)");
          }
        hints:
          - "Both `items` and `fallback` can be returned, so both get `'a`: `items: &'a [String]`, `fallback: &'a str`."
          - "`match items.get(index) { Some(item) => item, None => fallback }`: a `&String` turns into a `&str` automatically."
      - task: |
          Write `trim_comment`: it returns the part of `line` before the first `marker`, with trailing spaces removed, or the whole `line` if there's no marker. For example, `trim_comment("x = 5 # set x", "#")` is `"x = 5"`.

          The result only ever borrows from `line`, so tie it **only** to `line`. One hidden test drops the `marker` string before using the result, which compiles only if the signature says the result doesn't depend on `marker`.
        seed: |
          fn trim_comment(line: &str, marker: &str) -> &str {
              todo!()
          }
        solution: |
          fn trim_comment<'a>(line: &'a str, marker: &str) -> &'a str {
              match line.find(marker) {
                  Some(i) => line[..i].trim_end(),
                  None => line,
              }
          }
        harness: |
          #[test]
          fn removes_a_hash_comment() {
              assert_eq!(trim_comment("x = 5 # set x", "#"), "x = 5", "trim_comment(\"x = 5 # set x\", \"#\")");
          }

          #[test]
          fn keeps_a_line_without_a_comment() {
              assert_eq!(trim_comment("y = 2", "//"), "y = 2", "trim_comment(\"y = 2\", \"//\")");
          }

          #[test]
          fn a_whole_line_comment_leaves_nothing() {
              assert_eq!(trim_comment("// todo", "//"), "", "trim_comment(\"// todo\", \"//\")");
          }

          #[test]
          fn the_marker_can_be_dropped_early() {
              let line = String::from("speed = 9 ; fast");
              let code;
              {
                  let marker = String::from(";");
                  code = trim_comment(&line, &marker);
              }
              assert_eq!(code, "speed = 9", "result used after the marker was dropped");
          }
        hints:
          - "Only `line` gets the lifetime: `fn trim_comment<'a>(line: &'a str, marker: &str) -> &'a str`."
          - "`line.find(marker)` gives `Some(index)` of the marker; return `line[..i].trim_end()` in that case, else `line`."

  - title: The elision rules
    id: lifetimes-3
    text: |
      You've written functions like `fn first_word(s: &str) -> &str` since the slices module, with no `'a` anywhere. That works because of **lifetime elision**: a few rules the compiler applies to fill in lifetimes for the common cases. Only when the rules don't settle the question do you get `E0106` and have to write them yourself.

      **Rule 1.** Each reference parameter gets its own lifetime.
      `fn f(a: &str, b: &str)` means `fn f<'a, 'b>(a: &'a str, b: &'b str)`.

      **Rule 2.** If there is exactly **one** input lifetime, every reference in the output gets it.
      `fn first_word(s: &str) -> &str` means `fn first_word<'a>(s: &'a str) -> &'a str`.

      **Rule 3.** If there's `&self` or `&mut self`, every reference in the output gets **self's** lifetime.
      `fn name(&self) -> &str` means `fn name<'a>(&'a self) -> &'a str`.

      | You write | After elision | |
      |---|---|---|
      | `fn len(s: &str) -> usize` | `fn len<'a>(s: &'a str) -> usize` | no output reference: nothing to decide |
      | `fn first(v: &[i32]) -> &i32` | `fn first<'a>(v: &'a [i32]) -> &'a i32` | rule 2 |
      | `fn get(&self, key: &str) -> &str` | output borrows from `self` | rule 3 |
      | `fn longest(a: &str, b: &str) -> &str` | two inputs, no `self` | E0106: you decide |
      | `fn make() -> &str` | no inputs at all | E0106: return owned data (or `'static`, step 5) |

      Rule 3 is what makes getters work:

      ```rust run
      struct Inventory {
          items: Vec<String>,
      }

      impl Inventory {
          fn find(&self, prefix: &str) -> Option<&str> {
              for item in &self.items {
                  if item.starts_with(prefix) {
                      return Some(item);
                  }
              }
              None
          }
      }

      fn main() {
          let inv = Inventory { items: vec![String::from("sword"), String::from("shield")] };
          println!("{:?}", inv.find("sh"));
          println!("{:?}", inv.find("bow"));
      }
      ```

      ```output
      Some("shield")
      None
      ```

      `find` has two references in (`self` and `prefix`), but rule 3 gives the result `self`'s lifetime, which is exactly right: the item comes from the inventory, and `prefix` can be a short-lived string.

      ### When rule 3 guesses wrong

      Rule 3 assumes a method's result borrows from `self`. If it can come from another argument, the guess is wrong and the compiler tells you:

      ```rust compile_fail
      struct Config {
          default_label: String,
      }

      impl Config {
          fn label_for(&self, custom: &str) -> &str {
              if custom.is_empty() { &self.default_label } else { custom }
          }
      }

      fn main() {
          let c = Config { default_label: String::from("untitled") };
          println!("{}", c.label_for(""));
      }
      ```

      ```error
      error: lifetime may not live long enough
       --> src/main.rs:7:61
        |
      6 |     fn label_for(&self, custom: &str) -> &str {
        |                  -              - let's call the lifetime of this reference `'1`
        |                  |
        |                  let's call the lifetime of this reference `'2`
      7 |         if custom.is_empty() { &self.default_label } else { custom }
        |                                                             ^^^^^^ method was supposed to return data with lifetime `'2` but it is returning data with lifetime `'1`
      ```

      The compiler names the two elided lifetimes `'1` and `'2` to explain: the signature (via rule 3) promised data living as long as `self` (`'2`), but `custom` lives for `'1`. Since this result can come from either, both need the same name: `fn label_for<'a>(&'a self, custom: &'a str) -> &'a str`.

      ### The anonymous lifetime `'_`

      Sometimes a type has a lifetime parameter but you don't need to name it. Write `'_`, "some lifetime, figured out by elision". You've seen it in `fmt::Formatter<'_>`, and you'll use it for structs with references in the next step.

      ### Common mistakes

      - **Expecting the compiler to look at the body.** `fn pick(a: &str, b: &str) -> &str` needs annotations even if the body only ever returns `a`: elision works from the signature alone. Write `fn pick<'a>(a: &'a str, b: &str) -> &'a str` to say so.
      - **Trusting rule 3 for every method.** It's right for getters, wrong when the result can come from another argument (the `label_for` error above).
      - **Annotating everything.** See the note below.

      ### Workplace note

      Don't write lifetimes the rules already cover. Clippy's `needless_lifetimes` lint flags `fn first<'a>(v: &'a [i32]) -> &'a i32` and suggests the shorter form. Real Rust code has far fewer `'a`s than beginners expect.

      **Your turn:** this file has four functions and only some of them need lifetime annotations. Add annotations **only** where elision can't decide (the compiler's E0106 errors tell you which), and leave the others unannotated.
    seed: |
      struct Catalog {
          titles: Vec<String>,
      }

      impl Catalog {
          fn title_of(&self, id: usize) -> &str {
              &self.titles[id]
          }
      }

      fn file_extension(path: &str) -> &str {
          match path.rfind('.') {
              Some(i) => &path[i + 1..],
              None => "",
          }
      }

      fn shorter(a: &str, b: &str) -> &str {
          if b.len() < a.len() { b } else { a }
      }

      fn non_empty_or(value: &str, fallback: &str) -> &str {
          if value.is_empty() { fallback } else { value }
      }
    solution: |
      struct Catalog {
          titles: Vec<String>,
      }

      impl Catalog {
          fn title_of(&self, id: usize) -> &str {
              &self.titles[id]
          }
      }

      fn file_extension(path: &str) -> &str {
          match path.rfind('.') {
              Some(i) => &path[i + 1..],
              None => "",
          }
      }

      fn shorter<'a>(a: &'a str, b: &'a str) -> &'a str {
          if b.len() < a.len() { b } else { a }
      }

      fn non_empty_or<'a>(value: &'a str, fallback: &'a str) -> &'a str {
          if value.is_empty() { fallback } else { value }
      }
    forbid:
      - pattern: 'fn\s+(title_of|file_extension)\s*<'
        message: "Elision already handles `title_of` (rule 3) and `file_extension` (rule 2): leave them unannotated."
      - pattern: "'static"
        message: "`'static` would be wrong here: the results borrow from the arguments."
    harness: |
      #[test]
      fn title_of_borrows_from_the_catalog() {
          let c = Catalog { titles: vec![String::from("Dune"), String::from("Emma")] };
          assert_eq!(c.title_of(1), "Emma", "title_of(1)");
      }

      #[test]
      fn file_extension_finds_the_last_dot() {
          assert_eq!(file_extension("photo.jpeg"), "jpeg", "file_extension(\"photo.jpeg\")");
          assert_eq!(file_extension("backup.tar.gz"), "gz", "file_extension(\"backup.tar.gz\")");
          assert_eq!(file_extension("README"), "", "file_extension(\"README\")");
      }

      #[test]
      fn shorter_returns_the_shorter_string() {
          assert_eq!(shorter("abc", "de"), "de", "shorter(\"abc\", \"de\")");
          assert_eq!(shorter("ab", "cd"), "ab", "shorter(\"ab\", \"cd\")");
