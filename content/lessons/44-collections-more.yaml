      - task: |
          Write a job scheduler. Standard input has one job per line: a name and a priority from 1 to 9, like `deploy 9`. Process the jobs highest priority first; jobs with the **same** priority run in the order they were submitted. Print one line per job:

          ```
          1. deploy (p9)
          2. backup (p5)
          ```

          Use a `BinaryHeap`. The trick for "first submitted first" is the one from the emergency room: push `(priority, Reverse(line_number), name)`. Skip blank lines.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
              }
          }
        solution: |
          use std::cmp::Reverse;
          use std::collections::BinaryHeap;
          use std::io::{self, BufRead};

          fn main() {
              let mut heap = BinaryHeap::new();
              for (n, line) in io::stdin().lock().lines().enumerate() {
                  let line = line.expect("read error");
                  let mut parts = line.split_whitespace();
                  if let (Some(name), Some(p)) = (parts.next(), parts.next()) {
                      let priority: u8 = p.parse().expect("priority must be a number");
                      heap.push((priority, Reverse(n), name.to_string()));
                  }
              }
              let mut rank = 1;
              while let Some((priority, _, name)) = heap.pop() {
                  println!("{rank}. {name} (p{priority})");
                  rank += 1;
              }
          }
        require:
