          - "Push `(priority, Reverse(n), name.to_string())`. Tuples compare left to right, so priority wins and `Reverse(n)` breaks ties in favor of the earlier line."
          - "Pop in a loop and print with a counter: `println!(\"{rank}. {name} (p{priority})\")`."
