      - task: |
          The radio station's playlist is a `LinkedList<String>`. The DJ wants to move the last `k` songs to the front, keeping their order: with `[a, b, c, d, e]` and `k = 2` the list becomes `[d, e, a, b, c]`.

          Write `fn move_last_to_front(list: &mut LinkedList<String>, k: usize)` with `split_off` and `append` (no copying of songs). If `k` is 0 or at least the list's length, leave the list as it is.
        seed: |
          use std::collections::LinkedList;

          fn move_last_to_front(list: &mut LinkedList<String>, k: usize) {
              todo!()
          }
        solution: |
          use std::collections::LinkedList;

          fn move_last_to_front(list: &mut LinkedList<String>, k: usize) {
              if k == 0 || k >= list.len() {
                  return;
              }
              let mut tail = list.split_off(list.len() - k);
              tail.append(list);
              *list = tail;
          }
        require:
          - pattern: 'split_off'
            message: Cut the last k songs off with `split_off`.
          - pattern: 'append'
            message: Join the two parts with `append`.
        harness: |
          fn playlist(songs: &[&str]) -> LinkedList<String> {
              songs.iter().map(|s| s.to_string()).collect()
          }

          fn names(list: &LinkedList<String>) -> Vec<&str> {
              list.iter().map(|s| s.as_str()).collect()
          }

          #[test]
          fn moves_the_last_two_songs_to_the_front() {
              let mut list = playlist(&["a", "b", "c", "d", "e"]);
              move_last_to_front(&mut list, 2);
              assert_eq!(names(&list), vec!["d", "e", "a", "b", "c"], "move_last_to_front([a, b, c, d, e], 2)");
          }

          #[test]
          fn moves_a_single_song() {
              let mut list = playlist(&["a", "b", "c"]);
              move_last_to_front(&mut list, 1);
              assert_eq!(names(&list), vec!["c", "a", "b"], "move_last_to_front([a, b, c], 1)");
          }

          #[test]
          fn zero_leaves_the_list_alone() {
              let mut list = playlist(&["a", "b", "c"]);
              move_last_to_front(&mut list, 0);
              assert_eq!(names(&list), vec!["a", "b", "c"], "move_last_to_front([a, b, c], 0)");
          }

          #[test]
          fn k_too_large_leaves_the_list_alone() {
              let mut list = playlist(&["a", "b", "c"]);
              move_last_to_front(&mut list, 3);
              assert_eq!(names(&list), vec!["a", "b", "c"], "move_last_to_front([a, b, c], 3)");
              move_last_to_front(&mut list, 9);
              assert_eq!(names(&list), vec!["a", "b", "c"], "move_last_to_front([a, b, c], 9)");
          }

          #[test]
          fn handles_an_empty_playlist() {
              let mut list = playlist(&[]);
              move_last_to_front(&mut list, 2);
              assert_eq!(list.len(), 0, "move_last_to_front([], 2) length");
          }
        hints:
          - "`list.split_off(list.len() - k)` leaves the first part in `list` and returns the last `k` songs as a new list."
          - "`tail.append(list)` moves everything from `list` onto the end of `tail` (and leaves `list` empty)."
