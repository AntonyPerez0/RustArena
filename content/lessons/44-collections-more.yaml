        solution: |
          use std::collections::{BTreeMap, HashMap};

          struct LruCache {
              capacity: usize,
              tick: u64,
              entries: HashMap<String, (i32, u64)>,
              by_age: BTreeMap<u64, String>,
          }

          impl LruCache {
              fn new(capacity: usize) -> Self {
                  LruCache { capacity, tick: 0, entries: HashMap::new(), by_age: BTreeMap::new() }
              }

              fn get(&mut self, key: &str) -> Option<i32> {
                  let (value, used) = self.entries.get_mut(key)?;
                  self.by_age.remove(&*used);
                  self.tick += 1;
                  *used = self.tick;
                  self.by_age.insert(self.tick, key.to_string());
                  Some(*value)
              }

              fn put(&mut self, key: &str, value: i32) {
                  self.tick += 1;
                  if let Some((old_value, used)) = self.entries.get_mut(key) {
                      self.by_age.remove(&*used);
                      *old_value = value;
                      *used = self.tick;
                  } else {
                      self.entries.insert(key.to_string(), (value, self.tick));
                      if self.entries.len() > self.capacity {
                          if let Some((_, oldest)) = self.by_age.pop_first() {
                              self.entries.remove(&oldest);
                          }
                      }
                  }
                  self.by_age.insert(self.tick, key.to_string());
              }
          }
        harness: |
          #[test]
          fn returns_stored_values() {
              let mut c = LruCache::new(2);
              c.put("a", 1);
              c.put("b", 2);
              assert_eq!(c.get("a"), Some(1), "get(a)");
              assert_eq!(c.get("b"), Some(2), "get(b)");
              assert_eq!(c.get("zzz"), None, "get(zzz)");
          }

          #[test]
          fn evicts_the_least_recently_used_key() {
              let mut c = LruCache::new(2);
              c.put("a", 1);
              c.put("b", 2);
              c.put("c", 3);
              assert_eq!(c.get("a"), None, "get(a) after a, b, c with capacity 2");
              assert_eq!(c.get("c"), Some(3), "get(c)");
          }

          #[test]
          fn a_get_makes_a_key_recent() {
              let mut c = LruCache::new(2);
              c.put("a", 1);
              c.put("b", 2);
              c.get("a");
              c.put("c", 3);
              assert_eq!(c.get("b"), None, "get(b): b was the least recently used");
              assert_eq!(c.get("a"), Some(1), "get(a)");
          }

          #[test]
          fn put_updates_an_existing_key_without_evicting() {
              let mut c = LruCache::new(2);
              c.put("a", 1);
              c.put("b", 2);
              c.put("a", 10);
              assert_eq!(c.get("a"), Some(10), "get(a) after updating it");
              assert_eq!(c.get("b"), Some(2), "get(b) is still there");
          }

          #[test]
          fn handles_60000_puts_and_gets_quickly() {
              let mut c = LruCache::new(5_000);
              c.put("hot", -1);
              for i in 0..60_000 {
                  c.put(&i.to_string(), i);
                  assert_eq!(c.get("hot"), Some(-1), "the hot key stays cached at step {i}");
              }
              assert_eq!(c.get("59999"), Some(59_999), "get(59999)");
              assert_eq!(c.get("55001"), Some(55_001), "get(55001)");
              assert_eq!(c.get("55000"), None, "get(55000) was evicted");
          }
        hints:
          - "In `get`: `let (value, used) = self.entries.get_mut(key)?;` then remove the old time from `by_age`, bump `self.tick`, store it in `*used` and insert `(self.tick, key.to_string())` into `by_age`."
          - "In `put` for an existing key, do the same as `get` and also overwrite the value. For a new key, insert it, and if `entries.len() > capacity`, evict."
          - "Evicting: `if let Some((_, oldest)) = self.by_age.pop_first() { self.entries.remove(&oldest); }`. Insert the new key's time into `by_age` after evicting, so you never evict the key you just added."
