      - task: |
          Marketing wants a page report from the web server's access log. Each line of standard input is `PAGE USER`, like `/home ana`. For every page, in alphabetical order, print how many **different** users visited it and how many views it had in total:

          ```
          /cart: 1 visitors, 1 views
          /home: 2 visitors, 3 views
          ```

          Pick collections that make this easy: a `BTreeMap` from page to a pair of a `HashSet` of users and a view count. Skip blank lines.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
              }
          }
        solution: |
          use std::collections::{BTreeMap, HashSet};
          use std::io::{self, BufRead};

          fn main() {
              let mut pages: BTreeMap<String, (HashSet<String>, u32)> = BTreeMap::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
                  let mut parts = line.split_whitespace();
                  if let (Some(page), Some(user)) = (parts.next(), parts.next()) {
                      let entry = pages.entry(page.to_string()).or_default();
                      entry.0.insert(user.to_string());
                      entry.1 += 1;
                  }
              }
              for (page, (users, views)) in &pages {
                  println!("{page}: {} visitors, {views} views", users.len());
              }
          }
