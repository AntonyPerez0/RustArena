      - task: |
          A hotel front desk wants the free room whose number is **closest** to the one a guest asks for (some guests want to be near friends). Write `fn nearest_room(free: &BTreeSet<u32>, wanted: u32) -> Option<u32>`: return the free room with the smallest distance to `wanted`; on a tie, the lower number. `None` if no room is free.

          Look at just two candidates: the floor (largest free room `<= wanted`) and the ceiling (smallest free room `>= wanted`). The tests make 100,000 requests against 100,000 rooms, so don't scan the set.
        seed: |
          use std::collections::BTreeSet;

          fn nearest_room(free: &BTreeSet<u32>, wanted: u32) -> Option<u32> {
              todo!()
          }
        solution: |
          use std::collections::BTreeSet;

          fn nearest_room(free: &BTreeSet<u32>, wanted: u32) -> Option<u32> {
              let below = free.range(..=wanted).next_back().copied();
              let above = free.range(wanted..).next().copied();
              match (below, above) {
                  (Some(b), Some(a)) => {
                      if wanted - b <= a - wanted { Some(b) } else { Some(a) }
                  }
                  (Some(b), None) => Some(b),
                  (None, above) => above,
              }
          }
        harness: |
          #[test]
          fn returns_the_room_itself_when_free() {
              let free = BTreeSet::from([101, 105, 110]);
              assert_eq!(nearest_room(&free, 105), Some(105), "nearest_room({{101, 105, 110}}, 105)");
          }

          #[test]
          fn picks_the_closer_neighbor() {
              let free = BTreeSet::from([101, 105, 110]);
              assert_eq!(nearest_room(&free, 108), Some(110), "nearest_room({{101, 105, 110}}, 108)");
              assert_eq!(nearest_room(&free, 102), Some(101), "nearest_room({{101, 105, 110}}, 102)");
          }

          #[test]
          fn breaks_ties_with_the_lower_number() {
              let free = BTreeSet::from([200, 210]);
              assert_eq!(nearest_room(&free, 205), Some(200), "nearest_room({{200, 210}}, 205)");
          }

          #[test]
          fn works_beyond_both_ends() {
              let free = BTreeSet::from([300, 310]);
              assert_eq!(nearest_room(&free, 5), Some(300), "nearest_room({{300, 310}}, 5)");
              assert_eq!(nearest_room(&free, 999), Some(310), "nearest_room({{300, 310}}, 999)");
          }

          #[test]
          fn no_free_rooms_gives_none() {
              assert_eq!(nearest_room(&BTreeSet::new(), 100), None, "nearest_room({{}}, 100)");
          }

          #[test]
          fn answers_100000_requests_quickly() {
              let free: BTreeSet<u32> = (0..100_000u32).map(|i| i * 4).collect();
              let mut total: u64 = 0;
              for q in 0..100_000u32 {
                  total += nearest_room(&free, q * 4 + 1).unwrap() as u64;
              }
              assert_eq!(total, 19_999_800_000, "sum of 100,000 answers");
          }
        hints:
          - "`free.range(..=wanted).next_back()` is the closest room at or below; `free.range(wanted..).next()` the closest at or above. Add `.copied()` to get `Option<u32>`."
          - "`match (below, above)`: when both exist, compare `wanted - b` with `a - wanted` (use `<=` so ties go to the lower room)."
          - "When only one exists, return it; when neither does, `None`."

  - title: LinkedList, and why it's rare
    id: collections-more-5
    text: |
      The standard library also has `std::collections::LinkedList<T>`, a **doubly linked list**. Each element lives in its own heap allocation, a **node**, which holds the value and pointers to the previous and next nodes.

      What that buys you:

      - `push_front`, `push_back`, `pop_front`, `pop_back`: O(1), like VecDeque.
      - `append(&mut other)`: moves *all* of another list onto the end in O(1), by relinking two pointers. Nothing is copied.
      - `split_off(at)`: cuts the list in two (O(n) to walk to the cut point).

      What it costs:

      - **No indexing.** Getting the i-th element means walking i nodes: O(n).
      - **One allocation per element**, plus two pointers of overhead each.
      - **Poor cache use.** The CPU reads memory in chunks; a Vec's items sit side by side, so one read brings in many of them. A list's nodes are scattered around the heap, so walking it is a chain of slow memory reads. In practice, iterating a Vec is many times faster than iterating a list of the same length.

      ```rust run
      use std::collections::LinkedList;

      fn main() {
          let mut playlist: LinkedList<&str> = LinkedList::new();
          playlist.push_back("Intro");
          playlist.push_back("Verse");
          playlist.push_front("Countdown");

          let mut encore = LinkedList::from(["Chorus", "Outro"]);
          playlist.append(&mut encore); // O(1): relinks, copies nothing

          println!("{:?}", playlist);
          println!("encore is now empty: {}", encore.is_empty());
          println!("third: {:?}", playlist.iter().nth(2));
          let tail = playlist.split_off(3);
          println!("{:?} | {:?}", playlist, tail);
      }
      ```

      ```output
      ["Countdown", "Intro", "Verse", "Chorus", "Outro"]
      encore is now empty: true
      third: Some("Verse")
      ["Countdown", "Intro", "Verse"] | ["Chorus", "Outro"]
      ```

      There's no `playlist[2]`; the compiler refuses it:

      ```rust compile_fail
      use std::collections::LinkedList;

      fn main() {
          let list: LinkedList<i32> = LinkedList::from([1, 2, 3]);
          println!("{}", list[1]);
      }
      ```

      ```error
      error[E0608]: cannot index into a value of type `LinkedList<i32>`
      ```

      ### Why you'll rarely use it

      The standard library's own documentation says it's almost always better to use `Vec` or `VecDeque`. The usual textbook argument for linked lists is "O(1) insert and remove in the middle", but that needs a pointer to the spot first, and std's `LinkedList` can't even remove from the middle on stable Rust (its cursor API is still unstable). Finding the spot is O(n) anyway, and Vec's `insert` (a fast memory move) usually beats walking a list to get there.

      In a code review, a `LinkedList` usually gets the comment "use `VecDeque`". It's worth knowing it exists, what `append` costs, and why it loses. Writing your *own* linked structures (with `Option<Box<Node>>`) is a different story: that's how trees work, and you'll build one in the graphs module.

      ### Common mistakes

      - **Reaching for LinkedList for a queue.** VecDeque does the same O(1) operations at both ends, faster.
      - **`list.iter().nth(i)` in a loop.** Each call walks from the front: a loop over all positions is O(n²).
      - **Forgetting that `append` empties the other list.** It takes `&mut other` and moves the nodes out of it.

      **Your turn:** fill in the blanks with the right `LinkedList` methods so the bus route program prints:

      ```
      ["Garage", "Depot", "Market St", "Harbor", "Airport"]
      Some("Garage")
      4
      ```
    fill: |
      use std::collections::LinkedList;

      fn main() {
          let mut route: LinkedList<&str> = LinkedList::new();
          route.[[push_back]]("Depot");
          route.push_back("Market St");
          route.[[push_front]]("Garage");
          let mut extra = LinkedList::from(["Harbor", "Airport"]);
          route.[[append]](&mut extra);
          println!("{:?}", route);
          println!("{:?}", route.[[pop_front]]());
          println!("{}", route.[[len]]());
      }
    hints:
      - "\"Depot\" goes at the end, \"Garage\" at the very front."
      - "Moving every node of `extra` onto the end is `append`. Taking the first stop off is `pop_front`, and counting is `len`."
    tests:
      - expect: "[\"Garage\", \"Depot\", \"Market St\", \"Harbor\", \"Airport\"]\nSome(\"Garage\")\n4"
