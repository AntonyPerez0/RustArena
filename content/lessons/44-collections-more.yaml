id: collections-more
title: Stacks, Queues, Heaps and Ordered Maps
phase: "Algorithms and data structures"
summary: The rest of std::collections. Stacks with Vec, queues with VecDeque, priority queues with BinaryHeap, range queries with BTreeMap, why LinkedList is rare, and how to pick the right collection for a job.
roadmap: [Stack, Queue, VecDeque, BinaryHeap, BTreeMap, BTreeSet, LinkedList]
steps:
  - title: Stacks with Vec
    id: collections-more-1
    text: |
      A **stack** is a collection where the last item you put in is the first one you take out: **LIFO** (last in, first out). Think of a pile of plates, the undo history of an editor, or the back button of a browser. Rust has no separate `Stack` type because `Vec` already is one:

      | Stack operation | Vec method | Returns |
      |---|---|---|
      | push onto the top | `push(x)` | `()` |
      | take the top off | `pop()` | `Option<T>` (`None` when empty) |
      | look at the top | `last()` | `Option<&T>` |
      | change the top | `last_mut()` | `Option<&mut T>` |

      All of these are **O(1)**: they take the same time whether the stack holds ten items or ten million. (You'll meet this **Big-O notation** properly in the next module. For now: O(1) means "constant time", O(n) means "time grows in step with the number of items n".) They're fast because they only touch the end of the Vec; nothing else has to move.

      ```rust run
      fn main() {
          let mut undo: Vec<String> = Vec::new();
          undo.push(String::from("type 'Hello'"));
          undo.push(String::from("make bold"));
          undo.push(String::from("delete line 3"));

          println!("top: {:?}", undo.last());
          while let Some(action) = undo.pop() {
              println!("undo {action}");
          }
          println!("empty: {}", undo.is_empty());
          println!("{:?}", undo.pop());
      }
      ```

      ```output
      top: Some("delete line 3")
      undo delete line 3
      undo make bold
      undo type 'Hello'
      empty: true
      None
      ```

      - `pop` returns an `Option` because the stack might be empty. `while let Some(x) = stack.pop()` is the idiomatic "take everything off" loop: it stops by itself at `None`.
      - `last()` peeks without removing and gives a reference (`Option<&String>`); `pop()` hands you ownership of the value.

      ### When a stack is the right tool

      Whenever the most recent unfinished thing must be finished first: matching brackets, undo, evaluating expressions, walking a tree or a maze depth-first (the graphs module), and "what was the last thing bigger than this?" questions.

      Brackets are the classic. Counting open brackets works for one kind: `(()` has an unclosed `(`. With several kinds, a counter is fooled by `([)]`: two opened, two closed, yet the `)` closes a `[`. A stack remembers *which* bracket is open most recently: push every opener, and every closer must match the opener on top.

      ### Common mistakes

      - **Using the front of a Vec as the top.** `v.insert(0, x)` and `v.remove(0)` shift every other element by one place: O(n) each time. The top of a Vec stack is always its end.
      - **`stack.pop().unwrap()` on a stack that can be empty.** It panics with ``called `Option::unwrap()` on a `None` value``. Handle `None`: for brackets, a closer with nothing open means the text is unbalanced.
      - **Forgetting what's left at the end.** `((` never fails a check while you scan it; the leftovers on the stack are what make it unbalanced.

      **Your turn:** write `fn is_balanced(code: &str) -> bool` that returns `true` when every `(`, `[` and `{` in `code` is closed by the matching `)`, `]` or `}` in the right order. Ignore every other character. Use a `Vec<char>` as a stack. The tests include a text of 300,000 nested brackets, so the solution must be O(n): one pass over the characters.
    seed: |
      fn is_balanced(code: &str) -> bool {
          todo!()
      }
    solution: |
      fn is_balanced(code: &str) -> bool {
          let mut stack: Vec<char> = Vec::new();
          for c in code.chars() {
              match c {
                  '(' | '[' | '{' => stack.push(c),
                  ')' | ']' | '}' => {
                      let opener = match c {
                          ')' => '(',
                          ']' => '[',
                          _ => '{',
                      };
                      if stack.pop() != Some(opener) {
                          return false;
                      }
                  }
                  _ => {}
              }
          }
          stack.is_empty()
      }
    harness: |
      #[test]
      fn accepts_nested_brackets_of_all_kinds() {
          assert_eq!(is_balanced("fn main() { let v = vec![(1, 2)]; }"), true, "is_balanced(\"fn main() {{ let v = vec![(1, 2)]; }}\")");
      }

      #[test]
      fn accepts_text_without_brackets() {
          assert_eq!(is_balanced(""), true, "is_balanced(\"\")");
          assert_eq!(is_balanced("hello"), true, "is_balanced(\"hello\")");
      }

      #[test]
      fn rejects_brackets_closed_in_the_wrong_order() {
          assert_eq!(is_balanced("([)]"), false, "is_balanced(\"([)]\")");
      }

      #[test]
      fn rejects_brackets_left_open() {
          assert_eq!(is_balanced("(("), false, "is_balanced(\"((\")");
          assert_eq!(is_balanced("{[]"), false, "is_balanced(\"{{[]\")");
      }

      #[test]
      fn rejects_a_closer_with_nothing_open() {
          assert_eq!(is_balanced("())"), false, "is_balanced(\"())\")");
          assert_eq!(is_balanced("]"), false, "is_balanced(\"]\")");
      }

      #[test]
      fn handles_300000_nested_brackets_quickly() {
          let deep = "(".repeat(150_000) + &")".repeat(150_000);
          assert_eq!(is_balanced(&deep), true, "is_balanced(150,000 '(' then 150,000 ')')");
          let broken = "[".repeat(150_000) + &")".repeat(150_000);
          assert_eq!(is_balanced(&broken), false, "is_balanced(150,000 '[' then 150,000 ')')");
      }
    hints:
      - Push every opening bracket. When you meet a closing bracket, the top of the stack must be its partner.
      - "`stack.pop()` gives an `Option<char>`: compare it with `Some('(')` (or the right opener). An empty stack gives `None`, which never matches."
      - "After the loop, the text is balanced only if nothing is left open: `stack.is_empty()`."
    more:
      - task: |
          Write a calculator for **Reverse Polish Notation** (RPN), where the operator comes after its two operands: `3 4 +` is 7, and `5 1 2 + 4 * + 3 -` is `5 + (1 + 2) * 4 - 3` = 14. Old HP calculators and many stack-based virtual machines work this way.

          Write `fn eval_rpn(expr: &str) -> Option<i64>`. Tokens are separated by spaces. A number is pushed; an operator `+`, `-`, `*` or `/` pops the top value `b`, then the next `a`, and pushes `a op b` (so `10 3 -` is 7). Return `None` when the expression is malformed: an operator without two values, a token that isn't a number or operator, division by zero, or not exactly one value left at the end. Negative numbers like `-3` are numbers, not operators.
        seed: |
          fn eval_rpn(expr: &str) -> Option<i64> {
              todo!()
          }
        solution: |
          fn eval_rpn(expr: &str) -> Option<i64> {
              let mut stack: Vec<i64> = Vec::new();
              for token in expr.split_whitespace() {
                  match token {
                      "+" | "-" | "*" | "/" => {
                          let b = stack.pop()?;
                          let a = stack.pop()?;
                          let value = match token {
                              "+" => a + b,
                              "-" => a - b,
                              "*" => a * b,
                              _ => a.checked_div(b)?,
                          };
                          stack.push(value);
                      }
                      _ => stack.push(token.parse().ok()?),
                  }
              }
              if stack.len() == 1 { stack.pop() } else { None }
          }
        harness: |
          #[test]
          fn adds_two_numbers() {
              assert_eq!(eval_rpn("3 4 +"), Some(7), "eval_rpn(\"3 4 +\")");
          }

          #[test]
          fn evaluates_a_longer_expression() {
              assert_eq!(eval_rpn("5 1 2 + 4 * + 3 -"), Some(14), "eval_rpn(\"5 1 2 + 4 * + 3 -\")");
          }

          #[test]
          fn keeps_the_operand_order_for_minus_and_divide() {
              assert_eq!(eval_rpn("10 3 -"), Some(7), "eval_rpn(\"10 3 -\")");
              assert_eq!(eval_rpn("20 4 /"), Some(5), "eval_rpn(\"20 4 /\")");
          }

          #[test]
          fn reads_negative_numbers() {
              assert_eq!(eval_rpn("-3 2 *"), Some(-6), "eval_rpn(\"-3 2 *\")");
          }

          #[test]
          fn rejects_malformed_expressions() {
              assert_eq!(eval_rpn("+"), None, "eval_rpn(\"+\")");
              assert_eq!(eval_rpn("2 3"), None, "eval_rpn(\"2 3\")");
              assert_eq!(eval_rpn("2 x +"), None, "eval_rpn(\"2 x +\")");
              assert_eq!(eval_rpn(""), None, "eval_rpn(\"\")");
          }

          #[test]
          fn rejects_division_by_zero() {
              assert_eq!(eval_rpn("4 0 /"), None, "eval_rpn(\"4 0 /\")");
          }
        hints:
          - "Loop over `expr.split_whitespace()` and `match` on the token: `\"+\" | \"-\" | \"*\" | \"/\"` for operators, `_` for numbers."
          - "Inside a function returning `Option`, `stack.pop()?` returns `None` early when the stack is empty, and `token.parse().ok()?` does the same for a bad number."
          - "Pop `b` first, then `a`. Use `a.checked_div(b)?` so dividing by zero gives `None`. At the end, return `stack.pop()` only if `stack.len() == 1`."
      - task: |
          A weather service wants to know, for each day, how many days you have to wait for a **warmer** day. Write `fn days_until_warmer(temps: &[i32]) -> Vec<usize>`: `result[i]` is the number of days after day `i` until a strictly warmer temperature, or `0` if no warmer day comes.

          For `[73, 74, 75, 71, 69, 72, 76, 73]` the answer is `[1, 1, 4, 2, 1, 1, 0, 0]`.

          Checking every later day for every day is O(n²), and the tests include 100,000 days. Use a **monotonic stack** instead: a `Vec<usize>` of the days still waiting for a warmer day. For each new day, pop every waiting day that is colder than today (today is their answer), then push today. Each day is pushed and popped at most once, so the whole thing is O(n).
        seed: |
          fn days_until_warmer(temps: &[i32]) -> Vec<usize> {
              todo!()
          }
        solution: |
          fn days_until_warmer(temps: &[i32]) -> Vec<usize> {
              let mut answer = vec![0; temps.len()];
              let mut waiting: Vec<usize> = Vec::new();
              for (day, &t) in temps.iter().enumerate() {
                  while let Some(&prev) = waiting.last() {
                      if temps[prev] >= t {
                          break;
                      }
                      answer[prev] = day - prev;
                      waiting.pop();
                  }
                  waiting.push(day);
              }
              answer
          }
        harness: |
          #[test]
          fn solves_the_example_week() {
              assert_eq!(days_until_warmer(&[73, 74, 75, 71, 69, 72, 76, 73]), vec![1, 1, 4, 2, 1, 1, 0, 0], "days_until_warmer(&[73, 74, 75, 71, 69, 72, 76, 73])");
          }

          #[test]
          fn equal_temperatures_are_not_warmer() {
              assert_eq!(days_until_warmer(&[30, 30, 30]), vec![0, 0, 0], "days_until_warmer(&[30, 30, 30])");
          }

          #[test]
          fn handles_no_days_and_one_day() {
              assert_eq!(days_until_warmer(&[]), Vec::<usize>::new(), "days_until_warmer(&[])");
              assert_eq!(days_until_warmer(&[12]), vec![0], "days_until_warmer(&[12])");
          }

          #[test]
          fn handles_negative_temperatures() {
              assert_eq!(days_until_warmer(&[-5, -10, -3]), vec![2, 1, 0], "days_until_warmer(&[-5, -10, -3])");
          }

          #[test]
          fn handles_100000_cooling_days_quickly() {
              let mut temps: Vec<i32> = (0..99_999).map(|i| 100_000 - i).collect();
              temps.push(1_000_000);
              let answer = days_until_warmer(&temps);
              assert_eq!(answer[0], 99_999, "answer[0] for 99,999 cooling days then a hot one");
              assert_eq!(answer[50_000], 49_999, "answer[50_000]");
              assert_eq!(answer[99_999], 0, "answer for the last day");
          }
        hints:
          - "Start with `let mut answer = vec![0; temps.len()];` and an empty `Vec<usize>` of waiting days (their indices)."
          - "For each `(day, &t)` in `temps.iter().enumerate()`: while the day on top of the stack is colder than `t`, pop it and set its answer to `day - prev`."
          - "`while let Some(&prev) = waiting.last() { if temps[prev] >= t { break; } answer[prev] = day - prev; waiting.pop(); }` then `waiting.push(day);`"

  - title: Queues with VecDeque
    id: collections-more-2
    text: |
      A **queue** is **FIFO**: first in, first out, like a line at a ticket counter, jobs waiting for a printer, or messages waiting for a worker. You could build one from a Vec with `push` at the back and `remove(0)` at the front, but `remove(0)` shifts every remaining element one place left. That's O(n) per removal, so serving a queue of n people costs O(n²) in total.

      `std::collections::VecDeque` (say "vec-deck", short for **double-ended queue**) fixes that. It's a **ring buffer**: one block of memory like a Vec, but the front can start anywhere and the items wrap around the end of the block. Adding or removing at **either** end is O(1).

      | Method | What it does |
      |---|---|
      | `push_back(x)` | join at the back |
      | `pop_front()` | leave from the front: `Option<T>` |
      | `push_front(x)` | cut in at the front |
      | `pop_back()` | leave from the back: `Option<T>` |
      | `front()`, `back()` | peek: `Option<&T>` |
      | `len()`, `is_empty()`, `iter()`, `q[i]`, `get(i)`, `contains(&x)` | like Vec |

      ```rust run
      use std::collections::VecDeque;

      fn main() {
          let mut jobs: VecDeque<&str> = VecDeque::new();
          jobs.push_back("report.pdf");
          jobs.push_back("photo.png");
          jobs.push_back("invoice.pdf");
          jobs.push_front("URGENT.txt");

          println!("next up: {:?}", jobs.front());
          println!("{} jobs, third is {}", jobs.len(), jobs[2]);
          while let Some(job) = jobs.pop_front() {
              println!("printing {job}");
          }

          let numbers: VecDeque<i32> = (1..=4).collect();
          println!("{numbers:?}");
      }
      ```

      ```output
      next up: Some("URGENT.txt")
      4 jobs, third is photo.png
      printing URGENT.txt
      printing report.pdf
      printing photo.png
      printing invoice.pdf
      [1, 2, 3, 4]
      ```

      You can build one with `VecDeque::new()`, `VecDeque::from(vec![...])`, `VecDeque::from([1, 2, 3])` or `.collect()`, and `{:?}` prints it front to back like a Vec.

      ### Common mistakes

      - **Calling `pop()`.** A VecDeque has two ends, so there's no plain `pop`; you pick a side:

      ```rust compile_fail
      use std::collections::VecDeque;

      fn main() {
          let mut jobs: VecDeque<&str> = VecDeque::from(["a", "b"]);
          println!("{:?}", jobs.pop());
      }
      ```

      ```error
      error[E0599]: no method named `pop` found for struct `VecDeque<T, A>` in the current scope
      ```

      - **Mixing up the ends.** `push_back` with `pop_back` is a stack, not a queue. A queue goes in at one end and out at the other.
      - **Expecting one slice.** Because the items can wrap around, a VecDeque isn't always one contiguous slice: `&q[..]` doesn't work. Use `q.iter()`, or `q.make_contiguous()` when you really need a `&mut [T]`.
      - **`Vec::remove(0)` in a loop.** It works on small inputs and falls over on big ones. If you see it in review, suggest VecDeque.

      **Your turn:** run the food truck line. Read commands from standard input, one per line:

      - `join NAME`: NAME joins the back of the line
      - `vip NAME`: NAME goes straight to the front
      - `serve`: serve the person at the front and print `served NAME`, or print `nobody waiting` if the line is empty

      After the last command, print `still waiting: ` followed by the names front to back, separated by `, `, or `still waiting: nobody`. Use a `VecDeque<String>`.
    seed: |
      use std::collections::VecDeque;
      use std::io::{self, BufRead};

      fn main() {
          let mut line_up: VecDeque<String> = VecDeque::new();
          for line in io::stdin().lock().lines() {
              let line = line.expect("read error");
              // join NAME, vip NAME or serve
          }
          // print who is still waiting
      }
    solution: |
      use std::collections::VecDeque;
      use std::io::{self, BufRead};

      fn main() {
          let mut line_up: VecDeque<String> = VecDeque::new();
          for line in io::stdin().lock().lines() {
              let line = line.expect("read error");
              // join NAME, vip NAME or serve
              let mut parts = line.split_whitespace();
              match (parts.next(), parts.next()) {
                  (Some("join"), Some(name)) => line_up.push_back(name.to_string()),
                  (Some("vip"), Some(name)) => line_up.push_front(name.to_string()),
                  (Some("serve"), None) => match line_up.pop_front() {
                      Some(name) => println!("served {name}"),
                      None => println!("nobody waiting"),
                  },
                  _ => {}
              }
          }
          // print who is still waiting
          if line_up.is_empty() {
              println!("still waiting: nobody");
          } else {
              let names: Vec<String> = line_up.into_iter().collect();
              println!("still waiting: {}", names.join(", "));
          }
      }
    require:
      - pattern: 'push_front'
        message: A VIP goes in with `push_front`.
      - pattern: 'pop_front'
        message: Serve the front of the line with `pop_front`.
    forbid:
      - pattern: 'remove\(\s*0\s*\)'
        message: "`remove(0)` shifts every element: use `pop_front` on the VecDeque."
    hints:
      - "Split each line with `split_whitespace()` and look at the first two words: `match (parts.next(), parts.next())` with arms like `(Some(\"join\"), Some(name))`."
      - "`join` is `push_back(name.to_string())`, `vip` is `push_front(...)`, and `serve` matches on `line_up.pop_front()`."
      - "At the end, collect the names into a `Vec<String>` and print `names.join(\", \")`."
    tests:
      - stdin: "join Ana\njoin Ben\nserve\nvip Cy\nserve\njoin Dee\n"
        expect: "served Ana\nserved Cy\nstill waiting: Ben, Dee"
      - stdin: "serve\njoin Ola\nserve\nserve\n"
        hidden: true
      - stdin: "join Max\nvip Zoe\nvip Ivy\njoin Raj\n"
        hidden: true
    more:
      - task: |
          An operating system shares one CPU between tasks with **round-robin scheduling**: the task at the front of the queue runs for at most `quantum` time units; if it still needs time, it goes to the back of the queue.

          Write `fn round_robin(tasks: &[(&str, u32)], quantum: u32) -> Vec<String>` that returns the task names in the order they **finish**. Each task is `(name, time needed)`. `quantum` is at least 1. A task that needs 0 time finishes on its first turn.

          With `[("build", 5), ("lint", 2), ("test", 4)]` and quantum 2: build runs 2 (3 left, back of the queue), lint runs 2 and finishes, test runs 2 (2 left), build runs 2 (1 left), test finishes, build finishes: `["lint", "test", "build"]`.
        seed: |
          use std::collections::VecDeque;

          fn round_robin(tasks: &[(&str, u32)], quantum: u32) -> Vec<String> {
              todo!()
          }
        solution: |
          use std::collections::VecDeque;

          fn round_robin(tasks: &[(&str, u32)], quantum: u32) -> Vec<String> {
              let mut queue: VecDeque<(&str, u32)> = tasks.iter().copied().collect();
              let mut finished = Vec::new();
              while let Some((name, left)) = queue.pop_front() {
                  let run = left.min(quantum);
                  if left - run == 0 {
                      finished.push(name.to_string());
                  } else {
                      queue.push_back((name, left - run));
                  }
              }
              finished
          }
        harness: |
          #[test]
          fn finishes_tasks_in_round_robin_order() {
              assert_eq!(round_robin(&[("build", 5), ("lint", 2), ("test", 4)], 2), vec!["lint", "test", "build"], "round_robin(build 5, lint 2, test 4; quantum 2)");
          }

          #[test]
          fn a_big_quantum_keeps_the_input_order() {
              assert_eq!(round_robin(&[("a", 3), ("b", 1), ("c", 2)], 10), vec!["a", "b", "c"], "round_robin(a 3, b 1, c 2; quantum 10)");
          }

          #[test]
          fn quantum_one_interleaves_tasks() {
              assert_eq!(round_robin(&[("x", 3), ("y", 1), ("z", 2)], 1), vec!["y", "z", "x"], "round_robin(x 3, y 1, z 2; quantum 1)");
          }

          #[test]
          fn no_tasks_finish_nothing() {
              assert_eq!(round_robin(&[], 3), Vec::<String>::new(), "round_robin(&[], 3)");
          }

          #[test]
          fn zero_time_tasks_finish_on_their_first_turn() {
              assert_eq!(round_robin(&[("long", 4), ("noop", 0)], 2), vec!["noop", "long"], "round_robin(long 4, noop 0; quantum 2)");
          }
        hints:
          - "Copy the tasks into a `VecDeque<(&str, u32)>` with `tasks.iter().copied().collect()`."
          - "Loop with `while let Some((name, left)) = queue.pop_front()`. Run for `left.min(quantum)` units."
          - "If nothing is left, push `name.to_string()` onto the result; otherwise `push_back((name, left - run))`."
      - task: |
          The monitoring dashboard shows the average response time of the **last N requests**. Write a small type for it:

          ```rust
          struct RecentReadings { /* your fields */ }
          impl RecentReadings {
              fn new(capacity: usize) -> Self
              fn push(&mut self, millis: u64)   // drops the oldest reading when there are more than capacity
              fn average(&self) -> Option<f64>  // None when there are no readings yet
          }
          ```

          The dashboard calls `average()` after every reading, and the tests push 300,000 readings with a capacity of 100,000. Adding up the whole window on every call would be O(capacity) per call: far too slow. Keep a **running sum**: add the new reading, subtract the one you drop. Then `average` is O(1).
        seed: |
          use std::collections::VecDeque;

          struct RecentReadings {
              capacity: usize,
              readings: VecDeque<u64>,
              sum: u64,
          }

          impl RecentReadings {
              fn new(capacity: usize) -> Self {
                  todo!()
              }

              fn push(&mut self, millis: u64) {
                  todo!()
              }

              fn average(&self) -> Option<f64> {
                  todo!()
              }
          }
        solution: |
          use std::collections::VecDeque;

          struct RecentReadings {
              capacity: usize,
              readings: VecDeque<u64>,
              sum: u64,
          }

          impl RecentReadings {
              fn new(capacity: usize) -> Self {
                  RecentReadings { capacity, readings: VecDeque::with_capacity(capacity + 1), sum: 0 }
              }

              fn push(&mut self, millis: u64) {
                  self.readings.push_back(millis);
                  self.sum += millis;
                  if self.readings.len() > self.capacity {
                      if let Some(old) = self.readings.pop_front() {
                          self.sum -= old;
                      }
                  }
              }

              fn average(&self) -> Option<f64> {
                  if self.readings.is_empty() {
                      None
                  } else {
                      Some(self.sum as f64 / self.readings.len() as f64)
                  }
              }
          }
        harness: |
          #[test]
          fn has_no_average_before_any_reading() {
              let r = RecentReadings::new(3);
              assert_eq!(r.average(), None, "RecentReadings::new(3).average()");
          }

          #[test]
          fn averages_while_the_window_is_filling() {
              let mut r = RecentReadings::new(3);
              r.push(10);
              r.push(20);
              assert_eq!(r.average(), Some(15.0), "average after pushing 10, 20");
          }

          #[test]
          fn drops_the_oldest_reading_when_full() {
              let mut r = RecentReadings::new(3);
              for ms in [10, 20, 30, 100] {
                  r.push(ms);
              }
              assert_eq!(r.average(), Some(50.0), "average of the last 3 after pushing 10, 20, 30, 100");
          }

          #[test]
          fn a_capacity_of_one_keeps_only_the_latest() {
              let mut r = RecentReadings::new(1);
              r.push(7);
              r.push(9);
              assert_eq!(r.average(), Some(9.0), "capacity 1 after pushing 7, 9");
          }

          #[test]
          fn handles_300000_readings_quickly() {
              let mut r = RecentReadings::new(100_000);
              let mut last = None;
              for i in 0..300_000u64 {
                  r.push(i % 1000);
                  last = r.average();
              }
              assert_eq!(last, Some(499.5), "average of the last 100,000 readings");
          }
        hints:
          - "`new` stores the capacity, an empty `VecDeque` and a sum of 0."
          - "`push`: `push_back` the reading and add it to `sum`. If `len()` is now bigger than `capacity`, `pop_front` the oldest and subtract it."
          - "`average`: `None` if empty, otherwise `Some(self.sum as f64 / self.readings.len() as f64)`."

  - title: Priority queues with BinaryHeap
    id: collections-more-3
    text: |
      A **priority queue** hands out the most important item first, not the oldest one: the patient in the worst condition, the job with the highest priority, the closest unvisited city. In Rust that's `std::collections::BinaryHeap<T>`, a **max-heap**: `pop` always returns the **largest** item.

      Inside, it's a Vec arranged as a **binary heap**: a tree stored in an array where every parent is at least as large as its children. Keeping that shape after a change only walks one branch of the tree, so `push` and `pop` are **O(log n)** and `peek` is O(1). (log n grows very slowly: about 20 for a million items.)

      ```rust run
      use std::collections::BinaryHeap;

      fn main() {
          let mut heap = BinaryHeap::new();
          for severity in [3, 9, 1, 7] {
              heap.push(severity);
          }
          println!("peek: {:?}", heap.peek());
          println!("len: {}", heap.len());
          while let Some(s) = heap.pop() {
              print!("{s} ");
          }
          println!();
      }
      ```

      ```output
      peek: Some(9)
      len: 4
      9 7 3 1
      ```

      ### A min-heap with Reverse

      To get the **smallest** item first, wrap values in `std::cmp::Reverse`. `Reverse(x)` is a tiny struct whose ordering is the opposite of `x`'s, so the "largest" `Reverse` holds the smallest value. Unwrap it with `.0` or with a pattern:

      ```rust run
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;

      fn main() {
          let mut deadlines = BinaryHeap::new();
          for day in [12, 3, 30, 7] {
              deadlines.push(Reverse(day));
          }
          println!("soonest: {}", deadlines.peek().unwrap().0);
          while let Some(Reverse(day)) = deadlines.pop() {
              print!("{day} ");
          }
          println!();
      }
      ```

      ```output
      soonest: 3
      3 7 12 30
      ```

      ### Tuples as priorities

      Tuples compare field by field: first fields first, and only on a tie the second, and so on. That makes them perfect priority keys. In an emergency room, higher severity goes first, and between equal severities whoever arrived first. "Arrived first" means the *smaller* arrival number should win, so it's wrapped in `Reverse`:

      ```rust run
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;

      fn main() {
          // (severity, Reverse(arrival), case)
          let mut er = BinaryHeap::new();
          er.push((2, Reverse(1), "sprained ankle"));
          er.push((5, Reverse(2), "chest pain"));
          er.push((2, Reverse(3), "deep cut"));
          er.push((5, Reverse(4), "broken leg"));
          while let Some((severity, Reverse(arrival), case)) = er.pop() {
              println!("{severity} #{arrival} {case}");
          }
      }
      ```

      ```output
      5 #2 chest pain
      5 #4 broken leg
      2 #1 sprained ankle
      2 #3 deep cut
      ```

      A struct works too: `#[derive(PartialEq, Eq, PartialOrd, Ord)]` compares fields in the order they're declared, or you implement `Ord` yourself (module 23).

      ### Top-k with a small heap

      To keep the k largest of n values, you don't need to sort all n. Keep a **min-heap of at most k items**: push each value, and when the heap holds more than k, pop (that removes the smallest). What's left are the k largest. That's O(n log k) time and O(k) memory, and it works on a stream of data that never fits in memory at once.

      ### Common mistakes

      - **Expecting the smallest first.** `BinaryHeap` is a max-heap. Use `Reverse` for a min-heap.
      - **Printing the heap and expecting sorted order.** `{:?}` and `.iter()` show the internal array order, which is *not* sorted. Pop in a loop, or call `into_sorted_vec()` (ascending).
      - **Floats.** The items must implement `Ord`, and `f64` doesn't (because of NaN):

      ```rust compile_fail
      use std::collections::BinaryHeap;

      fn main() {
          let mut heap = BinaryHeap::new();
          heap.push(2.5_f64);
          println!("{:?}", heap.pop());
      }
      ```

      ```error
      error[E0277]: the trait bound `f64: Ord` is not satisfied
      ```

      Store integers instead (cents, milliseconds, scores times 100), or wrap the float in your own type that implements `Ord` with `total_cmp`.

      **Your turn:** write `fn top_k(scores: &[u32], k: usize) -> Vec<u32>` that returns the `k` highest scores, highest first (all of them if there are fewer than `k`). Use a `BinaryHeap<Reverse<u32>>` that never holds more than `k` items, then pop it empty and reverse. Don't sort.
    seed: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;

      fn top_k(scores: &[u32], k: usize) -> Vec<u32> {
          todo!()
      }
    solution: |
      use std::cmp::Reverse;
      use std::collections::BinaryHeap;

      fn top_k(scores: &[u32], k: usize) -> Vec<u32> {
          let mut heap = BinaryHeap::with_capacity(k + 1);
          for &s in scores {
              heap.push(Reverse(s));
              if heap.len() > k {
                  heap.pop();
              }
          }
          let mut best = Vec::with_capacity(heap.len());
          while let Some(Reverse(s)) = heap.pop() {
              best.push(s);
          }
          best.reverse();
          best
      }
    require:
      - pattern: 'BinaryHeap'
        message: Use a `BinaryHeap` for this one.
      - pattern: 'Reverse'
        message: "Wrap the scores in `Reverse` so the heap pops the smallest one."
    forbid:
      - pattern: '\.sort'
        message: Solve it with the heap, without sorting.
    hints:
      - "Push `Reverse(s)` for every score. The heap's top is then the smallest score it holds."
      - "Right after each push, `if heap.len() > k { heap.pop(); }` throws away the smallest, so the heap keeps the k largest."
      - "Pop everything into a Vec (`while let Some(Reverse(s)) = heap.pop()`): that's smallest first, so call `.reverse()` before returning."
    harness: |
      #[test]
      fn returns_the_three_best_scores_highest_first() {
          assert_eq!(top_k(&[40, 95, 12, 77, 88, 51], 3), vec![95, 88, 77], "top_k(&[40, 95, 12, 77, 88, 51], 3)");
      }

      #[test]
      fn keeps_duplicate_scores() {
          assert_eq!(top_k(&[5, 9, 9, 1, 9], 2), vec![9, 9], "top_k(&[5, 9, 9, 1, 9], 2)");
      }

      #[test]
      fn returns_everything_when_k_is_large() {
          assert_eq!(top_k(&[3, 1, 2], 10), vec![3, 2, 1], "top_k(&[3, 1, 2], 10)");
      }

      #[test]
      fn k_zero_or_no_scores_gives_nothing() {
          assert_eq!(top_k(&[3, 1, 2], 0), Vec::<u32>::new(), "top_k(&[3, 1, 2], 0)");
          assert_eq!(top_k(&[], 4), Vec::<u32>::new(), "top_k(&[], 4)");
      }

      #[test]
      fn finds_the_top_5_of_200000_scores() {
          let scores: Vec<u32> = (0..200_000u32).map(|i| i.wrapping_mul(2_654_435_761) % 1_000_000).collect();
          let mut expected = scores.clone();
          expected.sort_unstable_by(|a, b| b.cmp(a));
          expected.truncate(5);
          assert_eq!(top_k(&scores, 5), expected, "top_k(200,000 scores, 5)");
      }
    more:
      - task: |
          Several services each write a log already sorted by timestamp. Merge them into one sorted list. Write `fn merge_sorted(lists: &[Vec<i32>]) -> Vec<i32>`.

          Concatenating and sorting would work, but the classic approach uses the fact that each list is already sorted: keep a min-heap with the **next** item of each list as `Reverse((value, list_index, position))`. Pop the smallest, add it to the result, and push the following item from the same list. With N items in k lists that's O(N log k). Don't sort.
        seed: |
          use std::cmp::Reverse;
          use std::collections::BinaryHeap;

          fn merge_sorted(lists: &[Vec<i32>]) -> Vec<i32> {
              todo!()
          }
        solution: |
          use std::cmp::Reverse;
          use std::collections::BinaryHeap;

          fn merge_sorted(lists: &[Vec<i32>]) -> Vec<i32> {
              let mut heap = BinaryHeap::new();
              for (i, list) in lists.iter().enumerate() {
                  if let Some(&first) = list.first() {
                      heap.push(Reverse((first, i, 0)));
                  }
              }
              let mut merged = Vec::new();
              while let Some(Reverse((value, i, pos))) = heap.pop() {
                  merged.push(value);
                  if let Some(&next) = lists[i].get(pos + 1) {
                      heap.push(Reverse((next, i, pos + 1)));
                  }
              }
              merged
          }
        require:
          - pattern: 'BinaryHeap'
            message: Use a `BinaryHeap` holding the next item of each list.
        forbid:
          - pattern: '\.sort'
            message: The lists are already sorted; merge them with the heap instead of sorting.
        harness: |
          #[test]
          fn merges_three_sorted_lists() {
              let lists = vec![vec![1, 4, 9], vec![2, 3, 10], vec![5]];
              assert_eq!(merge_sorted(&lists), vec![1, 2, 3, 4, 5, 9, 10], "merge_sorted([[1, 4, 9], [2, 3, 10], [5]])");
          }

          #[test]
          fn skips_empty_lists() {
              let lists = vec![vec![], vec![7, 8], vec![]];
              assert_eq!(merge_sorted(&lists), vec![7, 8], "merge_sorted([[], [7, 8], []])");
          }

          #[test]
          fn no_lists_merge_to_nothing() {
              assert_eq!(merge_sorted(&[]), Vec::<i32>::new(), "merge_sorted([])");
          }

          #[test]
          fn keeps_duplicates_and_negatives() {
              let lists = vec![vec![-3, 0, 0], vec![-3, 5]];
              assert_eq!(merge_sorted(&lists), vec![-3, -3, 0, 0, 5], "merge_sorted([[-3, 0, 0], [-3, 5]])");
          }

          #[test]
          fn merges_1000_lists_of_200_items() {
              let lists: Vec<Vec<i32>> = (0..1000).map(|l| (0..200).map(|i| i * 1000 + l).collect()).collect();
              let merged = merge_sorted(&lists);
              let expected: Vec<i32> = (0..200_000).collect();
              assert_eq!(merged == expected, true, "merging 1000 lists gives 0..200000 in order");
          }
        hints:
