                  Box::new(BulkDeal { min_items: 5, off_cents: 500 }),
                  Box::new(Coupon { code: "CRAB5".to_string(), off_cents: 250 }),
              ]
          }

          #[test]
          fn labels_describe_each_discount() {
              let labels: Vec<String> = deals().iter().map(|d| d.label()).collect();
              assert_eq!(labels, vec!["10% off", "bulk deal (5+ items)", "coupon CRAB5"], "labels");
          }

          #[test]
          fn applies_every_discount_to_the_original_subtotal() {
              assert_eq!(checkout(10_000, 6, &deals()), (8_250, vec!["10% off".to_string(), "bulk deal (5+ items)".to_string(), "coupon CRAB5".to_string()]), "checkout(10000, 6 items)");
          }

          #[test]
          fn skips_discounts_that_do_not_apply() {
              assert_eq!(checkout(10_000, 2, &deals()), (8_750, vec!["10% off".to_string(), "coupon CRAB5".to_string()]), "checkout(10000, 2 items)");
          }

          #[test]
