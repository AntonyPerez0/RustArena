        solution: |
          /// Parses durations like "45s", "2m", "1h30m" or "1h0m15s" into seconds.
          fn parse_duration(text: &str) -> Result<u64, String> {
              if text.is_empty() {
                  return Err("empty duration".to_string());
              }
              let mut total = 0;
              let mut number = String::new();
              for c in text.chars() {
                  if c.is_ascii_digit() {
                      number.push(c);
                      continue;
                  }
                  let value: u64 = number.parse().map_err(|_| format!("missing number before {c}"))?;
                  let unit = match c {
                      'h' => 3600,
                      'm' => 60,
                      's' => 1,
                      other => return Err(format!("unknown unit {other}")),
                  };
                  total += value * unit;
                  number.clear();
              }
              if !number.is_empty() {
                  return Err(format!("missing unit after {number}"));
              }
              Ok(total)
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              // Write your #[test] functions here.
              #[test]
              fn parses_single_units() {
                  assert_eq!(parse_duration("45s"), Ok(45));
                  assert_eq!(parse_duration("2m"), Ok(120));
                  assert_eq!(parse_duration("3h"), Ok(10_800));
              }

              #[test]
              fn parses_combinations() {
                  assert_eq!(parse_duration("1h30m"), Ok(5400));
                  assert_eq!(parse_duration("1h0m15s"), Ok(3615));
              }

              #[test]
              fn rejects_empty_input() {
                  assert!(parse_duration("").is_err());
              }

              #[test]
              fn rejects_numbers_without_units_and_unknown_units() {
                  assert!(parse_duration("10").is_err());
                  assert!(parse_duration("5x").is_err());
                  assert!(parse_duration("m").is_err());
              }
          }
