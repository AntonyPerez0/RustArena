      - task: |
          > **LOG-105: Requests per hour**
          >
          > The capacity planning team wants a quick text histogram of traffic per hour of the day.

          Write a program that reads the same log format from standard input and prints one line per hour that had traffic, in order: the hour as `HH:00`, a bar with one `#` per request, and the count:

          ```
          09:00 ### 3
          14:00 # 1
          ```

          A line counts if it has exactly 5 fields and its timestamp has a two-digit hour at character positions 11 and 12, counting from 0 (the `09` in `2026-10-01T09:00:03Z`), from `00` to `23`; skip everything else. Use a `BTreeMap` keyed by hour. If nothing counts, print `no traffic`.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
              }
          }
        solution: |
          use std::collections::BTreeMap;
          use std::io::{self, BufRead};

          fn hour_of(line: &str) -> Option<u32> {
              let fields: Vec<&str> = line.split_whitespace().collect();
              if fields.len() != 5 {
                  return None;
              }
              let hour: u32 = fields[0].get(11..13)?.parse().ok()?;
              (hour < 24).then_some(hour)
          }

          fn main() {
              let mut per_hour: BTreeMap<u32, usize> = BTreeMap::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
                  if let Some(hour) = hour_of(&line) {
                      *per_hour.entry(hour).or_insert(0) += 1;
                  }
              }
              if per_hour.is_empty() {
                  println!("no traffic");
              }
              for (hour, count) in &per_hour {
                  println!("{hour:02}:00 {} {count}", "#".repeat(*count));
              }
          }
        require:
          - pattern: 'BTreeMap'
            message: Count the requests in a `BTreeMap` keyed by hour, so the hours print in order.
        hints:
          - "Write `fn hour_of(line: &str) -> Option<u32>` that checks for 5 fields and returns the hour."
          - "`fields[0].get(11..13)` returns `None` instead of panicking when the timestamp is too short; then `.parse().ok()?` and check `hour < 24`."
          - "Print with `println!(\"{hour:02}:00 {} {count}\", \"#\".repeat(*count))`."
        tests:
          - stdin: "2026-10-01T09:00:01Z GET /a 200 1\n2026-10-01T14:30:00Z GET /a 200 1\n2026-10-01T09:59:59Z POST /b 201 5\n2026-10-01T09:10:00Z GET /a 200 1\n"
            expect: "09:00 ### 3\n14:00 # 1"
          - stdin: "2026-10-01T23:00:00Z GET /a 200 1\n2026-10-01T00:00:00Z GET /a 200 1\nbroken\n2026-10-01 GET /a 200 1\n2026-10-01T25:00:00Z GET /a 200 1\n2026-10-01T00:30:00Z GET /a 200 1 extra\n2026-10-01T00:45:00Z GET /a 200 1\n"
            hidden: true
          - stdin: "\n"
            hidden: true
      - task: |
          > **LOG-108: Page the on-call engineer on error bursts**
          >
          > One 5xx error is noise. Several within a minute means something is broken. We want an alert tool for the log stream.

          This log uses Unix timestamps (seconds) in the first field: `1727773200 GET /api/orders 503 120`. Timestamps never go backwards. The alert threshold is the program's first **command-line argument** (for example `3`). If it's missing or not a positive number, print `usage: alerts THRESHOLD` to standard error and exit with code 2.

          Keep the times of recent server errors (status 500 or above) in a `VecDeque`. For each error at time `t`, first drop errors from the front that are 60 or more seconds older than `t`, then add `t`. When the window holds `THRESHOLD` errors, print `ALERT at T: N server errors in 60s` and clear the window (so one burst gives one alert). Skip malformed lines. At the end print `alerts: K`.
        seed: |
          use std::collections::VecDeque;
          use std::io::{self, BufRead};

          fn main() {
              let threshold: usize = 3; // TODO: read it from the command line
          }
        solution: |
          use std::collections::VecDeque;
          use std::io::{self, BufRead};

          fn main() {
              let threshold = match std::env::args().nth(1).and_then(|a| a.parse::<usize>().ok()) {
                  Some(n) if n > 0 => n,
                  _ => {
                      eprintln!("usage: alerts THRESHOLD");
                      std::process::exit(2);
                  }
              };
              let mut window: VecDeque<u64> = VecDeque::new();
              let mut alerts = 0;
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
                  let fields: Vec<&str> = line.split_whitespace().collect();
                  let [time, _, _, status, _] = fields[..] else {
                      continue;
                  };
                  let (Ok(t), Ok(status)) = (time.parse::<u64>(), status.parse::<u16>()) else {
                      continue;
                  };
                  if status < 500 {
                      continue;
                  }
                  while window.front().is_some_and(|&old| t - old >= 60) {
                      window.pop_front();
                  }
                  window.push_back(t);
                  if window.len() >= threshold {
                      println!("ALERT at {t}: {} server errors in 60s", window.len());
                      alerts += 1;
                      window.clear();
                  }
              }
              println!("alerts: {alerts}");
          }
        require:
          - pattern: 'VecDeque'
            message: Keep the recent errors in a `VecDeque`.
          - pattern: 'env::args'
            message: Read the threshold from the command line with `std::env::args()`.
        hints:
          - "`std::env::args().nth(1)` is the first argument. Parse it with `.and_then(|a| a.parse::<usize>().ok())` and handle `None` or 0 with `eprintln!` and `std::process::exit(2)`."
          - "For each line, take the time and the status (skip lines that don't have 5 fields or don't parse), and skip statuses below 500."
          - "`while window.front().is_some_and(|&old| t - old >= 60) { window.pop_front(); }` (`is_some_and` is true when the Option holds a value that passes the test), then `push_back(t)`; at `window.len() >= threshold`, print the alert, count it and `window.clear()`."
