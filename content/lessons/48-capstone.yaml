    solution: |
      use thiserror::Error;

      #[derive(Debug, Clone, PartialEq)]
      enum OrderState {
          Created,
          Paid { amount_cents: u64 },
          Shipped { tracking: String },
          Delivered,
          Cancelled { reason: String },
      }

      #[derive(Debug, Clone, PartialEq)]
      enum Event {
          Pay { amount_cents: u64 },
          Ship { tracking: String },
          Deliver,
          Cancel { reason: String },
      }

      #[derive(Debug, Error, PartialEq)]
      enum TransitionError {
          #[error("cannot {event} an order that is {state}")]
          NotAllowed { state: &'static str, event: &'static str },
          #[error("payment must be more than zero")]
          ZeroPayment,
          #[error("tracking number must not be empty")]
          EmptyTracking,
      }

      impl OrderState {
          fn name(&self) -> &'static str {
              match self {
                  OrderState::Created => "created",
                  OrderState::Paid { .. } => "paid",
                  OrderState::Shipped { .. } => "shipped",
                  OrderState::Delivered => "delivered",
                  OrderState::Cancelled { .. } => "cancelled",
              }
          }

          fn describe(&self) -> String {
              match self {
                  OrderState::Paid { amount_cents } => format!("paid {}.{:02}", amount_cents / 100, amount_cents % 100),
                  OrderState::Shipped { tracking } => format!("shipped, tracking {tracking}"),
                  OrderState::Cancelled { reason } => format!("cancelled: {reason}"),
                  other => other.name().to_string(),
              }
          }
      }

      impl Event {
          fn name(&self) -> &'static str {
              match self {
                  Event::Pay { .. } => "pay",
                  Event::Ship { .. } => "ship",
                  Event::Deliver => "deliver",
                  Event::Cancel { .. } => "cancel",
              }
          }
      }

      fn apply(state: OrderState, event: Event) -> Result<OrderState, TransitionError> {
          match (state, event) {
              (OrderState::Created, Event::Pay { amount_cents: 0 }) => Err(TransitionError::ZeroPayment),
              (OrderState::Created, Event::Pay { amount_cents }) => Ok(OrderState::Paid { amount_cents }),
              (OrderState::Paid { .. }, Event::Ship { tracking }) if tracking.trim().is_empty() => Err(TransitionError::EmptyTracking),
              (OrderState::Paid { .. }, Event::Ship { tracking }) => Ok(OrderState::Shipped { tracking }),
              (OrderState::Shipped { .. }, Event::Deliver) => Ok(OrderState::Delivered),
              (OrderState::Created | OrderState::Paid { .. }, Event::Cancel { reason }) => Ok(OrderState::Cancelled { reason }),
              (state, event) => Err(TransitionError::NotAllowed { state: state.name(), event: event.name() }),
          }
      }
    hints:
      - "`name()` is a `match self` returning a string literal per variant; use `{ .. }` to ignore a variant's fields."
      - "`describe()` can match the three variants with data and fall back to `other => other.name().to_string()`. For money: `format!(\"paid {}.{:02}\", amount_cents / 100, amount_cents % 100)`."
      - "`apply`: `match (state, event)` with one arm per legal transition (`Event::Pay { amount_cents: 0 }` matches a zero payment; a guard `if tracking.trim().is_empty()` catches empty tracking numbers), and a last arm `(state, event) => Err(TransitionError::NotAllowed { state: state.name(), event: event.name() })`."
    harness: |
      fn pay(cents: u64) -> Event {
          Event::Pay { amount_cents: cents }
      }

      fn ship(tracking: &str) -> Event {
          Event::Ship { tracking: tracking.to_string() }
      }

      fn cancel(reason: &str) -> Event {
          Event::Cancel { reason: reason.to_string() }
      }

      #[test]
      fn follows_the_happy_path() {
          let paid = apply(OrderState::Created, pay(2500)).unwrap();
          assert_eq!(paid, OrderState::Paid { amount_cents: 2500 }, "after pay(2500)");
          let shipped = apply(paid, ship("TRK123")).unwrap();
          assert_eq!(shipped, OrderState::Shipped { tracking: "TRK123".into() }, "after ship(TRK123)");
          assert_eq!(apply(shipped, Event::Deliver), Ok(OrderState::Delivered), "after deliver");
      }

      #[test]
      fn can_cancel_before_shipping() {
          assert_eq!(apply(OrderState::Created, cancel("changed mind")), Ok(OrderState::Cancelled { reason: "changed mind".into() }), "cancel when created");
          assert_eq!(apply(OrderState::Paid { amount_cents: 900 }, cancel("out of stock")), Ok(OrderState::Cancelled { reason: "out of stock".into() }), "cancel when paid");
      }

      #[test]
      fn rejects_illegal_transitions() {
          assert_eq!(apply(OrderState::Created, ship("TRK1")), Err(TransitionError::NotAllowed { state: "created", event: "ship" }), "ship when created");
          assert_eq!(apply(OrderState::Shipped { tracking: "T".into() }, cancel("late")), Err(TransitionError::NotAllowed { state: "shipped", event: "cancel" }), "cancel when shipped");
          assert_eq!(apply(OrderState::Delivered, pay(100)), Err(TransitionError::NotAllowed { state: "delivered", event: "pay" }), "pay when delivered");
          assert_eq!(apply(OrderState::Cancelled { reason: "x".into() }, Event::Deliver), Err(TransitionError::NotAllowed { state: "cancelled", event: "deliver" }), "deliver when cancelled");
      }

      #[test]
      fn validates_payment_and_tracking() {
          assert_eq!(apply(OrderState::Created, pay(0)), Err(TransitionError::ZeroPayment), "pay(0)");
          assert_eq!(apply(OrderState::Paid { amount_cents: 1 }, ship("   ")), Err(TransitionError::EmptyTracking), "ship with a blank tracking number");
      }

      #[test]
      fn errors_explain_themselves() {
          let err = apply(OrderState::Paid { amount_cents: 1 }, Event::Deliver).unwrap_err();
          assert_eq!(err.to_string(), "cannot deliver an order that is paid", "the error message");
      }

      #[test]
      fn describes_each_state() {
          assert_eq!(OrderState::Created.describe(), "created", "Created");
          assert_eq!(OrderState::Paid { amount_cents: 2507 }.describe(), "paid 25.07", "Paid 2507 cents");
          assert_eq!(OrderState::Shipped { tracking: "TRK9".into() }.describe(), "shipped, tracking TRK9", "Shipped");
          assert_eq!(OrderState::Delivered.describe(), "delivered", "Delivered");
          assert_eq!(OrderState::Cancelled { reason: "fraud check".into() }.describe(), "cancelled: fraud check", "Cancelled");
      }
    more:
      - task: |
          > **SUP-118: Replay the support ticket log**
          >
          > The helpdesk exports every action as a line of text. We need the final state of every ticket, plus a list of actions the old system wrongly accepted.

          Standard input has one action per line: `TICKET ACTION [NAME]`. A ticket that appears for the first time starts **open**. The actions and their legal transitions:

          - `assign NAME`: open becomes **in progress (NAME)**; in progress becomes in progress with the new name
          - `resolve`: in progress becomes **resolved**
          - `reopen`: resolved becomes **open**
          - `close`: resolved becomes **closed**

          For every illegal action, print `rejected: TICKET ACTION (ticket is STATE)` as you go, and leave the ticket unchanged. At the end, print every ticket in order of its id with `TICKET: STATE`, where STATE is `open`, `in progress (NAME)`, `resolved` or `closed`. Ignore lines that don't have a known action or are missing the name for `assign` (they don't create a ticket either).

          Model the state as an enum with a `describe()` method, and keep the tickets in a `BTreeMap<String, TicketState>`.
        seed: |
          use std::collections::BTreeMap;
          use std::io::{self, BufRead};

          fn main() {
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
              }
          }
        solution: |
          use std::collections::BTreeMap;
          use std::io::{self, BufRead};

          #[derive(Clone)]
          enum TicketState {
              Open,
              InProgress { assignee: String },
              Resolved,
              Closed,
          }

          impl TicketState {
              fn describe(&self) -> String {
                  match self {
                      TicketState::Open => "open".to_string(),
                      TicketState::InProgress { assignee } => format!("in progress ({assignee})"),
                      TicketState::Resolved => "resolved".to_string(),
                      TicketState::Closed => "closed".to_string(),
                  }
              }
          }

          fn act(state: &TicketState, action: &str, name: Option<&str>) -> Option<TicketState> {
              match (state, action, name) {
                  (TicketState::Open | TicketState::InProgress { .. }, "assign", Some(n)) => Some(TicketState::InProgress { assignee: n.to_string() }),
                  (TicketState::InProgress { .. }, "resolve", _) => Some(TicketState::Resolved),
                  (TicketState::Resolved, "reopen", _) => Some(TicketState::Open),
                  (TicketState::Resolved, "close", _) => Some(TicketState::Closed),
                  _ => None,
              }
          }

          fn main() {
              let mut tickets: BTreeMap<String, TicketState> = BTreeMap::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
                  let mut parts = line.split_whitespace();
                  let (Some(id), Some(action)) = (parts.next(), parts.next()) else {
                      continue;
                  };
                  let name = parts.next();
                  let known = matches!(action, "resolve" | "reopen" | "close") || (action == "assign" && name.is_some());
                  if !known {
                      continue;
                  }
                  let state = tickets.entry(id.to_string()).or_insert(TicketState::Open);
                  match act(state, action, name) {
                      Some(next) => *state = next,
                      None => println!("rejected: {id} {action} (ticket is {})", state.describe()),
                  }
              }
              for (id, state) in &tickets {
                  println!("{id}: {}", state.describe());
              }
          }
        hints:
          - "Define `enum TicketState { Open, InProgress { assignee: String }, Resolved, Closed }` with a `describe()` method."
          - "Write `fn act(state: &TicketState, action: &str, name: Option<&str>) -> Option<TicketState>` that matches `(state, action, name)` and returns the next state for the four legal moves, `None` otherwise."
          - "In `main`, get the ticket with `tickets.entry(id.to_string()).or_insert(TicketState::Open)`, then either overwrite it with `*state = next` or print the rejection."
        tests:
          - stdin: "T1 assign ana\nT2 close\nT1 resolve\nT1 close\nT3 assign ben\nT3 assign cy\nT2 resolve\n"
            expect: "rejected: T2 close (ticket is open)\nrejected: T2 resolve (ticket is open)\nT1: closed\nT2: open\nT3: in progress (cy)"
          - stdin: "A9 assign dee\nA9 resolve\nA9 reopen\nA9 assign eve\nB1 fly\nB1 assign\n\nA9 close\nC4 reopen\n"
            hidden: true
          - stdin: "Z1 assign max\nZ1 resolve\nZ1 close\nZ1 reopen\nZ1 assign max\n"
            hidden: true
      - task: |
          > **CMS-77: Articles must be reviewed before publishing**
          >
          > An intern published a draft by calling `publish()` directly. Make that impossible at compile time.

          Use the **typestate pattern** (module 34): a separate type per state, where each method consumes `self` and returns the next state's type, so calling a method in the wrong state doesn't compile. Write:

          - `Draft::new(title: &str) -> Draft` (empty body), `Draft::write(self, text: &str) -> Draft` (appends `text` to the body, with a space between pieces), `Draft::submit(self) -> InReview`
          - `InReview::approve(self, reviewer: &str) -> Published` and `InReview::reject(self) -> Draft` (back to editing, body kept)
          - `Published::headline(&self) -> String` returning `TITLE (approved by REVIEWER)`, and `Published::body(&self) -> &str`

          There's no `publish` on `Draft` at all: the only way to a `Published` is through review.
        seed: |
          struct Draft {
              title: String,
              body: String,
          }

          struct InReview {
              title: String,
              body: String,
          }

          struct Published {
              title: String,
              body: String,
              approved_by: String,
          }
        solution: |
          struct Draft {
              title: String,
              body: String,
          }

          struct InReview {
              title: String,
              body: String,
          }

          struct Published {
              title: String,
              body: String,
              approved_by: String,
          }

          impl Draft {
              fn new(title: &str) -> Draft {
                  Draft { title: title.to_string(), body: String::new() }
              }

              fn write(mut self, text: &str) -> Draft {
                  if !self.body.is_empty() {
                      self.body.push(' ');
                  }
                  self.body.push_str(text);
                  self
              }

              fn submit(self) -> InReview {
                  InReview { title: self.title, body: self.body }
              }
          }

          impl InReview {
              fn approve(self, reviewer: &str) -> Published {
                  Published { title: self.title, body: self.body, approved_by: reviewer.to_string() }
              }

              fn reject(self) -> Draft {
                  Draft { title: self.title, body: self.body }
              }
          }

          impl Published {
              fn headline(&self) -> String {
                  format!("{} (approved by {})", self.title, self.approved_by)
              }

              fn body(&self) -> &str {
                  &self.body
              }
          }
        harness: |
          #[test]
          fn publishes_through_review() {
              let article = Draft::new("Rust 2024 is out").write("Edition 2024").write("ships today.").submit().approve("ana");
              assert_eq!(article.headline(), "Rust 2024 is out (approved by ana)", "headline()");
              assert_eq!(article.body(), "Edition 2024 ships today.", "body()");
          }

          #[test]
          fn rejected_drafts_keep_their_text() {
              let draft = Draft::new("Draft").write("first try").submit().reject();
              let article = draft.write("and a fix").submit().approve("ben");
              assert_eq!(article.body(), "first try and a fix", "body() after reject and rewrite");
              assert_eq!(article.headline(), "Draft (approved by ben)", "headline()");
          }

          #[test]
          fn an_empty_article_can_be_published() {
              let article = Draft::new("Notice").submit().approve("cy");
              assert_eq!(article.body(), "", "body() of an empty article");
          }
        hints:
          - "Each transition consumes `self` and builds the next struct from its fields: `fn submit(self) -> InReview { InReview { title: self.title, body: self.body } }`."
          - "`write` can take `mut self`, push a space if the body isn't empty, push the text, and return `self`."
          - "`headline` is `format!(\"{} (approved by {})\", self.title, self.approved_by)`; `body` returns `&self.body`."

  - title: "REVIEW-9: refactor for code review"
    id: capstone-6
    text: |
      > **REVIEW-9: Address review comments on the grade report**
      >
      > The function works and has been in production for a year, but it's next in line to be extended, and the reviewer left comments. Refactor it without changing its output.

      Much of a developer's week is reading and improving existing code. Good refactoring keeps behavior **exactly** the same (tests prove it) while making the code easier to read, harder to misuse and cheaper to run. The usual review comments in Rust:

      | Smell | Why it matters | Idiomatic fix |
      |---|---|---|
      | parallel `Vec`s (`names`, `scores`) | they can get out of sync, and every reader must remember they're linked | a `Vec` of structs |
      | `Vec<T>` or `String` parameters you only read | forces callers to give up (or clone) their data | `&[T]` and `&str` |
      | `while i < v.len()` and `v[i]` | off-by-one risk, bounds checks, noise | `for x in &v`, iterators |
      | `.clone()` just to read | a needless allocation | borrow |
      | magic numbers (`50`) | what does it mean, and where else is it? | a named `const` |
      | `s = s + &a + &b` chains | hard to read, extra copies | `format!`, `write!`, `push_str` |
      | `if flag == true` | noise | `if flag` |
      | boolean parameters | `ship(3, true, false)` is unreadable at the call site | an enum per choice |

      Clippy flags several of these on its own (`needless_range_loop` for `for i in 0..v.len()` loops, `ptr_arg` for `&Vec<T>` parameters, `bool_comparison` for `== true`), and opt-in lints such as `redundant_clone` (in the `nursery` group) catch more. Running `cargo clippy` before asking for review saves everyone time.

      Here's a small before and after: the same total, from a loop full of smells to an iterator chain.

      ```rust run
      const FREE_SHIPPING_CENTS: u64 = 5000;

      struct Item {
          price_cents: u64,
          quantity: u64,
      }

      // Before: parallel vectors, an index loop, a magic number
      fn total_before(prices: Vec<u64>, quantities: Vec<u64>) -> u64 {
          let mut total = 0;
          let mut i = 0;
          while i < prices.len() {
              total = total + prices[i] * quantities[i];
              i = i + 1;
          }
          if total < 5000 { total + 499 } else { total }
      }

      // After: one struct per line item, a slice, a named constant
      fn total_after(items: &[Item]) -> u64 {
          let total: u64 = items.iter().map(|item| item.price_cents * item.quantity).sum();
          let shipping = if total < FREE_SHIPPING_CENTS { 499 } else { 0 };
          total + shipping
      }

      fn main() {
          let items = [Item { price_cents: 1200, quantity: 2 }, Item { price_cents: 350, quantity: 4 }];
          println!("{}", total_before(vec![1200, 350], vec![2, 4]));
          println!("{}", total_after(&items));
      }
      ```

      ```output
      4299
      4299
      ```

      ### How to refactor safely

      1. **Pin the behavior first.** Write tests for the current output, including edge cases (empty input, boundaries like exactly 50). Here the hidden tests do that for you.
      2. **Change one thing at a time,** compiling and testing in between.
      3. **Keep the diff focused.** A refactor PR that also changes behavior is hard to review. Do those in separate PRs.

      ### Common mistakes

      - **"Improving" the output.** Even a fixed typo in a report can break a script that parses it. Same output, byte for byte.
      - **Forgetting the empty case.** The old code avoided dividing by zero; the new one must too.
      - **`writeln!` into a `String` without `use std::fmt::Write`.** The macro needs that trait in scope; the compiler error suggests the import.

      **Your turn:** the seed's `grade_report` works, but the review asks for:

      1. Take `students: &[Student]` instead of two parallel `Vec`s (`Student` is in the seed).
      2. No index loops (`while`, `[i]`) and no `.clone()`.
      3. A named constant `const PASS_MARK: u32 = 50;` instead of the magic number.
      4. Build the text with `format!`, `write!`/`writeln!` or `push_str` instead of `+` chains.

      The output must stay exactly the same: one line per student, `NAME: pass (SCORE)` or `NAME: fail (SCORE)`, then `average: N` (rounded down) or `average: n/a` when there are no students.
    seed: |
      struct Student {
          name: String,
          score: u32,
      }

      // Works, but see the review comments in the task.
      fn grade_report(names: Vec<String>, scores: Vec<u32>) -> String {
          let mut out = String::new();
          let mut total = 0;
          let mut i = 0;
          while i < names.len() {
              let name = names[i].clone();
              if scores[i] >= 50 {
                  out = out + &name + ": pass (" + &scores[i].to_string() + ")\n";
              } else {
                  out = out + &name + ": fail (" + &scores[i].to_string() + ")\n";
              }
              total = total + scores[i];
              i = i + 1;
          }
          if names.len() > 0 {
              out = out + "average: " + &(total / names.len() as u32).to_string();
          } else {
              out = out + "average: n/a";
          }
          out
      }
    solution: |
      use std::fmt::Write;

      const PASS_MARK: u32 = 50;

      struct Student {
          name: String,
          score: u32,
      }

      fn grade_report(students: &[Student]) -> String {
          let mut out = String::new();
          for s in students {
              let verdict = if s.score >= PASS_MARK { "pass" } else { "fail" };
              writeln!(out, "{}: {verdict} ({})", s.name, s.score).expect("writing to a String cannot fail");
          }
          if students.is_empty() {
              out.push_str("average: n/a");
          } else {
              let total: u32 = students.iter().map(|s| s.score).sum();
              write!(out, "average: {}", total / students.len() as u32).expect("writing to a String cannot fail");
          }
          out
      }
    require:
      - pattern: 'const\s+PASS_MARK\s*:\s*u32\s*=\s*50'
        message: "Replace the magic number with `const PASS_MARK: u32 = 50;`."
      - pattern: 'students\s*:\s*&\[\s*Student\s*\]'
        message: "Take `students: &[Student]` instead of two parallel Vecs."
    forbid:
      - pattern: '\.clone\(\)'
        message: "Borrow the name instead of cloning it."
      - pattern: '\bwhile\b|\[\s*i\s*\]'
        message: Iterate over the students instead of using an index loop.
      - pattern: '\+\s*&'
        message: "Build the text with `format!`, `write!` or `push_str` instead of `+ &...` chains."
      - pattern: 'Vec<String>'
        message: The names should live inside the `Student` structs, not in a separate Vec.
    hints:
      - "Change the signature to `fn grade_report(students: &[Student]) -> String` and add `const PASS_MARK: u32 = 50;`."
      - "Loop `for s in students`, choose `\"pass\"` or `\"fail\"` with `if s.score >= PASS_MARK`, and append the line with `out.push_str(&format!(...))` or `writeln!(out, ...)` (that one needs `use std::fmt::Write;`)."
      - "For the last line, `students.iter().map(|s| s.score).sum::<u32>()` divided by `students.len() as u32`, or `average: n/a` when `students.is_empty()`."
    harness: |
      fn st(name: &str, score: u32) -> Student {
          Student { name: name.to_string(), score }
      }

      #[test]
      fn reports_pass_and_fail() {
          let report = grade_report(&[st("Ana", 82), st("Ben", 41), st("Cy", 67)]);
          assert_eq!(report, "Ana: pass (82)\nBen: fail (41)\nCy: pass (67)\naverage: 63", "grade_report(Ana 82, Ben 41, Cy 67)");
      }

      #[test]
      fn exactly_the_pass_mark_passes() {
          assert_eq!(grade_report(&[st("Dee", 50), st("Eve", 49)]), "Dee: pass (50)\nEve: fail (49)\naverage: 49", "grade_report(Dee 50, Eve 49)");
      }

      #[test]
      fn the_average_rounds_down() {
          assert_eq!(grade_report(&[st("Fay", 100), st("Gus", 0), st("Hal", 0)]), "Fay: pass (100)\nGus: fail (0)\nHal: fail (0)\naverage: 33", "grade_report(100, 0, 0)");
      }

      #[test]
      fn no_students_has_no_average() {
          assert_eq!(grade_report(&[]), "average: n/a", "grade_report([])");
      }

      #[test]
      fn keeps_the_callers_data() {
          let class = vec![st("Ivy", 90)];
          let first = grade_report(&class);
          assert_eq!(first, grade_report(&class), "calling twice with the same borrowed data");
      }
