    solution: |
      use std::fmt;
      use std::str::FromStr;

      #[derive(Debug, PartialEq)]
      struct LogEntry {
          timestamp: String,
          method: String,
          path: String,
          status: u16,
          latency_ms: u32,
      }

      #[derive(Debug, PartialEq)]
      enum ParseLogError {
          WrongFieldCount(usize),
          BadMethod(String),
          BadStatus(String),
          BadLatency(String),
      }

      impl fmt::Display for ParseLogError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  ParseLogError::WrongFieldCount(n) => write!(f, "expected 5 fields, found {n}"),
                  ParseLogError::BadMethod(m) => write!(f, "unknown HTTP method: {m}"),
                  ParseLogError::BadStatus(s) => write!(f, "bad status code: {s}"),
                  ParseLogError::BadLatency(l) => write!(f, "bad latency: {l}"),
              }
          }
      }

      // Makes ParseLogError usable with `?` in functions returning Box<dyn Error> (and with anyhow).
      impl std::error::Error for ParseLogError {}

      const METHODS: [&str; 5] = ["GET", "POST", "PUT", "PATCH", "DELETE"];

      impl FromStr for LogEntry {
          type Err = ParseLogError;

          fn from_str(line: &str) -> Result<Self, Self::Err> {
              let fields: Vec<&str> = line.split_whitespace().collect();
              let [timestamp, method, path, status, latency] = fields[..] else {
                  return Err(ParseLogError::WrongFieldCount(fields.len()));
              };
              if !METHODS.contains(&method) {
                  return Err(ParseLogError::BadMethod(method.to_string()));
              }
              let status: u16 = status
                  .parse()
                  .ok()
                  .filter(|code| (100..=599).contains(code))
                  .ok_or_else(|| ParseLogError::BadStatus(status.to_string()))?;
              let latency_ms = latency.parse().map_err(|_| ParseLogError::BadLatency(latency.to_string()))?;
              Ok(LogEntry {
                  timestamp: timestamp.to_string(),
                  method: method.to_string(),
                  path: path.to_string(),
                  status,
                  latency_ms,
              })
          }
      }
    hints:
      - "`Display`: `match self` with one `write!(f, ...)` per variant, for example `ParseLogError::BadMethod(m) => write!(f, \"unknown HTTP method: {m}\")`."
      - "`from_str`: collect `line.split_whitespace()` into a `Vec<&str>` and use `let [timestamp, method, path, status, latency] = fields[..] else { return Err(ParseLogError::WrongFieldCount(fields.len())); };`"
      - "For the status, `status.parse::<u16>().ok().filter(|c| (100..=599).contains(c)).ok_or_else(|| ParseLogError::BadStatus(status.to_string()))?`; for the latency, `latency.parse().map_err(|_| ParseLogError::BadLatency(latency.to_string()))?`."
    harness: |
      #[test]
      fn parses_a_valid_line() {
          let e: LogEntry = "2026-10-01T09:00:03Z GET /api/orders 200 35".parse().unwrap();
          assert_eq!(e.timestamp, "2026-10-01T09:00:03Z", "timestamp");
          assert_eq!(e.method, "GET", "method");
          assert_eq!(e.path, "/api/orders", "path");
          assert_eq!(e.status, 200, "status");
          assert_eq!(e.latency_ms, 35, "latency_ms");
      }

      #[test]
      fn tolerates_extra_spaces() {
          let e = "  2026-10-01T09:00:04Z   DELETE /api/carts/7  204 12 ".parse::<LogEntry>();
          assert_eq!(e.map(|e| (e.method, e.status)), Ok((String::from("DELETE"), 204)), "parsing a line with extra spaces");
      }

      #[test]
      fn counts_the_fields_of_a_short_or_long_line() {
          assert_eq!("2026-10-01T09:00:03Z GET /api/orders 200".parse::<LogEntry>(), Err(ParseLogError::WrongFieldCount(4)), "a line with 4 fields");
          assert_eq!("".parse::<LogEntry>(), Err(ParseLogError::WrongFieldCount(0)), "an empty line");
          assert_eq!("a b c d e f".parse::<LogEntry>(), Err(ParseLogError::WrongFieldCount(6)), "a line with 6 fields");
      }

      #[test]
      fn rejects_unknown_methods() {
          assert_eq!("t FETCH /x 200 1".parse::<LogEntry>(), Err(ParseLogError::BadMethod("FETCH".into())), "method FETCH");
          assert_eq!("t get /x 200 1".parse::<LogEntry>(), Err(ParseLogError::BadMethod("get".into())), "lowercase method get");
      }

      #[test]
      fn rejects_bad_status_codes() {
          assert_eq!("t GET /x 2x0 1".parse::<LogEntry>(), Err(ParseLogError::BadStatus("2x0".into())), "status 2x0");
          assert_eq!("t GET /x 99 1".parse::<LogEntry>(), Err(ParseLogError::BadStatus("99".into())), "status 99");
          assert_eq!("t GET /x 600 1".parse::<LogEntry>(), Err(ParseLogError::BadStatus("600".into())), "status 600");
      }

      #[test]
      fn rejects_bad_latencies() {
          assert_eq!("t GET /x 200 -5".parse::<LogEntry>(), Err(ParseLogError::BadLatency("-5".into())), "latency -5");
          assert_eq!("t GET /x 200 fast".parse::<LogEntry>(), Err(ParseLogError::BadLatency("fast".into())), "latency fast");
      }

      #[test]
      fn errors_have_readable_messages() {
          assert_eq!(ParseLogError::WrongFieldCount(3).to_string(), "expected 5 fields, found 3", "WrongFieldCount(3)");
          assert_eq!(ParseLogError::BadMethod("GTE".into()).to_string(), "unknown HTTP method: GTE", "BadMethod(GTE)");
          assert_eq!(ParseLogError::BadStatus("2x0".into()).to_string(), "bad status code: 2x0", "BadStatus(2x0)");
          assert_eq!(ParseLogError::BadLatency("fast".into()).to_string(), "bad latency: fast", "BadLatency(fast)");
      }

      #[test]
      fn works_as_a_boxed_error() {
          let err: Box<dyn std::error::Error> = "t GET /x 200".parse::<LogEntry>().unwrap_err().into();
          assert_eq!(err.to_string(), "expected 5 fields, found 4", "the error through Box<dyn Error>");
      }
