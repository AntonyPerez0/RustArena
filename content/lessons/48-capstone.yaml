              let only: Vec<Box<dyn Discount>> = vec![Box::new(PercentOff { percent: 15 })];
              assert_eq!(checkout(999, 1, &only), (850, vec!["15% off".to_string()]), "15% off 9.99");
          }

          #[test]
          fn never_goes_below_zero() {
              assert_eq!(checkout(300, 9, &deals()).0, 0, "total for a 3.00 basket with 9 items");
          }

          #[test]
          fn no_discounts_means_full_price() {
              assert_eq!(checkout(4_200, 3, &[]), (4_200, Vec::<String>::new()), "checkout with no discounts");
          }
