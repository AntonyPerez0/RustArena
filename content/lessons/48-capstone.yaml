          2026-10-01T09:00:05Z GTE /api/users 200 9
          ";

          #[test]
          fn keeps_the_good_lines_in_order() {
              let (entries, _) = parse_log(LOG);
              let paths: Vec<(&str, &str, &str, u16, u32)> = entries.iter().map(|e| (e.timestamp.as_str(), e.method.as_str(), e.path.as_str(), e.status, e.latency_ms)).collect();
              assert_eq!(paths, vec![("2026-10-01T09:00:01Z", "GET", "/api/users", 200, 40), ("2026-10-01T09:00:03Z", "POST", "/api/orders", 201, 120)], "the parsed entries");
          }

          #[test]
          fn reports_every_bad_line_with_its_number() {
              let (_, problems) = parse_log(LOG);
              assert_eq!(problems, vec!["line 4: bad status code: 2x0", "line 6: expected 5 fields, found 1", "line 7: unknown HTTP method: GTE"], "the problems");
          }

          #[test]
          fn skips_comments_and_blank_lines() {
              let (entries, problems) = parse_log("\n   # just a comment\n\n");
              assert_eq!((entries.len(), problems.len()), (0, 0), "entries and problems for comments only");
          }

          #[test]
          fn handles_an_empty_file() {
              let (entries, problems) = parse_log("");
              assert_eq!((entries.len(), problems.len()), (0, 0), "entries and problems for an empty file");
          }
