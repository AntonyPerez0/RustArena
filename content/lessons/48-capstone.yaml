      - task: |
          > **OPS-334: Print the effective config**
          >
          > Half our configs leave fields out and rely on defaults nobody remembers. The deploy log should show the config as it will really be used.

          Read a config from standard input where everything except `service` is optional, fill in the defaults, and print the result with `serde_json::to_string_pretty`. Defaults: `replicas` 2, `port` 8080, `regions` `["eu-west"]`, `env` empty, `health_check` `{"path": "/health", "interval_secs": 30}` (and inside a given `health_check`, a missing `path` or `interval_secs` gets its default too). Unknown fields are still errors. On a schema error print `invalid config: ERROR` and exit with code 2.

          Use `#[serde(default = "function_name")]` for fields whose default isn't the type's `Default`, implement `Default` for `HealthCheck`, and put `#[serde(default)]` on the `HealthCheck` struct itself so its fields fall back individually. Derive `Serialize` too; fields print in declaration order and `BTreeMap` keys in sorted order.
        seed: |
          use serde::{Deserialize, Serialize};
          use std::collections::BTreeMap;
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
          }
        solution: |
          use serde::{Deserialize, Serialize};
          use std::collections::BTreeMap;
          use std::io::{self, Read};

          #[derive(Deserialize, Serialize)]
          #[serde(deny_unknown_fields)]
          struct Config {
              service: String,
              #[serde(default = "default_replicas")]
              replicas: u32,
              #[serde(default = "default_port")]
              port: u16,
              #[serde(default = "default_regions")]
              regions: Vec<String>,
              #[serde(default)]
              env: BTreeMap<String, String>,
              #[serde(default)]
              health_check: HealthCheck,
          }

          #[derive(Deserialize, Serialize)]
          #[serde(default, deny_unknown_fields)]
          struct HealthCheck {
              path: String,
              interval_secs: u32,
          }

          impl Default for HealthCheck {
              fn default() -> Self {
                  HealthCheck { path: "/health".to_string(), interval_secs: 30 }
              }
          }

          fn default_replicas() -> u32 {
              2
          }

          fn default_port() -> u16 {
              8080
          }

          fn default_regions() -> Vec<String> {
              vec!["eu-west".to_string()]
          }

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let config: Config = match serde_json::from_str(&input) {
                  Ok(c) => c,
                  Err(e) => {
                      println!("invalid config: {e}");
                      std::process::exit(2);
                  }
              };
              println!("{}", serde_json::to_string_pretty(&config).expect("a Config always serializes"));
          }
        hints:
          - "Define `Config` and `HealthCheck` with `#[derive(Deserialize, Serialize)]` and `#[serde(deny_unknown_fields)]`."
          - "Write `fn default_replicas() -> u32 { 2 }` and friends, and use `#[serde(default = \"default_replicas\")]` on the field. For `HealthCheck`, implement `Default` by hand and add `#[serde(default)]` on the struct and on the `health_check` field."
          - "Deserialize with `serde_json::from_str`, then `println!(\"{}\", serde_json::to_string_pretty(&config).expect(...))`."
        tests:
          - stdin: "{\"service\": \"search\"}"
            expect: "{\n  \"service\": \"search\",\n  \"replicas\": 2,\n  \"port\": 8080,\n  \"regions\": [\n    \"eu-west\"\n  ],\n  \"env\": {},\n  \"health_check\": {\n    \"path\": \"/health\",\n    \"interval_secs\": 30\n  }\n}"
          - stdin: "{\"service\": \"api\", \"replicas\": 4, \"env\": {\"Z_LAST\": \"1\", \"A_FIRST\": \"2\"}, \"health_check\": {\"interval_secs\": 5}}"
            hidden: true
          - stdin: "{\"service\": \"api\", \"regions\": [], \"port\": 9090}"
            hidden: true
          - stdin: "{\"service\": \"api\", \"replica\": 4}"
            exit: 2
            hidden: true
      - task: |
          > **OPS-341: Detect config drift between staging and production**
          >
          > Incidents keep happening because production quietly differs from staging. We want a diff of the two configs, key by key.

          Standard input holds two JSON documents (objects): staging, then a line containing only `---`, then production. Parse both into `serde_json::Value` and print their differences, one per line, with **dotted paths** for nested objects (`health_check.path`):

          - a key only in staging: `- PATH`
          - a key only in production: `+ PATH: VALUE`
          - a key in both with different values (where not both are objects): `~ PATH: OLD -> NEW`
          - both are objects: compare their keys recursively

          Values print as compact JSON (`Value`'s `Display`, for example `"info"` with quotes, `3`, `["eu-west"]`). Visit keys in sorted order at every level (collect them into a `BTreeSet` to be sure). If there are no differences, print `no drift`. If a document isn't valid JSON, print `NAME is not valid JSON: ERROR` (NAME is `staging` or `production`) and exit with code 2.
        seed: |
          use serde_json::Value;
          use std::collections::BTreeSet;
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
          }
        solution: |
          use serde_json::Value;
          use std::collections::BTreeSet;
          use std::io::{self, Read};

          fn diff(path: &str, old: &Value, new: &Value, out: &mut Vec<String>) {
              match (old, new) {
                  (Value::Object(a), Value::Object(b)) => {
                      let keys: BTreeSet<&String> = a.keys().chain(b.keys()).collect();
                      for key in keys {
                          let child = if path.is_empty() { key.clone() } else { format!("{path}.{key}") };
                          match (a.get(key), b.get(key)) {
                              (Some(x), Some(y)) => diff(&child, x, y, out),
                              (Some(_), None) => out.push(format!("- {child}")),
                              (None, Some(y)) => out.push(format!("+ {child}: {y}")),
                              (None, None) => {}
                          }
                      }
                  }
                  _ => {
                      if old != new {
                          out.push(format!("~ {path}: {old} -> {new}"));
                      }
                  }
              }
          }

          fn parse(text: &str, name: &str) -> Value {
              serde_json::from_str(text).unwrap_or_else(|e| {
                  println!("{name} is not valid JSON: {e}");
                  std::process::exit(2);
              })
          }

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let (staging, production) = input.split_once("\n---\n").unwrap_or((input.as_str(), ""));
              let (old, new) = (parse(staging, "staging"), parse(production, "production"));
              let mut out = Vec::new();
              diff("", &old, &new, &mut out);
              if out.is_empty() {
                  println!("no drift");
              }
              for line in &out {
                  println!("{line}");
              }
          }
        hints:
          - "Split the input with `input.split_once(\"\\n---\\n\")` and parse each half with `serde_json::from_str::<Value>`."
          - "Write a recursive `fn diff(path: &str, old: &Value, new: &Value, out: &mut Vec<String>)`. Match `(old, new)`: two `Value::Object`s recurse over the union of their keys (a `BTreeSet`); anything else is a change if `old != new`."
          - "For each key build the child path (`key` at the top, `format!(\"{path}.{key}\")` below), then match `(a.get(key), b.get(key))` for the `-`, `+` and recursive cases."
        tests:
          - stdin: "{\"service\": \"checkout\", \"replicas\": 2, \"env\": {\"LOG_LEVEL\": \"debug\", \"OLD_FLAG\": \"1\"}, \"regions\": [\"eu-west\"]}\n---\n{\"service\": \"checkout\", \"replicas\": 6, \"env\": {\"LOG_LEVEL\": \"info\", \"NEW_FLAG\": \"on\"}, \"regions\": [\"eu-west\"]}\n"
            expect: "~ env.LOG_LEVEL: \"debug\" -> \"info\"\n+ env.NEW_FLAG: \"on\"\n- env.OLD_FLAG\n~ replicas: 2 -> 6"
          - stdin: "{\"a\": 1, \"b\": {\"c\": [1, 2]}}\n---\n{\"b\": {\"c\": [1, 2]}, \"a\": 1}\n"
            hidden: true
          - stdin: "{\"health_check\": {\"path\": \"/health\"}, \"port\": 8080}\n---\n{\"health_check\": \"disabled\", \"port\": 8080, \"debug\": true}\n"
            hidden: true
          - stdin: "{\"a\": 1}\n---\n{\"a\": }\n"
            exit: 2
            hidden: true

  - title: "SHOP-240: the order workflow state machine"
    id: capstone-5
    text: |
      > **SHOP-240: Enforce the order lifecycle**
      >
      > Orders have been shipped without payment and refunded after delivery, because any code could set `order.status = "shipped"`. Model the workflow so that only legal transitions are possible, and every illegal one gets a clear error.

      An **enum state machine** (module 42) makes illegal states unrepresentable: each state is a variant that carries exactly the data that exists in that state (a tracking number only once shipped), and one function decides every transition. Matching on the `(state, event)` **tuple** lists the legal moves explicitly, and a final catch-all arm rejects everything else:

      ```rust run
      #[derive(Debug)]
      enum Door {
          Open,
          Closed,
          Locked { code: u32 },
      }

      #[derive(Debug)]
      enum Action {
          Close,
          Lock(u32),
          Unlock(u32),
          Open,
      }

      fn step(door: Door, action: &Action) -> Result<Door, (Door, String)> {
          match (door, action) {
              (Door::Open, Action::Close) => Ok(Door::Closed),
              (Door::Closed, Action::Open) => Ok(Door::Open),
              (Door::Closed, Action::Lock(code)) => Ok(Door::Locked { code: *code }),
              (Door::Locked { code }, Action::Unlock(attempt)) if *attempt == code => Ok(Door::Closed),
              (door @ Door::Locked { .. }, Action::Unlock(_)) => Err((door, "wrong code".to_string())),
              (door, action) => {
                  let why = format!("cannot {action:?} while {door:?}");
                  Err((door, why))
              }
          }
      }

      fn main() {
          let actions = [Action::Close, Action::Lock(1234), Action::Open, Action::Unlock(1111), Action::Unlock(1234), Action::Open];
          let mut door = Door::Open;
          for action in &actions {
              door = match step(door, action) {
                  Ok(next) => next,
                  Err((unchanged, why)) => {
                      println!("rejected {action:?}: {why}");
                      unchanged
                  }
              };
          }
          println!("final: {door:?}");
      }
      ```

      ```output
      rejected Open: cannot Open while Locked { code: 1234 }
      rejected Unlock(1111): wrong code
      final: Open
      ```

      - `step` takes the state **by value** and returns the next one, so nobody can keep using the old state by accident.
      - When an action is rejected, the error hands the unchanged state back (`Err((door, why))`), so the caller can carry on. That's a useful pattern for any function that consumes a value and might fail.
      - `door @ Door::Locked { .. }` matches a locked door and binds the whole value to `door` at the same time.

      ### Common mistakes

      - **A catch-all arm too early.** Arms are tried top to bottom; `(state, _) => Err(...)` above the legal transitions makes them unreachable (the compiler warns about it).
      - **Status strings plus separate optional fields** (`status: String`, `tracking: Option<String>`): nothing stops `"shipped"` without a tracking number. Put the data inside the variant.
      - **Validating data in the wrong place.** "Payment must be positive" belongs to the transition that takes the payment, so it's checked exactly when it matters.

      **Your turn:** implement the order workflow. The seed defines `OrderState`, `Event` and `TransitionError` (with thiserror). Write:

      - `OrderState::name()`: `created`, `paid`, `shipped`, `delivered`, `cancelled`; and `Event::name()`: `pay`, `ship`, `deliver`, `cancel`
      - `OrderState::describe()`: `created`, `paid 25.00` (the amount in cents shown with two decimals), `shipped, tracking TRK123`, `delivered`, `cancelled: REASON`
      - `fn apply(state: OrderState, event: Event) -> Result<OrderState, TransitionError>` with these legal transitions: Created + Pay becomes Paid (a payment of 0 is `ZeroPayment`); Paid + Ship becomes Shipped (an empty or all-spaces tracking number is `EmptyTracking`); Shipped + Deliver becomes Delivered; Created or Paid + Cancel becomes Cancelled. Anything else is `NotAllowed { state: state.name(), event: event.name() }`.
    seed: |
