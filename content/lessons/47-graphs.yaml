      }

      #[test]
      fn diagonal_cells_are_separate_islands() {
          assert_eq!(count_islands(&["#.", ".#"]), 2, "count_islands([\"#.\", \".#\"])");
      }

      #[test]
      fn a_winding_island_is_one_island() {
          let map = ["###.", "..#.", "###.", "#..."];
          assert_eq!(count_islands(&map), 1, "count_islands(winding island)");
      }

      #[test]
      fn water_only_and_empty_maps_have_none() {
          assert_eq!(count_islands(&["...", "..."]), 0, "count_islands(all water)");
          assert_eq!(count_islands(&[]), 0, "count_islands([])");
      }

      #[test]
      fn handles_a_700_by_700_map() {
          let land = "#".repeat(700);
          let map: Vec<&str> = (0..700).map(|_| land.as_str()).collect();
          assert_eq!(count_islands(&map), 1, "count_islands(700 by 700 land)");
          let dotted: String = (0..700).map(|c| if c % 2 == 0 { '#' } else { '.' }).collect();
          let water = ".".repeat(700);
          let map: Vec<&str> = (0..700).map(|r| if r % 2 == 0 { dotted.as_str() } else { water.as_str() }).collect();
          assert_eq!(count_islands(&map), 122_500, "count_islands(700 by 700 dots)");
      }
