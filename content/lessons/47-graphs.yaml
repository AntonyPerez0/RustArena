      - task: |
          Write a maze solver. Standard input is a grid, one row per line: `S` is the start, `E` the exit, `#` a wall and `.` open floor. You can move up, down, left or right. Print `shortest path: N steps` with the fewest moves from `S` to `E`, or `no path`.

          Use BFS over the cells with a `VecDeque<((usize, usize), usize)>` of positions and distances, and a `Vec<Vec<bool>>` of visited cells. The lesson's `wrapping_sub` trick handles the edges of the grid.
        seed: |
          use std::collections::VecDeque;
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let grid: Vec<Vec<u8>> = input.lines().filter(|l| !l.is_empty()).map(|l| l.bytes().collect()).collect();
          }
        solution: |
          use std::collections::VecDeque;
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
              let grid: Vec<Vec<u8>> = input.lines().filter(|l| !l.is_empty()).map(|l| l.bytes().collect()).collect();
              let mut start = None;
              for (r, row) in grid.iter().enumerate() {
                  for (c, &cell) in row.iter().enumerate() {
                      if cell == b'S' {
                          start = Some((r, c));
                      }
                  }
              }
              let Some(start) = start else {
                  println!("no path");
                  return;
              };
              let mut seen: Vec<Vec<bool>> = grid.iter().map(|row| vec![false; row.len()]).collect();
              seen[start.0][start.1] = true;
              let mut queue = VecDeque::from([(start, 0)]);
              while let Some(((r, c), d)) = queue.pop_front() {
                  if grid[r][c] == b'E' {
                      println!("shortest path: {d} steps");
                      return;
                  }
                  for (nr, nc) in [(r.wrapping_sub(1), c), (r + 1, c), (r, c.wrapping_sub(1)), (r, c + 1)] {
                      if matches!(grid.get(nr).and_then(|row| row.get(nc)), Some(&cell) if cell != b'#') && !seen[nr][nc] {
                          seen[nr][nc] = true;
                          queue.push_back(((nr, nc), d + 1));
                      }
                  }
              }
              println!("no path");
          }
        require:
          - pattern: 'VecDeque'
            message: Use a `VecDeque` for the BFS queue.
        hints:
