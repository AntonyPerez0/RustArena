        solution: |
          use std::collections::VecDeque;

          struct Node {
              value: i32,
              left: Option<Box<Node>>,
              right: Option<Box<Node>>,
          }

          fn levels(root: &Option<Box<Node>>) -> Vec<Vec<i32>> {
              let mut out = Vec::new();
              let mut queue: VecDeque<&Node> = root.as_deref().into_iter().collect();
              while !queue.is_empty() {
                  let mut row = Vec::new();
                  for _ in 0..queue.len() {
                      if let Some(node) = queue.pop_front() {
                          row.push(node.value);
                          queue.extend(node.left.as_deref());
                          queue.extend(node.right.as_deref());
                      }
                  }
                  out.push(row);
              }
              out
          }
        harness: |
          fn insert(slot: &mut Option<Box<Node>>, value: i32) {
              match slot {
                  None => *slot = Some(Box::new(Node { value, left: None, right: None })),
                  Some(node) => {
                      if value < node.value {
                          insert(&mut node.left, value)
                      } else {
                          insert(&mut node.right, value)
                      }
                  }
              }
          }

          fn tree(values: &[i32]) -> Option<Box<Node>> {
              let mut root = None;
              for &v in values {
                  insert(&mut root, v);
              }
              root
          }

          #[test]
          fn lists_three_levels() {
              assert_eq!(levels(&tree(&[50, 30, 70, 20, 40, 80])), vec![vec![50], vec![30, 70], vec![20, 40, 80]], "levels(50, 30, 70, 20, 40, 80)");
          }

          #[test]
          fn a_line_has_one_value_per_level() {
              assert_eq!(levels(&tree(&[1, 2, 3])), vec![vec![1], vec![2], vec![3]], "levels(1, 2, 3)");
          }

          #[test]
