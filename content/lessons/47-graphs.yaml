      - task: |
          A university wants to know the **minimum number of semesters** to finish `n` courses (`0..n`) when each `(a, b)` means course `a` must be passed in an earlier semester than course `b`, and students can take any number of courses per semester. Write `fn min_semesters(n: usize, prereqs: &[(usize, usize)]) -> Option<usize>` (`None` if a cycle makes it impossible; 0 for no courses).

          Run Kahn's algorithm in **layers**: all courses ready now form one semester; taking them makes the next layer ready. Count the layers. The tests include a chain of 100,000 courses.
        seed: |
          fn min_semesters(n: usize, prereqs: &[(usize, usize)]) -> Option<usize> {
              todo!()
          }
        solution: |
          fn min_semesters(n: usize, prereqs: &[(usize, usize)]) -> Option<usize> {
              let mut next: Vec<Vec<usize>> = vec![Vec::new(); n];
              let mut indegree = vec![0; n];
              for &(a, b) in prereqs {
                  next[a].push(b);
                  indegree[b] += 1;
              }
              let mut layer: Vec<usize> = (0..n).filter(|&c| indegree[c] == 0).collect();
              let mut taken = 0;
              let mut semesters = 0;
              while !layer.is_empty() {
                  semesters += 1;
                  taken += layer.len();
                  let mut next_layer = Vec::new();
                  for &c in &layer {
                      for &d in &next[c] {
                          indegree[d] -= 1;
                          if indegree[d] == 0 {
                              next_layer.push(d);
                          }
                      }
                  }
                  layer = next_layer;
              }
              if taken == n { Some(semesters) } else { None }
          }
        harness: |
          #[test]
          fn counts_layers_of_courses() {
              assert_eq!(min_semesters(4, &[(0, 2), (1, 2), (2, 3)]), Some(3), "min_semesters(4, [(0, 2), (1, 2), (2, 3)])");
          }

          #[test]
          fn the_longest_chain_decides() {
              assert_eq!(min_semesters(5, &[(0, 1), (1, 2), (0, 3), (3, 4), (2, 4)]), Some(4), "min_semesters(5, ...)");
          }

          #[test]
          fn independent_courses_fit_in_one_semester() {
              assert_eq!(min_semesters(3, &[]), Some(1), "min_semesters(3, [])");
              assert_eq!(min_semesters(0, &[]), Some(0), "min_semesters(0, [])");
          }

          #[test]
          fn a_cycle_is_impossible() {
              assert_eq!(min_semesters(3, &[(0, 1), (1, 0), (1, 2)]), None, "min_semesters(3, cycle)");
          }

          #[test]
          fn handles_a_chain_of_100000_courses_quickly() {
              let prereqs: Vec<(usize, usize)> = (0..99_999).map(|i| (i, i + 1)).collect();
              assert_eq!(min_semesters(100_000, &prereqs), Some(100_000), "min_semesters(100000, chain)");
          }
