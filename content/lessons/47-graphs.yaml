          - "Pop a cell; if it's `E`, print its distance and return. Otherwise look at the four neighbors (use `wrapping_sub(1)` for up and left)."
          - "A neighbor is usable if `grid.get(nr).and_then(|row| row.get(nc))` is `Some(&cell)` with `cell != b'#'` and it isn't seen yet. Print `no path` if the queue empties."
        tests:
          - stdin: "S.#.....\n.##.###.\n....#...\n.##...#E\n"
            expect: "shortest path: 12 steps"
          - stdin: "S.#\n###\n..E\n"
            hidden: true
          - stdin: "S...#.........#..........\n###.#.#######.#.########.\n#...#.#.....#.#.#......#.\n#.###.#.###.#.#.#.####.#.\n#.....#...#.#...#.#..#.#.\n#######.#.#.#####.#.##.#.\n#.......#.#.......#....#.\n#.#######.#########.####.\n#.#.......#.........#....\n#.#.#####.#.#########..##\n#...#.....#..........#..E\n#####.###############...#\n"
            hidden: true
          - stdin: "SE\n"
            hidden: true
      - task: |
          Showing *how many* hops isn't enough for the network team; they want the route itself. Write `fn shortest_route(adj: &[Vec<usize>], from: usize, to: usize) -> Option<Vec<usize>>` that returns the nodes of a shortest path from `from` to `to`, both included (`[from]` when they're equal), or `None`. In every test the shortest path is unique.

          During BFS, record each node's **parent**: the node you were at when you first discovered it (`parent: Vec<Option<usize>>`). When you reach `to`, follow the parents back to `from` and reverse the list.
        seed: |
          use std::collections::VecDeque;

          fn shortest_route(adj: &[Vec<usize>], from: usize, to: usize) -> Option<Vec<usize>> {
              todo!()
          }
        solution: |
          use std::collections::VecDeque;

          fn shortest_route(adj: &[Vec<usize>], from: usize, to: usize) -> Option<Vec<usize>> {
              let mut parent: Vec<Option<usize>> = vec![None; adj.len()];
              let mut seen = vec![false; adj.len()];
              let mut queue = VecDeque::from([from]);
              seen[from] = true;
              while let Some(u) = queue.pop_front() {
                  if u == to {
                      let mut route = vec![to];
                      let mut cur = to;
                      while let Some(p) = parent[cur] {
                          route.push(p);
                          cur = p;
                      }
                      route.reverse();
                      return Some(route);
                  }
                  for &v in &adj[u] {
                      if !seen[v] {
                          seen[v] = true;
                          parent[v] = Some(u);
                          queue.push_back(v);
                      }
                  }
              }
              None
          }
        harness: |
          #[test]
          fn returns_the_route() {
              let adj = vec![vec![1, 2], vec![3], vec![4], vec![5], vec![], vec![]];
              assert_eq!(shortest_route(&adj, 0, 5), Some(vec![0, 1, 3, 5]), "shortest_route(graph, 0, 5)");
          }

          #[test]
          fn takes_the_shortcut() {
              let adj = vec![vec![1, 4], vec![2], vec![3], vec![], vec![3]];
              assert_eq!(shortest_route(&adj, 0, 3), Some(vec![0, 4, 3]), "shortest_route(graph, 0, 3)");
          }

          #[test]
          fn the_route_to_yourself_is_just_you() {
              let adj = vec![vec![1], vec![]];
              assert_eq!(shortest_route(&adj, 1, 1), Some(vec![1]), "shortest_route(graph, 1, 1)");
          }

          #[test]
          fn no_route_gives_none() {
              let adj = vec![vec![1], vec![], vec![0]];
              assert_eq!(shortest_route(&adj, 0, 2), None, "shortest_route(graph, 0, 2)");
          }

          #[test]
          fn finds_a_long_route_quickly() {
              let n = 100_000;
              let adj: Vec<Vec<usize>> = (0..n).map(|i| if i + 1 < n { vec![i + 1] } else { vec![] }).collect();
              let route = shortest_route(&adj, 0, n - 1).unwrap();
              assert_eq!(route.len(), n, "length of the route along a 100,000-node chain");
              assert_eq!(route[50_000], 50_000, "route[50000]");
          }
        hints:
          - "Next to `seen`, keep `parent = vec![None; adj.len()]`. When you discover `v` from `u`, set `parent[v] = Some(u)`."
          - "When you pop `to`, start a Vec with `to` and follow `while let Some(p) = parent[cur]`, pushing each parent."
          - "The list is backwards (from `to` to `from`): call `.reverse()` before returning it."

  - title: "Depth-first search: recursion and an explicit stack"
    id: graphs-3
    text: |
      **Depth-first search** (DFS) goes as deep as it can along one path, and only when it gets stuck does it back up and try the next branch. It's the natural way to ask "what can I reach from here?", to count separate groups (**connected components**), to detect cycles, to flood-fill a region of a map, and it's the basis of topological sorting.

      Recursion expresses it directly: visit a node, then recursively visit each unvisited neighbor.

      ```rust run
      fn explore(u: usize, adj: &[Vec<usize>], seen: &mut [bool], members: &mut Vec<usize>) {
          seen[u] = true;
          members.push(u);
          for &v in &adj[u] {
              if !seen[v] {
                  explore(v, adj, seen, members);
              }
          }
      }

      fn main() {
          // friendships: 0-1, 1-2, 3-4, and 5 knows nobody
          let adj = vec![vec![1], vec![0, 2], vec![1], vec![4], vec![3], vec![]];
          let mut seen = vec![false; adj.len()];
          for start in 0..adj.len() {
              if !seen[start] {
                  let mut members = Vec::new();
                  explore(start, &adj, &mut seen, &mut members);
                  println!("group: {members:?}");
              }
          }
      }
      ```

      ```output
      group: [0, 1, 2]
      group: [3, 4]
      group: [5]
      ```

      The outer loop starts a new DFS from every node not seen yet; each DFS marks one whole component. Every node and edge is handled once: O(V + E).

      ### The same thing with a stack

      Recursion depth equals the length of the path DFS is following. On a long chain or a big grid that can be hundreds of thousands of calls deep, and the program dies with `thread 'main' has overflowed its stack`. The fix is to keep your own stack in a `Vec`, which lives on the heap and can grow as needed:

      ```rust run
      fn reachable(adj: &[Vec<usize>], start: usize) -> Vec<usize> {
          let mut seen = vec![false; adj.len()];
          let mut stack = vec![start];
          let mut order = Vec::new();
          while let Some(u) = stack.pop() {
              if seen[u] {
                  continue; // pushed twice before we got to it
              }
              seen[u] = true;
              order.push(u);
              for &v in adj[u].iter().rev() {
                  if !seen[v] {
                      stack.push(v);
                  }
              }
          }
          order
      }

      fn main() {
          let adj = vec![vec![1, 3], vec![2], vec![], vec![4], vec![]];
          println!("{:?}", reachable(&adj, 0));
      }
      ```

      ```output
      [0, 1, 2, 3, 4]
      ```

      Pushing the neighbors in reverse makes the stack pop them in their original order, so the visiting order matches the recursive version. Here a node can sit on the stack more than once, so it's checked when popped (`continue` if already seen).

      ### Common mistakes

      - **Forgetting the visited check** in a graph with cycles: the search goes around forever.
      - **Recursive DFS on huge inputs.** Fine for trees and small graphs; for a 1,000 by 1,000 grid, use an explicit stack.
      - **Expecting shortest paths from DFS.** DFS finds *a* path; BFS finds the shortest.

      **Your turn:** count the islands on a map. Write `fn count_islands(map: &[&str]) -> usize` where each string is a row, `#` is land and `.` is water. Land cells that touch up, down, left or right belong to the same island. Use DFS with an **explicit stack** (`Vec<(usize, usize)>`): the tests include a 700 by 700 map that is all land, where recursion would overflow the stack.
    seed: |
      fn count_islands(map: &[&str]) -> usize {
          todo!()
      }
    solution: |
      fn count_islands(map: &[&str]) -> usize {
          let grid: Vec<&[u8]> = map.iter().map(|row| row.as_bytes()).collect();
          let mut seen: Vec<Vec<bool>> = grid.iter().map(|row| vec![false; row.len()]).collect();
          let mut islands = 0;
          for r in 0..grid.len() {
              for c in 0..grid[r].len() {
                  if grid[r][c] != b'#' || seen[r][c] {
                      continue;
                  }
                  islands += 1;
                  seen[r][c] = true;
                  let mut stack = vec![(r, c)];
                  while let Some((y, x)) = stack.pop() {
                      for (ny, nx) in [(y.wrapping_sub(1), x), (y + 1, x), (y, x.wrapping_sub(1)), (y, x + 1)] {
                          let land = matches!(grid.get(ny).and_then(|row| row.get(nx)), Some(&b'#'));
                          if land && !seen[ny][nx] {
                              seen[ny][nx] = true;
                              stack.push((ny, nx));
                          }
                      }
                  }
              }
          }
          islands
      }
    hints:
      - "Turn each row into bytes (`row.as_bytes()`) and keep a `Vec<Vec<bool>>` of visited cells."
      - "Scan every cell. An unvisited `#` starts a new island: count it, mark it, and push it onto a `Vec` stack."
      - "While the stack isn't empty, pop a cell and push each unvisited land neighbor (marking it as you push). The `wrapping_sub(1)` and `grid.get(...)` trick from the BFS step handles the edges."
