              assert_eq!(levels(&tree(&[7])), vec![vec![7]], "levels(7)");
          }

          #[test]
          fn an_empty_tree_has_no_levels() {
              assert_eq!(levels(&None), Vec::<Vec<i32>>::new(), "levels(empty)");
          }
