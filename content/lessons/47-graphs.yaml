    solution: |
      struct UnionFind {
          parent: Vec<usize>,
          size: Vec<usize>,
          groups: usize,
      }

      impl UnionFind {
          fn new(n: usize) -> Self {
              UnionFind { parent: (0..n).collect(), size: vec![1; n], groups: n }
          }

          fn find(&mut self, x: usize) -> usize {
              let mut root = x;
              while self.parent[root] != root {
                  root = self.parent[root];
              }
              let mut cur = x;
              while self.parent[cur] != root {
                  let next = self.parent[cur];
                  self.parent[cur] = root;
                  cur = next;
              }
              root
          }

          fn union(&mut self, a: usize, b: usize) -> bool {
              let (mut ra, mut rb) = (self.find(a), self.find(b));
              if ra == rb {
                  return false;
              }
              if self.size[ra] < self.size[rb] {
                  std::mem::swap(&mut ra, &mut rb);
              }
              self.parent[rb] = ra;
              self.size[ra] += self.size[rb];
              self.groups -= 1;
              true
          }

          fn group_count(&self) -> usize {
              self.groups
          }

          fn group_size(&mut self, x: usize) -> usize {
              let root = self.find(x);
              self.size[root]
          }
      }
    hints:
      - "`new`: `parent: (0..n).collect()`, `size: vec![1; n]`, `groups: n`."
      - "`find`: first walk up to the root; then walk the path again, setting each node's parent to the root. `union`: find both roots, return `false` if equal, otherwise hang the smaller under the bigger, add the sizes, and decrease `groups`."
      - "`group_size(x)` is `self.size[self.find(x)]` (compute the root first, into a variable)."
    harness: |
      #[test]
      fn everyone_starts_alone() {
          let mut uf = UnionFind::new(4);
          assert_eq!(uf.group_count(), 4, "group_count() of 4 new elements");
          assert_eq!(uf.group_size(2), 1, "group_size(2)");
          assert_eq!(uf.find(3), 3, "find(3)");
      }

      #[test]
      fn union_merges_groups() {
          let mut uf = UnionFind::new(5);
          assert_eq!(uf.union(0, 1), true, "union(0, 1)");
          assert_eq!(uf.union(3, 4), true, "union(3, 4)");
          assert_eq!(uf.union(1, 2), true, "union(1, 2)");
          assert_eq!(uf.find(0) == uf.find(2), true, "0 and 2 are together");
          assert_eq!(uf.find(0) == uf.find(4), false, "0 and 4 are apart");
          assert_eq!(uf.group_count(), 2, "group_count()");
          assert_eq!(uf.group_size(2), 3, "group_size(2)");
      }

      #[test]
      fn union_within_a_group_returns_false() {
          let mut uf = UnionFind::new(3);
          uf.union(0, 1);
          uf.union(1, 2);
          assert_eq!(uf.union(0, 2), false, "union(0, 2) when already connected");
          assert_eq!(uf.group_count(), 1, "group_count()");
      }

      #[test]
      fn merges_200000_elements_quickly() {
          let n = 200_000;
          let mut uf = UnionFind::new(n);
          for i in 1..n {
              uf.union(0, i);
          }
          assert_eq!(uf.group_count(), 1, "group_count() after joining everything to 0");
          let mut same = 0;
          for i in 0..n {
              if uf.find(i) == uf.find(0) {
                  same += 1;
              }
          }
          assert_eq!(same, n, "elements in 0's group");
          assert_eq!(uf.group_size(123_456), n, "group_size(123456)");
          let mut chain = UnionFind::new(n);
          for i in 0..n - 1 {
              chain.union(i + 1, i);
          }
          assert_eq!(chain.group_size(0), n, "group_size(0) of a chain");
      }
