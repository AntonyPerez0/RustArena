          Build the route planner for a delivery company. Standard input starts with a line `FROM TO`, followed by roads, one per line: `CITY CITY MINUTES` (roads go both ways). Print the cheapest route as the cities joined by ` -> ` with the total in parentheses, like `Aston -> Cobb -> Bree (8)`, or `no route`. If `FROM` and `TO` are the same city, print just that city with `(0)`. In every test the cheapest route is unique.

          Give each city an index with a `HashMap<String, usize>` and keep the names in a `Vec<String>`. Run Dijkstra with a **parent** array, as you did for BFS routes, and walk it back from `TO`.
        seed: |
          use std::cmp::Reverse;
          use std::collections::{BinaryHeap, HashMap};
          use std::io::{self, Read};

          fn main() {
              let mut input = String::new();
              io::stdin().read_to_string(&mut input).expect("read error");
