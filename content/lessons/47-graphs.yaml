          Build adjacency lists from the links, run Dijkstra from `source`, then take the maximum distance.
        seed: |
          use std::cmp::Reverse;
          use std::collections::BinaryHeap;

          fn time_to_reach_all(n: usize, links: &[(usize, usize, u64)], source: usize) -> Option<u64> {
