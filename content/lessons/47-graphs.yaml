          use std::collections::{BTreeMap, BTreeSet};
          use std::io::{self, BufRead};

          fn print_tree(name: &str, depth: usize, children: &BTreeMap<String, BTreeSet<String>>) {
              println!("{}{name}", "  ".repeat(depth));
              if let Some(kids) = children.get(name) {
                  for kid in kids {
                      print_tree(kid, depth + 1, children);
                  }
              }
          }

          fn main() {
              let mut lines = io::stdin().lock().lines().map(|l| l.expect("read error"));
              let root = lines.next().unwrap_or_default();
              let mut children: BTreeMap<String, BTreeSet<String>> = BTreeMap::new();
              for line in lines {
                  let mut parts = line.split_whitespace();
                  if let (Some(parent), Some(child)) = (parts.next(), parts.next()) {
                      children.entry(parent.to_string()).or_default().insert(child.to_string());
                  }
              }
              print_tree(root.trim(), 0, &children);
          }
