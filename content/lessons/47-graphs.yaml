          assert_eq!(build_order(5, &[(0, 1), (1, 2), (0, 3), (2, 4), (3, 4)]), Some(vec![0, 1, 2, 3, 4]), "build_order(5, pipeline)");
      }

      #[test]
      fn takes_the_smallest_ready_task_first() {
          assert_eq!(build_order(3, &[(2, 0)]), Some(vec![1, 2, 0]), "build_order(3, [(2, 0)])");
          assert_eq!(build_order(4, &[(3, 1), (2, 1)]), Some(vec![0, 2, 3, 1]), "build_order(4, [(3, 1), (2, 1)])");
      }

      #[test]
      fn independent_tasks_run_in_number_order() {
          assert_eq!(build_order(3, &[]), Some(vec![0, 1, 2]), "build_order(3, [])");
      }

      #[test]
      fn detects_cycles() {
          assert_eq!(build_order(3, &[(0, 1), (1, 2), (2, 0)]), None, "build_order(3, cycle)");
          assert_eq!(build_order(2, &[(1, 1)]), None, "build_order(2, [(1, 1)])");
      }

      #[test]
      fn orders_200000_tasks_quickly() {
          let n = 200_000;
          let deps: Vec<(usize, usize)> = (0..n - 1).rev().map(|i| (i, i + 1)).collect();
          let order = build_order(n, &deps).unwrap();
          assert_eq!(order.len(), n, "number of tasks in the order");
          assert_eq!((order[0], order[n - 1]), (0, n - 1), "first and last task");
      }
