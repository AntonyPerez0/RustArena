id: graphs
title: Graphs and Trees
phase: "Algorithms and data structures"
summary: Model networks, dependencies and maps as graphs. Adjacency lists, BFS for shortest hops, DFS with recursion or a stack, topological sort, Dijkstra with a BinaryHeap, binary trees with Option<Box<Node>>, and union-find.
roadmap: [Graphs, Trees, BFS, DFS, Shortest Path]
steps:
  - title: "Representing graphs: adjacency lists"
    id: graphs-1
    text: |
      A **graph** is a set of **nodes** (also called vertices) connected by **edges**. Edges can be **directed** (one-way: "A depends on B", "A follows B", a link from page A to page B) or **undirected** (two-way: a friendship, a road, a network cable), and **weighted** (a distance, a cost, a latency) or not.

      Graphs are everywhere at work even when nobody calls them that: build dependencies, microservice call chains, org charts, permission inheritance, routes between warehouses, the states of an order.

      ### Storing a graph

      Number the nodes `0..n` and keep, for every node, the list of its neighbors: an **adjacency list**, `Vec<Vec<usize>>`. `adj[u]` lists every `v` with an edge `u -> v`. Memory is O(V + E) (nodes plus edges), and walking a node's neighbors is as fast as it gets. It's the default choice.

      Input usually arrives as an **edge list**, pairs of nodes. Turning it into adjacency lists:

      ```rust run
      fn main() {
          // 5 stations, undirected tracks between them
          let n = 5;
          let tracks = [(0, 1), (0, 2), (1, 3), (2, 3), (3, 4)];
          let mut adj: Vec<Vec<usize>> = vec![Vec::new(); n];
          for &(a, b) in &tracks {
              adj[a].push(b);
              adj[b].push(a); // undirected: the edge goes both ways
          }
          for (station, neighbors) in adj.iter().enumerate() {
              println!("{station}: {neighbors:?} (degree {})", neighbors.len());
          }
      }
      ```

      ```output
      0: [1, 2] (degree 2)
      1: [0, 3] (degree 2)
      2: [0, 3] (degree 2)
      3: [1, 2, 4] (degree 3)
      4: [3] (degree 1)
      ```

      The **degree** of a node is its number of edges. In a directed graph you count **out-degree** (edges leaving) and **in-degree** (edges arriving) separately.

      The alternatives:

      - An **adjacency matrix** `Vec<Vec<bool>>` of size n by n answers "is there an edge u-v?" in O(1), but uses O(V²) memory: 100,000 nodes would need 10 billion cells. Only for small, dense graphs.
      - **Named nodes**: give each name an index with a `HashMap<String, usize>` (and a `Vec<String>` to go back), then use adjacency lists of indices. For small graphs, a `BTreeMap<String, BTreeSet<String>>` directly is fine and prints in a stable order.

      ### Why indices and not references?

      In other languages a node might hold pointers to its neighbors. In Rust, nodes holding `&Node` references to each other fight the borrow checker (graphs have cycles, and who would own whom?). `Rc<RefCell<Node>>` works but is clumsy. Storing nodes in a `Vec` and referring to them by **index** is the idiomatic Rust approach, used by real crates like `petgraph`.

      ### Common mistakes

      - **Forgetting the reverse edge** in an undirected graph, so you can travel A to B but not back.
      - **1-based ids from the input.** If nodes are numbered 1 to n, either subtract 1 or make the Vec `n + 1` long; otherwise `adj[n]` panics with `index out of bounds`.
      - **Duplicate edges and self-loops** (`(2, 2)`). Decide what they mean; many algorithms assume there are none.

      **Your turn:** write `fn build_graph(n: usize, edges: &[(usize, usize)]) -> Vec<Vec<usize>>` for an **undirected** graph with nodes `0..n`. Clean the data while you're at it: each neighbor list must be sorted ascending with no duplicates (the same edge may appear twice, in either direction). A self-loop `(a, a)` makes `a` appear once in its own list.
    seed: |
      fn build_graph(n: usize, edges: &[(usize, usize)]) -> Vec<Vec<usize>> {
          todo!()
      }
    solution: |
      fn build_graph(n: usize, edges: &[(usize, usize)]) -> Vec<Vec<usize>> {
          let mut adj: Vec<Vec<usize>> = vec![Vec::new(); n];
          for &(a, b) in edges {
              adj[a].push(b);
              adj[b].push(a);
          }
          for neighbors in &mut adj {
              neighbors.sort_unstable();
              neighbors.dedup();
          }
          adj
      }
    hints:
      - "Start with `vec![Vec::new(); n]` and push each edge both ways."
      - "Afterwards, loop over `&mut adj` and clean every list."
      - "`neighbors.sort_unstable();` puts equal values next to each other, so `neighbors.dedup();` can then remove the repeats."
    harness: |
      #[test]
      fn builds_the_station_graph() {
          let adj = build_graph(5, &[(0, 1), (0, 2), (1, 3), (2, 3), (3, 4)]);
          assert_eq!(adj, vec![vec![1, 2], vec![0, 3], vec![0, 3], vec![1, 2, 4], vec![3]], "build_graph(5, stations)");
      }

      #[test]
      fn sorts_each_neighbor_list() {
          let adj = build_graph(4, &[(0, 3), (0, 1), (0, 2)]);
          assert_eq!(adj[0], vec![1, 2, 3], "neighbors of 0");
      }

      #[test]
      fn removes_duplicate_edges() {
          let adj = build_graph(2, &[(0, 1), (1, 0), (0, 1)]);
          assert_eq!(adj, vec![vec![1], vec![0]], "build_graph(2, [(0, 1), (1, 0), (0, 1)])");
      }

      #[test]
      fn keeps_isolated_nodes_and_self_loops() {
          let adj = build_graph(3, &[(1, 1)]);
          assert_eq!(adj, vec![vec![], vec![1], vec![]], "build_graph(3, [(1, 1)])");
      }

      #[test]
      fn an_empty_graph_has_no_lists() {
          assert_eq!(build_graph(0, &[]), Vec::<Vec<usize>>::new(), "build_graph(0, [])");
      }
    more:
      - task: |
          A social app wants to find the **hub** of a group of `n` people (numbered `0..n`): the person whom **everyone else** follows, but who follows **nobody**. Each pair `(a, b)` in `follows` means `a` follows `b` (no pair appears twice, nobody follows themselves). Write `fn find_hub(n: usize, follows: &[(usize, usize)]) -> Option<usize>`. In a group of one, that person is the hub.

          You don't need adjacency lists for this: count each person's **in-degree** and **out-degree** in two `Vec<usize>`s. The hub has in-degree `n - 1` and out-degree 0. The tests include 100,000 people.
        seed: |
          fn find_hub(n: usize, follows: &[(usize, usize)]) -> Option<usize> {
              todo!()
          }
        solution: |
          fn find_hub(n: usize, follows: &[(usize, usize)]) -> Option<usize> {
              let mut followers = vec![0; n];
              let mut following = vec![0; n];
              for &(a, b) in follows {
                  following[a] += 1;
                  followers[b] += 1;
              }
              (0..n).find(|&p| followers[p] == n - 1 && following[p] == 0)
          }
        harness: |
          #[test]
          fn finds_the_hub() {
              assert_eq!(find_hub(3, &[(0, 2), (1, 2)]), Some(2), "find_hub(3, [(0, 2), (1, 2)])");
          }

          #[test]
          fn a_hub_follows_nobody() {
              assert_eq!(find_hub(3, &[(0, 2), (1, 2), (2, 0)]), None, "find_hub(3, [(0, 2), (1, 2), (2, 0)])");
          }

          #[test]
          fn everyone_must_follow_the_hub() {
              assert_eq!(find_hub(4, &[(0, 3), (1, 3)]), None, "find_hub(4, [(0, 3), (1, 3)])");
          }

          #[test]
          fn a_group_of_one_is_its_own_hub() {
              assert_eq!(find_hub(1, &[]), Some(0), "find_hub(1, [])");
              assert_eq!(find_hub(2, &[]), None, "find_hub(2, [])");
          }

          #[test]
          fn finds_the_hub_of_100000_people_quickly() {
              let follows: Vec<(usize, usize)> = (0..100_000).filter(|&p| p != 4242).map(|p| (p, 4242)).collect();
              assert_eq!(find_hub(100_000, &follows), Some(4242), "find_hub(100000, everyone follows 4242)");
          }
        hints:
          - "Make two counters, `vec![0; n]` each: how many follow each person, and how many each person follows."
          - "For each `(a, b)`: `following[a] += 1; followers[b] += 1;`"
          - "`(0..n).find(|&p| followers[p] == n - 1 && following[p] == 0)`"
      - task: |
          The friends page needs each person's friend list. Standard input has one friendship per line, two names separated by a space (`ana ben` means they're friends with each other). Print every person in alphabetical order with their friends, alphabetically, separated by `, `:

          ```
          ana: ben, cy
          ben: ana
          cy: ana
          ```

          Use a `BTreeMap<String, BTreeSet<String>>` as the adjacency list: the BTree types keep both levels sorted, and a set ignores repeated friendships. Skip blank lines.
        seed: |
          use std::io::{self, BufRead};

          fn main() {
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
              }
          }
        solution: |
          use std::collections::{BTreeMap, BTreeSet};
          use std::io::{self, BufRead};

          fn main() {
              let mut friends: BTreeMap<String, BTreeSet<String>> = BTreeMap::new();
              for line in io::stdin().lock().lines() {
                  let line = line.expect("read error");
                  let mut parts = line.split_whitespace();
                  if let (Some(a), Some(b)) = (parts.next(), parts.next()) {
                      friends.entry(a.to_string()).or_default().insert(b.to_string());
                      friends.entry(b.to_string()).or_default().insert(a.to_string());
                  }
              }
              for (person, list) in &friends {
                  let names: Vec<&str> = list.iter().map(|s| s.as_str()).collect();
                  println!("{person}: {}", names.join(", "));
              }
          }
        require:
          - pattern: 'BTreeMap'
            message: Keep the people in a `BTreeMap` so they print in alphabetical order.
        hints:
          - "For each line, insert the friendship both ways: `friends.entry(a.to_string()).or_default().insert(b.to_string());` and the same with `a` and `b` swapped."
          - "Loop over `&friends`; each value is a `BTreeSet<String>` that is already sorted."
          - "Collect the friend names into a `Vec<&str>` and `join(\", \")`."
        tests:
          - stdin: "ana ben\ncy ana\n"
            expect: "ana: ben, cy\nben: ana\ncy: ana"
          - stdin: "zoe max\nmax ivy\n\nzoe ivy\nmax zoe\n"
            hidden: true
          - stdin: "solo duo\n"
            hidden: true

  - title: Breadth-first search with VecDeque
    id: graphs-2
    text: |
      **Breadth-first search** (BFS) explores a graph in **layers**: first the start node, then every node one edge away, then every node two edges away, and so on, like ripples in a pond. To visit nodes in that order it uses a FIFO queue, a `VecDeque`.

      Because it goes layer by layer, the first time BFS reaches a node it got there with the **fewest possible edges**. So in an unweighted graph BFS finds **shortest paths** (fewest hops): the fewest network hops between servers, the fewest moves in a puzzle, the "degrees of separation" between two people.

      ```rust run
      use std::collections::VecDeque;

      fn bfs(adj: &[Vec<usize>], start: usize) -> Vec<Option<usize>> {
          let mut dist = vec![None; adj.len()];
          let mut queue = VecDeque::new();
          dist[start] = Some(0);
          queue.push_back((start, 0));
          while let Some((u, d)) = queue.pop_front() {
              for &v in &adj[u] {
                  if dist[v].is_none() {
                      dist[v] = Some(d + 1); // mark when you push, not when you pop
                      queue.push_back((v, d + 1));
                  }
              }
          }
          dist
      }

      fn main() {
          // the stations from the last step, plus station 5 with no tracks
          let adj = vec![vec![1, 2], vec![0, 3], vec![0, 3], vec![1, 2, 4], vec![3], vec![]];
          for (station, d) in bfs(&adj, 0).iter().enumerate() {
              match d {
                  Some(hops) => println!("station {station}: distance {hops}"),
                  None => println!("station {station}: unreachable"),
              }
          }
      }
      ```

      ```output
      station 0: distance 0
      station 1: distance 1
      station 2: distance 1
      station 3: distance 2
      station 4: distance 3
      station 5: unreachable
      ```

      - `dist` doubles as the "visited" marker: `None` means not reached yet.
      - Each node enters the queue at most once and each edge is looked at once (twice when undirected): **O(V + E)**.

      ### Grids are graphs too

      In a maze or a map, every open cell is a node and its neighbors are the cells up, down, left and right. You don't build adjacency lists; you compute the neighbors on the fly. With `usize` coordinates, `r - 1` panics at row 0, so a common trick is `r.wrapping_sub(1)`: at 0 it wraps around to a huge number, which then fails the bounds check (`grid.get(r)` returns `None`) like any other off-grid cell.

      ```rust
      for (nr, nc) in [(r.wrapping_sub(1), c), (r + 1, c), (r, c.wrapping_sub(1)), (r, c + 1)] {
          if matches!(grid.get(nr).and_then(|row| row.get(nc)), Some(&cell) if cell != b'#') {
              // (nr, nc) is an open neighbor
          }
      }
      ```

      ### Common mistakes

      - **Marking visited when popping instead of when pushing.** A node can then be pushed many times (once per neighbor that sees it) before it's popped. Results may still be right, but the queue can blow up on dense graphs.
      - **A Vec with `remove(0)` as the queue.** O(n) per pop, O(V²) overall.
      - **DFS for shortest paths.** Depth-first search finds *a* path, not the shortest one.
      - **Weighted edges.** BFS counts edges. When edges have different costs, you need Dijkstra (later in this module).

      **Your turn:** write `fn shortest_hops(adj: &[Vec<usize>], from: usize, to: usize) -> Option<usize>`: the fewest edges on a path from `from` to `to` in a directed graph given as adjacency lists, or `None` if `to` can't be reached (`Some(0)` when `from == to`). The tests include a graph of 200,000 nodes.
    seed: |
      use std::collections::VecDeque;

      fn shortest_hops(adj: &[Vec<usize>], from: usize, to: usize) -> Option<usize> {
          todo!()
      }
    solution: |
      use std::collections::VecDeque;

      fn shortest_hops(adj: &[Vec<usize>], from: usize, to: usize) -> Option<usize> {
          let mut seen = vec![false; adj.len()];
          let mut queue = VecDeque::new();
          seen[from] = true;
          queue.push_back((from, 0));
          while let Some((u, d)) = queue.pop_front() {
              if u == to {
                  return Some(d);
              }
              for &v in &adj[u] {
                  if !seen[v] {
                      seen[v] = true;
                      queue.push_back((v, d + 1));
                  }
              }
          }
          None
      }
    require:
      - pattern: 'VecDeque'
        message: Use a `VecDeque` as the BFS queue.
    hints:
      - "Keep `seen = vec![false; adj.len()]` and a `VecDeque` of `(node, distance)` pairs, starting with `(from, 0)`."
      - "Pop from the front. If it's `to`, return its distance. Otherwise push every unseen neighbor with `d + 1`, marking it seen as you push."
      - "If the queue runs empty, `to` is unreachable: `None`."
    harness: |
      fn stations() -> Vec<Vec<usize>> {
          vec![vec![1, 2], vec![0, 3], vec![0, 3], vec![1, 2, 4], vec![3], vec![]]
      }

      #[test]
      fn finds_the_fewest_hops() {
          assert_eq!(shortest_hops(&stations(), 0, 4), Some(3), "shortest_hops(stations, 0, 4)");
          assert_eq!(shortest_hops(&stations(), 2, 1), Some(2), "shortest_hops(stations, 2, 1)");
      }

      #[test]
      fn the_start_is_zero_hops_away() {
          assert_eq!(shortest_hops(&stations(), 3, 3), Some(0), "shortest_hops(stations, 3, 3)");
      }

      #[test]
      fn unreachable_nodes_give_none() {
          assert_eq!(shortest_hops(&stations(), 0, 5), None, "shortest_hops(stations, 0, 5)");
      }

      #[test]
      fn follows_edge_directions() {
          let adj = vec![vec![1], vec![2], vec![]];
          assert_eq!(shortest_hops(&adj, 0, 2), Some(2), "shortest_hops(0->1->2, 0, 2)");
          assert_eq!(shortest_hops(&adj, 2, 0), None, "shortest_hops(0->1->2, 2, 0)");
      }

      #[test]
      fn searches_200000_nodes_quickly() {
          let n = 200_000;
          let mut adj = vec![Vec::new(); n];
          for i in 0..n - 1 {
              adj[i].push(i + 1);
              adj[i + 1].push(i);
          }
          for i in 0..n - 1000 {
              adj[i].push(i + 1000);
              adj[i + 1000].push(i);
          }
          assert_eq!(shortest_hops(&adj, 0, n - 1), Some(201), "shortest_hops(200,000 nodes, 0, 199999)");
          assert_eq!(shortest_hops(&adj, 0, 123_456), Some(579), "shortest_hops(200,000 nodes, 0, 123456)");
      }
