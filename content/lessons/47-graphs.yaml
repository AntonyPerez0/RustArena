          Someone hand-edited a tree in a data file. Write `fn is_valid_bst(root: &Option<Box<Node>>) -> bool` that checks the BST rule: every value in a node's left subtree is **smaller** than the node and every value in its right subtree is **bigger** (no duplicates).

          Checking only each node against its direct children isn't enough: in the tree with root 10, left child 5 and 5's right child 12, every parent-child pair looks fine, but 12 is in 10's left subtree. Instead, pass down the allowed range: a recursive helper takes `low: Option<i32>` and `high: Option<i32>`, the bounds every value in this subtree must stay strictly between.
        seed: |
          struct Node {
              value: i32,
              left: Option<Box<Node>>,
              right: Option<Box<Node>>,
          }

          fn is_valid_bst(root: &Option<Box<Node>>) -> bool {
              todo!()
          }
        solution: |
          struct Node {
              value: i32,
              left: Option<Box<Node>>,
              right: Option<Box<Node>>,
          }

          fn within(slot: &Option<Box<Node>>, low: Option<i32>, high: Option<i32>) -> bool {
              let Some(node) = slot else {
                  return true;
              };
              if low.is_some_and(|l| node.value <= l) || high.is_some_and(|h| node.value >= h) {
                  return false;
              }
              within(&node.left, low, Some(node.value)) && within(&node.right, Some(node.value), high)
          }

          fn is_valid_bst(root: &Option<Box<Node>>) -> bool {
              within(root, None, None)
          }
        harness: |
          fn n(value: i32, left: Option<Box<Node>>, right: Option<Box<Node>>) -> Option<Box<Node>> {
              Some(Box::new(Node { value, left, right }))
          }

          fn leaf(value: i32) -> Option<Box<Node>> {
              n(value, None, None)
          }

          #[test]
          fn accepts_a_valid_tree() {
              let t = n(50, n(30, leaf(20), leaf(40)), n(70, leaf(60), leaf(80)));
              assert_eq!(is_valid_bst(&t), true, "is_valid_bst(50 / 30 70 / 20 40 60 80)");
          }

          #[test]
          fn rejects_a_child_on_the_wrong_side() {
              let t = n(10, leaf(15), None);
              assert_eq!(is_valid_bst(&t), false, "is_valid_bst(10 with left child 15)");
          }

          #[test]
          fn rejects_a_grandchild_outside_the_range() {
              let t = n(10, n(5, None, leaf(12)), None);
              assert_eq!(is_valid_bst(&t), false, "is_valid_bst(10 / 5 / right 12)");
          }

          #[test]
          fn rejects_duplicates() {
              let t = n(10, leaf(10), None);
              assert_eq!(is_valid_bst(&t), false, "is_valid_bst(10 with left child 10)");
          }

          #[test]
          fn accepts_empty_and_single_trees() {
              assert_eq!(is_valid_bst(&None), true, "is_valid_bst(empty)");
              assert_eq!(is_valid_bst(&leaf(i32::MIN)), true, "is_valid_bst(single i32::MIN)");
          }
