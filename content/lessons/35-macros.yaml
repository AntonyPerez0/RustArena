          - "The enum body repeats the variants with commas: `enum $name { $( $variant ),* }`."
          - "In `as_str`, one match arm per variant: `$( $name::$variant => stringify!($variant), )*`."
          - "`all()` is `vec![$( $name::$variant ),*]`."

  - title: Recursive macros
    id: macros-4
    text: |
      A macro can call **itself** in its expansion. Each call peels off part of the input until a base rule matches, just like a recursive function. This is how you handle input that repetition alone can't, such as combining values pairwise.

      ```rust run
      macro_rules! count {
          () => { 0usize };
          ($head:expr $(, $tail:expr)*) => { 1usize + count!($($tail),*) };
      }

      fn main() {
          println!("{}", count!());
          println!("{}", count!(7));
          println!("{}", count!("a", "b", "c"));
      }
      ```

      ```output
      0
      1
      3
      ```

      Expanding `count!("a", "b", "c")` by hand:

      ```text
      count!("a", "b", "c")
      1usize + count!("b", "c")
      1usize + 1usize + count!("c")
      1usize + 1usize + 1usize + count!()
      1usize + 1usize + 1usize + 0usize
      ```

      All of this happens at compile time; the program just contains the sum (which the optimizer folds to `3`). Two rules matter, like in any recursion: a **base case** (`()`) and a step that makes the input **smaller**.

      ### Accumulators and internal rules

      Recursing "first value, then the rest" builds the result from the **right**. For subtraction that's the wrong grouping. The fix is an **accumulator**: carry the result so far through the recursive calls. Rules that start with a marker like `@acc` are **internal rules**, a naming convention for helper rules that callers aren't meant to use.

      ```rust run
      // Right to left: 100 - (20 - 5)
      macro_rules! sub_right {
          ($x:expr) => { $x };
          ($x:expr, $($rest:expr),+) => { $x - sub_right!($($rest),+) };
      }

      // Left to right with an accumulator: (100 - 20) - 5
      macro_rules! sub_left {
          (@acc $acc:expr) => { $acc };
          (@acc $acc:expr, $x:expr $(, $rest:expr)*) => { sub_left!(@acc ($acc - $x) $(, $rest)*) };
          ($first:expr $(, $rest:expr)*) => { sub_left!(@acc $first $(, $rest)*) };
      }

      fn main() {
          println!("{}", sub_right!(100, 20, 5));
          println!("{}", sub_left!(100, 20, 5));
      }
      ```

      ```output
      85
      75
      ```

      The public rule (last) starts the accumulator with the first value. Each `@acc` step folds in one more value, `($acc - $x)`, until none are left. Macros that eat their input a few tokens at a time like this are called **TT munchers** (they often match `$($rest:tt)*`), and they're how people build small languages inside macros.

      ### Common mistakes

      - **Forgetting the base case**, or a step that doesn't shrink the input: the expansion never ends, and you get ``error: recursion limit reached while expanding `count!` ``. The limit is 128 levels by default; `#![recursion_limit = "256"]` raises it, but if you need that, a different design is usually better.
      - **Expanding an argument in several recursive branches**, which evaluates it several times. Bind it to a local first, as in step 1.
      - **Deep recursion slows compilation.** Each level is a full macro expansion. Fine for a handful of values, not for thousands of tokens.

      **Your turn:** write `max!`, which takes **one or more** values and evaluates to the largest. `max!(x)` is `x`; for more values, compare the first with `max!` of the rest. Evaluate each argument only once (bind it with `let` inside a block).
    seed: |
      macro_rules! max {
          ($x:expr) => {
              $x
          };
          // TODO: a recursive rule for two or more values
      }
    solution: |
      macro_rules! max {
          ($x:expr) => {
              $x
          };
          ($x:expr, $($rest:expr),+) => {{
              let first = $x;
              let rest = max!($($rest),+);
              if first > rest { first } else { rest }
          }};
      }
    harness: |
      #[test]
      fn one_value_is_its_own_max() {
          assert_eq!(max!(3), 3, "max!(3)");
      }

      #[test]
      fn finds_the_max_of_several_values() {
          assert_eq!(max!(1, 9, 4), 9, "max!(1, 9, 4)");
          assert_eq!(max!(7, 2, 5, 3, 6), 7, "max!(7, 2, 5, 3, 6)");
          assert_eq!(max!(2, 4, 8), 8, "max!(2, 4, 8)");
      }

      #[test]
      fn works_with_negatives_and_floats() {
          assert_eq!(max!(-5, -2, -9), -2, "max!(-5, -2, -9)");
          assert_eq!(max!(0.5, 2.25, 1.0), 2.25, "max!(0.5, 2.25, 1.0)");
      }

      #[test]
      fn evaluates_each_argument_once() {
          let mut calls = 0;
          let mut next = || {
              calls += 1;
              calls
          };
          assert_eq!(max!(next(), next(), next()), 3, "max!(next(), next(), next())");
          assert_eq!(calls, 3, "three arguments should mean three calls");
      }
    hints:
      - "Matcher for two or more: `($x:expr, $($rest:expr),+)`."
      - "In a block: `let first = $x; let rest = max!($($rest),+);` then return the larger."
      - "`($x:expr, $($rest:expr),+) => {{ let first = $x; let rest = max!($($rest),+); if first > rest { first } else { rest } }};`"
    more:
      - task: |
          Write `first_some!`, which takes one or more `Option` expressions and evaluates to the first one that is `Some`, or the last one if all are `None`. It must be **lazy**: later arguments are only evaluated if the earlier ones were `None` (a function can't do that without closures). Typical use: `first_some!(from_env(), from_file(), Some(8080))`.
        seed: |
          macro_rules! first_some {
              ($x:expr) => {
                  $x
              };
              // TODO: a recursive rule for two or more options
          }
        solution: |
          macro_rules! first_some {
              ($x:expr) => {
                  $x
              };
              ($x:expr, $($rest:expr),+) => {
                  match $x {
                      Some(v) => Some(v),
                      None => first_some!($($rest),+),
                  }
              };
          }
        harness: |
          #[test]
          fn returns_the_first_some() {
              assert_eq!(first_some!(None, Some(2), Some(3)), Some(2), "first_some!(None, Some(2), Some(3))");
          }

          #[test]
          fn a_single_option_is_itself() {
              assert_eq!(first_some!(Some("x")), Some("x"), "first_some!(Some(\"x\"))");
          }

          #[test]
          fn all_none_gives_none() {
              let none: Option<i32> = None;
              assert_eq!(first_some!(none, none, none), None, "three Nones");
          }

          #[test]
          fn later_arguments_are_not_evaluated() {
              let mut calls = 0;
              let mut probe = |v: Option<i32>| {
                  calls += 1;
                  v
              };
              assert_eq!(first_some!(probe(None), probe(Some(2)), probe(Some(3))), Some(2), "probing three options");
              assert_eq!(calls, 2, "the third option should never be evaluated");
          }
        hints:
          - "The recursive rule matches the first option and the rest: `($x:expr, $($rest:expr),+)`."
          - "Expand to a `match`: `match $x { Some(v) => Some(v), None => first_some!($($rest),+) }`. The rest only runs in the `None` arm."
      - task: |
          Build a tiny DSL with a TT muncher: `calc!(10 minus 2 minus 3)` is `5`, `calc!(2 plus 3 times 4)` is `20`. The words `plus`, `minus` and `times` work **strictly left to right** (no precedence), and every number is a literal. Use an accumulator with internal `@acc` rules:

          - `calc!(n ...)` starts with `calc!(@acc n; ...)`
          - `calc!(@acc acc; plus x ...)` continues with `calc!(@acc (acc + x); ...)` (same for `minus` and `times`)
          - `calc!(@acc acc;)` with nothing left is the answer
        seed: |
          macro_rules! calc {
              // TODO: the end rule, three operator rules, and the starting rule
              ($x:literal) => {
                  $x
              };
          }
        solution: |
          macro_rules! calc {
              (@acc $acc:expr;) => {
                  $acc
              };
              (@acc $acc:expr; plus $x:literal $($rest:tt)*) => {
                  calc!(@acc ($acc + $x); $($rest)*)
              };
              (@acc $acc:expr; minus $x:literal $($rest:tt)*) => {
                  calc!(@acc ($acc - $x); $($rest)*)
              };
              (@acc $acc:expr; times $x:literal $($rest:tt)*) => {
                  calc!(@acc ($acc * $x); $($rest)*)
              };
              ($x:literal $($rest:tt)*) => {
                  calc!(@acc $x; $($rest)*)
              };
          }
        harness: |
          #[test]
          fn a_single_number_is_itself() {
              assert_eq!(calc!(7), 7, "calc!(7)");
          }

          #[test]
          fn adds_and_subtracts_left_to_right() {
              assert_eq!(calc!(10 minus 2 minus 3), 5, "calc!(10 minus 2 minus 3)");
              assert_eq!(calc!(1 plus 2 plus 3), 6, "calc!(1 plus 2 plus 3)");
          }

          #[test]
          fn has_no_precedence() {
              assert_eq!(calc!(2 plus 3 times 4), 20, "calc!(2 plus 3 times 4)");
          }

          #[test]
          fn mixes_all_three_words() {
              assert_eq!(calc!(5 times 4 minus 8 plus 1), 13, "calc!(5 times 4 minus 8 plus 1)");
          }
        hints:
          - "The end rule: `(@acc $acc:expr;) => { $acc };`. The `;` after `$acc:expr` is allowed."
          - "An operator rule: `(@acc $acc:expr; plus $x:literal $($rest:tt)*) => { calc!(@acc ($acc + $x); $($rest)*) };`. Copy it for `minus` and `times`."
          - "The starting rule goes last: `($x:literal $($rest:tt)*) => { calc!(@acc $x; $($rest)*) };`."

  - title: Hygiene, small DSLs and debugging macros
    id: macros-5
    text: |
      ### Hygiene

      Macros in Rust are **hygienic**: a local variable created inside a macro lives in its own world, separate from the caller's variables, even if the names are the same.

      ```rust run
      macro_rules! double_it {
          ($e:expr) => {{
              let x = $e;
              x * 2
          }};
      }

      fn main() {
          let x = 10;
          println!("{}", double_it!(x + 1));
          println!("{}", x);
      }
      ```

      ```output
      22
      10
      ```

      The macro's `let x` doesn't capture or shadow the caller's `x`: `$e` is still `x + 1` with the caller's `x`, giving 22, and the caller's `x` is untouched. In C, the same trick with `#define` would quietly compute with the wrong variable.

      Hygiene works the other way too: a macro can't reach into the caller's local variables unless they're passed in.

      ```rust compile_fail
      macro_rules! add_count {
          ($x:expr) => {
              $x + count
          };
      }

      fn main() {
          let count = 2;
          println!("{}", add_count!(5));
      }
      ```

      ```error
      error[E0425]: cannot find value `count` in this scope
      ```

      The compiler even adds: `an identifier with the same name exists, but is not accessible due to macro hygiene`. Pass it in instead (`add_count!(5, count)`); then it's visible at the call site, which is what readers expect.

      Hygiene covers local variables and labels. Function, struct and other item names a macro creates or uses are looked up normally, which is why `make_adder!(add_five, 5)` could create a function you call later. For macros shared between crates, mark them `#[macro_export]` and write paths as `$crate::...` so they resolve inside your crate, wherever the macro is used.

      ### Small DSLs

      A **DSL** (domain-specific language) is a mini-language for one job. Macros let you invent readable syntax that expands to plain Rust. A favorite at work is a **table of test cases** that generates one `#[test]` per row:

      ```rust
      macro_rules! level_tests {
          ($($name:ident: $input:expr => $expected:expr,)*) => {
              $(
                  #[test]
                  fn $name() {
                      assert_eq!(parse_level($input), $expected);
                  }
              )*
          };
      }

      level_tests! {
          parses_info: "info" => Some(Level::Info),
          parses_upper: "WARN" => Some(Level::Warn),
          rejects_junk: "loud" => None,
      }
      ```

      Each row becomes a separate test with its own name, so a failure tells you exactly which case broke. Crates like `rstest` and `test-case` do this with attribute macros. Other DSLs you'll meet: `serde_json::json!({ "id": 1 })`, `html!` in web frameworks, and `sqlx::query!`.

      Here's a version you can run that collects results instead of generating tests. `stringify!` turns tokens into a string literal, so the table can report the source text of each input:

      ```rust run
      macro_rules! check_table {
          ($func:ident { $($input:expr => $expected:expr),* $(,)? }) => {
              $(
                  let got = $func($input);
                  let mark = if got == $expected { "ok  " } else { "FAIL" };
                  println!("{} {}({}) = {:?}", mark, stringify!($func), stringify!($input), got);
              )*
          };
      }

      fn grade(score: u32) -> char {
          match score {
              90.. => 'A',
              75..=89 => 'B',
              _ => 'C',
          }
      }

      fn main() {
          check_table!(grade {
              95 => 'A',
              80 => 'B',
              74 => 'B',
          });
      }
      ```

      ```output
      ok   grade(95) = 'A'
      ok   grade(80) = 'B'
      FAIL grade(74) = 'C'
      ```

      ### Debugging macros

      When a macro doesn't do what you expect, look at what it **expands to**:

      - **`cargo expand`** prints your code with every macro expanded. Install it once with `cargo install cargo-expand` (it needs a nightly toolchain installed, `rustup toolchain install nightly`, but your project can stay on stable). `cargo expand` shows the whole crate; `cargo expand path::to::module` narrows it down.

      ```text
      $ cargo expand
      fn main() {
          let x = 10;
          {
              ::std::io::_print(format_args!("{0}\n", { let x = x + 1; x * 2 }));
          };
          ...
      ```

      (`println!` itself expands too, which is why the output is noisier than your code.) Notice `let x = x + 1;`: printed code can't show hygiene, so the macro's `x` and yours look like one variable. The compiler still keeps them apart; read expanded code with that in mind.

      - **rust-analyzer** in VS Code and other editors has a command "Expand macro recursively at caret" that shows the expansion of the call under your cursor.
      - Put `stringify!(...)` or `println!` calls inside the transcriber to see what was matched.
      - Read the error's note: `in this macro invocation` points at your call, and the arrows point into the macro's rules.

      **Your turn:** write `test_table!`, which runs a function over a table of cases and returns a `Vec<String>` describing each failure. `test_table!(double { 1 => 2, 5 => 11 })` returns `vec!["double(5): expected 11, got 10"]` (the function and input are shown as source text with `stringify!`, the expected and actual values with `{:?}`). Rows that pass add nothing. Allow a trailing comma, and evaluate each expected value once.
    seed: |
      macro_rules! test_table {
          ($func:ident { $($input:expr => $expected:expr),* $(,)? }) => {{
              let mut failures: Vec<String> = Vec::new();
              // TODO: for each row, call the function and record a failure if needed
              failures
          }};
      }
    solution: |
      macro_rules! test_table {
          ($func:ident { $($input:expr => $expected:expr),* $(,)? }) => {{
              let mut failures: Vec<String> = Vec::new();
              $(
                  let expected = $expected;
                  let got = $func($input);
                  if got != expected {
                      failures.push(format!(
                          "{}({}): expected {:?}, got {:?}",
                          stringify!($func),
                          stringify!($input),
                          expected,
                          got
                      ));
                  }
              )*
              failures
          }};
      }
    harness: |
      fn double(x: i32) -> i32 {
          x * 2
      }

      fn shout(s: &str) -> String {
          s.to_uppercase()
      }

      #[test]
      fn a_passing_table_has_no_failures() {
          let failures = test_table!(double { 1 => 2, 5 => 10, -3 => -6 });
          assert_eq!(failures, Vec::<String>::new(), "all rows pass");
      }

      #[test]
      fn a_wrong_row_is_reported() {
          let failures = test_table!(double { 1 => 2, 5 => 11 });
          assert_eq!(failures, vec!["double(5): expected 11, got 10".to_string()], "one failing row");
      }

      #[test]
      fn every_failure_is_reported_in_order() {
          let failures = test_table!(double {
              0 => 1,
              2 => 4,
              4 => 9,
          });
          assert_eq!(
              failures,
              vec!["double(0): expected 1, got 0".to_string(), "double(4): expected 9, got 8".to_string()],
              "two failing rows"
          );
      }

      #[test]
      fn works_with_string_functions() {
          let failures = test_table!(shout { "hi" => "HI", "crab" => "Crab" });
          assert_eq!(failures, vec!["shout(\"crab\"): expected \"Crab\", got \"CRAB\"".to_string()], "string table");
      }
    hints:
      - "Repeat a block of statements for each row: `$( let expected = $expected; let got = $func($input); ... )*`."
      - "Compare with `if got != expected { failures.push(format!(...)); }`."
      - "`format!(\"{}({}): expected {:?}, got {:?}\", stringify!($func), stringify!($input), expected, got)`"
    more:
      - task: |
          Thanks to hygiene, a `swap!` macro can use a temporary variable called `tmp` even when the caller has a variable called `tmp`. Write `swap!(a, b)` (taking two **identifiers** of mutable variables) that swaps their values using `let tmp = $a;`. The program should print `tmp = 2, other = 1`.
        seed: |
          macro_rules! swap {
              ($a:ident, $b:ident) => {
                  // TODO: swap using a temporary called tmp
              };
          }

          fn main() {
              let mut tmp = 1;
              let mut other = 2;
              swap!(tmp, other);
              println!("tmp = {tmp}, other = {other}");
          }
        solution: |
          macro_rules! swap {
              ($a:ident, $b:ident) => {
                  let tmp = $a;
                  $a = $b;
                  $b = tmp;
              };
          }

          fn main() {
              let mut tmp = 1;
              let mut other = 2;
              swap!(tmp, other);
              println!("tmp = {tmp}, other = {other}");
          }
        require:
          - pattern: 'let\s+tmp\s*=\s*\$a'
            message: "Use a temporary inside the macro: `let tmp = $a;`."
        forbid:
          - pattern: 'mem::swap'
            message: Write the swap yourself with a temporary (in real code, `std::mem::swap` is the right tool).
        hints:
          - "Three statements: `let tmp = $a; $a = $b; $b = tmp;`."
          - "The macro's `tmp` and the caller's `tmp` are different variables because of hygiene, so `$a` (the caller's `tmp`) still means the caller's."
        tests:
          - expect: "tmp = 2, other = 1"
      - task: |
          Write a `state_machine!` DSL. Each row is `From + event => To`, and the macro generates `fn next_state(state: &str, event: &str) -> Option<&'static str>`, which returns the target state's name for a known `(state, event)` pair and `None` otherwise. Then use it to define this machine for a media player:

          ```text
          Idle + play => Playing
          Playing + pause => Paused
          Paused + play => Playing
          Playing + stop => Idle
          Paused + stop => Idle
          ```

          Hint: `stringify!` works in match patterns too.
        seed: |
          macro_rules! state_machine {
              ($($from:ident + $event:ident => $to:ident),* $(,)?) => {
                  // TODO: generate next_state
              };
          }

          // TODO: state_machine! { ... }
        solution: |
          macro_rules! state_machine {
              ($($from:ident + $event:ident => $to:ident),* $(,)?) => {
                  fn next_state(state: &str, event: &str) -> Option<&'static str> {
                      match (state, event) {
                          $( (stringify!($from), stringify!($event)) => Some(stringify!($to)), )*
                          _ => None,
                      }
                  }
              };
          }

          state_machine! {
              Idle + play => Playing,
              Playing + pause => Paused,
              Paused + play => Playing,
              Playing + stop => Idle,
              Paused + stop => Idle,
          }
        harness: |
          #[test]
          fn play_starts_playing() {
              assert_eq!(next_state("Idle", "play"), Some("Playing"), "Idle + play");
          }

          #[test]
          fn pause_and_resume() {
              assert_eq!(next_state("Playing", "pause"), Some("Paused"), "Playing + pause");
              assert_eq!(next_state("Paused", "play"), Some("Playing"), "Paused + play");
          }

          #[test]
          fn stop_goes_back_to_idle() {
              assert_eq!(next_state("Playing", "stop"), Some("Idle"), "Playing + stop");
              assert_eq!(next_state("Paused", "stop"), Some("Idle"), "Paused + stop");
          }

          #[test]
          fn unknown_moves_give_none() {
              assert_eq!(next_state("Idle", "pause"), None, "Idle + pause");
              assert_eq!(next_state("Broken", "play"), None, "Broken + play");
          }
        require:
          - pattern: 'state_machine!\s*\{'
            message: "Define the machine with your macro: `state_machine! { Idle + play => Playing, ... }`."
        hints:
          - "Generate one function with a `match (state, event) { ... }` inside."
          - "One arm per row: `$( (stringify!($from), stringify!($event)) => Some(stringify!($to)), )*`, then `_ => None`."
          - "Invoke it at the top level with braces and the five rows separated by commas."

  - title: Procedural macros and derive
    id: macros-6
    text: |
      `macro_rules!` matches patterns. **Procedural macros** are different: they're ordinary Rust functions that run **inside the compiler**, receive your code as a stream of tokens, and return new tokens. There are three kinds:

      | Kind | Looks like | Examples |
      |---|---|---|
      | **derive** | `#[derive(Serialize)]` on a struct or enum | `serde`'s `Serialize`/`Deserialize`, `thiserror::Error`, `clap::Parser` |
      | **attribute** | `#[name]` on an item, can rewrite it | `#[tokio::main]`, `#[test]`, `#[async_trait]` |
      | **function-like** | `name!(...)`, like `macro_rules!` but with full Rust logic | `sqlx::query!` (checks SQL at compile time), `html!` |

      ### What a derive writes for you

      A derive reads the struct's definition and **adds** an impl next to it. For `#[derive(Debug)]` on a struct, the generated code is close to this hand-written impl:

      ```rust run
      use std::fmt;

      struct Point {
          x: i32,
          y: i32,
      }

      // Roughly what #[derive(Debug)] generates:
      impl fmt::Debug for Point {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              f.debug_struct("Point")
                  .field("x", &self.x)
                  .field("y", &self.y)
                  .finish()
          }
      }

      fn main() {
          let p = Point { x: 3, y: -1 };
          println!("{:?}", p);
          println!("{:#?}", p);
      }
      ```

      ```output
      Point { x: 3, y: -1 }
      Point {
          x: 3,
          y: -1,
      }
      ```

      `debug_struct` is a helper in `std::fmt` that handles both `{:?}` and the pretty `{:#?}` form. Tuple structs use `debug_tuple`, and unit variants just write their name.

      `#[derive(Serialize)]` (from serde, covered in the serde module) works the same way. It reads the field names and any `#[serde(...)]` attributes, and generates an impl that describes the struct to a **serializer**:

      ```rust run
      use serde::ser::{Serialize, SerializeStruct, Serializer};

      struct Point {
          x: i32,
          y: i32,
      }

      // Roughly what #[derive(Serialize)] generates:
      impl Serialize for Point {
          fn serialize<S: Serializer>(&self, serializer: S) -> Result<S::Ok, S::Error> {
              let mut state = serializer.serialize_struct("Point", 2)?;
              state.serialize_field("x", &self.x)?;
              state.serialize_field("y", &self.y)?;
              state.end()
          }
      }

      fn main() {
          let p = Point { x: 3, y: -1 };
          println!("{}", serde_json::to_string(&p).unwrap());
      }
      ```

      ```output
      {"x":3,"y":-1}
      ```

      The generated code never mentions JSON. It only calls the `Serializer` trait's methods ("a struct with 2 fields", "field x", "field y"), and `serde_json` is one implementation of that trait. That's why the same derive works for TOML, YAML, MessagePack and dozens of other formats. `#[serde(rename = "pos_x")]` simply changes the string the derive passes to `serialize_field`.

      ### How a procedural macro is built

      A proc macro must live in its **own crate** with a special flag, which is why this site can't compile one for you:

      ```toml
      # describe-derive/Cargo.toml
      [lib]
      proc-macro = true

      [dependencies]
      syn = "2"     # parses the tokens into a syntax tree
      quote = "1"   # turns Rust-like templates back into tokens
      ```

      ```rust
      use proc_macro::TokenStream;
      use quote::quote;
      use syn::{parse_macro_input, DeriveInput};

      #[proc_macro_derive(Describe)]
      pub fn derive_describe(input: TokenStream) -> TokenStream {
          let ast = parse_macro_input!(input as DeriveInput); // the struct or enum
          let name = &ast.ident;                                // its name
          let expanded = quote! {
              impl Describe for #name {
                  fn describe() -> String {
                      format!("I am {}", stringify!(#name))
                  }
              }
          };
          expanded.into()
      }
      ```

      Users add `describe-derive` as a dependency and write `#[derive(Describe)]`. `#name` in `quote!` pastes a value in, like `$name` in `macro_rules!`.

      An attribute macro receives the item it's attached to and may replace it entirely. `#[tokio::main]` turns your `async fn main` into roughly this:

      ```rust
      fn main() {
          tokio::runtime::Builder::new_multi_thread()
              .enable_all()
              .build()
              .unwrap()
              .block_on(async {
                  // the body of your async fn main
              })
      }
      ```

      ### Should you write one?

      Rarely. You'll **use** derive and attribute macros daily, but writing one costs a lot: a separate crate, slower compile times (`syn` is big), and code that's harder to debug. Teams write them when a pattern repeats across many types in a large codebase and no trait or `macro_rules!` can capture it. Before that, try a trait with default methods, a generic function, or a `macro_rules!` that implements a trait for a list of types (one of the challenges below). `cargo expand` shows derive output too, which is the best way to learn what a derive really does.

      **Your turn:** implement `Debug` for `Ticket` by hand, the way `#[derive(Debug)]` would, using `f.debug_struct(...)`. The output must be exactly what the derive prints: `Ticket { id: 7, title: "Crash on start", open: true }`, and the pretty `{:#?}` form must match too.
    seed: |
      use std::fmt;

      struct Ticket {
          id: u32,
          title: String,
          open: bool,
      }

      // TODO: impl fmt::Debug for Ticket (no #[derive])
    solution: |
      use std::fmt;

      struct Ticket {
          id: u32,
          title: String,
          open: bool,
      }

      impl fmt::Debug for Ticket {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              f.debug_struct("Ticket")
                  .field("id", &self.id)
                  .field("title", &self.title)
                  .field("open", &self.open)
                  .finish()
          }
      }
    harness: |
      fn sample() -> Ticket {
          Ticket { id: 7, title: "Crash on start".to_string(), open: true }
      }

      #[test]
      fn matches_what_derive_would_print() {
          assert_eq!(format!("{:?}", sample()), "Ticket { id: 7, title: \"Crash on start\", open: true }", "Debug output");
      }

      #[test]
      fn the_pretty_form_matches_too() {
          let expected = "Ticket {\n    id: 7,\n    title: \"Crash on start\",\n    open: true,\n}";
          assert_eq!(format!("{:#?}", sample()), expected, "pretty Debug output");
      }

      #[test]
      fn works_for_other_values() {
          let t = Ticket { id: 0, title: String::new(), open: false };
          assert_eq!(format!("{:?}", t), "Ticket { id: 0, title: \"\", open: false }", "Debug output of an empty ticket");
      }
    require:
      - pattern: 'debug_struct'
        message: Build the output with `f.debug_struct("Ticket")`, like the derive does.
    forbid:
      - pattern: 'derive\s*\([^)]*Debug'
        message: Write the impl by hand instead of deriving it.
    hints:
      - "Start with `impl fmt::Debug for Ticket { fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { ... } }`."
      - "`f.debug_struct(\"Ticket\").field(\"id\", &self.id)` and so on for each field, then `.finish()`."
    more:
      - task: |
          Now the other two shapes. Implement `Debug` by hand (no derive) for the tuple struct `Rgb` and the enum `Status`, matching what `#[derive(Debug)]` prints:

          - `Rgb(255, 0, 10)` prints `Rgb(255, 0, 10)`: use `f.debug_tuple("Rgb")` with one `.field(...)` per value.
          - `Status::Active` prints `Active`, and `Status::Banned(reason)` prints `Banned("spam")`. Use `f.write_str` for the unit variant and `debug_tuple` for the other.
        seed: |
          use std::fmt;

          struct Rgb(u8, u8, u8);

          enum Status {
              Active,
              Banned(String),
          }

          // TODO: impl fmt::Debug for Rgb and for Status
        solution: |
          use std::fmt;

          struct Rgb(u8, u8, u8);

          enum Status {
              Active,
              Banned(String),
          }

          impl fmt::Debug for Rgb {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  f.debug_tuple("Rgb").field(&self.0).field(&self.1).field(&self.2).finish()
              }
          }

          impl fmt::Debug for Status {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  match self {
                      Status::Active => f.write_str("Active"),
                      Status::Banned(reason) => f.debug_tuple("Banned").field(reason).finish(),
                  }
              }
          }
        harness: |
          #[test]
          fn rgb_prints_like_a_tuple_struct() {
              assert_eq!(format!("{:?}", Rgb(255, 0, 10)), "Rgb(255, 0, 10)", "Debug of Rgb(255, 0, 10)");
          }

          #[test]
          fn a_unit_variant_prints_its_name() {
              assert_eq!(format!("{:?}", Status::Active), "Active", "Debug of Status::Active");
          }

          #[test]
          fn a_tuple_variant_prints_its_data() {
              assert_eq!(format!("{:?}", Status::Banned("spam".to_string())), "Banned(\"spam\")", "Debug of Status::Banned");
          }

          #[test]
          fn values_inside_a_vec_use_your_impls() {
              let v = vec![Status::Active, Status::Banned("bot".to_string())];
              assert_eq!(format!("{:?}", v), "[Active, Banned(\"bot\")]", "Debug of a Vec of Status");
          }
        forbid:
          - pattern: 'derive\s*\([^)]*Debug'
            message: Write both impls by hand instead of deriving them.
        hints:
          - "`f.debug_tuple(\"Rgb\").field(&self.0).field(&self.1).field(&self.2).finish()`"
          - "For the enum, `match self { Status::Active => f.write_str(\"Active\"), Status::Banned(reason) => f.debug_tuple(\"Banned\").field(reason).finish() }`."
      - task: |
          You don't need a proc macro to implement a trait for many types. std implements its traits for all the integer types with `macro_rules!`. Write `impl_describe!`, which takes a comma-separated list of **types** and implements `Describe` for each one: `describe()` returns the type's name, a space, and the value's `Display` text (`5i32.describe()` is `"i32 5"`). Then use it once for `i32, u8, f64, String`.
        seed: |
          trait Describe {
              fn describe(&self) -> String;
          }

          // TODO: macro_rules! impl_describe, then impl_describe!(i32, u8, f64, String);
        solution: |
          trait Describe {
              fn describe(&self) -> String;
          }

          macro_rules! impl_describe {
              ($($t:ty),* $(,)?) => {
                  $(
                      impl Describe for $t {
                          fn describe(&self) -> String {
                              format!("{} {}", stringify!($t), self)
                          }
                      }
                  )*
              };
          }

          impl_describe!(i32, u8, f64, String);
        harness: |
          #[test]
          fn describes_an_i32() {
              assert_eq!(5i32.describe(), "i32 5", "5i32.describe()");
          }

          #[test]
          fn describes_a_u8() {
              assert_eq!(200u8.describe(), "u8 200", "200u8.describe()");
          }

          #[test]
          fn describes_an_f64() {
              assert_eq!(2.5f64.describe(), "f64 2.5", "2.5f64.describe()");
          }

          #[test]
          fn describes_a_string() {
              assert_eq!(String::from("crab").describe(), "String crab", "String::from(\"crab\").describe()");
          }
        require:
          - pattern: 'impl_describe!\s*\('
            message: "Use your macro once for all four types: `impl_describe!(i32, u8, f64, String);`."
        forbid:
          - pattern: 'impl\s+Describe\s+for\s+(i32|u8|f64|String)\b'
            message: Let the macro write the impls instead of writing them by hand.
        hints:
          - "Match a list of types: `($($t:ty),* $(,)?)`."
          - "Repeat a whole impl per type: `$( impl Describe for $t { fn describe(&self) -> String { ... } } )*`."
          - "Inside: `format!(\"{} {}\", stringify!($t), self)`."
