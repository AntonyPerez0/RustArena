id: macros
title: Macros
phase: "Advanced Rust"
summary: Code that writes code. Build your own macro_rules! macros (from one-liners to repetition, recursion and small DSLs), debug them, and see what procedural macros like derive(Debug) and derive(Serialize) generate.
roadmap: ["Declarative Macros with macro_rules!", "Procedural Macros & Custom Derive", "Domain Specific Languages (DSLs)"]
steps:
  - title: Your first macro_rules! macro
    id: macros-1
    text: |
      You've used macros since your first program: `println!`, `format!`, `vec!`, `assert_eq!`, `todo!`. A **macro** is code that writes code. The compiler expands it **before** type checking, replacing the call with the code the macro produces.

      ### Why have macros at all?

      Functions are great, but they have limits that macros don't:

      - A function takes a fixed number of arguments with fixed types. `println!` takes any number, and checks its format string at compile time.
      - A function can't create new structs, impls or functions. A macro can generate whole items.
      - A function can't `return` from its caller. A macro expands *inside* the caller, so it can.

      The price: macros are harder to read, their errors point into generated code, and editors understand them less well. The rule teams follow is simple: **if a function (or a generic, or a trait) can do it, write a function.** Reach for a macro when it can't.

      ### macro_rules!

      **Declarative macros** are written with `macro_rules!`. Each **rule** has a **matcher** (the pattern the call must look like) and a **transcriber** (the code it expands to):

      ```rust run
      macro_rules! square {
          ($x:expr) => {
              $x * $x
          };
      }

      macro_rules! greet {
          () => {
              println!("Hello, arena!")
          };
          ($name:expr) => {
              println!("Hello, {}!", $name)
          };
      }

      fn main() {
          println!("{}", square!(7));
          println!("{}", square!(2 + 3));
          greet!();
          greet!("Ferris");
      }
      ```

      ```output
      49
      25
      Hello, arena!
      Hello, Ferris!
      ```

      Piece by piece:

      - `($x:expr) => { $x * $x };` is one rule. `$x` is a **metavariable**, and `expr` is its **fragment specifier**: "match one Rust expression here". In the transcriber, `$x` is replaced by whatever was matched.
      - `greet!` has two rules. The compiler tries them **top to bottom** and uses the first one that matches, so `greet!()` picks the first and `greet!("Ferris")` the second. Put specific rules before general ones.
      - `square!(2 + 3)` is 25, not 11. The matched expression is pasted in as **one unit**, as if it had parentheses. (C's `#define SQUARE(x) x*x` pastes text and gets this wrong; Rust macros work on syntax, not text.)
      - You can call a macro with any brackets: `square!(7)`, `square![7]` and `square!{7}` are the same. By convention, `()` looks like a function call, `[]` builds a collection (`vec![]`), and `{}` wraps blocks or items.
      - A `macro_rules!` macro must be defined **above** the code that uses it in the file. Otherwise: ``cannot find macro `square` in this scope``.

      ### Common mistakes

      **No rule matches the call.** The error names the token where matching failed:

      ```rust compile_fail
      macro_rules! greet {
          () => {
              println!("Hello, arena!")
          };
          ($name:expr) => {
              println!("Hello, {}!", $name)
          };
      }

      fn main() {
          greet!("Ferris", "Corro");
      }
      ```

      ```error
      error: no rules expected `,`
      ```

      **Evaluating an argument twice.** `$x * $x` pastes the expression in twice, so it **runs** twice. That matters when it has side effects or is expensive:

      ```rust run
      macro_rules! square {
          ($x:expr) => {
              $x * $x
          };
      }

      macro_rules! square_once {
          ($x:expr) => {{
              let v = $x;
              v * v
          }};
      }

      fn main() {
          let a = square!({ println!("computing"); 3 });
          println!("{a}");
          let b = square_once!({ println!("computing"); 3 });
          println!("{b}");
      }
      ```

      ```output
      computing
      computing
      9
      computing
      9
      ```

      The fix stores the value in a local first. Notice the **double braces** `{{ ... }}`: the outer pair belongs to the rule, the inner pair is a block expression in the expanded code, so `let v` and `v * v` become one expression.

      **Your turn:** fill in the blanks of a `cube!` macro that evaluates its argument once. The program should print `27` and then `8`.
    fill: |
      macro_rules! cube {
          ($x:[[expr]]) => {{
              let v = [[$x]];
              v * v * v
          }};
      }

      fn main() {
          println!("{}", cube!(3));
          println!("{}", cube!(1 + 1));
      }
    hints:
      - "The fragment specifier for \"any expression\" is `expr`."
      - "In the transcriber, the matched expression is written with its dollar sign: `$x`."
    tests:
      - expect: "27\n8"
    more:
      - task: |
          Write `max2!(a, b)`, which evaluates to the larger of two values. Each argument must be evaluated **exactly once** (a hidden test counts the calls), so store both in locals inside a block before comparing.
        seed: |
          macro_rules! max2 {
              ($a:expr, $b:expr) => {
                  todo!()
              };
          }
        solution: |
          macro_rules! max2 {
              ($a:expr, $b:expr) => {{
                  let a = $a;
                  let b = $b;
                  if a > b { a } else { b }
              }};
          }
        harness: |
          #[test]
          fn picks_the_larger_value() {
              assert_eq!(max2!(3, 7), 7, "max2!(3, 7)");
              assert_eq!(max2!(9, 2), 9, "max2!(9, 2)");
          }

          #[test]
          fn works_with_expressions_and_negatives() {
              assert_eq!(max2!(-5, 2 - 10), -5, "max2!(-5, 2 - 10)");
          }

          #[test]
          fn works_with_floats() {
              assert_eq!(max2!(1.5, 0.25), 1.5, "max2!(1.5, 0.25)");
          }

          #[test]
          fn evaluates_each_argument_once() {
              let mut calls = 0;
              let mut next = || {
                  calls += 1;
                  calls * 10
              };
              assert_eq!(max2!(next(), 5), 10, "max2!(next(), 5)");
              assert_eq!(calls, 1, "next() should run exactly once");
          }
        hints:
          - "Use double braces so the expansion is one block expression: `($a:expr, $b:expr) => {{ ... }};`."
          - "Inside: `let a = $a; let b = $b; if a > b { a } else { b }`."
      - task: |
          Matchers can contain plain tokens as well as metavariables. Write a `log!` macro that returns a `String`:

          - `log!(warn, msg)` gives `"[WARN] <msg>"`
          - `log!(error, msg)` gives `"[ERROR] <msg>"`
          - `log!(msg)` gives `"[INFO] <msg>"`

          `msg` can be any expression that implements `Display`. Write the `warn` and `error` rules before the general one.
        seed: |
          macro_rules! log {
              ($msg:expr) => {
                  todo!()
              };
          }
        solution: |
          macro_rules! log {
              (warn, $msg:expr) => {
                  format!("[WARN] {}", $msg)
              };
              (error, $msg:expr) => {
                  format!("[ERROR] {}", $msg)
              };
              ($msg:expr) => {
                  format!("[INFO] {}", $msg)
              };
          }
        harness: |
          #[test]
          fn plain_messages_are_info() {
              assert_eq!(log!("server started"), "[INFO] server started", "log!(\"server started\")");
          }

          #[test]
          fn warn_messages_are_tagged() {
              assert_eq!(log!(warn, "disk 91% full"), "[WARN] disk 91% full", "log!(warn, ...)");
          }

          #[test]
          fn error_messages_are_tagged() {
              assert_eq!(log!(error, "connection lost"), "[ERROR] connection lost", "log!(error, ...)");
          }

          #[test]
          fn the_message_can_be_any_display_expression() {
              let code = 503;
              assert_eq!(log!(error, format!("status {code}")), "[ERROR] status 503", "log!(error, format!(...))");
              assert_eq!(log!(42), "[INFO] 42", "log!(42)");
          }
        hints:
          - "A literal word in a matcher must appear exactly: `(warn, $msg:expr) => { ... };`."
          - "Each rule returns `format!(\"[WARN] {}\", $msg)` (and so on). Put `($msg:expr)` last."

  - title: Fragment specifiers and generating code
    id: macros-2
    text: |
      `expr` is one of several **fragment specifiers**. Each tells the macro what kind of syntax to match:

      | Specifier | Matches | Examples |
      |---|---|---|
      | `expr` | an expression | `2 + 3`, `x.len()`, `"hi"` |
      | `ident` | a name | `max_players`, `Meters` |
      | `ty` | a type | `u32`, `Vec<String>`, `&'static str` |
      | `literal` | a literal | `8`, `"hi"`, `'c'`, `true` |
      | `pat` | a pattern | `Some(x)`, `1..=5`, `_` |
      | `block` | a `{ ... }` block | `{ let a = 1; a + 1 }` |
      | `stmt` | a statement | `let x = 5` |
      | `tt` | one **token tree**: a single token, or anything inside matching `()`, `[]` or `{}` | `+`, `foo`, `(a, b)` |
      | `item`, `path`, `lifetime`, `vis`, `meta` | an item, a path, a lifetime, a visibility (`pub`), an attribute's contents | `fn f() {}`, `std::io`, `'a`, `pub` |

      With `ident` and `ty`, a macro can generate **items**: functions, structs, impls. That's where macros save the most typing.

      ```rust run
      macro_rules! constant_fn {
          ($name:ident -> $t:ty = $value:expr) => {
              fn $name() -> $t {
                  $value
              }
          };
      }

      macro_rules! newtype {
          ($name:ident($inner:ty)) => {
              #[derive(Debug, Clone, Copy, PartialEq)]
              struct $name($inner);
          };
      }

      constant_fn!(max_players -> u32 = 8);
      constant_fn!(server_name -> &'static str = "arena-eu-1");
      newtype!(Meters(f64));

      fn main() {
          println!("{} players on {}", max_players(), server_name());
          let d = Meters(12.5);
          println!("{:?} is {} m", d, d.0);
      }
      ```

      ```output
      8 players on arena-eu-1
      Meters(12.5) is 12.5 m
      ```

      - The matcher `$name:ident -> $t:ty = $value:expr` invents its own little syntax. `->` and `=` are plain tokens the call must contain.
      - `fn $name() -> $t` pastes the identifier and the type into a function definition. The macro calls sit at the top level of the file, so they expand to items there.
      - `newtype!(Meters(f64))` expands to a whole struct with its derives. The standard library uses this trick to implement traits for all twelve integer types with one macro.

      ### Common mistakes

      **What may follow a fragment is restricted.** So that future Rust syntax can't change how a macro parses, an `expr` or `stmt` may only be followed by `=>`, `,` or `;`. Types and paths allow a few more (`=`, `|`, `{`, `:`, `>`, `as`, `where`).

      ```rust compile_fail
      macro_rules! both {
          ($a:expr and $b:expr) => {
              $a && $b
          };
      }

      fn main() {
          println!("{}", both!(true and false));
      }
      ```

      ```error
      error: `$a:expr` is followed by `and`, which is not allowed for `expr` fragments
      ```

      Use a comma (`($a:expr, $b:expr)`) or match `$a:tt and $b:tt` if each side is a single token.

      **Using the wrong specifier.** An `ident` is only a name: passing `x + 1` where the macro expects `$v:ident` fails with `no rules expected` and points at the `+`.

      **Your turn:** write an `id_type!` macro that generates an id newtype. `id_type!(UserId, u32)` should expand to a tuple struct `UserId(u32)` deriving `Debug, Clone, Copy, PartialEq`, plus an `impl` with `fn new(value: u32) -> Self` and `fn value(&self) -> u32`. Then use it twice: `UserId` wrapping `u32` and `Sku` wrapping `u64`.
    seed: |
      macro_rules! id_type {
          ($name:ident, $inner:ty) => {
              // TODO: the struct (with derives) and an impl with new() and value()
          };
      }

      // TODO: id_type!(UserId, u32); and id_type!(Sku, u64);
    solution: |
      macro_rules! id_type {
          ($name:ident, $inner:ty) => {
              #[derive(Debug, Clone, Copy, PartialEq)]
              struct $name($inner);

              impl $name {
                  fn new(value: $inner) -> Self {
                      $name(value)
                  }

                  fn value(&self) -> $inner {
                      self.0
                  }
              }
          };
      }

      id_type!(UserId, u32);
      id_type!(Sku, u64);
    harness: |
      #[test]
      fn user_ids_store_their_value() {
          assert_eq!(UserId::new(5).value(), 5, "UserId::new(5).value()");
      }

      #[test]
      fn skus_hold_big_numbers() {
          assert_eq!(Sku::new(9_000_000_000).value(), 9_000_000_000, "Sku::new(9_000_000_000).value()");
      }

      #[test]
      fn ids_compare_by_value() {
          assert_eq!(UserId::new(1), UserId::new(1), "UserId::new(1) == UserId::new(1)");
          assert_ne!(UserId::new(1), UserId::new(2), "UserId::new(1) != UserId::new(2)");
      }

      #[test]
      fn ids_print_with_their_type_name() {
          assert_eq!(format!("{:?}", UserId::new(7)), "UserId(7)", "Debug output of UserId::new(7)");
          assert_eq!(format!("{:?}", Sku::new(3)), "Sku(3)", "Debug output of Sku::new(3)");
      }
    require:
      - pattern: 'id_type!\s*\(\s*UserId'
        message: "Create `UserId` with the macro: `id_type!(UserId, u32);`."
      - pattern: 'id_type!\s*\(\s*Sku'
        message: "Create `Sku` with the macro: `id_type!(Sku, u64);`."
    forbid:
      - pattern: 'struct\s+(UserId|Sku)\b'
        message: Let the macro write the structs; don't define `UserId` or `Sku` by hand.
    hints:
      - "The transcriber can hold several items: first `#[derive(Debug, Clone, Copy, PartialEq)] struct $name($inner);`, then `impl $name { ... }`."
      - "Inside the impl, use `$inner` for the types: `fn new(value: $inner) -> Self { $name(value) }` and `fn value(&self) -> $inner { self.0 }`."
      - "Outside the macro, at the top level: `id_type!(UserId, u32);` and `id_type!(Sku, u64);`."
    more:
      - task: |
          Write `make_adder!(name, amount)`, which generates a function `fn name(x: i32) -> i32` returning `x + amount`. Then use it three times to create `add_five` (adds 5), `add_ten` (adds 10) and `subtract_one` (adds -1).
        seed: |
          macro_rules! make_adder {
              ($name:ident, $amount:expr) => {
                  // TODO: generate the function
              };
          }

          // TODO: create add_five, add_ten and subtract_one
        solution: |
          macro_rules! make_adder {
              ($name:ident, $amount:expr) => {
                  fn $name(x: i32) -> i32 {
                      x + $amount
                  }
              };
          }

          make_adder!(add_five, 5);
          make_adder!(add_ten, 10);
          make_adder!(subtract_one, -1);
        harness: |
          #[test]
          fn add_five_adds_five() {
              assert_eq!(add_five(1), 6, "add_five(1)");
          }

          #[test]
          fn add_ten_adds_ten() {
              assert_eq!(add_ten(-10), 0, "add_ten(-10)");
          }

          #[test]
          fn subtract_one_subtracts_one() {
              assert_eq!(subtract_one(0), -1, "subtract_one(0)");
              assert_eq!(subtract_one(100), 99, "subtract_one(100)");
          }
        forbid:
          - pattern: 'fn\s+(add_five|add_ten|subtract_one)\b'
            message: Generate the three functions with `make_adder!` instead of writing them by hand.
        hints:
          - "The transcriber is a function definition with the name pasted in: `fn $name(x: i32) -> i32 { x + $amount }`."
          - "Then three calls at the top level: `make_adder!(add_five, 5);` and so on (the last one with `-1`)."
      - task: |
          Because a macro expands inside the function that calls it, it can `return` from that function. That's how `anyhow::ensure!` works. Write `ensure!(condition, message)`: if the condition is false, it returns `Err(message.to_string())` from the calling function.

          Then use it (at least three times) in `validate_username`, with these checks in this order:

          1. at least 3 bytes long, else `"too short"`
          2. at most 16 bytes long, else `"too long"`
          3. only ASCII letters, digits and `_`, else `"only letters, digits and _ allowed"`
          4. doesn't start with a digit, else `"must not start with a digit"`
        seed: |
          macro_rules! ensure {
              ($cond:expr, $msg:expr) => {
                  // TODO
              };
          }

          fn validate_username(name: &str) -> Result<(), String> {
              todo!()
          }
        solution: |
          macro_rules! ensure {
              ($cond:expr, $msg:expr) => {
                  if !$cond {
                      return Err($msg.to_string());
                  }
              };
          }

          fn validate_username(name: &str) -> Result<(), String> {
              ensure!(name.len() >= 3, "too short");
              ensure!(name.len() <= 16, "too long");
              ensure!(
                  name.chars().all(|c| c.is_ascii_alphanumeric() || c == '_'),
                  "only letters, digits and _ allowed"
              );
              ensure!(!name.starts_with(|c: char| c.is_ascii_digit()), "must not start with a digit");
              Ok(())
          }
        harness: |
          #[test]
          fn accepts_a_good_name() {
              assert_eq!(validate_username("ferris_42"), Ok(()), "validate_username(\"ferris_42\")");
          }

          #[test]
          fn rejects_short_and_long_names() {
              assert_eq!(validate_username("ab"), Err("too short".to_string()), "validate_username(\"ab\")");
              assert_eq!(validate_username("a_very_long_username"), Err("too long".to_string()), "20 characters");
          }

          #[test]
          fn rejects_bad_characters() {
              assert_eq!(validate_username("crab-man"), Err("only letters, digits and _ allowed".to_string()), "validate_username(\"crab-man\")");
          }

          #[test]
          fn rejects_a_leading_digit() {
              assert_eq!(validate_username("1crab"), Err("must not start with a digit".to_string()), "validate_username(\"1crab\")");
          }
        require:
          - pattern: 'ensure!\s*\([\s\S]*ensure!\s*\([\s\S]*ensure!\s*\('
            message: Use your `ensure!` macro for the checks (at least three times).
        hints:
          - "The macro expands to an `if`: `if !$cond { return Err($msg.to_string()); }`. The `return` leaves the function that called the macro."
          - "`!$cond` is safe even for `a >= b`: the expression is pasted in as one unit."
          - "`name.chars().all(|c| c.is_ascii_alphanumeric() || c == '_')` and `name.starts_with(|c: char| c.is_ascii_digit())` cover the last two checks."

  - title: Repetition
    id: macros-3
    text: |
      Macros really shine when they accept **any number** of inputs. That's **repetition**: `$( ... )` with a separator and a repetition operator.

      ```rust run
      macro_rules! my_vec {
          ( $( $x:expr ),* $(,)? ) => {{
              let mut v = Vec::new();
              $( v.push($x); )*
              v
          }};
      }

      macro_rules! print_all {
          ( $( $label:literal : $value:expr ),+ ) => {
              $( println!("{:>6}: {}", $label, $value); )+
          };
      }

      fn main() {
          let scores = my_vec![90, 72, 85,];
          println!("{:?}", scores);
          print_all!("best": 90, "worst": 72, "count": scores.len());
      }
      ```

      ```output
      [90, 72, 85]
        best: 90
       worst: 72
       count: 3
      ```

      How to read it:

      - In the matcher, `$( $x:expr ),*` means "zero or more expressions, separated by commas". The separator (here `,`) goes between the `)` and the operator.
      - The operators: `*` is zero or more, `+` is one or more, `?` is zero or one.
      - `$(,)?` at the end allows an optional **trailing comma**, so `my_vec![90, 72, 85,]` works. Every collection macro should allow one; people reorder lines and leave commas behind.
      - In the transcriber, `$( v.push($x); )*` repeats its contents **once for each** `$x` that was matched. Three inputs, three `push` lines.
      - A repetition can capture several metavariables at once, like `$label` and `$value`. They're repeated together, pair by pair.

      Here's (simplified) how std's own `vec!` is written. `$crate` means "the crate this macro comes from", so the macro works even if the caller has never imported `Vec`:

      ```rust
      macro_rules! vec {
          () => ( $crate::vec::Vec::new() );
          ($elem:expr; $n:expr) => ( $crate::vec::from_elem($elem, $n) );
          ($($x:expr),+ $(,)?) => ( <[_]>::into_vec($crate::boxed::Box::new([$($x),+])) );
      }
      ```

      In your own macros, write full paths like `::std::collections::HashMap` for the same reason.

      ### Common mistakes

      **Using a repeated variable outside a repetition:**

      ```rust compile_fail
      macro_rules! pairs {
          ($($x:expr),*) => {
              vec![$x]
          };
      }

      fn main() {
          let v: Vec<i32> = pairs![1, 2];
          println!("{:?}", v);
      }
      ```

      ```error
      error: variable `x` is still repeating at this depth
      ```

      `$x` stands for a whole list, so it must appear inside a `$( ... )*` in the transcriber too: `vec![$($x),*]`.

      **Forgetting the trailing comma rule:** without `$(,)?`, the call `my_vec![1, 2, 3,]` fails with `unexpected end of macro invocation`, because after the last comma the matcher expects another expression.

      **An empty call with `let mut`:** `my_vec![]` expands to a `let mut v` that's never changed, which warns, and Rust can't infer the element type. Give the empty case its own rule (`() => { Vec::new() };`), as std does.

      **Your turn:** write a `hashmap!` macro: `hashmap!{ "a" => 1, "b" => 2 }` builds a `HashMap` containing those entries. Allow an optional trailing comma. The starter already has the rule for `hashmap!{}` (an empty map); add a rule for one or more `key => value` pairs. Use the full path `::std::collections::HashMap` so callers don't need a `use`.
    seed: |
      macro_rules! hashmap {
          () => {
              ::std::collections::HashMap::new()
          };
          // TODO: a rule for one or more `key => value` pairs, with an optional trailing comma
      }
    solution: |
      macro_rules! hashmap {
          () => {
              ::std::collections::HashMap::new()
          };
          ( $( $key:expr => $value:expr ),+ $(,)? ) => {{
              let mut map = ::std::collections::HashMap::new();
              $( map.insert($key, $value); )+
              map
          }};
      }
    harness: |
      use std::collections::HashMap;

      #[test]
      fn builds_a_map_from_pairs() {
          let m = hashmap! { "a" => 1, "b" => 2 };
          assert_eq!(m.len(), 2, "number of entries");
          assert_eq!(m.get("a"), Some(&1), "m.get(\"a\")");
          assert_eq!(m.get("b"), Some(&2), "m.get(\"b\")");
      }

      #[test]
      fn accepts_a_trailing_comma() {
          let m = hashmap! {
              "x" => 10,
              "y" => 20,
          };
          assert_eq!(m.get("y"), Some(&20), "m.get(\"y\")");
      }

      #[test]
      fn empty_braces_make_an_empty_map() {
          let m: HashMap<String, u32> = hashmap! {};
          assert!(m.is_empty(), "hashmap!{{}} should be empty");
      }

      #[test]
      fn keys_and_values_can_be_any_expressions() {
          let item = String::from("potion");
          let m = hashmap! { item.clone() => 2 + 3, "map".to_string() => "crab".len() };
          assert_eq!(m.get("potion"), Some(&5), "m.get(\"potion\")");
          assert_eq!(m.get("map"), Some(&4), "m.get(\"map\")");
      }

      #[test]
      fn a_repeated_key_keeps_the_last_value() {
          let m = hashmap! { "k" => 1, "k" => 2 };
          assert_eq!(m.len(), 1, "number of entries");
          assert_eq!(m["k"], 2, "m[\"k\"]");
      }
    hints:
      - "The matcher: `( $( $key:expr => $value:expr ),+ $(,)? )`. `=>` after an `expr` is allowed."
      - "The transcriber is a block: create `let mut map = ::std::collections::HashMap::new();`, insert each pair, then return `map`. Use double braces."
      - "`$( map.insert($key, $value); )+` repeats the insert for every pair."
    more:
      - task: |
          Write `sum!`, which adds any number of values: `sum!(1, 2, 3)` expands to `1 + 2 + 3`. `sum!()` is `0`, and a trailing comma is allowed. It must also work for floats (`sum!(1.5, 2.5)` is `4.0`), so don't start the expansion with an integer `0` when there are values: match the first value separately and repeat `+ $rest` for the others.
        seed: |
          macro_rules! sum {
              () => {
                  0
              };
              // TODO: one or more values
          }
        solution: |
          macro_rules! sum {
              () => {
                  0
              };
              ( $first:expr $( , $rest:expr )* $(,)? ) => {
                  $first $( + $rest )*
              };
          }
        harness: |
          #[test]
          fn adds_several_integers() {
              assert_eq!(sum!(1, 2, 3), 6, "sum!(1, 2, 3)");
          }

          #[test]
          fn a_single_value_is_itself() {
              assert_eq!(sum!(5), 5, "sum!(5)");
          }

          #[test]
          fn nothing_sums_to_zero() {
              assert_eq!(sum!(), 0, "sum!()");
          }

          #[test]
          fn works_with_floats_and_a_trailing_comma() {
              assert_eq!(sum!(1.5, 2.5,), 4.0, "sum!(1.5, 2.5,)");
          }

          #[test]
          fn values_can_be_expressions() {
              let v = vec![10, 20];
              assert_eq!(sum!(v[0], v[1] * 2, 3 - 1), 52, "sum!(v[0], v[1] * 2, 3 - 1)");
          }
        hints:
          - "Matcher: `( $first:expr $( , $rest:expr )* $(,)? )`. The comma is inside the repetition, before each extra value."
          - "Transcriber: `$first $( + $rest )*`. The `+` is plain text repeated before each `$rest`."
      - task: |
          Write `enum_str!`, which generates an enum plus two helper methods, a common way to avoid writing the same list of variants three times. `enum_str!(Level { Debug, Info, Warn, Error })` should expand to:

          - `enum Level { Debug, Info, Warn, Error }` deriving `Debug, Clone, Copy, PartialEq`
          - `fn as_str(&self) -> &'static str` returning the variant's name (`Level::Warn.as_str()` is `"Warn"`)
          - `fn all() -> Vec<Level>` listing every variant in order

          `stringify!(tokens)` turns tokens into a string literal at compile time: `stringify!(Warn)` is `"Warn"`. Allow a trailing comma after the last variant, and use the macro to create `Level` as shown.
        seed: |
          macro_rules! enum_str {
              ($name:ident { $( $variant:ident ),* $(,)? }) => {
                  // TODO: the enum and an impl with as_str() and all()
              };
          }

          // TODO: enum_str!(Level { Debug, Info, Warn, Error });
        solution: |
          macro_rules! enum_str {
              ($name:ident { $( $variant:ident ),* $(,)? }) => {
                  #[derive(Debug, Clone, Copy, PartialEq)]
                  enum $name {
                      $( $variant ),*
                  }

                  impl $name {
                      fn as_str(&self) -> &'static str {
                          match self {
                              $( $name::$variant => stringify!($variant), )*
                          }
                      }

                      fn all() -> Vec<$name> {
                          vec![$( $name::$variant ),*]
                      }
                  }
              };
          }

          enum_str!(Level { Debug, Info, Warn, Error });
