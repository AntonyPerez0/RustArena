          fn all_and_as_str_agree() {
              let names: Vec<&str> = Level::all().iter().map(|l| l.as_str()).collect();
              assert_eq!(names, vec!["Debug", "Info", "Warn", "Error"], "names of Level::all()");
          }
        require:
          - pattern: 'enum_str!\s*\(\s*Level'
            message: "Create the enum with your macro: `enum_str!(Level { Debug, Info, Warn, Error });`."
          - pattern: 'stringify!'
            message: Use `stringify!($variant)` to turn each variant name into a string.
