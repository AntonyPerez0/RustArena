        solution: |
          #[derive(Debug, PartialEq)]
          struct Signup {
              username: String,
              age: u8,
              email: String,
          }

          fn validate_signup(username: &str, age: &str, email: &str) -> Result<Signup, String> {
              let username = username.trim();
              if username.chars().count() < 3 {
                  return Err(String::from("username too short"));
              }
              let age: u8 = age.trim().parse().map_err(|e| format!("invalid age: {e}"))?;
              if age < 13 {
                  return Err(String::from("must be at least 13"));
              }
              let email = email.trim();
              if !email.contains('@') {
                  return Err(String::from("invalid email"));
              }
              Ok(Signup {
                  username: username.to_string(),
                  age,
                  email: email.to_string(),
              })
          }
