id: errors
title: Error Handling with Result
phase: "Errors and abstraction"
summary: Rust has no exceptions. A failure that can happen in normal use is a value of type Result, and the ? operator passes it up to the caller. Learn when to panic, when to return an error, and the combinators that keep error handling short.
roadmap: [Error Handling, Option and Result Enumerations, "Propagating Errors and `?` Operator"]
steps:
  - title: panic! or Result?
    id: errors-1
    text: |
      Programs fail. A user types `twelve` where you asked for a number, a config file is missing, a customer tries to withdraw more money than they have. Rust splits failures into two kinds and gives each its own tool:

      - **Unrecoverable errors** are bugs: situations the code should never get into, like reading element 10 of a 3-element array. Rust stops the program with a **panic**.
      - **Recoverable errors** are things that go wrong in normal use: bad input, a missing file, not enough money. A function that can fail this way returns a **`Result`**, and the caller decides what to do about it.

      Rust has no exceptions. Whether a function can fail is written in its signature, and the compiler makes sure the caller deals with it.

      ### panic!

      You've already met panics: indexing past the end of an array and integer overflow both panic. You can also panic on purpose with the `panic!` macro, which takes a message like `println!` does:

      ```rust panics
      fn main() {
          println!("loading level...");
          let level = 7;
          if level > 5 {
              panic!("level {level} does not exist");
          }
          println!("level loaded");
      }
      ```

      ```output
      loading level...
      ```

      The program stops at the `panic!`. The message goes to the error output (stderr), along with the file and line: `panicked at src/main.rs:5:9: level 7 does not exist`. A panic means "the code is wrong": the fix is to change the program, not to try again.

      ### Result

      For failures that are part of normal life, a function returns `Result<T, E>`, an enum from the standard library:

      ```rust
      enum Result<T, E> {
          Ok(T),
          Err(E),
      }
      ```

      `T` and `E` stand for types that you choose (module 21 calls them **generic type parameters**). `T` is the type of the value on success, `E` the type of the error. A function returning `Result<u32, String>` gives back either `Ok(some_u32)` or `Err(some_string)`. Like `Some` and `None`, the variants `Ok` and `Err` can be used without writing `Result::` in front.

      Here's a bank withdrawal that can fail:

      ```rust run
      fn withdraw(balance: u32, amount: u32) -> Result<u32, String> {
          if amount > balance {
              return Err(format!("cannot withdraw {amount}: balance is only {balance}"));
          }
          Ok(balance - amount)
      }

      fn main() {
          println!("{:?}", withdraw(100, 30));
          println!("{:?}", withdraw(100, 250));
      }
      ```

      ```output
      Ok(70)
      Err("cannot withdraw 250: balance is only 100")
      ```

      Piece by piece:

      - The return type `Result<u32, String>` is part of the function's contract. Anyone calling it can see that it may fail, and that the error is a `String` message.
      - `return Err(...)` wraps the error and sends it back early.
      - `Ok(balance - amount)` wraps the new balance. As the last expression, it's the return value.
      - `{:?}` prints the whole `Result`, so you can see which variant came back.

      Think about what a panic would mean here: one customer asking for too much would crash the bank's server for everyone. Returning an `Err` lets the caller show "insufficient funds" and carry on.

      ### Common mistakes

      - **Using a `Result` as if it were the value.** Parsing can fail, so `parse` gives a `Result`, never a plain number:

      ```rust compile_fail
      fn main() {
          let n: i32 = "5".parse::<i32>();
          println!("{n}");
      }
      ```

      ```error
      error[E0308]: mismatched types
        |     let n: i32 = "5".parse::<i32>();
        |            ---   ^^^^^^^^^^^^^^^^^^ expected `i32`, found `Result<i32, ParseIntError>`
      ```

      The next steps show the ways to get the number out.

      - **Forgetting the `Ok(...)`.** Ending `withdraw` with `balance - amount` gives `expected Result<u32, String>, found u32`. The success value has to be wrapped too.
      - **Ignoring a `Result`.** Calling `withdraw(100, 250);` and throwing the answer away compiles, but rustc warns: `unused Result that must be used`. Silently ignoring a failure is almost always a bug.
      - **Panicking on bad input.** `panic!` is for bugs. A typo from a user is not a bug in your program, so it deserves a `Result`.

      **Your turn:** fill in the blanks so `withdraw` returns an error when the amount is larger than the balance, and the new balance otherwise. The program should print:

      ```
      Ok(70)
      Err("insufficient funds")
      ```
    fill: |
      fn withdraw(balance: u32, amount: u32) -> [[Result]]<u32, String> {
          if amount > balance {
              return [[Err]](String::from("insufficient funds"));
          }
          [[Ok]](balance - amount)
      }

      fn main() {
          println!("{:?}", withdraw(100, 30));
          println!("{:?}", withdraw(100, 250));
      }
    hints:
      - The return type is the enum with the variants `Ok` and `Err`.
      - The error is wrapped in `Err(...)`, the success value in `Ok(...)`.
    tests:
      - expect: "Ok(70)\nErr(\"insufficient funds\")"
    more:
      - task: |
          A sign-up form asks for the user's age. Write `fn validate_age(age: i32) -> Result<u32, String>`:

          - a negative age returns `Err("age cannot be negative")`
          - an age above 150 returns `Err("<age> is not a realistic age")`, for example `Err("200 is not a realistic age")`
          - anything else returns the age as a `u32` in `Ok` (use `age as u32`)
        seed: |
          fn validate_age(age: i32) -> Result<u32, String> {
              todo!()
          }
        solution: |
          fn validate_age(age: i32) -> Result<u32, String> {
              if age < 0 {
                  return Err(String::from("age cannot be negative"));
              }
              if age > 150 {
                  return Err(format!("{age} is not a realistic age"));
              }
              Ok(age as u32)
          }
        harness: |
          #[test]
          fn accepts_a_normal_age() {
              assert_eq!(validate_age(34), Ok(34), "validate_age(34)");
          }

          #[test]
          fn accepts_zero_and_150() {
              assert_eq!(validate_age(0), Ok(0), "validate_age(0)");
              assert_eq!(validate_age(150), Ok(150), "validate_age(150)");
          }

          #[test]
          fn rejects_a_negative_age() {
              assert_eq!(validate_age(-3), Err(String::from("age cannot be negative")), "validate_age(-3)");
          }

          #[test]
          fn rejects_an_unrealistic_age() {
              assert_eq!(validate_age(200), Err(String::from("200 is not a realistic age")), "validate_age(200)");
              assert_eq!(validate_age(151), Err(String::from("151 is not a realistic age")), "validate_age(151)");
          }
        hints:
          - "Check the two bad cases first with `if`, each doing `return Err(...)`."
          - "`format!(\"{age} is not a realistic age\")` builds the second message."
          - "The last line is `Ok(age as u32)`."
      - task: |
          A command-line tool asks "Continue? (yes/no)". Write `fn parse_yes_no(answer: &str) -> Result<bool, String>`:

          - ignore spaces around the answer and upper/lower case
          - `y` or `yes` gives `Ok(true)`, `n` or `no` gives `Ok(false)`
          - anything else gives `Err("expected yes or no, got '<answer>'")` with the trimmed answer, for example `Err("expected yes or no, got 'maybe'")`
        seed: |
          fn parse_yes_no(answer: &str) -> Result<bool, String> {
              todo!()
          }
        solution: |
          fn parse_yes_no(answer: &str) -> Result<bool, String> {
              let cleaned = answer.trim().to_lowercase();
              match cleaned.as_str() {
                  "y" | "yes" => Ok(true),
                  "n" | "no" => Ok(false),
                  _ => Err(format!("expected yes or no, got '{}'", answer.trim())),
              }
          }
        harness: |
          #[test]
          fn yes_and_y_mean_true() {
              assert_eq!(parse_yes_no("yes"), Ok(true), "parse_yes_no(\"yes\")");
              assert_eq!(parse_yes_no("y"), Ok(true), "parse_yes_no(\"y\")");
          }

          #[test]
          fn no_and_n_mean_false() {
              assert_eq!(parse_yes_no("no"), Ok(false), "parse_yes_no(\"no\")");
              assert_eq!(parse_yes_no("n"), Ok(false), "parse_yes_no(\"n\")");
          }

          #[test]
          fn ignores_case_and_spaces() {
              assert_eq!(parse_yes_no("  Y \n"), Ok(true), "parse_yes_no(\"  Y \\n\")");
              assert_eq!(parse_yes_no("NO"), Ok(false), "parse_yes_no(\"NO\")");
          }

          #[test]
          fn rejects_other_answers() {
              assert_eq!(parse_yes_no(" maybe "), Err(String::from("expected yes or no, got 'maybe'")), "parse_yes_no(\" maybe \")");
              assert_eq!(parse_yes_no(""), Err(String::from("expected yes or no, got ''")), "parse_yes_no(\"\")");
          }
        hints:
          - "`answer.trim().to_lowercase()` gives a cleaned-up `String`."
          - "`match` on `cleaned.as_str()` so the arms can be string literals like `\"y\" | \"yes\"`."
          - "The catch-all arm is `_ => Err(format!(\"expected yes or no, got '{}'\", answer.trim()))`."

  - title: Handling a Result with match
    id: errors-2
    text: |
      A `Result` is an enum, so the most basic way to look inside is the tool you already know for enums: `match`. Each arm handles one variant and pulls its value out.

      ```rust run
      fn main() {
          let inputs = ["3", "12", "two", "", "-1"];
          for input in inputs {
              match input.parse::<u32>() {
                  Ok(qty) => println!("{input:?}: ordered {qty}"),
                  Err(e) => println!("{input:?}: {e}"),
              }
          }
      }
      ```

      ```output
      "3": ordered 3
      "12": ordered 12
      "two": invalid digit found in string
      "": cannot parse integer from empty string
      "-1": invalid digit found in string
      ```

      - `input.parse::<u32>()` returns `Result<u32, ParseIntError>`. `ParseIntError` (its full path is `std::num::ParseIntError`) is the standard library's error type for failed integer parsing.
      - `Ok(qty)` matches a success and names the number `qty`. `Err(e)` matches a failure and names the error `e`.
      - The compiler checks that you handled both. You can't forget the error case by accident.
      - `-1` fails because a `u32` can't be negative: the `-` is an "invalid digit".

      ### Parse errors

      Printing a `ParseIntError` with `{}` gives a message meant for people; `{:?}` shows its inner structure, meant for developers.

      | Input parsed as `u8` | `{}` | `{:?}` |
      |---|---|---|
      | `""` | cannot parse integer from empty string | `ParseIntError { kind: Empty }` |
      | `"4x"` | invalid digit found in string | `ParseIntError { kind: InvalidDigit }` |
      | `"300"` | number too large to fit in target type | `ParseIntError { kind: PosOverflow }` |

      Other types have their own errors: parsing an `f64` can fail with a `ParseFloatError` (`invalid float literal`), a `bool` with a `ParseBoolError` (anything but exactly `true` or `false`).

      ### Handling your own Results

      Your own functions work the same way. With `withdraw` from the last step:

      ```rust run
      fn withdraw(balance: u32, amount: u32) -> Result<u32, String> {
          if amount > balance {
              return Err(String::from("insufficient funds"));
          }
          Ok(balance - amount)
      }

      fn main() {
          let mut balance = 100;
          for amount in [40, 80, 60] {
              match withdraw(balance, amount) {
                  Ok(new_balance) => {
                      balance = new_balance;
                      println!("withdrew {amount}, balance {balance}");
                  }
                  Err(msg) => println!("declined {amount}: {msg}"),
              }
          }
      }
      ```

      ```output
      withdrew 40, balance 60
      declined 80: insufficient funds
      withdrew 60, balance 0
      ```

      ### if let and let...else

      When you only care about one side, `if let` and `let...else` (from the enums module) work on `Result` too:

      ```rust run
      fn port_from(text: &str) -> u16 {
          let Ok(port) = text.parse::<u16>() else {
              println!("bad port {text:?}, using 8080");
              return 8080;
          };
          port
      }

      fn main() {
          println!("{}", port_from("3000"));
          println!("{}", port_from("99999"));
          if let Err(e) = "12.5.1".parse::<f64>() {
              println!("version is not a number: {e}");
          }
      }
      ```

      ```output
      3000
      bad port "99999", using 8080
      8080
      version is not a number: invalid float literal
      ```

      ### Common mistakes

      - **Leaving out the `Err` arm.** A `match` must cover every variant:

      ```rust compile_fail
      fn main() {
          match "5".parse::<i32>() {
              Ok(n) => println!("{n}"),
          }
      }
      ```

      ```error
      error[E0004]: non-exhaustive patterns: `Err(_)` not covered
      ```

      - **Parsing a line with its newline still on it.** `read_line` keeps the `\n`, and `"42\n"` is not a number (`invalid digit found in string`). Call `.trim()` before `.parse()`.
      - **Printing the error with `{:?}` for users.** `ParseIntError { kind: InvalidDigit }` is for developers. Use `{}` in messages people read.

      **Your turn:** a shop receives order quantities, one per line. Read every line, and for each one:

      - if it parses as a `u32` (after trimming), add it to `total`
      - otherwise print `skipping "<line>": <error>` with the trimmed line and the error's `{}` message

      At the end print `total: <total>`. For the input `3`, `5`, `abc`, an empty line and `2`, the output is:

      ```
      skipping "abc": invalid digit found in string
      skipping "": cannot parse integer from empty string
      total: 10
      ```
    seed: |
      use std::io::BufRead;

      fn main() {
          let mut total: u32 = 0;
          for line in std::io::stdin().lock().lines() {
              let line = line.expect("could not read input");
              let text = line.trim();
              // match on text.parse::<u32>():
              //   Ok  -> add the quantity to total
              //   Err -> print: skipping "<text>": <error>
          }
          println!("total: {total}");
      }
    solution: |
      use std::io::BufRead;

      fn main() {
          let mut total: u32 = 0;
          for line in std::io::stdin().lock().lines() {
              let line = line.expect("could not read input");
              let text = line.trim();
              match text.parse::<u32>() {
                  Ok(qty) => total += qty,
                  Err(e) => println!("skipping \"{text}\": {e}"),
              }
          }
          println!("total: {total}");
      }
    require:
      - pattern: '\bmatch\b'
        message: Use a `match` with an `Ok` arm and an `Err` arm.
    hints:
      - "`match text.parse::<u32>() { Ok(qty) => ..., Err(e) => ... }`"
      - "In the `Ok` arm, `total += qty`. In the `Err` arm, print the message with `{e}`."
      - "To print a double quote inside a string, write `\\\"`: `println!(\"skipping \\\"{text}\\\": {e}\")`."
    tests:
      - stdin: "3\n5\nabc\n\n2\n"
        expect: "skipping \"abc\": invalid digit found in string\nskipping \"\": cannot parse integer from empty string\ntotal: 10"
      - stdin: "10\n-4\n 7 \n99999999999\n"
        hidden: true
      - stdin: "1\n2\n3\n"
        hidden: true
    more:
      - task: |
          A game reads the level to start on as text. Write `fn level_label(input: &str) -> String` that parses the trimmed input as a `u8` and returns:

          - `"level 5"` for a valid number like `5`
          - `"invalid level '<trimmed input>': <error>"` otherwise, for example `"invalid level 'seven': invalid digit found in string"`
        seed: |
          fn level_label(input: &str) -> String {
              todo!()
          }
        solution: |
          fn level_label(input: &str) -> String {
              let text = input.trim();
              match text.parse::<u8>() {
                  Ok(n) => format!("level {n}"),
                  Err(e) => format!("invalid level '{text}': {e}"),
              }
          }
        harness: |
          #[test]
          fn labels_a_valid_level() {
              assert_eq!(level_label("5"), "level 5", "level_label(\"5\")");
          }

          #[test]
          fn trims_the_input() {
              assert_eq!(level_label(" 12\n"), "level 12", "level_label(\" 12\\n\")");
          }

          #[test]
          fn reports_a_word() {
              assert_eq!(level_label("seven"), "invalid level 'seven': invalid digit found in string", "level_label(\"seven\")");
          }

          #[test]
          fn reports_a_number_too_big_for_u8() {
              assert_eq!(level_label("300"), "invalid level '300': number too large to fit in target type", "level_label(\"300\")");
          }

          #[test]
          fn reports_empty_input() {
              assert_eq!(level_label(""), "invalid level '': cannot parse integer from empty string", "level_label(\"\")");
          }
        hints:
          - "Trim first: `let text = input.trim();`, then `match text.parse::<u8>()`."
          - "Each arm returns a `String` built with `format!`."
      - task: |
          An ATM reads one line: the amount to withdraw from a balance of 100. Use the `withdraw` function in the starter code. Print:

          - `new balance: <n>` if the withdrawal works
          - `declined: <message>` if `withdraw` returns an error
          - `not a number: <error>` if the line isn't a valid `u32`

          You'll need a `match` inside a `match`.
        seed: |
          fn withdraw(balance: u32, amount: u32) -> Result<u32, String> {
              if amount > balance {
                  return Err(format!("insufficient funds (balance {balance})"));
              }
              Ok(balance - amount)
          }

          fn main() {
              let balance = 100;
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).expect("could not read input");
              // parse the trimmed line, then call withdraw(balance, amount)
          }
        solution: |
          fn withdraw(balance: u32, amount: u32) -> Result<u32, String> {
              if amount > balance {
                  return Err(format!("insufficient funds (balance {balance})"));
              }
              Ok(balance - amount)
          }

          fn main() {
              let balance = 100;
              let mut line = String::new();
              std::io::stdin().read_line(&mut line).expect("could not read input");
              match line.trim().parse::<u32>() {
                  Ok(amount) => match withdraw(balance, amount) {
                      Ok(left) => println!("new balance: {left}"),
                      Err(msg) => println!("declined: {msg}"),
                  },
                  Err(e) => println!("not a number: {e}"),
              }
          }
        hints:
          - "The outer `match` is on `line.trim().parse::<u32>()`."
          - "In its `Ok(amount)` arm, `match withdraw(balance, amount) { ... }` with two more arms."
        tests:
          - stdin: "30\n"
            expect: "new balance: 70"
          - stdin: "250\n"
            hidden: true
          - stdin: "lots\n"
            hidden: true
          - stdin: "100\n"
            hidden: true

  - title: unwrap, expect and safe defaults
    id: errors-3
    text: |
      Writing a `match` for every `Result` gets long. `Result` (and `Option`) have shortcut methods for the common cases.

      ### unwrap and expect

      - `.unwrap()` gives you the value inside `Ok`, or **panics** if it's an `Err`.
      - `.expect("message")` does the same, but panics with your message in front of the error.

      ```rust panics
      fn main() {
          let port: u16 = "8080".parse().expect("the default port is a valid number");
          println!("port {port}");
          let qty: u32 = "ten".parse().unwrap();
          println!("quantity {qty}");
      }
      ```

      ```output
      port 8080
      ```

      The second parse fails, so the program panics with: ``called `Result::unwrap()` on an `Err` value: ParseIntError { kind: InvalidDigit }``. With `expect`, the message would start with your text instead.

      ### When is unwrap or expect fine?

      Both turn a recoverable error into a crash. That's acceptable when:

      - **In tests.** A panic fails the test, which is exactly what you want.
      - **In prototypes and quick scripts.** Crashing on bad input is fine while you explore. Search for `unwrap` when you turn the prototype into real code.
      - **When failure is impossible (an invariant).** `"8080".parse::<u16>()` on a literal you wrote can't fail. Use `expect` and say *why* it can't fail. If it ever does panic, the message tells the next developer which assumption broke.

      They're **not** fine for:

      - **Anything from outside your program:** user input, files, network data, environment variables. It will be wrong eventually, and a typo shouldn't crash your program.
      - **Library code.** A library can't know whether its caller can survive a crash. Return a `Result` and let the caller decide.

      **Workplace note:** many teams don't allow a bare `unwrap()` in production code and ask for `expect` with a message that states the expectation ("config was validated at startup") instead. Clippy can enforce this with its `unwrap_used` lint, which is off by default.

      ### Safe defaults: unwrap_or and unwrap_or_default

      Often there's a sensible fallback. `unwrap_or(value)` gives the `Ok` value, or `value` on error. `unwrap_or_default()` falls back to the type's **default value**: `0` for numbers, `false` for `bool`, an empty `String` or `Vec`.

      ```rust run
      fn main() {
          let retries: u32 = "abc".parse().unwrap_or(3);
          let workers: u32 = "8".parse().unwrap_or(1);
          let timeout: u32 = "".parse().unwrap_or_default();
          let debug: bool = "maybe".parse().unwrap_or_default();
          println!("retries={retries} workers={workers} timeout={timeout} debug={debug}");

          let nickname: Option<&str> = None;
          println!("hello, {}", nickname.unwrap_or("guest"));
      }
      ```

      ```output
      retries=3 workers=8 timeout=0 debug=false
      hello, guest
      ```

      The same methods work on `Option`, as the last line shows: `None` falls back to `"guest"`.

      ### Common mistakes

      - **A fallback of the wrong type.** The fallback must have the same type as the success value:

      ```rust compile_fail
      fn main() {
          let qty: u32 = "x".parse().unwrap_or("0");
          println!("{qty}");
      }
      ```

      ```error
      error[E0308]: mismatched types
        |     let qty: u32 = "x".parse().unwrap_or("0");
        |                                --------- ^^^ expected `u32`, found `&str`
      ```

      - **Hiding real problems with a default.** If a missing setting is a mistake the user must fix, falling back silently makes the bug hard to find. Use a default only when it's a genuinely reasonable choice.
      - **`expect` messages that only repeat the failure.** `.expect("parse failed")` adds nothing; the error already says that. Say what you expected: `.expect("PORT should be a number")`.

      **Your turn:** write `fn parse_settings(retries: &str, verbose: &str) -> (u32, bool)` for a tool's settings. Trim both inputs.

      - `retries` is parsed as a `u32`; if that fails, use `3` (with `unwrap_or`)
      - `verbose` is parsed as a `bool` (only `true` and `false` are valid); if that fails, use the default `false` (with `unwrap_or_default`)
    seed: |
      fn parse_settings(retries: &str, verbose: &str) -> (u32, bool) {
          todo!()
      }
    solution: |
      fn parse_settings(retries: &str, verbose: &str) -> (u32, bool) {
          let retries: u32 = retries.trim().parse().unwrap_or(3);
          let verbose: bool = verbose.trim().parse().unwrap_or_default();
          (retries, verbose)
      }
    require:
      - pattern: '\.unwrap_or\('
        message: Use `unwrap_or(3)` for the retries fallback.
      - pattern: '\.unwrap_or_default\(\)'
        message: Use `unwrap_or_default()` for the verbose fallback.
    hints:
      - "`let retries: u32 = retries.trim().parse().unwrap_or(3);`"
      - "The type annotation `: bool` tells `parse` what to parse into; then `.unwrap_or_default()`."
      - "Return both as a tuple: `(retries, verbose)`."
    harness: |
      #[test]
      fn parses_valid_settings() {
          assert_eq!(parse_settings("5", "true"), (5, true), "parse_settings(\"5\", \"true\")");
      }

      #[test]
      fn trims_the_inputs() {
          assert_eq!(parse_settings(" 10 ", " false\n"), (10, false), "parse_settings(\" 10 \", \" false\\n\")");
      }

      #[test]
      fn bad_retries_fall_back_to_3() {
          assert_eq!(parse_settings("abc", "true"), (3, true), "parse_settings(\"abc\", \"true\")");
          assert_eq!(parse_settings("-1", "true"), (3, true), "parse_settings(\"-1\", \"true\")");
      }

      #[test]
      fn bad_verbose_falls_back_to_false() {
          assert_eq!(parse_settings("2", "yes"), (2, false), "parse_settings(\"2\", \"yes\")");
          assert_eq!(parse_settings("2", "TRUE"), (2, false), "parse_settings(\"2\", \"TRUE\")");
      }

      #[test]
      fn empty_inputs_use_both_fallbacks() {
