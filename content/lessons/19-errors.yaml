          #[test]
          fn rejects_an_age_that_is_not_a_number() {
              assert_eq!(validate_signup("crab", "old", "c@x.io"), Err(String::from("invalid age: invalid digit found in string")), "validate_signup(\"crab\", \"old\", \"c@x.io\")");
              assert_eq!(validate_signup("crab", "300", "c@x.io"), Err(String::from("invalid age: number too large to fit in target type")), "validate_signup(\"crab\", \"300\", \"c@x.io\")");
          }

          #[test]
          fn rejects_children_under_13() {
              assert_eq!(validate_signup("kiddo", "12", "k@x.io"), Err(String::from("must be at least 13")), "validate_signup(\"kiddo\", \"12\", \"k@x.io\")");
          }

          #[test]
          fn rejects_an_email_without_at() {
              assert_eq!(validate_signup("crab", "20", "crab.example.com"), Err(String::from("invalid email")), "validate_signup(\"crab\", \"20\", \"crab.example.com\")");
          }
