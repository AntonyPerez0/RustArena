          use std::time::Duration;
          use tokio::task::JoinSet;
          use tokio::time::sleep;

          async fn file_size(name: &str) -> u64 {
              sleep(Duration::from_millis(name.len() as u64)).await;
              name.len() as u64 * 1024
          }

          #[tokio::main]
          async fn main() {
              let files = vec!["report.pdf", "a.txt", "photo_large.png", "notes.md"];
              let mut set = JoinSet::new();
              for name in files {
                  set.spawn(async move { (name, file_size(name).await) });
              }
