        solution: |
          use std::time::Duration;

          async fn save_ticket(number: u32) {
              tokio::time::sleep(Duration::from_millis(u64::from(number % 3))).await;
          }

          async fn issue_ticket(counter: &tokio::sync::Mutex<u32>) -> u32 {
              let mut count = counter.lock().await;
              *count += 1;
              save_ticket(*count).await;
              *count
          }
        require:
          - pattern: 'lock\(\)\s*\.await'
            message: Lock the Tokio mutex with `counter.lock().await`.
        hints:
          - "`let mut count = counter.lock().await;` gives a guard you may keep across `.await`."
          - "`*count += 1; save_ticket(*count).await; *count`."
        harness: |
          fn run<F: std::future::Future>(future: F) -> F::Output {
              tokio::runtime::Runtime::new().unwrap().block_on(future)
          }

          #[test]
          fn first_ticket_is_number_one() {
              let counter = tokio::sync::Mutex::new(0);
              assert_eq!(run(issue_ticket(&counter)), 1, "issue_ticket on a new counter");
          }

          #[test]
          fn tickets_count_up() {
              let counter = tokio::sync::Mutex::new(0);
              let numbers = run(async {
                  let a = issue_ticket(&counter).await;
                  let b = issue_ticket(&counter).await;
                  let c = issue_ticket(&counter).await;
                  vec![a, b, c]
              });
              assert_eq!(numbers, vec![1, 2, 3], "three tickets one after another");
          }

          #[test]
          fn concurrent_tickets_are_all_different() {
              let counter = tokio::sync::Mutex::new(100);
              let mut numbers = run(async {
                  let (a, b, c, d) = tokio::join!(issue_ticket(&counter), issue_ticket(&counter), issue_ticket(&counter), issue_ticket(&counter));
                  vec![a, b, c, d]
              });
              numbers.sort();
              assert_eq!(numbers, vec![101, 102, 103, 104], "four tickets at the same time");
          }
