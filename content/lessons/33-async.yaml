      use tokio::time::sleep;

      async fn fetch_user(id: u32) -> String {
          // later ids answer faster, so the tasks finish out of order
          sleep(Duration::from_millis(u64::from(20 - id % 20))).await;
          format!("user-{id}")
      }

      async fn fetch_all(ids: Vec<u32>) -> Vec<String> {
          todo!()
      }
    solution: |
      use std::time::Duration;
      use tokio::time::sleep;

      async fn fetch_user(id: u32) -> String {
          // later ids answer faster, so the tasks finish out of order
          sleep(Duration::from_millis(u64::from(20 - id % 20))).await;
          format!("user-{id}")
      }

      async fn fetch_all(ids: Vec<u32>) -> Vec<String> {
          let mut handles = Vec::new();
          for id in ids {
              handles.push(tokio::spawn(fetch_user(id)));
          }
          let mut users = Vec::new();
          for handle in handles {
              users.push(handle.await.unwrap());
          }
          users
      }
    require:
