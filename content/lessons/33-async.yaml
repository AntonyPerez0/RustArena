id: async
title: Async Rust with Tokio
phase: "Concurrency and async"
summary: Handle thousands of waiting tasks on a few threads. Futures and .await, the Tokio runtime, running futures concurrently with join!, spawning tasks, async channels, racing futures with select! and timeouts, and when to choose async over threads.
roadmap: ["Futures & Async/Await Paradigm", "tokio"]
steps:
  - title: "Futures, async fn and .await"
    id: async-1
    text: |
      Threads are great for keeping CPU cores busy. But a lot of real work is **waiting**: for a database query, a web API, a file, a timer. A web server with 10,000 open connections spends almost all of its time waiting for the network. One OS thread per connection means 10,000 threads, each with its own stack, and the operating system constantly switching between them.

      **Async** code lets a few threads juggle thousands of waiting jobs. Whenever a job would wait, it steps aside, and the thread runs another job that's ready to make progress. Two keywords make it work:

      - **`async fn`** defines a function that doesn't run when you call it. Instead, calling it returns a **future**: a value that stands for a computation that will produce its result later. (Formally, something that implements the `Future` trait, with an `Output` type.)
      - **`.await`**, written *after* a future, runs it until it finishes and gives you its output. While the future is waiting, `.await` lets the current job pause so other jobs can run.

      ```rust run
      async fn fetch_price(item: &str) -> u32 {
          match item {
              "kelp" => 3,
              "pearl" => 250,
              _ => 0,
          }
      }

      #[tokio::main]
      async fn main() {
          let price = fetch_price("pearl").await;
          println!("pearl costs {price}");
          let total = fetch_price("kelp").await * 4;
          println!("four kelp cost {total}");
      }
      ```

      ```output
      pearl costs 250
      four kelp cost 12
      ```

      - `async fn fetch_price(item: &str) -> u32` really returns `impl Future<Output = u32>`. In a real program it would call a web service; here it answers at once, so you can focus on the syntax.
      - `fetch_price("pearl").await` runs the future and gives back the `u32`. Because `.await` is postfix, calls chain nicely: `fetch(url).await?.parse()`.
      - `#[tokio::main]` sets up an async **runtime** for `async fn main`. More on that below.

      ### Futures are lazy

      Calling an async function does **nothing** until the future is awaited:

      ```rust run
      async fn load_profile(name: &str) -> String {
          println!("loading {name}...");
          format!("{name} (level 12)")
      }

      #[tokio::main]
      async fn main() {
          let future = load_profile("ferris");
          println!("future created, nothing loaded yet");
          let profile = future.await;
          println!("got {profile}");
      }
      ```

      ```output
      future created, nothing loaded yet
      loading ferris...
      got ferris (level 12)
      ```

      Forget the `.await` and the work never happens. The compiler warns you: ``warning: unused implementer of `Future` that must be used``, with the note `futures do nothing unless you .await or poll them`. That warning almost always means a bug.

      ### The runtime

      The standard library defines `Future`, `async` and `.await`, but not the machinery that runs futures, the **runtime** (also called an executor). You pick one as a crate. **Tokio** is the one nearly every company uses, and most async crates (the axum web framework, the reqwest HTTP client, the sqlx database library) are built on it:

      ```toml
      [dependencies]
      tokio = { version = "1", features = ["full"] }
      ```

      `#[tokio::main]` turns `async fn main` into a normal `main` that starts a Tokio runtime and runs your code on it. Without it, rustc stops you with ``error[E0752]: `main` function is not allowed to be `async` ``.

      ### .await only works in async code

      ```rust compile_fail
      async fn price() -> u32 {
          5
      }

      fn main() {
          let p = price().await;
          println!("{p}");
      }
      ```

      ```error
      error[E0728]: `await` is only allowed inside `async` functions and blocks
      ```

      The fix is to make the calling function `async` too, and its callers, all the way up to `main`. That's normal: async code spreads up the call chain.

      ### Common mistakes

      - **Forgetting `.await`**: the future is created and thrown away; nothing runs. Read the warning.
      - **Writing `await fetch()`** as in JavaScript or C#. Rust's `.await` goes after: `fetch().await`.
      - **Calling async code from a normal `fn`**: `E0728`. Make it `async`, or (in tests and small tools) run it with a runtime's `block_on`, next step.

      **Your turn:** fill in the three blanks: the attribute that starts Tokio, the keyword that makes `main` asynchronous, and the keyword that waits for the first future. The program should print `in stock: 10 items`.
    fill: |
      async fn count_stock(item: &str) -> u32 {
          match item {
              "helmet" => 7,
              "shield" => 3,
              _ => 0,
          }
      }

      #[tokio::[[main]]]
      [[async]] fn main() {
          let helmets = count_stock("helmet").[[await]];
          let shields = count_stock("shield").await;
          println!("in stock: {} items", helmets + shields);
      }
    hints:
      - "The attribute is `#[tokio::main]`, and it goes on an `async fn main`."
      - "To get the value out of a future, add `.await` after it."
    tests:
      - expect: "in stock: 10 items"
    more:
      - task: |
          `double_score` is awaited in `main`, so it has to be an async function. Fill in the keyword. The program should print `score: 42`.
        fill: |
          [[async]] fn double_score(score: u32) -> u32 {
              score * 2
          }

          #[tokio::main]
          async fn main() {
              let s = double_score(21).await;
              println!("score: {s}");
          }
        hints:
          - "A function whose result you `.await` is declared with `async fn`."
        tests:
          - expect: "score: 42"
      - task: |
          Write two async functions and use them from `main`:

          - `async fn load_scores(player: &str) -> Vec<u32>` returns `[30, 50, 20]` for `"ana"`, `[80, 10]` for `"bo"`, and an empty `Vec` for anyone else.
          - `async fn best_score(player: &str) -> Option<u32>` awaits `load_scores` and returns the highest score (`None` if there are no scores).

          In `main`, print the best score of `ana`, `bo` and `cy`:

          ```
          ana: Some(50)
          bo: Some(80)
          cy: None
          ```
        seed: |
          #[tokio::main]
          async fn main() {
          }
        solution: |
          async fn load_scores(player: &str) -> Vec<u32> {
              match player {
                  "ana" => vec![30, 50, 20],
                  "bo" => vec![80, 10],
                  _ => Vec::new(),
              }
          }

          async fn best_score(player: &str) -> Option<u32> {
              let scores = load_scores(player).await;
              scores.into_iter().max()
          }

          #[tokio::main]
          async fn main() {
              for player in ["ana", "bo", "cy"] {
                  println!("{player}: {:?}", best_score(player).await);
              }
          }
        require:
          - pattern: 'async\s+fn\s+best_score'
            message: Write `best_score` as an `async fn`.
          - pattern: 'load_scores\([^)]*\)\s*\.await'
            message: "`best_score` should await `load_scores`."
        hints:
          - "`load_scores` is a `match` on `player` that returns a `Vec<u32>` in each arm."
          - "`best_score`: `let scores = load_scores(player).await; scores.into_iter().max()`."
          - "In `main`, `println!(\"{player}: {:?}\", best_score(player).await);` for each name."
        tests:
          - expect: "ana: Some(50)\nbo: Some(80)\ncy: None"

  - title: "The runtime, and sleeping without blocking"
    id: async-2
    text: |
      `#[tokio::main]` hides a few lines. Written out by hand, it's this:

      ```rust run
      use std::time::Duration;

      async fn boil_water() -> &'static str {
          tokio::time::sleep(Duration::from_millis(5)).await;
          "water boiled"
      }

      fn main() {
          let runtime = tokio::runtime::Runtime::new().unwrap();
          let result = runtime.block_on(boil_water());
          println!("{result}");
      }
      ```

      ```output
      water boiled
      ```

      - `Runtime::new()` starts Tokio: a pool of **worker threads** (one per CPU core by default) plus a timer and an I/O driver.
      - `block_on(future)` runs a future to completion and blocks the current (normal, non-async) thread until it's done. It's the bridge from ordinary code into async code. You'll use it in tests, and in small tools that call one async library.
      - Inside the runtime, work is organized in **tasks**: lightweight jobs that the runtime switches between whenever one of them is waiting at an `.await`. `main`'s future is the first task.
      - `#[tokio::main(flavor = "current_thread")]` runs everything on one thread, handy for small tools and tests.

      ### tokio::time::sleep, not std::thread::sleep

      `tokio::time::sleep(duration).await` pauses the current **task**. The worker thread is free to run other tasks in the meantime, and the timer wakes the task up later.

      `std::thread::sleep` pauses the whole **thread**. In async code, that freezes every task scheduled on that worker. The program still produces the right output, which is what makes it dangerous: it's just slow, and under load everything stalls. The golden rule of async code: **never block**. No `std::thread::sleep`, no long CPU loops, no blocking file or network calls inside async functions. Use the async versions (`tokio::time::sleep`, `tokio::fs`, `tokio::net`), or move the blocking work elsewhere (step 7).

      ### Awaits run one after another

      Each `.await` waits for its future to finish before the next line runs:

      ```rust run
      use std::time::Duration;
      use tokio::time::sleep;

      async fn fetch_user(id: u32) -> String {
          sleep(Duration::from_millis(20)).await; // pretend this is a network call
          format!("user{id}")
      }

      #[tokio::main]
      async fn main() {
          let a = fetch_user(1).await;
          let b = fetch_user(2).await;
          println!("{a} and {b}");
      }
      ```

      ```output
      user1 and user2
      ```

      This takes about 40 ms: the second call doesn't start until the first is done. That's right when the second call needs the first one's result. When they're independent, you can run them at the same time: next step.

      ### Common mistakes

      - **`std::thread::sleep` in async code**: correct output, frozen worker thread. Use `tokio::time::sleep(...).await`.
      - **Forgetting `.await` on `sleep`**: `tokio::time::sleep(d);` creates a timer future and drops it, so nothing waits (and you get the "unused `Future`" warning).
      - **Calling `block_on` inside async code**: Tokio panics with "Cannot start a runtime from within a runtime". `block_on` is only for the boundary from normal code; inside async code, just `.await`.

      **Your turn:** services fail sometimes, and real clients **retry with backoff**: wait a little longer after each failure. Write `async fn ping_with_retry(service: &mut FlakyService, max_tries: u32) -> Result<String, String>`. Try `service.ping().await` up to `max_tries` times (assume at least 1):

      - on success at attempt `n` (counting from 1), return `Ok(format!("{reply} (attempt {n})"))`;
      - after a failure, if there are tries left, wait `2^n` milliseconds with **Tokio's** sleep (`Duration::from_millis(2u64.pow(n))`) before trying again;
      - if every try fails, return `Err(format!("gave up after {max_tries} attempts: {last_error}"))` with the last error message.
    seed: |
      use std::time::Duration;
      use tokio::time::sleep;

      // A service that fails `failures_left` times, then answers "pong".
      struct FlakyService {
          failures_left: u32,
      }

      impl FlakyService {
          async fn ping(&mut self) -> Result<String, String> {
              if self.failures_left > 0 {
                  self.failures_left -= 1;
                  Err(String::from("connection refused"))
              } else {
                  Ok(String::from("pong"))
              }
          }
      }

      async fn ping_with_retry(service: &mut FlakyService, max_tries: u32) -> Result<String, String> {
          todo!()
      }
    solution: |
      use std::time::Duration;
      use tokio::time::sleep;

      // A service that fails `failures_left` times, then answers "pong".
      struct FlakyService {
          failures_left: u32,
      }

      impl FlakyService {
          async fn ping(&mut self) -> Result<String, String> {
              if self.failures_left > 0 {
                  self.failures_left -= 1;
                  Err(String::from("connection refused"))
              } else {
                  Ok(String::from("pong"))
              }
          }
      }

      async fn ping_with_retry(service: &mut FlakyService, max_tries: u32) -> Result<String, String> {
          let mut last_error = String::new();
          for attempt in 1..=max_tries {
              match service.ping().await {
                  Ok(reply) => return Ok(format!("{reply} (attempt {attempt})")),
                  Err(e) => last_error = e,
              }
              if attempt < max_tries {
                  sleep(Duration::from_millis(2u64.pow(attempt))).await;
              }
          }
          Err(format!("gave up after {max_tries} attempts: {last_error}"))
      }
    require:
      - pattern: 'sleep\([\s\S]*?\)\s*\.await'
        message: Wait between attempts with Tokio's `sleep(...).await`.
    forbid:
      - pattern: 'thread::sleep'
        message: "`std::thread::sleep` blocks the runtime's thread; use `tokio::time::sleep(...).await`."
    hints:
      - "Loop `for attempt in 1..=max_tries`, and `match service.ping().await`: return right away on `Ok`, remember the message on `Err`."
      - "After a failure, `if attempt < max_tries { sleep(Duration::from_millis(2u64.pow(attempt))).await; }`."
      - "After the loop, every try failed: `Err(format!(\"gave up after {max_tries} attempts: {last_error}\"))`."
    harness: |
      fn run<F: std::future::Future>(future: F) -> F::Output {
          tokio::runtime::Runtime::new().unwrap().block_on(future)
      }

      #[test]
      fn answers_on_the_first_try() {
          let mut service = FlakyService { failures_left: 0 };
          assert_eq!(run(ping_with_retry(&mut service, 3)), Ok(String::from("pong (attempt 1)")), "0 failures, max 3 tries");
      }

      #[test]
      fn retries_until_it_works() {
          let mut service = FlakyService { failures_left: 2 };
          assert_eq!(run(ping_with_retry(&mut service, 5)), Ok(String::from("pong (attempt 3)")), "2 failures, max 5 tries");
      }

      #[test]
      fn works_on_the_last_allowed_try() {
          let mut service = FlakyService { failures_left: 3 };
          assert_eq!(run(ping_with_retry(&mut service, 4)), Ok(String::from("pong (attempt 4)")), "3 failures, max 4 tries");
      }

      #[test]
      fn gives_up_after_max_tries() {
          let mut service = FlakyService { failures_left: 10 };
          assert_eq!(
              run(ping_with_retry(&mut service, 3)),
              Err(String::from("gave up after 3 attempts: connection refused")),
              "10 failures, max 3 tries"
          );
      }
    more:
      - task: |
          Call async code from a normal `fn main`, without `#[tokio::main]`: fill in the function that creates the runtime and the method that runs a future to completion. The program should print `cache ready with 128 entries`.
        fill: |
          use std::time::Duration;

          async fn warm_up_cache() -> usize {
              tokio::time::sleep(Duration::from_millis(3)).await;
              128
          }

          fn main() {
              let runtime = tokio::runtime::Runtime::[[new]]().unwrap();
              let entries = runtime.[[block_on]](warm_up_cache());
              println!("cache ready with {entries} entries");
          }
        hints:
          - "A runtime is created with `Runtime::new()`, which returns a `Result`."
          - "`runtime.block_on(future)` runs the future and returns its output."
        tests:
          - expect: "cache ready with 128 entries"
      - task: |
          This kitchen timer prints the right lines, but `std::thread::sleep` blocks the runtime's worker thread while it waits. Switch `timer` to Tokio's non-blocking sleep (and await it). The output stays the same:

          ```
          eggs: done after 3 ms
          toast: done after 2 ms
          tea: done after 4 ms
          ```
        seed: |
          use std::time::Duration;

          async fn timer(name: &str, ms: u64) -> String {
              std::thread::sleep(Duration::from_millis(ms));
              format!("{name}: done after {ms} ms")
          }

          #[tokio::main]
          async fn main() {
              println!("{}", timer("eggs", 3).await);
              println!("{}", timer("toast", 2).await);
              println!("{}", timer("tea", 4).await);
          }
        solution: |
          use std::time::Duration;

          async fn timer(name: &str, ms: u64) -> String {
              tokio::time::sleep(Duration::from_millis(ms)).await;
              format!("{name}: done after {ms} ms")
          }

          #[tokio::main]
          async fn main() {
              println!("{}", timer("eggs", 3).await);
              println!("{}", timer("toast", 2).await);
              println!("{}", timer("tea", 4).await);
          }
        require:
          - pattern: 'sleep\([\s\S]*?\)\s*\.await'
            message: "Use Tokio's sleep and `.await` it."
        forbid:
          - pattern: 'thread::sleep'
            message: "`std::thread::sleep` blocks the worker thread; use `tokio::time::sleep(...).await`."
        hints:
          - "Replace `std::thread::sleep(...)` with `tokio::time::sleep(...)`."
          - "Tokio's sleep returns a future: add `.await`, or it never waits."
        tests:
          - expect: "eggs: done after 3 ms\ntoast: done after 2 ms\ntea: done after 4 ms"

  - title: "Running futures at the same time: join! and try_join!"
    id: async-3
    text: |
      When two calls don't depend on each other, waiting for one before starting the other wastes time. **`tokio::join!`** takes several futures, runs them **concurrently**, and when *all* of them have finished, returns their outputs as a tuple, in the order you listed them:

      ```rust run
      use std::time::Duration;
      use tokio::time::sleep;

      async fn fetch_profile(id: u32) -> String {
          sleep(Duration::from_millis(30)).await;
          format!("profile of user {id}")
      }

      async fn fetch_orders(id: u32) -> Vec<u32> {
          sleep(Duration::from_millis(10)).await;
          vec![id * 100, id * 100 + 1]
      }

      async fn fetch_balance(id: u32) -> i64 {
          sleep(Duration::from_millis(20)).await;
          i64::from(id) * 1000
      }

      #[tokio::main]
      async fn main() {
          let (profile, orders, balance) = tokio::join!(fetch_profile(7), fetch_orders(7), fetch_balance(7));
          println!("{profile}");
          println!("orders: {orders:?}");
          println!("balance: {balance}");
      }
      ```

      ```output
      profile of user 7
      orders: [700, 701]
      balance: 7000
      ```

      The three waits overlap, so this takes about 30 ms (the slowest one) instead of 60 ms. And the results come back in argument order, not finishing order, so the output never changes.

      How can this work without threads? `join!` runs all three futures **inside one task**. When one is waiting at an `.await` (here, sleeping), `join!` moves on and lets the next one make progress. Nothing needs a second CPU core, because all three are mostly just waiting. That's **concurrency without parallelism**, the heart of async.

      ### try_join! for things that can fail

      With futures that return `Result`, `tokio::try_join!` gives `Ok((a, b, ...))` if all of them succeed, or the **first** `Err` as soon as one fails. The others are then dropped, which cancels them: no point waiting for the rest. It pairs nicely with `?`:

      ```rust run
      async fn load_config() -> Result<String, String> {
          Ok(String::from("port=8080"))
      }

      async fn connect_db() -> Result<u32, String> {
          Err(String::from("database unreachable"))
      }

      async fn start() -> Result<(), String> {
          let (config, conn) = tokio::try_join!(load_config(), connect_db())?;
          println!("started with {config} and connection {conn}");
          Ok(())
      }

      #[tokio::main]
      async fn main() {
          if let Err(e) = start().await {
              println!("startup failed: {e}");
          }
      }
      ```

      ```output
      startup failed: database unreachable
      ```

      All the futures in one `try_join!` must use the same error type. Convert with `map_err`, or use `anyhow::Error` (module 39) in application code.

      `join!` takes a fixed list of futures written in your code. For a `Vec` of work whose length you only know at run time, spawn a task per item: next step.

      ### Common mistakes

      - **Awaiting independent calls one by one**: `let a = f().await; let b = g().await;` takes the sum of both times. Use `join!`.
      - **Expecting `join!` to use several cores**: everything runs in one task. It speeds up *waiting*, not CPU work (step 7).
      - **Mixed error types in `try_join!`**: a type mismatch error. Make the errors the same type first.

      **Your turn:** `dashboard` needs three independent pieces of data. Write it so the three fetches run **at the same time** with `tokio::join!`, and return `"{name}: {points} points, rank #{rank}"`. The program should print:

      ```
      ferris: 600 points, rank #3
      corro: 1200 points, rank #2
      ```
    seed: |
      use std::time::Duration;
      use tokio::time::sleep;

      async fn fetch_name(user: u32) -> String {
          sleep(Duration::from_millis(15)).await;
          match user {
              1 => String::from("ferris"),
              2 => String::from("corro"),
              _ => String::from("unknown"),
          }
      }

      async fn fetch_points(user: u32) -> u32 {
          sleep(Duration::from_millis(10)).await;
          user * 600
      }

      async fn fetch_rank(user: u32) -> u32 {
          sleep(Duration::from_millis(5)).await;
          4 - user
      }

      async fn dashboard(user: u32) -> String {
          // run the three fetches at the same time with tokio::join!
          todo!()
      }

      #[tokio::main]
      async fn main() {
          println!("{}", dashboard(1).await);
          println!("{}", dashboard(2).await);
      }
    solution: |
      use std::time::Duration;
      use tokio::time::sleep;

      async fn fetch_name(user: u32) -> String {
          sleep(Duration::from_millis(15)).await;
          match user {
              1 => String::from("ferris"),
              2 => String::from("corro"),
              _ => String::from("unknown"),
          }
      }

      async fn fetch_points(user: u32) -> u32 {
          sleep(Duration::from_millis(10)).await;
          user * 600
      }

      async fn fetch_rank(user: u32) -> u32 {
          sleep(Duration::from_millis(5)).await;
          4 - user
      }

      async fn dashboard(user: u32) -> String {
          // run the three fetches at the same time with tokio::join!
          let (name, points, rank) = tokio::join!(fetch_name(user), fetch_points(user), fetch_rank(user));
          format!("{name}: {points} points, rank #{rank}")
      }

      #[tokio::main]
      async fn main() {
          println!("{}", dashboard(1).await);
          println!("{}", dashboard(2).await);
      }
    require:
      - pattern: 'join!'
        message: Run the three fetches concurrently with `tokio::join!`.
    hints:
      - "`tokio::join!(a, b, c)` returns a tuple of the three outputs, in the same order."
      - "`let (name, points, rank) = tokio::join!(fetch_name(user), fetch_points(user), fetch_rank(user));` then `format!(...)`."
    tests:
      - expect: "ferris: 600 points, rank #3\ncorro: 1200 points, rank #2"
    more:
      - task: |
          Fill in the macro that runs both lookups at the same time and returns both results. The program should print `pearl: 4 in stock at 250 each`.
        fill: |
          use std::time::Duration;
          use tokio::time::sleep;

          async fn fetch_stock(item: &str) -> u32 {
              sleep(Duration::from_millis(4)).await;
              item.len() as u32 - 1
          }

          async fn fetch_price(item: &str) -> u32 {
              sleep(Duration::from_millis(2)).await;
              item.len() as u32 * 50
          }

          #[tokio::main]
          async fn main() {
              let (stock, price) = tokio::[[join]]!(fetch_stock("pearl"), fetch_price("pearl"));
              println!("pearl: {stock} in stock at {price} each");
          }
        hints:
          - "The macro is `tokio::join!`, and it returns a tuple in argument order."
        tests:
          - expect: "pearl: 4 in stock at 250 each"
      - task: |
          Write `async fn load_order(order_id: u32) -> Result<Order, String>` that fetches the customer and the items **concurrently** with `tokio::try_join!`, and returns the first error if either fetch fails. Use `?` on the result of `try_join!`.
        seed: |
          use std::time::Duration;
          use tokio::time::sleep;

          #[derive(Debug, PartialEq)]
          struct Order {
              customer: String,
              items: Vec<String>,
          }

          async fn fetch_customer(order_id: u32) -> Result<String, String> {
              sleep(Duration::from_millis(3)).await;
              if order_id == 0 {
                  Err(format!("order {order_id} has no customer"))
              } else {
                  Ok(format!("customer-{order_id}"))
              }
          }

          async fn fetch_items(order_id: u32) -> Result<Vec<String>, String> {
              sleep(Duration::from_millis(5)).await;
              if order_id == 13 {
                  Err(String::from("item service unavailable"))
              } else {
                  Ok(vec![format!("kelp x{order_id}"), String::from("shell x1")])
              }
          }

          async fn load_order(order_id: u32) -> Result<Order, String> {
              todo!()
          }
