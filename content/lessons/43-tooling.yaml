  - title: "Continuous integration: keeping main green"
    id: tooling-7
    text: |
      Tests, clippy and rustfmt only protect a codebase if they run *every time*. **Continuous integration (CI)** is a server that checks out every pushed commit and pull request, runs the checks, and reports a green tick or a red cross. With **branch protection** turned on, a pull request can't be merged until CI is green, so the main branch always builds, passes its tests and follows the team's rules.

      ### A GitHub Actions workflow

      On GitHub, CI is a YAML file in `.github/workflows/`. A typical Rust one:

      ```yaml
      # .github/workflows/ci.yml
      name: CI

      on:
        push:
          branches: [main]
        pull_request:

      env:
        CARGO_TERM_COLOR: always

      jobs:
        check:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - name: Formatting
              run: cargo fmt --all --check
            - name: Lints
              run: cargo clippy --all-targets --all-features -- -D warnings
            - name: Tests
              run: cargo test --all-features
            - name: Docs
              run: cargo doc --no-deps
              env:
                RUSTDOCFLAGS: -D warnings
      ```

      - `on`: when to run: pushes to `main`, and every pull request.
      - `actions/checkout` gets the code; `dtolnay/rust-toolchain` installs Rust with clippy and rustfmt; `Swatinem/rust-cache` caches compiled dependencies between runs (builds go from minutes to seconds).
      - Each `run` step is a shell command. A command that exits with a non-zero code fails the step, and the job stops there.
      - `-- -D warnings` turns clippy's warnings into errors (`-D` is "deny"), so a warning fails CI instead of scrolling past. `--all-targets` lints tests and examples too.
      - `RUSTDOCFLAGS: -D warnings` fails on broken intra-doc links in the docs.

      Exit codes are how every tool tells CI "pass" or "fail". Here's a tiny custom check, the kind teams add for their own rules, that finds forgotten debugging code:

      ```rust run
      fn main() {
          let source = "fn main() {\n    let x = dbg!(2 + 2);\n    println!(\"{x}\");\n}\n";
          let mut problems = 0;
          for (i, line) in source.lines().enumerate() {
              if line.contains("dbg!(") || line.contains("todo!(") {
                  println!("line {}: leftover debug code: {}", i + 1, line.trim());
                  problems += 1;
              }
          }
          println!("{problems} problem(s)");
          // A real check would end with: std::process::exit(if problems > 0 { 1 } else { 0 });
      }
      ```

      ```output
      line 2: leftover debug code: let x = dbg!(2 + 2);
      1 problem(s)
      ```

      ### Beyond the basics

      - A **matrix** runs the same job on several operating systems or Rust versions (`stable`, `beta`, and your **MSRV**, the minimum supported Rust version declared as `rust-version` in `Cargo.toml`).
      - `cargo audit` and `cargo deny` check dependencies for known security advisories and unwanted licenses.
      - Run the same commands locally before pushing (`cargo fmt && cargo clippy --all-targets -- -D warnings && cargo test`). Many teams put them in a script or a git pre-push hook, so CI is a formality.

      ### Reading a red CI run

      Open the failed step's log and read it like any compiler or test output: the first error is usually the real one. A failing `fmt --check` shows a diff of what rustfmt would change; a failing clippy step shows the lint; a failing test shows the panic message.

      ### Common mistakes

      - **"Works on my machine"**: CI starts from a clean checkout, so a file you forgot to commit, or a test that depends on your local setup, fails there. That's CI doing its job.
      - **Disabling a failing check to merge faster.** Fix it, or mark the one test `#[ignore]` with an issue link if it's genuinely flaky.
      - **Letting CI get slow.** Cache dependencies, and split long jobs so feedback arrives in minutes.

      **Your turn:** this pull request's CI is red. The log says:

      ```text
      Run cargo clippy --all-targets -- -D warnings
      error: unneeded `return` statement
        --> src/lib.rs:22:5
         |
      22 |     return Some(format!("{}.{}.{}", bumped.0, bumped.1, bumped.2));
         |     ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^

      Run cargo test
      test tests::bumps_minor_and_resets_patch ... FAILED
      assertion `left == right` failed
        left: Some("1.5.2")
       right: Some("1.5.0")
      ```

      Make it green: fix the clippy error, fix the bug the test found (a minor bump must reset the patch number to 0), keep the existing test, and add tests until you have at least **3** and they catch every planted bug (in `major` and `patch` bumps, version parsing, and unknown parts).
    mode: test
    minTests: 3
    seed: |
      /// Splits "major.minor.patch" into numbers.
      fn parse_version(v: &str) -> Option<(u32, u32, u32)> {
          let parts: Vec<&str> = v.split('.').collect();
          if parts.len() != 3 {
              return None;
          }
          let major = parts[0].parse().ok()?;
          let minor = parts[1].parse().ok()?;
          let patch = parts[2].parse().ok()?;
          Some((major, minor, patch))
      }

      /// Bumps one part of a version ("major", "minor" or "patch") and resets the parts after it.
      fn bump(v: &str, part: &str) -> Option<String> {
          let (major, minor, patch) = parse_version(v)?;
          let bumped = match part {
              "major" => (major + 1, 0, 0),
              "minor" => (major, minor + 1, patch),
              "patch" => (major, minor, patch + 1),
              _ => return None,
          };
          return Some(format!("{}.{}.{}", bumped.0, bumped.1, bumped.2));
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn bumps_minor_and_resets_patch() {
              assert_eq!(bump("1.4.2", "minor"), Some("1.5.0".to_string()));
          }
      }
    solution: |
      /// Splits "major.minor.patch" into numbers.
      fn parse_version(v: &str) -> Option<(u32, u32, u32)> {
          let parts: Vec<&str> = v.split('.').collect();
          if parts.len() != 3 {
              return None;
          }
          let major = parts[0].parse().ok()?;
          let minor = parts[1].parse().ok()?;
          let patch = parts[2].parse().ok()?;
          Some((major, minor, patch))
      }

      /// Bumps one part of a version ("major", "minor" or "patch") and resets the parts after it.
      fn bump(v: &str, part: &str) -> Option<String> {
          let (major, minor, patch) = parse_version(v)?;
          let bumped = match part {
              "major" => (major + 1, 0, 0),
              "minor" => (major, minor + 1, 0),
              "patch" => (major, minor, patch + 1),
              _ => return None,
          };
          Some(format!("{}.{}.{}", bumped.0, bumped.1, bumped.2))
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn bumps_minor_and_resets_patch() {
              assert_eq!(bump("1.4.2", "minor"), Some("1.5.0".to_string()));
          }

          #[test]
          fn bumps_major_and_resets_the_rest() {
              assert_eq!(bump("1.4.2", "major"), Some("2.0.0".to_string()));
          }

          #[test]
          fn bumps_patch_by_one() {
              assert_eq!(bump("1.4.2", "patch"), Some("1.4.3".to_string()));
          }

          #[test]
          fn rejects_bad_versions_and_parts() {
              assert_eq!(bump("1.4", "patch"), None);
              assert_eq!(bump("1.4.2.7", "patch"), None);
              assert_eq!(bump("1.4.2", "build"), None);
          }
      }
    forbid:
      - pattern: 'return\s+Some'
        message: "Clippy's needless_return: end `bump` with `Some(...)` instead of `return Some(...);`."
    harness: |
      #[test]
      fn a_minor_bump_resets_the_patch() {
          assert_eq!(bump("1.4.2", "minor"), Some("1.5.0".to_string()), "bump(\"1.4.2\", \"minor\")");
          assert_eq!(bump("0.9.9", "minor"), Some("0.10.0".to_string()), "bump(\"0.9.9\", \"minor\")");
      }
    mutants:
      - name: a major bump keeps the minor number
        find: "(major + 1, 0, 0)"
        replace: "(major + 1, minor, 0)"
      - name: a patch bump adds 2
        find: "(major, minor, patch + 1)"
        replace: "(major, minor, patch + 2)"
      - name: four-part versions are accepted
        find: "parts.len() != 3"
        replace: "parts.len() < 3"
      - name: unknown parts are ignored instead of rejected
        find: "_ => return None,"
        replace: "_ => (major, minor, patch),"
    hints:
      - "Clippy: drop `return` and the `;` from the last line, so it ends with `Some(format!(...))`."
      - "The bug: the `\"minor\"` arm must produce `(major, minor + 1, 0)`."
      - "Add tests for `bump(\"1.4.2\", \"major\")` (2.0.0), `\"patch\"` (1.4.3), a 4-part version like `\"1.4.2.7\"` and an unknown part like `\"build\"` (both `None`)."
    more:
      - task: |
          Get this library function ready for CI: the file has `#![deny(missing_docs)]`, so document `slugify` (a summary line and an `# Examples` section) and the crate (a `//!` line). Then write at least **3 tests** that catch every planted bug. `slugify` keeps ASCII letters and digits (lowercased) and turns every run of other characters into a single `-`, with no dash at the start or end: `"Hello, World!"` becomes `hello-world`.
        mode: test
        minTests: 3
        seed: |
          #![deny(missing_docs)]

          pub fn slugify(title: &str) -> String {
              let mut slug = String::new();
              for c in title.chars() {
                  if c.is_ascii_alphanumeric() {
                      slug.push(c.to_ascii_lowercase());
                  } else if !slug.is_empty() && !slug.ends_with('-') {
                      slug.push('-');
                  }
              }
              slug.trim_end_matches('-').to_string()
          }
        solution: |
          #![deny(missing_docs)]
          //! URL helpers for the arena blog.

          /// Turns a title into a URL slug: lowercase ASCII letters and digits joined by single dashes.
          ///
          /// # Examples
          ///
          /// ```
          /// assert_eq!(slugify("Hello, World!"), "hello-world");
          /// ```
          pub fn slugify(title: &str) -> String {
              let mut slug = String::new();
              for c in title.chars() {
                  if c.is_ascii_alphanumeric() {
                      slug.push(c.to_ascii_lowercase());
                  } else if !slug.is_empty() && !slug.ends_with('-') {
                      slug.push('-');
                  }
              }
              slug.trim_end_matches('-').to_string()
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn lowercases_and_joins_words() {
                  assert_eq!(slugify("Hello World"), "hello-world");
              }

              #[test]
              fn runs_of_punctuation_become_one_dash() {
                  assert_eq!(slugify("Rust -- 2024 edition!!"), "rust-2024-edition");
              }

              #[test]
              fn no_dashes_at_the_ends() {
                  assert_eq!(slugify("  ...Crabs!  "), "crabs");
              }
          }
        require:
          - pattern: '#!\[deny\(missing_docs\)\]'
            message: "Keep `#![deny(missing_docs)]` at the top: CI uses it to require docs."
        mutants:
          - name: capitals are kept
            find: "slug.push(c.to_ascii_lowercase());"
            replace: "slug.push(c);"
          - name: repeated separators make repeated dashes
            find: " && !slug.ends_with('-')"
            replace: ""
          - name: a trailing dash is kept
            find: "slug.trim_end_matches('-').to_string()"
            replace: "slug"
          - name: a leading separator makes a leading dash
            find: "!slug.is_empty() && "
            replace: ""
        hints:
          - "Add `//! ...` after the `#![deny(missing_docs)]` line, and `/// ...` lines above `pub fn slugify`, including `/// # Examples` and a fenced code block."
          - "Write a `#[cfg(test)] mod tests` with titles that have capitals, several punctuation marks in a row, and punctuation or spaces at the start and end."
      - task: |
          CI jobs often skip work when a pull request only touches documentation. `should_run_ci` decides: it returns `true` if any changed file is a Rust file (`.rs`) or is `Cargo.toml` or `Cargo.lock`, and `false` otherwise (including when nothing changed). Write the tests module and at least **3 tests** that catch every planted bug.
        mode: test
        minTests: 3
        seed: |
          fn should_run_ci(changed: &[&str]) -> bool {
              changed.iter().any(|path| {
                  path.ends_with(".rs") || *path == "Cargo.toml" || *path == "Cargo.lock"
              })
          }
        solution: |
          fn should_run_ci(changed: &[&str]) -> bool {
              changed.iter().any(|path| {
                  path.ends_with(".rs") || *path == "Cargo.toml" || *path == "Cargo.lock"
              })
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn docs_only_changes_skip_ci() {
                  assert!(!should_run_ci(&["README.md", "docs/guide.md"]));
                  assert!(!should_run_ci(&[]));
              }

              #[test]
              fn any_rust_file_runs_ci() {
                  assert!(should_run_ci(&["README.md", "src/main.rs"]));
              }

              #[test]
              fn dependency_changes_run_ci() {
                  assert!(should_run_ci(&["Cargo.toml"]));
                  assert!(should_run_ci(&["Cargo.lock"]));
              }
          }
        mutants:
          - name: Rust files are ignored
            find: "path.ends_with(\".rs\") || "
            replace: ""
          - name: Cargo.lock changes are ignored
            find: " || *path == \"Cargo.lock\""
            replace: ""
          - name: every changed file must qualify
            find: "changed.iter().any("
            replace: "changed.iter().all("
          - name: every change runs CI
            find: "path.ends_with(\".rs\") || *path == \"Cargo.toml\" || *path == \"Cargo.lock\""
            replace: "!path.is_empty()"
        hints:
          - "Test a docs-only change (should be `false`), a change that mixes a Markdown file with a `.rs` file (should be `true`), and `Cargo.toml` and `Cargo.lock` on their own."
          - "An empty list of changes is a good edge case: it should be `false`."
