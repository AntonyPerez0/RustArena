              text.split_whitespace().count()
          }

          fn shout(text: String) -> String {
              text.to_uppercase()
          }

          fn main() {
              let review = String::from("rust makes refactoring fearless");
              let words = count_words(review.clone());
              let loud = shout(review.clone());
              println!("{words} words");
              println!("{loud}");
              println!("original: {review}");
          }
