              assert_eq!(count_matches(&[1, 2, 2, 3], &2), "2 x 2", "count_matches(&[1, 2, 2, 3], &2)");
          }

          #[test]
          fn zero_matches() {
              assert_eq!(count_matches(&['a', 'b'], &'z'), "0 x z", "count_matches(&['a', 'b'], &'z')");
          }

          #[test]
          fn empty_slice() {
              let none: [u8; 0] = [];
              assert_eq!(count_matches(&none, &7), "0 x 7", "count_matches(&[], &7)");
          }
        hints:
          - "`==` needs `PartialEq`, `{}` needs `Display`: `where T: Display + PartialEq,`"
          - "Comparing `item == target` works because both are `&T`."
      - task: |
          Write `fn breaking_news(headline: &str) -> impl Summary` that returns an `Article` with that title and the author `Newsroom`. Callers only know they get "something that implements `Summary`", so the tests can only call `summarize()` on it.
        seed: |
          trait Summary {
              fn summarize(&self) -> String;
