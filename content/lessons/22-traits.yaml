id: traits
title: Traits
phase: "Errors and abstraction"
summary: Shared behavior. Define your own traits, give them default methods, accept "anything that can do X" with trait bounds and impl Trait, implement Display, and let derive write the standard traits for you.
roadmap: [Traits & Generics, Trait Definitions & Implementations, Trait Bounds & Associated Types]
steps:
  - title: Defining and implementing a trait
    id: traits-1
    text: |
      A **trait** describes behavior that several types can share: a list of methods a type promises to have. You've been using traits all along without writing one. `{:?}` works because a type implements the `Debug` trait, `==` works through `PartialEq`, and in the generics module you wrote bounds like `T: PartialOrd`. Now you'll write your own.

      A news app shows a one-line preview for very different kinds of content:

      ```rust run
      trait Summary {
          fn summarize(&self) -> String;
      }

      struct Article {
          title: String,
          author: String,
      }

      struct Post {
          user: String,
          text: String,
      }

      impl Summary for Article {
          fn summarize(&self) -> String {
              format!("{}, by {}", self.title, self.author)
          }
      }

      impl Summary for Post {
          fn summarize(&self) -> String {
              format!("@{}: {}", self.user, self.text)
          }
      }

      fn main() {
          let a = Article { title: String::from("Rust 2024 is out"), author: String::from("Ana") };
          let p = Post { user: String::from("ferris"), text: String::from("click clack") };
          println!("{}", a.summarize());
          println!("{}", p.summarize());
      }
      ```

      ```output
      Rust 2024 is out, by Ana
      @ferris: click clack
      ```

      Piece by piece:

      - `trait Summary { ... }` defines the trait. Inside are method **signatures**: the name, parameters and return type, ending with `;` instead of a body. These are the **required methods**.
      - `impl Summary for Article { ... }` **implements** the trait for a type: "an Article can summarize itself, and here's how". It looks like the impl blocks from the methods module, but it may only contain the trait's methods, with exactly the trait's signatures.
      - Calling a trait method looks like calling any method: `a.summarize()`.

      The trait decides **what** every implementing type can do; each type decides **how**. Why not just give each struct its own `summarize` method? You could, but nothing would connect them. With a trait, you can write one function that accepts "anything that implements `Summary`" (step 3), and the compiler checks that every type really has the method.

      ### Your trait on types you didn't write

      You can implement your own trait for built-in types too:

      ```rust run
      trait Summary {
          fn summarize(&self) -> String;
      }

      impl Summary for i32 {
          fn summarize(&self) -> String {
              format!("the number {}", self)
          }
      }

      impl Summary for Vec<String> {
          fn summarize(&self) -> String {
              format!("a list of {} items", self.len())
          }
      }

      fn main() {
          let tags = vec![String::from("rust"), String::from("crab")];
          println!("{}", 42.summarize());
          println!("{}", tags.summarize());
      }
      ```

      ```output
      the number 42
      a list of 2 items
      ```

      There's one limit, the **orphan rule**: you may write `impl SomeTrait for SomeType` only if the trait or the type (or both) is defined in your crate. `impl Summary for i32` is fine because `Summary` is yours. Implementing the standard library's `Display` for `Vec<String>` is not allowed, because neither is yours. (The advanced traits module shows the standard workaround.)

      ### Common mistakes

      - **Forgetting a required method.** Every method without a body must be implemented:

      ```rust compile_fail
      trait Summary {
          fn summarize(&self) -> String;
          fn short(&self) -> String;
      }

      struct Post {
          text: String,
      }

      impl Summary for Post {
          fn summarize(&self) -> String {
              self.text.clone()
          }
      }

      fn main() {
          let p = Post { text: String::from("hi") };
          println!("{}", p.summarize());
      }
      ```

      ```error
      error[E0046]: not all trait items implemented, missing: `short`
      ```

      - **A different signature.** Writing `fn summarize(self)` when the trait says `&self` gives `error[E0053]: method summarize has an incompatible type for trait`. Copy the signature from the trait exactly.
      - **Extra methods in the trait impl.** `impl Summary for Post` may only contain `Summary`'s methods (`error[E0407]: method ... is not a member of trait`). Put the type's other methods in a plain `impl Post` block.

      **Your turn:** fill in the blanks. Define a trait `Describe` with one method, and implement it for `Book` and `Movie`, so the program prints:

      ```
      Book: Dune (1965)
      Movie: Alien, 117 min
      ```
    fill: |
      [[trait]] Describe {
          fn describe(&self) -> String;
      }

      struct Book {
          title: String,
          year: u32,
      }

      struct Movie {
          title: String,
          minutes: u32,
      }

      impl Describe [[for]] Book {
          fn describe(&self) -> String {
              format!("Book: {} ({})", self.title, self.year)
          }
      }

      [[impl]] Describe for Movie {
          fn describe([[&self]]) -> String {
              format!("Movie: {}, {} min", self.title, self.minutes)
          }
      }

      fn main() {
          let b = Book { title: String::from("Dune"), year: 1965 };
          let m = Movie { title: String::from("Alien"), minutes: 117 };
          println!("{}", b.describe());
          println!("{}", m.describe());
      }
    hints:
      - A trait is defined with the keyword `trait`, and implemented with `impl TraitName for TypeName`.
      - The method takes the value by reference, exactly like the trait's signature says.
    tests:
      - expect: "Book: Dune (1965)\nMovie: Alien, 117 min"
    more:
      - task: |
          The `Describe` trait now has a third type, `Podcast`. Implement `Describe` for it so that `describe()` returns `Podcast: <name> (<episodes> episodes)`, for example `Podcast: Rustacean Station (120 episodes)`. With exactly one episode it should say `1 episode`, not `1 episodes`.
        seed: |
          trait Describe {
              fn describe(&self) -> String;
          }

          #[derive(Debug, PartialEq)]
          struct Podcast {
              name: String,
              episodes: u32,
          }

          // Implement Describe for Podcast here
        solution: |
          trait Describe {
              fn describe(&self) -> String;
          }

          #[derive(Debug, PartialEq)]
          struct Podcast {
              name: String,
              episodes: u32,
          }

          impl Describe for Podcast {
              fn describe(&self) -> String {
                  let word = if self.episodes == 1 { "episode" } else { "episodes" };
                  format!("Podcast: {} ({} {})", self.name, self.episodes, word)
              }
          }
        harness: |
          fn pod(name: &str, episodes: u32) -> Podcast {
              Podcast { name: name.to_string(), episodes }
          }

          #[test]
          fn describes_a_podcast_with_many_episodes() {
              assert_eq!(pod("Rustacean Station", 120).describe(), "Podcast: Rustacean Station (120 episodes)", "describe()");
          }

          #[test]
          fn uses_the_singular_for_one_episode() {
              assert_eq!(pod("New Show", 1).describe(), "Podcast: New Show (1 episode)", "describe()");
          }

          #[test]
          fn zero_episodes_is_plural() {
              assert_eq!(pod("Soon", 0).describe(), "Podcast: Soon (0 episodes)", "describe()");
          }
        hints:
          - "Start with `impl Describe for Podcast {` and copy the method signature from the trait."
          - "Pick the word first: `let word = if self.episodes == 1 { \"episode\" } else { \"episodes\" };`"
      - task: |
          A game awards points for picking things up. Starting from the two structs, write a trait `Points` with one method `fn points(&self) -> u32`, and implement it:

          - `Coin`: 10 points, or 50 if `gold` is true.
          - `Gem`: 25 points per carat.
        seed: |
          #[derive(Debug, PartialEq)]
          struct Coin {
              gold: bool,
          }

          #[derive(Debug, PartialEq)]
          struct Gem {
              carats: u32,
          }

          // Define the trait Points, then implement it for Coin and Gem
        solution: |
          #[derive(Debug, PartialEq)]
          struct Coin {
              gold: bool,
          }

          #[derive(Debug, PartialEq)]
          struct Gem {
              carats: u32,
          }

          trait Points {
              fn points(&self) -> u32;
          }

          impl Points for Coin {
              fn points(&self) -> u32 {
                  if self.gold { 50 } else { 10 }
              }
          }

          impl Points for Gem {
              fn points(&self) -> u32 {
                  25 * self.carats
              }
          }
        harness: |
          #[test]
          fn a_plain_coin_is_worth_10() {
              assert_eq!(Coin { gold: false }.points(), 10, "a plain coin");
          }

          #[test]
          fn a_gold_coin_is_worth_50() {
              assert_eq!(Coin { gold: true }.points(), 50, "a gold coin");
          }

          #[test]
          fn a_gem_is_worth_25_per_carat() {
              assert_eq!(Gem { carats: 3 }.points(), 75, "a 3-carat gem");
          }

          #[test]
          fn a_zero_carat_gem_is_worth_nothing() {
              assert_eq!(Gem { carats: 0 }.points(), 0, "a 0-carat gem");
          }
        hints:
          - "The trait: `trait Points { fn points(&self) -> u32; }`"
          - "Then two blocks, `impl Points for Coin { ... }` and `impl Points for Gem { ... }`, each with the full method."

  - title: Default methods
    id: traits-2
    text: |
      A trait can give a method a **default implementation**: a body that every implementing type gets for free unless it writes its own. A default method can call the trait's other methods, even the required ones that don't have a body yet: whatever type it ends up running on is guaranteed to have them.

      ```rust run
      trait LogEntry {
          fn level(&self) -> String;
          fn message(&self) -> String;

          fn render(&self) -> String {
              format!("[{}] {}", self.level(), self.message())
          }
      }

      struct Login {
          user: String,
      }

      struct DiskFull {
          percent: u32,
      }

      impl LogEntry for Login {
          fn level(&self) -> String {
              String::from("INFO")
          }
          fn message(&self) -> String {
              format!("{} logged in", self.user)
          }
      }

      impl LogEntry for DiskFull {
          fn level(&self) -> String {
              String::from("WARN")
          }
          fn message(&self) -> String {
              format!("disk {}% full", self.percent)
          }
          fn render(&self) -> String {
              format!("!!! [{}] {} !!!", self.level(), self.message())
          }
      }

      fn main() {
          let a = Login { user: String::from("ana") };
          let b = DiskFull { percent: 97 };
          println!("{}", a.render());
          println!("{}", b.render());
      }
      ```

      ```output
      [INFO] ana logged in
      !!! [WARN] disk 97% full !!!
      ```

      - `level` and `message` are required: no body, every type must write them.
      - `render` is a **provided method**: it has a body. `Login` doesn't mention `render`, so it gets the default. `DiskFull` writes its own `render`, which **overrides** the default for that type only.

      This is how good traits are designed: a small core of required methods, plus convenience methods built on top. The standard library does it everywhere. The `Iterator` trait (coming up in the iterators module) has exactly one required method, `next`, and around 75 provided ones (`map`, `filter`, `sum`, `count`...) that all work by calling `next`.

      ### Common mistakes

      - **Reading fields in a default method.** A trait knows nothing about the fields of the types that will implement it. A default method can only use the trait's methods:

      ```rust compile_fail
      trait LogEntry {
          fn render(&self) -> String {
              format!("[INFO] {}", self.message)
          }
      }

      fn main() {}
      ```

      ```error
      error[E0609]: no field `message` on type `&Self`
      ```

      `Self` (capital S) means "whatever type implements this trait". The fix is to add a required method (`fn message(&self) -> String;`) and call it.

      - **Expecting to call the default from an override.** Once a type overrides `render`, there's no way to call the default version from inside it. If both need the same logic, put it in another method (as `DiskFull` does by calling `level()` and `message()`).

      **Your turn:** a support desk has two kinds of tickets. Give the `Ticket` trait a **default** method `label` that returns `#<id> <title>`, for example `#42 Printer on fire`. `Bug` should use the default. `Incident` should override `label` to put `URGENT ` in front: `URGENT #7 Database down`.
    seed: |
      trait Ticket {
          fn id(&self) -> u32;
          fn title(&self) -> String;

          fn label(&self) -> String {
              todo!()
          }
      }

      struct Bug {
          id: u32,
          title: String,
      }

      struct Incident {
          id: u32,
          title: String,
      }

      impl Ticket for Bug {
          fn id(&self) -> u32 {
              self.id
          }
          fn title(&self) -> String {
              self.title.clone()
          }
      }

      impl Ticket for Incident {
          fn id(&self) -> u32 {
              self.id
          }
          fn title(&self) -> String {
              self.title.clone()
          }
          // Override label here
      }
    solution: |
      trait Ticket {
          fn id(&self) -> u32;
          fn title(&self) -> String;

          fn label(&self) -> String {
              format!("#{} {}", self.id(), self.title())
          }
      }

      struct Bug {
          id: u32,
          title: String,
      }

      struct Incident {
          id: u32,
          title: String,
      }

      impl Ticket for Bug {
          fn id(&self) -> u32 {
              self.id
          }
          fn title(&self) -> String {
              self.title.clone()
          }
      }

      impl Ticket for Incident {
          fn id(&self) -> u32 {
              self.id
          }
          fn title(&self) -> String {
              self.title.clone()
          }
          fn label(&self) -> String {
              format!("URGENT #{} {}", self.id(), self.title())
          }
      }
    harness: |
      struct Chore;

      impl Ticket for Chore {
          fn id(&self) -> u32 {
              3
          }
          fn title(&self) -> String {
              String::from("Water the plants")
          }
      }

      #[test]
      fn a_bug_uses_the_default_label() {
          let b = Bug { id: 42, title: String::from("Printer on fire") };
          assert_eq!(b.label(), "#42 Printer on fire", "label() of bug 42");
      }

      #[test]
      fn an_incident_label_starts_with_urgent() {
          let i = Incident { id: 7, title: String::from("Database down") };
          assert_eq!(i.label(), "URGENT #7 Database down", "label() of incident 7");
      }

      #[test]
      fn any_new_ticket_type_gets_the_default() {
          assert_eq!(Chore.label(), "#3 Water the plants", "a new ticket type's label()");
      }
    hints:
      - "The default body goes in the trait, and it can only call trait methods: `self.id()` and `self.title()`, not the fields."
      - "`format!(\"#{} {}\", self.id(), self.title())` for the default. For `Incident`, write a whole `fn label(&self) -> String` inside its impl block."
    more:
