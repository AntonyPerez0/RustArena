      - task: |
          Bank accounts. Write the trait `Account` yourself, with:

          - a required method `fn balance(&self) -> i64` (in cents),
          - a default method `fn overdraft_limit(&self) -> i64` that returns `0`,
          - a default method `fn can_withdraw(&self, amount: i64) -> bool` that is true when `balance + overdraft_limit` is at least `amount`.

          Implement it for `Savings` (keeps both defaults) and `Checking` (overrides `overdraft_limit` to return `10000`, so it may go 100 dollars below zero). Notice that `can_withdraw` calls `overdraft_limit`, so the override changes its result too.
        seed: |
          struct Savings {
              cents: i64,
          }

          struct Checking {
              cents: i64,
          }

          // Write the Account trait and implement it for both types
        solution: |
          struct Savings {
              cents: i64,
          }

          struct Checking {
              cents: i64,
          }

          trait Account {
              fn balance(&self) -> i64;

              fn overdraft_limit(&self) -> i64 {
                  0
              }

              fn can_withdraw(&self, amount: i64) -> bool {
                  self.balance() + self.overdraft_limit() >= amount
              }
          }

          impl Account for Savings {
              fn balance(&self) -> i64 {
                  self.cents
              }
          }

          impl Account for Checking {
              fn balance(&self) -> i64 {
                  self.cents
              }
              fn overdraft_limit(&self) -> i64 {
                  10000
              }
          }
        harness: |
          #[test]
          fn savings_can_withdraw_its_whole_balance() {
              assert!(Savings { cents: 5000 }.can_withdraw(5000), "Savings with 5000 withdrawing 5000 should be allowed");
          }

          #[test]
          fn savings_cannot_go_below_zero() {
              assert!(!Savings { cents: 5000 }.can_withdraw(5001), "Savings with 5000 withdrawing 5001 should be refused");
          }

          #[test]
          fn checking_can_use_the_overdraft() {
              assert!(Checking { cents: 5000 }.can_withdraw(15000), "Checking with 5000 withdrawing 15000 should be allowed");
          }

          #[test]
          fn checking_stops_at_the_overdraft_limit() {
              assert!(!Checking { cents: 5000 }.can_withdraw(15001), "Checking with 5000 withdrawing 15001 should be refused");
          }

          #[test]
          fn the_limits_are_right() {
              assert_eq!(Savings { cents: 0 }.overdraft_limit(), 0, "Savings overdraft_limit()");
              assert_eq!(Checking { cents: 0 }.overdraft_limit(), 10000, "Checking overdraft_limit()");
          }
        hints:
          - "In the trait: `fn balance(&self) -> i64;` (no body), then the two default methods with bodies."
          - "`can_withdraw` is `self.balance() + self.overdraft_limit() >= amount`."
          - "`impl Account for Checking` needs `balance` and its own `fn overdraft_limit(&self) -> i64 { 10000 }`."

  - title: "Traits as parameters: bounds and impl Trait"
    id: traits-3
    text: |
      The real payoff of a trait: functions that accept **any** type with that behavior. You already know the syntax from generics, where you wrote bounds like `T: PartialOrd`. A **trait bound** works the same with your own traits.

      ```rust run
      trait Summary {
          fn summarize(&self) -> String;
      }

      struct Article {
          title: String,
      }

      struct Post {
          user: String,
          text: String,
      }

      impl Summary for Article {
          fn summarize(&self) -> String {
              format!("Article: {}", self.title)
          }
      }

      impl Summary for Post {
          fn summarize(&self) -> String {
              format!("@{}: {}", self.user, self.text)
          }
      }

      fn preview(item: &impl Summary) {
          println!("Preview -> {}", item.summarize());
      }

      fn feed<T: Summary>(items: &[T]) {
          for item in items {
              println!("- {}", item.summarize());
          }
      }

      fn main() {
          let a = Article { title: String::from("Crabs can't jump") };
          let p = Post { user: String::from("ana"), text: String::from("first!") };
          preview(&a);
          preview(&p);

          let posts = vec![
              Post { user: String::from("bo"), text: String::from("gg") },
              Post { user: String::from("cy"), text: String::from("wp") },
          ];
          feed(&posts);
      }
      ```

      ```output
      Preview -> Article: Crabs can't jump
      Preview -> @ana: first!
      - @bo: gg
      - @cy: wp
      ```

      - `item: &impl Summary` reads "a reference to some type that implements `Summary`". It's called **impl Trait in argument position**, and it's short for the generic version `fn preview<T: Summary>(item: &T)`.
      - `fn feed<T: Summary>(items: &[T])` is the longer form: a type parameter `T` with a bound. Use it when you need to name the type, like here, where `T` appears inside `&[T]`.
      - Inside the function you may only use what the bound promises. `item.summarize()` is fine; `item.title` is not, because not every `Summary` type has a title.

      Like all generics, this is **monomorphized**: the compiler writes a separate copy of `preview` for `Article` and one for `Post`. Calling through a trait bound is exactly as fast as calling the method directly.

      ### One type, or many?

      These two signatures are not the same:

      ```rust
      fn both(a: &impl Summary, b: &impl Summary)      // a and b may be different types
      fn both<T: Summary>(a: &T, b: &T)                // a and b must be the SAME type T
      ```

      And `feed(&[T])` takes a slice where every item is the same type `T`: a `Vec` can't mix Articles and Posts. Mixing types in one collection needs **trait objects**, a later module.

      ### Common mistakes

      - **Forgetting the bound.** Without it, `T` could be any type at all, so the compiler won't let you call `summarize`. Read the help line: it tells you the fix.

      ```rust compile_fail
      trait Summary {
          fn summarize(&self) -> String;
      }

      fn feed<T>(items: &[T]) {
          for item in items {
              println!("{}", item.summarize());
          }
      }

      fn main() {}
      ```

      ```error
      error[E0599]: no method named `summarize` found for reference `&T` in the current scope
        = help: items from traits can only be used if the type parameter is bounded by the trait
      help: the following trait defines an item `summarize`, perhaps you need to restrict type parameter `T` with it:
        |
      5 | fn feed<T: Summary>(items: &[T]) {
      ```

      - **Using a field through the bound**: `item.title` on an `&impl Summary` gives `error[E0609]: no field title on type &impl Summary`. Add a method to the trait if every type should provide it.

      **Your turn:** a café's menu items implement `Priced`. Write two functions:

      - `fn total_cents<T: Priced>(items: &[T]) -> u32`: the sum of the prices (0 for an empty slice).
      - `fn can_afford(item: &impl Priced, budget_cents: u32) -> bool`: true if the item's price is at most the budget.
    seed: |
      trait Priced {
          fn price_cents(&self) -> u32;
      }

      #[derive(Debug, PartialEq)]
      struct Coffee {
          shots: u32,
      }

      #[derive(Debug, PartialEq)]
      struct Bagel {
          toasted: bool,
      }

      impl Priced for Coffee {
          fn price_cents(&self) -> u32 {
              250 + 75 * self.shots
          }
      }

      impl Priced for Bagel {
          fn price_cents(&self) -> u32 {
              if self.toasted { 350 } else { 300 }
          }
      }

      fn total_cents<T: Priced>(items: &[T]) -> u32 {
          todo!()
      }

      fn can_afford(item: &impl Priced, budget_cents: u32) -> bool {
          todo!()
      }
    solution: |
      trait Priced {
          fn price_cents(&self) -> u32;
      }

      #[derive(Debug, PartialEq)]
      struct Coffee {
          shots: u32,
      }

      #[derive(Debug, PartialEq)]
      struct Bagel {
          toasted: bool,
      }

      impl Priced for Coffee {
          fn price_cents(&self) -> u32 {
              250 + 75 * self.shots
          }
      }

      impl Priced for Bagel {
