      - task: |
          A ladder ranks players by `rank` first and then by `name` (alphabetically). Add the derives `Rank` and `Player` need, then write `fn top_player(players: &[Player]) -> Option<Player>` that returns a clone of the highest player, or `None` for an empty slice. Use the derived comparison (`>`) rather than comparing fields yourself.
        seed: |
          enum Rank {
              Bronze,
              Silver,
              Gold,
          }

          struct Player {
              rank: Rank,
              name: String,
          }

          fn top_player(players: &[Player]) -> Option<Player> {
              todo!()
          }
        solution: |
          #[derive(Debug, Clone, PartialEq, PartialOrd)]
          enum Rank {
              Bronze,
              Silver,
              Gold,
          }

          #[derive(Debug, Clone, PartialEq, PartialOrd)]
          struct Player {
              rank: Rank,
              name: String,
          }

          fn top_player(players: &[Player]) -> Option<Player> {
              if players.is_empty() {
                  return None;
              }
              let mut best = &players[0];
              for p in players {
                  if p > best {
                      best = p;
                  }
              }
              Some(best.clone())
          }
        harness: |
          fn p(rank: Rank, name: &str) -> Player {
              Player { rank, name: name.to_string() }
          }

          #[test]
          fn the_highest_rank_wins() {
              let list = vec![p(Rank::Silver, "zed"), p(Rank::Gold, "amy"), p(Rank::Bronze, "max")];
              assert_eq!(top_player(&list), Some(p(Rank::Gold, "amy")), "top_player of silver, gold, bronze");
          }

          #[test]
          fn ties_go_to_the_later_name() {
              let list = vec![p(Rank::Gold, "bea"), p(Rank::Gold, "cal"), p(Rank::Silver, "zoe")];
              assert_eq!(top_player(&list), Some(p(Rank::Gold, "cal")), "two gold players");
          }

          #[test]
          fn one_player_is_the_top() {
              assert_eq!(top_player(&[p(Rank::Bronze, "solo")]), Some(p(Rank::Bronze, "solo")), "one player");
          }

          #[test]
          fn no_players_gives_none() {
              assert_eq!(top_player(&[]), None, "top_player(&[])");
          }
        hints:
          - "The tests use `assert_eq!` on `Option<Player>`, so both types need `Debug` and `PartialEq`. Comparing with `>` needs `PartialOrd`, and returning a copy needs `Clone`."
          - "Keep a `best` reference, update it when `p > best`, and return `Some(best.clone())`."
