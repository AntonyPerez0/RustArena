              let posts = vec![post("bo", "gg"), post("cy", "wp")];
              assert_eq!(digest(&posts), "1. @bo: gg\n2. @cy: wp", "digest of two posts");
          }

          #[test]
          fn one_post_has_no_newline() {
              assert_eq!(digest(&[post("ana", "hi")]), "1. @ana: hi", "digest of one post");
          }

          #[test]
          fn an_empty_slice_gives_an_empty_string() {
              let none: Vec<Post> = Vec::new();
              assert_eq!(digest(&none), "", "digest(&[])");
          }

          #[test]
          fn works_for_any_summary_type() {
              struct Num(u32);
              impl Summary for Num {
                  fn summarize(&self) -> String {
                      format!("n={}", self.0)
                  }
              }
              assert_eq!(digest(&[Num(1), Num(2), Num(3)]), "1. n=1\n2. n=2\n3. n=3", "digest of three numbers");
          }
