              assert_eq!(RaceTime { seconds: 3600 }.to_string(), "1:00:00", "3600 seconds");
          }

          #[test]
          fn just_under_an_hour() {
              assert_eq!(RaceTime { seconds: 3599 }.to_string(), "59:59", "3599 seconds");
          }
        hints:
          - "Hours are `seconds / 3600`, minutes `seconds % 3600 / 60`, seconds `seconds % 60`."
          - "`{:02}` pads a number to two digits with a zero. Use an `if` with a `write!` in each branch (no semicolons)."
      - task: |
          Playing cards. Implement `Display` for **both** types:

          - `Suit` shows as `♠`, `♥`, `♦` or `♣`.
          - `Card` shows its rank then its suit: rank 1 is `A`, 11 is `J`, 12 is `Q`, 13 is `K`, anything else is the number. So `A♠`, `10♥`, `Q♦`.

          Inside `Card`'s `fmt` you can use `{}` on `self.suit`, because `Suit` implements `Display` too.
        seed: |
          use std::fmt;

          #[derive(Debug, PartialEq)]
          enum Suit {
              Spades,
              Hearts,
              Diamonds,
              Clubs,
          }

          #[derive(Debug, PartialEq)]
          struct Card {
              rank: u8,
              suit: Suit,
          }
        solution: |
          use std::fmt;

          #[derive(Debug, PartialEq)]
          enum Suit {
              Spades,
              Hearts,
              Diamonds,
              Clubs,
          }

          #[derive(Debug, PartialEq)]
          struct Card {
              rank: u8,
              suit: Suit,
          }

          impl fmt::Display for Suit {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  let symbol = match self {
                      Suit::Spades => "♠",
                      Suit::Hearts => "♥",
                      Suit::Diamonds => "♦",
                      Suit::Clubs => "♣",
                  };
                  write!(f, "{}", symbol)
              }
          }

          impl fmt::Display for Card {
              fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
                  let rank = match self.rank {
                      1 => String::from("A"),
                      11 => String::from("J"),
                      12 => String::from("Q"),
                      13 => String::from("K"),
                      n => n.to_string(),
                  };
                  write!(f, "{}{}", rank, self.suit)
              }
          }
        harness: |
          #[test]
          fn shows_each_suit() {
              assert_eq!(Suit::Spades.to_string(), "♠", "Suit::Spades");
              assert_eq!(Suit::Hearts.to_string(), "♥", "Suit::Hearts");
              assert_eq!(Suit::Diamonds.to_string(), "♦", "Suit::Diamonds");
              assert_eq!(Suit::Clubs.to_string(), "♣", "Suit::Clubs");
          }

          #[test]
          fn an_ace_shows_as_a() {
              assert_eq!(Card { rank: 1, suit: Suit::Spades }.to_string(), "A♠", "rank 1 of spades");
          }

          #[test]
          fn number_cards_show_their_number() {
              assert_eq!(Card { rank: 10, suit: Suit::Hearts }.to_string(), "10♥", "rank 10 of hearts");
          }

          #[test]
          fn face_cards_show_letters() {
              assert_eq!(Card { rank: 11, suit: Suit::Clubs }.to_string(), "J♣", "rank 11");
              assert_eq!(Card { rank: 12, suit: Suit::Diamonds }.to_string(), "Q♦", "rank 12");
              assert_eq!(Card { rank: 13, suit: Suit::Spades }.to_string(), "K♠", "rank 13");
          }
        hints:
          - "For `Suit`, `match self` and pick the symbol, then `write!(f, \"{}\", symbol)`."
          - "For `Card`, turn the rank into a `String` with a `match` (use `n => n.to_string()` for the rest), then `write!(f, \"{}{}\", rank, self.suit)`."

  - title: "Multiple bounds, where clauses and returning impl Trait"
    id: traits-5
    text: |
      A type parameter can need several traits at once. Join them with `+`: `T: Display + PartialOrd` means "T can be printed with `{}` **and** compared with `<` and `>`". When the bounds get long, move them into a **where clause** after the signature, so the function's name and parameters stay readable.

      ```rust run
      use std::fmt::Display;

      fn announce_max<T>(items: &[T]) -> String
      where
          T: Display + PartialOrd,
      {
          let mut best = &items[0];
          for item in items {
              if item > best {
                  best = item;
              }
          }
          format!("winner: {best}")
      }

      fn main() {
          println!("{}", announce_max(&[3, 9, 4]));
          println!("{}", announce_max(&["pear", "apple", "plum"]));
          println!("{}", announce_max(&[1.5, 0.25]));
      }
      ```

      ```output
      winner: 9
      winner: plum
      winner: 1.5
      ```

      - `PartialOrd` makes `item > best` legal; `Display` makes `{best}` legal. Remove either one and that line stops compiling.
      - The `where` clause says the same as `fn announce_max<T: Display + PartialOrd>(items: &[T])`. Pick whichever reads better. Teams usually switch to `where` once there are two or more type parameters or more than a couple of bounds, and `rustfmt` lays it out exactly as above.
      - Strings compare alphabetically, so `"plum"` beats `"pear"` and `"apple"`.

      Several type parameters, each with its own bounds:

      ```rust
      fn log_pair<K, V>(key: K, value: V) -> String
      where
          K: Display,
          V: Debug + Clone,
      ```

      ### Returning impl Trait

      `impl Trait` also works in the **return** type: "this function returns some type that implements the trait, and that's all you need to know".

      ```rust run
      use std::fmt::Display;

      fn badge(points: u32) -> impl Display {
          format!("[{points} pts]")
      }

      fn main() {
          let b = badge(120);
          println!("Ferris {b}");
      }
      ```

      ```output
      Ferris [120 pts]
      ```

      The caller can only use `b` as a `Display`: it can't call `String` methods on it, even though it really is a `String`. That's the point: the function is free to change the concrete type later without breaking callers. You'll use this most with iterators and closures, whose real types are long or can't even be written down.

      ### Common mistakes

      - **Returning different types from `-> impl Trait`.** `impl Trait` stands for **one** concrete type, chosen by the function body. Two branches with different types don't compile:

      ```rust compile_fail
      use std::fmt::Display;

      fn label(n: u32) -> impl Display {
          if n == 0 { "none" } else { n }
      }

      fn main() {
          println!("{}", label(3));
      }
      ```

      ```error
      error[E0308]: `if` and `else` have incompatible types
      ```

      Here the fix is to return the same type from both branches (`n.to_string()` and `String::from("none")`). The compiler also suggests `Box<dyn Display>`; that's a trait object, coming up in a later module.

      - **A missing bound.** If you compare with `>` but only wrote `T: Display`, you get ``error[E0369]: binary operation `>` cannot be applied to type `&T` ``, with a help line suggesting `T: PartialOrd`.

      **Your turn:** write `fn describe_range<T>(items: &[T]) -> String` that returns the smallest and largest item as `min..max`, for example `2..9`. An empty slice returns `empty`. Put the bounds (`Display` and `PartialOrd`) in a `where` clause.
    seed: |
      use std::fmt::Display;

      fn describe_range<T>(items: &[T]) -> String {
          todo!()
      }
    solution: |
      use std::fmt::Display;

      fn describe_range<T>(items: &[T]) -> String
      where
          T: Display + PartialOrd,
      {
          if items.is_empty() {
              return String::from("empty");
          }
          let mut min = &items[0];
          let mut max = &items[0];
          for item in items {
              if item < min {
                  min = item;
              }
              if item > max {
                  max = item;
              }
          }
          format!("{min}..{max}")
      }
    require:
      - pattern: '\bwhere\b'
        message: Put the bounds in a `where` clause.
    harness: |
      #[test]
      fn finds_min_and_max_of_numbers() {
          assert_eq!(describe_range(&[4, 2, 9, 7]), "2..9", "describe_range(&[4, 2, 9, 7])");
      }

      #[test]
      fn works_with_strings() {
          assert_eq!(describe_range(&["kiwi", "apple", "pear"]), "apple..pear", "describe_range(&[\"kiwi\", \"apple\", \"pear\"])");
      }

      #[test]
      fn works_with_negative_floats() {
          assert_eq!(describe_range(&[-1.5, 2.5, 0.0]), "-1.5..2.5", "describe_range(&[-1.5, 2.5, 0.0])");
      }

      #[test]
      fn one_item_is_both_min_and_max() {
          assert_eq!(describe_range(&[5]), "5..5", "describe_range(&[5])");
      }

      #[test]
      fn an_empty_slice_says_empty() {
          let none: [i32; 0] = [];
          assert_eq!(describe_range(&none), "empty", "describe_range(&[])");
      }
    hints:
      - "The signature becomes `fn describe_range<T>(items: &[T]) -> String where T: Display + PartialOrd,` followed by the body's `{`."
      - "Return early for an empty slice. Otherwise start `min` and `max` at `&items[0]` and update them in a loop, like `announce_max`."
    more:
      - task: |
          Write `fn count_matches<T>(items: &[T], target: &T) -> String` that counts how many items equal `target` and returns `<count> x <target>`, for example `3 x apple`. Use a `where` clause with the two bounds you need (one for `==`, one for printing).
        seed: |
          use std::fmt::Display;

          fn count_matches<T>(items: &[T], target: &T) -> String {
              todo!()
          }
        solution: |
          use std::fmt::Display;

          fn count_matches<T>(items: &[T], target: &T) -> String
          where
              T: Display + PartialEq,
          {
              let mut count = 0;
              for item in items {
                  if item == target {
                      count += 1;
                  }
              }
              format!("{count} x {target}")
          }
        require:
          - pattern: '\bwhere\b'
            message: Put the bounds in a `where` clause.
