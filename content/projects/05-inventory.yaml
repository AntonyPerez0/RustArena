id: inventory
title: A shop inventory and checkout
level: Intermediate
after: traits
summary: A small point-of-sale system. Load a stock list, print it with your own Display impls, sort and total it with derived traits, report bad lines with a real error type, check out orders, and apply discounts through a pricing trait.
seed: |
  use std::fmt;
  use std::io;
  use std::io::Read;

  /// An amount of money in cents. Whole cents never round wrongly, unlike f64.
  #[derive(Debug, Clone, Copy)]
  struct Money(u64);

  impl fmt::Display for Money {
      fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
          todo!("print cents as dollars, like $12.50")
      }
  }

  #[derive(Debug, Clone, Copy)]
  enum Category {
      Food,
      Tools,
      Toys,
  }

  impl fmt::Display for Category {
      fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
          todo!("print food, tools or toys")
      }
  }

  struct Item {
      name: String,
      category: Category,
      price: Money,
      qty: u32,
  }

  impl fmt::Display for Item {
      fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
          todo!("print one line of the stock table")
      }
  }

  /// "12.50" -> Money(1250)
  fn parse_money(text: &str) -> Money {
      let (whole, cents) = text.split_once('.').expect("a price looks like 12.50");
      let whole: u64 = whole.parse().expect("invalid price");
      let cents: u64 = cents.parse().expect("invalid price");
      Money(whole * 100 + cents)
  }

  fn parse_category(text: &str) -> Category {
      match text {
          "food" => Category::Food,
          "tools" => Category::Tools,
          "toys" => Category::Toys,
          other => panic!("unknown category {other}"),
      }
  }

  /// "hammer, tools, 12.50, 10" -> Item
  fn parse_item(line: &str) -> Item {
      let fields: Vec<&str> = line.split(',').collect();
      let [name, category, price, qty] = fields.as_slice() else {
          panic!("expected 4 fields: {line}");
      };
      Item {
          name: name.trim().to_string(),
          category: parse_category(category.trim()),
          price: parse_money(price.trim()),
          qty: qty.trim().parse().expect("invalid quantity"),
      }
  }

  fn main() {
      let mut text = String::new();
      io::stdin().read_to_string(&mut text).expect("failed to read input");

      let mut items = Vec::new();
      for line in text.lines() {
          if line.trim().is_empty() {
              break; // a blank line ends the stock list
          }
          items.push(parse_item(line));
      }

      for item in &items {
          println!("{item}");
      }
  }
milestones:
  - title: Items that print themselves
    text: |
      Every shop runs on the same data: a list of items with prices and quantities, and orders that take items out of stock. In this project you'll build a small **point-of-sale** program. It reads the stock list, prints it, and (from milestone 4) checks out a customer's order and prints a receipt.

      The input starts with the stock list, one item per line, as comma-separated fields:

      ```
      hammer, tools, 12.50, 10
      apple, food, 0.40, 200
      drill, tools, 89.99, 3
      ```

      The starter code already parses each line into an `Item`. Your job is to make the types print themselves, so `println!("{item}")` produces one tidy line per item:

      ```
      hammer     tools    $12.50  x10
      apple      food      $0.40  x200
      drill      tools    $89.99  x3
      ```

      ### Money is a type, not an f64

      Prices are stored as `Money(u64)`, a **newtype** holding a number of cents. Why not `f64`? Because `0.1 + 0.2` is `0.30000000000000004` in floating point, and a till that is off by a fraction of a cent on every sale is a bug report waiting to happen. Integer cents are exact. Wrapping them in their own type also means you can't accidentally add a price to a quantity: `Money` and `u32` are different types.

      ### Implementing Display

      `{}` works on any type that implements `std::fmt::Display`. You implement its one method, `fmt`, which writes the text into a `Formatter`:

      - **Money** prints as `$12.50`: dollars, a point, and exactly two digits of cents (`{:02}` pads with zeros, so 5 cents is `$0.05`).
      - **Category** prints as `food`, `tools` or `toys`.
      - **Item** prints the name left-aligned in 10 characters, a space, the category left-aligned in 6, a space, the price right-aligned in 8, two spaces, and `x` with the quantity: `write!(f, "{:<10} {:<6} {:>8}  x{}", ...)`.

      There's one trap. `{:>8}` asks for a width of 8, but it's up to *your* `fmt` to honor it. `write!` ignores it; `f.pad(text)` applies the caller's width and alignment:

      ```rust run
      use std::fmt;

      struct Padded(u64);
      struct Unpadded(u64);

      impl fmt::Display for Padded {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              f.pad(&format!("${}.{:02}", self.0 / 100, self.0 % 100))
          }
      }

      impl fmt::Display for Unpadded {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "${}.{:02}", self.0 / 100, self.0 % 100)
          }
      }

      fn main() {
          println!("[{:>8}]", Padded(1250));
          println!("[{:>8}]", Unpadded(1250));
          println!("[{}]", Padded(5));
      }
      ```

      ```output
      [  $12.50]
      [$12.50]
      [$0.05]
      ```

      So use `f.pad(...)` for `Money` and `Category` (they're used inside a column), and `write!` for `Item` (the whole line, whose columns are padded field by field).

      Once a type implements `Display`, you also get `.to_string()` for free: the standard library implements `ToString` for every `Display` type. That's a **blanket implementation**, and it's why implementing one small trait is worth it.
    solution: |
      use std::fmt;
      use std::io;
      use std::io::Read;

      /// An amount of money in cents. Whole cents never round wrongly, unlike f64.
      #[derive(Debug, Clone, Copy)]
      struct Money(u64);

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              // pad() applies the caller's width and alignment, so "{:>8}" works on Money.
              f.pad(&format!("${}.{:02}", self.0 / 100, self.0 % 100))
          }
      }

      #[derive(Debug, Clone, Copy)]
      enum Category {
          Food,
          Tools,
          Toys,
      }

      impl fmt::Display for Category {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let name = match self {
                  Category::Food => "food",
                  Category::Tools => "tools",
                  Category::Toys => "toys",
              };
              f.pad(name)
          }
      }

      struct Item {
          name: String,
          category: Category,
          price: Money,
          qty: u32,
      }

      impl fmt::Display for Item {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "{:<10} {:<6} {:>8}  x{}", self.name, self.category, self.price, self.qty)
          }
      }

      /// "12.50" -> Money(1250)
      fn parse_money(text: &str) -> Money {
          let (whole, cents) = text.split_once('.').expect("a price looks like 12.50");
          let whole: u64 = whole.parse().expect("invalid price");
          let cents: u64 = cents.parse().expect("invalid price");
          Money(whole * 100 + cents)
      }

      fn parse_category(text: &str) -> Category {
          match text {
              "food" => Category::Food,
              "tools" => Category::Tools,
              "toys" => Category::Toys,
              other => panic!("unknown category {other}"),
          }
      }

      /// "hammer, tools, 12.50, 10" -> Item
      fn parse_item(line: &str) -> Item {
          let fields: Vec<&str> = line.split(',').collect();
          let [name, category, price, qty] = fields.as_slice() else {
              panic!("expected 4 fields: {line}");
          };
          Item {
              name: name.trim().to_string(),
              category: parse_category(category.trim()),
              price: parse_money(price.trim()),
              qty: qty.trim().parse().expect("invalid quantity"),
          }
      }

      fn main() {
          let mut text = String::new();
          io::stdin().read_to_string(&mut text).expect("failed to read input");

          let mut items = Vec::new();
          for line in text.lines() {
              if line.trim().is_empty() {
                  break; // a blank line ends the stock list
              }
              items.push(parse_item(line));
          }

          for item in &items {
              println!("{item}");
          }
      }
    tests:
      - stdin: "hammer, tools, 12.50, 10\napple, food, 0.40, 200\ndrill, tools, 89.99, 3\nteddy, toys, 15.00, 8\n"
      - stdin: "rope, tools, 7.05, 0\nflour,food,1.00,1000\n"
      - stdin: "kite, toys, 120.00, 1\ncheese, food, 3.99, 12\n\nthis line is after the stock list\n"
        hidden: true
    hints:
      - "`Money`: `f.pad(&format!(\"${}.{:02}\", self.0 / 100, self.0 % 100))`: the dollars, then the cents padded to two digits."
      - "`Category`: `let name = match self { Category::Food => \"food\", ... };` then `f.pad(name)`."
      - "`Item`: `write!(f, \"{:<10} {:<6} {:>8}  x{}\", self.name, self.category, self.price, self.qty)`."

  - title: Sorted stock and category totals
    text: |
      A stock list in whatever order it was typed is hard to read. Sort it **by category, then by name**, and after the items, print a summary line per category with its number of units and the total value of that stock (price times quantity):

      ```
      apple      food      $0.40  x200
      drill      tools    $89.99  x3
      hammer     tools    $12.50  x10
      teddy      toys     $15.00  x8
      food: 200 units, $80.00
      tools: 13 units, $394.97
      toys: 8 units, $120.00
      ```

      Categories come in the order food, tools, toys: the order the variants are declared in.

      ### Deriving an order

      To sort by category, Rust has to know how to compare two categories. You could write that by hand, but `#[derive(PartialEq, Eq, PartialOrd, Ord)]` on the enum does it for you: variants compare in **declaration order**, so `Food < Tools < Toys`. Then:

      ```rust
      self.items.sort_by(|a, b| a.category.cmp(&b.category).then(a.name.cmp(&b.name)));
      ```

      sorts by category and breaks ties by name, the same two-level comparison you'd use in any sort.

      The derived order pays off twice: a `BTreeMap<Category, (u32, Money)>` needs keys that implement `Ord`, and it then keeps the categories sorted for the summary. One derive line, two features.

      ### Arithmetic on Money

      You need "price times quantity" and "add this to the running total". Give `Money` small methods:

      ```rust
      impl Money {
          fn times(self, qty: u32) -> Money { ... }
          fn plus(self, other: Money) -> Money { ... }
      }
      ```

      (In the std-traits module you'll learn to make `+` itself work on your types; methods are perfectly idiomatic too.) Because `Money` derives `Copy`, these can take `self` by value without moving anything away.

      ### A Shop type

      Put the items in a `struct Shop { items: Vec<Item> }` with two methods, `sort(&mut self)` and `print_stock(&self)`. `main` then just loads, sorts and prints. Notice which method needs `&mut self` and which only `&self`: the signature tells every reader whether a call can change the shop.

      For the totals, the entry API gives you mutable access to both halves of the tuple at once:

      ```rust
      let (units, value) = by_category.entry(item.category).or_insert((0, Money(0)));
      *units += item.qty;
      *value = value.plus(item.price.times(item.qty));
      ```
    solution: |
      use std::collections::BTreeMap;
      use std::fmt;
      use std::io;
      use std::io::Read;

      /// An amount of money in cents. Whole cents never round wrongly, unlike f64.
      #[derive(Debug, Clone, Copy)]
      struct Money(u64);

      impl Money {
          fn times(self, qty: u32) -> Money {
              Money(self.0 * qty as u64)
          }

          fn plus(self, other: Money) -> Money {
              Money(self.0 + other.0)
          }
      }

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              // pad() applies the caller's width and alignment, so "{:>8}" works on Money.
              f.pad(&format!("${}.{:02}", self.0 / 100, self.0 % 100))
          }
      }

      #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
      enum Category {
          Food,
          Tools,
          Toys,
      }

      impl fmt::Display for Category {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let name = match self {
                  Category::Food => "food",
                  Category::Tools => "tools",
                  Category::Toys => "toys",
              };
              f.pad(name)
          }
      }

      struct Item {
          name: String,
          category: Category,
          price: Money,
          qty: u32,
      }

      impl fmt::Display for Item {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "{:<10} {:<6} {:>8}  x{}", self.name, self.category, self.price, self.qty)
          }
      }

      struct Shop {
          items: Vec<Item>,
      }

      impl Shop {
          /// By category, then by name.
          fn sort(&mut self) {
              self.items.sort_by(|a, b| a.category.cmp(&b.category).then(a.name.cmp(&b.name)));
          }

          fn print_stock(&self) {
              let mut by_category: BTreeMap<Category, (u32, Money)> = BTreeMap::new();
              for item in &self.items {
                  println!("{item}");
                  let (units, value) = by_category.entry(item.category).or_insert((0, Money(0)));
                  *units += item.qty;
                  *value = value.plus(item.price.times(item.qty));
              }
              for (category, (units, value)) in &by_category {
                  println!("{category}: {units} units, {value}");
              }
          }
      }

      /// "12.50" -> Money(1250)
      fn parse_money(text: &str) -> Money {
          let (whole, cents) = text.split_once('.').expect("a price looks like 12.50");
          let whole: u64 = whole.parse().expect("invalid price");
          let cents: u64 = cents.parse().expect("invalid price");
          Money(whole * 100 + cents)
      }

      fn parse_category(text: &str) -> Category {
          match text {
              "food" => Category::Food,
              "tools" => Category::Tools,
              "toys" => Category::Toys,
              other => panic!("unknown category {other}"),
          }
      }

      /// "hammer, tools, 12.50, 10" -> Item
      fn parse_item(line: &str) -> Item {
          let fields: Vec<&str> = line.split(',').collect();
          let [name, category, price, qty] = fields.as_slice() else {
              panic!("expected 4 fields: {line}");
          };
          Item {
              name: name.trim().to_string(),
              category: parse_category(category.trim()),
              price: parse_money(price.trim()),
              qty: qty.trim().parse().expect("invalid quantity"),
          }
      }

      fn main() {
          let mut text = String::new();
          io::stdin().read_to_string(&mut text).expect("failed to read input");

          let mut shop = Shop { items: Vec::new() };
          for line in text.lines() {
              if line.trim().is_empty() {
                  break; // a blank line ends the stock list
              }
              shop.items.push(parse_item(line));
          }

          shop.sort();
          shop.print_stock();
      }
    tests:
      - stdin: "hammer, tools, 12.50, 10\napple, food, 0.40, 200\ndrill, tools, 89.99, 3\nteddy, toys, 15.00, 8\n"
      - stdin: "yoyo, toys, 2.50, 40\nbread, food, 3.20, 15\nkite, toys, 18.00, 2\naxe, tools, 45.00, 0\n"
      - stdin: "saw, tools, 25.00, 2\nrice, food, 1.99, 50\nawl, tools, 6.75, 4\n"
        hidden: true
    hints:
      - "Add `PartialEq, Eq, PartialOrd, Ord` to the `#[derive(...)]` on `Category`, then sort with `a.category.cmp(&b.category).then(a.name.cmp(&b.name))`."
      - "`Money::times` is `Money(self.0 * qty as u64)` and `Money::plus` is `Money(self.0 + other.0)`."
      - "In `print_stock`, print each item while adding it to a `BTreeMap<Category, (u32, Money)>`, then loop over the map for the summary lines `{category}: {units} units, {value}`."

  - title: Bad lines and a real error type
    text: |
      Stock lists are typed by people, exported from spreadsheets and edited by scripts, so they contain mistakes. Right now one bad line panics and the shop can't open. Instead, report each bad line with its line number, skip it, and load the rest:

      ```
      line 5: unknown category "garden"
      line 6: invalid price "0.1"
      line 8: duplicate item "apple"
      line 9: expected 4 fields, found 3
      ```

      The error lines come first (as each line is loaded), then the sorted stock and summary as before.

      | Problem | Message |
      |---|---|
      | not exactly 4 comma-separated fields | `expected 4 fields, found 3` |
      | a price that isn't dollars with exactly two decimals (`12.50`), or whole dollars (`12`) | `invalid price "0.1"` |
      | a quantity that isn't a whole number 0 or above | `invalid quantity "many"` |
      | a category other than food, tools, toys | `unknown category "garden"` |
      | a name that's already in the shop | `duplicate item "apple"` |

      ### One enum for everything that can go wrong

      Model the errors as an enum, one variant per problem, carrying the data the message needs:

      ```rust
      #[derive(Debug)]
      enum ShopError {
          FieldCount(usize),
          BadPrice(String),
          BadQuantity(String),
          UnknownCategory(String),
          Duplicate(String),
      }
      ```

      Then implement `Display` (a `match` with one `write!` per variant) and the standard `std::error::Error` trait (an empty `impl` is enough: its methods all have defaults). With those two impls, `ShopError` is a proper Rust error: it prints nicely, works with `?`, and can be boxed into `Box<dyn Error>` by any code that uses yours.

      Why an enum instead of `String` messages? Because code can *react* to an enum. A future web version could return 404 for `UnknownItem` and 400 for `BadPrice` by matching on the variant; with strings it would have to parse its own error messages.

      ### Plumbing with ?

      Make the parsers return `Result<_, ShopError>`: `parse_money`, a new `parse_quantity`, `parse_category` and `parse_item`. Inside `parse_item`, every field becomes a one-liner with `?`:

      ```rust
      Ok(Item {
          name: name.trim().to_string(),
          category: parse_category(category.trim())?,
          price: parse_money(price.trim())?,
          qty: parse_quantity(qty.trim())?,
      })
      ```

      `map_err` converts the standard library's parse errors into yours: `text.parse().map_err(|_| ShopError::BadQuantity(text.to_string()))`.

      Duplicates can only be detected by the shop, so give `Shop` an `add(&mut self, item: Item) -> Result<(), ShopError>` method. Then loading one line is a two-step chain:

      ```rust
      fn load(shop: &mut Shop, line: &str) -> Result<(), ShopError> {
          shop.add(parse_item(line)?)
      }
      ```

      and `main` prints `line N: {e}` for any error. Check the price carefully: `split_once('.')` must give exactly two digits after the point (`0.1` is rejected, since nobody can tell whether it meant 10 cents or 1), and no point at all means whole dollars.
    solution: |
      use std::collections::BTreeMap;
      use std::fmt;
      use std::io;
      use std::io::Read;

      /// An amount of money in cents. Whole cents never round wrongly, unlike f64.
      #[derive(Debug, Clone, Copy)]
      struct Money(u64);

      impl Money {
          fn times(self, qty: u32) -> Money {
              Money(self.0 * qty as u64)
          }

          fn plus(self, other: Money) -> Money {
              Money(self.0 + other.0)
          }
      }

      impl fmt::Display for Money {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              // pad() applies the caller's width and alignment, so "{:>8}" works on Money.
              f.pad(&format!("${}.{:02}", self.0 / 100, self.0 % 100))
          }
      }

      #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
      enum Category {
          Food,
          Tools,
          Toys,
      }

      impl fmt::Display for Category {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let name = match self {
                  Category::Food => "food",
                  Category::Tools => "tools",
                  Category::Toys => "toys",
              };
              f.pad(name)
          }
      }

      struct Item {
          name: String,
          category: Category,
          price: Money,
          qty: u32,
      }

      impl fmt::Display for Item {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              write!(f, "{:<10} {:<6} {:>8}  x{}", self.name, self.category, self.price, self.qty)
          }
      }

      #[derive(Debug)]
      enum ShopError {
          FieldCount(usize),
          BadPrice(String),
          BadQuantity(String),
          UnknownCategory(String),
          Duplicate(String),
      }

      impl fmt::Display for ShopError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  ShopError::FieldCount(n) => write!(f, "expected 4 fields, found {n}"),
                  ShopError::BadPrice(text) => write!(f, "invalid price \"{text}\""),
                  ShopError::BadQuantity(text) => write!(f, "invalid quantity \"{text}\""),
                  ShopError::UnknownCategory(text) => write!(f, "unknown category \"{text}\""),
                  ShopError::Duplicate(name) => write!(f, "duplicate item \"{name}\""),
              }
          }
      }

      impl std::error::Error for ShopError {}

      struct Shop {
          items: Vec<Item>,
      }

      impl Shop {
          fn add(&mut self, item: Item) -> Result<(), ShopError> {
              for existing in &self.items {
                  if existing.name == item.name {
                      return Err(ShopError::Duplicate(item.name));
                  }
              }
              self.items.push(item);
              Ok(())
          }

          /// By category, then by name.
          fn sort(&mut self) {
              self.items.sort_by(|a, b| a.category.cmp(&b.category).then(a.name.cmp(&b.name)));
          }

          fn print_stock(&self) {
              let mut by_category: BTreeMap<Category, (u32, Money)> = BTreeMap::new();
              for item in &self.items {
                  println!("{item}");
                  let (units, value) = by_category.entry(item.category).or_insert((0, Money(0)));
                  *units += item.qty;
                  *value = value.plus(item.price.times(item.qty));
              }
              for (category, (units, value)) in &by_category {
                  println!("{category}: {units} units, {value}");
              }
          }
      }

      /// "12.50" -> Money(1250). Exactly two digits after the point; "12" means 12.00.
      fn parse_money(text: &str) -> Result<Money, ShopError> {
          let (whole, cents) = match text.split_once('.') {
              Some((whole, cents)) if cents.len() == 2 => (whole, cents),
              Some(_) => return Err(ShopError::BadPrice(text.to_string())),
              None => (text, "00"),
          };
          let whole: u64 = whole.parse().map_err(|_| ShopError::BadPrice(text.to_string()))?;
          let cents: u64 = cents.parse().map_err(|_| ShopError::BadPrice(text.to_string()))?;
          Ok(Money(whole * 100 + cents))
      }

      fn parse_quantity(text: &str) -> Result<u32, ShopError> {
          text.parse().map_err(|_| ShopError::BadQuantity(text.to_string()))
      }

      fn parse_category(text: &str) -> Result<Category, ShopError> {
          match text {
              "food" => Ok(Category::Food),
              "tools" => Ok(Category::Tools),
              "toys" => Ok(Category::Toys),
              other => Err(ShopError::UnknownCategory(other.to_string())),
          }
      }

      /// "hammer, tools, 12.50, 10" -> Item
      fn parse_item(line: &str) -> Result<Item, ShopError> {
          let fields: Vec<&str> = line.split(',').collect();
          let [name, category, price, qty] = fields.as_slice() else {
              return Err(ShopError::FieldCount(fields.len()));
          };
          Ok(Item {
              name: name.trim().to_string(),
              category: parse_category(category.trim())?,
              price: parse_money(price.trim())?,
              qty: parse_quantity(qty.trim())?,
          })
      }

      fn load(shop: &mut Shop, line: &str) -> Result<(), ShopError> {
          shop.add(parse_item(line)?)
      }

      fn main() {
          let mut text = String::new();
          io::stdin().read_to_string(&mut text).expect("failed to read input");

          let mut shop = Shop { items: Vec::new() };
          for (i, line) in text.lines().enumerate() {
              if line.trim().is_empty() {
                  break; // a blank line ends the stock list
              }
              if let Err(e) = load(&mut shop, line) {
                  println!("line {}: {e}", i + 1);
              }
          }

          shop.sort();
          shop.print_stock();
      }
