id: log-analyzer
title: A log analyzer for the command line
level: Advanced
after: cli
summary: Build loglens, a small tool in the spirit of the ones every operations team writes. Parse access-log lines with FromStr, read the file named on the command line, aggregate statistics per endpoint, filter with flags, and report through exit codes that scripts and CI can act on.
