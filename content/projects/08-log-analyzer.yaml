    hints:
      - "Give `Config` the three `Option` fields (derive `Default`), and parse the arguments with `let mut args = args.iter(); while let Some(arg) = args.next() { match arg.as_str() { ... } }`."
      - "`StatusFilter::from_str`: `match s.strip_suffix(\"xx\")` gives a class (`Some(class)`) or an exact code (`None`); then check the class is 1 to 5 or the code 100 to 599."
      - "In `run`, print `matching:` after `skipped:`, using `let matching: Vec<LogEntry> = entries.into_iter().filter(|e| config.matches(e)).collect();`, and report on `matching`."

  - title: "Polish: exit codes that scripts can act on"
    text: |
      A tool that only prints is a tool someone has to read. A tool with meaningful **exit codes** can run unattended: in a CI pipeline after a load test, in a cron job, in a deployment script that rolls back when things look bad:

      ```text
      loglens access.log --since 2026-03-14T10:00:00Z --fail-on-5xx || rollback-deploy
      ```

      Two additions:

      - A last report line counting the matching requests per status class, in class order, leaving out classes with no requests: `status classes: 2xx=5 4xx=1 5xx=1`.
      - A `--fail-on-5xx` flag: when it's given and any **matching** request has a 5xx status, still print the full report, then print `error: 2 server error(s) found` to stderr and exit with code **3**. Without the flag, or with no 5xx among the matching requests, exit 0 as before.

      Why a new code instead of 1? Because the caller may want to tell "the log looks bad" (3) apart from "the tool couldn't even read the log" (1) and "you called it wrong" (2). Document your codes; here, a comment above `run` is the right place:

      ```rust
      /// Exit codes: 0 ok, 1 runtime error, 2 bad command line, 3 server errors found with --fail-on-5xx.
      fn run(config: &Config) -> anyhow::Result<ExitCode> {
      ```

      `run` now returns the `ExitCode` to use on success, and `main` returns it. The decision about *what* to report stays in `run`; `main` only maps errors to codes.

      For the class counts, a `BTreeMap<u16, u32>` keyed by `status / 100` keeps the classes in order. Building the line is a good fit for an iterator chain ending in `join`:

      ```rust
      let classes: Vec<String> = classes.iter().map(|(class, n)| format!("{class}xx={n}")).collect();
      println!("status classes: {}", classes.join(" "));
      ```

      Run your tool against the examples one last time with different flags. You've built the same shape as most command-line tools at work: typed parsing at the edges (`FromStr`, `Config`), a `run` that returns `Result`, errors with context, output for people on stdout, problems on stderr, and exit codes for machines.
    solution: |
      use anyhow::Context;
      use std::cmp::Reverse;
      use std::collections::BTreeMap;
      use std::env;
      use std::fmt;
      use std::fs;
      use std::process::ExitCode;
      use std::str::FromStr;
      use thiserror::Error;

      const USAGE: &str = "usage: loglens <file> [--method METHOD] [--status CODE|Nxx] [--since TIMESTAMP] [--fail-on-5xx]";

      /// The HTTP methods this service uses.
      #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
      enum Method {
          Get,
          Post,
          Put,
          Delete,
      }

      impl fmt::Display for Method {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let name = match self {
                  Method::Get => "GET",
                  Method::Post => "POST",
                  Method::Put => "PUT",
                  Method::Delete => "DELETE",
              };
              f.pad(name)
          }
      }

      /// One line of the access log.
      #[derive(Debug, Clone, PartialEq)]
      struct LogEntry {
          timestamp: String,
          method: Method,
          path: String,
          status: u16,
          duration_ms: u32,
      }

      #[derive(Debug, PartialEq, Error)]
      enum ParseError {
          #[error("expected 5 fields, found {0}")]
          FieldCount(usize),
          #[error("unknown method \"{0}\"")]
          Method(String),
          #[error("invalid path \"{0}\"")]
          Path(String),
          #[error("invalid status \"{0}\"")]
          Status(String),
          #[error("invalid duration \"{0}\"")]
          Duration(String),
      }

      impl FromStr for Method {
          type Err = ParseError;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              match s {
                  "GET" => Ok(Method::Get),
                  "POST" => Ok(Method::Post),
                  "PUT" => Ok(Method::Put),
                  "DELETE" => Ok(Method::Delete),
                  other => Err(ParseError::Method(other.to_string())),
              }
          }
      }

      impl FromStr for LogEntry {
          type Err = ParseError;

          /// "2026-03-14T10:00:01Z GET /api/users 200 35ms"
          fn from_str(line: &str) -> Result<Self, Self::Err> {
              let fields: Vec<&str> = line.split_whitespace().collect();
              let [timestamp, method, path, status, duration] = fields[..] else {
                  return Err(ParseError::FieldCount(fields.len()));
              };
              let method: Method = method.parse()?;
              if !path.starts_with('/') {
                  return Err(ParseError::Path(path.to_string()));
              }
              let status = match status.parse::<u16>() {
                  Ok(code) if (100..=599).contains(&code) => code,
                  _ => return Err(ParseError::Status(status.to_string())),
              };
              let duration_ms = duration
                  .strip_suffix("ms")
                  .and_then(|ms| ms.parse().ok())
                  .ok_or_else(|| ParseError::Duration(duration.to_string()))?;
              Ok(LogEntry { timestamp: timestamp.to_string(), method, path: path.to_string(), status, duration_ms })
          }
      }

      /// `--status 404` matches one code, `--status 5xx` a whole class.
      #[derive(Debug, Clone, Copy, PartialEq)]
      enum StatusFilter {
          Exact(u16),
          Class(u16),
      }

      impl StatusFilter {
          fn matches(&self, status: u16) -> bool {
              match self {
                  StatusFilter::Exact(code) => status == *code,
                  StatusFilter::Class(class) => status / 100 == *class,
              }
          }
      }

      impl FromStr for StatusFilter {
          type Err = String;

          fn from_str(s: &str) -> Result<Self, Self::Err> {
              let filter = match s.strip_suffix("xx") {
                  Some(class) => class.parse().ok().map(StatusFilter::Class),
                  None => s.parse().ok().map(StatusFilter::Exact),
              };
              match filter {
                  Some(StatusFilter::Class(c)) if (1..=5).contains(&c) => Ok(StatusFilter::Class(c)),
                  Some(StatusFilter::Exact(c)) if (100..=599).contains(&c) => Ok(StatusFilter::Exact(c)),
                  _ => Err(format!("invalid status filter \"{s}\" (use a code like 404 or a class like 5xx)")),
              }
          }
      }

      /// Everything the command line asked for.
      #[derive(Debug, Default)]
      struct Config {
          file: String,
          method: Option<Method>,
          status: Option<StatusFilter>,
          since: Option<String>,
          fail_on_5xx: bool,
      }

      impl Config {
          fn from_args(args: &[String]) -> Result<Config, String> {
              let mut config = Config::default();
              let mut file = None;
              let mut args = args.iter();
              while let Some(arg) = args.next() {
                  match arg.as_str() {
                      "--method" => {
                          let value = args.next().ok_or("--method needs a value")?;
                          config.method = Some(value.parse().map_err(|e: ParseError| e.to_string())?);
                      }
                      "--status" => {
                          let value = args.next().ok_or("--status needs a value")?;
                          config.status = Some(value.parse()?);
                      }
                      "--since" => {
                          let value = args.next().ok_or("--since needs a value")?;
                          config.since = Some(value.clone());
                      }
                      "--fail-on-5xx" => config.fail_on_5xx = true,
                      flag if flag.starts_with("--") => return Err(format!("unknown option {flag}")),
                      _ if file.is_none() => file = Some(arg.clone()),
                      _ => return Err(format!("unexpected argument {arg}")),
                  }
              }
              config.file = file.ok_or("missing log file")?;
              Ok(config)
          }

          /// Does this entry pass every filter that was given?
          fn matches(&self, entry: &LogEntry) -> bool {
              self.method.is_none_or(|method| entry.method == method)
                  && self.status.is_none_or(|status| status.matches(entry.status))
                  // ISO 8601 timestamps in UTC sort correctly as plain strings.
                  && self.since.as_ref().is_none_or(|since| entry.timestamp >= *since)
          }
      }

      #[derive(Debug, Default)]
      struct EndpointStats {
          count: u32,
          client_errors: u32,
          server_errors: u32,
          total_ms: u64,
          max_ms: u32,
      }

      /// Statistics per (path, method), busiest first; equal counts in path order.
      fn endpoint_stats(entries: &[LogEntry]) -> Vec<((&str, Method), EndpointStats)> {
          let mut by_endpoint: BTreeMap<(&str, Method), EndpointStats> = BTreeMap::new();
          for entry in entries {
              let stats = by_endpoint.entry((entry.path.as_str(), entry.method)).or_default();
              stats.count += 1;
              match entry.status {
                  400..=499 => stats.client_errors += 1,
                  500..=599 => stats.server_errors += 1,
                  _ => {}
              }
              stats.total_ms += entry.duration_ms as u64;
              stats.max_ms = stats.max_ms.max(entry.duration_ms);
          }
          let mut rows: Vec<_> = by_endpoint.into_iter().collect();
          // Busiest first. The sort is stable, so equal counts keep the map's (path, method) order.
          rows.sort_by_key(|(_, stats)| Reverse(stats.count));
          rows
      }

      fn print_report(entries: &[LogEntry]) {
          let (Some(first), Some(last)) = (
              entries.iter().map(|e| e.timestamp.as_str()).min(),
              entries.iter().map(|e| e.timestamp.as_str()).max(),
          ) else {
              return;
          };
          println!("period: {first} to {last}");
          if let Some(slow) = entries.iter().reduce(|best, e| if e.duration_ms > best.duration_ms { e } else { best }) {
              println!("slowest: {} {} -> {} in {}ms", slow.method, slow.path, slow.status, slow.duration_ms);
          }

          println!("{:<24}{:>7}{:>6}{:>6}{:>9}{:>9}", "endpoint", "count", "4xx", "5xx", "avg ms", "max ms");
          for ((path, method), stats) in endpoint_stats(entries) {
              let avg = stats.total_ms as f64 / stats.count as f64;
              let endpoint = format!("{method} {path}");
              println!(
                  "{endpoint:<24}{:>7}{:>6}{:>6}{avg:>9.1}{:>9}",
                  stats.count, stats.client_errors, stats.server_errors, stats.max_ms
              );
          }

          let mut classes: BTreeMap<u16, u32> = BTreeMap::new();
          for entry in entries {
              *classes.entry(entry.status / 100).or_insert(0) += 1;
          }
          let classes: Vec<String> = classes.iter().map(|(class, n)| format!("{class}xx={n}")).collect();
          println!("status classes: {}", classes.join(" "));
      }

      /// Exit codes: 0 ok, 1 runtime error, 2 bad command line, 3 server errors found with --fail-on-5xx.
      fn run(config: &Config) -> anyhow::Result<ExitCode> {
          let text = fs::read_to_string(&config.file).with_context(|| format!("reading {}", config.file))?;

          let mut entries = Vec::new();
          let mut skipped = 0;
          for (i, line) in text.lines().enumerate() {
              if line.trim().is_empty() {
                  continue;
              }
              match line.parse::<LogEntry>() {
                  Ok(entry) => entries.push(entry),
                  Err(e) => {
                      eprintln!("warning: line {}: {e}", i + 1);
                      skipped += 1;
                  }
              }
          }
          println!("requests: {}", entries.len());
          println!("skipped: {skipped}");

          let matching: Vec<LogEntry> = entries.into_iter().filter(|e| config.matches(e)).collect();
          println!("matching: {}", matching.len());
          print_report(&matching);

          let server_errors = matching.iter().filter(|e| e.status >= 500).count();
          if config.fail_on_5xx && server_errors > 0 {
              eprintln!("error: {server_errors} server error(s) found");
              return Ok(ExitCode::from(3));
          }
          Ok(ExitCode::SUCCESS)
      }

      fn main() -> ExitCode {
          let args: Vec<String> = env::args().skip(1).collect();
          let config = match Config::from_args(&args) {
              Ok(config) => config,
              Err(message) => {
                  eprintln!("error: {message}");
                  eprintln!("{USAGE}");
                  return ExitCode::from(2);
              }
          };
          match run(&config) {
              Ok(code) => code,
              Err(e) => {
                  eprintln!("error: {e:#}");
                  ExitCode::FAILURE
              }
          }
      }
    tests:
      - args: ["access.log", "--fail-on-5xx"]
        files:
          access.log: |
            2026-03-14T10:00:01Z GET /api/users 200 35ms
            2026-03-14T10:00:03Z POST /api/orders 201 120ms
            2026-03-14T10:00:04Z GET /api/users 200 55ms
            2026-03-14T10:01:10Z GET /api/users/42 404 8ms
            2026-03-14T10:02:00Z POST /api/orders 503 1200ms
            2026-03-14T10:02:30Z FETCH /api/users 200 10ms

            2026-03-14T10:03:00Z GET /api/users 200 30ms
            2026-03-14T10:04:59Z DELETE /api/orders/7 204 15ms
        exit: 3
      - args: ["access.log", "--fail-on-5xx", "--method", "GET"]
        files:
          access.log: |
            2026-03-14T10:00:01Z GET /api/users 200 35ms
            2026-03-14T10:00:03Z POST /api/orders 201 120ms
            2026-03-14T10:00:04Z GET /api/users 200 55ms
            2026-03-14T10:01:10Z GET /api/users/42 404 8ms
            2026-03-14T10:02:00Z POST /api/orders 503 1200ms
            2026-03-14T10:02:30Z FETCH /api/users 200 10ms

            2026-03-14T10:03:00Z GET /api/users 200 30ms
            2026-03-14T10:04:59Z DELETE /api/orders/7 204 15ms
      - args: ["server.log"]
        files:
          server.log: |
            2026-05-02T08:00:00Z GET /health 200 1ms
            2026-05-02T08:00:05Z PUT /api/cart/9 200 42ms
            2026-05-02T08:00:06Z PUT /api/cart/9 409 40ms
            2026-05-02T07:59:58Z GET /health 101 2ms
            2026-05-02T08:00:09Z POST /api/checkout 502 3000ms
            2026-05-02T08:00:10Z POST /api/checkout 201 3000ms
            2026-05-02T08:00:11Z GET /api/cart/9 304 12ms
        hidden: true
      - args: ["--fail-on-5xx", "server.log", "--since", "2026-05-02T08:00:10Z"]
        files:
          server.log: |
            2026-05-02T08:00:09Z POST /api/checkout 502 3000ms
            2026-05-02T08:00:10Z POST /api/checkout 201 3000ms
            2026-05-02T08:00:11Z GET /api/cart/9 304 12ms
        hidden: true
      - args: ["--fail-on-5xx"]
        exit: 2
        allowEmpty: true
        hidden: true
    hints:
      - "Add `fail_on_5xx: bool` to `Config` and a `\"--fail-on-5xx\" => config.fail_on_5xx = true,` arm."
      - "At the end of the report, count `entry.status / 100` in a `BTreeMap<u16, u32>` and print the `status classes:` line with `join(\" \")`."
      - "Change `run` to return `anyhow::Result<ExitCode>`: after printing, if the flag is set and `matching.iter().filter(|e| e.status >= 500).count()` is above 0, `eprintln!` the message and `return Ok(ExitCode::from(3));`."
