id: task-scheduler
title: A parallel task scheduler
level: Advanced
after: graphs
summary: The core of every build system and CI pipeline. Parse tasks and their dependencies, order them with a topological sort, name the cycle when there is one, run independent tasks in parallel waves on scoped threads with deterministic output, and find the critical path.
