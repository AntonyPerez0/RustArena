milestones:
  - title: Parse the task file
    text: |
      `cargo build`, `make`, CI pipelines, data workflows and even a cooking recipe have the same structure: **tasks** that take some work, and **dependencies** between them (you can't test before you compile, you can't butter toast that isn't toasted). Under the hood, every one of these tools is a **scheduler**: it works out an order that respects the dependencies and runs as much as possible at the same time. In this project you'll build one.

      Tasks come from standard input, one per line:

      ```text
      # A small build
      fetch (2):
      configure (1): fetch
      compile (5): configure fetch
      test (3): compile
      docs (2): configure
      package (1): compile test docs
      ```

      Each line is `name (cost): dependencies`. The **cost** is how much work the task takes (think seconds), and the dependencies are the tasks that must finish first, separated by spaces. Blank lines and lines starting with `#` are ignored.

      For now, read the file and print every task in name order, with its dependencies in name order (or `-` for none):

      ```text
      compile (5): configure, fetch
      configure (1): fetch
      docs (2): configure
      fetch (2): -
      package (1): compile, docs, test
      test (3): compile
      ```

      ### The data structure is the graph

      ```rust
      struct Task {
          cost: u32,
          deps: BTreeSet<String>,
      }
      ```

      in a `BTreeMap<String, Task>` keyed by name. That map *is* a **directed graph** stored as an adjacency list: each task points at the tasks it depends on. Using `BTreeMap` and `BTreeSet` instead of the hash versions keeps every walk over them in sorted order, which will make the scheduler's output identical on every run. A set also quietly merges a dependency listed twice.

      ### Report every problem

      If anything is wrong, print every problem as `error: ...` and exit with code 1 (`ExitCode::FAILURE`), without printing the list:

      | Problem | Message |
      |---|---|
      | no `:` or no `(cost)` | `line 4: expected "name (cost): dependencies"` |
      | a name with characters other than letters, digits, `-` and `_` | `line 7: invalid task name "bad name"` |
      | a cost that isn't a whole number above 0 | `line 3: invalid cost "x"` |
      | a name used twice | `line 2: task "fetch" is defined twice` |
      | a dependency that isn't defined anywhere | `task "deploy" depends on unknown task "package"` |

      Line errors come in line order. Unknown dependencies are checked **after** reading every line, because a task may depend on one defined later in the file (forward references are normal in real build files); they're reported in task-name order, then dependency order. (The errors go to standard output so the tests can check them; a real tool would print them with `eprintln!`.)

      Parsing a line is a chain of small steps that can each fail: `split_once(':')`, then `strip_suffix(')')` and `split_once('(')` on the part before the colon, then parsing the cost. Writing it as `fn parse_line(line: &str) -> Result<(String, Task), String>` with `?` and `ok_or_else` keeps it flat.
    solution: |
      use std::collections::{BTreeMap, BTreeSet};
      use std::io::{self, Read};
      use std::process::ExitCode;

      #[derive(Debug)]
      struct Task {
          cost: u32,
          deps: BTreeSet<String>,
      }

      /// "compile (5): configure fetch" -> ("compile", Task { cost: 5, deps: {"configure", "fetch"} })
      fn parse_line(line: &str) -> Result<(String, Task), String> {
          let format_error = || String::from("expected \"name (cost): dependencies\"");
          let (head, deps) = line.split_once(':').ok_or_else(format_error)?;
          let (name, cost) = head.trim().strip_suffix(')').and_then(|h| h.split_once('(')).ok_or_else(format_error)?;
          let name = name.trim();
          if name.is_empty() || !name.chars().all(|c| c.is_ascii_alphanumeric() || c == '-' || c == '_') {
              return Err(format!("invalid task name \"{name}\""));
          }
          let cost = match cost.trim().parse::<u32>() {
              Ok(cost) if cost > 0 => cost,
              _ => return Err(format!("invalid cost \"{}\"", cost.trim())),
          };
          let deps = deps.split_whitespace().map(String::from).collect();
          Ok((name.to_string(), Task { cost, deps }))
      }

      /// Parses the whole task file. On failure, returns every problem found.
      fn parse_tasks(input: &str) -> Result<BTreeMap<String, Task>, Vec<String>> {
          let mut tasks = BTreeMap::new();
          let mut errors = Vec::new();
          for (i, line) in input.lines().enumerate() {
              let line = line.trim();
              if line.is_empty() || line.starts_with('#') {
                  continue;
              }
              match parse_line(line) {
                  Ok((name, _)) if tasks.contains_key(&name) => {
                      errors.push(format!("line {}: task \"{name}\" is defined twice", i + 1));
                  }
                  Ok((name, task)) => {
                      tasks.insert(name, task);
                  }
                  Err(e) => errors.push(format!("line {}: {e}", i + 1)),
              }
          }
          for (name, task) in &tasks {
              for dep in &task.deps {
                  if !tasks.contains_key(dep) {
                      errors.push(format!("task \"{name}\" depends on unknown task \"{dep}\""));
                  }
              }
          }
          if errors.is_empty() { Ok(tasks) } else { Err(errors) }
      }

      fn main() -> ExitCode {
          let mut input = String::new();
          io::stdin().read_to_string(&mut input).expect("failed to read input");

          let tasks = match parse_tasks(&input) {
              Ok(tasks) => tasks,
              Err(errors) => {
                  for error in errors {
                      println!("error: {error}");
                  }
                  return ExitCode::FAILURE;
              }
          };
          for (name, task) in &tasks {
              let deps: Vec<&str> = task.deps.iter().map(String::as_str).collect();
              let deps = if deps.is_empty() { String::from("-") } else { deps.join(", ") };
              println!("{name} ({}): {deps}", task.cost);
          }
          ExitCode::SUCCESS
      }
    tests:
      - stdin: "# A small build\nfetch (2):\nconfigure (1): fetch\ncompile (5): configure fetch\ntest (3): compile\ndocs (2): configure\npackage (1): compile test docs\n"
      - stdin: "fetch (2):\nfetch (3):\ncompile (x): fetch\ntest 3: compile\nlint (0):\ndeploy (1): package\nbad name (1):\n"
        exit: 1
      - stdin: "# Sunday breakfast\nboil-water (3):\ngrind-coffee (1):\nbrew-coffee (4): boil-water grind-coffee\ntoast-bread (2):\nbutter-toast (1): toast-bread\nbreakfast (1): brew-coffee butter-toast\n"
        hidden: true
      - stdin: "app (1): lib lib util\n\nlib (2): util\nutil (3):\nweb (1): app api\n"
        exit: 1
        hidden: true
