                  if !tasks.contains_key(dep) {
                      errors.push(format!("task \"{name}\" depends on unknown task \"{dep}\""));
                  }
              }
          }
          if errors.is_empty() { Ok(tasks) } else { Err(errors) }
      }

      /// Kahn's algorithm. Among the tasks that are ready, the alphabetically first one goes next,
      /// so the order is the same on every run. Returns None if some tasks can never become ready.
      fn topo_order(tasks: &BTreeMap<String, Task>) -> Option<Vec<&str>> {
          // How many unfinished dependencies each task is still waiting for.
          let mut waiting: BTreeMap<&str, usize> = tasks.iter().map(|(name, task)| (name.as_str(), task.deps.len())).collect();
          // The edges reversed: for each task, the tasks that depend on it.
          let mut dependents: BTreeMap<&str, Vec<&str>> = BTreeMap::new();
          for (name, task) in tasks {
              for dep in &task.deps {
                  dependents.entry(dep.as_str()).or_default().push(name.as_str());
              }
          }
          let mut ready: BTreeSet<&str> = waiting.iter().filter(|(_, n)| **n == 0).map(|(name, _)| *name).collect();
