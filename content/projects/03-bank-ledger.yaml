      - "Add `Transfer { from: String, to: String, amount: u64 }`, a `[\"transfer\", from, to, amount]` arm in `parse_line`, and a `[\"transfer\", ..]` usage arm after it."
      - "In `transfer`, do every check (`check_positive`, `from == to`, `self.balance(from)?`, `self.balance(to)?`, enough money) before changing anything."
