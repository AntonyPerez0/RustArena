  - title: "Polish: powers, trace and a Fibonacci trick"
    text: |
      Two classic operations finish the library, and one of them needs a classic algorithm.

      - `trace(&self) -> Result<T, MatrixError>`: the sum of the diagonal entries.
      - `pow(&self, n: u32) -> Result<Matrix<T>, MatrixError>`: the matrix multiplied by itself `n` times. `pow(0)` is the identity and `pow(1)` the matrix itself.

      Both only make sense for **square** matrices: otherwise return `MatrixError::NotSquare { rows, cols }`, displayed as `a 2x3 matrix is not square`.

      ### Repeated squaring

      Multiplying `n` times is far too slow for big `n` (the tests ask for the billionth power). Instead, square repeatedly and use the binary digits of `n`: `M^13 = M^8 * M^4 * M^1`, because 13 is `1101` in binary. Keep a running `base` (`M`, `M^2`, `M^4`, `M^8`, ...) and multiply it into the result whenever the current bit of `n` is 1:

      ```rust
      let mut result = Matrix::identity(self.rows);
      let mut base = self.clone();
      while n > 0 {
          if n % 2 == 1 {
              result = &result * &base;
          }
          n /= 2;
          if n > 0 {
              base = &base * &base;
          }
      }
      ```

      That's about `2 * log2(n)` multiplications: 60 instead of a billion. The `if n > 0` before squaring isn't decoration: squaring once more after the last bit would compute a power nobody asked for, and with integer entries that extra power can overflow and panic.

      ### The Fibonacci trick

      Here's a beautiful use of `pow`. The Fibonacci numbers (0, 1, 1, 2, 3, 5, 8, ...) hide in the powers of one small matrix:

      ```text
      [1 1] ^ n   =   [F(n+1)  F(n)  ]
      [1 0]           [F(n)    F(n-1)]
      ```

      So `F(90)` is entry `(0, 1)` of the 90th power, computed with a handful of multiplications. With `u64` entries that's `2880067194370816120`, close to the largest Fibonacci number a `u64` can hold. The same idea (turn a step-by-step process into a matrix, then use fast powers) computes linear recurrences, graph walks and Markov chains at work.

      You've built a generic library that works for integers and floats alike, has a checked API and a panicking operator API with one source of error messages, respects formatting options, and is fully covered by tests. That's the shape of a real crate.
    solution: |
      use std::fmt;
      use std::ops::{Add, Index, IndexMut, Mul};

      /// A rows x cols matrix, stored row by row in one Vec.
      #[derive(Debug, Clone, PartialEq)]
      struct Matrix<T> {
          rows: usize,
          cols: usize,
          data: Vec<T>,
      }

      #[derive(Debug, Clone, PartialEq, Eq)]
      enum MatrixError {
          Empty,
          Ragged { row: usize, expected: usize, found: usize },
          ShapeMismatch { op: &'static str, left: (usize, usize), right: (usize, usize) },
          NotSquare { rows: usize, cols: usize },
      }

      impl fmt::Display for MatrixError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  MatrixError::Empty => write!(f, "a matrix needs at least one row and one column"),
                  MatrixError::Ragged { row, expected, found } => {
                      write!(f, "row {row} has {found} entries, expected {expected}")
                  }
                  MatrixError::ShapeMismatch { op, left, right } => {
                      write!(f, "cannot {op} a {}x{} matrix and a {}x{} matrix", left.0, left.1, right.0, right.1)
                  }
                  MatrixError::NotSquare { rows, cols } => write!(f, "a {rows}x{cols} matrix is not square"),
              }
          }
      }

      impl std::error::Error for MatrixError {}

      // Methods that work for any T.
      impl<T> Matrix<T> {
          fn rows(&self) -> usize {
              self.rows
          }

          fn cols(&self) -> usize {
              self.cols
          }

          /// The entry at (row, col), or None if that's outside the matrix.
          fn get(&self, row: usize, col: usize) -> Option<&T> {
              if row < self.rows && col < self.cols { Some(&self.data[row * self.cols + col]) } else { None }
          }

          /// Where (row, col) lives in `data`. Panics with a clear message when it's outside the matrix.
          fn offset(&self, row: usize, col: usize) -> usize {
              assert!(
                  row < self.rows && col < self.cols,
                  "index ({row}, {col}) is outside a {}x{} matrix",
                  self.rows,
                  self.cols
              );
              row * self.cols + col
          }
      }

      // Methods that need to copy entries.
      impl<T: Clone> Matrix<T> {
          /// A rows x cols matrix with every entry set to `value`.
          fn filled(rows: usize, cols: usize, value: T) -> Self {
              Matrix { rows, cols, data: vec![value; rows * cols] }
          }

          /// Builds a matrix from its rows. Every row must have the same, non-zero length.
          fn from_rows(rows: Vec<Vec<T>>) -> Result<Self, MatrixError> {
              let cols = match rows.first() {
                  Some(first) if !first.is_empty() => first.len(),
                  _ => return Err(MatrixError::Empty),
              };
              let row_count = rows.len();
              let mut data = Vec::with_capacity(row_count * cols);
              for (i, row) in rows.into_iter().enumerate() {
                  if row.len() != cols {
                      return Err(MatrixError::Ragged { row: i, expected: cols, found: row.len() });
                  }
                  data.extend(row);
              }
              Ok(Matrix { rows: row_count, cols, data })
          }

          fn transpose(&self) -> Self {
              let mut data = Vec::with_capacity(self.data.len());
              for col in 0..self.cols {
                  for row in 0..self.rows {
                      data.push(self[(row, col)].clone());
                  }
              }
              Matrix { rows: self.cols, cols: self.rows, data }
          }
      }

      impl<T> Index<(usize, usize)> for Matrix<T> {
          type Output = T;

          fn index(&self, (row, col): (usize, usize)) -> &T {
              &self.data[self.offset(row, col)]
          }
      }

      impl<T> IndexMut<(usize, usize)> for Matrix<T> {
          fn index_mut(&mut self, (row, col): (usize, usize)) -> &mut T {
              let i = self.offset(row, col);
              &mut self.data[i]
          }
      }

      /// One row per line, entries right-aligned to the widest one. `{:.2}` sets the precision of every entry.
      impl<T: fmt::Display> fmt::Display for Matrix<T> {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let mut cells = Vec::with_capacity(self.data.len());
              for x in &self.data {
                  cells.push(match f.precision() {
                      Some(p) => format!("{x:.p$}"),
                      None => x.to_string(),
                  });
              }
              let mut width = 0;
              for cell in &cells {
                  width = width.max(cell.chars().count());
              }
              for row in 0..self.rows {
                  if row > 0 {
                      writeln!(f)?;
                  }
                  write!(f, "[")?;
                  for col in 0..self.cols {
                      if col > 0 {
                          write!(f, " ")?;
                      }
                      write!(f, "{:>width$}", cells[row * self.cols + col])?;
                  }
                  write!(f, "]")?;
              }
              Ok(())
          }
      }

      impl<T: Copy + Add<Output = T>> Matrix<T> {
          /// Entry-by-entry sum, or an error if the shapes differ.
          fn checked_add(&self, other: &Matrix<T>) -> Result<Matrix<T>, MatrixError> {
              if (self.rows, self.cols) != (other.rows, other.cols) {
                  return Err(MatrixError::ShapeMismatch {
                      op: "add",
                      left: (self.rows, self.cols),
                      right: (other.rows, other.cols),
                  });
              }
              let mut data = Vec::with_capacity(self.data.len());
              for (a, b) in self.data.iter().zip(&other.data) {
                  data.push(*a + *b);
              }
              Ok(Matrix { rows: self.rows, cols: self.cols, data })
          }
      }

      /// `&a + &b`. Like indexing out of bounds, adding mismatched shapes is a bug: it panics.
      impl<T: Copy + Add<Output = T>> Add for &Matrix<T> {
          type Output = Matrix<T>;

          fn add(self, other: Self) -> Matrix<T> {
              match self.checked_add(other) {
                  Ok(sum) => sum,
                  Err(e) => panic!("{e}"),
              }
          }
      }

      /// `a + b`, for when you don't need the operands any more.
      impl<T: Copy + Add<Output = T>> Add for Matrix<T> {
          type Output = Matrix<T>;

          fn add(self, other: Self) -> Matrix<T> {
              &self + &other
          }
      }

      /// `&m * k`: every entry times a scalar.
      impl<T: Copy + Mul<Output = T>> Mul<T> for &Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, k: T) -> Matrix<T> {
              let mut data = Vec::with_capacity(self.data.len());
              for x in &self.data {
                  data.push(*x * k);
              }
              Matrix { rows: self.rows, cols: self.cols, data }
          }
      }

      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Matrix<T> {
          /// The matrix product, or an error if self.cols != other.rows.
          fn checked_mul(&self, other: &Matrix<T>) -> Result<Matrix<T>, MatrixError> {
              if self.cols != other.rows {
                  return Err(MatrixError::ShapeMismatch {
                      op: "multiply",
                      left: (self.rows, self.cols),
                      right: (other.rows, other.cols),
                  });
              }
              let mut result = Matrix::filled(self.rows, other.cols, T::default());
              for row in 0..self.rows {
                  for col in 0..other.cols {
                      let mut sum = T::default();
                      for k in 0..self.cols {
                          sum = sum + self[(row, k)] * other[(k, col)];
                      }
                      result[(row, col)] = sum;
                  }
              }
              Ok(result)
          }
      }

      /// `&a * &b`: the matrix product. Panics if the shapes don't fit.
      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Mul for &Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, other: Self) -> Matrix<T> {
              match self.checked_mul(other) {
                  Ok(product) => product,
                  Err(e) => panic!("{e}"),
              }
          }
      }

      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Mul for Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, other: Self) -> Matrix<T> {
              &self * &other
          }
      }

      impl<T: Copy + From<u8>> Matrix<T> {
          /// The n x n identity: 1 on the diagonal, 0 elsewhere.
          fn identity(n: usize) -> Self {
              let mut m = Matrix::filled(n, n, T::from(0));
              for i in 0..n {
                  m[(i, i)] = T::from(1);
              }
              m
          }
      }

      impl<T: Copy + Default + From<u8> + Add<Output = T> + Mul<Output = T>> Matrix<T> {
          /// self to the power n, by repeated squaring: about 2 * log2(n) multiplications instead of n.
          fn pow(&self, mut n: u32) -> Result<Matrix<T>, MatrixError> {
              if self.rows != self.cols {
                  return Err(MatrixError::NotSquare { rows: self.rows, cols: self.cols });
              }
              let mut result = Matrix::identity(self.rows);
              let mut base = self.clone();
              while n > 0 {
                  if n % 2 == 1 {
                      result = &result * &base;
                  }
                  n /= 2;
                  if n > 0 {
                      base = &base * &base;
                  }
              }
              Ok(result)
          }

          /// The sum of the diagonal.
          fn trace(&self) -> Result<T, MatrixError> {
              if self.rows != self.cols {
                  return Err(MatrixError::NotSquare { rows: self.rows, cols: self.cols });
              }
              let mut sum = T::default();
              for i in 0..self.rows {
                  sum = sum + self[(i, i)];
              }
              Ok(sum)
          }
      }
    harness: |
      #[test]
      fn pow_zero_is_the_identity() {
          let m = Matrix::from_rows(vec![vec![2, 7], vec![1, 8]]).unwrap();
          assert_eq!(m.pow(0), Ok(Matrix::identity(2)), "m.pow(0)");
          assert_eq!(m.pow(1), Ok(m.clone()), "m.pow(1)");
      }

      #[test]
      fn pow_matches_repeated_multiplication() {
          let m = Matrix::from_rows(vec![vec![1, 1, 0], vec![0, 1, 1], vec![1, 0, 1]]).unwrap();
          let cube = &(&m * &m) * &m;
          assert_eq!(m.pow(3), Ok(cube.clone()), "m.pow(3)");
          assert_eq!(m.pow(6), Ok(&cube * &cube), "m.pow(6)");
      }

      #[test]
      fn fibonacci_numbers_from_matrix_powers() {
          // [[1, 1], [1, 0]] to the power n holds the Fibonacci number F(n) at (0, 1).
          let fib = Matrix::from_rows(vec![vec![1u64, 1], vec![1, 0]]).unwrap();
          assert_eq!(fib.pow(10).unwrap()[(0, 1)], 55, "F(10)");
          assert_eq!(fib.pow(90).unwrap()[(0, 1)], 2_880_067_194_370_816_120, "F(90)");
      }

      #[test]
      fn pow_is_fast_for_huge_exponents() {
          // A billion multiplications would take minutes; repeated squaring needs about 60.
          let flip = Matrix::from_rows(vec![vec![1i64, 0], vec![0, -1]]).unwrap();
          assert_eq!(flip.pow(1_000_000_001), Ok(flip.clone()), "flip.pow(1_000_000_001)");
          assert_eq!(flip.pow(1_000_000_000), Ok(Matrix::identity(2)), "flip.pow(1_000_000_000)");
      }

      #[test]
      fn trace_adds_the_diagonal() {
          let m = Matrix::from_rows(vec![vec![1.5, 9.0], vec![9.0, 2.5]]).unwrap();
          assert_eq!(m.trace(), Ok(4.0), "trace of [[1.5, 9], [9, 2.5]]");
          assert_eq!(Matrix::<i32>::identity(5).trace(), Ok(5), "trace of identity(5)");
      }

      #[test]
      fn pow_and_trace_need_a_square_matrix() {
          let m = Matrix::from_rows(vec![vec![1, 2, 3], vec![4, 5, 6]]).unwrap();
          assert_eq!(m.pow(2), Err(MatrixError::NotSquare { rows: 2, cols: 3 }), "pow of a 2x3 matrix");
          assert_eq!(m.trace(), Err(MatrixError::NotSquare { rows: 2, cols: 3 }), "trace of a 2x3 matrix");
          assert_eq!(MatrixError::NotSquare { rows: 2, cols: 3 }.to_string(), "a 2x3 matrix is not square", "the message");
      }

      #[test]
      fn everything_else_still_works() {
          let m = Matrix::from_rows(vec![vec![1, 2, 3], vec![4, 5, 6]]).unwrap();
          let t = m.transpose();
          assert_eq!(m.checked_mul(&t), Ok(&m * &t), "checked_mul agrees with *");
          assert_eq!(m.checked_add(&Matrix::filled(2, 3, 1)), Ok(&m + &Matrix::filled(2, 3, 1)), "checked_add agrees with +");
          assert_eq!((m.get(1, 2), m.rows(), m.cols()), (Some(&6), 2, 3), "get, rows, cols");
          assert_eq!((&m * 2).to_string(), "[ 2  4  6]\n[ 8 10 12]", "display of m * 2");
      }
    hints:
      - "Add `NotSquare { rows: usize, cols: usize }` to `MatrixError` and its message to `Display`."
      - "Put `pow` and `trace` in an `impl` block with all the bounds they need: `T: Copy + Default + From<u8> + Add<Output = T> + Mul<Output = T>`."
      - "`trace` starts from `T::default()` and adds `self[(i, i)]` for each `i`; `pow` is the repeated-squaring loop from the text, after the square check."
