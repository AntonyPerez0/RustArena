  - title: Matrix multiplication
    text: |
      Matrix multiplication is the operation the whole field runs on (every GPU is, at heart, a matrix multiplication machine). It isn't entry by entry. Entry `(r, c)` of `A * B` is row `r` of `A` combined with column `c` of `B`: multiply them pairwise and add up:

      ```text
      [1 2 3]   [1 4]   [1*1 + 2*2 + 3*3   1*4 + 2*5 + 3*6]   [14 32]
      [4 5 6] * [2 5] = [4*1 + 5*2 + 6*3   4*4 + 5*5 + 6*6] = [32 77]
                [3 6]
      ```

      So `A`'s columns must match `B`'s rows: a 2x3 times a 3x2 gives a 2x2. Write:

      - `checked_mul(&self, other) -> Result<Matrix<T>, MatrixError>`: the product, or `ShapeMismatch { op: "multiply", ... }` when `self.cols != other.rows`.
      - `Mul for &Matrix<T>` (and for owned matrices), panicking on a mismatch, just like `+`.
      - `identity(n)`: the n x n matrix with 1 on the diagonal and 0 elsewhere. Multiplying by it changes nothing, like multiplying a number by 1.

      Unlike numbers, `A * B` and `B * A` are usually **different** (when they're both even defined). That's not a bug in your code: it's what makes matrices able to describe "rotate, then move" as different from "move, then rotate".

      ### Where do zero and one come from?

      The sum for each entry starts at zero, and the identity needs ones, but `T` is generic: you can't write `0` and hope it becomes a `T`. Two standard traits help:

      - `Default`: for every number type, `T::default()` is zero. Add `Default` to the bounds and start each sum at `T::default()`.
      - `From<u8>`: `i32`, `i64`, `u32`, `u64`, `f32` and `f64` all implement `From<u8>` (a `u8` fits in each of them without loss), so `T::from(0)` and `T::from(1)` give zero and one of any of them. `identity` lives in its own `impl<T: Copy + From<u8>> Matrix<T>` block.

      The product's bounds are getting long: `T: Copy + Default + Add<Output = T> + Mul<Output = T>`. That's normal for numeric generic code. (In the advanced traits module you'll see how a `Number` trait with a blanket impl can name that whole list once. Production crates like `nalgebra` and `ndarray` do exactly that.)

      `Mul` now has two impls for `&Matrix<T>`: `Mul<T>` (times a scalar) from the last milestone and `Mul<&Matrix<T>>` (times a matrix). Rust picks one from the type on the right of `*`. Overloading on the right-hand side is allowed because they're different traits as far as the compiler is concerned (`Mul<T>` versus `Mul<&Matrix<T>>`).
    solution: |
      use std::fmt;
      use std::ops::{Add, Index, IndexMut, Mul};

      /// A rows x cols matrix, stored row by row in one Vec.
      #[derive(Debug, Clone, PartialEq)]
      struct Matrix<T> {
          rows: usize,
          cols: usize,
          data: Vec<T>,
      }

      #[derive(Debug, Clone, PartialEq, Eq)]
      enum MatrixError {
          Empty,
          Ragged { row: usize, expected: usize, found: usize },
          ShapeMismatch { op: &'static str, left: (usize, usize), right: (usize, usize) },
      }

      impl fmt::Display for MatrixError {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              match self {
                  MatrixError::Empty => write!(f, "a matrix needs at least one row and one column"),
                  MatrixError::Ragged { row, expected, found } => {
                      write!(f, "row {row} has {found} entries, expected {expected}")
                  }
                  MatrixError::ShapeMismatch { op, left, right } => {
                      write!(f, "cannot {op} a {}x{} matrix and a {}x{} matrix", left.0, left.1, right.0, right.1)
                  }
              }
          }
      }

      impl std::error::Error for MatrixError {}

      // Methods that work for any T.
      impl<T> Matrix<T> {
          fn rows(&self) -> usize {
              self.rows
          }

          fn cols(&self) -> usize {
              self.cols
          }

          /// The entry at (row, col), or None if that's outside the matrix.
          fn get(&self, row: usize, col: usize) -> Option<&T> {
              if row < self.rows && col < self.cols { Some(&self.data[row * self.cols + col]) } else { None }
          }

          /// Where (row, col) lives in `data`. Panics with a clear message when it's outside the matrix.
          fn offset(&self, row: usize, col: usize) -> usize {
              assert!(
                  row < self.rows && col < self.cols,
                  "index ({row}, {col}) is outside a {}x{} matrix",
                  self.rows,
                  self.cols
              );
              row * self.cols + col
          }
      }

      // Methods that need to copy entries.
      impl<T: Clone> Matrix<T> {
          /// A rows x cols matrix with every entry set to `value`.
          fn filled(rows: usize, cols: usize, value: T) -> Self {
              Matrix { rows, cols, data: vec![value; rows * cols] }
          }

          /// Builds a matrix from its rows. Every row must have the same, non-zero length.
          fn from_rows(rows: Vec<Vec<T>>) -> Result<Self, MatrixError> {
              let cols = match rows.first() {
                  Some(first) if !first.is_empty() => first.len(),
                  _ => return Err(MatrixError::Empty),
              };
              let row_count = rows.len();
              let mut data = Vec::with_capacity(row_count * cols);
              for (i, row) in rows.into_iter().enumerate() {
                  if row.len() != cols {
                      return Err(MatrixError::Ragged { row: i, expected: cols, found: row.len() });
                  }
                  data.extend(row);
              }
              Ok(Matrix { rows: row_count, cols, data })
          }

          fn transpose(&self) -> Self {
              let mut data = Vec::with_capacity(self.data.len());
              for col in 0..self.cols {
                  for row in 0..self.rows {
                      data.push(self[(row, col)].clone());
                  }
              }
              Matrix { rows: self.cols, cols: self.rows, data }
          }
      }

      impl<T> Index<(usize, usize)> for Matrix<T> {
          type Output = T;

          fn index(&self, (row, col): (usize, usize)) -> &T {
              &self.data[self.offset(row, col)]
          }
      }

      impl<T> IndexMut<(usize, usize)> for Matrix<T> {
          fn index_mut(&mut self, (row, col): (usize, usize)) -> &mut T {
              let i = self.offset(row, col);
              &mut self.data[i]
          }
      }

      /// One row per line, entries right-aligned to the widest one. `{:.2}` sets the precision of every entry.
      impl<T: fmt::Display> fmt::Display for Matrix<T> {
          fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
              let mut cells = Vec::with_capacity(self.data.len());
              for x in &self.data {
                  cells.push(match f.precision() {
                      Some(p) => format!("{x:.p$}"),
                      None => x.to_string(),
                  });
              }
              let mut width = 0;
              for cell in &cells {
                  width = width.max(cell.chars().count());
              }
              for row in 0..self.rows {
                  if row > 0 {
                      writeln!(f)?;
                  }
                  write!(f, "[")?;
                  for col in 0..self.cols {
                      if col > 0 {
                          write!(f, " ")?;
                      }
                      write!(f, "{:>width$}", cells[row * self.cols + col])?;
                  }
                  write!(f, "]")?;
              }
              Ok(())
          }
      }

      impl<T: Copy + Add<Output = T>> Matrix<T> {
          /// Entry-by-entry sum, or an error if the shapes differ.
          fn checked_add(&self, other: &Matrix<T>) -> Result<Matrix<T>, MatrixError> {
              if (self.rows, self.cols) != (other.rows, other.cols) {
                  return Err(MatrixError::ShapeMismatch {
                      op: "add",
                      left: (self.rows, self.cols),
                      right: (other.rows, other.cols),
                  });
              }
              let mut data = Vec::with_capacity(self.data.len());
              for (a, b) in self.data.iter().zip(&other.data) {
                  data.push(*a + *b);
              }
              Ok(Matrix { rows: self.rows, cols: self.cols, data })
          }
      }

      /// `&a + &b`. Like indexing out of bounds, adding mismatched shapes is a bug: it panics.
      impl<T: Copy + Add<Output = T>> Add for &Matrix<T> {
          type Output = Matrix<T>;

          fn add(self, other: Self) -> Matrix<T> {
              match self.checked_add(other) {
                  Ok(sum) => sum,
                  Err(e) => panic!("{e}"),
              }
          }
      }

      /// `a + b`, for when you don't need the operands any more.
      impl<T: Copy + Add<Output = T>> Add for Matrix<T> {
          type Output = Matrix<T>;

          fn add(self, other: Self) -> Matrix<T> {
              &self + &other
          }
      }

      /// `&m * k`: every entry times a scalar.
      impl<T: Copy + Mul<Output = T>> Mul<T> for &Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, k: T) -> Matrix<T> {
              let mut data = Vec::with_capacity(self.data.len());
              for x in &self.data {
                  data.push(*x * k);
              }
              Matrix { rows: self.rows, cols: self.cols, data }
          }
      }

      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Matrix<T> {
          /// The matrix product, or an error if self.cols != other.rows.
          fn checked_mul(&self, other: &Matrix<T>) -> Result<Matrix<T>, MatrixError> {
              if self.cols != other.rows {
                  return Err(MatrixError::ShapeMismatch {
                      op: "multiply",
                      left: (self.rows, self.cols),
                      right: (other.rows, other.cols),
                  });
              }
              let mut result = Matrix::filled(self.rows, other.cols, T::default());
              for row in 0..self.rows {
                  for col in 0..other.cols {
                      let mut sum = T::default();
                      for k in 0..self.cols {
                          sum = sum + self[(row, k)] * other[(k, col)];
                      }
                      result[(row, col)] = sum;
                  }
              }
              Ok(result)
          }
      }

      /// `&a * &b`: the matrix product. Panics if the shapes don't fit.
      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Mul for &Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, other: Self) -> Matrix<T> {
              match self.checked_mul(other) {
                  Ok(product) => product,
                  Err(e) => panic!("{e}"),
              }
          }
      }

      impl<T: Copy + Default + Add<Output = T> + Mul<Output = T>> Mul for Matrix<T> {
          type Output = Matrix<T>;

          fn mul(self, other: Self) -> Matrix<T> {
              &self * &other
          }
      }

      impl<T: Copy + From<u8>> Matrix<T> {
          /// The n x n identity: 1 on the diagonal, 0 elsewhere.
          fn identity(n: usize) -> Self {
              let mut m = Matrix::filled(n, n, T::from(0));
              for i in 0..n {
                  m[(i, i)] = T::from(1);
              }
              m
          }
      }
