                {"sku": "BOLT-10", "name": "Hex bolt M10", "qty": 120, "priceCents": 25, "supplier": "Acme"},
                {"sku": "GEAR-2", "name": "Spur gear", "qty": 4, "priceCents": 1250}
              ]
            }
      - files:
          inventory.json: |
            {"warehouse": "Harbor", "items": [
              {"sku": "ROPE-50", "name": "Rope 50 m", "qty": 10, "priceCents": 4999, "supplier": null},
              {"sku": "HOOK-2", "name": "Cargo hook", "qty": 11, "priceCents": 1250, "supplier": "Hookworks"},
              {"sku": "TARP-4", "name": "Tarp 4x6", "qty": 3, "priceCents": 2200, "reorderLevel": 2, "supplier": "Canvas Co"}
            ]}
      - files:
          inventory.json: |
            {"warehouse": "North", "items": [
              {"sku": "NUT-10", "name": "Hex nut M10", "qty": 100, "price_cents": 8}
            ]}
        exit: 1
        allowEmpty: true
        hidden: true
      - files:
          inventory.json: |
            {"warehouse": "Depot", "items": [
              {"sku": "GEAR-2", "name": "Spur gear", "qty": 0, "priceCents": 1250, "reorderLevel": 0, "supplier": "Geary"},
              {"sku": "AXLE-1", "name": "Axle", "qty": 30, "priceCents": 899, "reorderLevel": 30, "color": "red"}
            ]}
        hidden: true
    hints:
      - "Put `#[serde(rename_all = \"camelCase\")]` under the derive on `Item`, add `reorder_level: u32` with `#[serde(default = \"default_reorder_level\")]`, and `supplier: Option<String>`."
      - "`fn default_reorder_level() -> u32 { 10 }` is the function serde calls for a missing key."
      - "After the total, loop over the sorted items again and print the ones with `item.qty <= item.reorder_level`, matching on `&item.supplier` for the last part."

  - title: Validate before you trust
    text: |
      serde guarantees the file has the right **shape**: every field present, every number a number. It can't know what the values **mean**. An empty name, a price of zero or two items with the same SKU all load perfectly, and then quietly break everything downstream (orders for the wrong item, revenue of $0).

      Check the meaning after loading. Every SKU must look like `BOLT-10`: one or more uppercase ASCII letters, a dash, one or more digits. Names can't be empty (or only spaces), prices must be above 0, and SKUs must be unique. Report **every** problem, in item order (and for one item, in that order of rules), not just the first:

      ```
      problem: item 1 (bolt10): invalid sku
      problem: item 2 (PIN-3): name is empty
      problem: item 2 (PIN-3): price must be positive
      problem: item 3 (PIN-3): duplicate sku
      ```

      Items are numbered from 1 in file order. If there are any problems, don't print the table: return an error from `run` (`inventory.json has 4 problem(s), nothing was changed`), so the tool exits with code 1. A valid file prints the same report as before.

      ### Collect, don't stop

      Stopping at the first problem is fine for a compiler error you fix in a second. For a data file someone exported from another system, it's maddening: fix one problem, run again, find the next, and so on twenty times. Collect them all:

      ```rust
      fn validate(inventory: &Inventory) -> Vec<String>
      ```

      returns every problem; an empty `Vec` means valid. Keeping validation a separate function that only *returns* problems also means you can test it, or reuse it in a web form, without any printing.

      For duplicates, remember the SKUs you've seen in a `BTreeSet<&str>`. `insert` returns `false` when the value was already there, so detection and recording are one call:

      ```rust
      if !seen.insert(item.sku.as_str()) {
          problems.push(format!("{at}: duplicate sku"));
      }
      ```

      For the SKU format, `split_once('-')` gives the two halves, and `chars().all(|c| c.is_ascii_uppercase())` checks every character of one. (The `regex` crate would do this in one line, `^[A-Z]+-[0-9]+$`. For a rule this small, plain code is just as clear and has no dependency.)
    solution: |
      use serde::Deserialize;
      use std::collections::BTreeSet;
      use std::error::Error;
      use std::fs;

      const INVENTORY: &str = "inventory.json";

      #[derive(Debug, Deserialize)]
      struct Inventory {
          warehouse: String,
          items: Vec<Item>,
      }

      #[derive(Debug, Deserialize)]
      #[serde(rename_all = "camelCase")]
      struct Item {
          sku: String,
          name: String,
          qty: u32,
          price_cents: u64,
          #[serde(default = "default_reorder_level")]
          reorder_level: u32,
          supplier: Option<String>,
      }

      fn default_reorder_level() -> u32 {
          10
      }

      fn money(cents: u64) -> String {
          format!("${}.{:02}", cents / 100, cents % 100)
      }

      /// One or more uppercase letters, a dash, one or more digits: "BOLT-10".
      fn valid_sku(sku: &str) -> bool {
          match sku.split_once('-') {
              Some((letters, digits)) => {
                  !letters.is_empty()
                      && !digits.is_empty()
                      && letters.chars().all(|c| c.is_ascii_uppercase())
                      && digits.chars().all(|c| c.is_ascii_digit())
              }
              None => false,
          }
      }

      /// Every problem in the inventory, in item order. Empty means valid.
      fn validate(inventory: &Inventory) -> Vec<String> {
          let mut problems = Vec::new();
          let mut seen = BTreeSet::new();
          for (i, item) in inventory.items.iter().enumerate() {
              let at = format!("item {} ({})", i + 1, item.sku);
              if !valid_sku(&item.sku) {
                  problems.push(format!("{at}: invalid sku"));
              }
              // insert returns false if the sku was already in the set.
              if !seen.insert(item.sku.as_str()) {
                  problems.push(format!("{at}: duplicate sku"));
              }
              if item.name.trim().is_empty() {
                  problems.push(format!("{at}: name is empty"));
              }
              if item.price_cents == 0 {
                  problems.push(format!("{at}: price must be positive"));
              }
          }
          problems
      }

      fn load(path: &str) -> Result<Inventory, Box<dyn Error>> {
          let text = fs::read_to_string(path).map_err(|e| format!("cannot read {path}: {e}"))?;
          let inventory = serde_json::from_str(&text).map_err(|e| format!("{path} is not a valid inventory: {e}"))?;
          Ok(inventory)
      }

      fn print_table(inventory: &Inventory) {
          let mut items: Vec<&Item> = inventory.items.iter().collect();
          items.sort_by(|a, b| a.sku.cmp(&b.sku));
          let noun = if items.len() == 1 { "item" } else { "items" };
          println!("{}: {} {noun}", inventory.warehouse, items.len());
          let mut total = 0;
          for item in &items {
              println!("{:<10} {:<20} {:>5} x {}", item.sku, item.name, item.qty, money(item.price_cents));
              total += item.price_cents * item.qty as u64;
          }
          println!("total value: {}", money(total));
          for item in &items {
              if item.qty <= item.reorder_level {
                  let supplier = match &item.supplier {
                      Some(name) => format!("supplier {name}"),
                      None => String::from("no supplier"),
                  };
                  println!("reorder {}: {} left (reorder level {}), {supplier}", item.sku, item.qty, item.reorder_level);
              }
          }
      }

      fn run() -> Result<(), Box<dyn Error>> {
          let inventory = load(INVENTORY)?;

          let problems = validate(&inventory);
          if !problems.is_empty() {
              for problem in &problems {
                  println!("problem: {problem}");
              }
              return Err(format!("{INVENTORY} has {} problem(s), nothing was changed", problems.len()).into());
          }

          print_table(&inventory);
          Ok(())
      }

      fn main() {
          if let Err(e) = run() {
              eprintln!("error: {e}");
              std::process::exit(1);
          }
      }
    tests:
      - files:
          inventory.json: |
            {"warehouse": "South", "items": [
              {"sku": "bolt10", "name": "Bolt", "qty": 1, "priceCents": 10},
              {"sku": "PIN-3", "name": "  ", "qty": 5, "priceCents": 0},
              {"sku": "PIN-3", "name": "Pin", "qty": 5, "priceCents": 3},
              {"sku": "CAP-", "name": "Cap", "qty": 2, "priceCents": 40}
