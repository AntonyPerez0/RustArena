              {"sku": "ROPE-50", "name": "Rope 50 m", "qty": 10, "priceCents": 4999}
            ]}
      - files:
          inventory.json: |
            {"warehouse": "Harbor", "items": [
              {"sku": "ROPE-50", "name": "Rope 50 m", "qty": 10, "priceCents": 4999}
            ]}
          changes.json: |
            [{"op": "steal", "sku": "ROPE-50", "qty": 10}]
