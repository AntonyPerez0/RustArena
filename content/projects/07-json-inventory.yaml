              {"op": "restock", "sku": "PIN-3", "qty": 2},
              {"op": "remove", "sku": "PIN-3"},
              {"op": "restock", "sku": "PIN-3", "qty": 2}
            ]
        hidden: true
      - files:
          inventory.json: |
            {"warehouse": "Depot", "items": [
              {"sku": "axle", "name": "Axle", "qty": 30, "priceCents": 899}
            ]}
          changes.json: |
            [{"op": "remove", "sku": "axle"}]
        exit: 1
        hidden: true
    hints:
      - "Derive `Deserialize` on `enum Change` with `#[serde(tag = \"op\", rename_all = \"lowercase\")]`, and load it with a `load_changes` function that returns an empty `Vec` when `!Path::new(CHANGES).exists()`."
