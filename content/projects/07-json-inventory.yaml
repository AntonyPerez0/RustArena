              "items": [
                {"sku": "NUT-10", "name": "Hex nut M10", "qty": 40, "priceCents": 8, "reorderLevel": 50, "supplier": "Acme"},
                {"sku": "BOLT-10", "name": "Hex bolt M10", "qty": 120, "priceCents": 25, "supplier": "Acme"},
                {"sku": "GEAR-2", "name": "Spur gear", "qty": 4, "priceCents": 1250}
              ]
            }
      - files:
          inventory.json: |
            {"warehouse": "Depot", "items": [
              {"sku": "AXLE-1", "name": "Axle", "qty": 30, "priceCents": 899},
              {"sku": "AX-LE-2", "name": "Axle (long)", "qty": 3, "priceCents": 1299},
              {"sku": "-7", "name": "", "qty": 9, "priceCents": 1},
              {"sku": "AXLE-1", "name": "Axle again", "qty": 1, "priceCents": 0}
            ]}
        exit: 1
        hidden: true
      - files:
          inventory.json: |
            {"warehouse": "Tiny", "items": [
              {"sku": "Z-0", "name": "Zero", "qty": 0, "priceCents": 1}
            ]}
        hidden: true
    hints:
      - "`valid_sku`: `match sku.split_once('-')` and check both halves are non-empty, `letters.chars().all(|c| c.is_ascii_uppercase())` and `digits.chars().all(|c| c.is_ascii_digit())`."
      - "In `validate`, loop with `for (i, item) in inventory.items.iter().enumerate()`, build `let at = format!(\"item {} ({})\", i + 1, item.sku);` and push one message per broken rule."
      - "In `run`, if the problems aren't empty, print each as `problem: {problem}` and `return Err(format!(...).into());`."

  - title: A batch of changes
    text: |
      Now let the tool change the inventory. Changes arrive as a second file, `changes.json`: a list of operations, each tagged with `"op"`:

      ```json
      [
        {"op": "sell", "sku": "NUT-10", "qty": 30},
        {"op": "restock", "sku": "GEAR-2", "qty": 20},
        {"op": "add", "item": {"sku": "CHAIN-8", "name": "Roller chain", "qty": 5, "priceCents": 2475}},
        {"op": "remove", "sku": "BOLT-10"}
      ]
      ```

      After validating, apply them in order, printing one line each, then print the report (which now shows the state *after* the changes):

      | Change | Prints |
      |---|---|
      | `restock` | `restocked GEAR-2: 4 -> 24` |
      | `sell` | `sold 30 of NUT-10: 40 -> 10` |
      | `add` | `added CHAIN-8 (Roller chain)` |
      | `remove` | `removed BOLT-10` |

      A change that can't be applied is skipped with its number (from 1): `change 3 skipped: no item with sku "GEAR-9"`, `change 2 skipped: cannot sell 500 of BOLT-10: only 120 in stock`, `change 5 skipped: sku "NUT-10" already exists` (for an `add`). If `changes.json` doesn't exist, there's simply nothing to apply. If it exists but isn't valid (an unknown `op`, a missing field), that's an error: exit 1 without changing anything.

      ### An internally tagged enum

      Each change is one of four shapes, chosen by `"op"`: an enum. serde supports several JSON layouts for enums; this one, with the variant name *inside* the object, is called **internally tagged**:

      ```rust
      #[derive(Debug, Deserialize)]
      #[serde(tag = "op", rename_all = "lowercase")]
      enum Change {
          Restock { sku: String, qty: u32 },
          Sell { sku: String, qty: u32 },
          Add { item: Item },
          Remove { sku: String },
      }
      ```

      `tag = "op"` says which key holds the variant name, and `rename_all = "lowercase"` maps `Restock` to `"restock"`. An unknown op like `"steal"` fails to load with a clear message, and a `Sell` without `qty` can't exist. Then a plain `match` applies each change. `Add { item: Item }` reuses your `Item` type, defaults and all.

      ### Typed errors with thiserror

      Applying a change has its own failure modes. Give them a small error type; `thiserror` writes the `Display` and `Error` impls from the `#[error]` messages:

      ```rust
      #[derive(Debug, thiserror::Error)]
      enum ChangeError {
          #[error("no item with sku \"{0}\"")]
          UnknownSku(String),
          #[error("cannot sell {wanted} of {sku}: only {available} in stock")]
          NotEnough { sku: String, wanted: u32, available: u32 },
          #[error("sku \"{0}\" already exists")]
          Duplicate(String),
      }
      ```

      `fn apply(inventory: &mut Inventory, change: Change) -> Result<String, ChangeError>` returns the line to print. A helper `find_mut` that returns `Result<&mut Item, ChangeError>` makes restock and sell two lines each: `inventory.items.iter_mut().find(|item| item.sku == sku).ok_or_else(...)`.

      To check whether the changes file exists, use `std::path::Path::new(CHANGES).exists()`. A missing optional file isn't an error; a broken one is.
    solution: |
      use serde::Deserialize;
      use std::collections::BTreeSet;
      use std::error::Error;
      use std::fs;
      use std::path::Path;

      const INVENTORY: &str = "inventory.json";
      const CHANGES: &str = "changes.json";

      #[derive(Debug, Deserialize)]
      struct Inventory {
          warehouse: String,
          items: Vec<Item>,
      }

      #[derive(Debug, Deserialize)]
      #[serde(rename_all = "camelCase")]
      struct Item {
          sku: String,
          name: String,
          qty: u32,
          price_cents: u64,
          #[serde(default = "default_reorder_level")]
          reorder_level: u32,
          supplier: Option<String>,
      }

      fn default_reorder_level() -> u32 {
          10
      }

      /// One entry of changes.json, like {"op": "sell", "sku": "NUT-10", "qty": 30}.
      #[derive(Debug, Deserialize)]
      #[serde(tag = "op", rename_all = "lowercase")]
      enum Change {
          Restock { sku: String, qty: u32 },
          Sell { sku: String, qty: u32 },
          Add { item: Item },
          Remove { sku: String },
      }

      #[derive(Debug, thiserror::Error)]
      enum ChangeError {
          #[error("no item with sku \"{0}\"")]
          UnknownSku(String),
          #[error("cannot sell {wanted} of {sku}: only {available} in stock")]
          NotEnough { sku: String, wanted: u32, available: u32 },
          #[error("sku \"{0}\" already exists")]
          Duplicate(String),
      }

      fn money(cents: u64) -> String {
          format!("${}.{:02}", cents / 100, cents % 100)
      }

      /// One or more uppercase letters, a dash, one or more digits: "BOLT-10".
      fn valid_sku(sku: &str) -> bool {
          match sku.split_once('-') {
              Some((letters, digits)) => {
                  !letters.is_empty()
                      && !digits.is_empty()
                      && letters.chars().all(|c| c.is_ascii_uppercase())
                      && digits.chars().all(|c| c.is_ascii_digit())
              }
              None => false,
          }
      }

      /// Every problem in the inventory, in item order. Empty means valid.
      fn validate(inventory: &Inventory) -> Vec<String> {
          let mut problems = Vec::new();
          let mut seen = BTreeSet::new();
          for (i, item) in inventory.items.iter().enumerate() {
              let at = format!("item {} ({})", i + 1, item.sku);
              if !valid_sku(&item.sku) {
                  problems.push(format!("{at}: invalid sku"));
              }
              // insert returns false if the sku was already in the set.
              if !seen.insert(item.sku.as_str()) {
                  problems.push(format!("{at}: duplicate sku"));
              }
              if item.name.trim().is_empty() {
                  problems.push(format!("{at}: name is empty"));
              }
              if item.price_cents == 0 {
                  problems.push(format!("{at}: price must be positive"));
              }
          }
          problems
      }

      fn find_mut<'a>(inventory: &'a mut Inventory, sku: &str) -> Result<&'a mut Item, ChangeError> {
          inventory
              .items
              .iter_mut()
              .find(|item| item.sku == sku)
              .ok_or_else(|| ChangeError::UnknownSku(sku.to_string()))
      }

      /// Applies one change and describes what happened.
      fn apply(inventory: &mut Inventory, change: Change) -> Result<String, ChangeError> {
          match change {
              Change::Restock { sku, qty } => {
                  let item = find_mut(inventory, &sku)?;
                  let before = item.qty;
                  item.qty += qty;
                  Ok(format!("restocked {sku}: {before} -> {}", item.qty))
              }
              Change::Sell { sku, qty } => {
                  let item = find_mut(inventory, &sku)?;
                  if qty > item.qty {
                      return Err(ChangeError::NotEnough { sku, wanted: qty, available: item.qty });
                  }
                  let before = item.qty;
                  item.qty -= qty;
                  Ok(format!("sold {qty} of {sku}: {before} -> {}", item.qty))
              }
              Change::Add { item } => {
                  if inventory.items.iter().any(|existing| existing.sku == item.sku) {
                      return Err(ChangeError::Duplicate(item.sku));
                  }
                  let message = format!("added {} ({})", item.sku, item.name);
                  inventory.items.push(item);
                  Ok(message)
              }
              Change::Remove { sku } => {
                  let before = inventory.items.len();
                  inventory.items.retain(|item| item.sku != sku);
                  if inventory.items.len() == before {
                      return Err(ChangeError::UnknownSku(sku));
                  }
                  Ok(format!("removed {sku}"))
              }
          }
      }

      fn load(path: &str) -> Result<Inventory, Box<dyn Error>> {
          let text = fs::read_to_string(path).map_err(|e| format!("cannot read {path}: {e}"))?;
          let inventory = serde_json::from_str(&text).map_err(|e| format!("{path} is not a valid inventory: {e}"))?;
          Ok(inventory)
      }

      fn load_changes(path: &str) -> Result<Vec<Change>, Box<dyn Error>> {
          if !Path::new(path).exists() {
              return Ok(Vec::new());
          }
          let text = fs::read_to_string(path)?;
          let changes = serde_json::from_str(&text).map_err(|e| format!("{path} is not a valid list of changes: {e}"))?;
          Ok(changes)
      }

      fn print_table(inventory: &Inventory) {
          let mut items: Vec<&Item> = inventory.items.iter().collect();
          items.sort_by(|a, b| a.sku.cmp(&b.sku));
          let noun = if items.len() == 1 { "item" } else { "items" };
          println!("{}: {} {noun}", inventory.warehouse, items.len());
          let mut total = 0;
          for item in &items {
              println!("{:<10} {:<20} {:>5} x {}", item.sku, item.name, item.qty, money(item.price_cents));
              total += item.price_cents * item.qty as u64;
          }
          println!("total value: {}", money(total));
          for item in &items {
              if item.qty <= item.reorder_level {
                  let supplier = match &item.supplier {
                      Some(name) => format!("supplier {name}"),
                      None => String::from("no supplier"),
                  };
                  println!("reorder {}: {} left (reorder level {}), {supplier}", item.sku, item.qty, item.reorder_level);
              }
          }
      }

      fn run() -> Result<(), Box<dyn Error>> {
          let mut inventory = load(INVENTORY)?;

          let problems = validate(&inventory);
          if !problems.is_empty() {
              for problem in &problems {
                  println!("problem: {problem}");
              }
              return Err(format!("{INVENTORY} has {} problem(s), nothing was changed", problems.len()).into());
          }

          let changes = load_changes(CHANGES)?;
          for (i, change) in changes.into_iter().enumerate() {
              match apply(&mut inventory, change) {
                  Ok(message) => println!("{message}"),
                  Err(e) => println!("change {} skipped: {e}", i + 1),
              }
          }

          print_table(&inventory);
          Ok(())
      }

      fn main() {
          if let Err(e) = run() {
              eprintln!("error: {e}");
              std::process::exit(1);
          }
      }
    tests:
      - files:
          inventory.json: |
            {
              "warehouse": "North",
              "items": [
                {"sku": "NUT-10", "name": "Hex nut M10", "qty": 40, "priceCents": 8, "reorderLevel": 50, "supplier": "Acme"},
                {"sku": "BOLT-10", "name": "Hex bolt M10", "qty": 120, "priceCents": 25, "supplier": "Acme"},
                {"sku": "GEAR-2", "name": "Spur gear", "qty": 4, "priceCents": 1250}
