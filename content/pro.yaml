# Pro Track: projects done on a real machine (GitHub Codespaces, Linux, macOS or Windows with WSL),
# graded by GitHub Actions. Each project's lesson is its README in
# pro-track/starter/projects/<dir>/README.md, which the site shows as-is.
projects:
  - dir: 01-toolchain
    title: rustup, Cargo and continuous integration
    hours: 3
    skills: [rustup, Cargo.toml, build profiles, cargo fmt, clippy, CI]
    summary: Install Rust the way professionals do, build a small command-line crate with Cargo, and keep it clean with rustfmt, clippy and tests that run on every push.
  - dir: 02-git
    title: Git and pull requests
    hours: 2
    skills: [branches, pull requests, merge conflicts, revert, tags]
    summary: Work the way teams do. Feature branches, pull requests, a real merge conflict in Rust code, undoing mistakes and tagging a release.
  - dir: 03-testing
    title: Testing like a team
    hours: 3
    skills: [unit tests, integration tests, doc tests, proptest, mutation testing]
    summary: Write the test suite for a money-handling library yourself. Graded by mutation testing, so every hidden bug must make one of your tests fail.
  - dir: 04-cli
    title: A command-line tool with clap
    hours: 4
    skills: [clap derive, subcommands, anyhow, files and exit codes, assert_cmd]
    summary: Build a real CLI with subcommands, flags, files, helpful errors and proper exit codes, tested end to end like a user would run it.
  - dir: 05-library
    title: Designing a library crate
    hours: 4
    skills: [workspaces, API design, thiserror, rustdoc, features, semver]
    summary: Split code into a library and a binary in a Cargo workspace, design a public API with typed errors and full documentation, and prepare it for crates.io.
  - dir: 06-concurrency
    title: Concurrency with threads, channels and rayon
    hours: 4
    skills: [std::thread, channels, Arc and Mutex, rayon, Send and Sync]
    summary: Build a parallel log indexer, first with threads and channels, then with rayon, and prove it gives the same answers as the single-threaded version, faster.
  - dir: 07-async
    title: Async networking with Tokio
    hours: 5
    skills: [tokio, TCP servers, tasks, channels, select!, graceful shutdown]
    summary: Write an async TCP server that handles many clients at once, shares state safely, and shuts down cleanly, tested with real connections.
  - dir: 08-web-api
    title: A REST API with axum
    hours: 5
    skills: [axum, routing, extractors, serde, IntoResponse errors, tower tests]
    summary: Build a JSON REST API with routing, validation, proper status codes and error responses, and test every endpoint without opening a port.
  - dir: 09-database
    title: Persistence with SQLx and SQLite
    hours: 4
    skills: [sqlx, migrations, queries, transactions, repository pattern]
    summary: Store data for real. Migrations, typed queries, transactions and a repository layer, tested against an in-memory database.
  - dir: 10-observability
    title: Logging, tracing and configuration
    hours: 3
    skills: [tracing, spans, EnvFilter, structured logs, configuration]
    summary: Make a service you can operate. Structured logs and spans with tracing, log levels from the environment, and validated configuration.
  - dir: 11-performance
    title: Benchmarks and profiling
    hours: 4
    skills: [release builds, criterion, flamegraphs, allocations, complexity]
    summary: Measure before you optimize. Benchmark a slow function with criterion, find the hot spot with a profiler, and make it fast enough to pass a time budget.
  - dir: 12-capstone
    title: "Capstone: a production-ready web service"
    hours: 10
    skills: [axum, sqlx, tracing, configuration, graceful shutdown, Docker, CI]
    summary: Put it all together in a URL shortener service with a database, structured logging, configuration, tests, a Dockerfile and a CI pipeline, the way it would ship at work.
