# The roadmap page (/roadmap): the community Rust developer roadmap (https://roadmap.sh/rust),
# section by section, with the modules and Pro Track projects that teach each topic.
# modules: lesson module ids. pro: Pro Track project ids (folder name without the number).
# links: outside resources for specializations this course doesn't cover in depth.
sections:
  - title: Introduction
    summary: What Rust is, why companies adopt it, and getting set up.
    items:
      - title: What is Rust?
        modules: [hello]
      - title: Why use Rust?
        modules: [hello, ownership]
      - title: Installing Rust and Cargo
        modules: [hello]
        pro: [toolchain]
      - title: IDEs and the Rust toolchain
        modules: [tooling]
        pro: [toolchain]
      - title: The Rust Playground
        modules: [hello]

  - title: Language basics
    summary: Syntax and semantics, the building blocks of every program.
    items:
      - title: Variables, data types and constants
        modules: [variables, types]
      - title: Control flow and constructs
        modules: [control]
      - title: Functions and method syntax
        modules: [functions, methods]
      - title: Pattern matching and destructuring
        modules: [enums, patterns]
      - title: Reading input
        modules: [input]

  - title: Constructs
    summary: Rust's tools for modeling data and behavior.
    items:
      - title: Structs
        modules: [structs]
      - title: Impl blocks
        modules: [methods]
      - title: Enums
        modules: [enums]
      - title: Traits
        modules: [traits]

  - title: Data structures
    summary: The standard library's types and collections, and when to use each.
    items:
      - title: Integers, floats, booleans and characters
        modules: [types]
      - title: Tuples and arrays
        modules: [compound]
      - title: Strings
        modules: [strings-intro, strings]
      - title: Vectors
        modules: [vectors]
      - title: HashMap and HashSet
        modules: [hashmaps]
      - title: BTreeMap and BTreeSet
        modules: [hashmaps, collections-more]
      - title: Stack, queue, binary heap and LinkedList
        modules: [collections-more]
      - title: Rc, Arc, Mutex, RwLock and channels
        modules: [smart-pointers, sync]

  - title: Ownership system
    summary: The idea that makes Rust memory-safe without a garbage collector.
    items:
      - title: Ownership rules and memory safety
        modules: [ownership]
      - title: Borrowing, references and slices
        modules: [borrowing, slices]
      - title: "Deep dive: stack vs heap"
        modules: [ownership, smart-pointers]

  - title: Error handling
    summary: No exceptions, no nulls. Errors are values the compiler makes you handle.
    items:
      - title: Option and Result
        modules: [enums, errors]
      - title: Propagating errors with the ? operator
        modules: [errors]
      - title: Custom error types and traits
        modules: [custom-errors]
      - title: Errors in applications (anyhow, thiserror)
        modules: [app-errors]
        pro: [library]

  - title: Modules and crates
    summary: Organizing code, using dependencies and publishing your own.
    items:
      - title: Code organization and namespacing
        modules: [modules]
      - title: Dependency management and Cargo.toml
        modules: [modules, tooling]
        pro: [toolchain]
      - title: Publishing on crates.io
        modules: [modules]
        pro: [library]

  - title: Traits and generics
    summary: Abstraction without runtime cost.
    items:
      - title: Trait definitions and implementations
        modules: [traits, std-traits]
      - title: Generics
        modules: [generics]
      - title: Trait bounds and associated types
        modules: [generics, advanced-traits]
      - title: Trait objects and dynamic dispatch
        modules: [trait-objects]
      - title: Advanced generics and type-level programming
        modules: [advanced-traits]

  - title: Lifetimes and the borrow checker
    summary: How Rust proves every reference is valid.
    items:
      - title: Explicit lifetime annotations
        modules: [lifetimes]
      - title: Lifetime elision rules
        modules: [lifetimes]
      - title: Covariance and contravariance
        modules: [lifetimes, advanced-traits]
        note: Introduced through PhantomData and lifetime bounds.

  - title: Functional Rust
    summary: Closures and iterators, the way idiomatic Rust is written.
    items:
      - title: Closures
        modules: [closures]
      - title: Iterators
        modules: [iterators]

  - title: Smart pointers and testing
    summary: Heap allocation, shared ownership, and proving your code works.
    items:
      - title: Box, Rc and RefCell
        modules: [smart-pointers]
      - title: Unit and integration testing
        modules: [testing]
        pro: [testing]
      - title: Mocking and property-based testing
        modules: [testing]
        pro: [testing]

  - title: Concurrency and parallelism
    summary: Fearless concurrency, from threads to async.
    items:
      - title: Threads
        modules: [threads]
        pro: [concurrency]
      - title: Channels and message passing
        modules: [sync]
        pro: [concurrency]
      - title: Atomic operations and memory barriers
        modules: [sync]
      - title: Futures and async/await
        modules: [async]
        pro: [async]

  - title: Macros and metaprogramming
    summary: Code that writes code.
    items:
      - title: Declarative macros with macro_rules!
        modules: [macros]
      - title: Procedural macros and custom derive
        modules: [macros]
      - title: Domain-specific languages
        modules: [macros]

  - title: Unsafe Rust and performance
    summary: Going below the safe abstractions, and making code fast.
    items:
      - title: Unsafe Rust and FFI
        modules: [unsafe]
      - title: Performance and profiling
        modules: [performance]
        pro: [performance]
      - title: Benchmarking with criterion
        modules: [performance]
        pro: [performance]

  - title: Debugging and documentation
    summary: The tools that make you productive.
    items:
      - title: Debugging (dbg!, rust-gdb, rust-lldb)
        modules: [tooling]
      - title: Documenting with rustdoc
        modules: [tooling, testing]
        pro: [library]
      - title: rustfmt, clippy and CI
        modules: [tooling]
        pro: [toolchain]
      - title: Logging and tracing
        modules: [tooling]
        pro: [observability]

  - title: The ecosystem at work
    summary: The libraries Rust teams reach for every day.
    items:
      - title: Serialization with serde
        modules: [serde]
      - title: CLI utilities (clap)
        modules: [cli]
        pro: [cli]
      - title: Async runtime (Tokio)
        modules: [async]
        pro: [async]
      - title: Web development (axum)
        modules: [web]
        pro: [web-api, capstone]
      - title: Networking (hyper, reqwest)
        modules: [web]
        pro: [async]
      - title: Databases and ORMs (SQLx, Diesel, rusqlite)
        pro: [database, capstone]
        links:
          - label: SQLx
            url: https://github.com/launchbadge/sqlx
          - label: Diesel
            url: https://diesel.rs/
      - title: Idiomatic patterns and code review
        modules: [patterns-idioms]

  - title: Algorithms and interviews
    summary: Classic problems, solved the Rust way.
    items:
      - title: Collections for algorithms
        modules: [collections-more]
      - title: Searching, sorting and complexity
        modules: [algorithms]
      - title: Recursion and dynamic programming
        modules: [recursion-dp]
      - title: Graphs and trees
        modules: [graphs]
      - title: Capstone
        modules: [capstone]
        pro: [capstone]

  - title: Specializations
    summary: Where Rust goes next. These are beyond this course; each has an excellent official guide.
    items:
      - title: WebAssembly (wasm-bindgen, wasm-pack)
        links:
          - label: Rust and WebAssembly book
            url: https://rustwasm.github.io/docs/book/
      - title: Embedded systems (embedded-hal)
        links:
          - label: The Embedded Rust Book
            url: https://docs.rust-embedded.org/book/
      - title: Game development (Bevy, macroquad)
        links:
          - label: Bevy
            url: https://bevyengine.org/learn/
      - title: GUI applications (Tauri, egui, iced)
        links:
          - label: Tauri
            url: https://tauri.app/
          - label: egui
            url: https://github.com/emilk/egui
      - title: Cryptography (ring, RustCrypto)
        links:
          - label: RustCrypto
            url: https://github.com/RustCrypto
