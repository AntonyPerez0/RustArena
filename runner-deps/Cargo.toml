# Crates that lesson code may use. The Rust Playground (play.rust-lang.org) has all of
# these; the content build and the local runner link against this project's build.
[package]
name = "rustarena-deps"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
itertools = "0.14"
rayon = "1"
chrono = "0.4"
