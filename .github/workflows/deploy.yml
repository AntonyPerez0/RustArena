name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site's own domain (also set under Settings > Pages > Custom domain).
  # Leave it empty to publish at https://<owner>.github.io/<repo>/ instead.
  CUSTOM_DOMAIN: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The content build compiles and runs every lesson, drill and project with the real Rust compiler.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "runner-deps -> target"

      - name: Work out the site address
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      # Results are cached by each program's exact text and the compiler version, so only new or
      # changed code is compiled again.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/rustarena
          key: content-${{ env.RUSTC_VERSION }}-${{ hashFiles('content/**', 'src/grader/assemble.js', 'scripts/build-content.mjs', 'runner-deps/Cargo.toml') }}
          restore-keys: content-${{ env.RUSTC_VERSION }}-

      - name: Compile and run every lesson, drill and project with the real Rust compiler
        run: npm run content

      - name: Type-check and build the site (plus one pre-rendered page per route, sitemap.xml)
        run: npm run build
        env:
          # Optional: a Cloudflare Web Analytics token, set under Settings > Secrets and variables > Actions > Variables.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests, including accessibility (axe, WCAG 2.2 AA) and SEO checks
        run: npm run test:e2e

      # Scores key pages like Google does for phones, and fails the PR if one drops below
      # the thresholds in lighthouserc.json. Pull requests only, so a noisy score never blocks a deploy.
      - name: Lighthouse (performance, accessibility, SEO, best practices)
        if: github.event_name == 'pull_request' && env.BASE_PATH == '/'
        run: |
          set +e
          npx --yes @lhci/cli@0.15.1 autorun
          status=$?
          node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep the Lighthouse reports
        if: always() && github.event_name == 'pull_request' && env.BASE_PATH == '/'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lhci
          if-no-files-found: ignore

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
