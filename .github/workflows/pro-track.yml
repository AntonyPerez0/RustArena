name: Verify the Pro Track

# For every Pro Track project: the untouched starter must NOT pass its grader,
# and the starter plus the reference solution MUST pass, using the same tools
# (stable Rust, rustfmt, clippy, SQLite) learners get.
on:
  push:
    branches: [main]
    paths: ["pro-track/**", ".github/workflows/pro-track.yml"]
  pull_request:
    paths: ["pro-track/**", ".github/workflows/pro-track.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            pro-track/.check-target
          key: pro-track-${{ hashFiles('pro-track/**/Cargo.lock', 'pro-track/**/Cargo.toml') }}
          restore-keys: pro-track-
      - name: Install SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
      - name: Check every project
        run: bash pro-track/check.sh
